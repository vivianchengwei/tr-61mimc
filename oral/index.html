<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oral Quest"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ff9f1c">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><link rel="manifest" href="manifest.json">
<title>Oral Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap">
<style>
:root{
  --bg:#fff8ea; --surface:#ffffff; --surface2:#fdf0d3; --ink:#22304f; --muted:#6a7590; --line:#ecdcb8;
  --accent:#ff9f1c; --accent-soft:#ffe9c2; --sun:#ffd23f; --good:#2aa66a; --good-soft:#dff5e8; --bad:#e2574c;
  --P:#2f7de1; --E1:#2aa66a; --E2:#ef6c35; --L:#8a5cd6;
  --ra-t:#d6336c; --ra-d:#1971c2; --ra-id:#2b8a3e; --ra-v:#7048e8; --ra-u:#e8590c; --ra-int:#0c8599;
  --font-head:'Baloo 2','Nunito',system-ui,sans-serif; --font-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 4px 0 rgba(34,48,79,.10), 0 10px 24px rgba(34,48,79,.08);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141a2b; --surface:#1e2740; --surface2:#27324f; --ink:#f3ecd9; --muted:#a7b0c8; --line:#35415f;
  --accent:#ffb347; --accent-soft:#4a3a1c; --sun:#ffd23f; --good:#4cc98a; --good-soft:#1c3a2c; --bad:#ff7b70;
  --P:#6aa8ff; --E1:#4cc98a; --E2:#ff9466; --L:#b294f2;
  --ra-t:#ff7aa8; --ra-d:#6ab0f5; --ra-id:#69c97c; --ra-v:#a995ff; --ra-u:#ff9a57; --ra-int:#4fc7d9;
  --shadow:0 4px 0 rgba(0,0,0,.25), 0 10px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#141a2b; --surface:#1e2740; --surface2:#27324f; --ink:#f3ecd9; --muted:#a7b0c8; --line:#35415f;
  --accent:#ffb347; --accent-soft:#4a3a1c; --sun:#ffd23f; --good:#4cc98a; --good-soft:#1c3a2c; --bad:#ff7b70;
  --P:#6aa8ff; --E1:#4cc98a; --E2:#ff9466; --L:#b294f2;
  --ra-t:#ff7aa8; --ra-d:#6ab0f5; --ra-id:#69c97c; --ra-v:#a995ff; --ra-u:#ff9a57; --ra-int:#4fc7d9;
  --shadow:0 4px 0 rgba(0,0,0,.25), 0 10px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.55 var(--font-body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{font-family:var(--font-head);line-height:1.15;margin:0}
p{margin:0}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font:800 20px var(--font-head);margin-right:auto}
.brand svg{width:38px;height:38px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:7px 13px;border-radius:999px;font-weight:800;font-size:15px;background:var(--surface);border:2px solid var(--line)}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.starpill{display:inline-flex;align-items:center;gap:4px;font-weight:900;background:var(--sun);color:#3b2c00;border-radius:999px;padding:5px 12px}
/* player */
.player{max-width:860px;margin:0 auto;padding:6px 16px 8px;display:none;align-items:center;gap:10px}
.player.on{display:flex}
.pbtn{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-size:20px;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.18);flex:none}
.pbar{flex:1;height:10px;border-radius:9px;background:var(--surface2);overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px}
.plabel{font-weight:800;font-size:14px;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pspeed,.pstop{padding:6px 10px;border-radius:999px;border:2px solid var(--line);font-weight:800;font-size:13px;background:var(--surface);flex:none}
.turn{display:none;font-weight:900;color:var(--bad);white-space:nowrap}
.turn.on{display:inline}
@keyframes pulse{50%{opacity:.35}}
/* generic */
.card{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);border:2px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:16px;font-weight:900;background:var(--accent);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.green{background:var(--good)}
.btn.small{padding:8px 14px;min-height:40px;font-size:15px;border-radius:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:14px}
.back{font-weight:800;color:var(--muted);padding:12px 0;display:inline-block}
.eyebrow{font:800 13px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin:18px 0;background:linear-gradient(135deg,var(--sun),var(--accent));color:#3b2c00;border-radius:28px;padding:18px 20px;box-shadow:var(--shadow)}
.hero svg{width:120px;height:120px}
.hero h1{font-size:clamp(26px,5vw,36px)}
.hero p{font-weight:700;margin:4px 0 12px}
.hero .btn{background:#22304f;color:#fff}
.bubble{position:relative;background:var(--surface);color:var(--ink);border-radius:18px;padding:12px 16px;border:2px solid var(--line);font-weight:700}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin:12px 0 24px}
.unit{display:block;text-align:left;border-radius:24px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);border:3px solid var(--uc);width:100%}
.unit .pic{height:150px;background-size:cover;background-position:center 25%;position:relative}
.unit .wk{position:absolute;left:10px;top:10px;background:var(--uc);color:#fff;font-weight:900;font-size:13px;border-radius:999px;padding:3px 10px}
.unit .body{padding:12px 14px 14px}
.unit h3{font-size:21px}
.dots{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.dot{font-size:13px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--surface2);color:var(--muted)}
.dot.done{background:var(--good-soft);color:var(--good)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
/* unit page */
.upic{width:100%;max-height:340px;object-fit:cover;object-position:center 25%;border-radius:22px;border:3px solid var(--uc);display:block}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:18px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);margin-top:10px}
.act .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--us);flex:none}
.act b{display:block;font-size:17px;line-height:1.3}
.act .st{margin-left:auto;font-size:18px;white-space:nowrap}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.word{background:var(--surface2);border-radius:14px;padding:8px 12px}
.word b{display:block}
/* stepper */
.steps{display:flex;gap:6px;margin:4px 0 14px;flex-wrap:wrap}
.sd{flex:1;min-width:26px;height:10px;border-radius:9px;background:var(--surface2)}
.sd.on{background:var(--accent)} .sd.past{background:var(--good)}
.tip{text-align:center}
.tip .big{font-size:54px;line-height:1}
.tip h2{font-size:clamp(24px,5vw,32px);margin:6px 0}
.tip .lead{font-weight:700;max-width:560px;margin:0 auto 14px}
.tip .box{text-align:left;background:var(--surface2);border-radius:18px;padding:14px 16px;margin:12px 0}
.tipnum{display:inline-block;background:var(--ink);color:var(--bg);font-weight:900;border-radius:999px;padding:2px 12px;font-size:13px;letter-spacing:.05em}
.checks{display:grid;gap:8px;text-align:left}
.chk{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-weight:700;width:100%;text-align:left}
.chk i{width:26px;height:26px;border-radius:8px;border:3px solid var(--line);display:grid;place-items:center;font-style:normal;flex:none;color:transparent;font-weight:900}
.chk.on{border-color:var(--good);background:var(--good-soft)} .chk.on i{background:var(--good);border-color:var(--good);color:#fff}
/* 5W1H */
.stim{width:100%;border-radius:18px;display:block;border:3px solid var(--uc);max-height:62vh;object-fit:contain;background:var(--surface2)}
.w5{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.w5 button{padding:10px 6px;border-radius:14px;font-weight:900;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.w5 button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:none}
.w5 button.seen::after{content:' ✓';color:var(--good)}
.w5 button.on.seen::after{color:var(--sun)}
.lookt{display:flex;align-items:center;gap:12px;justify-content:center;margin:10px 0}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center;font-weight:900;flex:none}
.ring span{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
/* tricky words */
.tricky{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.tw{padding:10px 12px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);text-align:left;width:100%}
.tw b{display:block;font-size:18px} .tw span{font-size:14px;color:var(--muted);font-weight:800}
.tw.heard{border-color:var(--good)}
.twrow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.twrow .tw{width:auto;flex:none;padding:7px 12px}
.twrow .tw b{font-size:16px}
.twrow .tw span{font-size:13px}
/* breathing */
.breath{cursor:pointer;width:150px;height:150px;border-radius:50%;margin:10px auto;background:radial-gradient(circle at 35% 30%,#bfe9ff,#58b9f0);display:grid;place-items:center;color:#0b3b5c;font-weight:900;transform:scale(.6);transition:transform 4s ease-in-out}
.breath.in{transform:scale(1)}
/* passage */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{padding:6px 12px;border-radius:999px;border:2px solid var(--line);font-weight:800;font-size:13.5px;background:var(--surface)}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.passage{font-size:clamp(19px,2.6vw,22px);line-height:2.5;font-weight:500;padding:14px 16px 6px}
.passage p{margin:0 0 .6em;text-indent:1.2em}
.ra-s{cursor:pointer;border-radius:6px;transition:background .2s}
.ra-s.now{background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft)}
.ra-ed-t{color:var(--ra-t);font-weight:800;text-decoration:underline 2px}.ra-ed-d{color:var(--ra-d);font-weight:800;text-decoration:underline 2px}.ra-ed-id{color:var(--ra-id);font-weight:800;text-decoration:underline 2px}
.ra-edw{position:relative;white-space:nowrap}
.ra-edw::after{content:attr(data-ed);position:absolute;right:-2px;top:-1.15em;font:800 .55em/1 var(--font-body);padding:1px 3px;border-radius:4px;color:var(--bg);pointer-events:none}
.ra-edw-t::after{background:var(--ra-t)}.ra-edw-d::after{background:var(--ra-d)}.ra-edw-id::after{background:var(--ra-id)}
.ra-th-v{color:var(--ra-v);font-weight:800;text-decoration:underline wavy 2px;text-underline-offset:4px}
.ra-th-u{color:var(--ra-u);font-weight:800;text-decoration:underline dotted 3px;text-underline-offset:4px}
.ra-sil{opacity:.35;text-decoration:line-through 2px}
.ra-p1,.ra-p2{color:var(--accent);font-weight:900;margin:0 .18em 0 .1em;letter-spacing:-1px}
.ra-p2{margin-right:.35em}
.ra-int{position:relative}
.ra-int::after{position:absolute;left:50%;transform:translateX(-50%);top:-1.05em;font:900 .95em/1 var(--font-body);color:var(--ra-int);white-space:nowrap}
.ra-rise::after{content:'↗'}.ra-fall::after{content:'↘'}.ra-risefall::after{content:'↗↘'}
.ra-soft::after{opacity:.75;font-size:.8em;top:-.95em}
.ra-int .ra-edw::after{right:auto;left:-1.6em}
.ra-off-ed .ra-ed-t,.ra-off-ed .ra-ed-d,.ra-off-ed .ra-ed-id{color:inherit;font-weight:inherit;text-decoration:none}.ra-off-ed .ra-edw::after{display:none}
.ra-off-th .ra-th-v,.ra-off-th .ra-th-u{color:inherit;font-weight:inherit;text-decoration:none}
.ra-off-sil .ra-sil{opacity:1;text-decoration:none}
.ra-off-pause .ra-p1,.ra-off-pause .ra-p2{display:none}
.ra-off-int .ra-int::after{display:none}
.key{display:grid;gap:4px;font-size:14px;background:var(--surface2);border-radius:14px;padding:10px 14px;line-height:1.9}
.purpose{background:var(--surface2);border-radius:16px;padding:12px 14px;font-size:15.5px;text-align:left}
/* rating */
.rate{display:grid;gap:10px}
.rrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;background:var(--surface2);border-radius:14px;padding:8px 12px}
.stars button{font-size:30px;filter:grayscale(1);opacity:.35;padding:0 2px}
.stars button.on{filter:none;opacity:1}
/* PEEL */
.lbl{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;color:#fff;font:800 19px var(--font-head);flex:none}
.lbl.P{background:var(--P)}.lbl.E1{background:var(--E1)}.lbl.E2{background:var(--E2)}.lbl.L{background:var(--L)}
.peel{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:16px;background:var(--surface);border:2px solid var(--line);border-left-width:7px;transition:background .2s}
.prow.P{border-left-color:var(--P)}.prow.E1{border-left-color:var(--E1)}.prow.E2{border-left-color:var(--E2)}.prow.L{border-left-color:var(--L)}
.prow.now{border-color:var(--accent)}
.as{border-radius:6px}.as.now{background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.prow .nm{font-weight:900;font-size:14px;letter-spacing:.03em}
.prow .nm small{font-weight:700;color:var(--muted)}
.prow .starter{font-style:italic;color:var(--muted);font-weight:700;font-size:15px}
.prow textarea{width:100%;min-height:54px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:8px 10px;margin-top:6px;resize:vertical}
.exam{display:flex;gap:10px;align-items:flex-start;margin:12px 0}
.exam .face{width:46px;height:46px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:26px;flex:none}
.exam .bubble{flex:1;font-size:18px}
.exam .say{margin-top:6px}
.fb{border-radius:18px;padding:14px 16px;background:var(--good-soft);border:2px solid var(--good)}
.fb h3{font-size:20px;margin-bottom:6px}
.fb ul{margin:4px 0 8px;padding-left:20px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs>div{border-radius:14px;padding:10px 12px;font-weight:700}
.vs .no{background:#fde4e1;color:#8d2a22} .vs .yes{background:var(--good-soft);color:var(--good)}
table.map{width:100%;border-collapse:separate;border-spacing:0 6px;text-align:left}
table.map td{padding:8px 10px;background:var(--surface2)} table.map td:first-child{border-radius:12px 0 0 12px} table.map td:last-child{border-radius:0 12px 12px 0}
h2.sec{font-size:24px;margin:26px 0 10px}
.flow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.flow span{flex:1;min-width:70px;text-align:center;font-weight:800;font-size:14px;background:var(--surface2);border-radius:999px;padding:5px 8px}
.flow b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;margin-right:4px}
.qnav{justify-content:space-between;margin-top:26px;padding-top:18px;border-top:2px dashed var(--line)}
.note{background:var(--accent-soft);border:2px solid var(--accent);border-radius:16px;padding:10px 14px;margin:14px 0;font-weight:700;font-size:15px}
.linkbtn{text-decoration:underline;font-weight:900}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.pstats div{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.pstats b{display:block;font:800 24px var(--font-head)} .pstats span{font-size:13px;color:var(--muted);font-weight:700}
.rec-day{background:var(--surface);border:2px solid var(--line);border-radius:16px;margin-bottom:8px;padding:4px 12px}
.rec-day>summary{cursor:pointer;padding:8px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.rec-day>summary span{color:var(--muted);font-size:14px;font-weight:700}
.rec-row{border-top:1px dashed var(--line);padding:8px 0;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:baseline;font-size:15px}
.rec-t{font-weight:900;color:var(--muted);min-width:44px}.rec-what{flex:1;min-width:200px}
.rec-ok{color:var(--good);font-weight:900}.rec-q{color:var(--muted);font-weight:800}
.rec-det{width:100%}.rec-det summary{cursor:pointer;color:var(--P);font-weight:800;font-size:14px}
.rec-ans{display:grid;gap:6px;margin:6px 0;font-size:14.5px}.rec-ans>div{display:flex;gap:8px;align-items:flex-start}
textarea.bk{width:100%;min-height:64px;margin:10px 0 6px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,monospace;padding:8px}
@media (max-width:520px){ .pstats{grid-template-columns:repeat(2,1fr)} }
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-20px;font-style:normal;font-size:24px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (max-width:520px){ .hero{grid-template-columns:1fr;text-align:center} .hero svg{margin:0 auto;width:96px;height:96px} .vs{grid-template-columns:1fr} .plabel{display:none} }
@media (prefers-reduced-motion: reduce){ .breath{transition:none} .confetti{display:none} }
</style>

<script>
const WEB=true;
const DATA={"units": [{"id": "journey", "week": 11, "title": "Beyond Classroom Walls", "short": "Learning Journeys", "emoji": "🐠", "color": "#1e9bd7", "soft": "#e3f4fc", "img": "aquarium.jpg", "alt": "Pupils and their teacher in front of a big fish tank at an aquarium", "w5": {"Who": "I can see four pupils in school uniform and a teacher. The pupils look a little younger than me.", "What": "They are standing in front of a huge fish tank. The teacher is explaining something and the children are listening.", "When": "It is probably in the daytime, during school hours, because the children are wearing their uniforms.", "Where": "They are at an aquarium. I can see many fish and corals behind them. It could be the S.E.A. Aquarium.", "Why": "They are on a learning journey, to see sea creatures up close instead of only reading about them in class.", "How": "The children look curious and excited. They are paying attention, so they must be enjoying the trip."}, "qs": [{"q": "Look at the picture. Would you like to visit the aquarium as part of your learning journey? Why or why not?", "kind": "pic", "tag": "Picture question", "start": {"P": "Yes, I would like to visit …", "E1": "This is because …  In the picture, I can see …", "E2": "This reminds me of …  /  Last year, …  /  I once experienced …  /  For example, …", "L": "I think that …"}, "ans": {"P": "Yes, I would like to visit the aquarium as part of my learning journey.", "E1": "This picture is about a group of students and their teacher on a learning journey to the aquarium. I think I would learn a lot about aquatic creatures at the aquarium, far more than if I were in a classroom. The children in the picture are able to see the creatures up close, and connect what they have learnt in their classroom to what they can observe at the aquarium. As seen in the picture, the children are able to engage in a discussion with their teacher about what they are observing. It helps them visualize and further understand what they have learnt in class. At the aquarium, students can observe many varieties of sea creatures in their habitats and learn more about them in a fun and engaging way.", "E2": "My classmates and I have been learning about sea creatures this term in school. As such, visiting the aquarium will be very beneficial. It will help deepen our understanding of ocean life and its ecosystems, and have a first-hand experience learning about them beyond the classroom. In this way, learning journeys also encourage life-long learning in us, encouraging us to learn from our surroundings everywhere we go.", "L": "I wish to experience such a holistic learning experience with my classmates in the aquarium, so that we may better understand what we learn in the classrooms out there in real life. Therefore, I too would like to visit the aquarium as part of my learning journey."}}, {"q": "Tell me about the most interesting place you have gone to as part of your learning journey.", "kind": "chat", "tag": "Your experience", "start": {"P": "I have been to …", "E1": "This is because …", "E2": "This reminds me of …  /  Last year, …  /  I once experienced …  /  For example, …", "L": "Link back: I am really glad …"}, "ans": {"P": "The most interesting place I have been to as part of my school's learning journey is the Mandai Bird Paradise.", "E1": "I had a wonderful time learning about the diversity of birds there! I saw many types of birds, from brightly coloured parrots to graceful flamingos. I even caught sight of a powerful eagle soaring in the sky. The most exciting part of that excursion was the talk show, where I was selected to be a volunteer for the show. I was given the opportunity to go up on stage and interact with a beautiful macaw. The guide directed the macaw to perch gently on my arm, and I was able to stroke its soft, delicate feathers. Being so up close to such a beautiful creature was an incredible experience!", "E2": "This hands-on experience was so beneficial as it was not just about what I had learnt in the classroom. I was able to observe and understand the birds in such close proximity, which deepened my appreciation for them. This would not have been possible in the classroom.", "L": "I am really glad I got that opportunity to go to the Mandai Bird Paradise as part of my learning journey."}}, {"q": "What other interesting place would you like to visit as part of your learning journey?", "kind": "chat", "tag": "Your opinion", "start": {"P": "I would love to …", "E1": "This is because …", "E2": "This reminds me of …  /  Last year, …  /  I once experienced …  /  For example, …", "L": "I believe that going to …"}, "ans": {"P": "I would love to visit KidZania as part of my learning journey.", "E1": "My classmates and I are learning about being responsible with money as part of our curriculum in school. It would be beneficial to apply my lessons in an exciting and engaging way. KidZania is packed with role-play activities that would allow me to explore different careers, learn about money management, and experience life beyond school.", "E2": "KidZania is like a mini city, where I can try out real jobs like being a doctor, firefighter, chef, or even a pilot! Through these activities, I will be able to get a hands-on experience of what these roles involve and learn important life skills. I think it is a great way to explore the wider world independently, and learn through problem-solving, being willing to take risks, building resilience, and gaining self-confidence.", "L": "I believe that going to KidZania as part of my learning journey would be a really valuable learning experience."}}], "reads": [{"title": "Why Learning Journeys Are Great", "kind": "talk", "mood": "Clear and cheerful, like a presenter", "purpose": "You are a student leader tasked to give a presentation to students during assembly about the benefits of Learning Journeys. Your goal is to help them understand the interesting aspects of Learning Journeys, the various places one can visit, and the benefits that await students.", "paras": ["Embarking on learning journeys with schools is an exciting and valuable experience for students. These trips allow us to learn outside the classroom and see how the lessons we learn connect to the real world. For example, visits to places like the Esplanade and ArtScience Museum give us hands-on experiences in the arts, culture, and science. At the Esplanade, we can watch performances and explore the creativity behind the arts. At the ArtScience Museum, we can engage with interactive exhibits that blend technology and science, making learning both interesting and memorable.", "Learning journeys also teach important skills like teamwork, curiosity, and independence. When we work on activities together or complete tasks on these trips, we learn to communicate and help each other. We build friendships, and work on our own self-confidence as well. Exploring new environments encourages us to be curious and to think outside of the box. The experience stays with us longer, as we are doing and seeing things ourselves, and not just reading about them in the classroom.", "Overall, learning journeys make learning fun and meaningful, helping us grow both in our knowledge of the world, and us as individuals."], "tricky": [["embarking", "em·BAR·king"], ["valuable", "VAL·yoo·buh·l"], ["Esplanade", "ES·pluh·nade"], ["performances", "per·FOR·mun·siz"], ["curiosity", "kyoor·ree·OS·i·tee"], ["independence", "in·di·PEN·dunce"], ["environments", "en·VY·run·ments"], ["individuals", "in·di·VID·yoo·uhlz"]]}, {"title": "Mary's Treasure Hunt at Kampung Glam", "kind": "story", "mood": "Lively, like a storyteller. Sound excited when they win!", "purpose": "You are a student leader volunteering at the local library. You are tasked to narrate stories to young children on different themes. This story's theme is Learning Journeys. You are to narrate this story about a student who learns more about Kampung Glam through her school's learning journey trip, and the different interesting aspects that Kampung Glam has to offer.", "paras": ["Yesterday, Mary and her classmates went to Kampung Glam as part of their school's learning journey. They were excited to explore the vibrant area. As soon as she arrived, Mary noticed the beautiful shophouses with the colourful mosaic tiles and detailed designs. Mary and her classmates marvelled at the grand Sultan Mosque, with its golden dome shining under the sun.", "Mary's teacher split the classroom into groups, and handed them a map. He announced that they would be doing a treasure hunt! Mary's team was thrilled. Following the map, they visited various shops which sold unique items like traditional clothes, perfumes, and carpets. At each shop, they had to solve a riddle to find the next clue. Mary and her classmates worked together, searching high and low. They had a ball of a time, laughing and hurrying along the lively streets.", "Finally, they solved the last clue and rushed to the meeting point. Mary's team was the first to arrive, they had won! Their prize was a special Chapteh, a traditional Malay toy with colourful feathers. Mary felt proud and happy, having learnt so much on this exciting adventure."], "tricky": [["vibrant", "VY·brunt"], ["mosaic", "moh·ZAY·ik"], ["marvelled", "MAR·vuld"], ["mosque", "mosk"], ["announced", "uh·NOWNST"], ["unique", "yoo·NEEK"], ["traditional", "truh·DISH·uh·nul"], ["perfumes", "PER·fyoomz"]]}], "words": [["learning journey", "a school trip where you learn outside the classroom"], ["hands-on", "learning by doing it yourself"], ["up close", "very near, so you can see clearly"], ["beneficial", "good and helpful for you"], ["beyond the classroom", "outside school lessons"], ["valuable", "very useful and important"]]}, {"id": "sports", "week": 16, "title": "Healthy Bodies Happy Minds", "short": "Sports & Health", "emoji": "🏃", "color": "#ef6c35", "soft": "#fdeee6", "img": "sportsday.jpg", "alt": "Primary school boys running a relay race towards the finishing line on Sports Day", "w5": {"Who": "I can see a few boys in school sports attire. They are primary school pupils, a little older than me.", "What": "They are running a relay race. They are holding batons in their hands and dashing towards the finishing line.", "When": "It is in the daytime. It is most likely their school's Sports Day.", "Where": "They are on a running track at a stadium or school field. There are HDB flats and trees in the background.", "Why": "They are racing to win for their class or house, and to stay active and healthy. A relay race also builds team spirit.", "How": "The boys are running with all their might. They look determined, and the boy in front looks thrilled to reach the line first."}, "qs": [{"q": "Look at the picture. Would you participate in a race or sports activity on your school's Sports Day? Why or why not?", "kind": "pic", "tag": "Picture question", "start": {"P": "Yes, I would like to take part in …", "E1": "This is because …  In the picture, I can see …", "E2": "This reminds me of …  /  Last year, …  /  I once experienced …  /  For example, …", "L": "I wish to …"}, "ans": {"P": "Yes, I would like to take part in a race on my school's Sports Day.", "E1": "This picture is about a group of students taking part in a relay race for their school's Sports Day. I think I would enjoy taking part in an activity on my school's Sports Day as it is a great opportunity to stay active and challenge myself. I enjoy sports and competing, and this event would allow me to push my limits in a fun way. It is also exciting to cheer for my classmates and build team spirit together.", "E2": "My classmates and I would be able to bond due to our similar interests and in support for our class team, as we compete against others. Participating in Sports Day would also help me develop qualities like discipline and teamwork, which are useful beyond just sports. Also, in my personal experience from the Sports Days that I have taken part in, it is always a fun day which is full of energy and excitement!", "L": "I wish to contribute to my team's success, just like the students in the picture. Therefore, I would also like to take part in such a race on my school's Sports Day."}}, {"q": "Why do you think engaging in sports or exercise is important?", "kind": "chat", "tag": "Your opinion", "start": {"P": "Engaging in sports and exercise …", "E1": "This is because …", "E2": "This reminds me of …  /  Last year, …  /  I once experienced …  /  For example, …", "L": "Therefore, I believe that …"}, "ans": {"P": "Engaging in sports or exercise keeps our bodies and minds fit and healthy.", "E1": "Engaging in sports or exercise is important because studies have shown that it helps reduce the risk of obesity and other health conditions like diabetes and heart disease. Staying active also boosts mental health by helping students fight depression, feel less isolated, and improve their moods. Regular exercise releases endorphins, which reduce stress and anxiety, making students feel happier and more relaxed.", "E2": "Did you know that obesity rates among children and adolescents are rising in Singapore? Indeed, the Singapore government has made great efforts to keep us fit and healthy, like introducing the ACES Day initiative back in 1993, the Great Singapore Workout and even updating it to create the Greater Singapore Workout!", "L": "Therefore, I believe that engaging in sports or exercise keeps our bodies and minds fit and healthy."}}, {"q": "What is your favourite game or physical activity?", "kind": "chat", "tag": "Your experience", "start": {"P": "I enjoy …", "E1": "This is because …", "E2": "This reminds me of …  /  Last year, …  /  I once experienced …  /  For example, …", "L": "I believe that …"}, "ans": {"P": "My favourite physical activity is rock climbing.", "E1": "My family and I usually go to the local climbing gym most weekends, and it is something we all really enjoy doing together. Not only is it a great workout that builds strength and endurance, but it also keeps you mentally sharp!", "E2": "I have to figure out the best route to the top and ensure that I stay focused so that I do not miss a step! I love the mix of physical challenge and mental strategy, and it is also really rewarding to see how far I can now climb against my father and mother, who have already mastered several tiers above me.", "L": "I believe that everyone should give rock climbing a try. They would be pleasantly surprised at how enjoyable it is!"}}], "reads": [{"title": "Exercise Keeps Us Healthy", "kind": "talk", "mood": "Clear and confident, like a presenter", "purpose": "You are a student doing a group project about exercise. You are tasked to give a presentation on the benefits of exercise and sports to your classmates. Your goal is to help them understand the problem of obesity, the importance of exercise, and keeping fit.", "paras": ["Exercise and sports are very important for staying healthy. They keep our bodies strong by improving our hearts, muscles, and bones. This helps us avoid health issues like obesity and heart disease. Being active also boosts our energy, and makes daily tasks feel easier.", "Childhood obesity has become a big problem globally. Contributing factors include poor eating habits, too much screen time, and a general lack of exercise. Many children spend hours on gadgets, or watching the television. This leads to weight gain and low energy levels.", "Exercise is also great for our mental health. When we move, our body releases chemicals that make us feel happier and reduce stress. Playing sports can improve self-confidence, as we reach goals and improve skills.", "Playing team sports also helps children learn the value of teamwork, and communication. It also is a great way to make friends and socialise. Starting healthy habits young is essential for a healthy future, as active kids are more likely to become healthy adults.", "Overall, exercise and sports are key to building strong, balanced lives. This is to keep both our bodies and minds healthy for the long run."], "tricky": [["muscles", "MUH·sulz"], ["obesity", "oh·BEE·si·tee"], ["disease", "di·ZEEZ"], ["globally", "GLOH·buh·lee"], ["contributing", "kun·TRIB·yoo·ting"], ["chemicals", "KEM·i·kulz"], ["communication", "kuh·myoo·ni·KAY·shun"], ["essential", "i·SEN·shul"]]}, {"title": "Ahmad's Big Race", "kind": "story", "mood": "Exciting! Build up the suspense, then sound thrilled when he wins", "purpose": "You are a student leader volunteering at the local library. You are tasked to narrate stories to young children on different themes. This story's theme is on Sports Day. Your goal is to narrate this story about a boy who is participating in the inter-class sprint race for his school's Sports Day, and is eager to win the race for his class.", "paras": ["Ahmad stood at the starting line, his heart pounding as he looked out at the cheering crowd. It was the annual Sports Day. Everyone had gathered around the track to watch the races. His classmates and teachers were all there, cheering his name and waving. Ahmad felt a mix of excitement and nerves, this was his big chance to win.", "He took a deep breath and shook his hands to relax. \"I can do this!\" he thought to himself and felt a surge of determination. The whistle blew, and Ahmad exploded off the starting line. His legs propelled him forward as fast as they could. The wind rushed past him as he focused on the finish line ahead. The cheering grew louder, but he blocked out everything except the goal.", "With each stride, Ahmad got closer. His muscles burned, but he pushed harder. As he crossed the finish line, he heard the crowd erupt in applause. Ahmad had won! Ahmad grinned widely, feeling proud and thrilled. All his hard work and patience had paid off, and he could not wait to celebrate with his friends and family."], "tricky": [["annual", "AN·yoo·ul"], ["excitement", "ik·SITE·ment"], ["determination", "di·ter·mi·NAY·shun"], ["whistle", "WI·sul"], ["propelled", "pruh·PELD"], ["applause", "uh·PLAWZ"], ["patience", "PAY·shunce"], ["celebrate", "SEL·uh·brate"]]}], "words": [["aerobics", "exercise with rhythm that uses your big muscles"], ["camaraderie", "trust and friendship in a team"], ["chronic", "(an illness) lasting a long time"], ["obesity", "having too much body fat"], ["simultaneous", "happening at the same time"], ["team spirit", "the feeling of working together as one team"]]}, {"id": "family", "week": 22, "title": "All in the Family", "short": "Family", "emoji": "🧺", "color": "#2aa66a", "soft": "#e5f6ec", "img": "picnic.jpg", "alt": "A father, mother and three boys having a picnic on the grass and taking a selfie", "w5": {"Who": "I can see a family of five: a father, a mother and three boys who seem to be brothers.", "What": "They are having a picnic. The father is taking a selfie of the whole family, and everyone is smiling widely.", "When": "It is in the daytime, maybe on a weekend. The weather looks pleasant, perfect for an outdoor picnic.", "Where": "They are sitting on a mat on a large grassy lawn. It could be a park or a garden.", "Why": "They are enjoying family bonding time. The photo will help them remember this happy day.", "How": "They are sitting close together and cuddling. They look joyful and relaxed, like a close-knit family."}, "qs": [{"q": "Look at the picture. Would you and your family like to have a picnic like them?", "kind": "pic", "tag": "Picture question", "start": {"P": "Yes, my family and I would love to …", "E1": "This is because …  In the picture, I can see …", "E2": "This reminds me of …  /  Last year, …  /  I once experienced …  /  For example, …", "L": "I am eager …"}, "ans": {"P": "Yes, my family and I would love to have a picnic like them.", "E1": "This picture is about a family having a picnic at what seems to be a lawn or a garden. There is the mother, father, and three boys who seem to be siblings. There is a variety of food items laid out in front of them, like bread, fruits, and even a jug of what I think is fruit juice. The father is taking a selfie picture of the family, perhaps to capture those joyous moments forever.", "E2": "My siblings and I are quite fond of doing activities with our family, such as going to the beach or even rock climbing. However, we have not gone for a picnic before. I can see that the family in the picture is a close-knit family, like my own. The father and mother are cuddling their children, while the third child is sitting comfortably in between them. The family might be having a picnic to share good food, enjoy nature, and even play some games, as a family bonding activity.", "L": "I am eager to suggest to my family members that we should go for a picnic, as family bonding helps strengthen relationships and create happy memories. The family in the picture seems happy and relaxed. Therefore, I would like to have a picnic with my family, just like them."}}, {"q": "Tell me about a family member that you like to spend time with.", "kind": "chat", "tag": "Your experience", "start": {"P": "I love spending time with …", "E1": "This is because …", "E2": "This reminds me of …  /  Last year, …  /  I once experienced …  /  For example, …", "L": "Link back: I am really thankful …"}, "ans": {"P": "One family member I love spending time with is my younger brother! We are 2 years apart in age and have been playmates for as long as we can remember.", "E1": "I love spending time with him because the time spent with him is always filled with laughter and fun. Be it playing video games, playing pretend, or just watching cartoons together, those are the best times of my day!", "E2": "One unique sibling tradition that we have is that on Christmas Eve, we pull our blankets and drape it across our two beds. The space between the two beds becomes a little \"cave\" in which we put sleeping bags, throw some pillows about and we even have some fairy lights on to light up that cozy area. Sometimes, we imagine we are explorers on Treasure Island. Other times, we pretend we are pirates at sea, in search of merchant ships. Before we go to bed, we get our father to read us the story 'The Night Before Christmas'. It feels magical and heart-warming.", "L": "I am really thankful that I have such a close-knit relationship with my younger brother."}}, {"q": "How do you spend time together as a family?", "kind": "chat", "tag": "Your experience", "start": {"P": "My mother …", "E1": "This is because …", "E2": "This reminds me of …  /  Last year, …  /  I once experienced …  /  For example, …", "L": "Link back to the question"}, "ans": {"P": "My mother always tells us that there is nothing more important than family. Hence, it is a family tradition that we have a meal together whenever possible.", "E1": "Having a meal together sounds like a very simple thing, but it is a lot more challenging than expected. With both my parents working, it can be difficult whenever one of them has to work overtime. To overcome this problem, we have set aside every Saturday night as family night. Sometimes my mother would cook up a feast at home, and other times we would head out to a nice restaurant to have our meal there.", "E2": "I remember that once we were out having dinner at a nice restaurant by the beach. The view was awesome with the sun setting on the horizon. However, my little brother was so engrossed in playing with his mobile phone and my father was also on the phone handling some work. My mother was so upset that night that she enforced a new rule for our family dinners: No Phones Allowed!", "L": "I really enjoy our family dinners together as it is the time that we can talk to one another and learn more about each other's lives."}}], "reads": [{"title": "Family Time Matters", "kind": "talk", "mood": "Warm and clear, like a presenter", "purpose": "You are a student leader involved in the preparations for the school's Family Day event. You are tasked to give a presentation on the importance of family in front of your school during assembly. Your goal is to help them understand the importance of family, family bonding, and positive family relationships.", "paras": ["Family bonding time is important for keeping families strong and happy. When families spend time together, they make special memories that everyone can remember and cherish. This time helps each person in the family feel loved and important, which helps build self-confidence too.", "One big benefit of family time is that communication between children and parents can be improved. When families engage in fun activities, it encourages open conversations. Children learn to express their feelings, and their thoughts. Parents get to understand their children better. This connection can lead to a more supportive home environment.", "Family time also helps reduce stress. Whether it is a picnic, game night, or watching movies, these moments let everyone relax and enjoy being together. Laughter and fun help everyone feel better.", "Finally, bonding time teaches teamwork. When families do things together, they learn to work as a team and solve problems together. Overall, spending time as a family makes everyone feel closer, happier, and more connected."], "tricky": [["memories", "MEM·uh·reez"], ["cherish", "CHAIR·ish"], ["confidence", "KON·fi·dunce"], ["communication", "kuh·myoo·ni·KAY·shun"], ["encourages", "en·KUH·ri·jiz"], ["conversations", "kon·ver·SAY·shunz"], ["supportive", "suh·POR·tiv"], ["laughter", "LAHF·ter"]]}, {"title": "Tom and Lola's Beach Day", "kind": "story", "mood": "Happy and gentle, like a storyteller", "purpose": "You are a student leader volunteering at the local library. You are tasked to narrate stories to young children on different themes. This story's theme is Family. You are to narrate this story about a boy named Tom and his sister Lola. They are having a fun day out at the beach with their family.", "paras": ["Tom and his sister Lola were excited. Today was the day they were going to the beach with their family! The sun was shining, and the waves were calling them. When they arrived, Tom and Lola ran straight to the water, laughing and splashing each other.", "Their parents set up a colourful umbrella and spread out a big blanket. After a while, they all sat down to enjoy a picnic of sandwiches, fruit, and cookies. Tom loved the peanut butter and jelly sandwiches and grabbed two in his hands. However, Lola wanted one too, and began to sob. Tom quickly gave one of the sandwiches to Lola, which made her happy.", "After lunch, Tom and Lola built a huge sandcastle together. They worked hard, adding towers and a moat. Their parents joined in, helping them decorate it with seashells. Everyone was laughing and having fun. Tom felt so happy to be with his family.", "Later, they played beach volleyball, and another family that was next to them joined in as well! Tom's parents snapped many pictures of the joyful time that they had. As the sun began to set, Tom looked at his family and felt grateful. They made great memories together that day. He knew that moments such as these would always make them closer. It was a perfect beach day for Tom and his family."], "tricky": [["excited", "ik·SY·tid"], ["colourful", "KUH·luh·ful"], ["umbrella", "um·BREL·uh"], ["sandwiches", "SAN·wi·jiz"], ["sandcastle", "SAND·kah·sul"], ["decorate", "DEK·uh·rate"], ["volleyball", "VOL·ee·bawl"], ["grateful", "GRATE·ful"]]}], "words": [["close-knit", "very close and caring towards one another"], ["family bonding", "spending time together to grow closer"], ["cherish", "to love and treasure something"], ["joyous", "full of happiness"], ["tradition", "something a family always does together"], ["heart-warming", "making you feel happy and loved"]]}, {"id": "hobby", "week": 32, "title": "Find Your Hobby", "short": "Hobbies", "emoji": "🏊", "color": "#8a5cd6", "soft": "#f0eafb", "img": "swimming.jpg", "alt": "Pupils in swimming caps sitting by a pool, listening to an instructor during a swimming lesson", "w5": {"Who": "The picture shows a group of students in uniform with swimming caps on, an adult, and another student in front wearing a life jacket.", "What": "The students are at a swimming lesson. They are listening to the adult, who I think is the swimming instructor. The student in front has probably been called up for a demonstration.", "When": "It should be in the day, by the looks of the bright sky. This is a school-arranged activity, which is usually conducted in the day.", "Where": "They are at a swimming complex. I can see many other people in the background, so I think it is a public pool.", "Why": "The school may have arranged these classes so that the students can learn a valuable life skill, water safety, and stay healthy.", "How": "The students are sitting neatly in rows and paying attention. It is a small class, so the instructor can guide each of them."}, "qs": [{"q": "Look at the picture. Would you pursue swimming as a hobby outside of school? Why or why not?", "kind": "pic", "tag": "Picture question", "start": {"P": "Yes, I would love to take up …", "E1": "This is because …  In the picture, I can see …", "E2": "This reminds me of …  /  Last year, …  /  I once experienced …  /  For example, …", "L": "I wish to …"}, "ans": {"P": "Yes, I would love to take up swimming as a hobby outside of school.", "E1": "This picture is about a group of students involved in swimming lessons as a co-curricular activity, possibly organised by their school. I have participated in such lessons before. I would love to take up swimming as a hobby for several reasons. First, swimming is a great way to stay physically fit. Second, I find being in the water very relaxing. It helps reduce stress and clears my mind. Third, it is nice to socialise with people outside of my school, like my instructor, and other people who love swimming.", "E2": "Swimming engages both my mind and body, as I work out my muscles, and also stay focused and alert on what I am doing, so as to avoid injuries. As this is an activity I would do outside of school, I think swimming would also be a way to clear my mind, providing a peaceful escape from my school or even home pressures. Another important aspect that I would benefit from taking up swimming as a hobby is the opportunity to learn essential life skills such as water safety. Finally, swimming can be a social activity. Joining a swim club or attending classes allows me to meet new people and form friendships in a fun, supportive environment.", "L": "Swimming combines fitness, relaxation, and socialisation, making it a perfect hobby for me."}}, {"q": "Why do you think having hobbies is important?", "kind": "chat", "tag": "Your opinion", "start": {"P": "I think that …", "E1": "This is because …", "E2": "This reminds me of …  /  Last year, …  /  I once experienced …  /  For example, …", "L": "I think that hobbies …"}, "ans": {"P": "I think that it is important to have hobbies as they develop us into holistic individuals, and enrich our lives.", "E1": "Hobbies help reduce stress by providing an outlet for relaxation and enjoyment. They also nurture our creativity, encouraging us to explore new ideas and express ourselves in unique ways.", "E2": "Many successful people have used their passions to transform their lives, creating careers out of their hobbies and inspiring others as well. Satoshi Tajiri is now well known for being the founder of Pokémon, but did you know that it was borne from his deep interest in bugs and his hobby of collecting insects? He used his vast collection of bugs as inspiration for the characters we now see in the games. In his youth, he combined this hobby with another passion of his, video games. His story is about how his hobbies allowed him to expand himself creatively and create something so unique. Tom Daley, the Olympics gold-medallist swimmer, turned his childhood passion into a successful and inspiring job. Howeve function raEd(w){ const l=w.toLowerCase(); if(l.length<4||!/ed$/.test(l)||RA.edNot.has(l)) return null;
  if(RA.edT.has(l)) return 't'; if(RA.edD.has(l)) return 'd';
  const s=l.slice(0,-2); // stem before "ed"
  if(/(t|d)$/.test(s)||/(te|de)$/.test(l.slice(0,-1))&&/[td]$/.test(s)) return 'id';
  if(/[td]e?$/.test(s)) return 'id';
  if(/(p|k|ck|f|ss|sh|ch|x|gh)$/.test(s)||/(c)$/.test(s)) return 't';
  return 'd'; }
function raTh(l){ if(!l.includes('th')||RA.thSkip.has(l)) return null; if(RA.thVoiced.has(l)) return 'v'; if(/^(th(e|is|at|ese|ose|ey|em|eir|ere|en|an|us|ough))/.test(l)&&RA.thVoiced.has(l.replace(/(s|'s)$/,''))) return 'v'; if(/ther/.test(l)&&!/^(ther)/.test(l)&&!/(ether|thermo)/.test(l.slice(0,5))) return 'v'; if(/the[sd]?$/.test(l)&&l.length>4) return 'v'; return 'u'; }
/* token -> HTML with marks */
function raWord(w,forceEd){
  const l=w.toLowerCase().replace(/[’']s$/,'').replace(/[’']/g,"'"); let marks=[]; const chars=[...w]; const cls=new Array(chars.length).fill('');
  const sil=RA.silent[l]; if(sil) sil.forEach(i=>{ if(i<chars.length) cls[i]+=' ra-sil'; });
  else { // pattern fallbacks
    if(/^kn/.test(l)) cls[0]+=' ra-sil'; if(/^wr/.test(l)) cls[0]+=' ra-sil'; if(/mb$/.test(l)) cls[chars.length-1]+=' ra-sil';
    const ig=l.search(/igh(t|ts|ten|ter|est|ly)?$/); if(ig>=0){ cls[ig+1]+=' ra-sil'; cls[ig+2]+=' ra-sil'; } }
  const th=raTh(l); if(th){ let i=l.indexOf('th'); while(i>=0){ cls[i]+=` ra-th-${th}`; cls[i+1]+=` ra-th-${th}`; i=l.indexOf('th',i+2); } }
  const ed=forceEd||raEd(l); let edTag='';
  if(ed){ const n=chars.length; cls[n-2]+=` ra-ed-${ed}`; cls[n-1]+=` ra-ed-${ed}`; edTag=ed; }
  let html=''; let cur=null, buf='';
  const flush=()=>{ if(!buf) return; html+=cur?`<span class="${cur.trim()}">${esc(buf)}</span>`:esc(buf); buf=''; };
  chars.forEach((c,i)=>{ if(cls[i]!==cur){ flush(); cur=cls[i]; } buf+=c; }); flush();
  if(edTag) html=`<span class="ra-edw ra-edw-${edTag}" data-ed="${edTag==='id'?'/ɪd/':'/'+edTag+'/'}">${html}</span>`;
  return html;
}
/* passage -> sentences -> tokens; returns HTML */
function raSentences(text){ const out=[]; let re=/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g; let m; while((m=re.exec(text))) { const s=m[0]; if(s.trim()) out.push(s); } return out; }
function raMark(text,sIdx){
  const sents=raSentences(text); let html='';
  sents.forEach((s,si)=>{
    const trimmed=s.trim(); const endP=(trimmed.match(/([.!?])["')\]]*$/)||[])[1]||'';
    const firstWord=(trimmed.replace(/^["'(]+/,'').match(/^[A-Za-z]+/)||[''])[0].toLowerCase();
    const parts=s.match(/[A-Za-z’'][A-Za-z’'\-]*|\s+|—|–|[^A-Za-z\s]/g)||[]; let body='';
    // find index of last word before end punctuation, and words before commas
    const wordIdx=[]; parts.forEach((p,i)=>{ if(/^[A-Za-z]/.test(p)) wordIdx.push(i); });
    const lastW=wordIdx[wordIdx.length-1];
    parts.forEach((p,i)=>{
      if(/^[A-Za-z]/.test(p)){
        const nxt=parts.slice(i+1).find(x=>!/^\s+$/.test(x)&&!/^["')\]]$/.test(x))||''; let fe=null; if(p.toLowerCase()==='used') fe=(nxt.toLowerCase()==='to')?'t':'d'; let w=raWord(p,fe);
        if(i===lastW&&endP){ const arr=endP==='?'?(RA.wh.has(firstWord)?'fall':'rise'):endP==='!'?'risefall':'fall'; w=`<span class="ra-int ra-${arr}">${w}</span>`; }
        else if(nxt===','||nxt===';'||nxt===':'||nxt==='—'||nxt==='–'){ w=`<span class="ra-int ra-rise ra-soft">${w}</span>`; }
        body+=w;
      } else if(p===','||p===';'||p===':'){ body+=esc(p)+'<span class="ra-p1" title="pause 1 count">/</span>'; }
      else if(p==='—'||p==='–'){ body+=' '+esc(p)+'<span class="ra-p1" title="pause 1 count">/</span>'; }
      else if(p==='.'||p==='?'||p==='!'){ const isEnd=!parts.slice(i+1).some(x=>/[.!?]/.test(x)); body+=esc(p)+(isEnd?'<span class="ra-p2" title="pause 2 counts">//</span>':''); }
      else body+=esc(p);
    });
    html+=`<span class="ra-s" data-s="${sIdx}-${si}">${body}</span>`;
  });
  return html;
}

function offlineCheck(t){ const all=PEEL.map(([k])=>(t[k]||'').trim()); const txt=all.join(' '); const words=txt.split(/\s+/).filter(Boolean).length; const praise=[],tips=[];
  if(all[0]) praise.push('You started with a clear point.'); else tips.push('Start with your Point: answer the question in one clear sentence.');
  if(/\bbecause\b|\bas\b|\bso that\b/i.test(txt)) praise.push('You gave a reason with “because”.'); else tips.push('Add a reason. Try “I think … because …”.');
  if(/\b(I once|last (year|week|month)|reminds me|for example|my (family|classmates|friends|mother|father|brother|sister))\b/i.test(txt)) praise.push('You shared your own experience.'); else tips.push('Share your own experience: “This reminds me of …” or “I once …”.');
  if(!all[3]) tips.push('Finish with a Link sentence: “Therefore, I would …”.');
  if(words<35) tips.push('Say a little more. Aim for at least 5 full sentences.');
  if(!praise.length) praise.push('Good try! Every practice makes you better.');
  return {stars:tips.length<=1?3:tips.length<=2?2:1,praise:praise.slice(0,3),tips:tips.slice(0,2)}; }
