 a birthday cake for her grandson through the same app.","A":"Her bright smile gave me hope that more senior citizens like her can learn similar skills to improve their lives, highlighting the importance of supporting lifelong learning and digital literacy for all ages.","K":"This is why I think teaching older people to use technology is not just about keeping them updated. It is about giving them tools to stay active, connected, and independent."}],"audio":{"basic":"audio/tech-7-basic.mp3","adv":"audio/tech-7-adv.mp3"}},{"n":8,"img":"img/tech-8.jpg","see":"I see a group of five primary school students gathered closely together, smiling and laughing as they look at a smartphone. The boy in the middle is holding the phone, while the others lean in to see the screen. All of them look very excited and happy. The background shows a tidy indoor setting with bookshelves and potted plants.","think":["Object: Smartphone - This suggests that the smartphone is being used to share something entertaining or interesting. It could be a video, a funny photo, or even a message. It also shows how digital devices are often used for social interaction.","Setting: A classroom - This highlights a shared space where students come together to learn and have fun together.","Action: Children sharing a phone and reacting together - This could show friendship, bonding through shared experiences, and how technology can bring people together. It may also reflect the importance of using devices responsibly in a group.","Friendship and social bonding","Responsible use of technology","Sharing joyful moments","Digital interaction among children"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the time my friend showed our group a hilarious\n animal video during recess. We all burst out laughing, and even our teacher came over to see what was so funny."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would be just as excited and curious. I would also remind my friend to keep the volume low or use earphones if we were in the library."},{"prompt":"I feel this is important because...","answer":"&: I think this is important because sharing laughter and good moments with friends can strengthen our friendships, but we should also remember to use our devices in a respectful and safe way."}],"questions":["How do you think the people in the photograph are feeling, and why do you think so?","Tell me about a time you had fun with your friends during a break.","Do you think children should be allowed to use smartphones in school? Why or why not?"],"basic":[{"S":"I think the children in the photograph are amused and happy as they crowd around their friend's smartphone.","P":"In the picture, a boy with a cheeky smile is holding a smartphone. He appears to be playing a game or watching a funny video. Behind him, four of his friends are giggling as they look at the screen too. They seem entertained by what they see and are sharing a joyful moment during a school break.","E":"This reminds me of a time during an English enrichment class when my classmate whipped out her smartphone to play Roblox. Since many of us did not have phones back then, we crowded around the small screen to watch her play a challenging jumping game. We burst into laughter when she missed a jump and her avatar landed in a funny position.","A":"That memory makes me think the students in the picture are doing something similar, like sharing a screen and chuckling happily together.","K":"Sharing moments like this brings friends closer, which explains why the group in the photo looks so delighted."},{"S":"One time, my friends and I had so much fun during our recess break playing a guessing game.","P":"We each had to act out a word or phrase without speaking, and the rest had to guess. Everyone took turns and tried to be as funny as possible.","E":"My turn was to act out \"a chicken crossing the road,\" so I flapped my arms like wings and hopped from side to side across the stage. My exaggerated movements and silly clucks made everyone laugh uncontrollably, and I could hear my classmates cheering and giggling throughout my performance.","A":"Overall, it was a memorable moment that brought a lot of energy and joy to the group.","K":"This fun moment lasted only twenty minutes, but the memory will last forever."},{"S":"I think children should be allowed to use smartphones in school, but only with rules.","P":"Smartphones can be useful for learning, looking up information, or even taking pictures of notes. However, they can also distract students if not used properly.","E":"My teacher once let us use our phones to scan a QR code that led to a quiz. It was fun and helped us learn in a different way, as the interactive format made the questions more engaging. However, I have also seen friends secretly play games during lessons, which distracted them from learning and was not the right use of technology in class.","A":"I realised then that smartphones can be helpful in school, but only if we use them responsibly.","K":"Therefore, I think it is all about balance and following the rules when it comes to using smartphones in school."}],"advanced":[{"S":"I feel that the children in the photograph are captivated and thoroughly entertained by whatever they are watching.","P":"The boy holding the phone sports a mischievous grin, suggesting he is sharing something humorous, perhaps a viral video or a game. His friends are huddled closely behind him, craning their necks to get a better view. Their expressions are full of mirth and excitement, creating a very lively and spirited atmosphere. It looks like a moment of pure, shared joy. This scene resonates with me because I have shared similar light-hearted moments with my friends. Once, during a break at an enrichment class, a classmate showed us a funny video on her phone. We were all glued to the screen, and we would roar with laughter at the funny parts. Even though the screen was small, the collective enjoyment made the experience incredibly fun.","A":"Just like my experience, the students in the photo seem to be bonding over acommon interest, enjoying a well-deserved break from their studies.","K":"Therefore, I believe they are feeling a strong sense of camaraderie and delight as they laugh together."},{"S":"I once had an amazing time with my friends during recess when we created our own game using bottle caps.","P":"We called it \"Cap Chase\" and made up our own rules. Everyone had a role to play, and we took turns being the game master.","E":"I vividly recall a time when my friends and I displayed our ingenuity by taping sheets of paper together to create a sprawling, hand-drawn board game. Since we lacked actual game pieces, we improvised by using colourful bottle caps and erasers as our avatars. The excitement was so infectious that even the usually reserved classmates, who tended to stay on the fringes during recess, were drawn in by the laughter. Seeing them let their guard down and cheer along with us was heartwarming. The game broke down social barriers and created a rare sense of inclusive camaraderie in the classroom.","A":"It reminded me that fun does not always need fancy things. It just needs creativity and teamwork.","K":"That is why I enjoy recess so much. It is a time when we can relax and be ourselves with our friends."},{"S":"Yes, I believe that children should be permitted to use smartphones in school, provided their usage is regulated and purposeful.","P":"When utilised correctly, smartphones serve as invaluable educational tools that facilitate instant research and access to digital resources. However, without clear guidelines, they can easily become a source of distraction or misuse.","E":"I recall a Science lesson where our teacher integrated a gamified learning platform like Kahoot. We used our phones to participate in a live quiz, which not only made the revision session engaging and competitive but also helped to reinforce our understanding of complex concepts effectively.","A":"Crucially, our teacher implemented a boundary where phones were prohibited during recess. This ensured that we did not become over-reliant on our screens and continued to prioritise face-to-face social interaction with our peers.","K":"Therefore, I firmly believe smartphones should be allowed in schools, as long as we strike a balance between using technology wisely and staying disciplined."}],"audio":{"basic":"audio/tech-8-basic.mp3","adv":"audio/tech-8-adv.mp3"}},{"n":9,"img":"img/tech-9.jpg","see":"I see a robot server in a restaurant with several bowls of food placed on its tray shelves. The robot has a screen that shows a cute face with eyes and a smile, designed to look friendly. In the background, there are people sitting at tables, some looking at their phones and others chatting. The setting appears to be a modern dining place with technology being used to assist with serving food.","think":["Object: Robot server - This shows that technology is being used in the service industry, possibly to help serve food more efficiently or to reduce the need for human servers. It also suggests innovation and adaptation in businesses.","Setting: A busy food court - This suggests that common places such as hawker centres and food courts are able to use such advanced technology to run their businesses.","Action: Robot delivering food to customers - This suggests how automation is becoming more common in daily life. It may also show how technology can improve customer experience, especially during busy hours or when there are fewer staff.","Technology in everyday life","Innovation and efficiency","Customer service improvement","Adapting to the future"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the time I visited a restaurant that had a robot\n server like this one. I was so surprised when it rolled up to our table and greeted us with a cheerful voice."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would probably be very excited to see a robot delivering food. I would thank the robot and maybe even take a photo of it."},{"prompt":"I feel this is important because...","answer":"I think this is important because it shows how technology can help people in new ways. It also makes dining more fun and interesting, especially for children."}],"questions":["What do you think about restaurants using robots to serve food?","Tell me about a time you saw or used technology in a surprising way.","Do you think robots will take over more jobs in the future? Why or why not?"],"basic":[{"S":"I think using robots to serve food in restaurants is quite interesting and helpful.","P":"Robots can help when there are not enough staff or when the restaurant is very busy. They also make the experience more fun for customers.","E":"I once went to a café where a robot brought our drinks. It moved smoothly and even played music while it served. I thought it was very cool. Many customers around us took photos and videos, showing how curious and excited they were. The robot also delivered the orders quickly without spilling anything, which showed that it could be both entertaining and efficient.","A":"This robot server made the whole dining experience feel special and different.","K":"That is why I think robots in restaurants can be a good idea, especially when they help make things faster and more enjoyable."},{"S":"lonce saw a robot cleaner working at a shopping centre.","P":"It was moving on its own and cleaning the floor while people walked by. I had never seen a robot like that in real life before.","E":"The robot would stop if someone walked in front of it and then continue cleaning. It even spoke to remind people to be careful. I noticed that shoppers gave it space and some even smiled or pointed it out to their friends. Seeing it work so smoothly made me realise how robots can help keep public places clean and safe.","A":"I was really surprised by how smart that robot was.","K":"The experience made me realise how much technology is growing and helping in ways we do not always notice."},{"S":"Yes, I think robots might take over more jobs in the future, especially simple or repetitive ones.","P":"Robots do not get tired and can do the same task over and over without making mistakes.","E":"Apart from robot servers, I have also seen robots used as security guards. In certain shopping malls, there would be a robot patrolling with a big camera on its head. This constant surveillance deters thieves and other people from committing crimes or causing trouble. There used to be many security uncles and aunties who did this job, but it seems that this single robot can patrol for longer periods without needing breaks.","A":"This shows how many jobs are changing or being replaced because of technology.","K":"Therefore, I believe robots will be more common in the future, but people will still be needed for things that require creativity or personal care."}],"advanced":[{"S":"I think using robots in restaurants is a creative and efficient way to improve customer service.","P":"Firstly, robots can help speed up service and reduce waiting time, which is important in busy restaurants. Secondly, robots can also make the dining experience more fun and memorable, especially for children who may find it exciting to be served by a robot. Finally, robots can work continuously without needing breaks, which helps the restaurant run smoothly even during peak hours.","E":"When I visited a Japanese restaurant, a robot brought our dishes to the table and even played cheerful music while serving. At one point, it sang a birthday song to another customer, and the whole restaurant clapped and laughed together. It created such a lively atmosphere that made the meal more than just about eating. It became an experience. I also noticed that while the robot served the food, the human staff focused on greeting customers and checking on their needs. This showed me how robots can work hand-in-hand with people.","A":"That moment taught me that robots are not just about efficiency, but also about creating joy and making customers feel special. They do not replace the warmth of human service, but they add something unique that makes the dining experience stand out.","K":"That is why I think robots in restaurants are a smart idea. They can make dining faster, more enjoyable, and memorable for customers, especially when they are used in a friendly and creative way alongside human staff."},{"P":"Virtual reality is surprising because it can make you feel like you are ina completely different place without leaving the room. It engages all your senses which includes what you see, hear, and even how you move. It is also useful for education, as it allows people to explore places they might not be able to visit in real life, such as outer space or the deep sea. When I put on the headset, I could see tall trees around me and hear birds chirping above. I even saw a butterfly land near me, and when I reached out, it flew away as if it were real. The most amazing part was when it started to rain in the virtual rainforest, and I could see the drops falling all around me. It felt so real that I almost wanted to open an umbrella! I realised that this kind of technology could make lessons about science and nature more exciting and realistic. A Anchor to the Point: That experience showed me how powerful technology can be in helping us learn and explore in new ways. It is not only entertaining but also educational, making learning more engaging and memorable.","K":"Overall, I feel that technology, when used well, can give us experiences we never imagined before, and it can make education more fun and meaningful."},{"S":"Yes, I think robots will take over more jobs in the future, especially tasks that are repetitive or require high precision.","P":"Robots can work faster and make fewer mistakes compared to humans. They are also useful in dangerous jobs, such as mining, construction, or space exploration, where safety is a big concern. At the same time, robots can handle tasks that need steady and precise movements, such as delicate surgeries. However, I also believe that robots will not replace every job, because some tasks require human creativity, empathy, and problem-solving skills, which machines cannot replicate.","E":"I once read an article about doctors using robots to assist in surgery. The robot's hands were steadier than a human's, which reduced the risk of mistakes and helped improve the success of the operation. Another example is the use of robots as retail assistants. When I visited Challenger at Bugis Junction, I saw a robot with a touchscreen interface. After I selected the item I was looking for, the robot asked me to follow it and led me directly to the section where the item was located. However, I still needed to talk to a staff member to answer some of my questions.","A":"These examples show that while robots can take over certain jobs, people are still important for guiding and managing them. Robots can make our lives easier, but they cannot completely replace human skills and emotions.","K":"So yes, I believe robots will take on more jobs in the future, but people will continue to play an important role. Robots and humans working together can make society more efficient, safe, and creative."}],"audio":{"basic":"audio/tech-9-basic.mp3","adv":"audio/tech-9-adv.mp3"}},{"n":10,"img":"img/tech-10.jpg","see":"I see a boy sitting at a desk, attending an online class on his laptop. He is wearing headphones and writing notes in a notebook while listening to the teacher on the screen. His eyebrows are furrowed and he looks frustrated. The teacher is pointing at a whiteboard with some formulas written on it. There are also some stationery items like pencils and a pencil holder on the boy's desk.","think":["Object: Laptop - This shows that technology is being used for learning. It suggests that online classes can help students study even when they are not in school.","Action: Boy taking notes while attending an online lesson - This shows discipline, focus, and responsibility in learning. It also suggests how students adapt to different ways of studying. In addition, his frown suggests that he might be feeling confused or frustrated.","The role of technology in education","Discipline and focus in learning","Adapting to change","Independent learning"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the time I attended an online tuition class. My\n teacher shared her screen and explained Maths problems step by step, which helped me understand better."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would make sure to listen carefully and write down important notes so I could revise later."},{"prompt":"I feel this is important because...","answer":"I think this is important because it shows how technology helps us continue learning in different ways, not just in the classroom."}],"questions":["What might the boy in this picture be feeling, and why do you think so?","Do you prefer online learning or face-to-face learning? Why?","What do you think are the advantages of online learning?"],"basic":[{"S":"I think the boy might be feeling stressed or annoyed during his online lesson.","P":"The boy's eyebrows are furrowed and his lips are turned down in a frown. Overall, his facial expression suggests unhappiness. He may be distracted by a noisy family member behind him, or he could be frustrated because he finds the lesson difficult, especially since it is being taught through a screen.","E":"This reminds me of when I was in lower primary during the COVID-19 pandeniic. I had online tuition lessons through Zoom, and it was difficult to hear the teacher or follow the lesson clearly. At the same time, my little brother was playing loudly behind me, which made me even more frustrated and distracted.","A":"That is why I believe the boy is feeling a similar sense of frustration with his online learning.","K":"Overall, I believe that while some students might enjoy it, others may not feel as engaged when having lessons through a computer screen."},{"S":"I prefer face-to-face learning.","P":"It is easier to ask questions in person and interact with teachers and friends.","E":"In class, I can ask questions immediately without worrying about connection issues. I can also interact with my friends and ask them questions about the lesson without interrupting the whole class. With online learning, I often feel alone, and it is harder for the teacher to notice my difficulties and help me when I need it.","A":"Online learning is more convenient, but overall, I still prefer face-to-face lessons.","K":"Being surrounded by classmates and making eye contact with the teacher makes learning feel more engaging and motivating for me."},{"S":"One advantage of online learning is flexi","P":"Students can learn at their own pace and also have access to recorded lessons for revision. Online learning also makes it easier to attend classes from home, saving travel time.","E":"My tutor once recorded a Maths lesson and shared it with us. I rewatched it before the exam and understood the topic better. I also found that I could pause the video and take notes carefully, which I could not do in a live lesson.","A":"These features made me feel more prepared and less rushed in my studies.","K":"That is why I think online learning can be very beneficial, as it gives students both convenience and flexibility when used wisely."}],"advanced":[{"S":"I think the boy in the picture is feeling frustrated and annoyed with his online learning session.","P":"Firstly, his facial expression is a clear indicator. His eyebrows are furrowed and he has a distinct frown, which are universal signs of displeasure or confusion. Secondly, he has turned his head away from the laptop screen to stare intensely at something, suggesting that he is disengaging from the lesson or silently asking for help. Finally, the context of home-based learning can be difficult. He might be struggling to understand the teacher on the screen or experiencing a technical issue, leading to his visible irritation.","E":"I remember a time during Home-Based Learning when my internet connection was lagging while the teacher was explaining a Maths concept. I tried to follow along, but the screen kept freezing. I felt incredibly irritated and helpless because I could not raise my hand to ask for clarification immediately. It is very tiring to stare at a screen when you are not understanding the content.","A":"That is why I believe the boy is feeling a similar sense of exasperation. He appears to have hit a roadblock in his lesson and is expressing his unhappiness about it.","K":"Overall, judging by his sharp gaze and unhappy expression, he seems to be having a very negative experience with his current study session."},{"P":"Online learning is convenient, but face-to-face lessons are better for interaction and teamwork. A balance allows us to enjoy the best of both.","E":"During exam revision, I enjoyed using online quizzes at home because they were quick and fun, which made studying less stressful. I could test myself immediately after learning a topic and instantly see which areas I needed to improve. However, I also found classroom discussions very helpful because my classmates shared different ideas and perspectives. Listening to their explanations sometimes made difficult concepts clearer too. Combining both online quizzes and in-class discussions gave me a more effective revision experience. This combination made my learning more complete and well-rounded.","K":"That is why I prefer a balance between online and face-to-face lessons, as they complement each other."},{"S":"One advantage of online learning is that it allows students to access a wider variety of resources.","P":"Through online platforms, students can easily find videos, articles, quizzes, and interactive tools to help them understand different topics. These resources can make learning more interesting and cater to different learning styles.","E":"For example, during an online Science lesson, my teacher shared a virtual experiment video that I could watch multiple times. This helped me understand the experiment better than just reading about it in a textbook.","A":"Having access to various resources allowed me to grasp the topic more clearly and made learning more engaging.","K":"That is why I think one major advantage of online learning is the variety of resources it provides, which can enhance understanding and make studying more enjoyable."}],"audio":{"basic":"audio/tech-10-basic.mp3","adv":"audio/tech-10-adv.mp3"}}]},{"id":"sports","name":"Sports & Health","short":"Sports & Health","zh":"运动与健康","color":"#F59E0B","sets":[{"n":1,"img":"img/sports-1.jpg","see":"I see a group of students playing basketball on the school court. They are all wearing their PE attire and look energetic and focused. One girl is dribbling the ball while her classmates are running alongside her, with some trying to block and others ready to receive a pass. The basketball hoop is clearly visible above them, and the tall palm trees and school building in the background show that this is happening during PE or recess time.","think":["Object: Basketball and hoop - These show that the students are engaged in a game that requires skill, teamwork, and strategy.","Setting: School court with palm trees and building - This suggests that the activity is part of PE or a recess game, showing the importance of staying active during school hours.","Action: Students playing basketball together - This shows teamwork, sportsmanship, and enjoyment of physical activity. It also highlights how schools encourage students to exercise and bond through sports","The importance of staying healthy and active","Teamwork and cooperation in games ° Developing resilience and discipline through sports"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of my PE lessons when my class played captain's ball.\n We cheered one another on, and even those who were less confident joined in because it was encouraging and fun."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would call out for the ball, make a quick pass to a teammate who is free, and keep moving to create space. I would also encourage my friends to keep trying even if we miss a shot."},{"prompt":"I feel this is important because...","answer":"1 feel playing sports together builds healthy habits and strong friendships. It also teaches me to handle pressure, communicate clearly, and respect others."}],"questions":["Would you like to join this basketball game on the school court? Why or why not?","Share about a time you played a sport or game with your classmates. Tell me about it.","Why is it important for students to stay active through PE or recess games?"],"basic":[{"S":"Yes, I would like to join this basketball game because it looks exciting and welcoming.","P":"Playing with classmates helps me stay fit and gives me a break from classroom work. When everyone participates, the game feels lively and supportive.","E":"During PE, I once joined a friendly basketball match even though I was not very confident. My friends passed to me and guided me on where to stand. I slowly improved and felt braver.","A":"That experience showed me that joining in helps me learn faster and enjoy the game more.","K":"So, I would join this game because it keeps me active and helps me bond with my friends."},{"S":"I remember playing a relay race during Sports Day with my class.","P":"Before the actual race, my teacher let us practise running and passing the baton. She wanted to see if our team could work well together.","E":"On the day itself, I was nervous, but my teammate shouted my name at the handoff and I sped up. We finished strongly and placed second. We congratulated other classes too.","A":"That taught me that supporting one another matters more than the medal.","K":"The event is memorable because teamwork and encouragement made the race meaningful."},{"S":"It is important because being active helps our bodies, minds, and relationships.","P":"Exercise improves stamina and keeps us healthy. It also refreshes our minds, so we can focus better in lessons. Playing together builds cooperation and respect.","E":"After PE, my classmates and I usually feel more awake and ready to learn. Our teacher allows us to play games together, which helps us communicate better and learn to cooperate with one another.","A":"These benefits show that movement supports both learning and character.","K":"In short, regular activity in school helps us keep fit, think clearer, and work well with others."}],"advanced":[{"S":"Yes, I would like to join this game because it offers a chance to challenge myself and contribute to the team.","P":"Firstly, playing puts me in real situations where I must scan the court, make quick choices, and communicate clearly. Secondly, it helps me build confidence, as I learn to recover from mistakes and try again. Lastly, joining the game strengthens friendships because we celebrate good plays and encourage one another when we miss. When I first joined a lunchtime game, my passes were too slow and I lost the ball a few times. My teammates told me to keep my eyes up and move into space. After a few rounds, I intercepted a pass and set up a score. The whole team cheered, and I felt included.","A":"That moment showed me that participation and feedback are the fastest ways to improve.","K":"Therefore, I would join this game with enthusiasm because it develops skills, resilience, and trust within the team."},{"S":"A memorable time was when my class organised a friendly basketball match against another class after school.","P":"We met twice a week to practise layups, quick passes, and simple plays. We also discussed roles so everyone had a responsibility, from defending to rebounding. The preparation made us disciplined and focused.","E":"During the match, we were down by four points at half time. Instead of panicking, we adjusted our defence and rotated faster. In the last minute, I passed to a teammate who was free at the corner and he scored. We still lost by one, but our teacher praised our teamwork and calm reaction.","A":"This experience taught me that planning, communication, and trust matter more than a single result.","K":"In summary, the match strengthened our class spirit and showed me how regular practice leads to good performance."},{"S":"Staying active through PE and recess games is essential because it supports long term health, academic focus, and social growth.","P":"Regular movement builds strong hearts and muscles and reduces stress. Active breaks sharpen concentration so lessons feel clearer and less tiring. Playing with classmates teaches fair play, self control, and how to lead and follow. These are life skills we use beyond the court.","E":"When my school scheduled short activity blocks before examinations, many students reported better mood and focus. In my group, we also noticed fewer disagreements because we had learnt to communicate during games and carried that habit into project work.","A":"These changes proved to me that physical activity is a foundation for both learning and character development.","K":"To summarise, PE and recess games are not extras. They are vital parts of school life that help us become healthier, sharper, and kinder teammates."}],"audio":{"basic":"audio/sports-1-basic.mp3","adv":"audio/sports-1-adv.mp3"}},{"n":2,"img":"img/sports-2.jpg","see":"I see a group of students sitting cross-legged on the floor in a large classroom or hall. They are closing their eyes and appear to be meditating or practising mindfulness. A teacher is standing at the front, also in a calm posture, guiding them. The students are wearing similar outfits, likely their PE attire. The classroom has chairs and tables stacked at the back, with big windows letting in natural light.","think":["Object: The calm sitting posture and closed eyes - These suggest that this is a mindfulness or breathing exercise meant to build focus and calmness.","Setting: The school hall or classroom - This has been turned into a quiet space for well-being activities, showing that mental health is part of school life.","Action: The students are following the teacher's guidance - This shows discipline, showing respect and the ability to stay calm together as a","Mindfulness and emotional well-being","Building focus and self-management","Holistic education beyond academics"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of a short breathing practice my teacher led before\n exams. After a few minutes of slow breathing, the whole class felt calmer and more settled."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would listen closely to the teacher, keep my spine straight, and count my breaths to stay focused. I would also give encouragement to classmates who found it hard to sit still."},{"prompt":"I feel this is important because...","answer":"&: I feel this is important because students face pressure from tests and activities, and mindfulness gives us a simple way to calm down, think clearly, and be kinder to ourselves and others."}],"questions":["What do you think the people are doing in the picture? Why?","Share about a time you took part in a calming activity at school that helped you feel more focused.","Why should schools encourage students to care for their mental health as well as their studies?"],"basic":[{"S":"I think the people in the picture are meditating because they look calm and peaceful.","P":"There is an older lady at the front of the classroom or hall who I think is the teacher. She is showing the students how to meditate. During meditation, we need to be quiet and focus on our breathing.","E":"I remember before a Science test, my teacher asked us to breathe in for four counts and out for four counts. That was her way of meditating. Surprisingly, I felt my heart rate slow, and I could read the questions more carefully.","A":"That experience showed me that even a brief moment of meditation can improve both my mood and performance.","K":"Thus, because of their calm and relaxed composure, I think the people in the picture are meditating."},{"S":"I once joined a short stretching and breathing segment during PE when our class felt restless.","P":"The teacher dimmed the lights and guided us through simple stretches and slow breaths. The quiet atmosphere made it easier to settle our thoughts.","E":"After ten minutes, my shoulders felt relaxed, and I stopped fidgeting. In the next period, I completed a difficult worksheet faster because I could concentrate.","A":"It taught me that calm routines can reset the body and mind.","K":"That is why I value these activities, especially on busy school days."},{"S":"Schools should promote mental health because it affects how we learn, behave, and relate to others.","P":"When students manage stress well, they sleep better and pay attention more easily. Calm classrooms are also kinder spaces where people speak respectfully and cooperate.","E":"After my class started short mindfulness breaks, group work became much smoother. Instead of arguing over ideas, we learnt to pause, listen, and work things out calmly. It helped us to produce better projects.","A":"This showed me that caring for our minds improves both results and relationships.","K":"In summary, mental health education strengthens learning and builds a positive school culture."}],"advanced":[{"S":"I think the people in the picture are taking part in a mindfulness session because they look like they are in a serene and tranquil state.","P":"An older woman at the front seems to be the teacher leading the session. She is showing meditation techniques and all the students are following along by sitting quietly with their eyes closed. The quiet breathing helps students feel calm and focused, so they can think more clearly. This activity also trains their attention and teaches them to pause before reacting. I have practiced mindfulness before. During project week, our group began each meeting with one minute of breathing. We spoke more calmly, divided tasks fairly, and finished earlier than expected. I noticed I could switch from one task to another without feeling overwhelmed.","A":"These results convinced me that mindfulness is a practical tool, not just a relaxing activity.","K":"Overall, the people in the picture are engaged in a mindfulness session that can benefit them in many ways such as strengthening character and academic performance."},{"S":"A meaningful example was a guided visualisation my English teacher led before oral practice.","P":"She asked us to close our eyes, picture a place where we felt safe, and breathe steadily. The exercise slowed my thoughts and reduced the fear of making mistakes. After that, we rehearsed with clearer voices and better eye contact.","E":"When it was my turn, I paused, took two slow breaths, and began. I spoke more fluently and could organise my ideas because my mind felt steady. My teacher commented that the calm start improved the whole class's performance.","A":"This showed me that simple mental routines can change how confidently we act.","K":"So, I believe calm practices should be part of regular lessons, not only before tests."},{"S":"Schools should champion mental health because it lays the foundation for sustained learning and healthy relationships.","P":"When students understand emotions and know techniques like breathing, journalling, or seeking help, they cope with pressure without giving up. Such skills reduce conflicts, improve attendance, and create classrooms where everyone feels safe to participate. These are long-term habits that remain useful in secondary school and adulthood.","E":"My school introduced short well-being check-ins at the start of form class. Over the term, fewer classmates skipped homework due to stress, and more volunteered answers in lessons. Teachers said the atmosphere felt warmer and more respectful.","A":"This proves that nurturing the mind supports grades, confidence, and community.","K":"To conclude, balancing studies with mental well-being helps us become focused learners and considerate friends, which is the true goal of education."}],"audio":{"basic":"audio/sports-2-basic.mp3","adv":"audio/sports-2-adv.mp3"}},{"n":3,"img":"img/sports-3.jpg","see":"I see a family of five cycling together along a park connector. The two children are riding smaller bicycles with helmets, while the adults ride behind them and guide the way. The path is surrounded by trees and greenery, with tall buildings faintly visible in the distance. Everyone looks relaxed and happy, enjoying the ride together.","think":["Setting: The peaceful park with trees and plants - This suggests this is a family outing in a natural space, away from busy roads and traffic.","Action: The family is cycling together - This shows unity, shared experiences, and healthy habits.","Family bonding through shared outdoor activities","The importance of exercise and healthy lifestyles","Enjoying and protecting nature in urban spaces"],"connect":[{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would try to keep up with the group while enjoying the scenery. I would also make sure to wear my helmet properly to stay safe."},{"prompt":"I feel this is important because...","answer":"I feel this is important because cycling is not only fun but also good for our health. It helps families spend quality time together and appreciate the outdoors."}],"questions":["Would you enjoy going on a cycling trip like the family in the picture? Why or why not?","Can you share about a time you took part in an outdoor activity with your family or friends?","Why do you think it is important for families to spend time outdoors together?"],"basic":[{"S":"Yes, I would enjoy going on a cycling trip like the family in the picture because it looks fun and refreshing.","P":"Cycling allows us to exercise while spending time together in nature. Riding in a group also makes the experience less physically and mentally draining, since everyone can motivate each other.","E":"Once, my cousins and I cycled at Pasir Ris Park. We raced each other on the straight paths and stopped for ice cream afterwards. I remember laughing a lot and feeling very happy.","A":"That experience showed me how enjoyable cycling can be if I do it with the people I care about.","K":"So yes, I would enjoy a trip like this because it combines exercise, nature, and family bonding."},{"S":"Yes, I have joined several outdoor activities with my family and friends.","P":"One of the most memorable ones was a hiking trip at a nature park. We had to climb a steep hill, and it required resilience and encouragement from others to reach the top.","E":"The trail was long and steep, and the hot weather made the climb extra difficult. My father carried extra water bottles for everyone, while my mother reminded us to slow down and take short breaks along the way. When we finally reached the top, we took photos, enjoyed the fresh air, and admired the scenery together. The outing taught me that outdoor activities, even if challenging, can be enjoyable when we do it together as a family.","K":"That's why I always look forward to outdoor trips with my loved ones."},{"S":"It is important because outdoor time helps families connect while improving their health.","P":"Activities like cycling, jogging, or hiking encourage physical fitness and reduce stress. Families also get to talk, share stories, and enjoy nature without distractions from screens.","E":"For example, during a picnic outing, my family left our phones in our bags and focused on playing frisbee and eating together. Running around and playing helped us stay active, while sitting down to eat and chat made us feel relaxed. We laughed a lot and felt closer to one another afterwards.","A":"That outing showed me how valuable it is to spend uninterrupted time together.","K":"So, outdoor time is important because it strengthens both the body and relationships."}],"advanced":[{"S":"Yes, I would definitely enjoy it because cycling brings together fun, exercise, and family bonding.","P":"Firstly, it gives a chance to explore nature while staying active. Secondly, it allows families to share conversations and laughter in a relaxed setting. Lastly, cycling can build discipline because it requires stamina, safety awareness, and responsibility.","E":"Once, my family and I cycled along the Marina Bay loop. At first, I was tired, but my parents encouraged me, and we cheered one another on. By the end, I felt accomplished and proud. The view of the skyline at sunset made the effort worthwhile.","A":"That trip made me realise how outdoor activities can strengthen resilience and family ties at the same time.","K":"So I would enjoy a cycling trip like the one in the picture because it combines fitness, family, and joy in a meaningful way."},{"S":"Yes, one memorable outdoor activity was kayaking with my cousins during the school holidays.","P":"It was challenging at first because we had to coordinate our paddling. However, once we worked as a team, the kayak moved smoothly, and we could enjoy the scenery. We also saw herons and fish along the way.","E":"At one point, our kayak rocked dangerously from side to side. Although we were startled, we laughed it off, shouted words of encouragement, and paddled together until the kayak steadied again.","A":"That day showed me how outdoor experiences can teach teamwork and staying calm under pressure.","K":"So, outdoor activities are meaningful because they bring fun while teaching valuable life lessons."},{"S":"Families should spend time outdoors together because it improves physical health, strengthens relationships, and builds shared memories.","P":"When families cycle, hike, or play sports, they get to exercise while enjoying one another's company. Such activities also create opportunities for conversations and teamwork that strengthen family ties. Beyond health, they provide a refreshing break from screens and daily stress.","E":"During a camping trip, my family set up tents, cooked meals over a fire, and told stories under the stars. Working together made the trip successful, and even small challenges like keeping the fire going brought us closer. That experience reminded me that outdoor activities are not just fun but essential for building trust and appreciation among family members.","K":"In conclusion, outdoor time helps families grow closer, healthier, and happier together."}],"audio":{"basic":"audio/sports-3-basic.mp3","adv":"audio/sports-3-adv.mp3"}},{"n":4,"img":"img/sports-4.jpg","see":"! see a girl standing in a kitchen preparing her lunchbox. She is wearing her school uniform, which suggests she is getting ready for school. The girl is placing cherry tomatoes into her lunchbox, which also contains bread and other snacks. On the counter, there is a container of strawberries, a bottle of water, and an apple. The kitchen looks bright and clean, with sunlight streaming through the window.","think":["Object: Lunchbox - This shows that she is bringing food from home instead of buying it outside, which may be healthier and more economical.","Setting: Kitchen - This suggests that she is preparing for school in the morning, which suggests responsibility and independence.","Action: Packing her own food - This shows values like self-reliance, discipline, and the importance of eating nutritious meals.","Healthy eating and balanced diet","Independence and responsibility in daily routines","Preparing for school with good habits"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of when my mother used to help me pack my lunchbox in the morning. Sometimes, she let me choose my own snacks, like fruits or biscuits, which made me feel more involved."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would try to prepare a balanced meal with fruits, vegetables, and some protein so I can stay energetic during school."},{"prompt":"I feel this is important because...","answer":"I feel this is important because preparing your own lunch teaches responsibility and ensures that you eat healthier food instead of relying on fast food or snacks."}],"questions":["Would you like to prepare your own lunchbox like the girl in the picture? Why or why not?","Can you share about a time when you prepared food by yourself or helped someone in the kitchen?","Why do you think it is important for students to eat a healthy and balanced diet?"],"basic":[{"S":"Yes, I would like to prepare my own lunchbox like the girl in the picture.","P":"Preparing my own food allows me to choose what I like while making sure it is healthy. It also gives me a sense of independence and responsibility.","E":"For example, once I packed sandwiches, fruits, and a small packet of nuts for a school outing. I felt proud because I made the effort myself, and I enjoyed my meal more.","A":"That experience showed me that preparing my own food is not only rewarding, but a simple step to take care of myself.","K":"So yes, I would definitely want to prepare my own lunchbox because it helps me stay healthy and independent."},{"S":"Yes, I have prepared food and helped in the kitchen before.","P":"Helping in the kitchen can be fun and also teaches useful skills like cutting fruits safely or cooking simple meals.","E":"For example, I once helped my father cook fried rice by cracking the eggs and cutting vegetables. Although there were a few eggshells in the rice and the vegetables were unevenly cut, he still praised me, which encouraged me to try again in the future.","A":"That experience made me realise even a small act like cooking can bring a great sense of accomplishment.","K":"That's why I love helping in the kitchen as it makes me feel useful and included."},{"S":"It is important for students to eat a healthy and balanced diet because it keeps us strong and focused.","P":"A nutritious diet provides energy for school activities and helps us stay alert during lessons. Eating healthily also prevents illnesses and helps us grow properly.","E":"For instance, I once skipped breakfast before school, and I felt tired and could not concentrate well in class. I only felt better after eating during recess. After that, I realised how important it is to eat properly.","A":"That incident showed me that food directly affects my performance in school.","K":"So eating healthily is important for every student to learn, play, and grow well."}],"advanced":[{"S":"Yes, I would enjoy preparing my own lunchbox because it teaches independence and allows me to make healthier choices.","P":"Firstly, it gives me control over what I eat, so I can include more fruits and vegetables instead of unhealthy snacks. Secondly, it helps me develop life skills like meal planning and time management. Lastly, preparing my own food gives me a sense of pride because I am taking care of myself.","E":"Once, I prepared sandwiches with cheese, cucumber, and lettuce for my recess break. I also added grapes and a bottle of water. It kept me full and gave me enough energy to concentrate during lessons. My friends even said my lunch looked delicious, which made me proud.","A":"That experience showed me that preparing my own lunchbox can be both fun and beneficial.","K":"So yes, I would definitely enjoy preparing my own lunchbox as it makes me healthier, more responsible, and more confident."},{"S":"Yes, I have prepared food by myself before.","P":"I wanted to try cooking for myself after watching my mother in the kitchen and some Youtube videos. It was exciting to experiment with different ingredients and see what I could make on my own. Preparing food by myself also allows me to learn how to plan what I need and follow steps carefully.","E":"For example, one weekend, I made a breakfast platter by myself. After my parents helped me turn on the stove, I made pancakes, a fried egg and bacon. I also cut up some fruits to arrange on the plate. The platter turned out to be delicious!","A":"That experience showed me that I am fully capable of preparing food by myself if I put my mind to it.","K":"Seeing how it was a success, that will definitely not be the last time I prepare food for myself."},{"S":"It is very important for students to eat a healthy and balanced diet because it affects our energy, focus, and growth.","P":"A balanced diet provides the right nutrients that our bodies and brains need to function well. Without proper food, students may feel weak, get distracted easily, or fall sick more often. Eating well also helps us perform better in sports and other physical activities.","E":"I remember once when I ate too many sweets during recess, I felt energetic at first but then very tired later. After that, I learnt that sugary snacks do not provide lasting energy. When I switched to eating fruits or sandwiches, I could focus better in class and felt healthier overall.","A":"That experience reminded me that what we eat directly influences how we feel and how we perform in school.","K":"So students must eat healthily because it helps us stay alert, active, and ready to learn."}],"audio":{"basic":"audio/sports-4-basic.mp3","adv":"audio/sports-4-adv.mp3"}},{"n":5,"img":"img/sports-5.jpg","see":"I see a young boy sitting on the floor in a dimly lit living room late at night. He is hugging a teddy bear tightly while staring at the television. The clock in the background shows 3:17 a.m., which means it is very late. On the floor near him, there are snack wrappers and a tablet. The boy looks tired but still continues to watch the screen.","think":["Object: Clock and tablet - These suggest that the boy has stayed up very late, possibly watching TV or using devices past his bedtime.","Setting: Living Room - This shows that he is not in bed when he should be sleeping, which may affect his rest.","Action: Boy hugging his teddy bear while watching TV - This shows that he may be seeking comfort or entertainment even though it is very late.","Importance of healthy routines and sleep habits","Effects of screen time on children","Balancing entertainment with rest and health"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the times I stayed up late during the school holidays to watch movies or play games. It was exciting at first, but I always felt tired the next day."},{"prompt":"If I were in this picture, I would...","answer":"&. If I were in this picture, I would turn off the TV and go to sleep because resting is more important than staying up late."},{"prompt":"I feel this is important because...","answer":"I feel this is important because sleeping early keeps me healthy, helps me focus in school, and gives me more energy for the day."}],"questions":["Do you think it is healthy to stay up late at night to watch TV like the boy in the picture? Why or why not?","Can you share about a time when you stayed up late and how you felt the next day?","Why is it important for children to have enough rest and sleep every day?"],"basic":[{"S":"No, I don't think it is healthy to stay up late at night to watch TV like the boy in the picture.","P":"Sleeping late will make us feel tired and weak the next day, which will affect our studies and activities. Staying up late also makes it harder to wake up early for school or other plans you may have.","E":"For example, I once stayed up late during the weekend to watch a movie. The next day, I felt so sleepy that I couldn't enjoy my outing with my family. It made me realise how important sleep is.","A":"That experience taught me that watching TV late at night is not worth losing good rest.","K":"So, I believe it is healthier to sleep early instead of staying up late to watch TV."},{"S":"Yes, I have stayed up late before and it made me feel very tired.","P":"When I don't get enough sleep, I cannot concentrate well, and I also become more easily irritated. It makes the whole day feel harder.","E":"For instance, I once stayed up late to finish a storybook because I wanted to know the ending. The next day in class, I kept yawning and could not pay attention to my teacher. I regretted it and promised myself to sleep earlier.","A":"That experience showed me how much lack of sleep affects my energy and mood.","K":"So, I learnt that it is better to sleep early, even if I want to do something fun."},{"S":"It is very important for children to have enough rest and sleep every day because it keeps them healthy.","P":"Sleep helps our body grow, our brain focus, and our well-being improve. Without enough sleep, we may get sick more easily and struggle to do well in school.","E":"I remember once I did not get enough sleep the night before my test. I found it very hard to think clearly and made careless mistakes. Usually, when I get enough sleep, I can think faster and do better.","A":"That made me realise that rest helps my brain work properly, and without it, even simple tasks become difficult.","K":"So children must sleep enough to stay healthy and do their best every day."}],"advanced":[{"S":"No, I don't think it's healthy to stay up late because it is harmful for our health and affects our daily routine.","P":"Firstly, staying up too late reduces the number of hours we can sleep, which makes me tired and less alert the next day. Secondly, watching too much TV at night strains the eyes and disturbs our body clock. Lastly, waking up tired means we will not be able to focus in school or enjoy our activities properly.","E":"For example, I once stayed up very late watching a TV marathon during the holidays. At first, it was fun, but the next morning I woke up late, skipped breakfast, and felt groggy the whole day. It spoiled my plans because I had no energy to play with my friends.","A":"That incident made me realise that staying up late may feel enjoyable at the moment, but it causes bigger problems the next day.","K":"Therefore, I believe getting proper rest is much more important than staying up late for a TV show."},{"S":"Yes, I have stayed up late before, and the next day I did not feel good at all.","P":"When I lose sleep, I feel grumpy and less motivated. My body feels weaker, and I cannot think as clearly as usual. This shows how much rest affects both my mood and performance.","E":"Once, I stayed up late at a family gathering because we were chatting and playing games. The next day, I felt extremely tired in school. I even forgot to bring my homework because I was rushing in the morning. That made me embarrassed in front of my teacher.","A":"That experience taught me that losing sleep is not worth the trouble it brings.","K":"So I now try my best to sleep early, even if there are fun things happening."},{"S":"It is very important for children to get enough rest and sleep because it helps us stay strong, healthy, and focused.","P":"Firstly, sleep allows our bodies to recover and grow, which is important for children. Secondly, enough sleep helps our memory and concentration, which makes us do better in school. Lastly, a regular sleeping habit prevents health problems like stress, eye strain, and even sickness.","E":"For instance, during exam week, I made sure to sleep at least eight hours each night. Because of that, I felt refreshed every morning and could concentrate fully during my revision. On the day of the exam, I felt calm and ready. Without good sleep, I might have been stressed and careless.","A":"This showed me that sleep is like fuel for both the mind and body. Without it, we cannot perform well in any area of life.","K":"So, I believe having enough rest is one of the most important habits for children, as it helps us to be healthier, happier, and more successful."}],"audio":{"basic":"audio/sports-5-basic.mp3","adv":"audio/sports-5-adv.mp3"}},{"n":6,"img":"img/sports-6.jpg","see":"I see a group of students taking part in a relay race on a running track. Two girls in front are passing a baton to each other, showing teamwork and coordination. Behind them, other students are also running and competing in the race. The students are all wearing sports attire, which suggests this is a school sports day event. In the background, there are spectators watching and cheering them on from the stands.","think":["Object: Baton - These show that this is a relay race, which requires teamwork, trust, and cooperation.","Setting: The running track and the large number of spectators — This suggests a school sports day or inter-class competition.","Action: Students are running enthusiastically and passing the baton - This reflects determination, effort, and school spirit.","Teamwork and cooperation","Sportsmanship and fair play","Celebrating achievements together"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the time I took part in my school's sports day. I joined the relay race, and even though I was nervous, my team encouraged me, and we tried our best together."},{"prompt":"If I were in this picture, I would...","answer":"if I were in this picture, I would run as fast as I could and pass the baton carefully to help my team do well."},{"prompt":"I feel this is important because...","answer":"I feel this is important because teamwork in sports teaches us trust and responsibility, and it makes the experience enjoyable whether we win or lose."}],"questions":["Would you enjoy taking part in a relay race like the one in the picture? Why or why not?","Can you share about a time when you joined a school sports event or activity?","Why do you think sports and games are important for students in school?"],"basic":[{"S":"Yes, I would enjoy taking part in a relay race like the one in the picture.","P":"Relay races are exciting because they are about both running fast and working as a team. It feels good to know that everyone is depending on each other to do their part.","E":"For example, during my school's sports day, I joined a relay race with three of my classmates. I was nervous before the race, but when I received the baton, I focused on running my best. Even though we did not win, we were proud of how well we worked together.","A":"That experience showed me that the fun of a relay race is not just about winning but about supporting one another.","K":"So yes, I would definitely enjoy being part of a relay race, because it combines teamwork, excitement, and school spirit."},{"S":"Yes, I remember when I took part in my school's annual sports day.","P":"I joined the long jump event and felt both nervous and excited. It was my first time competing, but I wanted to challenge myself and see how high I could go.","E":"When it was my turn, my friends and teacher cheered for me. I didn't break any records, but I was proud of myself for trying my best. Afterward, we all celebrated with snacks and took photos together.","A":"That memory reminded me that trying my best is more important than winning or breaking any records.","K":"So, if there are more opportunities for me to join a school event, I would definitely do so and encourage my friends to join as well."},{"S":"I think sports and games are very important for students in school because they are beneficial and enjoyable.","P":"They keep us healthy and active, and they also teach us discipline and teamwork. Sports also give us a chance to take a break from studying and bond with our friends.","E":"For instance, during recess, I often play captain's ball with my classmates. We laugh, cheer, and encourage one another. It helps us feel closer as a class, and after playing, I feel more refreshed for the lessons that follow.","A":"Sports have taught me that exercising together builds both friendship and resilience.","K":"So, I believe sports should always be part of school life because they are good for our body, mind and friendships."}],"advanced":[{"S":"Yes, I would enjoy taking part in a relay race like the one in the picture because it is both exciting and meaningful.","P":"Firstly, I enjoy the thrill of running and giving my best effort. Secondly, I like how relay races depend on teamwork. Every runner's effort counts, so it makes me feel responsible and motivated to do well. Lastly, participating in such events builds school spirit, as friends and teachers cheer us on from the sidelines. For example, when I was in Primary 5, I joined the inter-class relay race. I was the last runner, so I felt a lot of pressure to finish strong. My teammates encouraged me, and when I ran the last stretch, everyone was shouting and cheering. Although we came in second, I felt so proud of our teamwork and determination. That experience showed me that the joy of a relay race is not just about speed, but about trust, encouragement, and giving your best for your team.","K":"So yes, I would love to take part in a relay race because it brings out my best effort and makes me feel united with my team."},{"S":"Yes, I once joined my school's annual sports day, and it is still one of my favourite memories.","P":"I took part in the 200-metre sprint, and I was both nervous and excited. The race required me to focus on speed, balance, and stamina, but what I remember most is the support from my classmates.","E":"When the race started, my heart was pounding, but I pushed myself as hard as I could. My friends clapped and shouted my name, which gave me extra energy to finish strong. Even though I came in third, my teacher congratulated me for my effort, and my classmates said they were proud of me. It was a moment I will never forget.","A":"That taught me that participating in sports events is not about always winning, but about personal growth and enjoying the experience with others.","K":"So, I believe everyone should try joining a school sports event at least once because it builds confidence, creates memories, and strengthens friendships."},{"S":"I strongly believe sports and games are essential for students in school because they provide physical, emotional, and social benefits.","P":"Firstly, they keep students fit and healthy, which is important for our growth. Secondly, sports teach important values such as teamwork, perseverance, and fair play. Finally, sports create opportunities for bonding and school spirit, as students cheer for one another and celebrate achievements together.","E":"For example, during inter-class games, I played netball with my team. At first, I was worried about making mistakes because I found the roles to be confusing, but my teammates encouraged me to try. As the game went on, I became more confident, and when I finally scored, everyone cheered. That gave me a sense of belonging and pride.","A":"This made me realise that sports can help to build character and friendships.","K":"So, I think sports should always be part of school life, because they shape us into healthier, stronger, and more cooperative students."}],"audio":{"basic":"audio/sports-6-basic.mp3","adv":"audio/sports-6-adv.mp3"}},{"n":7,"img":"img/sports-7.jpg","see":"! see a young boy sitting on floor cushions beside a window. He is writing in a notebook while another open book lies in front of him. The room looks calm and tidy, with soft light coming through the window and a blanket on a nearby chair. His posture shows that he is concentrating on his work.","think":["Object: Notebook and storybook - These items suggest reading and writing practice. They also point to self-directed learning, where the child chooses to read and jot down ideas independently.","Setting: Quiet corner by a window with cushions - This cosy space suggests a deliberate reading nook. The soft light and comfortable seating make it suitable for reflection and focus, which supports good study habits.","Action: Boy reading and writing quietly - This shows concentration, discipline, and enjoyment of learning. It also suggests creativity, since he might be recording thoughts, stories, or reflections.","Love for reading and writing","Focus and self-discipline","Creativity and personal reflection"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the times I sit by my bedroom window to read after\n school. I like the natural light and the quiet, and I often write down new words I learn."},{"prompt":"If I were in this picture, I would...","answer":":. if I were in this picture, I would read a chapter, then note my favourite part and a question I have. I would also sketch a small picture to remember the scene better."},{"prompt":"I feel this is important because...","answer":"/ think it is important because quiet reading and writing help me slow down, think clearly, and grow more confident with language."}],"questions":["Would you enjoy spending time reading or writing quietly like the boy in the picture? Why or why not?","Can you share a time when you enjoyed reading a book or writing something on your own?","Why do you think it is important for children to develop the habit of reading and writing regularly?"],"basic":[{"S":"Yes, I would enjoy spending time like the boy in the picture.","P":"Quiet reading and writing help me relax after a busy school day and allow me to focus without distractions. They also make learning feel personal because I can choose what to read and what to write.","E":"On weekends, I sometimes sit by my window with a storybook and my journal. After reading a chapter, I write a short summary and a few new words with their meanings to help me remember better.","A":"Those moments show me that a calm space makes reading and writing more enjoyable and effective.","K":"So yes, I would enjoy it very much because it brings peace and helps me learn more deeply."},{"S":"I enjoyed writing a short adventure story during the holidays.","P":"I planned the characters and setting myself, which made me feel creative and in control of the story. I also edited my work to improve the sentences.","E":"I wrote about two friends exploring a hidden garden and discovering clues. After finishing the story, I read it to my parents, who suggested using stronger verbs. I then rewrote some parts to make the action clearer and more vivid.","A":"Working on the story helped me become more confident in expressing my ideas through writing.","K":"That is why I enjoyed the experience and want to write more stories in future."},{"S":"It is important because these habits strengthen language and thinking skills.","P":"Reading builds vocabulary and world knowledge, while writing helps us organise ideas and express feelings clearly. Doing both regularly trains discipline and focus.","E":"After I started reading daily, I noticed my compositions improved. I could use better phrases and structure my paragraphs more clearly. My teacher even praised me for my progress.","A":"This shows that steady practice makes a real difference in schoolwork and confidence.","K":"Therefore, it is important for students to develop reading and writing habits, as these skills are essential for academic success and _ personal development."}],"advanced":[{"S":"Yes, I would definitely enjoy spending quiet time reading and writing like the boy in the picture.","P":"Acalm corner allows me to think deeply and develop my own ideas without noise from electronic devices. It also helps me enter a flow state, where time passes quickly because I am fully engaged.","E":"One rainy afternoon, I created a reading nook beside my window and read a mystery novel. I paused after each chapter to write predictions and questions in my notebook. By the end, I had a page of new vocabulary and a short paragraph imagining an alternative ending, which made the story even more meaningful.","A":"Experiences like this prove that quiet reading and writing are not only relaxing but also powerful for learning and creativity.","K":"In summary, I would enjoy this very much because it combines peace, focus, and imagination."},{"S":"A memorable time was when I kept a daily journal for two weeks during the holidays.","P":"Journalling lets me record small moments, practise descriptive language, and reflect on my feelings. Over time, I noticed my sentences became smoother and my ideas more organised.","E":"Each evening, I wrote three things I was grateful for and one challenge I faced. I tried to describe my experiences clearly and explain how I felt. When I re-read the entries, I could see how my mood changed and how my word choice improved.","A":"That quiet routine showed me how writing can be both personal and practical, helping me manage emotions while building skills.","K":"Thus, independent writing has become one of my favourite ways to learn and reflect."},{"S":"I strongly believe regular reading and writing are essential because they shape how we think, communicate, and learn.","P":"Reading widens our world by exposing us to different perspectives, cultures, and text types while writing helps to transform ideas into clear messages. Together, these habits build skills and perseverance, since improvement comes from steady practice.","E":"A classmate of mine reads widely and keeps a vocabulary notebook. When we work on compositions, he is able to use interesting words and organise his ideas clearly. I noticed that his habit of summarising chapters and drafting outlines before writing helps him produce stronger essays and speak confidently in class discussions.","A":"This shows that consistent reading and writing do more than raise grades. They develop thoughtful, expressive students who can learn independently.","K":"Therefore, making time for these habits each day is a wise investment that benefits both school success and lifelong learning."}],"audio":{"basic":"audio/sports-7-basic.mp3","adv":"audio/sports-7-adv.mp3"}},{"n":8,"img":"img/sports-8.jpg","see":"I see a group of children playing football on a large open field. Two boys in the front are chasing after the ball with big smiles on their faces, while the other children are running behind them, also looking very excited. They are all wearing similar white T-shirts and dark shorts, which makes them look like they are classmates. In the background, there are tall trees and some HDB blocks, showing that this is likely a school field or a nearby park.","think":["Object: Football - This shows the children are playing a team sport that requires cooperation, energy, and focus.","Setting: School field or park — This suggests the children are outdoors, making use of the open space to exercise and bond.","Action: Running and chasing the ball together - This suggests teamwork, enthusiasm, and the joy of being active.","Importance of sports and physical activity","Teamwork and friendship","Joy of outdoor play","Healthy lifestyle and exercise"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the times I played football with my classmates during recess. Even though we didn't have much time, we enjoyed running around and cheering each other on."},{"prompt":"If I were in this picture, I would...","answer":"&. If I were in this picture, I would probably be chasing the ball excitedly with my friends, hoping to score a goal for my team."},{"prompt":"I feel this is important because...","answer":"I think playing sports is important because it keeps us healthy, helps us bond with friends, and teaches us the value of teamwork."}],"questions":["How do you think the children in this picture are feeling? Why do you think so?","Can you share a time when you played a sport or game at school and how you felt?","Why do you think it is important for students to take part in sports and physical activities?"],"basic":[{"S":"I think the children are feeling very cheerful because of the smiles on their faces.","P":"They look like they are playing football. It is very fun to run together, cheer, and try to score goals as a team. Sports are more exciting when we play with friends.","E":"I remember once during PE, my classmates and I had a friendly football match. Even though my team didn't win, I laughed so much and felt happy because we all tried our best no matter how bad our skills were.","A":"That experience reminds me that football matches always create such happy, energetic atmospheres.","K":"So, I think the children are delighted because playing football is a fun and great way to spend time with friends."},{"S":"Yes, I can recall a time when I played basketball during Sports Day.","P":"It was very exciting because my team had to work together and pass the ball quickly before the other team intercepted. Everyone was cheering loudly, which made the game even more thrilling.","E":"When I shot the ball into the hoop and scored a point, my teammates clapped and shouted my name. I felt proud and happy because I contributed to the team.","A":"Moments like these make me realise how sports can bring classmates closer together.","K":"So, playing sports at school is always a memorable and enjoyable experience for me."},{"S":"I think it is very important for students to join sports and physical activities because it has many benefits.","P":"Sports help us stay strong and healthy, and they also give us a refreshing break from studying. Through regular training and practice, we learn discipline and resilience as we push ourselves to improve.","E":"For example, I used to feel tired easily, but after joining my school's basketball team, I became fitter and more confident in my abilities. I also learnt how to encourage my teammates when they felt down.","A":"This showed me that sports are helpful in building character.","K":"So I believe all students should take part in sports for their health and personal growth."}],"advanced":[{"S":"I believe the children are feeling joyful and excited because their wide smiles clearly show positive emotions.","P":"Football is an energetic sport that lets us run freely, think quickly, and work closely with teammates. Playing it with friends makes it even more meaningful because we can cheer each other on and celebrate victories together. It also gives us a chance to practise skills like passing, defending, and communication. I remember during PE lessons, my friends and I often split into teams to play football. I enjoyed being the goalkeeper once, and when I managed to save a goal, everyone cheered for me. It gave me a sense of pride and showed me how each role is important in a team.","A":"That memory tells me that playing football with friends is not just fun, it is also rewarding.","K":"So, I think the children are feeling delighted because playing football brings them joy, teamwork, and valuable lessons all at once."},{"S":"Yes, I can share about the time I joined the inter-class dodgeball game during Sports Day.","P":"It was both exciting and nerve-racking because everyone was watching from the stands. I had to focus on dodging quickly and throwing accurately to help eliminate opponents. The cheering from classmates gave me confidence to keep moving.","E":"When I caught a ball and saved a teammate from being out, I felt a huge sense of relief. Even though my class didn't win overall, I felt proud because I gave my best and supported my team.","A":"That experience showed me that participating matters more than winning, and I truly enjoyed the teamwork involved.","K":"So yes, playing sports in school has always been exciting to me and I can't wait to participate in the next game."},{"S":"I strongly believe it is very important for students to take part in sports and physical activities because they develop both our physical strength and mental resilience.","P":"Sports not only keep us fit but also teach us life skills such as teamwork, discipline, and resilience. They help us to relieve stress from studying and give us a chance to socialise with friends in a healthy way. Sports also encourage us to set goals, whether it's to improve fitness, win a game, or simply challenge ourselves.","E":"For example, when I joined my school's volleyball team, I had to train hard and learn to work closely with my teammates. I found it difficult and tiring since I was new to it, but over time I built stamina and confidence. The experience also taught me the value of perseverance, because even when we lost matches, we learnt from our mistakes and tried harder the next time.","A":"This made me realise that sports shape not just our physical health, but also our mindset and character.","K":"So yes, I believe sports are very important for every student, especially to improve in fitness and develop good habits that help them even beyond sports."}],"audio":{"basic":"audio/sports-8-basic.mp3","adv":"audio/sports-8-adv.mp3"}},{"n":9,"img":"img/sports-9.jpg","see":"I see a student in school uniform sitting across from a woman who appears to be a school counsellor. The counsellor is speaking with her hands slightly raised, while the student listens carefully with her chin resting on her hand. They are sitting in a quiet office with framed certificates on the wall, a bookshelf with books, and a table with plants and a box of tissues. The calm environment suggests this is a safe space for sharing and guidance.","think":["Object: The counsellor's office - This shows schools provide spaces where students can seek guidance and emotional support.","Setting: The student and counsellor - Their body language suggests trust and attentiv
