elderly man sitting in a rattan chair, with a small group of children sitting cross-legged on the floor around him. He is grinning and using his hands to tell a story, and the children are looking at him with smiles and curiosity. The scene looks calm and homely, and everyone seems relaxed and interested in the storytelling.","E":"This reminds me of a similar experience I had during Racial Harmony Week where a volunteer uncle told us about living in a kampung and how neighbours shared food during festivals. He described drawing water from a well and playing simple games using bottle caps. I pictured how children had fun without screens and how families supported one another during tough times. After his sharing, I felt more grateful for our clean water and safe housing today.","A":"Because of this, I believe the children are enjoying the storytelling, and the elderly man seems to take pleasure in sharing his experiences as well.","K":"It warms my heart to see these two generations laughing and smiling together."},{"S":"Yes, I have a vivid and meaningful memory of cooking with my grandmother.","P":"As we cooked, she guided me patiently through each step, from washing the rice to tasting the dish and adjusting the seasoning. She reminded me not to rush and to stay calm when mistakes happened. Her approach taught me to stay focused and to keep trying until I improved.","E":"The first time I stirred the pot, I kept the flame too high and the rice stuck to the bottom. Instead of scolding me, she calmly explained how to control the heat and showed me how to save the dish by adding more water. My next attempt turned out much better, and we shared the meal with the family. I felt proud because I had learnt through practice and perseverance.","A":"This meaningful interaction showed me that elders often teach important lessons through gentle guidance and hands-on experiences, rather than just instructions.","K":"As a result, I learnt the value of patience, a lesson I now apply to my schoolwork and CCA training."},{"S":"We can learn resilience, gratitude, and the importance of caring for one another from the older generation.","P":"Many seniors faced challenges such as limited resources, hard work, and building communities from very little. Their choices teach us to be resourceful, to appreciate what we have, and to support people around us. Their stories also explain why harmony and responsibility matter in Singapore.","E":"One time, my grandfather shared how his family saved money by repairing items instead of throwing them away. He also described neighbours helping to fix roofs after storms. Hearing this made me realise that small daily habits, like reducing waste and offering help, can make a big difference. It also showed me why we should not take modern conveniences for granted.","A":"Their experiences act like a guidebook, showing practical ways to live wisely and kindly.","K":"That is why listening to elders is valuable. The lessons can shape how we behave at home and in school."}],"advanced":[{"S":"I think that the individuals in the photograph are radiating joy and thoroughly relishing this moment of connection.","P":"An elderly gentleman is seated comfortably in a rattan chair, surrounded by a cluster of children seated on the floor. He appears to be sharing a tale, beaming with delight while gesticulating animatedly to bring his story to life. The children are clearly captivated, gazing at him with expressions of fascination and amusement. The atmosphere feels serene and intimate, suggesting a shared moment of genuine engagement.","E":"This scene reminds me of a Racial Harmony Week session I attended, where a volunteer shared nostalgic stories about the old kampung spirit. He described neighbours sharing festive food and children playing simple games with bottle caps, allowing me to imagine a time when communities supported one another without digital distractions. His sharing made me feel grateful for the modern conveniences and security we enjoy today.","A":"Drawing from this, I am convinced that the children are enthralled by the storytelling session, while the elderly gentleman derives immense satisfaction from passing down his wisdom and experiences.","K":"It is truly heartwarming to witness such a beautiful display of intergenerational bonding, bridging the gap between the young and the old through shared laughter."},{"S":"Yes, I had a truly insightful interaction with an elderly volunteer during a Values in Action (VIA) programme, where I learnt the profound importance of empathy and active listening.","P":"During the visit, she shared her life philosophy with me, emphasising that true care begins with attentiveness. She taught me that when someone is distressed, the most valuable gift we can offer is a listening ear, rather than rushing to offer unsolicited advice. She highlighted the need to be observant of subtle nuances, such as noticing if someone is physically uncomfortable, because these small gestures speak volumes.","E":"I remember sitting with her as she shared stories from her past in a calm and steady manner that held my attention. Later, when a junior lost his EZ- Link card and panicked, I recalled her advice and stayed calm, listened to him, and guided him. When I told the elderly volunteer about it, she smiled and praised my patience, making me realise I had learnt a valuable life skill and bridged the generation gap.","A":"That meaningful exchange underscored the fact that our seniors possess a wealth of wisdom and experience that can guide us in navigating stressful situations with grace.","K":"Looking back, that interaction was a pivotal moment for me, teaching me that compassion is a skill best learnt from those who have lived long and full lives."},{"S":"From the older generation, we can learn purposeful resilience, wise resource use, and the habit of building strong relationships.","P":"They navigated hardship by planning carefully, sharing tools, and trusting one another. These habits are still useful for issues we face now, such as rising costs and caring for the environment. Their calm approach teaches us to think long term and support our community.","E":"A senior speaker at our NE assembly explained rationing and repairing during tough years. My class then tried a \"repair and reuse\" challenge where we fixed loose chair legs and repurposed boxes into storage trays. We also created a neighbour-help list for elderly residents in our block who needed light errands. These small projects helped us apply the values we heard about.","A":"Their lessons become powerful when we turn them into actions that benefit others.","K":"That is why learning from seniors is important. It equips us with the mindset and skills we can use every day."}],"audio":{"basic":"audio/sg-9-basic.mp3","adv":"audio/sg-9-adv.mp3"}},{"n":10,"img":"img/sg-10.jpg","see":"I see a group of primary school children from different racial backgrounds sitting around a table in a bright classroom. They are smiling and cooperating to build a structure with blocks while referring to an open book beside them. In the background, other pupils are drawing on whiteboards and reading. The room has large windows that let in natural light, and the atmosphere looks friendly and relaxed. Everyone seems engaged and comfortable working together.","think":["Object: Shared building blocks and an open book - They suggest teamwork, problem solving, and learning from common resources.","Setting: A cheerful classroom - This shows school as a shared space where harmony is practised daily.","Action: Children of different races collaborating on one task - This suggests friendship, respect, and inclusion.","Everyday harmony and mutual respect","Teamwork and shared responsibility","Curiosity, communication, and empathy","Belonging and a safe learning environment"],"connect":[{"prompt":"If I were in this picture, I would...","answer":"I would listen to everyone's ideas, suggest a plan, and make sure each person has a part to work on so the structure is strong."},{"prompt":"I feel this is important because...","answer":"&. Getting along in class helps us learn better, enjoy school, and become more_understanding.people_who.can_work with.anyone."},{"prompt":"I feel this is important because...","answer":"Getting along in class helps us learn better, enjoy school, and become more understanding people who can work with anyone."}],"questions":["Would you enjoy working with classmates from different backgrounds like the ones in the picture? Why or why not?","Can you share about a time you worked well with classmates who were different from you?","What can teachers do in school to build harmony and include everyone?"],"basic":[{"S":"Yes, I would enjoy working with classmates from different races and religions because it makes learning more interesting.","P":"When we work with people from different backgrounds, we can learn about their unique festivals, food, and customs. It is much more fun than working with people who are exactly the same as me.","E":"For example, in my Social Studies group, I have a Malay friend and an Indian friend. When we were discussing festivals, my Malay friend explained why they fast during Ramadan, and my Indian friend shared stories about Deepavali. We combined our knowledge to make a very colourful and interesting poster.","A":"This experience helped me understand their cultures better and made me respect them more.","K":"So, I would enjoy working in a mixed group like the students in the photograph because we can learn from one another and become better friends."},{"S":"Yes, I worked well with a group of classmates from different races during a Character and Citizenship Education lesson on \"Singapore Food.\"","P":"We had to plan a class party menu that included food from all races. Since we came from different backgrounds, we could suggest the best dishes from our own cultures.","E":"My Chinese classmate suggested chicken rice, while my Malay classmate suggested satay. I learnt that we also had to be careful about dietary rules, like making sure the food was Halal so everyone could eat it. We listened to each other's ideas politely and made a menu that everyone was happy with.","A":"We succeeded because we respected our differences and focused on including everyone.","K":"That experience showed me that when we come together, we can create something that everyone can enjoy."},{"S":"Teachers can build harmony by teaching us about different cultures and making sure no one feels left out.","P":"Teachers can organise activities where we learn about each other's traditions. They can also make sure that students mix around and do not just stick to their own racial groups.","E":"For instance, my teacher assigns our seating plan so that we sit next to classmates of different races. During festivals like Hari Raya or Chinese New Year, she decorates the classroom and explains the meaning of the celebration to us. She also corrects students immediately if they make insensitive jokes.","A":"These actions show us that every race and religion is important and must be respected.","K":"Overall, teachers play a very big role in showing us how to treat everyone fairly and kindly."}],"advanced":[{"S":"Yes, I would definitely welcome the opportunity to work with classmates from diverse racial and religious backgrounds because it makes the learning process far more enriching.","P":"Collaborating with people from various backgrounds allows us to gain valuable insights into their unique festivals, culinary traditions, and customs. It creates a dynamic environment that is much more stimulating than working within a group of the same kind of people.","E":"For instance, in my Social Studies group, I collaborated with Malay and Indian classmates. When we were discussing festivals, my Malay friend shed light on the significance of fasting during Ramadan, while my Indian friend recounted vivid tales about Deepavali. We worked together to create a poster that was eye-catching and meaningful.","A":"This experience deepened my appreciation for their cultures and fostered a sense of mutual respect among us.","K":"Hence, I would enjoy working in a mixed group like the students in the photograph, as it allows us to broaden our perspectives while strengthening our friendships."},{"S":"Yes, I collaborated effectively with a multi-racial group of classmates during a Character and Citizenship Education lesson on \"Singapore Food.\"","P":"We were tasked with curating a class party menu that represented Singapore's diverse culinary landscape. Since we hailed from different backgrounds, we were able to tap on our personal experiences to propose the most authentic dishes.","E":"My Chinese classmate proposed chicken rice, while my Malay classmate suggested satay. Through this discussion, I learnt the importance of being mindful of dietary requirements, such as ensuring all food was Halal to ensure inclusivity. We entertained each other's ideas respectfully and reached an agreement on a menu that delighted everyone.","A":"We achieved success because we celebrated our differences and placed a strong emphasis on integration.","K":"That experience highlighted the fact that when we unite our strengths, we can create an outcome that everyone can appreciate."},{"S":"Teachers play a crucial role in cultivating harmony by educating us on cultural differences and ensuring no student feels discriminated against.","P":"Teachers can orchestrate meaningful activities where we learn about one another's traditions. Furthermore, they can facilitate opportunities for students to intermingle rather than remaining within their own racial groups.","E":"For instance, my teacher strategically arranges our seating plan to ensure we sit beside classmates of different races. During major festivals like Hari Raya or Chinese New Year, she adorns the classroom and explains to us the significance of the celebration. She also adopts a zero-tolerance approach towards insensitive jokes, correcting students immediately to maintain a safe space.","A":"These deliberate actions demonstrate that every race and religion is valued and deserving of respect.","K":"Ultimately, teachers are instrumental in modeling how to treat everyone with equity and compassion."}],"audio":{"basic":"audio/sg-10-basic.mp3","adv":"audio/sg-10-adv.mp3"}}]},{"id":"kind","name":"Kindness & Community","short":"Kindness & Community","zh":"善良与社区","color":"#EC4C9B","sets":[{"n":1,"img":"img/kind-1.jpg","see":"I see two primary school boys in a corridor. One boy has slipped and is sitting on the floor with his books scattered, while the other is kneeling and reaching out a hand to help him up. A few schoolmates are walking toward them from the background. Both boys are in school uniform with backpacks, and there are noticeboards and classroom doors along the corridor. The scene looks bright and clean, and the boys appear calm and friendly.","think":["Object: Scattered books and an outstretched hand - They show that a small accident happened and someone immediately stepped in to help.","Setting: A school corridor during a busy period - This highlights a shared space where awareness, safety, and quick support matter.","Action: One student helping another to stand - This suggests empathy, responsibility, and the courage to act without being asked.","Everyday empathy and kindness","Responsibility and initiative","School safety and awareness","Friendship and a supportive community"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"Yes, I once saw a classmate trip near the canteen, and several of us rushed over to help pick up his tray and check if he was okay."},{"prompt":"If I were in this picture, I would...","answer":"I would offer a steady hand, gather the books quickly, and ask if he needed a teacher or the general office for first aid."},{"prompt":"I feel this is important because...","answer":"Small acts like this make school feel safe and caring, and they encourage everyone to look out for one another."}],"questions":["Would you step forward to help a classmate like the student in the picture? Why or why not?","Have you ever helped a classmate before? What happened?","Why are small acts of kindness important in school?"],"basic":[{"S":"Yes, I would step forward to help, because acting quickly can prevent more stress or injury and shows basic respect for a schoolmate.","P":"If someone falls, the person may feel shocked or embarrassed. A calm voice and a steady hand can help them regain confidence. Helping also reminds others that safety and kindness are everyone's job, not just the teacher's.","E":"Once, a boy in my level slipped on a wet patch outside the art room. I told my friend to alert the teacher while I checked if the boy had any cuts. We helped him stand, returned his scattered sketchbooks, and guided him to a bench. After informing the office about the wet floor, we placed a caution sign to prevent more accidents.","A":"That moment taught me that simple, fast actions can make a big difference to someone's day.","K":"So yes, I would step forward to help, because it is the right thing to do and it keeps our school community safe and caring."},{"S":"Yes, I helped a classmate who felt faint after PE.","P":"He looked pale and unsteady, so I knew he needed water, shade, and an adult's attention. Staying calm and following basic steps is important during such situations. I supported him to the nearest bench and asked a friend to bring his water bottle. I fanned him with a worksheet and informed our PE teacher, who came with an ice pack and checked his pulse. After resting, he felt better and thanked us for helping without making a fuss. Later, we reminded our class to hydrate before and after PE. Working together quickly kept him safe and showed that classmates can be reliable first responders.","K":"Therefore, I have helped a classmate, and it made me realise that small, calm actions matter a lot."},{"S":"They are important because they build trust and make school a place where everyone feels seen and supported.","P":"Kindness reduces fear of asking for help and encourages people to help in return. It also prevents small problems from becoming big ones, like stopping teasing before it spreads.","E":"Our class started simple routines, such as holding the door for others and sharing materials when someone forgets a ruler. When a classmate was new and shy, we invited him to sit with us at recess and explained the timetable. Soon, he opened up and participated more in lessons.","A":"These little efforts create a positive atmosphere that helps learning and friendships grow.","K":"That is why small acts of kindness are powerful. They shape a safe, respectful school culture every day."}],"advanced":[{"S":"Yes, I would step forward to help, because responding immediately shows empathy and prevents further risk while setting a good example for others.","P":"A fall can cause shock or embarrassment. Offering a steady hand, checking for injuries, and clearing the area are practical steps that anyone can take. When students take initiative, it strengthens our culture of care and reminds everyone that safety is shared.","E":"One time, after assembly, a schoolmate stumbled on the stairs when the crowd moved too quickly. I stood beside him so people would not bump into him, then helped him up and asked if anything hurt. A friend notified a teacher while I gathered his workbook and bottle. We waited together until the teacher arrived, and later I emailed the class to remind everyone about moving carefully on stairs. The incident led our monitress to request clearer signs about keeping left.","A":"That experience proved that one small action can protect a friend and improve the way our school looks after students.","K":"So, I would definitely step forward, because kindness plus quick thinking keeps people safe and encourages responsibility in the whole cohort."},{"S":"Yes, I helped a classmate who was upset after accidentally breaking a model during project work.","P":"Instead of blaming, I offered to repair it with him and replan our timeline. Choosing support over scolding keeps the team focused and motivated.","E":"We assessed the damage, used masking tape to hold the frame, and re- glued the joints. I reassigned tasks so he could paint while I reinforced the base. We also practised carrying the model safely. On presentation day, our structure stood firm, and my classmate felt relieved and grateful. Our teacher praised the way we handled the setback as a team.","A":"This made me realise that helping a classmate emotionally and practically can rescue both the friendship and the project.","K":"So yes, I have helped, and the experience taught me that kindness keeps progress going."},{"S":"Small acts create a strong, caring culture that supports learning, well- being, and character growth.","P":"They normalise helpful behaviour, reduce conflicts, and build a sense of belonging. When kindness is common, students feel safe to participate, admit mistakes, and improve.","E":"Our class runs a \"see and solve\" routine: if we notice a problem, we take a simple step immediately, like picking up litter or guiding a lost visitor. We also keep a peer-support list, so if someone forgets materials, a buddy shares without making them feel bad. Over time, our classroom became calmer and more efficient, and group work improved.","A":"These habits show that character is built through daily choices, not only big events.","K":"Therefore, small acts of kindness are essential because they shape the environment where everyone can learn and thrive."}],"audio":{"basic":"audio/kind-1-basic.mp3","adv":"audio/kind-1-adv.mp3"}},{"n":2,"img":"img/kind-2.jpg","see":"I see three primary school children kneeling beside an elderly lady in a wheelchair, handing her a neatly packed bag of food items. The senior is smiling warmly as she reaches out to receive it. In the background, other seniors are seated at a table, chatting and doing simple activities. The room is bright with large windows, noticeboards on the walls, and clean floors, giving the space a friendly, welcoming feel. The children look respectful and happy to help.","think":["Object: Food packs and a wheelchair - They suggest a service visit where practical help and care are offered to seniors.","Setting: An elderly care centre - This highlights a safe, communal place that supports seniors' daily needs and social connection.","Service learning and empathy","Respect for the elderly","Community responsibility","Gratitude and kindness"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"Yes, my CCA visited a senior activity centre where we packed groceries, played simple games, and performed songs for the residents."},{"prompt":"If I were in this picture, I would...","answer":"-. I would greet the seniors politely, offer the food pack with both hands, and start a friendly conversation to make them feel valued."},{"prompt":"I feel this is important because...","answer":"Caring for seniors shows gratitude for their contributions and ensures no one feels lonely or forgotten in our community."}],"questions":["What do you think the people in the photograph are doing?","Can you share about a time you showed kindness to a senior?","Why is it important to care for the elderly in our community?"],"basic":[{"S":"I think the students in the photograph are volunteering at an elderly care centre.","P":"In the picture, three students are kneeling beside an elderly woman in a wheelchair, handing her a bag of food. Nearby, other seniors are sitting ata table chatting with each other. It looks like the children are there to keep the senior citizens company.","E":"Recently, when my class visited a senior care centre, I helped distribute biscuits and Milo packets. I sat with an aunty who told me about her childhood games. We played a short round of bingo and she laughed when I mixed up the numbers. Before we left, she thanked us for coming and asked us to visit again.","A":"Therefore, I think the children in the photograph are volunteering their time and doing a good job of keeping the senior citizens happy, just as my class did.","K":"That experience showed me how a short visit can make someone feel valued and less lonely."},{"S":"There was a time when I helped my grandmother after her knee operation.","P":"She needed support with light chores and moving around the house, so I adjusted my schedule to be available after school to care for her.","E":"I prepared simple snacks, carried laundry, and walked slowly with her during her daily exercises. I also taught her how to video call my cousins, which cheered her up. Over time, she recovered confidence in walking.","A":"Helping her taught me patience and showed me that small, steady acts matter.","K":"Thus, helping my grandmother allowed me to learn that kindness to seniors can be practical, consistent, and full of respect."},{"S":"It is important because seniors deserve respect, support, and companionship after contributing so much to society.","P":"Some may have health or mobility issues, while others feel isolated. When we care for them, we honour their past efforts and build a kinder, more united community.","E":"My neighbours helped an elderly uncle during the circuit breaker by buying groceries and checking in on him. My family took one weekend each month to deliver essentials. He said the visits made him feel safe and remembered.","A":"Caring for seniors benefits both them and us, because kindness strengthens community bonds.","K":"That is why looking after the elderly should be everyone's responsibility."}],"advanced":[{"S":"I believe the students in the photograph are volunteering at an elderly care centre, where they are spending time with senior citizens.","P":"In the picture, three students are kneeling beside an elderly woman in a wheelchair, gently handing her a packed bag of food. She appears relaxed and content, smiling as she receives it. Nearby, other seniors are seated around a table, engaged in quiet conversations and simple activities, suggesting that the children are there not only to provide assistance but also to offer companionship.","E":"Recently, my class visited a senior care centre as part of a community involvement programme. I helped distribute packets of biscuits and Milo before sitting beside an elderly aunty who shared stories about her childhood. We later played a short round of bingo together, and she burst into laughter when I accidentally called out the wrong number. Before we left, she held my hand, thanked us sincerely for spending time with her, and asked if we could visit again.","A":"Therefore, I think the students in the photograph are volunteering their time meaningfully and doing a commendable job of brightening the lives of the senior citizens, much like what my class did during our visit.","K":"That experience made me realise that even a brief interaction can bring joy and comfort to seniors, reminding them that they are remembered and cared for."},{"S":"Yes, I supported an elderly neighbour by creating a simple weekly checklist and helping with errands.","P":"She lived alone and sometimes forgot appointments. I wanted to help without taking away her independence.","E":"With my parents' permission, I designed a large-print planner with boxes for medicine, walks, and phone calls to family. Each weekend, I checked in to see if she needed bread or fruit. We also practised using voice commands on her phone so she could call us easily. She told me the checklist made her feel organised and less worried.","A":"This taught me that respectful help is about listening first and offering support that empowers the senior.","K":"Therefore, acts of kindness to seniors can be thoughtful, practical, and dignified, making our community warmer for everyone."},{"S":"Caring for the elderly is important because it protects dignity, preserves history, and strengthens social support in our neighbourhoods.","P":"Seniors carry memories of Singapore's past and can pass on wisdom about resilience and gratitude. Practical care like safe spaces and regular check-ins prevents isolation and promotes well-being.","E":"Last year, our school partnered with a nearby home to deliver monthly care packs. We learnt to choose low-sugar snacks and label items clearly in large fonts. A staff member shared that consistent visits reduced loneliness and encouraged residents to join activities. Knowing this impact motivated us to continue.","A":"When we care for seniors, we honour their contributions and build a kinder culture for ourselves in the future.","K":"Therefore, caring for the elderly is both a duty and an investment in a compassionate society."}],"audio":{"basic":"audio/kind-2-basic.mp3","adv":"audio/kind-2-adv.mp3"}},{"n":3,"img":"img/kind-3.jpg","see":"I see four primary school students at a round table inside a bright room. One girl is seated and looking at a lunch box while another girl sits nearby smiling at her. A boy and another girl are standing, holding containers as if they are offering snacks or inviting the seated girl to join them. In the background, two seniors are chatting at another table. The space has large windows, noticeboards on the walls, and clean floors, creating a friendly and open atmosphere.","think":["Object: Lunch boxes and a round table - They suggest sharing food and creating a space where everyone can gather.","Setting: A bright communal room - This shows a welcoming environment that encourages conversation and teamwork.","Action: Students approaching a peer who seems alone - This suggests inclusion, kindness, and the effort to befriend others.","Welcoming new classmates","Peer support and empathy","Confidence to take initiative","Belonging and class harmony"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"Yes, my class ran a buddy system where we paired up with new pupils during their first week so they would not sit alone at recess."},{"prompt":"If I were in this picture, I would...","answer":"- I would greet the student warmly, introduce myself, and invite her to join our activity so she feels comfortable."},{"prompt":"I feel this is important because...","answer":"Inclusion helps everyone enjoy school and learn with confidence, and it prevents loneliness or misunderstanding."}],"questions":["Would you invite a classmate who is sitting alone like the one in the picture to join your group? Why or why not?","Can you share about a time you helped include someone who felt left out?","What can students do to make new classmates feel welcome?"],"basic":[{"S":"Yes, I would invite a classmate who is sitting alone like the one in the picture because no one should feel left out during school activities.","P":"A friendly invite can remove the awkwardness of joining a new group. When we show kindness first, it becomes easier for the person to open up and participate. It also sets a positive example for the rest of the class.","E":"Last term, a new pupil sat by herself during recess. I walked over with a smile, introduced my friends, and asked if she wanted to join our card game. We learnt how to pronounce her name and asked about her favourite subjects. By the end of the week, she was laughing with us and felt more settled in class.","A":"Taking the first step turned a lonely moment into the start of a friendship.","K":"So, I would definitely invite the person, because a simple welcome can change someone's day."},{"S":"Yes, I helped a classmate who was often quiet during discussions.","P":"He had good ideas but spoke softly, so I wanted to make space for his voice and show the group how to listen.","E":"Before our science project, I asked him privately which part he liked most. He chose data recording. During the meeting, I said, \"Let's hear from him about the results,\" and gave him time to share. We used his neat table for our slides and it impressed our teacher. He smiled and participated more after that.","A":"I realised that a little encouragement helped him contribute and feel respected.","K":"In the end, I felt proud of myself for making him feel more included in our group project."},{"S":"Students can greet them warmly, include them in groups, and guide them through daily routines.","P":"Clear instructions and small acts of care reduce anxiety for someone new. Checking in during lessons and at recess shows that the welcome is real, not just on the first day.","E":"When a transfer student joined our class, I offered to be his recess buddy and showed him the canteen queues, library rules, and where the water coolers are. I also shared my notes and sat beside him during group work so he knew what to do. Soon, he started volunteering answers and made more friends.","A":"Consistency helped him feel safe and confident, not just noticed once.","K":"That is why I believe students should combine friendly words with helpful actions to make newcomers feel at home."}],"advanced":[{"S":"Yes, I would invite a classmate who is sitting alone like the one in the picture because a proactive welcome prevents isolation and builds a caring class culture.","P":"Many students hesitate to join a group even when they want to. By approaching first, I lower that barrier and show that our group values people, not just results. This also encourages others to do the same the next time they notice someone alone. During an art rotation, a new girl sat quietly with her materials. I moved a chair to create space and said, \"Join us, we're building a cardboard sculpture.\" I explained our plan and asked for her ideas. She suggested a stable base using triangles, which made our model stronger. We credited her during the presentation and she looked proud. After a few lessons, she was chatting comfortably with everyone.","A":"That moment proved that one warm invitation can unlock talent and friendship at the same time.","K":"Therefore, I would always invite the person in, because inclusion improves both learning and well-being."},{"S":"Yes, I supported a schoolmate who often ate alone by creating a small recess circle.","P":"I believe that no one should spend recess by themselves, so I brought two friends to his table and started a chat there. Changing our behaviour made it easier for him to feel included.","E":"We asked about his hobbies and found out he loved chess. The next day, we brought a pocket board and played a short round. Soon, he taught us a new opening and we took turns challenging him. Over the term, more classmates joined and he became part of our CCA. His confidence grew and he started greeting others first.","A":"This shows that including someone means meeting them where they are and showing steady friendship.","K":"So, I believe that intentional, gentle actions can turn loneliness into belonging for any classmate."},{"S":"Students can use structured routines and kind habits that make participation easy for newcomers.","P":"This includes introducing them to classmates, rotating roles so they get a turn, and using sentence starters that support shy speakers. Checking in after class shows genuine care.","E":"My group uses a simple welcome plan: learn to pronounce names correctly, assign a peer buddy for the first week, and start each task with a quick round where everyone shares one idea. With this routine, a new classmate who was nervous began contributing steadily, and our group work became more balanced.","A":"When inclusion is built into routines, no one is forgotten, even on busy days.","K":"Therefore, I believe that students should rely on clear systems and daily kindness to help new classmates feel truly included."}],"audio":{"basic":"audio/kind-3-basic.mp3","adv":"audio/kind-3-adv.mp3"}},{"n":4,"img":"img/kind-4.jpg","see":"I see four primary school students running a donation booth in a school corridor. Two girls are arranging stacks of books while a boy places a soft toy into a labelled box. Another girl is smiling as she checks items on the table, which include teddy bears, toy cars, and more books. A handmade sign on the front of the table reads \"DONATIONS FOR A CAUSE.\" In the background, other students are queuing with boxes, as if they are bringing items to contribute. The corridor is bright and orderly, suggesting a school- wide effort.","think":["Object: Donation box and neatly arranged items - They show purposeful giving and respect for the people who will receive the items.","Setting: A school corridor with many students involved - This highlights a whole-school initiative where everyone can participate.","Action: Students collecting and sorting contributions - This suggests responsibility, teamwork, and compassion for those in need.","Student leadership and initiative","Teamwork and organisation","Empathy and responsibility"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"- Yes, our class once organised a book drive for a children's home and we collected, cleaned, and labelled the books before delivering them."},{"prompt":"If I were in this picture, I would...","answer":"I would help check that donated items are clean and safe, record the numbers, and thank each donor politely."},{"prompt":"I feel this is important because...","answer":"Donation drives let students practise kindness in a real way and remind us not to take our own belongings for granted."}],"questions":["What do you think is happening in the photograph?","Have you ever donated or raised money for a good cause?","Why is it important for schools to organise donation drives?"],"basic":[{"S":"I think a donation drive is being run by students in a school.","P":"Four students have arranged books and toys on a table, with a donation box placed in front. A handmade sign reads \"Donations for a Cause,\" and other students are queuing in the background to contribute.","E":"Similarly, I helped run a stationery drive in school. We set up a table, weighed the bags, and checked that the pens worked. I thanked each donor and explained where the items would go. When we delivered the boxes, the centre staff told us that the children could start school with enough supplies. Hearing that made all our effort feel meaningful.","A":"Therefore, I think the students in the photograph are doing the same thing by collecting donations for charity.","K":"These activities prove that small tasks add up to real impact when many students work together."},{"S":"Yes, I have donated items and raised funds through a class initiative.","P":"We chose a cause, planned how to collect safely, and made posters to explain why the help was needed. Clear plans helped more people support us.","E":"My group sold handmade cards during recess to raise money for a children's hospital. We budgeted for materials, priced the cards fairly, and kept a simple logbook. After two weeks, we donated the amount through the school and received a note of appreciation. Our careful planning made the fundraising honest and effective. The experience showed me that giving is not only about feeling kind. It also needs organisation and transparency.","K":"So yes, I have, and it taught me to be generous and responsible at the same time."},{"S":"It is important because schools can guide students to give thoughtfully and work together for a shared goal.","P":"Donation drives teach us how to identify needs, collect appropriate items, and communicate clearly. They also build empathy and unity across different levels and classes.","E":"In our school's year-end drive, upper primary students mentored younger pupils on sorting and labelling. We learnt to reject unsafe or broken items kindly and suggest better alternatives. Seeing the final stacks of neatly packed boxes made everyone proud.","A":"When schools organise well, students learn life skills and the community receives meaningful support.","K":"That is why donation drives are valuable learning experiences that also help people in real life."}],"advanced":[{"S":"I think a donation drive to collect pre-loved items is being organised by student leaders in a school.","P":"In the picture, four primary school students are managing a donation booth along a school corridor. Some of them are sorting books neatly on the table, while one student places a soft toy into a labelled donation box. A sign in front of the table reads \"Donations for a Cause,\" and other students can be seen lining up in the background with items to donate. The clean and bright corridor suggests that the whole school is taking part.","E":"From my own experience, I have donated pre-loved items such as books, clothes, and toys. At first, it was difficult to give them away because some of the items held memories for me. However, I later realised that there were children who needed these items more than I did.","A":"Therefore, just like the donation drive shown in the picture, I would encourage other students to donate their pre-loved items to charity to help those in need.","K":"Donating my own items helped me realise that giving up something small can make a big difference to someone else."},{"S":"Yes, I helped raise funds through a service stall and learnt how accountability builds trust.","P":"We kept receipts, recorded sales daily, and provided a summary to our teacher and classmates. This transparency encouraged more people to support the cause.","E":"My team sold pre-loved books. We cleaned the covers, priced them by condition, and created a \"pay-it-forward\" option for students who needed books but could not afford them. At the end, we posted totals on a noticeboard and transferred the funds through the school. Parents and teachers praised the clear reporting, and the beneficiary sent an update on how the money bought reading kits.","A":"Raising funds responsibly teaches honesty and respect for the people who trust us with their donations.","K":"Therefore, I have raised money before, and it showed me that good systems make generosity sustainable."},{"S":"Schools should organise donation drives because they develop civic habits, from empathy to project management, that students will carry into adulthood.","P":"Through authentic tasks, we learn to research needs, avoid waste, and coordinate people and time. We also practise clear messaging so donors know what is useful and why.","E":"In a cross-level project, my classmates and I partnered with a community organisation to gather learning materials for children. We created bilingual posters, used QR codes for lists, and set up quality checkpoints. Because the process was smooth, teachers said more classes participated than in previous years, and the partner could distribute items quickly.","A":"Such experiences show students that careful planning multiplies the impact of kindness.","K":"Thus, school-led drives matter because they grow capable, caring citizens while meeting real community needs."}],"audio":{"basic":"audio/kind-4-basic.mp3","adv":"audio/kind-4-adv.mp3"}},{"n":5,"img":"img/kind-5.jpg","see":"I see a group of upper primary students standing at a street crossing outside a housing estate. They are smiling and holding small Singapore flags, donation tins, and flyers. Each student is wearing a school uniform with a lanyard tag, and some are reaching forward as if offering flags or stickers to passers-by. Behind them are HDB blocks, trees, and light traffic. The mood looks energetic and positive, like a school-led Flag Day activity where students encourage the public to donate.","think":["Object: Donation tins and mini flags - They point to fundraising for a cause and promoting national pride respectfully.","Setting: A public walkway near the road - This shows students volunteering in the community where many people pass by.","Action: Students distributing flags and flyers while collecting donations - This suggests service, confidence, and teamwork.","Volunteerism and public spirit","Courage and communication skills","Integrity and accountability","Unity and national pride"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"- Yes, I saw seniors and students collecting donations at MRT entrances, thanking each person and giving stickers in return."},{"prompt":"If I were in this picture, I would...","answer":"&. I would greet people politely, explain the cause clearly, and say thank you whether they donate or not."},{"prompt":"I feel this is important because...","answer":"Such activities teach us to serve others, handle money responsibly, and represent our school with pride."}],"questions":["How do you think the people in the photograph are feeling, and why do you think so?","Can you share about a time you volunteered or helped in a community event?","What values can students learn from taking part in Flag Day?"],"basic":[{"S":"I think the students in the photograph are feeling joyful and proud to be taking part in Flag Day.","P":"I see a group of upper primary students smiling and holding donation tins, flags, and flyers in a neighbourhood estate. The students are grinning cheerfully as they give out flags and request for donations, probably feeling proud of their good deed.","E":"A few months ago, I also took part in my school's Flag Day, where I was stationed at an MRT station to collect donations for a children's charity organisation. Many people walked by quickly and ignored me, while others were kind enough to donate their loose coins. Although it was tiring, I felt proud knowing that I had volunteered my time to help others.","A":"So, I think that the students in the photograph are feeling proud as well for taking part in Flag Day.","K":"It is a challenging activity, so I have great respect for every student who participates willingly."},{"S":"Yes, I volunteered at a neighbourhood clean-up organised by our Residents' Committee.","P":"We were assigned zones, picked litter safely with tongs, and sorted recyclables. I learnt to coordinate with adults and follow safety rules near roads.","E":"My team worked around the playground and void deck. We greeted residents, reminded children to watch their step, and explained why we separated plastic from paper. At the end, we weighed our bags and saw how much trash had been removed. The area looked cleaner and families thanked us for our effort.","A":"That day taught me that small, steady actions can improve shared spaces quickly.","K":"In the end, volunteering made me more responsible and encouraged me to keep serving whenever I can."},{"S":"Students can learn empathy, integrity, and perseverance from Flag Day.","P":"Empathy comes from understanding the needs behind the cause. Integrity is needed to handle money honestly and report totals accurately. Perseverance is built when we keep trying even if some people decline to donate.","E":"I have noticed many groups of students at the MRT station near my house taking part in Flag Day. They always seem eager to approach strangers for donations, and I feel sorry for them when passers-by ignore them. Despite this, the students continue to stand patiently, waiting for others to come by.","A":"These habits do not end after the event. They shape how we act in class and at home.","K":"That is why Flag Day is valuable. It grows the values that make us trustworthy and caring citizens."}],"advanced":[{"S":"I believe the students in the photograph are feeling a strong sense of accomplishment and enthusiasm while participating in this Flag Day activity.","P":"I see a group of upper primary students standing at a busy street crossing near a housing estate. Their expressions are bright and cheerful as they hold their donation tins and Singapore flags, probably feeling confident and eager to encourage the public to support their cause. Working together as a group to help their community likely filled them with a strong sense of joy and fulfillment.","E":"This reminds me of my own experience a few months ago when I participated in my school's Flag Day. I was stationed at a crowded MRT station to raise funds for a children's charity. Initially, I felt quite nervous, especially when some commuters rushed past and ignored me. However, I persevered. When a kind elderly lady stopped to drop some coins into my tin and smiled at me, my fatigue vanished. That small interaction made me realise that despite the rejection, my efforts were contributing to something bigger than myself.","A":"Looking at the smiles in the photograph, I am certain these students feel the same pride and satisfaction, knowing they are making a difference in their neighbourhood.","K":"The activity is far from easy, which makes me truly admire every student who chooses to take part as a genuine act of goodwill."},{"S":"Yes, I helped run a weekend book donation for a family service centre and learnt how planning increases impact.","P":"We consulted the centre for a needs list, rejected unsuitable items kindly, and labelled boxes by reading level. Clear instructions helped donors give more useful items.","E":"I designed QR posters with the list, manned the table with classmates, and kept a tally sheet. When donors brought worn-out textbooks, we thanked them and suggested storybooks or assessment books in better condition. After delivery, the centre updated us that the books stocked their reading corner for tuition sessions. Seeing the result made me appreciate careful curation.","A":"Volunteering is most effective when kindness is matched with good systems.","K":"Sol plan to keep serving and improving our processes, because thoughtful giving reaches the people who need it most."},{"S":"Students learn public spirit, respect, and accountability through the whole process.","P":"Public spirit grows when we stand under the sun for a cause bigger than ourselves. Respect is shown when we thank people whether or not they donate. Accountability is practised by using sign-in sheets, counting with a witness, and returning tins on time.","E":"Our group created a checklist for Flag Day. We would arrive early, set up safely, smile and introduce the charity, record breaks, and return tins before the deadline. We also prepared polite phrases for different situations, like \"Thank you for listening, have a good day.\" These routines kept us professional and encouraged more positive responses from the public.","A":"Such discipline helps students to grow holistically as individuals.","K":"Thus, Flag Day builds various dependable habits that students can carry into future service projects."}],"audio":{"basic":"audio/kind-5-basic.mp3","adv":"audio/kind-5-adv.mp3"}},{"n":6,"img":"img/kind-6.jpg","see":"I see a large poster displayed in a bright school corridor. The headline reads CHOOSE KINDNESS, and beneath it are three simple icons. The first shows hands protecting a small group of students, the second shows a crossed-out speech bubble with a happy face beside it, and the third shows a ring of figures holding hands. Short captions encourage friendly behaviour, speaking up, and creating a safe space. Students are walking past in the background, which suggests the poster is placed where many will see it on the way to class.","think":["Object: A kindness and anti-bullying poster - It reminds students to act with care and take responsibility for each other.","Setting: A school corridor - It is a shared space where messages about safety and respect reach everyone daily.","Action: Students passing by a clear campaign display - It suggests a whole-school effort to build a positive culture.","Kindness and empathy","Courage to be an upstander","Inclusion and respect","Emotional safety for all"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"Yes, my school ran a Kindness Week with posters, pledge cards, and class circles where we practised how to speak up."},{"prompt":"If I were in this picture, I would...","answer":"I would read the poster carefully, share it with my friends, and look out for chances to include someone who seems left out."},{"prompt":"I feel this is important because...","answer":"Clear reminders shape our habits, and when everyone follows them, school becomes a safe place to learn and grow."}],"questions":["Would you support a kindness or anti-bullying campaign like the one in the picture? Why or why not?","Can you share a time you stood up for someone or handled an unkind situation?","What can students do to help prevent bullying in school?"],"basic":[{"S":"Yes, I would support a kindness or anti-bullying campaign like the one in the picture because reminders and action plans help everyone behave better.","P":"Posters reach many students quickly and set a common standard. When a campaign comes with simple steps, people know exactly what to do, such as greeting others, reporting harm, and including classmates. It also shows our school takes emotional safety seriously.","E":"During Kindness Week, my class put up posters and ran a pledge board. I volunteered to give short announcements about using respectful words and checking on friends. We created a help box so students could report worries privately. After the week, I noticed fewer rude jokes and more students inviting quiet classmates to join games.","A":"The campaign changed daily habits because it was visible, practical, and supported by teachers and students together.","K":"So, I would definitely support a campaign like the one in the picture to build a friendlier and safer school."},{"S":"Yes, I intervened when a group excluded a new classmate from a project.","P":"I felt it was unfair, so I looked for a respectful way to change the situation without starting an argument.","E":"I told the group we needed everyone's strengths and suggested splitting tasks. I paired the new classmate with me to draft the introduction and helped her share her ideas during the meeting. I also checked in with the teacher about group balance. By the presentation, she spoke confidently and our project was stronger.","A":"The situation improved because I chose to stand up for my classmate.","K":"Through this experience, I realised that standing up politely and planning teamwork can turn an unkind moment into a positive experience."},{"S":"Students can prevent bullying by being upstanders, using kind language, and getting help early.","P":"Bullies often continue when bystanders stay silent. If we speak up calmly, set boundaries, and report concerns, we protect our friends and send a clear message. Practising empathy also stops conflicts from growing.","E":"My own friend group has agreed on a simple plan: interrupt, include, inform. When a classmate was teased about his accent, I said, \"We don't talk like that here,\" then invited him to sit with us. After class, we updated our teacher with facts, not drama. The teasing stopped, and the class learnt to be more patient during oral reading.","A":"Taking small, steady actions makes a big difference because it removes the audience that bullies want.","K":"So, students can prevent bullying by acting early, staying kind, and seeking adult support when needed."}],"advanced":[{"S":"Yes, I would support a campaign like the one in the picture because culture changes when clear messages are repeated and matched with real actions.","P":"A strong campaign sets norms, offers scripts for what to say, and creates safe channels to report concerns. When students lead parts of it, such as peer ambassadors and class circles, everyone feels responsible, not just teachers. Visible reminders also help us pause before we speak. In my school, we launched a Choose Kind initiative. We taught quick responses like \"We speak respectfully here,\" set up a QR form to alert teachers, and ran buddy benches at recess. I helped design posters and recorded a short video explaining how to support friends online. Over several weeks, teachers reported fewer complaints, and more students tried conflict resolution before seeking discipline.","A":"Because the campaign combined messages, tools, and student leadership, it influenced daily behaviour across levels.","K":"Therefore, I would support it fully, as it turns good intentions into habits that keep everyone safe."},{"S":"Yes, I supported a schoolmate who received rude comments in a group chat.","P":"I knew screenshots could help adults respond correctly, and I wanted to de-escalate the chat without shaming anyone.","E":"I messaged the victim privately to check if they were okay, then posted, \"Let's keep the chat for homework only.\" When the comments continued, I saved the messages and informed our teacher with my parents copied in. Our teacher spoke to the students involved, and the class created guidelines for online behaviour. The student later thanked me for stepping in early","A":"Acting calmly, keeping evidence, and getting adult help protected my friend and taught the class better digital habits.","K":"Thus, I learnt through this experience that quiet courage and clear steps can stop harm and rebuild a respectful environment quickly."},{"S":"We can prevent bullying by building protective routines, using respectful communication, and responding firmly when harm appears.","P":"Protective routines like greeting classmates, rotating partners, and inviting others into games reduce chances for exclusion. When bullying occurs, we should interrupt, document facts, and report it to trusted adults, instead of trying to fight fire with fire.","E":"My class introduced three routines: Name Check to pronounce names correctly, Mix-It Mondays to rotate partners, and Two Kind Lines, where we end group work by thanking each member. When a hurtful rumour started online, we saved screenshots, told the form teacher, and posted a positive correction. The rumour died down, and the student felt supported.","A":"Systems plus kind words protect classmates better than reacting only after damage is done.","K":"So, students should practise daily inclusion and take firm, respectful action whenever bullying appears."}],"audio":{"basic":"audio/kind-6-basic.mp3","adv":"audio/kind-6-adv.mp3"}},{"n":7,"img":"img/kind-7.jpg","see":"I see neighbours gathered along an HDB corridor exchanging trays of food. A woman in a hijab is smiling as she offers a tray of snacks to an elderly lady who is holding a grocery bag. A teenage boy beside them is helping to pass items. In the background, other neighbours are also chatting and sharing food. Potted plants line the corridor and noticeboards hang on the wall. The mood looks warm and friendly, with people enjoying each other's company.","think":["Object: Trays of food and grocery bags - They suggest generosity, sharing resources, and caring for one another's needs.","Setting: An HDB corridor - This shows a common space where everyday neighbourliness can happen naturally.","Action: Neighbours exchanging food and chatting - This suggests kampung spirit, trust, and friendly support across ages and backgrounds.","Neighbourliness and mutual care","Generosity and gratitude","Friendship across different backgrounds","Community bonding and responsibility"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"Yes, during festive seasons my neighbours often share snacks, and we sometimes help deliver meals to an elderly couple on our floor."},{"prompt":"If I were in this picture, I would...","answer":"&. I would greet everyone, offer to carry heavier items, and help distribute food so each household gets a fair share"},{"prompt":"I feel this is important because...","answer":"These small acts build trust and make the block feel like a supportive family, especially for seniors who may live alone."}],"questions":["How do you think the people in the photograph are feeling, and why do you think so?","Can you share about a time you helped or received help from a neighbour?","What does it mean to be a good neighbour?"],"basic":[{"S":"I think that the people in the photograph are feeling joyful and connected as they share food with one another.","P":"I see a group of lively neighbours gathered in the void deck of an HDB flat. A woman wearing a hijab is smiling warmly as she offers snacks to an elderly Chinese lady, while a teenage boy helps to distribute bags of food. Everyone appears cheerful as they probably get along well and often help each other out.","E":"Every year for Hari Raya, my Muslim neighbours will share delicious cookies and ketupat with my family. We return the gesture by giving them pineapple tarts during Chinese New Year. Aside from festivals, we also look out for each other. If my mother runs out of salt or sugar while cooking, she will ask our neighbour for help. These little acts of kindness build friendship and trust between families living next door.","A":"Thus, I believe the people in the picture are feeling a deep sense of happiness as they bond over shared food with neighbours.","K":"I suggest that everyone try their best to get along with their neighbours too."},{"S":"Yes, my family received help from a neighbour when our water heater stopped working.","P":"We struggled to shower with cold water before school, and my parents were worried. Our neighbour heard about it and immediately offered a practical solution.","E":"She let us use her bathroom quickly and shared the contact of a reliable plumber. Later that evening, we baked muffins to thank her and passed some to the other units as well. The next week, when she travelled, we helped water her plants and collect her parcels.","A":"This exchange of help built trust and showed how neighbours can make life smoother for one another.","K":"Through this experience, I learnt that simple kindness both given and received strengthens our community."},{"S":"Being a good neighbour means being respectful, helpful, and dependable. Respect means keeping noise down, greeting others, and following shared rules. Helpfulness means checking in on seniors, returning lost items, and offering assistance during emergencies. Dependable neighbours respond when someone needs help and keep promises.","E":"Our corridor used to be cluttered, so my family worked with the units on our","K":"So, being a good neighbour is about daily respect and steady support, not just friendly words."}],"advanced":[{"S":"I feel that the people in the photograph are delighted as they possess a strong sense of togetherness as they share food.","P":"I see a diverse group of neighbours gathered at the void deck of an HDB block. The atmosphere appears vibrant and welcoming. A lady in a hijab is beaming with hospitality as she offers snacks to an elderly Chinese lady, while a teenager actively assists in distributing the food. Everyone is engaged in animated conversation, which clearly displays the racial harmony and friendly spirit within the estate.","E":"This scene truly reflects the \"kampung spirit\" in my own neighbourhood. For instance, during Hari Raya, my Muslim neighbours generously share homemade cookies and ketupat with my family. We make sure to reciprocate this gesture by gifting them pineapple tarts during Chinese New Year. Beyond festive seasons, we also practice mutual support. Whenever my mother runs out of ingredients like salt or sugar, she would approach our neighbours for help. These acts of sharing foster closer ties and build a harmonious environment where everyone looks out for one another.","A":"Therefore, I believe the people in the picture are feeling a deep sense of belonging and joy as they strengthen their bonds over sharing snacks and food.","K":"In a densely populated country like Singapore, it is especially important for everyone to get along with their neighbours."},{"S":"Yes, I helped a neighbour during a rainy evening when her grocery trolley got stuck at the curb.","P":"She was alone and carrying heavy bags, so I decided to assist and make sure she reached the lift safely.","E":"I held an umbrella for her and lifted the front of the trolley while another neighbour steadied the back. We brought the groceries to her door and checked if she needed anything else. Afterwards, she left a thank-you note on our gate and shared homemade desserts during the weekend. Since then, we exchange small favours, like lending tools or delivering soup when someone is unwell.","A":"Helping my neighbour opened the door to regular kindness and a stronger sense of belonging.","K":"In the end, I learnt that quick, thoughtful help can start long-lasting neighbourly friendships."},{"S":"A good neighbour practises everyday consideration, proactive help, and clear communication.","P":"Consideration includes keeping corridors clear, controlling noise, and disposing of rubbish properly. Proactive help means offering to carry heavy items, watching out for unattended deliveries, or checking on vulnerable residents. Clear communication through notes or chat groups prevents confusion and builds confidence.","E":"My parents created a shared calendar noting when we could help collect parcels or water plants for travelling neighbours. We also agreed on quiet hours for exam periods. When a lift maintenance notice came, we reminded elderly residents and offered to help with groceries. These small systems reduced friction and made everyone feel cared for.","A":"By combining kindness with simple routines, being a good neighbour becomes a daily habit, not a one-off act.","K":"So, to be a good neighbour, we should pair respect with practical support and honest communication."}],"audio":{"basic":"audio/kind-7-basic.mp3","adv":"audio/kind-7-adv.mp3"}},{"n":8,"img":"img/kind-8.jpg","see":"I see four primary school students cleaning a senior's living room while the elderly lady sits in an armchair smiling. One girl is arranging framed photos on a cabinet, another is dusting the lower shelves, a boy is sweeping the floor carefully, and a third girl is tidying books on a bookshelf. The room has potted plants, curtains, family photos, and neatly arranged furniture, which makes it feel homely and warm. The children look focused and respectful as they work together.","think":["Action: Students working together while a senior looks on - It suggests responsibility, service learning, and kindness across generations.","Care for seniors and community","Responsibility and initiative","Teamwork and respect","Gratitude and empathy"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"Yes, our CCA cleaned a senior's flat by wiping windows, decluttering magazines, and labelling medicine boxes so they were easy to find."},{"prompt":"If I were in this picture, I would...","answer":"I would greet the senior politely, ask which areas need attention first, and work steadily while checking that her belongings are handled carefully."},{"prompt":"I feel this is important because...","answer":"Volunteering our time shows respect for elders, teaches us to be responsible, and helps the community feel more caring and connected."}],"questions":["What do you think the people in the photograph are doing?","Can you share about a time you did chores or volunteered to help around the house?","What can students learn from caring for the elderly?"],"basic":[{"S":"I think the children in the photograph are helping an elderly woman clean her house.","P":"Two girls are tidying the woman's belongings, a boy is sweeping the floor, and another girl is wiping the cabinets. They appear to be volunteering, visiting senior citizens' homes to help clean their living spaces.","E":"My class once joined a \"Clean and Care\" visit too. I wiped photo frames with a cloth, sorted old newspapers for recycling, and helped label kitchen containers. The aunty shared stories while we worked, and we checked in with her about what to keep and where to place things. When we finished, she smiled and thanked us.","A":"Therefore, I think the students are helping the elderly woman with cleaning, just as I have done with my classmates before.","K":"That visit showed me that one afternoon of careful work can bring comfort to a senior."},{"S":"Yes, I helped my great-grandmother reorganise her living room after she returned from a short hospital stay.","P":"We wanted her to walk safely without tripping, so I focused on clearing clutter and keeping daily items within easy reach. E - Example from Experience: I rolled up loose cables, shifted a small stool away from the walkway, and placed her spectacles, remote control, and medicine into labelled trays. I also swept the floor and wiped the cabinet handles. She told me it was easier to move with her walking stick and that she felt more confident walking to the kitchen. Doing these chores taught me that small changes can protect someone and give them independence.","K":"So, I learnt that helping well means planning, asking permission, and working carefully."},{"S":"Students can learn responsi caring for the elderly. lity, empathy, and important life skills by","P":"When students assist senior citizens with simple tasks, they develop patience, understanding, and a sense of duty. Caring for seniors also teaches students to communicate respectfully and consider the needs of others.","E":"During Values in Action, my class partnered with a senior centre to deliver food packs and check smoke alarms. I learnt to speak clearly, ask permission before moving items, and record feedback for staff. Seniors said they felt less alone knowing neighbours and students were looking out for them.","A":"These activities train students to be thoughtful citizens who can respond when help is needed.","K":"Therefore, caring for the elderly not only benefits seniors but also helps students become more responsible and compassionate."}],"advanced":[{"S":"The students in the photograph might be engaged in a Values in Action activity, helping to spruce up the living space of an elderly resident.","P":"The scene takes place in a cosy HDB living room with excellent teamwork among the four students. Two girls are meticulously arranging books and photo frames, another student is dusting the shelves, and a boy is sweeping the floor with concentration. The elderly lady, seated comfortably in her armchair, is beaming with appreciation.","E":"This scene resonates with me because I participated in a similar \"Clean and Care\" project with my classmates last year. While my task was to wipe the dusty window grilles and sort through old newspapers for recycling, what I remember most was the interaction. The elderly resident shared fascinating stories about Singapore's past while we worked, and we made sure to ask for his permission before moving his belongings.","A":"Therefore, I am convinced that the students in the photograph are demonstrating compassion and active citizenship by caring for the pioneer generation, just as I have done.","K":"That experience taught me that such acts of service go beyond physical cleaning. They provide companionship and bridge the gap between generations, showing the elderly that they are valued and remembered."},{"S":"Yes, I volunteered to tidy our community library corner and learnt how small routines keep shared spaces welcoming.","P":"I realised that cleanliness and clear labelling help everyone find items quickly and return them properly, which saves time for volunteers and users.","E":"With two friends, I wiped shelves, sorted books by level, and created large labels. We set up a return tray and a \"repair\" box for torn pages. We also placed a gentle sign reminding users to keep the area tidy. Over the next weeks, more children used the corner and the space stayed neat because the system was simple to follow.","A":"That taught me that good organisation is a form of care that continues even after the volunteers leave.","K":"So, I plan to keep volunteering, because consistent, thoughtful chores can make a lasting difference to others."},{"S":"Caring for the elderly allows students to cultivate empathy, resilience, and essential life skills.","P":"Interacting with seniors nurtures patience and a strong sense of civic duty. It bridges the generational gap, teaching students to communicate with sensitivity and appreciate the perspectives of the older generation.","E":"During a community outreach programme, I delivered food packs and checked smoke alarms for seniors. I learnt to practice mindfulness by asking for permission and listening attentively to their concerns. It was heartwarming to know our presence helped alleviate their isolation.","A":"Such experiences mould students into conscientious citizens who are proactive in serving the community.","K":"Thus, caring for the elderly is a character-building experience that fosters a more compassionate and inclusive society."}],"audio":{"basic":"audio/kind-8-basic.mp3","adv":"audio/kind-8-adv.mp3"}},{"n":9,"img":"img/kind-9.jpg","see":"I see an adult son sitting beside his elderly mother on a sofa at home. He is holding her hands gently and speaking to her with a calm expression, while she looks at him with a small, grateful smile. Family photos and homely decorations are placed on shelves behind them, and cushions line the sofa. The room feels warm and personal, suggesting a private moment of care and support between family members.","think":["Object: Joined hands and family photos - They show reassurance, closeness, and shared memories that give comfort.","Setting: A cosy living room - This highlights a safe space where honest feelings can be expressed and support is offered quietly.","Action: A son listening and comforting his mother - This suggests empathy, patience, and responsibility in caring for loved ones.","Emotional awareness and empathy","Family responsibility and gratitude","Listening and gentle communication","Kindness that strengthens relationships"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"Yes, I have seen my parents comfort my grandparents during health scares, and their steady presence made the whole family feel calmer."},{"prompt":"If I were in this picture, I would...","answer":"I would sit close, listen carefully, and offer a reassuring hand while asking how I could help with simple tasks around the house."},{"prompt":"I feel this is important because...","answer":"When someone is upset, kind attention shows they are not alone, and small actions can bring peace and strength."}],"questions":["Would you offer comfort to a family member like the one in the picture when they feel down? Why or why not?","Have you ever comforted someone who was feeling down?","What are some thoughtful ways students can support someone who is upset?"],"basic":[{"S":"Yes, I would offer comfort to a family member like the one in the picture because being caring can make a tough moment easier to handle.","P":"When someone is sad or worried, they may not need big solutions first. They often just need a safe listener and gentle words. Sometimes, helping them do little chores works too.","E":"When my grandmother felt discouraged after a medical appointment, I sat beside her and held her hand quietly. I asked simple questions, helped her call the clinic to clarify the next visit, and wrote the details in large print for her. Then I warmed soup, played her favourite song softly, and showed her photos from our last family outing. She relaxed and smiled again by the end of the evening.","A":"Those small steps did not change the situation immediately, but they changed how she felt, which gave her strength.","K":"So, I would definitely offer comfort like the one in the picture because steady kindness helps loved ones feel supported and hopeful."},{"S":"Yes, I comforted a close friend who was upset after doing badly on a test.","P":"I knew that advising too quickly might make him feel worse, so I started by listening and letting him share what happened. I tried to show that I understood his feelings before discussing solutions.","E":"We sat at a quiet bench and I said, \"I'm here. Tell me what's on your mind.\" After he spoke, I reminded him of times he improved with practice. We planned short study sessions together, and I shared my notes and a simple revision timetable. The next week, he messaged that he felt more in control. Even before his marks improved, his mood lifted because he felt less alone.","A":"That experience taught me that empathy first, then action, is the best order when comforting someone.","K":"As a result, I learnt the value of patience, a lesson I now apply to my schoolwork and CCA training."},{"S":"Students can support others by listening, using kind words, and offering help that suits the person's needs.","P":"Listening with eye contact and patience helps the person feel respected. Kind phrases like \"I hear you\" are more helpful than quick judgments. Practical support such as sharing notes, walking with them to see a teacher, or checking in later shows consistent care.","E":"When a classmate felt overwhelmed by homework, my group created a shared document and split topics to summarise. We also reminded him to take short breaks and invited him to sit with us at recess. After a few days, he caught up and thanked us for keeping things simple and friendly.","A":"Thoughtful support is about steady presence and small actions that remove stress step by step.","K":"Thus, students can help by listening well, speaking kindly, and backing up their words with practical help."}],"advanced":[{"S":"Yes, I would offer comfort to a family member like the one in the picture because emotional support at home builds resilience for the whole family and deepens our bonds.","P":"Comforting someone starts with noticing cues such as quieter speech, tense shoulders, or repeated worries. Sitting close, keeping a calm tone, and holding a hand can lower anxiety. After listening, I would help with next steps, like arranging transport for appointments or preparing meals, so the person feels cared for and not burdened.","E":"When my father was stressed about work, I offered a cup of tea and said I was ready to listen. He shared his deadlines, and I helped by packing his laptop bag, charging his devices, and writing a simple checklist he could follow the next morning. I also kept the house quieter so he could rest early. He told me those small gestures made him feel supported and less alone in solving the problem.","A":"Providing steady comfort and practical help turns love into action and gives family members energy to face challenges.","K":"Therefore, I would always offer comfort like the one in the picture because a calm presence plus useful help can lift a heavy heart."},{"S":"Yes, I comforted a teammate who felt responsible for our CCA's loss at a competition.","P":"I wanted to prevent negative self-talk from growing, so I acknowledged his feelings and reminded him that performance depends on many factors, not one person. Then, we focused on learning.","E":"After the match, I walked with him away from the crowd and said, \"You worked hard. Let's look at what we can improve together.\" We reviewed video clips, identified two drills to fix common mistakes, and scheduled practice times. I also checked in with him midweek to see how he was coping. At the next friendly, he played more confidently and thanked me for standing by him.","A":"Comfort is not only about words. It is a commitment to help the person move forward with support.","K":"So yes, I have comforted someone, and I learnt that empathy paired with a plan can restore courage."},{"S":"Students can support friends by creating a safe space to talk, suggesting manageable steps, and following up consistently.","P":"A safe space means privacy, patience, and no teasing. Manageable steps could be asking a teacher for an extension, setting mini goals, or arranging a study buddy. Follow-up matters because recovering from a low mood often takes time, and steady check-ins show real ca
