re.","E":"When a classmate struggled after a family illness, a few of us formed a support circle. We rotated sending homework photos, paired up for revision, and reminded him about self-care like meals and sleep. We also informed our form teacher so he had adult support. Over the term, his attendance stabilised and his smile returned.","A":"This showed me that structured kindness, not just one-time comfort, helps friends regain balance.","K":"I encourage all students to try offering thoughtful support, which includes listening first, acting with small steps, and showing up until the person feels strong again."}],"audio":{"basic":"audio/kind-9-basic.mp3","adv":"audio/kind-9-adv.mp3"}},{"n":10,"img":"img/kind-10.jpg","see":"I see a line of primary school students standing at the front of a classroom, smiling as they present a wrapped gift and a small bouquet to their teacher. A girl in front is holding a card, while the boy beside her is offering the present with both hands. The teacher is smiling warmly and reaching forward to receive it. Behind them, a noticeboard displays class work and posters, and desks are arranged neatly. The scene looks celebratory and respectful, like a class appreciation moment for a teacher.","think":["Object: A wrapped gift, bouquet, and handwritten cards - They show effort, thoughtfulness, and a desire to express gratitude clearly.","Setting: A bright classroom with student works on display - It highlights a learning community where relationships and appreciation are part of daily life.","Action: Students presenting a gift while the teacher receives it graciously - It suggests respect, thankfulness, and mutual encouragement.","Gratitude and recognition","Respect for mentors","Class unity and teamwork","Positive classroom culture"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"Yes, my class surprised our teacher with a card and a small plant after exams to thank her for staying back to tutor us.\n if lwere in this picture, I would...\n I would help organise the card, write a sincere message, and present the gift politely with both hands."},{"prompt":"I feel this is important because...","answer":"Showing appreciation motivates teachers and reminds us to notice people who support us every day."}],"questions":["How do you think the people in the photograph are feeling, and why do you think so?","Can you share about a time you showed gratitude to someone who supported you?","Why is it important to show appreciation to those who help us?"],"basic":[{"S":"The people in the photograph are all beaming with joy, probably because of the positive and loving atmosphere of the class.","P":"There is a line of students standing at the front of the classroom. A boy is politely offering a wrapped gift with both hands, while a girl holds a handmade card. They are grinning from ear to ear. The teacher is smiling brightly as she reaches out to receive the present, looking very touched.","A":"So, I believe that everyone in the photograph is in high spirits too as they share this moment of gratitude.","K":"The similar experience with my class showed me that showing appreciation builds stronger relationships and a positive learning atmosphere."},{"S":"Yes, I showed gratitude to my CCA coach after she helped me improve my stamina.","P":"She designed extra drills and checked on my progress weekly, so I wanted her to know that her effort made a real difference.","E":"After the term ended, I wrote a letter describing how her tips cut my timing by thirty seconds and boosted my confidence. I also created a small photo collage of our training sessions and thanked her in front of the team. She said the letter encouraged her on a tough day and reminded her why she enjoys coaching. That moment taught me that specific, heartfelt thanks can be very meaningful.","K":"Now, I try to give clear feedback and a sincere thank you whenever someone supports me."},{"S":"It is important because appreciation encourages people, teaches humility, and reminds us not to take kindness for granted.","P":"When we acknowledge effort, the person feels seen and valued, which motivates them to keep doing their best. Saying thank you also helps us notice the support we receive daily from teachers, parents, and friends.","E":"One time, after a librarian guided me to research sources, I returned with a note and shared how the books improved my project. She smiled and later recommended more titles to our class. Because I showed appreciation, she was eager to continue helping us. I realised gratitude opens doors to more guidance and trust.","A":"Thankfulness benefits both giver and receiver by building goodwill and cooperation.","K":"That is why we should express appreciation regularly, not only on special days."}],"advanced":[{"S":"I believe everyone in the photograph is over the moon. Furthermore, the atmosphere is heartwarming and celebratory, showing a strong bond between the teacher and her pupils. I see a group of students eagerly waiting to present their tokens of appreciation. One boy is respectfully offering a wrapped gift with both hands, while a smiling girl beside him holds a card. The teacher is beaming with delight, clearly moved by their gesture. Everyone is ecstatic because expressing gratitude always brings joy to both the giver and the receiver.","E":"This scene resonates with me because my class once organised a similar surprise. To thank our English teacher for her unwavering dedication during the exam period, we compiled a scrapbook of heartfelt messages. When we presented it to her, she was visibly moved. That moment made us realise that our gratitude motivated her just as much as her teaching helped us.","A":"Therefore, I am certain the people in the picture are feeling a deep sense of fulfillment too as they express their sincere thanks.","K":"Such acts of kindness foster mutual respect and strengthen the sense of unity within the class."},{"S":"Yes, I thanked my form teacher for guiding me through a stressful group project by combining words with action.","P":"I wanted to express thanks clearly and also prove I had learnt from her advice about planning and responsibility.","E":"After the project, I wrote a detailed note and attached our revised timeline to show how her tips improved our workflow. I also volunteered to mentor a younger group using the same planning template. Later, I updated her that the juniors finished on time and felt confident. She said seeing the ripple effect of her guidance was the best thank you.","A":"Turning gratitude into action showed respect and multiplied the impact of her help.","K":"Thus, I learnt that the strongest appreciation combines sincere words with continued good practices."},{"S":"Showing appreciation is important because it reinforces positive behaviour, deepens relationships, and develops our character.","P":"When we thank people specifically, we highlight what worked and encourage more of it. Recognising help also keeps us humble and aware that success is shared. Over time, a culture of gratitude reduces complaints and increases cooperation.","E":"Our class started a weekly \"shout-out\" board where we posted short notes to thank classmates and staff, from our class chairperson to the cleaning aunty. The board changed our tone. People volunteered more, and even conflicts were handled with more patience because we were used to noticing good actions.","A":"Gratitude is not just polite. It is a system that shapes attitudes and behaviour.","K":"Therefore, appreciating others is essential if we want a supportive environment that brings out everyone's best."}],"audio":{"basic":"audio/kind-10-basic.mp3","adv":"audio/kind-10-adv.mp3"}}]},{"id":"family","name":"Family & Friends","short":"Family & Friends","zh":"家庭与朋友","color":"#8B5CF6","sets":[{"n":1,"img":"img/family-1.jpg","see":"I see a family of four cooking together in the kitchen. The mother is stirring food in a frying pan while the father and daughter smile as they watch. The son is helping by peeling or preparing ingredients over a bowl. There are vegetables, a chopping board, and tomatoes on the counter. Everyone looks happy and engaged in the activity.","think":["Object: Cooking utensils and ingredients - This suggests that the family is preparing a meal together at home. It shows teamwork and the importance of daily routines like cooking.","Setting: Home kitchen - The neat kitchen with simple tools and fresh ingredients suggests a cosy home environment where family members feel comfortable working together. It also hints at healthy eating and shared responsibilities.","Action: Family cooking together - This shows family bonding, cooperation, and learning life skills. It may also suggest that the family values spending quality time with each other.","Family bonding","Teamwork and cooperation","Healthy living and cooking at home","Learning life skills"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the time my family cooked dinner together during\n the school holidays. I helped to cut vegetables while my parents prepared the main dishes. We laughed a lot and enjoyed the meal afterwards."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would help by washing the vegetables or setting the table so that the cooking would be easier for everyone."},{"prompt":"I feel this is important because...","answer":"I think this is important because cooking together helps family members feel closer and teaches us important skills we can use in the future."}],"questions":["What do you think the family in the picture is feeling? Why do you think so?","Share about a time you did something together with your family.","Do you think it is important for children to learn how to cook? Why or why not?"],"basic":[{"S":"I think the family feels joyful because they seem to be having fun cooking together.","P":"Cooking together allows us to spend quality time as a family while learning new skills. It also helps us feel more involved in family life.","E":"For example, I once helped my mother bake cookies during the school holidays. I measured the flour and cracked the eggs while she guided me. We laughed when I spilled a little sugar, but the cookies turned out delicious in the end.","A":"That experience made me realise that cooking with family is not just about preparing food but also about enjoying the process together.","K":"So, I believe the family is experiencing happiness because they can strengthen their family bond while having fun at the same time."},{"S":"I remember when my family and I worked together to decorate our house for Christmas.","P":"It was special because everyone had a role to play, and it made our home feel warm and festive.","E":"For example, my father set up the Christmas tree while my mother helped hang up the lights. My sister and I were in charge of placing the ornaments on the branches. We played music in the background and laughed whenever the ornaments fell off. At the end, we switched on the lights together, and the tree looked beautiful. That experience made me feel proud because we had all worked together to achieve something as a family.","K":"Therefore, I feel that the moments I spend with my family are memorable because they bring us closer as a family."},{"S":"Yes, I think it is important for children to learn how to cook because it is a useful life skill.","P":"Knowing how to cook means we can take care of ourselves and our families when we are older. It also encourages us to eat more healthily instead of relying on fast food.","E":"For example, my cousin, who is in secondary school, already knows how to prepare simple dishes like fried rice and noodles. When his parents are busy, he can cook for himself, and sometimes he even prepares meals for the whole family. His parents are proud of him, and he feels more reliable.","A":"That made me realise that learning to cook helps children become more independent and responsible.","K":"Therefore, I think children should learn cooking because it is a skill that will benefit them for the rest of their lives."}],"advanced":[{"S":"I think the family is feeling shared happiness because cooking together is a meaningful way to connect and learn from each other.","P":"Firstly, cooking together teaches responsibility since everyone has a part to play. Secondly, it allows us to learn family recipes and cooking skills that we can use in the future. Finally, it gives us a chance to bond in a relaxed and enjoyable way.","E":"For example, last Chinese New Year, my family prepared dumplings together. My grandmother showed us the traditional way to fold them, my parents prepared the filling, and my sister and I tried shaping them. Although mine looked a little funny, everyone laughed, and it became a happy memory.","A":"That experience showed me that cooking together is not only about food but also about creating moments we will remember for years.","K":"In conclusion, the family finds joy in cooking together because it promotes bonding and skill-building."},{"S":"One time, my family and I spent the whole weekend cleaning and reorganising the house before Chinese New Year.","P":"It was meaningful because it was not just about making the house neat but also about preparing together for an important celebration. Working as a team made the task faster and more enjoyable.","E":"My father cleaned the windows while my mother tidied the kitchen. My sister helped to dust the shelves, and I vacuumed the floor. At first, I thought it would be tiring, but because we joked and talked while doing the chores, it felt much easier. After we finished, the house looked fresh and ready for guests. That night, we all ordered food and celebrated our hard work together.","A":"That experience showed me that even simple tasks become more meaningful when the whole family is involved. It is not the task itself that matters most, but the spirit of teamwork and togetherness.","K":"In conclusion, I believe doing things together as a family creates lasting memories and teaches us to value teamwork."},{"S":"I strongly believe it is important for children to learn how to cook because it prepares them for the future and teaches them valuable lessons.","P":"Firstly, cooking helps children develop independence since they will not always be able to rely on parents or helpers. Secondly, it teaches patience, creativity, and responsibility, especially when handling food safely. Lastly, it encourages healthier eating habits, as children will learn to make meals with fresh ingredients instead of unhealthy snacks.","E":"For example, I once learnt how to cook scrambled eggs with my mother. At first, I made mistakes, like burning the eggs or adding too much salt, but she encouraged me to keep trying. Over time, I improved, and now I can prepare breakfast for my family on weekends. It makes me proud to contribute, and my family appreciates the effort.","A":"That experience showed me that cooking is not just a practical skill but also a way of showing care for others.","K":"In summary, I think children should learn how to cook because it makes them independent, responsible, and more caring family members."}],"audio":{"basic":"audio/family-1-basic.mp3","adv":"audio/family-1-adv.mp3"}},{"n":2,"img":"img/family-2.jpg","see":"I see a group of students wearing school uniforms and backpacks. They are cleaning up litter outdoors. Some students are using tongs to pick up rubbish while another student is holding a large black trash bag. They are wearing gloves for safety. An adult, possibly their teacher, is standing nearby supervising them. The background shows tall residential buildings, suggesting that they are cleaning up a neighbourhood area.","think":["Object: Gloves, trash bag, and tongs - This suggests that the students are doing a clean-up activity. The equipment shows they are taking safety and hygiene seriously while helping the environment.","Setting: Neighbourhood outdoor space - The residential area suggests that they are helping to keep their community clean, which benefits both residents and the environment.","Action: Students picking up litter - This shows responsibility, teamwork, and care for the environment. It also suggests that schools encourage students to give back to the community through service activities.","Caring for the environment","Teamwork and cooperation","Responsibility and community service","Good habits and values in action"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the time my class took part in a school clean-up\n project. We picked up rubbish around the school compound and even sorted the items into recycling bins."},{"prompt":"If I were in this picture, I would...","answer":"if I were in this picture, I would help by holding the trash bag open for my classmates and making sure the rubbish goes in safely."},{"prompt":"I feel this is important because...","answer":"&. I think this is important because keeping our surroundings clean makes the place more pleasant for everyone and also shows respect for the environment."}],"questions":["Why do you think the students are doing this activity together in groups rather than on their own?","Can you describe a time when you and your friends worked together?","Do you think students should be involved in community activities? Why or why not?"],"basic":[{"S":"I think the students are doing this activity in groups because it is easier and more fun to work together.","P":"Working in groups allows us to help each other and finish the task faster. It also gives us a chance to talk and enjoy each other's company while doing something useful.","E":"For instance, when my friends and I were tasked to tidy up the classroom after school, we dreaded it. However, we encouraged one another, and in the end, we had more fun than expected.","A":"That experience showed me that any activity can be enjoyable when done with friends.","K":"So, I think the students are cleaning together so they can share the work and have fun at the same time."},{"S":"One time, my friends and I worked together to create a Science project for our school's exhibition.","P":"It was meaningful because we had to plan, cooperate, and make sure everyone contributed fairly. Working together also helped us finish the project more quickly.","E":"For example, my group researched renewable energy. I was in charge of designing the poster, while my friends built a model of a windmill. We stayed back after school a few times to practise our presentation. On the exhibition day, we explained everything confidently to visitors, and our teacher praised us.","A":"That experience taught me that teamwork is important because everyone has different strengths and when we combine them, the result is better.","K":"Therefore, I think working on projects with friends is not only useful for learning but also for building cooperation."},{"S":"Yes, I think students should be involved in community activities because it helps them learn good values and connect with others.","P":"When students take part in such activities, they learn responsibility and kindness. They also get to meet new people and understand the needs of the community better.","E":"For example, my school once organised a visit to an elderly home. We sang songs, played games, and chatted with the elderly residents. I was hesitant to join at first because I was nervous to interact with the elderly. However, when I saw how happy they were, I felt proud to be part of it.","A":"That experience taught me that sacrificing something small, like our time, can brighten someone's day and make the community stronger.","K":"Therefore, I think students should be involved in community activities because it builds their character and helps them contribute meaningfully."}],"advanced":[{"S":"The students are working in groups because teamwork makes the activity more manageable and enjoyable.","P":"Firstly, working in groups allows everyone to help each other and share responsibilities. Secondly, tasks can be completed faster because the workload is divided. Lastly, being around others allows us to talk, laugh, and enjoy each other's company.","E":"For example, my teacher asked us to work in groups to research a topic in the library. We split the tasks. One of us searched for information, another took notes, and the rest helped with organising ideas. I used to find doing research boring, but working with my group mates made it less tedious. We even scored an A for the project!","A":"That experience showed me that teamwork can turn a difficult task into a pleasant one.","K":"Therefore, I believe the students in the picture are working together because it combines fun, teamwork, and responsibility."},{"S":"I remember a time when my friends and I worked together to organise a small charity bake sale at school.","P":"Firstly, it was meaningful because we had to work as a team to plan and carry out the activity. Secondly, it was impactful because we were able to raise awareness about the charity and why it mattered. Lastly, it was rewarding because we reached our fundraising goal and could see the results of our teamwork.","E":"For example, while some of us prepared the cupcakes, others decorated the tables and handled the money. It made us proud to know we had done something useful for the charity. On top of that, we had accomplished something that required so much effort and cooperation.","A":"That experience showed me that teamwork makes big tasks easier, and it also gave a sense of achievement as a group.","K":"In summary, I think working with friends is a valuable experience because it teaches us responsibility, cooperation, and how to work towards a common goal."},{"S":"Yes, I strongly believe students should be involved in community activities because they help us grow into responsible and caring individuals.","P":"Firstly, these activities give students the chance to practise empathy and kindness by helping others. Secondly, they teach responsibility, since students must manage their time and effort to contribute. Lastly, they give students a sense of belonging, as they see themselves playing a role in improving society.","E":"For example, I once joined a food donation drive with my classmates. We collected canned food and packed them into boxes for families in need. At first, I thought our contribution was small, but when I saw the gratitude on the families' faces, I realised how meaningful it was. That experience inspired me to continue helping whenever I have the chance.","A":"This made me realise that community activities are not only about helping others, but also about becoming more thoughtful and responsible ourselves.","K":"To conclude, I believe students should definitely be involved in community activities because they build strong values, bring people together, and prepare us to be active citizens in the future."}],"audio":{"basic":"audio/family-2-basic.mp3","adv":"audio/family-2-adv.mp3"}},{"n":3,"img":"img/family-3.jpg","see":"I see an elderly man and a young girl sitting on the floor together. The elderly man is showing the girl how to weave a basket, and both of them are using their hands carefully to work with the weaving materials. The girl is watching closely while trying it herself. They look calm and focused. The background shows a living room with a sofa and a cupboard.","think":["Setting: Home living room - The homely setting suggests that this is a personal and meaningful activity, showing how traditions can be kept alive within families.","Action: Grandfather teaching granddaughter - This shows the passing down of knowledge, patience, and bonding between different generations. It also suggests that traditions and values can be preserved through family members.","Passing down traditions","Intergenerational bonding","Patience and learning","The importance of family time"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the time my grandmother taught me how to sew a\n simple button onto my shirt. It was a bit tricky at first, but I enjoyed learning from her."},{"prompt":"If I were in this picture, I would...","answer":"if I were in this picture, I would listen carefully to my grandfather's instructions and try my best to weave the basket neatly."},{"prompt":"I feel this is important because...","answer":"I think this is important because it helps keep family traditions alive and allows younger people to learn useful skills from their elders."}],"questions":["Would you enjoy learning a traditional skill like weaving with your grandparents or with the elderly? Why or why not?","Share about a time someone in your family taught you a skill.","Do you think it is important to learn traditional skills from older people? Why or why not?"],"basic":[{"S":"Yes, I would enjoy learning a traditional skill like weaving with my grandparents because it looks interesting and meaningful.","P":"It would give me the chance to spend more time with them and also learn something unique that I cannot learn from school.","E":"For instance, I once learnt how to make ondeh-ondeh with my grandmother. She showed me how to roll the glutinous rice dough and fill it with gula melaka. Although mine kept breaking at first, we laughed it off, and it became a happy memory.","A":"That experience showed me how learning from grandparents can strengthen our bond.","K":"So yes, I would enjoy weaving with my grandparents because it teaches skills and builds memories at the same time."},{"S":"I once learnt how to play Chinese chess from my grandfather.","P":"It was special because he not only taught me the rules of the game but also shared his strategies and stories about playing with his friends when he was young.","E":"At first, I found it confusing, but he encouraged me to practise. After a few games, I managed to win one round, and he praised me for improving. I felt very proud and happy.","A":"That moment showed me that learning from older family members is meaningful because it creates shared memories.","K":"That's why in the future, I also want to teach and pass down my skills to a family member."},{"S":"Yes, I think it is important to learn traditional skills from older people.","P":"They have valuable knowledge and many years of experience. These skills are part of our culture, and if we do not learn them, they might be forgotten. By learning from older people, we can understand our roots better and keep traditions alive.","E":"For example, my grandmother once taught me how to make kueh lapis, a traditional snack. I realised it took a lot of effort, from preparing the ingredients to carefully layering the batter. This made me appreciate my culture more because I saw how much care went into something that I had always enjoyed eating.","A":"That experience showed me that traditions are not just activities, but a way to connect with our families and our past.","K":"That is why I believe it is important to learn traditional skills from older people. They help us appreciate our culture and make sure these traditions continue into the future."}],"advanced":[{"S":"Yes, I would definitely enjoy learning a traditional skill like weaving with my grandparents because it is both meaningful and enriching.","P":"Firstly, it would allow me to connect more deeply with my grandparents by learning something they know well. Secondly, it gives me the chance to understand more about my family's traditions and culture. Lastly, I would gain a special skill that is not commonly practised today.","E":"For example, my grandmother once taught me how to make kueh during a festive season. She shared stories about how she used to prepare it for her family when she was young. While cooking, she explained why the recipe was important to her. It gave me a chance to understand her, and I felt proud to be part of that tradition.","A":"That experience showed me that learning from grandparents is not just about skills, but also about understanding the values and memories behind them.","K":"To summarise, I would enjoy learning weaving because it connects me to my family, teaches me culture, and creates lasting memories."},{"S":"I remember learning how to bake a traditional cake from my aunt, who had learnt it from my grandmother.","P":"Firstly, it was special because she passed down a family recipe. Secondly, she shared stories about my grandmother while we baked, which brought our family history to life.","E":"I helped my aunt measure the flour and mix the batter. At first, I was clumsy and spilled some flour, but she encouraged me by saying my grandmother had made the same mistakes when learning. When the cake was done, we tasted it together, and she said I did a good job in recreating the cake. That made me feel both proud and connected to my family's traditions.","A":"That moment made me realise that when older family members teach us something, they are not just teaching skills but also sharing part of our family's story.","K":"Therefore, I look forward to sharing my skills with younger family members one day, just as others have done for me."},{"S":"Yes, I believe it is very important to learn traditional skills from older people.","P":"These skills are part of our culture and identity. If younger generations do not learn them, many traditions could be lost. Besides, learning from older people allows us to build stronger bonds with them and appreciate their wisdom.","E":"For example, I once joined a workshop where elderly volunteers taught us how to weave simple handicrafts. They told us stories about how these items were used in the past. I realised that the skill was not just about making objects, but also about understanding the history and meaning behind them.","A":"That experience made me appreciate how traditional skills carry stories and values that should be preserved.","K":"That is why I strongly believe learning traditional skills from older people is important, as it helps us preserve culture, gain knowledge, and connect with the past."}],"audio":{"basic":"audio/family-3-basic.mp3","adv":"audio/family-3-adv.mp3"}},{"n":4,"img":"img/family-4.jpg","see":"I see two students sitting at a desk in a classroom. They are smiling and working together on a model of the solar system. The girl is holding a stick and pointing at one of the planets, while the boy is adjusting another planet on the stand. Both of them look happy and engaged. In the background, there is a bookshelf with books and a whiteboard, which shows that they are in a learning environment.","think":["Object: Solar system model - This suggests that the students are learning science in a hands-on way. It shows that learning can be interactive and fun.","Setting: Classroom - The classroom setting suggests that this is part of a school lesson or project. It also highlights that students learn best when they are curious and active participants.","Action: Students working together on the model - This shows teamwork, cooperation, and shared interest in learning. It also suggests that friends can support each other in their studies and make the experience more enjoyable.","Friendship and cooperation","Learning together","Curiosity and exploration","Teamwork in school"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the time I worked with my classmate to build a\n volcano model for a science project. We had to paint it and make sure it could erupt with baking soda and vinegar."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would share my ideas with my friend and listen to her suggestions so that we could finish the project well."},{"prompt":"I feel this is important because...","answer":"I think this is important because working with friends makes learning\n more enjoyable and helps us understand things better through sharing ideas."}],"questions":["How do you think the people in the picture are feeling, and why do you think so?","Share about a time you worked on a project with your classmates.","Do you think it is helpful to study with friends? Why or why not?"],"basic":[{"S":"I think the students in the picture are cheerful and having fun during their lesson.","P":"In the picture, a boy and a girl in school uniform are working together on a model of the solar system. Their hands are busy adjusting the planets, and both wear gigawatt smiles on their faces. They may be chatting and laughing, as working with friends can make learning more enjoyable.","E":"For instance, I am very good friends with my tablemate, Sarah. Whenever the teacher assigns us pair work, we get excited and work extra hard to complete the task first. We often bounce ideas off each other, which helps us arrive at answers quicker.","A":"Therefore, I think the friends in the photograph are also having a whale of a time as they work on their model together.","K":"I am sure that many students also agree that it is more fun to work with our friends!"},{"S":"I remember when my classmates and I worked together to prepare a performance for International Friendship Day.","P":"We had to plan the script, rehearse our lines, and work as a team to make sure the show went smoothly.","E":"I played the narrator while some of my friends acted as characters. We made mistakes during rehearsals, but we encouraged one another and improved each time. On the day of the performance, everything went well, and we felt very proud.","A":"That taught me that projects are not just about the final result, but also about learning teamwork and perseverance.","K":"Overall, working on projects with classmates is meaningful because it builds both confidence and cooperation."},{"S":"Yes, I think studying with friends is very helpful.","P":"It allows us to share different ideas and help each other understand difficult topics. We can explain things in a way that is easier for us to understand. If someone is confused, another friend can offer a new perspective, which makes the learning process faster and more fun!","E":"For example, when my friends and I prepared for a Math test together, I struggled with fractions, but my friend showed me a shortcut that made it much simpler. Because we practised together, we all felt more confident.","A":"That experience proved to me that we can achieve better results when we support each other's learning.","K":"Thus, I think studying in a group is a great way to prepare for exams and understand lessons better."}],"advanced":[{"S":"I believe the students in the picture are feeling enthusiastic and having a delightful time during their lesson.","P":"In the image, a boy and a girl in school uniform are collaborating on a model of the solar system. As they meticulously adjust the planets, both have radiant smiles on their faces. They are likely engaging in lighthearted conversation, as working alongside peers can make even a complex task feel much more engaging. For instance, I share a strong bond with my classmate, Sarah. Whenever our teacher assigns pair work, we are eager to start and strive to complete the task efficiently. We often brainstorm and exchange ideas, which allows us to solve problems more effectively than if we were working alone.","A":"This goes to show that the friends in the photograph are also thoroughly enjoying themselves as they build their project together.","K":"Ultimately, I am certain many students would agree that collaborating with friends makes the learning process far more rewarding."},{"S":"I remember when my group and I worked on a history project about Singapore's landmarks.","P":"It was a valuable experience because we had to do research, present our findings, and also practise speaking confidently.","E":"I designed a poster of the Merlion, while my classmates prepared slides about the Esplanade and Marina Bay Sands. During the presentation, I explained my part and also supported my group by answering questions from our teacher. In the end, we received good feedback for being well- prepared.","A":"That experience showed me how working in a team helps us learn more effectively, since everyone contributes different strengths.","K":"All in all, I think projects with classmates are meaningful because they develop both knowledge and teamwork skills."},{"S":"In my opinion, studying with friends is a double-edged sword. While it can be effective, it can also become quite distracting if the group is not disciplined.","P":"On the positive side, friends can offer fresh perspectives and explain difficult concepts in a way that is easy to understand. However, the social nature of a group means that conversations can easily drift off-topic. Instead of focusing on the syllabus, students might find themselves chatting about hobbies or games, which makes the study session unproductive.","E":"For instance, during a recent Science revision session, my friends helped me understand the process of photosynthesis much faster. However, once we finished that topic, we spent the next hour discussing a new movie instead of moving on to the next chapter. We had a great time, but we did not finish our planned revision.","A":"This experience taught me that while peer support is great for learning, the presence of friends also makes it much harder to maintain focus.","K":"Thus, I believe group study is only effective if everyone makes a conscious effort to stay on task and save the socialising for after the work is done."}],"audio":{"basic":"audio/family-4-basic.mp3","adv":"audio/family-4-adv.mp3"}},{"n":5,"img":"img/family-5.jpg","see":"I see a mother helping her child with his homework. Another sibling is in the background with another parent, sitting quietly reading a book. The room is softly lit with a lamp, showing a calm and cosy atmosphere. Books are placed on the table and there is a school bag on the chair. The family looks relaxed and focused.","think":["Object: Books and school bags - This suggests that they are a family that values education and learning.","Setting: Home living room - The setting shows that the family creates a comfortable and supportive learning environment at home.","Action: Family doing homework and reading together - This shows responsibility, teamwork, and support for learning. It also highlights the value of spending family time on meaningful activities like studying.","Family bonding through meaningful activities","Support systems at home","Patience and learning","Building discipline and good habits"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"&. This reminds me of the time my dad helped me with my art project. I didn't know how to draw, but my dad is an artistic person so he showed me how to do a simple sketch.\n If were in this picture, I would... if I were in this picture, I would try my best to focus while being taught how to answer difficult questions."},{"prompt":"I feel this is important because...","answer":"I think this is important because parental guidance helps children learn effectively, builds confidence, and shows that parents care about their child's progress."}],"questions":["What do you think is happening in the picture?","Share about a time you received help from a family member.","Do you think families should do more activities together? Why or why not?"],"basic":[{"S":"I think the mother is helping her child with homework.","P":"When a parent helps a child with homework, it makes it easier for the child to understand difficult questions. It also gives the child confidence because they know someone is there to guide them.","E":"For instance, I remember when I struggled with my math homework, my older brother and parents helped me step by step. After an hour, I finally understood how to solve the problem, and I could finish the rest of the questions easily.","A":"That experience showed me that with my family's support, I can overcome any difficulties.","K":"So in the picture, I believe the parent is helping the child tackle challenges he may face in his homework."},{"S":"I remember when my father helped me learn how to ride a bicycle.","P":"Learning to ride a bike was scary because I was afraid of falling and getting hurt. Having my father there made me feel safer and more willing to try.","E":"My father spent the whole morning helping me at the park. He patiently held the back of my seat while I learnt to balance and pedal. After two long hours, I could finally pedal on my own without my father's help.","A":"That experience showed me that help from others can give me confidence to try difficult things.","K":"In summary, I believe it was my father's help that day that made me succeed in riding a bicycle."},{"S":"Yes, I think families should do more activities together because it strengthens relationships and creates fond memories.","P":"When families spend time together, they communicate more openly, build deeper understanding, and become more supportive of one another.","E":"For example, during the school holidays, my family often plays badminton at the nearby court. We laugh, cheer one another on, and sometimes even compete in friendly matches.","A":"These small activities keep us close and make family life happier.","K":"Therefore, I believe family activities are important for bonding and should be encouraged."}],"advanced":[{"S":"I believe the mother is helping her child with homework.","P":"When parents help with homework, it makes a real difference because you don't feel alone and have someone to turn to when something is confusing. They guide you through the problem instead of just giving you the answer which actually helps you learn better.","E":"For instance, I once had trouble understanding a Science topic about the water cycle. My mother sat down with me after dinner and used simple examples, like explaining how water boils in the kettle, to help me grasp the concept. Her patient guidance made the topic much clearer, and I did well on the test the next day.","A":"That showed me that with support from someone who cares, learning doesn't have to be so stressful.","K":"Therefore, I believe the parent in this picture is helping her child build both understanding and confidence for future learning."},{"S":"I once received help from my brother when I was afraid of swimming in deep water.","P":"I had a fear of deep water after nearly drowning when I was a young child. My brother's help was important because he understood my fear and didn't rush me. He stayed with me and helped me build confidence gradually.","E":"I remember when my family went to the beach, everyone went into the deep sea while I stayed closer to shore. My brother noticed and offered to help by slowly going deeper while holding my hand. He also taught me floating techniques. By the end of that day, I was swimming in water deeper than my head which was something I never thought I could do.","A":"That experience showed me that having someone to help you through difficult moments can make the impossible feel possible.","K":"Thus, my brother's help gave me not just swimming skills, but also the courage to face other challenges in my life."},{"S":"Yes, I strongly believe families should do more activities together because it builds stronger bonds and creates lifelong memories.","P":"When families spend time together, they are able to connect better, resolve conflicts more easily, and be there for each other. These activities also provide opportunities to teach important values.","E":"For example, my family once went on a three-day hiking trip to Malaysia. We encouraged one another when the climb got tough, shared snacks along the way, and celebrated when we reached the summit. That experience showed me how much stronger we are when we work as a family unit.","A":"It also made me realise that family activities are not only fun but also build teamwork and communication.","K":"To summarise, family activities are essential because they foster love, trust, and unity."}],"audio":{"basic":"audio/family-5-basic.mp3","adv":"audio/family-5-adv.mp3"}},{"n":6,"img":"img/family-6.jpg","see":"I see a family gathered around a table celebrating a birthday. A girl is sitting in front of a cake with lit candles, smiling happily as everyone claps and cheers. Around her are children and adults, including her parents and grandparents, who look joyful. There are also bowls of fruits on the table, and a party hat on one of the younger children. Decorations such as bunting can be seen in the background, making the setting festive.","think":["Object: Birthday cake and decorations - This suggests that the family is celebrating a special occasion together, making the moment memorable for the child.","Action: Family clapping and smiling as the girl makes a wish - This shows love, encouragement, and joy shared between family members. It suggests the importance of celebrating family traditions.","Family bonding","Celebrating milestones together","Love and encouragement","Creating happy memories"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the time my family celebrated my younger\n brother's birthday. We decorated the living room, ordered his favourite cake, and surprised him with a song."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would clap along and cheer loudly for the birthday girl to make her feel special."},{"prompt":"I feel this is important because...","answer":"I think this is important because birthdays and celebrations help families bond and create joyful memories that we can look back on."}],"questions":["Do you celebrate birthdays with your family in this way? Why or why not?","Share about a time your family celebrated a special occasion.","Do you think family celebrations are important? Why or why not?"],"basic":[{"S":"Yes, I do celebrate birthdays with my family like this because it feels warm and joyful.","P":"Having my family gathered around me makes the celebration more special than just getting presents. It is a chance to spend meaningful time with the people I care about most.","E":"For example, during my last birthday, my parents and grandparents surprised me with a cake at home. We sang songs, laughed, and shared stories while eating. I felt really happy and loved.","A":"That celebration showed me that birthdays are not about fancy parties, but about the people who celebrate with you.","K":"So yes, my family and I celebrate our birthdays like this because it makes all of us happy."},{"S":"I remember celebrating Chinese New Year with my family, which is always a meaningful time.","P":"It is special because everyone comes together, even relatives I do not see often. We eat together, exchange greetings, and show respect to our elders.","E":"Last year, my cousins and I played card games while our parents caught up with one another. My grandparents gave us red packets and reminded us to study hard. The house was filled with laughter the whole day.","A":"That experience showed me how celebrations make us more united and remind us of our traditions.","K":"In summary, I always look forward to celebrations with my family because of the joy they bring."},{"S":"Yes, I think family celebrations are very important because they help us stay close and connected.","P":"In our busy lives, celebrations give us time to pause, gather together, and appreciate one another. They also make family members feel loved and valued.","E":"For instance, during my father's birthday, my sister and I planned a small surprise dinner. He was touched because we took the effort to make it special. That evening was simple, but it was full of warmth.","A":"Moments like that showed me that celebrations matter, no matter how small they are.","K":"Therefore, I believe family celebrations are important because they keep relationships strong and meaningful."}],"advanced":[{"S":"Yes, I celebrate birthdays with my family in this way because it feels meaningful and personal.","P":"Firstly, being surrounded by family members makes me feel loved and supported. Secondly, simple home celebrations are often more memorable because they are filled with laughter and casual conversations. Lastly, sharing a meal and cake together creates an atmosphere of warmth and togetherness. For example, on my last birthday, my grandparents came over to join us for dinner. My mother cooked my favourite noodles, and after we cut the cake, my family shared stories from when I was younger. Even though it was just at home, I felt special because everyone was celebrating me.","A":"That celebration taught me that birthdays are not about having a big party, but about the love and effort shown by family.","K":"In conclusion, my family and I do celebrate birthdays like this because they are full of warmth, meaning, and happy memories."},{"S":"One of the most memorable celebrations I had with my family was during my grandmother's 70th birthday.","P":"We wanted to make it extra special because reaching that age is a big milestone. Everyone helped in different ways. My parents planned the dinner, my cousins prepared a song, and I designed a birthday card.","E":"During the dinner, my grandmother looked very happy as she cut her cake surrounded by children and grandchildren. She even teared up when we sang for her, saying it was one of the happiest days of her life. That moment stayed in my heart because I saw how much our efforts meant to her.","A":"That experience taught me that family celebrations are about showing love and appreciation, not just about food and gifts","K":"Thus, my family always makes sure to celebrate special occasions together because it strengthens bonds across generations."},{"S":"Yes, I strongly believe family celebrations are important because they give families a chance to connect and show care for one another.","P":"Celebrations are not only about marking important dates, but also about creating happy memories that last a lifetime. They bring everyone together, even relatives who may live far away. They also teach younger members of the family the value of traditions and togetherness.","E":"For example, during Christmas, my extended family gathers at my grandparents' house. Although everyone has busy lives, this celebration ensures we see one another at least once a year. I remember making hot chocolate with my cousins while the adults chatted happily. That yearly gathering reminds me of the strength of our family bonds.","A":"That showed me that family celebrations are not just about the occasion itself, but about cherishing the people around us.","K":"To summarise, I think family celebrations are very important because they unite families, preserve traditions, and create treasured memories."}],"audio":{"basic":"audio/family-6-basic.mp3","adv":"audio/family-6-adv.mp3"}},{"n":7,"img":"img/family-7.jpg","see":"I see a group of children playing happily at a playground. One girl is sitting on a swing while her friends are pushing her. Another boy is standing on the play structure behind them, smiling as he watches. All the children are wearing T-shirts and shorts, and they look cheerful. In the background, there are trees and a slide, showing that this is an outdoor playground.","think":["Object: Swing and playground equipment - This suggests that the children are enjoying their time outdoors and being active.","Setting: Playground in a park - The playground setting shows a safe and fun space for children to gather, play, and interact with one another.","Action: Friends pushing each other on the swing and playing together - This shows teamwork, cooperation, and the joy of friendship. It also suggests the importance of play in building strong bonds.","Friendship and teamwork","The importance of outdoor play","Cooperation and care for others","Joy and laughter in spending time together"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the time my friends and I played at the playground after school. We took turns on the swing and slide, and we laughed a lot.\n If were in this picture, I would...\n if I were in this picture, I would help push my friend on the swing while cheering her on."},{"prompt":"I feel this is important because...","answer":"I think this is important because playing together with friends helps us bond, stay active, and create happy memories."}],"questions":["Would you enjoy playing at the playground with your friends like this? Why or why not?","Share about a time you had fun with your friends.","Do you think it is important for children to spend time playing outdoors? Why or why not?"],"basic":[{"S":"Yes, I would enjoy playing at the playground with my friends because it looks exciting and fun.","P":"Playing outdoors together lets us exercise, relax, and enjoy each other's company after school.","E":"For example, I often play catch and hide-and-seek with my friends at the playground near my block. We run around, cheer loudly, and sometimes even make up new games to challenge each other.","A":"Those times always remind me that friendships grow stronger when we spend time together in fun ways.","K":"So yes, I would definitely enjoy playing at the playground with my friends because it combines both fun and friendship."},{"P":"We joined different events and supported one another, which made the day exciting. Even when some of us lost, we still clapped and cheered.","E":"During one event, I paired up with my classmate for the three-legged race. We practised moving our feet together and encouraged each other not to fall. When we crossed the finish line, we felt very proud as a team.","A":"That experience showed me that fun with friends does not only come from winning, but also from teamwork and encouragement.","K":"That's why I treasure all the fun times I've had with my friends."},{"S":"Yes, I think outdoor play is important because it helps children stay healthy and happy.","P":"It allows us to exercise, get fresh air, and also interact with other children in real life instead of just through screens.","E":"For example, during my holidays, I spent many evenings cycling with my cousins. Seeing them in real life instead of through video calls made me feel happier. We became stronger and fitter, but more importantly, we were just thankful to spend quality time with each other.","A":"That showed me that outdoor play is good for both our physical health and relationships.","K":"Therefore, I believe that outdoor play is very important for children to grow up well-rounded and happy."}],"advanced":[{"S":"Yes, I would definitely enjoy playing at the playground with my friends like this because it is both fun and meaningful.","P":"Firstly, it allows us to exercise and stay active. Secondly, it gives us the chance to bond and create happy memories together. Lastly, playing outdoors helps us relax and take a break from schoolwork.","E":"For instance, my friends and I often go to the playground after school. Sometimes we push each other on the swings, race on the slides, or invent silly challenges. Even though we get sweaty and tired, we always end up laughing and talking about it later. Those moments remind me of the joy of childhood.","A":"That experience showed me that play is one of the most valuable ways to spend our free time.","K":"In conclusion, I would truly enjoy playing like this because it creates joy, strengthens bonds, and helps me stay healthy at the same time."},{"S":"One memorable time I had fun with my friends was during a class camp. We took part in different activities such as team-building games, hiking, and even a campfire performance. It was exciting because we worked together and supported one another.","E":"During the campfire, my group performed a short skit. At first, I was nervous, but my friends encouraged me, and we ended up making the audience laugh loudly. Later that night, we sat under the stars, sang songs, and talked until bedtime. That experience made me feel very close to my classmates.","A":"That taught me that the best fun with friends happens when everyone is included and enjoys the moment together.","K":"Thus, I think time spent with friends is precious because it creates memories that we will remember for many years."},{"S":"Yes, I strongly believe outdoor play is important because it helps children grow in many different ways.","P":"Firstly, it improves our physical health as we run, climb, and stay active. Secondly, it builds social skills because we need to communicate, share, and cooperate during play. Lastly, it helps with emotional well-being since playing outside relieves stress and brings joy.","E":"For example, during the holidays, I spent a lot of time playing football with my neighbours. I learnt how to pass better, support my teammates, and encourage others even when we lost a match. Over time, I became more confident and also made new friends. That showed me that outdoor play is not only about fitness, but also about building character and resilience.","A":"That experience made me realise that outdoor play gives children lessons that cannot be learnt from books or online games.","K":"To summarise, outdoor play is vital because it keeps children healthy, teaches life skills, and helps them grow into confident individuals."}],"audio":{"basic":"audio/family-7-basic.mp3","adv":"audio/family-7-adv.mp3"}},{"n":8,"img":"img/family-8.jpg","see":"I see a boy sweeping the floor in the living room. He is holding a broom in one hand and a dustpan in the other. The boy looks focused as he gathers dust from the tiled floor. In the background, I can see a sofa, a coffee table with books, a television, and some potted plants, which make the house look neat and cosy.","think":["Object: Broom and dustpan - This suggests that the boy is helping with household chores. It shows that he is taking responsibility in keeping his home clean.","Setting: Living room at home - The home setting suggests that this is part of his daily routine or something he does to help his family.","Action: Boy sweeping the floor — This shows responsibility, helpfulness, and independence. It also suggests that children can play an active role in caring for the home.","Helping at home","Responsibility and independence","Caring for family","Good habits and cleanliness"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"&. This reminds me of the time I helped my mother sweep and mop the\n floor before Chinese New Year. We wanted the house to look clean and fresh for visitors.\n If were in this picture, I would... if I were in this picture, I would try my best to sweep properly so that the living room looks neat and tidy."},{"prompt":"I feel this is important because...","answer":"I think this is important because helping at home shows love and care for our family, and it also teaches us to be responsible."}],"questions":["Do you help with chores at home like the boy in the picture? Why or why not?","Share about a time when you helped your family at home.","Do you think children should share household responsibilities with their parents? Why or why not?"],"basic":[{"S":"Yes, I do help with chores at home because it makes me feel responsible and useful.","P":"When I help clean the house, I am contributing to my family's well-being. I am also reducing the amount of work my family has to do. E — Example from Experience: For instance, during the weekends, I often sweep the floor while my sister wipes the tables and my brother takes out the trash. This way, no single person has to do all the cleaning, and the house feels so much cleaner afterwards.","A":"That made me realise that each family member has a role to play in ensuring a clean and comfortable home.","K":"So yes, I do help with chores as it's a way to show care for my family and home."},{"S":"I remember once helping my mother with laundry when she was very busy.","P":"She was preparing dinner, so I offered to fold the clothes and put them back into the drawers. It saved her time and made her happy.","E":"Although I was not very neat at first, I tried my best. My mother thanked me for the effort and taught me how to fold better. It felt good to know I was useful.","A":"That experience showed me that helping others can lighten their burden.","K":"That's why from that day onwards, I help my family with chores in every way I can."},{"S":"Yes, I think children should help with housework because it teaches them important values.","P":"Doing chores teaches us that we have duties at home and must complete our tasks responsibly. It also shows us that keeping the home clean is everyone's duty, not just the parents'.","E":"For example, my cousin always helps his father wash the car on weekends. He makes sure the car is cleaned properly. By doing this regularly, he learnt to take care of his family belongings.","A":"That proves children can learn life skills and responsibility through simple housework.","K":"Therefore, I think it is good for children to do chores regularly."}],"advanced":[{"S":"Yes, I help with chores at home because it teaches responsibility and shows that I care about my family.","P":"Firstly, when I help with chores, I am not only making the house cleaner but also showing appreciation for my parents' hard work. Secondly, it gives me useful life skills that I will need when I grow older. Lastly, it makes the home a more pleasant place for everyone.","E":"For example, during school holidays, I often help my parents by sweeping the floor, mopping, or even cooking simple dishes. Sometimes I get tired, but when I see the clean results, I feel proud of myself. My parents also thank me, and it makes me feel more responsible.","A":"That showed me that chores are not boring tasks, but important responsibilities that build character.","K":"In conclusion, I help with housework because it benefits my family and also helps me grow as a person."},{"S":"One meaningful time I helped with chores was during the festive season when we did spring cleaning together.","P":"We had to tidy the house, throw away old items, and make space for new things. It was tiring but it felt good to work as a family.","E":"I was in charge of cleaning my room and helping to throw away unwanted items. After I was done, I continued helping my parents to clean the living room by wiping the windows. Although we were tired, seeing our home clean and ready for the festivities made the effort worthwhile.","A":"That experience taught me that helping my family can be fulfilling even when the work is tiring.","K":"Thus, I think helping with chores is meaningful because it builds teamwork and pride in our home."},{"S":"Yes, I strongly believe children should help with housework because it prepares them for the future and teaches important values.","P":"When children help, they learn independence and responsibility. They also understand that maintaining a home is a shared effort, which builds respect for their parents. In addition, chores can teach useful skills like cooking, cleaning, and organising.","E":"For instance, my older cousin lives in a boarding school and has to do all his laundry and cleaning by himself. He once told me that because he had already learnt these skills at home, he was able to adapt quickly. That made me realise how helpful it is to start young.","A":"That made me realise children can grow into confident and capable adults if they start taking part in housework early.","K":"To summarise, I believe children should share household responsibilities with their parents because it shapes their character, teaches useful skills, and sets them up for success in the future."}],"audio":{"basic":"audio/family-8-basic.mp3","adv":"audio/family-8-adv.mp3"}},{"n":9,"img":"img/family-9.jpg","see":"I see a family visiting an elderly woman at her home. A boy is handing her a wrapped gift while smiling, and the elderly woman looks very happy and grateful as she receives it. A girl is holding another gift basket, and both parents are standing beside them, smiling warmly. The family looks cheerful, and the atmosphere is joyful and caring.","think":["Setting: Elderly woman's home - The home setting suggests a personal visit filled with warmth and connection. It may be for a festive season, a birthday, or simply to show appreciation.","Action: Family giving gifts to an elderly woman - This shows kindness, respect, and thoughtfulness. It also highlights family bonding and the importance of showing love to elders.","Caring for elders","Kindness and generosity","Family bonding and traditions","Respect and appreciation"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the time my family visited my grandparents during Chinese New Year. We brought them oranges and snacks, and they were very happy to see us.\n If were in this picture, I would... if I were in this picture, I would smile and greet the elderly woman politely while helping to pass her the gifts."},{"prompt":"I feel this is important because...","answer":"I think this is important because showing care to elders makes them feel appreciated and loved, and it also strengthens family ties."}],"questions":["Do you like to surprise your relatives with gifts like in this picture? Why or why not?","Share about a time you visited a relative or family friend.","Do you think it is important to visit relatives often? Why or why not?"],"basic":[{"S":"Yes, I like to surprise my relatives with gifts because it is a kind way of showing that we care about them.","P":"When we give a present, it shows thoughtfulness and strengthens our relationship with the person. Even a small gift can make someone feel valued and loved.","E":"For example, last year during Chinese New Year, my family and I visited my grandmother. We brought her some oranges and a basket of treats. She was delighted and told us she appreciated the gesture.","A":"That made me realise that it is not the price of the gift that matters, but the love behind it.","K":"So yes, I like giving gifts to relatives because it makes both them and me happy."},{"S":"I remember once visiting my aunt when she had just moved into a new house.","P":"It was a special visit because we wanted to celebrate her new beginning and show our support.","E":"We brought along some food and a small plant for her home. After giving her the gifts, she gave us a tour of the house. I enjoyed exploring the new rooms and hearing her plans to decorate them.","A":"That visit reminded me that gatherings are meaningful, even for simple occasions.","K":"So now, I always encourage my parents to visit relatives more often."},{"S":"Yes, I think it is important to visit relatives often because it helps us maintain close family ties.","P":"When we visit, we can share stories, celebrate milestones, and support one another during challenges. This keeps the family bond strong.","E":"For example, my cousins live quite far away, but whenever we visit them during school holidays, we play games and share meals together. Even though we don't meet often, these visits help us stay connected.","A":"That shows me that visiting family is about keeping in touch and strengthening relationships.","K":"In summary, visiting relatives regularly is an important way to keep family bonds alive."}],"advanced":[{"S":"Yes, I like to surprise my relatives with gifts because it is a thoughtful gesture that spreads joy to both the giver and the receiver.","P":"Firstly, giving gifts shows appreciation and gratitude for our family members. Secondly, it can make celebrations more meaningful, as the gift symbolises love and effort. Lastly, it is also a way to create special memories that relatives will treasure.","E":"For instance, during my grandfather's birthday, my siblings and I prepared a handmade photo album filled with family pictures. He was so touched that he spent a long time looking through the pages and recalling fond memories. That moment showed me how gifts can carry emotional value beyond their physical worth.","A":"That experience taught me that the act of giving can touch people's hearts in profound ways.","K":"Therefore, I love giving gifts to relatives because it is rewarding to make them feel loved and appreciated."},{"S":"One memorable time I visited a relative was when my family went to my uncle's house for a festive gathering.","P":"It was memorable because it was not just about sharing food, but also about catching up and showing care for one another. The atmosphere was filled with laughter and warmth.","E":"I remember my cousins and I played card games while the adults chatted. We also helped serve snacks to everyone. By the end of the evening, I felt a sense of closeness that we don't always get to experience because we live in different parts of Singapore.","A":"That day reminded me that visiting relatives is more than a duty. It is a precious chance to nurture relationships that truly matter.","K":"Since then, I've always asked my parents to plan more family visits and make more effort to visit them."},{"S":"Yes, I strongly believe it is important to visit relatives regularly because family ties are precious and should not be neglected.","P":"When we visit often, we show our love and support, especially to elderly relatives who may feel lonely. It also keeps traditions alive and teaches younger children the value of family. Moreover, it helps us share both happy and difficult times together.","E":"For example, my family makes it a point to visit my grandmother every weekend. Sometimes we bring her food, sometimes we just chat with her. Even if the visit is short, I can see how much she looks forward to our company. These visits make her smile and remind me how important it is to care for her.","A":"That proves that frequent visits help ensure we don't drift apart because of our busy lives.","K":"In conclusion, I think visiting relatives often is essential for keeping family relationships strong and full of love."}],"audio":{"basic":"audio/family-9-basic.mp3","adv":"audio/family-9-adv.mp3"}},{"n":10,"img":"img/family-10.jpg","see":"I see several families taking part in a sack race during a Family Day event. Children are inside sacks, hopping forward, while their parents are supporting them from behind. Everyone looks happy and energetic. In the background, a large banner with the words \"Family Day\" is displayed, and many people are watching and smiling.","think":["Object: Sacks and Family Day banner — This suggests that the event is organised to encourage families to participate in games and enjoy time together.","Setting: School field or community space - The open field with many participants suggests a big gathering where families and friends come together to celebrate.","Action: Families competing in a sack race - This shows teamwork, bonding, and enjoyment. It also suggests the importance of spending quality time together through fun activities.","Family bonding and unity","Fun and laughter in shared activities","The value of school or community events"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"&. This reminds me of my school's Sports Day when my class took part in\n a relay race. My family cheered for me, and even though my class did not win, it was very fun and memorable.."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would cheer loudly and try my best to hop quickly in the sack."},{"prompt":"I feel this is important because...","answer":"I think this is important because family events bring people closer, encourage teamwork, and allow everyone to have fun together."}],"questions":["Would you enjoy taking part in a Family Day event like this? Why or why not?","Share about a time you took part in an event with your family.","Do you think families should attend such events together? Why or why not?"],"basic":[{"S":"Yes, I would enjoy taking part in a Family Day event like this because it looks fun and meaningful.","P":"It is fun as there are games and races where families work together, and it is meaningful because it allows everyone to spend quality time together outside of school or work.","E":"For example, my school once organised a Family Day where we played games like tug-of-war and three-legged races. I remember laughing with my parents and having a whale of a time even though we didn't win.","A":"That memory showed me that Family Day is more about bonding and enjoyment than the actual competition.","K":"So, I think I would definitely enjoy joining such an event because it would bring me and my family closer."},{"S":"One time, I joined a Mid-Autumn Festival celebration with my family.","P":"It was special because we got to try lantern walks, eat mooncakes, and enjoy the evening together.","E":"I remember holding a colourful lantern while walking around the park with my cousins. After that, my grandmother told us stories about the Jade Rabbit, which made the night even more unforgettable.","A":"That night reminded me that family events can be both fun and educational.","K":"That's why I always enjoy taking part in events like the Mid-Autumn Festival celebration with my family."},{"S":"Yes, I think families should attend such events together because it allows them to understand each other better.","P":"Attending events gives families the chance to see what activities each person likes. It lets us learn new things about each other.","E":"For instance, during a school-organised Family Sports Day, my parents were surprised to see me enjoy rock climbing. They always thought I was afraid of heights.","A":"That experience taught me that trying new activities together can be fun and eye-opening.","K":"So yes, I believe families should take part in such events because it is a good way to connect and get to know each other better."}],"advanced":[{"S":"Yes, I would truly enjoy taking part in a Family Day event like this because it combines fun, teamwork, and bonding.","P":"Firstly, these events give families the chance to enjoy games and activities that they might not usually do together. Secondly, they allow parents and children to work as a team, which can _ strengthen trust and communication. Lastly, it is also a chance to meet other families and build a stronger community.","E":"For example, during my school's Family Day, we had a sack race very similar to the one in the picture. I paired up with my father, and even though we stumbled and almost fell, we laughed so much that it became my favourite memory of the day. Seeing all the families cheer for each other made the event even more exciting.","A":"That experience showed me that Family Day is not just about the games but also about the joy of spending quality time together and appreciating the little moments.","K":"In conclusion, I would definitely enjoy joining Family Day events because they bring fun, unity, and long-lasting memories."},{"S":"I remember taking part in a family talent show during a Community Day event at our neighbourhood park.","P":"Firstly, it was enjoyable because I got to perform on stage with my family members. This was something we had never done before. Secondly, it was meaningful as we learnt about teamwork and the importance of supporting one another.","E":"My family decided to perform a short dance routine together. I was worried about dancing in public but my parents and siblings kept reassuring me during practice. When I missed a step, they smiled and helped me get back on track. It made me feel less nervous and more confident to perform in front of an audience.","A":"That experience showed me that events encourage everyone to step out of their comfort zone while feeling safe and supported.","K":"Therefore, I would take part in an event like that again, as long as my family is with me."},{"S":"Yes, I think families should attend such events together because they provide opportunities for family members to see new sides of each other.","P":"Events like Family Day encourage families to spend time away from work, school, or electronic devices. Everyone can focus on each other without distraction. When parents watch their children try new activities, they may discover hidden talents and interests they might not notice at home.","E":"During one Family Day event, there was a karaoke booth. My usually shy sister surprised us all by singing beautifully when her favourite song came on. My parents and I were amazed and we kept praising her. Since that day, my parents signed her up for singing lessons and she's become much more confident.","A":"That experience showed me that when families pay attention to each other, everyone feels more valued and understood.","K":"To summarise, families should definitely attend such events together because they offer meaningful chances for family members to appreciate each other better."}],"audio":{"basic":"audio/family-10-basic.mp3","adv":"audio/family-10-adv.mp3"}}]},{"id":"env","name":"Environment","short":"Environment","zh":"环境","color":"#16A34A","sets":[{"n":1,"img":"img/env-1.jpg","see":"I see four students in their school uniforms standing behind recycling bins. Each student is holding a different recyclable item: paper, a plastic bottle, a food container, and a glass bottle. The bins are clearly labelled Paper, Plastic, Metal, and Glass with recycling logos on them. The students look cheerful and focused as they sort their recyclables properly.","think":["Object: Recycling bins - The bins suggest that the school is encouraging proper waste sorting. This shows the importance of environmental responsibility.","Setting: School environment - The presence of students in uniform suggests that recycling is being taught as part of school activities or NEA's Clean and Green movement.","Action: Students smiling while sorting items — This shows that they are not only learning but also enjoying the process. It suggests that caring for the environment can be a positive, shared activity.","Environmental care and sustainability","Responsibility in daily habits","Teamwork and cooperation","Education about recycling and waste management"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of when my class took part in a recycling drive. We\n brought newspapers, bottles, and cans from home and sorted them at school. It was fun to see how much we collected as a group."},{"prompt":"If I were in this picture, I would...","answer":"if I were in this picture, I would make sure to check that I placed the items in the correct bins. I would also encourage my friends to recycle with me so that the activity feels more meaningful."},{"prompt":"I feel this is important because...","answer":"&. I feel this is important because recycling helps us reduce waste and protect the environment. Learning to recycle in school teaches us good habits that we can continue at home and in the future."}],"questions":["What do you think the students in the picture are doing?","Have you ever taken part in an activity that taught you how to care for the environment?","Why should young people learn about recycling and protecting the Earth?"],"basic":[{"S":"I think the students in the picture are sorting their waste in recycling bins.","P":"There are different bins for plastic, paper, metal, and glass, so the students are separating their rubbish accordingly to be recycled. Recycling teaches us to be more responsible and mindful about what we throw away.","E":"Personally, after finishing a drink, I wash the plastic bottle and place it in the recycling bin for plastics. My mother also collects old newspapers and brings them to the recycling point at the co
