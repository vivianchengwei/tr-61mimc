<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PSLE Oral"><meta name="theme-color" content="#3A7BFF">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>PSLE Oral Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: app shell — sticky header, single scrolling main, bottom tab bar on phones. Theme colour-coding carries information (6 book themes). */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --surface2:#E9EEF6; --ink:#1B2130; --muted:#66708A; --line:#D9DFEA;
  --accent:#FF6B3D; --accent-ink:#FFFFFF; --accent-soft:#FFE7DD;
  --gold:#F5B301; --ok:#1DB954; --ok-soft:#DDF7E6; --warn:#E0314B;
  --t-tech:#3A7BFF; --t-sports:#F59E0B; --t-sg:#E0314B; --t-kind:#EC4C9B; --t-family:#8B5CF6; --t-env:#16A34A;
  --shadow:0 6px 24px rgba(27,33,48,.08);
  --rb:#4338CA; --rb-soft:#EEF0FF; --rb-ink:#FFFFFF; --rb-line:#C7CBF5;
  --ra-t:#D7263D; --ra-d:#1D5FE0; --ra-id:#7C3AED; --ra-v:#15803D; --ra-u:#B86E00; --ra-int:#0E7490;
  --font-display:'Fredoka','Nunito','Segoe UI',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  --radius:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11151F; --surface:#1A2030; --surface2:#242C40; --ink:#EEF2FA; --muted:#9AA4BA; --line:#2E3750;
  --accent:#FF7A50; --accent-soft:#3A2419; --ok-soft:#163B25; --shadow:0 6px 24px rgba(0,0,0,.35); --rb:#8B93FF; --rb-soft:#20234A; --rb-ink:#0E1030; --rb-line:#3A3F7A; --ra-t:#FF6B7D; --ra-d:#7AA7FF; --ra-id:#B794FF; --ra-v:#4ADE80; --ra-u:#FBBF24; --ra-int:#5EEAD4; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#11151F; --surface:#1A2030; --surface2:#242C40; --ink:#EEF2FA; --muted:#9AA4BA; --line:#2E3750;
  --accent:#FF7A50; --accent-soft:#3A2419; --ok-soft:#163B25; --shadow:0 6px 24px rgba(0,0,0,.35); --rb:#8B93FF; --rb-soft:#20234A; --rb-ink:#0E1030; --rb-line:#3A3F7A; --ra-t:#FF6B7D; --ra-d:#7AA7FF; --ra-id:#B794FF; --ra-v:#4ADE80; --ra-u:#FBBF24; --ra-int:#5EEAD4; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;left:-9999px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.2px;white-space:nowrap}
.logo .mic{width:34px;height:34px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:#fff}
.logo small{display:block;font:600 11px/1 var(--font-body);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.tab svg{width:18px;height:18px}
@media (max-width:1440px) and (min-width:761px){.tab .zh{display:none}.tab{padding:8px 9px}}
@media (max-width:1200px) and (min-width:761px){.top .in{flex-wrap:wrap;row-gap:6px}.tabs{order:3;width:100%;margin-left:0;justify-content:space-between}.stats{margin-left:auto}.top{position:sticky}}
.tab.on{background:var(--accent-soft);color:var(--accent)}
.tab .zh{font-size:11px;font-weight:600;opacity:.8}
.stats{display:flex;gap:10px;align-items:center;font-weight:800;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border-radius:999px;padding:5px 10px;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:16px}
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));z-index:9}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px}
  .tab .zh{display:none}
  .logo small{display:none}
  main{padding-bottom:90px!important}
}
main{max-width:1040px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cards & basics */
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.calgrid{grid-template-columns:1.2fr .8fr}
@media (max-width:760px){.g2,.g3,.calgrid{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:800;font-size:15px;background:var(--surface2);transition:transform .08s ease,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(.96)} .btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgba(255,107,61,.35)}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.lg{padding:16px 28px;font-size:18px}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--surface2)}
.chip.t{color:#fff}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.hr{height:1px;background:var(--line);margin:4px 0}

/* home */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:0;overflow:hidden;padding:0}
.hero .txt{padding:26px}
.hero .pic{position:relative;min-height:220px;background:var(--surface2)}
.hero .pic img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.hero h1{font-size:34px;margin:6px 0 8px}
.hero .day{font-family:var(--font-display);font-weight:700;font-size:15px;color:#fff;display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:999px}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero .pic{min-height:190px;order:-1}.hero h1{font-size:28px}}
.ring{width:84px;height:84px;position:relative;flex:none}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font:700 20px var(--font-display);font-variant-numeric:tabular-nums}
.weekrow{display:flex;gap:8px;flex-wrap:wrap}
.wk{flex:1 1 140px;border-radius:14px;padding:10px 12px;border:2px solid var(--line);display:flex;align-items:center;gap:10px;min-width:0;text-align:left}
.wk.done{border-color:var(--ok);background:var(--ok-soft)}
.wk.now{border-color:var(--accent)}
.wk b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk .s{font-size:12px;color:var(--muted)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.th{border-radius:14px;padding:12px 10px;color:#fff;text-align:center;font-family:var(--font-display);font-weight:600;font-size:14px;line-height:1.2}
.th .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.35);margin-top:8px;overflow:hidden}
.th .bar i{display:block;height:100%;background:#fff}
.th small{display:block;font:700 12px var(--font-body);opacity:.9;margin-top:4px;font-variant-numeric:tabular-nums}
.notice{border-radius:14px;padding:12px 16px;background:var(--accent-soft);display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dn{font-size:12px;font-weight:800;color:var(--muted);text-align:center;padding:4px 0}
.cd{aspect-ratio:1;border-radius:12px;border:2px solid transparent;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;position:relative;max-width:100%}
.cd.out{opacity:.35}
.cd.pd{background:var(--surface);border-color:var(--line)}
.cd.today{border-color:var(--accent)}
.cd.sel{outline:3px solid var(--accent);outline-offset:1px}
.cd .dots{display:flex;gap:3px}
.cd .dots .dot{width:8px;height:8px}
.cd .dots .dot.plan{background:transparent;border:2px solid currentColor;width:9px;height:9px}
.cd .chk{position:absolute;top:3px;right:4px;font-size:11px;color:var(--ok)}
.daylist{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.dl{flex:none;width:92px;border-radius:14px;padding:8px;border:2px solid var(--line);text-align:center;scroll-snap-align:start;background:var(--surface)}
.dl.done{border-color:var(--ok)} .dl.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dl img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;display:block;margin-bottom:6px}
.dl b{font-size:12px;display:block}
.dl span{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayopts{display:flex;gap:6px;flex-wrap:wrap}
.dayopts button{padding:8px 12px;border-radius:999px;border:2px solid var(--line);font-weight:800;font-size:13px}
.dayopts button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* session */
.sess-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.stp{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.stp .n{width:22px;height:22px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px}
.stp.on{border-color:var(--accent);color:var(--ink)} .stp.on .n{background:var(--accent);color:#fff}
.stp.done{border-color:var(--ok);color:var(--ink)} .stp.done .n{background:var(--ok);color:#fff}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:1fr}}
.pic-big{border-radius:var(--radius);overflow:hidden;background:var(--surface2);box-shadow:var(--shadow)}
.pic-big img{width:100%;display:block}
.coach{display:flex;gap:12px;align-items:flex-start;background:var(--surface2);border-radius:16px;padding:14px 16px}
.coach .av{width:40px;height:40px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;flex:none}
.coach .av svg{width:22px;height:22px}
.coach b{font-family:var(--font-display);font-weight:600}
.coach .zh{color:var(--muted);font-size:13px;display:block;margin-top:2px}
.stc{border:2px solid var(--line);border-radius:16px;overflow:hidden}
.stc>button{width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:800;text-align:left}
.stc>button .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:700}
.stc .body{padding:0 16px 16px;display:none}
.stc.open .body{display:block}
.stc ul{margin:6px 0 0;padding-left:18px}
.stc li{margin:4px 0}
.qtabs{display:flex;gap:6px;flex-wrap:wrap}
.qtabs button{padding:8px 14px;border-radius:12px;border:2px solid var(--line);font-weight:800;font-size:13px;background:var(--surface)}
.qtabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.q{font-family:var(--font-display);font-weight:600;font-size:19px;margin:10px 0 12px}
.speak{display:grid;grid-template-columns:36px 1fr;gap:10px;margin:8px 0;align-items:start}
.sk{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:700 14px var(--font-display);color:#fff}
.speak{grid-template-columns:auto 1fr!important}
.tags{display:flex;gap:4px;align-items:flex-start;min-width:30px}
.tg{min-width:30px;height:30px;padding:0 4px;border-radius:9px;display:grid;place-items:center;font:700 14px var(--font-display);color:#fff}
.tg.pe{background:transparent;border:2.5px solid currentColor}
.tg.tr{background:#0F766E;border-radius:50%}
.tg.tr.alt{background:transparent;color:#0F766E;border:2.5px dashed #0F766E}
.tg.tr.none{background:transparent;visibility:hidden}
.trtip{display:flex;gap:8px;align-items:center;margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--surface2)}
.trname{display:block;font:800 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:#0F766E;margin-bottom:2px}
.cmp .orig{background:var(--surface2)}
.cmp .orig p{color:var(--muted)}
.tnote{border-left:4px solid var(--warn);padding:6px 10px;background:var(--surface);border-radius:8px}
.tnote ul,.chg{margin:4px 0 0;padding-left:18px}
.chg li{margin:4px 0}
.pe-S{color:#3A7BFF}.pe-P{color:#8B5CF6}.pe-E{color:#D98A00}.pe-A,.pe-K{color:#16A34A}
.sk-S{background:#3A7BFF}.sk-P{background:#8B5CF6}.sk-E{background:#F59E0B}.sk-A{background:#16A34A}.sk-K{background:#E0314B}
.speak p{font-size:16.5px;line-height:1.6}
.read p{font-size:17px;line-height:1.65;margin:8px 0}
.read.big p,.read.big .speak p{font-size:19px;line-height:1.7}
mark.pw{background:transparent;color:inherit;border-bottom:3px solid var(--gold);cursor:pointer;border-radius:2px;padding:0 1px}
mark.pw.got{background:rgba(245,179,1,.28)}
.peelkey{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.pk>span{display:flex;align-items:center;gap:4px}
.pk .tg{min-width:26px;height:26px;font-size:13px}
@media (max-width:480px){.pk{grid-template-columns:1fr}}
.lblsw{display:flex;gap:2px;background:var(--surface2);border-radius:999px;padding:3px}
.lblsw button{padding:4px 10px;border-radius:999px;font-weight:800;font-size:12px}
.lblsw button.on{background:var(--ink);color:var(--bg)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;font-weight:800;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* look timer */
.looktimer{display:flex;gap:16px;align-items:center;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:2px solid var(--accent);transition:background .3s}
.looktimer.over{border-color:var(--ok);background:var(--ok-soft)}
.lt-ring{position:relative;width:110px;height:110px;flex:none}
.lt-ring svg{width:110px;height:110px;transform:rotate(-90deg)}
.lt-bg{fill:none;stroke:var(--surface);stroke-width:10}
.lt-fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear,stroke .3s}
.looktimer.over .lt-fg{stroke:var(--ok)}
.lt-num{position:absolute;inset:0;display:grid;place-items:center;font:700 40px var(--font-display);font-variant-numeric:tabular-nums;color:var(--accent)}
.looktimer.over .lt-num{color:var(--ok)}
.looktimer.live .lt-ring{animation:ltpulse 1s ease-in-out infinite}
@keyframes ltpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.looktimer.live .lt-ring{animation:none}}
.lt-txt{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.lt-txt b{font-family:var(--font-display);font-weight:600;font-size:20px}
@media (max-width:480px){.looktimer{flex-direction:column;text-align:center}.lt-txt{align-items:center}}



/* Part 1 reading-aloud identity */
.rabanner{position:relative;overflow:hidden;border-radius:var(--radius);background:var(--rb);color:var(--rb-ink);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;padding:24px 26px;box-shadow:var(--shadow)}
.rb-go{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative}
.partlbl{display:flex;align-items:center;gap:12px;margin-bottom:-8px}
.partlbl .pn{width:38px;height:38px;border-radius:12px;background:var(--rb);color:#fff;display:grid;place-items:center;font:700 20px var(--font-display);flex:none}
.partlbl .pn.p2{background:var(--accent)}
.partlbl b{display:block;font:600 20px var(--font-display)}
.partlbl span{font-size:13px;color:var(--muted);font-weight:700}
.themes6{grid-template-columns:repeat(6,1fr)}
@media (max-width:760px){.themes6{grid-template-columns:repeat(3,1fr)}.rb-go{align-items:stretch}}
@media (max-width:760px){.rabanner{grid-template-columns:1fr;padding:20px}}
.rabanner::before{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08)}
.rb-part{display:inline-flex;align-items:center;gap:8px;font:800 12px var(--font-body);letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.rb-part .pill{background:rgba(255,255,255,.18);color:inherit;padding:3px 9px;letter-spacing:.04em}
.rabanner h2{font-size:32px;margin:6px 0 6px;color:inherit}
.rabanner p{opacity:.92}
.rb-dots{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.rb-dots i{width:16px;height:16px;border-radius:5px;background:rgba(255,255,255,.22)}
.rb-dots i.on{background:#FFD45C}
.rb-dots i.next{outline:2px solid #fff;outline-offset:1px}
.rb-btn{background:#fff;color:#2B2A8C;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.rb-ghost{background:transparent;border:2px solid rgba(255,255,255,.55);color:inherit}
.rb-sample{align-self:start;background:var(--surface);color:var(--ink);border-radius:16px;padding:14px 16px 8px;font-size:17px;line-height:2.45;position:relative;min-width:0}
.rb-sample .rb-cap{display:flex;justify-content:space-between;gap:8px;font:800 11px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.4;margin-bottom:2px}
.rb-sample .ra-s{cursor:default}
.tab.ra-tab{color:var(--rb)}
.tab.ra-tab.on{background:var(--rb);color:#fff}
.rahead{border-radius:var(--radius);background:var(--rb);color:#fff;padding:20px 22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.rahead h2{color:inherit;font-size:28px}
.rahead .rb-dots{margin:8px 0 0}
.readcard{border-top:5px solid var(--rb)}
.readcard.done{border-top-color:#16A34A}

.pact-line{font-style:italic;font-size:16px;line-height:1.7}
mark.pact{background:transparent;color:inherit;padding:0 2px;border-radius:4px;font-style:normal;font-weight:800}
.pact-p{box-shadow:inset 0 -.45em 0 rgba(58,123,255,.25)}.pact-a{box-shadow:inset 0 -.45em 0 rgba(236,76,155,.25)}.pact-c{box-shadow:inset 0 -.45em 0 rgba(22,163,74,.25)}.pact-t{box-shadow:inset 0 -.45em 0 rgba(245,179,1,.35)}

.ra-chips{display:flex;gap:6px;flex-wrap:wrap}

.ra-chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}.ra-chip.on .muted{color:inherit;opacity:.7}
.ra-key{display:grid;gap:6px;font-size:13.5px;line-height:1.9;background:var(--surface2);border-radius:14px;padding:10px 14px}
.ra-key b{display:inline-block;min-width:76px}
.passage{font-size:19px;line-height:2.55;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px 20px;max-width:72ch}
.passage.big{font-size:23px;line-height:2.6}
.passage p{margin:0 0 .6em}
.ra-s{cursor:pointer;border-radius:6px;transition:background .2s}

.ra-ed-t{color:var(--ra-t);font-weight:800;text-decoration:underline 2px}.ra-ed-d{color:var(--ra-d);font-weight:800;text-decoration:underline 2px}.ra-ed-id{color:var(--ra-id);font-weight:800;text-decoration:underline 2px}
.ra-edw{position:relative;white-space:nowrap}
.ra-edw::after{content:attr(data-ed);position:absolute;right:-2px;top:-1.15em;font:800 .55em/1 var(--font-body);letter-spacing:0;padding:1px 3px;border-radius:4px;color:#fff;pointer-events:none}
.ra-edw-t::after{background:var(--ra-t)}.ra-edw-d::after{background:var(--ra-d)}.ra-edw-id::after{background:var(--ra-id)}

.ra-tag{font:800 .7em var(--font-body);color:var(--muted)}
.ra-th-v{color:var(--ra-v);font-weight:800;text-decoration:underline wavy 2px;text-underline-offset:4px}

.ra-int{position:relative}
.ra-int::after{position:absolute;left:50%;transform:translateX(-50%);top:-1.05em;font:900 .95em/1 var(--font-body);color:var(--ra-int);white-space:nowrap}
.ra-rise::after{content:'↗'}.ra-fall::after{content:'↘'}.ra-risefall::after{content:'↗↘'}
.ra-soft::after{opacity:.75;font-size:.8em;top:-.95em}
.ra-arw{color:var(--ra-int);font-weight:900}

/* audio player */
.player{border-radius:16px;padding:14px 16px;background:var(--surface2);display:flex;flex-direction:column;gap:10px}
.player .ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pbtn{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(255,107,61,.35)}
.pbtn svg{width:26px;height:26px}
.pbtn.sm{width:40px;height:40px;background:var(--surface);color:var(--ink);box-shadow:none;border:2px solid var(--line)}
.pbtn.sm svg{width:18px;height:18px}
.pbtn.on{background:var(--ink);color:var(--bg)}
.seek{flex:1 1 160px;display:flex;align-items:center;gap:8px;min-width:0}
.seek input{flex:1;accent-color:var(--accent);min-width:0}
.seek span{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;min-width:36px}
.spd{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:3px}
.spd button{padding:5px 10px;border-radius:999px;font-weight:800;font-size:12px}
.spd button.on{background:var(--ink);color:var(--bg)}
.player .lbl{font-size:12px;font-weight:800;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.wave{display:flex;gap:3px;align-items:flex-end;height:22px}
.wave i{width:4px;background:var(--accent);border-radius:2px;height:30%;animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.15s}
.wave.off i{animation:none;height:30%}
@keyframes wv{0%,100%{height:30%}50%{height:100%}}
@media (prefers-reduced-motion:reduce){.wave i{animation:none}}

/* your turn */
.rec{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px;border-radius:16px;border:2px dashed var(--line)}

.micbtn:active{transform:scale(.95)}
.micbtn.live{background:var(--warn);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(224,49,75,.45)}100%{box-shadow:0 0 0 18px rgba(224,49,75,0)}}

.micbtn svg{width:36px;height:36px}
.timer{font:700 28px var(--font-display);font-variant-numeric:tabular-nums}
.transcript{width:100%;min-height:70px;border-radius:12px;background:var(--surface2);padding:12px 14px;font-size:16px;line-height:1.55}
.transcript.empty{color:var(--muted);font-style:italic}
.fb{display:flex;flex-direction:column;gap:12px}
.fb .scores{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

.sc{border-radius:12px;padding:8px 4px;text-align:center;background:var(--surface2);font-size:12px;font-weight:800}
.sc .k{font:700 18px var(--font-display);display:block}
.sc.ok{background:var(--ok-soft);color:var(--ok)}
.sc.miss{opacity:.6}
.kv{display:flex;gap:8px;flex-wrap:wrap}
.kv .pill{font-size:12px}
.tip{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface2)}

.tip .zh{display:block;color:var(--muted);font-size:13px}
.chat{display:flex;flex-direction:column;gap:10px}

.result{text-align:center}

.tablewrap{overflow-x:auto}
.savenote{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:10px 14px;margin:0 0 14px;font-weight:700;font-size:14.5px;line-height:1.5;word-break:break-word}
.linkbtn{text-decoration:underline;font-weight:900;color:inherit}

.rec-ans{display:grid;gap:8px;margin:6px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;z-index:50;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none}

<script>
const DATA = {"themes":[{"id":"tech","name":"Technology & Social Media","short":"Tech & Social Media","zh":"科技与社交媒体","color":"#3A7BFF","sets":[{"n":1,"img":"img/tech-1.jpg","see":"I see a group of students seated in a classroom, each using a tablet device. They are wearing their school uniforms and look very focused on their screens. There are no traditional books or papers on the desks, just tablets. The classroom looks bright and well-organised, with bulletin boards and windows in the background.","think":["Object: Tablet device - The use of tablets suggests that the school incorporates technology into their lessons. This shows that digital learning tools are becoming a normal part of education.","Setting: Students seated in a classroom - This shows that the use of technology is not just for home use but is integrated into structured, in- school learning environments.","Action: Students looked very focused on their screens - This suggests that the students are engaged and possibly enjoying their learning. It also shows self-discipline and the ability to focus, which are important skills when using devices.","Self-directed learning and digital responsibility","Being adaptable and open to new learning methods","Discipline and focus in using electronic devices for learning"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the time during the pandemic when we had to attend Home-Based Learning. I used a tablet to join lessons and do quizzes online. At first it was difficult, but I got used to it and now I enjoy using learning apps too."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would try to focus on the lesson and not get distracted by other things on the tablet. I would also help my classmates if they did not know how to use some features."},{"prompt":"I feel this is important because...","answer":"I feel it's important for students to learn how to use technology properly. While it can help us study in fun and interesting ways, we also need to be careful not to use it for the wrong reasons, like playing games during lessons."}],"questions":["Would you have enjoyed being one of the students in this picture? Why or why not?","Have you ever used a tablet or computer to do something fun or interesting in school?","Why is it important to use digital devices like tablets responsibly?"],"basic":[{"S":"Yes, I think I would have enjoyed being one of the students in the picture.","P":"It looks like they are using tablets to learn, which makes the lesson more fun, interactive, and engaging.","E":"Once, my teacher let us use our tablets to do a science quiz. The colourful images and clear sound effects helped me understand the lesson more easily instead of just memorising facts. As a result, I was more engaged in the lesson, and felt more confident answering similar questions later in class and during tests.","A":"I like it when learning feels like a game, so I think I would have been very happy to be in that class like the students in the picture.","K":"All in all, I would enjoy it a lot as using technology helps me learn in a more exciting way."},{"S":"Yes, I have used a tablet for a fun learning activity in school.","P":"We were learning about animals, and the teacher let us watch videos and do an online matching game.","E":"I remember watching a video about dolphins and then matching facts about sea animals in a game. The video helped me visualise how dolphins live and behave, which made the information easier to recall during the game. This activity made learning enjoyable and motivated me to pay closer attention in future lessons.","A":"It helped me understand better than just reading from the textbook.","K":"So yes, I have used a tablet for enjoyable lessons in school before, and I hope to have more opportunities to use them in the future."},{"S":"It is important to use digital devices like tablets, phones, and laptops responsibly because they can help us learn and stay connected, but only if we use them wisely.","P":"If we misuse these devices, such as spending too much time on games or social media, we might fall behind in our schoolwork or even damage our health.","E":"For example, my cousin used to play mobile games late into the night. He often felt tired in school and had trouble focusing during lessons. Eventually, his parents took his phone away and set clear rules, and he started doing much better in class.","A":"That made me realise that using digital devices properly, like sticking to screen time limits and using them mainly for studying or communicating with family, can help us stay focused and healthy.","K":"Thus, I think being responsible with digital devices shows maturity. It helps us build good habits that will be useful even when we are older."}],"advanced":[{"S":"Yes, I would have enjoyed being one of the students in the picture because I enjoy learning through the use of technology.","P":"A major advantage of using tablets in class is that it makes learning more interactive. We get to tap, swipe, or even play learning games as part of the lesson. It is a different kind of experience compared to listening to the teacher or reading a book, and sometimes that variety helps me stay focused and better understand the topic. In one of our science lessons, we used a tablet app to explore the parts of a plant by zooming in and tapping on each part. I understood the topic much better because I could see how everything worked in detail. Every single one of my classmates also enjoyed the experience and whined when we had to swap the tablet for our regular workbook. Learning this way makes lessons feel more alive, and I feel more motivated to participate.","K":"Therefore, I would enjoy being one of the students in that picture, as technology enhances the learning experience by making lessons more engaging and better suited to my learning style."},{"S":"Yes, I have had several interesting experiences using technology in school.","P":"One time, our class used an online app to create digital comics for English class, which helped us practise writing dialogue in a fun way. Another time, we joined a live Kahoot quiz with all the Primary 6 classes, and it made revision feel like a game. Also, during project work, we used Google Slides to collaborate with our group mates even when we were at home. That helped us finish our project faster and share ideas easily.","E":"I remember enjoying the digital comic project the most. I created a comic about two kids solving a mystery at school. It was fun because I could draw, add speech bubbles, and even record sound effects!","A":"That activity showed me that learning can be creative and fun when we use technology in the right way.","K":"Overall, I have had many fun learning experiences using tablets and computers, and I hope we can do more of that in future."},{"S":"It is important to use digital devices responsibly because they are powerful tools for learning, but also easy to misuse.","P":"If students use devices to play games or watch videos during lessons, they will miss out on important learning. Also, devices can be distracting to others if we do not follow classroom rules, like keeping the volume down or staying on task. Finally, how we use technology shows our character. Being responsible with it builds trust with our teachers and shows that we are mature.","E":"Last year, a classmate of mine kept switching tabs to watch videos during class. He got caught and had to stop using the tablet for a week. After that, our teacher reminded us that with freedom comes responsibility.","A":"That situation helped me understand that having access to technology is a privilege, and we must use it wisely.","K":"Thus, I believe using tablets responsibly is not just about rules. It's about showing respect for learning, for others, and for ourselves."}],"audio":{"basic":"audio/tech-1-basic.mp3","adv":"audio/tech-1-adv.mp3"}},{"n":2,"img":"img/tech-2.jpg","see":"I see a young girl sitting on a sofa in her living room. She is holding a video game controller and appears to be playing a racing game on the television. She looks very happy and excited, with a big smile on her face. The TV is placed on a wooden console and shows a car racing on a road. The room looks cosy and well-lit, with a plant beside the TV adding a homely touch.","think":["Object: Video game console - This suggests that the girl is spending her free time using technology for entertainment. It shows that gaming is acommon hobby for children today.","Setting: Home environment - She is playing indoors, possibly after school or during a break. It shows how technology is part of everyday life even at home.","Action: Girl playing and smiling - This tells us that she is enjoying herself and is likely playing for fun or to relax.","The role of technology in children's lives","Using free time for hobbies or entertainment","Balance between screen time and healthy routines","Joy, relaxation, and personal interests"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of how I play games on my tablet when I finish my\n homework. I usually play puzzle games or racing games like the one in the picture."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I think I would be feeling very happy too. I enjoy playing video games, but I also make sure not to play for too long."},{"prompt":"I feel this is important because...","answer":"I feel it is important to enjoy technology in a balanced way. While it is fun to play games, I also try to spend time reading or playing outdoors."}],"questions":["What might the girl in this picture be feeling, and why do you think so?","Have you ever used technology to do something meaningful at home? Tell me about it.","Do you think children should have limits on how much time they spend on screens? Why or why not?"],"basic":[{"S":"I think the girl in the picture is feeling joyful and deeply engaged in her game.","P":"Firstly, her smile and body posture suggest that she is having fun and enjoying herself. Secondly, the way she is focused on the screen shows that she is probably excited about what is happening in the game. Finally, she seems relaxed in her home setting, which adds to the feeling of comfort and enjoyment.","E":"I once played a game where I had to race against time to solve puzzles. I was smiling the whole time because it was both challenging and exciting. Games are usually enjoyable because they feel like an adventure, sparking curiosity and giving a sense of achievement when you solve problems or complete tasks.","A":"That is why I believe the girl is likely feeling something similar. She is excited and fully absorbed in what she is doing.","K":"Overall, judging by her expression and body language, she looks like she is truly enjoying the moment."},{"S":"Yes, I have used technology for both entertainment and meaningful activities at home.","P":"Many people view technology as harmful, believing it rots our brains, but it can also be an easy tool for creating projects that bring joy to others. ES Evidence/Example from Experience: Once, I used a video app to interview my grandparents about their childhood. I edited it and made a short family documentary. I have also used apps to design e-cards for my cousin's birthday and to record my own audiobook for my younger brother. These experiences helped me learn new skills like video editing and using my voice to tell stories.","A":"That made me realise that technology is not just for fun. It can be used to create things that make people feel loved and connected.","K":"Overall, technology has enabled me to engage in meaningful activities that my family and I will cherish and remember forever."},{"S":"Yes, I strongly believe children should have limits on screen time.","P":"Too much screen time can cause health problems like eye strain and poor posture. It can also affect our mood and make it harder to sleep at night if we use screens too close to bedtime. Besides that, spending too much time on screens means we miss out on other activities like reading, exercising, or spending time with family.","E":"Last year, I noticed I was sleeping later and waking up tired during the holidays because I was spending too much time on my tablet. My concentration and mood were affected during the day, and I felt constantly drained. I felt much more refreshed and energetic once I set a time limit and followed a proper routine.","A":"That experience helped me understand how screen habits affect the way I feel every day.","K":"Therefore, I think having healthy limits on screen time helps us enjoy technology without letting it control us."}],"advanced":[{"S":"The girl in the picture is likely feeling a strong sense of enjoyment and accomplishment.","P":"Firstly, her wide smile and focused eyes suggest she is really engaged and enjoying the game. Secondly, the way she is leaning forward while holding the controller tightly shows that she is concentrating hard, which usually happens when someone is trying to win or beat their personal best. Finally, the cosy setting at home makes it feel like she is in a safe, relaxed space, which adds to her happiness.","E":"This reminds me of the time I was playing a challenging puzzle game called \"Human: Fall Flat\" with my cousin. We had to solve a tricky level by building a bridge with planks and ropes. It took us nearly an hour because we kept dropping pieces and had to restart, but when we finally crossed the bridge and completed the level, we both screamed in excitement and started laughing so hard. I remember feeling really proud because we did not give up, and that joy stayed with me even after the game ended.","A":"That feeling of fun, focus, and success is what I imagine the girl is experiencing right now in the picture.","K":"It is a universal feeling to experience absolute joy and bliss when we are fully engaged in what we are doing and doing it well."},{"S":"Yes, I have used technology at home to create something meaningful that helped someone feel special.","P":"I used my laptop to make a surprise video gift for my mother's birthday. Technology gave me a way to collect, edit, and present things that I could not do with just paper and pen. It helped me show my appreciation for her in a creative way. It also taught me some new skills like how to layer music, crop clips, and add subtitles which I had never done before. For the video, I gathered short clips from my father, siblings, and even our relatives overseas. I used an app called CapCut to put them all together, and I added my mother's favourite song in the background. At the end of the video, I recorded a message telling her how much I love and appreciate her. On her birthday, we played the video on the TV. She was so surprised she started crying happy tears! She hugged me afterwards and said it was the best present she had ever received.","A":"That experience showed me how technology can be more than entertainment. It can be used to touch hearts and make people feel valued.","K":"Thus, I have used technology in a meaningful way, and it taught me that even something simple like a video can make a big impact."},{"S":"Yes, I strongly believe children should have limits on screen time so that we stay healthy and balanced.","P":"Too much screen time can cause problems like eye strain, poor sleep, or skipping meals. It can also lead to being less active or forgetting to interact with family and friends. Limits help us learn self-control and remind us to enjoy other things in life, like outdoor play, reading, or spending time with loved ones. ES Evidence/Example from Experience: During the December holidays last year, I spent almost six hours a day playing Minecraft. At first it was fun, but I noticed I stopped going out to cycle with my cousin, and I became impatient when my parents talked to me while I was playing. I even forgot to eat lunch a few times because I was too focused on the game. One day, my mother took away my tablet and asked me to reflect on how I was spending my time. That was a wake-up call. We ended up setting a daily screen-time limit of 1.5 hours. After that, I had more time to do other things like baking with my sister and drawing, which I had missed.","A":"That experience helped me realise that screen time is okay, but too much of it can take over our lives without us even realising.","K":"Overall, I believe screen time limits are important because they protect our health, help us stay connected with people, and teach us balance, which is something we all need, even as kids."}],"audio":{"basic":"audio/tech-2-basic.mp3","adv":"audio/tech-2-adv.mp3"}},{"n":3,"img":"img/tech-3.jpg","see":"People are riding the MRT. Most of them are using their mobile phones— scrolling, watching, or texting. They are a mix of commuters: likely students, working adults, and perhaps the elderly. Some are seated, while others are standing and holding onto the handrails. There are mobile phones in nearly everyone's hands.","think":["Object: Mobile Phones - This suggests people are highly dependent on or engaged with their devices, even during short trips.","Setting: On the MRT - The people are in a crowded train cabin, showing how they spend their time commuting from one place to another.","Action: Everyone is absorbed in their screens - This reflects how digital devices dominate our daily lives. It also raises questions about reduced face-to-face interaction. People may also be tired after a long day and using their phones to relax, but it also shows how rare it is now for people to just observe their surroundings or talk to others in public.","Technology in everyday life","Social connection vs disconnection","Digital habits and balance","Public transport etiquette"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"Yes, I often see this on the MRT too. Once, even my friend and I were\n sitting next to each other but we were both just scrolling through our phones instead of talking."},{"prompt":"If I were in this picture, I would...","answer":"/ would probably also be looking at my phone, but sometimes I like to look out the window or observe the people around me. It makes me feel more present."},{"prompt":"I feel this is important because...","answer":"think we rely on our phones a lot, and while it's useful, we should also remember to take breaks from screens. It's good to be aware of what's happening around us, especially on public transport."}],"questions":["What do you think the people in the photo might be using their phones for?","Would you rather spend your commute talking to someone or using your phone? Why?","What are some good habits we should practise when using mobile phones in public?"],"basic":[{"S":"I think most of the people in the photo are using their phones for entertainment, like watching videos or playing games.","P":"During long or routine train rides, people often turn to their phones to help pass the time. It is a way to relax, especially after a busy day. Using their phones can help them feel less bored or tired, and some might use it to take their mind off stress.","E":"For example, after a long day at school, I like to play puzzle games on my phone during the MRT ride home. It helps me focus on something fun and takes my mind off homework for a while. I have also seen my dad read the news on his phone while commuting, just to catch up on what is happening.","A":"I believe many of the commuters in the photo are likely doing something similar, finding ways to stay relaxed or updated during their journey.","K":"All in all, using phones for entertainment or quick updates while travelling is extremely common, especially in Singapore."},{"S":"I would rather use my phone during my commute.","P":"Using my phone helps me relax and enjoy the journey in my own way. It gives me something fun to focus on and makes the time pass faster, especially if I am tired and do not feel like talking to another person.","E":"For example, I usually play Roblox or watch Minecraft videos on YouTube while travelling to my enrichment class. It helps me unwind, giving my brain a break from a busy day of learning and socialising.","A":"That is why I prefer using my phone. Chatting with a friend might make me feel more tired, whereas my phone keeps me entertained.","K":"So yes, during most commutes, I would choose my phone because it is fun and helps me enjoy the ride more."},{"S":"We should always use our phones politely and safely when in public.","P":"This means using earphones instead of loudspeakers, not blocking doorways while watching videos, and being aware of people who may need help or space. It also includes putting the phone away when it is time to give up a seat or move aside.","E":"I remember once seeing a boy completely distracted by a video game while standing near the train doors. He did not notice a lady with a stroller trying to get through until someone had to tap him. That moment showed me how being distracted by our phones can cause inconvenience to others.","A":"That is why it is important to be mindful of our surroundings and use our phones in a respectful way when we're out in public.","K":"All in all, simple habits like using earphones and being alert can make public spaces safer and more pleasant for everyone."}],"advanced":[{"P":"On public transport, many commuters stream videos, play games, or scroll through updates to unwind. Others may message family, check news or train timings, or use music to block out noise. These tasks make the ride feel shorter while keeping them informed.","E":"On my usual MRT route, I see students with earbuds watching short clips, adults reading news apps, and some people tracking bus arrivals. I also use my phone to review homework notes or watch videos when I am tired.","A":"Thus, it is reasonable to conclude that most commuters use their phones to stay entertained, connected, and updated during travel.","K":"That is why phones are popular on commutes, as they provide convenience and variety in how we spend time in our busy lives."},{"S":"I would usually prefer to use my phone during my commute, unless I am with someone I enjoy talking to.","P":"Phones give me the opportunity to enjoy myself without disturbing others. I can play games, reply to my friends' messages, or watch entertaining videos. However, if I am with someone like my cousin or best friend, I would prefer to talk instead, since we share many interests and can keep each other entertained, while also saving my phone's battery!","E":"Once, when I was on the MRT with my best friend, we spent the whole ride laughing over funny things that happened in school. But on days when lam alone, I watch football highlights or play puzzle games. I also use messaging apps to chat with my classmates and share viral memes. We even remind each other about homework sometimes.","A":"So, it depends, but I think having my phone gives me more options to use my time well, whether it is relaxing or chatting.","K":"That is why I would usually choose my phone during a commute, unless I have someone with me who makes the trip more fun."},{"S":"When using mobile phones in public, we should practise habits that show respect and awareness of our surroundings.","P":"This includes using earphones to avoid disturbing others, keeping our voice low during calls, and staying alert especially when crossing roads or moving through crowded areas. We should also give up seats to those who need them and look up regularly to check for people trying to pass.","E":"I once saw a teenager sitting in a reserved seat on the MRT, so absorbed in a video that he did not notice an elderly man standing beside him. A commuter nudged him, and he immediately offered his seat. Since then, I have reminded myself to be aware of my surroundings and put my phone away whenever the train gets crowded.","A":"These habits show we are considerate and responsible users of technology, not just distracted ones.","K":"Overall, good phone habits in public help keep everyone safe, comfortable, and respected."}],"audio":{"basic":"audio/tech-3-basic.mp3","adv":"audio/tech-3-adv.mp3"}},{"n":4,"img":"img/tech-4.jpg","see":"I see a family of four spending time in their living room. Two adults, likely the parents, are sitting on the sofa, watching a television programme. One child is seated on the floor, looking down at a phone, and another child is lying on his tummy, smiling while playing with a tablet. It looks like they are all in the same room, but doing different activities.","think":["Object: Mobile devices and television - This shows that technology plays a big part in our daily lives and family routines. It also suggests that while families are physically together, they may be mentally focused on different things.","Setting: Family living room - This suggests a shared space where family members are supposed to come together and bond.","Action: Family spending time in the same room but doing separate things - This could show a lack of interaction among family members. It may suggest the need to balance screen time and quality time.","Technology and family life","Screen habits","Quality time vs digital distraction","Mindfulness and being present"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"Yes, my family sometimes watches TV together, but my brother and I\n end up using our phones instead. My mother always reminds us to put them away so we can enjoy the show as a family."},{"prompt":"If I were in this picture, I would...","answer":"I would try to focus on the show with my parents and maybe talk about it afterwards. It would be a nice way to connect with them."},{"prompt":"I feel this is important because...","answer":"I think spending real time with family is important. If everyone is busy on their own devices, we might miss chances to talk and bond. Putting our phones down shows we care about each other."}],"questions":["What do you think is happening in this picture and how do you feel about it?","What electronic devices do you usually use at home, and what do you use them for?","What are some ways you and your family can spend more quality time together without screens?"],"basic":[{"S":"I think the family is spending time together, but each person is focused on something different.","P":"Even though they are in the same room, only the adults are watching the TV. The children are using their devices, which shows they are not really interacting as a family, despite having gathered in the living room together.","E":"Sometimes, my family sits together in the living room, but my sister is watching TikTok on her phone, my dad is replying to emails, and I am playing a game. We are together, but not really talking.","A":"So, I think the picture shows how technology can bring people to the same place but also make them ignore each other, which is why I feel a bit sad when I see this picture. It reminds me that being together should also mean spending time with each other.","K":"I hope that most families are not like this in reality, as it can harm their relationships and weaken their family bond."},{"S":"I usually use my phone and laptop at home.","P":"I use my phone mostly to watch videos, play games, or chat with my friends. I use my laptop when I need to do my homework or attend online classes.","E":"For example, after school, I use my laptop to log in to the Student Learning Space to revise for my upcoming tests. I go through notes and complete practice questions, helping me feel more prepared and confident. After finishing my revision, I use my phone to relax by watching YouTube videos, which allows me to unwind and take a short mental break before doing other homework or chores.","A":"I think these devices are useful in my life, but I also know it is important not to use them too much.","K":"That is why I try to manage my time so I can use my devices for both work and fun without overusing them."},{"S":"One way my family can spend more quality time together is by engaging in screen-free activities, such as playing card games or board games.","P":"Engaging in such activities together allows us to talk more, enjoy each other's company, and have fun while playing the game.","E":"Last weekend, my family played UNO after dinner because my father suggested we put our phones away for the night. We laughed a lot while playing and enjoyed teasing each other over the cards. It felt nice to spend time together without phones or tablets, and I really enjoyed being with my family.","A":"This made me realise that even simple activities can bring great happiness and strengthen our family bonds.","K":"Therefore, I believe we should make more time for screen-free activities and enjoy doing things together as a family."}],"advanced":[{"S":"The picture shows a family sharing the same space but not the same moment, and I feel this highlights how technology can reduce real connection within families.","P":"The parents are watching the TV together, but the two children are completely focused on their own devices. This suggests that although they are physically together, each person is in their own digital world. It reflects how personal screen time can replace shared experiences, even when families are in the same room.","E":"I remember one Sunday evening when my mother suggested we watch a movie together. She made popcorn and set up the living room nicely. But halfway through the movie, my older brother put on his headphones and started watching football highlights on his phone. My mum looked disappointed but did not say anything. Later, she told me she just wanted us to have one evening where everyone enjoyed the same thing together. That made me realise how easily technology can pull us apart if we let it.","A":"So when I see this picture, I feel concerned. It reminds me how important it is to put devices aside sometimes and give our full attention to our family.","K":"I have slowly come to understand that it is not just about being in the same room. It is about paying attention to each other and being present."},{"S":"At home, I regularly use my tablet, mobile phone, and the family desktop computer for different purposes.","P":"These different devices can support different tasks, from planning and creating to communicating and submitting my school work.","E":"Last term, I had a Science project on ecosystems. My group decided to create a digital presentation with visuals and voiceovers. I used the desktop to organise the slides and type out the information, the tablet to draw some diagrams of food chains, and my phone to send recordings and coordinate with my teammates through our group chat. It took some time, but I was proud that I used my devices in a meaningful way for learning.","A":"This shows how different devices can help us in different ways at home. It is not just for entertainment, but for learning and creativity too.","K":"All in all, I feel that electronic devices are very useful when used wisely. I try to make sure I am not just using them for fun, but also to help me learn and improve."},{"S":"To strengthen our family bond, I think it is important that we set aside regular time to connect without screens, such as through shared activities.","P":"When we put aside our phones and tablets, we are more likely to pay full attention to one another. Activities like hiking, board games, or even doing chores together can turn into opportunities for meaningful conversations and laughter. These shared moments create stronger memories and help us feel closer as a family.","E":"During last year's National Day weekend, we planned a \"no screens day\". My parents brought us to a nearby park where we had a picnic and played frisbee. After that, we went home and made pizza together from scratch. Everyone had a task. I grated the cheese, my sister chopped vegetables, and my dad kneaded the dough. It was messy, fun, and one of the rare days when no one touched their devices. That day stood out to me because we talked, laughed, and worked as a team.","A":"It made me realise how much we usually rely on screens for entertainment, and how much we gain when we step away from them and focus on each other.","K":"That is why I believe setting aside screen-free time for hands-on activities can help families grow closer and truly enjoy each other's company."}],"audio":{"basic":"audio/tech-4-basic.mp3","adv":"audio/tech-4-adv.mp3"}},{"n":5,"img":"img/tech-5.jpg","see":"I see shoppers using self-checkout counters to pay for their groceries at a supermarket. There are people of different ages, including adults and elderly shoppers, standing in front of the machines. The self-checkout machines and the groceries stand out clearly in the picture.","think":["Object: Self checkout machines - Self-checkout counters suggest that supermarkets are adopting technology to speed up payments and make shopping more convenient.","Setting: A supermarket - This highlights that even a common place like a supermarket uses advanced technology for more efficiency.","Action: People using the self checkout counters - People using these reflects how technology has become an essential part of everyday tasks, making things more efficient.","Importance of embracing technology","Convenience in daily life","Independence"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"Yes, my family often uses the self-checkout counters at supermarkets\n like FairPrice or Sheng Siong. At first, we were hesitant, but after trying it once, we realised how quick and easy it is."},{"prompt":"If I were in this picture, I would...","answer":"I would confidently scan and bag my items by myself, as I'm already comfortable using these machines."},{"prompt":"I feel this is important because...","answer":"&. I feel it is important to stay open-minded and learn how to use new technology. It not only helps me become more independent, but it also saves time for both myself and others around me."}],"questions":["Look at the people in the picture. What are they doing, and why do you think they have chosen to do that?","Share about a time when technology helped you accomplish something.","Do you think it is important to keep up with new technology?"],"basic":[{"S":"The people in the picture are using self-checkout machines to pay for their groceries.","P":"I think they have chosen this because using these machines can be quicker and more convenient. They probably want to save time instead of queuing at a traditional cashier.","E":"For example, my family uses self-checkout counters whenever we go grocery shopping at FairPrice. We do this because the lines are usually shorter, and we can leave the store faster. Using the self-checkout also allows each of us to scan and pack our items at our own pace, which makes the process more efficient and less stressful.","A":"That is why I think the people in the picture are also using the machines because it is faster and more convenient, especially when you are in a rush.","K":"After all, as the saying goes, \"Time waits for no one,\" so people try to make the most of it."},{"S":"One time technology helped me was when I used my laptop to complete a school project using Microsoft PowerPoint.","P":"Using the laptop made it easier to organise my ideas, create slides, and add visuals and animations to make my presentation more engaging.","E":"For example, I was able to insert relevant images, charts, and diagrams into my slides, and use PowerPoint's formatting tools to make the content clear and visually appealing. My teacher praised me for having a well- structured and professional-looking presentation.","A":"Therefore, using technology helped me accomplish my _ project successfully.","K":"I believe this proves the saying, \"Work smarter, not harder.\""},{"S":"Yes, I think it is very important to keep up with new technology.","P":"New technology makes life easier and allows us to complete tasks more quickly. If we do not keep up, we might struggle to use helpful tools like self-checkout machines or the latest smartphone models.","E":"For example, my father is still not used to ordering food at a restaurant using a QR code. He often asks the service staff to take his order for him, which sometimes makes me feel embarrassed. One day, I patiently showed him how to use it, and he realised how simple it was, even though he had initially thought it would be difficult because it was new technology. This shows how important it is for everyone, young and old, to stay up to date with new technology.","K":"Technology is advancing rapidly, and who knows what kinds of inventions we will encounter in the near future."}],"advanced":[{"S":"The people in the picture are scanning and paying for their groceries at self-checkout counters.","P":"They have likely chosen this method because it is quicker and allows them more control over their shopping process. They may prefer doing it themselves rather than waiting for assistance from a cashier, especially when buying only a few items.","E":"For instance, there was a time my mother was rushing to prepare dinner, and the supermarket was very crowded. By using the self-checkout, we managed to scan and pay for our groceries in just a couple of minutes instead of waiting in long lines. It really saved us a lot of stress that evening.","A":"Thus, the shoppers in this picture might have similar reasons, valuing efficiency and convenience.","K":"This shows that many people today appreciate how technology helps them manage their time wisely. After all, \"Lost time is never found again.\""},{"S":"One memorable experience where technology helped me accomplish something was when I participated in an online storytelling competition.","P":"I needed to record myself narrating a story and upload the video to the competition website. Using technology allowed me to edit my video, add music and subtitles, and present my story clearly.","E":"For instance, I used a video-editing app called CapCut to enhance my storytelling video. I added background music to set the mood and captions to make the dialogue clearer, which made my story more engaging and easier for viewers to follow. Because of these improvements, my story stood out in the competition, and I was proud to win second place. The experience showed me how technology can help bring creative ideas to life and make my work more impactful.","A":"This demonstrates how technology can enhance our skills and help us achieve greater success.","K":"Indeed, this reminds me of the saying, \"Tools are only as good as the person using them.\" I learnt that technology can help us greatly if we use it creatively and wisely."},{"S":"Yes, I strongly believe that it is essential to keep up with new technology.","P":"Keeping up with technology allows us to stay independent, informed, and connected. It also prepares us better for the future because the world is rapidly changing.","E":"For example, when my school introduced a digital platform called SLS for submitting and managing our assignments, some students who were not familiar with it struggled at first. They found it confusing to navigate the different sections and upload their work correctly. However, because I had taken the time to explore and learn the system early, I was able to adapt quickly and even help my classmates. This experience taught me that keeping up with new technology can give us an advantage and allow us to assist others as well.","A":"This taught me the importance of continuously learning about technology, as it keeps me ready for any new challenge.","K":"After all, as the proverb goes, \"Change is the only constant,\" so we must be open and prepared for it by embracing new technology."}],"audio":{"basic":"audio/tech-5-basic.mp3","adv":"audio/tech-5-adv.mp3"}},{"n":6,"img":"img/tech-6.jpg","see":"I see a group of people crossing the road at a zebra crossing. Most of them are looking down at their mobile phones and not paying attention to their surroundings. The group includes both young and old individuals, possibly students heading to school and working adults on their way to work,","think":["Object: Mobile devices - This shows that mobile phones are a big part of people's lives, even when they are outdoors. It suggests that many rely heavily on their devices and may be unaware of what's happening around them.","Action: People walking on a zebra crossing while using their phones - This could show a lack of awareness and poor safety habits. It may suggest that people are distracted and not paying enough attention to their surroundings, especially in situations where they should be alert.","Technology in everyday life","Road safety and awareness","Digital distraction","Responsible device use"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"&. This reminds me of a time I almost walked into someone because I was\n checking a message while walking. After that, I reminded myself to always stop and check my phone at the side."},{"prompt":"If I were in this picture, I would...","answer":"if I were in this picture, I would keep my phone in my pocket and look left and right carefully before crossing."},{"prompt":"I feel this is important because...","answer":"I think this is important because our safety matters more than\n checking messages. It's better to stay alert, especially when we're near traffic."}],"questions":["What does this photo make you think about?","Have you ever used a device so much that you forgot about other things around you?","Why do you think it is important for people to put their devices away while walking?"],"basic":[{"S":"This photo makes me think about how often people use their phones without paying attention to their surroundings.","P":"It shows that sometimes we are so focused on our screens that we forget to be aware of what is happening around us, which can be dangerous, especially when crossing the road.","E":"Once, I saw a video online of a young woman getting hit by a car while jaywalking, her eyes fixed on her phone. Some commenters blamed the driver for speeding, while others blamed the pedestrian for not paying attention to her surroundings. I was deeply shocked by the incident and vowed never to use my phone while walking.","A":"This is why the photograph makes me feel extremely nervous, as it reminds me of the dangers people face when they keep their phones in front of their faces while walking.","K":"Overall, it also makes me think about the importance of staying alert and putting safety first before looking at our phones."},{"S":"Yes, I have used my phone for so long that I forgot about what was going on around me.","P":"Sometimes when I am playing games or watching videos, I get so focused that I lose track of time and do not notice what others are doing around me.","E":"For example, during the school holidays, I was playing a mobile game at home and did not realise that my mother had been calling me for dinner. She had to come into my room to get my attention, and proceeded to scold me for my inattentiveness. After that, I promised myself to be more aware of my surroundings and to put my phone down when someone is trying to get my attention.","A":"The incident made me realise that being too focused on a device can make me miss important things happening nearby.","K":"So yes, I have experienced this before, and it reminds me to take breaks and be more aware of my surroundings."},{"S":"It is important for people to put their devices away while walking to ensure their own safety and to avoid inconveniencing others.","P":"When people are focused on their phones, they may not notice obstacles, traffic, or other people around them. This can increase the risk of accidents and conflicts.","E":"For example, I once saw a student walking home while engrossed in a mobile game with earphones in. He was blocking an elderly man on a personal mobility device, who rang his bell and shouted for him to move. Only when the man poked him with an umbrella did the boy step aside, hanging his head in shame for the rest of the journey.","A":"The boy was fortunate that the elderly man noticed him and slowed down. Otherwise, he could have been hit and injured.","K":"Therefore, putting devices away while walking helps prevent accidents and keeps ourselves and others safe."}],"advanced":[{"S":"This photo makes me think about the problem of distraction caused by mobile phones, especially in situations where we should be alert.","P":"When people walk while looking at their phones, their attention is divided. They may not notice dangers such as oncoming vehicles or obstacles. This also reflects how our dependence on technology can affect our safety and awareness.","E":"Once, while walking home from school, I witnessed a boy nearly step onto the road without checking for traffic because he was engrossed in reading a message on his phone. A cyclist had to ring his bell sharply to capture the boy's attention and prevent a potential accident. The incident made me acutely aware of how easily and swiftly mishaps can occur when we are distracted, and it underscored the importance of remaining vigilant and attentive while navigating our surroundings.","A":"That moment stayed with me and made me more careful about putting my phone away before crossing any road.","K":"Therefore, this picture reminds me that we need to balance our phone use with being alert to our surroundings for our own safety."},{"S":"Yes, I have been so absorbed in using a device that I lost track of my surroundings.","P":"Digital devices can be very engaging, and sometimes we get so focused on them that we block out the world around us. This can cause us to miss important events or even put us in danger.","E":"During the December holidays, I once spent several hours engrossed in an online game on my tablet. I did not realise that my younger brother had been repeatedly asking for my help with his homework. By the time I became aware, he was frustrated and had already sought assistance from my mother. I felt guilty for neglecting him, even though it was unintentional, and it made me reflect on the importance of being attentive to others despite distractions.","A":"That incident showed me that overusing devices can affect not only my awareness but also my relationships with others.","K":"So yes, I have experienced this, and it taught me to be more mindful of how much time I spend on devices and what is happening around me."},{"S":"I believe it is of paramount importance to put devices away while walking to maintain situational awareness and prevent avoidable mishaps.","P":"When pedestrians are fixated on their screens, they become oblivious to their surroundings. This phenomenon, often called \"distracted walking,\" significantly reduces their reaction time to potential hazards like uneven paths, oncoming traffic, or other commuters. It also shows a lack of consideration for others sharing the public space. I recently witnessed a terrifying incident that shows this danger. At a junction, the \"Green Man\" signal had just started flashing, and a young man stepped onto the crossing while staring at his phone, assuming he was safe. A car rounding the corner did not slow down, and it was only a bystander's scream that made him look up, just as the car screeched to a halt inches away.","A":"That narrow escape highlighted how a split second of distraction can lead to catastrophic consequences. It is simply not worth risking one's life for a text message.","K":"Therefore, we must remain vigilant and be responsible pedestrians, keeping our eyes on the path, as our safety can never be taken for granted even when the green man is flashing."}],"audio":{"basic":"audio/tech-6-basic.mp3","adv":"audio/tech-6-adv.mp3"}},{"n":7,"img":"img/tech-7.jpg","see":"I see a young boy and an elderly woman sitting together at a table. The boy is pointing at something on a tablet, while the elderly woman looks at the screen attentively. The boy is wearing a striped polo shirt, and the woman is wearing a plain T-shirt. The tablet is in a case with a stand, placed in front of them on the table.","think":["Setting: A family living room - This shows a shared space in the home where family members usually gather and bond with each other.","Action: Boy showing the elderly woman something on the tablet - This could show care and patience from the younger generation, and willingness to learn from the older generation. It may also suggest that technology can be a bridge between people of different ages.","Intergenerational bonding","Sharing knowledge","Technology as a learning tool","Patience and communication"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"&. This reminds me of the time I taught my grandmother how to use"},{"prompt":"If I were in this picture, I would...","answer":"if I were in this picture, I would make sure to explain things slowly so the elderly woman understands. I would also answer any questions she has patiently.\""},{"prompt":"I feel this is important because...","answer":"I think this is important because helping older people learn technology can make them feel more included and connected with family and friends."}],"questions":["What could the boy be showing or sharing with the elderly lady?","Describe a time when you taught someone something.","Is it important for older people to learn how to use technology? Why or why not?"],"basic":[{"S":"I think the boy could be showing the elderly lady some family photos or a simple game on the tablet.","P":"Family photos are a nice way to share memories and make someone smile. A game could be something fun that they can enjoy together, even if she is not used to using technology.","E":"Once, I helped my grandmother open an album on my phone to see pictures from our family trip. She laughed when she saw a picture of my dad making a funny face. We spent a long time talking about that holiday.","A":"That is why I think the boy could be showing something simple yet meaningful, like pictures or a game they can both enjoy.","K":"This simple photograph shows how technology can bring family members together, bringing different generations together and strengthening their bond."},{"S":"I once taught my aunt how to send an email on her new laptop.","P":"She had just started a new job and needed to email her colleagues, but she did not know how to attach files or type in the email address correctly.","E":"One afternoon, we sat together at the dining table. I showed her how to log into her email, type her message, and attach a document. She practised by sending me a test email with a photo of her cat. We laughed when she accidentally sent it twice, but after a few tries, she got it right.","A":"It made me happy to know I had helped her feel more confident about using her laptop for work.","K":"That is why I think teaching technology skills is important, because it helps others work and communicate more easily."},{"S":"Yes, I think it is important for older people to learn how to use technology.","P":"It helps them stay connected with family and friends, especially if they cannot meet in person. They can also use it to get information, shop online, or manage their health appointments.","E":""}],"advanced":[{"S":"The boy could be showing the elderly lady family photos, a video message from relatives, or even teaching her how to play a simple game on the tablet.","P":"Family photos and videos can spark happy memories and keep her updated about loved ones who may not visit often. A game can help her feel included and may even encourage her to use technology more confidently. I remember once helping my grandfather find old photos of his childhood village using Google Images. We spent nearly an hour looking through similar pictures, and he told me stories about his life there, like the friends he played with, the festivals they celebrated, and even the food they ate. He was overjoyed to be able to share part of his history with me. That is why I think the boy might be sharing something that is not just entertaining, but also builds connection and understanding between them.","K":"This simple photograph demonstrates how technology can unite family members, bridging different generations and fostering connection."},{"S":"I once taught my grandfather how to use a tablet so he could read the news online.","P":"He used to buy newspapers every morning, but sometimes the shop would run out of copies. Using a tablet meant he could read anytime, anywhere, and even zoom in on the text if it was too small.","E":"I started by showing him how to switch on the tablet and open the browser. Then, I bookmarked his favourite news site so he could find it easily. At first, he was slow at scrolling and sometimes pressed the wrong link, but I encouraged him to keep trying. A few weeks later, he proudly told me he had read an article on his own and even watched a news video.","A":"It was rewarding to see him gain confidence with technology and enjoy something he loved in a new way, all thanks to my guidance.","K":"That experience showed me that technology can give older people more choices and make daily routines easier."},{"P":"Technology helps them stay in touch with family members, especially if they live far apart. It also gives them access to important services like telemedicine, online banking, and digital news updates. Without these skills, they might feel left out or disconnected.","E":"Last year, my neighbour, who is in her seventies, asked me to show her how to order groceries online. She found it useful because she no longer needed to carry heavy bags from the supermarket. A week later, she told me she had also managed to order
