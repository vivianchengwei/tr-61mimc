eness, showing that the student may be discussing something important.","Action: Talking and listening - This highlights the importance of open communication in solving problems.","Importance of mental health and wellness in school","Seeking help instead of keeping worries inside","The value of empathy and trust between adults and students","Building resilience and learning strategies to cope with stress"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the time when my teacher shared that we could talk to the school counsellor if we felt stressed or had personal problems. It showed me that help is always available.\n If were in this picture, I would... if I were in this picture, I would share my worries about exams or friendships and ask for advice on how to manage them."},{"prompt":"I feel this is important because...","answer":"I think this is important because having someone to listen makes students feel supported and less alone in facing challenges."}],"questions":["Who do you think the people in the picture are? What do you think they are talking about?","Can you share a time when you asked someone for advice or support?","Do you think it is important for students to seek help when they face problems?"],"basic":[{"S":"I think the woman is a school counsellor and the person sitting across from her is a student who has come to discuss a problem.","P":"Since counsellors are trained to listen and guide students without judging them, I think the student is there because she finds it easier to open up to the counsellor.","E":"My classmate once spoke to the counsellor when she felt very stressed, and afterwards she felt more confident about handling schoolwork.","A":"That showed me that counsellors can provide useful advice and emotional support.","K":"So I think the student is sharing her worries with the counsellor, who is helping her feel better and find solutions."},{"S":"Yes, I can share a time when I asked my teacher for advice.","P":"I was struggling to keep up with the amount of homework I had and felt very overwhelmed.","E":"I went to talk to my teacher about it. She suggested that I create a simple timetable for after school so I could plan my time better and and complete my assignments step by step. Following her advice helped me feel more organised.","A":"That experience showed me how helpful it can be to seek guidance.","K":"Thus, I was glad I asked for advice as it made things much easier for me."},{"S":"Yes, I think it is important for students to seek help when they face challenges.","P":"Talking to a trusted adult can help them feel less stressed. They will also be provided with practical solutions.","E":"For example, one of my friends had a conflict with another classmate and felt upset about it. Instead of handling it alone, he spoke to our form teacher. The teacher listened to both sides and helped them talk things out calmly. In the end, they understood each other better and resolved the conflict.","A":"This shows that asking for help prevents problems from getting worse.","K":"So yes, seeking help is important for both emotional well-being and problem-solving."}],"advanced":[{"S":"I think the woman is a school counsellor and the person sitting across from her is a student. They are most likely talking about a personal problem or challenge the student is facing at school. Counsellors are professionals who are trained to provide guidance and help students cope with both academic and personal challenges. Unlike friends, they can offer strategies and perspectives that are based on experience. Talking to them can also reduce feelings of isolation.","E":"For instance, my friend once felt very anxious about exams and went to the counsellor. The counsellor taught her breathing exercises, relaxation methods, and how to create a balanced revision plan. She eventually overcame her anxiety and performed better in her studies.","A":"This showed me that reaching out to a counsellor can truly change how students cope with stress. It's not just about solving one problem but also about learning skills for life.","K":"Therefore, I believe the student is openly discussing her concerns with the counsellor, and the counsellor is responding with guidance to help her feel better and move forward positively."},{"S":"Yes, I can share a time when I asked my older cousin for support.","P":"I was nervous about giving a school presentation, so I asked her for tips since she is good at public speaking.","E":"She encouraged me to practise in front of the mirror and even record myself so I could notice my mistakes. On the day of the presentation, I still felt nervous, but her strategies helped me stay calm and speak clearly. I was proud that I managed to overcome my fear.","A":"That experience taught me that advice from someone experienced can make us more confident and capable.","K":"So yes, asking for support really helped me succeed in a difficult situation I thought I couldn't overcome."},{"S":"I believe it is very important for students to seek help when they face problems.","P":"If students keep their problems to themselves, they may feel overwhelmed, which can affect their studies and well-being. Seeking help allows them to share their burden, get emotional support, and find practical solutions. Trusted adults like counsellors, teachers, or even family members can guide them to see problems in a new way.","E":"For example, during exam preparation, I once felt very stressed and exhausted. My teacher encouraged me to take short breaks, use active recall when studying, and sleep earlier. Following this advice not only helped me perform better but also made me healthier and happier.","A":"That made me realise that asking for help is a sign of strength, not weakness. It shows that we value our well-being and are willing to improve.","K":"So yes, seeking help is essential because it builds resilience, reduces stress, and allows students to handle challenges in a healthier way."}],"audio":{"basic":"audio/sports-9-basic.mp3","adv":"audio/sports-9-adv.mp3"}},{"n":10,"img":"img/sports-10.jpg","see":"I see a boy standing in his room with his arms stretched high above his head. He looks like he is taking a break or doing a simple stretch. On the table beside him, there are open books, a pen, and a notebook, which suggests that he was studying. The room is neat, with a bed, a chair, and a small plant on the desk.","think":["Object: Open books and desk - This shows that the boy has been studying or doing homework.","Setting: Room - This suggests that he might be studying.","Action: Taking a break - This suggests he is trying to refresh his mind before continuing his studies.","The importance of balancing study and rest","Healthy habits for concentration and focus","Taking care of both the body and the mind during learning"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of when I take short breaks to stretch or walk around during long study sessions. It helps me feel less tired and keeps my mind alert."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would also stretch or maybe do a few quick exercises before going back to study. That way, I would feel more refreshed and ready to focus."},{"prompt":"I feel this is important because...","answer":"I think it's important to rest in between study sessions because it prevents fatigue, improves concentration, and helps us perform better in school."}],"questions":["What do you think the boy in the picture is doing?","Can you share a time when you felt tired while studying and what you did to feel better?","Why do you think balancing study and rest is important for students?"],"basic":[{"S":"I think the boy is taking a short break to stretch while studying.","P":"The boy is standing with his feet slightly apart and arms raised above his head. There is an open book on the desk next to him which tells me that he was studying. Studying for too long without a break can make us feel restless and tired. Stretching gives our body a chance to loosen up, and our mind also feels more refreshed.","E":"For example, whenever I do my revision, I would often study for about half an hour before standing up to stretch. Just a few minutes of stretching or walking around the house gave me more energy to continue revising. This showed me that short breaks are not a waste of time but actually make studying more effective.","K":"So I think the boy is taking a stretching break, which is a smart way to stay fresh and study better."},{"S":"Yes, I remember a time when I felt very tired while studying.","P":"It was the night before a Science test, and I had been reading my textbook for more than two hours without stopping. My neck was hurting and my vision was blurry. After some time, I realised I was no longer concentrating.","E":"To feel better, I decided to close my book, drink a glass of water, and stretch my arms and legs. I even looked out of the window for a while to rest my eyes. After about ten minutes, I felt more awake and was able to finish my revision properly.","A":"That experience taught me that listening to my body is important.","K":"So yes, I now remind myself to take short breaks to help me feel better and continue studying more productively."},{"S":"Balancing study and rest is important because it helps students stay healthy and do well in school.","P":"If students only study without resting, they may feel stressed, forget information, or even fall sick. Resting gives the brain time to recover and keeps the body energised.","E":"For example, I once stayed up very late to revise, but the next day I was too tired to focus during the exam. After that, I decided to study earlier and rest properly. This made me perform better in the next test.","A":"That showed me that rest is just as important as studying.","K":"So I believe that every student should balance both in order to succeed and feel well."}],"advanced":[{"S":"I think the boy is taking a healthy break from studying to stretch and give both his mind and body a rest.","P":"The boy is standing with his arms extended upward, reaching toward the ceiling. With his eyes closed and a relaxed face, he seems to be taking a quiet moment to ease tension. When we sit for long periods, our bodies feel stiff, and our minds become less alert. Stretching allows our muscles to relax and improves blood circulation, which helps us feel energised. It also gives our eyes a break from staring at books or screens. Furthermore, psychologists say that short breaks can actually improve focus and memory, which is especially useful for students. For example, when I was preparing for my exams, I used the Pomodoro technique where I studied for about 25 minutes and then took a 5-minute break. During those breaks, I walked around the house, drank some water, and even pet my cat. I realised that when I did this technique, I could remember more and felt less stressed compared to when I studied non- stop.","A":"That experience showed me that short breaks are not wasted time but are actually a smart strategy to learn more effectively.","K":"So, I believe the boy is stretching during his breaks as it is important for both physical health and mental focus."},{"S":"Yes, I can recall a time when I felt extremely tired while studying. It happened during the school holidays when I tried to finish all my assignments in one day. After hours of reading and writing, I felt my concentration slipping. My eyes hurt, and I could barely understand what I was reading anymore.","E":"Instead of forcing myself, I decided to take a proper break. I went for a quick walk in the park with my family. When I returned to my desk, I felt refreshed and was able to complete my assignments much faster.","A":"This experience taught me that breaks are not a sign of laziness or distraction. It is fine to take them as long as we can get back on track.","K":"So yes, whenever I feel tired while studying now, I take short breaks to recover and it always helps me perform better."},{"S":"I believe balancing study and rest is very important for students because it helps them succeed in their studies while maintaining good health.","P":"Studying requires focus, but without enough rest, the brain cannot process or retain information properly. Students who focus only on studying may feel anxious, forget easily, or even fall sick from exhaustion. On the other hand, resting allows the body and mind to recharge, making studying more effective. It also prevents burnout and encourages a healthier lifestyle. For instance, I once revised late into the night before a Math exam because Math was my weakest subject. Even though I studied many chapters, I could barely remember what I learnt because I was too tired. Ever since that day, I started managing my time better and stopping to rest when needed. This not only improved my exam results but also made me feel calmer and more in control.","A":"That experience showed me that we shouldn't prioritise study over rest, or rest over study, because both are equally important. When we are well- rested, we are happier, healthier, and more motivated to learn.","K":"So yes, I strongly believe that balancing study and rest is essential for every student. It helps us achieve academic success without harming our well- being."}],"audio":{"basic":"audio/sports-10-basic.mp3","adv":"audio/sports-10-adv.mp3"}}]},{"id":"sg","name":"Singapore & Culture","short":"Singapore & Culture","zh":"新加坡与文化","color":"#E0314B","sets":[{"n":1,"img":"img/sg-1.jpg","see":"In the picture, I see a group of children standing on a stage. They are dressed in different traditional costumes, such as the cheongsam, baju kurung, and sari. The children are smiling happily and standing close together, which shows that they are enjoying the event. Behind them, there are decorations like bunting and banners that suggest this is a celebration.","think":["Setting: The children are standing on a decorated stage in what looks like a school hall - This shows that the event is likely a school celebration of Racial Harmony Day.","Action: The children are smiling and posing together for a photo - This suggests that they are proud to represent their cultures and that they feel happy to celebrate together.","Racial harmony and unity","Respect and appreciation for different cultures","Learning about customs and traditions","School community spirit and celebration"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"= This reminds me of my school's Racial Harmony Day when my classmates wore ethnic costumes and introduced traditional games. I enjoyed seeing the colourful outfits and learning new things from my friends."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would wear a traditional outfit, introduce a custom my family practises, and listen carefully as my friends share theirs so we can learn from one another."},{"prompt":"I feel this is important because...","answer":"I think this is important because understanding different cultures helps us avoid misunderstandings and builds trust, so everyone feels welcome and respected."}],"questions":["Would you enjoy dressing up in traditional costumes like the children in this picture? Why or why not?","Can you share a time you joined a cultural celebration or learnt acustom from another culture?","Why do you think Racial Harmony Day is important for students in Singapore?"],"basic":[{"S":"Yes, I would enjoy dressing up in traditional costumes like the children in this picture.","P":"Wearing an ethnic outfit helps me understand the culture better and shows respect for the traditions it represents. It also makes the celebration feel more meaningful because I am taking part in it actively.","E":"Last year, I wore a baju kurung in school and my friends explained when they usually wear it and why the designs are special. I learnt new words and felt proud to share what I knew about my own culture too.","A":"These experiences helped me see that costumes are more than clothing, they carry stories and values.","K":"So yes, I would enjoy dressing up like the students in the picture because it teaches me something new while bringing everyone together."},{"S":"Yes, I joined a cultural celebration during Racial Harmony Day in school.","P":"My class set up stations for different customs so we could try activities and ask questions. It was interactive and helped us understand the meaning behind each tradition.","E":"I tried making a simple rangoli pattern and learnt how families decorate their homes during Deepavali. I also played five stones and tasted festive snacks while my friends explained the festivals they celebrate.","A":"By taking part, I felt more connected to my classmates and more respectful of their traditions.","K":"All in all, cultural celebrations are valuable because they teach us in a hands-on, memorable way."},{"S":"Racial Harmony Day is important because it teaches students to live peacefully and appreciate differences.","P":"Singapore has many races and religions, so learning about customs helps us avoid stereotypes and communicate kindly. Schools play a key role in guiding students to respect one another.","E":"My teacher shared about Singapore's past racial riots and explained why harmony is important. After our class discussions and activities, I understood how small actions like listening and including others can keep peace strong.","A":"This made me realise harmony is built daily through our words and choices.","K":"Therefore, Racial Harmony Day is essential because it guides us to be thoughtful, inclusive citizens."}],"advanced":[{"S":"Yes, I would truly enjoy dressing up in traditional costumes because it is a meaningful way to celebrate diversity.","P":"Wearing an ethnic outfit helps me step into another culture's stories and values, which builds respect. It also opens conversations where friends explain patterns, fabrics, and when the outfit is worn, so I learn directly from them. Participating this way turns a school event into a personal experience. When I wore a kurta to school, a classmate noticed and started sharing about Deepavali, explaining how his family decorates the house with oil lamps, prepares special sweets, and performs prayers during the festival. I listened with interest and then shared a custom my family practises during our own celebrations, such as preparing traditional dishes and gathering together for family rituals. The conversation made me appreciate how cultural traditions can be unique yet share common values, and it was exciting to learn about my classmate's experiences while sharing my own.","A":"That exchange showed me costumes can spark curiosity and deepen friendships because we understand one another better.","K":"Therefore, I would gladly dress up like the children in the photograph as it combines learning, respect, and joyful celebration."},{"S":"Yes, I joined a school cultural fair that allowed us to learn customs through food, games, and performances.","P":"Experiencing customs directly made the learning memorable. Instead of only reading, we asked questions, tried activities, and listened to classmates explain their family traditions. This helped me connect the customs to real people.","E":"At one booth, I learned how to greet elders respectfully in Mandarin and why that matters in family gatherings. At another, I practised simple Indian dance steps and understood how movement can tell a story. I also tasted traditional Eurasian snacks while hearing the history behind them, which made the flavours more meaningful.","A":"Those moments taught me that customs are living practices that carry values like respect, gratitude, and togetherness.","K":"In summary, joining such celebrations helped me grow more open-minded and appreciative of the cultures around me."},{"S":"Racial Harmony Day is important because it strengthens unity by teaching students to understand, respect, and protect diversity.","P":"Harmony needs daily effort, not just a single celebration. Learning about customs and histories helps us communicate better, stand up against unkind behaviour, and include others in group work and play. Schools provide a safe space to practise these habits so they become part of our character.","E":"After a class discussion on harmony, my group planned a mini-project to showcase different festive customs. We interviewed classmates, created displays, and explained the meaning behind common greetings and foods. Presenting together helped us realise how similar our hopes are, even if our traditions differ.","A":"This showed me harmony grows when we listen carefully, share respectfully, and treat differences as strengths.","K":"Thus, Racial Harmony Day matters because it shapes students into considerate friends and responsible citizens who keep Singapore peaceful and united."}],"audio":{"basic":"audio/sg-1-basic.mp3","adv":"audio/sg-1-adv.mp3"}},{"n":2,"img":"img/sg-2.jpg","see":"I see a group of students sitting cross-legged on the floor of the school hall, watching a performance on stage. On stage, several students are holding microphones and appear to be singing or speaking to the audience.","think":["Object: Singapore flags and decorations - These items symbolise patriotism and pride for the nation. They also set the mood for a national celebration.","Setting: School hall with decorations and a stage - This shows the school has organised a formal celebration, bringing everyone together in a shared space.","Action: Listening attentively to speech - This suggests unity, joy, and pride among the students. It shows that the school values teaching students about national identity and patriotism.","National unity and pride","Patriotism and belonging","School community coming together to celebrate as one nation"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"&. This reminds me of the National Day celebrations in my own school. We would gather in the hall, sing the National Anthem, recite the pledge, and watch performances by our classmates. Sometimes, there were even quizzes and games about Singapore's history."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would sing loudly with my friends, wave my flag proudly, and cheer during the performances. I would also enjoy watching the performances, knowing that my classmates practised hard to prepare them."},{"prompt":"I feel this is important because...","answer":"I feel National Day celebrations in school are important because they remind us of how far Singapore has come as a nation. They also give students a chance to bond with one another and feel proud of our country together."}],"questions":["What do you think the people in the photograph are doing?","Can you share a time when you felt proud to be Singaporean during a school or national event?","Why is it important for schools to celebrate National Day together?"],"basic":[{"S":"I think the students in the photograph are celebrating National Day in school.","P":"The school hall is decorated with many Singapore flags, and there are four children on stage standing in front of a sign that says \"Happy National Day\". They are holding microphones and might be singing songs or giving speeches. In the audience, their classmates are also waving Singapore flags.","E":"I remember last year's National Day celebration in my school when we sang \"We Are Singapore\" together. The hall was filled with energy, and I felt goosebumps as everyone sang in unison. Apart from singing, some students also performed skits about Singapore's history. My favourite part was coming to school dressed in red and white clothes.","A":"So, I think the students in the photograph are also having a National Day celebration in the school hall.","K":"I enjoy being part of this celebration every year as it is both fun and meaningful."},{"S":"Yes, I felt proud to be Singaporean during last year's National Day Parade.","P":"The parade showed Singapore's achievements and unity through performances, speeches, and the fireworks display. It was an event that reminded me how lucky I am to live in a safe and strong country.","E":"When the fighter jets flew past and the National Anthem was played, I stood up and sang loudly. I could feel the excitement and pride from everyone around me as we cheered and waved our flags. Seeing the performers and volunteers give their best, and watching the dazzling fireworks light up the night sky, made the experience even more memorable. All of this together gave me a strong sense of belonging.","A":"Moments like these remind me to appreciate Singapore and the values that unite us.","K":"So, that was one time I truly felt proud to be Singaporean."},{"S":"It is important for schools to celebrate National Day together because it builds unity and pride among students.","P":"Even for just one day, students come together to sing National Day songs, participate in activities, and keep spirits high, which strengthens a sense of belonging.","E":"In my school, we decorated our classrooms with red and white crafts before the celebration. Working together with classmates to create the decorations made me feel a strong sense of teamwork and cooperation. On the day of the celebration, singing songs, and enjoying the performances together filled me with pride in being Singaporean.","A":"These celebrations are not only fun but also help us connect with one another while reminding us of our nationalidentity.","K":"That is why celebrating National Day in schools is important."}],"advanced":[{"S":"I believe the students in the photograph are participating in a National Day celebration at their school.","P":"The school hall is adorned with numerous Singapore flags, and four children stand on stage in front of a banner that reads \"Happy National Day.\" They are holding microphones and may be performing songs or delivering speeches. In the audience, their classmates enthusiastically wave Singapore flags, adding to the festive atmosphere. I recall last year's National Day celebration at my school, where we sang \"We Are Singapore\" together. The hall was brimming with energy, and I felt goosebumps as everyone sang in perfect unison. In addition to singing, some students performed skits depicting key moments in Singapore's history. My favourite part was attending school dressed in vibrant red and white attire, which made the celebration feel even more spirited and patriotic.","A":"From these observations, it seems likely that the students in the photograph are similarly engaging in a lively and meaningful National Day celebration within their school hall.","K":"I always enjoy being part of these celebrations, as they are both exhilarating and a poignant reminder of our national identity."},{"S":"Yes, I have felt proud to be Singaporean on many occasions, especially during school celebrations and the National Day Parade.","P":"Such events highlight our country's progress, values, and achievements. They also remind us of the importance of unity in overcoming challenges as a nation.","E":"During one school National Day celebration, my class performed a song and dance. We practised hard and wanted to give our best. When the audience clapped and cheered, I felt proud to contribute to the event. Watching everyone come together in red and white also reminded me that we all share a common identity.","A":"These experiences made me realise that being Singaporean is about more than where we live. It is about the values and unity we uphold.","K":"Thus, such celebrations always make me feel grateful and proud to be part of this nation."},{"S":"It is very important for schools to celebrate National Day together because it teaches students to value unity and national identity from a young age.","P":"Celebrating as a school creates a sense of belonging and pride. It also reminds us that we are part of something larger than ourselves. Such events encourage teamwork, respect, and patriotism.","E":"In my school, we once organised a National Day carnival with games, quizzes, and a singing competition. Working together with classmates to prepare for the event helped us bond. At the same time, the activities taught us about Singapore's history and challenges. It showed me that unity is not just about celebrating but also about working together towards shared goals.","A":"This made me realise that schools play an important role in nurturing young citizens who are proud of their country and ready to contribute.","K":"Therefore, celebrating National Day together as a school is vital as it builds unity, teaches values, and strengthens national pride."}],"audio":{"basic":"audio/sg-2-basic.mp3","adv":"audio/sg-2-adv.mp3"}},{"n":3,"img":"img/sg-3.jpg","see":"I see a large family sitting together at a dining table, enjoying a festive meal. The family members are smiling, eating, and engaging in conversation. There are both adults and children present, dressed in traditional clothes, which suggests they are celebrating a cultural or religious festival such as Deepavali, Hari Raya, Chinese New Year, or Christmas. The table is filled with many delicious dishes, including rice, curries, snacks, and sweets. The dining area is decorated with lights and festive ornaments, creating a joyful atmosphere.","think":["Setting: A decorated home with lights and ornaments - This suggests that the family has prepared their home to create a festive and welcoming environment.","Action: Eating together and smiling - This shows unity, joy, and strong family bonds.","The importance of family traditions","Celebrating cultural diversity in Singapore","Love, togetherness, and gratitude during festive occasions"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of when my family gathers for Chinese New Year reunion dinner. We prepare many dishes and enjoy them together while catching up with relatives. It is one of the rare times when the whole family sits at the same table."},{"prompt":"If I were in this picture, I would...","answer":"&. If I were in this picture, I would be happy to sit with my cousins, enjoy the delicious food, and join in the laughter. I would also help my parents serve food to the elderly at the table."},{"prompt":"I feel this is important because...","answer":"&: I feel festive meals are important because they strengthen family ties and remind us to appreciate our loved ones. Celebrating together also keeps cultural traditions alive and helps younger generations learn about their heritage."}],"questions":["How do you think the people in the photograph are feeling, and why do you think so?","Can you share a time when you celebrated a festival with your family or friends?","Why is it important for families to celebrate cultural festivals together?"],"basic":[{"S":"I think the people in the photograph are delighted to be celebrating and sharing a meal together.","P":"A large family is gathered around a dining table, enjoying a festive meal. Everyone is smiling and chatting happily while sharing food. The table is filled with rice, curries, snacks, and sweets, and the decorated dining area with lights and ornaments adds to the joyful, festive atmosphere.","E":"Similarly, during Chinese New Year, my family gathers for a reunion dinner. We enjoy hot pot and my grandmother's special dishes. I always feel excited because it is a rare opportunity to see my cousins and spend quality time together.","A":"This makes me think that the family in the photograph is equally thrilled to celebrate a festive occasion together.","K":"Such celebrations create happy memories and help strengthen family bonds."},{"S":"Yes, I have celebrated many festivals with my friends, and one memorable time was Deepavali.","P":"It was my first time celebrating this national holiday when my close friend invited me to his house.","E":"His home was decorated with colourful lights and rangoli at the doorstep. We enjoyed delicious Indian sweets and traditional food together. I remember tasting laddus and murukku for the first time. We also played sparklers outside, which was very fun.","A":"That celebration showed me how festivals are about sharing joy and making memories, even if we come from different backgrounds.","K":"Thus, celebrating cultural festivals with friends is always special."},{"S":"It is important for families to celebrate cultural festivals together because it keeps traditions alive and builds stronger relationships.","P":"When families come together, they pass down cultural practices, values, and stories to the younger generation. It also strengthens unity and creates a sense of belonging.","E":"During Hari Raya, my Muslim friends shared that they visit their grandparents' homes, seek forgiveness from elders, and enjoy traditional dishes like rendang and lontong together. They said these customs help them stay close as a family and preserve their Malay and Muslim cultures.","A":"These celebrations remind us that festivals are about more than just food. They are also about love, respect, and tradition.","K":"That is why it is important for families to celebrate cultural festivals together."}],"advanced":[{"S":"I believe the people in the photograph are brimming with joy and basking in the warmth of togetherness as they celebrate this special occasion.","P":"A multi-generational family is gathered around the dining table, relishing a sumptuous feast. Their faces are illuminated with radiant smiles as they engage in animated conversation, clearly cherishing each other's company. Furthermore, the table is laden with a delectable spread of traditional delicacies, while the vibrant decorations accentuate the jubilant atmosphere.","E":"In a similar way, during Chinese New Year, my extended family convenes for our annual reunion dinner. We indulge in a communal steamboat and savour my grandmother's signature dishes. I always feel a sense of exhilaration because it is a precious opportunity to reconnect with my cousins and strengthen our familial bonds amidst the hustle and bustle of daily life.","A":"This personal experience reinforces my belief that the family in the image is feeling a profound sense of contentment and gratitude to be united for this celebration.","K":"Ultimately, such festive gatherings are instrumental in forging lasting memories and cementing close relationships within the family."},{"S":"Yes, one truly unforgettable occasion was when I celebrated Christmas at my aunt's residence.","P":"She had meticulously adorned her home with a majestic Christmas tree, twinkling fairy lights, and festive stockings, transforming it into a winter wonderland. We exchanged thoughtful tokens of affection and partook in a lavish feast.","E":"I distinctly recall the moment I unwrapped a novel gifted by my cousin. I was deeply moved by her considerate gesture, as she had taken the effort to select a genre I adore. After the meal, we engaged in lively games, simply reveling in the warmth of each other's company.","A":"That experience taught me that festivals transcend mere decorations and food. They are essentially about demonstrating genuine care and appreciation for one another.","K":"In essence, celebrating with family and friends is meaningful because it fortifies our bonds and creates a tapestry of cherished memories."},{"S":"It is very important for families to celebrate cultural festivals together because these events pass on traditions, strengthen identity, and unite families.","P":"Festivals are opportunities for families to teach children about their cultural practices, values, and stories. At the same time, they bring people of different generations together, creating bonds that last.","E":"For example, during Chinese New Year, my family gathers for a reunion dinner where we eat traditional dishes like dumplings and fish. We also exchange red packets and share stories about our ancestors. These activities not only make the celebration fun but also help me understand and appreciate my family's traditions and values.","A":"That experience showed me that festivals are powerful in connecting people across all generations.","K":"Therefore, it is important for families to celebrate cultural festivals together, as these occasions preserve traditions, foster family unity, and help young people develop a deeper appreciation for their cultural heritage."}],"audio":{"basic":"audio/sg-3-basic.mp3","adv":"audio/sg-3-adv.mp3"}},{"n":4,"img":"img/sg-4.jpg","see":"I see a poster on a school wall encouraging students to respect differences, act with kindness, and celebrate inclusivity. It is designed to remind students about good values and behaviours in school. Some students are walking along the school corridor in the background, dressed in their uniforms, likely passing by this poster on their way to class. The poster has three main messages: \"Respect Differences, Embrace All,\" \"Act with Kindness, Create Friendship,\" and \"Celebrate Inclusivity, You Belong.\" There are also images such as a heart, children holding hands in a circle, and puzzle pieces, symbolising unity and belonging.","think":["Setting: The school corridor - This suggests the message is meant for all students to see daily, reminding them to practise these values in their school life.","Action: Students walking past - This shows how the school community is expected to embody these values in their interactions.","Respect and tolerance for differences","The importance of kindness in building friendships","Inclusivity and belonging in a school environment"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the kindness campaign in my school where we wrote appreciation notes to classmates and teachers. It made me realise that small acts of kindness can brighten someone's day."},{"prompt":"If I were in this picture, I would...","answer":"&. If I were in this picture, I would try to follow the values shown on the poster. For example, I would include classmates who are shy or new to the school in group activities."},{"prompt":"I feel this is important because...","answer":"I feel it is important for schools to promote kindness and inclusivity so that every student feels safe, respected, and supported. This helps create a positive learning environment where everyone can do their best."}],"questions":["Would you like to have posters like this in your school? Why or why not?","Can you share a time when you showed kindness or inclusivity to someone different from you?","How can students help make their school a more inclusive place for students of all backgrounds?"],"basic":[{"S":"Yes, I would like to have posters like this in my school.","P":"Posters like these remind students about important values such as respect, kindness, and inclusivity. Sometimes students may forget, so a poster can serve as a good reminder.","E":"For example, at my school, some students are bullied for having a different skin colour or for bringing unique cultural foods to recess. I think posters like the one in the photograph could help remind everyone to treat each other with kindness and respect, regardless of our backgrounds.","A":"So yes, I think having such posters in school is very useful.","K":"When all students treat one another with kindness, school becomes a more positive place."},{"S":"Yes, I can share about a time when my class showed kindness to a new student from Thailand.","P":"At first, the student was shy as he did not speak English very fluently. My classmates and I decided to include him in group activities and games during recess.","E":"For example, we invited him to join our football game and helped him with his homework when he was unsure about the schoolwork. Communicating was a little challenging at first since he did not understand us well when we spoke in Singlish, but when we slowed down and spoke clearly, he was able to understand and even laugh along at our jokes.","A":"This made him open up more and his shyness soon disappeared.","K":"So, I think showing kindness and inclusivity is very important, especially to those who are different from us."},{"S":"Students can help make school more inclusive by showing respect and care for everyone.","P":"This involves not leaving anyone out, being friendly, and supporting classmates when they need help. Inclusivity also means valuing differences and learning from one another.","E":"For example, in school, students of the same race often sit together during recess or stick with familiar classmates during PE. I think it is important to mix around and befriend everyone, regardless of race or religion. Doing so can strengthen the class as a whole and create more opportunities for understanding, kindness, and mutual respect.","A":"Students have the power to make their school a happier and more positive place, as long as they take action to act inclusively.","K":"In a multicultural country like Singapore, school is the perfect place to start practising inclusivity."}],"advanced":[{"S":"Yes, I would definitely like to have posters like this in my school.","P":"Posters like these act as daily reminders for students to practise good values such as kindness, respect, and inclusivity. While teachers may teach us about values in lessons, having these messages on the walls helps reinforce them in our daily school life. They also create a welcoming environment for everyone, including new students or those from different cultural backgrounds. In my school, we once had posters about \"Graciousness in the Canteen,\" reminding us to queue properly and return our trays. Over time, I noticed more students actually following these rules because they were reminded every day. Similarly, a poster promoting kindness and respect towards students of all races could encourage everyone to be more considerate, open-minded, and supportive of one another.","A":"This shows that posters can be powerful tools in shaping behaviour and fostering a positive, inclusive school culture.","K":"So yes, I believe posters like this are very effective and should definitely be displayed in schools to promote racial harmony and understanding."},{"S":"Yes, I would like to recount a time when my class extended a warm welcome and demonstrated inclusivity towards a newly arrived student from Thailand.","P":"Initially, he appeared quite reserved and apprehensive, largely due to a language barrier that limited his fluency in English. Recognising his isolation, my classmates and I made a conscientious effort to integrate him into our social circle and activities during recess.","E":"For instance, we actively invited him to participate in our football matches and offered assistance when he was grappling with his academic assignments. Although communication posed an initial hurdle when we spoke Singlish, we adapted by enunciating our words clearly. Eventually, the gap was bridged, and he was able to understand us and share in our laughter.","A":"This supportive environment encouraged him to come out of his shell, and his initial timidity quickly dissipated as he realised he was accepted.","K":"All in all, I believe that practising kindness and inclusivity is paramount, as it bridges cultural divides and ensures that everyone feels a true sense of belonging."},{"S":"Students can make school a more inclusive place by treating everyone fairly and embracing differences.","P":"This means being open-minded and respectful, even when classmates are from different backgrounds or have different strengths. Inclusivity is also about speaking up against bullying and ensuring that no one feels left out. It is not just about being friendly, but about creating a supportive environment where everyone belongs.","E":"For example, during recess, I saw a student being bullied because of a unique smell coming from her lunchbox. She looked intimidated as other students pointed and laughed at her. Fortunately, two prefects quickly stepped in to admonish the bullies and stayed with her for the rest of recess. I hope this incident helped the bullies understand the importance of being kind and respectful to others.","A":"This showed me that inclusivity is about more than just tolerance. It is about actively helping others feel like they are part of the school community.","K":"Therefore, students can help make school inclusive by practising respect, kindness, and support every day, because even small actions can create a big difference in someone's school life."}],"audio":{"basic":"audio/sg-4-basic.mp3","adv":"audio/sg-4-adv.mp3"}},{"n":5,"img":"img/sg-5.jpg","see":"In the picture, I see a group of children at a museum, likely on a learning journey. They are observing various exhibits and reading the posters on the walls. The children are neatly dressed in their school uniforms and look curious as they explore their surroundings. Their teacher is supervising and explaining some of the artefacts to them. Many historical items are displayed in glass cases with brief descriptions, while the walls are lined with large posters containing detailed texts and photographs.","think":["Object: The historical artefacts displayed in glass cases - They represent the rich history and heritage of the country, which are being preserved for future generations to see.","Setting: Amuseum exhibition hall lined with informative posters - This shows that the event is an educational learning journey designed to take learning outside of the classroom.","Action: The children are observing the exhibits closely and listening attentively to their teacher — This suggests that they are curious and eager to absorb new knowledge about the past.","Appreciation for history and heritage","The importance of experiential learning (learning by doing/seeing)","Curiosity and thirst for knowledge","Discipline and respect in public spaces"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of my own school learning journey to the National Museum. I remember holding a clipboard and walking through the galleries, trying to find answers to the questions on my worksheet. It was fascinating to see the real items from the stories we read in our textbooks."},{"prompt":"If I were in this picture, I would...","answer":"if I were in this picture, I would read the descriptions on the posters carefully to understand the story behind each artefact. I would also raise my hand to ask the teacher questions if I saw something that sparked my curiosity."},{"prompt":"I feel this is important because...","answer":"I think this is important because learning history helps us understand our roots. Seeing these objects in real life makes history come alive and is much more engaging than just reading about it in a classroom."}],"questions":["What do you think the people in the photograph are doing?","Talk about a school excursion you have been on, and tell me what you learnt from it.","Why do you think learning journeys are important for students' learning?"],"basic":[{"S":"I think the students in the photograph are on a school excursion at a museum.","P":"In the picture, a group of young students in school uniforms are gathered around glass cases displaying historical items, with large posters containing text and images on the walls. Their teacher stands nearby, supervising and likely explaining some of the exhibits. The students appear curious and fully engaged in the museum visit.","E":"Last year, my class visited a similar place, which was the National Museum of Singapore. We explored exhibits about Singapore's history, including life during and after the Japanese occupation. I really enjoyed the experience because it allowed me to learn new things outside of the classroom.","A":"Therefore, I think the students are also visiting a museum with their teacher, learning about history during a school excursion.","K":"Students often enjoy these trips because they can learn beyond their textbooks and explore interesting places with their classmates."},{"S":"One memorable excursion was a trip to the Science Centre Singapore when I was in Primary Three.","P":"I was very excited because Science is my favourite subject, and I had never been there before.","E":"During the trip, we explored many cool exhibits. For example, we went to the \"Mind's Eye\" section to look at optical illusions that tricked our eyes. We also watched the Fire Tornado show, where we saw a tall pillar of fire! It was so much fun because we could actually touch the displays and play with the water at the Waterworks area instead of just looking.","A":"I learnt a lot about the human body and the Earth that day. It made me realise that learning Science can be really fun and interesting.","K":"That was a wonderful experience, and I hope I can go on more learning journeys like that in the future."},{"S":"I think learning journeys are important because they allow us to see what we learn in books come to life in the real world.","P":"Sometimes, it is hard to understand a topic just by looking at pictures in a textbook. When we go on a learning journey, we can see, touch, and experience things for ourselves. This makes the lesson more exciting and helps us remember the information much better.","E":"For example, when I went on a heritage trail at Kampong Glam, I learnt so much about Singapore's history. I saw the beautiful Sultan Mosque and visited the old shophouses. Seeing these landmarks made me realise how different cultures have lived together in Singapore for a long time.","A":"Walking through the area helped me understand our local heritage much better than just looking at a map or a photo in my Social Studies book.","K":"That is why I think trips to places like Kampong Glam are important, as they help us appreciate our country's history in a fun way."}],"advanced":[{"S":"Based on the picture, I believe that the students in the photograph are participating in an enriching school excursion at a museum.","P":"A group of students, clad in their school uniforms, are clustered around glass display cases containing historical artefacts. They appear to be studying the large, informative posters on the walls with great intent. Their teacher is present to supervise the session, likely facilitating the learning process by elaborating on the exhibits. The students seem captivated and thoroughly immersed in their surroundings.","E":"Similarly, I vividly recall a learning journey my class took to the National Museum of Singapore last year. We delved into exhibits regarding life during the Japanese Occupation. It was a truly eye-opening experience because it allowed me to transcend textbook learning and see history come dlive.","A":"Hence, I believe these students are engaging in a similar experiential learning activity, broadening their knowledge of history outside the confines of a classroom.","K":"Such excursions are vital as they ignite curiosity and foster a deeper appreciation for heritage among students."},{"S":"One particularly memorable excursion was a trip to the Science Centre Singapore when I was in Primary Three.","P":"I was brimming with anticipation as I have always had a fervent interest in Science, yet I had never had the opportunity to visit the centre before.","E":"During the visit, we navigated through various interactive galleries. For instance, we visited the \"Mind's Eye\" exhibition to examine optical illusions that challenged our perception. We also witnessed the spectacular Fire Tornado show, gazing in awe at the towering column of flame. The experience was refreshing because of the hands-on approach. We could physically manipulate the exhibits at the Waterworks area rather than being passive observers.","A":"I gained profound insights into the human anatomy and Earth sciences that day. It made me realise that acquiring knowledge can be an engaging and dynamic process.","K":"All in all, it was a fruitful expedition that fuelled my passion for discovery, and I eagerly look forward to future learning journeys."},{"S":"I believe that learning journeys are essential as they provide students with an immersive environment that brings textbook concepts to life.","P":"While classroom learning is necessary, it can sometimes feel detached from reality. Stepping out of the school grounds allows us to engage our senses and deepen our understanding of the subject. These experiences often leave a lasting impression, making the information far more memorable and easier to recall during examinations.","E":"For instance, during a heritage trail at Little India, I was captivated by the vibrant atmosphere and the rich cultural details of the area. I had the opportunity to admire the intricate architecture of the = Sri Veeramakaliamman Temple and observe the traditional craft of garland- making along the bustling streets. Exploring the diverse stalls at Tekka Centre allowed me to appreciate the unique customs and traditions of the Indian community firsthand.","A":"Navigating through the streets of Little India provided an excellent understanding of Singapore's multicultural society that a static image ina Social Studies book simply cannot convey.","K":"Therefore, learning journeys are extremely crucial because they transform passive learning into an enriching exploration of our nation's history and heritage."}],"audio":{"basic":"audio/sg-5-basic.mp3","adv":"audio/sg-5-adv.mp3"}},{"n":6,"img":"img/sg-6.jpg","see":"I see a large group of neighbours, young and old, gathered at a void deck for a community celebration. Some children are holding lanterns, while adults are seated at tables with food and drinks. There are paper lanterns hanging from the ceiling, which suggests it could be a Mid-Autumn Festival gathering. Everyone looks cheerful, smiling for the photo, showing that they are enjoying themselves together as a community.","think":["Setting: The HDB void deck - This shows the heart of the neighbourhood, a common space where residents can gather and interact.","Action: Families and neighbours are seated, chatting, and celebrating together - This demonstrates bonding, joy, and the kampung spirit.","Kampung spirit and neighbourliness","Inclusiveness and unity in the community","Celebrating traditions together","Building friendships and stronger bonds"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of when my neighbourhood held a National Day block party at the void deck. We sang songs, played games, and ate together."},{"prompt":"If I were in this picture, I would...","answer":"if I were in this picture, I would join in the games and chat with neighbours, especially making new friends with people I do not usually meet."},{"prompt":"I feel this is important because...","answer":"I feel this is important because such celebrations make us feel like one big family, where neighbours look out for one another and share happy moments."}],"questions":["Would you enjoy joining a community celebration like this with your neighbours? Why or why not?","Can you share about a time when you joined a neighbourhood or community event?","Why is it important for neighbours to celebrate festivals together?"],"basic":[{"S":"Yes, I would enjoy joining a celebration like this.","P":"Usually I only greet neighbours in the lift or along the corridor. A celebration gives us time to talk properly, share food, and join activities that help us know one another better. It also keeps our traditions alive through lanterns, songs, and games.","E":"Last year, our block organised a Mid-Autumn lantern walk. I carried a rabbit- shaped lantern with my younger sister and joined a riddle hunt where clues were tied to lanterns. After the walk, we tried mooncakes and hot tea at the tables. I chatted with a boy from another floor about our CCAs and discovered we both liked badminton. We exchanged unit numbers and later met at the court downstairs to play.","A":"That experience showed me how celebrations help neighbours connect and turn familiar faces into real friends.","K":"So, I would definitely enjoy joining a celebration like the one in the picture because it creates happy memories and a friendlier neighbourhood."},{"S":"Yes, I joined a National Day celebration at our void deck and it was very memorable.","P":"The Residents' Committee decorated the place with flags and bunting, and there were games, performances, and snacks for everyone. Families brought dishes to share, so the whole area felt festive and welcoming.","E":"I helped my father put up tiny flags and arrange chairs before the crowd arrived. During the event my friends and I sang \"Home,\" and the audience clapped and waved their flags. I joined a team quiz about Singapore's history and learnt new facts from an elderly uncle on my team. At supper time, I sat with neighbours I had never spoken to and we shared curry puffs, kueh, and watermelon while talking about our favourite National Day moments.","A":"Taking part in that event showed me how celebrations bring different neighbours together and build pride in our community.","K":"It encouraged me to join future events because they help us form friendships and a stronger sense of belonging."},{"S":"It is important because celebrating together builds trust, kindness, and a strong support network in the estate.","P":"When neighbours meet during happy occasions, they learn names, faces, and family needs. This makes it easier to offer help during emergencies or daily challenges, and it reduces misunderstandings.","E":"After a Deepavali potluck at our pavilion, my parents became closer to a family living two floors below us. A few weeks later our lift broke down and we had heavy groceries to carry. That neighbour saw us at the staircase and offered to help. Another time, when their child was unwell, my mum cooked them some chicken soup. These small acts began because we had already chatted and shared food at celebrations.","A":"Once relationships are built, helping one another feels natural and comfortable.","K":"That is why neighbours should celebrate together, so we can create a caring environment where everyone feels included and supported."}],"advanced":[{"S":"Yes, I would definitely enjoy joining a celebration like the one in the picture because it turns our housing block into a connected community rather than just a place where people stay side by side.","P":"In daily life, we often rush past one another. A shared celebration slows us down and invites real interaction. Through food, games, and stories, we discover common interests, learn about different cultures, and feel safer knowing the people around us. These moments build trust and belonging that last beyond the event itself.","E":"During last year's Mid-Autumn celebration, I helped to hang lanterns, arrange cups for tea, and distribute mooncakes. An elderly neighbour told me about celebrating when she was young, and I saw how traditions can bridge generations. I also made friends with a student from another block when we teamed up for a riddle hunt. We later practised badminton downstairs and even revised for our exams together. What started as a simple celebration became the beginning of steady friendships and support.","A":"That is why I value community events. They create meaningful connections that make everyday life in the estate friendlier and more reassuring.","K":"Therefore, I would gladly join a celebration like the one in the picture because it strengthens bonds, keeps traditions alive, and makes the neighbourhood happier."},{"S":"Yes, I took part in a National Day celebration at our void deck, and it showed me how powerful community bonding can be.","P":"The evening combined performances, a trivia challenge, and a potluck that encouraged everyone to mingle across ages and backgrounds. Instead of staying within our own families, we mixed at the tables and learnt from one another.","E":"I volunteered at the welcome table to hand out mini flags and stickers. When the performances began, I joined my classmates in a skit about unity and felt encouraged when the uncles and aunties cheered for us. For the trivia, I teamed up with a neighbour I barely knew, and we pooled our knowledge to answer questions about Singapore's history and places of interest. During the potluck, my mum's fried rice sat beside our neighbour's lontong and another family's bee hoon. As we ate, an older resident shared how the estate looked years ago and why the kampung spirit still matters today. A Anchor to the Point: That night taught me that simple activities done together can turn strangers into friends and give us pride in our shared home.","K":"It made me want to volunteer again at future events because they strengthen the social fabric of the neighbourhood."},{"S":"Neighbours should celebrate together because shared joy builds resilience, understanding, and a caring culture that benefits everyone.","P":"When we gather for festivals or national events, we practise being considerate, patient, and inclusive. We learn one another's customs and stories, so we appreciate differences instead of fearing them. These bonds become very useful during problems like power outages, illness, or urgent needs, since people who already know one another respond faster.","E":"At a multi-cultural potluck hosted under our block, families exchanged food and recipes, and children taught each other greetings from different languages. A few months later, a neighbour's parent suddenly fell ill. The"}],"audio":{"basic":"audio/sg-6-basic.mp3","adv":"audio/sg-6-adv.mp3"}},{"n":7,"img":"img/sg-7.jpg","see":"I see a small group of primary school students learning traditional calligraphy in a bright classroom. An experienced teacher is guiding two girls at the front table, showing them how to hold a brush and form careful strokes. Other classmates are focused on their own sheets. On the tables, there are ink stones, brushes, paper laid neatly in rows, and practice characters drying. Sunlight streams through the windows, making the room feel calm and focused. Everyone looks attentive and patient as they practise.","think":["Setting: A school classroom set up as a workshop - This brings culture into everyday learning and makes it accessible for students.","Action: A teacher demonstrating while students practise - This suggests skills and values are being passed down patiently from one generation to the next.","Preserving culture through hands-on practice","Patience, focus, and discipline in learning","Respect for elders and teachers as mentors","Pride in heritage and identity"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"Yes, my CCA once invited an artist to teach us batik painting and we learnt how to wax outlines before adding dye."},{"prompt":"If I were in this picture, I would...","answer":"I would listen closely to the teacher's tips, practise my strokes slowly, and ask questions when I am unsure so I can improve."},{"prompt":"I feel this is important because...","answer":"Learning traditional arts keeps our culture alive and helps us understand the stories and values behind each craft."}],"questions":["What do you think the people in the photograph are doing?","Have you ever tried a traditional activity or craft?","Why is it important for students to learn traditional arts and crafts?"],"basic":[{"S":"I think the students in the photograph are learning Chinese calligraphy.","P":"In the picture, students in a classroom are using large brushes to paint Chinese characters on a long sheet of paper. A senior teacher stands beside two girls, guiding them on how to make precise brushstrokes. Every student appears focused and fully engaged in the activity.","E":"Fortunately, I have tried a similar activity before. During Chinese New Year, our teacher taught us how to write New Year blessings on red paper, using special calligraphy brushes and ink pots. At first, I found it difficult to form the characters neatly, but after some practice, I gradually got the hang of it.","A":"So, I think the students are also trying out Chinese calligraphy, just like I did during Chinese New Year at school.","K":"That experience showed me how workshops can bring traditions to life and help teach the younger generation skills that are fading away. @a"},{"S":"Yes, I have tried traditional Batik painting during an art lesson in school.","P":"It is a special way of painting on cloth using wax and colourful dyes. I learnt that you need to be very patient and careful to make sure the colours do not get messy.","E":"My teacher gave us a piece of white cloth with a flower pattern already drawn in wax. She explained that the wax acts like a wall to stop the paint from spreading to other parts. I used a brush to paint the petals pink and the leaves green. It was really fun to watch the colours fill the shapes but stop exactly at the wax lines.","A":"Trying this craft helped me understand that making traditional art takes a lot of focus and steady hands.","K":"Overall, I really enjoyed the experience, and I would love to try Batik painting again in the future."},{"S":"It is important because traditional arts teach us values, history, and identity that textbooks alone cannot show.","P":"When we use the tools and follow the methods, we understand the discipline and creativity of our ancestors. We also learn to respect different cultures and keep these practices alive for the next generation.","E":"In Primary Five, my class prepared a small exhibition on local crafts. We interviewed family members about embroidery, paper cutting, and bamboo weaving. Hearing my grandmother explain why certain images symbolise health and harmony made me feel closer to my roots. Visitors to our display said they learnt a lot from our demonstrations and wanted to try too.","A":"This shows traditional arts can unite families and communities while passing on wisdom.","K":"That is why students should learn them, so our culture stays meaningful and continues to grow."}],"advanced":[{"S":"I believe that the students in the photograph are deeply immersed in mastering the traditional art of Chinese calligraphy.","P":"In the scene, students are wielding large brushes to inscribe characters onto a long scroll. A senior instructor is mentoring two students, providing meticulous guidance on their brushwork and technique. The entire class appears engrossed in the task, displaying a high level of concentration and discipline.","E":"I also had the privilege of trying my hand at this art form during a Chinese New Year celebration at school. My teacher instructed us on how to write auspicious blessings on crimson paper using traditional ink and brushes. Initially, I grappled with controlling the brush to create fluid strokes, but through perseverance, I eventually managed to produce elegant characters. Drawing from this experience, I believe these students are undergoing a similar process of cultural appreciation, learning the nuances of this ancient script just as I did.","K":"Ultimately, such workshops breathe life into our heritage and ensure that these time-honored traditions are preserved for the younger generation."},{"P":"Each craft required focus and steady hands, and every mistake taught me patience. I also learnt the symbolism behind designs, which made the finished pieces more meaningful.","E":"For ketupat weaving, my friend's mother showed us how to fold palm leaves into a tight diamond pouch. My first weave loosened and fell apart, but after redoing it carefully, the shape held firm. In paper cutting, I learnt to fold the paper precisely and cut clean curves to reveal flowers and fish. With calligraphy, I improved by practising dots, horizontal lines, and hooks before attempting full characters. Sharing these pieces with my grandparents opened conversations about festivals and family traditions I had never heard before.","A":"Trying these crafts allowed me to build technical skills while connecting with the stories behind our celebrations.","K":"Therefore, I have had the privilege to try multiple traditional activities that strengthened both my hands and my appreciation for heritage."},{"S":"Students should learn traditional arts and crafts because they preserve cultural memory and shape character through discipline and empathy.","P":"Hands-on practice teaches perseverance, respect for materials, and attention to detail. Understanding motifs and customs builds cultural literacy, so we can communicate respectfully across different backgrounds and pass traditions on responsibly.","E":"When my class curated a cultural showcase, we included live demos, short write-ups on origins, and interviews with elders. Visitors were curious to try the crafts after watching us, and a few even asked to volunteer at the next workshop. Our head of department commented that the event showed how learning by doing can unite the school. I noticed my classmates became more patient and thoughtful, especially when helping younger students try the activities.","A":"This proves traditional arts are not only about pretty results. They shape values that help communities stay strong.","K":"Therefore, teaching these crafts to students is essential for preserving heritage while nurturing skilled, considerate, and culturally aware citizens."}],"audio":{"basic":"audio/sg-7-basic.mp3","adv":"audio/sg-7-adv.mp3"}},{"n":8,"img":"img/sg-8.jpg","see":"I see a group of primary school students gathered around a teacher in a school corridor. The teacher is pointing to a large map on a display board, while several students look closely and some point to different parts of the exhibit. On both sides of the corridor, there are panels with photographs, captions, and charts that look like a National Education showcase. The students are wearing school uniforms and appear attentive and curious as they listen and ask questions. Bright windows line one side of the corridor, giving the scene a clear and focused learning atmosphere.","think":["Object: Display boards and a detailed map - They suggest students are learning about Singapore's history, places, or important events.","Setting: A school corridor with an exhibition - This shows National Education being brought into daily school life to make learning visible and accessible.","Action: A teacher explaining while students observe and ask questions — This suggests active learning, inquiry, and guidance from a mentor.","Understanding Singapore's history and identity","Active citizenship and informed decision making","Respect for educators and collaborative learning","Curiosity, reflection, and pride in our nation"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"&. Yes, my class once visited a heritage gallery where we explored exhibits about Singapore's early years and watched interviews with pioneers."},{"prompt":"If I were in this picture, I would...","answer":"- I would stand near the map, ask questions about key places, and take notes so I can share what I learnt with my classmates later."},{"prompt":"I feel this is important because...","answer":"National Education helps us appreciate what our country went through and teaches us how to contribute responsibly as students and future citizens."}],"questions":["Look at the photograph. Do you think this is a suitable venue for a National Education showcase?","What are some things you have learnt from National Education activities?","How can students apply National Education values in daily school life?"],"basic":[{"S":"Yes, I think this looks like a good place to have a National Education showcase.","P":"This venue appears to be a school, with large open windows, long corridors, and students and teachers moving around. A school is an ideal place for such an important showcase because students are constantly walking from one area to another. Along the way, they can read the posters, view the images, and learn many things simply by moving around the school.","E":"I remember a similar showcase at my school. A few months ago, the Primary Five students were tasked with creating posters and picture collages highlighting Singapore's history. They did an excellent job as the exhibit was both eye-catching and very informative.","A":"Because of this experience, I think the venue shown in the photograph would be an excellent place to host a National Education showcase and display facts about our country.","K":"Students enjoy learning new things outside the classroom, so displaying the showcase along the school corridors would be very effective."},{"S":"I have learnt about Singapore's challenges, the importance of unity, and how citizens can play a part in keeping our country strong.","P":"Activities such as exhibitions, heritage trails, and school assemblies showed me key events and values like resilience, harmony, and responsibility. They also taught me to think critically and appreciate different viewpoints.","E":"During an NE commemorative assembly, we heard stories about pioneers who worked hard to improve housing and education. In class, we analysed newspaper headlines and discussed why careful planning is needed for water and security. Later, at a heritage trail, I saw how an old kampung area changed into an HDB town. These activities helped me see that progress takes teamwork between leaders and ordinary people.","A":"From these lessons, I understand that my actions matter, even as a student.","K":"Overall, I learnt facts about history and, more importantly, values that guide how I behave in school and at home."},{"S":"Students can apply NE values by showing respect, taking responsibility, and contributing to the school community.","P":"When we care for shared spaces, include classmates of different backgrounds, and speak up politely with good reasons, we practise active citizenship. Helping others and being diligent in our work also reflect pride in our school and country.","E":"In my class, we planned a student-led recycling drive and created posters explaining why resources are precious. We also paired up with younger pupils to guide them during a museum visit, reminding them to be considerate and curious. When disagreements happened in group work, we used discussion and evidence to decide fairly. Through these actions, our class became more united and responsible.","A":"By practising these habits daily, we turn NE lessons into real behaviour, not just words on a slide.","K":"That is how students can live out NE values and make school a kinder, more thoughtful place."}],"advanced":[{"P":"The setting appears to be a school environment, characterised by spacious, well-lit corridors and a steady flow of students and teachers. Such a high-traffic area is strategic for an exhibition because it captures the students' attention as they transit between classes. It transforms a mundane walkway into a vibrant learning space, allowing them to absorb information passively yet effectively.","E":"Recalling a similar initiative at my own school, the Primary Five cohort was recently tasked with curating a gallery on Singapore's history. Their meticulous efforts resulted in an exhibit that was not only visually appealing but also highly educational. The colorful collages and detailed timelines naturally drew many students in during their break times.","A":"Drawing parallels to this experience, I am convinced that the venue in the photograph is well-suited to host such an event, providing an accessible platform to share key facts about our nation.","K":"Ultimately, positioning the showcase along the corridors capitalises on the students' natural curiosity, extending it beyond the four walls of the classroom."},{"S":"I learnt that Singapore's success depends on resilience, good planning, and people working together despite differences.","P":"Through NE, I understood why harmony matters in a diverse society and how careful policies help a small nation stay secure and competitive. I also learnt to evaluate sources and think about consequences before forming opinions.","E":"During a school NE exhibition, my class studied turning points such as independence and industrialisation. We examined primary sources like speeches and photos, then discussed how leaders and citizens responded to crises. I realised that cooperation between communities helped keep peace, and long-term planning created jobs and housing. These lessons made me appreciate the stability we enjoy today.","A":"Knowing our past helps me value what we have and reminds me not to take it for granted.","K":"Therefore, National Education has imparted not only knowledge but also important values that shape the way I interact with others and influence the choices I make in various aspects of my life."},{"S":"We can apply NE values by being responsible learners, considerate friends, and active contributors to school initiatives.","P":"This means listening respectfully to different views, caring for shared facilities, and volunteering for projects that benefit others. It also includes being truthful, prepared, and disciplined in our studies, since personal effort supports the larger community.","E":"My class started a student suggestion board to improve school life. We gathered feedback, prioritised ideas, and worked with teachers to implement feasible ones, such as a reading corner and clearer recycling labels. We also organised a kindness campaign, where we wrote notes of appreciation to non-teaching staff and made a rota to keep the canteen tables clean. These small steps made our environment kinder and more efficient.","A":"By acting on NE values, we show pride in our school and practise the habits of good citizens.","K":"That is how students can apply NE every day, turning lessons into positive changes for everyone."}],"audio":{"basic":"audio/sg-8-basic.mp3","adv":"audio/sg-8-adv.mp3"}},{"n":9,"img":"img/sg-9.jpg","see":"I see an elderly man seated in a rattan chair surrounded by a small group of children sitting cross-legged on the floor. He is gesturing with his hands as if telling a story, and the children are looking up at him with smiles and curious expressions. In the background, there are tables, a large potted plant, and a wall painting that looks like an old village scene. The setting appears calm and homely, and everyone seems relaxed and engaged in the storytelling.","think":["Object: The rattan chair and kampung-style painting - They hint at stories from the past and memories of old Singapore.","Setting: Acommunity corner or void deck - This suggests an informal, friendly place where neighbours and families gather.","Action: An elder sharing while children listen closely - This suggests intergenerational learning, respect, and curiosity..","Learning from elders' experiences","Respect and gratitude for the older generation","Community bonding and shared memory","Curiosity, listening, and empathy"],"connect":[{"prompt":"If I were in this picture, I would...","answer":"I would sit near the elder, listen carefully, and ask follow-up questions so I understand the lessons in his stories."},{"prompt":"I feel this is important because...","answer":"Hearing real experiences helps me appreciate what earlier generations went through and reminds me to use their lessons wisely today."}],"questions":["How do you think the people in the photograph are feeling, and why do you think so?","Can you share about a time you had a meaningful interaction with a grandparent or senior?","What do you think we can learn from the older generation?"],"basic":[{"S":"I think everyone in the photograph looks cheerful, enjoying their interaction with one another.","P":"There is an
