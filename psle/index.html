9,30.34],[30.64,45.75],[46.05,51.67]],[[0.25,5.27],[5.57,29.71],[30.01,45.02],[45.32,50.56]],[[0.25,5.51],[5.81,26.42],[26.72,41.24],[41.54,46.56]],[[0.25,4.93],[5.23,32.13],[32.43,48.01],[48.31,53.89]]]}},{"n":15,"title":"Public Hygiene and Environmental Health","theme":"env","img":"img/ace-15.jpg","reading":{"instruction":"You are reading an awareness message for your neighbourhood's Residents' Committee newsletter. Read with a clear, confident, and community-minded tone.","paragraphs":["Public hygiene keeps our neighbourhoods clean, healthy, and pleasant to live in. When litter, stagnant water, or uncollected rubbish pile up, pests like mosquitoes and rats appear, spreading diseases. Cleanliness is not just the job of cleaners—it is everyone's responsibility.","Residents can play their part by disposing of rubbish properly, covering bins, and reporting leaks or pest sightings. Wiping dining tables after meals and washing hands regularly also help prevent germs from spreading. Even simple actions like flushing toilets properly and keeping corridors dry protect others' safety.","When we practise good hygiene, we show respect for our neighbours and our environment. A clean community is a healthy one—and that begins with each of us."]},"questions":["What is happening in this picture, and why is it important?","Why is public hygiene especially important in a city like Singapore?","What can students do to support cleanliness in their schools and neighbourhoods?","How can communities maintain high hygiene standards in the long term?"],"answers":[{"P":"The picture shows cleaning trucks sweeping the streets in a Singapore neighbourhood.","E1":"These vehicles have large brushes underneath that collect dirt, leaves, and litter from the roads. The clean surroundings and well-maintained trees show this is regular work that keeps our environment pleasant. Without this cleaning, rubbish would pile up and our neighbourhood would look messy and unpleasant to live in. The trucks usually come early in the morning or during the day when there's less traffic.","E2":"Once, I saw a street sweeper working near my block early in the morning. My mother greeted him, and he smiled warmly. Since then, I always make sure to throw my rubbish properly because I appreciate how hard these workers try to keep our area clean.","L":"The picture shows that keeping Singapore clean requires hardworking people who help make our neighbourhoods pleasant for everyone."},{"P":"Public hygiene is crucial because Singapore is densely populated, so shared spaces need to stay clean for everyone's comfort.","E1":"When many people live close together in HDB estates and use the same parks and playgrounds, keeping these areas tidy becomes more important. If everyone littered, our void decks and common areas would quickly become dirty and unpleasant. Cleanliness also makes Singapore attractive to visitors and shows we take pride in our home. When public spaces are well-maintained, families feel comfortable spending time outdoors together.","E2":"My family enjoys having breakfast at our void deck on weekends. Because the area is always clean and well-kept, we feel relaxed eating there. If it were dirty or smelly, we wouldn't want to spend time there at all.","L":"In a crowded city, everyone benefits when we all work together to keep shared spaces clean and welcoming."},{"P":"Students can set good examples by keeping their surroundings clean and encouraging their friends to do the same.","E1":"We can throw rubbish into proper bins, tidy our classrooms after lessons, and pick up litter we see even if we didn't drop it. At home, we can help sweep the floor, wipe tables after meals, and remind siblings not to litter. Students can also create posters during art class to remind others about cleanliness. When we practise these habits young, they become natural throughout our lives.","E2":"My class took turns cleaning our classroom every Friday. At first, some classmates grumbled, but soon we started competing to see who could make our area nicest. Our teacher praised our effort, and now other classes have started doing the same thing. The whole school feels cleaner.","L":"When students take responsibility at school, we learn to care about keeping all our shared spaces tidy."},{"P":"By making cleanliness a normal habit that everyone practices together, not just something we think about occasionally.","E1":"When I see my parents throwing rubbish properly even when bins are far away, I naturally copy them. At school, our cleanliness campaigns make tidying up feel fun rather than like a chore—we design posters or create songs about keeping clean. Once something becomes a regular habit, people do it automatically without thinking. If everyone expects shared spaces to be clean and takes responsibility to keep them that way, it continues naturally over time.","E2":"My estate organizes a \"Clean and Green Day\" every few months. Families help sweep our common areas together, then we plant flowers in the garden. It's enjoyable because we meet neighbours, and everyone feels proud seeing our estate look beautiful afterwards. Now I notice people taking better care of the area even between clean-up days.","L":"Cleanliness lasts when it becomes something we do naturally as part of taking care of our shared home."}],"audio":{"read":"audio/ace-read-15.mp3","readTimes":[[[0.3,4.29],[4.89,12.04],[12.64,17.33]],[[18.43,25.09],[25.69,31.94],[32.54,38.57]],[[39.67,44.28],[44.88,48.87]]],"ans":["audio/ace-ans-15-1.mp3","audio/ace-ans-15-2.mp3","audio/ace-ans-15-3.mp3","audio/ace-ans-15-4.mp3"],"ansTimes":[[[0.25,4.55],[4.85,27.62],[27.92,42.82],[43.12,50.44]],[[0.25,8.3],[8.6,35.2],[35.5,48.22],[48.52,54.77]],[[0.25,6.83],[7.13,30.65],[30.95,47.99],[48.29,54.53]],[[0.25,6.94],[7.24,34.94],[35.24,55.9],[56.2,61.99]]]}},{"n":16,"title":"Safety and Cleanliness at Wet Markets","theme":"env","img":"img/ace-16.jpg","reading":{"instruction":"You are sharing your group's findings after a class project about the importance of hygiene in wet markets. Read with an informative and respectful tone.","paragraphs":["Wet markets are a familiar part of Singapore life. They are where families buy fresh vegetables, meat, and seafood. However, because food is handled in open spaces, it is important to keep them clean and safe for everyone.","Stallholders play a key role by keeping their counters dry and washing tools regularly. Customers also help by disposing of waste properly and not touching food with bare hands. Market inspectors visit regularly to ensure hygiene standards are met.","When everyone does their part, wet markets remain pleasant and safe. By showing care and responsibility, we protect not only our own health but also the health of our community."]},"questions":["What is happening in this picture, and what does it show about wet markets?","Why is hygiene especially important when selling food?","How can students learn more about food safety and hygiene?","What can the community do to support cleaner markets?"],"answers":[{"P":"The picture shows stallholders cleaning their counters and washing the floor after the market closes.","E1":"It shows that cleanliness is taken seriously in wet markets. Regular cleaning prevents pests and bad odours. It also ensures that customers can shop safely without slipping or buying contaminated food. Wet markets may look busy, but hygiene routines happen daily behind the scenes. This builds trust between sellers and buyers.","E2":"I once visited a market early in the morning and saw workers scrubbing the floor and rearranging fish on ice. My mother said that this keeps food fresh and safe for cooking.","L":"The picture highlights that cleanliness and teamwork keep wet markets healthy and reliable for everyone."},{"P":"Because poor hygiene can lead to food poisoning and spread harmful bacteria.","E1":"When food is not stored or handled properly, germs multiply quickly, especially in warm weather. Clean tools and surfaces prevent contamination. Good hygiene also shows professionalism and care from sellers, helping customers feel confident.","E2":"My school canteen uncle always wears gloves and covers cooked food. When he once forgot to wear a mask, a student reminded him politely. He thanked her and said hygiene keeps everyone safe.","L":"Maintaining hygiene when handling food protects both the people who sell it and those who eat it."},{"P":"Students can learn through school projects, science lessons, and hands-on experiences.","E1":"Teachers can arrange visits to markets or invite food inspectors to share their work. Lessons on bacteria and cleanliness make science more meaningful. Students can also practise hygiene at home by washing hands before meals and storing leftovers properly. Learning through observation helps them understand real-life importance.","E2":"My class once visited a supermarket's bakery section to see how workers wore gloves and caps. It showed how rules protect customers and maintain quality.","L":"Understanding hygiene from a young age builds habits that last into adulthood."},{"P":"The community can encourage cleanliness through education, campaigns, and feedback.","E1":"Posters and talks can remind shoppers to keep aisles clear and return baskets. Town councils can reward the cleanest stalls or markets. When customers give kind feedback instead of complaints, stallholders feel appreciated and motivated to maintain standards.","E2":"My neighbourhood market was awarded \"Cleanest Market 2024.\" The stall owners proudly displayed the banner, and customers felt even more confident shopping there.","L":"When the community values hygiene, clean markets become a shared culture, not just a rule."}],"audio":{"read":"audio/ace-read-16.mp3","readTimes":[[[0.3,3.33],[3.93,7.6],[8.2,14.43]],[[15.53,20.39],[20.99,26.52],[27.12,31.36]],[[32.46,36.32],[36.92,43.09]]],"ans":["audio/ace-ans-16-1.mp3","audio/ace-ans-16-2.mp3","audio/ace-ans-16-3.mp3","audio/ace-ans-16-4.mp3"],"ansTimes":[[[0.25,6.04],[6.34,27.52],[27.82,37.89],[38.19,44.34]],[[0.25,5.02],[5.32,21.09],[21.39,33.49],[33.79,40.0]],[[0.25,5.66],[5.96,26.36],[26.66,36.54],[36.84,41.54]],[[0.25,5.34],[5.64,21.79],[22.09,32.73],[33.03,38.78]]]}},{"n":17,"title":"Helping with Housework","theme":"family","img":"img/ace-17.jpg","reading":{"instruction":"You are sharing your thoughts during a classroom discussion about helping at home. Read with a cheerful and responsible tone.","paragraphs":["Doing housework is one of the best ways to show love and gratitude to our families. Even small tasks—like sweeping, folding laundry, or setting the table—help reduce our parents' workload. When everyone helps, the home feels tidier and more peaceful.","Helping at home also builds life skills. We learn responsibility, time management, and teamwork. These skills will be useful when we grow up and live on our own.","Most importantly, housework teaches appreciation. Once we experience how tiring chores can be, we start to value our parents' daily efforts more deeply."]},"questions":["What is happening in this picture, and what does it teach us?","Why is it important for children to help with chores at home?","What challenges do some children face when helping at home, and how can they overcome them?","What can schools do to encourage responsibility like helping at home?"],"answers":[{"P":"The picture shows a boy sweeping the floor while his sister wipes the table and their mother smiles proudly.","E1":"It teaches us that helping with chores creates teamwork and harmony at home. Children who contribute learn to take initiative instead of waiting for instructions. When family members share tasks, everyone feels more respected and cared for. It also shows gratitude in action—helping is a way to say thank you without words.","E2":"On weekends, my brother and I take turns vacuuming and hanging clothes. When my mum sees us doing chores without reminders, she always says it makes her day easier.","L":"The picture shows that family teamwork strengthens love and builds good habits."},{"P":"Because it teaches independence, discipline, and empathy.","E1":"When children do chores, they learn that maintaining a home takes effort. It helps them understand that parents also get tired and need support. Over time, these habits shape responsibility and self-confidence. Children who help at home are usually more organised and considerate in school too.","E2":"My cousin used to leave toys everywhere. After his mother asked him to clean his room weekly, he became tidier and more aware of how his actions affect others.","L":"Helping with chores builds character and appreciation—it's training for both heart and responsibility."},{"P":"Some children find chores boring, time-consuming, or difficult to balance with homework.","E1":"To overcome this, families can make chores part of a routine, turning them into short, manageable tasks. Parents can also show appreciation, making children feel that their efforts matter. Doing chores together turns work into bonding time, rather than punishment.","E2":"My family plays music while cleaning on Sunday mornings. It makes the atmosphere cheerful, and we finish faster. Sometimes, my dad times us like a \"cleaning race,\" which adds fun.","L":"Turning chores into positive family moments helps children see helping as meaningful, not tiring."},{"P":"Schools can assign duties that mirror real-life responsibilities and teamwork.","E1":"Class chores—like watering plants or arranging books—teach care for shared spaces. Teachers can link these actions to values like respect and cooperation. Students who learn responsibility in school naturally apply it at home. Reward systems, such as \"Class Helper of the Week,\" also make responsibility enjoyable.","E2":"In my class, each student has a rotating duty: sweeping, cleaning the board, or returning books. It makes everyone more mindful and keeps our classroom pleasant. Our teacher says these habits help us become dependable adults.","L":"Schools that nurture responsibility prepare students not only for exams but also for life."}],"audio":{"read":"audio/ace-read-17.mp3","readTimes":[[[0.3,4.8],[5.4,11.91],[12.51,15.58]],[[16.68,19.15],[19.75,23.04],[23.64,26.86]],[[27.96,31.05],[31.65,37.52]]],"ans":["audio/ace-ans-17-1.mp3","audio/ace-ans-17-2.mp3","audio/ace-ans-17-3.mp3","audio/ace-ans-17-4.mp3"],"ansTimes":[[[0.25,6.3],[6.6,26.15],[26.45,36.37],[36.67,41.24]],[[0.25,3.78],[4.08,21.84],[22.14,31.84],[32.14,38.45]],[[0.25,5.81],[6.11,22.73],[23.03,34.17],[34.47,40.71]],[[0.25,5.19],[5.49,25.51],[25.81,39.9],[40.2,46.63]]]}},{"n":18,"title":"Playing at the Void Deck","theme":"sg","img":"img/ace-18.jpg","reading":{"instruction":"You are sharing your thoughts in a class discussion about being considerate when playing at the void deck. Read with a friendly yet thoughtful tone.","paragraphs":["The void deck is a special space in our housing estates where neighbours meet, children play, and families gather. However, it is also a shared area used by everyone, including the elderly and people heading to work or school.","Playing games like football or rollerblading there can be fun, but we must also be mindful of others. Loud shouting or rough play can disturb neighbours, and stray balls may damage property or injure someone. Being considerate means choosing the right time and way to play safely.","We can still enjoy ourselves while showing respect. Keeping noise down, cleaning up after games, and moving aside for others show maturity. When we share public spaces responsibly, our neighbourhood becomes a friendlier and happier place for everyone."]},"questions":["What is happening in this picture, and what might concern the adults nearby?","Why do you think the void deck is an important place in our community?","How can children play at the void deck safely without disturbing others?","What can residents and town councils do to make void decks safer and more enjoyable?"],"answers":[{"P":"The picture shows children playing ball games and rollerblading at the void deck while adults walk past them.","E1":"The adults might be concerned about safety and noise. Balls and skates can cause accidents, especially in narrow walkways where elderly residents or young children pass. Some residents may also find the noise distracting if it happens late in the day. However, the picture also shows children having fun and being active, which is healthy and positive when done responsibly.","E2":"In my block, children used to play football at the void deck after school. One day, a ball accidentally hit a flowerpot and broke it. After that, parents reminded them to play only at the nearby court. They still met at the void deck to chat but moved their games elsewhere.","L":"The picture reminds us that fun and responsibility should go hand in hand when using shared spaces."},{"P":"The void deck helps bring people together and builds community spirit.","E1":"It is a space where people of all ages can interact—children play, residents hold events, and neighbours gather for festive celebrations. It encourages friendship among residents who might otherwise not meet. The design of the void deck shows how Singapore values social connection in everyday life. However, it only works well when everyone respects the space and uses it responsibly.","E2":"During Chinese New Year, my neighbours decorated the void deck with lanterns and arranged chairs for everyone to chat and eat snacks together. Even though we come from different backgrounds, we enjoyed the celebration as one community.","L":"The void deck is more than a physical space—it's where neighbourly bonds are built through shared respect and care."},{"P":"They can choose appropriate games, times, and ways to play responsibly.","E1":"Games like catching or simple ball tosses are safer than hard football or cycling. Playing during the day avoids disturbing those resting at night. Children should also watch out for elderly residents, avoid shouting, and stop play immediately when someone passes by. They can move to nearby playgrounds or courts for louder games.","E2":"My friends and I once played badminton at the void deck, but when the shuttlecock hit someone's door, we decided to move to the car park area instead. We still had fun while keeping the peace.","L":"Responsible play shows maturity and ensures that everyone can share the space happily."},{"P":"They can create clear guidelines and provide safe areas for play nearby.","E1":"Town councils can put up friendly signs reminding children to play safely and avoid noise after certain hours. Installing CCTV cameras or padding on pillars can reduce accidents. Residents can suggest building small play corners or community noticeboards to share upcoming events. When adults and children communicate openly, misunderstandings reduce and mutual respect grows.","E2":"In my neighbourhood, our RC added a \"Community Corner\" with benches and soft flooring for small children. Parents sit there to chat while kids play quietly nearby. It keeps everyone safe and connected.","L":"With cooperation between residents and leaders, the void deck can stay safe, lively, and welcoming for everyone."}],"audio":{"read":"audio/ace-read-18.mp3","readTimes":[[[0.3,6.27],[6.87,13.38]],[[14.48,20.22],[20.82,27.03],[27.63,31.38]],[[32.48,35.47],[36.07,41.23],[41.83,47.85]]],"ans":["audio/ace-ans-18-1.mp3","audio/ace-ans-18-2.mp3","audio/ace-ans-18-3.mp3","audio/ace-ans-18-4.mp3"],"ansTimes":[[[0.25,6.72],[7.02,29.5],[29.8,45.62],[45.92,52.16]],[[0.25,4.5],[4.8,28.37],[28.67,42.34],[42.64,49.05]],[[0.25,4.67],[4.97,25.15],[25.45,37.05],[37.35,43.08]],[[0.25,4.93],[5.23,30.1],[30.4,43.29],[43.59,50.42]]]}},{"n":19,"title":"Eating at the Hawker Centre","theme":"sg","img":"img/ace-19.jpg","reading":{"instruction":"You are reading a reflection for your English class about responsibility and respect at hawker centres. Read clearly and expressively, with warmth and sincerity.","paragraphs":["Last weekend, I went to the hawker centre with my parents for breakfast. As we carried our trays to the table, I noticed bright posters on the wall reminding everyone to return their trays. My mother said, \"It's the law now. Everyone must clear their own table after eating.\"","I looked around and saw that most people were already doing it. Even elderly uncles stood up carefully to return their trays. A cleaner smiled as she wiped the table we had just vacated. \"Thank you for returning your tray, young man,\" she said kindly.","My father nodded. \"It makes their job easier and keeps the place clean for the next person.\"","As we left, I realised that this simple rule wasn't just about cleanliness—it was about care. When everyone plays their part, the hawker centre becomes a pleasant place for all."]},"questions":["What is happening in this picture, and what message does it give?","Why is hawker culture an important part of Singapore's identity?","How can students show appreciation to hawkers and cleaners?","What can the community do to keep hawker centres clean and enjoyable?"],"answers":[{"P":"The picture shows diners returning trays and a cleaner tidying up tables at a busy hawker centre.","E1":"It shows people working together to keep a shared space clean. Returning trays reduces the workload of cleaners and keeps the area hygienic for others. It also shows respect for workers who maintain the space. The picture encourages everyone—young or old—to do their part in keeping public dining areas pleasant.","E2":"Once, I noticed an elderly cleaner looking tired while clearing tables at lunchtime. My family helped return a few trays. She thanked us with a big smile, and since then, I've always reminded my friends to clear their trays too.","L":"The picture teaches that small, thoughtful actions help create a cleaner and kinder community."},{"P":"Hawker culture reflects Singapore's multicultural heritage and brings people together through food.","E1":"Every hawker stall represents a unique cultural story—from Indian prata to Chinese noodles to Malay satay. Hawker centres are places where people of all backgrounds gather as equals. They show how Singaporeans value hard work, affordability, and togetherness. This shared love for food strengthens our national identity.","E2":"During the weekend, my family often eats at the hawker centre near our flat. We order dishes from different stalls and share everything. My father says this mix of flavours shows how unity and diversity coexist in Singapore.","L":"Hawker culture is not just about eating—it's about appreciating our shared history, diversity, and community spirit."},{"P":"Students can show appreciation through kind words, polite actions, and good habits.","E1":"Saying \"thank you,\" queuing patiently, and returning trays are simple yet powerful ways to show respect. Students can also avoid wasting food and keep tables clean. Schools can encourage gratitude campaigns where students make thank-you cards for hawkers and cleaners, helping them feel valued.","E2":"My class once designed appreciation cards for the hawkers in our neighbourhood. When we gave them out, one uncle said it was the first time anyone had thanked him personally. His smile showed how much small gestures matter.","L":"Showing respect makes people feel appreciated and helps keep our hawker culture warm and alive."},{"P":"The community can work together through clear rules, education, and cooperation.","E1":"Town councils can place friendly reminder posters, provide enough tray-return stations, and reward cleanliness. Residents can act as role models for children by keeping their tables tidy. When everyone makes the effort, hawker centres stay clean without extra enforcement. Public education helps people understand that cleaners should not have to clean up after everyone else.","E2":"At my nearby hawker centre, volunteers once gave stickers to children who returned trays. The fun idea encouraged adults to do the same! Now, the place is much tidier and more pleasant.","L":"Clean hawker centres depend on community cooperation—when everyone contributes, dining becomes a more enjoyable experience for all."}],"audio":{"read":"audio/ace-read-19.mp3","readTimes":[[[0.3,4.55],[5.15,11.57],[12.17,14.13],[14.73,17.52]],[[18.62,21.8],[22.4,25.9],[26.5,29.94],[30.54,33.99]],[[35.09,36.5],[37.1,41.09]],[[42.19,47.54],[48.14,52.45]]],"ans":["audio/ace-ans-19-1.mp3","audio/ace-ans-19-2.mp3","audio/ace-ans-19-3.mp3","audio/ace-ans-19-4.mp3"],"ansTimes":[[[0.25,6.36],[6.66,26.36],[26.66,40.51],[40.81,46.31]],[[0.25,6.23],[6.53,26.88],[27.18,41.07],[41.37,48.74]],[[0.25,5.51],[5.81,23.82],[24.12,37.13],[37.43,43.46]],[[0.25,5.25],[5.55,28.48],[28.78,40.86],[41.16,49.74]]]}},{"n":20,"title":"Helping a Classmate in Need","theme":"family","img":"img/ace-20.jpg","reading":{"instruction":"You are reading a short reflective story for your class assembly. Read with a gentle, caring tone to show understanding and empathy.","paragraphs":["It was after PE when I saw Ethan limping out of the hall. His face was pale, and he was holding his ankle tightly. \"Are you okay?\" I asked, hurrying over.","\"I slipped during the shuttle run,\" he said with a wince. \"I think I sprained it.\"","Without thinking, I helped him up and put his arm around my shoulder. \"Lean on me. Let's get you to the sick bay.\"","When our teacher saw us, she said, \"That was a kind thing to do, Ryan. Thank you for helping your friend.\" She gave me an encouraging nod as she called the school nurse.","Later, Ethan smiled weakly and said, \"Thanks for noticing and helping me. I didn't want to trouble anyone.\"","I told him, \"That's what friends are for.\"","That moment made me realise how small acts of kindness can make school feel like a second home."]},"questions":["What is happening in this picture, and what can we learn from it?","Why is it important to help classmates who are in need?","What are some ways students can show care and support for their peers in school?","How can schools encourage students to help one another more often?"],"answers":[{"P":"The picture shows a student helping his injured classmate walk, likely after the boy hurt his leg.","E1":"It shows kindness, empathy, and responsibility. Instead of ignoring his friend's pain, the student immediately offered help. This teaches us that even small acts of care make a big difference. It also reminds us that helping others creates trust and friendship.","E2":"Once, my classmate forgot her homework file, and I offered to share my notes. She later thanked me and said it helped her catch up for the test. Helping doesn't have to be big—it's about noticing and caring.","L":"The picture reminds us that being kind and helpful strengthens friendships and makes school a more caring place."},{"P":"Helping classmates builds compassion and teamwork.","E1":"School is not just for learning subjects—it's also where we learn to support one another. When we help others, we create a positive and safe environment. It encourages classmates to do the same, creating a caring culture. Helping others also makes us feel confident and useful.","E2":"During group projects, my team helped a classmate who was shy about speaking. We practised with her after school, and she did very well on presentation day. We all felt proud of her success.","L":"Helping one another builds both friendship and confidence—it makes the classroom a happier place."},{"P":"Students can help others by offering assistance, listening, and being inclusive.","E1":"They can share notes with absentees, help friends who struggle in subjects, or include lonely classmates in games. Even small gestures, like checking on someone who looks upset, show care. Schools can also promote kindness through buddy systems or peer-support programmes.","E2":"My school has a \"Kindness Tree\" where students write notes to thank helpful classmates. Reading those messages always brightens my day and motivates us to be kinder.","L":"Care and support can be shown through simple, consistent actions that make others feel valued."},{"P":"Schools can encourage helpfulness by creating a supportive environment and recognising kind behaviour.","E1":"Teachers can share stories of students who show empathy and teamwork. Schools can hold \"Kindness Week\" activities or give certificates for acts of care. More importantly, when teachers model kindness, students follow naturally. Building peer-support programmes or class councils also empowers students to take initiative.","E2":"In my school, teachers regularly praise students who go out of their way to help others. Seeing their names on the noticeboard inspires the rest of us to do good too.","L":"When kindness is recognised and celebrated, helping others becomes a normal and valued part of school life."}],"audio":{"read":"audio/ace-read-20.mp3","readTimes":[[[0.3,3.61],[4.21,7.62],[8.22,9.5],[10.1,11.81]],[[12.91,15.91],[16.51,18.18]],[[19.28,22.84],[23.44,24.59],[25.19,26.99]],[[28.09,31.9],[32.5,34.4],[35.0,38.22]],[[39.32,44.0],[44.6,46.47]],[[47.57,49.83]],[[50.93,56.01]]],"ans":["audio/ace-ans-20-1.mp3","audio/ace-ans-20-2.mp3","audio/ace-ans-20-3.mp3","audio/ace-ans-20-4.mp3"],"ansTimes":[[[0.25,6.27],[6.57,22.61],[22.91,35.37],[35.67,41.95]],[[0.25,3.42],[3.72,21.01],[21.31,32.9],[33.2,39.07]],[[0.25,5.21],[5.51,22.24],[22.54,33.14],[33.44,39.12]],[[0.25,6.85],[7.15,27.32],[27.62,36.99],[37.29,44.06]]]}}],"sch":{"title":"Fast Food","by":"P4 school worksheet (TREES)","questions":["Look at the picture. Which fast food meal do you think is the most popular among children? Why?","Do you like eating fast food? Why?","Do you think it is advisable to eat fast food every day? Why? What kinds of food should we eat?"],"qnote":["","Question 2 was not in the photo; this wording is a best guess from the pupil's answer.",""],"original":[{"T":"Ice-cream.","R":"Children normally like flavor in their food, and ice-cream is very sweet.","Ex":"I asked my mother once is ice-cream very popular. she said yes.","Exp":"I also like ice-cream, as it is cold and delicious, and you can pick the flavor you want.","S":"If you have not ever tried ice-cream, I suggest you try one!"},{"T":"Yes.","R":"Because it tastes delicious, but I limit it to about 3 times a month.","Ex":"If I eat too much fast food, I will become very unhealthy and fat.","Exp":"I normally eat healthy food, like vegetables, fruits, and everything in the healthy plate.","S":"I suggest you can eat fast food, but not too often. Eat healthier things."},{"T":"No.","R":"Because fast food is very unhealthy, even though it is delicious.","Ex":"Fast food is nice, but it will make you fat and if you eat too much, try to limit it to 3 times a month.","Exp":"I sometimes eat fast food, but not often.","S":"I suggest you don't eat fast food everyday."}],"teacher":[["flavor → flavour (British spelling)","Example: add \"among children\"","Experience: what is your favourite flavour? (caramel, coconut)"],["Example: elaborate on being unhealthy. What will it be like?"],[]],"improved":[{"T":"I think ice cream is the most popular fast food among children.","R":"This is because children love sweet treats, and ice cream comes in so many flavours that there is one for everyone. It is also cold and refreshing on a hot day in Singapore.","Ex":"For example, I once asked my mother whether ice cream was popular among children. She said yes, because she always sees long queues of children at the ice cream kiosk in the mall on weekends.","Exp":"There was once when my family went to an ice cream shop after my exams. I could pick any flavour I wanted, so I chose caramel, my favourite, and my brother chose coconut. It was cold and creamy, and we laughed as we tried each other's scoops.","S":"I suggest that everyone should enjoy ice cream as a treat, but choose a small cup and not have it every day, because it has a lot of sugar."},{"T":"Yes, I like eating fast food, but I try not to have it too often.","R":"This is because it is tasty, quick and convenient, so it feels like a special treat. However, I limit it to about three times a month.","Ex":"For example, fast food has a lot of oil, salt and sugar. If I eat too much of it, I might put on weight, feel tired and sluggish during lessons, and even get a stomachache or tooth decay.","Exp":"Last year, my family went out for burgers after my exams. My mother suggested that we share one portion of fries and drink water instead of soft drinks. The next day, she cooked vegetable soup, and I filled my plate the way My Healthy Plate shows: half fruit and vegetables, a quarter brown rice and a quarter meat.","S":"I suggest that everyone should enjoy fast food only once in a while, and choose healthier options like grilled chicken, corn or plain water."},{"T":"No, I do not think it is advisable to eat fast food every day.","R":"This is because fast food is high in fat, salt and sugar but low in vitamins and fibre. Even though it is delicious, eating it every day can make us unhealthy.","Ex":"For instance, a burger meal with fries and a soft drink has a lot of oil and sugar. Over time, eating like this can lead to weight gain and illnesses such as diabetes. Instead, we should eat balanced meals with vegetables, fruits, whole grains like brown rice, and lean meat or fish.","Exp":"There was once when I ate fast food two days in a row during the school holidays. By the second day, I felt heavy and sleepy, and I did not have the energy to play with my friends at the playground. After that, I asked my mother to pack fruit and sandwiches for our outings instead.","S":"I suggest that everyone should keep fast food as an occasional treat, and fill their plates with vegetables, fruits and whole grains every day."}],"changes":[["Start with a full sentence that answers the question: \"I think ice cream is the most popular fast food among children.\"","British spelling: flavour.","Example now says \"among children\" and gives a reason (queues at the kiosk).","Experience names a real moment and favourite flavours (caramel, coconut), as the teacher asked.","Suggestion gives advice with a reason, instead of \"try one\"."],["Full-sentence opener instead of just \"Yes.\"","Example explains what \"unhealthy\" feels like: tired, sluggish, stomachache, tooth decay (teacher's comment).","Experience tells a story, borrowed from Ace Practice 4: sharing fries, water instead of soft drinks, soup the next day.","Uses \"My Healthy Plate\" by name."],["Answers both parts of the question: why not, and what we should eat instead.","Reason explains why fast food is unhealthy (fat, salt, sugar; low in vitamins and fibre).","Experience is a specific story, not just \"sometimes\".","\"everyday\" → \"every day\" (two words when it means each day)."]],"n":1,"theme":"sports","img":"img/sch-1.jpg","audio":{"ans":["audio/sch-ans-1.mp3","audio/sch-ans-2.mp3","audio/sch-ans-3.mp3"],"ansTimes":[[[0.25,4.1],[4.4,14.63],[14.93,25.85],[26.15,40.79],[41.09,49.19]],[[0.25,4.61],[4.91,13.08],[13.38,25.15],[25.45,45.0],[45.3,53.82]],[[0.25,4.46],[4.76,15.15],[15.45,32.82],[33.12,49.14],[49.44,57.9]]]}}};

async function pickFolder(){

async function audioURL(rel){
  if(!rel) return null;
  if(Audio.mode==='file'||Audio.mode==='web') return encodeURI(rel);
  if(Audio.urls[rel]) return Audio.urls[rel];
  try{
    let file=null;
    if(Audio.files){ file=Audio.files[rel]||null; }
    else if(Audio.dir&&Audio.ok){ const parts=rel.split('/'); let d=Audio.dir; for(let i=0;i<parts.length-1;i++) d=await d.getDirectoryHandle(parts[i]); file=await (await d.getFileHandle(parts[parts.length-1])).getFile(); }

let SPIN={angle:0,spinning:false,result:null};
function spinView(){
  const r=SPIN.result; let res='';
  if(r){ const g=getSet(r.sid); const s=SEQ_BY_SID[r.sid]; res=`<div class="result stack"><span class="eyebrow">The wheel picked</span><h2 style="font-size:26px;color:${g.theme.color}">${esc(g.theme.name)}</h2><img src="${g.set.img}" alt=""><p><b>${picName(g)}</b> (Day ${s.day})${ST.done[r.sid]?' · done before, great for revision':' · new!'}</p><p class="small muted">${esc(g.set.questions[0])}</p><div class="row" style="justify-content:center"><button class="btn primary lg" data-start="${r.sid}">${I.play} Practise this</button><button class="btn" data-spin="1">Spin again</button></div></div>`; }
  else res=`<div class="result stack"><h2>Spin for a surprise topic</h2><p class="muted">Great for revision days and weekends. The wheel prefers pictures you have not done yet.<br>随机抽一个主题，优先抽还没练过的图。</p><button class="btn primary lg" data-spin="1" style="align-self:center">Spin the wheel! 转一下</button></div>`;
  return `<section class="card wheelwrap"><div class="wheelbox"><div class="ptr"></div><canvas id="wheel" width="720" height="720" aria-label="Topic wheel"></canvas><button class="hub" data-spin="1">SPIN</button></div>${res}</section>`;
}
function drawWheel(){ const c=$('#wheel'); if(!c) return; const ctx=c.getContext('2d'); const n=DATA.themes.length; const R=360; ctx.clearRect(0,0,720,720); ctx.save(); ctx.translate(R,R); ctx.rotate(SPIN.angle);
  DATA.themes.forEach((t,i)=>{ const a0=i*2*Math.PI/n-Math.PI/2, a1=(i+1)*2*Math.PI/n-Math.PI/2; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,a0,a1); ctx.closePath(); ctx.fillStyle=t.color; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=4; ctx.stroke();
    ctx.save(); const mid=(a0+a1)/2; const abs=((mid+SPIN.angle)%(2*Math.PI)+2*Math.PI)%(2*Math.PI); const flip=abs>Math.PI/2&&abs<3*Math.PI/2; ctx.rotate(mid+(flip?Math.PI:0)); ctx.textAlign=flip?'left':'right'; ctx.fillStyle='#fff'; ctx.font='700 30px Fredoka, Nunito, sans-serif'; const lines=t.short.split(' & '); lines.forEach((l,j)=>ctx.fillText(l,flip?-R+30:R-30,(j-(lines.length-1)/2)*34+10)); ctx.restore(); });
  ctx.restore(); }
function spin(){ if(SPIN.spinning) return; SPIN.spinning=true; SPIN.result=null; render();
  const n=DATA.themes.length; const pick=Math.floor(Math.random()*n); const target=-(pick+0.5)*2*Math.PI/n; const turns=5+Math.floor(Math.random()*3); const start=SPIN.angle; const norm=((start%(2*Math.PI))+2*Math.PI)%(2*Math.PI); const end=start-norm+target-turns*2*Math.PI; const dur=4200; const t0=performance.now();
  const tick=t=>{ const p=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-p,4); SPIN.angle=start+(end-start)*e; drawWheel(); if(p<1) requestAnimationFrame(tick); else { SPIN.spinning=false; const th=DATA.themes[pick]; const all=[...th.sets.map(s=>`${th.id}-${s.n}`),...ACE.filter(a=>a.theme===th.id).map(a=>`ace-${a.n}`)]; const undone=all.filter(id=>!ST.done[id]); const pool=undone.length?undone:all; SPIN.result={sid:pool[Math.floor(Math.random()*pool.length)]}; render(); } };
  requestAnimationFrame(tick); }

function nextPassage(){ const r=ST.read||{}; return ACE.find(a=>!r[a.n])||ACE.slice().sort((x,y)=>(r[x.n].count-r[y.n].count)||x.n-y.n)[0]; }

function stepHTML(){ return `<div class="stepper">${STEPS.map((s,i)=>`<button class="stp ${i===SESS.step?'on':i<SESS.step?'done':''}" data-step="${i}"><span class="n">${i<SESS.step?'✓':i+1}</span>${s[1]} <span class="muted" style="font-weight:600">${s[2]}</span></button>`).join('')}</div>`; }

const LBL={S:{peel:'P',pname:'Point',sname:'State your point'},P:{peel:'E',pname:'Explain',sname:'Provide explanation'},E:{peel:'E',pname:'Example',sname:'Evidence / example'},A:{peel:'L',pname:'Link back',sname:'Anchor to the point'},K:{peel:'L',pname:'Link back',sname:'Keep on track (wrap up)'}};
function lblMode(){ const m=ST.settings.labels||'all'; return m==='both'?'all':m; }
const TR_OF={S:'T',P:'R',E:'E·E',A:'',K:'S'}; const TR_NAME={T:'Thoughts',R:'Reasons','E·E':'Examples + Experiences',S:'Suggestions',Ex:'Examples',Exp:'Experiences'};
function trTag(x,alt){ if(!x) return '<span class="tg tr none" aria-hidden="true"></span>'; return `<span class="tg tr ${alt?'alt':''}" title="TREES: ${TR_NAME[x]||x}${alt?' (TREES ends with a suggestion instead of linking back)':''}" style="${x.length>1?'font-size:10px':''}">${x}</span>`; }
function tagPair(k,alt){ const mode=lblMode(); const l=LBL[k]; const peel=`<span class="tg pe pe-${k}" title="PEEL: ${l.pname}">${l.peel}</span>`; const sp=`<span class="tg sp sk-${k}" title="SPEAK: ${l.sname}">${alt||k}</span>`; const tr=trTag(TR_OF[k],k==='K');
  return `<span class="tags">${mode==='speak'?sp:mode==='peel'?peel:mode==='trees'?tr:peel+sp+tr}</span>`; }
function legendHTML(){ const mode=lblMode(); return `<div class="peelkey"><div class="row" style="justify-content:space-between"><b>PEEL = SPEAK = TREES <span class="muted small">same idea, three names</span></b><span class="lblsw" role="group" aria-label="Labels">${[['all','All'],['peel','PEEL'],['speak','SPEAK'],['trees','TREES']].map(([v,l])=>`<button data-lbl="${v}" class="${mode===v?'on':''}">${l}</button>`).join('')}</span></div>
  <div class="pk">${[['S','P','S','T','Point = State = Thoughts'],['P','E','P','R','Explain = Provide = Reasons'],['E','E','E','E·E','Example = Evidence = Examples + Experiences'],['A','L','A+K','S','Link back = Anchor + Keep on track. TREES ends with a Suggestion instead.']].map(([k,pl,sl,tl,txt])=>`<span><span class="tg pe pe-${k}">${pl}</span><span class="tg sp sk-${k}" style="${sl.length>1?'font-size:11px':''}">${sl}</span>${trTag(tl,tl==='S')}<span class="small">${txt}</span></span>`).join('')}</div></div>`; }
function treesTip(){ const m=lblMode(); return (m==='all'||m==='trees')?`<div class="trtip">${trTag('S',true)}<span class="small"><b>TREES ending:</b> instead of linking back, finish with a suggestion: "I suggest that everyone should …" <span class="muted">TREES 结尾用建议，不用扣题。</span></span></div>`:''; }
function respHTML(r,theme,highlight){ const H=t=>highlight?highlightPW(t,theme):esc(t); if(r._) return `<div class="read">${r._.split('\n').map(p=>`<p>${H(p)}</p>`).join('')}</div>`;
  if(r.trees){ const x=r.trees; const m=lblMode(); const P={T:['S','P'],R:['P','E'],Ex:['E','E'],Exp:['E','E'],S:['K','L']};
    return [['T',x.T],['R',x.R],['Ex',x.Ex],['Exp',x.Exp],['S',x.S]].filter(z=>z[1]).map(([k,txt])=>{ const lab=k==='Ex'||k==='Exp'?'E':k; const tr=`<span class="tg tr" title="TREES: ${TR_NAME[k]}">${lab}</span>`; const pe=`<span class="tg pe pe-${P[k][0]}" title="PEEL">${P[k][1]}</span>`; const sp=`<span class="tg sp sk-${P[k][0]}" title="SPEAK" style="${P[k][0]==='K'?'font-size:11px':''}">${P[k][0]==='K'?'A·K':P[k][0]}</span>`;
      return `<div class="speak"><span class="tags">${m==='peel'?pe:m==='speak'?sp:m==='trees'?tr:pe+sp+tr}</span><div><span class="trname">${TR_NAME[k]}</span><p>${H(txt)}</p></div></div>`; }).join(''); }
  if(r.peel){ const p=r.peel; const m=lblMode(); return [['S',p.P],['P',p.E1],['E',p.E2],['L',p.L]].filter(x=>x[1]).map(([k,txt])=>`<div class="speak">${k==='L'?`<span class="tags">${m==='all'||m==='peel'?'<span class="tg pe pe-A" title="PEEL: Link back">L</span>':''}${m==='all'||m==='speak'?'<span class="tg sp sk-A" title="SPEAK: Anchor + Keep on track" style="font-size:11px">A·K</span>':''}${m==='all'||m==='trees'?trTag('S',true):''}</span>`:tagPair(k)}<p>${H(txt)}</p></div>`).join('')+treesTip(); }
  return ['S','P','E','A','K'].filter(k=>r[k]).map(k=>`<div class="speak">${tagPair(k)}<p>${H(r[k])}</p></div>`).join('')+treesTip(); }
const PW_CACHE={};
const GENERAL_PW=['quality time','strengthen','bond','bonding','responsible','responsibility','appreciate','grateful','gratitude','resilience','perseverance','teamwork','confidence','confident','motivated','engaging','interactive','privilege','valuable','meaningful','realise','independence','self-discipline','camaraderie','cherish','treasure','compassion','empathy','considerate','initiative','contribute','community spirit','sense of belonging','sense of achievement','satisfaction','fulfilling','rewarding','memorable','unforgettable','precious','patience','determination','cooperation','mutual respect','take for granted','make a difference','step out of my comfort zone','broaden','perspective','well-being','balance','discipline','encourage','supportive','harmony','inclusive','heritage','tradition','generation','lifelong','habit','mindful','overcome','challenge','opportunity','inspire','inspiring','proud','pride','thoughtful','generous','kindness','respect','trust','unity','united','stress','relax','recharge','energetic','focus','concentrate','sustainable','conserve','reduce','reuse','recycle','pollution','wildlife','nature','greenery','convenient','efficient','distracted','addicted','moderation','screen time','face-to-face','connected','communicate','creativity','creative','curiosity','explore','knowledge','wisdom'];
function pwRegex(theme){ if(PW_CACHE[theme.id]) return PW_CACHE[theme.id]; const list=[...(DATA.vocab[theme.id]||[]),...GENERAL_PW].map(v=>v.replace(/[.…]+$/,'').trim()).filter(v=>v.length>=4&&v.length<=45).sort((a,b)=>b.length-a.length); const re=new RegExp('\\b('+list.map(v=>v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+')).join('|')+')(?:s|es|d|ed|ing)?\\b','gi'); return PW_CACHE[theme.id]=re; }
function highlightPW(text,theme){ const re=pwRegex(theme); let out='',last=0; const s=String(text); re.lastIndex=0; let m; while((m=re.exec(s))){ out+=esc(s.slice(last,m.index)); const w=m[0]; const got=ST.words.some(x=>x.toLowerCase()===w.toLowerCase()); out+=`<mark class="pw ${got?'got':''}" data-pw="${esc(w)}" title="Tap to collect this power phrase">${esc(w)}</mark>`; last=m.index+w.length; } out+=esc(s.slice(last)); return out; }

  <tr><td><span class="sk sk-P">P</span> Provide explanation</td><td><span class="sk" style="background:#1B2130">E</span> Explain</td><td>"This is because…"</td></tr>

  ${[['S','P','I think we should help elderly people because they may face difficulties in their daily lives.'],['P','E','Elderly people may have health problems that make it hard for them to do things easily.'],['E','E','A few months ago, I helped an elderly woman at the MRT station top up her EZ-Link card. She did not know how to use the machine, so I guided her step by step.'],['A','L','This experience made me realise that younger people like me should be patient and helpful.'],['K','L','Therefore, I strongly believe that all of us should do our part to help elderly people.']].map(([s,p,x])=>`<div class="speak" style="grid-template-columns:72px 1fr"><span class="row" style="gap:4px"><span class="sk sk-${s}">${s}</span><span class="sk" style="background:#1B2130">${p}</span></span><p>${x}</p></div>`).join('')}</div></div></div>`;

verall scene, the zoomed-in action, and the object (poster, gadget, litter).</p>`)}<h3 style="margin-top:8px">Vocabulary by theme</h3>${vocab}</div>`; }

function confetti(){ const c=$('#confetti'); if(!c) return; const r=c.getBoundingClientRect(); c.width=r.width; c.height=r.height; const ctx=c.getContext('2d'); const cols=['#FF6B3D','#F5B301','#3A7BFF','#16A34A','#EC4C9B','#8B5CF6']; const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,s:6+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,w:(Math.random()-.5)*.2})); let t=0; const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; const step=()=>{ ctx.clearRect(0,0,c.width,c.height); ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.a+=p.w; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); }); t++; if(t<220&&!reduce) requestAnimationFrame(step); }; step(); }

    const b=e.target.closest('[data-go],[data-start],[data-act],[data-step],[data-q],[data-stc],[data-play],[data-back],[data-spd],[data-loop],[data-round],[data-bigtext],[data-rec],[data-tts],[data-hint],[data-check],[data-pw],[data-exit],[data-cal],[data-sel],[data-day],[data-markdone],[data-spin],[data-exam],[data-examgo],[data-examq],[data-examrv],[data-acc],[data-clearwords],[data-savesettings],[data-testai],[data-export],[data-import],[data-reset],[data-looktimer],[data-typed],[data-lbl],[data-ra],[data-raplay],[data-rarate],[data-rabig],[data-readsel],[data-readdone],[data-ttsans],[data-vtest],.ra-s'); if(!b) return;
    if(b.classList.contains('ra-s')){ const a=raCurrent(); if(a&&a.audio&&a.audio.readTimes){ const [pi,si]=b.dataset.s.split('-').map(Number); const tt=a.audio.readTimes[pi]&&a.audio.readTimes[pi][si]; if(tt){ if(PL.id!=='ra'||aud.paused){ await playToggle('ra'); } aud.currentTime=tt[0]; SYNC.stopAt=tt[1]+0.1; if(aud.paused) aud.play(); return; } } raSpeakOne(b); return; }
    const d=b.dataset;
    if(d.go){ if(VIEW==='session'&&SESS&&SESS.step<STEPS.length-1){ if(!confirmLeave()) return; } stopAll(); raStop(); sessQuit(); SESS=null; EXAM=null; if(d.go==='read') READ_SEL=null; go(d.go); return; }
    if(d.start){ startSession(d.start); return; }
    if(d.act==='pick'){ Audio.dir&&!Audio.ok?reconnectFolder():pickFolder(); return; }
    if(d.step!==undefined&&SESS){ const last=STEPS.length-1; const n=+d.step; if(n<0||n>last) return; raStop(); if(STEPS[SESS.step][0]==='readaloud'&&SESS.readDone){ raMarkRead(getSet(SESS.sid).set.n,SESS.checks); } if(n===last&&SESS.step<last){ completeSession(); } SESS.step=n; stopAll(); window.scrollTo(0,0); render(); if(n===last) requestAnimationFrame(confetti); return; }
    if(d.q!==undefined&&SESS){ if(PL.id&&PL.id.startsWith('ans')){ aud.pause(); PL.id=null; } SESS.q=+d.q; if(SESS.kind!=='w'&&['model','compare'].includes(STEPS[SESS.step][0])) SESS.listened=true; render(); return; }
    if(d.stc){ SESS.open[d.stc]=!SESS.open[d.stc]; render(); return; }

    if(d.loop){ PL.loop=!PL.loop; aud.loop=PL.loop; b.classList.toggle('on',PL.loop); return; }
    if(d.round){ SESS.rounds++; render(); if(SESS.rounds===1) toast('⭐ Shadow star earned'); return; }

    if(d.raplay){ const c=$('#passage'); if(!c) return; if(RAT.playing) raStop(); else raSpeakFrom(c,0); return; }

    if(d.exit){ raStop(); if(SESS.step<STEPS.length-1&&!confirmLeave()) return; stopAll(); SESS=null; go('home'); return; }
    if(d.cal){ let [y,mo]=CAL.ym; mo+=+d.cal; if(mo<0){mo=11;y--;} if(mo>11){mo=0;y++;} CAL.ym=[y,mo]; render(); return; }
    if(d.sel){ CAL.sel=d.sel; render(); return; }
    if(d.day!==undefined){ const i=+d.day; const ix=ST.settings.days.indexOf(i); if(ix>=0){ if(ST.settings.days.length>1) ST.settings.days.splice(ix,1); } else ST.settings.days.push(i); ST.settings.days.sort(); save(); render(); return; }
    if(d.markdone){ const sid=d.markdone; const prev=ST.done[sid]; ST.done[sid]={date:d.date,stars:Math.max(1,prev?prev.stars:0),count:(prev?prev.count:0)+1}; ST.log.push({t:Date.now(),date:d.date,sid,stars:1,mark:1}); save(); toast('Marked done'); render(); return; }
    if(d.spin){ spin(); return; }
    if(d.exam){ stopAll(); EXAM={day:+d.exam,stage:'prep',q:0,rv:0,rec:{},fb:{}}; render(); startPrepTimer(); return; }
    if(d.examgo){ stopAll(); if(d.examgo==='exit'){ EXAM=null; render(); return; } if(d.examgo==='done'){ const sid='bonus-'+EXAM.day; const prev=ST.done[sid]; ST.done[sid]={date:todayStr(),stars:3,count:(prev?prev.count:0)+1}; ST.log.push({t:Date.now(),date:todayStr(),sid,stars:3}); save(); EXAM=null; toast('⭐⭐⭐ Mock exam done!'); render(); return; } EXAM.stage=d.examgo; EXAM.q=0; render(); return; }
    if(d.examq!==undefined){ if(REC.live) stopRec(); EXAM.q=+d.examq; render(); return; }
    if(d.examrv!==undefined){ EXAM.rv=+d.examrv; render(); return; }
    if(d.acc){ TOOL_OPEN[d.acc]=!TOOL_OPEN[d.acc]; render(); return; }
    if(d.clearwords){ ST.words=[]; save(); render(); return; }
    if(d.savesettings){ ST.settings.name=$('#s-name').value.trim(); ST.settings.theme=$('#s-theme').value; ST.settings.voice=$('#s-voice').value; if(!WEB){ ST.settings.apiKey=$('#s-key').value.trim(); ST.settings.model=$('#s-model').value.trim()||'claude-sonnet-4-5'; } save(); applyTheme(); toast('Saved 已保存'); render(); return; }
    if(d.testai){ testAI(); return; }
    if(d.export){ const s=await makeBackup(); $('#backup').value=s; ST.lastBackup=Date.now(); save(); let ok=false; try{ await navigator.clipboard.writeText(s); ok=true; }catch(e){ $('#backup').select(); try{ ok=document.execCommand('copy'); }catch(_){} } toast(ok?'备份码已复制 ✓':'请长按选中复制'); return; }
    if(d.import){ try{ const n=mergeBackup(await readBackup($('#backup').value)); applyTheme(); render(); toast('✅ 恢复好了，新加 '+n+' 条记录'); }catch(e){ toast('❌ '+(e.message||'不是有效的备份码')); } return; }
    if(d.reset){ if(!RESET_ARMED){ RESET_ARMED=true; b.textContent='再点一次确认重置 Tap again to confirm'; setTimeout(()=>{RESET_ARMED=false; if(document.body.contains(b)) b.textContent='重置全部 Reset';},4000); return; } ST={...JSON.parse(JSON.stringify(DEFAULT)),settings:ST.settings,log:ST.log,lastBackup:ST.lastBackup}; save(); applyTheme(); RESET_ARMED=false; toast('Reset · 记录保留'); render(); return; }
    if(d.looktimer){ startLookTimer(b); return; }
  };
  $$('input[type=range][id^=seek-]').forEach(s=>{ s.oninput=()=>{ s._drag=true; }; s.onchange=()=>{ if(aud.duration) aud.currentTime=s.value/1000*aud.duration; s._drag=false; }; });
  const cv=$('#childvoice'); if(cv) cv.onchange=()=>{ ST.settings.childVoice=cv.value; save(); const y=window.scrollY; render(); window.scrollTo(0,y); };
  const cp=$('#childpitch'); if(cp) cp.onchange=()=>{ ST.settings.childPitch=+cp.value; save(); speak('Hello! I am reading this passage aloud.','child'); };
  $$('[data-rachk]').forEach(cb=>cb.onchange=()=>{ const k=cb.dataset.rachk; if(VIEW==='session'&&SESS){ SESS.checks[k]=cb.checked; SESS.readDone=Object.values(SESS.checks).some(Boolean); } else { READ_CHECKS[k]=cb.checked; } });
  if(VIEW==='spin') drawWheel();

let RESET_ARMED=false;
function confirmLeave(){ return true; }
function beep(f=880,d=.15,when=0){ try{ const AC=window.AudioContext||window.webkitAudioContext; if(!beep.ctx) beep.ctx=new AC(); const c=beep.ctx; const o=c.createOscillator(), g=c.createGain(); o.frequency.value=f; o.type='sine'; g.gain.value=.0001; o.connect(g); g.connect(c.destination); const t0=c.currentTime+when; g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(.25,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+d); o.start(t0); o.stop(t0+d+.05); }catch(e){} }
function startLookTimer(btn){ if(LOOK) return; const box=$('#looktimer'); if(!box) return; const total=30; let t=total; const C=2*Math.PI*52; const fg=$('#lt-fg'), num=$('#lt-num'), title=$('#lt-title'), sub=$('#lt-sub'); box.classList.add('live'); box.classList.remove('over'); btn.hidden=true; fg.style.strokeDasharray=C; fg.style.strokeDashoffset=0; num.textContent=t; title.textContent='Look closely… 仔细看'; sub.innerHTML='Who? What are they doing? Which objects stand out?<br>谁？在做什么？哪些东西特别显眼？'; beep(660,.12);
  LOOK=setInterval(()=>{ t--; num.textContent=t; fg.style.strokeDashoffset=C*(1-t/total); if(t===10){ title.textContent='10 seconds left! 还有10秒'; sub.innerHTML='Now THINK: why? what does it show?<br>现在想一想：为什么？说明了什么？'; } if(t<=3&&t>0) beep(880,.1); if(t<=0){ clearInterval(LOOK); LOOK=null; box.classList.remove('live'); box.classList.add('over'); num.textContent='✓'; title.textContent="Time's up! 时间到"; sub.innerHTML='Say what you see out loud, then reveal S · T · C to compare.<br>大声说出你看到的，再点开S·T·C对照。'; beep(784,.12); beep(988,.12,.15); beep(1319,.25,.3); btn.hidden=false; btn.innerHTML=I.eye+' Look again'; } },1000); }
function startPrepTimer(){ let t=60; const tick=()=>{ const el=$('#ptimer'); if(!el||!EXAM||EXAM.stage!=='prep') return; el.textContent=fmt(t); if(t>0){ t--; setTimeout(tick,1000); } else { el.textContent='Time!'; } }; tick(); }

/* ============ storage check + backup code ============ */
const WEB_URL='https://vivianchengwei.github.io/tr-61mimc/psle/';
const openMode=()=>{ let fr=false; try{ fr=window.top!==window.self; }catch(e){ fr=true; }
  if(fr) return ['embedded','嵌在 claude.ai 页面里']; if(location.protocol==='file:') return ['file','本地文件'];
  if((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone) return ['app','主屏幕 App']; return ['web','独立网页']; };
let persistState='检查中…';
try{ if(navigator.storage&&navigator.storage.persisted){ navigator.storage.persisted().then(g=>{ if(g){ persistState='已获准'; return; } if(!navigator.storage.persist){ persistState='未获准'; return; } navigator.storage.persist().then(x=>{ persistState=x?'已获准':'未获准'; }).catch(()=>{ persistState='未获准'; }); }).catch(()=>{ persistState='未获准'; }); } else persistState='这个浏览器不支持'; }catch(e){ persistState='这个浏览器不支持'; }
const lsWorks=()=>{ try{ localStorage.setItem('po-test','1'); const ok=localStorage.getItem('po-test')==='1'; localStorage.removeItem('po-test'); return ok; }catch(e){ return false; } };
const b64enc=u8=>{ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); };
const b64dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const gz=async(u8,on)=>{ const cs=on?new CompressionStream('gzip'):new DecompressionStream('gzip'); return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer()); };
async function makeBackup(){ const s=JSON.parse(JSON.stringify(ST)); delete s.settings.apiKey; const raw=new TextEncoder().encode(JSON.stringify({app:'psle-oral',v:1,at:Date.now(),st:s}));
  if(window.CompressionStream){ try{ return 'PO1Z:'+b64enc(await gz(raw,true)); }catch(e){} } return 'PO1:'+b64enc(raw); }
async function readBackup(code){ code=String(code||'').trim();
  if(code.startsWith('{')){ const j=JSON.parse(code); if(j&&j.done) return {app:'psle-oral',st:j}; }
  code=code.replace(/\s+/g,'');
  if(code.startsWith('PO1Z:')) return JSON.parse(new TextDecoder().decode(await gz(b64dec(code.slice(5)),false)));
  if(code.startsWith('PO1:')) return JSON.parse(new TextDecoder().decode(b64dec(code.slice(4))));
  throw new Error('这不是 PSLE Oral Coach 的备份码（应该以 PO1 开头）'); }
function mergeBackup(b){ if(!b||b.app!=='psle-oral'||!b.st) throw new Error('这不是 PSLE Oral Coach 的备份码'); const r=b.st; let added=0;
  Object.entries(r.done||{}).forEach(([k,v])=>{ const p=ST.done[k]; ST.done[k]=p?{date:(v.date>p.date?v.date:p.date),stars:Math.max(v.stars||0,p.stars||0),count:Math.max(v.count||0,p.count||0)}:v; });
  const key=l=>(l.t||'')+'|'+l.date+'|'+l.sid+'|'+(l.stars||0)+'|'+(l.quit?1:0); const seen=new Set(ST.log.map(key));
  (r.log||[]).forEach(l=>{ if(!seen.has(key(l))){ ST.log.push(l); seen.add(key(l)); added++; } });
  ST.log.sort((x,y)=>(x.t||Date.parse(x.date))-(y.t||Date.parse(y.date))); if(ST.log.length>5000) ST.log.splice(0,ST.log.length-5000);
  Object.entries(r.read||{}).forEach(([k,v])=>{ if(!(k in ST.read)) ST.read[k]=v; });
  Object.entries(r.shadow||{}).forEach(([k,v])=>{ ST.shadow[k]=Math.max(v||0,ST.shadow[k]||0); });
  (r.words||[]).forEach(w=>{ if(!ST.words.some(x=>JSON.stringify(x)===JSON.stringify(w))) ST.words.push(w); });
  if(!ST.settings.name&&r.settings&&r.settings.name) ST.settings.name=r.settings.name;
  save(); return added; }
function homeNotes(){ const m=openMode()[0];
  if(m==='embedded') return `<div class="savenote">📌 嵌在 claude.ai 里时，浏览器可能会清掉进度。孩子请用独立网址：<b>${WEB_URL}</b>　家长：在这里的家长页复制备份码，到独立网址的家长页恢复。</div>`;
  if(ST.log.length&&Date.now()-(ST.lastBackup||0)>7*864e5) return `<div class="savenote">💾 ${ST.lastBackup?'超过一周没备份了':'还没备份过'}。家长可以在 <button class="linkbtn" data-go="parent">家长页</button> 复制备份码，存到备忘录。</div>`;
  return ''; }
const pad2=n=>String(n).padStart(2,'0');
const fmtDur=s=>s<60?s+' 秒':Math.floor(s/60)+' 分 '+pad2(s%60)+' 秒';
function logName(l){ if(l.sid.startsWith('read-')) return '📖 朗读 Ace '+esc(l.sid.slice(5)); if(l.sid.startsWith('bonus-')) return '📝 2025 模拟考 Day '+esc(l.sid.slice(6)); const g=getSet(l.sid); const q=SEQ_BY_SID[l.sid];
  return g?`<span class="dot" style="background:${g.theme.color};margin-right:6px"></span>${q?'Day '+q.day+' · ':''}${esc(unitLabel(l.sid))}`:esc(l.sid); }
function recordsHTML(){ const days=new Map(); [...ST.log].sort((x,y)=>(y.t||Date.parse(y.date))-(x.t||Date.parse(x.date))).forEach(l=>{ if(!days.has(l.date)) days.set(l.date,[]); days.get(l.date).push(l); });
  const keys=[...days.keys()].sort().reverse(); if(!keys.length) return '<p class="muted">还没有记录。</p>';
  return keys.slice(0,120).map((k,di)=>{ const list=days.get(k); const fin=list.filter(l=>!l.quit).length; const secs=list.reduce((s,l)=>s+(l.d||0),0); const dt=parseD(k);
    return `<details class="rec-day"${di===0?' open':''}><summary><b>${dt.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'})}</b><span>${list.length} 次 · ${fin} 次完成${secs?' · '+Math.max(1,Math.round(secs/60))+' 分钟':''}</span></summary>${list.map(l=>{ const t=l.t?new Date(l.t):null;
      const res=l.quit?'<span class="rec-q">没做完</span>':l.sid.startsWith('read-')?'<span class="rec-ok">✓ 读完</span>':`<span class="rec-ok">${'★'.repeat(l.stars||0)} 完成${l.mark?'（日历补记）':''}</span>`;
      const extra=[l.li?'听过范文':'',l.sh?`跟读 ${l.sh} 遍`:'',l.ans?`自己答了 ${l.ans.length} 题`:'',l.d?fmtDur(l.d):''].filter(Boolean).join(' · ');
      const det=l.ans?`<details class="rec-det"><summary>他说的答案</summary><div class="rec-ans">${l.ans.map(x=>`<div><b>Q${x.q+1}</b> ${esc(x.text)}${x.ai?`<div class="small muted">AI: ${Object.entries(x.ai).map(([a,b])=>esc(a)+' '+esc(b)).join(' · ')}</div>`:''}</div>`).join('')}</div></details>`:'';
      return `<div class="rec-row"><span class="rec-t">${t?pad2(t.getHours())+':'+pad2(t.getMinutes()):'—'}</span><span class="rec-what">${logName(l)}</span>${res}<span class="small muted">${extra}</span>${det}</div>`; }).join('')}</details>`; }).join('')+(keys.length>120?`<p class="small muted">只显示最近 120 天，更早的 ${keys.length-120} 天仍然保存着。</p>`:''); }

/* ============ cloud (web version) ============ */
const CLOUD={db:null,user:null,sample:null,ref:null,timer:null};
async function cloudInit(){ if(!WEB||!window.claude||!window.claude.use) return; try{ const [db,user,sample]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('sample')]); CLOUD.sample=sample; if(db&&user){ const uid=await user.id(); if(uid){ CLOUD.db=db; CLOUD.user=user; CLOUD.ref=db.doc('data/users/'+uid+'/progress'); const snap=await CLOUD.ref.get(); if(snap.exists){ const remote=snap.data(); if(remote&&remote.state&&(remote.state.updated||0)>(ST.updated||0)){ ST={...DEFAULT,...remote.state,settings:{...DEFAULT.settings,...(remote.state.settings||{})}}; try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} applyTheme(); } else if(ST.updated){ cloudSave(); } } else if(ST.updated||Object.keys(ST.done).length){ cloudSave(); } } } render(); }catch(e){ console.warn('cloud',e); render(); } }
function cloudSave(){ if(!CLOUD.ref) return; clearTimeout(CLOUD.timer); CLOUD.timer=setTimeout(async()=>{ try{ const s=JSON.parse(JSON.stringify(ST)); delete s.settings.apiKey; await CLOUD.ref.set({state:s,updated:Date.now()}); }catch(e){ console.warn('cloud save',e); } },800); }
