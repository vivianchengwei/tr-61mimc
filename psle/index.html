mmunity centre.","A":"These small actions show me that everyone can play a part in helping the environment.","K":"So, I think the students in the picture are doing important work for the environment by recycling right."},{"S":"Yes, I have joined such activities before, and they taught me valuable lessons.","P":"My school once organised a \"Clean and Green Week\" where we had talks, games, and a recycling competition.","E":"My class collected newspapers, bottles, and cans, and we ended up as one of the top classes. I felt proud because our effort reduced waste and encouraged others too.","A":"It showed me that when we work together, we can make a real difference.","K":"That's why I think such activities are meaningful and should continue in schools."},{"S":"Young people should learn about recycling because we are the future caretakers of the Earth.","P":"If we develop good habits now, we will continue them when we grow up, and that will create a cleaner world.","E":"I once read that if children start recycling early, it becomes second nature, just like brushing teeth. This shows how important it is to start young.","A":"Recycling helps us build habits that protect the planet for many years.","K":"So, young people should definitely learn about it because the Earth depends on our actions."}],"advanced":[{"S":"I think the students in the picture are sorting recyclables and showing that they care for the environment.","P":"The students are separating their rubbish into different bins for plastic, paper, metal and glass, which demonstrates proper recycling habits. Recycling reduces the amount of waste that goes into landfills, which helps prevent pollution. It also saves resources because materials like glass and paper can be reused. At home, we have separate bins for different materials. Whenever I drink from a can, I rinse it and put it in the recycling bin. During festive seasons when we receive many deliveries, I help my father flatten the cardboard boxes before recycling them.","A":"These small habits make me feel like I am doing my part to protect the environment, even as a student.","K":"So, I think the students in the picture are practising good environmental habits by recycling properly."},{"S":"Yes, I have joined activities that focused on environmental care, and they left a strong impression on me.","P":"One of the most memorable was when my CCA organised a park clean-up. Firstly, I realised how much litter people leave behind. Secondly, I saw how working together as a team made the clean-up faster and more enjoyable. Finally, I learnt that education and action must go hand in hand as we can't just talk about protecting the Earth, we must actually do it.","E":"I remember picking up plastic bags and bottles from the grass. At first, it felt tiring, but when I saw the park clean and beautiful at the end, I felt a strong sense of satisfaction.","A":"That activity taught me that every little effort counts and that we should not take our environment for granted.","K":"Therefore, I think schools and communities should continue organising such events so that more young people can learn and take action."},{"S":"Young people must learn about recycling and protecting the Earth because the future of the planet depends on our choices today.","P":"Firstly, learning about these issues early builds lifelong habits. Secondly, young people have energy and creativity, so we can come up with new ideas to solve environmental problems. Lastly, if we don't learn and take action now, the damage to the Earth might become too serious to fix.","E":"In a school project, my group designed posters to encourage recycling. We realised that even simple actions like putting up reminders can influence people to act more responsibly. That experience made me think about how much more we could do with bigger projects in the future.","A":"This shows that young people can play a big role in changing attitudes and protecting the Earth.","K":"To summarise, it is essential for young people to learn about recycling because we are the generation that will inherit and care for the planet."}],"audio":{"basic":"audio/env-1-basic.mp3","adv":"audio/env-1-adv.mp3"}},{"n":2,"img":"img/env-2.jpg","see":"I see a family of three standing at a hawker stall. They are holding reusable items such as containers, a glass jar, and shopping bags. The stall has cooked food displayed behind a glass panel, with stacks of plates ready for use. The hawker centre looks busy, with other customers seated at tables in the background.","think":["Object: Reusable containers and bags - This shows the family is practising eco-friendly habits by avoiding disposable plastic bags and boxes.","Setting: Hawker centre - It suggests that sustainability is not just for home but can be part of daily routines like buying meals.","Action: Bringing their own containers - This reflects responsibility, awareness of environmental issues, and setting a positive example for others.","Protecting the environment through small daily actions","Responsibility and sustainability","Leading by example and good habits"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the times my parents brought our own containers\n when buying food from the hawker centre. We did this especially when buying curry or soup, so it wouldn't spill."},{"prompt":"If I were in this picture, I would...","answer":"if I were in this picture, I would help carry the bags and containers to show my support. I would also encourage my friends to do the same when they buy food."},{"prompt":"I feel this is important because...","answer":"&: I feel this is important because small actions like this reduce waste. If everyone did their part, there would be less plastic pollution, and our environment would be cleaner and healthier."}],"questions":["Why do you think the family in the picture brings their own containers when buying food?","Can you share about a time you or your family did something to reduce waste?","Why do you think it is important for everyone to practise sustainability in daily life?"],"basic":[{"S":"I think the family in the picture brings their own containers when buying food because it reduces single-use packaging and keeps the food secure on the way home.","P":"Using our own containers helps us cut down on plastic waste, save a little money when stalls charge for takeaway boxes, and prevent spills. It is also more hygienic since we wash the containers ourselves and know they are clean.","E":"For my family, we bring a metal tiffin carrier or a clean lunch box when we buy noodles from the hawker centre. Some stallholders even give a small smile or a few extra vegetables because they appreciate the effort.","A":"These habits make us more responsible shoppers and show respect for the environment and the stall owners' guidelines.","K":"So, I think the family sets a good example for others by simply bringing their own containers when buying food."},{"S":"One time, my school organised a recycling day, and my family and I took part by sorting out recyclables we have at home.","P":"We collected old newspapers, plastic bottles, and aluminium cans. Instead of throwing them away, we packed them and brought them to school for the recycling drive.","E":"I remember feeling quite proud because my bag was heavy with bottles, and I knew they would be reused instead of polluting the environment. My teacher praised us for doing our part.","A":"That day made me realise that even small efforts at home can add up to something meaningful.","K":"So, I think everyone can find simple ways to reduce waste, whether at home or in school."},{"S":"It is important for everyone to practise sustainability because the environment is shared by all of us.","P":"If only a few people make the effort, the difference will be very small. But if everyone does it together, we can collectively reduce pollution, save resources, and protect nature for future generations.","E":"For example, when Singapore introduced the \"no free plastic bags\" rule at supermarkets, I noticed many families bringing their own shopping bags. At first it seemed difficult, but now it feels normal and better for the environment.","A":"This shows that when more people join in, good habits can spread quickly.","K":"That is why sustainability should be part of our daily lives, not just something we do once in a while."}],"advanced":[{"S":"I think the family in the picture brings their own containers when buying food as it is an environmentally responsible choice that benefits them and the community.","P":"Bringing our own containers helps us cut down on waste, and it also makes eating at home easier. We don't have to worry about flimsy plastic boxes leaking or breaking. On top of that, it shows hawkers and other people that we care about the environment, which may encourage them to adopt more environmentally friendly habits too.","E":"For instance, when we buy noodle soup, my mum always insists on using our containers. The soup stays warm and doesn't spill. I noticed that once, another customer saw us and said they should try it too. That made me feel proud because our actions influenced someone else. This made me realise that even small choices can create a bigger impact when others see and follow.","K":"Instead of relying on plastic containers or styrofoam boxes that take years to decompose, we can all follow the footsteps of the family in the picture and bring our own containers."},{"S":"Yes, there was a time when we made a family effort to reduce waste at home, and it was very meaningful for me.","P":"We started a small recycling corner in the kitchen with separate bins for paper, plastic, and cans. Each of us had a role — I rinsed the bottles, my brother flattened the cartons, and my parents tied up the newspapers. It became part of our weekly routine.","E":"One week, when we brought the recyclables to the recycling bin downstairs, it was almost full. That showed me many families were also making an effort, and I felt proud that we were contributing too. It also taught me discipline, because we had to remember to sort everything correctly.","A":"This experience showed me that reducing waste doesn't need big changes. Simple habits, if done consistently, can make a big difference.","K":"That is why I think families should find ways to reduce waste together, because teamwork makes it easier and more meaningful."},{"S":"I think it is important because sustainability is not just about protecting the environment today, but also about ensuring that future generations have a safe and healthy place to live.","P":"Firstly, practising sustainability reduces the amount of waste and pollution we create, which keeps our surroundings clean. Secondly, it helps conserve resources like water, paper, and energy, which are not unlimited. Lastly, it builds good habits of responsibility and care, which can spread to other areas of our lives.","E":"For example, my school once invited a speaker from NEA to talk about recycling. She shared that Singapore has only one landfill, Semakau, and it might run out of space one day. That fact shocked me, and it made me understand why everyone's efforts matter, even the small ones.","A":"That talk opened my eyes to how urgent the problem is, and it made me determined to do my part every day.","K":"So, I believe practising sustainability in daily life is not optional. It is something we all must do if we care about the future."}],"audio":{"basic":"audio/env-2-basic.mp3","adv":"audio/env-2-adv.mp3"}},{"n":3,"img":"img/env-3.jpg","see":"! see a group of students working in a school garden. They are wearing uniforms and masks, and each student seems to be doing different tasks like watering plants, digging soil, or trimming leaves. The garden beds are neat and organised, filled with small plants and seedlings. In the background, more students are busy tending to other plots.","think":["Object: Gardening tools and watering cans - These suggest that the students are learning how to care for plants and practising gardening skills.","Setting: School garden — This shows that the activity is part of school life, where students are encouraged to learn outside the classroom.","Action: Students working together in the garden - This suggests teamwork, responsibility, and hands-on learning. It may also show that the school values environmental education and wants students to connect with nature.","Caring for the environment","Responsibility and teamwork","Hands-on learning experiences","Building sustainable habits"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of when my class grew bean plants in small pots as\n part of a science lesson. We had to water them every day and record their growth in a journal."},{"prompt":"If I were in this picture, I would...","answer":"if I were in this picture, I would enjoy watering the plants and making sure they grow healthy. I think it would be fun to see the results of our hard work over time."},{"prompt":"I feel this is important because...","answer":"I think this is important because gardening teaches us patience and responsibility, and it also helps us appreciate how food is grown."}],"questions":["Would you enjoy being part of a gardening project like the one in the picture? Why or why not?","Have you ever taken care of a plant or pet before? What was it like?","Do you think schools should include activities like gardening as part of lessons? Why?"],"basic":[{"S":"Yes, I would enjoy being part of a gardening project like this.","P":"It would give me a chance to learn more about plants and how they grow. I also think it would be a relaxing and fun activity outside the classroom.","E":"Once, I helped my grandmother water her plants at home. I enjoyed seeing how the flowers bloomed after a few weeks. It gave me a sense of achievement.","A":"That experience showed me that caring for plants can be enjoyable and rewarding.","K":"So yes, I would like to take part in such a project because it is both fun and educational."},{"S":"Yes, I have taken care of plants before.","P":"It required patience and responsibility because I had to water them regularly and make sure they got enough sunlight.","E":"For example, during a science experiment, I planted green beans in cotton wool. I watered them daily and observed the sprouts growing taller each day. It was exciting to watch them change.","A":"That experience helped me understand how much effort goes into looking after living things.","K":"So, I think taking care of plants is a meaningful experience that teaches us good habits."},{"S":"Yes, I think schools should include gardening as part of lessons.","P":"It helps students learn about science in a hands-on way. It also teaches values like patience, responsibility, and teamwork. When my school organised a gardening activity, I realised how much effort farmers put into growing food. It also gave me a break from classroom learning, which made the lesson more enjoyable.","A":"That made me realise gardening is not only educational but also helps us appreciate nature more.","K":"So, I strongly feel schools should encourage students to do gardening as part of their learning."}],"advanced":[{"P":"Firstly, it would give me the chance to connect with nature and understand how plants grow. Secondly, it is a meaningful activity because it teaches us responsibility when we take care of something. Lastly, it would also be a fun way to work together with classmates on something outside the usual schoolwork.","E":"For example, when I joined a gardening project at my community centre, we planted herbs like basil and mint. It was very satisfying to see them grow, and later we even used some in cooking.","A":"That experience taught me that gardening is not just about plants but also about learning life values and skills.","K":"Therefore, I would enjoy being part of a gardening project as it is meaningful, practical, and enjoyable."},{"S":"Yes, I have looked after both plants and pets before, and it was a very valuable experience.","P":"Taking care of them taught me that living things need attention and consistency. It also gave me the chance to feel responsible for something other than myself.","E":"For example, when I had a pet fish, I had to clean its tank and feed it every day. At the same time, I was growing a cactus on my desk, which only needed water once a week. Both experiences showed me how different living things have different needs.","A":"That made me more responsible and aware of the effort it takes to look after something properly.","K":"So, I believe caring for plants or pets is a meaningful way to learn responsibility and patience."},{"S":"Yes, I strongly believe schools should include gardening as part of their lessons.","P":"It helps students learn science concepts in a practical way, such as photosynthesis and the plant life cycle. It also gives us a break from textbooks and helps us learn outdoors. Moreover, it builds important values like teamwork, care for the environment, and discipline.","E":"When my school organised gardening sessions, my classmates and I had to share tools and help each other with tasks. At first, it was messy and tiring, but by the end, we were proud to see the plants growing well. It was a different kind of learning that made the science topics clearer.","A":"That showed me gardening can teach both knowledge and values at the same time, which makes it a very useful activity.","K":"To summarise, gardening should definitely be part of school lessons because it benefits students in many ways, both academically and personally."}],"audio":{"basic":"audio/env-3-basic.mp3","adv":"audio/env-3-adv.mp3"}},{"n":4,"img":"img/env-4.jpg","see":"I see a school poster encouraging students to save electricity and water. On the left, a girl is shown switching off a light. On the right, a boy is turning off a tap while holding a watering can. The poster has big bold words like \"Be an Eco-Hero!\" and \"Small Actions, Big Impact. Greening Our School.\" It also uses pictures of a light bulb, a water droplet, and a recycling symbol.","think":["Setting: School environment - It suggests many people share the same space, so small actions can add up to a big difference.","Saving energy and water","Environmental responsibility","Small actions making a big difference","Building good habits in school and at home"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the eco-campaign my school organised, where we had Green Monitors to check if lights and fans were switched off after lessons."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would remind my friends not to waste water when washing their hands and help to turn off unused switches in class."},{"prompt":"I feel this is important because...","answer":"&. I feel it's important because saving resources protects the environment and reduces waste. It also teaches us discipline and responsibility."}],"questions":["Do you try to save electricity or water at home, like the students in this poster?","Can you share about a time you or your family did something to care for the environment?","Why do you think schools encourage students to be eco- friendly?"],"basic":[{"S":"Yes, I try to save electricity and water at home.","P":"I know that electricity and water are precious resources, and wasting them harms the environment. Saving them also helps my family reduce bills.","E":"For example, I always switch off the lights and fan when I leave my room. When brushing my teeth, I turn off the tap so that water isn't wasted.","A":"These small actions may seem minor, but they add up to make a big difference.","K":"So yes, I try to be like the students in the poster by building eco-friendly habits."},{"S":"Yes, my family tries to care for the environment whenever we can.","P":"We believe it's important to play our part in reducing waste and protecting nature.","E":"For example, my parents bring reusable bags and containers when buying food at the hawker centre. On weekends, we also separate recyclables like plastic and paper into the right bins.","A":"These practices show me that taking care of the Earth is something everyone can do, not just large organisations.","K":"That's why I think it's meaningful to practise eco-friendly habits together as a family."},{"S":"Schools encourage students to be eco-friendly so that we build good habits from young.","P":"When students learn to save electricity, water, and recycle in school, these values become part of their daily life. Later, they can apply these habits at home and even as adults.","E":"In my school, we had an Earth Week event where classes competed to see which one could recycle the most. It was fun, but also taught us the importance of working together to protect the environment.","A":"By teaching us early, schools prepare us to be responsible citizens who care for the Earth.","K":"That's why schools focus on eco-friendly activities, because education is the first step to change."}],"advanced":[{"S":"Yes, I make a conscious effort to save electricity and water at home because I know that conserving resources is crucial for the planet's future.","P":"Firstly, saving electricity reduces the need for burning fossil fuels, which lowers pollution and greenhouse gases. Secondly, saving water ensures that we don't waste this essential resource, especially since clean water is not unlimited. Lastly, these actions also set a good example for younger children in my family. For instance, I often remind my younger brother to switch off the fan when he leaves the room. My family also collects water from washing vegetables and uses it to water our plants. Over time, these small actions have become second nature to us.","A":"Through these habits, I've realised that even ordinary people like us can play a part in protecting the environment.","K":"Therefore, I strongly believe in practising what the poster shows, because every drop of water and every unit of electricity saved matters."},{"S":"Yes, my family has taken part in different activities to help care for the environment.","P":"We believe that protecting nature is not just about individual habits but also about contributing to the wider community. That's why we sometimes join events or make small lifestyle changes together.","E":"Once, we joined a neighbourhood beach clean-up activity. We picked up plastic bottles, straws, and food wrappers that were harming the shore. At first, it seemed like a small effort, but when I saw the many bags of rubbish collected, I realised how powerful teamwork can be. We also agreed to reduce single-use plastics at home by carrying our own water bottles and food containers.","A":"That experience taught me that when families and communities work together, the impact is much greater.","K":"So, I think caring for the environment is about teamwork, both in our homes and in our communities."},{"S":"I think schools encourage eco-friendly behaviour because education shapes habits, and habits shape the future.","P":"When students learn to conserve resources from a young age, it becomes a natural part of their lifestyle. Over time, this builds a society that is more conscious of the environment. Schools are the best place to instill these values because students spend a large part of their day there and can practise these habits daily.","E":"For example, my school has a \"No Plastic Day\" every Friday, where students are encouraged to bring lunchboxes and reusable bottles. At first, it was difficult, but after some time, it became normal and we didn't even think twice about it. I feel proud that my school is trying to create positive change.","A":"By teaching students now, schools are helping to shape future generations who will continue protecting the Earth.","K":"In summary, schools encourage eco-friendly habits not just for today, but to prepare students to become responsible adults who care for the planet."}],"audio":{"basic":"audio/env-4-basic.mp3","adv":"audio/env-4-adv.mp3"}},{"n":5,"img":"img/env-5.jpg","see":"I see a group of students cleaning up a beach. They are wearing T-shirts and shorts, and many of them are carrying large black trash bags. Some students are picking up rubbish from the sand while others are already holding bags filled with litter. One girl in the foreground is showing what she has collected. The background shows the sea, trees, and more students working together.","think":["Object: Trash bags and gloves - This shows that this is an organised clean-up activity, and safety is being observed.","Setting: Beach - It suggests the clean-up is to protect the natural environment and keep public spaces clean.","Action: Students are working together - This reflects teamwork, responsibility, and care for the environment.","Caring for nature and keeping public spaces clean","Teamwork and shared responsibility","Taking action to protect the environment","Pride and joy in contributing to the community"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of when my class took part in a park clean-up. We worked in groups, collected litter, and felt proud after seeing how clean the place became."},{"prompt":"If I were in this picture, I would...","answer":"if I were in this picture, I would work hard to fill up my trash bag and also encourage my friends so that the clean-up would be fun and meaningful."},{"prompt":"I feel this is important because...","answer":"I feel this is important because keeping places clean protects wildlife, prevents pollution, and makes outdoor spaces more enjoyable for everyone."}],"questions":["Do you think the students in the picture are participating in a meaningful activity? Why or why not?","Can you share about a time you worked together with your classmates or friends on something meaningful?","Why is it important for people to help care for the environment?"],"basic":[{"S":"Yes, I think the students are participating in a meaningful activity.","P":"It helps protect the environment and ensures the beach is safe for everyone to enjoy. At the same time, it can also be fun to work with friends outdoors, away from the classroom.","E":"I remember once joining my school for a park clean-up. At first, I thought it would be tiring, but after working with my friends, it turned into an enjoyable experience. We laughed, shared stories, and felt proud after seeing how much cleaner the park became.","A":"This shows me that activities like clean-ups are not only about removing rubbish, but also about bonding and learning the value of cooperation.","K":"So yes, the students are doing something meaningful because it allows them to help the environment while having a good time with others."},{"S":"Yes, I have worked with my classmates on a meaningful project before.","P":"Working together taught me about teamwork, sharing responsibilities, and supporting one another to reach a goal.","E":"Once, my class prepared a performance for Teachers' Day. Some of us practised singing, while others worked on decorations. I helped design posters and also practised with the group. When we finally presented, our teachers were touched and happy.","A":"This experience taught me that when everyone pitches in, the result is much better for our group and the people around us.","K":"That is why I think teamwork is always meaningful, whether in school projects or in community activities."},{"S":"It is important for people to help care for the environment because our actions affect the world around us.","P":"When people litter or waste resources, it harms animals, plants, and even our own health. On the other hand, if everyone takes responsibility, the Earth will stay clean and safe for future generations.","E":"For example, my family always refuses plastic straws when we eat out. At first, it seemed like a small habit, but over time, I realised that it reduces waste and helps prevent plastic from ending up in our oceans.","A":"This shows that our everyday choices contribute to the bigger picture of reducing pollution.","K":"So, I believe everyone should care for the environment because protecting it means protecting ourselves too."}],"advanced":[{"P":"Firstly, beach clean-ups directly reduce pollution by removing harmful items like plastic bottles and bags that can hurt marine life. Secondly, taking part in such activities gives students a chance to practise responsibility and service to the community. Finally, it is also a great way to bond with classmates, as everyone works toward a common goal.","E":"Last year, I joined my school's environmental club in cleaning a nearby park. I was assigned to the team collecting plastic waste along the playground area, and we filled over twenty large bags with rubbish by the end of the day. We felt satisfied being able to restore the park as a clean, welcoming space for all to use.","A":"Through that experience, I realised that activities like this not only help the environment but also build values such as perseverance, teamwork, and pride in contributing to society.","K":"Therefore, I believe the students are taking part in a meaningful activity, because it allows them to protect nature while growing in character."},{"S":"Yes, I have had many opportunities to work with my classmates on meaningful tasks, and each one has taught me something new.","P":"Working together helps us learn cooperation, compromise, and respect for each other's strengths. It also teaches us that success does not come from one person but from everyone playing their part.","E":"One example was when my group had to prepare a skit for our school assembly. Some classmates were nervous about acting, while others were better at writing scripts. We divided our roles according to our abilities, and I helped coordinate rehearsals. Even though it was stressful at times, the final performance went smoothly and was well-received.","A":"That experience showed me the importance of encouragement and trust when working with others.","K":"So, being able to work with my classmates on something meaningful has prepared me to be a better team player who has respect for different strengths."},{"S":"Caring for the environment is crucial because our survival and quality of life depend on it.","P":"If we neglect the environment, pollution will increase, wildlife will suffer, and natural resources will be depleted. On the other hand, when people make eco-friendly choices, such as conserving energy, recycling, and avoiding littering, we create a healthier and safer world for everyone. These efforts also prepare us for bigger challenges like climate change.","E":"For example, I once read about how sea turtles mistake plastic bags for jellyfish and end up eating them, which causes injury or death. This made me realise how dangerous plastic waste can be. Since then, I have been more mindful about reducing single-use plastics and bringing tote bags when buying groceries.","A":"This shows me that our daily actions, even small ones, can either harm or protect the environment. The choice is ours to make.","K":"In conclusion, people must care for the environment because it is our shared home, and protecting it ensures a better future for all living things."}],"audio":{"basic":"audio/env-5-basic.mp3","adv":"audio/env-5-adv.mp3"}},{"n":6,"img":"img/env-6.jpg","see":"I see a young child and her grandmother in their home garden, tending to young plants in planter boxes with small gardening tools. They are dressed comfortably and appear focused, enjoying the time spent together. In the background, more planter boxes and potted plants can be seen, with their house in the distance.","think":["Setting: Backyard - This indicates that a family activity is taking place, as gardening can help grow simple crops for family meals.","Action: Grandmother showing grandchild how to plant a seedling - This highlights gardening as a family bonding activity that everyone, regardless of age, can take part in.","Caring for the environment","Family bonding","Teamwork in learning","Urban greenery and sustainability"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of the time my neighbour grew chilli plants outside\n her flat. She showed me how she watered them every day and even used recycled bottles as pots. I found it very inspiring."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would help loosen the soil and make sure the plants got enough water. I would also enjoy learning the names of the different plants in the garden."},{"prompt":"I feel this is important because...","answer":"I think it is important because caring for plants teaches us patience and responsibility. It also makes our living spaces greener and more pleasant, even in a city."}],"questions":["How do you think the people in the photograph are feeling, and why do you think so?","If you could grow any plant at home, what would it be? Why?","Why do you think it is important for families to grow plants at home?"],"basic":[{"S":"I believe the grandmother and her granddaughter are having a wonderful time gardening together in their backyard.","P":"In the photograph, they are busy planting mint in a large planter box. Both of them have wide smiles on their faces, which shows they are enjoying the fresh air and each other's company. This hands-on activity seems to be a very meaningful bonding session for them.","E":"This reminds me of my own mother, who grows herbs like mint, chilli padi, and spring onions in small pots on our balcony. She loves using these fresh ingredients in her cooking and often jokes about how much money we save. I usually help her by watering the plants, and I always enjoy our chats during that time.","A":"Just like my experience with my mother, the people in the photo seem to be connecting and having fun through this shared hobby.","K":"All in all, I think gardening is an excellent way for family members to spend quality time together while learning about nature."},{"S":"If I could grow any plant at home, I would definitely choose to grow Thai basil.","P":"I have learnt that this herb grows well in a tropical climate like Singapore's, so it would be very easy to maintain. Also, I am a big fan of Thai cuisine, and having a fresh supply of basil would allow my mother to cook my favorite dishes more often.","E":"My family enjoys visiting Thai restaurants every few weeks, and my favorite dish is always the stir-fried basil chicken because it is so fragrant and savory. My mother often mentions that restaurant prices are high and she could easily cook it at home if she had the ingredients. Since she is already busy tending to her other plants, I would like to grow the basil myself so I can contribute to our family meals.","A":"Because Thai basil is simple to grow and very useful in the kitchen, I believe it is the ideal herb for our home garden.","K":"Overall, I think it would be very rewarding to harvest my own food."},{"S":"I think it is important for families to grow plants at home because it brings many benefits. Plants improve air quality, make the home look nicer, and also give family members a shared activity. It can also help children learn patience and care.","E":"My family grows aloe vera in a pot, and my mother once used it when my brother had a small burn. She carefully cut a fresh leaf, washed it, and gently sliced it open to extract the clear gel inside. She told us that it helps to soothe burns and speed up healing.","A":"Watching this process showed me that plants can be useful and practical in our daily lives.","K":"So, families should grow plants because they bring practical, emotional, and environmental benefits."}],"advanced":[{"S":"I believe the grandmother and her granddaughter are having an incredibly delightful time collaborating on their garden project in their backyard.","P":"In the photograph, they are actively engaged in planting mint in a large planter box. Both of them are beaming with joy, which clearly indicates that they are enjoying the fresh air and each other's company. This hands-on activity serves as a valuable opportunity for intergenerational bonding.","E":"This scene bears a striking resemblance to my own mother, who cultivates a variety of herbs like mint, chilli padi, and spring onions in small pots on our balcony. She loves incorporating these fresh ingredients into her cooking and often remarks on how much money we save. I usually assist her with the gardening chores, and I always treasure our lighthearted conversations during those moments. Similar to my personal experience, the individuals in the photo seem to be fostering a deeper connection through their shared interest in nature.","K":"Overall, I feel that gardening is a fantastic avenue for family members to spend quality time together while learning to appreciate the environment."},{"S":"If I were given the chance to grow any plant at home, I would undoubtedly choose to grow a cactus.","P":"I have always been intrigued by cacti because they are remarkably resilient and low-maintenance. Unlike other delicate plants that require constant attention, cacti are hardy enough to thrive even in Singapore's intense heat. Since I have a very busy school schedule, having a plant that does not require daily watering would be highly convenient.","E":"I remember visiting a plant nursery at Bedok last year and being fascinated by the wide variety of cacti on display, from tiny succulents to tall, prickly ones. My best friend keeps a small collection of cacti on her windowsill, and she shared that they only need to be watered once every few weeks. This appeals to me because I sometimes become preoccupied with my schoolwork and might forget to tend to a more demanding plant.","A":"Because of their durable nature and unique, aesthetic appearance, I believe a cactus would be the most suitable companion for my study desk.","K":"On the whole, I think cultivating a cactus would be an immensely fulfilling experience, as it serves as a great reminder of strength and perseverance."},{"S":"It is very important for families to grow plants at home because it benefits health, relationships, and the environment.","P":"Plants make homes more refreshing and relaxing, which helps reduce stress. Families who care for plants together also bond through shared routines. On top of that, growing plants at home teaches everyone to appreciate nature and reduce waste by turning food scraps into compost and reusing old containers as pots, which is important for sustainability.","E":"For example, one of my neighbours has filled her corridor with colourful flowers and useful herbs like basil and pandan. Not only does it make the corridor look beautiful, but her family also spends time watering and pruning the plants together. She once shared some pandan leaves with us for cooking, which created a warm sense of community.","A":"That made me realise that plants bring practical uses, strengthen relationships, and even build neighbourly ties.","K":"To summarise, families should grow plants at home because it brings joy, teaches responsibility, and helps everyone feel closer to both nature and one another."}],"audio":{"basic":"audio/env-6-basic.mp3","adv":"audio/env-6-adv.mp3"}},{"n":7,"img":"img/env-7.jpg","see":"I see a messy table at a hawker centre. The table is covered with unfinished food, bowls, cups, and used tissues. On the ground, there is spilled food, rubbish, and pigeons pecking at the leftovers. In the background, other diners are still eating their meals.","think":["Setting: Hawker centre - The scene shows that the mess is in a public eating place, which should be clean and welcoming for everyone.","Action: People leaving food and trash behind - This shows inconsiderate behaviour and poor hygiene habits. It also suggests that not everyone takes responsibility for keeping shared spaces clean.","Public responsibility and civic-mindedness","Hygiene and cleanliness in shared spaces","Respect for others in the community","The importance of good habits in daily life"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of times when I saw uncles and aunties clearing their\n trays at food courts. I realised how simple actions like this keep the place tidy for the next person."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would clear my tray and rubbish so that others could enjoy a clean table, and pests would not gather."},{"prompt":"I feel this is important because...","answer":"I feel this is important because leaving rubbish behind is unhygienic, unpleasant for others, and makes cleaners' jobs harder. Everyone has a part to play in keeping shared places clean."}],"questions":["Do you think the diners in this picture should have cleared their trays? Why or why not?","Have you ever been in a situation where you helped to keep a public place clean?","Why is it important for people to be responsible in shared spaces like hawker centres?"],"basic":[{"S":"Yes, I think the diners should have cleared their trays before leaving.","P":"If they had done so, the table would be clean for the next group of diners. Leaving food and rubbish behind makes the hawker centre unpleasant and unhygienic.","E":"I remember when my family ate at a food court, we cleared our trays and returned them. The cleaner smiled at us and thanked us, which made me feel good.","A":"That showed me that such a small action can make a big difference for others.","K":"So yes, I strongly believe diners should clear their trays to show consideration for others."},{"S":"Yes, I have helped to keep a public place clean before.","P":"Once, my friends and I noticed litter around the bus stop near our school. We picked up some empty cans and wrappers. Another time, I reminded my best friend not to leave his unfinished snack on the bench.","E":"I remember feeling proud when the other commuters thanked us for keeping the area tidy. It also made me notice how much cleaner the bus stop looked after everyone did their part.","A":"That experience made me realise that keeping public places clean is everyone's responsibility.","K":"So, I think we should all do our part in making shared spaces pleasant for everyone."},{"S":"It is important for people to be responsible in shared spaces because these places are used by many people every day.","P":"If everyone clears their trays and rubbish, the hawker centre will stay clean, safe, and welcoming. If no one does it, pests like pigeons and cockroaches may spread diseases.","E":"I once saw a messy table at a hawker centre, and the next family had to wait for a long time before sitting down. It made me realise how our actions affect others directly.","A":"That showed me that being responsible is not just about ourselves but also about showing respect to the community.","K":"So, being responsible in shared spaces allows everyone to enjoy them better."}],"advanced":[{"S":"Yes, the diners definitely should have cleared their trays before leaving.","P":"Firstly, clearing trays keeps the hawker centre clean and pleasant for others. Secondly, it reduces the workload of cleaners, who should focus on sanitising tables instead of picking up leftover rubbish. Lastly, not clearing trays attracts pests such as pigeons, cockroaches, and even rats, which can spread diseases and harm public health.","E":"Once, I saw a cleaner struggling to clear a mountain of trays during peak hour. Some customers even complained about dirty tables, even though it was the diners' fault. After that, I made sure my family always cleared our trays.","A":"That experience showed me how unfair it is to leave all the work to cleaners, when everyone can clean up after themselves.","K":"Therefore, I believe diners must clear their trays to maintain hygiene, support cleaners, and show respect to others."},{"S":"Yes, I have, and those experiences taught me why civic-mindedness is so important.","P":"I play badminton regularly at the court in my neighborhood, and I've noticed that people often leave behind drink cans, sweet wrappers, and even broken shuttlecocks.","E":"Before my friends and I start our games, I make it a habit to collect this litter and throw it in the nearby bin. At first, my friends thought I was being too fussy, but now some of them help too. Keeping the court clean means we have a better playing surface, and younger kids who use the court after us don't have to deal with the mess.","A":"That taught me that we shouldn't always rely on neighborhood cleaners or the town council to keep public spaces clean. We can take responsibility, whether it's picking up litter or simply not creating mess in the first place.","K":"Therefore, I believe helping to keep public places clean is necessary and I will continue to do my part."},{"S":"It is very important for people to act responsibly in shared spaces because it shows respect, maintains hygiene, and builds a stronger community.","P":"Firstly, shared spaces like hawker centres are used daily by thousands of people, so one person's bad habit can affect many others. Secondly, keeping such places clean prevents health problems, as pests thrive in dirty environments. Lastly, when people act responsibly, it sets a positive example, encouraging others to do the same.","E":"I once saw a child reminding her parents to clear their trays. The parents listened, and others nearby also started clearing theirs. That single moment showed how responsibility can spread from one person to many.","A":"It made me realise that responsibility in public places is about building habits and influencing others.","K":"In conclusion, being responsible in shared spaces helps protect health, improves cleanliness, and creates a caring community."}],"audio":{"basic":"audio/env-7-basic.mp3","adv":"audio/env-7-adv.mp3"}},{"n":8,"img":"img/env-8.jpg","see":"I see many students seated in the school hall, all facing the stage. On stage, a group of students is giving a presentation with a slide that says \"CLIMATE CHANGE — OUR FUTURE\". The slide shows a picture of the Earth and a tree, likely to explain environmental issues. The students in the audience look focused and attentive.","think":["Object: Slide with a picture of the Earth and tree - This suggests that the topic is about climate change and protecting the environment.","Setting: School assembly hall — This shows that the school is making sure all students learn about climate change together in one session.","Action: Students presenting while others listen - This shows student leadership and teamwork in spreading awareness about climate education. It also shows the importance of learning as a community.","Environmental awareness and action","Student leadership in education","School-wide responsibility for the future","The power of learning and sharing knowledge"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"&. This reminds me of when my school had an assembly on recycling. The presenters showed how sorting items properly could reduce waste, and I learnt new tips that I could use at home.\n If were in this picture, I would... If I were in this picture, I would pay close attention so that I could share what I learnt with my family and friends."},{"prompt":"I feel this is important because...","answer":"I feel this is important because climate change is a global issue, and every small action we learn about can help protect the Earth."}],"questions":["Would you have enjoyed attending this climate change assembly? Why or why not?","Have you ever joined a school activity that taught you more about the environment?","Why do you think schools should teach students about climate change?"],"basic":[{"S":"Yes, I think I would have enjoyed attending this assembly.","P":"It looks interesting because the students are giving a presentation about climate change, and I would like to learn more about how to protect the Earth. Assemblies like this are also a change from regular classroom lessons, so they feel more engaging. E — Example from Experience: Once, I attended an assembly where we watched a video about plastic pollution. It opened my eyes to how much waste we produce, and I learnt things that I didn't know before.","A":"That made me realise that assemblies can be a fun way to learn new and important things.","K":"So yes, I would have enjoyed this assembly because I think it would have taught me useful lessons about the environment."},{"S":"Yes, I have joined a few activities that taught me more about the environment.","P":"In one activity, we planted vegetables in the school garden and took care of them every week. It showed me how plants play a role in cleaning the air and providing food. Another time, I joined an upcycling project where we made art from recycled materials.","E":"I remember feeling proud when our recycled art was displayed around the school. It taught me that we can put our creativity to good use.","A":"That made me appreciate how school activities can make learning about the environment more engaging and hands-on.","K":"Therefore, I think school activities are a good way to learn and practise protecting the Earth."},{"S":"Schools should teach students about climate change because it prepares us to take care of our future.","P":"By learning about climate change, we can understand the causes, such as pollution, and also learn solutions, such as recycling and saving energy. Schools also reach many students, so the message spreads faster and to more families.","E":"After my teacher explained how car fumes affect the air, I started walking or cycling short distances instead of asking for a car ride. That change made me feel more responsible.","A":"That showed me that lessons in school can influence our daily habits.","K":"So, schools should definitely teach about climate change because it helps us form habits that protect the Earth."}],"advanced":[{"S":"Yes, I would have enjoyed attending this assembly because I like learning in ways that are interactive and inspiring.","P":"Firstly, assemblies like this are different from normal lessons, and they give us the chance to learn together as a whole school. Secondly, climate change is a serious issue, and I think hearing about it from fellow students would make it more relatable and easier to understand. Lastly, I would enjoy it because assemblies often include visuals like videos or slides, which make the topic clearer and more engaging.","E":"For example, during a past assembly on saving water, I remember watching a video that showed how much water is wasted when we leave taps running. After that, I became more conscious about turning off taps quickly. That experience taught me that assemblies can leave a strong impression and inspire real changes in behaviour.","K":"So yes, I would have enjoyed this climate change assembly because it would not only be educational but also motivating to take action in my own life."},{"S":"Yes, I've joined several school activities that gave me a deeper understanding of environmental issues.","P":"One activity was an upcycling art project, where we created artworks using recycled materials. That showed me how creativity can turn waste into something useful and beautiful. Another activity was a composting program, where we learnt to turn food scraps into fertilizer for the school garden. These activities made me realise that protecting the Earth doesn't just happen in big projects—it starts with daily choices.","E":"During the composting program, I was surprised at how much food waste we could transform into rich soil, which made me more mindful about not throwing away leftovers.","A":"That experience showed me that hands-on activities are powerful because they connect what we learn to the real world.","K":"Therefore, I think joining these activities are important because they make students aware of their role in protecting the environment."},{"P":"Firstly, climate change is one of the biggest challenges in the world today, and students must understand it early. Secondly, schools have the power to influence large groups of young people, who can then influence their families. Lastly, teaching about climate change also helps us form habits, like saving energy or recycling, that will stay with us for life.","E":"For instance, after my school introduced a recycling drive, many students— including me—began bringing recyclables from home. My parents also joined in, and it showed me how schools can create positive ripple effects in the community.","A":"That experience convinced me that schools are one of the best places to start climate education.","K":"In summary, schools should teach about climate change because it prepares us to face the future and take responsibility for protecting the planet."}],"audio":{"basic":"audio/env-8-basic.mp3","adv":"audio/env-8-adv.mp3"}},{"n":9,"img":"img/env-9.jpg","see":"I see a group of students sitting at a table in a classroom. They are working with scissors, glue, and coloured paper to make crafts out of recycled materials like cardboard tubes, bottles, and old magazines. The students look happy and focused on their work. Some of the crafts look like pencil holders and decorative items.","think":["Object: Recycled materials - These items suggest the students are reusing old materials to create something useful or artistic.","Setting: Classroom - This shows that schools encourage creativity while also teaching students about caring for the environment.","Environmental awareness and sustainability","Creativity and innovation","Teamwork and responsibility","Learning values through hands-on activities"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of when my school organised an art project where we used bottle caps and straws to create a large mural. It was fun to see how waste could be turned into something beautiful."},{"prompt":"If I were in this picture, I would...","answer":"if I were in this picture, I would probably make a pencil holder or a small box using recycled materials. I would decorate it nicely so I could use it on my study desk."},{"prompt":"I feel this is important because...","answer":"I think this is important because it teaches us to reduce waste and to be creative in solving problems. It also helps us protect the Earth by giving old items a second life."}],"questions":["Would you enjoy making crafts from recycled materials like the students in the picture? Why or why not?","Have you ever reused materials at home or in school to make something useful or fun?","Do you think it is important for students to learn about reusing and recycling?"],"basic":[{"S":"Yes, I think I would really enjoy making crafts from recycled materials.","P":"It seems fun because I could use my imagination while also helping the environment. Instead of throwing things away, I could turn them into something creative.","E":"Once, I made a piggy bank out of a milk carton. I cut a hole in the top, painted it, and decorated it with stickers. It was simple but very useful.","A":"That experience showed me how enjoyable it can be to make things with my own hands.","K":"That's why I think I would enjoy joining an activity like the one in the picture."},{"S":"Yes, I have reused materials before, both at home and in school.","P":"It was meaningful because I learnt that we don't always need to buy new things. Sometimes, old items can be just as useful when reused.","E":"For example, during Art class, I reused old cereal boxes to make a file holder for my worksheets. I also once turned plastic bottles into mini plant pots for my balcony.","A":"Doing those projects helped me realise how much waste we could save if we reused items.","K":"So yes, reusing materials has been fun and practical for me."},{"S":"I think it is very important for children to learn about reusing and recycling.","P":"It teaches us to care for the Earth by reducing waste and saving resources. It also shows us how to think creatively about solving problems.","E":"For example, I used to buy a new plastic bottle every day at the canteen until my teacher showed us how much plastic waste our class created in just one week. After that, I started bringing a reusable bottle, and many of my classmates did the same.","A":"That experience taught me that we naturally want to make better choices once we learn about negative impacts.","K":"That's why I believe recycling lessons are important for all students."}],"advanced":[{"S":"Yes, I would definitely enjoy making crafts from recycled materials because it combines creativity with caring for the environment.","P":"Firstly, it gives me the chance to be resourceful, as I can take something old and turn it into something useful. Secondly, it is good for the planet since it reduces waste. Lastly, it also feels rewarding to know that I created something with my own effort.","E":"For instance, during a school project, my group and I made lanterns out of tin cans and tissue paper. We painted them in bright colours, and they looked beautiful when lit with LED candles. I felt very proud of what we made together.","A":"That project showed me how enjoyable and meaningful upcycling can be.","K":"Therefore, I would truly enjoy an activity like the one shown in the picture."},{"S":"Yes, I have reused materials on a few occasions, and it was both fun and meaningful.","P":"At home, I once collected old jars and turned them into storage containers. I also reused cardboard to make a board game with my cousin. These activities showed me that reusing materials is not only practical but also enjoyable.","E":"My favourite example was when I made a toy car using plastic bottle caps for wheels and a small box as the body. I even raced it with my friend's car. It was exciting to see something I built from waste materials actually work.","A":"These experiences made me appreciate how creativity and recycling can go hand in hand.","K":"In summary, I believe reusing materials makes learning fun while also helping the Earth."},{"S":"I strongly believe it is very important for children to learn about reusing and recycling from a very young age.","P":"Firstly, it builds environmental awareness by teaching us to reduce waste and protect nature. Secondly, it encourages responsibility because we learn that our daily actions affect the world. Lastly, it nurtures creativity, as we have to think of new ways to use old things.","E":"For example, ever since I was young, my parents taught me about electronic recycling by collecting old batteries and light bulbs at home instead of throwing them away. When we had enough, they brought me along to an e-waste recycling point and explained how harmful chemicals in electronics can damage the environment if not disposed of properly. That moment showed me that without proper education, children might develop careless habits that harm the environment.","K":"To conclude, I believe parents and schools should continue to teach and encourage recycling habits, as they prepare children to become responsible adults."}],"audio":{"basic":"audio/env-9-basic.mp3","adv":"audio/env-9-adv.mp3"}},{"n":10,"img":"img/env-10.jpg","see":"I see a young man at an e-waste recycling kiosk in a mall or electronics store. He is holding an old laptop and appears ready to place it into the slot. The kiosk shows instructions, a QR code, and the words \"Recycle your e-waste & earn rewards.\" Around him are shelves of gadgets and bright ceiling lights.","think":["Object: E-waste kiosk and old laptop - This suggests responsible disposal of electronic items and the idea that valuable materials can be recovered instead of thrown away.","Setting: Mall or electronics retail area — This shows e-waste recycling are placed where people often buy new devices, making it convenient to drop off old ones.","Action: Putting old laptop in the e-waste bin - This shows commitment to environmental protection, even when it requires extra effort beyond regular waste disposal.","Environmental responsibility and sustainability","Safe disposal and resource recovery","Community participation and convenience in green habits"],"connect":[{"prompt":"Have I ever done or seen something similar?","answer":"This reminds me of my school's e-waste drive where students brought old phones, chargers, and cables to a collection bin. I learnt how these items are taken apart safely and recycled."},{"prompt":"If I were in this picture, I would...","answer":"If I were in this picture, I would clear out my drawer of old devices and recycle them properly at the kiosk. I would also scan the QR code to learn how the rewards work."},{"prompt":"I feel this is important because...","answer":"I feel this is important because e-waste can leak harmful substances if dumped, but proper recycling protects the environment and saves materials like copper and gold."}],"questions":["Would you use a machine like the one in the picture? Why or why not?","Can you share about a recycling habit you practise regularly?","Do you think it is important to recycle e-waste properly?"],"basic":[{"S":"Yes, I would definitely use a machine like the one in the picture.","P":"It makes recycling e-waste simple and safe. Instead of letting old gadgets take up space at home, I can send them for proper disposal. Knowing that these items will be handled correctly gives me peace of mind.","E":"When my family bought a new laptop, we left the old one unused in a drawer. If we had a machine like this nearby, we could have recycled it immediately. That would have freed up space and ensured the laptop didn't harm the environment.","A":"That experience showed me that convenient machines like this encourage more people to recycle.","K":"So yes, I would use it because it makes being environmentally responsible easy. @a"},{"S":"Yes, I have a recycling habit that I practise regularly.","P":"I make it a habit to separate recyclable items such as paper, plastic bottles, and cans from general waste. This helps reduce the amount of rubbish thrown away and ensures that recyclable materials are properly reused.","E":"For example, after finishing snacks, drinks and newspapers, I rinse the jars and bottles, and stack the papers neatly before placing them into the recycling bins at home. Over time, I noticed that our household general waste decreased because of this habit.","A":"That showed me that being consistent can have a bigger impact than one- time efforts.","K":"So yes, I will continue this habit because I want to save the environment"},{"S":"It is very important to recycle e-waste properly.","P":"Electronics have harmful chemicals that can pollute the soil and water if thrown away carelessly. Recycling also saves valuable resources like gold and copper inside gadgets. By reusing these materials, we reduce the need for mining.","E":"I once read an article that said millions of old phones are thrown away every year, even though they still contain useful parts. Recycling them not only protects nature but also prevents unnecessary waste.","A":"That showed me that recycling e-waste is about safety and resource conservation.","K":"Thus, I believe recycling e-waste is essential to protect the environment and future generations."}],"advanced":[{"S":"Yes, I would definitely use a machine like the one in the picture because it is practical, responsible, and rewarding.","P":"Firstly, it gives families a safe way to recycle electronics instead of storing them at home. Secondly, it ensures the devices are dismantled in proper facilities, so harmful substances do not pollute the soil or water. Lastly, some kiosks even give small rewards, which makes people more motivated to recycle.","E":"At home, we had a drawer full of unused chargers, earphones, and an old tablet. They sat there for years because we didn't know how to dispose of them properly. If we had such a kiosk, we could have recycled them quickly. That would have prevented clutter and also ensured the items were properly recycled.","A":"This made me realise that access and convenience are the key to getting more people to recycle.","K":"In summary, I would use the machine because it makes protecting the environment easier and more accessible for everyone."},{"S":"Yes, I have a recycling habit that I practise regularly.","P":"Every week, I separate recyclables like paper, plastic bottles, and aluminum cans from our household trash. I rinse the containers to keep them clean and place them in the designated recycling bin. This habit helps reduce the amount of waste our family sends to landfills.","E":"For example, I started this habit after participating in a school recycling competition where my class collected newspapers, bottles, and cans. Seeing the huge amount of recyclables we gathered made me realize how much waste families produce daily. After the competition ended, I decided to continue sorting recyclables at home, and now it has become second nature to me.","A":"That experience showed me that recycling is not just about one-time events or competitions, but about building long-term habits that make a real difference.","K":"So yes, I practise this recycling habit regularly because it keeps me aware of my environmental responsibility."},{"S":"It is extremely important to recycle e-waste properly because it protects health, saves resources, and helps the planet.","P":"Firstly, e-waste contains dangerous substances like mercury and lead, which can poison soil, water, and even people if not disposed of correctly. Secondly, gadgets contain valuable materials such as copper, gold, and silver that can be reused, reducing the need for destructive mining. Lastly, proper recycling supports global sustainability goals by cutting down pollution and conserving energy.","E":"I once watched a documentary that showed how some countries burn e- waste in open fields to collect metals. The workers inhaled toxic smoke, and rivers nearby were polluted. It shocked me, and I understood why certified recycling machines like the one in the picture are so important. At home, my family now separates e-waste instead of throwing it in the bin, and I remind them about proper disposal.","A":"That experience taught me that e-waste recycling is not only about managing rubbish, but about protecting people, animals, and the environment from long-term harm.","K":"Therefore, I strongly believe proper e-waste recycling must be practised by everyone, because it shapes a cleaner, safer, and more sustainable future."}],"audio":{"basic":"audio/env-10-basic.mp3","adv":"audio/env-10-adv.mp3"}}]}],"vocab":{"tech":["\"Tools are only as good as the person using them\"","\"Work smarter, not harder\"","Advancing rapidly","Balance between online and face-to-face lessons, as they complement each other","Be mindful of our surroundings","Being alert can make public spaces safer and more pleasant for everyone","Being responsible with digital devices shows maturity","Being too focused on a device can make me miss important things happening nearby","Better suited to my learning style","Block out noise","Block out the world around us","Bond over a common interest","Cannot completely replace human skills and emotions","Combining both online quizzes and in-class discussions gave me a more effective revision experience","connection issues","Considerate and responsible users of technology","Constant surveillance","Crowd around the small screen","Different devices can support different tasks","Digital devices help us stay connected","Disconnected","E-card","Easy tool","Enhances the learning experience","Enjoy sit relatives often because it helps us maintain close family ties","Joy of childhood","Keep traditions alive","Learn something unique that I cannot learn from school","Learning teamwork and perseverance","Lighthearted conversations","Maintaining a home is a shared effort","More than a duty","One of the most valuable ways to spend our free time","Patient guidance","Peer support","Precious chance to nurture relationships","Prepare us to be active citizens in the future","Recall fond memories","Resolve conflicts more easily","See new sides of each other","Share responsibilities","Shared happiness","Spirit of teamwork and togetherness","Stay close and connected","Step out of their comfort zone while feeling safe and supported","Strengthen family bond","Strengthens bonds across generations","Studying with friends is a double-edged sword","Teach the value of family","Time to pause, gather together, and appreciate one another","Touch people's hearts in profound ways","Treasure all the fun times I've had with friends","Understand our roots","Valuable knowledge and many years of experience","values and memories","With my family's support, I can overcome any difficulties","Worked together to achieve something as a family","Working with friends can make learning more enjoyable"],"env":["\"No free plastic bags\" rule","An activity that combines environmental care with community spirit","Civic-mindedness","Clean-up activity","connect with nature","Conserve resources","Creativity and recycling can go hand in hand","Dismantled in proper faci","E-waste recycling point","Eco-friendly habits","Education and action must go hand-in-hand","Education is the first step to change","Electricity and water are precious resources","Electronics have harmful chemicals that can pollute the soil and water if thrown away carelessly","Environmental awareness","Environmentally responsible choice","Every drop of water and every unit of electricity saved matters","Every little effort counts","Feel responsible for something other than myself","Future caretakers of the Earth","Gardening is not just about plants but also about learning life values and skills","Helps everyone feel closer to both nature and one another","Leaving food and rubbish behind makes the place unpleasant and unhygienic","Lifelong habits","Naturally want to make better choices once we learn about negative impacts","nvironment","One person's bad habit can affect many others","Our everyday choices contribute to the bigger picture of reducing pollution","Picked up plastic bottles, straws, and food wrappers that were harming the shore","Plants bring practical uses, strengthen relationships, and even build neighbourly ties","Positive ripple effects in the community","Practical, emotional, and environmental benefits","Practise good environmental habits","Prepare us for bigger challenges like climate change","Prevent clutter","Prevent pollution","Proper disposal","Proper recycling habits","protect the environment","Quality of life","Reduce single-use packaging","Responsible and mindful about what we throw away","Responsible shoppers","Restore the park as a clean, welcoming space for all to use","Safe and healthy place to live","Saving electricity reduces the need for burning fossil fuels, which lowers pollution and greenhouse gases","Second nature","Singapore has only one landfill, Semakau, and it might run out of space one day","Society that is more conscious of the environment","Spread diseases and harm public health","Strong sense of satisfaction","Sustainability should be part of our daily lives","Take years to decompose","Taking care of a plant requires patience and responsibility","Upcycling project","Valuable lessons","Valuable opportunity for intergenerational bonding","We should not take our environment for granted","When people litter or waste resources, it harms animals, plants, and even our own health","Without proper education, children might develop careless habits that harm the"]},"starters":{"To begin a sentence":["I agree / disagree with…","I strongly believe…","In my opinion…","From my perspective…"],"To add information":["Additionally…","Furthermore…","Moreover…","On top of that…","Besides that…"],"To give examples":["For instance…","Take for example…","To illustrate…","This can be seen when…"],"To show another side":["However…","In contrast…","Conversely…","On the other hand…","On the contrary…"],"To show effect":["Therefore…","Hence…","Consequently…","As a result…","This shows me that…","This taught me that…"],"To conclude":["In conclusion…","To conclude…","To summarise…","To sum up…","Overall…"]},"bonus":[{"day":1,"img":"img/bonus-1.jpg","desc":"An ice cream kiosk right outside a mall, with several people queueing.","questions":["Do you think this is a good place to set up an ice cream store?","Do you like to wait in long queues?","Do you think Singaporeans are orderly?"],"answers":[{"q":"Do you think this is a good place to set up an ice cream store?","a":"I think this is an excellent place to set up an ice-cream kiosk because it is located right outside a busy shopping mall, where there is naturally a high amount of foot traffic. Since many shoppers enter and exit through this main walkway, the stall can attract customers easily without needing extra advertising. The warm Singapore weather also makes ice-cream a convenient and appealing treat for people who are taking a break from shopping or waiting for others.\n I do acknowledge that placing the kiosk at the entrance might cause some inconvenience, such as queues forming along the walkway or slightly slowing down the flow of people entering and leaving the mall. During peak hours, the stall could even appear to take up space or partially block the entrance. However, with proper queue markers and crowd-management measures, these issues can be controlled effectively. The benefits of the location—strong visibility, easy access, and high customer volume-—still outweigh the drawbacks. Most shoppers may not mind queuing up, and many may even appreciate the convenience of grabbing a cold treat before heading home.\n Furthermore, since the queue is outdoors, it reduces congestion inside the mall and gives customers space to line up comfortably. As long as hygiene practices are followed, this setup can remain safe and manageable.\n Overall, I believe placing an ice-cream kiosk outside a mall is a strategic choice that maximises visibility, convenience and sales potential."},{"q":"Do you like to wait in long queues?","a":"No, I would not be willing to queue in a long line just to get what I want, even if the item is something I enjoy. While I understand that some people do not mind waiting, I personally find long queues tiring and uncomfortable, especially in Singapore's hot and humid weather. Standing in the blazing heat or even in light rain can make the experience unpleasant, and by the time I reach the front of the line, I might have already lost the excitement or appetite I started with.\n These days, I also feel that long queues are becoming less necessary because online shopping has made life so much more convenient. With just a few clicks, I can get most things delivered straight to my home without needing to step out at all. However, I do acknowledge that not everything can be bought online. Fresh treats like ice- cream, especially from traditional carts or special kiosks, can only be enjoyed on the spot. In those situations, I would not mind joining a queue—as long as it is not too long. A short, manageable line feels reasonable, and the wait can even build a bit of anticipation. But once the queue stretches too far, the inconvenience outweighs the enjoyment for me.\n Overall, while I respect people who are willing to queue for things they love, I prefer to avoid long lines whenever possible. My time and comfort matter more, and I would rather choose the easier, quicker option whenever I can."},{"q":"Do you think Singaporeans are orderly?","a":"Yes, I think Singaporeans are generally very orderly because we tend to follow rules, queue up properly, and respect other people's personal space in public. From boarding the MRT to buying food at hawker centres, most of us understand that being organised helps everyone move smoothly. Orderliness is an important part of Singapore's culture, as it keeps our environment safe, efficient, and pleasant for alll.\n In many situations, I have seen how naturally Singaporeans form queues. At popular food stalls, bus interchanges, and even crowded malls, people usually know where to stand and wait patiently. Looking at the photo of the ice-cream kiosk outside the mall, the people are neatly lined up, showing that Singaporeans understand the importance of waiting their turn instead of pushing ahead or cutting the queue.\n However, I do admit that I have encountered some occasions where people's impatience got the better of them. For example, I have seen commuters rushing into the MRT before others could alight, causing unnecessary crowding. There were also times when shoppers tried to squeeze past others during sales events because they did not want to wait. These moments show that while most Singaporeans are orderly, we are not perfect.\n Still, such incidents are the exception rather than the norm. Overall, Singaporeans take pride in queueing properly and behaving responsibly in public. This orderly behaviour makes our country safer and more comfortable to live in, and it is a habit that future generations should continue to uphold."}],"audio":"audio/bonus-1.mp3"},{"day":2,"img":"img/bonus-2.jpg","desc":"A vibrant hawker centre: diners enjoying meals, families seated together, hawkers preparing food in the background.","questions":["Why do you think people in the photo like going to the hawker centre?","Do you prefer going out to eat or home cooked food?","Should kids learn how to cook?"],"answers":[{"q":"Why do you think people in the photo like going to the hawker centre?","a":"I think the people in the photo enjoy going to the hawker centre because it offers a warm, lively, and affordable place to eat together. Hawker centres are a major part of Singapore's food culture, and many people appreciate them for their wide variety of dishes, from noodles to rice meals to traditional snacks. Instead of travelling to different places, everyone can find something they like under one roof, which makes it convenient for families and groups with different preferences.\n Another reason people like hawker centres is the relaxed and welcoming atmosphere. In the photo, families and friends are sitting together, chatting comfortably over their meals. Children, adults, and even elderly people are present, showing that hawker centres appeal to all ages. The open seating arrangement also encourages interaction, making it easy to bond over food without the formality of a restaurant.\n The background shows hawkers skilfully preparing dishes, which adds to the authentic, homely feel of the place. Many Singaporeans enjoy knowing that their food is cooked fresh right in front of them. The bright signboards and bustling environment suggest that this hawker centre is well-loved and frequently visited.\n From my own experience, I also enjoy going to hawker centres because the food is delicious, affordable, and familiar. It feels like a place where people can relax, enjoy hearty meals, and be part of the community. I believe the people in the photo feel the same way too.\n WRITERS AT WORI"},{"q":"Do you prefer going out to eat or home cooked food?","a":"I prefer going out to eat rather than having home-cooked food because it gives my family a chance to spend quality time together while giving my parents a well- deserved break from cooking. Even though home-cooked meals are meaningful, dining out brings a special kind of excitement — the feeling of exploring new dishes, trying different cuisines, and enjoying the atmosphere of busy eateries around Singapore.\n A
