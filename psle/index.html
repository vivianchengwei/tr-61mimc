lthough home-cooked food can be healthier and more affordable, I appreciate the convenience of dining out, especially on days when my parents are tired after work. Cooking every day can be exhausting, from planning meals to preparing ingredients and cleaning up afterwards. Eating out allows us to relax together without worrying about chores. As many families know, Singapore's fast-paced lifestyle can make it difficult to slow down, so sitting together at a restaurant becomes a precious moment. As the saying goes, \"Food tastes better when you eat it with your loved ones.\"\n According to a recent survey on family habits in Singapore, most parents spend only about an hour of quality time with their children on weekdays because of busy work schedules. Dining out can help strengthen family bonds by giving us uninterrupted time to talk, laugh, and share stories. For example, during our meals outside, my family often chats about school, work, and funny moments from the day. These conversations make the meal feel even more special. We also get to enjoy a wider variety of dishes that we might not prepare at home, such as Korean barbecue, hotpot, or Japanese sushi. Enjoying these foods together creates happy memories that last longer than the med! itself.\nIn conclusion, I feel that going out to eat is better for me than always having home- cooked meals. While food made at home has its own charm, dining out helps my family relax, enjoy each other's company, and take a break from the usual routine. As another quote says, \"The best moments are found around the table — not because of the food, but because of the people.\"\n WRITERS AT WORI"},{"q":"Should kids learn how to cook?","a":"Yes, I believe that kids should learn how to cook. Even though Singapore has many convenient dining options like hawker centres and fast food outlets, knowing how to prepare meals at home is an important life skill that teaches independence, nutrition, and responsibility. Learning to cook also helps children understand what goes into their food and how to make healthier choices.\n In today's busy world, it is easy to rely on ready-made meals or processed foods, which are often high in sugar, salt, and unhealthy fats. Regularly eating these foods can lead to health problems such as obesity, diabetes, and heart disease. By learning to cook at a young age, children can develop a habit of choosing fresh ingredients and balanced meals. For example, preparing a simple stir-fried vegetable dish or steamed fish can teach kids how to include more nutrients in their diet, which helps them feel stronger and more energetic.\n Of course, safety is very important when learning to cook. Children should be taught how to handle knives carefully, avoid burns, and use the stove responsibly, preferably under adult supervision. Starting with simple, safe tasks like washing vegetables, measuring ingredients, or mixing batter can gradually build their confidence and skills. Ultimately, learning to cook is not just about preparing meals; it is about developing independence, responsibility, and healthy habits. While it is okay to enjoy food from hawker centres or restaurants occasionally, having the ability to cook ensures that kids can take care of themselves and make nutritious choices. Therefore, I believe that kids should learn how to cook."}],"audio":"audio/bonus-2.mp3"}],"ace":[{"n":1,"title":"Phone Addiction","theme":"tech","img":"img/ace-1.jpg","reading":{"instruction":"You are reading an article from your school newsletter to classmates. Your purpose is to inform and gently persuade them to build healthy phone habits. Read clearly and with a warm, encouraging tone.","paragraphs":["Many of us reach for our phones the moment we wake up. We check messages, scroll through videos, and keep tapping even when it is time to study or sleep. Phones are useful for learning and staying in touch, but using them without limits can affect our health and relationships.","Students who stare at their screens for long periods may get tired eyes and headaches. They may also find it harder to concentrate in class. Using a phone right before bedtime can disturb sleep, which leads to slower thinking the next day. At home, some families notice that mealtimes become quiet because everyone is busy with their devices instead of talking.","We can make small changes that add up. Set a daily time limit, turn off notifications during homework, and charge your phone outside the bedroom at night. Try phone-free meals and suggest outdoor activities with friends. When we control our phones—instead of letting them control us—we feel calmer, think better, and enjoy the people around us more."]},"questions":["What is happening in this picture, and what concerns might the adult have?","Has something similar happened in your family? How was it handled and what did you learn?","Should schools actively teach students to manage phone use? Why or why not?","What can families and schools do together to help students develop healthier phone habits?"],"answers":[{"P":"Two boys are using their phones during a meal while an older woman, likely their grandmother, watches them with concern.","E1":"She may worry that the boys are missing the chance to connect as a family and practise mealtime manners. When people focus on screens, they avoid eye contact and give short answers, so conversations feel cold. Over time, this habit can make relationships weaker because family members stop sharing their thoughts and feelings. She might also be concerned about posture, eye strain, and the risk of mindless eating, which leads to overeating. Finally, she could fear that the boys are forming a routine where phones always come first, even in important moments.","E2":"During Chinese New Year, my cousins and I once scrolled through videos while eating. My grandmother looked disappointed and asked what we enjoyed most that day. We put our phones aside and started telling stories about the relatives we visited. The table felt lively again, with laughter and friendly teasing. After that, we agreed to keep meals phone-free so everyone could feel included.","L":"Putting phones away at mealtimes shows respect and helps families grow closer through real conversation."},{"P":"Yes. My family noticed we were checking our phones during dinner, so we created a simple rule together.","E1":"We placed all devices in a small basket before meals and switched them to silent. At first, we forgot and kept glancing at the basket because we felt curious about new messages. My parents reminded us gently that dinner is a short but important time to meet as a family every day. After a week, it felt natural to talk about our day, school projects, and funny things that happened. I learnt that rules work best when they are fair, explained clearly, and followed by everyone, including adults.","E2":"One evening, my father shared how a colleague helped him at work, and that led to a discussion about gratitude. My brother then thanked Mum for cooking his favourite soup. I realised these small conversations would not have happened if we were busy scrolling. We also ate more slowly and enjoyed the food. Now, even guests happily join our phone-free dinners.","L":"Setting shared rules builds good habits and reminds us that real connection is worth protecting."},{"P":"Yes, schools should teach balanced phone use because it affects learning, health, and relationships.","E1":"Many students underestimate how notifications break their focus and make it harder to remember lessons. A short lesson on \"attention switching\" can help them understand why doing two things at once lowers quality. Schools can also show practical steps like using \"Do Not Disturb,\" setting app limits, and placing phones out of sight during work. When teachers model these habits, students see that discipline is possible and helpful. Finally, discussing the feelings behind constant checking—such as boredom or anxiety—teaches students to manage emotions, not just screens.","E2":"My school ran a \"Focus Fortnight\" challenge. We placed phones in a class tray during lessons and reflected weekly. I finished work faster and felt calmer because I was not rushing between apps and tasks. Some classmates realised they slept earlier when they reduced late-night scrolling. Our form teacher said our class discussions became deeper and more thoughtful.","L":"By guiding students to use technology wisely, schools help them learn better now and form lifelong self-control."},{"P":"They can align routines, model good behaviour, and provide meaningful alternatives to screen time.","E1":"When rules are consistent at home and in school, students know exactly what to expect. Families can set phone-free zones like bedrooms and dining tables, while schools can protect silent study periods. Adults should follow the same rules so children feel the message is fair. Offering alternatives—board games, reading corners, outdoor play, or simple chores—fills time with activities that build skills and calmness. Regular check-ins, not scolding, help students reflect on progress and adjust goals.","E2":"My school created a weekly \"Green Hour\" outdoors where we play sports or walk. At home, my parents planned a screen-free evening once a week for puzzles or baking. I noticed I slept earlier and woke up in a better mood on those days. When I slipped, Mum asked what made it hard instead of blaming me, so I felt safe to try again.","L":"Consistent routines and caring guidance make balanced phone use a natural part of life, not a strict rule to fear."}],"audio":{"read":"audio/ace-read-1.mp3","readTimes":[[[0.3,3.27],[3.87,9.48],[10.08,16.65]],[[17.75,22.14],[22.74,25.75],[26.35,31.9],[32.5,39.75]],[[40.85,43.2],[43.8,50.45],[51.05,54.85],[55.45,62.53]]],"ans":["audio/ace-ans-1-1.mp3","audio/ace-ans-1-2.mp3","audio/ace-ans-1-3.mp3","audio/ace-ans-1-4.mp3"],"ansTimes":[[[0.25,7.36],[7.66,41.24],[41.54,65.39],[65.69,72.08]],[[0.25,7.41],[7.71,38.01],[38.31,59.49],[59.79,65.45]],[[0.25,5.98],[6.28,42.35],[42.65,64.26],[64.56,71.44]],[[0.25,6.51],[6.81,38.32],[38.62,57.96],[58.26,65.39]]]}},{"n":2,"title":"Online Food Ordering","theme":"tech","img":"img/ace-2.jpg","reading":{"instruction":"You are reading a short news article aloud to your classmates. Your purpose is to share both the convenience and the challenges of ordering food online. Read with a clear and balanced tone, showing both enthusiasm and caution.","paragraphs":["Online food delivery has become a part of daily life for many Singaporeans. With a few taps on a phone, we can enjoy our favourite meals without leaving home. Delivery riders work hard to bring orders quickly, and busy families appreciate the time saved.","However, some people have started to worry that depending too much on online ordering may have downsides. When food is packed in plastic containers, it creates more waste. Some riders also face risks on the road, especially during bad weather. Customers sometimes cancel late, wasting food and effort.","We can still enjoy the convenience if we use it responsibly. Plan orders ahead, avoid wasting food, and choose restaurants that use eco-friendly packaging. Ordering online can be a treat, but making thoughtful choices helps the system work better for everyone."]},"questions":["What is happening in this picture, and what message does it convey?","Have you ever ordered food online? What was the experience like?","What are some benefits and drawbacks of online food delivery?","How can students make responsible choices when ordering food online?"],"answers":[{"P":"Two teenagers are enjoying delivered food at home while more items arrive at the door, showing how common online ordering has become.","E1":"The image highlights convenience—people can eat without cooking or leaving the house. But it also suggests possible concerns, such as higher spending, less healthy choices, and more plastic waste. If families rely on delivery too often, they may lose chances to cook together and share simple routines like setting the table. It may also affect riders, who rush in rain or heavy traffic to meet deadlines. The picture encourages us to think about balance rather than rejecting delivery entirely.","E2":"During exam season, my family ordered dinner several times in a week. It saved time, but we noticed the amount of packaging piled up quickly. We felt it was wasteful, so we decided to order less and cook simple meals on most days. We also chose stalls that use paper boxes or allow us to opt out of cutlery.","L":"The message is to enjoy convenience wisely—order when needed, but make choices that protect our health, money, and environment."},{"P":"Yes, my family orders food online occasionally, especially on busy weekdays.","E1":"I like the variety because we can try different cuisines that are far from our home. However, I noticed that delivery fees and service charges can add a lot to the bill. Waiting can also be stressful when the rider faces traffic or bad weather. The experience made me more aware of the effort behind each order. Now I think carefully about whether I am ordering out of hunger or just boredom.","E2":"Once, a rider called to say lightning had delayed him. He sounded tired but apologised politely. My parents told him to take his time, and when he arrived, we thanked him and gave a small tip. He smiled and said the kind words made his day. That moment reminded me that a simple meal involves someone else's hard work and safety.","L":"Ordering online can be positive when we show patience, gratitude, and thoughtfulness in our choices."},{"P":"It offers convenience and variety but may increase waste, cost, and unhealthy eating if overused.","E1":"For busy families, delivery reduces stress and supports small eateries that gain more customers through apps. Students can save travel time during revision. However, constant ordering encourages snacking, oversized portions, and sugary drinks. Packaging waste adds up quickly and harms the environment. People also tend to spend more because promotions make extra items look attractive.","E2":"My aunt hosted a family gathering and ordered multiple sets that came with sides we did not need. We could not finish everything, and the table was full of plastic containers. After that, she planned her next order better and chose a restaurant with paper packaging. She also set a rule to share one dessert instead of ordering many.","L":"The best approach is to enjoy delivery in moderation while planning portions and choosing eco-friendly options."},{"P":"Students can plan, share, and pick healthier, greener options.","E1":"Before ordering, decide what is truly needed and check portion sizes. Group orders reduce delivery fees and packaging. Choosing water over soft drinks and adding a fruit or salad balances the meal. It also helps to support stalls that use paper boxes or allow reusable containers. Finally, being polite to riders, giving clear directions, and receiving orders quickly shows respect for their time.","E2":"When my project group met, we combined our orders and avoided extra sauces and cutlery. We requested fewer plastic items in the app notes, and the store followed our request. We also set a budget and stuck to it, so no one overspent. After eating, we sorted the recyclables properly and wiped the table together. The experience felt organised and considerate.","L":"Responsible ordering proves that convenience can go hand-in-hand with health, kindness, and care for the environment."}],"audio":{"read":"audio/ace-read-2.mp3","readTimes":[[[0.3,4.97],[5.57,10.03],[10.63,16.18]],[[17.28,22.78],[23.38,27.18],[27.78,32.32],[32.92,36.36]],[[37.46,41.02],[41.62,47.25],[47.85,53.61]]],"ans":["audio/ace-ans-2-1.mp3","audio/ace-ans-2-2.mp3","audio/ace-ans-2-3.mp3","audio/ace-ans-2-4.mp3"],"ansTimes":[[[0.25,8.43],[8.73,39.28],[39.58,59.03],[59.33,67.25]],[[0.25,5.36],[5.66,28.91],[29.21,49.91],[50.21,56.08]],[[0.25,6.64],[6.94,31.24],[31.54,51.09],[51.39,58.12]],[[0.25,4.12],[4.42,29.59],[29.89,53.06],[53.36,60.67]]]}},{"n":3,"title":"Being a Good Neighbour","theme":"kind","img":"img/ace-3.jpg","reading":{"instruction":"You are reading your reflection from a class discussion on how to be a considerate neighbour. Read clearly and with a sincere, friendly tone.","paragraphs":["Last week, our class talked about what it means to live in harmony with the people around us. We realised that good neighbours make our community a happier and safer place.","Being a good neighbour is about small actions—like greeting others, keeping noise down, and helping when someone needs it. These acts may seem simple, but they build trust and friendliness. I once saw my parents help our elderly neighbour carry her groceries. She smiled warmly and said, \"Thank you.\" That moment showed me how kindness strengthens bonds.","Sometimes, misunderstandings happen, like when people hang laundry dripping water or play loud music. Instead of arguing, it's better to speak politely or leave a note. Respect and patience help solve problems peacefully.","If everyone takes the first step to be kind, our neighbourhoods will be welcoming places where people look out for one another."]},"questions":["What is happening in this picture, and what can you infer about the neighbours?","Why do you think it's important to be considerate to neighbours?","What can you do if you have a conflict with a neighbour?","How can schools encourage students to be good neighbours in the community?"],"answers":[{"P":"A boy is helping his elderly neighbour carry groceries up the stairs, showing a caring community spirit.","E1":"The scene suggests that neighbours know each other well and interact politely. It shows respect for the elderly and understands that some tasks are difficult for them. When young people help without being asked, it creates trust and warmth. Such gestures also encourage others in the block to be helpful, forming a culture of kindness. Over time, friendly daily actions—like holding the lift or greeting one another—turn strangers into familiar faces who look out for each other.","E2":"In my block, my father always greets the uncle who sweeps the floor. One day, when our lift malfunctioned, that uncle taught us a quicker route to the next lift and even helped carry our shopping. Another neighbour once shared homemade kueh during Hari Raya. These small connections make our block feel like a big extended family.","L":"Good neighbours create safety and warmth, proving that little acts of care can brighten daily life for everyone."},{"P":"Consideration keeps the community peaceful and shows respect for shared living.","E1":"In flats, noise, smells, and clutter can affect many families at once. When people are thoughtful—by keeping volume low, clearing corridors, and informing others about renovations—tension is reduced. Consideration also makes it easier to ask for help during emergencies, since trust already exists. Children learn from what they see; a considerate community teaches patience and empathy better than lectures. Finally, being considerate helps prevent conflicts that might become long-lasting and hurtful.","E2":"Our upstairs neighbour once told us their renovation schedule and passed us earplugs. Because they kept us informed and stuck to the timings, we felt calm and prepared. Later, when we did a small repair, we gave them a heads-up too. This mutual respect prevented complaints and kept the corridor friendly.","L":"Thoughtful behaviour builds harmony, turning a crowded block into a caring, cooperative home for all."},{"P":"Stay calm, communicate politely, and seek a fair solution.","E1":"It helps to describe the problem clearly and suggest practical alternatives instead of blaming. Listening is just as important—understanding the other person's reason reduces anger. If emotions run high, involve an adult or the Residents' Committee to mediate. Keeping records, like times and photos, may help if reminders are needed. Most issues, such as dripping laundry or late-night noise, can be resolved through small changes when both sides show goodwill.","E2":"My friend's family complained about loud music late at night. Instead of arguing, they asked the neighbour if the speakers could face away from the wall and if the volume could be lowered after 10 p.m. The neighbour agreed and apologised because he had not realised the sound travelled. The problem ended quickly and politely.","L":"Respectful communication protects relationships and shows maturity, even when disagreements happen."},{"P":"Schools can design experiences that let students practise empathy and responsibility.","E1":"Values lessons are more powerful when linked to real actions, such as visiting elderly homes, creating anti-litter posters for nearby blocks, or writing thank-you cards to cleaners. Teachers can also use role-play to practise polite speaking when dealing with noise or clutter. Student leaders can model corridor safety during school events to show ownership. When schools praise considerate behaviour publicly, more students feel motivated to try it.","E2":"My school ran a \"Neighbourhood Care Week.\" We picked up litter near the park connectors, interviewed residents about their needs, and designed reminder signs for bicycle parking. Residents thanked us, and even the shop owners waved when we passed. I felt proud that our small efforts made a visible difference.","L":"By guiding students to act kindly beyond the classroom, schools help grow responsible citizens who strengthen the whole community."}],"audio":{"read":"audio/ace-read-3.mp3","readTimes":[[[0.3,4.91],[5.51,9.54]],[[10.64,17.4],[18.0,21.63],[22.23,25.96],[26.56,28.74],[29.34,32.33]],[[33.43,39.53],[40.13,43.75],[44.35,47.32]],[[48.42,55.31]]],"ans":["audio/ace-ans-3-1.mp3","audio/ace-ans-3-2.mp3","audio/ace-ans-3-3.mp3","audio/ace-ans-3-4.mp3"],"ansTimes":[[[0.25,6.55],[6.85,35.18],[35.48,54.59],[54.89,61.3]],[[0.25,5.12],[5.42,36.21],[36.51,54.74],[55.04,61.02]],[[0.25,4.06],[4.36,33.58],[33.88,53.77],[54.07,60.52]],[[0.25,5.95],[6.25,33.55],[33.85,52.23],[52.53,60.24]]]}},{"n":4,"title":"Eating at Fast Food Restaurants","theme":"sports","img":"img/ace-4.jpg","reading":{"instruction":"You are giving a short talk in your English class about the popularity of fast food. Read with an engaging, informative tone that shows awareness and balance.","paragraphs":["Fast food has become a favourite choice for many children and adults. It is quick, tasty, and available almost everywhere. After a long day, people find it easy to grab burgers, fries, or bubble tea instead of cooking.","However, eating fast food too often can be unhealthy. These meals are usually high in fat, salt, and sugar, which can cause health problems if consumed daily. Some people also forget the joy of eating home-cooked food made with care and fresh ingredients.","We don't need to avoid fast food completely, but we can make smarter choices. Choose water instead of soft drinks, share sides with friends, and eat more fruits and vegetables at other meals. Eating well helps us stay strong, focused, and happy."]},"questions":["What is happening in this picture, and what might the adults be thinking?","Why do you think fast food is so popular among students?","How can schools encourage healthy eating habits among students?","What can families do to promote healthier eating at home?"],"answers":[{"P":"A family is eating at a fast-food restaurant; the children look excited while the parents watch them fondly.","E1":"The adults may be treating their children to a special meal after a long week or celebration. While they enjoy the outing, they could also be thinking about nutrition and cost. Parents often try to balance happiness and health by choosing smaller portions, adding water instead of soda, or planning a home-cooked meal the next day. They might also notice the brightly coloured posters and smell of fried food that tempt children to order more than they need. Finally, they may be comparing the speed and convenience with the warmth of a meal cooked at home.","E2":"After my exams, my parents brought us out for burgers. My mother suggested sharing fries and choosing grilled options. We chatted about our day and laughed about funny moments in school. The next day, she prepared a soup with vegetables to balance our diet. I liked how we enjoyed the treat without making it a habit.","L":"The picture shows that fast food can be part of family life when parents guide choices and keep moderation in mind."},{"P":"It is convenient, tasty, and affordable, and many outlets are near schools.","E1":"Students have busy schedules with co-curricular activities and tuition, so quick meals feel helpful. The menus are designed to be attractive with colourful images, combos, and discounts. Friends like these places because they can sit and chat without spending too much. However, repeated visits can lead to overeating and too much sugar. Popularity sometimes comes from habit rather than real hunger, especially when students go because their friends are going.","E2":"My classmates often suggest fries and bubble tea after CCA. We enjoy the time together, but we realised we felt sluggish during homework. So we agreed to limit fast-food trips to Fridays and pick healthier snacks, like sandwiches or fruit, on other days. We still had fun, but our energy improved.","L":"Students are drawn to fast food for social and practical reasons, but knowing the effects helps them make wiser choices."},{"P":"Schools can make healthy eating visible, practical, and enjoyable.","E1":"Canteens can offer whole-grain versions and include fruits in set meals. Health lessons should explain labels, portion sizes, and sugar content in simple ways. Hands-on cooking demos or smoothie bars make healthy food exciting. Teachers who choose balanced meals in front of students send a strong message. Campaigns can also reward classes that bring water bottles or pack colourful snacks.","E2":"My school organised \"Rainbow Recess\" where we had to bring at least three different coloured fruits or vegetables. Our Science teacher explained the benefits, and the class with the most \"rainbow\" lunches won extra PE time. Many of us discovered we liked kiwi and cherry tomatoes. Even after the event, some friends kept packing them.","L":"When schools combine education with fun and good role-modelling, healthy eating becomes a habit, not a chore."},{"P":"Plan balanced meals together and involve children in simple kitchen tasks.","E1":"When children help wash vegetables, marinate meat, or set the table, they feel proud and more willing to try new foods. Families can plan a weekly menu to prevent last-minute fast-food decisions. Keeping water as the main drink and saving sweet treats for weekends reduces sugar intake. Talking about food respectfully—without calling any food \"bad\"—teaches balance and avoids guilt. Eating together also strengthens bonds and allows parents to notice habits gently.","E2":"On Sundays, my family plans meals and prepares ingredients ahead. I slice fruit for lunch boxes, and my brother rinses lettuce. Because we are involved, we complain less and enjoy the meals more. If we eat out, we share sides and choose soup or salad dishes. This routine helped us save money and feel healthier.","L":"With planning and teamwork, families can enjoy food while building strong, healthy habits for life."}],"audio":{"read":"audio/ace-read-4.mp3","readTimes":[[[0.3,4.1],[4.7,7.77],[8.37,14.04]],[[15.14,18.37],[18.97,24.79],[25.39,30.96]],[[32.06,36.64],[37.24,43.39],[43.99,47.0]]],"ans":["audio/ace-ans-4-1.mp3","audio/ace-ans-4-2.mp3","audio/ace-ans-4-3.mp3","audio/ace-ans-4-4.mp3"],"ansTimes":[[[0.25,6.68],[6.98,39.26],[39.56,58.78],[59.08,66.41]],[[0.25,5.06],[5.36,33.35],[33.65,52.86],[53.16,60.3]],[[0.25,4.44],[4.74,29.15],[29.45,49.92],[50.22,56.82]],[[0.25,5.02],[5.32,34.84],[35.14,55.09],[55.39,61.16]]]}},{"n":5,"title":"Keeping Corridors Safe and Tidy","theme":"kind","img":"img/ace-5.jpg","reading":{"instruction":"You are presenting the outcome of your group discussion on safety in shared spaces. Read with a clear, respectful, and persuasive tone.","paragraphs":["During our class discussion on community safety, we agreed that keeping shared corridors tidy is one of the easiest yet most important things we can do. When corridors are filled with bicycles, shoe racks, or boxes, they block space and make it difficult for others to walk through.","This is especially risky for elderly residents or people using wheelchairs. In an emergency, cluttered corridors can slow down rescue workers and cause accidents. Keeping these areas clear shows respect for our neighbours and keeps everyone safe.","We can start by reminding our families and helping to tidy up shared spaces. If everyone takes responsibility, our blocks will be cleaner, brighter, and safer for all."]},"questions":["What is happening in this picture, and why might it be a problem?","Have you seen similar situations before? How were they handled?","Why is it important to keep shared spaces safe and tidy?","How can students help promote cleanliness and safety in their neighbourhoods?"],"answers":[{"P":"A corridor is crowded with bicycles and boxes, blocking the walkway and creating hazards.","E1":"Clutter makes it hard for residents, especially the elderly or those pushing prams, to move safely. In an emergency, such as a fire, obstacles can slow evacuation and prevent firefighters from reaching units quickly. Piles of items also collect dust and attract pests. Even if owners are careful, visitors may trip because they are unfamiliar with the layout. While people may lack storage space, shared areas should prioritise safety over convenience.","E2":"My block once had a stack of unused furniture in the corridor after a move. One evening, an elderly neighbour stumbled over a small box and almost fell. The Residents' Committee sent a friendly notice to remind everyone of safety rules, and the items were removed the same day. After that, we kept the corridor clear and even added a small potted plant near the lift to make the area welcoming.","L":"Clear corridors protect lives and show respect for everyone sharing the same space."},{"P":"Yes, I have seen cluttered corridors, especially after festivals or house renovations.","E1":"People sometimes place decorations, bicycles, or delivery cartons outside because their homes feel crowded. When problems arise, polite reminders usually work better than scolding. Management can explain the safety reasons and give residents time to clear items. Sharing tips—like wall hooks, foldable racks, or community recycling points—helps families manage space more wisely. Neighbours who lead by example make it easier for others to follow.","E2":"After Chinese New Year, our corridor was lined with gift boxes waiting for recycling. A neighbour suggested a combined trip to the recycling bins downstairs. Several families joined, and we cleared everything in one go while chatting along the way. It turned a complaint into a friendly activity that improved our block.","L":"With patience, clear communication, and teamwork, communities can solve clutter problems without conflict."},{"P":"Shared spaces affect everyone's comfort, safety, and sense of pride in the community.","E1":"When walkways are clear, residents feel relaxed and welcome. Safety risks are reduced because people can move quickly and avoid tripping. Tidy spaces also discourage pests and unpleasant smells that spread to nearby units. Children learn from what they see; a clean environment teaches them responsibility better than rules alone. Finally, neat corridors prevent arguments between neighbours, which protects long-term friendships.","E2":"During a fire drill at school, our teacher showed how a blocked exit slows everyone. That lesson made me think about our home corridor. After we cleared old items and swept the floor, the space looked brighter, and visitors complimented our block. Even the cleaner said his job became easier because rubbish no longer stuck around.","L":"Keeping shared spaces tidy is a simple way to care for others and build a safer, kinder neighbourhood."},{"P":"Students can set examples, suggest solutions, and support community efforts.","E1":"We can remind our families to keep items inside and offer to tidy the area together once a month. Creating friendly posters near lifts or notice boards raises awareness without blaming anyone. Students can also join RC or school projects to organise corridor clean-ups and recycling days. Sharing tips—like using foldable bikes or vertical storage—helps families with small homes. Encouraging younger children to pick up after themselves spreads good habits.","E2":"My class designed \"Clear to Care\" stickers with simple icons showing safe corridors. We asked permission to place them near cluttered spots and spoke politely to residents. Many thanked us and moved their items. Later, our school partnered with the RC for a neighbourhood clean-up, and participation increased because people already knew us.","L":"When young people lead kindly and practically, cleanliness becomes a shared value that keeps everyone safe."}],"audio":{"read":"audio/ace-read-5.mp3","readTimes":[[[0.3,9.28],[9.88,16.77]],[[17.87,22.14],[22.74,27.79],[28.39,33.09]],[[34.19,38.9],[39.5,44.58]]],"ans":["audio/ace-ans-5-1.mp3","audio/ace-ans-5-2.mp3","audio/ace-ans-5-3.mp3","audio/ace-ans-5-4.mp3"],"ansTimes":[[[0.25,6.0],[6.3,34.65],[34.95,58.26],[58.56,63.82]],[[0.25,5.7],[6.0,34.74],[35.04,54.38],[54.68,61.21]],[[0.25,5.89],[6.19,32.67],[32.97,52.65],[52.95,59.51]],[[0.25,5.29],[5.59,34.33],[34.63,55.66],[55.96,62.11]]]}},{"n":6,"title":"Automated Laundry Services","theme":"tech","img":"img/ace-6.jpg","reading":{"instruction":"You are reading an informational report written for your school's newsletter. Your purpose is to describe how automated laundry machines are changing daily life. Read clearly and with an informative yet conversational tone.","paragraphs":["Automated laundry services are becoming more common in Singapore's neighbourhoods. Instead of visiting a laundromat and waiting, customers can now drop off clothes at 24-hour lockers or use an app to schedule collection. After washing and drying, the clothes are neatly packed and delivered back to their homes.","These services save time for busy families and working adults. However, some people worry that machines may replace human workers and reduce face-to-face interaction. Others wonder whether such convenience will make people less willing to do simple chores themselves.","Still, automation has advantages. It helps elderly residents who find heavy loads difficult to carry and ensures clothes are cleaned efficiently. When technology is used wisely, it can make life smoother while freeing up time for things that truly matter."]},"questions":["What is happening in this picture, and how does the woman seem to feel?","How do traditional laundromats like this compare to automated laundry pick up and delivery service?","Who would benefit most from each type of service?","Do you think automated services will eventually replace traditional laundromats? Why or why not?"],"answers":[{"P":"The woman is collecting her clean laundry from a washing machine at a traditional self-service laundromat.","E1":"She appears focused and comfortable handling her clothes. The setting shows a typical laundromat where customers operate machines themselves and wait on-site. Unlike automated delivery services, she had to bring her laundry here personally and stay until it finished washing. Her calm expression suggests this is a familiar routine for her.","E2":"My grandmother uses a laundromat like this near her flat. She prefers it because she can check on her clothes while they wash and chat with neighbours who also do laundry there. She says it gives her a reason to leave the house.","L":"The picture captures a traditional approach where people handle their laundry directly rather than relying on automated systems."},{"P":"Traditional laundromats require customers to visit in person, while automated pickup and delivery services handle everything remotely.","E1":"At places like the one shown, people carry their laundry to the location, operate machines themselves, and wait during the wash cycle. This takes time but gives them control and costs less. Automated services use lockers and apps for drop-off, then deliver clean clothes to homes. This saves time but costs more. Traditional laundromats also allow people to meet neighbours, while automated services are contactless.","E2":"My mother tried an automated service when she was extremely busy with work. She liked the convenience but found the fees expensive. After two months, she switched back to washing at home because it was more economical.","L":"Both solve the laundry problem, but traditional methods prioritize affordability while automated services prioritize convenience."},{"P":"Traditional laundromats suit people who value lower costs, while automated services help those with busy schedules or mobility challenges.","E1":"Students, retirees, and people living near laundromats would find traditional services practical because they have flexible time and appreciate the savings. Working parents juggling careers and childcare could benefit from automated pickup—they pay more but gain precious time. Elderly residents with mobility issues might prefer automated delivery because they avoid carrying heavy loads.","E2":"During community service, I met an elderly uncle who still walks to the laundromat weekly. He enjoys the routine and talking to staff. But my neighbour, who works night shifts, uses automated pickup because she can't visit laundromats during operating hours.","L":"The best choice depends on lifestyle, budget, and whether someone values convenience over cost."},{"P":"I don't think automated services will completely replace traditional laundromats, but they will coexist to serve different needs.","E1":"While automation is growing, traditional laundromats will remain relevant for people seeking affordable options. Not everyone can pay premium prices for automated delivery, especially students and lower-income families. Additionally, some people prefer having control over their laundry process and don't trust machines to handle delicate items properly. However, automated services will likely expand in busy urban areas where people prioritize time over cost. Singapore's trend toward efficiency suggests both will have their place.","E2":"In my neighbourhood, a new automated locker system opened last year, but the old laundromat three blocks away is still busy every weekend. Both survive because they attract different customers. I believe this pattern will continue.","L":"Technology changes how we do things, but it doesn't erase all traditional methods—it just gives us more choices."}],"audio":{"read":"audio/ace-read-6.mp3","readTimes":[[[0.3,4.99],[5.59,13.83],[14.43,19.01]],[[20.11,23.72],[24.32,30.25],[30.85,35.95]],[[37.05,39.48],[40.08,46.4],[47.0,53.18]]],"ans":["audio/ace-ans-6-1.mp3","audio/ace-ans-6-2.mp3","audio/ace-ans-6-3.mp3","audio/ace-ans-6-4.mp3"],"ansTimes":[[[0.25,6.23],[6.53,26.9],[27.2,40.02],[40.32,47.99]],[[0.25,8.56],[8.86,34.67],[34.97,47.33],[47.63,56.19]],[[0.25,9.07],[9.37,33.78],[34.08,49.76],[50.06,56.13]],[[0.25,7.75],[8.05,41.41],[41.71,56.12],[56.42,63.7]]]}},{"n":7,"title":"The Joy of Sports","theme":"sports","img":"img/ace-7.jpg","reading":{"instruction":"You are reading an excerpt from your personal reflection for your English project. Read with energy and enthusiasm to convey your passion for sports.","paragraphs":["Sports have always been part of my life. Whether it is running at the park or playing badminton with friends, moving my body clears my mind. My favourite moment is when everyone cheers during a close match—it reminds me that effort matters more than winning.","Sports teach discipline. Training regularly builds patience and mental strength. Sometimes, waking up early for practice feels tiring, but after finishing a run, I feel proud of myself. It also helps me manage stress, especially before exams.","Most importantly, sports bring people together. Team games teach us how to communicate, support one another, and accept both victory and defeat with grace. When we play fairly and give our best, we not only become fitter—we also grow in character."]},"questions":["What is happening in this picture, and what does it show about teamwork?","How can sports help students beyond physical health?","How can schools encourage more students to join sports?","What qualities make a good sportsperson?"],"answers":[{"P":"The picture shows students playing basketball together; they look focused and united.","E1":"It demonstrates teamwork because every player has a role—some pass, some defend, others aim for the basket. Each person's effort matters equally. When teams communicate and encourage one another, they achieve more. Team sports also teach humility because players must trust others instead of wanting all the glory.","E2":"In my school's Sports Day relay, our baton almost dropped, but the next runner caught it just in time. We didn't win first place, yet everyone congratulated him for saving the race. The teamwork and laughter afterwards felt more memorable than a medal.","L":"True teamwork means supporting each other through challenges and celebrating shared effort, not just results."},{"P":"Sports build character, focus, and emotional resilience.","E1":"Training teaches goal-setting and perseverance because improvement takes time. Players learn to manage disappointment after losing and stay humble when they win. These lessons apply to exams and friendships too. Regular exercise also clears the mind, helping concentration in class. Students who balance work and play often perform better academically because they learn self-control.","E2":"Before my exams, I used to jog every evening for twenty minutes. The fresh air helped me relax and sleep better. My marks improved because I could focus longer without feeling tense. My parents noticed I was calmer too.","L":"Sports shape disciplined and confident students who face life's challenges with balance and positivity."},{"P":"Schools can make sports inclusive, enjoyable, and varied.","E1":"Not all students like competition, so offering fun games or fitness clubs helps everyone find a place. Celebrating effort instead of only medals encourages participation. Teachers can highlight how teamwork skills also help in group projects. Schools might invite inspiring athletes or organise house-based games that mix different ages. Providing affordable equipment ensures equal chances.","E2":"My school introduced \"Fun Fridays,\" where we play friendly matches of captain's ball or frisbee. Students who seldom joined PE now look forward to it. Our PE teacher says attitude matters more than speed, and that makes everyone feel included.","L":"When schools focus on enjoyment and teamwork, more students discover that sports can be both healthy and fun."},{"P":"A good sportsperson shows discipline, respect, and humility.","E1":"Discipline ensures regular training and fair play. Respect means following rules, accepting decisions, and treating teammates kindly. Humility keeps players grounded even when they win. Great athletes inspire others through attitude more than trophies. They also show empathy—helping an opponent up after a fall or cheering others on.","E2":"During a football match, a player in my team stopped playing when he saw another student hurt. Even though the game continued, he chose to help. Everyone clapped for his sportsmanship. It reminded me that kindness counts more than goals.","L":"True champions combine skill with integrity, showing that success is measured by character, not just scoreboards."}],"audio":{"read":"audio/ace-read-7.mp3","readTimes":[[[0.3,2.6],[3.2,8.77],[9.37,15.92]],[[17.02,18.71],[19.31,22.27],[22.87,28.95],[29.55,33.33]],[[34.43,37.29],[37.89,44.14],[44.74,50.05]]],"ans":["audio/ace-ans-7-1.mp3","audio/ace-ans-7-2.mp3","audio/ace-ans-7-3.mp3","audio/ace-ans-7-4.mp3"],"ansTimes":[[[0.25,5.44],[5.74,25.34],[25.64,40.86],[41.16,47.93]],[[0.25,4.01],[4.31,28.59],[28.89,43.13],[43.43,49.89]],[[0.25,3.93],[4.23,29.25],[29.55,44.68],[44.98,51.63]],[[0.25,4.16],[4.46,25.58],[25.88,39.74],[40.04,46.9]]]}},{"n":8,"title":"Lifelong Learning","theme":"tech","img":"img/ace-8.jpg","reading":{"instruction":"You are reading a short motivational speech for your school assembly. Read with warmth and inspiration.","paragraphs":["Learning does not end after school. Every experience—whether it's reading a book, learning a new skill, or solving a problem—teaches us something. When we stay curious, we grow as individuals.","Some people think learning only means studying textbooks. In truth, it also includes observing, experimenting, and asking questions. Even adults continue learning through work, hobbies, or travel. The world changes quickly, and those who adapt keep their minds active and confident.","Lifelong learners do not fear mistakes because every challenge is a lesson. When we learn something new, we not only gain knowledge but also discover our strengths. So, keep exploring—you never know what skill might inspire you next."]},"questions":["What is happening in this picture, and what does it tell you about learning?","Why is lifelong learning important in today's world?","How can students develop a love for learning beyond schoolwork?","How can schools encourage lifelong learning habits?"],"answers":[{"P":"The picture shows an elderly man taking notes during a class.","E1":"It suggests that learning is for everyone, not just students. The man's curiosity shows courage and humility. By joining a class, he challenges the idea that age limits education. It also teaches young people that effort matters more than age or background. Continuous learning keeps the mind sharp and builds confidence to try new things.","E2":"My grandfather joined a smartphone workshop for seniors. At first, he struggled but refused to give up. Now he messages the family group daily and even shops online safely. Watching his determination inspired me to be patient with my own studies.","L":"The image reminds us that learning never stops—it is a lifelong journey filled with curiosity and growth."},{"P":"Because technology and society keep changing, we must keep upgrading our knowledge.","E1":"New inventions appear every year, from AI to green energy. Lifelong learning ensures we adapt instead of being left behind. It also encourages creativity—when people learn different skills, they can combine ideas to solve new problems. Beyond work, continuous learning helps us understand cultures, languages, and people better, making us more open-minded.","E2":"My aunt, an accountant, learnt coding during the pandemic. She later helped her company automate reports, saving time for her team. She said learning something new made her feel young again.","L":"Lifelong learning helps us stay relevant, flexible, and confident in a rapidly changing world."},{"P":"By exploring personal interests and viewing mistakes as opportunities.","E1":"When students connect lessons to real life—like using maths for budgeting or science for cooking—they find joy in discovery. Trying hobbies such as photography or coding teaches problem-solving naturally. Instead of chasing marks, focusing on curiosity builds deeper understanding.","E2":"I once joined a pottery class and learnt patience while shaping clay. When a cup broke, my teacher said, \"Every crack shows effort.\" That changed how I saw learning—it's about progress, not perfection.","L":"True learning begins when curiosity replaces fear of failure."},{"P":"Schools can nurture curiosity through choice, collaboration, and reflection.","E1":"Allowing students to pick project topics or try new clubs makes learning personal. Teachers who ask open-ended questions train critical thinking. Reflection journals and sharing sessions help students see how lessons connect to daily life. When schools celebrate growth rather than grades, students feel proud of effort.","E2":"My school's \"Innovation Week\" let us design simple inventions. My group built a pencil holder from recycled bottles and presented how it reduced clutter. I learnt to test, fail, and try again. That excitement made me love learning even more.","L":"When schools make curiosity the goal, lifelong learning becomes second nature."}],"audio":{"read":"audio/ace-read-8.mp3","readTimes":[[[0.3,2.39],[2.99,9.18],[9.78,12.42]],[[13.52,16.7],[17.3,21.7],[22.3,25.79],[26.39,31.28]],[[32.38,36.5],[37.1,41.75],[42.35,46.49]]],"ans":["audio/ace-ans-8-1.mp3","audio/ace-ans-8-2.mp3","audio/ace-ans-8-3.mp3","audio/ace-ans-8-4.mp3"],"ansTimes":[[[0.25,3.91],[4.21,25.86],[26.16,42.3],[42.6,49.39]],[[0.25,5.27],[5.57,28.97],[29.27,40.88],[41.18,47.22]],[[0.25,4.48],[4.78,22.77],[23.07,35.19],[35.49,39.53]],[[0.25,5.02],[5.32,25.15],[25.45,41.33],[41.63,46.59]]]}},{"n":9,"title":"The Importance of Sleep","theme":"sports","img":"img/ace-9.jpg","reading":{"instruction":"You are giving a talk to your classmates about good sleep habits. Read with a calm and reassuring tone.","paragraphs":["Many students sleeping late because they cannot finish homework on time, but lack of rest affects health and focus. Our bodies need at least eight hours of sleep to repair and grow. When we sleep, the brain organises memories and prepares for a new day.","Insufficient sleep causes tiredness, mood swings, and weaker immunity. It also makes it harder to pay attention in class. Sometimes, we waste time scrolling on our phones or chatting online instead of resting.","Good sleep begins with discipline. Set a fixed bedtime, reduce screen use before bed, and create a quiet space for rest. When we sleep well, we wake up refreshed, ready to learn, and kinder to others."]},"questions":["What is happening in this picture, and what does it show about student life?","Why do some students struggle to sleep early?","What can schools do to help students get enough rest?","What steps can you take personally for better sleep?"],"answers":[{"P":"The picture shows a student falling asleep at her desk surrounded by books.","E1":"It reflects how many students sacrifice rest for studies or screen time. While they mean well, staying up late harms concentration and memory. Sleep deprivation builds up like debt—eventually, performance drops. This shows the need for time management, not just hard work. It also highlights how digital distractions can quietly steal rest.","E2":"Before exams, I used to revise past midnight, thinking I was productive. But I often forgot facts during tests. Later, I changed my routine to sleep earlier and revise in the morning. My grades improved, and I felt calmer.","L":"The picture reminds us that rest is part of success—sleeping smart is better than studying tired."},{"P":"Many struggle due to stress, poor time management, and screen habits.","E1":"Students often delay work and end up rushing late at night. Blue light from devices also tricks the brain into staying awake. Some use phones to relax but end up scrolling for hours. Others feel anxious about school or social issues, which keeps the mind active. Recognising these causes helps find solutions.","E2":"I once spent hours texting friends before bed and wondered why I couldn't sleep. After switching to reading short stories instead, I fell asleep faster. My teacher also taught us breathing exercises that helped reduce worry.","L":"Understanding why we stay up helps us plan better habits that protect both body and mind."},{"P":"Schools can promote balanced schedules and stress-management skills.","E1":"Teachers can avoid giving heavy homework right before tests and remind students about sleep importance. Health talks can teach practical tips like setting digital curfews and creating study-sleep routines. Morning exercise programmes can start slightly later on exam weeks to let students recover.","E2":"My principal once shifted assembly by 15 minutes during exam season. Many students arrived more alert and cheerful. Teachers said participation improved too.","L":"When schools value rest as much as results, students learn to care for their wellbeing responsibly."},{"P":"I can set clear routines, limit screen time, and relax before bed.","E1":"Going to bed at the same hour trains the body's internal clock. Avoiding caffeine or late snacks also helps. Doing light stretches, journaling, or gratitude reflections calms the mind. These habits turn bedtime into a peaceful routine rather than a rushed one.","E2":"I now put my phone away at 9 p.m. and read instead. I also note three good things that happened each day. This helps me sleep feeling thankful, not stressed. The next morning, I wake up energetic and ready to learn.","L":"Good sleep is a daily choice—discipline today brings energy and focus tomorrow."}],"audio":{"read":"audio/ace-read-9.mp3","readTimes":[[[0.3,6.76],[7.36,10.67],[11.27,15.2]],[[16.3,20.43],[21.03,23.87],[24.47,29.57]],[[30.67,32.74],[33.34,38.27],[38.87,43.03]]],"ans":["audio/ace-ans-9-1.mp3","audio/ace-ans-9-2.mp3","audio/ace-ans-9-3.mp3","audio/ace-ans-9-4.mp3"],"ansTimes":[[[0.25,4.65],[4.95,26.24],[26.54,41.58],[41.88,48.14]],[[0.25,4.55],[4.85,24.71],[25.01,38.99],[39.29,44.97]],[[0.25,4.12],[4.42,22.77],[23.07,33.74],[34.04,40.07]],[[0.25,4.8],[5.1,21.29],[21.59,37.04],[37.34,42.34]]]}},{"n":10,"title":"Enjoying Local Food Responsibly","theme":"sg","img":"img/ace-10.jpg","reading":{"instruction":"You are giving a short presentation about food culture in Singapore. Read with pride and curiosity.","paragraphs":["Singapore's hawker centres are known for their variety — from nasi lemak to roti prata and laksa. These dishes represent our multicultural identity and bring people of all races together. Sharing food connects families and friends, creating warm memories that reflect the true spirit of our nation.","However, food waste and littering after meals have become growing concerns. When trays are left uncleared or drinks are wasted, cleaners must work extra hard, and valuable resources are lost. Enjoying local food responsibly means appreciating both the taste and the effort behind every meal.","We can start by ordering only what we can finish, returning trays, and thanking hawkers for their hard work. Since 2021, returning trays has become a national rule in all hawker centres, coffee shops, and food courts — a small act that shows respect for others and care for our shared spaces.","When everyone plays their part, we keep our food culture not only delicious but also clean, kind, and sustainable — ensuring that future generations can continue to enjoy the same hawker flavours we love today."]},"questions":["What is happening in this picture, and what message does it convey?","Why do you think hawker culture is important to Singapore?","What can people do to reduce food waste when eating out?","How can schools and families encourage students to appreciate local food responsibly?"],"answers":[{"P":"The picture shows people eating at a hawker centre, with some trays left on the tables after their meals.","E1":"It highlights Singapore's vibrant food culture but also hints at challenges like littering and food waste. Hawker centres are community spaces that rely on shared responsibility. When diners fail to return trays or waste food, it creates extra work for cleaners and affects the dining environment for others. The image reminds us that enjoying local food should come with care and respect for the people who prepare and clean up after us.","E2":"During a family lunch at a hawker centre, I saw an elderly cleaner struggling to clear several messy tables. My father reminded us to return our trays and thanked her personally. She smiled and said she wished more people did the same. That small action made me realise how important it is to do our part.","L":"The picture encourages everyone to appreciate Singapore's food culture not just by eating—but by practising good manners that keep it thriving."},{"P":"Hawker culture reflects Singapore's multicultural identity and brings people together through food.","E1":"Every dish tells a story—Malay satay, Chinese noodles, Indian rojak—and each one shows how our communities share flavours and traditions. Hawker centres are also affordable, welcoming places where people from all walks of life eat side by side. They build connections that go beyond language or background. Hawker culture also preserves recipes passed down through generations, making it a living heritage that defines who we are as a nation.","E2":"During National Day, my family likes to visit the hawker centre near our old flat. The uncle who sells mee rebus always remembers our orders, and we enjoy chatting with him. His kindness and passion for cooking remind us that hawkers are part of our shared memories.","L":"Hawker culture is more than food—it's a symbol of unity, pride, and the warmth of everyday Singapore life."},{"P":"People can order only what they can finish and share food to avoid leftovers.","E1":"Planning portions before ordering prevents waste. Asking for smaller servings, avoiding unnecessary add-ons, and bringing reusable containers for unfinished food are practical steps. It also helps to avoid ordering multiple drinks or side dishes out of impulse. Encouraging friends to do the same spreads awareness. When we waste food, we waste the labour, resources, and money behind it.","E2":"Once, my friends and I over-ordered at a new hawker stall because everything looked delicious. We couldn't finish half of it. After that, we learnt to start with fewer dishes and share plates. Now, we always remind each other to \"taste, not waste.\"","L":"Being mindful about portions helps protect the environment and shows respect for the effort behind every meal."},{"P":"They can teach appreciation through experience, education, and gratitude.","E1":"Schools can organise visits to hawker centres to interview stall owners and learn about food preparation. Teachers can include lessons on food sustainability and waste management. At home, families can cook traditional dishes together to understand the effort behind each meal. Expressing thanks to hawkers and clearing trays are small habits that build respect.","E2":"My school held a \"Hawker Heroes\" week where we researched favourite stalls and presented their stories. It made me realise that each hawker works long hours to serve affordable meals. My parents also involve me in meal planning, which helps me understand how much effort goes into cooking.","L":"When students learn to value food and the people who prepare it, they grow into responsible citizens who protect our local heritage."}],"audio":{"read":"audio/ace-read-10.mp3","readTimes":[[[0.3,6.08],[6.68,12.14],[12.74,18.93]],[[20.03,24.13],[24.73,31.77],[32.37,38.74]],[[39.84,45.95],[46.55,58.64]],[[59.74,72.52]]],"ans":["audio/ace-ans-10-1.mp3","audio/ace-ans-10-2.mp3","audio/ace-ans-10-3.mp3","audio/ace-ans-10-4.mp3"],"ansTimes":[[[0.25,6.42],[6.72,33.68],[33.98,52.41],[52.71,61.65]],[[0.25,6.45],[6.75,35.03],[35.33,51.69],[51.99,58.68]],[[0.25,4.85],[5.15,29.62],[29.92,44.84],[45.14,51.57]],[[0.25,5.02],[5.32,27.24],[27.54,44.31],[44.61,52.47]]]}},{"n":11,"title":"Protecting Our Environment","theme":"env","img":"img/ace-11.jpg","reading":{"instruction":"You are reading a speech as part of your school's \"Green Week\" assembly. Read with an inspiring, confident tone to encourage your schoolmates to take action.","paragraphs":["Our planet gives us everything we need—clean air, water, and the beauty of nature. But every day, our actions affect the environment. Plastic waste, air pollution, and careless use of electricity harm the Earth and our future.","Protecting the environment starts with small, daily choices. We can use reusable bottles, switch off lights when leaving a room, and recycle properly. Instead of littering, we can take pride in keeping our surroundings clean. Even saving one sheet of paper or bringing our own shopping bag makes a difference.","The Earth does not need one person doing everything perfectly—it needs everyone doing something consistently. Together, we can make our community greener and inspire others to do the same. Let's care for the planet that cares for us."]},"questions":["What is happening in this picture, and what message does it convey?","Why do you think it is important to protect the environment?","How can schools and students help protect the environment?","What can families and communities do to support environmental efforts?"],"answers":[{"P":"The picture shows students picking up litter in a park while teachers supervise them.","E1":"It shows that even young people can take responsibility for their environment. Working together teaches teamwork and respect for nature. It also reminds us that cleanliness begins with individual action, not waiting for others to act first. By volunteering, these students set an example for the community and show pride in their surroundings. When people see others caring for public spaces, they are less likely to litter.","E2":"My school organised a similar clean-up day. We collected plastic bottles and sorted them into recycling bins. Although it was hot, we felt proud seeing how much cleaner the park looked. Later, a passer-by thanked us, saying it encouraged his children to join next time.","L":"The picture reminds us that environmental protection starts with simple actions and a shared sense of responsibility."},{"P":"Protecting the environment ensures a safe, healthy, and sustainable future for everyone.","E1":"Pollution and waste affect the air we breathe, the water we drink, and the food we eat. When we harm nature, it eventually harms us. Conserving resources also helps future generations enjoy the same quality of life. Caring for the planet teaches responsibility and empathy, showing that small actions—like switching off lights—matter. Protecting the environment also builds community pride and unity, as people work together toward a common goal.","E2":"During the haze period, I realised how air pollution affects daily life. My throat hurt, and outdoor activities were cancelled. That experience made me appreciate the importance of cleaner energy and planting more trees. Now, I always switch off fans and unplug chargers to save energy.","L":"Protecting nature protects ourselves—it is not just about trees, but about building a future we can all live in comfortably."},{"P":"Schools and students can take part in campaigns, projects, and habits that reduce waste.","E1":"Schools can set up recycling corners and encourage reusable utensils in canteens. Teachers can lead environmental clubs that teach creative reuse of materials. Students can make posters, write articles, or organise events to spread awareness. Small habits—like printing double-sided or reusing worksheets—make a big impact when done by many people. Reflection sessions also help students see how their actions affect the planet.","E2":"My school created \"Eco Fridays,\" where students wear green shirts and bring reusable bottles. We collect recyclables and share eco-tips during assembly. One class suggested using leftover test papers for art projects. Over time, these little ideas became lasting habits.","L":"Schools nurture future citizens—by teaching care for the Earth early, they build a generation that acts responsibly."},{"P":"Families and communities can work together to reduce waste and promote sustainable living.","E1":"Parents can model eco-friendly habits by bringing their own containers or shopping bags. Community groups can organise carpool programmes or tree-planting events. Town councils can set up recycling stations, while families can compost food waste at home. When people share tips and resources, it makes green living easier for everyone.","E2":"My neighbourhood installed a recycling machine that gives vouchers for returned bottles. My family uses it regularly, and neighbours often meet there to chat. It became both a green and social habit. On weekends, our RC holds workshops on upcycling old clothes into bags.","L":"When communities unite for the environment, they not only protect nature but also strengthen bonds between residents."}],"audio":{"read":"audio/ace-read-11.mp3","readTimes":[[[0.3,4.97],[5.57,8.39],[8.99,14.17]],[[15.27,18.66],[19.26,24.38],[24.98,28.85],[29.45,34.16]],[[35.26,41.57],[42.17,46.44],[47.04,49.26]]],"ans":["audio/ace-ans-11-1.mp3","audio/ace-ans-11-2.mp3","audio/ace-ans-11-3.mp3","audio/ace-ans-11-4.mp3"],"ansTimes":[[[0.25,4.76],[5.06,30.72],[31.02,47.93],[48.23,55.54]],[[0.25,5.68],[5.98,33.97],[34.27,52.24],[52.54,60.19]],[[0.25,5.63],[5.93,33.54],[33.84,51.86],[52.16,59.72]],[[0.25,5.91],[6.21,27.11],[27.41,44.79],[45.09,52.52]]]}},{"n":12,"title":"National Day Parade","theme":"sg","img":"img/ace-12.jpg","reading":{"instruction":"You are reading a reflection written after attending the National Day Parade. Read with a proud, heartfelt tone.","paragraphs":["This year's National Day Parade was a memorable experience for me. The moment the crowd sang the national anthem, I felt a strong sense of pride to be Singaporean. Watching the soldiers march in perfect rhythm and the performers dance under the bright lights reminded me of how much effort goes into celebrating our nation's achievements.","The parade also showed how people from different backgrounds come together as one. Whether it was the firefighters, students, or volunteers, everyone played a part in honouring our home.","The fireworks at the end lit up the sky in red and white, and I thought about how far our country has come since independence. It reminded me that being proud of Singapore also means contributing to it—by studying hard, being kind, and doing our part for the community."]},"questions":["What is happening in this picture, and what does it represent?","Why do you think celebrating National Day is important?","How can students show their love for Singapore beyond National Day?","What do you think makes Singapore a special country?"],"answers":[{"P":"The picture shows Singaporeans waving flags while watching the National Day Parade fireworks.","E1":"It represents national pride, unity, and celebration. The red-and-white colours remind everyone of our shared identity. Events like the parade bring people together to appreciate peace, progress, and the hard work of our pioneers. It also helps young Singaporeans understand the meaning of independence and community spirit. The picture shows how unity can be joyful and powerful at the same time.","E2":"I attended the parade once at the Marina Bay floating platform. When the fireworks began, everyone around me—strangers and friends—cheered together. I realised how much Singapore means to all of us, even if we come from different cultures.","L":"The picture symbolises how Singapore's strength lies in unity and shared pride."},{"P":"It reminds us of our history, achievements, and the values that keep Singapore strong.","E1":"Celebrating National Day honours the sacrifices of past generations and shows gratitude for what we enjoy today. It teaches younger citizens to value peace, hard work, and unity. Such events also build national identity by connecting people emotionally to their country. Watching the flag fly high reminds everyone that freedom and safety should never be taken for granted.","E2":"My grandparents often share stories about life in Singapore before independence. They say things were not always easy, but people worked hard and supported each other. Listening to them during National Day makes the celebration more meaningful for me.","L":"National Day celebrations help every Singaporean remember the past, appreciate the present, and work towards a better future together."},{"P":"By being responsible, respectful, and contributing positively to society.","E1":"Patriotism is not only shown through singing songs—it is reflected in daily actions. Students can study diligently, help others, and care for public spaces. Being kind to people from all walks of life also strengthens harmony. Small acts, like thanking frontline workers or picking up litter, reflect care for the nation.","E2":"My class once wrote thank-you cards to MRT staff and cleaners for keeping Singapore running smoothly. The workers were touched, and our teacher said such gestures show true appreciation for our country.","L":"Loving Singapore means serving it in small, sincere ways every day."},{"P":"Singapore is special because of its diversity, safety, and strong sense of unity.","E1":"People of different races and religions live peacefully together, showing respect and cooperation. Our clean environment, efficient transport, and good education system make life comfortable. But what truly stands out is how citizens trust and support one another during challenges, such as pandemics or natural disasters. The nation's success comes from teamwork and shared responsibility.","E2":"During the COVID-19 period, I saw neighbours deliver food to those in quarantine and doctors working tirelessly. It made me proud to be part of a caring community.","L":"Singapore is unique not just for its achievements but for the unity and kindness that hold its people together."}],"audio":{"read":"audio/ace-read-12.mp3","readTimes":[[[0.3,3.95],[4.55,10.16],[10.76,20.32]],[[21.42,25.68],[26.28,32.13]],[[33.23,40.52],[41.12,49.61]]],"ans":["audio/ace-ans-12-1.mp3","audio/ace-ans-12-2.mp3","audio/ace-ans-12-3.mp3","audio/ace-ans-12-4.mp3"],"ansTimes":[[[0.25,5.98],[6.28,30.38],[30.68,45.05],[45.35,50.45]],[[0.25,5.23],[5.53,29.12],[29.42,44.52],[44.82,53.17]],[[0.25,5.38],[5.68,25.87],[26.17,38.52],[38.82,43.35]],[[0.25,5.59],[5.89,29.5],[29.8,39.84],[40.14,46.62]]]}},{"n":13,"title":"Playground Courtesy and Safety","theme":"kind","img":"img/ace-13.jpg","reading":{"instruction":"You are reading a class discussion summary on playground safety. Read with a thoughtful and concerned tone.","paragraphs":["Playgrounds are where children play, learn, and make friends. They are meant to be safe and fun spaces. However, accidents can happen when children push, run recklessly, or use equipment wrongly. Keeping playgrounds safe means being considerate of others and following basic rules.","We should wait our turn for swings and slides, avoid shouting too loudly, and look out for younger children. Parents and older siblings can help remind others gently. Small actions, like returning toys or picking up litter, make the playground enjoyable for everyone.","When we play safely and show care, we protect not just ourselves but others too. A safe playground is one where laughter fills the air—and everyone goes home happy and unhurt."]},"questions":["What is happening in this picture, and what message does it give?","Why is it important to practise safety and courtesy when playing?","What can parents and teachers do to promote safe play?","How can students help keep their playground clean and safe?"],"answers":[{"P":"The picture shows children playing on a crowded playground; one child is climbing the slide while others wait below.","E1":"It highlights how accidents can happen when safety rules are ignored. The child climbing the wrong way might fall or bump into someone sliding down. It reminds us that fun should never come at the cost of safety. The picture encourages patience, turn-taking, and awareness of surroundings. When everyone follows the rules, the playground becomes a joyful place instead of a risky one.","E2":"At my neighbourhood playground, a younger boy once ran across the swing path and got knocked lightly. Thankfully, he was fine, but the incident made all of us more careful. After that, older kids started reminding the younger ones about safety.","L":"The picture teaches that good manners and patience make playtime safe and enjoyable for everyone."},{"P":"Because safety prevents injuries and courtesy builds friendships.","E1":"Playgrounds are shared spaces where everyone deserves fun and respect. Being rough or selfish causes tension and accidents. When children help one another and wait their turn, they show maturity and empathy. Practising safety also teaches responsibility—skills that apply in classrooms and communities too.","E2":"My friend once gave up his swing for a younger child who was waiting. The little boy smiled, and soon both were laughing together on the seesaw. That small act of kindness made everyone's day happier.","L":"Courtesy and safety go hand in hand—they make playgrounds not only fun but also caring spaces."},{"P":"They can guide, supervise, and model good behaviour.","E1":"Parents can set clear boundaries—like no pushing or climbing equipment wrongly—and explain why the rules matter. Teachers can use PE lessons to reinforce sharing and teamwork. Adults who stay attentive also prevent fights or falls before they happen. Encouraging gentle reminders instead of scolding builds cooperation.","E2":"At my school carnival, teachers stationed themselves near inflatables to control queues. They praised students who followed instructions first instead of shouting at those who didn't. As a result, everyone behaved better and had fun.","L":"When adults model respect and patience, children naturally learn to play safely and kindly."},{"P":"By cleaning up after themselves and looking out for hazards.","E1":"Students can throw rubbish properly, avoid damaging equipment, and report broken swings or sharp objects to adults. They can also remind friends politely not to litter. Helping to repaint or decorate the playground during community events builds ownership. When children take pride in their playground, they protect it more carefully.","E2":"During a neighbourhood project, my class cleaned the playground and painted cheerful murals. We felt proud seeing younger children enjoy the space we improved. That experience taught us that small contributions can make a big difference.","L":"Caring for the playground shows that safety, cleanliness, and kindness begin with every individual's effort."}],"audio":{"read":"audio/ace-read-13.mp3","readTimes":[[[0.3,3.27],[3.87,6.28],[6.88,12.15],[12.75,17.72]],[[18.82,25.0],[25.6,29.04],[29.64,35.59]],[[36.69,41.38],[41.98,47.55]]],"ans":["audio/ace-ans-13-1.mp3","audio/ace-ans-13-2.mp3","audio/ace-ans-13-3.mp3","audio/ace-ans-13-4.mp3"],"ansTimes":[[[0.25,7.09],[7.39,30.04],[30.34,44.9],[45.2,51.07]],[[0.25,4.14],[4.44,23.85],[24.15,36.03],[36.33,42.72]],[[0.25,3.59],[3.89,25.02],[25.32,39.4],[39.7,45.24]],[[0.25,3.84],[4.14,24.93],[25.23,38.83],[39.13,45.52]]]}},{"n":14,"title":"Caring for Pets","theme":"family","img":"img/ace-14.jpg","reading":{"instruction":"You are reading a reflection you wrote for your school's newsletter after helping at an animal shelter. Read with a warm and sincere tone that shows compassion.","paragraphs":["Last weekend, I volunteered at a nearby animal shelter with my classmates. We helped clean cages, refill water bowls, and walk the dogs. At first, I was nervous because some of the dogs barked loudly, but soon I realised they were simply excited to see people.","As I brushed a small brown dog named Lucky, I felt his tail wag happily. The volunteers told me that many pets are abandoned when owners cannot care for them properly. It made me realise that having a pet means taking responsibility every single day—not just playing when it's convenient.","Before leaving, I promised myself that if I ever have a pet, I will make sure to feed, train, and love it well. Caring for animals teaches us kindness, patience, and gratitude for the unconditional love they give."]},"questions":["What is happening in this picture, and what does it tell you about being a pet owner?","Why do some families choose to adopt instead of buy pets?","What are some challenges pet owners may face, and how can they overcome them?","How can schools help students learn compassion towards animals?"],"answers":[{"P":"The picture shows a boy feeding his dog while another family member refills its water bowl.","E1":"It reminds us that caring for a pet is a shared responsibility. Pets depend entirely on humans for food, exercise, and affection. Feeding them regularly, keeping them clean, and bringing them for check-ups are all part of responsible ownership. The image also shows that pets become part of the family when everyone helps. Neglecting them, even for a few days, can cause discomfort or illness.","E2":"My neighbour owns a golden retriever, and the whole family takes turns walking it daily. They also make homemade treats from leftover chicken bones, showing love while avoiding waste. Their dog is friendly, healthy, and always eager to greet people.","L":"The picture teaches that being a pet owner means caring with consistency, not just affection."},{"P":"Families adopt because they want to give abandoned animals a second chance at happiness.","E1":"Many animals end up in shelters through no fault of their own—some owners move house, while others cannot handle the responsibility. Adoption helps reduce the number of homeless animals and saves lives. It also teaches children empathy and compassion, showing that love matters more than appearances or breed. Adopting instead of buying supports shelters and discourages illegal pet breeding.","E2":"My cousin adopted a mixed-breed cat from a shelter. At first, the cat was shy, but with patience and care, it became affectionate. She often says it's rewarding to see the cat trust people again. The family also saved money that would have gone to a breeder.","L":"Adoption is a kind choice—it shows that every animal deserves love and a home."},{"P":"Pet owners face challenges like time management, cleanliness, and financial costs.","E1":"Feeding, walking, and grooming pets require daily effort. Medical bills and food expenses can be high, especially during emergencies. Some pets misbehave or damage furniture when left alone. Responsible owners plan ahead, set routines, and train their pets patiently. Families can share duties to make it easier.","E2":"When my aunt first got a puppy, it chewed her slippers and barked at night. Instead of scolding it, she attended a free training class. Within a month, the puppy became calmer and learnt to sit quietly. The family now says the effort was worth it.","L":"Pet ownership has challenges, but love, patience, and teamwork make it fulfilling."},{"P":"Schools can teach compassion through education, experience, and example.","E1":"Teachers can invite animal welfare groups to share about responsible ownership. Art or writing competitions about pets encourage empathy. Organising visits to shelters lets students interact directly with animals. Even classroom discussions about kindness to stray cats or birds make students think deeper. Schools that model compassion—by keeping the campus clean and avoiding harm to animals—set strong examples.","E2":"My school invited an SPCA volunteer who shared how neglected animals recover with care. We also collected old towels and toys for shelters. The experience made me realise kindness goes beyond humans—it includes every living being.","L":"When schools nurture empathy, students grow into citizens who care for all forms of life."}],"audio":{"read":"audio/ace-read-14.mp3","readTimes":[[[0.3,5.14],[5.74,9.48],[10.08,16.95]],[[18.05,22.67],[23.27,28.52],[29.12,36.08]],[[37.18,43.36],[43.96,50.02]]],"ans":["audio/ace-ans-14-1.mp3","audio/ace-ans-14-2.mp3","audio/ace-ans-14-3.mp3","audio/ace-ans-14-4.mp3"],"ansTimes":[[[0.25,5.89],[6.1
