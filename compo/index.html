<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#d9a441"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Story Garden"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-180.png"><link rel="manifest" href="manifest.json"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>COMPO English Story Garden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Layout: a fantasy "dragon tribes" map. Parchment ground, four tribe colours, one story mountain per tale. */
:root{
  --bg:#f4ecdc; --bg2:#eadfca; --card:#fffaf1; --fg:#2d2340; --muted:#6f6380; --line:#dccfb6; --shadow:0 8px 24px rgba(72,48,20,.12);
  --gold:#d9a441; --sky:#cfe6f2; --snow:#ffffff;
  --bonds:#e2566d; --bonds-soft:#fbe3e7; --growth:#4f9d5c; --growth-soft:#dff1e1; --guts:#3b8fb5; --guts-soft:#dbeef7; --fixes:#ee8a2f; --fixes-soft:#fde9d4;
  --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1b1527; --bg2:#241c33; --card:#2a2140; --fg:#f3ead9; --muted:#b3a7c4; --line:#3d3354; --shadow:0 8px 24px rgba(0,0,0,.35);
  --gold:#f0c060; --sky:#2b3a5a; --snow:#e9eef7;
  --bonds:#ff7a90; --bonds-soft:#4a2634; --growth:#6fc47c; --growth-soft:#20392a; --guts:#5fb3d9; --guts-soft:#1f3545; --fixes:#ffa352; --fixes-soft:#45301d;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#1b1527; --bg2:#241c33; --card:#2a2140; --fg:#f3ead9; --muted:#b3a7c4; --line:#3d3354; --shadow:0 8px 24px rgba(0,0,0,.35);
  --gold:#f0c060; --sky:#2b3a5a; --snow:#e9eef7;
  --bonds:#ff7a90; --bonds-soft:#4a2634; --growth:#6fc47c; --growth-soft:#20392a; --guts:#5fb3d9; --guts-soft:#1f3545; --fixes:#ffa352; --fixes-soft:#45301d;
  color-scheme:dark; }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:radial-gradient(circle at 20% 0%, rgba(217,164,65,.14), transparent 40%), radial-gradient(circle at 90% 100%, rgba(59,143,181,.12), transparent 45%);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1.1rem;text-decoration:none;white-space:nowrap}
.brand svg{width:34px;height:34px}
.nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.nav a{text-decoration:none;font-family:var(--display);font-weight:600;font-size:.9rem;padding:6px 12px;border-radius:999px;border:1px solid transparent;color:var(--muted)}
.nav a.on{background:var(--card);border-color:var(--line);color:var(--fg)}
.nav a:hover{color:var(--fg)}
@media (max-width:640px){.nav a .navname{display:none}.nav a{padding:6px 9px;font-size:1rem}.brand{font-size:1rem}.brand svg{width:28px;height:28px}}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:center;padding-block:18px 8px}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:700;background:linear-gradient(100deg,var(--fixes),var(--bonds) 45%,var(--guts));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:1.05rem;color:var(--muted);max-width:52ch;margin:10px 0 0}
.hero .scene{aspect-ratio:4/3;max-width:100%;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);background:linear-gradient(180deg,var(--sky),var(--bg2))}
.hero .scene svg{width:100%;height:100%;display:block}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero .scene{order:-1;max-width:420px}}

/* tribe grid */
.tribes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.tribe{position:relative;display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:18px;padding:16px 16px 14px;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s ease}
.tribe:hover{transform:translateY(-3px)}
.tribe .drg{width:84px;height:84px;align-self:flex-start;margin-top:-4px}
.tribe h3{font-size:1.25rem;font-weight:700}
.tribe .tribename{font-family:var(--display);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--c);font-weight:700}
.tribe p{margin:0;color:var(--muted);font-size:.92rem}
.tribe .paths{font-size:.82rem}
.tribe .paths b{color:var(--fg)}
.tribe .count{position:absolute;top:14px;right:14px;background:var(--soft);color:var(--c);font-family:var(--display);font-weight:700;font-size:.8rem;padding:4px 10px;border-radius:999px}

.section{margin-top:34px}
.section h2{font-size:1.5rem;font-weight:700;margin-bottom:6px}
.section .lead{color:var(--muted);margin:0 0 14px;max-width:62ch}

/* explainer */
.explain{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.explain .st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.explain .st .ico{font-size:1.6rem}
.explain .st b{display:block;font-family:var(--display);font-size:.9rem;margin-top:4px}
.explain .st span{font-size:.78rem;color:var(--muted)}
@media (max-width:720px){.explain{grid-template-columns:repeat(2,1fr)}.explain .st:last-child{grid-column:span 2}}

/* bank promo */
.bankpromo{display:flex;gap:16px;align-items:center;background:linear-gradient(120deg,var(--card),var(--bg2));border:1px dashed var(--gold);border-radius:18px;padding:16px 18px;flex-wrap:wrap}
.bankpromo .txt{flex:1;min-width:220px}
.bankpromo h3{font-size:1.2rem}
.bankpromo p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;border-radius:999px;padding:9px 16px;border:1px solid var(--line);background:var(--card);text-decoration:none;box-shadow:0 2px 0 var(--line)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg);box-shadow:none}
.btn:focus-visible,.nav a:focus-visible,.zone:focus-visible,.heart:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* family page */
.famhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:22px;padding:18px 20px;border:1px solid var(--line)}
.famhead .drg{width:120px;height:120px;flex:none}
.famhead .t{flex:1;min-width:240px}
.famhead h1{font-size:clamp(1.6rem,4vw,2.3rem);color:var(--c)}
.famhead p{margin:6px 0 0;color:var(--fg);max-width:60ch}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-family:var(--display);font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.chip.c{color:var(--c);border-color:var(--c)}
.storylist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:18px}
.scard{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:16px;padding:14px 16px;text-decoration:none;box-shadow:var(--shadow);position:relative;min-width:0}
.scard h3{font-size:1.15rem;font-weight:700;padding-right:44px}
.scard .theme{margin:0;color:var(--muted);font-size:.9rem}
.scard .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);align-items:center}
.scard .meta .mini{display:inline-flex;align-items:center;gap:4px;background:var(--bg2);border-radius:999px;padding:2px 8px}
.heart{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:1.1rem;transition:transform .15s}
.heart:hover{transform:scale(1.1)}
.heart.on{background:var(--bonds-soft);border-color:var(--bonds)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}

/* story page */
.crumbs{font-size:.85rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.crumbs a{text-decoration:none}
.storyhead{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.storyhead h1{font-size:clamp(1.6rem,4.5vw,2.5rem);font-weight:700}
.storyhead .topic{margin:6px 0 0;color:var(--muted);font-style:italic}
.storyhead .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.storyhead .heart{position:static}
@media (max-width:560px){.storyhead{grid-template-columns:1fr}}
.player-hint{margin-top:12px;font-size:.88rem;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
.listenbar{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.listenbar .lb{font-family:var(--display);font-weight:700;font-size:1.05rem;border-radius:999px;padding:10px 18px;border:2px solid var(--fg);background:var(--fg);color:var(--bg);min-height:46px;display:inline-flex;align-items:center;gap:6px}
.listenbar .lb.on{background:var(--gold);border-color:var(--gold);color:#2d2340}
.listenbar .ls{font-family:var(--display);font-weight:700;font-size:1rem;border-radius:999px;padding:10px 16px;border:2px solid var(--line);background:var(--card);min-height:46px}
.listenbar .ls[disabled]{opacity:.45;cursor:default}
.listenbar .lt{font-size:.85rem;color:var(--muted);flex:1 1 200px;min-width:0}
.player .pbig{flex:none;width:42px;height:42px;border-radius:50%;border:none;background:var(--fg);color:var(--bg);font-size:1.05rem;display:grid;place-items:center}
.player .pbig.on{background:var(--gold);color:#2d2340}
.player{background:var(--card);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px}
.player[hidden]{display:none}
.player .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:10px;min-width:0}
@media (max-width:480px){.player .lbl{display:none}}
.player .lbl{font-family:var(--display);font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:6px;min-width:0;flex:0 1 auto;max-width:40%}
.player .lbl .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.player audio{flex:1 1 260px;min-width:0;height:40px;max-width:100%}
.player .none{color:var(--muted);font-size:.88rem;flex:1 1 200px}
.player .retry{font-family:var(--display);font-weight:600;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:5px 12px;font-size:.85rem}


.mountain{margin-top:18px;background:linear-gradient(180deg,var(--sky) 0%,var(--bg2) 72%,var(--bg2) 100%);border:1px solid var(--line);border-radius:22px;padding:14px 10px 4px;position:relative;overflow:hidden}
.themeband{display:flex;justify-content:center;padding:0 6px}
.themeband .rib{display:inline-flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:8px 14px;max-width:100%;box-shadow:var(--shadow)}
.themeband .rib .k{font-family:var(--display);font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;white-space:nowrap}
.themeband .rib .v{font-family:var(--display);font-weight:600;font-size:1rem;line-height:1.3}
.mountain svg{width:100%;height:auto;display:block;max-width:100%}
.zone{cursor:pointer}
.zone .seg{transition:filter .2s,opacity .2s}
.zone:not(.on) .seg{opacity:.82}
.zone.on .seg{filter:drop-shadow(0 0 10px rgba(255,255,255,.7))}
.zone .pin circle.bg{fill:var(--card);stroke-width:4}
.zone.on .pin circle.bg{stroke-width:6}
.zone .pin text{font-family:var(--display);font-weight:700;fill:var(--fg)}
.zone .lab{font-family:var(--display);font-weight:700;font-size:15px;fill:var(--fg);paint-order:stroke;stroke:var(--card);stroke-width:5px;stroke-linejoin:round}
.zone .num{font-family:var(--display);font-weight:700;font-size:12px;fill:var(--muted);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.zone .emo{font-size:30px}
.zone:hover .pin circle.bg{stroke-width:6}
.zonehint{text-align:center;font-size:.8rem;color:var(--muted);padding:4px 0 8px}

.stage{margin-top:14px;display:grid;grid-template-columns:150px 1fr;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;border-left:8px solid var(--c)}
.stage .pic{display:grid;place-items:center;font-size:2.6rem;line-height:1.1;text-align:center;background:var(--soft);border-radius:14px;padding:12px 8px;letter-spacing:.05em}
.stage .pic small{display:block;font-size:.7rem;font-family:var(--display);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.stage h3{font-size:1.25rem;font-weight:700}
.stage .hook{font-family:var(--display);font-size:1.05rem;color:var(--c);font-weight:600;margin:2px 0 6px}
.stage p{margin:0 0 8px}
.stage .trick{background:var(--bg2);border-radius:12px;padding:8px 12px;font-size:.9rem;display:flex;gap:8px;align-items:flex-start}
.stage .trick b{font-family:var(--display);white-space:nowrap}
.stage .nav2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.stage .nav2 button{border-radius:999px;border:1px solid var(--line);background:var(--card);padding:6px 12px;font-family:var(--display);font-weight:600}
.stage .nav2 button.go{background:var(--c);color:#fff;border-color:var(--c)}
@media (max-width:560px){.stage{grid-template-columns:1fr}.stage .pic{font-size:2.2rem}}

.reader{margin-top:28px}
.reader .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.reader .tools .tog{font-family:var(--display);font-weight:600;font-size:.85rem;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:6px 12px}
.reader .tools .tog.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.part{display:grid;grid-template-columns:150px 1fr;gap:14px;margin-top:14px}
.part .tag{position:sticky;top:64px;align-self:start;display:flex;flex-direction:column;gap:4px;background:var(--soft);border-radius:12px;padding:10px 12px;border-left:5px solid var(--c)}
.part .tag b{font-family:var(--display);font-size:.95rem;display:block}
.part .tag>div{display:flex;flex-direction:column}
.part .tag span{font-size:1.6rem;line-height:1.1}
.part .tag small{color:var(--muted);font-size:.72rem;font-family:var(--display);letter-spacing:.08em;text-transform:uppercase}
.part .txt{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:1.03rem;line-height:1.75;max-width:70ch}
.part .txt p{margin:0 0 .9em}
.part .txt p:last-child{margin-bottom:0}
.part.highlight .txt{box-shadow:0 0 0 3px var(--c)}
@media (max-width:560px){.part{grid-template-columns:1fr}.part .tag{position:static;flex-direction:row;align-items:center}.part .tag span{font-size:1.3rem}}
.v{background:linear-gradient(transparent 60%,var(--soft) 60%);border-bottom:2px dotted var(--c);cursor:help;position:relative;font-weight:700}
.v::after{content:attr(data-d);position:absolute;left:0;bottom:calc(100% + 6px);z-index:5;background:var(--fg);color:var(--bg);font-weight:400;font-size:.82rem;line-height:1.35;padding:8px 10px;border-radius:10px;width:max-content;max-width:min(260px,70vw);display:none;pointer-events:none;box-shadow:var(--shadow)}
.v:hover::after,.v:focus::after,.v.open::after{display:block}
body.novocab .v{background:none;border:none;font-weight:inherit;cursor:text}
body.novocab .v::after{display:none}
.vocab{margin-top:26px}
.vocab ol{columns:2;column-gap:28px;padding-left:20px;margin:8px 0 0}
.vocab li{break-inside:avoid;margin-bottom:6px;font-size:.95rem}
.vocab li b{color:var(--c)}
@media (max-width:640px){.vocab ol{columns:1}}
.nextprev{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}

/* bank */
.bankhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(120deg,var(--card),var(--bg2));border:2px solid var(--gold);border-radius:22px;padding:18px 20px}
.bankhead h1{font-size:clamp(1.5rem,4vw,2.2rem)}
.bankhead input{font:inherit;font-family:var(--display);font-size:1.4rem;font-weight:700;border:none;border-bottom:2px dashed var(--gold);background:transparent;color:var(--fg);width:min(260px,60vw);padding:2px 4px}
.bankhead input:focus{outline:none;border-bottom-style:solid}
.bankhead p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.bankhead .egg{font-size:3rem}
.bankfam{margin-top:22px}
.bankfam h2{display:flex;align-items:center;gap:10px;font-size:1.25rem}
.bankfam h2 .d{width:40px;height:40px}
.bankfam h2 .cnt{margin-left:auto;font-size:.85rem;color:var(--muted);font-weight:600}
.bankfam .storylist{margin-top:10px}
.slot{border:2px dashed var(--line);border-radius:16px;min-height:96px;display:grid;place-items:center;color:var(--muted);font-size:.9rem;text-decoration:none;text-align:center;padding:12px}
.slot:hover{border-color:var(--c);color:var(--c)}
.note{margin-top:8px;font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-family:var(--display);font-weight:600;opacity:0;transition:all .25s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mine{background:var(--gold);color:#2d2340;font-family:var(--display);font-weight:700;font-size:.72rem;padding:2px 8px;border-radius:999px}
/* levels */
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.lv{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:10px 6px;font-family:var(--display);font-weight:700;font-size:1rem;transition:transform .15s}
.lv small{font-family:var(--body);font-weight:600;font-size:.72rem;color:var(--muted)}
.lv.on{border-color:var(--gold);background:linear-gradient(180deg,var(--card),var(--bg2));box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 30%,transparent)}
.lv.soon{opacity:.75}
.lv:hover{transform:translateY(-2px)}
@media (max-width:480px){.levels{grid-template-columns:repeat(2,1fr)}}
.pathgroup{margin-top:22px}
.pathh{font-size:1.15rem;display:flex;align-items:center;gap:8px;color:var(--c)}
.pathh span{font-size:.8rem;background:var(--bg2);color:var(--muted);border-radius:999px;padding:2px 9px}
.pathgroup .storylist{margin-top:10px}
.banklevel{margin-top:26px;padding-top:6px;border-top:2px dashed var(--line)}
.lvh{font-size:1.4rem}
.bankfam h3{display:flex;align-items:center;gap:10px;font-size:1.15rem}

<script>

];
const BUILTIN = [{"id": "more-than-i-wished-for", "num": 1, "title": "More Than I Wished For", "family": "bonds", "path": "Invisible Hero", "source": "W@W PSLE Model Compo Vol.3 · No. 1", "topic": "Write a composition of at least 150 words about a surprise.", "theme": "Feeling forgotten? The people who love you may be quietly planning a surprise.", "audio": "1", "pov": "first", "words": 741, "stages": [{"key": "setting", "paras": [0], "pic": "🎂✨😟", "hook": "Birthday dreams… then a creeping worry.", "summary": "A week before the narrator's twelfth birthday, they can almost taste the chocolate cake and hear their friends laughing. But as the day gets closer, a sense of disappointment starts to creep in.", "trick": "Opens with the senses (‘taste the cake’, ‘hear the raucous laughter’) and then plants a hint of trouble (‘disappointment began to encroach’) to pull the reader in."}, {"key": "rising", "paras": [1, 2, 3, 4, 5], "pic": "📱😢👴", "hook": "Everyone is busy. Even Emma. Only Grandpa listens.", "summary": "Best friend Emma, then Mum, Dad, brother Jake and Grandmother all say they cannot come. The narrator cries to Grandpa in Australia over a video call, and he gently says that being let down does not mean you are not loved. The birthday dawns grey and stormy – until the doorbell rings.", "trick": "Starts a paragraph with dialogue (‘What? You can’t make it…’) and makes the stormy weather mirror the narrator's mood (‘a perfect mirror for my mood’)."}, {"key": "climax", "paras": [6, 7, 8, 9, 10], "pic": "🎉🚪👴", "hook": "SURPRISE! Then… Ding! Grandpa at the door.", "summary": "The door bursts open with a ‘Surprise!’ – the whole family and Emma are there with balloons, banners and a chocolate cake. Emma admits her prank and Jake looks like the mastermind. Then the doorbell chimes again, and when the narrator wrenches it open, it is Grandpa, all the way from Australia.", "trick": "Builds a double twist with a cliffhanger dash (‘when-’), a one-word paragraph (‘Ding!’) and a one-word shout (‘Grandpa!’)."}, {"key": "falling", "paras": [11], "pic": "🤗💓😭", "hook": "Heart leaps. Joy floods in.", "summary": "The narrator's heart leaps at the sight of Grandpa. Disbelief and overwhelming joy rush through them.", "trick": "Shows feelings through the body (‘heart leaped’, ‘joy coursing through my veins’) instead of naming them."}, {"key": "ending", "paras": [12], "pic": "🎁😊🎂", "hook": "The best surprise birthday ever.", "summary": "With tears in their eyes, the narrator runs into Grandpa's arms and declares that this is the best surprise birthday party ever.", "trick": "Ends on a spoken line that echoes the topic word ‘surprise’ and ties back to the title."}], "vocab": [{"w": "decadent", "d": "rich and luxurious in a self-indulgent way"}, {"w": "raucous", "d": "loud and unpleasant"}, {"w": "lancing", "d": "piercing or cutting sharply"}, {"w": "obligation", "d": "something that you must do because of a law, rule, promise, or because it is morally right"}, {"w": "commiserated", "d": "expressed sympathy for someone’s unhappiness or disappointment"}, {"w": "confidant", "d": "a person you trust and share your feelings and secrets with"}, {"w": "weathered", "d": "worn by long exposure to the atmosphere, or showing the effects of age and experience"}, {"w": "dejected", "d": "unhappy, disappointed, or without hope"}, {"w": "nonchalance", "d": "a calm and relaxed way of behaving, showing that you are not worried or excited"}, {"w": "stupor", "d": "a state of near-unconsciousness or insensibility"}, {"w": "cacophony", "d": "a harsh, discordant mixture of sounds"}, {"w": "exuberant", "d": "full of energy, excitement, and cheerfulness"}, {"w": "tantalizing", "d": "something that causes desire or interest, especially something that remains just out of reach"}, {"w": "jubilation", "d": "a feeling of great happiness and triumph"}, {"w": "averting", "d": "turning away your eyes or thoughts to avoid something"}], "paras": ["It was barely a week before my twelfth birthday, and anticipation was bubbling incessantly within me. I could already taste the cake upon my tongue, the decadent chocolate ganache and creamy frosting. I could hear the raucous laughter of my friends, echoing throughout the hall, and feel the warmth of my loved ones enveloping me. However, as the day rapidly approached, a sense of disappointment began to encroach on my good mood.", "“What? You can’t make it to my birthday party?” I shrieked through the phone mouthpiece, disappointment lancing through my heart.", "My best friend, Emma, had just broken the news that she was unable to attend my birthday party. However, it was not just her. My parents were usually busy with work, and my older brother Jake had football practice. My grandmother, who always dotes on me, also had a doctor’s appointment she could not reschedule. Everyone I loved seemed to have some sort of obligation on that day, virtually abandoning me on my birthday. I could not help but feel that the world was conspiring against me.", "Consumed by gloom, I sought solace in my favourite person in the whole world: my grandfather. “Oh dear,” he commiserated in a gentle tone and listened patiently as I poured my heart out to him. My grandfather was my confidant, always lending a listening ear even across the thousands of miles where he lived in Australia. My phone screen was alit with his toothless grin, even as his weathered face softened with empathy. I struggled through my tears and snot, as he nodded his head in understanding. “Sometimes, life does not always turn out the way we want it to, but it does not mean you’re not loved!” He consoled me, seeking to soothe my dejected heart.", "Our conversation did help in providing some comfort, but it did not completely erase the despair of possibly spending my birthday alone. I compelled my heart and resigned myself to a quiet birthday, trying to bury my disappointment beneath work and forced nonchalance.", "The day of my birthday dawned dark and grey, as the skies clapped with thunder and lightning, a perfect mirror for my mood. I trudged through the empty house monotonously, the weight of a disappointing birthday dragging me down. Just then, the chiming of the doorbell aroused me from my stupor. I wondered who it was, as my family was not due home for another few hours. Curiosity spiking, I opened the door.", "“Surprise!” A cacophony of colours and cheers assaulted me. I stood dumbfounded, staring into the faces of my family and loved ones, whose faces were painted with exuberant smiles and twinkling eyes. I was filled with confusion, mingled with disbelief as they ushered me into the living room, balloons and streamers tailing behind them. In a matter of minutes, and under the strict supervision of Father, the backdrop for a birthday party was assembled, replete with confetti, banners, and streamers. The table took centre stage, upon which a tantalizing chocolate cake was mounted in the middle.", "“Happy Birthday!” they chorused, adding to the jubilation that was quickly filling the entire house. My heart swelled a hundredfold as I realised what they had orchestrated, a surprise birthday party just for me! Tears spilled down my cheeks, but this time, it was tears of relief and happiness. Emma crushed me in a bear hug, whispering her apologies for her prank, and handing me a beautifully wrapped present. Mother, Father, and Grandmother beamed at me with adoration, their eyes shining with love and adoration. Even Jake was sporting a mischievous grin, making me think that he was the mastermind behind all this. I went forward to give him a good thump on his back, when-", "Ding!", "The doorbell chimed again. I looked around the crowd, puzzled. Everyone I had expected was present, who could it be? I turned to Mother with confusion etched on my face but was taken aback to see her smiling slyly at Father, who was averting his eyes from me. “Why don’t you get that?” Jake smirked, a knowing look blooming on his face. Unwilling to be in the dark any longer, I sprinted to the door and wrenched it open.", "“Grandpa!”", "My heart leaped at the sight of him, disbelief and overwhelming joy coursing through my veins.", "Tears pricked my eyes as I rushed into his arms and declared, “This is the best surprise birthday party ever!”"], "level": "psle"}, {"id": "taste-of-responsibility", "num": 2, "title": "A Taste of Responsibility", "family": "bonds", "path": "Invisible Hero", "source": "W@W PSLE Model Compo Vol.3 · No. 2", "topic": "Write a composition of at least 150 words about responsibility.", "theme": "Stepping up to help teaches you how much your parents quietly do for you.", "audio": "2", "pov": "first", "words": 603, "stages": [{"key": "setting", "paras": [0], "pic": "🌇🍳🤕", "hook": "Sunset, homework, a gasp – Mother is hurt.", "summary": "On an evening glowing orange and pink, the narrator hears a gasp from the kitchen. Mother has fallen and hurt her wrist while washing vegetables, and she cannot cook dinner on her own.", "trick": "Paints a calm, pretty scene (‘glow in orange and pink’) and then breaks it with a sudden sound (‘a subdued gasp’) to start the problem."}, {"key": "rising", "paras": [1, 2], "pic": "🔪🧅😰", "hook": "‘I'll take care of dinner.’ The knife feels heavy.", "summary": "The narrator volunteers to make dinner, and Mother, surprised and proud, talks them through the steps. Chopping onions with a heavy, sharp knife, their eyes sting and fingers quiver, but Mother's voice calms their frayed nerves.", "trick": "Shows nervousness through small details (‘my pulse raced’, ‘my fingers quivered a little’) instead of just saying ‘I was scared’."}, {"key": "climax", "paras": [3, 4], "pic": "🥕🔥💪", "hook": "Cut, dice, slice – confidence sizzles up.", "summary": "The narrator finds a rhythm with the bell peppers and carrots, standing a little taller with every cut. They mince ginger and garlic, toss everything into the sizzling pan, and Mother, hand on their shoulder, helps with the seasoning.", "trick": "A three-word sentence (‘Cut, dice, and slice.’) copies the chopping rhythm, and smells (‘aroma of the ginger and garlic’) bring the scene alive."}, {"key": "falling", "paras": [5], "pic": "🍽️😊✨", "hook": "Messy kitchen, proud eyes, ‘amazing job’.", "summary": "The kitchen is a mess of vegetable peels, but Mother's eyes shine with quiet triumph. They set the table together and Mother tells the narrator they did an amazing job.", "trick": "Contrasts the messy kitchen with Mother's shining eyes so the reader feels the pride has been earned."}, {"key": "ending", "paras": [6], "pic": "💝👩‍🍳🤝", "hook": "New respect for Mother. A promise to help.", "summary": "The narrator realises how much effort Mother puts into every meal. They feel glad to have helped and promise to do more in future.", "trick": "Ends with a reflection (‘newfound respect’) and a promise, linking straight back to the topic of responsibility."}], "vocab": [{"w": "indelible", "d": "not able to be forgotten or removed; permanent"}, {"w": "immersed", "d": "deeply engaged or absorbed in an activity or thought"}, {"w": "subdued", "d": "quiet, controlled, or restrained in manner or intensity"}, {"w": "wrenched", "d": "pulled or twisted suddenly and violently"}, {"w": "excruciation", "d": "intense physical or mental pain; extreme agony"}, {"w": "trepidatious", "d": "feeling nervous or fearful about something that might happen"}, {"w": "inundated", "d": "overwhelmed or flooded with things to deal with"}, {"w": "brandishing", "d": "waving something (especially a weapon or tool) in an excited or threatening way"}, {"w": "steeled myself", "d": "made myself feel strong or brave to face something difficult"}, {"w": "fitfully", "d": "in a way that is not continuous or steady; irregularly"}, {"w": "quivered", "d": "shook slightly with fast, small movements because of cold, fear, or strong emotion"}, {"w": "frayed nerves", "d": "feeling very tired, worried, or annoyed"}, {"w": "emanated", "d": "came out or flowed from a source"}, {"w": "strewn", "d": "scattered or spread messily over a surface or area"}, {"w": "shone with quiet triumph", "d": "figurative phrase meaning to show pride or success in a modest, restrained way"}], "paras": ["As the sun set, the sky outside the windows started to glow in orange and pink. That evening would be indelible in my memory for a long time. While I was immersed in completing my homework before dinnertime, I heard a subdued gasp coming from the kitchen. As I hurried inside to find out what happened, I saw Mother clutching her left wrist. Her face was wrenched in excruciation. Her wrist was sore and inflamed after she accidentally fell while washing the vegetables. It was clear that she would not be able to prepare dinner on her own.", "Seeing this, I volunteered to help with dinner preparation right away. “Mother, don't worry. I promised to take care of dinner tonight,” sounding as certain as I could. Mother's eyes glistened as she gave me a surprised and proud smile. She nodded gently and led me through the stages, her voice full of worry but her instructions clear. She seemed trepidatious at first, but not because she did not trust me. Rather, it was because she did not want me to feel inundated.", "My first task as a little kitchen helper was chopping the vegetables. My pulse raced at the thought of brandishing a knife, but I steeled myself to go through it. Although my mother had previously taught me how to chop vegetables, it felt very different this time. I could feel the knife was heavier in my grasp and that its blade was sharper than I imagined. I began with the onions. They had a strong aroma which made my eyes sting. I kept blinking fitfully. As I cut through the layers, my fingers quivered a little. Mother kept a tight eye on me and corrected as I went on. Her voice was comforting to my frayed nerves.", "I soon got into a rhythm as I continued with the bell peppers and carrots. Cut, dice, and slice. The rhythmic sound of the knife striking the wooden cutting board started to sound familiar. Every now and then I looked up at Mother, and she gave me a supportive grin. With every successful cut, my confidence grew, and I began to stand a bit taller. I came to understand that I was taking on a new role that would allow me to support and take care of my family, beyond just helping with dinner.", "The aroma of the ginger and garlic filled the kitchen, making my mouth salivate. I minced them very finely, keeping in mind Mother's famous words that the finishing touches would make all the difference in a dish's flavour. I felt excited with a newfound sense of purpose. As I threw the ingredients into the sizzling frying pan, a delightful aroma emanated from the cracking oil. With her right hand resting lightly on my shoulder, Mother helped me with the seasoning, pointing out which spices to use.", "By the time all the food was finally cooked, the kitchen was a mess. Vegetable peels were strewn in the sink and on the tabletop. Despite this, Mother's eyes shone with quiet triumph and appreciation as we sat down to dine after we had set the dining table together. \"You did an amazing job, sweetheart,\" Mother said warmly and gently. I felt a deep sense of satisfaction as I ate the dinner I had helped to prepare.", "That evening, I had a newfound respect for Mother. I did not know that she had to put in so much effort to prepare our meals each day. I was glad that I could be of help to her and I promised to help out more in future."], "level": "psle"}, {"id": "fifteen-steps-from-home", "num": 3, "title": "Fifteen Steps from Home", "family": "bonds", "path": "Invisible Hero", "source": "W@W PSLE Model Compo Vol.3 · No. 3", "topic": "Write a composition of at least 150 words about family bonding.", "theme": "Family bonding is simply being together, even in a soggy, laughing mess.", "audio": "3", "pov": "first", "words": 676, "stages": [{"key": "setting", "paras": [0, 1, 2], "pic": "⛺🙄🌇", "hook": "A tent in the backyard? Seriously?", "summary": "Ethan and his sister Grace grumble as they haul sleeping bags across the lawn. Mum and Dad are excitedly unfurling a navy-blue tent for a night of ‘bonding’, just fifteen steps from the kitchen door.", "trick": "Opens with complaining dialogue (‘I still don’t get it’) so we know the children's attitude straight away."}, {"key": "rising", "paras": [3, 4, 5], "pic": "🔨☕😄", "hook": "Crooked tent, Milo, Dad's frog stories.", "summary": "The family wrestles the tent up, slightly crooked. Inside they lay out lanterns and card games, Mum brings Milo and brownies, and Dad's stories about catching frogs make Ethan smile for real.", "trick": "A one-line dialogue paragraph (‘we’re officially off-grid for the night!’) and a short turning sentence (‘I smiled for real’) show the mood changing."}, {"key": "climax", "paras": [6, 7, 8, 9, 10], "pic": "☔💥😂", "hook": "Thunder. Rain. CRACK – the tent collapses!", "summary": "Thunder rumbles and rain drums on the canvas. A gust bends a pole, there is a loud crack, and the tent collapses on top of everyone. Grace shrieks, Ethan spits out grass, and suddenly the whole family is laughing in the mud.", "trick": "Short sentences (‘We froze.’ ‘Then another.’ ‘Then came a loud crack.’) speed up the action and build tension."}, {"key": "falling", "paras": [11], "pic": "🍕🛋️🧣", "hook": "Towels, leftover pizza, no phones.", "summary": "Soaked, the family dashes indoors. Wrapped in blankets with warm towels and reheated pizza, they retell the disaster like a grand adventure, TV off and phones untouched.", "trick": "A simile (‘like a fallen fortress’) and three short sentences (‘The television stayed off. No one touched their phones. We were just together.’) make the quiet moment land."}, {"key": "ending", "paras": [12, 13], "pic": "💡👨‍👩‍👧‍👦🏠", "hook": "Failed at camping. Succeeded at being a family.", "summary": "Sipping Milo, Ethan realises bonding is not about going far or making perfect memories, but about being together. They failed at backyard camping but succeeded at being a family.", "trick": "Ends with a balanced sentence (‘failed at backyard camping… succeeded at being a family’) that sums up the lesson in one line."}], "vocab": [{"w": "hoisting", "d": "to raise or lift something, sometimes using ropes or a machine"}, {"w": "trudged", "d": "to walk slowly and with heavy steps, typically because of exhaustion or harsh conditions"}, {"w": "groused", "d": "to complain about something in a bad-tempered but typically muted way"}, {"w": "enlisted", "d": "to ask for and get help or support from someone"}, {"w": "masquerading", "d": "to pretend or appear to be someone or something else"}, {"w": "precariously", "d": "in a way that is not securely held or in position and is likely to fall or collapse"}, {"w": "reminisced animatedly", "d": "to talk or write with enthusiasm about past experiences that you remember fondly"}, {"w": "unravelled in unexpected ways", "d": "to become clearer or to start to happen in a way that reveals hidden elements, often chaotically or unpredictably"}, {"w": "foreboding", "d": "a feeling that something very bad is going to happen"}, {"w": "buffeted", "d": "to strike repeatedly and with force"}, {"w": "a calamity wrapped in laughter", "d": "a disastrous or unfortunate event made bearable or humorous by shared laughter"}, {"w": "sodden", "d": "extremely wet or soaked through with liquid, especially water"}, {"w": "disheartened", "d": "having lost confidence or enthusiasm; discouraged"}, {"w": "catastrophe", "d": "a sudden event that causes great trouble or suffering"}, {"w": "epiphany", "d": "a moment of sudden and great understanding or realisation"}], "paras": ["“I still don’t get it,” I muttered, hoisting a thick sleeping bag across the prickly grass. “Why are we doing this when we have perfectly good beds inside?”", "My sister, Grace, trudged beside me, carrying a backpack filled with snacks, a torchlight, and extra clothes. She rolled her eyes.“ Mum and Dad said it’s for bonding,” she groused. “But seriously, who wants to squeeze into a tent when we have air-conditioning and Wi-Fi?”", "Ahead of us, our parents stood in the backyard, eyes gleaming as they unfurled a large navy-blue tent. The sun dipped below the horizon, casting long shadows across the lawn. A breeze stirred the leaves and the air smelled faintly of mosquito repellent. I sighed. This was not my idea of fun. Still, our parents looked so excited. I did not have the heart to object further.", "Despite our grumbling, we were soon enlisted into the operation. “Ethan, hold the pole steady!” Dad called, sweat dripping down his face as he hammered a peg into the soil. I gripped the pole while Mum secured the ropes. Grace flopped onto the ground, masquerading as helpful but secretly filming a “funny family camping fail” on her phone. Bit by bit, the tent came together. It was slightly crooked and it stood precariously. Our parents stepped back, smiling proudly.", "“Alright,” Mum announced, brushing her hands, “we’re officially off-grid for the night!”", "It felt silly. We were barely fifteen steps from the kitchen door, yet we were pretending to be in the wilderness. Inside the tent, we laid out sleeping bags, lanterns, and card games. Mum brought out a thermos of Milo and a container of brownies. As the sky darkened, we sat in a circle and reminisced animatedly. Laughter echoed through the yard as Dad talked about catching frogs in drains and getting chased by angry neighbours’ dogs. For the first time that evening, I smiled for real.", "Just as we were playing our third round of “Go Fish,” the night unravelled in unexpected ways and a foreboding rumble rolled across the sky. “Was that thunder?” Grace asked. We froze. Another rumble followed, louder. I felt a drop of rain on my wrist. Then another. Within seconds, rain poured down, drumming on the canvas roof.", "“Quick! Zip the tent up!” Dad shouted, crawling toward the entrance. Rain had already started seeping in from the corners.", "Before we could seal everything, a strong gust of wind slammed into the side of the tent. The fabric buffeted, and one of the poles bent at an awkward angle. Then came a loud crack. The structure buckled and collapsed, burying us in wet nylon and flailing limbs.", "“Aaaah!” Grace shrieked as the canvas covered her face. “I can’t breathe!”", "“Whose foot is this?” I sputtered, spitting out a blade of grass. Mum’s laughter rang out first, followed by Dad’s. In seconds, we were all laughing, caught in a calamity wrapped in laughter, even as the rain soaked our pyjamas and turned the backyard into a muddy mess.", "Sodden and disheartened, we dashed into the house, leaving the broken tent behind like a fallen fortress. Mum gave us warm towels while Dad reheated some leftover pizza. We gathered in the living room in dry clothes, wrapped in blankets, munching on greasy slices and recounting the catastrophe like it was a grand adventure. The television stayed off. No one touched their phones. We were just together.", "Later that night, as I sipped Milo and listened to Grace tell the story for the third time, epiphany struck. Family bonding was not about going somewhere far or making the perfect memory. It was about being there with one another. Whether we were laughing under a tent or groaning under one, we were still side by side. The mess, the rain, and the chaos had brought us closer than any holiday ever had.", "Looking back, I finally understood what Mum and Dad had wanted all along. We may have failed at backyard camping, but in that soggy, laughter-filled mess, we succeeded at being a family."], "level": "psle"}, {"id": "scratch-that-kept-me-awake", "num": 4, "title": "The Scratch That Kept Me Awake", "family": "guts", "path": "Leap of Faith", "source": "W@W PSLE Model Compo Vol.3 · No. 4", "topic": "Write a composition of at least 150 words about fear.", "theme": "Fear grows in your imagination – face it and it often shrinks to nothing.", "audio": "4", "pov": "first", "words": 648, "stages": [{"key": "setting", "paras": [0, 1], "pic": "⛺🏫📚", "hook": "Camping at school? With the ghost-story girl?", "summary": "The school field has become a campsite of neon green tents, and the narrator dreads a night without air-conditioning or their own bathroom. Tent-mate Mei Lin is already buried in a book of ghost stories.", "trick": "Rhetorical questions (‘Camping? Here?’) and a simile (‘like giant mushrooms after a rainstorm’) show the narrator's attitude while painting the scene."}, {"key": "rising", "paras": [2, 3, 4], "pic": "🌙👻🌬️", "hook": "Darkness falls. Mei Lin whispers: ‘Scary stories?’", "summary": "Night turns the school eerie, with creaking trees and an owl's hoot. A chill creeps in and Mei Lin launches into tales of haunted toilets and screams from the old science lab. The narrator's imagination runs wild – every rustle sounds like a lurking creature.", "trick": "Personifies the setting (‘the wind… sang a sinister lullaby’, ‘trees groaning’) so the surroundings feel alive and threatening."}, {"key": "climax", "paras": [5, 6], "pic": "🐾😨🐈", "hook": "Scratch, scratch… Peek. It's a cat.", "summary": "Mei Lin falls asleep, but the narrator hears a scratching outside the tent. Heart thudding and with no phone signal, they breathe slowly to calm down. Curiosity beats fear, they peek through the flap – and see a small furry cat in the moonlight.", "trick": "Fragments and very short sentences (‘No signal. Great. Just great.’ ‘In. Out.’) make the panic real, and the reveal is saved for a two-word sentence: ‘A cat.’"}, {"key": "falling", "paras": [7], "pic": "😅😌💤", "hook": "Shaky laugh. Fear melts into sleep.", "summary": "Relief washes over the narrator and they let out a shaky laugh. With the cat as a silent guardian, they finally drift off to sleep in peace.", "trick": "Short calming sentences (‘It was just a cat.’) slow the pace right down after the panic."}, {"key": "ending", "paras": [8], "pic": "🌅⛺😊", "hook": "Morning sun. Maybe camping isn't so bad.", "summary": "Morning light bathes the deflated tents. Packing up, the narrator glances at the spot where the cat sat, smiles, and decides camping may not be so bad after all.", "trick": "Flips the opening complaint (‘Camping? Here?’) into acceptance, so the story comes full circle."}], "vocab": [{"w": "sprawling", "d": "spreading out over a large area in an untidy or irregular way"}, {"w": "sanctuary", "d": "a safe or peaceful place"}, {"w": "burrowed", "d": "to press yourself close to someone or under something"}, {"w": "anthology", "d": "a published collection of poems, stories, or songs"}, {"w": "brooding", "d": "appearing darkly menacing or threatening"}, {"w": "canvas of stars", "d": "the night sky compared to a painter’s canvas, full of stars"}, {"w": "gnawing", "d": "continuously troubling or worrying"}, {"w": "macabre", "d": "involving or depicting death or injury in a disturbing way"}, {"w": "concoction", "d": "a strange or unusual mixture of things"}, {"w": "creeping shiver", "d": "a gradual, tingling chill caused by fear"}, {"w": "sinister", "d": "making you feel that something bad or evil might happen"}, {"w": "erratically", "d": "in a way that is not regular, certain, or expected"}, {"w": "deflated", "d": "feeling less confident or important"}, {"w": "forlorn", "d": "appearing lonely and unhappy; unlikely to succeed or to be fulfilled"}, {"w": "shimmering", "d": "reflecting light with a soft, tremulous glow"}], "paras": ["The school compound, usually a concrete jungle of classrooms and courts, had morphed into a sprawling campsite. Oversized neon green tents sprouted haphazardly across the field like giant mushrooms after a rainstorm. Camping? Here? How was I expected to endure a night without the sanctuary of my air-conditioned room, and, most importantly, the comfort of my own pristine bathroom?", "Mei Lin, my tent-mate and a walking encyclopedia of all things fantastical and paranormal, had already burrowed into her sleeping bag, gripping a dog- eared anthology of ghost stories and mythical legends. Her eyes flitted eagerly across the pages, absorbing tales of spectral hauntings and legendary creatures that roamed shadowy realms. I tried to drown out the incessant rustle of pages and her intermittent sighs of contentment, feeling increasingly like a fish out of water.", "As dusk morphed into darkness, the school took on an otherworldly, brooding persona. The usual hum of traffic was replaced by the eerie creak of trees and the distant hoot of an owl. The sky, usually obscured by towering buildings, was a canvas of stars, a million tiny diamonds scattered across black velvet. It was strangely beautiful.", "A chill crept into the tent, a silent intruder that sliced through the fabric and burrowed deep into my bones. As the hours ticked by, a gnawing sense of unease unfurled within me, making each shadow seem darker and each sound a sinister whisper. Mei Lin stirred beside me, her voice a hushed whisper cloaked in mischief, \"Scary stories?\" I groaned inwardly. Of course, she would seize this eerie ambiance as the perfect backdrop for her macabre tales. Just my luck to be paired with the school’s Stephen King.", "The stories began, a chilling concoction of ghostly encounters and eerie happenings. She spoke of the school’s haunted toilets, of the ghostly student who roamed the corridors at night, and of the blood-curdling screams that echoed from the old science lab. Despite my initial scepticism, a creeping shiver traced the length of my spine. As Mei Lin's stories grew darker, the wind outside our tent sang a sinister lullaby, with the trees groaning under its ghostly breath and the shadows within our shelter twisting into ominous, sinister shapes. My imagination, fuelled by Mei Lin’s tales, ran wild. Every rustle, every creak sounded like a lurking creature.", "Unable to sleep, I tossed and turned inside my sleeping bag. Mei Lin’s breathing had slowed, indicating she was fast asleep. Then I heard it. A distinct scratching sound, coming from outside the tent. My heart thudded erratically against my ribcage. Was it a rat? A snake? A ghost? I was alone with my fear. With trembling hands, I reached for my phone. No signal. Great. Just great. I squeezed my eyes shut, trying to calm my racing heart. A deep breath. In. Out. In. Out. I was safe. I was in a tent, in a school compound, surrounded by teachers and classmates.", "Curiosity eventually overcame my trepidation, and I cautiously peeked through the tent flap. The moon was bright, casting eerie shadows on the ground. And there, in the moonlight, I saw it. A small, furry creature, its eyes shimmering like twin moons. A cat.", "Relief washed over me. It was just a cat. I let out a shaky laugh. The tension in my body slowly eased. I crawled back into my sleeping bag, pulling the blanket up to my chin. With the cat as a silent guardian, I drifted off to sleep, the fear replaced by a sense of peace.", "Morning came, and with it, the sun. The campsite was bathed in golden light, the tents looking deflated and forlorn. The fear of the night was a distant memory. As I packed my bag, I glanced at the spot where I had seen the cat. A small smile crept onto my face. Maybe camping was not so bad after all."], "level": "psle"}, {"id": "science-showdown", "num": 5, "title": "The Science Showdown", "family": "guts", "path": "Uphill Climb", "source": "W@W PSLE Model Compo Vol.3 · No. 5", "topic": "Write a composition of at least 150 words about a competition.", "theme": "Hard preparation earns the spotlight, but sharing what you learn helps everyone grow.", "audio": "5", "pov": "third", "words": 700, "stages": [{"key": "setting", "paras": [0], "pic": "🔬🌅🏫", "hook": "Monday – and Class 5C is on fire.", "summary": "On Monday morning, the pupils of Class 5C wake up full of fiery ambition. Today is the School Science Scuffle, where projects compete for the title of School Science Superstar.", "trick": "Twists an expected feeling (‘Instead of feeling dread… from the weekend’s end’) to show how special this day is."}, {"key": "rising", "paras": [1, 2], "pic": "🏃📐🌬️", "hook": "Rehearse, re-check, present – 5C takes the stage.", "summary": "Students rush to school cradling their models, and 5C rehearses speeches and hunts for the slightest flaw. On stage, Joseph shows a wind turbine, Willa a self-driving toy car, and Isiah regrows vegetables from kitchen scraps.", "trick": "Lists several projects briefly one after another (‘Machines, biological systems, and atomic structures came and went’) to build up to the final act."}, {"key": "climax", "paras": [3], "pic": "🫀🧲✨", "hook": "Anna lifts the cloth. The audience holds its breath.", "summary": "Anna unveils a huge model of the human body with removable organs and little lights. Then she guides a tiny ball bearing with a magnet from the nose, down the throat, around the lungs and back out again.", "trick": "Slows the action down step by step (‘started at the nose… down parts of the throat, all around the lungs’) to make the big moment last."}, {"key": "falling", "paras": [4], "pic": "👏🏆🙌", "hook": "Standing ovation. School Science Superstar!", "summary": "The whole audience leaps to its feet to applaud. The judges approach Anna together and crown her School Science Superstar.", "trick": "Delivers the result in one punchy sentence with strong verbs (‘leapt to their feet’) right after the slow build-up."}, {"key": "ending", "paras": [5], "pic": "🤝💡🔁", "hook": "Share, compliment, improve for next year.", "summary": "After the event, all the participants congratulate one another and praise their favourite parts. Class 5C spend the day swapping tips so everyone can improve for next year's Scuffle.", "trick": "Zooms out to a general truth (‘for science to truly advance, people… must… share’) to give the story a message."}], "vocab": [{"w": "anticipated", "d": "expected or looked forward to eagerly"}, {"w": "ambition", "d": "a strong desire to achieve something"}, {"w": "cradled", "d": "held gently and protectively"}, {"w": "transit", "d": "the process of moving from one place to another"}, {"w": "rehearsing", "d": "practising a speech, performance or presentation"}, {"w": "rapt", "d": "completely fascinated or absorbed"}, {"w": "cavity", "d": "a hole or space inside something solid, especially in a tooth or in the body"}, {"w": "flourish", "d": "a dramatic or confident movement to draw attention"}, {"w": "retraced", "d": "went back over the same path"}, {"w": "dread", "d": "a strong feeling of fear or worry about something that is going to happen or may happen"}, {"w": "wolfed down", "d": "to eat something very quickly and greedily"}, {"w": "charge off", "d": "to run somewhere quickly and with determination or excitement"}, {"w": "flaw", "d": "a fault or weakness in someone’s character or something that makes it imperfect"}, {"w": "atomic", "d": "relating to atoms or the energy produced by splitting or joining atoms"}, {"w": "intricate", "d": "having many small parts arranged in a complicated or detailed way"}], "paras": ["As the sun rose and marked the beginning of another school week, several students from Class 5C woke up. Instead of feeling dread or disappointment from the weekend’s end, these children woke up with fiery ambition burning in their hearts. Today was not just any school day, for it was one that marked the start of their school’s most anticipated event, the School Science Scuffle, where students present their science projects and compete to be recognised as the best and be dubbed as the School Science Superstar.", "In a hurry, these students leapt out of bed and wolfed down their breakfasts, eager to charge off to school with their models and displays in hand. Some were fully crafted and complete, and their creators carefully cradled them during their transit to school. Others simply brought disassembled components to school early and rushed to put them all together before the beginning of the event. The School Science Scuffle was open to all classes of the school, but every student there knew that it was Class 5C that were the best at science classes. This was most clearly evidenced in the hours right before the Science Scuffle, where other classes could see 5C students making their detailed preparations. Class 5C’s students were either diligently rehearsing the scripted speeches for their presentations of their projects, or they were re-examining every millimetre of their finished work and hunting for the slightest flaw.", "Hours passed and the School Science Scuffle began, with a snaking line of students bringing their diagrams and cardboard models onto the stage. Machines, biological systems, and atomic structures came and went, each filling the audience with knowledge. Eventually, the time came for Class 5C’s students to present their works, and a large audience of both students and teachers sat up with even more rapt attention, eager to see what would be brought out. The first was Joseph who brought up his functional model of a wind turbine. With a large gust, the boy demonstrated how wind could be converted into pollution-free energy. After that, a girl named Willa brought up a curious device, a toy car that used a small computer program to move on its own. The audience gazed with fascination at the toy rolled around in complex directions. Next came Isiah with a crate full of home-grown fruits and vegetables, and he showed how certain plants can be regrown from seeds or roots found from common groceries.", "Finally, after a dizzying array of impressive science projects, the final student, Anna, from Class 5C came up onto the stage with a large object covered in cloth. When she reached the spotlight, she unveiled her project with a flourish, leaving the audience breathless. It was a large and intricate model of the human body, and as Anna gradually proceeded through her detailed presentation, she showcased other features of her display including movable and removable organs, as well as small lights that lit up to highlight parts of the body that Anna wanted to draw attention to. Then, as a climax, Anna pulled out a tiny ball bearing and used a magnet to show how air travels through the human body. She started at the nose, and with practiced movements, she smoothly brought it through the nasal cavity, down parts of the throat, all around the lungs, and then she retraced her steps to show air leaving the human body and caught the ball bearing as it left the nose of her display.", "The audience leapt to their feet and gave her a standing ovation, and the judges approached Anna as one and granted her the title of School Science Superstar!", "After the event, every student participant gathered to congratulate each other’s achievements. They highlighted the best parts of others’ presentations and complimented others on what part of their projects they liked the best. In truth, for science to truly advance, people everywhere must not just make discoveries but also share them as well. The students of Class 5C especially know this and would spend the rest of the day sharing tips and information with each other so that they could all improve and upgrade their projects for next year’s School Science Scuffle."], "level": "psle"}, {"id": "silent-fighter", "num": 6, "title": "The Silent Fighter", "family": "guts", "path": "Leap of Faith", "source": "W@W PSLE Model Compo Vol.3 · No. 6", "topic": "Write a composition of at least 150 words about courage.", "theme": "One person's courage to speak up can change how a whole school behaves.", "audio": "6", "pov": "first", "words": 689, "stages": [{"key": "setting", "paras": [0], "pic": "🍱📚👻", "hook": "Canteen battleground. Jamie and Lily hide behind books.", "summary": "To Jamie, the school canteen is a battleground of social status. He and his best friend Lily move through it like ghosts, hiding at a corner table behind their books.", "trick": "An extended metaphor (‘a battleground’, ‘knight’, ‘fortress built from pages’) turns an ordinary canteen into a dramatic setting."}, {"key": "rising", "paras": [1, 2], "pic": "😈📖🎸", "hook": "Max hurls the book. Then Skyler cuts through the crowd.", "summary": "Max, the king of bullies, snatches Jamie's novel and flings it across the canteen as everyone laughs. While Jamie scrambles for his things, the hall goes quiet – Skyler, the cool guitar-playing senior, strides over.", "trick": "A simile (‘Laughter erupted like firecrackers’) and a sudden hush (‘as if muted’) signal that something big is about to happen."}, {"key": "climax", "paras": [3, 4, 5, 6], "pic": "🗣️😤🤫", "hook": "‘Pick on someone your own size.’ Max backs down.", "summary": "Skyler calmly tells Max to pick on someone his own size. Max sneers back, but Skyler coolly hints that Max is scared. In the hushed canteen, Max mutters ‘Whatever’ and backs down.", "trick": "Quick back-and-forth dialogue with short speech tags (‘he snapped’, ‘he retorted coolly’) keeps the showdown tense."}, {"key": "falling", "paras": [7, 8, 9, 10, 11, 12, 13], "pic": "🎤🎶😢", "hook": "‘This one's for the silent fighters.’", "summary": "Skyler checks that Jamie is okay and invites him to the Battle of the Bands. At the show, Skyler dedicates an anti-bullying anthem to the ‘silent fighters’, then calls Jamie onto the stage and praises his courage.", "trick": "A time jump (‘The day of the Battle of the Bands finally arrived’) skips straight to the payoff without wasting words."}, {"key": "ending", "paras": [14, 15, 16], "pic": "🌟🏫🤝", "hook": "Seen at last. Now be that person for someone.", "summary": "Jamie feels truly seen and valued for the first time. The school slowly becomes kinder, and Jamie vows to be the one who stands up for someone else.", "trick": "Closes with a vow (‘I vowed to be that person for someone else’) that passes the story's courage on to the reader."}], "vocab": [{"w": "battleground", "d": "a place or situation in which people strongly disagree or compete"}, {"w": "hierarchies", "d": "a system in which people or things are arranged according to their importance"}, {"w": "fortress", "d": "a building or place that has been made stronger and protected against attack"}, {"w": "villainous", "d": "very wicked or cruel; typical of a villain"}, {"w": "sneer", "d": "an unpleasant smile or comment that shows you do not respect someone or something"}, {"w": "enigmatic", "d": "mysterious and difficult to understand"}, {"w": "defiance", "d": "proud and determined opposition against authority or someone more powerful"}, {"w": "begrudging", "d": "said, done, or given unwillingly"}, {"w": "retorted", "d": "to reply quickly to a comment, in an angry, offended or humorous way"}, {"w": "magnetic", "d": "very attractive or exciting, having strong influence over people"}, {"w": "adversity", "d": "a difficult or unpleasant situation"}, {"w": "permeated", "d": "to spread through something and be present in every part of it"}, {"w": "ripple effect", "d": "a situation in which one event causes a series of other events to happen"}, {"w": "profound", "d": "very great or intense; felt or experienced very strongly or in an extreme way"}, {"w": "flaming", "d": "extremely hot or strongly felt"}], "paras": ["The primary school canteen is a battleground, not the cool kind with swords and shields, but rife with social hierarchies where social status is the weapon of choice. I wish I could say I am a knight, but my best friend Lily and I navigate more like ghosts, aiming to pass unnoticed. Nestled at a corner table, we dove into our books, our fortress built from pages.", "Today, the canteen felt more hostile than usual. Max, the reigning king of bullies, had zeroed in on me as his favourite target. With a villainous sneer, he snapped, \"Hey, nerd!\" and snatched my novel. Before I could react, he hurled it across the canteen. Laughter erupted like firecrackers, my cheeks flaming crimson, my bag's contents spilling around me.", "I scrambled to collect my scattered belongings, my heart pounding. The jeers blended into a distant hum as I focused on retrieving every pencil and torn page. Then, the cafeteria's din softened as if muted. Looking up, I saw a figure cutting through the crowd, Skyler, the enigmatic senior known for his rebellious streak and stunning guitar skills. His arrival shifted the atmosphere, drawing both curious and awed glances from our peers.", "\"Hey, Max,\" Skyler called out, his voice calm and commanding, cutting through the chaos. \"Why don't you pick on someone your own size?\"", "Max sneered back. \"And what are you going to do about it, rockstar?\" he snapped, his voice dripping disdain.", "Skyler remained composed. \"Just saying, if you spend all your energy on bullying, you'll have nothing left for the Battle of the Bands. But hey, if you're scared, I get it,\" he retorted coolly, a slight taunt in his tone.", "The cafeteria descended into a hushed silence, the air thick with tension. Max glanced around, realizing his usual audience was now riveted by Skyler's defiance. Grumbling a \"Whatever,\" he backed down, his voice low and begrudging. \"This isn’t over,\" he muttered, but the threat lacked its usual bite.", "Skyler then turned to me, his expression softening. \"You okay?\" he asked, helping me pick up my scattered belongings.", "\"Yeah,\" I stammered, surprised by the shift in the atmosphere. \"Thanks.\"", "Skyler grinned, easing the tension around us. \"No problem. Come to the Battle of the Bands. We’re playing, and I’d love to see you there.\"", "I nodded, my response more of a reflex than a conscious decision, still too stunned to articulate more. Skyler walked away, retreating into the crowd, and I could not believe what had just transpired. The cafeteria buzzed with excitement, but for the first time, it was not about me being the target of ridicule.", "The day of the Battle of the Bands finally arrived, and the school auditorium was electric with anticipation. Lily and I snagged seats near the front, my heart racing with both excitement and nerves. When Skyler's band took the stage, their presence was magnetic, instantly capturing everyone's attention.", "\"This one’s for the silent fighters,\" Skyler announced into the microphone, his eyes meeting mine across the crowded auditorium. The audience erupted as the band launched into a powerful, original anthem against bullying. Overwhelmed with pride and gratitude, I felt tears well up.", "After the set, Skyler called me to the stage. \"This is Jamie,\" he declared confidently. \"He's a silent fighter, showing courage in the face of adversity, just like many of us here.\"", "The crowd cheered, and for the first time, I felt truly seen and valued. Standing there, surrounded by the support of my peers, I recognized this moment as a turning point. Skyler's acknowledgment had given me the courage to face challenges with renewed strength.", "In the days that followed, the school underwent a subtle yet profound transformation. A new awareness permeated the halls, with a collective readiness to confront bullying. Skyler's public support had sparked a ripple effect, fostering a more compassionate environment.", "Reflecting on those events, I realized that courage and support often come from unexpected places. It only takes one person to significantly impact another's life. Inspired by Skyler, I vowed to be that person for someone else, ready to extend the same support I had received."], "level": "psle"}, {"id": "when-the-pieces-fell", "num": 7, "title": "When the Pieces Fell", "family": "bonds", "path": "Crack & Repair", "source": "W@W PSLE Model Compo Vol.3 · No. 7", "topic": "Write a composition of at least 150 words about an argument.", "theme": "Anger can crack a community, but care and forgiveness can mend it.", "audio": "7", "pov": "third", "words": 747, "stages": [{"key": "setting", "paras": [0, 1], "pic": "🧓🏢🌇", "hook": "Void deck, chess clacks, Mei Ling smiles.", "summary": "Every afternoon, a group of uncles plays Chinese chess at the void deck in Mei Ling's neighbourhood. On her way home from school, she pauses in the golden light to admire their game and easy friendship.", "trick": "Rich sensory detail (‘the clack of tiles’, ‘shades of warm earth tones’) builds a peaceful scene before trouble arrives."}, {"key": "rising", "paras": [2, 3], "pic": "⚡😠🗯️", "hook": "One chess move. A thunderclap of anger.", "summary": "A small disagreement over a move explodes into a fierce argument between Mr Tan and Mr Lim. Bystanders cannot calm them, and Mei Ling watches the friendly void deck split into warring sides.", "trick": "A simile (‘Like a sudden thunderclap on a cloudless day’) marks the exact moment the mood flips."}, {"key": "climax", "paras": [4, 5], "pic": "🚑💔🫂", "hook": "Mr Tan clutches his chest and falls.", "summary": "Mr Tan suddenly staggers and collapses, clutching his chest. Shocked neighbours rush to help, others call for an ambulance, and Mei Ling watches the arguing crowd turn into a united team.", "trick": "A sudden turn (‘suddenly staggered and collapsed’) stops the argument cold and swings the story in a new direction."}, {"key": "falling", "paras": [6], "pic": "🚨😔🏚️", "hook": "Sirens fade. The void deck feels wounded.", "summary": "As the ambulance takes Mr Tan away, Mei Ling is left uneasy. The void deck that once stood for unity now seems scarred by the quarrel.", "trick": "Personification (‘bore the scars of discord… like a wounded warrior’) shows how the place itself seems changed."}, {"key": "ending", "paras": [7, 8], "pic": "🤝🌱💛", "hook": "Forgiveness mends the cracks.", "summary": "In the following days, the neighbours reflect on the harm done by anger and come together to forgive. Mei Ling learns that community bonds can be tested but stay unbreakable.", "trick": "Ends with hope and states the lesson through the character's eyes (‘she realized…’) rather than as a lecture."}], "vocab": [{"w": "bustling", "d": "full of busy activity"}, {"w": "etched", "d": "to be permanently marked or impressed with emotion or experience"}, {"w": "camaraderie", "d": "a feeling of friendliness among people who spend a lot of time together"}, {"w": "piqued", "d": "to make someone interested or curious"}, {"w": "animated", "d": "full of interest and energy"}, {"w": "thunderclap", "d": "a sudden loud noise like thunder, or a sudden event that is very shocking"}, {"w": "discord", "d": "the state of not agreeing or sharing opinions"}, {"w": "pall", "d": "something that covers a place and makes it dark, or that makes something feel gloomy"}, {"w": "diffuse", "d": "to make a bad feeling or situation less strong or serious"}, {"w": "chasm", "d": "a very large difference between two opinions, people, or groups"}, {"w": "frantic", "d": "almost out of control because of extreme emotion, such as worry"}, {"w": "solidarity", "d": "agreement between and support for the members of a group"}, {"w": "sombre", "d": "serious, sad, and without humour or entertainment"}, {"w": "turmoil", "d": "a state of confusion, disorder, or uncertainty"}, {"w": "reconciliation", "d": "the process of making two people or groups friendly again after a disagreement"}], "paras": ["In the heart of Mei Ling’s bustling neighbourhood, a group of uncles congregated at the void deck daily like clockwork, their faces etched with lines of wisdom and mirth from years of shared stories and experiences. Their afternoons were punctuated by lively games of Chinese chess, the clack of tiles echoing against the concrete walls. The void deck itself was a vibrant space, painted in shades of warm earth tones, with art depicting scenes of community life and unity. Benches lined the edges, worn but sturdy, offering a place for residents to gather. For Mei Ling, passing by on her way home from school, it was a familiar sight that never failed to bring a smile to her face. She often found herself pausing to admire their strategic manoeuvres and the easy camaraderie.", "Today seemed like any other day as Mei Ling approached the void deck, her curiosity piqued by the familiar sight of the uncles huddled around a chessboard, their voices rising and falling in animated conversation. The late afternoon sun bathed the scene in a golden glow, casting long shadows that danced across the concrete floor. Mei Ling could feel the warmth of the sun on her skin as she lingered for a moment, drawn in by the intensity of their game, her eyes tracing the swift movements of the chess pieces.", "Like a sudden thunderclap on a cloudless day, tension crackled through the air as a dispute erupted between two of the uncles, Mr. Tan and Mr. Lim. It began with a simple disagreement over a chess move, innocuous enough at first, but quickly snowballed into a fierce exchange of words. Mei Ling's heart sank as she watched the harmony of the gathering shatter, replaced by a cloud of discord and anger that hung heavy over the void deck. The atmosphere, once filled with camaraderie and laughter, now filled with tension, casting a pall over the familiar surroundings.", "Despite the best efforts of bystanders to diffuse the situation, the argument raged on, fuelled by pride and stubbornness. Mei Ling felt a knot of unease tighten in her stomach as harsh words flew back and forth, staining the once- friendly atmosphere of the void deck. It was as if a gaping chasm had opened up, dividing the tight-knit community she had always known into warring factions.", "As tensions soared to unbearable heights, Mei Ling's eyes widened in shock as Mr. Tan suddenly staggered and collapsed to the ground, his hand clutching at his chest in agony. Gasps of alarm rippled through the crowd as neighbours rushed to Mr. Tan's side, their voices a frantic chorus of concern and confusion.", "Amidst the chaos that engulfed the void deck, residents sprang into action, their sense of community propelling them into action in the face of crisis. Some rushed to Mr. Tan's side, offering comfort and aid, while others hurried to call emergency services. Mei Ling stood in awe as she witnessed her neighbours unite in a display of solidarity and compassion.", "As the piercing wail of ambulance sirens echoed in the distance and Mr. Tan was whisked away to the hospital, Mei Ling could not shake the lingering unease that hung heavily in the air. The void deck, once a beacon of unity and camaraderie, now stood as a sombre reminder of the fractures that had emerged amidst the chaos. The familiar space, once alive with laughter and shared memories, now bore the scars of discord and division like a wounded warrior. It was a sobering realization of the fragility of community bonds, a stark reminder that even the strongest ties could be tested in times of crisis.", "In the days that followed, the neighbourhood grappled with the repercussions of the incident, the rift between neighbours serving as a painful reminder of the consequences of unchecked anger and resentment. Yet amidst the turmoil, there was also a glimmer of hope, a renewed sense of unity and understanding blossomed among residents as they came together to reflect on the need for forgiveness and reconciliation.", "Through the adversity, Mei Ling found herself learning valuable lessons about compassion, resilience, and the true strength of community. As she looked around at her neighbours, bound together by a shared sense of purpose and empathy, she realized that even in the face of adversity, their bonds remained unbreakable. And in that realization, she found a sense of hope for the future, a future where understanding and forgiveness would prevail over discord and division."], "level": "psle"}, {"id": "beyond-the-bushes", "num": 8, "title": "Beyond the Bushes", "family": "growth", "path": "Hard Lesson", "source": "W@W PSLE Model Compo Vol.3 · No. 8", "topic": "Write a composition of at least 150 words about a misunderstanding.", "theme": "Your fun can look like trouble to others – respect boundaries.", "audio": "8", "pov": "third", "words": 662, "stages": [{"key": "setting", "paras": [0, 1], "pic": "🛝🙈🌳", "hook": "Hide and Seek – but hiding beyond the lines.", "summary": "On the last Sunday before school, Xander, Dave and Sammy play Hide and Seek at the playground. Dave is the Seeker. Xander and Sammy secretly plan to hide outside the playground’s usual boundaries.", "trick": "Foreshadowing: ‘Unknown to Dave’ hints at trouble before it happens, so the reader reads on nervously."}, {"key": "rising", "paras": [2, 3, 4], "pic": "🔍🌿🏠", "hook": "Empty park. A gap in the hedge. A stranger’s garden.", "summary": "Dave cannot find anyone and pushes past the boundaries. He crawls through a gap in the shrubs into what he thinks is Auntie Lim’s backyard. A tall man storms out and grabs his arm.", "trick": "A simile for feelings – ‘Frustration bubbled inside him like a shaken soda can’ – shows emotion instead of naming it."}, {"key": "climax", "paras": [5, 6, 7, 8, 9], "pic": "😱🫸🤧", "hook": "‘Thief!’ A shove. Then a sneeze saves the day.", "summary": "The man shouts that Dave is a thief and shoves him to the ground. Dave is too shocked to explain. Then Xander sneezes, stumbles out of a bush and yells that they are only playing Hide and Seek.", "trick": "One-line paragraphs (‘Dave froze.’) and shouted dialogue speed up the action at the peak."}, {"key": "falling", "paras": [10, 11, 12, 13, 14], "pic": "🤝😮‍💨🧃", "hook": "Sammy explains. Sorry from both sides.", "summary": "Sammy explains the house used to be Auntie Lim’s. The man lets go, admits he moved in last week and was frightened. Dave apologises, the man apologises too, and the tension fizzles.", "trick": "Dialogue that reveals both sides’ feelings, closed by a simile: tension ‘fizzled like steam escaping a kettle’."}, {"key": "ending", "paras": [15, 16, 17, 18, 19], "pic": "🛝💭🚧", "hook": "Next time, we stick to the park.", "summary": "
