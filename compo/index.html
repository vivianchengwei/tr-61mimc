Back on the swings, the boys joke shakily about the close call. Xander says next time they stick to the park. They realise that crossing boundaries can bring consequences nobody intended.", "trick": "Ends by echoing the topic – the ‘misunderstanding’ becomes a lesson about boundaries, stated in one clear final sentence."}], "vocab": [{"w": "horseplay", "d": "noisy and rough play, especially when people pretend to fight"}, {"w": "rowdy", "d": "noisy and possibly violent"}, {"w": "spirited", "d": "full of energy, enthusiasm, or determination"}, {"w": "bolted", "d": "to move suddenly and quickly away, often because of fear"}, {"w": "flair", "d": "a natural ability to do something well"}, {"w": "trampled", "d": "to step heavily on something or someone, causing damage or injury"}, {"w": "emerged", "d": "to appear by coming out of something or from behind something"}, {"w": "thundered", "d": "to say something very loudly and forcefully"}, {"w": "seized", "d": "to take something quickly and hold it firmly"}, {"w": "looming", "d": "to appear as a large and possibly frightening shape or object"}, {"w": "scowl", "d": "an angry or bad-tempered expression"}, {"w": "thudding", "d": "making a dull, heavy sound"}, {"w": "solemn", "d": "serious and without humour or expression"}, {"w": "spiralled", "d": "to quickly become worse in a continuous and usually harmful way"}, {"w": "piqued", "d": "to arouse interest, curiosity, or emotion, especially by something unexpected or provocative"}], "paras": ["On a sunny Sunday, three friends gathered at the neighbourhood playground for one last game before school resumed on Monday. Xander, Dave, and Sammy were known for their horseplay and mischief. They loved open spaces where they could run wild, free from adult interference. That afternoon, after a rowdy debate, they settled on their favourite game, Hide and Seek.", "A spirited round of Rock, Paper, Scissors crowned Dave the unlucky Seeker. With a dramatic groan, he turned to face a tree and began counting loudly from one hundred. Behind him, Xander and Sammy exchanged mischievous grins and bolted in opposite directions, their feet pounding against the earth. Unknown to Dave, both of them had secretly planned to hide beyond the playground’s usual boundaries.", "When Dave finally reached zero, he spun around with theatrical flair, only to find the park unusually still. He checked behind the slide, under the benches, even under the giant tunnel, but there was nothing. Frustration bubbled inside him like a shaken soda can. Determined, he pushed past the usual boundaries.", "Near a row of shrubs, something caught his eye, a gap in the leaves with freshly trampled dirt. Curiosity piqued, he dropped to all fours and crawled through. He emerged in the backyard of a house he thought he recognised. It once belonged to Auntie Lim, their elderly neighbour who often waved at them from her kitchen window. Dave assumed she would not mind a quick visit, especially for a harmless game.", "Tiptoeing further in, he scanned the garden for signs of Xander. But before he could call out, a deep voice thundered from inside, “Who’s there?” A tall man stormed out, his face twisted in alarm. Without warning, he seized Dave by the arm.", "“Thief!” the man bellowed. “You’re trespassing!”", "Dave froze. “Wait! I—” he stammered, his words sticking like gum in his throat.", "Before he could explain, the man shoved him backwards. Dave tumbled to the ground, the air knocked from his lungs.", "Just then, a sneeze exploded from behind a bush. Xander stumbled out, eyes wide with panic.", "“Stop! He’s not a thief!” he yelled. “We’re playing Hide and Seek!”", "The man blinked in confusion but still held his ground. Sammy came dashing in, alarmed by the shouting. When he saw Dave sprawled on the grass and the furious stranger looming over him, he quickly added, “This house used to belong to Auntie Lim! We didn’t know you moved in.”", "The man hesitated, finally letting go of Dave’s arm. “I moved in last week,” he said, still catching his breath. “You startled me. I thought you were up to something bad.”", "Dave picked himself up, brushing grass off his shorts. “I’m really sorry,” he said, voice trembling. “I didn’t mean to sneak in. I thought I was just hiding in a familiar place.”", "The man’s scowl softened. “And I’m sorry I overreacted. You gave me quite the scare.”", "There was an awkward pause, followed by a quiet apology from both sides. The tension fizzled like steam escaping a kettle. The man even offered the boys drinks from a cooler nearby, but they politely declined.", "Back at the playground, the trio collapsed onto the swings, hearts still thudding from the close call. Dave gave a shaky laugh. “Well, that’s one way to lose a game of Hide and Seek.”", "“At least you didn’t end up in a police car,” Sammy quipped, nudging him.", "Xander stared off into the distance and murmured, “Next time, we stick to the park.” All three nodded in solemn agreement.", "That day’s game had spiralled into something far more serious than they had ever expected. What began as a harmless adventure nearly turned into a disaster. Though no harm was done in the end, the scare had left a mark, a memory carved into the pages of their friendship.", "They now understood that not everyone would see their fun the same way, and that boundaries, once crossed, could lead to unintended consequences."], "level": "psle"}, {"id": "the-end-of-an-era", "num": 9, "title": "The End of an Era", "family": "bonds", "path": "Invisible Hero", "source": "W@W PSLE Model Compo Vol.3 · No. 9", "topic": "Write a composition of at least 150 words about a special outing.", "theme": "An ordinary day becomes unforgettable when shared with the right people.", "audio": "9", "pov": "first", "words": 747, "stages": [{"key": "setting", "paras": [0], "pic": "🦸📅🍿", "hook": "Years of waiting. Endgame night is HERE.", "summary": "The narrator and best friend George have waited years for Avengers: Endgame. They have counted down the days, debated theories and re-watched every film. Tonight the wait ends.", "trick": "Opens with a feeling (‘A palpable buzz of excitement coursed through my veins’) before explaining the event, pulling the reader in."}, {"key": "rising", "paras": [1, 2], "pic": "🎟️✨🍟", "hook": "Gold Class tickets. Treated like royalty.", "summary": "George’s sister has surprised them with Gold Class tickets at VivoCity. Outside, fans in costume fill the electric atmosphere. Inside, the boys order truffle fries and milkshakes and sink into huge reclining seats.", "trick": "Uses the senses – neon lights, popcorn smell, plush seats – so the reader feels present in the cinema."}, {"key": "climax", "paras": [3, 4], "pic": "🎬😭🤩", "hook": "Lights down. Laugh, cheer, cry.", "summary": "From the first note of the Marvel theme, the narrator and George are transported. They laugh, cheer and even cry with the heroes, popcorn forgotten. For a few hours the outside world disappears.", "trick": "Lists reactions in a triple (‘laughed… cheered… cried’) to show how much the moment means."}, {"key": "falling", "paras": [5, 6], "pic": "🎞️🚆🌃", "hook": "Credits roll. A bittersweet train ride home.", "summary": "As the credits roll, the narrator and George sit in silence, reluctant to leave. On the train they chat about favourite scenes, but there is also a quiet understanding that this was special.", "trick": "Slows the pace with a quiet moment (‘We sat there in silence’) to let the emotion settle."}, {"key": "ending", "paras": [7], "pic": "👬💛⭐", "hook": "Not about Avengers – about the right people.", "summary": "The narrator realises the outing was not a birthday or celebration, yet it stands out. The movie, the lounge and George’s company made an ordinary day unforgettable.", "trick": "Ends by echoing the topic: an ‘ordinary day’ becomes a special outing ‘when shared with the right people’."}], "vocab": [{"w": "palpable", "d": "so intense as to seem almost tangible; easily noticed or felt"}, {"w": "coursed through my veins", "d": "used to describe a strong emotion moving powerfully and quickly through one's body"}, {"w": "bated breath", "d": "feeling very anxious or excited while waiting for something to happen"}, {"w": "culmination", "d": "the highest or climactic point of something, especially as attained after a long time"}, {"w": "hushed whispers", "d": "very quiet and soft speech, often used in secret or out of respect"}, {"w": "mingled", "d": "to mix or combine, or be mixed or combined"}, {"w": "emerge", "d": "to appear by coming out of something or from behind something"}, {"w": "captivated", "d": "to hold the attention of someone by being extremely interesting, exciting, or attractive"}, {"w": "draped over", "d": "loosely covered or hanging over something"}, {"w": "a shiver ran down my spine", "d": "a phrase describing a sudden feeling of fear, excitement, or thrill"}, {"w": "spectacle", "d": "a visually striking performance or display"}, {"w": "testament", "d": "something that shows that something else exists or is true"}, {"w": "unyielding spirit", "d": "having a strong and determined attitude that does not give in or change easily"}, {"w": "camaraderie", "d": "a feeling of friendship and trust among people who work or spend a lot of time together"}, {"w": "on the edge of our seats", "d": "feeling very excited or nervous because you are waiting to find out what happens next"}], "paras": ["A palpable buzz of excitement coursed through my veins. It was not just any ordinary evening; it was the night the final instalment of the Avengers series premiered, Avengers: Endgame. My friend George and I had been awaiting this day with bated breath for what seemed like an eternity. We had marked off days on the calendar, engaged in endless debates and theories about possible plot twists, and re-watched the previous instalments to ensure not a single detail was missed. This was more than just a movie. It was the culmination of a journey we had been on for years, a journey filled with heroes, villains, triumphs, and heartaches. And at last, the wait was over.", "What made this outing even more special was the fact that we were not watching it in a regular cinema hall. George’s older sister had surprised us with Gold Class Lounge tickets at VivoCity’s cinema. I had only heard of it in hushed whispers from classmates who had gone once or twice for birthdays. Reclining leather seats, gourmet food, and an enormous screen made it feel almost unreal. As we approached the cinema, the bright neon lights glowed against the night sky like a beacon for Marvel fans. The atmosphere was electric. Fans, some dressed in costumes, filled the area with excited chatter and laughter.", "Inside, the cinema lobby was buzzing. The smell of freshly popped popcorn mingled with the sweet aroma of candy and fizzy sodas. We made our way to the special Gold Class counter and were ushered into a private lounge with cushioned seats and warm lighting. We were treated like royalty. A server handed us a menu, and we ordered truffle fries and a decadent chocolate milkshake each. When it was time, we were led into the theatre. Plush, wide seats awaited us, complete with buttons to recline and soft blankets draped over the armrests. I leaned back, feeling like I was about to watch the biggest movie of my life from a front-row seat in heaven.", "From the very first note of the iconic Marvel theme, a shiver ran down my spine. As the screen lit up, familiar heroes began to emerge from the shadows, and we were transported into a world beyond our wildest imagination. Every scene was a masterpiece, a visual spectacle that left us in awe. The action sequences were breathtaking. Each punch and each explosion was a testament to the heroes’ struggle and their unyielding spirit. The camaraderie among the characters, their witty banter, and heartfelt moments brought a sense of warmth and familiarity. It reminded us of how much we had grown with them.", "But it was not just the action that captivated us. It was the story and emotional depth each character carried. We laughed at their jokes, cheered at their victories, and even cried at the moments of loss. The suspense kept us on the edge of our seats, popcorn forgotten, our hands gripping the soft blankets. The visual effects were nothing short of magical. Each frame painted a world that felt as real as the one we lived in. For those few hours, we were part of something much larger. The outside world faded away, leaving behind only joy, wonder, and the comfort of shared experience.", "As the final credits rolled, a bittersweet feeling settled over us. The journey had come to an end, but it was a satisfying conclusion. We sat there in silence, letting the emotions sink in, reluctant to leave the comfort of the plush seats and the world we had been immersed in. Eventually, we left the theatre and made our way to the train station, our arms still clutching the souvenir popcorn buckets we had brought home.", "On the ride back, we exchanged animated thoughts about our favourite scenes and moments. The discussion flowed naturally, but between the laughter and theories, there was also a quiet understanding. We had experienced something truly memorable. The cool night breeze greeted us as we stepped onto our stop, the sky dotted with stars that seemed to shine a little brighter.", "That outing had not been a birthday, a celebration, or a school event. Yet it stood out among all our shared memories. The joy of the movie, the comfort of the lounge, and the company of a good friend had made it truly unforgettable. It was not just about the Avengers, but about how special an ordinary day could become when shared with the right people."], "level": "psle"}, {"id": "our-final-bow", "num": 10, "title": "Our Final Bow", "family": "guts", "path": "Uphill Climb", "source": "W@W PSLE Model Compo Vol.3 · No. 10", "topic": "Write a composition of at least 150 words about a performance.", "theme": "When you perform to give joy, not to win, you receive the most.", "audio": "10", "pov": "first", "words": 750, "stages": [{"key": "setting", "paras": [0], "pic": "🎼🎄📝", "hook": "One last performance – carols on Orchard Road.", "summary": "Ms Patricia tells the graduating choir seniors of Meadow Primary that their final performance will be Christmas carols on Orchard Road on Christmas Eve. The choir room bursts into excited chatter.", "trick": "Opens with dialogue – the conductor’s announcement – so the story starts with a surprise instead of background."}, {"key": "rising", "paras": [1, 2, 3, 4], "pic": "🎅🚌🎶", "hook": "Practice, Daiso hats, and a laughing conductor.", "summary": "The choir practises four carols and shops at Daiso for Santa caps and tinsel. On the big day, the costumes make stoic Ms Patricia burst out laughing. They rehearse on the bus and arrive at a packed, glittering Orchard Road.", "trick": "Show-not-tell for character: the ‘no-nonsense, stoic’ conductor collapsing into laughter shows how special the day is."}, {"key": "climax", "paras": [5, 6, 7], "pic": "🎄🎙️🧑‍🤝‍🧑", "hook": "‘Silent night…’ The river of shoppers stops.", "summary": "Ms Patricia introduces the choir and raises her hands. As they sing ‘Silent Night’, the crowd ‘flowing like a fierce river’ slows, stops and grows. Strangers sway, film and even sing along.", "trick": "A one-line paragraph of song lyric (‘Silent night, holy night…’) marks the exact moment the performance begins."}, {"key": "falling", "paras": [8, 9], "pic": "👏🙇🎤", "hook": "Final note. Thunderous applause. Bow in unison.", "summary": "The last carol ends with ‘…and a Happy New Year!’. A thunderous round of applause erupts from the biggest crowd the choir has ever faced. Under Ms Patricia’s command, they bow together.", "trick": "Mirrors the opening lyric with a closing lyric (‘…and a Happy New Year!’) to frame the performance neatly."}, {"key": "ending", "paras": [10], "pic": "🎁💖🎵", "hook": "Not prestigious – but the most meaningful.", "summary": "The narrator reflects that this was not a prestigious performance, yet it was the most meaningful one. Giving joy to strangers gave the choir even more in return.", "trick": "Closes with a quotation (‘The giver receives much more than he gives’) that sums up the message in one line."}], "vocab": [{"w": "puzzled", "d": "confused because you do not understand something"}, {"w": "burst into chatter", "d": "suddenly began talking quickly and excitedly"}, {"w": "ceased", "d": "to stop happening or existing"}, {"w": "burst into a laughing fit", "d": "suddenly started laughing uncontrollably"}, {"w": "stoic", "d": "not showing or feeling any emotion when something bad happens"}, {"w": "composure", "d": "the state of being calm and in control of your emotions"}, {"w": "weaved", "d": "to move by turning and changing direction while going forward, especially in order to avoid things"}, {"w": "erupted", "d": "to suddenly express strong emotion, especially by shouting loudly"}, {"w": "brimming with excitement", "d": "full to the point of overflowing with excitement"}, {"w": "illuminated", "d": "lit up or made something visible using light"}, {"w": "stopped in their tracks", "d": "suddenly stopped moving or doing something because of surprise or fear"}, {"w": "proximity", "d": "the state of being near in space or time"}, {"w": "thunderous round of applause", "d": "very loud clapping from an audience to show approval"}, {"w": "unison", "d": "doing something at the same time as someone else"}, {"w": "prestigious", "d": "respected and admired as very important or of high quality"}], "paras": ["“Before you move on to secondary school, this will be your final performance as seniors,” our choir conductor, Ms. Patricia, announced. The lot of us stared at her, puzzled. “As the graduating seniors of Meadow Primary School, you will be performing Christmas carols at Orchard Road on Christmas eve.” Immediately, the choir room burst into chatter. Excitement filled the air with names of different Christmas carols thrown about everywhere. Ms. Patricia ceased the ruckus with a firm clap, directing our attention to her once again. She continued to provide the details of the event, and we took notes as we went along.", "In preparation for the big day, we had to practice the songs – “Silent night”, “We wish you a Merry Christmas”, “Joy to the world”, and “Feliz Navidad”. All the members had completed their exams, we were able to dedicate greater time to this upcoming event. In order to make our gowns more appropriate for the festive season, the group of us headed to the nearest Daiso, armed with our recyclable bags. We roamed aisle after aisle, trying our hardest to not get distracted by the trinkets at every corner of the store. After an hour of shopping, we finally left the store with Santa caps, reindeer hairbands and colourful tinsel garlands.", "It was finally the day of the event. My choir groupmates and I gathered in the choir room before proceeding to Orchard Road. We put on our choir gowns and our festive décor, making Ms. Patricia burst out into a laughing fit. Witnessing the no-nonsense, stoic Ms. Patricia break out into laughter took us by surprise. Her laughter bounced off the walls of the choir room. Indeed, laughter is contagious as one by one, we fell victims of the laughing spell. Once she regained her composure, we boarded the bus and made our way to our destination. As the location was slightly far, we had more than sufficient time to practice our songs once more and that we did. Each of our voices weaved into our friends’, creating a harmonious symphony of altos, tenor and soprano. We even received compliments from the bus driver after our impromptu rehearsal!", "All of us were brimming with excitement, eager to perform.", "Once we were in the area, we alighted at a carpark before walking over to our stage of the day. Our festive garb attracted the eyes and attention of many onlookers, and they followed along with great curiosity and anticipation. By the time we reached the actual venue, it was late evening and the crowds at Orchard Road were at their biggest. The Christmas decorations shone brilliantly and illuminated the dark sky. My choirmates and I were brimming with excitement. Ms. Patricia gathered us for the final briefing before the performance and after a few words of encouragement from her, we did the usual cheer that we would do before performances. Although there were no prizes for first place this time, it was still important for us to take it seriously and perform at our utmost best. With a nod, Ms. Patricia picked up the mic.", "“Good evening, everyone,” Ms. Patricia announced, with the usual air of elegance she carries. “With me here are my talented singers from Meadow Primary School. We will be performing a few carols fitting for the festive season. Please join us if you know the songs!” Then, she turned to us. The moment she raised her hands, we had our game faces on.", "“Silent night, holy night…”", "The crowds which were flowing like a fierce river started slowing down. Some curious onlookers even stopped in their tracks to watch us. There were couples, families and friends who came into our proximity. Some swayed along to the music, some had their phones out and some even joined in with us! Our audience grew bigger and bigger by the minute. It could be due to the festive and non-stressful atmosphere, but I was having way more fun than our usual performances and practices. Even my choirmates were swaying their bodies to the songs.", "“…and a Happy New Year!”", "A thunderous round of applause erupted right after the final song. My heart beamed with pride at the biggest crowd before us. Under Ms. Patricia’s command, we bowed in unison. It was truly an honour.", "Although this was not a prestigious performance, it was definitely the most meaningful one for me by far. The saying was indeed right – “The giver receives much more than he gives”."], "level": "psle"}, {"id": "the-weight-of-the-truth", "num": 11, "title": "The Weight of the Truth", "family": "guts", "path": "Leap of Faith", "source": "W@W PSLE Model Compo Vol.3 · No. 11", "topic": "Write a composition of at least 150 words about justice.", "theme": "Justice needs someone brave enough to speak the truth.", "audio": "11", "pov": "third", "words": 612, "stages": [{"key": "setting", "paras": [0], "pic": "🧮👀🎒", "hook": "Sarah sees Carol steal – and frame Alena.", "summary": "On a normal Tuesday, Sarah sees popular Carol secretly take Siti’s calculator. When Siti raises the alarm, Carol slips the calculator into absent-minded Alena’s bag. Only Sarah knows.", "trick": "Dramatic irony – the reader and Sarah know the truth while everyone else is fooled, which creates tension."}, {"key": "rising", "paras": [1, 2], "pic": "😨🌙⚖️", "hook": "Innocent Alena blamed. Sarah can’t sleep.", "summary": "Ms Megan finds the calculator with Alena, who is marched to the principal’s office. That night Sarah lies awake, torn between fear of Carol and guilt. The next day she sees Alena sitting alone in the dark.", "trick": "An inner conflict shown through a sleepless night (‘her mind racing’) – the struggle happens inside the character."}, {"key": "climax", "paras": [3], "pic": "🗣️💪🚪", "hook": "Something stirs. Sarah tells Mrs Philip.", "summary": "Seeing Alena’s misery, Sarah realises staying silent is as bad as helping Carol. She gathers her courage and tells Mrs Philip everything. The teacher thanks her for her bravery.", "trick": "Names the turning point (‘something inside Sarah stirred’) and follows it with a decisive action: ‘Gathering her courage’."}, {"key": "falling", "paras": [4], "pic": "📹✅🏫", "hook": "CCTV proves it. Carol confesses.", "summary": "The school checks the corridor CCTV, which backs up Sarah’s account. Carol confesses and faces consequences. Sarah’s name is kept secret, but she feels proud.", "trick": "A fast summary (‘The truth unfolded quickly’) lets the falling action move at pace after the slow build-up."}, {"key": "ending", "paras": [5], "pic": "🤗⚖️🌟", "hook": "Truth is heavy – but justice needs it.", "summary": "Alena is declared innocent and surrounded by friends. The school talks about justice and courage. Sarah learns that the truth carries a weight that is essential for justice.", "trick": "Ends by echoing the title and topic – ‘the truth… carried a weight that was essential for justice’."}], "vocab": [{"w": "notorious", "d": "famous for something bad"}, {"w": "stealthily", "d": "in a quiet, secretive way so that no one notices"}, {"w": "skipped a beat", "d": "used to say that someone felt a sudden moment of fear or excitement"}, {"w": "prowess", "d": "great skill or ability"}, {"w": "chaos erupted", "d": "a sudden outbreak of complete confusion and disorder"}, {"w": "accusation", "d": "a statement saying that someone has done something morally wrong, illegal, or unkind"}, {"w": "bewildered", "d": "confused and uncertain"}, {"w": "vehemently", "d": "in a strong and emotional way"}, {"w": "repercussions", "d": "the effects of an action or event, especially bad effects"}, {"w": "demeanour", "d": "a person's outward behaviour or appearance"}, {"w": "a cloud of sadness", "d": "a strong and gloomy feeling of sadness that affects a situation or group"}, {"w": "complicit", "d": "involved in or knowing about something bad without taking action to stop it"}, {"w": "her expression grave", "d": "showing seriousness and concern"}, {"w": "corroborated", "d": "supported or confirmed a statement, theory, or finding"}, {"w": "something inside stirred", "d": "began to feel a faint emotion or reaction"}], "paras": ["It was a regular Tuesday afternoon when Sarah witnessed something that no one else did just as she was hurrying to her seat. She saw Carol, a popular but notorious classmate, stealthily taking a calculator from another student's open backpack. Sarah's heart skipped a beat. Theft was unheard of at CHIJ, and there she was seeing it happen with her very own eyes. On top of that, seeing Carol, whom everyone admired for her athletic prowess, commit such an act was even more startling. Before Sarah could process what she had seen, chaos erupted in class. Siti, whose calculator was stolen, noticed the theft and raised an alarm. Ms Megan, the Math teacher swarmed in and amidst the confusion, Carol quietly slipped away and dropped the calculator into the open backpack of an unsuspecting student, Alena, who was known for her absent-mindedness.", "Ms Megan made the class put their stationery on the tables and went around checking the students bag and they found Siti’s calculator with Alena. The accusation shifted swiftly. Alena, bewildered and scared, vehemently denied the theft, but the evidence was against her, she had two calculators on her table. Sarah watched as Alena, a kind-hearted soul who would not even hurt a fly, was reprimanded, and taken to the principal's office. That night, Sarah lay in bed, her mind racing. She knew the truth, but revealing it meant confronting Carol, challenging the popular girl in school and if it went wrong, she herself could potentially become a target. She was afraid of the repercussions, but she could not let Carol get away with it scot-free while Alena was in trouble. The weight of the decision pressed heavily on her.", "The next day, as Sarah walked the now-tense corridors of CHIJ, she saw Alena sitting alone in class, in darkness, her usual cheerful demeanour replaced by a cloud of sadness, embarrassment and anger.", "Witnessing the injustice she faced, something inside Sarah stirred. She realized that staying silent for this long was as good as supporting the wrong and being complicit in Carols’ wrongdoing. Gathering her courage, Sarah approached Mrs. Philip, her favourite English teacher, and recounted what she had witnessed. Mrs. Philip listened intently, her expression grave. She thanked Sarah for her bravery in coming forward and promised to handle the situation with sensitivity.", "The truth unfolded quickly after that. With Sarah's testimony, the school reviewed the corridor closed-circuit television footage, which corroborated her account. Carol was called into the principal's office and faced with undeniable evidence, she confessed. Carol faced appropriate consequences, but the principal also addressed the entire school, emphasizing the importance of honesty and integrity. Sarah's role in telling the truth was kept confidential to protect her from repercussions, but inside, she felt proud that she could help Alena and stand up against wrong-doings.", "Alena was publicly declared innocent and apologised to by the teachers and Carol. Sarah watched from the sidelines as Alena was surrounded by her friends, their support much needed to heal from this horrible ordeal. The students of CHIJ, initially divided, slowly came to understand the complex layers of the incident. It sparked many conversations among students and teachers about justice, responsibility, and the courage to stand up for what is right. She had learned that the truth, no matter how daunting, carried a weight that was essential for justice. However, justice required the courage to speak up, to stand by the truth, and to face the consequences of doing what is right. Even if it had backfired on her, she would have done the right thing, not only helping Alena, but also guiding her entire school towards a deeper understanding of justice."], "level": "psle"}, {"id": "a-choice-of-kindness", "num": 12, "title": "A Choice of Kindness", "family": "bonds", "path": "Invisible Hero", "source": "W@W PSLE Model Compo Vol.3 · No. 12", "topic": "Write a composition of at least 150 words about an generosity.", "theme": "True generosity is giving up something you want for someone in need.", "audio": "12", "pov": "third", "words": 696, "stages": [{"key": "setting", "paras": [0, 1], "pic": "🎨💰🎪", "hook": "Weeks of savings for one watercolour kit.", "summary": "Eleven-year-old Sally is known for her kindness. She has saved her allowance for weeks to buy a watercolour kit at the neighbourhood mega bazaar. Clutching her money, she heads to the art booth.", "trick": "Opens with a character sketch (‘a heart as big as her aspirations’) that quietly sets up the ending."}, {"key": "rising", "paras": [2], "pic": "👟😔🪙", "hook": "A boy counts coins, sighs, and walks away.", "summary": "At the booth Sally notices a frail, shabbily dressed boy staring at a pair of old shoes. He counts a few crumpled notes and coins, sighs, shakes his head and turns to leave.", "trick": "Show-not-tell: the boy’s poverty is shown through ‘crumpled dollar notes’, a sigh and a shake of the head."}, {"key": "climax", "paras": [3, 4, 5, 6], "pic": "💖🏃‍♀️👟", "hook": "Kit or shoes? Sally chases after Jake.", "summary": "Sally’s eyes flick from the paint kit to the boy. Without a second thought she runs after him. Jake explains his soles are falling off, so Sally spends her savings on the shoes, and his sunken face lights up.", "trick": "The decision is shown through eye movement (‘Her gaze fleeted to the… kit… then back to the boy’) before the action."}, {"key": "falling", "paras": [7, 8], "pic": "🍭🤗👫", "hook": "Cotton candy, a hug, a first friend.", "summary": "Sally and Jake browse the bazaar together and she buys cotton candies with her leftover money. Jake, who has made his first friend, hugs her and calls her the nicest person he has met.", "trick": "Dialogue that reveals feelings – ‘Friends watch out for one another’ – states the new bond in one line."}, {"key": "ending", "paras": [9], "pic": "👨‍👩‍👧💝🏡", "hook": "No paint kit – but a proud, happy heart.", "summary": "At home, Sally’s parents hear about Jake and the shoes. Her mother praises her for giving up something she wanted without hesitation. Sally is proud: helping someone made her day.", "trick": "Uses a parent’s words to state the moral so it does not sound preachy coming from the narrator."}], "vocab": [{"w": "lend a helping hand", "d": "to help someone"}, {"w": "generosity", "d": "the quality of being kind and giving"}, {"w": "bustling", "d": "full of busy activity"}, {"w": "delectable", "d": "delicious or very pleasant to taste or smell"}, {"w": "eyes glimmering with excitement", "d": "showing a small, bright shine in the eyes that reveals strong emotion"}, {"w": "shabbily", "d": "in a way that looks old and in bad condition"}, {"w": "fixated", "d": "having an obsessive attachment or attention to something"}, {"w": "dejected", "d": "unhappy and disappointed"}, {"w": "plight", "d": "a difficult or sad situation"}, {"w": "a tug in her heart", "d": "a sudden emotional feeling of sympathy or sadness"}, {"w": "browsed through", "d": "looked through in a casual or leisurely way"}, {"w": "fleeted", "d": "passed quickly"}, {"w": "without a second thought", "d": "immediately, without pausing to consider"}, {"w": "manning", "d": "to be present at and work at a place or station"}, {"w": "forego", "d": "to decide not to do or have something"}], "paras": ["At the young age of eleven, Sally had a heart as big as her aspirations. Sally had a reputation for being kind and helpful in her neighbourhood. She was always willing to lend a helping hand. However, there was one specific incident that really brought her generosity to light and left a lasting impression on everyone who witnessed it.", "The neighbourhood community centre was holding an annual mega bazaar. Sally had been saving up all her allowances for weeks to purchase a unique set of watercolour painting kit. The mega bazaar was bustling with activity. There were rows of booths neatly lined up selling handcrafted goods, delectable candies, and vintage finds. Clenching her savings tightly in her hands, Sally strolled around, her eyes glimmering with excitement as she headed towards the art and craft booth.", "As Sally reached the art and craft booth, she noticed a frail-looking boy who was shabbily dressed. His clothes looked worn and torn. His glance was fixated on a pair of old shoes placed on the shelves of the booth right next to the art and craft booth. It looked like he was alone. In the past, Sally had noticed this boy wandering outside her school gate by himself and frequently appeared dejected. It was clear that this boy could not afford the pair of shoes. Sally saw him digging into his pockets. He took out a few crumpled dollar notes and coins and began to count the money. He then let out a sigh, shook his head and turned to leave.", "His pitiful plight touched Sally's soul. She felt a tug in her heart. Her gaze fleeted to the watercolour painting kit she had desired and then back to the boy. Without a second thought, she chased after the boy. “Hey, wait!” she called out. Startled, the boy turned around. \"Hi, my name is Sally. I notice you looking at those shoes. Are you in need of a pair of shoes?” Sally asked gently.", "With his eyes wide opened, the boy nodded. He muttered, \"My name is Jake. The soles of my shoes are falling off. I need a pair of shoes to walk around to earn a living.\"", "\"Maybe I could be of assistance,\" Sally gave Jake a warm smile.", "Sally took Jake’s hand and guided him back to the stall. She pointed to the pair of shoes and asked Jake if it was the same pair he had wanted. Jake nodded. She then turned to the vendor manning the booth and passed her savings to him to purchase the pair of shoes for Jake. The vendor was touched by Sally’s generosity and gave her a small discount. Sally was excited and quickly turned to pass Jake the pair of shoes. When Jake tried on the shoes, they fitted him perfectly. His sunken face instantly lit up with joy. \"Thank you so much!\" Jake let out a grateful cry. He was touched by Sally’s generosity. At that moment, Sally felt she had made the right choice to forego the watercolour painting kit and buy the pair of shoes for Jake. It would definitely mean a lot to him.", "Together, they browsed through the rest of the booths in the mega bazaar. Jake felt accepted by someone for the first time. He had made his first friend that day. With the remaining savings she had left, Sally bought some cotton candies for Jake and herself. Jake gave Sally a big warm hug as they reached the exit of the bazaar. \"You're the nicest person I've ever met!\"", "\"I'm glad I could be of some help. Friends watch out for one another,” Sally grinned.", "Sally's parents saw her happy expression when she got home that day. They were proud of her when she told them about Jake and the shoes. Her mother gave her a hug and remarked, \"Sally, you showed true generosity today! Giving up something you want for someone else is not easy, but you did it without hesitation.\" Sally was proud of herself too! Even though she did not get to buy what she had saved up for, being able to help someone in need made her day!"], "level": "psle"}, {"id": "more-than-just-a-crack", "num": 13, "title": "More Than Just a Crack", "family": "bonds", "path": "Crack & Repair", "source": "W@W PSLE Model Compo Vol.3 · No. 13", "topic": "Write a composition of at least 150 words about a fight.", "theme": "Brothers should protect each other – fighting fixes nothing.", "audio": "13", "pov": "third", "words": 720, "stages": [{"key": "setting", "paras": [0], "pic": "🎮☀️👬", "hook": "Sunny afternoon, shared iPad, happy brothers.", "summary": "Brothers Sam and Elvis are glued to their family’s shared iPad, cheering each other on as they take turns. The warm afternoon is full of laughter – for now.", "trick": "Foreshadowing with ‘Little did they know’ warns the reader that the happy scene will not last."}, {"key": "rising", "paras": [1, 2, 3, 4], "pic": "💥📱😠", "hook": "Crash. A jagged crack. ‘It’s your fault!’", "summary": "As the game heats up, Sam leaps up in triumph and knocks Elvis’s hand. The iPad crashes to the floor with a jagged crack across the screen. The boys instantly blame each other.", "trick": "Short, shouted one-line paragraphs (‘It’s your fault!’ / ‘No, it’s yours!’) make the quarrel snap back and forth."}, {"key": "climax", "paras": [5, 6, 7, 8, 9, 10], "pic": "🥊😤🛋️", "hook": "Shoves, punches, flying cushions – ‘Enough!’", "summary": "Elvis shoves Sam, Sam swings a punch, and the living room erupts into a full-blown brawl. Their mother cannot pull them apart. Only their father’s sharp ‘Enough!’ freezes them.", "trick": "Strong action verbs (‘lunged’, ‘wrestled’, ‘flailed’) and chaos imagery (‘Cushions flew’) build the fight scene."}, {"key": "falling", "paras": [11, 12, 13, 14, 15, 16], "pic": "😔🛋️🗣️", "hook": "Chests heaving. Then shame, and the truth.", "summary": "Sam and Elvis sit at opposite ends of the sofa, ashamed. They admit the iPad fell and they blamed each other. Father says fighting fixes nothing; Mother reminds them brothers should protect, not hurt.", "trick": "The parents’ calm dialogue carries the lesson and contrasts with the shouting just before."}, {"key": "ending", "paras": [17, 18], "pic": "🤝🧩💡", "hook": "Not opponents – family. A lesson deeper than a crack.", "summary": "Sam and Elvis look at each other’s bruises and the forgotten iPad. They tidy up together and sit down as family, not rivals. That evening they talk about handling conflict better.", "trick": "Ends by echoing the title – the lesson is ‘etched deeper than any crack on a screen’."}], "vocab": [{"w": "oblivious", "d": "not aware of something or someone, especially what is happening around you"}, {"w": "eyes remained glued to the screen", "d": "watching something with full attention and not looking away"}, {"w": "echoed through the room", "d": "to be repeated or heard loudly across a space"}, {"w": "rivalry", "d": "a situation in which people compete with each other for the same thing"}, {"w": "buzzed with tension", "d": "to be filled with an intense or excited atmosphere"}, {"w": "triumphant", "d": "feeling or showing great success or victory"}, {"w": "frustration boiled over", "d": "became uncontrollable due to intense emotion"}, {"w": "flailed", "d": "to wave something energetically but uncontrolled, often in panic or struggle"}, {"w": "in the heat of the moment", "d": "while temporarily angry or excited and without thinking carefully"}, {"w": "tears of frustration streamed down", "d": "strong emotional tears caused by anger or disappointment"}, {"w": "brawl", "d": "a noisy fight, usually involving several people"}, {"w": "drained", "d": "very tired and without energy"}, {"w": "easing", "d": "becoming less severe, difficult, or unpleasant"}, {"w": "struck a chord", "d": "to cause people to approve of or agree with something because it connects with their feelings"}, {"w": "etched", "d": "clearly and permanently remembered or impressed in the mind"}], "paras": ["The afternoon sun streamed through the windows, casting a warm glow on the brothers, Sam and Elvis. Oblivious to the sunlight, their eyes remained glued to the screen of their family’s shared iPad. They were deeply engrossed in their favourite game. Laughter and excited shrieks echoed through the room as the two brothers took turns playing and competing. They cheered each other on despite the rivalry. Little did they know that their playful afternoon was about to spiral into something more serious.", "As the levels of the game intensified, so did the fierce competition between Sam and Elvis. The room buzzed with tension. Just as the game reached its peak, Sam suddenly leapt up with a triumphant cheer. In his excitement, his hand accidentally collided with Elvis’ as he was making a move. Caught off guard, Elvis lost his grip. The iPad slipped through his fingers and tumbled to the floor with a sickening crash.", "The cheerful atmosphere vanished. In stunned silence, the boys knelt and flipped the iPad over. A jagged crack stretched across the middle of the screen. The consequences of their intense competition now stared them in the face.", "\"It's your fault!\" Sam shouted, pointing an accusing finger at his brother.", "\"No, it's yours!\" Elvis snapped back, his face turning red with anger.", "Their voices grew louder, matching the heat of their emotions. Frustration boiled over. In a moment of rage, Elvis shoved Sam hard in the chest. Caught off balance, Sam stumbled backward, then lunged forward with a wild swing of his fist. It connected with Elvis' shoulder. \"You hit me!\" Elvis roared, his eyes burning with fury. He retaliated with a kick to Sam's leg, followed by a push that knocked Sam into the couch. Sam scrambled back up and charged, grabbing Elvis by the shirt.", "The living room erupted into chaos. The boys wrestled and flailed, fists swinging and feet kicking. Cushions flew as they collided into furniture, their screams echoing down the hallway. Their mother rushed into the room, her face filled with disbelief at the sight before her. She had expected a simple quarrel, but not this full-blown physical fight.", "\"Stop it, both of you!\" she shouted, trying to pull them apart. “What on earth is going on?”", "But neither boy listened. They were too caught up in the heat of the moment. Sam shoved Elvis against the wall while Elvis yelled back, his fists clenched tightly. Tears of frustration streamed down both their faces.", "Just then, their father entered the scene. One look at the cracked iPad, the overturned cushions, and his two sons tangled in a furious brawl was enough. He raised his voice, firm and commanding.", "\"Enough!\" he barked. \"Both of you, sit down. Now.\"", "The brothers froze, startled by the sharpness in their father’s tone. Slowly, they backed away from each other, their chests heaving and fists still trembling. Their mother helped them settle onto the sofa, one on each end, as their father stood before them with arms folded.", "“What happened?” he asked, his voice low but serious.", "The boys looked down, ashamed. The fight had drained their anger, leaving behind only regret. Sam muttered, “We were playing a game… and then the iPad fell.”", "Elvis added, “And we started blaming each other. Then we fought.”", "Their father sighed, the tension easing slightly. “Accidents happen. What matters is how you deal with them. Fighting won’t fix anything.”", "The boys nodded silently. Their mother knelt down, gently placing a hand on each of their shoulders. “You are brothers. You should protect each other, not hurt each other.”", "Her words struck a chord. Sam and Elvis glanced at one another. Both had scratches and bruises. The iPad screen lay cracked and forgotten on the floor. What started as a fun afternoon had turned into an embarrassing, painful memory. Together, they picked up the cushions, returned the snacks to the kitchen, and then sat down on the sofa once more. This time, not as opponents, but as family.", "Later that evening, they discussed how to repair the iPad. More importantly, they talked about how to handle conflict better. The room, once filled with anger and chaos, now held quiet understanding. Though the iPad could be fixed, the fight had left a lesson etched deeper than any crack on a screen."], "level": "psle"}, {"id": "just-a-spoonful-of-jam", "num": 14, "title": "Just a Spoonful of Jam", "family": "bonds", "path": "Crack & Repair", "source": "W@W PSLE Model Compo Vol.3 · No. 14", "topic": "Write a composition of at least 150 words about family conflict.", "theme": "Small quarrels can grow big, but a little peacemaking heals them.", "audio": "14", "pov": "first", "words": 746, "stages": [{"key": "setting", "paras": [0, 1], "pic": "🥧🍓👵", "hook": "Cinnamon kitchen. Grandpa sneaks the jam.", "summary": "On a cloudy Thursday, the narrator and sister Ellie watch Grandma roll out pie dough. Grandpa, famous for sneaking Grandma’s strawberry jam, reaches into the fridge – and this time Grandma turns around.", "trick": "Sets the mood with smells (‘cinnamon and nutmeg’), then a simile for Grandma’s eyes ‘narrowing quicker than the lightning’."}, {"key": "rising", "paras": [2, 3], "pic": "😠🫙🔪", "hook": "‘Frank! That jam is for the bake sale!’", "summary": "Grandma scolds Frank for touching the church bake-sale jam. He claims he was only checking it was good enough. Grandma, cheeks as red as her strawberries, orders him to put it down.", "trick": "Humorous similes (‘guilty as a cat caught with a fish in its mouth’) keep the quarrel funny rather than frightening."}, {"key": "climax", "paras": [4], "pic": "💔🚪😮‍💨", "hook": "‘It’s just jam, Doris.’ Wrong words. ‘It’s over!’", "summary": "Grandpa mutters that it is ‘just jam’. To Grandma that is like calling Michelangelo’s David ‘just a statue’. She orders him out of her kitchen, and Grandpa gives a long sigh carrying years of marriage.", "trick": "A comparison (‘Michelangelo’s David as just a statue’) shows how insulting the words feel to Grandma."}, {"key": "falling", "paras": [5, 6, 7, 8], "pic": "🧒🤫🤝", "hook": "Ellie and I split up: Operation Peacemaker.", "summary": "Grandpa shuffles off, head bowed. The narrator and Ellie split up – one calms Grandma, who admits she overreacted, while Ellie suggests Grandpa help with the bake sale. His eyes twinkle at the idea.", "trick": "Two scenes run side by side (‘Meanwhile, Ellie was with Grandpa’) so the reader sees both sides being mended."}, {"key": "ending", "paras": [9], "pic": "🍎😊🥧", "hook": "Back in the kitchen, peeling apples together.", "summary": "Minutes later Grandma and Grandpa are back together in the kitchen. Grandpa peels apples under Grandma’s watchful eye, and laughter and the smell of cinnamon fill the air again.", "trick": "Ends by echoing the opening – the cinnamon smell returns, showing peace is restored."}], "vocab": [{"w": "deftly", "d": "in a skilful, clever, or quick way"}, {"w": "pottering about", "d": "to do small jobs or activities in a relaxed way without hurrying"}, {"w": "eyes narrowing quicker than the lightning", "d": "a figurative way to describe someone becoming suspicious or alert very suddenly"}, {"w": "sharper than the knife", "d": "used metaphorically to suggest someone is very clever or has a sharp, cutting personality or words"}, {"w": "looking guilty as a cat caught with a fish in its mouth", "d": "a simile describing someone who looks obviously guilty, trying to appear innocent but failing"}, {"w": "cheeks flushed a bright red", "d": "turning red in the face due to embarrassment, shyness, or anger"}, {"w": "comprehend", "d": "to understand something completely"}, {"w": "childish antics", "d": "silly or annoying behaviour typical of a child"}, {"w": "sprang into action", "d": "to suddenly start working or doing something"}, {"w": "head bowed", "d": "having the head lowered, often showing shame, sadness, or submission"}, {"w": "escalate", "d": "to become or make something become greater or more serious"}, {"w": "engulfed", "d": "to surround and cover something or someone completely"}, {"w": "eyes twinkled", "d": "to shine with emotion or joy"}, {"w": "watchful eye", "d": "close observation by someone who is paying careful attention"}, {"w": "rumbling", "d": "a continuous deep sound, often used to describe stomach noise or distant thunder"}], "paras": ["It was a cloudy Thursday, the kind where you cannot quite tell if it is going to pour or if the sun is just playing hide and seek. That morning, everything in Grandma's kitchen smelled like cinnamon and nutmeg, and the clock had not yet struck ten. But it was already clear, at least to me and my sister Ellie, that today was going to be more exciting than watching Grandma bake her famous apple pie. Grandma was at the kitchen counter, her flour-dusted hands moving deftly as she rolled out pie dough. Grandpa, on the other hand, was pottering about, looking for something to eat.", "Grandpa’s love for Grandma’s strawberry jam was a well-known fact in our family. He would sneak teaspoons of it when he thought no one was watching. But today, he was not sneaky enough. Just as he opened the fridge and reached for the jam, Grandma turned around, her eyes narrowing quicker than the lightning we could hear rumbling in the distance.", "“Frank! I told you, that jam is for the church bake sale! Can’t you wait till I make more?” Grandma’s voice was sharper than the knife she used to slice apples. Grandpa, jar in hand and looking guilty as a cat caught with a fish in its mouth, tried his best to look innocent. “I was just making sure it was good enough for the church folks,” he mumbled.", "That was a mistake. Grandma was not someone you could fool with excuses, especially not when it came to her jams. Her cheeks flushed a bright red immediately, much like the strawberries she crushed to make her jams. “Good enough!? Frank, you’ve tasted this jam a hundred times. Put it down this instant!”", "Grandpa’s shoulders drooped as he reluctantly returned the jar to its rightful place. He whispered, \"It's just jam, Doris,\" in a volume that was just loud enough for Grandma to comprehend. From Grandma's perspective, referring to her jam as just jam was equivalent to referring to Michelangelo's David as just a statue. \"That's it, Frank! Your childish antics have reached their limit for me. It's over! Go ahead and leave my kitchen, and don't come back until you've learnt the ability to show some respect for the labour that other people put in!” Together, Ellie and I shared a few glances. In comparison to their typical arguments over the television remote or Grandpa's snoring, this was a more serious argument. The expression on Grandpa's face changed. It appeared as though he was going to argue, but instead he simply sighed, a long, rumbling sigh that seemed to carry with it all of the years that they had spent together in their marriage.", "“Ok Doris, I’ll leave...\" In the process of making his way towards the living room with his head bowed, his voice began to fade away as he shuffled towards the living room. That was when Ellie and I sprang into action. We could not let this escalate into one of those silent dinners where Grandma served Grandpa cold soup and colder stares. We exchanged a quick, wordless plan and split up— Ellie went to console Grandpa, and I stayed behind to tackle Grandma.", "I tugged at the hem of Grandma’s apron, telling her not to be too mad at Grandpa. I even tried covering for him saying that he loves her jam because it is the best in the world. Maybe he just wanted to feel closer to her since she’s been so busy with the bake sale prep. Grandma paused, her eyes softening as she looked down at me. “Oh, dearie, I’m not just mad about the jam. It’s just... sometimes, your grandpa doesn’t think. But I might have overreacted a bit, huh?”", "“Maybe just a tiny bit,” I said, giving her my best 'innocent grandchild' smile.", "Meanwhile, Ellie was with Grandpa, her small hand engulfed by his. “Grandpa, maybe you could help Grandma with the bake sale? Then you could have all the jam you want afterward!” Grandpa’s eyes twinkled as he considered Ellie’s words. Slowly, a smile spread across his face. “That’s a brilliant idea, pumpkin. Let me go apologize and see if your grandma needs help with those pies.”", "Minutes later, with a bit of childlike negotiation and peace-making, Grandma and Grandpa were back in the kitchen together. Grandpa was peeling apples under Grandma’s watchful eye, and the air was once again filled with laughter and the sweet scent of cinnamon."], "level": "psle"}, {"id": "running-from-the-wild", "num": 15, "title": "Running from the Wild", "family": "fixes", "path": "Domino Disaster", "source": "W@W PSLE Model Compo Vol.3 · No. 15", "topic": "Write a composition of at least 150 words about an unexpected encounter.", "theme": "A scary surprise can end in laughter when everyone sticks together.", "audio": "15", "pov": "third", "words": 652, "stages": [{"key": "setting", "paras": [0, 1], "pic": "🏕️🔥🌲", "hook": "Campfire tales of wildlife for two trouble-magnets.", "summary": "Mr. Lim takes his pupils camping in a dense forest. Best friends Scott and Matthew, the school’s notorious pair, listen wide-eyed as he tells campfire stories about deer and foxes lurking in the shadows. The two boys cannot stop whispering about what they might see.", "trick": "Plants a warning early: calling the boys ‘notorious’ and ‘inquisitive’ tells the reader that trouble is coming."}, {"key": "rising", "paras": [2], "pic": "👀🐗😱", "hook": "Rustle in the dark. Boar! Screams wake the camp.", "summary": "Everyone is fast asleep when a loud rustling outside wakes Scott and Matthew. Imagining wolves and bears, they peek out of the tent flap and see a massive wild boar tearing through the trees. They scream, stumble back and wake the whole camp.", "trick": "Show-not-tell fear: ‘exchanged panicked glances’ and ‘hearts were racing’ let the reader feel the panic before the boar even appears."}, {"key": "climax", "paras": [3], "pic": "🏃‍♂️🐗🌙", "hook": "‘Run for your lives!’ – tusks in the moonlight.", "summary": "Mr. Lim rushes over just as a loud snort echoes through the forest. The boar turns and charges at the tent, tusks gleaming. Mr. Lim grabs Scott and Matthew by the hand and leads everyone in a desperate run through the dark woods.", "trick": "A shouted one-line command (‘Run for your lives!’) plus sound effects (‘a loud snort reverberated’) make the peak feel loud and urgent."}, {"key": "falling", "paras": [4], "pic": "😮‍💨🤝😂", "hook": "Safe in the clearing – then everyone laughs.", "summary": "The group collapses in a clearing, gasping for breath. Mr. Lim checks behind them: the boar is gone. Once the relief sinks in, he chuckles at how ridiculous it all was, and the pupils join in, hugging one another before heading back to the tent.", "trick": "Switches the mood from terror to comedy with one line of dialogue (‘Well, that was certainly an adventure’)."}, {"key": "ending", "paras": [5], "pic": "🌟🏕️💪", "hook": "A night nobody would forget.", "summary": "Mr. Lim and his pupils agree it was a night they will never forget. The unexpected encounter with the boar has left them stronger and closer than before.", "trick": "The last paragraph echoes the topic word ‘unexpected encounter’ and ends with an exclamation to round off the adventure."}], "vocab": [{"w": "notorious", "d": "famous for something bad"}, {"w": "inquisitive", "d": "wanting to discover as much as you can about things"}, {"w": "armed with", "d": "having the necessary tools, equipment, or information"}, {"w": "ventured", "d": "to go somewhere that could be dangerous"}, {"w": "wonders of nature", "d": "beautiful, unusual, or amazing aspects of the natural world"}, {"w": "perked their ears up", "d": "to listen closely or suddenly pay attention"}, {"w": "lurked", "d": "to wait or move in a secret way so that you cannot be seen"}, {"w": "intrigued", "d": "very interested or curious"}, {"w": "hit the sack", "d": "to go to bed"}, {"w": "slumber", "d": "sleep"}, {"w": "ravenous", "d": "extremely hungry"}, {"w": "vicious", "d": "violent and dangerous"}, {"w": "tore through the woods", "d": "to move very quickly and forcefully through something"}, {"w": "reverberated", "d": "to be repeated as an echo or a loud effect"}, {"w": "heaved a huge sigh of relief", "d": "to breathe out deeply to show that you are happy something unpleasant has not happened"}], "paras": ["Over the weekend, a brave group of pupils embarked on an exciting camping excursion in a dense forest, guided by their enthusiastic PE teacher, Mr. Lim. Among them were the school’s notorious pair, Scott and Matthew. Because they had so much in common, they were the best of friends. They were inquisitive and frequently got into trouble together. So, armed with a large tent, sleeping bags, and a sense of adventure, the students boldly ventured out to discover what adventures the forest had in store for them.", "Mr. Lim gathered the students around the campfire as the sun began to set. The tall trees glowed under the brilliant light of the campfire. Through the stillness of the woods, Mr. Lim's voice sounded loud and clear: \"Okay, everybody, pay attention! Tonight, we are going to learn about the wonders of nature and maybe even spot some wildlife.\" The students nodded eagerly with wide eyes when they heard the word ‘wildlife’. They perked their ears up and listened intently to their teacher. To make their camping experience even more exciting, Mr. Lim started sharing stories of the wildlife creatures that lurked in the shadows of the forest, from elegant deer to secretive foxes. As they listened on, Scott and Matthew grew more and more intrigued. As the both of them excitedly anticipated the amazing experiences they might have throughout their exciting forest adventure, they could not stop whispering into each other’s ears about their wild imaginations.", "After the campfire gathering, Mr. Lim and the students headed back to their tent for the night. They were tired and hit the sack almost instantly. But their slumber was soon interrupted by a loud rustling sound outside their tent. Scott and Matthew opened their eyes and exchanged panicked glances. Their minds began racing with images of ravenous wolves and vicious bears. Scott and Matthew's hearts were racing rapidly as they unsnapped the tent flap and gazed out, their curiosity getting the better of them. They watched in dismay as a massive wild boar suddenly tore through the woods in close proximity. \"Aaahh!\" Scott and Matthew screamed in unison, stumbling backwards, and waking up the entire camp.", "\"What's going on?\" Mr. Lim heard their loud screams and quickly rushed over to their side. Before anyone could respond, they felt shivers go down their spines as a loud snort reverberated through the forest. Mr. Lim nervously peered out of the tent. Suddenly, he saw the wild boar turned and started to charge towards the tent, its tusks gleaming in the moonlight. \"Run for your lives!\" Mr. Lim yelled at the top of his lungs, his voice trembling with fear. Mr. Lim grabbed the hands of Scott and Matthew, who were nearest to him, and started to lead them to safety, constantly turning his head to ensure the rest of the students followed safely behind. They ran through the forest together, fighting for their lives.", "They eventually reached a clearing after what felt like a lifetime. They collapsed in a heap, their bodies giving way to fatigue, and they were all running out of oxygen. Everyone was breathing heavily and panting. Mr. Lim quickly peered behind to check that the wild boar did not follow them. It was nowhere in sight! He heaved a huge sigh of relief when he saw that everyone was safe. Moments later, it suddenly dawned on him how ridiculous their circumstances were earlier. \"Well, that was certainly an adventure,\" he let out a chuckle. Upon hearing this, the students lightened up and started to join in the laughter. They hugged one another gratefully and helped everyone up on their feet as they carefully made their way back to their tent.", "It was truly a night Mr. Lim and the students would never forget. They had all emerged stronger and closer together after this unexpected encounter with the wild boar. What an adventurous night they had!"], "level": "psle"}, {"id": "in-the-heat-of-the-moment", "num": 16, "title": "In the Heat of the Moment", "family": "guts", "path": "Leap of Faith", "source": "W@W PSLE Model Compo Vol.3 · No. 16", "topic": "Write a composition of at least 150 words about a chase.", "theme": "Courage means acting in the moment even when you are afraid.", "audio": "16", "pov": "first", "words": 726, "stages": [{"key": "setting", "paras": [0], "pic": "☀️🛴🏫", "hook": "Hot afternoon, tired boy, one thought: go home.", "summary": "Under a scorching sun, the narrator hurries across the schoolyard after a tiring day. All he wants is to grab his skate scooter from the racks beside the canteen and head home to rest.", "trick": "Opens with sensory detail (‘shirt clung to my back with sweat’) to put the reader in the heat before anything happens."}, {"key": "rising", "paras": [1, 2, 3, 4], "pic": "🕵️🔒🏃", "hook": "A hooded stranger at the lock. Eyes meet. He bolts.", "summary": "The narrator spots a hooded stranger fiddling with a scooter lock and realises he is a thief. Their eyes lock and the man runs. Without thinking, the narrator gives chase out of the school gate, lungs burning, until a delivery man steps out and blocks the thief’s path.", "trick": "Rhetorical questions (‘Should I shout?’) show the split-second dilemma, then short sentences (‘Our eyes locked.’) snap the tension tight."}, {"key": "climax", "paras": [5, 6], "pic": "🤼💥📱", "hook": "Tackle from behind. ‘Call the police!’", "summary": "The thief skids to a halt, stumbles, and the narrator lunges and tackles him to the ground. He pins the man’s arm down while the delivery man shouts for someone to call the police and a teacher runs up to help.", "trick": "Two very short paragraphs with action verbs (‘lunged’, ‘tackled’, ‘pinned’) make the peak fast and physical."}, {"key": "falling", "paras": [7, 8, 9, 10], "pic": "🏅👏😳", "hook": "Pride on the kerb, applause at assembly.", "summary": "The security guard arrives and the thief is restrained. Sitting on the kerb, the narrator feels a strange mix of pride and disbelief. The next morning, Principal Mr Tan praises him at assembly and pins on a ‘Student of the Month’ badge while the whole school claps.", "trick": "A time jump (‘The next morning at assembly’) lets the author show the reward and the narrator’s feelings of being ‘seen’."}, {"key": "ending", "paras": [11], "pic": "💡🦁❤️", "hook": "Courage is acting when it counts.", "summary": "The narrator reflects that courage is not about having no fear but about acting when it truly matters. He did not plan to be a hero; the chase showed him what he was capable of.", "trick": "Closing reflection that ties back to the chase (‘In that chase, I not only caught a thief...’) and states the lesson in the narrator’s own voice."}], "vocab": [{"w": "fastened my pace", "d": "to walk or run more quickly"}, {"w": "fiddling clumsily", "d": "to touch or move something with your hands in an awkward or nervous way"}, {"w": "darting his eyes left and right", "d": "looking around quickly and suddenly"}, {"w": "my breath caught in my throat", "d": "to suddenly stop breathing normally because of fear, surprise, or shock"}, {"w": "frantically", "d": "in a hurried, excited, or disorganized way because of fear or worry"}, {"w": "for the truth to hit me", "d": "to suddenly realise something shocking or painful"}, {"w": "my heart pounded like a drum in my chest", "d": "a simile describing a fast and heavy heartbeat due to fear or excitement"}, {"w": "bolted", "d": "to move or run away suddenly"}, {"w": "veered", "d": "to change direction suddenly"}, {"w": "breaths were laboured", "d": "breathing that is difficult or requires extra effort"}, {"w": "sluggish", "d": "moving or reacting more slowly than usual"}, {"w": "skidded to a halt", "d": "to slide suddenly and stop, often uncontrollably"}, {"w": "legs trembled from the exertion", "d": "physical or mental effort that causes tiredness"}, {"w": "surreal", "d": "strange and unreal, like a dream"}, {"w": "deeply gratifying", "d": "giving great satisfaction or pleasure"}], "paras": ["I fastened my pace as I cut through the schoolyard under the scorching afternoon sun. My shirt clung to my back with sweat, and all I wanted was to grab my skate scooter and head home for a much-needed rest after a demanding day. The bike racks were just around the corner, tucked beside the canteen wall.", "As I turned the corner, movement caught my eye. My steps slowed. A man, crouched low beside one of the scooters, was fiddling clumsily with the lock. His hood was pulled tightly over his head despite the unbearable heat, and he kept darting his eyes left and right. My breath caught in my throat. He was not a student. He did not look like a teacher either. He was a complete stranger, and he was clearly up to no good.", "The man jiggled the lock frantically, muttering something under his breath. It did not take long for the truth to hit me. He was trying to steal a skate scooter. My heart pounded like a drum in my chest. I froze for a moment, unsure of what to do. Should I sneak away and find help? Should I shout? Before I could make a decision, the man looked up and saw me. Our eyes locked.", "In that instant, he sprang up and bolted. Instinct kicked in. Without a second thought, I dashed after him. My schoolbag thudded against my back as I gave chase, each step landed heavily as I raced forward. The man darted past the canteen and veered through the school gate. I shouted for help, but my voice was nearly drowned by the sound of my racing pulse. Still, I pressed on, my lungs burning with every step.", "He sprinted down the pavement, weaving past parked cars. I could tell he was starting to slow down. His breaths were laboured, his movements growing sluggish. Just as I thought I might lose him around the next bend, a delivery man stepped out of a nearby shop. Seeing the chase, the man quickly stuck out his arm and blocked the path.", "The thief skidded to a halt, too late to avoid the barricade. He stumbled, and I took my chance. I lunged forward and tackled him from behind, sending both of us tumbling to the ground.", "\"Call the police!\" the delivery man shouted to someone nearby. A shop assistant emerged with a phone, her eyes wide with shock. The thief struggled, but I pinned his arm down as best as I could until a nearby teacher, who had been running from the school, arrived to help.", "Within minutes, the school’s security guard came panting up the path, and the man was finally restrained. As the police were called, I sat on the kerb, panting, sweat dripping from my hairline. My legs trembled from the exertion, but my heart swelled with a strange mix of pride and disbelief. I had actually chased down a thief.", "The next morning at assembly, our principal, Mr Tan, stepped onto the stage with a serious look. He tapped the microphone and began to speak.", "“Yesterday, a student from our school displayed incredible courage. He noticed someone attempting to steal a skate scooter and acted quickly. Not only did he raise the alarm, but he also helped stop the culprit with the assistance of a member of the public. We are proud to acknowledge him today.”", "My name echoed throughout the hall. The students turned to look at me, and I felt my face heat up. My friends clapped, then the whole school joined in. I never expected a simple afternoon to turn into something like this. It felt surreal, yet deeply gratifying. Mr Tan gave me a small badge that read “Student of the Month” and a handshake that felt firm and sincere. After the ceremony, teachers and classmates approached me to congratulate me. Even those I rarely spoke to gave me a thumbs-up or a smile. I had never felt so seen before.", "That day taught me that courage is not always about having no fear. Sometimes, it is about acting in the moment when it truly counts. I did not plan to be a hero. I just did what I thought was right. In that chase, I not only caught a thief, but I also discovered what I was capable of."], "level": "psle"}, {"id": "from-resistance-to-realisation", "num": 17, "title": "From Resistance to Realisation", "family": "growth", "path": "Second Try", "source": "W@W PSLE Model Compo Vol.3 · No. 17", "topic": "Write a composition of at least 150 words about a learning experience.", "theme": "Open your mind to what you resist and you may discover something you love.", "audio": "17", "pov": "third", "words": 681, "stages": [{"key": "setting", "paras": [0, 1], "pic": "😒🏮☀️", "hook": "Sulky Jake dragged to Chinatown on a Saturday.", "summary": "On a sweltering Saturday, Jake trails behind his classmates in Chinatown, wishing he were home gaming. He feels distant from his Chinese heritage. Mr. Tan tells the class to observe, take notes and capture the essence of Chinatown by three o’clock.", "trick": "Matches mood to weather (‘his mood as sullen as the sweltering heat’) – a simile that doubles as scene-setting."}, {"key": "rising", "paras": [2, 3, 4, 5, 6], "pic": "🏪🌿🐴", "hook": "A quaint herbal shop and a lonely old man.", "summary": "Jake wanders into Wong’s Herbal Medicine, a calm shop full of labelled jars. Elderly Mr. Wong warns him that a dried seahorse treats asthma, then reveals he runs the family shop alone. Jake hears a sadness in his voice that reminds him of losing his own grandfather.", "trick": "Uses the five senses (‘earthy aroma of dried herbs’) and short dialogue exchanges to reveal character bit by bit."}, {"key": "climax", "paras": [7], "pic": "✨📝🫚", "hook": "Stories of ginseng and ginger melt his reluctance.", "summary": "Jake lingers as Mr. Wong, eyes sparkling, explains ginseng, chamomile and ginger and shares stories of customers cured by traditional remedies. Jake listens avidly and scribbles notes. With every story, his reluctance dissipates.", "trick": "The turning point is shown through a change in body language – the old man’s ‘eyes lit up’ and Jake ‘jotting down copious notes’ – not just stated."}, {"key": "falling", "paras": [8, 9, 10], "pic": "♟️🏯😊", "hook": "Chess with uncles; grumpy boy turns grateful.", "summary": "Jake thanks Mr. Wong, who invites him back anytime. Enriched, he explores further, admiring carvings and sitting with elderly men playing Chinese chess, which he surprisingly enjoys. When it is time to regroup, Jake is grateful for the day.", "trick": "A before-and-after contrast sentence (‘arrived... feeling grumpy... leaving with a newfound appreciation’) sums up the change."}, {"key": "ending", "paras": [11, 12, 13, 14], "pic": "🚌💬❤️", "hook": "‘I learned a lot more than I expected.’", "summary": "On the bus, Mr. Tan asks about Jake’s day and Jake says honestly that it was amazing. Mr. Tan calls it the magic of Chinatown. Looking out of the window, Jake knows he will return to the place he once resisted.", "trick": "Ends with dialogue between teacher and pupil, then a final reflective line that echoes the title (‘a place he had initially resisted’)."}], "vocab": [{"w": "sullen", "d": "angry and unwilling to smile or be pleasant to people"}, {"w": "at odds with", "d": "in disagreement with someone or something"}, {"w": "kindle", "d": "to cause strong feelings or ideas in someone"}, {"w": "fell flat", "d": "to fail to produce the intended effect or result"}, {"w": "allure", "d": "the quality of being attractive, interesting or exciting"}, {"w": "hoisting", "d": "to lift something, especially something heavy, using ropes or machines"}, {"w": "quaint", "d": "attractively unusual or old-fashioned"}, {"w": "tranquil retreat", "d": "a peaceful and quiet place where you can rest or escape from busy life"}, {"w": "stooped", "d": "to bend the top half of the body forward and down"}, {"w": "exotic", "d": "unusual and exciting because it comes from a distant or foreign country"}, {"w": "revitalizing", "d": "making something stronger, more active or more energetic"}, {"w": "avidly", "d": "with great interest or enthusiasm"}, {"w": "dissipated", "d": "to gradually disappear or make something disappear"}, {"w": "a pang of reluctance", "d": "a sudden sharp feeling of hesitation or unwillingness"}, {"w": "facades", "d": "the front of a building, especially a large or attractive one"}], "paras": ["The heat of the midday sun was intense, casting long shadows across the bustling streets of Singapore’s Chinatown. Jake lagged behind his classmates, his mood as sullen as the sweltering heat. Instead of wandering through crowded markets on a Saturday, he would much rather be home, gaming or losing himself in the latest blockbuster. Yet, here he was, part of Mr. Tan’s \"immersive learning experience\" for their history project. Jake, like many of his peers, felt distant from his Chinese heritage, finding the ancient customs at odds with the modern world. His parents’ attempts to kindle a sense of cultural pride in him often fell flat, lost to the allure of Western media.", "\"Alright, class,\" Mr. Tan announced, \"remember, you’re here to observe and take notes. Capture the essence of Chinatown. You have until three o'clock.\"", "Jake sighed, hoisting his backpack higher on his shoulder. Lost on where to begin, his gaze wandered until it caught a glimpse of a quaint shop nestled in a shadowy nook of the street. Dimly lit and inviting, it stood with quiet dignity against the chaos. The sign above the door read \"Wong’s Herbal Medicine.\" Driven by curiosity, Jake stepped inside. The shop was a tranquil retreat from the chaos outside. An earthy aroma of dried herbs greeted him. Shelves crammed with glass jars and wooden boxes meticulously labelled in Chinese characters, lined the walls.", "Behind the counter stood an elderly man, his posture stooped, his face weathered with age. \"Good afternoon,\" Jake greeted, momentarily shedding his irritability. \"I’m just looking around.\"", "Mr. Wong nodded but remained silent. Jake’s attention was captured by the exotic items on display, picking up a jar with a dried seahorse and examining it. \"That is used to treat asthma,\" Mr. Wong explained, \"Very potent. Be careful.\"", "Startled, Jake carefully replaced the jar and turned to Mr. Wong. \"Do you run this shop alone?\"", "\"Yes,\" Mr. Wong replied, \"My family has owned this shop for generations. Now, it’s just me.\" Something in the old man’s tone caught Jake’s attention. Jake sensed a profound sadness in Mr. Wong, a feeling he recognized from the loss of his own grandfather.", "Jake lingered in the shop, drawn into conversation with Mr. Wong about the herbs and their medicinal uses. As the old man explained the restorative power of ginseng, the calming essence of chamomile, and the revitalizing nature of ginger, his eyes sparkled with life. His eyes lit up as he shared stories of customers who had been cured by these traditional remedies. Jake listened avidly, jotting down copious notes, and capturing Mr. Wong's stories. With each narrative, his initial reluctance dissipated.", "Upon leaving, Jake felt a pang of reluctance, thanking the old man profusely. Mr. Wong nodded, a faint smile playing on his lips. \"You are welcome, young man. Come back anytime.\"", "Feeling enriched, Jake delved deeper into Chinatown, captivated by the intricate carvings on building facades and the lively chatter of families. His exploration led him to an open-air area where elderly men played Chinese chess. Drawn by their intense focus and the rhythmic clinking of chess pieces, Jake sat down, quickly absorbed by the strategic play and animated discussions. To his surprise, he thoroughly enjoyed the unfamiliar game, fascinated by its complexity.", "When it was time to regroup, Jake was grateful for the experience. He had arrived in Chinatown feeling grumpy and uninterested, but he was leaving with a newfound appreciation for the vibrant culture and the people who kept it alive.", "On the bus back to school, Mr. Tan asked, \"So, Jake, how was your experience?\"", "\"It was amazing, Mr. Tan. I learned a lot more than I expected,\" Jake smiled genuinely.", "\"That’s the magic of Chinatown, Jake. There’s always something new to discover if you’re open to it,\" Mr. Tan replied, pleased.", "Looking out the bus window as they drove away, Jake felt a brand new connection to a place he had initially resisted. He knew he would return to Chinatown, not just for school, but to continue exploring this vibrant community that had unexpectedly captured his heart."], "level": "psle"}, {"id": "a-taste-of-growth", "num": 18, "title": "A Taste of Growth", "family": "growth", "path": "Second Try", "source": "W@W PSLE Model Compo Vol.3 · No. 18", "topic": "Write a composition of at least 150 words about a valuable lesson.", "theme": "Doing your best and loving what you do matter more than winning.", "audio": "18", "pov": "first", "words": 669, "stages": [{"key": "setting", "paras": [0], "pic": "👩‍🍳🍳👧", "hook": "Age six, on a stool, watching Mum cook magic.", "summary": "At six years old, the narrator sits in the kitchen watching her mother cook. Amid sizzling pans and the smell of herbs, her love for cooking is born, and soon her small hands are copying her mother’s movements.", "trick": "Opens with a childhood flashback full of sound and smell (‘symphony of sizzling pans’) to show where the passion began."}, {"key": "rising", "paras": [1, 2], "pic": "🏆⏱️🥩", "hook": "Competition day: ninety minutes, one signature dish.", "summary": "Years later, the narrator enters a nationwide junior cooking competition and practises hard. In the bustling arena, she has 90 minutes to make her signature herb-crusted rack of lamb. The clock starts and she cooks with purpose, heart racing.", "trick": "Builds stakes by naming exact details – ‘90 minutes’, the full dish – so the reader knows precisely what could go wrong."}, {"key": "climax", "paras": [3], "pic": "😱🍖⬇️", "hook": "Lamb hits the floor. Buzzer. Empty plate.", "summary": "Time slips away and mistakes creep in. With ten minutes left, the lamb is undercooked and, in her haste, it slips off the rack onto the floor. Frozen like a deer in headlights, she hears the final buzzer with her dish incomplete and an empty plate.", "trick": "Slow-motion disaster: a string of time markers (‘minutes ticked away’, ‘ten minutes left’, ‘final buzzer’) tightens the pressure to breaking point."}, {"key": "falling", "paras": [4], "pic": "🤲💗🌤️", "hook": "A hand on the shoulder: ‘You did your best.’", "summary": "Her mother appears, eyes full of pride, and tells her that doing her best is what matters. The disappointment lifts as the narrator realises she pushed her limits and stayed true to the joy of cooking her mother taught her.", "trick": "A metaphor for comfort (‘a soothing balm to my wounded spirit’) shows the emotio
