nal turn without over-explaining."}, {"key": "ending", "paras": [5], "pic": "🔥🧑‍🍳➡️", "hook": "Journey not over – back to the kitchen.", "summary": "Watching the judges taste the other dishes, the narrator feels respect for every young chef. The competition is over, but her culinary journey is not, and she returns home with renewed determination.", "trick": "Ends by pointing forward (‘my culinary journey was far from over’) so the failure becomes a beginning, not an end."}], "vocab": [{"w": "passionate pursuit", "d": "an activity someone strongly cares about and puts great effort into"}, {"w": "dove into", "d": "to start doing something quickly and energetically"}, {"w": "fervour", "d": "strong and sincere beliefs or feelings"}, {"w": "gourmet", "d": "high-quality food or someone who knows a lot about food"}, {"w": "a whirlwind of activity", "d": "a situation in which many things happen quickly and are very busy or confusing"}, {"w": "moved with purpose", "d": "to act or walk with determination and clear intention"}, {"w": "poured my soul into", "d": "to give all of one’s effort, emotions or energy into something"}, {"w": "time was slipping through my fingers", "d": "a metaphor meaning time was passing very quickly and uncontrollably"}, {"w": "cacophony", "d": "a loud, unpleasant mixture of sounds"}, {"w": "a sinking feeling in my stomach", "d": "a sudden feeling of dread or fear"}, {"w": "envisioned", "d": "to imagine or expect something in the future, especially as a possibility"}, {"w": "a deer in headlights", "d": "to be so frightened or surprised that you cannot move or think"}, {"w": "stood rooted to the spot", "d": "to be so shocked or scared that you cannot move"}, {"w": "a soothing balm to my wounded spirit", "d": "something that comforts or relieves emotional pain"}, {"w": "resonated", "d": "to evoke a feeling of shared emotion or understanding"}], "paras": ["At the tender age of six, I found myself perched on a stool in our kitchen, eyes wide with wonder as my mother danced around the room, her hands weaving culinary magic. It was there, amid the symphony of sizzling pans and the aroma of fresh herbs, that my love for cooking began. With every stir and chop, I absorbed the rhythms of the kitchen, and soon, I was not just observing but participating, my small hands clumsily mimicking my mother's skilled movements.", "As years passed, my fascination with cooking grew into a passionate pursuit. Mother and I experimented with flavours and textures, turning our kitchen into my personal playground. I learned to listen to the food, understanding that each ingredient had a story to tell. My mother, my greatest teacher, always encouraged me to trust my instincts and to cook from the heart. So when the opportunity to compete in a junior cooking competition nationwide similar to MasterChef Kids surfaced, I took it as a chance to showcase my skills and to honour the culinary journey I had embarked on with my mother. I dove into preparation with fervour, practicing and perfecting my favourite dishes until they were just right no matter how long it took.", "The day of the competition arrived, and I stood in the bustling kitchen arena, surrounded by talented young chefs, each brimming with dreams and determination. The challenge was to create a gourmet dish in 90 minutes, a test of skill, creativity, and time management. I chose to prepare my signature dish - a delicate, herb crusted rack of lamb with crushed potatoes and beetroot puree, a dish that always reminded me of home. The clock started, and the kitchen transformed into a whirlwind of activity. I moved with purpose, my heart racing with excitement and nerves. Chopping, searing, and seasoning, I poured my soul into the dish, each step a reflection of the countless hours spent in the kitchen with my mother.", "However, as the minutes ticked away, I realized that time was slipping through my fingers faster than I had anticipated. The pressure mounted, and small mistakes began to creep in. My hands trembled as I tried to focus, the cacophony of the kitchen fading into a distant hum. With ten minutes left on the clock, I glanced at my dish, a sinking feeling in my stomach. The lamb looked undercooked, and the potatoes lacked the crispness I had envisioned. Panic set in, and in my haste, I fumbled, watching in horror as the lamb slipped from the rack and onto the floor as I was trying to place it back in the oven to let it cook a little more. I halted, a deer in headlights, mind flickering through possibilities. In what felt like forever, I heard the final buzzer sound, marking the end of the competition. I stood rooted to the spot, my dish incomplete, a storm of emotions raging within me. Disappointment, frustration, and a sense of failure washed over me as I looked at my empty plate.", "Amid the chaos, I felt a gentle hand on my shoulder. It was my mother, her eyes brimming with pride. \"You did your best, and that's what matters,\" she said, her voice a soothing balm to my wounded spirit. Her words resonated with me, and slowly, the weight of disappointment lifted. I realized that while I had not completed my dish, I had embarked on a valuable journey. I had pushed my limits, embraced my passion, and most importantly, I had remained true to the joy of cooking that my mother had instilled in me.", "As I watched the judges taste the creations of my fellow competitors, I felt a sense of camaraderie and respect for each young chef who had poured their heart into their dishes. The competition may have ended, but my culinary journey was far from over. I returned to my kitchen with renewed determination and a deeper understanding of what it means to be a chef."], "level": "psle"}, {"id": "a-climb-worth-taking", "num": 19, "title": "A Climb Worth Taking", "family": "guts", "path": "Uphill Climb", "source": "W@W PSLE Model Compo Vol.3 · No. 19", "topic": "Write a composition of at least 150 words about teamwork.", "theme": "A team that looks out for each other can climb any mountain together.", "audio": "19", "pov": "first", "words": 735, "stages": [{"key": "setting", "paras": [0, 1], "pic": "🏢📋👫", "hook": "Forty storeys? Four kids, one donation drive.", "summary": "The Primary Six cohort gathers for a one-day donation drive and Mr Tan assigns Class 6C to Block 117, a forty-storey building. The narrator’s group of four – Sarah, Lionel, Lucas and herself – shoulder their canvas bags and brace for the climb.", "trick": "Quick one-line character tags (‘Sarah, my ever-efficient classmate, Lionel, the energetic chatterbox’) introduce the team efficiently."}, {"key": "rising", "paras": [2, 3, 4, 5, 6], "pic": "🐕🛡️🙂", "hook": "Smooth start, then a growling dog at the gate.", "summary": "The first floors go smoothly, each friend with a role. On the 16th floor a large dog growls behind a gate and the narrator’s legs turn to jelly. Lucas calmly steps in front, Sarah speaks politely, and the owner reassures them. Sarah says, ‘We’ve got your back.’", "trick": "A small scare shows teamwork in action (‘Lucas stepped in front of me calmly’) before the big obstacle arrives."}, {"key": "climax", "paras": [7, 8, 9], "pic": "🛗⚠️🪜", "hook": "Lift dies between floors. Stairs it is.", "summary": "Between the 26th and 27th floors the lift jerks to a halt and goes out of service. The team forces the doors open, calls Mr Tan and decides to finish on foot. Sarah splits the group, Lionel labels bags, and they persevere up the endless stairs, rotating roles.", "trick": "Short, clipped sentences at the breakdown (‘Out of service.’) then a clear decision point (‘we decided to continue our task on foot’)."}, {"key": "falling", "paras": [10, 11], "pic": "🌇🎒👏", "hook": "Down the stairs, bags heavy, Mr Tan impressed.", "summary": "They lug the heavy bags down the narrow stairwell, each step a small victory, and reach the collection point breathless as the afternoon light turns golden. Mr Tan praises them for finishing forty floors despite the lift breakdown.", "trick": "Uses light to mark time passing (‘late afternoon sun cast golden light’) and a teacher’s praise to sum up the achievement."}, {"key": "ending", "paras": [12], "pic": "🤝😅🏅", "hook": "Four individuals became one true team.", "summary": "The narrator looks at her sweaty, proud classmates. They began the day as four individuals given a task and end it united as a true team.", "trick": "A contrast ending (‘four individuals... a true team’) that echoes the topic word ‘teamwork’."}], "vocab": [{"w": "buzzing with anticipation", "d": "feeling very excited or eager about something that is going to happen"}, {"w": "roped in", "d": "to persuade someone to help with a job or join an activity, especially when they do not want to"}, {"w": "my jaw drop", "d": "to be extremely surprised or shocked"}, {"w": "scaled the towering building", "d": "to climb up something very tall or high"}, {"w": "bracing ourselves", "d": "preparing yourself physically or mentally for something difficult or unpleasant"}, {"w": "ordeal", "d": "a very difficult or unpleasant experience"}, {"w": "went by in a flash", "d": "to pass very quickly"}, {"w": "seamless", "d": "happening without any sudden changes, interruptions, or problems"}, {"w": "energy among us was high", "d": "strong enthusiasm and excitement shared by people in a group"}, {"w": "our spirits buoyed by teamwork", "d": "to support or raise someone’s spirits; to encourage"}, {"w": "ears pinned back", "d": "describing an aggressive animal posture where the ears are laid flat, showing readiness to attack"}, {"w": "staggered", "d": "to walk or move unsteadily, as if about to fall"}, {"w": "legs turned to jelly", "d": "a feeling of weakness in the legs due to fear, shock, or exhaustion"}, {"w": "came to a halt", "d": "to stop suddenly or completely"}, {"w": "panic rose in my chest", "d": "to suddenly feel a strong fear or anxiety"}], "paras": ["The morning sun peeked through the clouds as we gathered in the school foyer, buzzing with anticipation. Our entire Primary Six cohort had been roped in to carry out a one-day donation drive, and classes were assigned different housing blocks to collect items from residents. As Mr Tan read out our assigned block, I felt my jaw drop. “Class 6C, you will be assigned to Block 117, a forty-storey building,” he announced, waving a clipboard. My classmates and I exchanged wide-eyed looks. Forty storeys? That was nearly double the height of any other block.", "My group consisted of four members: Sarah, my ever-efficient classmate, Lionel, the energetic chatterbox, Lucas, our steady and strong friend, and me. We were briefed that we would go door to door to collect items such as canned food, clothing, and books. The donations were to be placed into large canvas bags provided by the school and later returned to the collection point under the shelter beside the block. With our bags slung over our shoulders and instructions fresh in our minds, we scaled the towering building, bracing ourselves for the challenge ahead.", "The first few floors went by in a flash. Sarah handled the clipboard and ensured we ticked off the units we had visited. Lucas and Lionel took turns carrying the heavier items, while I rang the doorbells and greeted the residents. Most people were friendly and generous. Bags quickly filled with packets of rice, stacks of books, neatly folded clothes, and even toys. Our teamwork felt seamless, and the energy among us was high. We encouraged one another as we completed one floor after another, our spirits buoyed by teamwork.", "At the 16th floor, we approached a unit with a slightly open door. I hesitated but knocked gently. Before I could speak, a loud bark rang out. A large dog appeared behind the gate, growling with ears pinned back. I staggered backwards, clutching my bag. My legs turned to jelly. Before I could retreat, Lucas stepped in front of me calmly. Sarah and Lionel stood beside him.", "\"Good morning, we’re from the neighbourhood school and we’re collecting donations for charity,\" Sarah said politely, her voice firm despite the barking.", "A man soon appeared and smiled. “Don’t worry, Rocky’s just noisy. He won’t bite.”", "Lucas held the bag open while Lionel collected two heavy bundles of canned food. I remained behind them, deeply thankful my teammates had instinctively protected me. As we walked away, Sarah gave me a reassuring smile. “We’ve got your back,” she said simply. I nodded, warmed by the gesture.", "We resumed our collection, steadily working our way up. Just as we were about to move from the 26th to the 27th floor, the lift jerked and came to a halt. We pressed the buttons, but nothing worked. The lights flickered before a message blinked on the panel: Out of service. Trapped between two floors, panic rose in my chest.", "After a few tense moments, the doors creaked open slightly. We forced them apart and stepped cautiously into the landing. Lionel used his phone to contact Mr Tan and report the situation. Rather than to descend all the way to the ground floor, we decided to continue our task on foot.", "Sarah proposed a new plan. Two of us would climb higher to collect items while the others remained on the stairwell landing to sort and repack the donations. Lionel marked the bags clearly using sticky notes and markers so nothing would be misplaced. Undaunted by fatigue, we persevered. The stairs seemed endless, but we rotated roles, boosted each other's spirits, and tackled the final floors one at a time, an ordeal that tested our resolve.", "Finally, we began our descent, lugging the heavy canvas bags down the narrow stairwell. Each step felt like a small victory. By the time we reached the bottom, we were breathless and drained. The late afternoon sun cast golden light over the pavement as we dropped our bags off at the collection point.", "Mr Tan came over, clearly impressed. “Well done, team,” he said, clapping his hands. “Forty floors and a lift breakdown, yet everything is here, neatly sorted. That’s real teamwork.”", "I turned to my classmates, their faces damp with sweat but glowing with pride. We had begun the day as four individuals assigned a task but by the end of it, we were united as a true team."], "level": "psle"}, {"id": "quiet-voice-loud-triumph", "title": "A Quiet Voice, A Loud Triumph", "family": "guts", "path": "Uphill Climb", "source": "W@W PSLE Model Compo Vol.3 · No. 20", "topic": "Write a composition of at least 150 words about overcoming fear.", "theme": "Courage is built step by step – prepare, practise, then take the stage.", "audio": "20", "pov": "third", "words": 721, "stages": [{"key": "setting", "paras": [0], "pic": "🎭😰🦋", "hook": "Frozen on stage once. Never again.", "summary": "Fuchsia remembers her first stage fright: staring eyes like glowing moths, no voice, fleeing in shame. Now she is determined to beat it.", "trick": "Starts with the painful memory so we know exactly what the mountain to climb is."}, {"key": "rising", "paras": [1, 2], "pic": "📜🙋‍♀️👨‍👩‍👧", "hook": "A tiny role, a big training plan.", "summary": "She volunteers for the Narrator – only two short lines. Then she trains: reading aloud alone, to two people, to small groups, collecting tips and learning to speak slowly and meet people’s eyes.", "trick": "The ‘climbing’ is shown as small steps that get bigger – the reader can feel the progress."}, {"key": "climax", "paras": [3, 4], "pic": "🎬🫁🎤", "hook": "Centre stage. Deep breath. “Once upon a time…”", "summary": "On the day of the play, Fuchsia marches to centre stage, hands trembling, sweat on her brow. She draws a steadying breath and says her lines in a clear voice that echoes off the walls.", "trick": "The one-line paragraph of dialogue makes the climax land like a spotlight."}, {"key": "falling", "paras": [5], "pic": "🚶‍♀️🎭😮‍💨", "hook": "No stutter, no silence – and a huge sigh of relief.", "summary": "She finishes without interruption, glides off calmly, and behind the curtain lets out a massive sigh of relief.", "trick": "Short and calm after the climax – the tension releases quickly."}, {"key": "ending", "paras": [6], "pic": "🏆✨💪", "hook": "Short moment, lifelong win.", "summary": "Her time in the spotlight was brief but unforgettable. Stage fright did not trouble her for a second, and she knows she has conquered it for good.", "trick": "Ends with the word that answers the topic: she has ‘triumphed’ over fear."}], "vocab": [{"w": "stomach churned with dread", "d": "felt extremely anxious or sick with fear"}, {"w": "a sheen of icy perspiration", "d": "a smooth, shiny, and often thin layer of sweat caused by nervousness or fear"}, {"w": "grotesque", "d": "strange and unpleasant, especially in a silly or frightening way"}, {"w": "resolute", "d": "determined in character, action, or ideas"}, {"w": "embellishments", "d": "decorative details or features added to make something more attractive"}, {"w": "adornments", "d": "something decorative, or the act of decorating something or someone"}, {"w": "unsensational", "d": "not exciting or impressive; plain or modest"}, {"w": "single-mindedly", "d": "with total concentration on only one aim or goal"}, {"w": "trepidation", "d": "fear or worry about what is going to happen"}, {"w": "wobbled", "d": "to move unsteadily from side to side"}, {"w": "beads of perspiration trickled down", "d": "small drops of sweat moving slowly down due to stress or heat"}, {"w": "drew a steadying breath", "d": "took a deep breath to calm herself or gain confidence"}, {"w": "glided off with composure", "d": "moved smoothly and calmly, showing self-control"}, {"w": "ephemeral", "d": "lasting for only a short time"}, {"w": "triumphed over it", "d": "succeeded in defeating something difficult or challenging"}], "paras": ["Fuchsia clearly remembered her first time with stage fright. In front of dozens of people, her stomach churned with dread like a boat on stormy seas and a sheen of icy perspiration soaked her clothes. She felt countless eyes staring at her, and her fear turned them into grotesque moths with glowing eyes and eyeball-shaped wings. With a pounding heart, she tried to force out her voice, but nothing came out, and she fled the stage while shame coloured her face deep red. However, that was the past, and Fuchsia was resolute in her determination to conquer her stage fright before her next attempt at speaking in public.", "Her class was going to perform a play for a school event right before the June holidays, and all her classmates were brimming with anticipation. Many students leapt at the chance to become lead actors in starring roles, while others dreamed of the embellishments or stage adornments they could craft to wow the audience. On the other hand, Fuchsia saw an opportunity for herself in a significantly smaller role in the play’s cast, the Narrator. The role would have someone speak only twice throughout the play, once at its beginning and once at its conclusion, and at both times the Narrator would only say a few lines before disappearing completely to let everyone else shine in the spotlight. It was such an unwanted role, that when the class was deciding who would perform, Fuchsia’s hand was the only one raised in the entire class. It was certainly an unsensational role, but it was ideal as a way for Fuchsia to redeem herself for her past public speaking failure.", "Yet Fuchsia knew without a single doubt that she would still need a lot of preparation before she could be ready to confront her stage fright, even if she was only going to say a few sentences in a row. As a start, Fuchsia began a habit of reading anything out loud when she was on her own, so that she would get used to hearing her own voice outside of her head. After that, the shy girl read out loud to friends or family, starting with pairs of people and gradually increasing the size of the groups. In turn, her friends and family gave her comments on how she did with her speaking, as well as further tips on how she could battle her feelings of stage fright. Over time, the shy girl learned to speak slowly and steadily when talking to large groups, and she learned to look people in the eyes and move her gaze slowly over gatherings of people. Step by step, Fuchsia felt herself become more and more ready to challenge her stage fright.", "After weeks of practice, Fuchsia’s day of destiny arrived. The play was ready to be performed on stage in front of the whole school, and several student stagehands were rushing about with costumes and props and decorations. Alongside other student actors rehearsing their roles, Fuchsia single-mindedly revised her own lines written on paper. Under her breath, she whispered them out over and over until she felt that she had formed them out of thin air and stored them in the back of her throat. Then, she heard the cue for the play’s beginning. Her moment of truth was near. She marched out onto the centre of the stage, her hands trembling with trepidation. She turned sharply and looked out with wide open eyes to a massive audience of fellow students and teachers. Her stomach wobbled and beads of perspiration trickled down her brow, but then Fuchsia drew a steadying breath and forcefully stated her lines with a clear voice that echoed against the auditorium walls.", "“Once upon a time, in a magical kingdom...”", "She was not silent, and she did not stutter. Fuchsia said her lines without interruption and upon finishing them, she glided off with composure and marched away while other actors took their places. When she was off the stage and behind the curtains, while the play continued without her, the girl breathed out a massive sigh of relief.", "Her moment in the spotlight was ephemeral, but unforgettable. Stage fright had not troubled her for even a second, and she knew deep down that that she had triumphed over it once and for all."], "num": 20, "level": "psle"}, {"id": "finding-my-rhythm", "num": 21, "title": "Finding My Rhythm", "family": "guts", "path": "Uphill Climb", "source": "W@W PSLE Model Compo Vol.3 · No. 21", "topic": "Write a composition of at least 150 words about perseverance.", "theme": "Keep practising through the ugly sounds and progress will come.", "audio": "21", "pov": "third", "words": 675, "stages": [{"key": "setting", "paras": [0], "pic": "🎵💃🤔", "hook": "Music-mad Jessica, but which instrument?", "summary": "Jessica loves music more than anything – she hums, twirls and always has a song playing. Friends ask if she will ever make music herself, but she cannot decide on an instrument.", "trick": "Characterises through habits (‘twirl around the room in time with the rhythm’) rather than listing adjectives."}, {"key": "rising", "paras": [1, 2], "pic": "🎻😖🎧", "hook": "Violin love at first sight – then screeches and howls.", "summary": "A video of her favourite musician playing violin lights Jessica’s path. She researches, then picks the one violin that feels right. But learning is slow: her fingers feel like stale sausages and her screeches make her brother cover his ears. Despite the teasing, she commits to half an hour of practice daily.", "trick": "Humour through a simile (‘fingers felt more like stale sausages’) and gentle family teasing lighten the struggle."}, {"key": "climax", "paras": [3], "pic": "🎶👏🌟", "hook": "Weeks become months. One song, zero mistakes!", "summary": "As weeks pass Jessica notices tiny improvements, which lift her spirits and spur her on. After months of practice she can finally play a whole song without mistakes. She gathers her parents and plays it, ending with a flourish as they applaud with gusto.", "trick": "Compresses time (‘weeks became months’) so the hard-won performance lands as the peak, marked with an exclamation."}, {"key": "falling", "paras": [4], "pic": "💡🚇✨", "hook": "Light at the end of the tunnel.", "summary": "Her parents’ praise lifts Jessica even higher. Now she knows for certain there is a light at the end of the tunnel.", "trick": "A well-known idiom (‘a light at the end of the tunnel’) sums up the emotional payoff in one sentence."}, {"key": "ending", "paras": [5], "pic": "🛤️🎻💪", "hook": "Long road ahead, but she will master it.", "summary": "Jessica knows progress will still be slow and the road long, but she is certain that with diligent practice she will master the violin.", "trick": "Realistic ending – no instant mastery – which echoes the topic ‘perseverance’ and ends on a confident exclamation."}], "vocab": [{"w": "coalesced", "d": "to come together to form one group or mass"}, {"w": "scoured", "d": "to search very carefully and thoroughly"}, {"w": "quintessential", "d": "being the most typical or perfect example of something"}, {"w": "dormant", "d": "not active or growing but able to become active later"}, {"w": "fingers felt more like stale sausages", "d": "a simile describing fingers as stiff and awkward, as if they were thick, inflexible sausage"}, {"w": "cumbersome", "d": "awkward because of being large, heavy, or difficult to handle"}, {"w": "manoeuvre", "d": "to move or turn something skilfully and carefully"}, {"w": "assailed", "d": "to cause someone to experience a lot of unpleasant things all at once"}, {"w": "agony", "d": "extreme physical or mental pain"}, {"w": "sank into a swamp of disappointment", "d": "a metaphor showing how deeply and overwhelmingly she felt disappointed"}, {"w": "dismaying", "d": "causing a feeling of unhappiness and disappointment"}, {"w": "galvanised", "d": "to shock or excite someone into taking action"}, {"w": "panache", "d": "a stylish, confident, and elegant way of doing things"}, {"w": "gusto", "d": "enthusiastic and energetic enjoyment"}, {"w": "there was a light at the end of the tunnel", "d": "used to say that a difficult situation is nearly over"}], "paras": ["If there was one thing that Jessica had to pick as something that she favoured the most, it would be music. She would always have a song playing when she was doing her chores or homework, and if there was no device that could play music, the girl would just hum a tune from whatever song she had recently memorised. Sometimes, when a particularly good song was playing, she would just get up and twirl around the room in time with the rhythm. Friends asked if Jessica would ever try making music herself, but she always said that she was still indecisive over what instrument she would like.", "However, that would change when she saw a video of her favourite musician playing an unrehearsed piece on a violin. Even without any preparation, the sounds from the violin coalesced into a symphony of melodies that flowed directly into Jessica’s ears. Suddenly, the path that she would take in the world of music was now brightly lit, and she would follow it by learning the violin! The very second the video ended, Jessica started searching through the internet for information. She bookmarked every instructional video and website she could find and scoured the map of Singapore for the best places to buy a violin. She researched heavily using guides and forums about picking a quintessential instrument, but when her parents brought her to a local music shop, her notebook full of written guidelines would end up lying dormant. Jessica found herself drawn to a particular violin in a corner, and the moment she felt its weight in her hand, she knew that this was the only instrument for her.", "Days later, Jessica found that learning the basics of violin-playing was a much slower process. She watched online tutorial videos repeatedly but translating what she saw on a flat screen into how she would move her body was a staggering challenge. Whenever the girl tried to draw the bow across the violin strings, her fingers felt more like stale sausages that were too cumbersome to manoeuvre with precision. Whenever Jessica managed to produce a sound with the violin, instead of a smooth melody, her ears were assailed by screeches and howls that made even her younger brother cover his ears in agony. Her father gently remarked that her music sounded very creative. Her mother chuckled and said she might want to try practising in the living room where the space was bigger. Her best friend giggled and said she would bring her softest pillow next time Jessica played. Though Jessica laughed along, a small part of her sank into a swamp of disappointment. Still, she knew learning to play the violin would not be easy or quick. Regardless of the dismaying sounds, she continued and committed to practicing for at least half an hour every day.", "More days passed, and Jessica continued her daily violin training, no matter how poor she felt her progress was. Then, as days stretched into weeks, Jessica suddenly noticed improvement! Even if her music still resembled farmyard noises, she could tell that she was able to hit each note a little more cleanly and shift her fingers a little more accurately. It was a tiny change compared to how much time she had spent, but seeing any progress at all was enough to lift her spirits. The music-loving girl galvanised herself into renewed discipline, and after weeks became months, she finally found that she could pleasantly play a single song without mistakes. She gathered her parents together and played the song for them right away. When she ended with a panache, both her mother and father applauded with gusto!", "Their praise raised her spirits even further, and Jessica knew for sure that there was a light at the end of the tunnel.", "Of course, she would still see slow progress with a long road ahead, but the girl knew that if she diligently practised her playing and memorised her pieces, then she was certain that she would master the challenge of her violin!"], "level": "psle"}, {"id": "a-dance-with-the-wind", "num": 22, "title": "A Dance with the Wind", "family": "growth", "path": "Second Try", "source": "W@W PSLE Model Compo Vol.3 · No. 22", "topic": "Write a composition of at least 150 words about a new experience.", "theme": "Stop fighting what you cannot control and learn to work with it.", "audio": "22", "pov": "third", "words": 620, "stages": [{"key": "setting", "paras": [0, 1], "pic": "🏖️🪁🌊", "hook": "East Coast Park: James meets the beast of a kite.", "summary": "East Coast Park buzzes with bikes, families and kitefoilers skimming the sea. James, inspired by kitefoiling legend Max Meader, is about to try it himself. Instructor Mr. Kumar rigs up the purple-and-yellow kite and warns him that balance is everything and the wind is a powerful teacher.", "trick": "Vivid metaphors for the gear (‘bucking like a defiant bronco’) and the instructor’s advice planted early so the ending can pay it off."}, {"key": "rising", "paras": [2, 3], "pic": "💦🤕🔁", "hook": "Yanked like a puppet, dunked again and again.", "summary": "James grips the bar and his first launches flop – the kite yanks him forward and the board refuses to cooperate, dumping him in the sea. Mr. Kumar bellows to work with the wind, not against it. Arms burning and legs wobbling, James drags himself back for try after try.", "trick": "Repetition of failure with escalating detail (‘arms burned... legs wobbled’) shows persistence without saying the word."}, {"key": "climax", "paras": [4], "pic": "🚀🪁😮", "hook": "Tenth try: something clicks. He is flying.", "summary": "On his tenth attempt James stops fighting the wind and leans into the kite. The board lifts and the hydrofoil slices through the waves like a hot knife through butter. Time stands still as he flies across the water like the pros.", "trick": "Two-word punch (‘Finally, it happened.’) then a short sentence (‘For a moment, time stood still.’) to freeze the big moment."}, {"key": "falling", "paras": [5, 6], "pic": "🌅😂🏄", "hook": "Wipeout, laughter, longer rides into sunset.", "summary": "A gust sends James into a spectacular wipeout, but he surfaces laughing. Each crash teaches him more, and as the sun sets his falls grow rarer and his rides longer. Mr. Kumar calls him in: ‘Not bad for a first-timer. Keep at it.’", "trick": "Contrast within one line (‘exhilarated rather than embarrassed’) shows James’s changed attitude to falling."}, {"key": "ending", "paras": [7], "pic": "🏆🌬️➡️", "hook": "Just the beginning – the wind beckons.", "summary": "Packing up, James is filled with accomplishment. He has tasted the freedom of riding the wind, and he knows this is only the start.", "trick": "Ends with a forward-looking final line that echoes the title’s image (‘The wind beckoned, and he was poised to soar.’)."}], "vocab": [{"w": "thrummed", "d": "to make a continuous rhythmic humming sound"}, {"w": "blazed past", "d": "to move very fast in a bright or noticeable way"}, {"w": "skimmed", "d": "to move quickly and lightly just above a surface without touching it much"}, {"w": "defiant bronco", "d": "a wild horse showing resistance or bold disobedience"}, {"w": "gruff", "d": "(of a voice) low and rough, often seeming unfriendly"}, {"w": "rigging", "d": "the ropes and wires that support and control a ship’s or kite’s sails or wings"}, {"w": "heart pounding like a war drum", "d": "a metaphor describing a fast, heavy heartbeat caused by fear or excitement"}, {"w": "unruly", "d": "difficult to control or manage; not behaving in an acceptable way"}, {"w": "bellowed", "d": "to shout in a loud, deep voice"}, {"w": "like a hot knife through butter", "d": "(idiom) to move through something very smoothly or easily"}, {"w": "wayward", "d": "not behaving or moving as expected or intended"}, {"w": "exhilarated", "d": "very excited and happy"}, {"w": "a grin splitting his face", "d": "an idiom that describes a very wide and joyful smile"}, {"w": "beckoned", "d": "to appear attractive or inviting"}, {"w": "poised", "d": "ready to do something or in the right position to do it"}], "paras": ["East Coast Park thrummed with beachside energy. Neon bikes blazed past, families wrestled colourful blankets under the towering palms, and shrieks of laughter chased each other down the sun-drenched shore. Beyond the joyful chaos, the ocean held a different kind of magic. Kitefoilers skimmed across the surface, their rainbow sails slashing through the blue like playful brushstrokes. James could not wait to join them. Today, inspired by Singapore's very own kitefoiling legend, Max Meader, it was his turn to paint the sky with his own sail.", "The sea spray stung James's cheeks as he stared down the hydrofoil board. It looked like a futuristic surfboard with a menacing metal wing. Above it, a wild kite in electric purple and neon yellow whipped in the wind, bucking like a defiant bronco. Mr. Kumar, a weathered instructor with a gruff but encouraging voice, fussed over the rigging. \"Remember,\" he boomed, voice barely audible over the roar of the waves, \"balance is everything and respect the wind, she's a powerful teacher.\"", "James gripped the control bar, his heart pounding like a war drum. His first attempts to launch were a flop. The kite, a stubborn beast, yanked him forward like a puppet on strings. The board, designed to glide above the water on its hydrofoil, stubbornly refused to cooperate, splashing through the waves like an unruly creature. On his first launch, he barely managed a few seconds upright before the kite’s pull overwhelmed him, plunging him into the refreshing, salty water.", "\"Work with the wind, not against it!\" Mr. Kumar bellowed from the shore, a lone figure against the chaos of colourful kites and crashing waves. James, with a stubborn streak in his eyes, dragged himself and the board back into position. His arms burned from the kite's wild pulls, his legs wobbled on the hydrofoil, but with each try, he felt his coordination sharpening.", "Finally, it happened. On his tenth try, something clicked. James listened to the wind's whispers, no longer fighting its power. He leaned into the kite, letting the wind fill the sail perfectly. The board lifted effortlessly from the water, the hydrofoil slicing through the waves like a hot knife through butter. James felt a rush of adrenaline. For a moment, time stood still. He was flying across the water, just like the pros.", "The thrill was fleeting. A wayward gust of wind caught the kite, sending James tumbling into a spectacular wipeout. He laughed as he bobbed back to the surface, exhilarated rather than embarrassed. Each crash taught him a little more about the wind's rhythm, the kite's dance, finding his balance on the board, and trusting the invisible currents that carried him.", "As the sun dipped lower, casting golden streaks across the water, James's falls became less frequent, his rides longer. His kite, a shimmering beacon in the fading light, sliced through the water, leaving a trail of spray that cooled his flushed face. The park's noise faded into a distant hum, drowned out by the rushing wind and his focused breath. He felt a sense of calm and exhilaration as he soared over the waves, the world shrinking to just him, the kite, and the endless expanse of the ocean. Finally, Mr. Kumar called him back to shore. \"Not bad for a first-timer,\" he commented, a grin splitting his face as he helped James haul the kite onto the beach. \"You're catching on. Keep at it.\"", "As they packed up, James could not shake the feeling of pure accomplishment. He had tasted the freedom of riding the wind, the joy of flying across the water, mastering the elements with kite and board. This was just the beginning. The wind beckoned, and he was poised to soar."], "level": "psle"}, {"id": "trail-of-feathers-and-fur", "num": 23, "title": "Trail of Feathers and Fur", "family": "fixes", "path": "Domino Disaster", "source": "W@W PSLE Model Compo Vol.3 · No. 23", "topic": "Write a composition of at least 150 words about an excursion.", "theme": "A forgotten snack can turn a whole zoo into your fan club – laugh it off.", "audio": "23", "pov": "third", "words": 752, "stages": [{"key": "setting", "paras": [0, 1], "pic": "🚌🦔🌳", "hook": "Petting-zoo day. John’s dream comes true.", "summary": "John’s class is buzzing about their excursion to a petting zoo. John adores animals but is not allowed a pet, so this is his big day. The bus arrives at rolling hills, meadows and a shimmering pond, and the guide hands out maps.", "trick": "Opens with the mood of a whole group (‘abuzz with a sort of electric excitement’) before zooming in on one character, John."}, {"key": "rising", "paras": [2, 3, 4, 5], "pic": "🐿️🎒🦜", "hook": "Squirrel on the backpack, parrots in the selfie.", "summary": "John tracks squirrels by spotting acorns, and one bold squirrel leaps onto his backpack and refuses to leave. In the aviary the friends take selfies, only to find a macaw and a parrot photobombing every picture.", "trick": "Each animal encounter is a little comic scene that ends in laughter, so the reader starts expecting the next mishap."}, {"key": "climax", "paras": [6, 7], "pic": "🦆😳🏃", "hook": "The duck will NOT give up.", "summary": "At the pond, one very persistent duck follows John everywhere, eyes locked on his backpack. When he tries to escape, it nips him on the backside, making him yelp while his friends howl with laughter.", "trick": "Builds the funniest moment with action verbs and a sharp detail (‘cheeks burning bright crimson’) – show-not-tell for embarrassment."}, {"key": "falling", "paras": [8], "pic": "🥪🔍😂", "hook": "Sunset. The mystery snack is found.", "summary": "As the tired explorers rest at sunset, John digs for his water bottle and finds his half-eaten breakfast in his backpack. Everyone realises that the smell is what drew the squirrel, the birds and the duck all day.", "trick": "The twist explains every earlier event in one sentence – plant a clue early, reveal it late."}, {"key": "ending", "paras": [9], "pic": "😊🚌💛", "hook": "Twists and all, a day to cherish.", "summary": "John boards the bus home smiling, treasuring the shared laughter and surprises rather than the embarrassment.", "trick": "A short one-sentence final paragraph that names the feeling the narrator takes home."}], "vocab": [{"w": "abuzz", "d": "filled with excitement, activity, or noise"}, {"w": "well-thumbed", "d": "a book or document that has been read often and is showing signs of wear"}, {"w": "serene", "d": "peaceful and calm; without worry or stress"}, {"w": "unravelling", "d": "to begin to understand or explain something that is mysterious or complicated"}, {"w": "insatiable", "d": "always wanting more; impossible to satisfy"}, {"w": "taken a shine to", "d": "to begin to like someone or something very much"}, {"w": "steadfast in its pursuit", "d": "firm and determined, especially in a belief or purpose"}, {"w": "defy convention", "d": "to do something in a new or unusual way that goes against traditional standards"}, {"w": "peals of laughter", "d": "loud bursts or sounds of laughter"}, {"w": "predicament", "d": "an unpleasant or difficult situation that is hard to get out of"}, {"w": "coax", "d": "to gently persuade someone or something to do something"}, {"w": "picturesque", "d": "attractive in appearance, especially in an old-fashioned or charming way"}, {"w": "a flurry of activity", "d": "a sudden short period of energetic activity"}, {"w": "bubbled up", "d": "to become stronger or more noticeable, especially an emotion or feeling"}, {"w": "cheeks burning bright crimson with embarrassment", "d": "to become red in the face due to shame or self-consciousness"}], "paras": ["The entire class was abuzz with a sort of electric excitement that could make your hair stand on end. They were taking a trip to a petting zoo, where animals of every shape and size wiggled their tails and twitched their whiskers. John’s heart was thumping like a drum in a rock band. Animals were like the friends he had always wished for, but a pet of his very own was a dream his parents had firmly filed away in the \"perhaps another day\" drawer. Today, John would finally meet the creatures he had only ever seen in the pages of his well- thumbed encyclopedias.", "As the bus chugged to a halt at the gates of the petting zoo, the children were met with the perfume of nature itself — a hearty blend of freshly mown grass, the sweet fragrance of wildflowers, and the crisp tang of the nearby pond. Before them stretched a vast expanse of rolling hills and lush meadows. In the distance, the shimmering waters of a serene pond beckoned, its surface rippling gently in the breeze like a mirror reflecting the sky above. Their guide greeted them and gave them maps that marked out where they could spot the different animals.", "Their adventure began with a stroll across the sun-dappled fields. John, his eyes wide with excitement, charged forward. With each step, he felt as though he was unravelling a mystery as he scoured the landscape for signs of life. As they neared a towering tree, John's keen eyes caught sight of acorns scattered at its base. An idea struck him like a bolt of lightning. Squirrels! With their insatiable appetite for acorns, they had to be lurking nearby. John ran forward, his heart racing. There, amidst the rustling leaves were a family of squirrels, darting about, their bushy tails twitching with excitement.", "Although squirrels were typically shy creatures, these ones seemed to defy convention, drawn to John like metal to magnets. Before he knew it, one daring squirrel had leaped onto his backpack, its tiny claws clinging on for dear life. Amidst peals of laughter, John found himself in a delightful predicament, as he attempted in vain to coax the overly friendly squirrel from its shoulder.", "Entering the aviary, John's senses were engulfed in a symphony of chirps, tweets, and flapping wings. Birds of every hue and size soared gracefully through the air, their feathers shimmering in the dappled sunlight that filtered through the canopy above. The lush foliage and delicate blooms created a picturesque backdrop. It was perfect for their impromptu photoshoot. John and his friends huddled together as they posed for a selfie.", "When they scrolled through the photos, they dissolved into fits of giggles. Perched atop a branch behind John, a majestic macaw and a wise-looking parrot had photobombed every single picture, their vibrant plumage and knowing gazes adding an unexpected twist to the photographs. They had unwittingly been upstaged by their feathered friends!", "Their journey continued as they made their way to the pond, its surface shimmering like a mirror. John eagerly stepped forward. With each handful of feed he scattered, the pond came alive with a flurry of activity as fishes darted to and fro, their scales gleaming. Ducks and geese waddled eagerly towards the shore, their beaks open in anticipation. Amidst the excitement, there was one particularly persistent duck who seemed to have taken a shine to John. With unwavering determination, the duck followed John around the pond, its beady eyes fixed intently on his backpack as if it held hidden treasure. Despite John's best efforts to shake off his feathery admirer, the duck remained steadfast in its pursuit, nipping at his backpack persistently.", "As laughter bubbled up from the onlookers, John's frantic attempts to shoo away the duck met with little success. Just when he thought he had escaped its clutches, the duck surprised him with playful nips to his backside, sending him jumping with a startled yelp and his cheeks burning bright crimson with embarrassment as laughter erupted from his friends.", "When the sun began to set, the weary explorers gathered at the rustic wooden benches. As he rummaged in his backpack for his water bottle, John made a discovery, his half-eaten breakfast, tucked away in his backpack. Laughter erupted as he unveiled the forgotten treasure, realizing the animals that trailed him all day were likely lured by its scent.", "Despite the twists, John cherished the shared laughter and spontaneous discoveries, smiling happily as they boarded the bus home."], "level": "psle"}, {"id": "buttercups-trail", "num": 24, "title": "Buttercup’s Trail", "family": "bonds", "path": "Invisible Hero", "source": "W@W PSLE Model Compo Vol.3 · No. 24", "topic": "Write a composition of at least 150 words about kindness.", "theme": "Kindness you give quietly comes back when you need it most.", "audio": "24", "pov": "third", "words": 697, "stages": [{"key": "setting", "paras": [0], "pic": "🐱😢🌅", "hook": "Buttercup escaped. Rose is in pieces.", "summary": "A bright morning, but Kate and Rose’s home is gloomy: their cat Buttercup slipped out in the night and Rose could not catch her. Kate calms her sister so they can search properly at daylight.", "trick": "Contrast between the cheerful weather and one sad household (‘shrouded in gloom’) hooks the reader at once."}, {"key": "rising", "paras": [1, 2, 3], "pic": "🗺️📄🏘️", "hook": "Field for Rose, posters for Kate.", "summary": "Kate sends Rose to search a field full of birds and small animals, then prints dozens of posters and sticks them on lampposts in a wide circle. Walking back, she keeps seeing strangers crouching and searching, even calling ‘Buttercup’.", "trick": "Shows Kate’s character through her careful plan instead of saying ‘Kate was sensible’."}, {"key": "climax", "paras": [4], "pic": "👥🌳😲", "hook": "A dozen helpers – all people they once helped.", "summary": "Back at the field Kate finds more than a dozen people combing bushes and climbing trees, among them old Mitch and Ruth, whom the sisters had helped before. Rose explains that passers-by dropped their plans to search. Kate is dumbfounded.", "trick": "Names specific helpers and what the girls once did for them, so the pay-off of past kindness is concrete."}, {"key": "falling", "paras": [5], "pic": "🙌🐈💕", "hook": "Peter bursts out with Buttercup!", "summary": "Peter shouts in triumph and emerges from the bushes holding Buttercup. Rose scoops up the cat, which purrs happily, completely unbothered by all the fuss.", "trick": "Resolves the problem fast with a sound effect moment (‘a shout of triumph’) and a calm, funny detail about the cat."}, {"key": "ending", "paras": [6], "pic": "🔄💛✨", "hook": "What goes around comes around – kindness too.", "summary": "The writer closes with the saying ‘what goes around, comes around’ and says it is true of kindness as well.", "trick": "Ends with a well-known proverb twisted to fit the topic word ‘Kindness’."}], "vocab": [{"w": "shrouded in gloom", "d": "covered or enveloped in sadness or darkness"}, {"w": "nimble", "d": "able to move quickly and easily"}, {"w": "futile", "d": "having no effect or achieving nothing"}, {"w": "teeming", "d": "full of people or animals moving about"}, {"w": "affixing", "d": "to fasten or stick something to something else"}, {"w": "serendipitous", "d": "happening by chance in a happy or beneficial way"}, {"w": "arduous", "d": "difficult and tiring, involving a lot of effort"}, {"w": "discerned", "d": "to see, recognise, or understand something that is not clear"}, {"w": "anomalous", "d": "different from what is usual or expected"}, {"w": "relinquished", "d": "to give up something such as a responsibility or claim"}, {"w": "exultant", "d": "very happy, especially because of success"}, {"w": "contended", "d": "feeling calm and satisfied"}, {"w": "utterly unfazed", "d": "not surprised or worried"}, {"w": "awash with disbelief", "d": "filled with strong feelings of disbelief"}, {"w": "what goes around, comes around", "d": "the consequences of one's actions will have to be dealt with eventually"}], "paras": ["One day, the sun rose into a clear sky, promising a comfortable and warm day ahead. However, one household was shrouded in gloom. Kate was comforting her sister Rose over her missing cat. Their pet had escaped the house late last night, and Rose had chased after her only to be no match for the feline’s nimble escape. After much arguing, Kate finally managed to get Rose to calm down and rest so that they could search for their cat more easily when there was sunlight.", "Then, when sunlight snuck into the room, Kate had to stop Rose from rushing out of the door and searching randomly, knowing that it would be futile to hunt down a wily cat without a plan in mind. Instead, she brought Rose to a nearby field, teeming with life, where birds and smaller wildlife that cats loved to chase were often found. Kate suspected that their cat Buttercup would come here sooner or later to entertain herself by chasing prey, so Rose might have a good chance of finding the cat here. Rose quickly began scouring the bushes and crying out Buttercup’s name, and Kate decided to turn her attentions elsewhere. Walking briskly, she made her way to a shop that had printing services and paid for several dozen sheets of a poster she had quickly made last night.", "When the printing was done, Kate executed the subsequent phase of her strategy. In an orderly fashion, she began affixing the printed posters to one lamppost out of every five she saw, following the streets in a wide circle around the house she lives in. She knew that on a weekday, it would be too much to ask everyone she knows to take time out of their busy schedules and search for a cat. Rather than doing that, Kate was now counting on the serendipitous encounter with a passerby that had seen Buttercup by accident and remembering one of the many posters she is putting up, especially the phone number that she included on it. Sooner or later, whether in a few days or a few weeks, someone might eventually see their cat.", "Hours later, Kate finally put up her last poster and turned around for her arduous journey back through the familiar streets. However, as she made her way back, she discerned an anomalous scene unfolding. People that she came across seemed to be searching for something, either crouching down to look under benches or standing in open spaces and scanning the area with their eyes. More than once, Kate thought she heard the faint voices of someone in the distance shouting ‘Buttercup’. Kate wondered if she had spent too much time in the sun and was now hearing things. It was not until when she had returned to Rose’s location that she realised what had happened.", "Instead of a quiet field, she now saw an area busy with more than a dozen people, combing through bushes or peering up into trees. When she squinted, she could see that they were all people that she or her sister had helped in the past. In the distance on all fours was old Mitch who the two girls had helped by carrying a big load of groceries. Climbing up a tree was Ruth, a girl who Kate had helped by tutoring her in English. Beaming, Rose ran up to Kate and informed her that while she had been searching for Buttercup, passersby who knew came up and asked her what had happened, and when they learned the full story, they relinquished personal commitments without hesitation and began searching for their cat as well. Kate stood dumbfounded, awash with disbelief, by how quickly and easily all these people had set aside their time to help.", "Suddenly, there was a shout of triumph and a friend named Peter burst out of the bushes with Buttercup in his arms. Rose let released an exultant cry and swiftly swept up the cat in her own arms. It emitted a contended purr, utterly unfazed by the commotion.", "People say that ‘what goes around, comes around’, and it appears that the same can be said for ‘Kindness’ as well."], "level": "psle"}, {"id": "cup-of-kindness", "num": 25, "title": "A Cup of Kindness", "family": "growth", "path": "Second Try", "source": "W@W PSLE Model Compo Vol.3 · No. 25", "topic": "Write a composition of at least 150 words about helping someone.", "theme": "Helping is not about big deeds – show up, be kind, and both sides change.", "audio": "25", "pov": "third", "words": 672, "stages": [{"key": "setting", "paras": [0, 1], "pic": "🏢😒🧹", "hook": "Jake hates this. Beware grumpy Mr. Tan.", "summary": "Jake drags himself to a day of community service at a nursing home, sure it will be dull and full of complaining old people. He is given chores and warned about Mr. Tan, the grumpiest resident, whom even veterans avoid.", "trick": "Opens with a reluctant hero (‘trudged… with leaden steps’) so his change later is clear."}, {"key": "rising", "paras": [2, 3], "pic": "👀🧃💥", "hook": "Cold glares, then the juice spills.", "summary": "Mr. Tan glares and mutters at Jake all morning. When Jake is told to serve drinks to every resident, he gently offers to hold Mr. Tan’s cup, but it slips and orange juice soaks the sheets. Mr. Tan shouts.", "trick": "Short, plain sentences (‘But before he could react, the cup slipped.’) make the accident sudden."}, {"key": "climax", "paras": [4, 5, 6], "pic": "🔁🥤🗣️", "hook": "He comes BACK with a fresh cup. ‘Thank you.’", "summary": "Jake apologises, mops up and returns with a new cup, wishing Mr. Tan a good day. Most people would not have come back. At the doorway a gruff voice says ‘Thank you’ – the moment everything turns.", "trick": "Two one-line paragraphs of dialogue (the apology and the ‘Thank you’) make the turning point stand out."}, {"key": "falling", "paras": [7, 8, 9], "pic": "📚🙂🛏️", "hook": "Stories, questions, a growing friendship.", "summary": "Mr. Tan softens, asks about school and reveals he was once a teacher. Jake is enthralled by his stories, and by the end of the day he is fluffing pillows without being asked while Mr. Tan greets him with a smile.", "trick": "Shows the friendship growing through small actions (‘fluffing Mr. Tan’s pillows’) rather than stating it."}, {"key": "ending", "paras": [10, 11], "pic": "🌇💭💛", "hook": "Kindness cracks bitterness – his own too.", "summary": "Leaving at twilight, Jake feels a tightness in his chest and realises he found meaning, not boredom. He understands that helping can simply mean showing up kindly, and that the change happened in him as much as in Mr. Tan.", "trick": "Echoes the opening (antiseptic smell replaced by ‘crisp evening air’) and ends on a metaphor, ‘chisel through the crust of bitterness’."}], "vocab": [{"w": "trudged", "d": "to walk slowly with heavy steps, typically because of exhaustion or harsh conditions"}, {"w": "leaden", "d": "heavy and difficult to move, like lead; showing lack of energy or enthusiasm"}, {"w": "nondescript", "d": "having no interesting or remarkable features or qualities"}, {"w": "reeked", "d": "to smell strongly and unpleasantly of something"}, {"w": "grim-faced", "d": "having a very serious or worried expression"}, {"w": "terse", "d": "using few words and often showing that you are annoyed"}, {"w": "steered clear", "d": "difficult and tiring, involving a lot of effort"}, {"w": "the sting of each cold stare", "d": "a sharp emotional pain or hurt caused by someone's look or words"}, {"w": "exasperation", "d": "a feeling of intense irritation or annoyance"}, {"w": "blotted", "d": "to dry a wet surface by pressing something soft against it"}, {"w": "scowl", "d": "an angry or bad-tempered expression"}, {"w": "rapport", "d": "a close and harmonious relationship where people understand each other well"}, {"w": "enthralled", "d": "so interested or charmed that you give something your full attention"}, {"w": "bathed in amber twilight", "d": "lit up with a warm, soft, orange-pink light from the setting sun"}, {"w": "chisel through the crust of bitterness", "d": "to break through emotional hardness or anger using persistence or care"}], "paras": ["Jake trudged reluctantly towards the looming grey building with leaden steps. He had been assigned a day of community service at the local nursing home as part of his school’s values-in-action programme. It felt like a punishment, even though no one had done anything wrong. As he neared the nondescript block that would be his destination for the day, Jake sighed. He had no interest in helping grumpy old people who would probably complain about everything.", "Upon arrival, Jake was quickly put to work. The nursing home reeked of antiseptic, and the faded wallpaper gave it a tired, worn-out look. A grim- faced attendant handed him an apron and barked a terse set of instructions. He was to help with cleaning, serving meals, and assisting any resident who needed help. Most tasks were manageable. Jake was content doing quiet chores. However, he soon heard whispers about a particular resident: Mr. Tan. He was the grumpiest person in the building, and even seasoned volunteers steered clear.", "Jake tried to keep his distance, but he could not ignore Mr. Tan’s constant glares. The old man would mutter or turn his head away in disgust. Jake felt the sting of each cold stare. Just when he thought things could not get worse, he was told to deliver drinks to every resident, including Mr. Tan.", "Carrying a tray of orange juice cups, Jake entered the room cautiously. Mr. Tan’s hands trembled as he reached for the cup. Without thinking, Jake stepped forward and offered to help. “Let me hold that for you,” he said gently. But before he could react, the cup slipped. Cold orange juice splashed across the sheets. Mr. Tan shouted in exasperation, startling Jake.", "“I’m sorry! I’ll clean it up and bring you another cup.”", "Jake rushed to grab a towel and hurriedly blotted the spill. Then, he returned with a fresh cup. Mr. Tan looked up, clearly surprised. Most people would have left and not come back. Jake placed the cup on the table and gave a small smile before turning to leave. “Have a good day, Mr. Tan,” he said politely.", "Just as he reached the doorway, a gruff voice called, “Thank you.”", "Jake paused and turned. Mr. Tan’s expression had softened, if only a little. Encouraged, Jake returned during his next round. This time, Mr. Tan did not scowl. Instead, he asked Jake about school. The boy answered hesitantly, but soon, a rapport began to blossom. Mr. Tan shared that he used to be a teacher and missed chatting with young people.", "As the hours passed, Jake found himself enthralled by Mr. Tan’s stories. The elderly man spoke of favourite books, childhood memories, and lessons he had learned over the years. Jake listened intently, occasionally asking questions or sharing bits of his own life. What began as a tense encounter had quietly turned into a genuine connection.", "By the end of the day, Jake was fluffing Mr. Tan’s pillows and tidying his bedside without being asked. The old man, once cold and distant, now greeted Jake with a gentle smile. “Thank you, young man,” he said. Jake nodded, surprised by how much he had come to care.", "When it was time to leave, Jake hesitated at the doorway. Mr. Tan gave a small, sincere wave. A strange tightness filled Jake’s chest. He had entered expecting boredom. Instead, he had found meaning. Outside, the walkway was bathed in amber twilight. The scent of antiseptic was gone, replaced by the crisp evening air. Jake realised he had not just done chores. He had listened, connected, and made a difference.", "Helping someone, he now understood, was not always about big actions. Sometimes, it was showing up and being kind, especially when it mattered most. In that quiet room, through spilled juice and fragile trust, something had changed. Not just in Mr. Tan, but in Jake too. As he walked away, a smile tugged at his lips. Kindness, he now knew, had the power to chisel through the crust of bitterness, including his own."], "level": "psle"}, {"id": "leftover-lesson", "title": "The Leftover Lesson", "family": "growth", "path": "Hard Lesson", "source": "W@W PSLE Model Compo Vol.3 · No. 26", "topic": "Write a composition of at least 150 words about falling sick.", "theme": "One careless choice can cost you dearly – treat your health with care.", "audio": "26", "pov": "first", "words": 715, "stages": [{"key": "setting", "paras": [0], "pic": "🌙📖🍚", "hook": "Late-night hunger, cold fried rice, no second thoughts.", "summary": "Studying late for a science test, the narrator finds last night’s fried rice in the fridge, warms it quickly and wolfs it down. It tastes a little odd, but who cares?", "trick": "The ‘mistake’ is planted quietly in the first paragraph – the reader senses trouble before the narrator does."}, {"key": "rising", "paras": [1, 2, 3, 4, 5], "pic": "🤢🏥💊", "hook": "The ache grows… and grows.", "summary": "A dull ache at school becomes cramps, nausea and vomiting at home. At the clinic the doctor says food poisoning and offers an injection or pills. Scared of needles, the narrator picks pills.", "trick": "Each paragraph makes the pain one notch worse – a staircase of tension."}, {"key": "climax", "paras": [6, 7, 8], "pic": "😖💉🚗", "hook": "Pills fail. Back to the clinic. This time, the needle.", "summary": "The medicine comes straight back up, the cramps turn unbearable and by evening the narrator is a wreck. Back at the clinic, they do not hesitate when the doctor reaches for the syringe.", "trick": "The peak of pain is also the moment of decision – facing the fear they avoided earlier."}, {"key": "falling", "paras": [9, 10, 11], "pic": "⏳🛏️🌆", "hook": "Minutes crawl like hours, then the pain loosens.", "summary": "The ride home is agony and the wait feels endless. Finally, as dusk settles, the cramps dull and the nausea fades. Weak, but breathing without flinching.", "trick": "Slows time down (‘Minutes crawled by like hours’) so the relief feels earned."}, {"key": "ending", "paras": [12], "pic": "🧵💧🍪", "hook": "Health is a fragile thread.", "summary": "Sipping warm water and nibbling crackers, the narrator realises that one careless bite unravelled a whole day. The real pain came from a bad decision, not the needle.", "trick": "A simile (‘health is like a fragile thread’) turns the lesson into a picture the reader remembers."}], "vocab": [{"w": "lamenting", "d": "expressing sorrow, regret, or disappointment about something"}, {"w": "plodded", "d": "to walk with slow heavy steps, especially because you are tired or bored"}, {"w": "gnarled with anger", "d": "twisted and rough, often due to age or strong emotion"}, {"w": "devoured", "d": "to eat something eagerly and in large amounts so that nothing is left"}, {"w": "ravenously", "d": "in an extremely hungry or greedy way"}, {"w": "wolfed down", "d": "to eat something very quickly because you are hungry"}, {"w": "spasmodic", "d": "happening suddenly for short periods and not in a regular pattern"}, {"w": "ballooned into", "d": "to quickly increase in size, importance, or seriousness"}, {"w": "relentless succession", "d": "continuing without stopping or getting less intense; one after another without pause"}, {"w": "collapsed in a heap", "d": "to fall down heavily and untidily because of tiredness or weakness"}, {"w": "made my skin crawl", "d": "to feel disgusted or frightened, often because of something creepy or unpleasant"}, {"w": "hopes were dashed", "d": "to destroy someone’s hopes or expectations completely"}, {"w": "contorted", "d": "twisted into an unusual or strained shape or expression"}, {"w": "writhed", "d": "to make twisting movements due to extreme discomfort or pain"}, {"w": "health is like a fragile thread", "d": "metaphor meaning health is delicate and can easily be damaged"}], "paras": ["The late-night hunger pangs struck as I flipped through my textbook, preparing for the science test the next day. While lamenting, I plodded wearily into the kitchen, swinging the refrigerator door open. My eyes landed on a container of fried rice that my mother had cooked the night before. It had not been reheated since dinner and had sat untouched. My stomach gnarled with anger, louder this time. Without much thought, I popped it into the microwave for a quick warm-up and devoured the food ravenously. It tasted slightly different, but I dismissed it as nothing more than the overnight chill.", "The next morning started off as any other. I got dressed, packed my bag, and wolfed down breakfast. Everything seemed normal until halfway through the first period. A dull ache bloomed in my lower abdomen, nagging at me with an uncomfortable persistence. I clenched my fists under the table and tried to focus on the board, brushing off the pain. But by the time recess rolled around, the ache had deepened into a spasmodic, unyielding torment. I barely touched my food and simply rested my head on the table.", "By the time I got home, the discomfort had ballooned into something far more intense. My stomach churned, and waves of nausea hit me in relentless succession. Then, just as I stumbled towards the toilet, everything I had eaten came back up in a sickening rush. The retching continued until my throat burned and my limbs trembled from the effort. My mother found me collapsed in a heap beside the toilet, pale and shivering.", "She rushed me to the nearby clinic, where the doctor listened intently as I described my symptoms. \"Sounds like a classic case of food poisoning,\" he said, furrowing his brows. \"Most likely from something you ate recently.\"", "I winced. The fried rice. \"You have two options,\" he continued. \"I can give you an injection to help speed up recovery and relieve the nausea, or you can take oral medication and rest.\"", "The thought of a needle made my skin crawl. \"I think I'll try the medicine first,\" I mumbled.", "Armed with a small plastic bag of medication, I returned home and curled up in bed, hoping for some relief but my hopes were dashed within hours. Every time I took a pill, it would come right back up, expelled before it could take effect. Soon after, the diarrhoea began, relentless and unforgiving. My stomach contorted into a painful knot being pulled tighter with every passing minute. I cried out in pain, my entire body drenched in cold sweat. The cramps were sharp and unrelenting, leaving me doubled over and gasping.", "By evening, I was a wreck. My mother did not wait a moment longer. She bundled me back into the car and drove me straight to the clinic again. The same doctor raised an eyebrow when he saw me. \"Back so soon?\" he asked gently.", "I nodded weakly, barely able to speak. This time, I did not hesitate when he reached for the syringe.", "The injection was quick, a sharp sting in my arm. \"It will take some time to kick in,\" the doctor said. \"Rest, drink plenty of fluids, and give your body a chance to recover.\"", "The ride home felt like an eternity. Each bump in the road sent fresh pangs through my abdomen. Back in bed, I writhed in discomfort, clenching the sheets as wave after wave of cramps swept over me. Minutes crawled by like hours. I squeezed my eyes shut, praying for the medicine to start working.", "Finally, as dusk settled outside my window, I felt the tightness in my belly begin to ease. The sharp, stabbing cramps dulled to an ache. The nausea subsided. I still felt weak and drained, but at least I could breathe without flinching. It was not an instant miracle, but it was something.", "That night, as I sipped warm water and nibbled on plain crackers, I realised that health is like a fragile thread, easy to snap if not treated with care. A single careless bite had unravelled an entire day. I had feared a needle, but the real pain came from my own bad decision. One thing was certain: I would never look at leftovers the same way again."], "num": 26, "level": "psle"}, {"id": "grand-entrance", "num": 27, "title": "A Grand Entrance", "family": "guts", "path": "Leap of Faith", "source": "W@W PSLE Model Compo Vol.3 · No. 27", "topic": "Write a composition of at least 150 words about an embarrassment.", "theme": "Confidence is not never falling – it is getting up and finishing.", "audio": "27", "pov": "first", "words": 706, "stages": [{"key": "setting", "paras": [0, 1], "pic": "🎭🇸🇬🎤", "hook": "National Day skit. Main role. Spotlight on me.", "summary": "On National Day the whole school gathers in the hall, and the narrator’s class is performing a skit about Singapore’s journey. The narrator has rehearsed a main role for weeks. Backstage, nerves jangle until the curtains open and the spotlight lands on them.", "trick": "Builds anticipation with a list of three (‘every line, every cue, every gesture’)."}, {"key": "rising", "paras": [2, 3, 4], "pic": "🤸💥😳", "hook": "One step forward – flat on the floor.", "summary": "Stepping forward for the first line, the narrator trips on a stray cable and crashes onto the stage. The hall gasps and goes silent, students titter, and the narrator burns with embarrassment, wishing the stage would swallow them.", "trick": "Slows time (‘Time felt like it had slowed to a crawl’) to stretch out the painful moment."}, {"key": "climax", "paras": [5, 6], "pic": "🗣️💪🎬", "hook": "‘You can do this.’ I get up.", "summary": "A classmate whispers ‘You can do this’ from behind the curtain. The narrator swallows hard, stands, straightens the costume and, with trembling knees, takes position again.", "trick": "A one-line paragraph of dialogue (‘You can do this.’) becomes the hinge of the whole story."}, {"key": "falling", "paras": [7, 8, 9, 10], "pic": "👏🎉📱", "hook": "Voice steadies, applause thunders.", "summary": "The lines come, shaky at first, then steady, and the audience gets caught up in the story. The final bow earns thunderous applause. Friends joke about the ‘grand entrance’, the teacher says ‘You recovered well’, and later the narrator watches the fall on a friend’s phone.", "trick": "Uses other people’s reactions (friends, teacher, the replay) to show the recovery mattered."}, {"key": "ending", "paras": [11, 12], "pic": "🪞🩹🌟", "hook": "Embarrassment is not the fall, it is the rise.", "summary": "That evening, looking at scraped knees in the mirror, the narrator decides embarrassment is about the resolve to rise. They will remember the laughter when they fell, but also the roar of applause when they stood back up.", "trick": "Ends with a balanced contrast sentence (‘the sound of laughter… the roar of applause’) that sums up the lesson."}], "vocab": [{"w": "thumped with anticipation", "d": "to beat strongly in a way that shows excitement or nervousness"}, {"w": "pattered about restlessly", "d": "to move quickly and lightly with small sounds, showing nervous energy"}, {"w": "haste", "d": "speed in doing something, especially because you do not have enough time"}, {"w": "errant", "d": "behaving wrongly or straying from the right path or expected behaviour"}, {"w": "ignominious", "d": "embarrassing because of failure or being publicly shamed"}, {"w": "muffled titters", "d": "quiet, nervous laughter, usually meant to be hidden"}, {"w": "oblivion", "d": "the state of being completely unaware or forgotten"}, {"w": "disarray", "d": "a state of confusion and untidiness"}, {"w": "tenuous", "d": "weak and likely to change or break"}, {"w": "reclaimed my equilibrium", "d": "restored a sense of mental or emotional balance"}, {"w": "eclipse", "d": "to make something less important or noticeable by being better or more noticeable"}, {"w": "apprehension", "d": "worry or fear about something that is going to happen"}, {"w": "resolve", "d": "strong determination to do something"}, {"w": "fleeting lapse", "d": "a very short period of time when something slips or fails"}, {"w": "poise", "d": "calm, confident, and controlled behaviour or manner"}], "paras": ["The morning sun bathed the school in a soft, golden glow as red and white flags fluttered gently in the breeze. Excitement buzzed in the air. It was National Day, and the entire school had gathered in the hall for the celebrations. My heart thumped with anticipation. This year, my class had been chosen to perform a skit about Singapore’s journey from a fishing village to a modern city, and I had been assigned a main role. I had rehearsed for weeks, memorising every line, every cue, every gesture.", "Backstage, I pattered about restlessly, clutching the cardboard prop in my hand. The voices of the student emcees echoed through the hall, announcing our performance. My classmates and I took our positions at the side of the stage, our eyes wide with a mixture of nerves and excitement. As the music faded and the curtains opened, the spotlight shone directly onto the stage and onto me.", "Taking a deep breath, I stepped forward, ready to launch into my first line. But in my haste, my foot caught on an errant cable that ran across the stage. My ankle twisted, and before I could stop myself, I stumbled forward and landed flat on the floor with a loud, ignominious crash.", "A collective gasp rippled through the hall. For a few painful seconds, everything went silent. The lights seemed unbearably bright, and I could feel hundreds of eyes glued to me. My cheeks burned. From the corner of my eye, I spotted a few students in the front row muffled titters. My palms stung from the impact, but it was the sting of embarrassment that hurt far more.", "Time felt like it had slowed to a crawl. The words of my script blurred in my mind. I wished the stage would open up and engulf me in oblivion. But then I heard a whisper from behind the curtain.", "“You can do this.”", "It was one of my classmates, peeking out to check on me. Her voice cut through the fog of disarray in my mind. I swallowed hard, picked myself up, and straightened my costume. My knees trembled as I took my place again, brushing off imaginary dust and forcing a tenuous smile onto my face.", "Taking a deep breath, I began my lines. My voice trembled at first, but as the performance carried on, I reclaimed my equilibrium. My classmates followed suit seamlessly, and the scene began to unfold just as we had practised. As the skit progressed, the audience’s attention shifted from my fall to the story we were telling. Their laughter came at the right moments, and their applause after each scene gave me renewed confidence.", "By the time we took our final bow, the applause was thunderous. My face was still warm with embarrassment, but something else bloomed inside me, a sense of pride. Despite my fall, I had carried on. I refused to let it eclipse my performance.", "Backstage, my friends clapped me on the back and joked light-heartedly about my “grand entrance.” I laughed along and the apprehension evaporated. Even my teacher gave me a smile and a nod. “You recovered well,” she said. “That’s what matters.”", "Later that day, as I sat in the canteen sipping a packet drink and watching the highlights of the celebration on a friend’s phone, I saw the moment I fell. It was as clumsy and dramatic as I remembered. But what came after, my rising, my performance, and the final bow, filled me with something I could not quite describe.", "That evening, I stood before the mirror in my room and looked at my scraped knees and bruised ego. I realised that embarrassment is not about the fall. It is about the resolve to rise. I had faced an auditorium full of students, fallen in front of them, and still managed to finish what I started.", "A fleeting lapse in poise had taught me more than any rehearsal ever could. I learned that confidence is not the absence of mistakes, but the ability to rise after them. And though I may never forget the sound of laughter as I hit the ground, I would also never forget the roar of applause when I stood back up."], "level": "psle"}, {"id": "hard-truth", "num": 28, "title": "The Hard Truth", "family": "bonds", "path": "Crack & Repair", "source": "W@W PSLE Model Compo Vol.3 · No. 28", "topic": "Write a composition of at least 150 words about friendship.", "theme": "A true friend tells the hard truth kindly, then stands by you.", "audio": "28", "pov": "first", "words": 747, "stages": [{"key": "setting", "paras": [0, 1, 2], "pic": "☀️👧🙈", "hook": "Hot assembly. Here comes Clara the Nose-Picker.", "summary": "At morning assembly the narrator finds shade under the flagpole when Clara plops down beside them. Clara is sweet but has a nose-picking habit that makes the whole level avoid her. The narrator is her only friend, but patience is running out.", "trick": "Introduces the problem through a nickname and a flashback, so we understand the narrator’s frustration before anything happens."}, {"key": "rising", "paras": [3, 4, 5, 6, 7, 8], "pic": "👀☝️😬", "hook": "Her finger. Heading north. In front of everyone.", "summary": "The narrator inches away but Clara follows like a puppy, chatting about the Science quiz. Classmates whisper. Then Clara’s finger goes to her nose in full view. A whispered ‘Clara, stop’ gets only an awkward chuckle. That was the final straw.", "trick": "Very short sentences and fragments (‘Her finger. Heading north.’) build dread, then a one-line paragraph: ‘That was the final straw.’"}, {"key": "climax", "paras": [9, 10], "pic": "😡💔🚶‍♀️", "hook": "‘I can’t take it anymore!’ Clara walks away.", "summary": "The narrator explodes, telling Clara her habit is disgusting and why everyone avoids her. Heads turn. Clara’s smile vanishes, she cannot speak, and she walks off with her head bowed, leaving a painful silence.", "trick": "A simile for the words (‘shot out of my mouth like arrows’) and an oxymoron-like image, ‘a silence louder than the school bell’."}, {"key": "falling", "paras": [11, 12, 13, 14, 15, 16], "pic": "😔🙏🧼", "hook": "Guilt gnaws. Sorry, soap and tissues.", "summary": "Clara sits isolated and silent all morning, and the narrator’s remorse grows until recess. Kneeling by her desk, the narrator apologises, explains kindly and offers friendship with one condition. They go to the restroom together, wash hands, and Clara whispers ‘Thanks’.", "trick": "The apology dialogue mixes sorry with honesty, showing how to say a hard thing gently."}, {"key": "ending", "paras": [17], "pic": "👋🧵🤝", "hook": "A wave: the first stitch of friendship.", "summary": "At dismissal Clara waits at the gate and waves. The narrator reads gratitude and trust in it and calls it the first stitch in a more comfortable friendship, one built on truth, courage and kindness.", "trick": "A small gesture is given big meaning with
