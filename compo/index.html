 a metaphor (‘the first stitch’), and the last sentence echoes the topic, friendship."}], "vocab": [{"w": "trickled in", "d": "to arrive slowly and gradually"}, {"w": "plopped down", "d": "to sit or fall down heavily and suddenly"}, {"w": "piped up", "d": "to suddenly speak, especially to say something when one had been silent"}, {"w": "shunned", "d": "to avoid someone or something deliberately"}, {"w": "subtle", "d": "not loud, bright, noticeable, or obvious in any way"}, {"w": "oblivious", "d": "not aware of or concerned about what is happening around"}, {"w": "benevolence", "d": "the quality of being kind and helpful"}, {"w": "whispers curling like smoke", "d": "a descriptive phrase comparing the whispers to smoke, showing how they spread and linger"}, {"w": "crept up my spine", "d": "to gradually feel something unpleasant or intense, such as fear or embarrassment"}, {"w": "chuckled", "d": "to laugh quietly or inwardly"}, {"w": "words shot out of my mouth like arrows", "d": "a metaphor showing how words were said suddenly, sharply, and with impact"}, {"w": "gnawing sense of remorse", "d": "a persistent and uncomfortable feeling of guilt or regret"}, {"w": "propelled by conscience", "d": "moved by a strong inner sense of right and wrong"}, {"w": "tenderly", "d": "in a gentle, loving, and kind way"}, {"w": "fortitude", "d": "courage in pain or adversity"}], "paras": ["The assembly ground buzzed with the low hum of morning chatter as students trickled in under the already-blazing sun. I wiped the sweat from my brow and plopped down onto the dusty concrete, glad to find a sliver of shade beneath the school’s flagpole. Just as I was pulling out my timetable to double-check today’s lessons, I heard a familiar voice piped up beside me.", "\"Good morning!\" Clara beamed, lowering herself to sit right next to me.", "I stiffened. Clara. Sweet, chatty, well-meaning Clara. But also, Clara the Nose- Picker. It was a nickname that she had unknowingly earned across the entire Primary Six cohort. Wherever she went, people shunned her as if she were a contagious disease. All because of that one habit. Her fingers would creep up to her nostrils without warning, in class, in the canteen, and yes, even during assembly. I had tried to be kind. I was the only one who still spoke to her regularly. But today, after a long week of group work and failed attempts at subtle hints, my patience was wearing thin.", "I inched away from her ever so slightly. But like a loyal puppy, she followed.", "\"Did you study for the Science quiz today?\" she asked, completely oblivious to my body language.", "\"Uh, yeah,\" I mumbled, eyes fixed forward.", "I could feel the eyes of other classmates on us, whispers curling like smoke through the humid air. Embarrassment crept up my spine. Clara was now digging into her bag, searching for something. Then, out of the corner of my eye, I caught it. Her finger. Heading north. I bit my lip. Maybe she would stop. Maybe she was scratching. But no, there it was, in full, horrifying motion. She was picking her nose. Right beside me. In full view of the entire level.", "\"Clara, stop,\" I whispered urgently, trying to sound calm. She froze for a moment, her eyes wide, but then chuckled awkwardly and wiped her hand on her skirt.", "That was the final straw.", "\"I can’t take it anymore!\" I burst out. Heads turned. Clara blinked in surprise. \"Every time you sit near me, you do that! It’s disgusting! Don’t you realise everyone avoids you because of this? I’ve tried to be patient, but seriously, you need to stop!\"", "The words shot out of my mouth like arrows, sharp and impossible to retrieve. Clara’s smile faded instantly. Her mouth opened as if to speak, but no words came out. She looked down at her fingers, then at her skirt. Then, with her head bowed, she stood up and quietly walked away, leaving behind a silence louder than the school bell.", "The rest of the morning was a blur. During lessons, Clara sat at the back of the classroom, isolated. Her hands were folded tightly in her lap, and she did not raise them once. Each time I glanced back, I felt a gnawing sense of remorse. By recess, I could not take it anymore. Propelled by conscience, I was at the back of the class before I could second-guess myself.", "\"Clara,\" I said tenderly, kneeling beside her desk. She looked up. Her eyes were glassy, but she did not speak. \"I’m sorry for yelling. I shouldn’t have said it like that. But... you have to understand. It’s a habit that makes people uncomfortable. I want to be your friend. I really want to but you’ve got to stop doing that in public.\"", "She nodded slowly.", "\"Come on,\" I offered, standing. \"Let’s go to the restroom. We can wash your hands and get you some tissues. Maybe you could use those next time. Or at least wait until you’re alone.\"", "Clara followed me without a word. In the restroom, I handed her soap and helped her scrub her hands. She looked like a child trying to erase a mistake from a test paper.", "When she dried her hands and looked up, she gave me a tiny smile. \"Thanks,\" she said softly.", "The rest of the day passed more gently. Clara still kept to herself, but there was no more nose-picking. At dismissal, she waited at the school gate and waved as I passed. That wave carried more than a goodbye. It held gratitude, trust, and the first stitch in what I hoped would become a more comfortable friendship. Some friendships are built on common interests or shared laughter. Others begin with a simple truth, the fortitude to speak it, and the benevolence to stand by it."], "level": "psle"}, {"id": "a-wild-turn", "title": "A Wild Turn", "family": "fixes", "path": "Domino Disaster", "source": "W@W PSLE Model Compo Vol.3 · No. 29", "topic": "Write a composition of at least 150 words about a shocking incident.", "theme": "Nature can turn in a heartbeat – and a mother’s love stands tall until the storm passes.", "audio": "29", "pov": "first", "words": 719, "stages": [{"key": "setting", "paras": [0, 1, 2], "pic": "🌳🚶‍♀️🐒", "hook": "A sunny walk, two cute monkeys, one loud laugh.", "summary": "The family strolls through MacRitchie Reservoir. Emma skips ahead and waves at two monkeys by the path. Everyone giggles – perhaps that was the mistake.", "trick": "Peaceful description plus one ominous line (‘Perhaps that was our mistake.’) warns the reader."}, {"key": "rising", "paras": [3, 4, 5], "pic": "👀🌿😱", "hook": "The bushes stir. Twenty, thirty monkeys…", "summary": "Leaves rustle and dozens of adult monkeys pour out, baring teeth. Emma screams and bolts. The narrator turns to follow but trips on a root.", "trick": "Danger arrives in waves – eyes, then bodies, then teeth – like dominoes falling."}, {"key": "climax", "paras": [6, 7], "pic": "🩸🏃‍♀️🐒", "hook": "“Run!” – Mother is surrounded.", "summary": "Knee bleeding, the narrator is hauled up by Mother, who pushes the children forward. Then the mob turns on her, tugging her bag, scratching and clawing.", "trick": "Short sentences and a drum-like heartbeat (‘like a war drum’) make the peak terrifying."}, {"key": "falling", "paras": [8], "pic": "🥾🗣️🚑", "hook": "Hikers, a trekking pole, and a park ranger.", "summary": "Two hikers charge in shouting and waving a pole. The monkeys scatter. Battered and scratched, Mother collapses; the hikers call for help and a ranger leads the family to safety.", "trick": "The ‘fix’ comes from strangers acting fast – the problem shrinks as quickly as it grew."}, {"key": "ending", "paras": [9, 10, 11, 12], "pic": "🏥😢❤️", "hook": "The strongest need a moment to fall apart.", "summary": "In the hospital, Mother finally breaks down in a long sob after staying brave all day. The narrator learns that nature is unpredictable – and how deep a mother’s love goes.", "trick": "A quiet, emotional scene after the chaos gives the story its real meaning."}], "vocab": [{"w": "diaphanous", "d": "light, delicate, and translucent"}, {"w": "cadence", "d": "a modulation or inflection of the voice; rhythm"}, {"w": "verdant", "d": "green with grass or other rich vegetation"}, {"w": "impending cascade", "d": "a series of things that happen quickly, one after the other, and are likely to happen soon"}, {"w": "foliage", "d": "the leaves of a plant or tree, or lots of leaves together"}, {"w": "eyes dilated in petrified astonishment", "d": "a reaction where the pupils expand due to extreme fear or amazement"}, {"w": "turned my blood to ice", "d": "a phrase describing a sudden wave of fear or dread"}, {"w": "a jolt of searing agony", "d": "a sudden burst of intense and overwhelming pain"}, {"w": "hauled", "d": "to pull or drag with effort or force"}, {"w": "slinked off", "d": "moved away quietly and secretly, as if guilty or afraid"}, {"w": "battered", "d": "injured or damaged from repeated use or violence"}, {"w": "lacerated", "d": "having deep cuts or tears in the skin"}, {"w": "quivered with repressed anguish", "d": "shook slightly from intense emotional pain that was being held in"}, {"w": "veiling", "d": "to cover something, especially to make it less obvious"}, {"w": "torment", "d": "severe mental or physical suffering"}], "paras": ["The sun filtered through the diaphanous mist as our family began our nature walk at MacRitchie Reservoir. Birds chirped trilled in a harmonious cadence, leaves rustled in the breeze, and the occasional jogger passed us with a smile and a nod. My younger sister, Emma, skipped ahead, humming to herself while clutching a small water bottle. I walked behind her, phone in hand, snapping pictures of the verdant landscape. Our mother trailed behind, reminding us every few minutes to stay on the path and watch our steps.", "As we neared the forested entrance of a quieter trail, we spotted two monkeys lounging by the side of the path. Emma clapped her hands with glee. \"Look! Monkeys!\" she shouted, waving at them. We giggled at their curious expressions, oblivious to the impending cascade of events.", "Our laughter echoed through the trees. Perhaps that was our mistake.", "Suddenly, the undergrowth on either side of the path began to stir. Leaves rustled violently, and a dozen pairs of beady eyes appeared from the dense foliage. Then, as if summoned by our noise, a wave of monkeys emerged from the bushes. They were not the timid creatures we had expected. These were full-grown adult monkeys, twenty or thirty of them, and they did not look pleased.", "Emma froze in her tracks, her smile vanishing in an instant. Her eyes dilated in petrified astonishment. Then, she screamed, a high-pitched, bone-chilling cry that pierced the quiet of the trail. I spun around, startled by her scream, and the sight that greeted me turned my blood to ice.", "The monkeys were advancing rapidly, baring their teeth and chattering aggressively. Some of them leapt from branch to branch above us, while others crept low along the ground. Emma, paralysed by fear, finally turned and bolted down the trail. I took a step back, intending to follow, but my foot caught a root and I tumbled to the ground.", "A jolt of searing agony radiated through my leg as my knee hit the gravel. I cried out, struggling to get up. Strong hands grabbed me, our mother’s. She hauled me to my feet and pushed me forward. \"Run!\" she yelled, her voice trembling. I limped after Emma, who had stopped at a bend, tears streaking down her cheeks.", "Behind us, chaos erupted. The mob of monkeys had now fully surrounded our mother. Some tugged at her bag while others jumped at her, scratching and clawing. She screamed in pain, trying to swat them away, but there were too many. My heart pounded like a war drum. I turned to go back, but Emma clung to my arm, crying and shaking her head.", "Luckily, help arrived. Two hikers sprinted over, shouting and swinging their arms. One of them had a trekking pole and waved it furiously at the monkeys. The loud shouts and sudden movement startled the animals, and slowly, they began to scatter. A few stubborn ones hissed and lingered, but eventually, even they slinked off into the forest. Our mother collapsed onto the dirt path, battered and lacerated. Her shirt was torn, and her arms bore several angry red scratches. The hikers helped us call for assistance, and soon after, a park ranger arrived and ushered us to safety.", "Now, sitting in the hospital waiting area, the sterile scent of antiseptic stung my nose. Emma sat curled in her seat, clutching her toy rabbit, her face pale and drawn. Our mother sat beside us, her hands folded tightly in her lap, bandages covering her arms. She had not said much since the incident.", "When the nurse finally called her name, she stood up slowly and walked toward the door. But just before she stepped in, her frame quivered with repressed anguish. She turned around, eyes glassy, and let out a long, broken sob.", "It was the first time she had cried all day. I stood frozen as the sound echoed softly through the corridor. She had put on a brave front the whole time, veiling her torment behind unwavering resolve. But even the strongest need a moment to fall apart.", "That day taught us that nature, while beautiful, could be unpredictable and frightening. And more importantly, it showed us the depth of a mother’s love, the kind that shields, sacrifices, and stands tall until the storm passes."], "num": 29, "level": "psle"}, {"id": "soaring-past-my-limits", "num": 30, "title": "Soaring Past My Limits", "family": "guts", "path": "Leap of Faith", "source": "W@W PSLE Model Compo Vol.3 · No. 30", "topic": "Write a composition of at least 150 words about an adventure.", "theme": "Step off the edge – fear can turn into the best feeling of your life.", "audio": "30", "pov": "first", "words": 686, "stages": [{"key": "setting", "paras": [0, 1], "pic": "🏕️😟🌲", "hook": "Camp Horizon. Nature and I are not friends.", "summary": "The bus arrives at Camp Horizon at dawn. The narrator’s classmates buzz over the obstacle courses, but the narrator clutches their backpack nervously. The booming instructor announces a full day of activities.", "trick": "A funny understatement (‘Nature and I had never been on the best of terms’) tells us the narrator’s weakness in one line."}, {"key": "rising", "paras": [2, 3, 4, 5, 6, 7, 8], "pic": "🧗🪜😰", "hook": "The flying fox. Every bone says run.", "summary": "The narrator fumbles through team games and the low wall. After lunch comes the flying fox, and they try to sit it out, but the instructor and teammates urge them on. Legs like jelly, they climb the rickety tower and get harnessed. ‘Just… let go.’ ‘Let go?’", "trick": "Stacks physical fear details (‘palms were slick with unease’, ‘knees felt like jelly’) and keeps the dialogue tiny for tension."}, {"key": "climax", "paras": [9], "pic": "🪂😱😂", "hook": "Eyes shut, deep breath, step off!", "summary": "At the point of no return the narrator closes their eyes and steps off. Wind roars, trees blur, screams turn to laughter and fear becomes exhilaration. They land wobbly but triumphant as classmates cheer.", "trick": "Splits one second into slow motion (‘For a split second, nothing happened. Then…’) and shows the feeling flipping mid-flight."}, {"key": "falling", "paras": [10, 11, 12], "pic": "🎉🛏️🦗", "hook": "‘You were amazing!’ Muddy, sore, proud.", "summary": "Emma shouts praise and the narrator jokes about nearly fainting. At sunset they collapse onto the bunk, muddy and aching, as crickets sing and the sky turns purple and orange.", "trick": "Calms the pace with sensory evening details (crickets, colours of the sky) after the high-energy peak."}, {"key": "ending", "paras": [13, 14], "pic": "😊🌙🚪", "hook": "Adventure knocked. I answered.", "summary": "Despite aching limbs, the narrator feels a renewed vigour after doing something they never thought possible. Lying on the bunk, they smile, ready for tomorrow’s mud and heart-pounding challenges. Adventure has knocked, and they have risen to the call.", "trick": "Personifies the topic (‘Adventure had finally knocked on my door’) to end with a memorable image."}], "vocab": [{"w": "invigorating", "d": "making someone feel healthier, more energetic, or more cheerful"}, {"w": "bore the brunt", "d": "to receive the worst part of something unpleasant"}, {"w": "escapades", "d": "exciting, foolish, or risky adventures or actions"}, {"w": "lumbered", "d": "to move in a slow, heavy, awkward way"}, {"w": "floundered", "d": "to struggle mentally, physically, or emotionally; to move clumsily"}, {"w": "careened", "d": "to move fast and uncontrollably, often swerving"}, {"w": "rickety", "d": "weak or likely to collapse or break; poorly built"}, {"w": "slick with unease", "d": "slippery and damp, typically due to anxiety"}, {"w": "point of no return", "d": "a stage at which one must continue because turning back is no longer possible or practical"}, {"w": "fortifying", "d": "strengthening or building mental or emotional resolve"}, {"w": "hurtled past", "d": "moved at great speed in an uncontrolled way"}, {"w": "morphed", "d": "changed smoothly or gradually into something else"}, {"w": "chortled", "d": "to laugh with pleasure or amusement"}, {"w": "renewed vigour", "d": "fresh strength or enthusiasm"}, {"w": "risen to the call", "d": "to meet a challenge successfully"}], "paras": ["The sun was barely peeking over the treetops when our bus rolled into the campsite. As I stepped off, I was greeted with an invigorating breeze, carrying with it the scent of damp earth and pine. Around me, the rest of my classmates buzzed with excitement, pointing at the obstacle courses and climbing towers scattered across the field. I, on the other hand, tightened my grip on my backpack and let out a nervous sigh. Nature and I had never been on the best of terms.", "“Welcome to Camp Horizon!” our instructor boomed, clapping his hands. He was tall, tanned, and wore a cap that looked like it had bore the brunt of many escapades. “Today will be a full day of activities, so gear up and stick with your teams.”", "The day began with some ice-breaker games and team-building exercises. I lumbered through the activities, doing my best to blend in and not attract attention. Mud squelched beneath my shoes as we crossed a shallow stream. My classmates laughed as they splashed one another with water, but I tiptoed cautiously, grimacing each time I got wet. When it came time to scale the low wall challenge, I floundered and slipped more times than I could count. Despite my best efforts, I was clearly the least adventurous in the group.", "After a quick lunch of sandwiches and juice, our instructor gathered us near the tallest structure in the camp. My heart dropped. The flying fox. The long cable stretched high from the wooden tower down across the trees, disappearing into the forest. A series of shrieks and laughter filled the air as students careened through the trees, some with their arms spread wide, others screaming in delight. I backed away instinctively.", "“I’ll sit this one out,” I muttered, but our instructor heard me.", "“Come on, give it a shot. You might surprise yourself.”", "Before I could protest, my teammates were already encouraging me. “You can do it!” they chanted, and though every bone in my body screamed to run, I slowly ascended the rickety steps. The climb up the wooden steps felt like an eternity. With each step, my stomach twisted tighter. By the time I reached the top, my palms were slick with unease and my knees felt like jelly. An instructor clipped the harness to my waist and checked the ropes.", "“All set,” he said cheerfully. “Just walk to the edge, lean forward and let go.”", "“Let go?” I echoed weakly.", "But it was the point of no return. I closed my eyes, drew a fortifying breath and stepped off. For a split second, nothing happened. Then the wind rushed past my ears, the trees became a blur and the ground hurtled past beneath me. I screamed at first, but halfway through, my screams turned into laughter. The fear morphed into exhilaration. My arms stretched out instinctively as if I were flying. And just like that, it was over. I landed on the other side, legs wobbling and heart racing. My classmates cheered and clapped as I unhooked the harness.", "“You were amazing!” Emma shouted.", "I chortled, still breathless. “I thought I was going to faint.”", "As the sun dipped lower in the sky, we returned to our bunks. My shirt was stained with mud, my hair frizzy from the helmet, and my legs sore from all the climbing. I dropped onto the wooden bunk bed, too exhausted to even dig out my towel. The sounds of crickets filled the air as the sky turned from blue to shades of purple and orange.", "Despite the aching limbs and tired eyes, I felt a renewed vigour pulsing in me. Today, I had done something I never thought I could. Who knew what else was in store for the rest of the camp?", "As I lay on the bunk staring up at the wooden ceiling, a small smile crept across my face. Tomorrow might bring more mud, more sweat and more heart-pounding challenges, but for the first time ever, I was ready. Adventure had finally knocked on my door, and I had risen to the call."], "level": "psle"}, {"id": "speech-from-the-heart", "title": "A Speech from the Heart", "family": "bonds", "path": "Crack & Repair", "source": "2025 PSLE Paper 1 · Picture 1 (Class Party)", "topic": "Write a composition about ‘Being Thankful’.", "theme": "Be thankful for the people who stand by you, even after a fight.", "audio": "speech", "pov": "first", "words": 1045, "stages": [{"key": "setting", "paras": [0, 1, 2], "pic": "🎈🙅‍♀️😠", "hook": "Two leaders, one banner, zero teamwork.", "summary": "The narrator and Jon, class chairperson and co-chair, are decorating for the graduation party. They have been fighting for two weeks and every chat turns into an argument.", "trick": "Opens with a sharp line of dialogue, then flashes back to explain the fight."}, {"key": "rising", "paras": [3, 4, 5, 6, 7, 8, 9], "pic": "🎉🎒❓", "hook": "Party day. The speech is GONE.", "summary": "The party is in full swing, but the two still ignore each other. When the narrator reaches for the opening speech, the bag is empty. Panic rises.", "trick": "Short punchy sentences (“Pens clattered. Papers fluttered. No speech.”) speed up the panic."}, {"key": "climax", "paras": [10, 11, 12, 13, 14, 15, 16], "pic": "🤝📓💛", "hook": "“We’ll write a new one. Together.”", "summary": "Jon sees the narrator’s fear. Instead of mocking, he puts a hand on their shoulder and offers to rewrite the speech together. The narrator is stunned and grateful.", "trick": "The turning point is one kind action from the ‘enemy’ – the crack starts to repair."}, {"key": "falling", "paras": [17, 18, 19, 20, 21, 22, 23], "pic": "✍️🎤🌟", "hook": "New speech, steady voice, a surprise thank-you.", "summary": "They write the speech side by side and the old friendship returns. On stage, the narrator thanks everyone, then adds an unplanned thank-you to Jon.", "trick": "The speech lets the writer say the theme out loud without sounding preachy."}, {"key": "ending", "paras": [24, 25], "pic": "👏😊🏫", "hook": "Applause, and best friends again.", "summary": "The hall applauds. The narrator feels a glowing sense of thankfulness for the friendship they almost forgot, and the two leave primary school as a team.", "trick": "Ends by naming the feeling and linking it back to the topic: being thankful."}], "vocab": [{"w": "bristled", "d": "became annoyed or angry, like a cat’s fur standing up"}, {"w": "barbed", "d": "(of words) sharp and meant to hurt"}, {"w": "despondently", "d": "in a sad, hopeless way"}, {"w": "voracious", "d": "very eager or greedy, especially for food"}, {"w": "plummeted", "d": "dropped very suddenly"}, {"w": "tirade", "d": "a long, angry speech of criticism"}, {"w": "camaraderie", "d": "friendly trust between people who work together"}, {"w": "transgressions", "d": "wrongdoings; times you crossed a line"}, {"w": "reminisce", "d": "to think or talk fondly about the past"}, {"w": "invaluable", "d": "extremely useful; priceless"}], "paras": ["“Are you seriously putting the banner there?” I snapped, arms crossed tightly as Jon struggled to tape the glittery sign above the whiteboard. We were halfway through decorating the classroom for the upcoming class party. However, instead of feeling excited, my stomach twisted with frustration. Jon froze, his jaw tightening as he turned to glare at me.", "“Well, if you actually helped instead of criticising everything, maybe this would get done faster,” he shot back, slamming the tape dispenser onto a desk. “Some people just don’t know how to appreciate others,” he muttered harshly under his breath, and I bristled at his prickly comment. My cheeks flushed red, and the muscles around my eyes wrinkled in irritation. We stood there in a tense, prickling silence, the string lights drooping between us like a defeated truce.", "The fight had started two weeks earlier, when we first began planning our class’s graduation party. As class chairperson and co-chairperson respectively, we were supposed to be the perfect team. However, somewhere between deciding the food menu and arranging the games, our cooperation crumbled. From that day on, every discussion turned into an argument. His voice grew sharper. My patience grew thinner. By the time the class party approached, we were barely speaking except to trade barbed comments that stung like paper cuts. Our friends tiptoed around us, and even our teacher sighed despondently as we fought like lions, battling for dominance.", "On the day of the party, the classroom buzzed with excitement—streamers crisscrossed the ceiling, colourful balloons bobbed against the windows, and desks were pushed together to form food tables lined with snacks that were getting gobbled up at a voracious speed. The warm chatter of our classmates filled every corner of the radiant classroom as they flitted about. Yet even the festive warmth could not dissolve the cold distance between Jon and me. We went about our tasks stiffly, like two robots programmed not to look at each other.", "“You’re presenting your speech first. Don’t mess it up,” Jon muttered as he passed me the programme sheet.", "I shot him a glare. “I won’t. Unlike some people, I’m prepared.”", "However, the moment I reached into my bag, my heart plummeted.", "My speech—the one I had spent three nights perfecting—was gone!", "The colour drained from my face. My hands trembled as I emptied my bag onto a chair. Pens clattered. Papers fluttered. No speech.", "“Where... where is it?” I whispered, feeling the room tilt slightly. Panic gripped my chest like a tightening fist. As class chairperson, I was tasked with giving the opening speech. I was supposed to thank the teachers, the students, and especially the people who had made the class party possible. Yet here I was, breath shallow and feeling helpless.", "Jon noticed immediately. The annoyance on his face softened into concern.", "“You look like you’re about to faint,” he said quietly. “What’s wrong?”", "“I... I forgot my speech,” I whispered, my voice trembling. Dizzy panic rose in me like a tidal wave, tightening my breath. My classmates were counting on me. Our teachers were expecting it. And after all the arguments with Jon, this would make me look completely irresponsible!", "There was no way to hide this from Jon. Face pinched, I bowed my head low and admitted the truth to him. Expecting mockery, I folded my shoulders and felt tears stinging my eyes, waiting for the impending tirade from Jon. However, I started as a steady hand landed on my shoulder, warm and comforting. Jon’s voice lowered, gentle for the first time in weeks. “It’s okay. We’ll write a new one. Together.”", "I blinked at him. “You’re helping me?”", "“Of course I am,” he said, sitting down and pulling out a notebook. “We’re a team, remember? Even if we sometimes forget that.”", "I was stunned into silence, expecting disdain but getting empathy instead. In that moment, I was very thankful that Jon decided to be the bigger person and look past our fights, and help me in my moment of need.", "As we scribbled out a speech to mark the end of our years at primary school, Jon and I slipped back into the easy camaraderie and partnership that saw us through the two years of us as chair and co-chair. I began to reminisce about the times we had worked together, facing challenging issues and tackling them—so long as I had him as an anchor by my side. A rush of gratefulness flooded my system for Jon’s unwavering presence, alongside guilt as I meekly acknowledged my transgressions towards him these past few weeks.", "When it was time for my speech, I stepped up in front, hands still trembling. Jon stood just beside me—as always. I clutched the notes we had scribbled together minutes earlier, and glanced at Jon, who gave me an encouraging smile.", "I took a deep breath and began.", "“Today, we mark the end of our years at school, and give thanks to those who have made our graduation possible.” My voice grew steadier with each word as I thanked our teachers and peers, expressing gratitude for their invaluable efforts towards our education.", "“Today, I realised the true meaning of being thankful. Being thankful isn’t only about appreciating good moments, but also about recognising the people who stand by us even during arguments, stress, and mistakes.”", "My gaze drifted to Jon, who quirked his eyebrows questioningly at me—this was not part of the speech we wrote.", "“I am especially thankful for my co-chairperson,” I continued. “Not just for helping prepare this class party, but for supporting me throughout the past two years. Even when we fought, even when things went wrong—he still helped me when I needed it most. And I want to say I am truly thankful for him.”", "The room erupted in applause. Jon’s face softened into a genuine smile—warm, relieved, almost proud.", "At that moment, I felt a deep, glowing sense of being thankful—not only for the successful class party, but for the partnership, the teamwork, and the friendship I had nearly forgotten to appreciate. As we said goodbye to our peers and teachers, Jon and I stood together—not as opponents, but as a team—and more importantly, as best friends, to bid a final farewell to our primary school."], "num": 100, "level": "psle"}, {"id": "the-sunflower-compass", "num": 101, "title": "The Sunflower Compass", "family": "bonds", "path": "Invisible Hero", "source": "2025 PSLE Paper 1 · Picture 2 (Sunflower)", "topic": "Write a composition about ‘Being Thankful’. (2025 PSLE Paper 1 · Picture 2: Sunflower)", "theme": "Being thankful means turning towards the light that is still there.", "audio": "bonus2", "pov": "third", "words": 807, "stages": [{"key": "setting", "paras": [0], "pic": "🌻✉️😔", "hook": "Ah Ma’s seeds: ‘Plant these when you need direction.’", "summary": "Two weeks after his grandmother’s funeral, Jonathan finds a packet of sunflower seeds in her recipe book with a note telling him to plant them when he needs direction and to always be thankful. Lost in grief, he drifts through grey days and even his favourite chicken rice tastes of nothing.", "trick": "Opens with a concrete object (the seed packet) and sensory memory (‘smelled faintly of the camphor box’) to show grief instead of naming it."}, {"key": "rising", "paras": [1, 2, 3], "pic": "🌱💧🧑‍🤝‍🧑", "hook": "Shoots appear. David asks what is wrong.", "summary": "Jonathan plants the seeds in the school eco-garden and waters them every morning until green shoots appear. His friend David finds him sitting quietly in the garden and asks what is wrong. Jonathan admits he keeps thinking of everything he never told Ah Ma, and that he was not grateful enough.", "trick": "Dialogue reveals the inner problem (‘I was not being grateful enough when she was here’) and a bitter-taste metaphor makes the regret physical."}, {"key": "climax", "paras": [4, 5], "pic": "☀️🌻💡", "hook": "The flower follows the sun. Now the note makes sense.", "summary": "The first bud opens and Jonathan notices the sunflower always turns its face toward the sun. That night he learns the word heliotropism, and his grandmother’s note suddenly makes perfect sense: being thankful means choosing to face whatever light is left – his mother’s cooking, David’s friendship, small kindnesses.", "trick": "A fact from science (‘heliotropism’) becomes the key that unlocks the theme – an ‘aha’ moment built from observation."}, {"key": "falling", "paras": [6, 7], "pic": "🙏🍛🧭", "hook": "Small thank-yous, one turn toward light at a time.", "summary": "Jonathan starts small: thanking the canteen auntie, calling his mother to say he appreciates her, helping his sister with homework. Grief still wraps around him some days, but the sunflowers keep turning. By full bloom he understands that gratitude is a compass for when he feels lost.", "trick": "A list of small, specific actions (‘thanked the canteen auntie...’) shows change in behaviour, paired with a weather simile for grief."}, {"key": "ending", "paras": [8], "pic": "🌰✉️🌅", "hook": "New seeds, new envelope, a way through the dark.", "summary": "On the last day of term Jonathan collects seeds from the dried flower heads and saves them in a new envelope for Ah Ma’s favourite community garden. He hopes someone else will one day see the flowers and learn that even in loss there is a way to turn toward the light.", "trick": "A full-circle ending: the story begins and ends with an envelope of seeds, and the last line repeats the key image of turning toward the light."}], "vocab": [{"w": "like a paper boat caught in a monsoon drain", "d": "a simile for feeling lost and helpless, spinning in circles with no direction"}, {"w": "voracious", "d": "extremely hungry; wanting a lot of something"}, {"w": "muted", "d": "quiet, dull or softened, as if the sound or colour has been turned down"}, {"w": "caked", "d": "covered or stuck with a thick, dried layer of something like mud"}, {"w": "unfurl", "d": "to open out slowly from a folded or rolled-up state, like petals or a flag"}, {"w": "heliotropism", "d": "the way a plant turns to follow the sun across the sky"}, {"w": "the bitterness of a cure taken too late", "d": "a metaphor for regret – realising what you should have done only after it is too late"}, {"w": "inescapable", "d": "impossible to avoid or get away from"}, {"w": "orient", "d": "to find your position or direction; to work out which way to face"}, {"w": "crackling", "d": "making short, sharp, dry snapping sounds"}], "paras": ["Jonathan found the packet tucked inside his grandmother's old recipe book, two weeks after her funeral. The seeds inside were dark and striped, each one no bigger than his thumbnail, and they smelled faintly of the camphor box where Ah Ma kept her precious things. His fingers trembled as he read her shaky handwriting across the envelope: “Plant these when you need direction. Remember to always be thankful.” He had been drifting since she died, moving through his days like a paper boat caught in a monsoon drain, spinning in circles with no way forward. School felt muted, colours drained to grey. Even his favourite chicken rice from the hawker centre near her Tiong Bahru flat tasted like nothing, the familiar ginger-garlic fragrance failing to stir his once voracious appetite.", "The next morning, Jonathan brought the seeds to school and knelt in the eco-garden behind the parade square, pressing each one into the earth with his thumbs. The dirt was warm and slightly damp from the previous night's rain, and it caked under his fingernails in dark crescents. He watered the patch every day before assembly, the water from the hose catching morning light like liquid glass. By the second week, tiny green shoots pushed through, and Jonathan found himself arriving early just to watch them. His friend David found him there during recess one day, sitting cross-legged in the corner of the garden, as still as the sunlight warming the soil.", "\"You have been weird lately,” David said, dropping down beside him. Jonathan picked at a blade of grass, rolling it between his fingers until it stained his fingertips green.", "\"I keep thinking about all the things I did not tell her,” he said quietly. “Like how her curry chicken was the best, rich and fragrant. Or how I loved her stories. I was not being grateful enough when she was here.” The words settled on his tongue with the bitterness of a cure taken too late.", "Over the next few weeks, the sunflowers grew taller than Jonathan expected, their stems thick as his wrist and rough like tree bark under his palm. And then one morning, the first bud began to open. Jonathan arrived before sunrise to watch golden petals unfurl, slow as honey dripping from a spoon. He noticed something remarkable: the flower faced east, tracking the sun as it climbed over the school building. Throughout the day, whenever he checked during breaks, the sunflower had shifted position, always turning its face toward brightness.", "That night, reading his science textbook by lamplight, Jonathan learned the word for it: heliotropism. Sunflowers turned to follow the light of the sun across the sky. He set the book down, his grandmother's note suddenly making perfect sense. She had known he would feel lost. The sunflowers were showing him that when everything felt dark, being thankful meant choosing to face toward whatever light was left. His mother's cooking. David's friendship. The small kindnesses that still existed even though Ah Ma was gone. Being thankful was not about forgetting the sadness. It was about turning toward the good things, the way the sunflowers turned toward the sun, every single day without fail.", "Jonathan started small. He thanked the canteen auntie who always gave him extra curry. He called his mother at work just to tell her he appreciated the way she packed his favourite dried mango in his bag. He sat with his younger sister while she did homework, helping her sound out difficult words instead of hiding in his room with his headphones on like he usually did. Each act of gratitude felt like turning toward something warm, like stepping from shade into a patch of sunlight. Some days were harder than others. Some days the grief wrapped around him like humidity before a thunderstorm, heavy and inescapable. Yet, the sunflowers kept growing, kept turning, kept choosing light even when clouds covered the sky.", "By the time the flowers were in full bloom, their faces as wide as dinner plates, Jonathan understood what his grandmother had meant. Being thankful did not erase sadness or bring back what was gone. It just gave him a compass, a way to orient himself when everything felt lost. Like the sunflowers bending toward dawn, he could choose which way to face.", "On the last day of term, Jonathan collected seeds from the dried flower heads, their papery petals crackling under his fingers. He placed them in a new envelope, saving them for her favourite community garden next year. As he folded the flap shut, he thought about being thankful, and how gratitude had helped him find his way through the dark. Maybe, when the flowers bloomed again, someone else would see them and understand what he finally did, that even in loss there is always a way to turn toward the light."], "level": "psle"}, {"id": "space-between-steps", "num": 102, "title": "The Space Between Steps", "family": "bonds", "path": "Crack & Repair", "source": "2025 PSLE Paper 1 · Picture 3 (Give Way to Elderly sign)", "topic": "Write a composition about ‘Being Thankful’. (2025 PSLE Paper 1 · Picture 3: Give Way to Elderly sign)", "theme": "Being thankful means choosing to see, and slowing down for those you love.", "audio": "bonus3", "pov": "third", "words": 909, "stages": [{"key": "setting", "paras": [0, 1], "pic": "🦯😣🚶‍♀️", "hook": "Dad’s cane clicks. Amanda walks three steps ahead.", "summary": "After her father’s stroke, Amanda burns with shame at how slowly he shuffles with his cane, just like the figure on the ‘Give way to Elderly’ sign near her school. She walks ahead of him and hides her face whenever classmates pass.", "trick": "Names the ugly feeling honestly (‘Not sadness or worry but shame’) and links the father to the sign that will matter later."}, {"key": "rising", "paras": [2], "pic": "🚦⚠️😓", "hook": "Red light. The crossing is the worst part.", "summary": "The crossing beneath the yellow sign is the hardest part of every day. One afternoon the light turns green and her father staggers forward at a snail’s pace, the only speed his body allows.", "trick": "Zooms from ‘every day’ to ‘one afternoon’ – a classic way to move from background into the key scene."}, {"key": "climax", "paras": [3, 4, 5], "pic": "📢🛡️👵", "hook": "The horn blares. Amanda shields her father.", "summary": "A car horn blasts, her father flinches and wobbles, and something in Amanda cracks: she plants herself between him and the car, glaring at the driver. An elderly woman with a cane guides them across and quietly says she has seen Amanda walking ahead, pretending they are not together, and that the sign asks for the patience Amanda refuses her own father.", "trick": "The brave act is followed by a stranger speaking the truth; a simile (‘like stones in still water’) shows how deep the words sink."}, {"key": "falling", "paras": [6, 7], "pic": "🌙💭🙏", "hook": "That night: real gratitude, the kind that hurts.", "summary": "In bed Amanda thinks about what being thankful really means. She is grateful for the sign, for drivers who wait, and that her father survived and can still walk. Being thankful, she decides, is choosing to see second chances instead of limitations.", "trick": "Repeats the key phrase (‘grateful… grateful… Thankful’) to build the reflection like a drumbeat."}, {"key": "ending", "paras": [8, 9], "pic": "🤝🐢💛", "hook": "She slows down. The sign never changed – she did.", "summary": "Amanda stops walking ahead, matches her father’s pace and takes his arm at crossings, nodding thanks to patient drivers. Over weeks she begins noticing everyone who needs extra time. The sign stays the same, but Amanda has changed.", "trick": "Reverses the opening image (‘three steps ahead’ becomes walking side by side) and ends by echoing the topic, being thankful."}], "vocab": [{"w": "scrambled everything into chaos", "d": "mixed everything up so that it became a confusing mess"}, {"w": "shuffling", "d": "walking slowly without lifting the feet properly off the ground"}, {"w": "hot and acidic", "d": "a feeling (here, shame) that burns and stings like acid"}, {"w": "obscured", "d": "hid something so that it could not be seen clearly"}, {"w": "loomed", "d": "appeared large and threatening, hanging over a place"}, {"w": "at a snail’s pace", "d": "extremely slowly"}, {"w": "aggressive blare", "d": "a loud, harsh, angry-sounding noise, like a car horn"}, {"w": "flinched", "d": "made a sudden small movement from fear or pain"}, {"w": "cracked wide open", "d": "a strong feeling suddenly broke free, like a shell breaking"}, {"w": "landed like stones in still water", "d": "words that hit hard and whose effect keeps spreading, like ripples"}], "paras": ["Amanda’s life used to fit inside a color-coded planner until her father's stroke at forty-five scrambled everything into chaos she could not reorganise. He came home from the hospital moving like a different person, slow and hesitant, his left arm hanging useless while his right hand clutched a metal cane that clicked against the floor with every shuffling step. Amanda watched him struggle down their HDB corridor and felt something ugly twist in her stomach. Not sadness or worry but shame, hot and acidic, burning up her throat every time she had to be seen with him in public. He moved exactly like the figure on that “Give way to Elderly” sign near her school, the yellow triangle she had passed a thousand times without really seeing. A figure bent forward, clutching a cane, moving like time itself had turned against them.", "She had taken to walking three steps ahead whenever she left the house with her father. At the mall she pretended to study shop windows. At the market she drifted toward different stalls. When classmates passed them on the street, Amanda pretended to check her phone, tilting her head so her hair obscured her features. Her father never said anything, just kept that careful shuffling pace, his cane clicking, his breath coming harder than it should for a man who used to play competitive tennis every Sunday.", "The crossing near her school became the worst part of every day. That yellow “Give way to Elderly” sign loomed over the pedestrian path, impossible to miss. One afternoon they reached the crossing just as the light turned red. Her father planted his cane on the curb, breathing hard, sweat darkening his collar. When the light turned he staggered forwards at a snail's pace, the only pace his body allowed.", "They were halfway across when the aggressive blare of a car horn cut through the air, sharp and impatient. Her father flinched like he had been struck. His cane wavered and he tried to move faster, his face flushing dark red. The car honked again, longer this time, and something inside Amanda's chest cracked wide open. She whirled around, planting herself between her father and the car, her school bag swinging hard against her hip. The driver glared at her through his open window but she glared back, her hands clenched into fists.", "A hand touched her shoulder, making her jump. An elderly woman stood beside her on the crossing, liver-spotted hands clutching a canvas shopping bag. The hunched woman moved with the same cautious shuffle as Amanda's father. “I see you every day,” the woman said quietly. “You walk ahead. You pretend you are not together.” Amanda's face burned. The woman guided them to the opposite curb, beneath that yellow warning sign with its figure forever frozen mid-crossing, forever clutching a cane, forever needing just a bit more time. The light turned red again and the car revved and shot forward the moment they cleared the lane.", "“That sign has been here longer than you have been alive,” the woman continued, tilting her head up toward it. “Every day it asks people to slow down, to wait, to care. But you do not see it either. You are angry your father needs the same patience that sign asks for.\" The words landed like stones in still water. The woman patted her shoulder once more, then shuffled away toward the wet market, her own cane clicking against the pavement.", "That night, Amanda lay in bed and let herself think about what being thankful actually meant. Not the polite kind she wrote in thank-you cards but real gratitude, the kind that hurt. She was grateful the sign existed at all, grateful someone had thought to put it there years ago, to warn drivers that some people needed extra time and extra patience. Being grateful meant noticing the drivers who did slow down without honking, who saw the sign and let it change their behaviour. She was grateful her father had survived when so many did not. Thankful he could still walk, even slowly, even with a cane, even if it took three times longer to get anywhere.", "Being thankful was not about pretending everything was fine. It was about choosing what to see. She could see limitations or she could see second chances. That yellow sign with its stick figure was not marking people as broken but marking a space where vulnerability deserved care, where slower did not mean less valuable.", "Amanda stopped walking three steps ahead. She slowed her pace to match her father's, took his arm at crossings, feeling the tremor in his muscles, the way he leaned on her slightly when the curb was high. She made eye contact with drivers and nodded thanks when they stayed patient.", "Being thankful changed shape as weeks passed. It grew beyond the sign, beyond the crossing, beyond her father's cane clicking against pavement. She noticed other people who needed time: the pregnant woman on the MRT, the elderly man counting coins slowly at the supermarket, the child in a wheelchair at the playground. Being thankful meant seeing them the way she had failed to see her own father for three whole months. The sign never changed, but she had. It was still there, waiting at the same crossing, reminding everyone who passed to be thankful for the lightness of their pace and to show kindness to those who had lost it."], "level": "psle"}, {"id": "p5-being-thankful", "num": 1, "title": "Being Thankful", "family": "bonds", "path": "Invisible Hero", "source": "TLL 2026 · P5 exemplar · by Gabriel Pung", "topic": "Write a composition of at least 150 words about being thankful.", "theme": "Someone who keeps believing in you deserves your thanks, and the best thanks is to believe in yourself.", "audio": "p5-being-thankful", "pov": "first", "words": 961, "stages": [{"key": "setting", "paras": [0], "pic": "🎉📝🙏", "hook": "A surprise party, and two words that are not enough.", "summary": "The day after the maths results, the class decorates their room for a surprise party. The narrator writes ‘Thank You’ on the whiteboard and feels the two words are far too small for her gratitude. Her mind drifts back to how it all began.", "trick": "Flashback opening: the picture of the classroom party shows the END of the story, so Gabriel starts there and lets it trigger a flashback. The trigger is written in the simple past (‘It was the day after…’)."}, {"key": "rising", "paras": [1, 2, 3, 4, 5], "pic": "👂😔🧑‍🏫", "hook": "‘You’ll be lucky if half of them pass.’ Then a teacher who smiles.", "summary": "At the start of the year she overhears the principal call her class a rowdy bunch who will barely pass. Her heart sinks when the class behaves exactly like that. But the new form teacher, Mr James, smiles and says he loves their energy and wants them to have fun learning.", "trick": "Tense switch: when the flashback begins, Gabriel uses the past perfect (‘It had been the start of the school year’, ‘I had overheard’) to show the story has jumped back in time. Mr James also surprises the reader by NOT acting like a stern teacher."}, {"key": "climax", "paras": [6, 7, 8, 9, 10, 11], "pic": "📉✏️😮", "hook": "Half the class fails… then the final results.", "summary": "Mr James keeps his word. When more than half the class fails the mid-year exam, he does not scold. He makes extra worksheets and stays back to explain again and again. On results day, with the principal’s words ringing in her ears, she opens her paper: she has passed, and so has the whole class.", "trick": "STEAL: this part focuses on Mr James’s Actions to show how encouraging he is, giving her even more reason to feel thankful. The principal’s words from the rising action are echoed here, tying the story together."}, {"key": "falling", "paras": [12, 13, 14, 15], "pic": "🎈🎊🤗", "hook": "A thank-you party. His hand flies to his mouth.", "summary": "She suggests a thank-you party. The class hangs balloons and bunting, pools their pocket money for food and writes ‘Thank You’ on the board. Mr James walks in, stunned, and they shout their thanks together.", "trick": "Full circle: we are back at the party from the introduction, so the flashback clicks into place."}, {"key": "ending", "paras": [16], "pic": "💛🧠📚", "hook": "It is how we see ourselves that matters.", "summary": "Filled with gratitude, she learns that what matters is believing in your own abilities. She decides to study hard as her own quiet way of thanking the teacher who changed her life.", "trick": "The conclusion follows the four TLL steps: a link to the falling action, the protagonist’s feelings, the lesson learnt and a mention of the topic (‘showing gratitude’)."}], "vocab": [{"w": "profound", "d": "very deep and strong"}, {"w": "gratitude", "d": "the feeling of being thankful"}, {"w": "rowdy", "d": "noisy, rough and badly behaved"}, {"w": "scrape a pass", "d": "only just pass"}, {"w": "Inferring", "d": "working something out from clues"}, {"w": "trudged", "d": "walked slowly and heavily"}, {"w": "immaculately", "d": "perfectly neatly"}, {"w": "plastered", "d": "spread all over, as if stuck on"}, {"w": "channel", "d": "direct energy into something useful"}, {"w": "hesitation", "d": "a pause because you are unsure"}, {"w": "facilitating", "d": "helping something to happen"}, {"w": "weighted", "d": "counting for more marks"}, {"w": "impatience", "d": "annoyance at having to wait or repeat"}, {"w": "clammy", "d": "cold and damp with sweat"}, {"w": "contrary to", "d": "the opposite of"}, {"w": "glistening", "d": "shining because they were wet"}, {"w": "pooled", "d": "put together"}, {"w": "overwhelming", "d": "very strong"}], "paras": ["It was the day after we had received our mathematics end-of-year examination results, and my classmates and I had spent the whole recess decorating our classroom for a surprise party. After writing the words ‘Thank You’ in bold letters on the whiteboard, I stepped back to look at the two simple words, feeling as though they could not fully capture the profound gratitude I felt. Uncontrollably, my mind drifted back to how it had all begun.", "It had been the start of the school year. My classmates and I had just been informed that we would be getting a new form teacher. That morning, on my way back from the toilet, I had overheard my principal speaking to a teacher I had not recognised along the corridor.", "“Don’t get your hopes up for this class. They’re a rowdy bunch. You’ll be lucky if half of them even scrape a pass for the final exam.” Inferring that this was my new form teacher, I froze in my tracks. Then, I quietly slipped away before they could notice.", "With a heavy heart, I trudged towards my classroom with my principal’s words echoing in my mind. A part of me wanted to believe that she was wrong, but as I pushed open the door, my heart sank further. My classmates were kicking each other and shouting at the top of their lungs, exactly as my principal had described. I slumped into my seat, wondering if we were truly hopeless and doomed to fail.", "Just then, the teacher whom I had seen in the corridor with my principal entered my classroom. He was dressed immaculately with a smile plastered on his face. Once he had settled my class down, he introduced himself. “I am Mr James, your new form teacher. I’ll be teaching you maths as well,” he announced. “I love that this class has so much energy. Let’s channel that excitement into asking questions and having fun with your learning this year!”", "For a moment, nobody said anything. We were used to teachers scolding us the instant they walked in. Mr James must have noticed our hesitation, because he added, gently but firmly, that he meant what he had said.", "To our surprise, Mr James kept to his word, encouraging us to speak up in class and facilitating discussions. He constantly told us that he believed in us, even when we were slow to grasp maths concepts.", "Halfway through the year, we received our weighted examination results. More than half the class, me included, had failed. A lump formed in my throat. It seemed like my principal was right.", "However, Mr James did not scold or give up on us. Every week, he created extra practice worksheets for us. Every other day, he also stayed back after school to go through the concepts my classmates and I struggled with, explaining them repeatedly without a trace of impatience. Whenever one of us finally understood a concept that we had struggled with, he would break into a grin, as though our small victories were his own. Slowly, the red crosses on our worksheets were replaced by ticks and stars.", "Before long, the end-of-year examinations were upon us. The whole week flew past in a blur of endless revision.", "Then, came the day our maths results were released. The classroom fell silent as Mr James walked in holding a stack of papers, his expression unreadable. My palms grew clammy as he called my classmates up one by one. By the time my name was called, my legs felt like jelly. I stared at my paper for a long moment before I could bring myself to unfold it, my principal’s words ringing in my ears. “You’ll be lucky if half of them even scrape a pass for the final exam.”", "My jaw dropped. I passed. Not just passed, I had scored higher than ever before! Gasps and muffled squeals broke out across the room as my classmates realised the same thing. In fact, contrary to what my principal had predicted, my entire class had passed the final exam! I looked up to find Mr James watching us, his eyes glistening as a smile spread slowly across his face. In that moment, I felt a warm, fuzzy feeling spread through my chest, grateful that Mr James had gone to such great lengths for my classmates and me.", "An idea came to me. Turning to my classmates, I softly suggested that we throw a thank-you party for Mr James. Everyone nodded eagerly.", "The next day, my classmates and I spent our recess decorating our classroom, filling it with colourful balloons and polka-dotted bunting. We even pooled our own pocket money to buy food and drinks! Using my neatest handwriting, I wrote a large ‘Thank You’ on the whiteboard.", "Just as I was lost in thought staring at the two words, footsteps sounded in the corridor, and the whole class fell silent, holding our breath. When Mr James entered the classroom, his hand flew to his mouth in surprise.", "“Thank you for believing in us, Mr James!” my classmates and I shouted together.", "As laughter and chatter filled the classroom that afternoon, I felt an overwhelming sense of gratitude wash over me. From this experience, I learnt that it did not matter how others saw us. What mattered was how we saw ourselves, and that we should have the confidence to believe in our abilities. My classmates and I simply needed someone, like Mr James, to remind us of this. Looking at the whiteboard once more, I was determined to study hard, not just to avoid letting Mr James down, but as my own quiet way of showing gratitude to the teacher who had made the greatest difference to my life."], "level": "p5", "fromTLL": true}, {"id": "p5-act-of-mischief-isabella", "num": 2, "title": "An Act of Mischief · Isabella", "family": "growth", "path": "Hard Lesson", "source": "TLL 2026 · P5 exemplar · by Isabella Chan", "topic": "Write a composition about an act of mischief.", "theme": "Two wrongs do not make a right: a prank for revenge rarely solves anything.", "audio": "p5-act-of-mischief-isabella", "pov": "first", "words": 873, "stages": [{"key": "setting", "paras": [0], "pic": "😠👑🏫", "hook": "The head prefect hates one person. Me.", "summary": "Amanda, the school’s head prefect, cannot stand one person: the narrator, Alice.", "trick": "A punchy opening: a long sentence builds up, then a one-word answer, ‘Me.’, grabs the reader at once."}, {"key": "rising", "paras": [1, 2, 3, 4, 5], "pic": "🏆🦅🕷️", "hook": "A grudge, a detention, a bag of fake spiders.", "summary": "Ever since Alice beat Amanda in a class challenge, Amanda has picked on her, and she even got Alice detention for being one minute late. Alice decides to get back at her. At recess she stays behind, tips a bag of fake spiders into Amanda’s school bag, and waits for her to open it.", "trick": "STEAL on Amanda: her Actions (nitpicking, reporting Alice), her Effects on others and her Looks (‘sharp eyes… the way a hawk hunts for mice’) show why Alice holds a grudge. The detention is ‘the final straw’ that makes the plan believable."}, {"key": "climax", "paras": [6, 7, 8, 9], "pic": "😱🪑😭", "hook": "‘S… spiders!’ The chair topples. Every head turns.", "summary": "Amanda shrieks, scrambles back so hard her chair topples over, and bursts into tears. Alice’s stomach drops: she only meant a little scare. Mr Ong asks who did it, and a classmate remembers that Alice was the last one out.", "trick": "Varied sentence openings keep the action moving: ‘Breaking into hushed whispers…’, ‘Pointing towards Amanda…’, ‘To my horror…’."}, {"key": "falling", "paras": [10, 11, 12, 13, 14], "pic": "😔🙋📞", "hook": "Stay silent, or own up?", "summary": "All lesson Alice fights with herself. Seeing Amanda still red-eyed, she knows she could not live with staying silent. She confesses to Mr Ong, who gives her a stern lecture and calls her parents. She promises never to do it again and to apologise.", "trick": "Inner conflict: her thoughts swing between ‘no one can prove it’ and guilt, and guilt wins. Showing the struggle makes the confession believable."}, {"key": "ending", "paras": [15], "pic": "🌙💭⚖️", "hook": "Two wrongs don’t make a right.", "summary": "That night Alice admits that a part of her is glad Amanda felt what unkindness is like, but she knows two wrongs do not make a right. An act of mischief rarely solves anything.", "trick": "An honest ending: Alice does not pretend to be perfect, which makes the lesson feel real. The last line names the topic, ‘an act of mischief’."}], "vocab": [{"w": "prefect", "d": "a pupil chosen to help keep order in school"}, {"w": "upstaged", "d": "did better than someone and took the attention away from them"}, {"w": "nitpick", "d": "find fault with tiny details"}, {"w": "roster", "d": "a list of whose turn it is"}, {"w": "withering looks", "d": "looks that make you feel small and foolish"}, {"w": "offence", "d": "a time you broke a rule"}, {"w": "detention", "d": "being kept back at school as a punishment"}, {"w": "final straw", "d": "the last of many annoying things, which makes you act"}, {"w": "anticipation", "d": "excited waiting"}, {"w": "Lingering", "d": "staying behind on purpose"}, {"w": "gleefully", "d": "with naughty delight"}, {"w": "toppled", "d": "fell over"}, {"w": "culprit", "d": "the person who did something wrong"}, {"w": "furrowed", "d": "wrinkled, from worry or confusion"}, {"w": "flinching", "d": "jerking back in fear"}, {"w": "summoned", "d": "called to come"}, {"w": "snide", "d": "nasty in a sly way"}], "paras": ["Of all the students in Sunshine Primary School, there was one person whom Amanda, my school’s head prefect, hated with heat whiter than the sun. Me.", "It all started when I managed to beat Amanda and scored first place in a class challenge. No one had ever upstaged her before, and from then on, whenever she saw me, her expression would darken, as if the sun had winked out. Her sharp eyes seemed to hunt for my mistakes the way a hawk hunts for mice. She would nitpick how I cleaned the classroom whenever it was my turn on the roster and shoot me withering looks whenever I answered a question wrongly. Just the day before, she had reported me to our form teacher, Mr Ong, as I had arrived at school a mere minute late. As it was already my third offence, I was given detention.", "That was the final straw. I decided to get back at her.", "The next morning, I tucked a bag of fake spiders into my school bag and hurried to school, my mind buzzing with anticipation. When recess came, everyone filed out in two neat lines towards the canteen, chattering noisily. Lingering behind, I mumbled something about finding my wallet to my friends and urged them to head to the canteen first.", "Once the last footsteps faded down the corridor, the classroom fell silent. Rows of empty chairs were tucked neatly behind desks and the only sound was the distant clatter of trays from the canteen below. I retrieved the bag of fake spiders from my school bag and crept over to Amanda’s desk. Spilling the contents into Amanda’s school bag, I could not help but grin widely. This is the perfect prank! I thought gleefully as I headed to the canteen for recess.", "Soon, it was time for class. Once everyone had returned to the classroom and settled down, Amanda reached down to her school bag to retrieve her pencil case and textbook. My heart began to pound as I watched her every move.", "“Ah! S . . . spiders!” Amanda shrieked as she snatched her hand out of her school bag. She scrambled backwards so violently that her chair toppled over and she burst into tears. My stomach dropped. My prank was only to give Amanda a little scare. I did not expect her to have such a big reaction!", "Breaking into hushed whispers, my classmates started discussing who the culprit was. At that moment, Mr Ong walked in, brows furrowed in confusion. “What happened here?” he asked, looking around the classroom.", "Pointing towards Amanda, who was still sobbing by her overturned chair, a few students explained what had happened. Mr Ong hurried over to comfort her before turning to address the class, his voice stern. “Did anyone see who did this?” he asked, his eyes sweeping across the room.", "To my horror, one of my classmates spoke up. “I remember Alice was still in the classroom when the rest of us left for recess. I think she was the last one out.” My blood ran cold as every head in the classroom turned towards me. Mr Ong’s gaze settled on me, his expression unreadable.", "“Alice, please see me after class,” he said quietly, before turning back to comfort Amanda.", "I spent the rest of the lesson staring blankly at my textbook, my mind racing between two thoughts. Perhaps if I said nothing, no one could truly prove it was me. However, every time I glanced up, I caught sight of Amanda, her eyes still red and puffy, flinching whenever her hand brushed against her bag. Guilt twisted in my stomach, heavier with each passing minute. By the time the bell rang, I knew that even if I could get away with staying silent, I would not be able to live with myself if I did.", "Mr Ong’s mouth was set into a thin line when I was summoned to his desk once class ended. “I heard you were the last to leave the classroom during recess today, Alice,” he said, watching me carefully. “Do you know anything about the prank?”", "The words tumbled out before I could stop them. “It was me,” I mumbled. “I did it.”", "As Mr Ong launched into a stern lecture about the dangers of pranks, I could hardly bring myself to look him in the eye. To make matters worse, he informed me that he would be calling my parents to let them know what had happened. I promised never to pull pranks like this again and vowed to apologise to Amanda.", "That night, I lay awake thinking about what had happened. Frightening Amanda so badly had been wrong and the image of her scrambling backwards in tears was not something I could easily shake off. Yet, thinking back on the months of snide comments and withering looks she had directed at me, I could not fully regret the prank itself. Perhaps some part of me was glad she finally understood what it felt like to be on the receiving end of unkindness. Still, I knew two wrongs did not make things right. I understood then that an act of mischief, however satisfying in the moment, rarely resolves anything."], "level": "p5", "fromTLL": true}, {"id": "p5-act-of-mischief-yanlin", "num": 3, "title": "An Act of Mischief · Yanlin", "family": "growth", "path": "Hard Lesson", "source": "TLL 2026 · P5 exemplar · by Xian Yanlin", "topic": "Write a composition about an act of mischief.", "theme": "Getting even only adds hurt. Say how you feel instead of plotting revenge.", "audio": "p5-act-of-mischief-yanlin", "pov": "first", "words": 525, "stages": [{"key": "setting", "paras": [0], "pic": "🎨😤🚶", "hook": "My brother laughed at my artwork.", "summary": "The narrator stomps home, still smarting because her younger brother, Ampert, and his friends laughed at her artwork. Ampert skips along beside her, not noticing at all.", "trick": "Ideas: a clear and believable reason for the mischief comes first, so the reader understands why she does it, even though it is not right."}, {"key": "rising", "paras": [1, 2, 3, 4, 5], "pic": "🏪🪳🍟", "hook": "A toy cockroach. My chance for revenge!", "summary": "She spots realistic toy cockroaches at a shop, sends Ampert home first and hides one inside a packet of chips. Looking innocent, she hands him the chips while he watches TV.", "trick": "Close detail of the toy (‘glossy, dark brown shells, spindly little legs and long, wiry antennae’) makes the prank easy to picture and shows why it will work."}, {"key": "climax", "paras": [6, 7, 8], "pic": "😱🪳😭", "hook": "‘Cockroach! Cockroach!’", "summary": "Ampert pulls out the cockroach, shrieks and bursts into tears while she doubles over laughing. When he sees it is only a toy, he sobs that she is the worst sister ever.", "trick": "Strong action and sound words (‘yanked’, ‘ear-splitting shriek’, ‘howled’, ‘flinging’) make the peak loud and lively."}, {"key": "falling", "paras": [9], "pic": "👩😠🙇", "hook": "Mum steps in. Two apologies.", "summary": "Their parents rush in. Mother scolds her for the cruel prank and Ampert for laughing at the artwork. Both hang their heads and apologise, though Ampert will not look at her for the rest of the day.", "trick": "A fair adult: Mother points out what BOTH children did wrong, so the problem is settled sensibly."}, {"key": "ending", "paras": [10], "pic": "🛏️💭🗣️", "hook": "Next time, I will speak up.", "summary": "In bed, she realises scaring Ampert was not the answer. Mischief only adds hurt, so next time she will speak up honestly instead of plotting revenge.", "trick": "Structure: the conclusion links back to the topic (‘Acts of mischief’), gives a sincere lesson and a heartfelt promise to change."}], "vocab": [{"w": "frustration", "d": "an angry, fed-up feeling"}, {"w": "stomped", "d": "walked with heavy, angry steps"}, {"w": "mocked", "d": "made fun of"}, {"w": "seethed", "d": "was silently very angry"}, {"w": "oblivious", "d": "not noticing at all"}, {"w": "novelty", "d": "new and unusual, made for fun"}, {"w": "startlingly", "d": "surprisingly, in a way that makes you jump"}, {"w": "spindly", "d": "long and very thin"}, {"w": "antennae", "d": "the feelers on an insect’s head"}, {"w": "revenge", "d": "hurting someone back because they hurt you"}, {"w": "Snickering", "d": "laughing quietly in a mean way"}, {"w": "sprawled", "d": "lying with arms and legs spread out"}, {"w": "yanked", "d": "pulled suddenly and hard"}, {"w": "ear-splitting", "d": "extremely loud"}, {"w": "commotion", "d": "noisy confusion"}, {"w": "reprimanded", "d": "scolded"}, {"w": "sincere", "d": "really meant"}, {"w": "resolved", "d": "firmly decided"}], "paras": ["Huffing in frustration, I stomped all the way home from school. Earlier, Ampert, my younger brother, had looked for me after my art class so that we could head home together. He had taken one look at the artwork I had just completed and mocked how ugly it was. To make matters worse, his friends, who had been with him, had crowded around me and laughed along with him! What an annoying brother! I seethed as Ampert skipped along cheerfully beside me, oblivious to how upset I was.", "Just then, I spotted a convenience store selling snacks and novelty toys, including startlingly realistic toy cockroaches. They had glossy, dark brown shells, spindly little legs and long, wiry antennae. It was exactly the sort of thing that would send Ampert running! I felt a grin spread across my face. This is my chance for revenge!", "“Ampert, I’m going to spend some time choosing and buying chips,” I told my brother. “You can head home first.”", "Nodding eagerly, Ampert hurried ahead. Snickering to myself, I bought the promised chips along with a toy cockroach. Then, I dashed home to put my prank into motion.", "Once home, I carefully tore open the pack of chips. Slipping the toy cockroach in among the chips, I hid it out of sight and folded the packet closed. Trying my best to look innocent, I handed the pack of chips to Ampert, who was sprawled on the sofa watching television. “Here Ampert, have some chips,” I said sweetly.", "Thanking me, Ampert dug his hand into the packet and stuffed a handful of chips into his mouth, still watching the television.", "Suddenly, Ampert froze. He yanked the toy cockroach out, stared at it in horror, and let out an ear-splitting shriek. “Cockroach! Cockroach!” he howled, flinging the toy cockroach across the room before bursting into tears. I doubled over laughing, clutching my stomach until it ached.", "“That’s what you get for making fun of my artwork!” I exclaimed between fits of giggles.", "Shocked, Ampert stopped his crying and went over to examine the cockroach. Soon, he realised it was just a toy. “You’re the worst sister ever!” he sobbed.", "Alarmed by the commotion, my parents rushed into the living room. When my mother learnt what had happened, she looked at me sternly. “That was a cruel prank, even if Ampert had hurt your feelings first,” she reprimanded. Turning to Ampert, she added, “You should never have laughed at your sister’s artwork either. That was unkind of you.” Ampert and I hung our heads in shame. I mumbled a sincere apology to Ampert, and he mumbled one back to me, though he still refused to look me in the eye for the rest of the day.", "That night, as I lay in bed, I thought about my prank. My artwork being mocked had hurt, but frightening Ampert half to death was not the answer. Acts of mischief might feel satisfying in the moment, but they only add hurt rather than solve a problem. I resolved that the next time someone upsets me, I would speak up honestly instead of plotting my revenge in secret."], "level": "p5", "fromTLL": true}, {"id": "p5-literary-kind-alena", "num": 4, "title": "An Encounter with the Literary Kind · Alena", "family": "fixes", "path": "Ticking Clock", "source": "TLL 2026 · P5 exemplar · by Alena Seet", "topic": "Write a creative story titled ‘An Encounter with the Literary Kind’.", "theme": "Reading carefully can hand you the answer when a problem pops up, even in Willy Wonka’s factory.", "audio": "p5-literary-kind-alena", "pov": "first", "words": 802, "stages": [{"key": "setting", "paras": [0], "pic": "📖☀️🚪", "hook": "Rereading my favourite book… then a knock.", "summary": "On a sunny afternoon, Alena curls up on the sofa with Charlie and the Chocolate Factory, enjoying every twist of the plot. A knock at the front door interrupts her.", "trick": "A few lines of background on the book tell the reader just enough about Willy Wonka before he appears."}, {"key": "rising", "paras": [1, 2, 3, 4], "pic": "🎩🌀🍫", "hook": "Willy Wonka at the door, and a leap into the book!", "summary": "Willy Wonka himself is at the door. He pulls her into the book and she lands in his chocolate factory. He begs for help: the Oompa Loompas ate his new coffee toffees and are bouncing about wildly, and they refuse the cure pills.", "trick": "STEAL Looks: the top hat, plum velvet coat, gold-topped cane and bright eyes bring the character to life. The five senses (melting chocolate, the bubbling river, whirring machines) build the magical setting."}, {"key": "climax", "paras": [5, 6, 7, 8, 9], "pic": "💡🍫💊", "hook": "Coat the pills in cocoa!", "summary": "Remembering the book, Alena suggests coating the pills in liquid cocoa. They grind the beans, boil the cocoa and pour it over the pills. The Oompa Loompas swarm over, eat the ‘candies’ and calm down.", "trick": "Alena draws on what she has read in the story to come up with a logical solution. This makes the plot intriguing and believable."}, {"key": "falling", "paras": [10, 11], "pic": "😮‍💨🎫🙏", "hook": "A golden ticket as thanks.", "summary": "Relieved, Willy thanks her and gives her a golden ticket so she can visit again. He opens a portal on the page of her paperback to send her home.", "trick": "The golden ticket comes from the real book, and it will matter again in the ending."}, {"key": "ending", "paras": [12, 13], "pic": "🛋️🤔🎫", "hook": "Was it a dream? The ticket says no.", "summary": "Back on her sofa, she wonders if it was all a dream, until she finds the golden ticket in her pocket. She can return whenever she likes.", "trick": "A curious ending: questions (‘Was it all in my imagination?’) followed by a twist, the ticket, which proves it was real."}], "vocab": [{"w": "Shafts", "d": "long, narrow beams"}, {"w": "devoured", "d": "read eagerly and quickly"}, {"w": "enthralled", "d": "completely gripped"}, {"w": "Bewildered", "d": "very puzzled"}, {"w": "extraordinary", "d": "very unusual and special"}, {"w": "velvet", "d": "a soft, thick, smooth cloth"}, {"w": "legendary", "d": "very famous"}, {"w": "whirring", "d": "a steady humming, buzzing sound"}, {"w": "awe", "d": "wonder mixed with amazement"}, {"w": "dazed", "d": "unable to think clearly"}, {"w": "implored", "d": "begged"}, {"w": "irresistible", "d": "too good to say no to"}, {"w": "clamour", "d": "loudly demand"}, {"w": "glistened", "d": "shone"}, {"w": "swarmed", "d": "rushed together in a crowd"}, {"w": "portal", "d": "a magic doorway"}], "paras": ["Shafts of afternoon sunlight poured through the window as I snuggled into the sofa. I had just started rereading my favourite book, Charlie and the Chocolate Factory. I adored the character Willy Wonka and his magical chocolate factory. In the story, Willy had chosen five lucky children to visit his factory and uncover all its secrets. I devoured each page, enthralled by the fascinating twists and turns of the plot. Suddenly, a knock at the front door startled me out of my reading.", "Who could it be? Bewildered, I opened the door and gasped in surprise. Standing before me was an extraordinary man in a black top hat and a long coat of plum velvet. In one hand, he carried a fine gold-topped walking cane. A neat, small black beard covered his chin, and his eyes were marvellously bright. It took a moment for me to gather my senses, but I soon realised who stood before me. This was the one-and-only Willy Wonka!", "Before I could utter a word, he whispered urgently, “Alena, you’re just the person I am looking for. I need your help!” He snatched the paperback from my hands and dropped it onto the floor. Then, he leapt into the book, taking my arm and pulling me along with him. My surroundings spun into a dizzying blur.", "When the spinning finally stopped, I found myself standing right in the middle of Willy Wonka’s legendary factory! The sweet, warm scent of melting chocolate filled the air, and a river of glossy, dark chocolate wound its way past me, bubbling gently as it flowed. Candy-striped trees grew from the grassy banks and somewhere in the distance came the faint whirring of enormous machines at work. My eyes widened in awe at the sights before me. This cannot be real, I thought, still dazed. I would never have imagined that Willy Wonka would bring me into his own factory!", "“My dear child, I desperately need your help,” Willy implored. “My Oompa Loompas accidentally ate some of my newly invented coffee toffees, and now they are running and jumping about wildly. I’ve made a cure and turned it into pills, but none of them will eat it. Since you’ve read all about my adventures, I believe you’re the best person to help me!”", "I thought for a moment. “We could make the cure so delicious that the Oompa Loompas will eat it willingly,” I said. But what would an Oompa Loompa find irresistible? Recalling what I had read in the book, an idea struck me. “That’s it! We can coat the pills in liquid cocoa. The Oompa Loompas will surely clamour for them!”", "Willy’s eyes lit up with delight. “What a fantastic idea, Alena! Let’s do it!”", "We rushed to the chocolate-mixing room to put the plan into action. We ground cocoa beans into powder, mixed it with water, and boiled it until it thickened into a glossy liquid. Once it had cooled slightly, Willy poured it over the pills, which soon glistened under the light.", "“Bravo! Now they’re ready for the Oompa Loompas!” Willy exclaimed, patting me on the back. We brought the pills down to where the Oompa Loompas were bouncing about.", "“Attention, Oompa Loompas! Try these delicious new cocoa candies!” Willy called over the commotion. The eager
