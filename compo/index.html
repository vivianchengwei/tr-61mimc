function render(){
  const r = route(); const app=document.getElementById("app");
  const scroll = window.scrollY;
  let html;
  sessSync(r);
  if(r.v==="family") html=viewFamily(r.f); else if(r.v==="story") html=viewStory(r.id); else if(r.v==="bank") html=viewBank(); else if(r.v==="parents") html=viewParents(); else html=viewHome();
  app.innerHTML = homeNote(r) + html + `<footer>Model compositions © Writers At Work · Story families from Insight Edu Story Garden · Built for one young writer’s PSLE journey.<br><a href="#parents" class="plink">👪 家长页 · 记录和备份</a></footer>`;
  document.getElementById("brand").innerHTML = logoSVG()+`<span>Story Garden</span>`;
  document.getElementById("nav").innerHTML = `<a href="#home" class="${r.v==="home"?"on":""}">Garden</a>`+FAM_ORDER.map(f=>`<a href="#family-${f}" class="${r.v==="family"&&r.f===f||(r.v==="story"&&storyById(r.id)?.family===f)?"on":""}" style="${(r.v==="family"&&r.f===f)||(r.v==="story"&&storyById(r.id)?.family===f)?`color:${FAMILIES[f].color}`:""}">${FAMILIES[f].emoji}<span class="navname"> ${esc(FAMILIES[f].name.split(" ")[0])}</span></a>`).join("")+`<a href="#bank" class="${r.v==="bank"?"on":""}">💛 Bank</a>`;
  mountPlayer(r.v==="story" ? storyById(r.id) : null);
  syncListen();
  if(render.lastHash===location.hash) window.scrollTo(0,scroll);
  render.lastHash=location.hash;
}
/* ===================== AUDIO PLAYER (fixed bar) ===================== */
const audioCache = {}; // url -> object URL (audio downloaded into the page: works on iPad/Safari, which rejects streamed sources)
const playerEl = document.getElementById("player");
function playerHTML(s, body){ return `<span class="lbl">🎧 <span class="t">${esc(s.title)}</span></span>${body}`; }
async function loadAudio(url){
  if(audioCache[url]) return audioCache[url];
  let res = await fetch(url).catch(()=>null); if(!res || !res.ok){ await new Promise(r=>setTimeout(r,700)); res = await fetch(url); }   // one more try before giving up
  if(!res.ok) throw new Error("HTTP "+res.status);
  const buf = await res.arrayBuffer();
  const obj = URL.createObjectURL(new Blob([buf], {type: /\.mp3(\?|$)/i.test(url) ? "audio/mpeg" : "audio/mp4"}));
  audioCache[url] = obj; return obj;
}
function mountPlayer(s){
  const url = s ? (s.audioUrl || AUDIO[s.audio]) : null;
  if(!s || !url){ playerEl.hidden = true; playerEl.dataset.story = ""; document.body.classList.remove("hasplayer"); playerEl.querySelector(".in").innerHTML=""; return; }
  document.body.classList.add("hasplayer"); playerEl.hidden = false;
  if(playerEl.dataset.story === s.id) return; // same story: keep playing
  playerEl.dataset.story = s.id;
  const box = playerEl.querySelector(".in");
  box.innerHTML = playerHTML(s, `<span class="none">Loading audio…</span>`);
  const myId = s.id;
  loadAudio(url).then(obj=>{
    if(playerEl.dataset.story !== myId) return;
    box.innerHTML = playerHTML(s, `<button class="pbig" data-pp aria-label="Play">▶</button><audio controls preload="auto" src="${obj}"></audio>`);
    if(wantPlay===myId){ wantPlay=null; const a=box.querySelector("audio"); const pr=a.play(); if(pr) pr.catch(()=>{}); }
    syncListen();
  }).catch(err=>{
    console.warn("audio load failed", err);
    if(playerEl.dataset.story !== myId) return;
    box.innerHTML = playerHTML(s, `<button class="pbig" data-pp aria-label="Play">▶</button><audio controls preload="none" src="${esc(url)}"></audio><button class="retry" data-retry="${esc(myId)}">Retry</button>`);
    if(wantPlay===myId){ wantPlay=null; const a=box.querySelector("audio"); const pr=a.play(); if(pr) pr.catch(()=>{}); }
    syncListen();
  });
}
/* Big Listen / Pause / Stop buttons (on the story page and in the bar). They drive the one audio player at the top. */
var wantPlay = null;   // var: render() may run before this line
const theAudio = () => playerEl.querySelector("audio");
function syncListen(){
  const a = theAudio(), playing = !!(a && !a.paused && !a.ended), started = !!(a && a.currentTime > 0.2);
  document.querySelectorAll("[data-pp]").forEach(b=>{
    const big = b.classList.contains("lb");
    b.classList.toggle("on", playing);
    b.setAttribute("aria-label", playing ? "Pause the reading" : "Play the reading");
    b.textContent = big ? (playing ? "⏸ Pause" : (a ? (started ? "▶ Carry on" : "▶ Listen") : (wantPlay ? "⏳ Loading…" : "▶ Listen"))) : (playing ? "⏸" : "▶");
  });
  document.querySelectorAll("[data-stop]").forEach(b=>{ b.disabled = !(playing || started); });
}
document.addEventListener("click", e=>{
  const pp = e.target.closest("[data-pp]"), st = e.target.closest("[data-stop]");
  if(!pp && !st) return;
  const a = theAudio();
  if(st){ if(a){ a.pause(); try{ a.currentTime = 0; }catch(_){} } wantPlay = null; syncListen(); return; }
  if(!a){ wantPlay = playerEl.dataset.story || null; syncListen(); return; }   // still downloading: start as soon as it is ready
  if(a.paused || a.ended){ const pr = a.play(); if(pr) pr.catch(()=>syncListen()); } else a.pause();
  syncListen();
});
["play","pause","ended","timeupdate","emptied"].forEach(ev=>document.addEventListener(ev, e=>{ if(e.target===theAudio()) syncListen(); }, true));
document.addEventListener("click", e=>{ const r=e.target.closest("[data-retry]"); if(r){ playerEl.dataset.story=""; mountPlayer(storyById(r.dataset.retry)); } });

/* ===================== DICTIONARY ===================== */
// WordNet 3.0 (Princeton University) – a compact offline copy published next to this page as dict.json
let DICT = null, dictLoading = null;
function loadDict(){
  if(DICT) return Promise.resolve(DICT);
  if(!dictLoading) dictLoading = fetch("dict.json").then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }).then(d=>(DICT=d)).catch(e=>{ dictLoading=null; throw e; });
  return dictLoading;
}
function wordCount(r){ const st=storyById(r.storyId); if(!st) return 99; const t=(st.paras[r.p]||"").slice(r.s,r.e).trim(); return t ? t.split(/\s+/).length : 99; }
function normWord(t){ return t.toLowerCase().replace(/[’‘]/g,"'").replace(/[“”"—–]/g," ").replace(/^[^a-z]+|[^a-z]+$/g,"").replace(/'s$/,"").replace(/\s+/g," ").trim(); }
function dictKey(w){ return w.replace(/'/g,"").replace(/[-\s]+/g,"_"); }
function dictPairs(w){
  if(!DICT || !w) return [];
  const f = DICT.f[w] || DICT.f[w.replace(/'/g,"")];
  if(f) return f;
  const k = dictKey(w);
  if(DICT.e[k]) return [[k,null]];
  if(DICT.f[k]) return DICT.f[k];
  // words the dictionary has no form for yet (e.g. from stories added later): strip common endings
  const tries = [];
  const m1 = k.match(/^(.+?)(ies|ied)$/); if(m1) tries.push(m1[1]+"y");
  const m2 = k.match(/^(.+?)(ing|ed|es|s|er|est|ly)$/);
  if(m2){ const b=m2[1]; tries.push(b, b+"e"); if(/(.)\1$/.test(b)) tries.push(b.slice(0,-1)); }
  for(const t of tries){ if(DICT.e[t]) return [[t, /ly$/.test(k)?null:(/(ing|ed)$/.test(k) && DICT.e[t].verb ? "verb" : null)]]; }
  return [];
}
function storyMeaning(st, w){
  // the meaning from this story's own word list, when the selected word is part of it
  if(!st || !st.vocab) return null;
  const n = w.toLowerCase();
  let hit = st.vocab.find(v=>normWord(v.w)===n);
  if(!hit) hit = st.vocab.find(v=>{ const vw=normWord(v.w); return vw.split(" ").includes(n) || (n.length>=5 && vw.startsWith(n.slice(0,n.length-2))) || (vw.length>=5 && n.startsWith(vw.slice(0,vw.length-2))); });
  return hit || null;
}
function sentenceAround(text, s, e){
  const parts = text.match(/[^.!?]+[.!?]+[”"’]?\s*|[^.!?]+$/g) || [text];
  let pos = 0;
  for(const pt of parts){ const a=pos, b=pos+pt.length; pos=b; if(s>=a && s<b){ const rs=s-a, re=Math.min(e,b)-a; return {before:pt.slice(0,rs).trimStart(), hit:pt.slice(rs,re), after:pt.slice(re).trimEnd()}; } }
  return {before:"", hit:text.slice(s,e), after:""};
}
const dictcard = document.getElementById("dictcard");
let dictCurrent = null;
function placeCard(){
  const top = document.querySelector(".top"); const y = top ? top.getBoundingClientRect().bottom : 0;
  dictcard.style.top = (Math.max(8, y) + 8) + "px";
}
function speak(w){
  try{
    const u = new SpeechSynthesisUtterance(w); u.rate = .85;
    const v = speechSynthesis.getVoices().find(v=>/en[-_](GB|SG)/i.test(v.lang)) || speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));
    if(v) u.voice = v; u.lang = v ? v.lang : "en-GB";
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(err){ toast("Sorry, this device can’t read words aloud."); }
}
function renderDict(){
  if(!dictCurrent){ dictcard.hidden = true; return; }
  const {raw, w, st, ctx, loading, failed} = dictCurrent;
  const fam = st ? FAMILIES[st.family] : null;
  dictcard.style.setProperty("--c", fam ? fam.color : "var(--gold)"); dictcard.style.setProperty("--soft", fam ? fam.soft : "var(--bg2)");
  const vm = storyMeaning(st, w);
  const pairs = dictPairs(w);
  let body = "";
  if(vm) body += `<div class="dc-story"><div class="dc-label">In this story</div><b>${esc(vm.w)}</b> – ${esc(vm.d)}</div>`;
  if(loading) body += `<div class="dc-none">Opening the dictionary…</div>`;
  else if(failed) body += `<div class="dc-none">The dictionary didn’t load. Check the internet connection and tap 📖 again.</div>`;
  else if(pairs.length){
    const seen = new Set();
    for(const [h,pos] of pairs.slice(0,3)){
      const e = DICT.e[h]; if(!e) continue;
      const poses = pos ? [pos] : Object.keys(e).slice(0,3);
      for(const ps of poses){
        const key=h+"|"+ps; if(seen.has(key) || !e[ps]) continue; seen.add(key);
        body += `<div class="dc-sec"><div class="dc-hw">${esc(h.replace(/_/g," "))}<i>${esc(ps)}</i></div><ol>${e[ps].map(x=>`<li>${esc(x[0])}${x[1]?`<em>“${esc(x[1])}”</em>`:""}</li>`).join("")}</ol></div>`;
      }
    }
  } else if(!vm){
    body += `<div class="dc-none">“${esc(raw.trim())}” isn’t in the built-in dictionary. It may be a name, a short joining word, or a phrase – try the online dictionary below.</div>`;
  }
  if(ctx) body += `<div class="dc-ctx"><div class="dc-label">In the sentence</div>${esc(ctx.before)}<mark>${esc(ctx.hit)}</mark>${esc(ctx.after)}</div>`;
  const saved = state.words.some(x=>x.w.toLowerCase()===w && x.story===(st&&st.id));
  const q = encodeURIComponent(w || raw.trim());
  body += `<div class="dc-actions">
    <button class="btn primary" data-dsave ${saved?"disabled":""}>${saved?"⭐ In My Word Book":"⭐ Save to My Word Book"}</button>
    <a class="btn" href="https://dictionary.cambridge.org/search/english/direct/?q=${q}" target="_blank" rel="noopener">Cambridge Dictionary ↗</a>
    <span class="src">Dictionary: WordNet, Princeton University</span></div>`;
  dictcard.innerHTML = `<div class="dc-head"><span class="dc-word">${esc(raw.trim())}</span><button class="dc-btn" data-dspeak title="Say it" aria-label="Say it">🔊</button><button class="dc-btn dc-close" data-dclose aria-label="Close">✕</button></div>${body}`;
  dictcard.hidden = false; placeCard();
}
function openDict(raw, st, p, s, e){
  const w = normWord(raw);
  const ctx = (st && p!=null) ? sentenceAround(st.paras[p]||"", s, e) : null;
  dictCurrent = {raw, w, st, p, ctx, loading: !DICT, failed:false};
  renderDict();
  if(!DICT) loadDict().then(()=>{ if(dictCurrent){ dictCurrent.loading=false; renderDict(); } }).catch(()=>{ if(dictCurrent){ dictCurrent.loading=false; dictCurrent.failed=true; renderDict(); } });
}
function closeDict(){ dictCurrent = null; dictcard.hidden = true; }
dictcard.addEventListener("click", e=>{
  if(e.target.closest("[data-dclose]")) return closeDict();
  if(e.target.closest("[data-dspeak]")) return speak(dictCurrent ? dictCurrent.raw.trim() : "");
  if(e.target.closest("[data-dsave]") && dictCurrent){
    const {raw, w, st, ctx} = dictCurrent; const vm = storyMeaning(st, w);
    let d = vm ? vm.d : "";
    if(!d && DICT){ const pr = dictPairs(w)[0]; if(pr){ const en = DICT.e[pr[0]]; const ps = pr[1] || Object.keys(en)[0]; d = (en[ps]&&en[ps][0]) ? en[ps][0][0] : ""; } }
    addWord({w: raw.trim().replace(/^[^A-Za-z]+|[^A-Za-z]+$/g,"") || raw.trim(), d, story: st ? st.id : "", sent: ctx ? (ctx.before+ctx.hit+ctx.after).trim() : "", t: Date.now()});
    toast("Saved to My Word Book ⭐"); renderDict();
  }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && dictCurrent) closeDict(); });
window.addEventListener("hashchange", closeDict);

/* ===================== MY WORD BOOK ===================== */
function saveWords(){
  LS.set("garden-words", state.words);
  if(!dbRef) return;
  const items = state.words.slice();
  saveChain = saveChain.then(()=>dbRef.doc("wordbook/main").set({items, updated:new Date().toISOString()})).catch(e=>{ console.warn("words save failed", e); toast("Couldn’t save the word to the cloud – kept on this device."); });
}
function addWord(item){
  if(state.words.some(x=>x.w.toLowerCase()===item.w.toLowerCase() && x.story===item.story)) return;
  state.words.unshift(item); logEv("word",{x:item.w}); saveWords(); render();
}
function removeWord(i){ state.words.splice(i,1); saveWords(); render(); }
document.addEventListener("click", e=>{
  const rmw = e.target.closest("[data-wrm]"); if(rmw){ removeWord(+rmw.dataset.wrm); toast("Word removed"); return; }
  const spw = e.target.closest("[data-wsay]"); if(spw){ speak(spw.dataset.wsay); return; }
});

/* ===================== HIGHLIGHTER ===================== */
const hlbar = document.getElementById("hlbar");
let hlPending = null, hlTimer = null;
function hideBar(){ hlbar.hidden = true; hlPending = null; }
function showBar(rect, mode, words){
  hlbar.querySelector(".rm").hidden = mode!=="edit";
  hlbar.querySelector(".dict").hidden = !(mode==="edit" || (words && words<=5));
  hlbar.hidden = false;
  const w = hlbar.offsetWidth, h = hlbar.offsetHeight;
  let left = rect.left + rect.width/2 - w/2; left = Math.max(8, Math.min(window.innerWidth - w - 8, left));
  // on touch screens the system's own copy/look-up menu sits above the selection, so go below it
  const touch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  let top = touch ? rect.bottom + 14 : rect.top - h - 10;
  if(!touch && top < 8) top = rect.bottom + 10;
  if(touch && top + h > window.innerHeight - 8) top = rect.top - h - 14;
  top = Math.max(8, Math.min(window.innerHeight - h - 8, top));
  hlbar.style.left = left+"px"; hlbar.style.top = top+"px";
}
function readSelection(){
  const sel = window.getSelection(); if(!sel || sel.rangeCount===0 || sel.isCollapsed) return null;
  const range = sel.getRangeAt(0);
  const p = (range.commonAncestorContainer.nodeType===1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentElement)?.closest("p[data-p]");
  if(!p || !p.closest(".reader-body")) return null;
  if(!p.contains(range.startContainer) || !p.contains(range.endContainer)) return null;
  const pre = document.createRange(); pre.selectNodeContents(p); pre.setEnd(range.startContainer, range.startOffset);
  let s = pre.toString().length; const raw = range.toString(); let e = s + raw.length;
  const lead = raw.length - raw.trimStart().length, trail = raw.length - raw.trimEnd().length; s += lead; e -= trail;
  if(e - s < 1) return null;
  return { storyId: p.closest(".reader-body").dataset.story, p: +p.dataset.p, s, e, rect: range.getBoundingClientRect() };
}
function onSelectionMaybe(){
  clearTimeout(hlTimer);
  hlTimer = setTimeout(()=>{
    const r = readSelection();
    if(r){ hlPending = Object.assign({mode:"new"}, r); showBar(r.rect, "new", wordCount(r)); }
    else if(hlPending && hlPending.mode==="new") hideBar();
  }, 180);
}
document.addEventListener("selectionchange", onSelectionMaybe);
document.addEventListener("mouseup", onSelectionMaybe);
document.addEventListener("touchend", onSelectionMaybe);
hlbar.addEventListener("mousedown", e=>e.preventDefault()); // keep the selection alive
hlbar.addEventListener("click", e=>{
  const dot = e.target.closest("[data-color]"); const rm = e.target.closest(".rm"); const x = e.target.closest(".x"); const dk = e.target.closest(".dict");
  if(!hlPending) return;
  if(dk){ const st=storyById(hlPending.storyId); if(st && hlPending.p!=null){ const text=(st.paras[hlPending.p]||"").slice(hlPending.s,hlPending.e); logEv("dict",{x:text.slice(0,60)}); openDict(text, st, hlPending.p, hlPending.s, hlPending.e); } window.getSelection()?.removeAllRanges(); hideBar(); return; }
  if(dot){
    if(hlPending.mode==="new"){ addHl(hlPending.storyId, hlPending.p, hlPending.s, hlPending.e, dot.dataset.color); toast("Highlighted 🖍️"); }
    else { const list=state.hl[hlPending.storyId]; if(list && list[hlPending.idx]){ list[hlPending.idx]={...list[hlPending.idx], c:dot.dataset.color}; saveHl(hlPending.storyId); render(); } }
    window.getSelection()?.removeAllRanges(); hideBar();
  } else if(rm){ removeHl(hlPending.storyId, hlPending.idx); toast("Highlight removed"); hideBar(); }
  else if(x){ window.getSelection()?.removeAllRanges(); hideBar(); }
});

document.addEventListener("click", e=>{
  const mk = e.target.closest("mark.hl[data-hl]");
  if(mk && !readSelection()){ const body=mk.closest(".reader-body"); if(body){ const it=(state.hl[body.dataset.story]||[])[+mk.dataset.hl]; hlPending=Object.assign({mode:"edit", storyId:body.dataset.story, idx:+mk.dataset.hl}, it?{p:it.p,s:it.s,e:it.e}:{}); showBar(mk.getBoundingClientRect(), "edit"); return; } }
  if(!e.target.closest("#hlbar") && hlPending && hlPending.mode==="edit") hideBar();
  const lvb = e.target.closest("[data-level]"); if(lvb){ setLevel(lvb.dataset.level); if(lvb.tagName!=="A") return; }
  const pick = e.target.closest("[data-pick]"); if(pick){ e.preventDefault(); togglePick(pick.dataset.pick); return; }
  const z = e.target.closest("[data-stage]"); if(z){ const r=route(); if(r.v==="story"){ state.stage[r.id]=z.dataset.stage; render(); const card=document.getElementById("stagecard"); if(z.classList.contains("zone") && card) card.scrollIntoView({behavior:"smooth",block:"nearest"}); } return; }
  const j = e.target.closest("[data-jump]"); if(j){ const el=document.getElementById("part-"+j.dataset.jump); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(e.target.id==="vocabtog"){ document.body.classList.toggle("novocab"); LS.set("garden-novocab", document.body.classList.contains("novocab")); render(); return; }
  const v = e.target.closest(".v"); document.querySelectorAll(".v.open").forEach(x=>x!==v&&x.classList.remove("open")); if(v){ v.classList.toggle("open"); }
});
document.addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.classList.contains("zone")){ e.preventDefault(); e.target.click(); } });
document.addEventListener("input", e=>{ if(e.target.id==="nameinput"){ clearTimeout(setName.t); const v=e.target.value; setName.t=setTimeout(()=>{ setName(v); }, 600); } });
document.addEventListener("change", e=>{ if(e.target.id==="nameinput"){ setName(e.target.value); render(); } });
window.addEventListener("hashchange", ()=>{ const r=route(); if(r.v==="story"){ const st=storyById(r.id); if(st && lvOf(st)!==state.level){ state.level=lvOf(st); LS.set("garden-level", state.level); } } hideBar(); render(); window.scrollTo(0,0); });
if(LS.get("garden-novocab")) document.body.classList.add("novocab");
{ const l=LS.get("garden-level"); if(l && LEVELS.some(x=>x.key===l)) state.level=l; }
render();
initStore();
