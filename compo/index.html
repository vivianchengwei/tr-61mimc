Oompa Loompas swarmed towards us. One by one, they calmed down as the cure took effect and soon, they returned to their daily tasks.", "Willy heaved a sigh of relief. “Thanks to your brilliant thinking, the Oompa Loompas are back to normal. I wouldn’t have known what to do without you!” I smiled, feeling glad that I could help. “This is for you,” he offered, handing me a shiny golden ticket. “Any time you’d like another trip to my factory, just wave this and call my name!” Grateful for the precious gift, I tucked it safely into my pocket.", "Soon, it was time for me to go home. I thanked Willy for the wonderful adventure. He took my paperback from his coat pocket and flipped it open to the page I had left off. With a wave of his golden cane, a portal appeared on the page.", "I jumped through it and landed right back on my sofa, exactly where I had been before. It felt as though I had just woken from a dream. Did Willy Wonka really speak to me? Did I really visit his factory? Was it all in my imagination?", "Just then, I felt something thin and smooth in my pocket. Pulling it out, I gasped when I saw the golden ticket that Willy had given me. It was not a dream after all, I thought, smiling to myself. With this ticket, I can return for another adventure any time I wish. Who knows what I will experience next?"], "level": "p5", "fromTLL": true}, {"id": "p5-literary-kind-myesha", "num": 5, "title": "An Encounter with the Literary Kind · Myesha", "family": "bonds", "path": "Invisible Hero", "source": "TLL 2026 · P5 exemplar · by Myesha Nadia Binte Asri Budiman", "topic": "Write a creative story titled ‘An Encounter with the Literary Kind’.", "theme": "Small kindnesses, like warmth and food for a stranger, can be the happy ending someone needs.", "audio": "p5-literary-kind-myesha", "pov": "first", "words": 697, "stages": [{"key": "setting", "paras": [0, 1, 2, 3], "pic": "🏔️🛋️📕", "hook": "A snowy chalet and my favourite book, The Giver.", "summary": "On a winter holiday in Zermatt in the Swiss Alps, Myesha stays in the chalet, feeling unwell, to reread The Giver. She explains the book and its puzzling ending, where Jonas escapes with baby Gabriel.", "trick": "Ideas + Structure: real-life details (Zermatt, the Alps) are mixed with just enough background on The Giver for the reader to connect the two."}, {"key": "rising", "paras": [4, 5, 6, 7, 8, 9], "pic": "🚪👦👶", "hook": "Jonas and Gabriel at my door!", "summary": "A knock: Jonas stands outside with baby Gabriel wrapped in a blanket and asks if this is Elsewhere. She invites him in, and he gazes at the snowy mountains, saying it is more beautiful than his Community.", "trick": "Five senses and contrast: the cold, snowy world outside and the warm, cosy chalet mirror the cold Community and the warmth Jonas finds."}, {"key": "climax", "paras": [10, 11, 12], "pic": "🔥🥐☕", "hook": "Warmth, a croissant, hot chocolate.", "summary": "Seeing Jonas shiver, she turns up the heating and brings him a croissant and hot chocolate. He eats slowly, savouring every bite, while she sits quietly so the baby can sleep.", "trick": "A quiet peak: the kindness itself is the big moment. Small actions (raising the thermostat, sitting in silence) show care without saying it."}, {"key": "falling", "paras": [13, 14, 15, 16], "pic": "🧣👋❄️", "hook": "A woollen scarf and a goodbye in the snow.", "summary": "Jonas says they must leave before they are caught. She wraps her woollen scarf around his neck. He thanks her and disappears into the swirling snow.", "trick": "The scarf is a gift of warmth for a boy from a world without feelings. It shows her kindness without explaining it."}, {"key": "ending", "paras": [17], "pic": "🍽️☕💭", "hook": "The empty plate. Now I know how it ends.", "summary": "Back inside, she wonders if it was a dream, until she sees the empty plate and cup. At last she feels she knows how Jonas and Gabriel’s story truly ends.", "trick": "Real objects prove the visit happened, and the last line answers the question about the book’s ending from the introduction."}], "vocab": [{"w": "plush", "d": "soft and thick"}, {"w": "chalet", "d": "a wooden holiday house in the mountains"}, {"w": "backdrop", "d": "the scenery behind"}, {"w": "eliminated", "d": "got rid of completely"}, {"w": "ambiguous", "d": "unclear; it could mean more than one thing"}, {"w": "intrigued", "d": "very curious"}, {"w": "swaddled", "d": "wrapped up snugly"}, {"w": "gawked", "d": "stared in amazement"}, {"w": "enquired", "d": "asked"}, {"w": "ushering", "d": "showing someone the way in"}, {"w": "towered", "d": "rose very high"}, {"w": "thermostat", "d": "the dial that controls the heating"}, {"w": "kitchenette", "d": "a small kitchen"}, {"w": "savouring", "d": "enjoying slowly"}, {"w": "lingered", "d": "stayed on"}, {"w": "eternity", "d": "a very, very long time"}, {"w": "viciously", "d": "fiercely"}, {"w": "compelled", "d": "forced"}, {"w": "motionless", "d": "not moving at all"}], "paras": ["I snuggled into the plush pillows on the comfortable sofa, clutching my copy of The Giver. It was my favourite book and I was about to reread it.", "My family and I were in Zermatt, a resort town in the Swiss Alps, for a winter holiday. This beautiful holiday was my reward for acing my end-of-year examinations. Feeling slightly unwell that day, I had stayed behind in the chalet while my parents went skiing. To me, there was no better way to spend a quiet afternoon than reading against the breathtaking backdrop of the Alps, with Christmas music playing softly in the background.", "The Giver is about an 11-year-old boy named Jonas, who lives in a seemingly peaceful community that has eliminated pain, fear, joy and other emotions. Chosen to be the new Receiver of Memory, Jonas learns about the true history of the world, including all emotions, from the current Receiver, an old man known as the Giver.", "Despite having read the book countless times, its ambiguous ending has always left me intrigued. I often wonder what happens to Jonas after he discovers the true nature of his community and flees with a baby named Gabriel. The story ends with Jonas atop a snowy hill, where he finds a sled and rides towards coloured lights and music.", "Hardly had I flipped open my book when there was a knock on the front door. Who could it be? I wondered as I stood up. When I opened the door, I gasped in shock at the familiar faces before me. A boy with pale, light eyes stood at the door, his arms cradling a baby swaddled in a thick blanket. They were Jonas and Gabriel from The Giver!", "“Jo . . . Jonas?” I gawked at the boy. He nodded hesitantly.", "“Is this . . . Elsewhere?” Jonas enquired, scanning the surroundings of my warm chalet with a mix of wonder and longing.", "“Come on in. We’re in Zermatt, a town in Switzerland,” I explained, ushering him in and shutting the door behind us.", "Upon entering my chalet, Jonas’s eyes widened. He stared at the snow-capped mountains that towered mightily above us through the floor-to-ceiling windows.", "“It’s . . . It’s so much more beautiful than the Community,” he gasped.", "Guiding him towards the sofa, I invited Jonas to sit. He carefully placed sleeping Gabriel beside him before settling down himself.", "Seeing that Jonas was shivering slightly, I hurried to raise the thermostat. Then, I headed to the small kitchenette. He must be starving, I thought, as I quickly prepared a croissant and a cup of hot chocolate for him.", "Beaming at me, Jonas politely accepted the warm croissant and hot chocolate. He ate slowly, savouring every bite. Unwilling to risk waking the baby with conversation, I sat quietly next to Jonas, watching him in awe as he looked around curiously. Finally, he set the empty plate down on the table. All was quiet except for Christmas music playing in the background.", "Jonas eventually broke the silence. “You have been very kind, but Gabe and I must leave. We cannot stay for long as we risk getting caught.” He rose to his feet and picked up Gabriel.", "“Please, take this at least,” I said, hurrying to fetch a thick woollen scarf from the coat rack and wrapping it around Jonas’s neck.", "Jonas offered a small smile and whispered, “Thank you. I will never forget your help.”", "I walked Jonas and Gabriel to the door. Giving me a final smile, Jonas turned and stepped out into the swirling snow. Standing at the doorway, I watched as his figure grew fainter and fainter, until he had disappeared into the distance.", "I lingered there for what seemed like an eternity as the cold wind bit viciously at my cheeks. When the chill finally compelled me to close the door, I did so gently. Returning to the warmth of the chalet, I stood motionless, wondering if it had all been a dream. It was not long before I noticed the empty plate and cup still resting on the table. Perhaps, at last, I finally knew how Jonas’s and Gabriel’s story truly ended."], "level": "p5", "fromTLL": true}, {"id": "p5-opportunity-flavia", "num": 6, "title": "An Opportunity · Flavia", "family": "guts", "path": "Leap of Faith", "source": "TLL 2026 · P5 exemplar · by Flavia Koh", "topic": "Write a composition about an opportunity.", "theme": "Opportunities do not come every day. Grab them with both hands, even when you are afraid.", "audio": "p5-opportunity-flavia", "pov": "first", "words": 821, "stages": [{"key": "setting", "paras": [0, 1], "pic": "🎹🎭😬", "hook": "Backstage. ‘Prove them wrong.’", "summary": "Alice Lee waits backstage at a nationwide music competition. Her parents treat the piano as just a hobby and praise her brother’s grades, and her classmates tease her for being quiet. This is her chance to show what she can do.", "trick": "Structure + Expression: the introduction starts with dialogue and uses the 5Ws and 1H to set the scene clearly."}, {"key": "rising", "paras": [2, 3, 4, 5], "pic": "🤔🎶😰", "hook": "Am I really good enough?", "summary": "Doubts creep in. The other competitors play beautifully and she feels she can never measure up. She reminds herself why she signed up and tries to calm down, but the butterflies stay. Then her name is called earlier than she expected.", "trick": "Questions in her head (‘Am I really good enough to stand on stage?’) let the reader hear her doubts growing louder."}, {"key": "climax", "paras": [6, 7], "pic": "💡🎹👏", "hook": "Spotlight. Every seat filled. She plays.", "summary": "Under the merciless spotlight she breaks out in a cold sweat, but she summons her courage and plays. Soon she is lost in the music. The audience erupts into applause, and she knows she has done her best.", "trick": "Show-not-tell traces her feelings from anxiety (cold sweat, quailed) to ease (lost in the song). The ‘familiar’ keys show she is well-practised."}, {"key": "falling", "paras": [8, 9, 10], "pic": "🥉😭🤗", "hook": "Third place! Even my brother nods.", "summary": "She wins third place and walks onstage feeling as if she is on clouds. Her parents hug her and her brother nods his approval. At school, classmates who once looked down on her congratulate her.", "trick": "Everyone who doubted her (family, classmates) now reacts differently, which shows how much she has changed things."}, {"key": "ending", "paras": [11], "pic": "🚪✋🌟", "hook": "I won the moment I stepped on stage.", "summary": "She realises she had already won by daring to seize the opportunity, and vows never to let doubt hold her back again.", "trick": "The conclusion repeats the topic word ‘opportunity’ and turns it into a life lesson and a promise."}], "vocab": [{"w": "muttered", "d": "said quietly, almost to herself"}, {"w": "musty", "d": "smelling old and damp"}, {"w": "nationwide", "d": "across the whole country"}, {"w": "second thoughts", "d": "doubts about a decision"}, {"w": "emcee", "d": "the host who announces each act"}, {"w": "hush", "d": "a sudden silence"}, {"w": "measure up", "d": "be as good as"}, {"w": "soothe", "d": "calm"}, {"w": "butterflies in my stomach", "d": "a fluttery, nervous feeling"}, {"w": "jolted", "d": "jumped with a sudden shock"}, {"w": "Steeling myself", "d": "making myself brave"}, {"w": "mercilessly", "d": "without any mercy"}, {"w": "quailed", "d": "shrank back in fear"}, {"w": "summoned", "d": "gathered up"}, {"w": "ivory and ebony", "d": "the white and black piano keys"}, {"w": "thunderous", "d": "very loud, like thunder"}, {"w": "eons", "d": "ages; a very long time"}, {"w": "deliberating", "d": "thinking carefully before deciding"}, {"w": "brimmed", "d": "filled to the edge"}], "paras": ["“It’s okay. You can do it. Prove them wrong,” I muttered, balling my hands into fists. Taking a deep breath, I glanced around me. I was backstage with numerous other competitors, some of them familiar faces from school. Long curtains hid us from the audience and a musty smell filled my nose. Some of my competitors clutched a musical instrument while others stared at a sheet of paper.", "A few weeks ago, I had spotted a poster at my music school announcing a nationwide competition for recognising young musical talent and begged my parents to sign me up. Here I was. However, at home, my parents saw the piano as nothing more than a hobby, never once asking to hear me play, while they praised my brother for his grades. At school, my classmates teased me for being the quiet girl who preferred practising scales to hanging out with them. This competition was my chance to step onto a real stage and finally show everyone, and perhaps even myself, what I was capable of.", "Despite knowing that this competition was the chance to prove myself, the words of my parents and classmates still got to me. I could not help but have second thoughts. Am I really good enough to stand on stage? Will I just end up embarrassing myself? I mentally reviewed the notes to my piano piece, trying to calm myself. Before long, the emcee walked onstage and announced the start of the competition. As the first competitor stepped on stage, the crowd cheered enthusiastically before a hush settled over the audience.", "As the competition went on, the heavenly music of other competitors filled my ears while I waited backstage. What was I thinking? I could never measure up to them. As my turn drew closer, the doubts in my head grew louder, and I seemed to forget all the practice I had done over the past few weeks.", "Wiping my sweaty palms in my skirt, I reminded myself why I had signed up in the first place. This is my opportunity, do not waste it, I told myself, taking deep breaths to soothe my nerves. Once I calmed down slightly, I tried to visualise the notes to my piano piece again. Still, the butterflies in my stomach remained.", "“Next up is . . . Alice Lee, who will be playing the piano!” the emcee announced. Hearing my name, I jolted in shock. I was supposed to be the last performer. Had all the other competitors performed already?", "Steeling myself, I stepped onstage. Anxiety flooded me. The spotlight shone down mercilessly, making me break out in cold sweat. Taking my place at the piano, I risked a glance at the crowd. Every seat was filled and I quailed under the weight of so many eyes. However, I summoned every ounce of courage I had and placed my fingers on the keyboard. Once the audience fell silent, I began playing my piano piece. My fingers ran along the familiar ivory and ebony keys and soon, I was lost in the song, forgetting that anyone was watching at all.", "Once I had finished, the audience erupted into thunderous applause. Bowing, I scurried backstage, beaming with pride. Even if I did not win a prize, I knew I had done my best with this opportunity on stage. After what felt like eons, the emcee announced that the judges had finished deliberating and the results were in.", "“In third place, we have . . . Alice Lee! Please come onstage.” I was startled. Out of all the great performances, I managed to achieve third place? All other sounds seemed to grow muffled as though I was underwater. As I walked back onstage to receive my medal, I felt like I was walking on clouds. My eyes brimmed with tears of joy. Standing there, on the very stage that had once seemed so terrifying, I had finally proven myself.", "When I got off the stage, my parents were waiting to congratulate me. “You did so well!” they both exclaimed, pulling me into a hug. Even my brother, whom they had brought along, gave me a small nod of approval. For once, I felt like my family was truly proud of me.", "The next day at school, there was a noticeable change. News of the results of the competition had spread. Several classmates who had once looked down on me were now congratulating me. A few of them even seemed eager to talk to me!", "Looking back, I realised that the moment I had stepped onto that stage, I had already won. It was all because I had dared to seize the opportunity when it mattered most. I vowed from then on that I would never again let doubt hold me back. Opportunities do not come knocking every day and it is up to me to grab them with both hands and do my best."], "level": "p5", "fromTLL": true}, {"id": "p5-opportunity-yutong", "num": 7, "title": "An Opportunity · Yutong", "family": "bonds", "path": "Crack & Repair", "source": "TLL 2026 · P5 exemplar · by Guo Yutong", "topic": "Write a composition about an opportunity.", "theme": "Look past first impressions. The person you least want to be with may become a friend.", "audio": "p5-opportunity-yutong", "pov": "first", "words": 828, "stages": [{"key": "setting", "paras": [0, 1, 2], "pic": "🚌🏖️🎮", "hook": "Camp! And Ben is boasting again.", "summary": "On the bus to a three-day P5 camp at Sembawang beach, new classmate Ben boasts about playing his PlayStation 5 all night. Ace, the narrator, rolls his eyes: Ben has bragged about his wealth all year.", "trick": "Structure: each speaker’s words get their own paragraph, so the reader always knows who is talking."}, {"key": "rising", "paras": [3, 4, 5, 6, 7, 8], "pic": "⛺😩📱", "hook": "Tent 16: Ace and Ben. Argh!", "summary": "Ace is paired with Ben for two nights and his heart sinks. At the beach, Ben finds a horseshoe crab and pulls out his latest iPhone, just another chance to show off.", "trick": "Inner voice: Ace’s thoughts (‘Argh! Out of all my classmates, why him?’) show his feelings honestly."}, {"key": "climax", "paras": [9, 10, 11, 12], "pic": "🌊📱🆘", "hook": "A wave takes the phone. Ben can’t swim!", "summary": "Ben drops his phone and a big wave sweeps it out to sea. Ben chases it until he is out of his depth and starts flailing. No teacher has seen him, so Ace races to Mrs Tan, screaming for help.", "trick": "Short, quick sentences (‘Everything happened so fast after that.’) speed up the danger."}, {"key": "falling", "paras": [13, 14, 15, 16, 17, 18, 19, 20, 21], "pic": "🧑‍🏫🤝🔦", "hook": "Mrs Tan saves Ben. A talk in the tent.", "summary": "Mrs Tan hauls Ben out. Everyone calls Ace a hero, but he dreads the night. In the tent, Ben thanks him, apologises for boasting and admits he found it hard to make friends. Ace tells him to just be himself, and they shake hands as friends.", "trick": "Person of authority: the problem is too serious for children, so an adult, Mrs Tan, solves it. This makes the story realistic."}, {"key": "ending", "paras": [22], "pic": "😴⛺🙂", "hook": "A blessing in disguise.", "summary": "Snug in the tent he once dreaded, Ace realises the pairing was a blessing in disguise. What seems unlucky can turn out to be the opportunity we need for a positive change.", "trick": "The last line explains how the story fits the topic: something that did not look like an opportunity turned out to be one."}], "vocab": [{"w": "inquisitively", "d": "in a curious, questioning way"}, {"w": "smirked", "d": "smiled in a smug, show-off way"}, {"w": "boasted", "d": "talked proudly to show off"}, {"w": "vicinity", "d": "the area nearby"}, {"w": "brag", "d": "show off"}, {"w": "pairings", "d": "who is put together with whom"}, {"w": "unbranded", "d": "without a famous brand name"}, {"w": "Tembusu", "d": "a tall tree common in Singapore"}, {"w": "shoreline", "d": "where the sea meets the land"}, {"w": "horseshoe crab", "d": "a sea creature with a hard, curved shell"}, {"w": "flailing", "d": "waving wildly"}, {"w": "oblivious", "d": "not noticing at all"}, {"w": "agonising", "d": "very painful to wait through"}, {"w": "haul", "d": "pull with great effort"}, {"w": "feeble", "d": "weak"}, {"w": "dreaded", "d": "was very afraid of"}, {"w": "confessed", "d": "admitted"}, {"w": "genuine", "d": "real and sincere"}, {"w": "blessing in disguise", "d": "something that seems bad but turns out good"}], "paras": ["Staring out the bus window, I tried to focus on the greenery as we approached Sembawang beach. My classmates and I were going for a three-day-two-night Primary Five camp and I was excited for the adventure ahead. Ben, my new classmate who was seated next to me, suddenly yawned loudly and rubbed his eyes.", "“Why are you so tired?” I asked inquisitively.", "Ben smirked. “Oh, I stayed up all night playing on my new PlayStation 5,” he boasted loudly. Immediately, the classmates in our vicinity burst into “Ooh”s and “Ah”s. I could not help but roll my eyes. Since the start of the school year when we became classmates, Ben had been using every opportunity to brag about his wealth.", "Mrs Tan, my form teacher, got everyone to quieten down before she announced our tent pairings.", "“In Tent 16, we have Ace and Ben,” she called out.", "My eyes widened in shock. Argh! Out of all my classmates, why him? I thought as my heart sank. He will probably find more opportunities to boast when he sees my low-quality sleeping bag and unbranded water bottle. I was all but looking forward to the camp now.", "Finally, we reached Sembawang beach, where the fresh sea breeze brushed our faces. Rows of tents stood lined up along the sand, each labelled with a number. I spotted Tent 16 near the end of the row and my heart sank further at the thought of the two nights I would have to spend inside it with Ben. Still, the towering Tembusu trees and the sparkling sea in the sunlight almost made up for it.", "As we approached the shoreline, Ben suddenly ran forwards and shouted, “Look, guys! It’s a horseshoe crab! Let me tell you more about it.”", "Several of my classmates crowded around him and the horseshoe crab as he pulled out the latest iPhone, tucked in a waterproof bag, from his pocket. He pretended to be searching for information on horseshoe crabs, but really, it was just another chance for him to show off what he had.", "Suddenly, Ben’s phone slipped out of his hand and fell onto the sand. Everything happened so fast after that. An unusually large wave crashed onto the shore and swept the phone, still in its waterproof bag, out into the sea.", "Ben stood frozen for a moment before dashing into the water after it. However, the waves were too strong, pushing the phone even further out to sea. As dangerous as it was, Ben ignored everyone’s shouts to stop and continued to give chase, until his feet could no longer reach the sea floor. Not knowing how to swim, he panicked and began flailing his arms helplessly.", "Heart thumping, I looked around desperately for help. No teacher had spotted Ben. Mrs Tan was some distance away, deep in discussion with another teacher and oblivious to Ben’s struggles.", "Running towards her, I screamed, “Ben needs help!”", "Finally, I caught her attention, and she saw what had happened to Ben. She rushed into the water immediately and after several agonising minutes, managed to haul him out with his precious iPhone clutched in his hand.", "Back on the shore, Ben’s face was as white as a sheet and his lips were trembling. Mrs Tan squatted beside him to check if he was alright and he gave a feeble nod.", "For the rest of the day, everyone regarded me as the hero who was key to Ben’s rescue by successfully getting Mrs Tan’s attention. Yet, I dreaded the night ahead, knowing that I still had to share Tent 16 with Ben.", "That night, the tent felt smaller than I had imagined, the two of us sitting inches apart on our sleeping bags with only a small torch between us. Ben suddenly mumbled, “Thank you. I know you don’t really like me, but I heard you were the one who got Mrs Tan’s help.”", "“It’s okay,” I comforted him.", "To my surprise, he confessed, “I’m sorry for being boastful. It has been difficult making friends here. In my previous school, everyone wanted to be friends with the student who had the latest gadgets.” He paused. “I guess that doesn’t work here.”", "My eyebrows shot up. I never expected Ben to open up to me. “Just be yourself and be genuine,” I said. “Friends will come naturally.”", "Ben gave a small smile. “Friends?” he asked, extending his hand to me.", "“Friends,” I said, smiling as I shook it.", "As I settled into my sleeping bag, tucked inside the very tent I had once dreaded entering, I realised that being paired with Ben had turned out to be a blessing in disguise. It had given me the chance to look past first impressions and get to know a classmate better. Sometimes, what seems unfortunate, like being placed in a tent with someone we would never have chosen, can turn out to be exactly the opportunity we need for a positive change."], "level": "p5", "fromTLL": true}, {"id": "p5-unforgettable-day", "num": 8, "title": "An Unforgettable Day", "family": "guts", "path": "Uphill Climb", "source": "TLL 2026 · P5 exemplar · by Kuah Yu Feng", "topic": "Write a composition about an unforgettable day.", "theme": "True victory is about the choices we make, not about crossing the line first.", "audio": "p5-unforgettable-day", "pov": "first", "words": 576, "stages": [{"key": "setting", "paras": [0, 1], "pic": "🏆☀️🏃", "hook": "The gleaming trophy. Today I will win it.", "summary": "Before the 400-metre race, the narrator stares at the first-place trophy and tells himself today is the day. His quiet classmate Jonathan has won it three years running.", "trick": "The trophy is described with light (‘gleaming’, ‘sheen’) so the reader feels how badly he wants it."}, {"key": "rising", "paras": [2], "pic": "🔫💨💓", "hook": "Bang! Closing in on Jonathan.", "summary": "The race starts. Jonathan pulls ahead, but the narrator pushes harder than ever and, for the first time, begins to close the gap.", "trick": "A simile (‘like a bullet in the air’) and his pounding heart build the tension."}, {"key": "climax", "paras": [3, 4, 5], "pic": "🤕🤔🔙", "hook": "Jonathan falls. Win, or go back?", "summary": "Jonathan trips and falls hard. The narrator speeds past, then glances back at Jonathan wincing in pain. A voice in his head asks what glory there is in winning this way. He turns around, helps Jonathan up, and they limp to the finish together, last, as the stadium cheers.", "trick": "When the protagonist is alone, character thoughts show what he is thinking, so his choice to turn back makes sense."}, {"key": "falling", "paras": [6], "pic": "🏅✨🙂", "hook": "A special trophy for sportsmanship.", "summary": "At the ceremony, the judges give him a special trophy for sportsmanship. It is smaller, but no less beautiful. Jonathan gives him a genuine smile.", "trick": "Personification: the trophy ‘winking back at me’ tells him he did the right thing."}, {"key": "ending", "paras": [7], "pic": "💭🏁❤️", "hook": "The most unforgettable day.", "summary": "He never won the race or held the trophy he wanted, yet it is the most unforgettable day of his life. True victory is about the choices we make.", "trick": "Structure: the conclusion mentions the topic (‘the most unforgettable day’) and adds a meaningful reflection."}], "vocab": [{"w": "pride of place", "d": "the most important, best position"}, {"w": "gleaming", "d": "shining brightly"}, {"w": "sheen", "d": "a soft shine"}, {"w": "psych myself up", "d": "get myself ready and confident"}, {"w": "unassuming", "d": "modest and quiet"}, {"w": "three years running", "d": "three years in a row"}, {"w": "true to form", "d": "as usual"}, {"w": "strides", "d": "long steps"}, {"w": "unhurried", "d": "calm, not rushed"}, {"w": "composed", "d": "calm and in control"}, {"w": "triumphantly", "d": "like a winner"}, {"w": "wincing", "d": "pulling a face in pain"}, {"w": "glory", "d": "honour and praise"}, {"w": "bewilderment", "d": "great confusion"}, {"w": "cacophony", "d": "a loud mix of noises"}, {"w": "yearned", "d": "wanted very much"}, {"w": "sportsmanship", "d": "fair and kind behaviour in sport"}, {"w": "nursing", "d": "taking care of an injury"}, {"w": "coveted", "d": "wanted very badly"}], "paras": ["The first-place trophy sat on the table next to my school track. Given pride of place, it was a gleaming symbol of victory and excellence. Every runner in my school dreamt of winning it. Rays of the morning sun reflected off it, giving the trophy a beautiful sheen. As I stretched beside the track, I found myself staring at it. This is going to be an unforgettable day because you are going to win that trophy, I told myself, trying to psych myself up.", "Jonathan, my quiet, unassuming classmate, was warming up too. He rarely spoke, but everyone knew his name, since he had won the 400-metre sprint three years running. I admired him, though a part of me also longed to finally beat him and win the first-place trophy. Glancing at the trophy one last time, I took my position on the track.", "Bang! The race had begun. I sped off like a bullet in the air. Yet, Jonathan, true to form, had already pulled ahead of me, his strides smooth and unhurried. My heart pounded violently against my ribcage. It felt like it was going to fly out of my chest at any second. Refusing to let the gap between Jonathan and me widen, I pushed myself harder than I ever had. For the first time, I felt myself closing in on him.", "Then, just as Jonathan approached the final stretch, he tripped over his own foot and lost his balance. Stumbling, he fell hard. Jonathan, normally so composed, was struggling to get back on his feet.", "This is my chance to win the gold trophy! I thought triumphantly. Speeding past Jonathan, I felt my heart leap. However, something made me glance back. Jonathan was wincing in pain. What’s the glory in winning this way? I heard a voice in my head. If Jonathan had not fallen, you would not have caught up with him. Do what is right! My legs slowed before my mind had even finished deciding. Turning around, I ran back towards Jonathan.", "Other runners streaked past me, staring at me in utter bewilderment. When I reached Jonathan’s side, the stadium erupted into a cacophony of cheers and thunderous applause. Without saying a word, I helped him up. Together, we limped the rest of the way towards the finish line, crossing long after everyone else.", "At the prize ceremony, the winner was called to collect the trophy that I yearned for so badly. Then, to my surprise, the judges called my name too. Puzzled, I stepped forwards. One of the judges explained that they had decided to award me a special trophy for sportsmanship. It was smaller than the one I had dreamt of winning, but no less beautiful. It glistened in the sunlight as though it were winking back at me, telling me that I had done the right thing. I looked over at Jonathan, who was still nursing his ankle at the side. He gave me a small, genuine smile, the first I had ever seen from him.", "That day did not end the way I had imagined it would. I never won the race and I never got to hold the trophy that I had coveted. Yet, that day remains the most unforgettable day of my life because of what I had learnt. True victory is not always about crossing the line first, but about the choices we make when no one would blame us for choosing otherwise."], "level": "p5", "fromTLL": true}, {"id": "p3-rain-rain-go-away", "fromW": true, "num": 4, "title": "Rain Rain Go Away", "family": "fixes", "path": "Domino Disaster", "source": "W@W · Primary 3 · Week 04", "topic": "Write a composition of at least 150 words about an unlucky day.", "theme": "Bad luck can pile up. Check your bag for your umbrella before you leave!", "audio": "p3-rain-rain-go-away", "pov": "third", "words": 435, "stages": [{"key": "setting", "paras": [0], "pic": "⛈️🎒😟", "hook": "Dark clouds, and no umbrella in the bag.", "summary": "School is over and Gary is walking home. The sky is dark and windy. He looks in his bag for his umbrella, but he has forgotten it.", "trick": "The trouble is planted here: no umbrella. Gary did not choose the rain. It is coming for him."}, {"key": "rising", "paras": [1, 2], "pic": "🌧️🏃👟", "hook": "The sky opens. Gary runs with a file on his head.", "summary": "A heavy rainstorm begins. Gary covers his head with his file and dashes down the pavement. His shoes are soaked and squelching.", "trick": "Unlucky thing number 1: he is caught in the rain. The problem grows with every step."}, {"key": "climax", "paras": [3, 4], "pic": "💦😱🦵", "hook": "He leaps over a puddle, slips, and SPLASH!", "summary": "Gary jumps over a huge puddle. His shoes slip on the muddy floor and he lands in a heap in the middle of the puddle. His white uniform is brown and his notes are soaked.", "trick": "This is the peak. The unlucky day is at its worst right here. The topic words are happening."}, {"key": "falling", "paras": [5], "pic": "🙇🤝🚶", "hook": "Kind strangers help. Gary walks home, head hung low.", "summary": "Kind Samaritans come to check on him. He is not badly hurt, only very embarrassed. He thanks them and walks home, cursing his luck.", "trick": "The story cools down, and the topic words come back: 'this unlucky day'."}, {"key": "ending", "paras": [6], "pic": "🤒🛏️💊", "hook": "A fever, the flu, and days in bed.", "summary": "At home Gary showers and naps, but wakes up with a burning forehead. The doctor says he has the flu. What an unlucky day!", "trick": "The last line says the topic again: 'What an unlucky day it had been for Gary!'"}], "vocab": [{"w": "doom and gloom", "d": "a dark, scary feeling that something bad is coming"}, {"w": "ominous", "d": "looking like something bad is going to happen"}, {"w": "loomed", "d": "looked big and scary above him"}, {"w": "rummaged", "d": "searched in a hurry, moving things around"}, {"w": "dismay", "d": "a sad, worried feeling when something goes wrong"}, {"w": "the heavens opened", "d": "it suddenly began to rain very hard"}, {"w": "blinding", "d": "so heavy that you can hardly see"}, {"w": "scramble", "d": "move quickly in a messy hurry"}, {"w": "cringed", "d": "pulled a face because something felt horrible"}, {"w": "squelching", "d": "the wet, sucking sound soggy shoes make"}, {"w": "instinctively", "d": "without stopping to think"}, {"w": "landed in a heap", "d": "fell down in a messy pile"}, {"w": "murky", "d": "dark and dirty"}, {"w": "Kind Samaritans", "d": "kind strangers who stop to help"}, {"w": "cursing his luck", "d": "feeling angry about his bad luck"}, {"w": "catch forty winks", "d": "take a short nap"}, {"w": "scorching", "d": "very, very hot"}, {"w": "misfortune", "d": "bad luck"}, {"w": "prescribed", "d": "(a doctor) told him which medicine to take"}], "paras": ["As Gary stepped out of the school building, he was greeted with a scene of doom and gloom, as one would see in a horror film. The grey, ominous clouds loomed over Gary, startling him each time they boomed. The trees swayed wildly, helpless against the strong gushes of wind that pushed them left and right. Gary was on his way home. He rummaged through his bag anxiously for his umbrella but to his dismay, he had forgotten it.", "Unfortunately, the heavens opened, and a sudden blinding rainstorm began. Knowing that the rainstorm was only going to get worse, Gary placed his file over his head and dashed hurriedly down the pavement.", "The rain blurred the distant images of his surroundings, and Gary had to strain his eyes to see what was ahead. Much to his discomfort, he had to scramble to the nearest shelter with fully soaked shoes. He cringed at the squelching sound they made with every step he took. Skilfully, Gary dodged people along the way.", "Then, he saw a gigantic puddle ahead. Gary instinctively spread his legs wide and leapt over it. However, at that moment, disaster struck when Gary’s shoes touched the ground. He slipped on the slippery, muddy floor and his legs flew out under him!", "“Ouch!” Gary gasped in pain. He had landed in a heap right in the middle of the puddle. He felt utterly defeated. His white uniform was now murky brown. Furthermore, his file and its contents were soaked through and revising for his upcoming test was no longer an option.", "Kind Samaritans who had seen Gary fall quickly came to his aid. Fortunately, Gary was not badly hurt. He was much more embarrassed at what had happened on this unlucky day than concerned about his injuries. After thanking those passers-by who came to check on him, Gary continued his way home with his head hung low, cursing his luck for that day.", "Gary was soaked to the skin by the time he reached home. He took a hot shower and immediately snuggled under his thick blanket to catch forty winks. After an hour, Gary woke up with an aching body and an itchy throat. Mother came home and placed her hand on Gary’s forehead which was scorching hot to the touch. Wasting no time, she took Gary to the nearest clinic. Adding on to his misfortune for that day, Gary was concluded to be down with the flu. The doctor prescribed him antibiotics and instructed him to stay in bed for the next few days. What an unlucky day it had been for Gary!"], "level": "p3"}, {"id": "p3-run-austin-run", "fromW": true, "num": 6, "title": "Run Austin Run", "family": "guts", "path": "Uphill Climb", "source": "W@W · Primary 3 · Week 06", "topic": "Write a composition of at least 150 words about a school sports day.", "theme": "Months of training pay off when you give your very best.", "audio": "p3-run-austin-run", "pov": "third", "words": 358, "stages": [{"key": "setting", "paras": [0], "pic": "🎶🚩👋", "hook": "Music, flags and cheering. Austin waves to his parents.", "summary": "It is Sunshine Primary School’s sports day. The stadium is noisy and excited. Austin warms up beside the track and waves to his parents.", "trick": "The topic is named in the very first paragraph: 'its annual sports day'. We know where we are."}, {"key": "rising", "paras": [1, 2], "pic": "📣😤🔫", "hook": "The 100-metre race. Bang! They are off.", "summary": "The boys’ 100 metres is called. Austin walks onto the track, ready to prove his months of training. The gun goes off and a runner from the blue team closes in on him.", "trick": "The sports event starts and the tension climbs. Will the training be enough?"}, {"key": "climax", "paras": [3, 4], "pic": "😬🏃💨", "hook": "Teeth clenched, lungs bursting, one last leap.", "summary": "Austin grits his teeth and pushes forward. His classmates scream his name. With a final burst of energy he leaps and crosses the finishing line first.", "trick": "The peak is the most exciting second of the sports day: the finish."}, {"key": "falling", "paras": [5], "pic": "🤯🤗👏", "hook": "He can hardly believe it. His classmates hug him.", "summary": "Austin’s mind is spinning. His classmates rush over, hug him and congratulate him.", "trick": "The excitement settles. We see what the win means to him and his friends."}, {"key": "ending", "paras": [6], "pic": "😁🏆✨", "hook": "A trophy, a huge grin. What a marvellous sports day!", "summary": "Grinning from ear to ear, Austin waves at the crowd and goes up to the winner’s stand for his trophy.", "trick": "The last line says the topic again: 'What a marvellous sports day!'"}], "vocab": [{"w": "reverberated", "d": "echoed loudly all around"}, {"w": "Vivid", "d": "very bright"}, {"w": "abuzz", "d": "full of excited noise"}, {"w": "boisterously", "d": "in a loud, lively way"}, {"w": "feverish anticipation", "d": "very excited waiting"}, {"w": "crisp", "d": "sharp and clear"}, {"w": "adrenaline", "d": "the rush of energy you feel when you are excited or scared"}, {"w": "strode", "d": "walked with big, confident steps"}, {"w": "etched on his face", "d": "shown clearly on his face"}, {"w": "gone down the drain", "d": "been wasted"}, {"w": "hollered", "d": "shouted loudly"}, {"w": "propelled", "d": "pushed forward with force"}, {"w": "riveted on", "d": "fixed on; he could not look away"}, {"w": "whirling", "d": "spinning"}, {"w": "embrace", "d": "hug"}, {"w": "triumphantly", "d": "in a proud, winning way"}, {"w": "marvellous", "d": "wonderful"}], "paras": ["Heart-thumping music reverberated through the air. Vivid coloured banners and flags fluttered as the wind blew. Sunshine Primary School was celebrating its annual sports day. The whole stadium was abuzz with excited chatter and laughter. Spectators held tiny flags and waved at the runners while cheering boisterously. They were all in a state of feverish anticipation. Austin stood by the side of the track doing warm up exercises. He glanced at the spectator stands and waved to his parents. They had come to support and cheer for him on his school’s annual sports day.", "“The first event is boys’ 100 meters’ race,” the announcer’s voice was crisp and clear. Spectators broke out into a loud cheer as the runners took their positions. The runners’ faces were tight with tension. With adrenaline pumping in his veins, Austin strode confidently onto the track. Determination was etched on his face. It was time for him to prove to himself that his months of training had not gone down the drain.", "“On your mark! Get set!” hollered the official. The air gun went “Bang!” and the runners took off like newly launched rockets. Austin charged down the track, running as fast as his legs could carry him. He could sense a runner from the blue team closing in on him.", "He clenched his teeth and propelled himself forward. His face exploded into a deep red, and he felt his lungs bursting. Austin’s classmates were on their feet. They edged nearer and nearer to the field, jumping and yelling his name. Austin’s eyes were riveted on the finishing line. With a final burst of energy, he sprinted and leapt forward.", "Deafening cheers and applause rocked the stadium when Austin crossed the finishing line first.", "His mind was whirling in disbelief that he had won the race. He came back to his senses when his classmates yelped with delight and rushed forward to embrace him. They congratulated Austin on his victory.", "Grinning from ear to ear, Austin waved triumphantly at the crowd. He was filled with pride when he went up to the winner’s stand to receive his trophy. What a marvellous sports day!"], "level": "p3"}, {"id": "p3-egg-and-spoon", "fromW": true, "num": 8, "title": "Egg and Spoon", "family": "growth", "path": "Hard Lesson", "source": "W@W · Primary 3 · Week 08", "topic": "Write a composition of at least 150 words about cheating.", "theme": "Cheats get found out. A win that is not fair is not a win.", "audio": "p3-egg-and-spoon", "pov": "third", "words": 384, "stages": [{"key": "setting", "paras": [0], "pic": "☁️🥔🎉", "hook": "A sunny telematch. The class wins the sack race.", "summary": "The Primary 3 pupils are at the field for the telematch. Austin and his friends cheer as their class wins the potato sack race.", "trick": "A happy start. No cheating yet, but we meet Austin and the games."}, {"key": "rising", "paras": [1, 2], "pic": "😰🧴🥚", "hook": "He must win. Out comes the superglue.", "summary": "The next event is ‘Run with the Egg’. Austin is desperate to win. He secretly glues the egg to his spoon, then races ahead of everyone.", "trick": "Here is the topic: Austin CHOOSES to cheat. In the handout this part is bold, because it answers the question."}, {"key": "climax", "paras": [3, 4], "pic": "🪨🤸😳", "hook": "He trips on a pebble. The egg does not fall off!", "summary": "Dreaming about winning, Austin does not see a pebble. He falls and drops the spoon, and everyone sees that the egg stays stuck. The truth has come to light.", "trick": "The peak is the moment the cheating is found out. A cheating story needs this."}, {"key": "falling", "paras": [5], "pic": "😳👨‍🏫🙇", "hook": "Red face, lowered head, a scolding from Mr Tan.", "summary": "Austin’s face turns crimson. Mr Tan takes him aside and scolds him. Austin feels everyone’s eyes on him and says sorry.", "trick": "We see the result of the cheating: shame."}, {"key": "ending", "paras": [6], "pic": "⏰😞🤞", "hook": "Three hours of detention, and a promise.", "summary": "Mr Tan gives Austin three hours of detention. Austin’s shoulders slump. He promises himself never to cheat again.", "trick": "The last line says the topic and the lesson: 'not to cheat ever again'."}], "vocab": [{"w": "telematch", "d": "a fun games competition between teams"}, {"w": "abuzz", "d": "full of excited noise"}, {"w": "frisky", "d": "playful and full of energy"}, {"w": "boisterously", "d": "in a loud, lively way"}, {"w": "on cloud nine", "d": "extremely happy"}, {"w": "palpitated", "d": "beat very fast"}, {"w": "by hook or by crook", "d": "in any way possible, fair or not"}, {"w": "desperate", "d": "wanting something so badly you would do anything"}, {"w": "brainwave", "d": "a sudden clever idea"}, {"w": "smirk", "d": "a sly, pleased smile"}, {"w": "engrossed", "d": "so busy thinking that you notice nothing else"}, {"w": "dumbfounded", "d": "too surprised to speak"}, {"w": "come to light", "d": "been found out"}, {"w": "accusing", "d": "blaming"}, {"w": "reproached", "d": "scolded"}, {"w": "meted out", "d": "gave (a punishment)"}, {"w": "detention", "d": "staying back in school as a punishment"}, {"w": "slumped", "d": "dropped down sadly"}], "paras": ["The sky was clear blue, and fluffy white clouds hung in clusters. The primary 3 pupils of Springdale Primary School were gathered at the vast empty field for the annual inter-class telematch. The field was abuzz with excited chatter and laughter, and most of the pupils were bursting with excitement. The first event was the potato sack race. The competitors hopped like frisky bunnies as Austin and his friends cheered boisterously for their classmates. They were on cloud nine, yelping with delight when their class had won.", "“Next event is ‘Run with the Egg’,” announced a teacher. Austin’s heart palpitated wildly against his chest. He had trained very hard for months and he had to win by hook or by crook. He was desperate for a win. Suddenly, a brainwave struck him. He fished out a tube of superglue from his pocket. He peered behind his shoulder to make sure that no one was looking. With a smirk on his face, he stuck the egg to the spoon. After that, Austin strode confidently to the starting line and got ready.", "Austin shot off like a bullet when he heard “Bang!” He sprinted as fast as a cheetah. He was leading the race, and everyone was trailing behind him, huffing and puffing. His heart swelled as he imagined his classmates and teacher congratulating him.", "He was so engrossed in his own thoughts that he did not see a pebble in front of him. He fell and dropped the spoon. Everyone was dumbfounded when they saw that the egg did not roll off the spoon.", "The truth had come to light. Everyone knew that Austin had cheated.", "Austin’s face flushed crimson red. He turned away to avoid the accusing stares of his classmates. Austin’s form teacher, Mr Tan, brought him to a less crowded area of the field. Austin lowered his head in shame as Mr Tan reproached him for cheating. Embarrassment flushed across his face as he could feel all his classmates’ eyes on him. Austin realised his mistake and apologised for his foolishness.", "However, Mr Tan was not going to let him off lightly. He meted out Austin’s punishment – three hours of detention. Austin’s shoulders slumped when he heard the bad news. He made a promise to himself not to cheat ever again."], "level": "p3"}, {"id": "p3-gracious-gary", "fromW": true, "num": 10, "title": "Gracious Gary", "family": "bonds", "path": "Invisible Hero", "source": "W@W · Primary 3 · Week 10", "topic": "Write a composition of at least 150 words about a good deed.", "theme": "A small kind act can make someone’s day, and yours too.", "audio": "p3-gracious-gary", "pov": "third", "words": 311, "stages": [{"key": "setting", "paras": [0], "pic": "🎬🚌😄", "hook": "Two friends on the bus home, laughing about a movie.", "summary": "Gary and Austin are going home after a movie. They are lucky to get seats on the bus. They chat and laugh about the best scenes.", "trick": "A calm start. Notice the seats: Gary HAS a seat. That is what he will give away later."}, {"key": "rising", "paras": [1, 2], "pic": "👵🧺😣", "hook": "An old lady climbs on with a heavy basket. Every seat is taken.", "summary": "At the next stop, a frail old lady struggles up the steps with a heavy basket. She wobbles down the aisle looking for a seat, but there is none. The bus goes over a bump and she cries out.", "trick": "Someone needs help. A good deed can only happen when someone needs it, so the story shows us her struggle first."}, {"key": "climax", "paras": [3], "pic": "🙋💺😊", "hook": "Gary springs to his feet and gives her his seat.", "summary": "Gary notices her struggle. He jumps up and offers her his seat. Her eyes widen in surprise and she gives him a toothless smile.", "trick": "The peak is the good deed itself. Gary DOES it, and we watch him do it."}, {"key": "falling", "paras": [4], "pic": "😳👍🌟", "hook": "Some passengers look away in shame. One man gives a thumbs up.", "summary": "The old lady sinks into the seat. The passengers who pretended not to see her look away in shame. A man gives the boys a thumbs up, and the old lady praises Gary to the skies. Gary glows with pride.", "trick": "Now we see what the deed does: she can rest, other people notice, and Gary feels proud."}, {"key": "ending", "paras": [5], "pic": "👋💛🚌", "hook": "Goodbye to the old lady, and a warm feeling inside.", "summary": "The old lady reaches her stop and the boys say goodbye. They ride the rest of the way home with warm hearts.", "trick": "The last line says the topic again: ‘Having done a good deed’."}], "vocab": [{"w": "secure", "d": "get and keep"}, {"w": "animatedly", "d": "in a lively, excited way"}, {"w": "bouts of laughter", "d": "short bursts of laughing"}, {"w": "reminiscing", "d": "remembering and talking about something you enjoyed"}, {"w": "came to a halt", "d": "stopped"}, {"w": "laboured", "d": "moved slowly, with great effort"}, {"w": "stooped", "d": "bent forward"}, {"w": "frail", "d": "weak and thin"}, {"w": "weary", "d": "very tired"}, {"w": "etched", "d": "marked deeply"}, {"w": "wobbled unsteadily", "d": "walked shakily, as if about to fall"}, {"w": "aisle", "d": "the walkway between the seats"}, {"w": "vacant", "d": "empty"}, {"w": "occupied", "d": "taken"}, {"w": "hoarse", "d": "rough and croaky"}, {"w": "sprang to his feet", "d": "jumped up quickly"}, {"w": "slumped", "d": "sat down heavily"}, {"w": "elephantine", "d": "huge, like an elephant"}, {"w": "feigned ignorance", "d": "pretended not to notice"}, {"w": "commended", "d": "praised"}, {"w": "praised him to the skies", "d": "praised him very, very much"}, {"w": "bade farewell", "d": "said goodbye"}], "paras": ["Gary and Austin were heading home after a movie. Fortunately for them, they were quick enough to secure some seats on the bus for their trip back. Making themselves comfortable, the boys chatted animatedly about the movie that they had just watched, occasionally bursting into bouts of laughter reminiscing some of the scenes.", "The bus came to a halt at the next bus-stop. An old lady boarded the bus. She laboured breathlessly up the steps with her back stooped. Her body was frail and thin, and the heavy basket she was carrying threatened to pull her weary body to the ground. Her silvery-grey hair was pulled tightly in a bun. Gary could see that her wrinkles were deeply etched on her forehead and at the corners of her eyes.", "The old lady wobbled unsteadily down the aisle, scanning left and right for vacant seats. Unfortunately, all the seats in the bus were occupied. She let out a hoarse cry when the bus crossed over a bumpy patch on the road and reached out into the air to steady herself.", "Noticing her struggle, Gary sprang to his feet and offered his seat. The old lady’s eyes widened in surprise, and she gave Gary a toothless smile.", "The old lady slumped into the cushioned seat and placed her elephantine basket next to her feet. After witnessing Gary’s act of kindness, the passengers who feigned ignorance to the old lady looked away in shame. However, a man sitting across the boys gave the boys a thumbs up. The old lady commended Gary’s kind gesture and praised him to the skies. Gary’s heart swelled after hearing the praises, and his face glowed with pride.", "Soon, the old lady reached her destination, and the boys bade farewell. Having done a good deed, the boys continued the rest of the journey with a warmth in their heart."], "level": "p3"}, {"id": "p3-cat-got-your-tongue", "fromW": true, "num": 14, "title": "Cat Got Your Tongue", "family": "bonds", "path": "Invisible Hero", "source": "W@W · Primary 3 · Week 14", "topic": "Write a composition of at least 120 words about a performance.", "theme": "A friend’s support can carry you through your scariest moment.", "audio": "p3-cat-got-your-tongue", "pov": "first", "words": 465, "stages": [{"key": "setting", "paras": [0], "pic": "🎭🤞😬", "hook": "“Break a leg!” Curtains about to open.", "summary": "The drama club is about to perform Cinderella for the public for the first time. The narrator is the main character. She waits backstage, pacing and mumbling her lines.", "trick": "The topic is named at once: 'our performance'. We are already at the show."}, {"key": "rising", "paras": [1], "pic": "👗🧹🔦", "hook": "On stage. All goes well, until the spotlight is on her alone.", "summary": "She rushes on stage and acts her part perfectly with the others. Then the lights dim for her monologue, and a single spotlight shines on her.", "trick": "The performance is going on, and the tension rises: she is alone on stage."}, {"key": "climax", "paras": [2], "pic": "😶🥶👀", "hook": "She opens her mouth. No voice comes out.", "summary": "Her voice dies in her throat. The hall is silent and countless eyes stare at her. Her hands are cold and clammy. It is like a cat got her tongue.", "trick": "The peak: the performance is about to fail. This is the big problem of the story."}, {"key": "falling", "paras": [3, 4], "pic": "👍👍🔥", "hook": "Two friends wave. Two thumbs up. Her voice returns.", "summary": "She spots her best friends, Chloe and Phoebe, nodding and giving her two thumbs up. Warmth rushes back. She takes a deep breath and pours her heart into the show, and finishes without a hitch.", "trick": "The problem is solved inside the performance, thanks to her friends."}, {"key": "ending", "paras": [5], "pic": "👏🙇🥹", "hook": "A standing ovation. A show she will never forget.", "summary": "The show ends with thunderous applause. The audience stands and claps as the actors take their bow. She hugs her fellow actors.", "trick": "The last line says the topic and the lesson: 'a performance that I would never forget', thanks to her friends."}], "vocab": [{"w": "Break a leg", "d": "“good luck” (what actors say before a show)"}, {"w": "Jubilant", "d": "very happy and excited"}, {"w": "plastered across", "d": "spread widely over"}, {"w": "adaptation", "d": "a new version of an old story"}, {"w": "grand entrance", "d": "a big, impressive way of coming in"}, {"w": "stupor", "d": "a dazed state, like being half asleep"}, {"w": "flawless", "d": "perfect"}, {"w": "monologue", "d": "a long speech by one actor alone"}, {"w": "deafening silence", "d": "a silence so complete it feels loud"}, {"w": "clammy", "d": "cold and sweaty"}, {"w": "perspiration", "d": "sweat"}, {"w": "persistently", "d": "again and again without stopping"}, {"w": "a cat got my tongue", "d": "I could not say a word"}, {"w": "peripheral vision", "d": "what you see from the corner of your eye"}, {"w": "vigorously", "d": "with lots of energy"}, {"w": "without a hitch", "d": "with no problems at all"}, {"w": "thunderous applause", "d": "very loud clapping"}, {"w": "curtain call", "d": "when the actors come back on stage to bow"}, {"w": "standing ovation", "d": "when the audience stands up to clap"}, {"w": "unwavering", "d": "steady; never giving up"}], "paras": ["“1, 2, 3. Break a leg!” The drama club of W@W Primary School cheered as we broke out of the team’s hand stack. Jubilant smiles were plastered across our faces as everyone took their positions onstage, waiting for the stage curtains to open. This was the first time our drama club had ever made our performance open to the public and we simply could not wait to blow the audience away with our modern adaptation of Cinderella. Being the main character, I waited backstage to make my grand entrance. I paced up and down nervously as I mumbled my lines, praying that everything would go as planned.", "“Cindy! Come and iron my dress!” my ‘stepmother’s’ voice broke me out of my stupor. I smoothed down the front of my dress and rushed out onstage to deliver my lines. I was completely focused on my role and worked as a flawless team member with my fellow actors. Time flew by, and before I knew it, it was time for my monologue. The supporting actors exited as the stage lights darkened, leaving only a single spotlight shining on me.", "Taking a deep breath, I grabbed my broom and faced the audience. I opened my mouth and my voice died in my throat. I was suddenly aware of the deafening silence and the countless pairs of eyes staring right at me. Time seemed to slow to a crawl. My hands turned cold and clammy, and beads of perspiration started to form on my forehead. A ringing sound rang persistently in my ears. I cleared my throat and tried to speak again, but it was like a cat got my tongue.", "Just then, a movement in my peripheral vision caught my attention. I turned my head and squinted at a couple waving at me from the audience. It was my best friends, Chloe and Phoebe! They were nodding vigorously and giving me two thumbs up. In that instant, I felt warmth rushing back to my fingertips. I took a deep breath and poured my heart out into my performance.", "I breezed through the rest of the performance without a hitch. Every time I felt my knees start to shake, the image of my best friends popped into my head and my nervousness slipped away.", "Before long, the performance drew to a close, and thunderous applause rocked the auditorium. The drama club slowly filed out to make the curtain call. As we prepared to take our final bow, the sight of the audience nearly brought tears to my eyes. People were getting up from their seats and giving us a standing ovation! My chest puffed up in happiness as I hugged my fellow actors tightly. Thanks to my friends’ unwavering support, this was a performance that I would never forget."], "level": "p3"}, {"id": "p3-the-pickpocket", "fromW": true, "num": 17, "title": "The Pickpocket", "family": "guts", "path": "Leap of Faith", "source": "W@W · Primary 3 · Week 17", "topic": "Write a composition of at least 120 words about thwarting a pickpocket’s plan.", "theme": "When you see something wrong, be brave and speak up.", "audio": "p3-the-pickpocket", "pov": "first", "words": 475, "stages": [{"key": "setting", "paras": [0], "pic": "🚌👥💳", "hook": "A packed bus interchange and a long, snaking queue.", "summary": "It is the morning peak hour. The narrator pushes through the crowd to top up an EZ-link card and joins a long queue.", "trick": "A busy, crowded place: the perfect spot for a pickpocket. The setting fits the topic."}, {"key": "rising", "paras": [1], "pic": "🕵️👜🤏", "hook": "A shifty man. An unzipped handbag. Quick fingers.", "summary": "A shifty-looking man in front keeps eyeing a lady’s open handbag. Quietly, he slips his fingers in and pulls out her wallet with a smirk.", "trick": "Half of the topic appears: the pickpocket’s plan. Now someone must thwart it."}, {"key": "climax", "paras": [2], "pic": "😱📣👉", "hook": "Frozen for a second, then a scream: “PICKPOCKET!”", "summary": "The narrator is frozen in horror, but knows the right thing to do. A loud scream and a pointing finger raise the alarm. The lady finds her wallet gone and the thief bolts.", "trick": "The peak is the topic itself: 'I had thwarted the pickpocket’s plan!' The brave act happens here."}, {"key": "falling", "paras": [3], "pic": "🏃🏃🤼", "hook": "Two commuters chase him and pin him down.", "summary": "Two quick-witted commuters chase the pickpocket through the crowd, catch him and pin him to the ground. Someone dials 999. The wallet goes back to the lady.", "trick": "The brave shout works. We see the plan fail completely."}, {"key": "ending", "paras": [4], "pic": "🙇‍♀️👮😊", "hook": "Thanks, handcuffs, and pride. Crime does not pay.", "summary": "The lady bows and praises the narrator. The police arrive and handcuff the thief. The narrator beams with pride.", "trick": "The topic words appear twice more in the ending. The reader can never forget what the story is about."}], "vocab": [{"w": "commuters", "d": "people travelling to work or school"}, {"w": "from all walks of life", "d": "of every kind"}, {"w": "snaking queue", "d": "a long, winding line of people"}, {"w": "shifty-looking", "d": "looking sneaky; not to be trusted"}, {"w": "gave him a once-over", "d": "looked him up and down quickly"}, {"w": "dishevelled", "d": "messy"}, {"w": "dubious", "d": "suspicious"}, {"w": "sizing up", "d": "looking at carefully, to judge"}, {"w": "menace", "d": "a threatening, dangerous look"}, {"w": "deft", "d": "quick and skilful"}, {"w": "gingerly", "d": "very carefully"}, {"w": "retrieved", "d": "got hold of"}, {"w": "flabbergasted", "d": "extremely shocked"}, {"w": "scot-free", "d": "without being punished"}, {"w": "righteousness", "d": "the feeling of wanting to do what is right"}, {"w": "gathered my wits", "d": "made myself calm enough to think"}, {"w": "strident", "d": "loud and sharp"}, {"w": "thwarted", "d": "stopped (a plan) from working"}, {"w": "stupefaction", "d": "great shock"}, {"w": "bolted off", "d": "ran away suddenly"}, {"w": "hot on his heels", "d": "chasing right behind him"}, {"w": "scoundrel", "d": "a bad, dishonest person"}, {"w": "sheepishly", "d": "in a shy, embarrassed way"}, {"w": "praised to the skies", "d": "praised very, very much"}], "paras": ["The bus interchange was packed with commuters from all walks of life as it was the morning peak hour. Everyone was either heading to school or work while I was in a hurry to top up my EZ-link card. Taking a deep breath, I braved the crowd and battled my way to the ticketing booth. I frowned in dismay when I saw the snaking queue there.", "I joined the queue, praying for it to move along swiftly. At that moment, a shifty-looking man who was standing in front of me caught my attention. I gave him a once-over. He had long, dishevelled hair that fell over his face. Although his eyes darted from side to side, scanning his surroundings occasionally, I noticed that this dubious character was sizing up the lady in front of him. She had carelessly left her handbag unzipped, and her designer wallet was peeping out from within. The man’s eyes shone in menace as if he had just come across precious treasure. Quietly, he slipped his deft fingers into the lady’s handbag and gingerly pulled out the wallet. A wide smirk spread across his face when he successfully retrieved the wallet.", "I stood there flabbergasted at the scene unfolding before my very eyes. Frozen in horror, I could not find my voice for a moment. It seemed that the lawbreaker was about to leave the crime scene scot-free. A sense of righteousness rose within me, and I knew that I had to do the right thing. I gathered my wits and let out a strident scream that could have shattered glass. “PICKPOCKET!” I hollered, raising the alarm by pointing a straight finger at the pickpocket. I had thwarted the pickpocket’s plan! The victimised lady whipped her head around in astonishment. She was gripped by stupefaction when she realised that her wallet was missing. Meanwhile, the pickpocket had bolted off like a streak of lightning as he tried to make his getaway.", "Two righteous and quick-witted commuters pursued the pickpocket like a predator after its prey. The pickpocket was pushing through the crowd and toppling the people like dominoes. The two kind Samaritans were hot on his heels, and they caught up with the scoundrel in no time. One of them pounced on him, while the other pinned the lawbreaker to the ground. An onlooker whipped out his mobile phone and dialled ‘999’ for the police. I handed the wallet to its rightful owner.", "The lady expressed her gratitude with a deep bow and praised me for my quick wits to thwart the pickpocket’s plan. I blushed and smiled sheepishly when I was praised to the skies. Moments later, the policemen came and slapped handcuffs on the thief, escorting him away. Crime does not pay. I beamed with pride that I had helped to thwart the pickpocket’s plan and saved the day!"], "level": "p3"}, {"id": "p3-the-killer-pot", "fromW": true, "num": 19, "title": "The Killer Pot", "family": "fixes", "path": "Domino Disaster", "source": "W@W · Primary 3 · Week 19", "topic": "Write a composition of at least 120 words about a killer litter.", "theme": "Never throw things from a height. One reckless moment could cost a life.", "audio": "p3-the-killer-pot", "pov": "first", "words": 460, "stages": [{"key": "setting", "paras": [0], "pic": "🥱🩴📝", "hook": "A sleepy morning and a shopping list.", "summary": "The narrator steps out of the house in slippers, half asleep, going over the list of groceries to buy.", "trick": "A calm, ordinary start, so the shock that follows feels bigger."}, {"key": "rising", "paras": [1, 2], "pic": "😨🪴🙋", "hook": "A boy holds a pot over the sixth-floor wall. “Hey!”", "summary": "Across the corridor, the new neighbour is holding a pot of plant in the air from the sixth floor. The narrator waves and shouts that it is dangerous. The boy only smirks.", "trick": "The topic walks in: 'The pot could be a killer litter!' The danger is clear."}, {"key": "climax", "paras": [3], "pic": "🪴⬇️💥", "hook": "He lets go. The pot falls six storeys. THUD.", "summary": "The boy lets go of the pot and rubs his hands in glee. The pot of sunflower falls six storeys and lands on a parked car with a loud thud.", "trick": "The peak is the killer litter actually falling. Without this moment the story would not answer the topic."}, {"key": "falling", "paras": [4, 5], "pic": "😮‍💨📞👮", "hook": "No one is hurt. Mother calls the police.", "summary": "A crowd gathers around the damaged car. Luckily no one is hurt. The narrator runs home, gets Mother to call the police and tells the officers where the boy lives.", "trick": "Someone acts to fix the problem: the narrator reports it."}, {"key": "ending", "paras": [6], "pic": "🙇👨‍👩‍👦⚠️", "hook": "The boy hangs his head. “You may be jailed.”", "summary": "From the corridor the narrator watches the police speak to the boy and his shocked parents. An officer points to the killer litter poster. The boy is full of remorse.", "trick": "The ending repeats the topic ('killer litter poster') and gives the lesson and the consequence."}], "vocab": [{"w": "humid", "d": "warm and damp"}, {"w": "groggily", "d": "sleepily"}, {"w": "tasked", "d": "given a job to do"}, {"w": "daze", "d": "a sleepy, unclear state"}, {"w": "precariously", "d": "in a dangerous way; likely to fall"}, {"w": "frantically", "d": "in a wild, worried hurry"}, {"w": "agape", "d": "wide open in surprise"}, {"w": "smirk", "d": "a sly, pleased smile"}, {"w": "released his clutches", "d": "let go"}, {"w": "glee", "d": "great delight"}, {"w": "abyss", "d": "a very deep, empty space"}, {"w": "utter dismay", "d": "great shock and sadness"}, {"w": "palpitating frenziedly", "d": "beating wildly"}, {"w": "dire consequences", "d": "terrible results"}, {"w": "eternity", "d": "a very, very long time"}, {"w": "recount", "d": "the telling of what happened"}, {"w": "minimal", "d": "very little"}, {"w": "culprit", "d": "the person who did the wrong thing"}, {"w": "remorse", "d": "feeling very sorry for what you did"}, {"w": "recklessness", "d": "doing dangerous things without thinking"}, {"w": "juvenile", "d": "a young person"}, {"w": "grounded", "d": "not allowed to go out, as a punishment"}], "paras": ["A rush of humid breeze blasted against my face as I swung the main gate open and exited my house. I yawned as I glanced down to my bare feet. I groggily put on my slippers while recalling the list of groceries I was tasked to buy. “Eggs, cereal, milk, bread...” I whispered to myself before looking up at the corridor, ready to start my journey to the shop nearby.", "The sight that greeted me from the corridor opposite where I was standing shocked me out of my daze. The new neighbour was precariously holding a pot of plant in the air from the sixth floor!", "“Hey! Hey! Over here!” I waved frantically in his direction, desperately trying to get his attention. “That’s dangerous! The pot could be a killer litter!” I continued my attempts to save the day. My jaw hung wide agape when the boy looked me in the eye and merely gave me a smirk.", "He released his clutches on the pot and even rubbed his hands in glee after that! I watched in slow-motion as the pot of sunflower fell into the six-storey abyss below. To my utter dismay, a loud thud reached my ears when the pot fell on a car parked at the open carpark below.", "My heart was palpitating frenziedly against my ribcage as I went to check on the dire consequences of the killer litter. On the ground floor, curious passers-by, nosy aunties and Good Samaritans had formed a circle around the damaged car. I heaved a sigh of relief as no one was hurt.", "Quickly coming to my senses, I ran back into my home and nudged my mother to call for the police. After what seemed like an eternity, two police officers arrived at my doorstep. I anxiously told them my personal recount, “He’s a new face in the neighbourhood. All I know is that he lives on the sixth floor at the opposite block!” With that minimal information, the police officers rushed over to the next block to approach the culprit.", "I watched the scene unfold from the corridor outside my house. The police officers had a conversation with the boy and his parents. From the distance that I was standing, I could see his parents towering over him with looks of shock and disappointment on their faces. The boy hung his head low in remorse. He had let all the recklessness get to his head. One police officer pointed his finger to the direction of the killer litter poster at the lift landing, “Don’t be a potential killer. You may be jailed.” It was such a relief that no one got hurt or else the juvenile could have faced a much more dire punishment than merely being grounded."], "level": "p3"}, {"id": "p3-watch-out", "fromW": true, "num": 21, "title": "Watch Out!", "family": "fixes", "path": "Domino Disaster", "source": "W@W · Primary 3 · Week 21", "topic": "Write a composition of at least 120 words about a fall.", "theme": "Wet floors are dangerous. Walk carefully, and help quickly when someone is hurt.", "audio": "p3-watch-out", "pov": "third", "words": 390, "stages": [{"key": "setting", "paras": [0], "pic": "🧺📣👵", "hook": "A noisy morning market. Madam Tan hunts for bargains.", "summary": "The wet market is busy and loud. Old Madam Tan totters around happily, looking for the best bargains.", "trick": "We meet an old lady in a wet market. Can you already guess what might cause a fall?"}, {"key": "rising", "paras": [1, 2], "pic": "🛒🐟💧", "hook": "A full trolley, a silver pomfret, and puddles on the floor.", "summary": "Her trolley is full and heavy. She buys a silver pomfret from the friendly fishmonger. Then she pushes the trolley down a narrow aisle where the floor is covered in puddles.", "trick": "Everything here leads to the fall: a heavy trolley, a wet floor, a crowd. This answers 'What led to the fall?'"}, {"key": "climax", "paras": [3], "pic": "😱💥🦴", "hook": "“Ah!” She slips and lands with a sickening thud.", "summary": "Then, it happens. Madam Tan slips on the slippery floor and lands heavily on her bottom. She cries out weakly for help. Everyone stops and stares in shock.", "trick": "The peak is the fall itself, described in slow detail: the yelp, the thud, the gasps."}, {"key": "falling", "paras": [4], "pic": "🐟🤝🚑", "hook": "The fishmonger rushes over. Someone calls the paramedics.", "summary": "The fishmonger helps her up and a kind stranger calls for the paramedics. They sit her on a plastic chair. Within minutes the paramedics take her to hospital.", "trick": "After the fall, people act. We see kindness."}, {"key": "ending", "paras": [5], "pic": "🏥😔💭", "hook": "A simple market trip ends in hospital.", "summary": "What began as a simple trip to the wet market ended with a bad fall and a trip to the hospital.", "trick": "The last sentence names the topic: 'a bad fall'."}], "vocab": [{"w": "hustle and bustle", "d": "lots of busy, noisy activity"}, {"w": "thronged", "d": "crowded into"}, {"w": "dangling", "d": "hanging and swinging"}, {"w": "hollered", "d": "shouted loudly"}, {"w": "tottered", "d": "walked with small, unsteady steps"}, {"w": "bargain", "d": "something good at a low price"}, {"w": "filled to the brim", "d": "completely full"}, {"w": "frequented", "d": "often went to"}, {"w": "amiable", "d": "friendly"}, {"w": "fishmonger", "d": "a person who sells fish"}, {"w": "silver pomfret", "d": "a flat, silver fish"}, {"w": "dexterity", "d": "skill with the hands"}, {"w": "drenched", "d": "soaking wet"}, {"w": "inched forward", "d": "moved forward very slowly"}, {"w": "gingerly", "d": "very carefully"}, {"w": "yelp", "d": "a short, sharp cry"}, {"w": "sickening thud", "d": "a horrible, heavy bump"}, {"w": "feebly", "d": "weakly"}, {"w": "writhed", "d": "twisted about in pain"}, {"w": "winced", "d": "tightened her face in pain"}, {"w": "ceased", "d": "stopped"}, {"w": "etched on their faces", "d": "shown clearly on their faces"}, {"w": "paramedics", "d": "ambulance helpers trained to treat injured people"}], "paras": ["The early morning market was a hustle and bustle of activities. Housewives thronged the market with their baskets dangling from their arms. Stallholders hollered at the top of their lungs to attract customers. Old Madam Tan tottered leisurely around the market. Her heart was filled with light-hearted cheer as she scanned the stalls keenly, hunting for the best bargain eagerly.", "Before long, Madam Tan’s trolley was filled to the brim, and it creaked under the weight of the groceries. She reached the seafood section where numerous stalls selling a wide selection of the freshest seafood could be found. Madam Tan walked purposefully towards the typical stall she frequented. The amiable fishmonger greeted her and recommended his bestseller of the day enthusiastically – the silver pomfret. Her finger pressed gently at the fish. “How much?” she asked the fishmonger as he held up the fish by its tail, handling the slippery fish with dexterity. “A special rate just for my loyal customer,” the fishmonger declared and wrapped the fish up for her.", "After thanking the fishmonger, Madam Tan placed the fish in her trolley carefully. She pushed her trolley down the narrow aisle. The entire floor of the wet market was drenched with puddles of water. Madam Tan inched forward gingerly, clutching the handle of her trolley tightly, trying her best to avoid the puddles and the growing crowd.", "Then, it happened. “Ah!” Madam Tan let out a loud yelp as she slipped on the slippery floor. Madam Tan landed heavily on her bottom with a sickening thud. “Please help me,” Madam Tan cried out feebly while she writhed and winced in agony. All activities and chatter ceased. Everyone whipped their heads around to the cries of distress. Their eyes popped out of their sockets and shock was etched on their faces. Gasps of horror escaped from their lips when they saw Madam Tan on the ground.", "The fishmonger immediately rushed forward to help Madam Tan up. Seeing how much pain Madam Tan was in, another kind Samaritan instantly dialled for the paramedics. While waiting, they helped her onto a plastic chair for her to rest. Within minutes, the paramedics arrived to take Madam Tan to the hospital.", "A simple trip to the wet market ended up with a bad fall that resulted in her having to go to the hospital."], "level": "p3"}, {"id": "p3-see-me", "fromW": true, "num": 23, "title": "See Me", "family": "growth", "path": "Hard Lesson", "source": "W@W · Primary 3 · Week 23", "topic": "Write a composition of at least 120 words about breaking a school rule.", "theme": "Rules are there for a reason. Showing off can cost you what you love.", "audio": "p3-see-me", "pov": "third", "words": 429, "stages": [{"key": "setting", "paras": [0], "pic": "🛍️📱🎂", "hook": "“That is the one I want!” A new phone for her birthday.", "summary": "Kelly begs her parents for the latest mobile phone as a birthday present and promises to use it responsibly. Father finally agrees.", "trick": "No rule is broken yet. But the phone is here, and so is the promise to be responsible."}, {"key": "rising", "paras": [1], "pic": "🎒📱🐝", "hook": "She shows it off in class. Everyone swarms around.", "summary": "The next day Kelly takes the phone to school, knowing it is against the rules. Her classmates crowd around like bees to honey. Nobody notices Mr Lee at the door.", "trick": "Here is the topic: 'Despite knowing that she was breaking a school rule…' She chooses to do it."}, {"key": "climax", "paras": [2], "pic": "👨‍🏫✋😨", "hook": "“What is going on here?” The phone is handed over.", "summary": "Mr Lee’s voice booms out. Everyone scrambles back to their seats. Kelly, close to tears, must place the phone on his palm. “See me after school!”", "trick": "The peak is being caught. The topic words appear again: 'she had broken a school rule'."}, {"key": "falling", "paras": [3, 4], "pic": "😳🪑⏳", "hook": "Red face, pins and needles, then the walk to his cubicle.", "summary": "Kelly walks back to her seat, embarrassed. She fidgets nervously all day. After school she goes to Mr Lee and apologises again and again.", "trick": "We see the result of breaking the rule: worry and shame."}, {"key": "ending", "paras": [5], "pic": "📵😞💭", "hook": "Phone confiscated until the end of term. Regret.", "summary": "Mr Lee scolds her and tells her parents that the phone will be kept until the end of term. Kelly’s face falls. She regrets breaking the rule.", "trick": "The last line says the topic and the lesson: she regretted 'breaking the school rule'."}], "vocab": [{"w": "persistently", "d": "again and again without stopping"}, {"w": "responsibly", "d": "in a sensible way that can be trusted"}, {"w": "prized possession", "d": "a thing you love and treasure"}, {"w": "swarmed", "d": "crowded around"}, {"w": "spellbound", "d": "so interested they could not look away"}, {"w": "centre of attention", "d": "the one everybody is looking at"}, {"w": "oblivious", "d": "not noticing"}, {"w": "boomed", "d": "sounded loud and deep"}, {"w": "ceased", "d": "stopped"}, {"w": "scrambled", "d": "moved in a quick, messy hurry"}, {"w": "beckoned", "d": "signalled with his hand"}, {"w": "surrender", "d": "hand over"}, {"w": "consumed", "d": "filled completely"}, {"w": "on the brink of tears", "d": "about to cry"}, {"w": "reluctantly", "d": "not wanting to"}, {"w": "stern", "d": "strict and serious"}, {"w": "meekly", "d": "quietly, without arguing"}, {"w": "fidgeted", "d": "could not sit still"}, {"w": "on pins and needles", "d": "
