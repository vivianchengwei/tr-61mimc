very nervous"}, {"w": "profusely", "d": "a lot; again and again"}, {"w": "chided", "d": "scolded"}, {"w": "confiscated", "d": "taken away as a punishment"}], "paras": ["“That is the one I want!” Kelly exclaimed, pointing to a mobile phone on display. Her eyes twinkled in delight when the friendly salesman took the phone out. It was the latest model with the most up-to-date features and functions. Kelly could not take her eyes off it and begged her parents persistently to get her one. The family was out shopping for Kelly’s birthday present. Kelly insisted that she was old enough to use a mobile phone responsibly. When Father finally nodded his head, Kelly chuckled with joy.", "Kelly could not wait to show off her new prized possession in school the next day. Despite knowing that she was breaking a school rule, Kelly whipped out her new phone from her bag to show it to her best friend, Nicole. Soon, everyone swarmed towards Kelly like bees to honey. They watched, spellbound as Kelly demonstrated the latest functions and features of her mobile phone. Burning with curiosity, they asked Kelly question after question. Kelly’s heart swelled when she became the centre of attention. All the girls started pushing and shoving as they tried to lay their hands on the phone. Abuzz with activity, the girls were oblivious that Mr Lee, their form teacher, was standing at the door watching them.", "“What is going on here?” Mr Lee’s voice boomed out. Chatter ceased immediately and everyone scrambled fearfully back to their seats. Silence weighed heavily in the air. Mr Lee stretched out his palm and beckoned Kelly to surrender her phone. Fear consumed Kelly knowing that she had broken a school rule. On the brink of tears, Kelly had no choice but to place the electronic device reluctantly onto Mr Lee’s outstretched palm. “See me after school!” Mr Lee instructed in a stern voice.", "Kelly’s face was red with embarrassment as she walked meekly back to her seat without a word of protest. Kelly fidgeted restlessly in her seat. She was on pins and needles for the rest of the day.", "Finally, it was dismissal time. Kelly was sick with anxiety as she approached Mr Lee’s cubicle. The moment Kelly entered the cubicle, she started apologising profusely. She thought Mr Lee might return her the mobile phone if she looked apologetic and sincere.", "Mr Lee chided Kelly for bringing a mobile phone to school without seeking permission. He informed Kelly’s parents that the phone would be confiscated until the end of school term. Kelly’s face fell and her shoulders dropped when she heard the bad news. She regretted taking her mobile phone to school and breaking the school rule."], "level": "p3"}, {"id": "p3-fire", "fromW": true, "num": 27, "title": "Fire!", "family": "fixes", "path": "Ticking Clock", "source": "W@W · Primary 3 · Week 27 · Compo Test 3B", "topic": "Write a composition of at least 150 words about a fire.", "theme": "Fire is a good servant but a bad master. Never leave a kettle or a stove on and walk away.", "audio": "p3-fire", "pov": "third", "words": 425, "stages": [{"key": "setting", "paras": [0], "pic": "☀️🎒💨", "hook": "A hot walk home. Then: black smoke from a flat!", "summary": "It is a baking hot afternoon. Gary is walking home from school, tired. Suddenly he sees thick black smoke pouring from a flat.", "trick": "The topic arrives in the very first paragraph: the word ‘fire’. The reader does not have to wait for it."}, {"key": "rising", "paras": [1], "pic": "🔥😨📞", "hook": "It is Grandmother’s flat! He races home. Mother dials 995.", "summary": "Flames are licking the walls of the next block, and Gary realises it is Grandmother’s flat. He runs home as fast as he can. Mother calls 995 at once, and Gary prays that Grandmother is safe.", "trick": "The trouble grows: the fire is big, and someone he loves is inside. Gary does the right thing. He gets an adult and they call 995."}, {"key": "climax", "paras": [2], "pic": "🚒🧑‍🚒💦", "hook": "Sirens! The firefighters charge into the smoke.", "summary": "The fire engine arrives within minutes. The firefighters rush into the burning building, spray the flames and feel their way through the smoke to look for survivors. The neighbours watch with bated breath.", "trick": "The peak is the fight against the fire. In the handout this part is bold AND italic: it answers the topic and it comes from a picture."}, {"key": "falling", "paras": [3], "pic": "👏👵😮‍💨", "hook": "The fire is out. Grandmother is carried out, safe.", "summary": "Loud cheers ring out when the fire is put out. The firemen carry Grandmother out. The paramedics give her an oxygen mask and take her to hospital. She is not badly hurt.", "trick": "The danger is over and the story cools down. We find out what happened to the person we were worried about."}, {"key": "ending", "paras": [4], "pic": "🕵️🫖💡", "hook": "A forgotten kettle caused it all. A lesson about fire.", "summary": "The police look for the cause. Everything is burnt to ashes. Grandmother was boiling water and forgot about it, so the kettle caught fire. Gary learns that fire is a good servant but a bad master.", "trick": "A fire story ends with the CAUSE and the LESSON. The last line says the topic word again: ‘fire’."}], "vocab": [{"w": "shuffled", "d": "walked slowly, dragging his feet"}, {"w": "wearily", "d": "in a tired way"}, {"w": "Out of the blue", "d": "suddenly, without any warning"}, {"w": "billowing", "d": "pouring out in big clouds"}, {"w": "gape", "d": "stare with his mouth open"}, {"w": "horrendous", "d": "horrible and shocking"}, {"w": "with a vengeance", "d": "with great force"}, {"w": "Uneasiness", "d": "a worried feeling"}, {"w": "coursed", "d": "ran quickly through"}, {"w": "breakneck speed", "d": "dangerously fast"}, {"w": "ghastly white", "d": "as pale as a ghost"}, {"w": "ribcage", "d": "the bones around your chest"}, {"w": "fervently", "d": "with all his heart"}, {"w": "wail", "d": "a long, high cry"}, {"w": "sprang into action", "d": "started working at once"}, {"w": "braved", "d": "faced without fear"}, {"w": "hampered", "d": "got in the way of; made harder"}, {"w": "Visibility", "d": "how far you can see"}, {"w": "Nonetheless", "d": "even so"}, {"w": "inferno", "d": "a huge, fierce fire"}, {"w": "commotion", "d": "noise and excitement"}, {"w": "with bated breath", "d": "hardly breathing, because of worry"}, {"w": "extinguished", "d": "put out"}, {"w": "charred", "d": "burnt black"}, {"w": "paramedics", "d": "ambulance workers who give first aid"}, {"w": "administered", "d": "gave"}, {"w": "whisked", "d": "took away quickly"}, {"w": "stench", "d": "a very bad smell"}, {"w": "reduced to ashes", "d": "burnt until nothing was left"}, {"w": "negligence", "d": "not taking enough care"}, {"w": "a good servant but a bad master", "d": "very useful when you control it, very dangerous when you do not"}], "paras": ["The sun was a huge ball of fire baking the surroundings. Gary shuffled his feet home wearily after school. Out of the blue, he noticed columns of charcoal-black smoke billowing from a flat. Instantly, the word ‘fire’ tunnelled through his mind.", "As he approached his home, Gary could only gape at the horrendous sight helplessly. Orange-red angry flames licked the walls with a vengeance at the next block. Uneasiness coursed over Gary when he suddenly realised that the fire was coming from Grandmother’s flat! Fear gripped his throat in a tight fist, strangling him and robbing him of every ounce of oxygen. Without hesitation, Gary raced home at breakneck speed to inform Mother of the fire. By the time he reached home, his face had turned ghastly white, and his heart was pounding rapidly against his ribcage. As soon as Mother heard what had happened, she immediately dialled 995 for the fire brigade. While waiting for the firefighters to arrive, Gary prayed fervently for the safety of Grandmother.", "Within minutes, the wail of sirens announced the arrival of the fire brigade. Without hesitation, the firefighters sprang into action. They braved the flames and dashed into the burning building. They sprayed jets of paralysing water at the raging flames. The thick black smoke and heat from the flames hampered the efforts of the firefighters. Visibility was so poor that they had to feel their way along the passageway to look for survivors. Nonetheless, they fought the angry inferno fearlessly. By then, the commotion had caught the attention of other residents and they stood at the car park, watching the entire rescue mission with bated breath.", "Loud cheers rang out when the fire was finally extinguished. The firemen carried Grandmother out of the charred apartment. With a sense of relief, Gary ran to her side. The paramedics administered first aid to Grandmother and placed an oxygen mask over her face. Fortunately, she was not seriously injured. They whisked her to the nearest hospital for medical treatment.", "The police were in the burnt apartment investigating the cause of the fire. Gary was in a state of disbelief to see the state of the apartment. The stench of charred items hung in the air. Everything had been reduced to ashes. They found that the fire was caused by Grandmother’s negligence. She was boiling water in a kettle and had completely forgotten about it. Unfortunately, the water had dried up and the kettle caught fire. After this incident, Gary learnt that fire is a good servant but a bad master."], "level": "p3"}, {"id": "p3-in-hot-soup", "fromW": true, "num": 29, "title": "In Hot Soup", "family": "growth", "path": "Hard Lesson", "source": "W@W · Primary 3 · Week 29", "topic": "Write a composition of at least 120 words about an act of mischief.", "theme": "Mischief in the wrong place can hurt you and other people.", "audio": "p3-in-hot-soup", "pov": "third", "words": 452, "stages": [{"key": "setting", "paras": [0], "pic": "🍜👩☝️", "hook": "A noisy food court. “Sit still and wait patiently.”", "summary": "The food court is packed at lunchtime. Mother tells Gary and Natalie to sit still, gives them a stern warning, and joins the long queue for fish ball noodles.", "trick": "Mother’s warning sets up the mischief. What they do next goes against it."}, {"key": "rising", "paras": [1], "pic": "😏🏃🏃‍♀️", "hook": "Bored. “How about a game of catch?”", "summary": "Gary gets bored and suggests a game of catch. The two run around the food court, giggling and yelling, not noticing the dangers or the angry faces.", "trick": "Here is the topic: the act of mischief. Gary chooses it 'with a mischievous glint in his eye'."}, {"key": "climax", "paras": [2, 3], "pic": "💥🍲😫", "hook": "CRASH! Hot soup flies and scalds Gary’s arm.", "summary": "Gary crashes into a man like a cannonball. The man’s bowl of piping hot soup overturns and splashes onto Gary, who howls in pain.", "trick": "The peak is the result of the mischief. Mischief leads to disaster."}, {"key": "falling", "paras": [4, 5], "pic": "😟🩹👨‍⚕️", "hook": "Blisters, a worried Mother, a trip to the clinic.", "summary": "Mother sees the red blisters on Gary’s arm. The man feels guilty and takes Gary to a clinic, where the doctor bandages his arm.", "trick": "The problem is being fixed. We see the cost of the mischief."}, {"key": "ending", "paras": [6], "pic": "🙇🙇‍♀️🤝", "hook": "They own up, apologise and promise.", "summary": "Natalie confesses to Mother. The children hang their heads and say sorry to the man. They promise never to play in the food court again.", "trick": "The ending says the topic word again: 'not to be mischievous'. The lesson is learnt."}], "vocab": [{"w": "bustled", "d": "moved about busily"}, {"w": "vendors", "d": "stall sellers"}, {"w": "tirelessly", "d": "without stopping to rest"}, {"w": "piping hot", "d": "very hot"}, {"w": "aroma", "d": "a nice smell"}, {"w": "wafted", "d": "floated through the air"}, {"w": "stern", "d": "strict and serious"}, {"w": "mischievous", "d": "naughty in a playful way"}, {"w": "glint", "d": "a quick sparkle"}, {"w": "bounded", "d": "jumped"}, {"w": "scurrying", "d": "running with quick, small steps"}, {"w": "chortles", "d": "happy laughs"}, {"w": "reverberated", "d": "echoed loudly all around"}, {"w": "din", "d": "a loud, unpleasant noise"}, {"w": "oblivious", "d": "not noticing"}, {"w": "hazards", "d": "dangers"}, {"w": "weaved", "d": "moved in and out between people"}, {"w": "bewilderment", "d": "confusion"}, {"w": "collision", "d": "crash"}, {"w": "scalding", "d": "burning hot"}, {"w": "ashen", "d": "very pale"}, {"w": "commotion", "d": "noisy confusion"}, {"w": "Ridden with guilt", "d": "feeling very guilty"}, {"w": "administered first aid", "d": "gave first aid"}, {"w": "deftly", "d": "quickly and skilfully"}, {"w": "unruly", "d": "badly behaved; out of control"}, {"w": "sheepishly", "d": "in a shy, embarrassed way"}], "paras": ["The lunchtime crowd bustled around the food court. The noise level reached a peak as customers hollered their orders and the vendors worked tirelessly to serve up plates of piping hot food. The aroma of fresh-cooked food wafted through the air. Gary and Natalie’s stomachs growled like a bear when they finally found a table. “Sit still and wait patiently. I will go and buy your favourite fish ball noodles,” commanded Mother as she wagged her finger at her children. She gave them a stern warning before leaving them to join the snake-like queue at the stall.", "Minutes passed and soon Gary grew bored. An idea struck him like a lightning bolt. With a mischievous glint in his eye, he suggested to his sister, “How about a game of catch?” Natalie volunteered to be the catcher and readily bounded out of her seat. They began scurrying around the food court, giggling and yelling. The pattering of their footsteps and joyous chortles reverberated through the air. The mischievous children were making a great din and were oblivious to all the hazards around them. Gary weaved through the crowd, ignoring the sea of angry faces.", "“Look out!” Natalie hollered but it was too late. She could only watch helplessly as Gary crashed into a man like a cannonball. The bowl of piping hot soup that the man was carrying overturned and flew right out of his hands. Onlookers stared in bewilderment at the sudden collision and let out horrified gasps.", "The disaster unfolded in the presence of all at the food court. Time stood still for a moment as the scalding hot soup splashed onto Gary. “Ouch!” Gary howled in pain. Then, he wailed as the pain ripped through his entire arm.", "Natalie’s face was ashen pale to see her brother hurt. The commotion caught the attention of the children’s mother. Worry began to plaster all over Mother’s face. She shook her head in disbelief to see red blistered marks appearing on Gary’s arm where the hot soup had scalded him. Ridden with guilt, the man offered to take Gary to a nearby clinic for treatment.", "At the clinic, the doctor sprang into immediate action. He administered first aid and bandaged the arm deftly. Gary was grateful to the doctor for relieving his pain. Everyone heaved a sigh of relief to see Gary smiling again.", "Natalie confessed to Mother about their unruly behaviour at the food court. With their heads hung low in shame, the children apologised to the man. The man accepted their apology with a big heart but made them promise not to be mischievous and play in the food court again. The duo learnt their lesson and nodded their heads sheepishly."], "level": "p3"}, {"id": "p3-may-the-force-be-with-you", "fromW": true, "num": 31, "title": "May the Force be with You", "family": "growth", "path": "Hard Lesson", "source": "W@W · Primary 3 · Week 31", "topic": "Write a composition of at least 120 words about a fun time which ended unexpectedly.", "theme": "Have fun, but never forget to play safely.", "audio": "p3-may-the-force-be-with-you", "pov": "third", "words": 524, "stages": [{"key": "setting", "paras": [0], "pic": "🎂🎁😄", "hook": "A Star Wars birthday party. Gary is as happy as a clam.", "summary": "Everyone sings for Gary at his Star Wars birthday party. There are presents, a giant cake and delicious food. Gary is dressed as Darth Vader.", "trick": "First half of the topic: the fun time. The fun must be real before it can end."}, {"key": "rising", "paras": [1, 2], "pic": "⚔️🛴🛏️", "hook": "Lightsabers, a scooter spaceship and jumping on the bed.", "summary": "The children play a pretend game of Star Wars. Gary rides his scooter down the hallway and tosses his helmet aside. They jump and somersault on the bed, swinging lightsabers at one another.", "trick": "The fun grows wilder and less careful. The helmet coming off is a clue."}, {"key": "climax", "paras": [3], "pic": "💥👃🩸", "hook": "WHAM! A lightsaber hits Gary on the nose.", "summary": "A lightsaber strikes Gary squarely on the nose. Blood gushes out and he doubles over in pain. Everyone freezes, speechless.", "trick": "Second half of the topic, at the peak: 'All the fun quickly came to an abrupt end.'"}, {"key": "falling", "paras": [4, 5], "pic": "😱🩹😔", "hook": "Parents rush in. The children hang their heads.", "summary": "Gary had let the fun get to his head. His parents rush in and press on the wound to stop the bleeding. The children feel guilty for playing so roughly.", "trick": "We see what happens straight after the sudden ending."}, {"key": "ending", "paras": [6], "pic": "🏥👋💭", "hook": "The party ends early with a trip to hospital.", "summary": "The guests are asked to leave early and Gary is rushed to the hospital. His parents do not scold him. He has learnt his lesson the hard way.", "trick": "The topic comes back: 'The party had to come to an early end.' Then the lesson."}], "vocab": [{"w": "reverberated", "d": "echoed loudly all around"}, {"w": "exuberantly", "d": "with lots of joy and energy"}, {"w": "groaned under the weight", "d": "was piled so high it seemed too heavy"}, {"w": "megawatt smile", "d": "a huge, bright smile"}, {"w": "decked out", "d": "dressed up"}, {"w": "as happy as a clam", "d": "very happy"}, {"w": "scrumptious", "d": "delicious"}, {"w": "painstakingly", "d": "with great care and effort"}, {"w": "donned", "d": "put on"}, {"w": "majestically", "d": "in a grand way"}, {"w": "flaunted", "d": "showed off"}, {"w": "Engrossed", "d": "so busy with something that you notice nothing else"}, {"w": "somersaulted", "d": "rolled head over heels"}, {"w": "duel", "d": "a fight between two sides"}, {"w": "squarely", "d": "directly"}, {"w": "searing", "d": "burning and sharp"}, {"w": "doubled over", "d": "bent forward in pain"}, {"w": "abrupt", "d": "sudden"}, {"w": "ominous", "d": "feeling like something bad is happening"}, {"w": "Paralysed with fear", "d": "too scared to move"}, {"w": "rendered speechless", "d": "made unable to speak"}, {"w": "get to his head", "d": "make him forget to be careful"}, {"w": "commotion", "d": "noisy confusion"}, {"w": "stanch", "d": "stop the flow of"}, {"w": "Guilt-ridden", "d": "feeling very guilty"}, {"w": "reprimand", "d": "scold"}], "paras": ["“Happy birthday to you, happy birthday to you, happy birthday to Gary...” the birthday song reverberated throughout the spacious living room. Everyone clapped exuberantly to the happy tune and sang at the top of their lungs. The table groaned under the weight of the presents piled high on it as well as the gigantic birthday cake. Gary stood smartly behind the Star Wars themed birthday cake. A megawatt smile was plastered on the birthday boy’s face. He was all decked out in his favourite Darth Vader costume. Surrounded by a sea of smiling faces from his cousins and friends, Gary was as happy as a clam. His cheeks flushed rosy pink with all the attention showered on him. He blew out the candles in one big puff. The guests tucked into the scrumptious food that his mother had painstakingly prepared for his party.", "Gary donned his helmet and raised his lightsaber in challenge. He swished the glow stick majestically in the air and flaunted his moves. The pretend game of Star Wars had begun. Gary and a few of his closer friends were Jedis battling off the Stormtroopers, who were Gary’s cousins and other young guests. Gary pretended that his skate scooter was the Millennium Falcon, using it to blaze down the hallway, chasing after his enemy. Engrossed by all the fun, Gary pulled his helmet off and tossed it aside. “Beg for mercy and you will be spared!” he hollered. The bed became their Star Destroyer as they jumped up on the bed and somersaulted through the air.", "Every child was armed with a lightsaber. The Jedis and Stormtroopers were thrusting and thrashing their lightsabers at one another. As the duel got more intense, there was little room for dodging and skirting away.", "With a wham, a lightsaber struck Gary squarely on the nose. A jolt of searing pain went up his nose and Gary doubled over in agony. Crimson blood gushed out from his bruised nose. All the fun quickly came to an abrupt end. Other than his cries of pain, silence hung like an ominous cloak across the room. Paralysed with fear, everyone stood rooted to the spot. Everyone was rendered speechless by the accident.", "Gary had let all the fun and play get to his head. He had totally forgotten to act with caution.", "Gary’s parents came rushing to the playroom when they heard the commotion. Their eyes bulged out of their sockets to see blood oozing out of Gary’s nose. They quickly applied pressure on the wound to stanch the blood flow. Guilt-ridden, the children hung their heads low in shame. Regret filled their hearts that they had played so roughly.", "All the guests were asked to leave early as Gary’s blood flow did not seem to stop. The wound might require stitches and Gary needed to be rushed to the doctor. The party had to come to an early end with a trip to the accident and emergency department at the hospital. Gary’s parents did not reprimand him anymore. Given the pain that he was in, they were sure that Gary had learnt his lesson the hard way."], "le choice comes getting caught. The topic comes back in new words: ‘damaging library property’ and ‘vandalism’."}, {"key": "ending", "paras": [6], "pic": "🙇😔🤝", "hook": "Head hung low. A promise never to do it again.", "summary": "Austin hangs his head in remorse. He says sorry and promises never to destroy a library book again.", "trick": "The last line says the topic again: ‘destroy any library books’."}], "vocab": [{"w": "remedial lesson", "d": "an extra lesson to help with schoolwork"}, {"w": "crisp", "d": "fresh and stiff"}, {"w": "pastime", "d": "something you enjoy doing in your free time"}, {"w": "browsed", "d": "looked through slowly, without hurrying"}, {"w": "fascinated", "d": "very, very interested"}, {"w": "Vintage", "d": "old and special"}, {"w": "crestfallen", "d": "very disappointed and sad"}, {"w": "mischievous", "d": "naughty"}, {"w": "resist", "d": "stop yourself"}, {"w": "pristine", "d": "perfectly clean and new"}, {"w": "tugged at his heart", "d": "made him want it very badly"}, {"w": "scanned", "d": "looked all around quickly"}, {"w": "distracted", "d": "busy with something else, so not noticing"}, {"w": "infuriated", "d": "extremely angry"}, {"w": "inconsiderate", "d": "not thinking about other people"}, {"w": "confronted", "d": "went up to him and spoke about what he had done wrong"}, {"w": "outraged", "d": "shocked and very angry"}, {"w": "vandalism", "d": "damaging things that are shared by everyone, on purpose"}, {"w": "remorse", "d": "a deep feeling of being sorry"}], "paras": ["A rush of cold air blasted against Austin’s face as he swung the door open and entered the school library. Austin decided to look for some books to read while waiting for his remedial lesson to start. The library was peaceful and quiet, with only the sound of crisp pages being flipped ringing in the air. Rows of tall shelves of books greeted Austin’s eyes. He loved being in the library and enjoyed reading books as a pastime. The librarian, Ms May, smiled at him brightly as he walked to the shelves.", "Austin browsed the variety of books available, looking for educational books about cars. Austin was fascinated by cars and their engines. Just then, Austin spotted a brand-new book titled “Vintage Cars”. He eagerly flipped the pages to read its contents. An image of a 1957 Chevrolet Bel Air caught his attention. His eyes widened as he stared at the image of the car. He had never seen such a high-quality picture before. Austin wanted to keep the picture and add it to his collection of vintage car photos. He was crestfallen when he realised that he could not keep it with him as it was a library book.", "Just then, a mischievous idea struck him. He could quietly tear the page out of the book and keep it with him. No one would know! He knew it was not the right thing to do but could not resist it. The pristine image of the car tugged at his heart.", "Austin scanned his surroundings. He saw that his schoolmates were distracted by their work. Convinced that no one was looking, Austin slowly tore the page of the library book.", "Unknown to him, Ms May was observing his actions from her desk. She stood up from her seat to get a better view of what Austin did. A loud gasp escaped from her lips.", "Ms May was infuriated with Austin for his inconsiderate act. She approached him and confronted him for damaging library property. Still outraged by his actions, Ms May demanded Austin to follow her to the Principal’s Office. When they reached the office, Ms May explained what had happened to the principal. He was disappointed with Austin’s actions. The principal told Austin that it was considered vandalism and he had to be punished for his actions.", "Austin hung his head low in remorse, regretting his actions. He apologised to them and promised he would not destroy any library books in future."], "level": "p3"}, {"id": "p3-eat-drink-be-miserable", "fromW": true, "num": 38, "title": "Eat Drink Be Miserable", "family": "growth", "path": "Hard Lesson", "source": "W@W · Primary 3 · Week 38", "topic": "Write a composition of at least 120 words about overeating.", "theme": "Stop when you are full, and buy food only from clean stalls.", "audio": "p3-eat-drink-be-miserable", "pov": "third", "words": 411, "stages": [{"key": "setting", "paras": [0], "pic": "🍔🍟😋", "hook": "A hungry boy, a crowded restaurant, a tray wiped clean.", "summary": "Austin is starving. His favourite fast food restaurant is packed. He gobbles up a double cheeseburger, fries and a drink within minutes. Not a crumb is left.", "trick": "The eating starts in paragraph 1. Austin is already full here. Remember that for the next step."}, {"key": "rising", "paras": [1], "pic": "🔔🍦🪰", "hook": "Three scoops of ice cream from a dirty cart.", "summary": "Austin walks out full and happy. Then he hears an ice cream bell. The vendor is untidy and smoking, he wears no gloves, and flies hover over his cart. Austin ignores it all and asks for three scoops.", "trick": "Overeating means eating MORE when you are already full. Here it is: three scoops on top of a big meal. A second problem is planted too: the food is not clean."}, {"key": "climax", "paras": [2], "pic": "🤢😖🚽", "hook": "A jab of pain. He runs to the toilet and vomits.", "summary": "At home, Austin feels queasy. He knows he has overeaten. A terrible pain stabs his stomach, which churns like a ship in a storm. He runs to the toilet and vomits.", "trick": "The peak: his body pays for the overeating. The handout puts the topic sentence in bold: ‘Austin knew that he had overeaten.’"}, {"key": "falling", "paras": [3, 4], "pic": "😰🏥💉", "hook": "Mother rushes him to the clinic. A warning and an injection.", "summary": "Mother panics when she sees how green he looks, and takes him to the clinic. Austin tells the doctor the truth. The doctor warns him against overeating and against buying from dirty, unlicensed stalls, then gives him an injection and painkillers.", "trick": "These are the consequences. The topic word comes back: ‘The doctor warned Austin against overeating.’"}, {"key": "ending", "paras": [5], "pic": "🙇💛🥗", "hook": "Sorry, Mother. I will be careful with my diet.", "summary": "Austin is full of remorse. He says sorry to Mother for worrying her and promises to be careful about what he eats.", "trick": "The lesson ties back to the topic: be careful with your diet."}], "vocab": [{"w": "growling", "d": "rumbling with hunger"}, {"w": "desperate", "d": "wanting something very badly"}, {"w": "grab a bite", "d": "get something quick to eat"}, {"w": "packed like sardines", "d": "very, very crowded"}, {"w": "Boisterous", "d": "loud and lively"}, {"w": "aroma", "d": "a nice smell"}, {"w": "scrumptious", "d": "delicious"}, {"w": "wolfed down", "d": "ate very fast"}, {"w": "beverage", "d": "a drink"}, {"w": "morsel", "d": "a small piece of food"}, {"w": "sauntered", "d": "walked in a slow, relaxed way"}, {"w": "gleefully", "d": "very happily"}, {"w": "melodious", "d": "sweet-sounding"}, {"w": "peal", "d": "a loud ringing sound"}, {"w": "exhilarated", "d": "thrilled"}, {"w": "vendor", "d": "a seller"}, {"w": "unkempt", "d": "messy and untidy"}, {"w": "reeked", "d": "smelled very bad"}, {"w": "turned a blind eye", "d": "pretended not to see"}, {"w": "Throwing caution to the wind", "d": "taking a risk without thinking about the danger"}, {"w": "queasy", "d": "feeling as if you are going to be sick"}, {"w": "excruciating", "d": "extremely painful"}, {"w": "churned", "d": "turned over and over"}, {"w": "agony", "d": "great pain"}, {"w": "bolted", "d": "ran very fast"}, {"w": "pungent", "d": "strong and sharp"}, {"w": "misery", "d": "great unhappiness"}, {"w": "confessed", "d": "admitted"}, {"w": "unhygienic", "d": "dirty; not clean enough to be safe"}, {"w": "unlicensed", "d": "not allowed by law to sell"}, {"w": "contaminated", "d": "made dirty with germs"}, {"w": "prescribing", "d": "(a doctor) telling him which medicine to take"}, {"w": "Remorse", "d": "a deep feeling of being sorry"}], "paras": ["Austin stepped eagerly into his favourite fast food restaurant. His stomach was growling, and he was desperate to grab a bite. The fast food restaurant was packed like sardines. Boisterous chatter and laughter erupted from the crowd. The aroma of scrumptious food filled the air. After purchasing his food, Austin found an empty seat and quickly sat down to have his meal. He wolfed down his double cheeseburger, french fries, and beverage within minutes. Not a single morsel was left on his tray.", "Austin sauntered out of the fast food restaurant, feeling satisfied. He burped loudly and rubbed his stomach gleefully. At that moment, the melodious peal of a bell rang in the air. Austin was exhilarated to see an ice cream vendor. The unkempt vendor was pinching a half-lit cigarette in his mouth. His breath and clothes reeked of cigarette smoke. Flies were hovering above the ice cream cart. However, Austin turned a blind eye to what he saw. Throwing caution to the wind, he asked for three scoops of ice cream. The vendor served Austin without wearing any gloves. Austin munched happily on his ice cream as he made his way home.", "When Austin reached home, he felt discomfort in the stomach. A queasy feeling rose within him. Austin knew that he had overeaten. Moments later, he felt a jab of excruciating pain. His stomach churned like a ship caught in the stormy sea. He clutched his stomach in agony, bolted to the toilet and vomited.", "Mother became panicky when she saw him looking so green. “Are you alright?” Mother asked in concern. Austin barely had the energy to reply to her. Without hesitation, Mother brought Austin to the clinic.", "A pungent smell of medication filled Austin’s nostrils the moment he entered the clinic. He was drowning in his own misery while waiting for his turn. Soon, it was Austin’s turn. The doctor told Austin to lie down while he examined the sick boy’s stomach. He asked Austin what he had eaten that day. Austin confessed the truth. The doctor warned Austin against overeating. In addition, he said that Austin should not have bought any food from an unhygienic and unlicensed vendor. He suspected that Austin may have consumed contaminated food. The doctor gave Austin an injection before prescribing some painkillers.", "Remorse was written all over Austin’s face and he apologised to his mother for causing her worry. Austin promised to be careful with his diet in the future."], "level": "p3"}, {"id": "p3-junior-master-chef", "fromW": true, "num": 39, "title": "Junior Master Chef", "family": "guts", "path": "Uphill Climb", "source": "W@W · Primary 3 · Week 39", "topic": "Write a composition of at least 120 words about taking part in a competition.", "theme": "Stay calm and work as a team. Even a bunch of celery can win.", "audio": "p3-junior-master-chef", "pov": "third", "words": 412, "stages": [{"key": "setting", "paras": [0], "pic": "👩‍🍳📣🎉", "hook": "A noisy canteen, white aprons, a cooking contest.", "summary": "The canteen is buzzing. Everyone crowds around the tables in the middle and chants for Class 3C. Ariel and Daisy, in white aprons and chef hats, are representing their class in the inter-class cooking competition.", "trick": "The topic is named in paragraph 1: they are IN ‘the inter-class culinary competition’. We know at once who is taking part."}, {"key": "rising", "paras": [1, 2], "pic": "🦋🎁🥬", "hook": "Butterflies… and the mystery box holds celery!", "summary": "The girls hold hands nervously. The teacher gives them 30 minutes and a mystery box. Inside is a bunch of celery sticks, and the crowd groans. The girls do not give up. They put their heads together and plan a vegetable garden snail.", "trick": "A competition story needs a challenge. Here it is: plain old celery. The trouble grows, but so does their courage."}, {"key": "climax", "paras": [3], "pic": "🔪🥕🐌", "hook": "Slice, spread, build. Voilà, a celery snail!", "summary": "They split the work. Ariel slices the apples and celery while Daisy cuts the carrots into thin strips. As the minutes tick by, they piece the snail together and add the finishing touches. Done! They beam with pride.", "trick": "The peak is the taking part itself: we watch them compete, step by step, against the clock."}, {"key": "falling", "paras": [4], "pic": "🧑‍⚖️😬🏆", "hook": "The judges come round. “And the champion goes to…”", "summary": "The judges walk around. The girls are anxious, but they put on big smiles and explain their dish. Then the results: Class 3C, Ariel and Daisy! Their classmates whoop and cheer.", "trick": "After the hard work, we wait for the result. A competition story must tell us how it ended."}, {"key": "ending", "paras": [5], "pic": "🤗😆✨", "hook": "Champions! They hug and can hardly believe it.", "summary": "Ariel and Daisy are over the moon. They hug each other, hardly able to believe that they have won.", "trick": "The last line says the topic word again: ‘won the competition’."}], "vocab": [{"w": "buzzing", "d": "full of excited noise"}, {"w": "glued", "d": "fixed on; not looking away"}, {"w": "cluster", "d": "a small group close together"}, {"w": "chant", "d": "words that a crowd shouts again and again"}, {"w": "reverberated", "d": "echoed loudly all around"}, {"w": "decked", "d": "dressed"}, {"w": "pristine", "d": "perfectly clean"}, {"w": "culinary", "d": "to do with cooking"}, {"w": "butterflies in their stomachs", "d": "a fluttery, nervous feeling"}, {"w": "participants", "d": "the people taking part"}, {"w": "boomed", "d": "sounded loud and deep"}, {"w": "hereby declare", "d": "officially announce"}, {"w": "peered", "d": "looked closely"}, {"w": "groan", "d": "a long, unhappy sound"}, {"w": "Undaunted", "d": "not afraid; not put off"}, {"w": "put their heads together", "d": "worked it out as a team"}, {"w": "formulated", "d": "worked out"}, {"w": "incorporate", "d": "include; use as a part"}, {"w": "julienned", "d": "cut into thin strips"}, {"w": "furrowed", "d": "wrinkled, from thinking hard"}, {"w": "ceramic", "d": "made of a very hard material, like a plate"}, {"w": "vertically", "d": "standing straight up"}, {"w": "finishing touches", "d": "the last small details"}, {"w": "Voilà", "d": "French for “there it is!”"}, {"w": "masterpiece", "d": "a piece of work to be very proud of"}, {"w": "anxiety", "d": "worry"}, {"w": "megawatt smiles", "d": "huge, bright smiles"}, {"w": "whooped", "d": "shouted with joy"}, {"w": "ecstatic", "d": "extremely happy"}], "paras": ["The school canteen was buzzing with excitement. Students were crowding around trying to get the best view of the action. All eyes were glued to the cluster of tables positioned in the middle of the canteen. “Go, Class 3C, go!” a loud chant reverberated through the air. Ariel and Daisy smiled and waved at their classmates. Both girls were decked in pristine white aprons and chef hats. They were representing their class in the inter-class culinary competition. This year’s theme was ‘Eat Healthy Creatively’.", "Ariel and Daisy clutched each other’s hands tightly as they watched the teacher step forward. They were having butterflies in their stomachs. All around the participants, the different classes were cheering hard, shouting encouragement to their friends. At that moment, the teacher’s voice boomed into the microphone, “You have exactly 30 minutes to create your dish using the item in your mystery box. I hereby declare the start of the competition!” Ariel and Daisy lifted the cover and peered into the mystery box. A groan went through the crowd when Ariel lifted a bunch of celery sticks out of the box.", "Undaunted by the task ahead of them, Ariel and Daisy put their heads together and formulated a recipe to incorporate the celery sticks. They decided to create a vegetable garden snail using celery, apple, peanut butter, carrot, and corn kernels.", "They started their work after splitting the task. Ariel was in charge of slicing the apples and celery, while Daisy carefully julienned the carrots. Their brows furrowed in concentration. Both girls took extra caution as they worked with the ceramic knives. As the minutes ticked by, they started to piece the various parts together. Ariel spread peanut butter to fill the hollow in the celery. After that, an apple slice was added vertically to create the snail shell. Both girls worked steadily to add the finishing touches that would make their creation come to life. Voilà! It was done. Both girls beamed with pride at their masterpiece.", "The judges walked around viewing the different creations. Ariel and Daisy could hardly control their anxiety when the judges came to their table. Nevertheless, the girls put on megawatt smiles and explained their creation to the judges. Soon, it was results time. “And the champion goes to… Class 3C Ariel and Daisy!” the teacher announced. Their classmates whooped and cheered in delight.", "Ariel and Daisy were ecstatic! Hugging each other, they could not believe that they had won the competition."], "level": "p3"}, {"id": "p3-the-hidden-book", "fromW": true, "num": 40, "title": "The Hidden Book", "family": "growth", "path": "Hard Lesson", "source": "W@W · Primary 3 · SA2 Exam model", "topic": "Write a composition of at least 150 words about a selfish act.", "theme": "A library book is for everyone. Keeping it all to yourself is selfish.", "audio": "p3-the-hidden-book", "pov": "third", "words": 401, "stages": [{"key": "setting", "paras": [0], "pic": "📚🚪😊", "hook": "Cool air, quiet shelves, a smiling librarian.", "summary": "Austin goes into the school library to read while he waits for his remedial lesson. It is peaceful, and rows of tall shelves greet him. The librarian, Ms May, smiles at him.", "trick": "The same library and the same boy as in ‘Rip It If You Dare’. Ms May is planted here. She will matter later."}, {"key": "rising", "paras": [1, 2], "pic": "🚗😍🪪", "hook": "The perfect car book… and no library card.", "summary": "Austin finds a brand-new book called “Vintage Cars” and knows he must borrow it. Then he remembers that he has forgotten his library card. He is afraid the book will be gone next time. A mischievous idea strikes him: hide it, so that no one else can find it.", "trick": "The problem grows. The handout puts the topic word in bold here: ‘He knew he was being selfish but could not resist it.’"}, {"key": "climax", "paras": [3], "pic": "👀🙇📕", "hook": "He looks around… and hides the book behind a shelf.", "summary": "Austin checks that nobody is looking. His schoolmates are busy with their work. He bends down slowly and hides the book behind a bookshelf.", "trick": "Here is the selfish act, right at the peak. He keeps the book for himself, so nobody else can read it."}, {"key": "falling", "paras": [4, 5], "pic": "😲😠☝️", "hook": "Ms May saw everything. A dressing down.", "summary": "Ms May has been watching from her desk, and she gasps. She is furious. She confronts Austin about his selfish and inconsiderate act, scolds him and says she will tell his form teacher.", "trick": "After the wrong choice comes getting caught. The topic word comes back: ‘his selfish and inconsiderate act’."}, {"key": "ending", "paras": [6], "pic": "🙇😔🤝", "hook": "Head hung low. A promise to think of others.", "summary": "Austin hangs his head in remorse. He says sorry to Ms May and promises not to be so inconsiderate again.", "trick": "The last line gives the lesson. ‘Inconsiderate’ says the topic in another word: not thinking about other people."}], "vocab": [{"w": "remedial lesson", "d": "an extra lesson to help with schoolwork"}, {"w": "crisp", "d": "fresh and stiff"}, {"w": "pastime", "d": "something you enjoy doing in your free time"}, {"w": "browsed", "d": "looked through slowly, without hurrying"}, {"w": "fascinated", "d": "very, very interested"}, {"w": "Vintage", "d": "old and special"}, {"w": "crestfallen", "d": "very disappointed and sad"}, {"w": "dismay", "d": "a sad, worried feeling when something goes wrong"}, {"w": "mischievous", "d": "naughty"}, {"w": "selfish", "d": "thinking only about yourself"}, {"w": "resist", "d": "stop yourself"}, {"w": "scanned", "d": "looked all around quickly"}, {"w": "distracted", "d": "busy with something else, so not noticing"}, {"w": "infuriated", "d": "extremely angry"}, {"w": "inconsiderate", "d": "not thinking about other people"}, {"w": "confronted", "d": "went up to him and spoke about what he had done wrong"}, {"w": "a dressing down", "d": "a strong scolding"}, {"w": "form teacher", "d": "the teacher in charge of his class"}, {"w": "remorse", "d": "a deep feeling of being sorry"}], "paras": ["A rush of cold air blasted against Austin’s face as he swung the door open and entered the school library. Austin decided to look for some books to read while waiting for his remedial lesson to start. The library was peaceful and quiet, with only the sound of crisp pages being flipped ringing in the air. Rows of tall shelves of books greeted Austin’s eyes. He loved being in the library and enjoyed reading books as a pastime. The librarian, Ms May, smiled at him brightly as he walked to the shelves.", "Austin browsed the variety of books available, looking for educational books about cars. Austin was fascinated about cars and their engines. Just then, Austin spotted a brand-new book titled “Vintage Cars”. He eagerly flipped the pages to read its contents. An image of a 1957 Chevrolet Bel Air caught his attention. His eyes widened as he stared at the image of the car. Instantly, Austin knew he had to borrow this book home to read.", "Just as Austin was about to head to the counter to borrow the book, it struck him that he had forgotten to bring his library card. Without the library card, he would not be able to borrow the book. Austin was crestfallen at that thought. He frowned in dismay that he might not be able to find the book the next time he returned to the library. Just then, a mischievous idea struck him. He could hide the book so that no one could find it. He knew he was being selfish but could not resist it.", "Austin scanned his surroundings. He saw that his schoolmates were distracted by their work. Convinced that no one was looking, Austin slowly bent down and hid the book behind a bookshelf.", "Unknown to him Ms May was observing his actions from her desk. She stood up from her seat to get a better view of what Austin did. A loud gasp escaped from her lips.", "Ms May was infuriated with Austin for his inconsiderate act. She approached him and confronted him regarding his selfish and inconsiderate act. She was disappointed with Austin’s actions. She gave Austin a dressing down and said that she would be informing his form teacher about this.", "Austin hung his head low in remorse, regretting his actions. He apologised to Ms May and promised he would not be so inconsiderate in the future."], "level": "p3"}, {"id": "p4-take-that", "fromW": true, "num": 46, "title": "Take That", "family": "bonds", "path": "Crack & Repair", "source": "W@W · Primary 3 · Week 46 · P4 level", "topic": "Write a composition of at least 150 words about a friendly match.", "theme": "Victory is not in the final score but in the quality of the game. A friendly match can bring old friends close again.", "audio": "p4-take-that", "pov": "first", "words": 709, "stages": [{"key": "setting", "paras": [0], "pic": "🏟️🏓👟", "hook": "A buzzing stadium. A friendly match against our rivals.", "summary": "The Toa Payoh Indoor Stadium is full of excited chatter. The narrator will play a solo table tennis friendly match for Chancery Primary School against Dover Primary School, as a warm-up for the Inter-School Championship. He ties his shoelaces tightly and wipes his rackets clean.", "trick": "The topic words ‘a friendly match’ are in the very first sentence. The reader knows at once what the story is about."}, {"key": "rising", "paras": [1, 2, 3, 4], "pic": "📯😲😜", "hook": "The opponent is my old pal James! He wins game one, then game two.", "summary": "The umpire sounds the horn. The opponent is his old pal James, who moved away. The narrator teases him, “Good luck, you will need it.” James grins, “Bring it on!” They play with enthusiasm, but James, the better player, leads two games to zero. In the third game they start clowning around: James serves standing on one leg like a flamingo, and the narrator stretches his arms like an elephant’s trunk. The crowd laughs as they battle in a rally of thirty strokes. “Take that!”", "trick": "Look how FRIENDLY the match is: teasing, grinning, funny actions and a laughing crowd. The tension grows too, because James needs only one more game to win."}, {"key": "climax", "paras": [5], "pic": "💥🏓😵", "hook": "A kill shot! James wins. I ‘faint’ and James ‘saves’ me.", "summary": "It is still a real competition. James produces a kill shot and the ball speeds past. “Ahh!” The narrator clutches his chest in mock defeat. James has won the match. The narrator falls to the ground and pretends to pass out, and James runs over and pretends to do CPR.", "trick": "The peak is the winning shot. Even when he loses, the narrator turns it into a joke. That is what makes the match friendly."}, {"key": "falling", "paras": [6], "pic": "👏🤗🏆", "hook": "The crowd cheers. Two old friends hug.", "summary": "The spectators roar with laughter and stand up to clap. James pulls the narrator up and they hug, congratulating each other on a match well played. He did not win, but he is glad: victory is in the quality of the game, not the final score.", "trick": "The match is over and we see what it meant: the friendship matters more than the score."}, {"key": "ending", "paras": [7], "pic": "😄🙏✨", "hook": "Praised for good sportsmanship. Thank you, James!", "summary": "They walk off the court still laughing. James’ coach praises the narrator’s positive behaviour. In high spirits, he thanks James and the coach and tells them how much he enjoyed the friendly match.", "trick": "The last line says the topic again: ‘how much I enjoyed the friendly match’."}], "vocab": [{"w": "buzzing with excited chatter", "d": "full of excited talking"}, {"w": "streamed in", "d": "came in, one after another, in a long line"}, {"w": "rivals", "d": "the team you compete against"}, {"w": "solo", "d": "on your own, one against one"}, {"w": "worthy opponent", "d": "a player good enough to give you a real game"}, {"w": "Championship", "d": "a big competition to find the best"}, {"w": "warm us up", "d": "get us ready"}, {"w": "arena", "d": "the place where a match is played"}, {"w": "tournament", "d": "a set of matches in a competition"}, {"w": "ensuring", "d": "making sure"}, {"w": "umpire", "d": "the person in charge of the game who makes sure everyone follows the rules"}, {"w": "signalling", "d": "showing that something is happening"}, {"w": "pal", "d": "a friend"}, {"w": "estate", "d": "an area of flats and houses"}, {"w": "Fully aware", "d": "knowing very well"}, {"w": "taunted", "d": "teased"}, {"w": "curled upwards", "d": "turned up into a smile"}, {"w": "misread", "d": "guessed wrongly"}, {"w": "enthusiasm", "d": "great excitement and interest"}, {"w": "light-heartedly", "d": "in a cheerful, carefree way"}, {"w": "playful", "d": "full of fun"}, {"w": "high toss serve", "d": "a serve where you throw the ball up very high first"}, {"w": "flamingo", "d": "a pink bird that stands on one leg"}, {"w": "high-pitched", "d": "high and squeaky"}, {"w": "squealing", "d": "making a long, high cry"}, {"w": "humorous", "d": "funny"}, {"w": "triggered", "d": "started"}, {"w": "peals of laughter", "d": "loud bursts of laughing"}, {"w": "spectators", "d": "people watching a game or show"}, {"w": "shriek", "d": "a loud, high scream"}, {"w": "akin to", "d": "like"}, {"w": "comical", "d": "funny, making people laugh"}, {"w": "rally", "d": "a long run of hits back and forth before someone misses"}, {"w": "strokes", "d": "hits with the racket"}, {"w": "counter-smash", "d": "hit a smash straight back"}, {"w": "clowning around", "d": "acting silly to make people laugh"}, {"w": "antics", "d": "funny or silly actions"}, {"w": "Great minds think alike", "d": "clever people have the same idea at the same time"}, {"w": "kill shot", "d": "a hit so fast or clever that the other player cannot return it"}, {"w": "gushed", "d": "said with lots of feeling"}, {"w": "mock defeat", "d": "pretending to be beaten"}, {"w": "clenching", "d": "holding tightly"}, {"w": "collectively", "d": "all together"}, {"w": "triumphantly", "d": "in a happy, winning way"}, {"w": "exaggerated", "d": "made much bigger than it really is"}, {"w": "tickled", "d": "made people laugh"}, {"w": "heartily", "d": "in a big, warm way"}, {"w": "played along", "d": "joined in the joke"}, {"w": "administering", "d": "giving"}, {"w": "cardiopulmonary resuscitation", "d": "CPR: pressing on the chest to help someone breathe again"}, {"w": "roared with laughter", "d": "laughed very loudly"}, {"w": "applauding", "d": "clapping"}, {"w": "engaging", "d": "fun and interesting to watch"}, {"w": "embraced", "d": "hugged"}, {"w": "victory", "d": "winning"}, {"w": "attire", "d": "clothes"}, {"w": "Beaming", "d": "smiling very widely"}, {"w": "despite", "d": "even though"}, {"w": "high spirits", "d": "a very happy mood"}, {"w": "exhilarating", "d": "very exciting"}], "paras": ["The Toa Payoh Indoor Stadium was buzzing with excited chatter as everyone streamed in to watch a friendly match between my school, Chancery Primary School, and our rivals, Dover Primary School. I would be playing the solo friendly match representing my school team against a worthy opponent from Dover Primary School. The Inter-School Championship was coming up soon, and these friendly matches would serve to warm us up to our competitors. I walked into the arena and began preparing myself for the tournament. Slipping my feet into my sports shoes, I tightened my shoelaces, ensuring a proper grip around my ankles. Next, I took out my table tennis rackets and wiped them clean.", "Before long, the umpire sounded the blow horn, signalling the start of our friendly match. When I approached the table, I was pleasantly surprised to see that I would be competing against my old pal, James! We grew up in the same neighbourhood and were close friends before he moved to another estate. Fully aware that he was the more skilled player, I still taunted him, “Good luck, you will need it.”", "His lips curled upwards upon noticing me as he nodded his head saying, “Bring it on!” I picked up the table tennis ball and placed it on my flat palm. Then, I threw it up in the air and hit the ball with my racket, starting the game. James received it and returned a shot straight at me. We served back and forth until I misread the ball’s direction and missed a shot. The first point of the first game went to James. He grinned at me widely, satisfied to have scored the point. We played the game with enthusiasm, enjoying it light-heartedly. At the end of the second game, James was leading two to zero. He just needed to win another game to win the entire match.", "As we approached the final few rounds of the third game, James started getting more playful. He played a high toss serve and stood on one leg like a flamingo, making a high-pitched squealing noise. His humorous actions triggered peals of laughter from the spectators watching us. I returned his serve with a shriek and stretched my arms forward, akin to an elephant’s trunk. Our friendly match continued in an increasingly comical manner as James and I made funny actions and noises. We battled for the final point, having a long rally of at least thirty strokes of the racket. Every time I smashed the ball, James would quickly react and counter-smash it. “Take that!” he taunted, reacting to my techniques. The crowd laughed and cheered us on as we continued the rally.", "The friendly match was soon becoming a circus show as James and I were happy to be clowning around for a bit. Our funny antics filled the stadium with fun, joy, and laughter. However, a friendly match was still a competition between two schools. Great minds think alike.", "At that very moment, James produced a kill shot, and the ball sped past me. I missed the return! “Ahh!” I gushed in mock defeat, clenching my chest as though my heart was aching. My supporters sighed collectively while James’ supporters cheered triumphantly. Knowing James had won the match, I dramatically fell to the ground and pretended to pass out. My exaggerated reaction tickled the spectators, and everyone clapped and laughed heartily. James played along, running towards me and acting like he was administering cardiopulmonary resuscitation.", "The spectators roared with laughter, standing up and applauding us for the engaging table tennis friendly match. James pulled me up, and we embraced each other tightly, congratulating each other for a match well played. Although I did not win the match, I was glad to have played a fun match with an old friend. I knew that victory was not in the final score, but instead, it was in the quality of the game.", "We walked off the court to change our attire, still laughing about the match we played earlier. Beaming widely, James’ coach praised my positive behaviour despite losing the friendly match. Still in high spirits after a fun, exhilarating match, I thanked James and his coach, telling them how much I enjoyed the friendly match."], "level": "p4"}, {"id": "p4-operation-clean-up", "fromW": true, "num": 47, "title": "Operation Clean Up", "family": "bonds", "path": "Invisible Hero", "source": "W@W · Primary 3 · Week 47 · P4 level", "topic": "Write a composition of at least 150 words about cleaning the beach.", "theme": "Every piece of litter we pick up matters. Keeping the beach clean protects the animals that live there.", "audio": "p4-operation-clean-up", "pov": "third", "words": 681, "stages": [{"key": "setting", "paras": [0], "pic": "🌅🏖️🙋", "hook": "Sunrise at the beach. Student volunteers on a mission.", "summary": "Just after sunrise, the usually empty beach is full of chatter. Student volunteers for “Operation Clean Up” walk along the sand. They are not there to have fun: their mission is to clean up the huge pile of litter covering the shore.", "trick": "The topic is set up in the first paragraph: the mission of cleaning up the debris on the sandy shore."}, {"key": "rising", "paras": [1, 2, 3], "pic": "🧤🛍️🧴", "hook": "Gloves on! Bob and Barry fill their trash bags.", "summary": "Mr Tan asks if they are ready to collect half a tonne of litter. After a safety briefing, Bob and Barry head to the far end of the beach. They bend down and pick up a beach ball, a plastic wrapper, cutlery, bottles, even tyres and fishing nets. Soon they work fast and their trash bags fill up. Seagulls squawk around them.", "trick": "This is the cleaning itself, step by step. The writer SHOWS the actions (bending down, picking up) instead of just saying ‘they cleaned’."}, {"key": "climax", "paras": [4, 5], "pic": "🐦😟⭕", "hook": "A seagull is trapped by a rubber tube!", "summary": "A loud flapping and screeching. A white seagull has a rubber tube stuck around its foot. It tries to fly but crashes to the ground and walks helplessly towards the boys. Bob worries the tube will stop its blood flow, and no teacher is in sight.", "trick": "The peak: the litter is not just ugly, it is hurting an animal. The boys must decide what to do."}, {"key": "falling", "paras": [6], "pic": "🤲🐦✂️", "hook": "Operation Save the Seagull!", "summary": "Bob speaks softly to calm the bird and holds it gently. Barry stretches the rubber tube and pulls it off. “Operation Clean Up” becomes “Operation Save the Seagull”. The boys are like vets.", "trick": "The problem is solved by the boys themselves. Their kindness is the turning point."}, {"key": "ending", "paras": [7], "pic": "📯🕊️🌊", "hook": "Goodbye, seagull! A cleaner beach and a big lesson.", "summary": "The horn sounds for gathering time. The boys wave goodbye as the seagull flies over the sea. They did not fill their quota of trash, but they are thrilled. The beach is much cleaner, and they learn how important it is to keep it litter-free.", "trick": "The last line brings the topic back: keeping the beach and environment clean and litter-free."}], "vocab": [{"w": "caressing", "d": "gently touching, in a soft and loving way"}, {"w": "shimmering", "d": "shining and twinkling"}, {"w": "turquoise", "d": "a blue-green colour"}, {"w": "usually deserted", "d": "normally empty, with nobody there"}, {"w": "enthusiasm", "d": "great excitement and interest"}, {"w": "volunteers", "d": "people who help without being paid"}, {"w": "ambling", "d": "walking slowly and easily"}, {"w": "relaxation", "d": "resting and taking it easy"}, {"w": "mission", "d": "an important job you are sent to do"}, {"w": "unsightly", "d": "ugly to look at"}, {"w": "monstrous", "d": "huge and horrible"}, {"w": "debris", "d": "pieces of rubbish lying around"}, {"w": "square foot", "d": "a small square of ground, about the size of a tile"}, {"w": "half a tonne", "d": "500 kilograms: about as heavy as a small car"}, {"w": "litter", "d": "rubbish left lying around"}, {"w": "teacher-in-charge", "d": "the teacher who leads the activity"}, {"w": "boomed", "d": "said in a loud, deep voice"}, {"w": "signature", "d": "his own special, well-known"}, {"w": "exuberance", "d": "lively, cheerful energy"}, {"w": "chirped", "d": "said in a bright, happy voice"}, {"w": "equipped", "d": "having the things you need"}, {"w": "briefing", "d": "a short talk telling you what to do"}, {"w": "safety precautions", "d": "things you do to stay safe"}, {"w": "segregated", "d": "split up"}, {"w": "tasked", "d": "given the job"}, {"w": "stretch", "d": "a long piece (of beach)"}, {"w": "furthest", "d": "the most far away"}, {"w": "sense of purpose", "d": "knowing what you need to do and wanting to do it"}, {"w": "retrieve", "d": "pick up; get back"}, {"w": "flabbergasted", "d": "very, very surprised"}, {"w": "assortment", "d": "a mix of many different kinds"}, {"w": "cutlery", "d": "spoons, forks and knives"}, {"w": "shard", "d": "a sharp, broken piece"}, {"w": "practised", "d": "done well because you have done it many times"}, {"w": "swift", "d": "fast"}, {"w": "satisfaction", "d": "a happy feeling when you have done something well"}, {"w": "scattered", "d": "spread all over"}, {"w": "took curiosity in", "d": "were interested in"}, {"w": "occasional", "d": "now and then"}, {"w": "squawking", "d": "loud, harsh bird cries"}, {"w": "monotonous", "d": "boring, always the same"}, {"w": "labour", "d": "hard work"}, {"w": "screeching", "d": "a high, sharp, loud cry"}, {"w": "swivelled", "d": "turned quickly"}, {"w": "rendered speechless", "d": "so shocked they could not speak"}, {"w": "agitated", "d": "upset and restless"}, {"w": "gaped", "d": "stared with the mouth open"}, {"w": "astonishment", "d": "great surprise"}, {"w": "tottering", "d": "walking unsteadily, as if about to fall"}, {"w": "encircled", "d": "wrapped all the way round"}, {"w": "hampering", "d": "getting in the way of"}, {"w": "waddling", "d": "walking with short steps, rocking from side to side"}, {"w": "aimlessly", "d": "with nowhere in particular to go"}, {"w": "discomfort", "d": "pain; not feeling comfortable"}, {"w": "hover", "d": "stay in the air in one place"}, {"w": "plummeting", "d": "falling fast"}, {"w": "resignedly", "d": "as if it had given up"}, {"w": "Compassion", "d": "feeling sorry for someone and wanting to help"}, {"w": "welled up", "d": "rose up inside"}, {"w": "enthusiast", "d": "someone who loves something very much"}, {"w": "mused", "d": "said, while thinking"}, {"w": "hinder", "d": "stop; get in the way of"}, {"w": "blood flow", "d": "blood moving around the body"}, {"w": "coaxing", "d": "gentle and kind, to make it calm"}, {"w": "cautiously", "d": "carefully"}, {"w": "grasped", "d": "held firmly"}, {"w": "minimal", "d": "as small as possible"}, {"w": "Miraculously", "d": "amazingly, like a miracle"}, {"w": "put up a struggle", "d": "fought to get away"}, {"w": "pliable", "d": "easy to bend"}, {"w": "stretchable", "d": "able to be stretched"}, {"w": "soothed", "d": "calmed"}, {"w": "veterinarians", "d": "animal doctors (vets)"}, {"w": "conducting", "d": "carrying out"}, {"w": "wriggle", "d": "twist and turn"}, {"w": "blare", "d": "a loud, harsh sound"}, {"w": "assembly spot", "d": "the place where everyone gathers"}, {"w": "taking flight", "d": "flying off"}, {"w": "quota", "d": "the amount you are supposed to do"}, {"w": "euphoria", "d": "a feeling of great happiness"}, {"w": "vastly", "d": "very much"}, {"w": "witnessed", "d": "saw for themselves"}, {"w": "first-hand", "d": "themselves, not from someone else"}, {"w": "environment", "d": "the world around us: land, sea, air, plants and animals"}], "paras": ["It was just slightly after sunrise, and the warm caressing rays had lit the sea a dark shimmering turquoise. That morning, the usually deserted beach was filled with noisy chatter and enthusiasm. At first light, the student volunteers for “Operation Clean Up” were already ambling along the beach. It was soon clear that they were not there for fun and relaxation. Instead, they were there for a special mission – the mission of cleaning up the unsightly and monstrous pile of debris covering almost every square foot of the sandy shore.", "“Are you ready to take on the challenge of collecting half a tonne of beach litter?” Mr Tan, the teacher-in-charge, boomed with his signature exuberance.", "“Yes!” everyone chirped, equipped and prepared for action. After listening to the briefing on safety precautions, the students were segregated into smaller working groups.", "Pulling on their gloves, Bob and Barry headed south. They had been tasked to clean up the stretch of beach furthest away. Armed with plastic bags and a sense of purpose, they rolled up their sleeves and got to work. Bob went down on one knee, picking up a rubber beach ball that had lost its shape. Barry bent over to retrieve a piece of plastic wrapper. They were flabbergasted by the assortment of litter found lying on the beach, from common items such as plastic cutlery and bottles, to uncommon items like tyres and fishing nets. Barry took particular care when handling a metal shard. Their hand movements soon became practised and swift, feeling a sense of satisfaction as their trash bags slowly filled up. Apart from the volunteers, grey and white-coloured seagulls scattered across the beach, burying their bright orange beaks in the piles of waste that their sharp eyes took curiosity in. Their occasional squawking broke the monotonous labour.", "Just then, a loud flapping and screeching sound caught their ears. The boys swivelled their heads around and were rendered speechless. They saw a white bird with fluffy feathers looking agitated. They gaped in astonishment at the angry white bird tottering about with a rubber tube encircled around its foot, chaining it down and hampering its movements. It was waddling aimlessly, in great discomfort as it attempted to flap its wings and take off into the sky. However, the seagull could only hover for a few seconds while flapping its wings wildly before plummeting to the ground. It chirped helplessly and walked resignedly towards Bob and Barry, its brown eyes looking on helplessly.", "Compassion welled up in the boys as they glanced at each other in concern. Bob, an animal enthusiast, mused worriedly, “That tube needs to be removed immediately or it would hinder its blood flow.” The two boys looked around them, up and down the beach, but there was no teacher in sight.", "Without further delay, Bob went near the seagull and spoke in a coaxing voice, trying to calm its agitated state. Bob cautiously reached for the seagull and grasped its body gently, holding it still and keeping its movements minimal to prevent it from getting hurt. Miraculously, the seagull did not put up a struggle. Upon realising that the tube was pliable and stretchable, Barry pulled the rubber tube with all his strength while Bob soothed the bird and held its foot. “Operation Clean Up” had now become “Operation Save the Seagull”. The two boys were like veterinarians conducting an operation to rescue the seagull.", "After successfully helping the bird to wriggle out of the rubber tube, Bob and Barry heard the blare of the horn, signalling the gathering time. They quickly grabbed their trash bags and prepared to head for the assembly spot, but not before waving goodbye to the seagull, which was taking flight above the waters. Though they did not manage to meet their quota of trash for the day, they were high on the euphoria of helping the seagull. Furthermore, as a result of everyone else’s hard labour, the beach was vastly cleaner. Bob and Barry witnessed first-hand how important it was to keep the beach and environment clean and litter-free."], "level": "p4"}];

/* ===================== STATE / STORE ===================== */
let state = { name:"", picks:[], custom:[], stage:{}, hl:{}, words:[], level:"psle", ready:false, source:"local" };
let dbRef = null, unsubBank = null, unsubStories = null, unsubHl = null;
const LS = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
function lvOf(s){ return s.level || "psle"; }
function allStories(){ return BUILTIN.concat(state.custom); }
function storyById(id){ return allStories().find(s=>s.id===id); }
function byLevel(l){ return allStories().filter(s=>lvOf(s)===l); }
function byFamily(f, l=state.level){ return allStories().filter(s=>s.family===f && lvOf(s)===l); }
function picksFor(f, l=state.level){ return state.picks.map(storyById).filter(s=>s && s.family===f && lvOf(s)===l); }
function setLevel(l){ if(!LEVELS.some(x=>x.key===l)) return; state.level=l; LS.set("garden-level", l); render(); }

async function initStore(){
  const local = LS.get("garden-bank");
  if(local){ state.name = local.name||""; state.picks = local.picks||[]; }
  const lhl = LS.get("garden-hl"); if(lhl && typeof lhl==="object") state.hl = lhl;
  const lw = LS.get("garden-words"); if(Array.isArray(lw)) state.words = lw;
  render();
  try{
    const db = await claude.use("db");
    if(!db) return;
    dbRef = db;

const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let toastT; function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }
function route(){ const h=(location.hash||"#home").slice(1); if(h.startsWith("family-")) return {v:"family",f:h.slice(7)}; if(h.startsWith("story-")) return {v:"story",id:h.slice(6)}; if(h==="bank") return {v:"bank"}; if(h==="parents") return {v:"parents"}; return {v:"home"}; }
function vocabRanges(text, vocab){
  // first occurrence of each vocab word/phrase -> [{s,e,d}] on the plain text
  const out=[]; const used=new Set();
  const sorted = (vocab||[]).slice().sort((a,b)=>b.w.length-a.w.length);
  for(const v of sorted){
    const w=(v.w||"").trim(); if(!w || used.has(w.toLowerCase())) continue;
    const re = new RegExp("(?<!\\w)(" + w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/\s+/g,"\\s+") + ")(?!\\w)", "i");
    const m = re.exec(text); if(!m) continue;
    const s=m.index, e=s+m[0].length;
    if(out.some(r=>r.s<e && r.e>s)) continue;
    out.push({s,e,d:v.d}); used.add(w.toLowerCase());
  }
  return out.sort((a,b)=>a.s-b.s);
}
function renderPara(text, vocab, hls){
  // combine vocab tooltips and reader highlights on one plain-text paragraph
  const vr = vocabRanges(text, vocab);
  const hr = (hls||[]).map((h,i)=>({s:Math.max(0,Math.min(h.s,text.length)), e:Math.max(0,Math.min(h.e,text.length)), c:h.c, i:h.idx}));
  const cuts = new Set([0,text.length]); vr.forEach(r=>{cuts.add(r.s);cuts.add(r.e);}); hr.forEach(r=>{cuts.add(r.s);cuts.add(r.e);});
  const pts=[...cuts].sort((a,b)=>a-b); let html="";
  for(let k=0;k<pts.length-1;k++){
    const a=pts[k], b=pts[k+1]; if(b<=a) continue;
    let seg = esc(text.slice(a,b));
    const v = vr.find(r=>r.s<=a && r.e>=b);
    if(v) seg = `<span class="v" tabindex="0" data-d="${esc(v.d)}">${seg}</span>`;
    const h = hr.find(r=>r.s<=a && r.e>=b);
    if(h) seg = `<mark class="hl" data-hl="${h.i}" style="--hlc:${HL_COLORS[h.c]?.css||HL_COLORS.y.css}">${seg}</mark>`;
    html += seg;
  }
  return html;
}

const PROFILE = [[30,470],[110,440],[200,392],[290,318],[380,222],[440,132],[500,78],[545,118],[600,198],[690,296],[770,364],[870,432],[970,470]];
const BOUNDS = [30,215,420,600,800,970];
function yAt(x){ for(let i=1;i<PROFILE.length;i++){ const [x0,y0]=PROFILE[i-1],[x1,y1]=PROFILE[i]; if(x<=x1) return y0+(y1-y0)*(x-x0)/(x1-x0);} return 470; }
function segPath(a,b){ const pts=[[a,470],[a,yAt(a)]]; for(const p of PROFILE) if(p[0]>a&&p[0]<b) pts.push(p); pts.push([b,yAt(b)],[b,470]); return "M"+pts.map(p=>p.join(",")).join(" L")+" Z"; }
function firstEmoji(s, fallback){

}

let SESS = null;
function sessStart(c){ SESS = c ? {t:Date.now(), c, ev:[], last:Date.now(), ls:0} : null; }
function sessEnd(){ const x=SESS; SESS=null; if(!x) return; const end=Math.min(Date.now(), x.last+90000), d=Math.round((end-x.t)/1000);
  if(!x.ev.length && x.ls<5 && d<20) return;
  const rec={t:x.t, c:x.c, d:Math.max(1,d), ev:x.ev}; if(x.ls>=1) rec.ls=Math.round(x.ls);
  LOG.unshift(rec); if(LOG.length>5000) LOG.length=5000; LS.set("garden-log", LOG); }
function sessSync(r){ const c = r.v==="story" && storyById(r.id) ? r.id : null; if(SESS && SESS.c===c) return; sessEnd(); sessStart(c); }
function logEv(a, o){ if(!SESS) return; SESS.ev.push(Object.assign({a, t:Date.now()}, o||{})); SESS.last=Date.now(); LS.set("garden-cur", SESS); }
["pointerdown","keydown","scroll"].forEach(ev=>document.addEventListener(ev,()=>{ if(SESS) SESS.last=Date.now(); },{capture:true,passive:true}));

let lastT = null;

  if(!a.paused && lastT!=null){ const dt=t-lastT; if(dt>0 && dt<2){ SESS.ls+=dt; SESS.last=Date.now(); } } lastT=t; }, true);
document.addEventListener("play", e=>{ if(SESS && e.target===theAudio()){ lastT=e.target.currentTime; logEv("play"); } }, true);
document.addEventListener("pause", ()=>{ lastT=null; if(SESS) LS.set("garden-cur", SESS); }, true);

async function makeBackup(){ if(SESS) flush();

async function readBackup(code){ code=String(code||"").replace(/\s+/g,"");
  if(code.startsWith("CG1Z:")) return JSON.parse(new TextDecoder().decode(await gz(b64dec(code.slice(5)),false)));
  if(code.startsWith("CG1:")) return JSON.parse(new TextDecoder().decode(b64dec(code.slice(4))));
  throw new Error("这不是 Story Garden 的备份码（应该以 CG1 开头）"); }
function mergeBackup(b){ if(!b || b.app!=="compo-story-garden") throw new Error("这不是 Story Garden 的备份码");
  if(!state.name && b.name) state.name=b.name;
  (b.picks||[]).forEach(id=>{ if(!state.picks.includes(id)) state.picks.push(id); });
  const touched=[];
  Object.entries(b.hl||{}).forEach(([id,list])=>{ const cur=state.hl[id]||[], k=h=>h.p+"|"+h.s+"|"+h.e; const seen=new Set(cur.map(k)); let ch=false;
    (list||[]).forEach(h=>{ if(!seen.has(k(h))){ cur.push(h); seen.add(k(h)); ch=true; } }); if(ch){ cur.sort((x,y)=>x.p-y.p||x.s-y.s); state.hl[id]=cur; touched.push(id); } });
  (b.words||[]).slice().reverse().forEach(w=>{ if(w && w.w && !state.words.some(x=>x.w.toLowerCase()===w.w.toLowerCase() && x.story===w.story)) state.words.unshift(w); });
  let added=0; const key=r=>r.t+"|"+r.c, seen=new Set(LOG.map(key));
  (b.log||[]).forEach(r=>{ if(r && r.t && !seen.has(key(r))){ LOG.push(r); seen.add(key(r)); added++; } });
  LOG.sort((x,y)=>y.t-x.t); if(LOG.length>5000) LOG.length=5000; LS.set("garden-log",LOG);
  saveBank(); saveWords(); touched.forEach(saveHl); LS.set("garden-hl", state.hl); return added; }
