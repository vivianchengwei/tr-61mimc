<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="避坑闯关">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<title>计算避坑闯关 · PSLE Calculation Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2e2216; --ink2:#5a4632; --paper:rgba(252,248,238,.84); --paper2:#f7efdc; --line:rgba(94,66,38,.28);
  --red:#b8312a; --red2:#8f2019; --gold:#b48a3a; --jade:#3f6b55; --jade2:#2f5443; --indigo:#2d4656; --bad:#a3392f; --good:#2f6b46;
  --serif:'Noto Serif SC','Songti SC','SimSun',serif; --cal:'Ma Shan Zheng','STKaiti','KaiTi',serif; --en:'Cormorant Garamond','Noto Serif SC',serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--serif);color:var(--ink);font-size:17px;line-height:1.6;min-height:100vh;background:#e9dbbb}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#bg svg{width:100%;height:100%;display:block}
.cal{font-family:var(--cal);font-weight:400}
a{color:inherit}
/* language */
.lang-zh .en,.lang-en .zh{display:none!important}
.lang-bi div.en{font-family:var(--en);font-size:.93em;color:var(--ink2);font-style:italic;margin-top:.15em}
.lang-bi span.en::before{content:" · ";color:var(--gold);font-style:normal}
.lang-bi span.en{font-family:var(--en);font-style:italic}
.lang-en div.en,.lang-en span.en{font-family:var(--en);font-size:1.06em}
.lang-bi .ask span.en,.lang-bi .tag span.en,.lang-bi .btn span.en{font-style:normal}
/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 18px;background:linear-gradient(#2d4656,#263c4a);color:#f6ecd6;border-bottom:3px solid var(--gold);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.seal{display:grid;place-items:center;width:40px;height:40px;background:var(--red);color:#fbe9d0;font-family:var(--cal);font-size:26px;border-radius:5px;box-shadow:inset 0 0 0 2px rgba(251,233,208,.7)}
.tt b{display:block;font-family:var(--cal);font-weight:400;font-size:25px;line-height:1.1;letter-spacing:2px}
.tt small{font-family:var(--en);font-style:italic;font-size:14px;opacity:.85}
.tools{display:flex;align-items:center;gap:14px}
#starsum{display:flex;align-items:center;gap:6px;font-size:18px}
#starsum .sm{font-size:14px;opacity:.8;margin-left:4px}
.lang{display:flex;border:1px solid rgba(246,236,214,.45);border-radius:20px;overflow:hidden}
.lang button{background:none;border:0;color:#f6ecd6;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.lang button.on{background:var(--gold);color:#2b1e0f}
/* layout */
.wrap{position:relative;z-index:1;display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;max-width:1240px;margin:0 auto;padding:20px 18px 60px}
#nav{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 92px);overflow:auto;background:rgba(250,244,230,.8);border:1px solid var(--line);border-radius:8px;padding:10px;backdrop-filter:blur(3px);box-shadow:0 6px 18px rgba(60,40,20,.12)}
.navhome{display:block;padding:7px 10px;border-radius:6px;text-decoration:none;font-weight:600;margin-bottom:4px}
.navhome.on,.np.on{background:var(--red);color:#fff6e8}
.nmod{margin-top:8px}
.nmt{font-size:13px;color:var(--jade2);font-weight:700;padding:4px 6px;border-bottom:1px dashed var(--line);margin-bottom:3px}
.np{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;text-decoration:none;font-size:14.5px;line-height:1.3}
.np:hover{background:rgba(180,138,58,.15)}
.np.on:hover{background:var(--red)}
.nno{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--indigo);color:#f6ecd6}
.np.on .nno{background:#fff6e8;color:var(--red)}
.nlab{flex:1}
.lang-bi .nlab span.en{display:block;font-size:12px;opacity:.75}
.lang-bi .nlab span.en::before{content:none}
.nstar{display:flex;align-items:center;font-size:11px}
.nbest{font-size:11px;opacity:.7}
main{min-width:0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:20px 24px;margin-bottom:18px;box-shadow:0 8px 24px rgba(60,40,20,.13);position:relative}
.panel::before{content:"";position:absolute;inset:5px;border:1px solid rgba(180,138,58,.25);border-radius:5px;pointer-events:none}
h1,h2{margin:.1em 0 .4em;line-height:1.3}
h1{font-size:1.5rem}
h2{font-size:1.2rem;color:var(--jade2)}
/* home */
.hero{text-align:center;padding:26px 24px}
.hero h1{font-size:3rem;color:var(--red2);letter-spacing:6px;margin:0}
.hero-e{font-family:var(--en);font-style:italic;font-size:1.25rem;color:var(--ink2);margin-bottom:12px}
.hero>.zh,.hero>.en{max-width:760px;margin-left:auto;margin-right:auto}
.hero-rules{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 4px;margin:16px 0 8px;font-size:15px}
.hero-rules>.pill{background:rgba(63,107,85,.1);border:1px solid rgba(63,107,85,.3);border-radius:20px;padding:3px 12px}
.hero-rules i{display:none}
.hero-s{text-align:center;margin-top:10px;line-height:2}
.hero-s svg{vertical-align:middle}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{display:block;text-decoration:none;background:var(--paper2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;transition:transform .15s,box-shadow .15s;border-left:4px solid var(--jade)}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(60,40,20,.15);border-left-color:var(--red)}
.tno{font-size:13px;color:var(--red2);font-weight:700}
.ttl{font-size:15px;line-height:1.45;margin:3px 0 6px}
.tst{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2)}
.tst .new{opacity:.6}
/* point */
.crumb{font-size:14px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pn{margin-left:auto;display:flex;gap:12px}
.pn a{text-decoration:none;color:var(--jade2);font-weight:600}
.rule{background:rgba(184,49,42,.06);border-left:4px solid var(--red);padding:10px 14px;border-radius:4px;margin-top:6px}
.freq{margin-top:10px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{background:rgba(163,57,47,.1);border:1px solid rgba(163,57,47,.3);border-radius:14px;padding:1px 10px;font-size:13px}
.chip span.en::before{content:" "}
.sech{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sech h2{margin:0}
.meta{display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin:0 2px;border:1.5px solid var(--ink2);vertical-align:middle}
.dot.ok{background:var(--red);border-color:var(--red)}
.dot.fx{background:var(--gold);border-color:var(--gold)}
.dot.no{background:#bfb3a0;border-color:#9b8d78}
.qbox{background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin:12px 0}
.ask{font-size:15px;color:var(--ink2);margin-bottom:4px}
.expr{font-size:1.4rem;line-height:2;margin:4px 0}
.ex{display:inline-flex;flex-wrap:wrap;align-items:center;row-gap:.25em;vertical-align:middle}
.nm{display:inline-flex;align-items:center;white-space:nowrap}
.op{margin:0 .32em;color:var(--red2);font-weight:600}
.pa{margin:0 .08em;font-size:1.1em}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.82em;line-height:1.15;margin:0 .12em;text-align:center}
.fr>span{padding:0 .18em;display:block}
.fr>span:first-child{border-bottom:1.6px solid currentColor}
.mx{display:inline-flex;align-items:center}
.mx .fr{margin-left:.05em}
.rd{position:relative;display:inline-block}
.rd::after{content:"";position:absolute;left:50%;top:.02em;width:.2em;height:.2em;border-radius:50%;background:currentColor;transform:translateX(-50%)}
.un{font-size:.78em;margin-left:.15em;color:var(--jade2)}
.var{font-family:'Times New Roman',serif;font-style:italic;font-size:1.08em;margin:0 .03em}
sup{font-size:.62em}
.qbody .zh,.qbody .en{line-height:1.9}
.qbody .ex{font-size:1.08em}
.wrongway,.rightway{border-radius:6px;padding:12px 16px;margin:10px 0}
.wrongway{background:rgba(163,57,47,.07);border:1px dashed rgba(163,57,47,.45)}
.rightway{background:rgba(47,107,70,.07);border:1px solid rgba(47,107,70,.35)}
.tag{font-weight:700;margin-bottom:4px}
.tag.bad{color:var(--bad)} .tag.good{color:var(--good)}
.tv{margin-top:6px} .tv s{text-decoration-color:var(--bad);text-decoration-thickness:2px}
.sol{font-size:1.05rem}
.sol .row{display:flex;align-items:center;flex-wrap:wrap;gap:.2em;padding:3px 0;line-height:2}
.eqs{color:var(--jade2);font-weight:700;margin-right:.45em;width:1em;display:inline-block}
.note{background:rgba(180,138,58,.12);border-radius:5px;padding:6px 10px;margin:4px 0 8px;font-size:.95rem;line-height:1.9}
.final{margin-top:8px;font-size:1.08rem}
.final b{color:var(--red2)}
.exfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
.tip{font-size:14px;color:var(--ink2);margin:8px 0 12px}
.btn{display:inline-flex;align-items:center;gap:4px;background:var(--red);color:#fff6e8;border:0;border-radius:22px;padding:9px 18px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;box-shadow:0 3px 0 var(--red2);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red2)}
.btn.ghost{background:transparent;color:var(--red2);border:1.5px solid var(--red);box-shadow:none}
.btn.sm{padding:5px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.lang-bi .btn span.en{font-size:.9em;opacity:.9}
.lnk{background:none;border:0;color:var(--jade2);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;padding:0 4px}
/* cards */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{position:relative;background:#fffcf4;border:1px solid var(--line);border-radius:8px;padding:14px 16px 12px;transition:border-color .2s, box-shadow .2s}
.card.right{border-color:rgba(184,49,42,.55);box-shadow:0 0 0 2px rgba(184,49,42,.12)}
.card.wrong{border-color:rgba(163,57,47,.4)}
.card.fixed{border-color:rgba(180,138,58,.6)}
.cno{font-size:13px;font-weight:700;color:var(--indigo)}
.stamp{position:absolute;top:-14px;right:-10px;pointer-events:none}
.stamp svg{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 3px 4px rgba(120,20,10,.35))}
@keyframes pop{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(12deg);opacity:1}}
.qbody{margin:4px 0 10px;font-size:1.02rem}
.qbody .expr{font-size:1.22rem}
.ansrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ans{flex:1;min-width:120px;font:inherit;font-size:1.15rem;padding:7px 12px;border:1.5px solid var(--ink2);border-radius:6px;background:#fffef9;color:var(--ink)}
.ans:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(184,49,42,.15)}
.ans[readonly]{background:#f3ecdc}
.pre,.unit{font-size:1.1rem;color:var(--ink2)}
.keys{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.key{background:var(--paper2);border:1px solid var(--line);border-radius:5px;padding:2px 10px;font:inherit;font-size:14px;cursor:pointer;min-width:34px}
.key:disabled{opacity:.4}
.lang-bi .key span.en{display:none}
.msg{margin-top:8px;padding:8px 12px;border-radius:6px;font-size:.96rem;line-height:1.7}
.msg.good{background:rgba(184,49,42,.08);color:var(--red2);font-weight:600}
.msg.bad{background:rgba(163,57,47,.07);border-left:4px solid var(--bad)}
.msg.warn{background:rgba(180,138,58,.14)}
.msg .acts{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.lang-bi .msg span.en{display:block}
.lang-bi .msg span.en::before{content:none}
.lang-bi .msg .lnk span.en,.lang-bi .msg .btn span.en{display:inline}
.lang-bi .msg .lnk span.en::before,.lang-bi .msg .btn span.en::before{content:" · "}
.lang-bi .msg .mh span.en{display:inline;font-style:normal}
.lang-bi .msg .mh span.en::before{content:" · "}
.msg .mh{display:block;margin-bottom:2px}
.lang-bi .hero-rules .pill span.en{font-size:.92em}
.sol.hide{display:none}
.card .sol{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:.98rem}
.soltt{font-weight:700;color:var(--jade2);font-size:14px}
.sum{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:16px;padding:14px 18px;border-radius:8px;background:var(--paper2);border:1px solid var(--line)}
.sum.perfect{background:linear-gradient(135deg,#fde9df,#f8e3b9);border-color:var(--red)}
.sc{font-size:2.4rem;font-weight:700;color:var(--red2);line-height:1}
.sc b{font-size:3rem}
.sx{flex:1;min-width:220px}
.tm{font-size:14px;color:var(--ink2);margin-top:4px;font-variant-numeric:tabular-nums}
.sa{display:flex;gap:10px;flex-wrap:wrap}
/* overlay */
#overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;opacity:0;transition:opacity .25s}
#overlay.show{opacity:1}
#overlay[hidden]{display:none}
.ov-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,240,210,.92),rgba(60,30,10,.75))}
.ov-in{position:relative;text-align:center;padding:20px}
.ov-in .big{position:relative;animation:bigin 1s cubic-bezier(.2,1.5,.4,1) both, wob 3s ease-in-out 1s infinite;filter:drop-shadow(0 10px 20px rgba(140,20,10,.5))}
@keyframes bigin{0%{transform:scale(0) rotate(-200deg)}100%{transform:scale(1) rotate(0)}}
@keyframes wob{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.05)}}
.rays{position:absolute;left:50%;top:150px;width:560px;height:560px;margin:-280px 0 0 -280px;background:repeating-conic-gradient(rgba(243,198,79,.5) 0 8deg,transparent 8deg 22deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ov-t{position:relative;font-size:3.2rem;color:var(--red2);margin-top:4px;text-shadow:0 2px 0 #fff3dc}
.ov-e{position:relative;font-family:var(--en);font-style:italic;font-size:1.6rem;color:#5a3a1a}
.ov-b{position:relative;display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.cf{position:absolute;top:-40px;left:var(--x);font-style:normal;color:#d8312a;font-size:calc(22px * var(--s));animation:fall 3.2s linear var(--d) infinite;opacity:.9}
.cf:nth-child(3n){color:#e9a3b2}.cf:nth-child(4n){color:#e3b341}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(var(--r))}}
/* responsive */
@media (max-width:900px){
  .wrap{grid-template-columns:1fr;padding:12px 10px 50px}
  #nav{position:static;max-height:none;display:flex;gap:8px;overflow-x:auto;padding:8px}
  .nmod{margin:0;display:flex;gap:4px;align-items:center;flex:none}
  .nmt{border:0;margin:0;white-space:nowrap;font-size:12px}
  .lang-bi .nmt span.en{display:none}
  .np{flex:none;white-space:nowrap}
  .lang-bi .nlab span.en{display:none}
  .navhome{flex:none;margin:0;white-space:nowrap}
  .cards{grid-template-columns:1fr}
  .hero h1{font-size:2.2rem}
  .tt small{display:none}
  .panel{padding:16px 14px}
}
@media (max-width:520px){ .tt b{font-size:18px;letter-spacing:0;white-space:nowrap} .seal{width:32px;height:32px;font-size:21px} .top{padding:8px 10px} .tools{gap:8px} .lang button{padding:4px 8px;white-space:nowrap} #starsum .sm{display:none} .expr{font-size:1.2rem} .ov-t{font-size:2.3rem} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* ================= v2 game layer ================= */
.wrap{display:block;max-width:1060px}
.tools{gap:10px}
#hud{display:flex;align-items:center;gap:10px}
.rk{display:flex;align-items:center;gap:8px;background:rgba(246,236,214,.1);border:1px solid rgba(246,236,214,.3);border-radius:20px;padding:3px 12px 3px 10px;font-size:13px;white-space:nowrap}
.rk .rt{font-family:var(--cal);font-size:21px;color:#f3c64f;line-height:1}
.xpbar{width:64px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#f3c64f,#e3261b);border-radius:3px}
.gc{display:flex;align-items:center;gap:3px;font-size:16px;font-weight:700;white-space:nowrap}
.gc svg{width:20px;height:26px}
.ib{background:none;border:1px solid rgba(246,236,214,.45);color:#f6ecd6;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:15px;line-height:1;padding:0;flex:none}
.btn.gold{background:var(--gold);box-shadow:0 3px 0 #7e5f22;color:#2b1e0f}
.btn.jade{background:var(--jade);box-shadow:0 3px 0 var(--jade2)}
.btn.big{padding:12px 24px;font-size:17px}
.lang-bi .btn.big span.en{font-size:.82em}
/* home */
.hero2{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:18px;align-items:center;padding:22px 26px}
.hero2 h1{font-size:2.9rem;color:var(--red2);letter-spacing:5px;margin:0;line-height:1.15}
.hero2 .hero-e{margin:0 0 8px}
.hero2 .intro{max-width:640px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:118px}
.stat .v{font-size:1.45rem;font-weight:700;color:var(--red2);line-height:1.15;display:flex;align-items:baseline;gap:6px}
.stat .v .cal{font-size:1.7rem;font-weight:400}
.stat .v small{font-size:.8rem;color:var(--ink2);font-weight:400}
.stat .l{font-size:12.5px;color:var(--ink2)}
.stat .xpbar{width:100%;background:rgba(94,66,38,.15);margin-top:4px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hero-g{text-align:center}
.hero-g svg{width:120px;height:160px;filter:drop-shadow(0 8px 10px rgba(80,50,10,.3));animation:sway 4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.hero-g .cnt{font-size:1.6rem;font-weight:700;color:var(--red2);line-height:1}
.hero-g .cnt small{font-size:.9rem;color:var(--ink2)}
/* map */
.map{position:relative;margin:6px auto 0;max-width:780px}
.map svg.path{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);text-align:center;text-decoration:none;width:156px;z-index:1}
.av{width:100px;height:100px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 50% 38%,#fffaf0,#ecdcbb);border:3px solid rgba(94,66,38,.35);display:grid;place-items:center;position:relative;transition:transform .15s;box-shadow:0 6px 14px rgba(60,40,20,.2)}
.node:hover .av{transform:scale(1.07) rotate(-3deg)}
.node.cap .av{border-color:var(--red);background:radial-gradient(circle at 50% 38%,#fff3e6,#f2d2bd)}
.node.nx .av{border-color:var(--gold);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(180,138,58,.7)}50%{box-shadow:0 0 0 14px rgba(180,138,58,0)}}

<body class="lang-bi">

<header class="top">
  <a class="brand" href="#home"><span class="seal">算</span><span class="tt"><b>计算避坑闯关</b><small>PSLE Calculation Quest</small></span></a>
  <div class="tools"><div id="hud"></div><button class="ib" id="snd" type="button" aria-label="sound">🔊</button><div class="lang"><button data-l="bi">双语</button><button data-l="zh">中文</button><button data-l="en">EN</button></div></div>
</header>

<div id="toast"></div>
<script>
/* ================= ENGINE: exact fractions, tokens, step-by-step evaluation, generators ================= */
const rnd = Math.random;
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; };
const lcm = (a, b) => a / gcd(a, b) * b;

class F {
  constructor(n, d = 1) {
    if (d === 0 || !Number.isFinite(n) || !Number.isFinite(d)) throw new Error('F');
    if (!Number.isInteger(n) || !Number.isInteger(d)) {
      let k = 1; while ((!Number.isInteger(Math.round(n * k * 1e6) / 1e6) || !Number.isInteger(Math.round(d * k * 1e6) / 1e6)) && k < 1e9) k *= 10;
      n = Math.round(n * k); d = Math.round(d * k);
    }
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d); this.n = n / g; this.d = d / g;
    if (Math.abs(this.n) > 4e14 || this.d > 4e14) throw new Error('big');
  }
  static dec(s) {
    s = String(s).trim(); const neg = s[0] === '-'; if (neg) s = s.slice(1);
    const [a, b = ''] = s.split('.'); const d = 10 ** b.length;
    return new F((neg ? -1 : 1) * (parseInt(a || '0', 10) * d + parseInt(b || '0', 10)), d);
  }
  add(o) { const L = lcm(this.d, o.d); return new F(this.n * (L / this.d) + o.n * (L / o.d), L); }
  sub(o) { const L = lcm(this.d, o.d); return new F(this.n * (L / this.d) - o.n * (L / o.d), L); }
  mul(o) { const g1 = gcd(this.n, o.d), g2 = gcd(o.n, this.d); return new F((this.n / g1) * (o.n / g2), (this.d / g2) * (o.d / g1)); }
  div(o) { if (o.n === 0) throw new Error('div0'); return this.mul(new F(o.d, o.n)); }
  eq(o) { return o instanceof F && this.n === o.n && this.d === o.d; }
  get int() { return this.d === 1; }
  get neg() { return this.n < 0; }
  term() { let d = this.d; while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5; return d === 1; }
  num() { return this.n / this.d; }
  dec() {
    if (!this.term()) return null;
    let k = 0, p = 1; while (p % this.d !== 0) { p *= 10; k++; }
    let s = String(Math.abs(this.n) * (p / this.d));
    if (k > 0) { s = s.padStart(k + 1, '0'); s = s.slice(0, s.length - k) + '.' + s.slice(s.length - k); }
    return (this.n < 0 ? '-' : '') + s;
  }
  dp() { const s = this.dec(); if (s === null) return 99; const i = s.indexOf('.'); return i < 0 ? 0 : s.length - i - 1; }
  p10(k) { return k >= 0 ? this.mul(new F(10 ** k)) : this.div(new F(10 ** (-k))); }
}
const fi = n => new F(n);

/* ---------- bilingual helpers ---------- */
const S2 = (z, e) => `<span class="zh">${z}</span><span class="en">${e}</span>`;
const B2 = (z, e) => `<div class="zh">${z}</div><div class="en">${e}</div>`;
const T_ = (id, z, e, v) => ({ id, v, m: [z, e] });

/* ---------- tokens ---------- */
const N = (v, fmt, x = {}) => Object.assign({ k: 'n', v, fmt, orig: true }, x);
const I = n => N(fi(n), 'int');
const D = s => { const v = F.dec(String(s)); return N(v, v.int ? 'int' : 'dec'); };
const NV = (v, x = {}) => N(v, v.int ? 'int' : (v.term() ? 'dec' : 'frac'), x);
const Q = (n, d) => N(new F(n, d), 'frac', { sn: n, sd: d });
const MX = (w, n, d) => N(new F(w * d + n, d), 'mixed', { w, sn: n, sd: d });
const OP = o => ({ k: 'op', o });
const LP = { k: '(' }, RP = { k: ')' };
const XX = OP('×'), DV = OP('÷'), PL = OP('+'), MI = OP('−');
function tpl(str, fill) {
  return str.split(' ').map(s => s === '(' ? LP : s === ')' ? RP : s === '+' ? PL : s === '-' ? MI : s === '×' ? XX : s === '÷' ? DV : fill(s));
}
const cnt = ts => ts.filter(t => t.k === 'n').length;
const strip = ts => ts.filter(t => t.k !== '(' && t.k !== ')');

/* ---------- rendering ---------- */
const grp = s => { const neg = s[0] === '-'; if (neg) s = s.slice(1); const [a, b] = s.split('.'); const g = a.length > 4 ? a.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : a; return (neg ? '−' : '') + (b !== undefined ? g + '.' + b : g); };
const fracH = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
function valH(v, pref) {
  if (v.int) return grp(String(v.n));
  if (pref !== 'frac' && v.term()) return grp(v.dec());
  return (v.n < 0 ? '−' : '') + fracH(Math.abs(v.n), v.d);
}
function tokH(t) {
  if (t.k === 'op') return `<span class="op">${t.o}</span>`;
  if (t.k === '(') return '<span class="pa">(</span>';
  if (t.k === ')') return '<span class="pa">)</span>';
  let h;
  if (t.html) h = t.html;

const MULTS = ['3', '6', '9', '12', '18', '27', '36', '1.5', '4.5', '0.9', '1.8', '2.7', '0.3', '0.6'];

function e3(V) { const a = ri(2, 12), b = Math.floor(V / a) - ri(0, 3); if (b < 2) return null; const c = V - a * b; if (c < 1) return null; return [I(a), XX, I(b), PL, I(c)]; }
function e4(V) {

}

function uTok(val, u, big) { if (big) { const v = new F(val, u.f); if (!v.term() || v.dp() > 2) throw 0; return NV(v, { unit: u.b, small: val }); } return N(fi(val), 'int', { unit: u.s, small: val }); }
const toSmall = (ts) => ts.map(t => t.unit ? N(fi(t.small), 'int', { unit: null }) : t);

const P11T = ['t + t × K - t ÷ K + t - t', 't × K + t - t + t ÷ K - t', '( t - t ) × K + t ÷ K + t - t'];

/* ================= DAILY ================= */
function dailyPick() {
  const pool = PTS.map(p => { const g = ST.prog[p.id] || {}; return { p, w: 1 + trapSum(p.id) * 1.5 + (g.big ? 0 : 1) }; });
  const out = [];
  while (out.length < 6) { const tot = pool.reduce((a, b) => a + b.w, 0); let r = Math.random() * tot, k = 0; while (k < pool.length - 1 && r > pool[k].w) { r -= pool[k].w; k++; } out.push(pool[k].p); pool.splice(k, 1); }
  return shuffle(out);
}

    if (d.ok) { s.st = 'fixed'; addXP(4); SFX.fix(); card.classList.remove('wrong'); card.classList.add('fixed'); fx('+4 XP', 'xp'); say(S2('哼，被你爬出来了……这题不算伤到我！', 'Hmph, you climbed out… but that one didn’t hurt me!')); fb.innerHTML = `<div class="msg good">✓ ${S2('爬出坑了！记住这个坑。（改对不扣它的血）', 'Out of the pit! Remember this trap. (Fixes don’t take its HP.)')} <button class="lnk" data-sol="1">${S2('看解题过程', 'Show working')}</button></div>`; resolve(); }
    else { s.st = 'fail'; fb.innerHTML = `<div class="msg bad"><b>✗ ${S2('还是不对。', 'Still not right.')}</b> ${d.m ? S2(d.m[0], d.m[1]) : ''}<br>${S2('对照下面的解题过程，找出算错的那一步。', 'Compare with the working below and find the step that went wrong.')}</div>`; $('#sol').classList.remove('hide'); resolve(); }
  }

}
function resolve() {
  const inp = $('#ain'); inp.readOnly = true; const b = $('#card .chk'); if (b) b.disabled = true; $('#card').querySelectorAll('.key').forEach(k => k.disabled = true);
  const last = CUR.i === CUR.qs.length - 1;
  $('#nx').innerHTML = `<button class="btn" id="nextq">${last ? S2('看战果 →', 'See result →') : S2('下一题 →', 'Next →')}</button>`;
  setTimeout(() => { const n = $('#nextq'); if (n) n.focus({ preventScroll: true }); }, 30);
}
function giveUp() { const s = CUR.qs[CUR.i]; if (s.st !== 'retry') return; s.st = 'fail'; $('#sol').classList.remove('hide'); const a = $('#fb .acts'); if (a) a.remove(); resolve(); updDots(); }
function nextQ() {
  if (CUR.done) return;
  if (CUR.i < CUR.qs.length - 1) { CUR.i++; renderQ(true); const st = $('#arena'); if (st && st.getBoundingClientRect().top < 0) st.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else finish();
}
function finish() {
  CUR.done = true; stopTimer();
  const ms = CUR.t0 ? Date.now() - CUR.t0 : 0, score = CUR.qs.filter(s => s.first).length, perfect = score === 6, fid = foeId(), M = MON[fid];
  let nextP = null;
  if (CUR.mode === 'daily') {
    const k = dkey(), prev = ST.daily[k];

    w: CUR.qs.filter(q => q.first === false).map(q => ({ p: q.pid, t: q.trap || 'other', a: q.wa || '', r: ansPlain(q.q), f: q.st === 'fixed' ? 1 : 0 })) });
  if (ST.runs.length > 2000) ST.runs = ST.runs.slice(-2000);
  save(); renderHud(); updDots();
  const stats = `<div class="tm">⏱ ${fmtTime(ms)} · ${S2('最高连击', 'Best combo')} ×${CUR.maxCombo} · +${CUR.xpGain} XP</div>`;
  const again = `<button class="btn ${perfect ? 'ghost' : ''}" data-again="1">↻ ${CUR.mode === 'daily' ? S2('再来一场', 'Another brawl') : S2('再战 · 6 道新题', 'Rematch · 6 new')}</button>`;
  const go = CUR.mode === 'daily' ? `<a class="btn jade" href="#home">${S2('回地图', 'Map')}</a>` : `<a class="btn ${perfect ? '' : 'ghost'}" href="#${nextP.id}">${S2('下一只坑怪', 'Next monster')} →</a>`;
  const txt = perfect ? (CUR.mode === 'daily' ? B2('6 题全对，坑王被你打趴下了！今天盖金印！', 'All 6 — the Pit King is down! Gold stamp today!') : B2(`满分！${M.zh}被收进葫芦啦！`, `Full marks — ${M.en} is in your gourd!`))
    : B2(`${M.zh}还剩 <b>${CUR.hp}</b> 滴血，溜走了！${score >= 4 ? '就差一点点，' : ''}再来一轮把它收进葫芦。`, `${M.en} escaped with <b>${CUR.hp}</b> HP left! ${score >= 4 ? 'So close — ' : ''}one more round to catch it.`);
  $('#summary').innerHTML = `<div class="sum ${perfect ? 'perfect' : 'escape'}"><div class="sc"><b>${score}</b>/6</div><div class="sx">${txt}${stats}</div><div class="sa">${perfect ? go + again : again + go}</div></div>`;
  if (perfect) { const me = CUR; setTimeout(() => { if (CUR === me) captureOv(fid, nextP); }, 500); }
  else { $('#foe').classList.add('run'); SFX.esc(); say(S2('略略略～下次再来抓我！', 'Nyah nyah~ catch me next time!')); setTimeout(() => $('#summary').scrollIntoView({ behavior: 'smooth', block: 'center' }), 300); }
}
function captureOv(fid, nextP) {

function closeOv() { const ov = $('#overlay'); ov.classList.remove('show'); setTimeout(() => { ov.hidden = true; ov.innerHTML = ''; }, 250); }

/* ---------- events ---------- */
document.addEventListener('submit', e => { if (e.target.id === 'af') { e.preventDefault(); check(); } });
document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if (!t) return;
  if (t.dataset.l) return setLang(t.dataset.l);
  if (t.id === 'snd') { ST.snd = !ST.snd; save(); renderHud(); if (ST.snd) SFX.fix(); return; }
  if (t.id === 'newex') { const p = PT(CUR.pid); for (let i = 0; i < 30; i++) { CUR.ex = p.gen(); if (CUR.ex.traps.length) break; } renderExample(); return; }
  if (t.id === 'go6') { $('#arena').scrollIntoView({ behavior: 'smooth', block: 'start' }); setTimeout(() => { const el = $('#ain'); if (el && !el.readOnly) el.focus({ preventScroll: true }); }, 450); return; }
  if (t.id === 'nextq') return nextQ();
  if (t.id === 'bkCopy') return copyBackup();
  if (t.id === 'bkRestore') return restoreBackup();
  if (t.dataset.day != null) { const el = document.getElementById('day' + t.dataset.day); if (el) el.hidden = !el.hidden; t.classList.toggle('open'); return; }
  if (t.dataset.retry != null) { const inp = $('#ain'); inp.focus(); inp.select(); return; }
  if (t.dataset.giveup != null) return giveUp();
  if (t.dataset.sol != null) { $('#sol').classList.toggle('hide'); return; }

  if (t.dataset.close) { closeOv(); return; }
  if (t.classList.contains('key')) {
    const card = t.closest('.card'), inp = card.querySelector('.ans'); if (inp.readOnly) return;
    const k = t.dataset.k; const a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? inp.value.length;
    if (k === '⌫') { if (a === b && a > 0) { inp.value = inp.value.slice(0, a - 1) + inp.value.slice(b); inp.setSelectionRange(a - 1, a - 1); } else { inp.value = inp.value.slice(0, a) + inp.value.slice(b); inp.setSelectionRange(a, a); } }
    else { const ch = k === '␣' ? ' ' : k; inp.value = inp.value.slice(0, a) + ch + inp.value.slice(b); inp.setSelectionRange(a + ch.length, a + ch.length); }

document.addEventListener('input', e => { if (e.target.id === 'ain') startTimer(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#overlay').hidden) closeOv();

/* ================= KEEP HISTORY: persistent storage · backup code · daily log (same approach as Tense Runner v9) ================= */
const STOR = { ok: false, persist: null };
(function () {
  try { localStorage.setItem('cq.probe', '1'); STOR.ok = localStorage.getItem('cq.probe') === '1'; } catch (e) { STOR.ok = false; }
  try { if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then(p => { STOR.persist = p; if (!p && navigator.storage.persist) navigator.storage.persist().then(g => { STOR.persist = g; renderDiag(); }).catch(() => { }); renderDiag(); }).catch(() => { }); } catch (e) { }
})();
function openedHow() {
  if (location.protocol === 'file:') return '本地文件（iPad 上用「文件」App 打开的话，常常存不住）';
  let framed = true; try { framed = window.top !== window; } catch (e) { framed = true; }
  if (window.navigator.standalone || matchMedia('(display-mode: standalone)').matches) return '主屏幕 App 模式（最稳定）';
  return framed ? '嵌在 claude.ai 页面里（Edge / Safari 可能会清掉进度）' : '独立网页';
}
const DAYMS = 864e5;
const hasProgress = () => (ST.runs && ST.runs.length) || Object.keys(ST.prog).some(k => (ST.prog[k].rounds || 0) > 0);
function embedNote() {
  let f; try { f = window.self !== window.top; } catch (e) { f = true; }
  return f ? `<div class="nag">⚠️ 这个页面现在嵌在 claude.ai 里，浏览器可能会清掉进度。孩子请用独立网址：<b>vivianchengwei.github.io/tr-61mimc/calc/</b>（先在家长页复制备份码，到新网址后点「恢复」）。</div>` : '';
}
function bkNag() {
  if (!hasProgress()) return '';
  if (ST.lastBackup && Date.now() - ST.lastBackup < 7 * DAYMS) return '';
  return `<div class="nag">💾 ${S2(ST.lastBackup ? '超过一周没备份了，' : '还没有备份过进度，', ST.lastBackup ? 'No backup for over a week — ' : 'Progress not backed up yet — ')}<a href="#parent">${S2('去家长页复制备份码', 'copy a backup code')}</a></div>`;
}
const fmtD = t => { const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function ansPlain(q) {
  if (q.ansType === 'ratio') return q.ans[0] + ' : ' + q.ans[1];
  const v = q.ans, s = v.term() ? (q.money ? '$' + v.num().toFixed(2) : v.dec()) : (v.int ? String(v.n) : v.n + '/' + v.d);
  return (q.pre && !q.money && q.pre !== '$' ? 'x = ' : q.pre === '$' && !q.money ? '$' : '') + s + (q.unit || '');
}
function renderDiag() {
  const el = document.getElementById('pDiag'); if (!el) return;
  el.innerHTML = `🔍 <b>存储检查</b>：本机存储 ${STOR.ok ? '可用 ✅' : '不可用 ❌（关掉就会丢，常见于无痕浏览）'} · 永久保存 ${STOR.persist === true ? '已获准 ✅' : STOR.persist === false ? '未获准' : '未知'} · 打开方式：${openedHow()}`;
  const lb = document.getElementById('bkLast');
  if (lb) lb.textContent = ST.lastBackup ? '上次复制备份码：' + fmtD(ST.lastBackup) + (Date.now() - ST.lastBackup > 7 * DAYMS ? ' ⚠️ 超过一周了，建议再复制一次' : '') : '还没有复制过备份码。';
}
function b64FromBytes(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
function bytesFromB64(b) { const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
async function makeBackupCode() {
  const json = JSON.stringify(Object.assign({}, ST, { app: 'calc-quest', backupAt: Date.now() }));
  if (window.CompressionStream) { try { const st = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip')); return 'CQ1:' + b64FromBytes(new Uint8Array(await new Response(st).arrayBuffer())); } catch (e) { } }
  return 'CQ0:' + b64FromBytes(new TextEncoder().encode(json));
}
async function readBackupCode(code) {
  code = (code || '').replace(/\s+/g, '');
  if (code.startsWith('CQ1:')) { const st = new Blob([bytesFromB64(code.slice(4))]).stream().pipeThrough(new DecompressionStream('gzip')); return JSON.parse(await new Response(st).text()); }
  if (code.startsWith('CQ0:')) return JSON.parse(new TextDecoder().decode(bytesFromB64(code.slice(4))));
  throw new Error('format');
}
/* merge, never overwrite: keep the better of each number, union the logs */
function mergeStore(o) {
  const before = (ST.runs || []).length;
  for (const id in (o.prog || {})) {
    const a = pr(id), b = o.prog[id] || {};
    for (const f of ['rounds', 'best', 'big', 'small']) a[f] = Math.max(a[f] || 0, b[f] || 0);
    a.traps = a.traps || {}; for (const k in (b.traps || {})) a.traps[k] = Math.max(a.traps[k] || 0, b.traps[k] || 0);
    if (b.bestTime && (!a.bestTime || b.bestTime < a.bestTime)) a.bestTime = b.bestTime;
    if (b.seen) a.seen = 1;
  }
  ST.xp = Math.max(ST.xp || 0, o.xp || 0);
  for (const k in (o.daily || {})) { const x = ST.daily[k], y = o.daily[k]; ST.daily[k] = { s: Math.max(x ? x.s : 0, y ? y.s : 0) }; }
  if (!Array.isArray(ST.runs)) ST.runs = [];
  const seenR = new Set(ST.runs.map(r => r.d + '|' + r.p));
  (o.runs || []).forEach(r => { if (r && r.d && !seenR.has(r.d + '|' + r.p)) { ST.runs.push(r); seenR.add(r.d + '|' + r.p); } });
  ST.runs.sort((x, y) => x.d - y.d); if (ST.runs.length > 2000) ST.runs = ST.runs.slice(-2000);
  return ST.runs.length - before;
}
async function copyBackup() {
  const code = await makeBackupCode(), out = $('#bkOut');
  out.value = code; out.hidden = false;
  let copied = false; try { await navigator.clipboard.writeText(code); copied = true; } catch (e) { }
  if (!copied) { out.focus(); out.select(); }
  ST.lastBackup = Date.now(); save(); renderDiag();
  $('#bkMsg').textContent = copied ? '✅ 已复制（' + code.length + ' 个字符）。粘贴到备忘录或发给自己保存。' : '请长按上面框里的备份码 →「全选」→「拷贝」，再粘贴到备忘录保存。';
}
async function restoreBackup() {
  const msg = $('#bkMsg'); let o;
  try { o = await readBackupCode($('#bkIn').value); } catch (e) { msg.textContent = '❌ 备份码不完整或不对，请整段重新粘贴（以 CQ1: 开头）。'; return; }
  if (!o || typeof o !== 'object' || !o.prog) { msg.textContent = '❌ 这不是计算避坑闯关的备份码。'; return; }
  const added = mergeStore(o); save(); renderHud(); renderParent();
  $('#bkMsg').textContent = '✅ 已恢复：收服次数、最好成绩、XP 都取较好的那个，记录多了 ' + added + ' 轮。现在的进度没有被覆盖。';
}
function renderParent() {
  CUR = null; stopTimer();
  const runs = (ST.runs || []).slice().reverse(), byDay = {};
  runs.forEach(r => { const k = dkey(new Date(r.d)); (byDay[k] = byDay[k] || []).push(r); });
  const days = Object.keys(byDay);
  const nm = p => p === 'daily' ? '🔥 今日混战' : (MON[p] ? MON[p].zh : p) + ' · ' + (PT(p) ? PT(p).sz : '');
  const tl = id => TRAPL[id] ? TRAPL[id][0] : id;
  const runRow = (r, i, k) => `<div class="lr"><span class="lt">${pad(new Date(r.d).getHours())}:${pad(new Date(r.d).getMinutes())}</span><span class="ln">${nm(r.p)}</span><span class="ls ${r.s === 6 ? 'ok' : ''}">${r.s}/6${r.s === 6 ? (r.p === 'daily' ? ' 🏆' : ' 🏺') : ''}</span><span class="lm">⏱ ${fmtTime(r.ms || 0)}</span>${r.w && r.w.length ? `<button class="lnk" data-day="${k}-${i}">错题 ${r.w.length}</button>` : '<span class="lm">全对</span>'}</div>` +
    (r.w && r.w.length ? `<div class="lw" id="day${k}-${i}" hidden>${r.w.map(w => `<div>· <b>${tl(w.t)}</b>${r.p === 'daily' && MON[w.p] ? `（${MON[w.p].zh}）` : ''}：写了 <s>${w.a || '（空）'}</s>，正确 ${w.r}${w.f ? ' · 第二次改对 ✓' : ''}</div>`).join('')}</div>` : '');
  const tot = {}; Object.keys(ST.prog).forEach(id => { for (const k in (ST.prog[id].traps || {})) tot[k] = (tot[k] || 0) + ST.prog[id].traps[k]; });
  const top = Object.entries(tot).sort((a, b) => b[1] - a[1]).slice(0, 8);
  $('#main').innerHTML = `<section class="panel"><div class="crumb"><a href="#home">‹ ${S2('地图', 'Map')}</a></div><h1>👪 家长页</h1>
    <div class="pnote" id="pDiag"></div>
    <div class="pnote">📱 进度和记录只存在这台设备的浏览器里，不会上传。请定期复制一份备份码。换 iPad 或进度丢了，把备份码粘贴回来点「恢复」：<b>是合并，不会覆盖现在的进度</b>。</div></section>
  <section class="panel"><h2>💾 进度备份</h2>
    <div class="cta" style="margin-top:4px"><button class="btn" id="bkCopy" type="button">📋 复制备份码</button></div>
    <textarea id="bkOut" class="bk" readonly hidden></textarea>
    <div class="tip" id="bkLast"></div>
    <textarea id="bkIn" class="bk" placeholder="把以 CQ1: 开头的备份码粘贴到这里"></textarea>
    <div class="cta" style="margin-top:8px"><button class="btn jade" id="bkRestore" type="button">↩ 恢复（合并）</button></div>
    <div class="msg warn" id="bkMsg" style="margin-top:10px">两个孩子如果用不同的 iPad，备份码要分开保存。</div></section>
  <section class="panel"><h2>📅 每日记录</h2>
    ${top.length ? `<div class="rec" style="margin:0 0 10px">最常掉的坑（累计）：${top.map(([k, n]) => `<span class="chip">${tl(k)} ×${n}</span>`).join('')}</div>` : ''}
    ${days.length ? days.map(k => { const L = byDay[k], perf = L.filter(r => r.s === 6).length; return `<div class="lday"><div class="ldh"><b>${k}</b> · 打了 ${L.length} 轮 · 满分 ${perf} 轮 · 共 ${fmtTime(L.reduce((a, r) => a + (r.ms || 0), 0))}</div>${L.map((r, i) => runRow(r, i, k)).join('')}</div>`; }).join('')
      : `<div class="tip">还没有记录。从这一版开始，每打完一轮都会记在这里（最多保留 2000 轮）。</div>`}
  </section>`;
  renderDiag(); window.scrollTo(0, 0);
}

function route() {
  const h = (location.hash || '').slice(1);
  if (PT(h)) renderPoint(h); else if (h === 'dex') renderDex(); else if (h === 'daily') renderDaily(); else if (h === 'parent') renderParent(); else renderHome();
}
