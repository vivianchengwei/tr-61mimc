","a":3,"s":"以下哪一个句子是正确的？","o":["丽丽在【宣布】上画了本地的著名景点。","我把小明被欺负的事情【宣布】了老师。","食堂里贴着几张【宣布】，提醒同学抹桌椅。","比赛结束后，校长【宣布】我们班得了冠军。"],"n":["画画用的纸是“宣纸”。","一个人用“告诉”老师。","贴出来的是“告示／布告”。","✔ 宣布：正式公开地告诉大家。"],"tip":""},{"id":"P5-练49","src":"P5 练习卷","qn":"练49","k":"练习卷","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["天空中突然下起了【详细】的小雨。","小安做事很【详细】，从来不出错。","老师把游戏规则【详细】地解释给我们听。","写完作文后，欢欢【详细】地检查了一遍。"],"n":["小雨用“细细的”。","做事用“仔细”。","✔ 详细：周密完整、一点一点说清楚（详细地解释）。","检查用“仔细地”。"],"tip":""},{"id":"2020ACS-Q16","src":"2020 ACS 预考","qn":"Q16","k":"预考","t":"c","a":2,"s":"我搬进了新家，表姐送我一个智能扫地机器人。这份礼物让我____！这是我盼望已久的礼物。","o":["左思右想","激动人心","喜出望外","指指点点"],"n":["左思右想：反复地想，拿不定主意。","激动人心：让很多人激动，多形容消息、场面（激动人心的比赛）。","✔ 喜出望外：得到没想到的好东西，特别高兴。收到盼望已久的礼物。","指指点点：用手指着别人议论。"],"tip":""},{"id":"2020ACS-Q17","src":"2020 ACS 预考","qn":"Q17","k":"预考","t":"c","a":3,"s":"“宝宝”以它____的打扫方法，一眨眼就完成任务。","o":["精彩","充足","勤奋","快速"],"n":["精彩：表演出色，不形容打扫方法。","充足：数量够。","勤奋：形容人努力，不形容方法。","✔ 快速：很快。“一眨眼就完成”说明速度快。"],"tip":""},{"id":"2020ACS-Q18","src":"2020 ACS 预考","qn":"Q18","k":"预考","t":"c","a":1,"s":"看到它的本事，我想：我____可以休息，不必为打扫房子而烦恼了。","o":["一向","总算","比较","反正"],"n":["一向：从来都是这样，以前就能休息，不符合。","✔ 总算：盼了很久，终于可以。","比较：和别的相比。","反正：无论如何，语气不对。"],"tip":""},{"id":"2020ACS-Q19","src":"2020 ACS 预考","qn":"Q19","k":"预考","t":"c","a":3,"s":"我明白了：眼睛看不见的，并不____它不在。","o":["据说","同意","代替","表示"],"n":["据说：听别人说。","同意：赞成。","代替：换掉。","✔ 表示：说明、意味着（看不见并不表示不存在）。"],"tip":""},{"id":"2020ACS-Q20","src":"2020 ACS 预考","qn":"Q20","k":"预考","t":"c","a":0,"s":"“宝宝”不仅是我的好帮手，还让我学习到了一个道理。我会____它，把它放在心上，有如一个宝。","o":["珍惜","遮盖","守望","养育"],"n":["✔ 珍惜：好好爱惜（珍惜它，把它当宝）。","遮盖：盖住。","守望：看守瞭望（守望相助）。","养育：抚养孩子长大，机器人不用养育。"],"tip":""},{"id":"2020HP-Q16","src":"2020 Henry Park 预考","qn":"Q16","k":"预考","t":"c","a":0,"s":"哥哥笑着说：“你平时这么贪吃，肯定会受不了，还是算了吧。”我____地摇头，说：“我绝对不会偷吃！”","o":["使劲","顽强","热烈","勉强"],"n":["✔ 使劲：用力（使劲地摇头），表示很坚决。","顽强：坚强不屈，形容意志、斗争。","热烈：形容气氛、掌声。","勉强：不情愿，和“绝对不会偷吃”的决心不配。"],"tip":""},{"id":"2020HP-Q17","src":"2020 Henry Park 预考","qn":"Q17","k":"预考","t":"c","a":3,"s":"哥哥接着说：“那我们____。”我们开始行动了，把所有吃的东西都收起来。","o":["互相配合","分工合作","不约而同","一言为定"],"n":["互相配合：一起合作做事。","分工合作：分开做不同的部分。","不约而同：没约好却一起做。","✔ 一言为定：说好了就不改。答应了“绝对不偷吃”，就这样说定。"],"tip":""},{"id":"2020HP-Q18","src":"2020 Henry Park 预考","qn":"Q18","k":"预考","t":"c","a":3,"s":"短片里年纪很小的孩子不但要____饿肚子的痛苦，还要长时间在工厂工作。","o":["对抗","防止","烦恼","忍受"],"n":["对抗：两方作对。","防止：事先不让发生。","烦恼：发愁，不能带“痛苦”。","✔ 忍受：把痛苦、困难勉强承受下来（忍受饥饿）。"],"tip":""},{"id":"2020HP-Q19","src":"2020 Henry Park 预考","qn":"Q19","k":"预考","t":"c","a":1,"s":"不到两个小时，我的肚子就饿得咕噜咕噜叫了。但是一想到那些非洲小朋友，我便____不吃东西。","o":["约定","坚持","答应","克服"],"n":["约定：事先说好。","✔ 坚持：一直做下去不放弃（坚持不吃）。","答应：同意别人的要求。","克服：战胜困难，后面要接困难、缺点。"],"tip":""},{"id":"2020HP-Q20","src":"2020 Henry Park 预考","qn":"Q20","k":"预考","t":"c","a":1,"s":"在这几个小时里，虽然我只是____饿肚子，却懂得了要珍惜眼前的幸福生活。","o":["随时","暂时","临时","不时"],"n":["随时：任何时候。","✔ 暂时：短时间内（只饿了几个小时）。和非洲孩子天天饿肚子相比。","临时：事先没安排、突然。","不时：时常。"],"tip":""},{"id":"2020MGS-Q16","src":"2020 MGS 预考","qn":"Q16","k":"预考","t":"c","a":2,"s":"小安热心助人，待人____，是值得信任的好朋友。","o":["忠心","友情","诚恳","尊敬"],"n":["忠心：对国家、主人忠诚，多用于“忠心耿耿”。","友情：名词，不能放在“待人”后面。","✔ 诚恳：真心诚意（待人诚恳）。和“值得信任”相配。","尊敬：敬重别人，“待人尊敬”不常说。"],"tip":""},{"id":"2020MGS-Q17","src":"2020 MGS 预考","qn":"Q17","k":"预考","t":"c","a":0,"s":"公司派小安的爸爸到美国去工作四年，小安一家人____跟他一起去。","o":["选择","代表","陪伴","挑选"],"n":["✔ 选择：从几种做法中决定一种（选择跟他一起去）。","代表：替大家出面。","陪伴：要直接接人（陪伴爸爸），后面已有“跟他”，重复了。","挑选：从很多东西里选出来，多用于物品、人选。"],"tip":""},{"id":"2020MGS-Q18","src":"2020 MGS 预考","qn":"Q18","k":"预考","t":"c","a":1,"s":"飞机起飞后，我____地离开机场。","o":["兴高采烈","愁眉苦脸","津津有味","满头大汗"],"n":["兴高采烈：很高兴，和分别的心情相反。","✔ 愁眉苦脸：发愁难过的样子。好朋友走了，舍不得。","津津有味：吃得、听得很有兴趣。","满头大汗：出了很多汗。"],"tip":""},{"id":"2020MGS-Q19","src":"2020 MGS 预考","qn":"Q19","k":"预考","t":"c","a":3,"s":"日子一天天地过去，小安到美国已经两年了，我小学也快____了。","o":["结束","完成","告别","毕业"],"n":["结束：可以说“快结束了”，但“小学快结束了”不如毕业准确。","完成：做好，多接任务。","告别：要有告别的对象。","✔ 毕业：学完小学的课程（小学快毕业了）。"],"tip":""},{"id":"2020MGS-Q20","src":"2020 MGS 预考","qn":"Q20","k":"预考","t":"c","a":2,"s":"小安一家人会在年底回新加坡度假。我内心默默地____这一天早点到来。","o":["幻想","愿望","期盼","纪念"],"n":["幻想：想不实际的事，回国度假是真的。","愿望：名词，不能直接带“这一天”。","✔ 期盼：期待、盼望（期盼这一天早点到来）。","纪念：怀念过去的事。"],"tip":""},{"id":"2020NY-Q16","src":"2020 南洋 预考","qn":"Q16","k":"预考","t":"c","a":0,"s":"传说古时候，为了让皇帝高兴，有一位厨师决心要做出新的菜色，他____，不知道要做怎样的一道菜。","o":["左思右想","灵机一动","胸有成竹","恍然大悟"],"n":["✔ 左思右想：反复地想。后面“不知道要做怎样的菜”，说明还没想好。","灵机一动：突然想到好办法，和“不知道”矛盾。","胸有成竹：心里早有打算，矛盾。","恍然大悟：一下子明白，矛盾。"],"tip":""},{"id":"2020NY-Q17","src":"2020 南洋 预考","qn":"Q17","k":"预考","t":"c","a":3,"s":"有一天，厨师来到池边，看见水中的荷花，被它的样子____住了，就决定照着荷花的形状来做出一道菜。","o":["着迷","注意","惊喜","吸引"],"n":["着迷：一般说“看得着迷”，不说“被……着迷住”。","注意：留心，不能说“被注意住了”。","惊喜：又惊又喜。","✔ 吸引：把注意力引过去（被……吸引住了）。"],"tip":""},{"id":"2020NY-Q18","src":"2020 南洋 预考","qn":"Q18","k":"预考","t":"c","a":0,"s":"他发现这一步要格外小心，____不注意，蛋黄就会破掉。","o":["稍微","刚巧","平时","根本"],"n":["✔ 稍微：一点点（稍微不注意就会……）。说明要很小心。","刚巧：正好、碰巧。","平时：平常的时候。","根本：完全，“根本不注意”语气太重，也不合“格外小心”。"],"tip":""},{"id":"2020NY-Q19","src":"2020 南洋 预考","qn":"Q19","k":"预考","t":"c","a":1,"s":"油热后，把碗里的鸡蛋倒进去。接下来要____好热度，等到蛋白煎熟后，洒上少许的盐和胡椒粉。","o":["安排","控制","保持","决定"],"n":["安排：有条理地处理事情、时间。","✔ 控制：掌握住、不让它乱变（控制好火候、热度）。","保持：维持不变，煎蛋时热度要调，不只是保持。","决定：拿主意。"],"tip":""},{"id":"2020NY-Q20","src":"2020 南洋 预考","qn":"Q20","k":"预考","t":"c","a":2,"s":"荷包蛋的做法非常简单，能在两、三分钟内____完成。","o":["立刻","急忙","快速","积极"],"n":["立刻：马上，表示开始得快，不和“两三分钟内”搭配。","急忙：因为着急而赶快，形容人。","✔ 快速：速度快（快速完成）。","积极：主动、热心。"],"tip":""},{"id":"2020RGS-Q16","src":"2020 莱佛士女中 预考","qn":"Q16","k":"预考","t":"c","a":2,"s":"穿上滑轮鞋之后，教练要我先____观察他的动作，再学习怎么溜滑轮。","o":["尽力","奇妙","仔细","故意"],"n":["尽力：用尽力气，一般不和“观察”搭配。","奇妙：奇特美妙。","✔ 仔细：细心（仔细观察）。","故意：有意这样做。"],"tip":""},{"id":"2020RGS-Q17","src":"2020 莱佛士女中 预考","qn":"Q17","k":"预考","t":"c","a":2,"s":"慢慢地，我的双脚跟身体互相____，两只手臂前后摆动。","o":["交替","连接","配合","进行"],"n":["交替：轮流替换。","连接：连在一起。","✔ 配合：几部分一起协调地动作（身体互相配合）。","进行：从事某种活动，不和“互相”搭配。"],"tip":""},{"id":"2020RGS-Q18","src":"2020 莱佛士女中 预考","qn":"Q18","k":"预考","t":"c","a":3,"s":"在教练的鼓励下，我放松心情，____教练的动作，开始向前滑。","o":["完成","体现","表演","模仿"],"n":["完成：做好。","体现：表现出某种精神。","表演：给别人看。","✔ 模仿：照着样子学（模仿教练的动作）。"],"tip":""},{"id":"2020RGS-Q19","src":"2020 莱佛士女中 预考","qn":"Q19","k":"预考","t":"c","a":3,"s":"经过不断地____，我终于能放开教练的手，自己溜滑轮了。","o":["行动","闯关","锻炼","尝试"],"n":["行动：去做。","闯关：通过一关一关。","锻炼：使身体强壮，“不断地锻炼”可以，但学新本领更强调试一试。","✔ 尝试：试着做（经过不断尝试，终于会了）。"],"tip":""},{"id":"2020RGS-Q20","src":"2020 莱佛士女中 预考","qn":"Q20","k":"预考","t":"c","a":0,"s":"那时候，我滑的样子一点也不____，不过在不断地练习后，我终于学会怎么溜滑轮了。","o":["优美","精彩","飞快","生动"],"n":["✔ 优美：好看、美（样子优美）。刚学会，样子不好看。","精彩：表演出色，不形容“样子”。","飞快：很快，刚学会的人慢，用“一点也不”不合理。","生动：形容文章、表演活泼逼真。"],"tip":""},{"id":"2020RS-Q16","src":"2020 红十字会 预考","qn":"Q16","k":"预考","t":"c","a":3,"s":"面试的时候，年轻人很认真地演着自己____准备的小作品。","o":["专心","努力","严厉","特别"],"n":["专心：一般说“专心地准备”，放在这里不顺。","努力：一般说“努力地准备”。","严厉：形容对人的态度。","✔ 特别：特地、专门（特别准备的作品）。"],"tip":""},{"id":"2020RS-Q17","src":"2020 红十字会 预考","qn":"Q17","k":"预考","t":"c","a":2,"s":"他发现大老板们正在台下谈天。年轻人见了，感到很____，他心想：这些大老板都没有看我在表演，我绝对不会被请去当演员了。","o":["惭愧","害羞","伤心","奇怪"],"n":["惭愧：自己做错事觉得不好意思，他没有做错。","害羞：不好意思见人。","✔ 伤心：心里难过。觉得自己没希望了。","奇怪：觉得不正常，但后面是他难过的想法。"],"tip":""},{"id":"2020RS-Q18","src":"2020 红十字会 预考","qn":"Q18","k":"预考","t":"c","a":0,"s":"面试一____，年轻人就回到自己的家，开始收拾行李，打算到别的大城市去。","o":["结束","停止","落下","终止"],"n":["✔ 结束：事情完了（面试一结束）。","停止：正在进行的动作不再继续，常指中途停下。","落下：往下掉。","终止：中途结束，多用于合同、比赛中断。"],"tip":""},{"id":"2020RS-Q19","src":"2020 红十字会 预考","qn":"Q19","k":"预考","t":"c","a":1,"s":"不料第二天早上，年轻人____接到电影公司大老板打来的电话。","o":["果然","竟然","当然","虽然"],"n":["果然：和预料的一样，他以为没希望，不是预料中。","✔ 竟然：没想到（“不料”……竟然接到电话）。","当然：理所当然。","虽然：表示让步，要配“但是”。"],"tip":""},{"id":"2020RS-Q20","src":"2020 红十字会 预考","qn":"Q20","k":"预考","t":"c","a":2,"s":"“我们很欣赏你的表演方式，我们当天就是在____着要不要请你当演员。”","o":["争吵","确定","讨论","同意"],"n":["争吵：吵架。","确定：已经定了，和“要不要”矛盾。","✔ 讨论：一起商量（讨论着要不要请你）。","同意：已经答应，和“要不要”矛盾。"],"tip":""},{"id":"2020Rosyth-Q16","src":"2020 Rosyth 预考","qn":"Q16","k":"预考","t":"c","a":1,"s":"他从八岁开始学习修鞋，学习时很辛苦，但他还是坚持了下来，没有____。","o":["心满意足","半途而废","愁眉苦脸","左思右想"],"n":["心满意足：很满足。","✔ 半途而废：做到一半就放弃。“坚持下来，没有半途而废”。","愁眉苦脸：发愁的样子。","左思右想：反复地想。"],"tip":""},{"id":"2020Rosyth-Q17","src":"2020 Rosyth 预考","qn":"Q17","k":"预考","t":"c","a":0,"s":"他说刚开始时客人不多，____的机会很少，有时连吃饭的钱都不够。","o":["赚钱","销售","消费","购物"],"n":["✔ 赚钱：做事得到钱。客人少，赚钱的机会少。","销售：卖货物，修鞋不是卖东西。","消费：花钱。","购物：买东西。"],"tip":""},{"id":"2020Rosyth-Q18","src":"2020 Rosyth 预考","qn":"Q18","k":"预考","t":"c","a":3,"s":"后来，大家发现爷爷待人____，收费又便宜，找他修鞋的人慢慢多了起来。","o":["感恩","积极","勇敢","诚恳"],"n":["感恩：感谢别人的恩情。","积极：主动热心。","勇敢：不怕危险。","✔ 诚恳：真心诚意（待人诚恳）。"],"tip":""},{"id":"2020Rosyth-Q19","src":"2020 Rosyth 预考","qn":"Q19","k":"预考","t":"c","a":2,"s":"爸爸妈妈____爷爷早点退休，爷爷却不肯。","o":["称赞","吩咐","劝告","议论"],"n":["称赞：夸奖。","吩咐：长辈叫晚辈做事，爸妈对爷爷不能用。","✔ 劝告：用道理劝人这样做（劝告爷爷早点退休）。","议论：大家各说各的看法。"],"tip":""},{"id":"2020Rosyth-Q20","src":"2020 Rosyth 预考","qn":"Q20","k":"预考","t":"c","a":0,"s":"像爷爷这样的老人还有很多，他们对工作____了责任感，热爱自己的工作。","o":["充满","保持","拥有","付出"],"n":["✔ 充满：里面满满的都是（充满了责任感）。","保持：维持原样。","拥有：领有、具有，多接财产、土地。","付出：交出、花出（付出努力）。"],"tip":""},{"id":"2020SCGS-Q16","src":"2020 SCGS 预考","qn":"Q16","k":"预考","t":"c","a":1,"s":"阿里有两头牛帮他拉车载货。尽管阿里的生活很____，但三餐还是会喂饱这两头牛。","o":["劳累","困难","普通","痛苦"],"n":["劳累：身体累。","✔ 困难：日子不好过、穷（生活困难）。“尽管……但还是喂饱牛”。","普通：一般，和“尽管”转折不够强。","痛苦：身体或精神很难受。"],"tip":""},{"id":"2020SCGS-Q17","src":"2020 SCGS 预考","qn":"Q17","k":"预考","t":"c","a":0,"s":"其中一头牛很懒惰。另外一头牛时常____它说：“主人对我们那么好，我们应该好好工作。”","o":["劝告","安慰","请求","鼓励"],"n":["✔ 劝告：用道理劝人改正（劝它好好工作）。","安慰：让难过的人好受一些。","请求：请别人答应。","鼓励：给人信心，懒惰需要的是劝。"],"tip":""},{"id":"2020SCGS-Q18","src":"2020 SCGS 预考","qn":"Q18","k":"预考","t":"c","a":0,"s":"没走多远，懒惰的牛想出了一个坏____。它走走停停，停停走走。","o":["主意","建议","计划","想法"],"n":["✔ 主意：办法（想出一个坏主意）。固定说法。","建议：给别人提的意见。","计划：事先的安排，要“订”。","想法：心里的看法，“想出一个坏想法”不常说。"],"tip":""},{"id":"2020SCGS-Q19","src":"2020 SCGS 预考","qn":"Q19","k":"预考","t":"c","a":0,"s":"懒惰的牛摆出一副得意的样子，说：“你看，你越是努力，人家越是要欺负你。总有一天，你会____我的想法。”","o":["同意","坚持","配合","发扬"],"n":["✔ 同意：赞成（同意我的想法）。","坚持：一直不改，是自己的想法才能坚持。","配合：一起合作。","发扬：把好精神传下去。"],"tip":""},{"id":"2020SCGS-Q20","src":"2020 SCGS 预考","qn":"Q20","k":"预考","t":"c","a":3,"s":"阿里想：是啊，我为什么要多养一头不能干活的牛，____是浪费钱。于是，他回家后把懒惰的牛卖了。","o":["原来","偏偏","竟然","简直"],"n":["原来：发现真实情况。","偏偏：故意跟人作对。","竟然：没想到。","✔ 简直：完全是、差不多就是（加强语气：简直是浪费钱）。"],"tip":""},{"id":"2020TN-Q16","src":"2020 道南 预考","qn":"Q16","k":"预考","t":"c","a":3,"s":"一开始，小丽对于网上学习感到有些____，因为这是她从没有过的经验。","o":["难过","慌张","糊涂","担心"],"n":["难过：伤心。","慌张：急得不知怎么办，多是突然发生的事。","糊涂：不清楚。","✔ 担心：放心不下（第一次做，有点担心）。"],"tip":""},{"id":"2020TN-Q17","src":"2020 道南 预考","qn":"Q17","k":"预考","t":"c","a":2,"s":"没过多久，她就渐渐习惯了这种学习____。","o":["办法","计划","方式","规则"],"n":["办法：解决问题的方法。","计划：事先安排。","✔ 方式：做事的样子和方法（学习方式：网上学习／学校学习）。","规则：规定。"],"tip":""},{"id":"2020TN-Q18","src":"2020 道南 预考","qn":"Q18","k":"预考","t":"c","a":1,"s":"小丽认为，无论是网上学习还是在学校里学习，都需要认真对待，更要____良好的学习习惯。","o":["保卫","保持","保护","保证"],"n":["保卫：保护国家、家园不受侵犯。","✔ 保持：维持好的状态（保持良好的习惯）。","保护：照顾使不受伤害。","保证：答应一定做到。"],"tip":""},{"id":"2020TN-Q19","src":"2020 道南 预考","qn":"Q19","k":"预考","t":"c","a":1,"s":"小丽在居家学习期间，每天____要求自己，按时起床、睡觉，自己整理房间。","o":["诚恳","严格","仔细","勤奋"],"n":["诚恳：真心诚意。","✔ 严格：要求很高、一点也不放松（严格要求自己）。","仔细：细心。","勤奋：努力不偷懒，不说“勤奋要求”。"],"tip":""},{"id":"2020TN-Q20","src":"2020 道南 预考","qn":"Q20","k":"预考","t":"c","a":0,"s":"她也会按照老师的____，准时上网学习。","o":["吩咐","唠叨","教导","讲述"],"n":["✔ 吩咐：老师、长辈口头交代做的事（按照老师的吩咐）。","唠叨：一件事说个不停，不说“按照……的唠叨”。","教导：教育指导，多指道理。","讲述：把事情讲出来。"],"tip":""},{"id":"2020TMS-Q16","src":"2020 淡马锡 预考","qn":"Q16","k":"预考","t":"c","a":1,"s":"这期间，我因为外婆的建议____了学武术，改练跑步。因为练跑步不需要花钱。","o":["放心","放弃","放开","放过"],"n":["放心：不担心。","✔ 放弃：不再做（放弃学武术，改练跑步）。","放开：松手。","放过：原谅、不追究。"],"tip":""},{"id":"2020TMS-Q17","src":"2020 淡马锡 预考","qn":"Q17","k":"预考","t":"c","a":0,"s":"我写信给在远方工作的妈妈，____地邀请她来观看比赛。","o":["诚恳","好心","正直","尊敬"],"n":["✔ 诚恳：真心诚意（诚恳地邀请）。","好心：善意，“好心地邀请”不常说。","正直：为人公正，形容品格。","尊敬：敬重，对妈妈可以，但不和“邀请”搭配。"],"tip":""},{"id":"2020TMS-Q18","src":"2020 淡马锡 预考","qn":"Q18","k":"预考","t":"c","a":1,"s":"得到的答复却是“不能来”。我很失望，我甚至想：____当天下大雨就好了！","o":["而是","要是","可是","但是"],"n":["而是：用在“不是……而是”。","✔ 要是：如果（要是下雨就好了）。","可是：转折。","但是：转折。"],"tip":""},{"id":"2020TMS-Q19","src":"2020 淡马锡 预考","qn":"Q19","k":"预考","t":"c","a":3,"s":"看到外婆为我准备的简单早餐，我感动极了。我眼里____着泪，带着外婆满满的爱，去比赛了！","o":["存","装","泡","含"],"n":["存：储存。","装：放进去。","泡：浸在水里。","✔ 含：眼里含着泪：泪在眼眶里，还没流下来。"],"tip":""},{"id":"2020TMS-Q20","src":"2020 淡马锡 预考","qn":"Q20","k":"预考","t":"c","a":2,"s":"运动会上气氛很好。____就轮到我上场了。","o":["一丝丝","一阵阵","一转眼","一转身"],"n":["一丝丝：一点点。","一阵阵：一次又一次。","✔ 一转眼：很快（一转眼就轮到我）。","一转身：转过身子，是动作。"],"tip":""},{"id":"2021ACS-Q16","src":"2021 ACS 预考","qn":"Q16","k":"预考","t":"c","a":1,"s":"为了考取好成绩，我每天都要花很多时间做各种练习，一刻也不敢放松，生活十分____。","o":["焦急","紧张","悲伤","麻烦"],"n":["焦急：非常着急。","✔ 紧张：没有空闲、压力大（生活紧张）。和“不敢放松”相反。","悲伤：伤心。","麻烦：费事。"],"tip":""},{"id":"2021ACS-Q17","src":"2021 ACS 预考","qn":"Q17","k":"预考","t":"c","a":3,"s":"妈妈拿起一本字典问我：“你知道这本字典有多重吗？”我有些____地看着她，不明白这个问题是什么意思。","o":["无礼","抱怨","嘲笑","怀疑"],"n":["无礼：没礼貌。","抱怨：说出不满。","嘲笑：取笑。","✔ 怀疑：不太相信、心里有疑问（不明白是什么意思）。"],"tip":""},{"id":"2021ACS-Q18","src":"2021 ACS 预考","qn":"Q18","k":"预考","t":"c","a":1,"s":"不过我还是回答：“____有半公斤吧！”","o":["偏偏","大概","刚好","明明"],"n":["偏偏：故意相反。","✔ 大概：估计（大概有半公斤）。后面有“吧”。","刚好：正好。","明明：显然如此。"],"tip":""},{"id":"2021ACS-Q19","src":"2021 ACS 预考","qn":"Q19","k":"预考","t":"c","a":0,"s":"“其实这本字典的重量是不变的，但是你拿得越久，就觉得越沉重。”听了妈妈的话后，我顿时____。","o":["恍然大悟","灵机一动","胸有成竹","不知不觉"],"n":["✔ 恍然大悟：一下子明白了道理。","灵机一动：突然想到办法。","胸有成竹：心里早有把握。","不知不觉：没有察觉到。"],"tip":""},{"id":"2021ACS-Q20","src":"2021 ACS 预考","qn":"Q20","k":"预考","t":"c","a":2,"s":"但是如果我能放下“这本字典”，____休息一下，就可以坚持更久。","o":["使劲","甘愿","稍微","尽早"],"n":["使劲：用力。","甘愿：心甘情愿。","✔ 稍微：一点点（稍微休息一下）。","尽早：越早越好。"],"tip":""},{"id":"2021CHS-Q16","src":"2021 公教中学 预考","qn":"Q16","k":"预考","t":"c","a":0,"s":"当爸爸告诉我和妹妹在新家将拥有自己的房间时，我们____无法相信自己的耳朵。","o":["简直","原本","总算","好像"],"n":["✔ 简直：完全、差不多（加强语气：简直不敢相信）。","原本：本来。","总算：终于。","好像：似乎，语气太弱。"],"tip":""},{"id":"2021CHS-Q17","src":"2021 公教中学 预考","qn":"Q17","k":"预考","t":"c","a":1,"s":"我们俩又懒得收拾，所以整个房间显得又脏又乱。我们早就____能拥有自己的个人空间了。","o":["回想","盼望","请求","决定"],"n":["回想：想过去的事。","✔ 盼望：很想、期待（早就盼望能……）。","请求：向人提出要求。","决定：拿主意，这件事孩子决定不了。"],"tip":""},{"id":"2021CHS-Q18","src":"2021 公教中学 预考","qn":"Q18","k":"预考","t":"c","a":0,"s":"我向父母提议新房间不要放____的物品，越简单越好。","o":["多余","丰富","普通","贵重"],"n":["✔ 多余：超过需要的（不要放多余的东西）。","丰富：种类多。","普通：一般的，和“越简单越好”不对。","贵重：值钱。"],"tip":""},{"id":"2021CHS-Q19","src":"2021 公教中学 预考","qn":"Q19","k":"预考","t":"c","a":0,"s":"每当想起旧房间的脏乱，我就告诉自己一定要____新房间的整洁。","o":["保持","控制","爱护","整理"],"n":["✔ 保持：让整洁的状态继续下去（保持整洁）。","控制：管住不让乱动。","爱护：爱惜保护，接东西，不接“整洁”。","整理：收拾，要接房间，不接“整洁”。"],"tip":""},{"id":"2021CHS-Q20","src":"2021 公教中学 预考","qn":"Q20","k":"预考","t":"c","a":1,"s":"由于新房间的空间多了，我可以邀请同学一起来____功课，谈天说地。","o":["讲述","讨论","介绍","说明"],"n":["讲述：一个人把事情讲出来。","✔ 讨论：一起商量（讨论功课）。","介绍：让人认识。","说明：解释清楚。"],"tip":""},{"id":"2021HP-Q16","src":"2021 Henry Park 预考","qn":"Q16","k":"预考","t":"c","a":2,"s":"戴眼镜给我的生活带来了许多不便。当我做运动时，我会____眼镜掉下来而无法好好享受运动的过程。","o":["抱怨","注意","担心","怀疑"],"n":["抱怨：说出不满。","注意：留心，“注意眼镜掉下来”意思不对。","✔ 担心：害怕会发生（担心眼镜掉下来）。","怀疑：不相信。"],"tip":""},{"id":"2021HP-Q17","src":"2021 Henry Park 预考","qn":"Q17","k":"预考","t":"c","a":1,"s":"我走下开着冷气的巴士时，我的眼镜就会一片____，使我看不清眼前的事物。","o":["黑暗","模糊","隐形","乳白"],"n":["黑暗：没有光。","✔ 模糊：看不清楚（镜片起雾，一片模糊）。","隐形：看不见形体。","乳白：像奶的白色，太具体，不是常用说法。"],"tip":""},{"id":"2021HP-Q18","src":"2021 Henry Park 预考","qn":"Q18","k":"预考","t":"c","a":0,"s":"我常____以前还没有近视，不用戴眼镜的日子。","o":["回忆","幻想","盼望","妒忌"],"n":["✔ 回忆：想起过去的事（回忆以前的日子）。","幻想：想不实际的事。","盼望：期待将来。","妒忌：不服别人比自己好。"],"tip":""},{"id":"2021HP-Q19","src":"2021 Henry Park 预考","qn":"Q19","k":"预考","t":"c","a":3,"s":"那时，我的视力好，可以把很远的事物都看得清清楚楚。可是，我却不知道好好____眼睛。","o":["培养","放松","配合","照顾"],"n":["培养：使习惯、兴趣、人才成长。","放松：使松下来，“好好放松眼睛”不完整，前后意思也不对。","配合：一起合作。","✔ 照顾：爱护、照料（照顾眼睛）。"],"tip":""},{"id":"2021HP-Q20","src":"2021 Henry Park 预考","qn":"Q20","k":"预考","t":"c","a":3,"s":"如果能回到我还没戴眼镜的时候，我决不会做____眼睛的事，但现在后悔已经来不及了。","o":["灭绝","批评","破坏","伤害"],"n":["灭绝：完全消灭，用于动物种类。","批评：指出缺点。","破坏：多用于东西、环境。","✔ 伤害：使身体受到损伤（伤害眼睛）。"],"tip":""},{"id":"2021MGS-Q16","src":"2021 MGS 预考","qn":"Q16","k":"预考","t":"c","a":0,"s":"有的老人因为行动不方便，家里大概好几年没人打扫了，地板和桌椅都脏得____认不出原来的颜色了。","o":["几乎","更加","无法","凡是"],"n":["✔ 几乎：差不多（几乎认不出）。","更加：程度更深，要有比较。","无法：没办法，后面又有“认不出”，重复否定。","凡是：所有的。"],"tip":""},{"id":"2021MGS-Q17","src":"2021 MGS 预考","qn":"Q17","k":"预考","t":"c","a":2,"s":"有时他们还会在组屋楼下为老人们举办____，让老人一起用餐、谈天。","o":["节日","露营","聚会","旅行"],"n":["节日：不能“举办节日”。","露营：在野外住帐篷。","✔ 聚会：大家聚在一起（举办聚会、一起用餐谈天）。","旅行：去外地玩。"],"tip":""},{"id":"2021MGS-Q18","src":"2021 MGS 预考","qn":"Q18","k":"预考","t":"c","a":2,"s":"她很同情他们，便从那时起决定要____自己的一份爱心。","o":["提供","展开","奉献","称赞"],"n":["提供：给出（提供帮助）。","展开：开始大规模进行。","✔ 奉献：恭敬地献出（奉献爱心）。","称赞：夸奖。"],"tip":""},{"id":"2021MGS-Q19","src":"2021 MGS 预考","qn":"Q19","k":"预考","t":"c","a":3,"s":"做义工时，丽美和老人们____了深厚的感情，她照顾那些老人就像照顾自己的长辈一样。","o":["表达","浮现","制造","培养"],"n":["表达：说出感情。","浮现：出现在脑海里。","制造：做东西。","✔ 培养：慢慢建立（培养感情）。"],"tip":""},{"id":"2021MGS-Q20","src":"2021 MGS 预考","qn":"Q20","k":"预考","t":"c","a":1,"s":"虽然有时候她觉得很疲倦，但心里感到十分____。","o":["伟大","充实","积极","美妙"],"n":["伟大：成就、品格超出平常，不形容自己的感受。","✔ 充实：内容丰富、有意义（心里感到很充实）。⚠ 答案卷印的是(1)伟大，搭配不对，这里按(2)。","积极：主动。","美妙：美好动听。"],"tip":""},{"id":"2021NH-Q16","src":"2021 南华 预考","qn":"Q16","k":"预考","t":"c","a":1,"s":"小饭店平时的顾客不多，____的机会很少。","o":["购物","赚钱","消费","销售"],"n":["购物：买东西，是顾客做的。","✔ 赚钱：店主做生意得到钱。","消费：花钱，是顾客。","销售：卖货品，饭店一般说“生意”。"],"tip":""},{"id":"2021NH-Q17","src":"2021 南华 预考","qn":"Q17","k":"预考","t":"c","a":0,"s":"这棵草的名字叫“健忘草”。吃了这种草，____会忘记一些很重要的事。","o":["据说","正确","表示","呈现"],"n":["✔ 据说：听别人说（据说会忘记）。","正确：对的。","表示：说明。","呈现：显出来。"],"tip":""},{"id":"2021NH-Q18","src":"2021 南华 预考","qn":"Q18","k":"预考","t":"c","a":3,"s":"夫妇你望我，我望你，____地点头，将“健忘草”放入他的菜中。","o":["顽强","晃荡","热烈","使劲"],"n":["顽强：意志坚强。","晃荡：摇来摇去。","热烈：形容气氛、掌声。","✔ 使劲：用力（使劲地点头）。"],"tip":""},{"id":"2021NH-Q19","src":"2021 南华 预考","qn":"Q19","k":"预考","t":"c","a":2,"s":"他们心想：他看起来这么有钱，____不把自己所有的东西都留下，也可能忘记拿走钱袋吧。","o":["也许","不然","就算","于是"],"n":["也许：可能，不和“也”搭配成让步。","不然：否则。","✔ 就算：即使（就算……也……）。","于是：因此。"],"tip":""},{"id":"2021NH-Q20","src":"2021 南华 预考","qn":"Q20","k":"预考","t":"c","a":1,"s":"“啊！他的饭钱呢？”他们哭着向对方____再也不会贪财了。","o":["劝告","保证","请求","建议"],"n":["劝告：劝别人。","✔ 保证：答应一定做到（保证再也不会……）。","请求：请别人答应。","建议：提意见。"],"tip":""},{"id":"2021NY-Q16","src":"2021 南洋 预考","qn":"Q16","k":"预考","t":"c","a":0,"s":"这一天是大华的生日，妈妈特地到学校接他放学，____给他一个惊喜。","o":["打算","设计","安排","期盼"],"n":["✔ 打算：心里计划要做（打算给他一个惊喜）。","设计：做方案、图样。","安排：有条理地处理，后面多接事情、时间。","期盼：盼望。"],"tip":""},{"id":"2021NY-Q17","src":"2021 南洋 预考","qn":"Q17","k":"预考","t":"c","a":1,"s":"妈妈在校门口等了老半天，也不见大华的____。","o":["身手","身影","身子","身心"],"n":["身手：本领。","✔ 身影：人的影子、样子（不见他的身影＝没看见他）。","身子：身体。","身心：身体和精神。"],"tip":""},{"id":"2021NY-Q18","src":"2021 南洋 预考","qn":"Q18","k":"预考","t":"c","a":3,"s":"大华看见妈妈，连忙向她____坐在轮椅上的同学。","o":["报告","提醒","讲解","介绍"],"n":["报告：正式说明情况。","提醒：叫人注意。","讲解：解释说明。","✔ 介绍：让人认识（向妈妈介绍同学）。"],"tip":""},{"id":"2021NY-Q19","src":"2021 南洋 预考","qn":"Q19","k":"预考","t":"c","a":2,"s":"大华这样每天细心照顾这个行动不便的同学已经三个星期了，虽然很辛苦，但他从不____。","o":["唠叨","批评","抱怨","议论"],"n":["唠叨：说个不停，多指长辈。","批评：指出别人的错。","✔ 抱怨：说出不满（虽然辛苦，从不抱怨）。","议论：各说各的看法。"],"tip":""},{"id":"2021PH-Q16","src":"2021 培华 预考","qn":"Q16","k":"预考","t":"c","a":0,"s":"一整个星期，有五天的下午，没有人陪我，让我觉得很____。","o":["孤单","愉快","感动","麻烦"],"n":["✔ 孤单：一个人，没人陪（觉得孤单）。","愉快：开心。","感动：被打动。","麻烦：费事。"],"tip":""},{"id":"2021PH-Q17","src":"2021 培华 预考","qn":"Q17","k":"预考","t":"c","a":1,"s":"我常常____自己跟小狗一起玩乐的画面，觉得小狗可以为我的生活带来一些色彩。","o":["烦恼","幻想","想念","检验"],"n":["烦恼：发愁。","✔ 幻想：想象还没实现的事（还没有小狗）。","想念：思念见过的人或东西。","检验：检查。"],"tip":""},{"id":"2021PH-Q18","src":"2021 培华 预考","qn":"Q18","k":"预考","t":"c","a":1,"s":"我跟他们说我可以不要新衣或玩具，只要有一只小狗，我就____了。","o":["依依不舍","心满意足","恍然大悟","神机妙算"],"n":["依依不舍：舍不得分开。","✔ 心满意足：非常满足（只要有小狗，就很满足）。","恍然大悟：一下子明白。","神机妙算：预料准确。"],"tip":""},{"id":"2021PH-Q19","src":"2021 培华 预考","qn":"Q19","k":"预考","t":"c","a":3,"s":"听了我的要求，爸爸妈妈难过极了。____，他们知道自己把所有的时间花在工作上，没有关心我。","o":["必须","总是","只好","其实"],"n":["必须：一定要。","总是：一直。","只好：不得不。","✔ 其实：说出真实的情况（其实他们知道……）。"],"tip":""},{"id":"2021PH-Q20","src":"2021 培华 预考","qn":"Q20","k":"预考","t":"c","a":1,"s":"因此，他们做出了一个重要的决定。妈妈____不再去工作，留在家里照顾我。","o":["挑选","选择","选出","获选"],"n":["挑选：从很多东西、人中选。","✔ 选择：决定走哪一条路（选择不再工作）。","选出：选了出来，接名词。","获选：被选上。"],"tip":""},{"id":"2021RGS-Q16","src":"2021 莱佛士女中 预考","qn":"Q16","k":"预考","t":"c","a":0,"s":"后来，我学会了怎么上网____，因此学到了很多课本上没有的知识。","o":["搜索","检查","观看","请求"],"n":["✔ 搜索：在网上找资料（上网搜索）。","检查：查看有没有问题。","观看：看，后面要接东西。","请求：请人帮忙。"],"tip":""},{"id":"2021RGS-Q17","src":"2021 莱佛士女中 预考","qn":"Q17","k":"预考","t":"c","a":2,"s":"周末，我会玩电脑游戏来____心情。","o":["恢复","休息","放松","克服"],"n":["恢复：变回原来。","休息：后面不接“心情”。","✔ 放松：让心情松下来（放松心情）。","克服：战胜困难。"],"tip":""},{"id":"2021RGS-Q18","src":"2021 莱佛士女中 预考","qn":"Q18","k":"预考","t":"c","a":0,"s":"玩游戏时，我____可以忘掉一切不开心的事。","o":["似乎","必须","大概","根本"],"n":["✔ 似乎：好像（似乎可以忘掉一切）。","必须：一定要。","大概：估计，多用于数量、可能性。","根本：完全，常用于否定句。"],"tip":""},{"id":"2021RGS-Q19","src":"2021 莱佛士女中 预考","qn":"Q19","k":"预考","t":"c","a":1,"s":"电脑游戏中那些好看的画面和动听的音乐____地结合在一起。","o":["生动","巧妙","熟练","厉害"],"n":["生动：活泼逼真。","✔ 巧妙：高明地（巧妙地结合）。","熟练：做得很顺手，形容人做事。","厉害：很强。"],"tip":""},{"id":"2021RGS-Q20","src":"2021 莱佛士女中 预考","qn":"Q20","k":"预考","t":"c","a":3,"s":"我会控制自己使用电脑的时间，好让自己有____的时间做运动或者陪伴家人。","o":["丰富","慷慨","宽阔","充足"],"n":["丰富：种类多。","慷慨：大方。","宽阔：地方宽大。","✔ 充足：足够（充足的时间）。"],"tip":""},{"id":"2021RS-Q16","src":"2021 红十字会 预考","qn":"Q16","k":"预考","t":"c","a":3,"s":"“下周三起，全国中小学将进行居家学习。”听到了这则新闻后，我____叹了一口气。","o":["不仅","不但","不然","不禁"],"n":["不仅、不但：后面要接“而且”。","不但：同上。","不然：否则。","✔ 不禁：忍不住（不禁叹了一口气）。"],"tip":""},{"id":"2021RS-Q17","src":"2021 红十字会 预考","qn":"Q17","k":"预考","t":"c","a":0,"s":"大家必须为彼此着想，降低声量，____影响其他家人。","o":["避免","遭受","阻挡","忍受"],"n":["✔ 避免：设法不让发生（避免影响家人）。","遭受：受到不好的事。","阻挡：挡住。","忍受：勉强承受。"],"tip":""},{"id":"2021RS-Q18","src":"2021 红十字会 预考","qn":"Q18","k":"预考","t":"c","a":1,"s":"由于没有老师的____，进行网上学习时，我花了很长的时间，都没把该学的内容学好。","o":["讨论","提醒","想法","计划"],"n":["讨论：一起商量。","✔ 提醒：在旁边叫人注意（没有老师提醒，自己就分心）。","想法：意见。","计划：安排。"],"tip":""},{"id":"2021RS-Q19","src":"2021 红十字会 预考","qn":"Q19","k":"预考","t":"c","a":2,"s":"我发现我总是不自觉地眯着眼睛看东西，视线也变得越来越____。","o":["湿透","明亮","模糊","清楚"],"n":["湿透：全湿了。","明亮：亮。","✔ 模糊：看不清楚。","清楚：意思相反。"],"tip":""},{"id":"2021RS-Q20","src":"2021 红十字会 预考","qn":"Q20","k":"预考","t":"c","a":0,"s":"由于外出运动的次数减少了，我的身体变得越来越胖，也更容易生病，结果学习时总是____。","o":["无精打采","怒气冲冲","不顾一切","火冒三丈"],"n":["✔ 无精打采：没精神（生病、累，学习时没精神）。","怒气冲冲：很生气。","不顾一切：什么都不管。","火冒三丈：大发脾气。"],"tip":""},{"id":"2021Rosyth-Q16","src":"2021 Rosyth 预考","qn":"Q16","k":"预考","t":"c","a":1,"s":"明佳的____很好，喜欢帮助身边的同学。","o":["心意","心肠","关心","耐心"],"n":["心意：对人的情意，一般说“一点心意”。","✔ 心肠：心地（心肠好＝人善良）。","关心：动词。","耐心：不急躁，和“喜欢帮助同学”不直接相关。"],"tip":""},{"id":"2021Rosyth-Q17","src":"2021 Rosyth 预考","qn":"Q17","k":"预考","t":"c","a":0,"s":"“你不知道充足的睡眠能____眼睛吗？都这么大了还不会照顾自己！”","o":["保护","保住","保持","保重"],"n":["✔ 保护：照顾使不受伤害（保护眼睛）。","保住：保留住、没失去（保住性命）。","保持：维持不变。","保重：叫人注意身体，不带宾语。"],"tip":""},{"id":"2021Rosyth-Q18","src":"2021 Rosyth 预考","qn":"Q18","k":"预考","t":"c","a":0,"s":"后来，明佳低着头，____地跟其他同学说：“我是为了小强好，为什么他这么生气？”","o":["垂头丧气","目不转睛","争先恐后","依依不舍"],"n":["✔ 垂头丧气：失望、不开心的样子（低着头）。","目不转睛：眼睛盯着看。","争先恐后：抢着往前。","依依不舍：舍不得分开。"],"tip":""},{"id":"2021Rosyth-Q19","src":"2021 Rosyth 预考","qn":"Q19","k":"预考","t":"c","a":3,"s":"“而且，你____他了，他是为了照顾生病的妈妈，才没有好好睡觉。”","o":["嘲笑","责问","劝告","冤枉"],"n":["嘲笑：取笑。","责问：带责备地问。","劝告：劝人。","✔ 冤枉：错怪了没做错的人（他没有玩游戏，你冤枉他了）。"],"tip":""},{"id":"2021Rosyth-Q20","src":"2021 Rosyth 预考","qn":"Q20","k":"预考","t":"c","a":2,"s":"明佳知道自己错怪了小强。他____地说：“原来是我不好，讲话没有想到别人的感受。”","o":["讨厌","抱怨","惭愧","怀疑"],"n":["讨厌：不喜欢。","抱怨：说出不满。","✔ 惭愧：知道自己做错了，觉得不好意思。","怀疑：不相信。"],"tip":""},{"id":"2021SCGS-Q16","src":"2021 SCGS 预考","qn":"Q16","k":"预考","t":"c","a":1,"s":"几年后，他的苹果树长大了，还____了很多苹果。","o":["充满","结出","培养","制造"],"n":["充满：到处都是。","✔ 结出：长出果实（结出苹果）。","培养：使成长。","制造：用机器做。"],"tip":""},{"id":"2021SCGS-Q17","src":"2021 SCGS 预考","qn":"Q17","k":"预考","t":"c","a":0,"s":"“我们从很远的地方飞来，快要饿死了，你的苹果能给我们吃吗？”农夫觉得这些小鸟很____，便答应了它们的请求。","o":["可怜","特别","矮小","软弱"],"n":["✔ 可怜：让人同情（快饿死了，很可怜）。","特别：与众不同。","矮小：又矮又小。","软弱：没力气、不坚强。"],"tip":""},{"id":"2021SCGS-Q18","src":"2021 SCGS 预考","qn":"Q18","k":"预考","t":"c","a":2,"s":"人们知道这件事后，都____农夫是一个大笨蛋。","o":["讨论","责骂","取笑","冤枉"],"n":["讨论：一起商量。","责骂：严厉地骂，农夫没做错事。","✔ 取笑：嘲笑、开玩笑地笑话（取笑他是大笨蛋）。","冤枉：错怪。"],"tip":""},{"id":"2021SCGS-Q19","src":"2021 SCGS 预考","qn":"Q19","k":"预考","t":"c","a":3,"s":"大家都说那个农夫真幸运，____遇上了一群神鸟，吃了他的苹果还给了他一座大果园。","o":["仍然","果然","依然","竟然"],"n":["仍然、依然：还是那样。","果然：和预料的一样，大家没有预料到。","依然：同“仍然”。","✔ 竟然：没想到（竟然遇上神鸟）。"],"tip":""},{"id":"2021SCGS-Q20","src":"2021 SCGS 预考","qn":"Q20","k":"预考","t":"c","a":1,"s":"只有农夫知道，是他的____让他得到了这片大果园。","o":["和谐","善良","智慧","慈祥"],"n":["和谐：关系好。","✔ 善良：心好（把苹果给饿鸟吃）。","智慧：聪明，农夫并不是靠聪明。","慈祥：老人和蔼的样子。"],"tip":""},{"id":"2021TN-Q16","src":"2021 道南 预考","qn":"Q16","k":"预考","t":"c","a":1,"s":"那里的老人们都没有子女在身边，生活十分____。","o":["难过","孤单","伤心","麻烦"],"n":["难过：伤心，一般不形容生活。","✔ 孤单：没人陪伴（生活孤单）。","伤心：难过。","麻烦：费事。"],"tip":""},{"id":"2021TN-Q17","src":"2021 道南 预考","qn":"Q17","k":"预考","t":"c","a":3,"s":"在去老人院之前，老师特地让我们先进行了一次____，怎么才能更好地与老人们交谈。","o":["练习","解释","合作","讨论"],"n":["练习：反复做来学会。","解释：说明原因。","合作：一起做事。","✔ 讨论：大家一起想办法（同学们纷纷提出意见）。"],"tip":""},{"id":"2021TN-Q18","src":"2021 道南 预考","qn":"Q18","k":"预考","t":"c","a":0,"s":"也有的说用动作也能很好地____出自己的意思。","o":["表达","展示","讲述","呈现"],"n":["✔ 表达：把意思、感情传达出来（表达意思）。","展示：摆出来给人看。","讲述：用嘴讲，动作不是讲述。","呈现：显现出来。"],"tip":""},{"id":"2021TN-Q19","src":"2021 道南 预考","qn":"Q19","k":"预考","t":"c","a":3,"s":"老师对我们____认真的态度十分满意。","o":["优秀","详细","勤奋","积极"],"n":["优秀：成绩好，不形容态度。","详细：周密完整。","勤奋：努力，不说“勤奋认真的态度”。","✔ 积极：主动热心（积极认真的态度）。"],"tip":""},{"id":"2021TN-Q20","src":"2021 道南 预考","qn":"Q20","k":"预考","t":"c","a":2,"s":"到了做义工的那一天，我们全班同学使用了各种各样的方法和老人们____，为他们带来了愉快的一天。","o":["约定","联系","交流","分享"],"n":["约定：说好。","联系：接上关系，多指电话、通信。","✔ 交流：互相沟通、交谈（和老人们交流）。","分享：一起享用好东西。"],"tip":""},{"id":"2022ACSJ-Q16","src":"2022 ACS(J) 预考","qn":"Q16","k":"预考","t":"c","a":3,"s":"女儿拿着两个苹果开开心心地跨进门来。妈妈看到了，想：这是____孩子品德的好机会！","o":["确保","检查","讨论","培养"],"n":["确保：保证一定做到。","检查：查看有没有问题。","讨论：一起商量。","✔ 培养：慢慢教育使成长（培养品德）。"],"tip":""},{"id":"2022ACSJ-Q17","src":"2022 ACS(J) 预考","qn":"Q17","k":"预考","t":"c","a":1,"s":"“如果宝宝选择给我小的苹果，我就给她讲述《孔融让梨》的故事，教导她尊老爱幼的道理。”妈妈在心里____着。","o":["预防","计划","想象","猜测"],"n":["预防：事先防备坏事。","✔ 计划：事先打算好要怎么做（如果……我就……）。","想象：在脑子里想出画面，这里是在安排做法。","猜测：猜，后面接不知道的事。"],"tip":""},{"id":"2022ACSJ-Q18","src":"2022 ACS(J) 预考","qn":"Q18","k":"预考","t":"c","a":0,"s":"突然，她拿起大的苹果____地咬了一口，又飞快地在小的苹果上也咬了一小口。","o":["迅速","缓慢","使劲","深深"],"n":["✔ 迅速：很快（和后面“飞快地”相配）。","缓慢：很慢，和“飞快”矛盾。","使劲：用力，后面是“轻轻”，不配。","深深：形容感受、程度。"],"tip":""},{"id":"2022ACSJ-Q19","src":"2022 ACS(J) 预考","qn":"Q19","k":"预考","t":"c","a":2,"s":"看着孩子一眨眼的功夫把两个苹果都占为己有，妈妈感到既吃惊又伤心。没想到自己的孩子竟然这么____！","o":["厉害","可怜","自私","着急"],"n":["厉害：本领大。","可怜：让人同情。","✔ 自私：只想着自己（两个苹果都要）。","着急：心里急。"],"tip":""},{"id":"2022ACSJ-Q20","src":"2022 ACS(J) 预考","qn":"Q20","k":"预考","t":"c","a":2,"s":"女儿把一个她咬过的苹果递了过来，说：“给您，妈妈。这个更甜。”妈妈听了，____得流下了眼泪。","o":["难过","后悔","感动","悲伤"],"n":["难过：伤心。","后悔：做错事后懊悔。","✔ 感动：被打动（女儿把更甜的给她）。","悲伤：很伤心。"],"tip":""},{"id":"2022HP-Q16","src":"2022 Henry Park 预考","qn":"Q16","k":"预考","t":"c","a":1,"s":"影片____介绍了深海科学家的日常，让我们全面了解到他们的工作情况。","o":["大概","详细","简单","匆忙"],"n":["大概：大致，不全面。","✔ 详细：周密完整（详细介绍，才能“全面了解”）。","简单：不复杂，和“全面”矛盾。","匆忙：急急忙忙。"],"tip":""},{"id":"2022HP-Q17","src":"2022 Henry Park 预考","qn":"Q17","k":"预考","t":"c","a":0,"s":"所以深海科学家每餐都会吃____丰富的食物来增强身体的抵抗力。","o":["营养","味道","色彩","种类"],"n":["✔ 营养：食物里对身体有用的东西（营养丰富，增强抵抗力）。","味道：好不好吃。","色彩：颜色。","种类：种类丰富不一定增强抵抗力。"],"tip":""},{"id":"2022HP-Q18","src":"2022 Henry Park 预考","qn":"Q18","k":"预考","t":"c","a":2,"s":"深海科学家在进入海底探索前一定要做足充分的准备，才能____意外发生，保住生命。","o":["确定","控制","防止","阻拦"],"n":["确定：明确定下。","控制：管住。","✔ 防止：事先想办法不让坏事发生（防止意外）。","阻拦：拦住人。"],"tip":""},{"id":"2022HP-Q19","src":"2022 Henry Park 预考","qn":"Q19","k":"预考","t":"c","a":3,"s":"这段时间里，深海科学家要____很多困难，例如只能在船上活动，很不方便。","o":["忍耐","减少","避免","克服"],"n":["忍耐：把痛苦忍住，不接“困难”。","减少：使变少。","避免：设法不让发生，困难已经存在了。","✔ 克服：战胜困难。"],"tip":""},{"id":"2022HP-Q20","src":"2022 Henry Park 预考","qn":"Q20","k":"预考","t":"c","a":2,"s":"深海科学家为人类科学发展付出的努力是值得____的！","o":["高兴","安慰","称赞","发扬"],"n":["高兴：开心。","安慰：使人心情好过。","✔ 称赞：夸奖（值得称赞）。","发扬：使好的传统更好，不接“努力”。"],"tip":""},{"id":"2022MGS-Q16","src":"2022 MGS 预考","qn":"Q16","k":"预考","t":"c","a":3,"s":"她不敢抬头看人，也不愿意主动去交朋友。顽皮的同学常常会____她，还给她取了一个“丑八怪”的外号。","o":["微笑","可笑","玩笑","嘲笑"],"n":["微笑：轻轻地笑。","可笑：让人发笑的，形容词。","玩笑：名词，“开玩笑”。","✔ 嘲笑：取笑别人（嘲笑她、给她取外号）。"],"tip":""},{"id":"2022MGS-Q17","src":"2022 MGS 预考","qn":"Q17","k":"预考","t":"c","a":1,"s":"这时，一位____的老校工经过，问她为什么哭，女孩便告诉他事情的经过。","o":["善心","慈祥","和谐","客气"],"n":["善心：名词，善良的心。","✔ 慈祥：老人和蔼可亲（慈祥的老校工）。","和谐：关系好。","客气：有礼貌、谦让。"],"tip":""},{"id":"2022MGS-Q18","src":"2022 MGS 预考","qn":"Q18","k":"预考","t":"c","a":3,"s":"老校工告诉她变漂亮的方法：第一、脸上要常常挂着笑容；第二、不要再____自己的长相；第三、要热心帮助别人。","o":["受罚","放弃","错怪","抱怨"],"n":["受罚：被处罚。","放弃：不要了。","错怪：冤枉别人。","✔ 抱怨：说出不满（不要再抱怨自己的长相）。"],"tip":""},{"id":"2022MGS-Q19","src":"2022 MGS 预考","qn":"Q19","k":"预考","t":"c","a":0,"s":"老校工说她只要____这些方法去做，三个月后一定会变成全校最美丽的人。","o":["按照","尝试","利用","介绍"],"n":["✔ 按照：依照（按照这些方法去做）。","尝试：试一试，“尝试这些方法去做”不顺。","利用：使用，“利用……去做”不常说。","介绍：让人认识。"],"tip":""},{"id":"2022MGS-Q20","src":"2022 MGS 预考","qn":"Q20","k":"预考","t":"c","a":2,"s":"后来，她果然成了全校最受____的人。","o":["出名","接待","欢迎","保护"],"n":["出名：有名，不说“受出名”。","接待：招待客人。","✔ 欢迎：受欢迎＝大家喜欢。","保护：照顾不受伤害。"],"tip":""},{"id":"2022NH-Q16","src":"2022 南华 预考","qn":"Q16","k":"预考","t":"c","a":0,"s":"大家一定都在路上看过消防车飞快驶过，赶往火灾现场。不过，大家却没有机会深入____消防员的工作。","o":["了解","讲解","解决","解释"],"n":["✔ 了解：知道得清楚（深入了解）。","讲解：解释说明给别人听。","解决：处理问题。","解释：说明原因。"],"tip":""},{"id":"2022NH-Q17","src":"2022 南华 预考","qn":"Q17","k":"预考","t":"c","a":2,"s":"全岛十多家消防局决定每逢星期六早上，举行开放日，为民众____到消防局参观与学习的机会。","o":["建议","建设","提供","提议"],"n":["建议：提意见。","建设：建造。","✔ 提供：给出（提供机会）。","提议：提出主张。"],"tip":""},{"id":"2022NH-Q18","src":"2022 南华 预考","qn":"Q18","k":"预考","t":"c","a":0,"s":"除了有消防员教大家如何使用不同的灭火器之外，现场也会有____丰富的工作人员带领民众参观消防局。","o":["经验","内容","知识","感情"],"n":["✔ 经验：做过很多次学到的本领（经验丰富的工作人员）。","内容：文章、节目里的东西。","知识：书本学到的东西，“知识丰富”也可以，但带领参观更需要经验。","感情：心里的感受。"],"tip":""},{"id":"2022NH-Q19","src":"2022 南华 预考","qn":"Q19","k":"预考","t":"c","a":1,"s":"____，消防员也会在现场表演，并且告诉民众在发生火灾时如何从高楼逃生。","o":["因为","此外","而且","不如"],"n":["因为：原因。","✔ 此外：除了上面说的以外（再补充一件事）。","而且：一般放在句子中间连接。","不如：比不上。"],"tip":""},{"id":"2022NH-Q20","src":"2022 南华 预考","qn":"Q20","k":"预考","t":"c","a":0,"s":"一名到场参观的民众表示这次的活动让他获益不浅，同时也____到消防员工作的辛苦。","o":["感受","觉得","发现","面对"],"n":["✔ 感受：亲身体会（感受到辛苦）。","觉得：“觉得到”不说。","发现：找到原来不知道的东西。","面对：对着。"],"tip":""},{"id":"2022NY-Q16","src":"2022 南洋 预考","qn":"Q16","k":"预考","t":"c","a":1,"s":"我还在牙牙学语的时候，妈妈就给了我一本颜色____的布制小书，上面画满可爱的小动物。","o":["吸引","鲜艳","入迷","精彩"],"n":["吸引：动词。","✔ 鲜艳：颜色鲜明好看（颜色鲜艳）。","入迷：被吸引住。","精彩：形容表演。"],"tip":""},{"id":"2022NY-Q17","src":"2022 南洋 预考","qn":"Q17","k":"预考","t":"c","a":3,"s":"只要给我这本书，我就会停止哭闹，____地把书翻来翻去，家里也就有了片刻的宁静。","o":["甘心","尽力","勤奋","好奇"],"n":["甘心：心甘情愿。","尽力：用尽力气。","勤奋：努力不偷懒。","✔ 好奇：对新东西感兴趣（好奇地翻来翻去）。"],"tip":""},{"id":"2022NY-Q18","src":"2022 南洋 预考","qn":"Q18","k":"预考","t":"c","a":0,"s":"星期天是我最____的日子，因为那一天妈妈会带我去图书馆。","o":["期盼","希望","舒服","欢迎"],"n":["✔ 期盼：期待、盼望（最期盼的日子）。","希望：多接要实现的事，“最希望的日子”不自然。","舒服：身心舒适。","欢迎：高兴地迎接人。"],"tip":""},{"id":"2022NY-Q19","src":"2022 南洋 预考","qn":"Q19","k":"预考","t":"c","a":2,"s":"妈妈常常____我就像一只老鼠掉进了米缸里，一看到书就离不开。我不但不生气，还开玩笑地说……","o":["夸奖","责备","取笑","鼓励"],"n":["夸奖：称赞，“像老鼠掉进米缸”是开玩笑的话。","责备：批评，后面“不生气”说明不是责备。","✔ 取笑：开玩笑地笑话（我不但不生气）。","鼓励：给人信心。"],"tip":""},{"id":"2022NY-Q20","src":"2022 南洋 预考","qn":"Q20","k":"预考","t":"c","a":1,"s":"现在，人们都开始看电子书了，我这个书虫也一样。不过，我____喜爱纸质的书本。","o":["可能","仍然","专心","独自"],"n":["可能：也许。","✔ 仍然：还是（虽然看电子书，仍然喜爱纸书）。","专心：集中精神。","独自：自己一个人。"],"tip":""},{"id":"2022PLMGS-Q16","src":"2022 PLMGS 预考","qn":"Q16","k":"预考","t":"c","a":2,"s":"手机让很多的任务和活动更方便。只要打开手机，可以在任何地方随时与其他人____。","o":["提问","讲述","联系","介绍"],"n":["提问：问问题。","讲述：讲出来。","✔ 联系：和别人接上关系、沟通（随时与人联系）。","介绍：让人认识。"],"tip":""},{"id":"2022PLMGS-Q17","src":"2022 PLMGS 预考","qn":"Q17","k":"预考","t":"c","a":2,"s":"如今，许多人不管去哪儿都“机”不离手，____低着头用手机，成为“低头族”。","o":["一般","反正","经常","纷纷"],"n":["一般：普通、通常。","反正：无论如何。","✔ 经常：常常（经常低着头）。","纷纷：许多人一个接一个，不说“纷纷低着头用手机”。"],"tip":""},{"id":"2022PLMGS-Q18","src":"2022 PLMGS 预考","qn":"Q18","k":"预考","t":"c","a":0,"s":"最近有家刚开张的餐厅想出一个新点子：在非繁忙时间用餐的顾客，如享用美食时完全不用手机，便可以____到一份礼物。","o":["领取","销售","奖励","免费"],"n":["✔ 领取：去拿发给自己的东西（领取礼物）。","销售：卖。","奖励：是餐厅给的，顾客不能“奖励到”。","免费：不收钱。"],"tip":""},{"id":"2022PLMGS-Q19","src":"2022 PLMGS 预考","qn":"Q19","k":"预考","t":"c","a":1,"s":"餐厅老板想出这个办法，主要目的是为了拉近人与人之间的____。","o":["位置","距离","回忆","印象"],"n":["位置：所在的地方。","✔ 距离：远近（拉近距离）。固定搭配。","回忆：想过去。","印象：留在脑子里的样子。"],"tip":""},{"id":"2022PLMGS-Q20","src":"2022 PLMGS 预考","qn":"Q20","k":"预考","t":"c","a":3,"s":"避免顾客在用餐时只顾着用手机，而不与身边的人____。","o":["吩咐","提醒","解释","交流"],"n":["吩咐：叫人做事。","提醒：叫人注意。","解释：说明原因。","✔ 交流：互相沟通、谈话。"],"tip":""},{"id":"2022RS-Q16","src":"2022 红十字会 预考","qn":"Q16","k":"预考","t":"c","a":2,"s":"出门时，爸爸要小安帮忙____家里的门窗都关好了。","o":["爱护","支持","确保","照顾"],"n":["爱护：爱惜保护。","支持：赞成帮助。","✔ 确保：确实保证（确保门窗都关好）。","照顾：照料。"],"tip":""},{"id":"2022RS-Q17","src":"2022 红十字会 预考","qn":"Q17","k":"预考","t":"c","a":0,"s":"他随意绕了房子一圈，就大喊：“都关好了！”之后，小安____地提起行李，催爸爸妈妈赶紧去机场。","o":["兴高采烈","不慌不忙","自言自语","争先恐后"],"n":["✔ 兴高采烈：非常高兴（要去旅行了）。","不慌不忙：很镇定，和“催爸妈赶紧”矛盾。","自言自语：自己对自己说话。","争先恐后：抢着往前，只有他一个人。"],"tip":""},{"id":"2022RS-Q18","src":"2022 红十字会 预考","qn":"Q18","k":"预考","t":"c","a":1,"s":"到了机场，小安____就像一只飞出鸟笼的鸟儿，一会儿跑到东，一会儿跑到西。","o":["通常","简直","主要","平时"],"n":["通常：一般情况下。","✔ 简直：完全（简直就像……）。","主要：最重要的。","平时：平常。"],"tip":""},{"id":"2022RS-Q19","src":"2022 红十字会 预考","qn":"Q19","k":"预考","t":"c","a":1,"s":"小安紧握着拳头，____地说：“我们终于可以出国玩了！”","o":["骄傲","激动","耐心","紧张"],"n":["骄傲：自以为了不起。","✔ 激动：感情一下子很强烈（激动地说）。","耐心：不急躁。","紧张：不安。"],"tip":""},{"id":"2022RS-Q20","src":"2022 红十字会 预考","qn":"Q20","k":"预考","t":"c","a":3,"s":"才刚说完，小安就撞到了一个陌生人。小安赶紧向那位陌生人____。","o":["招手","介绍","承认","道歉"],"n":["招手：挥手打招呼。","介绍：让人认识。","承认：说出自己做的事。","✔ 道歉：说对不起（撞到人要道歉）。"],"tip":""},{"id":"2023ACSP-Q16","src":"2023 ACS(P) 预考","qn":"Q16","k":"预考","t":"c","a":0,"s":"我赶紧上前把水龙头关上。这时，我____想起老师跟我们说过的话。","o":["不禁","只是","可能","肯定"],"n":["✔ 不禁：忍不住、自然而然地（不禁想起）。","只是：仅仅。","可能：也许。","肯定：一定。"],"tip":""},{"id":"2023ACSP-Q17","src":"2023 ACS(P) 预考","qn":"Q17","k":"预考","t":"c","a":2,"s":"我国的水源____，不能浪费。","o":["严格","少量","有限","充足"],"n":["严格：要求高。","少量：数量少，一般放在名词前（少量的水）。","✔ 有限：数量不多、有限度（水源有限）。","充足：足够，和“不能浪费”不配。"],"tip":""},{"id":"2023ACSP-Q18","src":"2023 ACS(P) 预考","qn":"Q18","k":"预考","t":"c","a":3,"s":"我心想：这些人太过分了，真没公德心。水这么____，我们怎么能浪费呢？","o":["可贵","名贵","贵重","宝贵"],"n":["可贵：值得珍视，多指精神、品质。","名贵：有名而贵重，多指珍宝、名牌。","贵重：价钱高。","✔ 宝贵：非常有价值、值得珍惜（水很宝贵、时间宝贵）。"],"tip":""},{"id":"2023ACSP-Q19","src":"2023 ACS(P) 预考","qn":"Q19","k":"预考","t":"c","a":1,"s":"妈妈说：“大家必须懂得____得来不易的水，养成节约用水的好习惯。”","o":["购买","珍惜","寻找","制造"],"n":["购买：买。","✔ 珍惜：爱惜不浪费（珍惜得来不易的水）。","寻找：找。","制造：做出来。"],"tip":""},{"id":"2023ACSP-Q20","src":"2023 ACS(P) 预考","qn":"Q20","k":"预考","t":"c","a":2,"s":"爸爸接着也说：“____每个人都愿意节约用水，相信在大家的齐心协力之下，就不会发生严重缺水的问题了。”","o":["尽管","就是","要是","只是"],"n":["尽管：表示让步，后面要“还是”。","就是：即使，后面配“也”。","✔ 要是：如果（要是……就……）。","只是：仅仅。"],"tip":""},{"id":"2023AT-Q16","src":"2023 爱同 预考","qn":"Q16","k":"预考","t":"c","a":3,"s":"她平日喜欢去民众俱乐部学习新知识，也常常和朋友一起做运动，白天的日子过得热闹而____。","o":["充分","充足","充满","充实"],"n":["充分：足够（理由充分、准备充分）。","充足：数量够。","充满：填满，要接东西。","✔ 充实：内容丰富、有意义（日子过得充实）。"],"tip":""},{"id":"2023AT-Q17","src":"2023 爱同 预考","qn":"Q17","k":"预考","t":"c","a":2,"s":"但是到了晚上，她一个人在家里，没有人陪伴，觉得很____。","o":["单独","独自","孤单","独立"],"n":["单独：自己一个，不形容感觉。","独自：自己一个人（独自在家），不放在“觉得很”后面。","✔ 孤单：一个人，觉得寂寞。","独立：自己能做，不靠别人。"],"tip":""},{"id":"2023AT-Q18","src":"2023 爱同 预考","qn":"Q18","k":"预考","t":"c","a":1,"s":"去年，王婆婆有机会____一项与智能机器人互动的活动。","o":["获取","参与","安排","指定"],"n":["获取：取得。","✔ 参与：参加（参与活动）。","安排：处理安排。","指定：确定某人做某事。"],"tip":""},{"id":"2023AT-Q19","src":"2023 爱同 预考","qn":"Q19","k":"预考","t":"c","a":2,"s":"它会看着我，眨眼睛，好像在和我说话，也会站起来，转圆圈，还会____脑袋让我开心，非常可爱！","o":["挥动","摇摆","摇晃","抖动"],"n":["挥动：举起手、旗子摇动。","摇摆：来回摆动（尾巴、树枝），“摇摆脑袋”不常说。","✔ 摇晃：摇来摇去（摇晃脑袋）。","抖动：颤动。"],"tip":""},{"id":"2023AT-Q20","src":"2023 爱同 预考","qn":"Q20","k":"预考","t":"c","a":0,"s":"有机器人在家中，让他们感觉“被陪伴”，为他们带来了很多乐趣，____了生活质量。","o":["提高","增加","升高","丰富"],"n":["✔ 提高：使水平变高（提高生活质量）。","增加：数量变多。","升高：位置、温度变高。","丰富：使种类变多，不说“丰富质量”。"],"tip":""},{"id":"2023CHS-Q16","src":"2023 公教中学 预考","qn":"Q16","k":"预考","t":"c","a":2,"s":"那天下着倾盆大雨，许多下了巴士的人都没有带雨伞。附近工地的几名建筑工人看见了，____地撑着伞走了过来，为人们遮雨。","o":["四面八方","见义勇为","不约而同","齐心协力"],"n":["四面八方：各个方向。","见义勇为：见到不公平的事勇敢出手，多指危险的事。","✔ 不约而同：没约好却一起做同一件事（几名工人一起撑伞过来）。","齐心协力：大家一起出力做同一件事，这里是各自过来。"],"tip":""},{"id":"2023CHS-Q17","src":"2023 公教中学 预考","qn":"Q17","k":"预考","t":"c","a":1,"s":"他们把伞斜向一边，自己成了“落汤鸡”，却一点____也没有。","o":["唠叨","抱怨","批评","议论"],"n":["唠叨：说个不停。","✔ 抱怨：说出不满（一点抱怨也没有）。","批评：指出别人的错。","议论：各说各的看法。"],"tip":""},{"id":"2023CHS-Q18","src":"2023 公教中学 预考","qn":"Q18","k":"预考","t":"c","a":2,"s":"他们____的行为深深地打动了公众。","o":["勤奋","勇敢","善良","慷慨"],"n":["勤奋：努力不偷懒。","勇敢：不怕危险，撑伞不算危险。","✔ 善良：心好，乐于帮人。","慷慨：大方地给钱财。"],"tip":""},{"id":"2023CHS-Q19","src":"2023 公教中学 预考","qn":"Q19","k":"预考","t":"c","a":0,"s":"雨停后，为了感谢这些建筑工人，有人____饮料和面包给他们，但都被拒绝了。","o":["赠送","安排","介绍","申请"],"n":["✔ 赠送：送给（赠送饮料）。","安排：处理。","介绍：让人认识。","申请：提出请求。"],"tip":""},{"id":"2023CHS-Q20","src":"2023 公教中学 预考","qn":"Q20","k":"预考","t":"c","a":2,"s":"建筑工人对新加坡的建设有着巨大的____，建起了一座座高楼大厦。","o":["力量","作用","贡献","本领"],"n":["力量：力气。","作用：一般说“起作用”。","✔ 贡献：为国家社会做的有益的事（巨大的贡献）。","本领：能力。"],"tip":""},{"id":"2023MGS-Q16","src":"2023 MGS 预考","qn":"Q16","k":"预考","t":"c","a":2,"s":"学生可以通过与它对话来学习新知识，____写作能力，激发创造力。","o":["拖延","打扰","提高","肯定"],"n":["拖延：往后拖。","打扰：影响别人。","✔ 提高：使水平变高（提高写作能力）。","肯定：承认。"],"tip":""},{"id":"2023MGS-Q17","src":"2023 MGS 预考","qn":"Q17","k":"预考","t":"c","a":1,"s":"过度依赖这项科技会使学生失去独立思考的能力。如果学生不懂得分辨，或许会学习到____的知识。","o":["贵重","错误","糟糕","丰富"],"n":["贵重：值钱。","✔ 错误：不正确（学到错误的知识）。","糟糕：很坏，不说“糟糕的知识”。","丰富：多，是好的，和上文不配。"],"tip":""},{"id":"2023MGS-Q18","src":"2023 MGS 预考","qn":"Q18","k":"预考","t":"c","a":1,"s":"因此，是否让学生使用ChatGPT，需要____到其优点和缺点。","o":["幻想","考虑","控制","见证"],"n":["幻想：想不实际的事。","✔ 考虑：仔细想（考虑到优点和缺点）。","控制：管住。","见证：亲眼看到。"],"tip":""},{"id":"2023MGS-Q19","src":"2023 MGS 预考","qn":"Q19","k":"预考","t":"c","a":0,"s":"总的来说，学生要注意ChatGPT的使用____。","o":["方式","记录","统计","项目"],"n":["✔ 方式：方法和样子（使用方式）。","记录：写下来的东西。","统计：算总数。","项目：事情的种类。"],"tip":""},{"id":"2023MGS-Q20","src":"2023 MGS 预考","qn":"Q20","k":"预考","t":"c","a":3,"s":"通过培养学生独立思考的能力，才能更有效地____他们的学习和成长。","o":["保卫","承认","拥有","促进"],"n":["保卫：保护不受侵犯。","承认：认可。","拥有：具有。","✔ 促进：推动向前发展（促进学习和成长）。"],"tip":""},{"id":"2023MSP-Q16","src":"2023 海星 预考","qn":"Q16","k":"预考","t":"c","a":3,"s":"爸爸开了一家蛋糕店。蛋糕味道很好，____了很多顾客。","o":["招呼","照顾","对待","吸引"],"n":["招呼：打招呼、招待。","照顾：照料。","对待：用某种态度待人。","✔ 吸引：把人引过来（吸引顾客）。"],"tip":""},{"id":"2023MSP-Q17","src":"2023 海星 预考","qn":"Q17","k":"预考","t":"c","a":2,"s":"小男孩摸了摸自己的口袋，顿时满脸通红。只见他____地看了看身后的老奶奶，然后小声地对我说……","o":["妒忌","痛苦","不安","惊讶"],"n":["妒忌：不服别人好。","痛苦：很难受，太重。","✔ 不安：心里不踏实（钱不够，不好意思）。","惊讶：吃惊。"],"tip":""},{"id":"2023MSP-Q18","src":"2023 海星 预考","qn":"Q18","k":"预考","t":"c","a":0,"s":"“对不起，我还是只要一小块蛋糕吧。”我听了摇摇头，心想：真____，只想着买给自己吃。","o":["自私","失望","丢脸","孤单"],"n":["✔ 自私：只想着自己（只想着买给自己吃）。","失望：希望落空。","丢脸：没面子。","孤单：一个人。"],"tip":""},{"id":"2023MSP-Q19","src":"2023 海星 预考","qn":"Q19","k":"预考","t":"c","a":3,"s":"小男孩把蛋糕放到老奶奶面前，对她说：“奶奶，今天是您的生日，祝您生日快乐！”我看了____，这才知道是我之前想错了。","o":["胸有成竹","灵机一动","自言自语","恍然大悟"],"n":["胸有成竹：早有把握。","灵机一动：突然想到办法。","自言自语：自己对自己说话。","✔ 恍然大悟：一下子明白了（这才知道我想错了）。"],"tip":""},{"id":"2023MSP-Q20","src":"2023 海星 预考","qn":"Q20","k":"预考","t":"c","a":1,"s":"看到这一幕，我顿时觉得我家的蛋糕店____了浓浓的人情味。","o":["充实","充满","充足","充分"],"n":["充实：丰富有意义。","✔ 充满：里面满满都是（充满了人情味）。","充足：够。","充分：足够，多接理由、准备。"],"tip":""},{"id":"2023NH-Q16","src":"2023 南华 预考","qn":"Q16","k":"预考","t":"c","a":1,"s":"要给他钱的路人总是先在自己的两只手掌中____放着一个一角钱和一个五角钱，由男子选择。","o":["出现","分别","共同","结合"],"n":["出现：显出来。","✔ 分别：各自（两只手分别放一个）。","共同：一起。","结合：合在一起。"],"tip":""},{"id":"2023NH-Q17","src":"2023 南华 预考","qn":"Q17","k":"预考","t":"c","a":0,"s":"大家看到他这么做，都取笑他，可是却____拿出这几角钱让自己高兴一下。","o":["甘愿","希望","计划","支持"],"n":["✔ 甘愿：心甘情愿（甘愿拿出钱来）。","希望：想要实现。","计划：事先打算。","支持：赞成帮助。"],"tip":""},{"id":"2023NH-Q18","src":"2023 南华 预考","qn":"Q18","k":"预考","t":"c","a":1,"s":"有一个妇女每次见到这一幕，都感到十分气愤。有一天，她终于____了，就去教男子应该怎样选。","o":["舍不得","忍不住","来不及","了不起"],"n":["舍不得：不愿意放弃。","✔ 忍不住：控制不了自己（终于忍不住了）。","来不及：时间不够。","了不起：很厉害。"],"tip":""},{"id":"2023NH-Q19","src":"2023 南华 预考","qn":"Q19","k":"预考","t":"c","a":3,"s":"看见男子那傻乎乎的样子，妇女非常失望，打算____。","o":["面对","要求","接受","放弃"],"n":["面对：对着。","要求：提出希望。","接受：收下。","✔ 放弃：不再教了（非常失望，打算放弃）。"],"tip":""},{"id":"2023NH-Q20","src":"2023 南华 预考","qn":"Q20","k":"预考","t":"c","a":0,"s":"男子轻声地对她说：“如果我照你的话去做，下一次还有选择的____吗？”","o":["机会","练习","尝试","能力"],"n":["✔ 机会：可以做某事的时候（还有选择的机会）。原来他是故意选一角钱。","练习：反复做。","尝试：试一试。","能力：本领。"],"tip":""},{"id":"2023NY-Q16","src":"2023 南洋 预考","qn":"Q16","k":"预考","t":"c","a":1,"s":"为了尽快____梦想顺利进入音乐学院，他决定到街上卖艺赚钱。","o":["寻找","实现","展开","争取"],"n":["寻找：找。","✔ 实现：使梦想成真（实现梦想）。","展开：铺开、开始。","争取：努力去得到，不说“争取梦想”。"],"tip":""},{"id":"2023NY-Q17","src":"2023 南洋 预考","qn":"Q17","k":"预考","t":"c","a":0,"s":"尽管是街头卖艺，李安还是认真地演出。动听的音乐吸引了很多路人的____。","o":["注意","劝告","保证","赞许"],"n":["✔ 注意：留心看、听（吸引了路人的注意）。","劝告：劝人。","保证：答应。","赞许：称赞，不和“吸引了……的”搭配。"],"tip":""},{"id":"2023NY-Q18","src":"2023 南洋 预考","qn":"Q18","k":"预考","t":"c","a":2,"s":"之后，李安用赚来的钱报读音乐学院追求音乐梦想，在音乐方面____努力。","o":["保持","支持","继续","连续"],"n":["保持：维持原状。","支持：赞成帮助。","✔ 继续：接着做下去（继续努力）。","连续：不间断地，多接次数、时间。"],"tip":""},{"id":"2023NY-Q19","src":"2023 南洋 预考","qn":"Q19","k":"预考","t":"c","a":1,"s":"他将全部的时间和精力都投入音乐学习中，最终____困难，成为了一位著名的音乐家。","o":["改变","克服","控制","遮挡"],"n":["改变：使不同。","✔ 克服：战胜困难。","控制：管住。","遮挡：挡住。"],"tip":""},{"id":"2023NY-Q20","src":"2023 南洋 预考","qn":"Q20","k":"预考","t":"c","a":2,"s":"几年之后，李安再次经过原来的那条街，他____起以前自己曾经在那里演奏的情景。","o":["感觉","想象","回忆","纪念"],"n":["感觉：感到。","想象：想没发生过的。","✔ 回忆：想起过去的事（回忆起以前的情景）。","纪念：怀念，不接“起”。"],"tip":""},{"id":"2023PH-Q16","src":"2023 培华 预考","qn":"Q16","k":"预考","t":"c","a":2,"s":"不久前我们去了一座小岛旅游，发现那里还____着大自然的风光，看了真叫人兴奋。","o":["保管","保卫","保留","保养"],"n":["保管：看管东西。","保卫：保护国家。","✔ 保留：留下来没有改变（保留着大自然的风光）。","保养：照顾身体、机器。"],"tip":""},{"id":"2023PH-Q17","src":"2023 培华 预考","qn":"Q17","k":"预考","t":"c","a":0,"s":"农作物、鱼池、石山等，风景____，还处处散发着花儿的清香。","o":["优美","恶劣","优秀","鲜艳"],"n":["✔ 优美：美好（风景优美）。","恶劣：很坏。","优秀：成绩、表现好，不形容风景。","鲜艳：颜色鲜明，形容花、衣服。"],"tip":""},{"id":"2023PH-Q18","src":"2023 培华 预考","qn":"Q18","k":"预考","t":"c","a":3,"s":"居住在新加坡本岛，突然来到了这里，我们____进入了美妙的世界。","o":["快速","等待","恐怕","似乎"],"n":["快速：速度快。","等待：等。","恐怕：担心可能，用于不好的事。","✔ 似乎：好像（似乎进入了美妙的世界）。"],"tip":""},{"id":"2023PH-Q19","src":"2023 培华 预考","qn":"Q19","k":"预考","t":"c","a":1,"s":"岛上有一家餐馆，它的餐厅布置虽然一般，但却使人感到十分____。","o":["激动","亲切","充实","烦恼"],"n":["激动：感情强烈。","✔ 亲切：让人觉得温暖、像家人一样。","充实：丰富有意义，形容日子、生活。","烦恼：发愁。"],"tip":""},{"id":"2023PH-Q20","src":"2023 培华 预考","qn":"Q20","k":"预考","t":"c","a":3,"s":"游客可以一面____岛上新鲜的美食，一面看海，更可以远望几百公尺外的新山。","o":["羡慕","探索","观赏","品尝"],"n":["羡慕：看到别人有而自己想要。","探索：寻找研究。","观赏：观看欣赏，美食是吃的。","✔ 品尝：仔细地吃、尝味道（品尝美食）。"],"tip":""},{"id":"2023RGS-Q16","src":"2023 莱佛士女中 预考","qn":"Q16","k":"预考","t":"c","a":2,"s":"其他同学在周末时能和朋友出去玩，而我____得去上各种课程。","o":["的确","大概","总是","果然"],"n":["的确：确实。","大概：可能。","✔ 总是：每次都、一直（周末总是要上课）。","果然：和预料的一样。"],"tip":""},{"id":"2023RGS-Q17","src":"2023 莱佛士女中 预考","qn":"Q17","k":"预考","t":"c","a":1,"s":"只要我的学习成绩退步，爸爸就会马上为我____补习课。","o":["记录","安排","制造","增添"],"n":["记录：写下来。","✔ 安排：有条理地处理（安排补习课）。","制造：做东西。","增添：添上，“增添补习课”不常说。"],"tip":""},{"id":"2023RGS-Q18","src":"2023 莱佛士女中 预考","qn":"Q18","k":"预考","t":"c","a":3,"s":"妈妈告诉我，爸爸这样做是为我好，是关爱我的____。","o":["结果","作用","想法","表现"],"n":["结果：最后的情况。","作用：影响。","想法：意见。","✔ 表现：表现出来的样子（是爱我的表现）。"],"tip":""},{"id":"2023RGS-Q19","src":"2023 莱佛士女中 预考","qn":"Q19","k":"预考","t":"c","a":0,"s":"看见爸爸那____的身影出现在面前时，我感动极了。","o":["熟悉","有趣","英俊","坚固"],"n":["✔ 熟悉：很了解、常见到的（熟悉的身影）。","有趣：好玩。","英俊：形容长相，身影看不出长相。","坚固：东西结实。"],"tip":""},{"id":"2023RGS-Q20","src":"2023 莱佛士女中 预考","qn":"Q20","k":"预考","t":"c","a":1,"s":"虽然爸爸嘴上不说，但是我却深深感受到他对我的____的爱。","o":["温和","无限","慈祥","坚强"],"n":["温和：性情温顺，不形容爱的多少。","✔ 无限：没有尽头（无限的爱）。","慈祥：形容老人的样子。","坚强：意志强。"],"tip":""},{"id":"2023RS-Q16","src":"2023 红十字会 预考","qn":"Q16","k":"预考","t":"c","a":0,"s":"我拿着天乐送给我的文具盒，打开大门，大声地朝厨房的方向喊道。姐姐正在厨房忙得____。","o":["团团转","转圈圈","圈一圈","转一转"],"n":["✔ 团团转：形容非常忙（忙得团团转）。","转圈圈：真的绕圈走。","圈一圈：不是常用说法。","转一转：随便走走。"],"tip":""},{"id":"2023RS-Q17","src":"2023 红十字会 预考","qn":"Q17","k":"预考","t":"c","a":1,"s":"我去找同学天乐，要问他今早在学校里，为什么扔掉我____给他的文具盒。","o":["附送","赠送","白送","相送"],"n":["附送：买东西时另外送的。","✔ 赠送：送给（我赠送给他的）。","白送：不要钱地给，语气不对。","相送：送别人一程，“相送”多指送行。"],"tip":""},{"id":"2023RS-Q18","src":"2023 红十字会 预考","qn":"Q18","k":"预考","t":"c","a":2,"s":"我急得直冒汗，比手画脚地告诉他，我找今早站在这里等我的那个男孩。保安笑着对我摇摇头，表示没有____帮我，不让我进去。","o":["服务","目标","能力","印象"],"n":["服务：为人做事。","目标：想达到的。","✔ 能力：本领、办法（没有能力帮我）。","印象：记忆，“没有印象帮我”说不通。"],"tip":""},{"id":"2023RS-Q19","src":"2023 红十字会 预考","qn":"Q19","k":"预考","t":"c","a":3,"s":"没想到一抬头，我却发现对面高楼的阳台上有个熟悉的____。","o":["身体","身材","身形","身影"],"n":["身体：人的全身。","身材：高矮胖瘦。","身形：身体的样子，较少用。","✔ 身影：远远看到的人的样子（熟悉的身影）。"],"tip":""},{"id":"2023RS-Q20","src":"2023 红十字会 预考","qn":"Q20","k":"预考","t":"c","a":0,"s":"他见到我____的样子，急忙从口袋里拿出和我手里一模一样的文具盒，并解答我心中的疑问。","o":["愁眉苦脸","喜出望外","无精打采","胸有成竹"],"n":["✔ 愁眉苦脸：发愁难过的样子（以为他扔了我的礼物）。","喜出望外：意外地高兴。","无精打采：没精神，是累，不是难过。","胸有成竹：心里有把握。"],"tip":""},{"id":"2023Rosyth-Q17","src":"2023 Rosyth 预考","qn":"Q17","k":"预考","t":"c","a":2,"s":"乐山小学在四月份举办了“了解清洁工日”活动，让孩子们了解清洁工人每天在工作上所面对的____。","o":["心得","经验","压力","安排"],"n":["心得：学到的体会。","经验：做过学到的本领。","✔ 压力：辛苦、负担（面对的压力）。","安排：计划。"],"tip":""},{"id":"2023Rosyth-Q18","src":"2023 Rosyth 预考","qn":"Q18","k":"预考","t":"c","a":3,"s":"有一名学生在____自己在活动中所做的事时，说：“我做一次就已经可以感觉到当清洁工人的辛苦。”","o":["批评","鼓励","表达","讲述"],"n":["批评：指出缺点。","鼓励：给人信心。","表达：说出想法、感情，不接“所做的事”。","✔ 讲述：把事情讲出来（讲述自己做的事）。"],"tip":""},{"id":"2023Rosyth-Q19","src":"2023 Rosyth 预考","qn":"Q19","k":"预考","t":"c","a":3,"s":"另一位学生则指出：“____这些清洁工人的年纪很大，多数都可以当我们的爷爷奶奶了。”","o":["原本","不仅","果然","其实"],"n":["原本：本来。","不仅：要配“而且”。","果然：和预料一样。","✔ 其实：说出真实情况（其实他们年纪很大）。"],"tip":""},{"id":"2023Rosyth-Q20","src":"2023 Rosyth 预考","qn":"Q20","k":"预考","t":"c","a":2,"s":"他们的工作这么累，我以后会注意，不给他们____麻烦，保持学校环境清洁。","o":["寻找","避免","增添","制作"],"n":["寻找：找。","避免：设法不发生，“不给他们避免麻烦”意思相反。","✔ 增添：添上（不给他们增添麻烦）。","制作：做东西。"],"tip":""},{"id":"2023SCGS-Q16","src":"2023 SCGS 预考","qn":"Q16","k":"预考","t":"c","a":2,"s":"一踏入园中，一阵微风吹过，树叶____沙沙的声音，似乎在欢迎我们。","o":["发生","发送","发出","发问"],"n":["发生：出现（发生意外）。","发送：寄出、送出信息。","✔ 发出：使声音出来（发出沙沙的声音）。","发问：问问题。"],"tip":""},{"id":"2023SCGS-Q17","src":"2023 SCGS 预考","qn":"Q17","k":"预考","t":"c","a":0,"s":"我们竖起耳朵，____听着大自然的声音。","o":["仔细","吃力","耐心","拼命"],"n":["✔ 仔细：细心（仔细听）。","吃力：费力。","耐心：不急躁，“耐心听”是听别人说话。","拼命：用尽全力。"],"tip":""},{"id":"2023SCGS-Q18","src":"2023 SCGS 预考","qn":"Q18","k":"预考","t":"c","a":1,"s":"小小的鱼儿欢快地在水中游来游去。我们____着眼前的大自然，感到无比的快乐。","o":["称赞","欣赏","佩服","珍惜"],"n":["称赞：夸奖。","✔ 欣赏：喜欢地看（欣赏大自然）。","佩服：敬重别人。","珍惜：爱惜。"],"tip":""},{"id":"2023SCGS-Q19","src":"2023 SCGS 预考","qn":"Q19","k":"预考","t":"c","a":1,"s":"我们遇到了一位热心的老人，他向我们讲述了这个公园的____和故事。","o":["记录","历史","贡献","经验"],"n":["记录：写下来的东西。","✔ 历史：过去发生的事（公园的历史）。","贡献：有益的事。","经验：做过学到的。"],"tip":""},{"id":"2023SCGS-Q20","src":"2023 SCGS 预考","qn":"Q20","k":"预考","t":"c","a":0,"s":"现在我们都花很多时间在网络上，能抽出时间与朋友一起探索大自然，是非常____的。","o":["难得","少见","贵重","有限"],"n":["✔ 难得：不容易得到、很宝贵（非常难得）。","少见：不常见。","贵重：值钱。","有限：数量不多。"],"tip":""},{"id":"2023SNG-Q16","src":"2023 圣尼各拉 预考","qn":"Q16","k":"预考","t":"c","a":3,"s":"法国有一位作家一生写了104本书。他的书都很受欢迎。大家很好奇这位____的作家为什么能写出这么多精彩的书。","o":["坚强","善良","勇敢","著名"],"n":["坚强、善良、勇敢都形容品格，和“写书”无关。","善良：心好。","勇敢：不怕危险。","✔ 著名：很有名（著名的作家）。"],"tip":""},{"id":"2023SNG-Q17","src":"2023 圣尼各拉 预考","qn":"Q17","k":"预考","t":"c","a":3,"s":"他的妻子说：“因为他从不____时间，不让时间白白溜走。”","o":["影响","阻止","放弃","浪费"],"n":["影响：起作用。","阻止：拦住。","放弃：不要了。","✔ 浪费：白白用掉（浪费时间）。"],"tip":""},{"id":"2023SNG-Q18","src":"2023 圣尼各拉 预考","qn":"Q18","k":"预考","t":"c","a":0,"s":"老师回答：“我是为了____自己尽快结束对话，因为人生很短，还有很多重要的事情要去做。”","o":["提醒","避免","控制","锻炼"],"n":["✔ 提醒：从旁让人注意（单脚站着，提醒自己快点结束）。","避免：设法不发生。","控制：管住。","锻炼：使身体强壮。"],"tip":""},{"id":"2023SNG-Q19","src":"2023 圣尼各拉 预考","qn":"Q19","k":"预考","t":"c","a":2,"s":"作家听了，感到很____。他决定改变自己，珍惜时间。","o":["痛苦","失望","惭愧","悲伤"],"n":["痛苦：难受。","失望：希望落空。","✔ 惭愧：觉得自己不对，不好意思（以前总闲聊浪费时间）。","悲伤：伤心。"],"tip":""},{"id":"2023SNG-Q20","src":"2023 圣尼各拉 预考","qn":"Q20","k":"预考","t":"c","a":1,"s":"每当别人问他成功的原因时，他立刻____那位大学老师的动作，抬起了左脚，说：“这就是我成功的秘密。”","o":["幻想","模仿","复习","观察"],"n":["幻想：想不实际的事。","✔ 模仿：照着样子做（模仿老师的动作）。","复习：温习功课。","观察：仔细看。"],"tip":""},{"id":"2023TN-Q16","src":"2023 道南 预考","qn":"Q16","k":"预考","t":"c","a":0,"s":"妈妈一向对我要求严格，我常常因为一点小事就会受到批评，有时候还会____。","o":["受罚","攻击","唠叨","上当"],"n":["✔ 受罚：被处罚（批评之外，还会受罚，更重一层）。","攻击：用武力打人。","唠叨：一件事说个不停，是妈妈做的，不是“我会唠叨”。","上当：被骗。"],"tip":""},{"id":"2023TN-Q17","src":"2023 道南 预考","qn":"Q17","k":"预考","t":"c","a":3,"s":"当时，我很讨厌妈妈管教我的____，明明不是我打破花瓶，为什么我要被骂？","o":["技术","动作","过程","方式"],"n":["技术：本领。","动作：身体的活动。","过程：经过。","✔ 方式：方法和样子（管教的方式）。"],"tip":""},{"id":"2023TN-Q18","src":"2023 道南 预考","qn":"Q18","k":"预考","t":"c","a":2,"s":"妈妈狠狠地批评了我，说我没有尽到做哥哥的责任。我却____自己没有错，还伤心得大哭起来。","o":["解释","同意","坚持","争取"],"n":["解释：说明原因，后面要接原因，“解释自己没有错”不如“坚持”表示不肯认错。","同意：赞成。","✔ 坚持：一直不改（坚持自己没有错）。","争取：努力去得到。"],"tip":""},{"id":"2023TN-Q19","src":"2023 道南 预考","qn":"Q19","k":"预考","t":"c","a":0,"s":"“你作为哥哥，反而看不到自己的问题。我____你能好好想一想，你这样做对吗？”","o":["希望","祝福","宣布","提议"],"n":["✔ 希望：盼着（希望你能好好想一想）。","祝福：说好话祝愿。","宣布：正式告诉大家。","提议：提出主张。"],"tip":""},{"id":"2023TN-Q20","src":"2023 道南 预考","qn":"Q20","k":"预考","t":"c","a":2,"s":"那天晚上，我怎么也睡不着，白天的一幕幕不断____在我的脑海里。","o":["体现","实现","浮现","表现"],"n":["体现：表现出精神。","实现：梦想成真。","✔ 浮现：过去的事又出现在脑海里（固定说法）。","表现：做出来的样子。"],"tip":""},{"id":"2012PSLE-Q11","src":"2012 PSLE 真题","qn":"Q11","k":"PSLE","t":"c","a":1,"s":"我是一张白纸。我有一个____，就是让孩子们在我身上写出漂亮的字，老师们在我身上改正孩子们的错误。","o":["价值","愿望","目的","作用"],"n":["价值：东西值多少、有多大用处。","✔ 愿望：心里希望实现的事（我有一个愿望，就是……）。","目的：想达到的结果，一般说“目的是……”，不说“我有一个目的，就是”。","作用：起的效果。"],"tip":""},{"id":"2012PSLE-Q12","src":"2012 PSLE 真题","qn":"Q12","k":"PSLE","t":"c","a":1,"s":"有一天，一个学生把我从书包里拿了出来，我____极了。","o":["欢呼","兴奋","喜爱","开朗"],"n":["欢呼：高声欢叫，不说“欢呼极了”。","✔ 兴奋：非常高兴激动（兴奋极了）。","喜爱：喜欢，要接对象。","开朗：性格乐观，不是一时的心情。"],"tip":""},{"id":"2012PSLE-Q13","src":"2012 PSLE 真题","qn":"Q13","k":"PSLE","t":"c","a":3,"s":"他在我身上涂涂写写，不小心写错了一个字，就____把我丢在地上。","o":["动手","挥手","松手","随手"],"n":["动手：开始做、打人。","挥手：举手摇动。","松手：放开手，“松手把我丢在地上”不顺。","✔ 随手：顺手、不在意地（随手一丢）。"],"tip":""},{"id":"2012PSLE-Q14","src":"2012 PSLE 真题","qn":"Q14","k":"PSLE","t":"c","a":2,"s":"我们躺在地上，经过的人不但不____我们，反而在我们身上踩来踩去。","o":["接受","欣赏","理睬","喜欢"],"n":["接受：收下。","欣赏：喜欢地看。","✔ 理睬：注意、理会（不理睬我们）。","喜欢：爱好。"],"tip":""},{"id":"2012PSLE-Q15","src":"2012 PSLE 真题","qn":"Q15","k":"PSLE","t":"c","a":0,"s":"过了一会儿，我掉落在一个____的角落。这里连个人影也没有。","o":["偏僻","寂寞","孤单","破旧"],"n":["✔ 偏僻：离热闹地方远、很少人去（偏僻的角落，连人影也没有）。","寂寞：冷清孤单，多形容人的感受。","孤单：一个人，形容人。","破旧：又破又旧。"],"tip":""},{"id":"2012PSLE-Q16","src":"2012 PSLE 真题","qn":"Q16","k":"PSLE","t":"c","a":3,"s":"这里连个人影也没有，我想人们将会把我____，我只能在这里度过我的一生。","o":["丢失","消灭","放弃","忘记"],"n":["丢失：东西不见了。","消灭：彻底除掉。","放弃：不要了。","✔ 忘记：不记得（人们会忘记我）。"],"tip":""},{"id":"2013PSLE-Q11","src":"2013 PSLE 真题","qn":"Q11","k":"PSLE","t":"c","a":1,"s":"妈妈每年为孩子选择生日礼物时都费尽心思。妈妈的礼物____了对孩子的关爱，收到礼物的孩子真是幸福。","o":["表扬","充满","珍藏","保存"],"n":["表扬：公开称赞。","✔ 充满：里面满满的都是（充满了关爱）。","珍藏：好好收藏。","保存：保留下来。"],"tip":""},{"id":"2013PSLE-Q12","src":"2013 PSLE 真题","qn":"Q12","k":"PSLE","t":"c","a":2,"s":"孩子长出牙齿后，妈妈送他牙刷，教导他____良好的卫生习惯。","o":["学习","建立","养成","训练"],"n":["学习：学。","建立：开始成立，多接关系、制度。","✔ 养成：慢慢形成（养成好习惯）。","训练：有计划地练。"],"tip":""},{"id":"2013PSLE-Q13","src":"2013 PSLE 真题","qn":"Q13","k":"PSLE","t":"c","a":3,"s":"孩子年纪较大时，开始注重外表，妈妈就会送他衣服，提醒他要____注意整洁。","o":["立刻","不断","连忙","时常"],"n":["立刻：马上。","不断：连续不停。","连忙：赶快。","✔ 时常：常常（时常注意整洁）。"],"tip":""},{"id":"2013PSLE-Q14","src":"2013 PSLE 真题","qn":"Q14","k":"PSLE","t":"c","a":0,"s":"孩子步入少年期，妈妈送他放大镜，要他____观察周围的环境。","o":["仔细","热心","热烈","精细"],"n":["✔ 仔细：细心（仔细观察）。","热心：热情帮人。","热烈：气氛热闹。","精细：精致细密，形容东西做得好。"],"tip":""},{"id":"2013PSLE-Q15","src":"2013 PSLE 真题","qn":"Q15","k":"PSLE","t":"c","a":2,"s":"孩子成年了，妈妈送他耐穿的鞋子，鼓励他到外面的世界去看看，获取____的知识。","o":["无数","足够","丰富","广阔"],"n":["无数：数不清，多接人、星星。","足够：够用了。","✔ 丰富：多而广（丰富的知识）。","广阔：地方宽大。"],"tip":""},{"id":"2013PSLE-Q16","src":"2013 PSLE 真题","qn":"Q16","k":"PSLE","t":"c","a":1,"s":"妈妈送的礼物装满了一个背包，____孩子成长，妈妈的心意是多么可贵啊！","o":["配合","陪伴","照顾","保护"],"n":["配合：一起合作。","✔ 陪伴：跟在身边（礼物一直陪伴孩子成长）。","照顾：照料，礼物不会照顾人。","保护：使不受伤害。"],"tip":""},{"id":"2014PSLE-Q11","src":"2014 PSLE 真题","qn":"Q11","k":"PSLE","t":"c","a":1,"s":"这个展览的目的是要____儿童对环境保护的认识。","o":["引导","提高","配合","发展"],"n":["引导：带领。","✔ 提高：使水平变高（提高认识）。","配合：一起合作。","发展：变大变强。"],"tip":""},{"id":"2014PSLE-Q12","src":"2014 PSLE 真题","qn":"Q12","k":"PSLE","t":"c","a":3,"s":"主办当局利用卡通人物，精心____了一套关于环保的电脑游戏。","o":["摆设","建设","设立","设计"],"n":["摆设：摆放。","建设：建造。","设立：成立机构。","✔ 设计：想出方案、做出来（设计游戏）。"],"tip":""},{"id":"2014PSLE-Q13","src":"2014 PSLE 真题","qn":"Q13","k":"PSLE","t":"c","a":2,"s":"参加者必须在____的时间内，正确地回答一些有关环保的问题，才能进入另一级的游戏。","o":["请求","允许","规定","安排"],"n":["请求：请人答应。","允许：同意。","✔ 规定：事先定下的（规定的时间内）。","安排：处理，“安排的时间”不如“规定的时间”。"],"tip":""},{"id":"2014PSLE-Q14","src":"2014 PSLE 真题","qn":"Q14","k":"PSLE","t":"c","a":1,"s":"____游戏紧张刺激，小朋友都很感兴趣。","o":["虽然","由于","如果","除非"],"n":["虽然：转折，后面要“但是”。","✔ 由于：因为（由于刺激，所以感兴趣）。","如果：假设。","除非：唯一条件。"],"tip":""},{"id":"2014PSLE-Q15","src":"2014 PSLE 真题","qn":"Q15","k":"PSLE","t":"c","a":0,"s":"他们从游戏中获得欢乐，也学到各种保护环境的____。","o":["方法","规则","道理","形式"],"n":["✔ 方法：做事的办法（保护环境的方法）。","规则：规定。","道理：一般说“学到一个道理”，不说“各种……的道理”。","形式：样子。"],"tip":""},{"id":"2014PSLE-Q16","src":"2014 PSLE 真题","qn":"Q16","k":"PSLE","t":"c","a":2,"s":"小朋友挑选精美的电子卡片，写下感谢父母的话，通过电子邮件，给父母献上深深的____。","o":["回忆","愿望","祝福","感情"],"n":["回忆：想过去。","愿望：希望。","✔ 祝福：祝人平安幸福（献上祝福）。","感情：情感，“献上深深的感情”不常说。"],"tip":""},{"id":"2015PSLE-Q11","src":"2015 PSLE 真题","qn":"Q11","k":"PSLE","t":"c","a":0,"s":"王子让一个艺术家在广场上给自己立一个骑马的塑像。艺术家向王子表示他能完成这个____。","o":["任务","行动","作业","设计"],"n":["✔ 任务：交给的工作（完成任务）。","行动：去做。","作业：学生的功课。","设计：方案。"],"tip":""},{"id":"2015PSLE-Q12","src":"2015 PSLE 真题","qn":"Q12","k":"PSLE","t":"c","a":3,"s":"王子的两个随从认为这个艺术家太自以为了不起，就决定____他。","o":["处罚","警告","指责","为难"],"n":["处罚：随从没有权力处罚。","警告：提醒不要做。","指责：批评。","✔ 为难：故意给人出难题（后面他们挑毛病）。"],"tip":""},{"id":"2015PSLE-Q13","src":"2015 PSLE 真题","qn":"Q13","k":"PSLE","t":"c","a":1,"s":"两个月后，王子看到广场上的塑像，____道：“太好了，这个塑像太完美了！”","o":["呼喊","惊叹","表达","感激"],"n":["呼喊：大声叫。","✔ 惊叹：惊奇地赞叹（太完美了！）。","表达：说出想法，不接“道”。","感激：感谢。"],"tip":""},{"id":"2015PSLE-Q14","src":"2015 PSLE 真题","qn":"Q14","k":"PSLE","t":"c","a":1,"s":"艺术家听了，轻声地对王子说：“请给我几天的时间把这些____改正过来。”","o":["坏处","缺点","不满","错误"],"n":["坏处：害处。","✔ 缺点：不足的地方（马头太大、剑太长）。","不满：不满意的心情。","错误：不对的事，塑像本身没“错”，是“不够好”。"],"tip":""},{"id":"2015PSLE-Q15","src":"2015 PSLE 真题","qn":"Q15","k":"PSLE","t":"c","a":2,"s":"艺术家用一块布把塑像的四周围了起来，他说这样才可以____工作。","o":["兴奋","仔细","专心","努力"],"n":["兴奋：激动。","仔细：细心，“围起来”是为了不被打扰。","✔ 专心：集中精神，不被打扰（围起来才能专心）。","努力：用力去做。"],"tip":""},{"id":"2015PSLE-Q16","src":"2015 PSLE 真题","qn":"Q16","k":"PSLE","t":"c","a":0,"s":"那两个随从前前后后看了一遍，____地表示原来的毛病都没有了。","o":["异口同声","争先恐后","慢条斯理","赞不绝口"],"n":["✔ 异口同声：两人一起说出同样的话。","争先恐后：抢着往前。","慢条斯理：慢慢吞吞。","赞不绝口：不停地称赞，但他们只是说毛病没了。"],"tip":""},{"id":"2016PSLE-Q11","src":"2016 PSLE 真题","qn":"Q11","k":"PSLE","t":"c","a":3,"s":"妈妈带我去一家新开张的鱼店买金鱼。水族箱里有____的金鱼。我左挑右选，终于看中了两条。","o":["来来往往","万紫千红","密密麻麻","各种各样"],"n":["来来往往：来去不停，多指人车。","万紫千红：形容百花盛开。","密密麻麻：又多又密，让人不舒服。","✔ 各种各样：很多种类（左挑右选）。"],"tip":""},{"id":"2016PSLE-Q12","src":"2016 PSLE 真题","qn":"Q12","k":"PSLE","t":"c","a":3,"s":"老板到底在打什么主意？他可能____要我买个鱼缸。","o":["表示","打算","准备","趁机"],"n":["表示：说明。","打算：计划，这里是猜他的心思，“趁机”更有“打主意”的意思。","准备：事先安排。","✔ 趁机：利用机会（趁机要我多买一个鱼缸）。"],"tip":""},{"id":"2016PSLE-Q13","src":"2016 PSLE 真题","qn":"Q13","k":"PSLE","t":"c","a":2,"s":"他怕金鱼死了，我会找上门来。想到这里，我对老板有些____。","o":["别扭","烦恼","不满","担心"],"n":["别扭：不顺心、不自然。","烦恼：发愁。","✔ 不满：不满意（怀疑老板打坏主意）。","担心：放心不下。"],"tip":""},{"id":"2016PSLE-Q14","src":"2016 PSLE 真题","qn":"Q14","k":"PSLE","t":"c","a":0,"s":"“这两条金鱼是我要买的，它们死了，你也不必____责任。”","o":["承担","跟随","接受","面对"],"n":["✔ 承担：担当（承担责任）。","跟随：跟着。","接受：收下。","面对：对着。"],"tip":""},{"id":"2016PSLE-Q15","src":"2016 PSLE 真题","qn":"Q15","k":"PSLE","t":"c","a":1,"s":"“如果鱼缸太小，它就很难养活。____你忍心看这么漂亮的金鱼，就这样死掉吗？”","o":["究竟","难道","除非","也许"],"n":["究竟：到底，用于追问。","✔ 难道：用于反问（难道你忍心……吗？）。","除非：唯一条件。","也许：可能。"],"tip":""},{"id":"2016PSLE-Q16","src":"2016 PSLE 真题","qn":"Q16","k":"PSLE","t":"c","a":0,"s":"原来老板这么有爱心，我错怪了他。他对每一个生命的____让我十分感动。","o":["爱护","保存","坚持","了解"],"n":["✔ 爱护：爱惜保护（对生命的爱护）。","保存：保留。","坚持：不放弃。","了解：知道。"],"tip":""},{"id":"2017PSLE-Q16","src":"2017 PSLE 真题","qn":"Q16","k":"PSLE","t":"c","a":0,"s":"班长拍了拍我的肩膀说：“这次不及格，并不____你永远不及格啊！下次努力就好了，加油！”","o":["表示","表明","决定","肯定"],"n":["✔ 表示：说明、意味着（不表示你永远不及格）。","表明：清楚地表示出来，多接态度、立场。","决定：拿主意。","肯定：一定。"],"tip":""},{"id":"2017PSLE-Q17","src":"2017 PSLE 真题","qn":"Q17","k":"PSLE","t":"c","a":1,"s":"“走吧！别一副____的样子，我们都喜欢原来那个充满自信的你！”","o":["死气沉沉","闷闷不乐","装模作样","筋疲力尽"],"n":["死气沉沉：没有活力，多形容地方、气氛。","✔ 闷闷不乐：心里不痛快（测验不及格）。","装模作样：故意做样子。","筋疲力尽：非常累。"],"tip":""},{"id":"2017PSLE-Q18","src":"2017 PSLE 真题","qn":"Q18","k":"PSLE","t":"c","a":0,"s":"“我们都喜欢原来那个____自信的你！”","o":["充满","需要","保持","恢复"],"n":["✔ 充满：满满都是（充满自信）。","需要：要。","保持：维持。","恢复：变回，“恢复自信的你”不顺。"],"tip":""},{"id":"2017PSLE-Q19","src":"2017 PSLE 真题","qn":"Q19","k":"PSLE","t":"c","a":2,"s":"自从那次以后，我们“有福同享，有难同当”，友谊____了不少。","o":["稳固","强劲","增进","亲切"],"n":["稳固：稳定牢固，不和“了不少”搭配。","强劲：力量大。","✔ 增进：加深、变好（友谊增进了不少）。","亲切：温暖亲近。"],"tip":""},{"id":"2017PSLE-Q20","src":"2017 PSLE 真题","qn":"Q20","k":"PSLE","t":"c","a":3,"s":"在成长的过程中，我们不能缺少朋友，____是好朋友。","o":["并且","就算","甚至","尤其"],"n":["并且：而且。","就算：即使。","甚至：更进一步。","✔ 尤其：特别（尤其是好朋友）。"],"tip":""},{"id":"2018PSLE-Q16","src":"2018 PSLE 真题","qn":"Q16","k":"PSLE","t":"c","a":1,"s":"我看见阳台上种了不少花，其中有一盆花的花盆特别____，可是盆里的花却快枯了。","o":["杰出","精美","有名","优秀"],"n":["杰出：成就出众，形容人。","✔ 精美：精致漂亮（花盆精美）。","有名：出名。","优秀：成绩好，形容人。"],"tip":""},{"id":"2018PSLE-Q17","src":"2018 PSLE 真题","qn":"Q17","k":"PSLE","t":"c","a":0,"s":"他把它放在阳台最通风、阳光最____的地方，每天给它浇水，没想到花却长不好。","o":["充足","充实","充满","充分"],"n":["✔ 充足：足够（阳光充足）。","充实：丰富有意义。","充满：要接东西。","充分：多接理由、准备。"],"tip":""},{"id":"2018PSLE-Q18","src":"2018 PSLE 真题","qn":"Q18","k":"PSLE","t":"c","a":2,"s":"“你怎么不去____那个爱种花的朋友呢？”我立刻提醒他。","o":["求救","寻找","请教","提问"],"n":["求救：遇到危险求人救。","寻找：找人，不是重点。","✔ 请教：向懂的人求教（请教爱种花的朋友）。","提问：问问题，不直接接人。"],"tip":""},{"id":"2018PSLE-Q19","src":"2018 PSLE 真题","qn":"Q19","k":"PSLE","t":"c","a":3,"s":"过了几天，他____地跟我说，那盆花开始长出新的叶子了。","o":["奔走相告","七嘴八舌","不约而同","兴高采烈"],"n":["奔走相告：很多人跑来跑去互相告诉。","七嘴八舌：很多人抢着说。","不约而同：没约好却一起做。","✔ 兴高采烈：非常高兴（花长出新叶子了）。"],"tip":""},{"id":"2018PSLE-Q20","src":"2018 PSLE 真题","qn":"Q20","k":"PSLE","t":"c","a":2,"s":"这种花既不需要太多的阳光，也不需要太多的水分，只要给它一个____的角落就够了。","o":["宽敞","宁静","阴凉","偏僻"],"n":["宽敞：空间大。","宁静：安静。","✔ 阴凉：没太阳、凉快（不需要太多阳光）。","偏僻：很少人去。"],"tip":""},{"id":"2019PSLE-Q16","src":"2019 PSLE 真题","qn":"Q16","k":"PSLE","t":"c","a":1,"s":"他们带去的水早已经喝完，而两个人又感到十分疲倦。那个学生一直____他们不能走出森林。","o":["反对","担心","提醒","批评"],"n":["反对：不赞成。","✔ 担心：害怕会这样（担心走不出森林）。","提醒：叫人注意。","批评：指出错。"],"tip":""},{"id":"2019PSLE-Q17","src":"2019 PSLE 真题","qn":"Q17","k":"PSLE","t":"c","a":0,"s":"最后，这个乐观的科学家靠着星星指引的方向，以及和家人团聚的____，成功地带领学生走出了森林。","o":["愿望","感情","用意","热心"],"n":["✔ 愿望：心里想实现的事（和家人团聚的愿望）。","感情：情感。","用意：做事的目的。","热心：热情。"],"tip":""},{"id":"2019PSLE-Q18","src":"2019 PSLE 真题","qn":"Q18","k":"PSLE","t":"c","a":3,"s":"人生的路是____的，快乐与不快乐，往往就看自己怎么想。","o":["东倒西歪","五颜六色","人来人往","凹凸不平"],"n":["东倒西歪：站不稳。","五颜六色：颜色很多。","人来人往：人很多。","✔ 凹凸不平：高高低低不平（比喻人生有顺有不顺）。"],"tip":""},{"id":"2019PSLE-Q19","src":"2019 PSLE 真题","qn":"Q19","k":"PSLE","t":"c","a":1,"s":"只要你愿意，快乐甚至可以时时____着你。","o":["保护","跟随","接触","鼓励"],"n":["保护：使不受伤害。","✔ 跟随：跟着（快乐时时跟随着你）。","接触：碰到。","鼓励：给人信心。"],"tip":""},{"id":"2019PSLE-Q20","src":"2019 PSLE 真题","qn":"Q20","k":"PSLE","t":"c","a":2,"s":"人们看待问题的态度不同，结果也不同。那些态度____的人，总是能够让自己的人生充满希望。","o":["兴奋","敏锐","积极","明显"],"n":["兴奋：激动。","敏锐：反应快。","✔ 积极：正面、乐观（态度积极）。","明显：清楚地显出。"],"tip":""},{"id":"2020PSLE-Q16","src":"2020 PSLE 真题","qn":"Q16","k":"PSLE","t":"c","a":1,"s":"6月25日是他的生日，每年的这一天他都会请人们吃蛋糕。他已经____30年在生日当天送蛋糕给人们吃。","o":["依然","连续","一直","一样"],"n":["依然：仍旧，不接数字。","✔ 连续：一年接一年不间断（连续30年）。","一直：从来如此，“一直30年”不通。","一样：相同。"],"tip":""},{"id":"2020PSLE-Q17","src":"2020 PSLE 真题","qn":"Q17","k":"PSLE","t":"c","a":2,"s":"“人们生活紧张，吃蛋糕可以让大家开心，____一下心情。”","o":["了解","增加","放松","保持"],"n":["了解：知道。","增加：变多。","✔ 放松：让心情松下来（放松一下心情）。","保持：维持不变。"],"tip":""},{"id":"2020PSLE-Q18","src":"2020 PSLE 真题","qn":"Q18","k":"PSLE","t":"c","a":1,"s":"李爷爷又说：“大家____的样子，就是我最好的生日礼物。”","o":["佩服","惊喜","自然","欢迎"],"n":["佩服：敬重。","✔ 惊喜：又惊又喜（拿到免费蛋糕）。","自然：不勉强。","欢迎：迎接。"],"tip":""},{"id":"2020PSLE-Q19","src":"2020 PSLE 真题","qn":"Q19","k":"PSLE","t":"c","a":3,"s":"有些人事先从网上知道这件事，特地来排队，其他不知情的人到要付钱时，才知道蛋糕是____的。","o":["庆祝","奖励","领取","免费"],"n":["庆祝：为喜事纪念。","奖励：给有成绩的人的东西。","领取：去拿。","✔ 免费：不要钱（要付钱时才知道不用钱）。"],"tip":""},{"id":"2020PSLE-Q20","src":"2020 PSLE 真题","qn":"Q20","k":"PSLE","t":"c","a":2,"s":"有几个小朋友拿了蛋糕，围在李爷爷的身旁，____地为他唱起生日歌，让李爷爷乐得眉开眼笑。","o":["七嘴八舌","依依不舍","兴高采烈","齐心协力"],"n":["七嘴八舌：很多人乱说话，不是唱歌。","依依不舍：舍不得分开。","✔ 兴高采烈：非常高兴。","齐心协力：一起出力做事。"],"tip":""},{"id":"2021PSLE-Q16","src":"2021 PSLE 真题","qn":"Q16","k":"PSLE","t":"c","a":3,"s":"我和弟弟都很喜欢小动物，一直想养只小兔子。为了____我们的愿望，妈妈便带我们到动物收容中心。","o":["爱护","争取","保卫","实现"],"n":["爱护：爱惜。","争取：努力去得到，不接“愿望”。","保卫：保护不受侵犯。","✔ 实现：使愿望成真。"],"tip":""},{"id":"2021PSLE-Q17","src":"2021 PSLE 真题","qn":"Q17","k":"PSLE","t":"c","a":0,"s":"负责人告诉妈妈，中心有一个课程，____领养的人怎样照顾小动物。","o":["教导","鼓励","命令","提议"],"n":["✔ 教导：教育指导（教导……怎样照顾）。","鼓励：给信心。","命令：上级强制。","提议：提出主张。"],"tip":""},{"id":"2021PSLE-Q18","src":"2021 PSLE 真题","qn":"Q18","k":"PSLE","t":"c","a":1,"s":"中心希望通过这个课程，____领养的人对小动物的爱心。","o":["肯定","培养","表扬","测试"],"n":["肯定：承认。","✔ 培养：慢慢使形成（培养爱心）。","表扬：称赞。","测试：考一考。"],"tip":""},{"id":"2021PSLE-Q19","src":"2021 PSLE 真题","qn":"Q19","k":"PSLE","t":"c","a":0,"s":"这个中心收养了很多小动物，比如小兔子、小狗、小猫等。对我们来说，这里____就是一个小小动物园。","o":["简直","曾经","果然","反正"],"n":["✔ 简直：差不多就是（简直就是动物园）。","曾经：以前。","果然：和预料的一样。","反正：无论如何。"],"tip":""},{"id":"2021PSLE-Q20","src":"2021 PSLE 真题","qn":"Q20","k":"PSLE","t":"c","a":2,"s":"老师说接下来的几堂课，他还会介绍怎样照顾其他小动物，让我们____不同动物的生活习惯。","o":["设计","关心","了解","带领"],"n":["设计：想方案。","关心：放在心上。","✔ 了解：知道清楚（了解生活习惯）。","带领：领着。"],"tip":""},{"id":"2022PSLE-Q16","src":"2022 PSLE 真题","qn":"Q16","k":"PSLE","t":"c","a":2,"s":"国华是个害羞的学生，上课时总是不敢发问。黄老师经过一段时间的____，发现国华对自己没有信心。","o":["关心","搜索","观察","检查"],"n":["关心：放在心上，“经过一段时间的关心，发现”不顺。","搜索：寻找。","✔ 观察：仔细看（经过观察，发现……）。","检查：查有没有问题。"],"tip":""},{"id":"2022PSLE-Q17","src":"2022 PSLE 真题","qn":"Q17","k":"PSLE","t":"c","a":1,"s":"一天，下课后，他把国华叫到办公室，想进一步____情况。","o":["认识","了解","听说","提问"],"n":["认识：认得人。","✔ 了解：知道清楚（了解情况）。","听说：听别人说。","提问：问问题。"],"tip":""},{"id":"2022PSLE-Q18","src":"2022 PSLE 真题","qn":"Q18","k":"PSLE","t":"c","a":2,"s":"“老师，每当我不理解时，很想举手问您。可是，我怕同学们____我，所以……”","o":["打扰","妒忌","嘲笑","对抗"],"n":["打扰：影响。","妒忌：不服别人好。","✔ 嘲笑：取笑（怕被同学取笑）。","对抗：作对。"],"tip":""},{"id":"2022PSLE-Q19","src":"2022 PSLE 真题","qn":"Q19","k":"PSLE","t":"c","a":0,"s":"黄老师说：“你去打开前排的灯。”国华按照黄老师的____，把前排的灯打开。","o":["吩咐","解释","讲述","提议"],"n":["✔ 吩咐：老师口头交代做的事（按照老师的吩咐）。","解释：说明原因。","讲述：讲出来。","提议：提出主张，老师是直接叫他做。"],"tip":""},{"id":"2022PSLE-Q20","src":"2022 PSLE 真题","qn":"Q20","k":"PSLE","t":"c","a":1,"s":"“……所以你不必在意别人的眼光。”国华听了，____。他看着黄老师，眼睛就像打开的灯那样明亮。","o":["心满意足","恍然大悟","灵机一动","喜出望外"],"n":["心满意足：很满足。","✔ 恍然大悟：一下子明白了道理。","灵机一动：突然想到办法。","喜出望外：意外的高兴。"],"tip":""},{"id":"2023PSLE-Q16","src":"2023 PSLE 真题","qn":"Q16","k":"PSLE","t":"c","a":0,"s":"有一个自以为很厉害的人，带着一群探险家出海寻宝。在出发前，他很____地说：“无论遇到什么危险，我都可以应付，请大家放心！”","o":["自信","智慧","想法","能力"],"n":["✔ 自信：相信自己（很自信地说）。","智慧：聪明，名词。","想法：名词。","能力：名词。"],"tip":""},{"id":"2023PSLE-Q17","src":"2023 PSLE 真题","qn":"Q17","k":"PSLE","t":"c","a":1,"s":"那个人立刻站出来，大声地说自己会开船，可以____船夫，因为他已经背熟了开船的方法。","o":["服务","代替","接待","转换"],"n":["服务：为人做事。","✔ 代替：换他来做（代替船夫开船）。","接待：招待。","转换：改变。"],"tip":""},{"id":"2023PSLE-Q18","src":"2023 PSLE 真题","qn":"Q18","k":"PSLE","t":"c","a":0,"s":"他们的船不断地被海浪拍打，情况十分危急。那个人嘴唇发抖，____地念着开船的方法，手忙脚乱地转动方向盘。","o":["慌张","惭愧","轻快","自然"],"n":["✔ 慌张：急得手忙脚乱。","惭愧：做错事不好意思。","轻快：轻松愉快。","自然：不勉强，和“手忙脚乱”矛盾。"],"tip":""},{"id":"2023PSLE-Q19","src":"2023 PSLE 真题","qn":"Q19","k":"PSLE","t":"c","a":3,"s":"虽然他背熟了开船的方法，却没有真正开过船，结果害了____人。","o":["完全","任何","一切","所有"],"n":["完全：全部地，是副词。","任何：用在否定句或“都”前面（任何人都……）。","一切：多指事物。","✔ 所有：全部的（害了所有人）。"],"tip":""},{"id":"2023PSLE-Q20","src":"2023 PSLE 真题","qn":"Q20","k":"PSLE","t":"c","a":2,"s":"因此，我们学了知识后，必须要运用，以____自己真的学会了。","o":["测验","训练","确保","表现"],"n":["测验：考试。","训练：有计划地练。","✔ 确保：确实保证（以确保真的学会了）。","表现：显出来。"],"tip":""},{"id":"EOY-Q16","src":"2026 小五 EOY 考卷","qn":"Q16","k":"EOY","t":"c","a":0,"s":"森林里要举行一场爬树比赛，这是小猴子的拿手本领。于是，他每天到处乱逛，从不练习。小松鼠看到小猴子一副自信满满的样子，心里有点____，心想：小猴子真的那么有本事吗？","o":["怀疑","叹气","惊讶","盼望"],"n":["✔ 怀疑：不太相信（心想：他真的有本事吗？）。","叹气：动作，不说“心里有点叹气”。","惊讶：吃惊，后面是疑问，不是吃惊。","盼望：期待。"],"tip":""},{"id":"EOY-Q17","src":"2026 小五 EOY 考卷","qn":"Q17","k":"EOY","t":"c","a":2,"s":"小猴子一边快速往上爬，一边忍不住回头做鬼脸，还伸出手对其他选手挥来挥去，十分____。","o":["努力","认真","顽皮","害怕"],"n":["努力：用力去做。","认真：不马虎，做鬼脸不是认真。","✔ 顽皮：爱玩爱闹（做鬼脸、挥手）。","害怕：怕。"],"tip":""},{"id":"EOY-Q18","src":"2026 小五 EOY 考卷","qn":"Q18","k":"EOY","t":"c","a":3,"s":"小猫没有放弃，继续往上爬。小猴子看到后，竟然停下来____小猫，说：“哈哈，你爬得这么慢，怎么可能赢呢？”","o":["帮助","鼓励","唠叨","嘲笑"],"n":["帮助：帮忙。","鼓励：给信心，他说的话是笑话小猫。","唠叨：说个不停。","✔ 嘲笑：取笑（你爬得这么慢）。"],"tip":""},{"id":"EOY-Q19","src":"2026 小五 EOY 考卷","qn":"Q19","k":"EOY","t":"c","a":3,"s":"这时，一直专心爬树的小松鼠到达了树顶。看到第一名____是小松鼠，小猴子低着头走到一旁。","o":["果然","虽然","不然","竟然"],"n":["果然：和预料的一样，小猴子没想到。","虽然：转折。","不然：否则。","✔ 竟然：没想到（第一名竟然是小松鼠）。"],"tip":""},{"id":"EOY-Q20","src":"2026 小五 EOY 考卷","qn":"Q20","k":"EOY","t":"c","a":1,"s":"回想起刚才自己得意的样子，心里感到十分____。","o":["可怕","惭愧","骄傲","怀疑"],"n":["可怕：让人害怕。","✔ 惭愧：知道自己不对，不好意思。","骄傲：自以为了不起，现在输了。","怀疑：不相信。"],"tip":""}];
const TYPE_NAME={f:"选词填空",c:"短文填空",m:"词义",s:"哪个句子正确"};
const isFill=q=>q.t==="f"||q.t==="c";
const KEY="lava_words_v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>esc(s).replace(/【(.+?)】/g,'<u class="key">$1</u>');
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const byId=Object.fromEntries(BANK.map(q=>[q.id,q]));
function keyword(q){
  if(isFill(q))return q.o[q.a];
  const m=(q.t==="m"?q.s:q.o[0]).match(/【(.+?)】/);return m?m[1]:"";
}

/* ---------- state ---------- */
let S={profiles:{},cur:"",type:"all",sound:true,updated:0};
function blankProfile(name){
  const p={name,st:{},log:{},bugs:0,rounds:[]};
  BANK.forEach(q=>{if(q.tip&&q.tip.indexOf("EOY 原题")>=0)p.st[q.id]=[1,1,0,1,""]});
  return p;
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&o.profiles)S=Object.assign(S,o)}}catch(e){}
  if(S.cur&&!S.profiles[S.cur])S.profiles[S.cur]=blankProfile(S.cur);
  Object.values(S.profiles).forEach(p=>{if(!p.rounds)p.rounds=[]});
}
const EMPTY={st:{},log:{},rounds:[],bugs:0};
function P(){return S.profiles[S.cur]||EMPTY}
let dbRef=null,writing=false,pendingWrite=false;
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  queueRemote();
}
async function queueRemote(){
  if(!dbRef)return;
  if(writing){pendingWrite=true;return}
  writing=true;
  try{await dbRef.set(JSON.parse(JSON.stringify(S)))}catch(e){if(e&&e.code==="invalid_argument")dbRef=null}
  writing=false;
  if(pendingWrite){pendingWrite=false;queueRemote()}
}
async function connectDb(){
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use("db");if(!db)return;
    const ref=db.doc("progress/all");
    const snap=await Promise.race([ref.get(),new Promise((_,r)=>setTimeout(()=>r("timeout"),10000))]);
    dbRef=ref;
    if(snap.exists){const d=snap.data();
      if(d&&d.profiles&&(d.updated||0)>(S.updated||0)){S=Object.assign({},S,JSON.parse(JSON.stringify(d)));try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}renderHome()}
      else if((S.updated||0)>(d&&d.updated||0))queueRemote();
    }else if(S.updated)queueRemote();
  }catch(e){}
}

/* ---------- stats ---------- */
function stat(id){return P().st[id]||null} // [box,seen,right,wrong,lastDate]
function record(q,ok){
  const p=P(),s=p.st[q.id]||[0,0,0,0,""],d=today();
  s[1]++; if(ok){s[2]++; s[0]=s[0]===0?2:Math.min(3,s[0]+1);} else {s[3]++; s[0]=1;}
  s[4]=d;p.st[q.id]=s;
  const L=p.log[d]||[0,0];L[0]++;if(ok)L[1]++;p.log[d]=L;
  if(ok)p.bugs++;
  if(sess){
    if(!sess.round){const now=new Date();sess.round={d:d,t:String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0"),m:sess.mode,n:sess.qs.length,a:0,r:0,w:[],sec:0};
      p.rounds=p.rounds||[];p.rounds.push(sess.round);if(p.rounds.length>2000)p.rounds.splice(0,p.rounds.length-2000)}
    const R=sess.round;R.a++;if(ok)R.r++;else R.w.push([q.id,picked]);R.sec=Math.round((Date.now()-sess.t0)/1000);
  }
  save();
}
function streak(){
  const log=P().log;let n=0;const d=new Date();
  if(!(log[today()]&&log[today()][0]>=20))d.setDate(d.getDate()-1);
  for(;;){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(log[k]&&log[k][0]>=20){n++;d.setDate(d.getDate()-1)}else break}
  return n;
}

/* ---------- session ---------- */
let sess=null;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function pool(){return BANK.filter(q=>S.type==="all"||q.t===S.type)}
function pick(n,wrongOnly){
  const d=today(),pl=pool();
  const box1=shuffle(pl.filter(q=>{const s=stat(q.id);return s&&s[0]===1&&s[4]!==d})).concat(shuffle(pl.filter(q=>{const s=stat(q.id);return s&&s[0]===1&&s[4]===d})));
  if(wrongOnly)return shuffle(box1.slice(0,n));
  const box2=shuffle(pl.filter(q=>{const s=stat(q.id);return s&&s[0]===2&&s[4]!==d}));
  const fresh=shuffle(pl.filter(q=>!stat(q.id)));
  const rest=shuffle(pl.filter(q=>{const s=stat(q.id);return s&&s[0]===3}));
  const out=[];const add=(arr,k)=>{for(const q of arr){if(out.length>=k)break;if(!out.includes(q))out.push(q)}};
  add(box1,Math.ceil(n*.4));add(box2,out.length+Math.ceil(n*.2));add(fresh,n);add(box1,n);add(box2,n);add(rest,n);
  return shuffle(out);
}
function start(n,wrongOnly){
  const qs=pick(n,wrongOnly);
  if(!qs.length){$("goWrong").textContent="错题盒是空的，先刷新题吧";return}
  const tn=S.type==="all"?"全部题型":TYPE_NAME[S.type];
  sess={qs,i:0,bugs:0,right:0,wrong:[],round:null,t0:Date.now(),mode:(wrongOnly?"错题盒":"刷 "+n+" 题")+"（"+tn+"）"};
  show("quiz");renderQ();
}

/* ---------- sound ---------- */
let AC=null;
function beep(kind){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
    const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
    if(kind==="ok"){o.type="triangle";o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(1040,t+.12);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}
    else{o.type="sawtooth";o.frequency.setValueAtTime(300,t);o.frequency.linearRampToValueAtTime(150,t+.35);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.start(t);o.stop(t+.4)}
  }catch(e){}
}

/* ---------- quiz render ---------- */
let crossed=new Set(),picked=-1,phase="cross";
function renderQ(){
  const q=sess.qs[sess.i];crossed=new Set();picked=-1;phase="cross";
  $("qCount").textContent=(sess.i+1)+"/"+sess.qs.length;
  $("qBar").style.width=(sess.i/sess.qs.length*100)+"%";
  $("qBugs").textContent=sess.bugs;
  $("qType").textContent=TYPE_NAME[q.t];
  $("qSrc").textContent=q.src+(q.qn.startsWith("Q")?" "+q.qn:"");
  let stem=isFill(q)?esc(q.s).replace("____",'<span class="blank" id="blank">　</span>'):fmt(q.s);
  if(q.t==="c")stem='<div class="muted" style="font-size:15px">短文里的一段：</div>'+stem;
  if(q.t==="m")stem+='<div class="muted" style="font-size:16px">画线词语的意思是：</div>';
  $("qStem").innerHTML=stem;
  const st=$("stage");st.className="stage idle";$("bubble").className="bubble";
  const box=$("qOpts");box.innerHTML="";
  q.o.forEach((t,i)=>{
    const b=document.createElement("button");b.type="button";b.className="opt";b.id="opt"+i;
    b.innerHTML='<span class="no"><b>'+(i+1)+'</b></span><span class="txt">'+fmt(t)+'</span>';
    b.addEventListener("click",()=>tap(i));box.appendChild(b);
  });
  $("qConfirm").classList.add("hidden");$("qAfter").classList.add("hidden");
  hint();window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"});
}
function hint(){
  const dots='<span class="dots"><i class="'+(crossed.size>0?"on":"")+'"></i><i class="'+(crossed.size>1?"on":"")+'"></i></span>';
  if(phase==="cross")$("qHint").innerHTML="第一步：点两块不对的石头，把它们推进岩浆 "+dots;
  else if(phase==="pick")$("qHint").innerHTML="第二步：剩下两块，选一块跳上去 "+dots+'<span class="muted" style="font-size:14px">（点灰石头可以拉回来）</span>';
  else $("qHint").innerHTML="";
}
function paint(){
  sess.qs[sess.i].o.forEach((_,i)=>{const b=$("opt"+i);b.classList.toggle("crossed",crossed.has(i));b.classList.toggle("picked",picked===i)});
  $("qConfirm").classList.toggle("hidden",picked<0);
  hint();
}
function tap(i){
  if(phase==="done")return;
  if(crossed.has(i)){crossed.delete(i);phase="cross";picked=-1}
  else if(phase==="cross"){crossed.add(i);if(crossed.size===2)phase="pick"}
  else if(phase==="pick"){picked=i}
  paint();
  if(picked>=0)$("qConfirm").scrollIntoView({block:"nearest",behavior:"smooth"});
}
$("qConfirm").addEventListener("click",()=>{
  const q=sess.qs[sess.i];if(picked<0)return;
  phase="done";const ok=picked===q.a;
  record(q,ok);
  if(ok){sess.bugs++;sess.right++}else sess.wrong.push(q);
  $("qBugs").textContent=sess.bugs;
  const st=$("stage");st.className="stage "+(ok?"eat":"bleh");
  const bub=$("bubble");bub.textContent=ok?["哈哈！好吃！","哈哈！抓到了！","嗯～香脆！","哈哈！再来一只！"][Math.floor(Math.random()*4)]:"略略略～";
  setTimeout(()=>bub.classList.add("show"),ok?500:250);
  beep(ok?"ok":"no");
  if(isFill(q)){const bl=$("blank");if(bl)bl.textContent=q.o[q.a]}
  q.o.forEach((_,i)=>{
    const b=$("opt"+i);b.classList.add("done");b.classList.remove("picked");
    if(i===q.a)b.classList.add("right");else if(i===picked)b.classList.add("wrong");
    let flags="";
    if(i===q.a)flags+='<span class="flag r">✔ 正确答案</span>';
    if(i===picked&&!ok)flags+='<span class="flag w">你选的</span>';
    if(crossed.has(i))flags+=(i===q.a?'<span class="flag w">你把它划掉了</span>':'<span class="flag c">你划掉的</span>');
    const n=document.createElement("div");n.className="note";n.innerHTML=flags+" "+fmt(q.n[i]);
    b.appendChild(n);
  });
  $("qConfirm").classList.add("hidden");
  let sum="";
  if(ok)sum='<div class="big" style="color:var(--moss)">答对了！蜥蜴吃到一只虫子 🪲</div>';
  else sum='<div class="big" style="color:var(--ember)">这题没跳对，蜥蜴吐舌头了</div>';
  if(!ok&&crossed.has(q.a))sum+='<div>第一步就把正确答案推进岩浆了。下次划之前，把那个词放回句子里读一遍。</div>';
  if(q.t==="s")sum+='<div>正确的句子：'+fmt(q.o[q.a])+'</div>';
  if(isFill(q))sum+='<div>完整的句子：'+esc(q.s).replace("____",'<u class="key">'+esc(q.o[q.a])+'</u>')+'</div>';
  if(q.t==="m")sum+='<div>「'+esc(keyword(q))+'」＝'+esc(q.o[q.a])+'</div>';
  if(q.tip)sum+='<div class="tip">'+esc(q.tip)+'</div>';
  sum+='<div class="muted" style="font-size:15px">每个选项下面都写了意思和区别，读完再按下一题。</div>';
  $("qSum").innerHTML=sum;
  $("qAfter").classList.remove("hidden");
  $("qNext").textContent=sess.i+1<sess.qs.length?"下一题 →":"看这一轮的成绩 →";
  hint();
});
$("qNext").addEventListener("click",()=>{sess.i++;if(sess.i<sess.qs.length)renderQ();else finish()});
$("quit").addEventListener("click",()=>{show("home");renderHome()});

function finish(){
  const n=sess.qs.length;
  $("eTitle").textContent=sess.right===n?"全对！蜥蜴吃得饱饱的":"这一轮完成！";
  const d=P().log[today()]||[0,0];

  const w=$("eWrong");w.innerHTML="";
  $("eWrongBox").classList.toggle("hidden",!sess.wrong.length);
  sess.wrong.forEach(q=>{const el=document.createElement("div");el.className="w";
    const ans=q.t==="s"?fmt(q.o[q.a]):isFill(q)?esc(q.s).replace("____",'<u class="key">'+esc(q.o[q.a])+'</u>'):'「'+esc(keyword(q))+'」＝'+esc(q.o[q.a]);
    el.innerHTML='<b>'+esc(keyword(q))+'</b>　'+ans+' <span class="muted" style="font-size:13px">（'+esc(q.src)+'）</span>';w.appendChild(el)});

}
