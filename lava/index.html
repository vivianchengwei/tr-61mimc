<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="词语岛">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1310">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Lava Island 词语岛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* one visual world: night on a volcano island. Lava rocks = answer choices, lizard = feedback */
  --basalt:#1b1310;      /* page */
  --rock:#2c211c;        /* cards */
  --rock-2:#3a2c25;      /* raised rock */
  --ash:#f4e9df;         /* text */
  --ash-dim:#c4b2a4;     /* secondary text */
  --lava:#ff6a1f;        /* accent */
  --magma:#ffc24a;       /* highlight */
  --moss:#7bd88a;        /* correct */
  --ember:#ff5a6a;       /* wrong */
  --display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--basalt);color:var(--ash);font-family:var(--body);font-size:17px;line-height:1.6;
  background-image:radial-gradient(ellipse 120% 40% at 50% 105%,rgba(255,106,31,.28),transparent 70%),radial-gradient(circle at 15% 0%,rgba(255,194,74,.06),transparent 40%);
  background-attachment:fixed;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--magma);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.02em}
.hidden{display:none!important}
.muted{color:var(--ash-dim)}
.card{background:var(--rock);border-radius:18px;padding:16px 18px;border:1px solid rgba(255,255,255,.05)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid rgba(255,255,255,.14);background:transparent;border-radius:999px;padding:6px 14px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--lava);border-color:var(--lava);color:#1b1310;font-weight:700}
.btn{border:0;border-radius:14px;padding:14px 20px;font-size:18px;font-weight:700;background:var(--rock-2)}
.btn.hot{background:linear-gradient(180deg,#ff8a3d,#ff5a14);color:#1b1310;box-shadow:0 4px 0 #a8380a,0 0 24px rgba(255,106,31,.35)}
.btn.hot:active{transform:translateY(3px);box-shadow:0 1px 0 #a8380a}
.btn:disabled{opacity:.45;cursor:default}
.num{font-variant-numeric:tabular-nums}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;padding:20px 18px 14px;border-radius:22px;
  background:linear-gradient(180deg,#2a1611 0%,#3b1a10 60%,#5a210c 100%)}
.hero h1{font-size:38px;line-height:1.1;color:var(--magma);text-shadow:0 2px 0 #7a2a06}
.hero p{margin:6px 0 0;color:var(--ash-dim);max-width:30em}
.hero svg{position:absolute;right:-6px;bottom:-4px;width:190px;height:auto;opacity:.95}
.hero .txt{position:relative;z-index:1;max-width:62%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--rock);border-radius:16px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:400;color:var(--magma);line-height:1.2}
.stat span{font-size:13px;color:var(--ash-dim)}
.goalbar{height:12px;border-radius:999px;background:#140d0b;overflow:hidden}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,var(--lava),var(--magma));width:0;transition:width .4s}
.startgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.startgrid .btn{padding:18px 10px;font-size:20px}
.lbl{font-size:14px;color:var(--ash-dim);min-width:3.2em}
details.parent summary{cursor:pointer;font-family:var(--display);font-size:20px;color:var(--magma);list-style:none}
details.parent summary::before{content:"▸ ";}
details.parent[open] summary::before{content:"▾ ";}
.tbl{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
.tbl td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
.tbl td:last-child{text-align:right}
.addname{display:flex;gap:8px}
.addname input{flex:1;min-width:0;background:#140d0b;border:1px solid rgba(255,255,255,.14);color:var(--ash);border-radius:10px;padding:8px 10px;font:inherit}

/* ---------- quiz ---------- */
.topbar{display:flex;align-items:center;gap:10px}
.topbar .prog{flex:1}
.topbar .x{background:transparent;border:0;font-size:15px;color:var(--ash-dim);padding:6px}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;background:#140d0b;color:var(--ash-dim)}
.tag.t{color:var(--magma)}
.stem{font-size:22px;line-height:1.75;margin:10px 0 2px}
.stem .blank{display:inline-block;min-width:3.4em;border-bottom:3px solid var(--magma);text-align:center;color:var(--moss);font-weight:700;padding:0 4px}
u.key{text-decoration:none;border-bottom:3px solid var(--magma);padding-bottom:1px}
.hint{font-family:var(--display);font-size:19px;color:var(--magma);display:flex;gap:8px;align-items:center}
.hint .dots{display:inline-flex;gap:5px}
.hint .dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--magma)}
.hint .dots i.on{background:var(--magma)}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{position:relative;text-align:left;border:0;border-radius:20px 26px 18px 24px;padding:14px 16px 14px 56px;font-size:19px;line-height:1.6;
  background:linear-gradient(180deg,#4a382f,#33261f);box-shadow:0 5px 0 #1a110d,inset 0 1px 0 rgba(255,255,255,.08);transition:transform .15s,opacity .25s,filter .25s}
.opt .no{position:absolute;left:12px;top:12px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:18px;background:#1b1310;color:var(--magma)}
.opt:active{transform:translateY(2px)}
.opt.crossed{filter:grayscale(.9) brightness(.6);transform:translateY(6px) scale(.98);box-shadow:0 0 0 #000,0 0 18px rgba(255,90,20,.55)}
.opt.crossed .txt{text-decoration:line-through;text-decoration-color:var(--ember);text-decoration-thickness:3px}
.opt.crossed .no{background:var(--ember);color:#1b1310}
.opt.crossed .no::after{content:"✕";position:absolute;font-size:20px}
.opt.crossed .no b{visibility:hidden}
.opt.picked{background:linear-gradient(180deg,#ff9a50,#ff6a1f);color:#1b1310;box-shadow:0 5px 0 #a8380a,0 0 22px rgba(255,140,60,.5)}
.opt.picked .no{background:#1b1310}
.opt.right{background:linear-gradient(180deg,#3f6b45,#2c4d31);box-shadow:0 5px 0 #18301c;filter:none;transform:none}
.opt.right .no{background:var(--moss);color:#14301a}
.opt.wrong{background:linear-gradient(180deg,#6b2f34,#4b2024);box-shadow:0 5px 0 #2a1012;filter:none;transform:none}
.opt.wrong .no{background:var(--ember);color:#1b1310}
.opt.done{cursor:default}
.opt.done.crossed .txt{text-decoration-color:rgba(255,90,106,.6)}
.note{font-size:16px;line-height:1.65;margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.25);color:var(--ash)}
.opt.right .note{background:rgba(0,0,0,.22)}
.flag{font-size:13px;font-weight:700;margin-left:6px;padding:1px 8px;border-radius:999px;background:#1b1310}
.flag.r{color:var(--moss)}.flag.w{color:var(--ember)}.flag.c{color:var(--ash-dim)}
.confirm{width:100%}
.summary{font-size:18px;line-height:1.7}
.summary .big{font-family:var(--display);font-size:24px}
.tip{border-left:4px solid var(--magma);padding:8px 12px;background:rgba(255,194,74,.08);border-radius:0 10px 10px 0}
.next{width:100%;font-size:20px;padding:16px}

/* ---------- lizard ---------- */
.stage{position:relative;height:150px;border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,#24150f 0%,#2f1a11 65%,#4a1f0c 100%)}
.stage svg{position:absolute;left:0;bottom:0;width:100%;height:100%}
.bubble{position:absolute;right:16px;top:12px;max-width:52%;background:var(--ash);color:#1b1310;font-family:var(--display);font-size:22px;padding:6px 14px;border-radius:16px 16px 4px 16px;opacity:0;transform:translateY(6px);transition:all .25s}
.bubble.show{opacity:1;transform:none}
#tongue{transform-origin:118px 92px;transform:scaleX(0)}
#bug{transform-origin:256px 64px}
.idle #bug{animation:hover 1.2s ease-in-out infinite}
.idle #eye{animation:blink 4s infinite}
@keyframes hover{50%{transform:translate(4px,-6px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#eye{transform-origin:100px 62px}
.eat #tongue{animation:lick .7s ease-out forwards}
.eat #bug{animation:caught .7s ease-in forwards}
.eat #head{animation:chew .25s .75s 4 alternate}
@keyframes lick{0%{transform:scaleX(0)}40%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes caught{0%,38%{transform:none;opacity:1}100%{transform:translate(-140px,30px) scale(.3);opacity:0}}
@keyframes chew{to{transform:translateY(3px)}}
.bleh #tongue2{animation:bleh .3s ease-out forwards,wig .18s .3s 8 alternate}
.bleh #bug{animation:flee 1s ease-in forwards}
.bleh #eye{transform:scaleY(.25)}
#tongue2{transform-origin:118px 92px;transform:scale(0)}
@keyframes bleh{to{transform:scale(1)}}
@keyframes wig{from{transform:scale(1) rotate(-8deg)}to{transform:scale(1) rotate(10deg)}}
@keyframes flee{to{transform:translate(120px,-90px) rotate(30deg);opacity:0}}
#head{transform-origin:100px 80px}
.lava-glow{animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.6}}

/* ---------- end ---------- */
.result h2{font-size:30px;color:var(--magma)}
.wlist{display:flex;flex-direction:column;gap:8px}
.wlist .w{background:var(--rock-2);border-radius:12px;padding:10px 12px;font-size:16px}
.wlist .w b{color:var(--magma);font-weight:700}

@media (max-width:480px){
  .hero h1{font-size:30px}.hero .txt{max-width:70%}.hero svg{width:140px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stem{font-size:20px}.opt{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .eat #bug,.bleh #bug{opacity:0}
}
</style>
</head>
<body>
<div class="wrap" id="app">

<!-- ================= HOME ================= -->
<section id="home" class="wrap" style="padding:0">
  <div class="hero">
    <div class="txt">
      <h1>Lava Island<br>词语岛</h1>
      <p>先划掉两块不对的石头，再从剩下两块里跳上一块。答对了，蜥蜴吃到虫子。</p>
    </div>
    <svg viewBox="0 0 200 140" aria-hidden="true">
      <path d="M10 140 L78 40 Q100 22 122 40 L190 140Z" fill="#3a1d12"/>
      <path d="M78 40 Q100 22 122 40 L112 52 Q100 44 88 52Z" fill="#ff6a1f" class="lava-glow"/>
      <path d="M100 48 Q94 80 104 100 Q96 118 102 140" stroke="#ff8a3d" stroke-width="6" fill="none" class="lava-glow"/>
      <circle cx="92" cy="18" r="7" fill="#5a3a2c" opacity=".7"/><circle cx="106" cy="8" r="5" fill="#5a3a2c" opacity=".5"/>
    </svg>
  </div>

  <div class="card hidden" id="embedNote" style="border:1px solid var(--magma);font-size:15px">这个页面现在嵌在 claude.ai 里，浏览器可能会清掉进度。孩子请用独立网址：<b>vivianchengwei.github.io/tr-61mimc/lava/</b>（在家长看板里可以复制备份码，搬到新网址后恢复）。</div>
  <div class="card row" style="justify-content:space-between">
    <div class="row" id="names" role="group" aria-label="选择名字"></div>
    <button class="chip" id="addNameBtn" type="button">＋ 加名字</button>
  </div>
  <div class="card addname hidden" id="addNameBox">
    <label for="newName" class="muted" style="align-self:center">名字</label>
    <input id="newName" maxlength="12" autocomplete="off">
    <button class="chip" id="saveName" type="button">保存</button>
  </div>

  <div class="stats needname">
    <div class="stat"><b class="num" id="sToday">0</b><span>今天已刷</span></div>
    <div class="stat"><b class="num" id="sStreak">0</b><span>连续天数 🔥</span></div>
    <div class="stat"><b class="num" id="sBugs">0</b><span>吃到的虫子</span></div>
    <div class="stat"><b class="num" id="sBox">0</b><span>错题盒</span></div>
  </div>

  <div class="card needname" style="display:flex;flex-direction:column;gap:10px">
    <div class="row" style="justify-content:space-between"><span>今天的目标 <b class="num" id="goalTxt">0 / 20</b></span><span class="muted num" id="masterTxt"></span></div>
    <div class="goalbar"><i id="goalBar"></i></div>
    <div class="row"><span class="lbl">题型</span>
      <div class="row" id="typeChips" role="group" aria-label="题型">
        <button class="chip" data-type="all" type="button">全部</button>
        <button class="chip" data-type="f" type="button">选词填空</button>
        <button class="chip" data-type="c" type="button">短文填空</button>
        <button class="chip" data-type="m" type="button">词义</button>
        <button class="chip" data-type="s" type="button">哪个句子正确</button>
      </div>
    </div>
    <div class="startgrid">
      <button class="btn hot" id="go20" type="button">刷 20 题</button>
      <button class="btn hot" id="go30" type="button">刷 30 题</button>
    </div>
    <button class="btn" id="goWrong" type="button">只练错题盒</button>
    <p class="muted" style="margin:0;font-size:14px">每次先出错题盒里该复习的题，再出没做过的新题。一道题连续答对两次就算掌握。</p>
  </div>

  <details class="card parent" id="parentBox">
    <summary>家长看板</summary>
    <div id="parentBody"></div>
  </details>
  <p class="muted" style="font-size:13px;margin:0" id="bankInfo"></p>
</section>

<!-- ================= QUIZ ================= -->
<section id="quiz" class="wrap hidden" style="padding:0">
  <div class="topbar">
    <button class="x" id="quit" type="button">← 回岛上</button>
    <div class="prog"><div class="goalbar"><i id="qBar"></i></div></div>
    <span class="num" id="qCount">1/20</span>
    <span class="num" title="这一轮吃到的虫子">🪲 <b id="qBugs">0</b></span>
  </div>

  <div class="stage idle" id="stage">
    <svg viewBox="0 0 320 150" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <path d="M0 150 L0 128 Q60 112 120 122 Q200 136 320 118 L320 150Z" fill="#1a0f0b"/>
      <path d="M0 140 Q80 130 160 142 Q240 152 320 136 L320 150 L0 150Z" fill="#ff6a1f" class="lava-glow" opacity=".9"/>
      <ellipse cx="80" cy="124" rx="70" ry="14" fill="#3a2a22"/>
      <!-- lizard (original design: round lava gecko) -->
      <g id="liz">
        <path d="M30 112 Q4 104 10 86 Q16 74 26 84 Q20 92 34 100Z" fill="#e0712a"/>
        <ellipse cx="62" cy="104" rx="40" ry="20" fill="#f08a34"/>
        <circle cx="50" cy="100" r="5" fill="#ffc24a"/><circle cx="68" cy="96" r="4" fill="#ffc24a"/><circle cx="76" cy="108" r="3.5" fill="#ffc24a"/>
        <path d="M40 118 l-8 8 h10 M80 118 l4 8 h10" stroke="#c4561c" stroke-width="5" stroke-linecap="round" fill="none"/>
        <g id="head">
          <ellipse cx="102" cy="82" rx="26" ry="20" fill="#f6a043"/>
          <path d="M100 92 Q112 96 124 90" stroke="#7a2a06" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <g id="eye"><circle cx="100" cy="66" r="11" fill="#fff6e8"/><circle cx="103" cy="66" r="5.5" fill="#1b1310"/><circle cx="105" cy="64" r="1.8" fill="#fff"/></g>
          <circle cx="114" cy="82" r="1.6" fill="#7a2a06"/>
          <path id="tongue" d="M118 90 L240 66 Q252 64 256 68 Q252 74 240 72 L118 95Z" fill="#ff5a8a"/>
          <path id="tongue2" d="M118 90 Q132 94 136 104 Q134 112 126 108 Q122 100 116 96Z" fill="#ff5a8a"/>
        </g>
      </g>
      <!-- bug -->
      <g id="bug">
        <ellipse cx="250" cy="58" rx="9" ry="6" fill="#b9e3ff" opacity=".7"/>
        <ellipse cx="262" cy="58" rx="9" ry="6" fill="#b9e3ff" opacity=".7"/>
        <ellipse cx="256" cy="66" rx="10" ry="8" fill="#6a3fd0"/>
        <circle cx="252" cy="65" r="2" fill="#ffc24a"/><circle cx="260" cy="68" r="2" fill="#ffc24a"/>
        <circle cx="246" cy="64" r="4" fill="#3b2280"/>
      </g>
    </svg>
    <div class="bubble" id="bubble">哈哈！</div>
  </div>

  <div class="card">
    <div class="row"><span class="tag t" id="qType"></span><span class="tag" id="qSrc"></span></div>
    <div class="stem" id="qStem"></div>
  </div>
  <div class="hint" id="qHint"></div>
  <div class="opts" id="qOpts"></div>
  <button class="btn hot confirm hidden" id="qConfirm" type="button">就跳这块石头！</button>
  <div id="qAfter" class="hidden" style="display:flex;flex-direction:column;gap:14px">
    <div class="card summary" id="qSum"></div>
    <button class="btn hot next" id="qNext" type="button">下一题 →</button>
  </div>
</section>

<!-- ================= END ================= -->
<section id="end" class="wrap hidden result" style="padding:0">
  <div class="card" style="display:flex;flex-direction:column;gap:8px">
    <h2 id="eTitle">这一轮完成！</h2>
    <div class="summary" id="eSum"></div>
  </div>
  <div class="card" id="eWrongBox">
    <h3 style="font-size:20px;color:var(--magma);margin-bottom:8px">这轮错的词，已放进错题盒</h3>
    <div class="wlist" id="eWrong"></div>
  </div>
  <div class="startgrid">
    <button class="btn" id="eHome" type="button">回岛上</button>
    <button class="btn hot" id="eAgain" type="button">再刷一轮</button>
  </div>
</section>
</div>

<script>
const BANK=[{"id":"2020ACS-Q5","src":"2020 ACS 预考","qn":"Q5","k":"预考","t":"f","a":1,"s":"看到太空人成功____月球，大家都高声欢呼。","o":["移居","登陆","进入","航行"],"n":["移居：搬到别的地方去住（移居国外）。太空人是去探索，不是搬家。","登陆：从水上或太空到达陆地、星球（登陆月球、台风登陆）。✔ “成功登陆月球”是固定说法。","进入：走到里面（进入课室、进入决赛），“进入月球”说不通。","航行：船、飞机在水上或空中行驶（在大海上航行），后面不直接接目的地。"],"tip":""},{"id":"2020ACS-Q6","src":"2020 ACS 预考","qn":"Q6","k":"预考","t":"f","a":0,"s":"弟弟哭着向老师____以后上学再也不迟到了。","o":["保证","劝告","建议","请求"],"n":["保证：答应一定做到（保证完成、保证不再犯）。✔ 弟弟承诺“再也不迟到”。","劝告：劝别人改正，用在“对别人”（老师劝告他）。弟弟是在说自己，不是劝老师。","建议：提出意见给别人参考（我建议大家……）。","请求：请别人帮忙或答应（请求老师原谅）。“请求以后不迟到”意思不对。"],"tip":""},{"id":"2020ACS-Q7","src":"2020 ACS 预考","qn":"Q7","k":"预考","t":"m","a":1,"s":"为了不【影响】他人，我们在图书馆里走动时要轻手轻脚的。","o":["对人或事物造成的伤害","对人或事物所起的作用","要求自己或他人达到的标准","要求他人的思想或行动改变"],"n":["这是“伤害、损害”的意思。影响不一定是坏的，也可以是好影响。","✔ “影响”＝对人或事物起作用，例：父母的影响、不影响别人。","这是“标准、要求”的意思。","这是“说服、改变别人”的意思。"],"tip":""},{"id":"2020ACS-Q8","src":"2020 ACS 预考","qn":"Q8","k":"预考","t":"m","a":2,"s":"看到妹妹愁眉苦脸的，我连忙上前【安慰】她。","o":["使人感到幸福","使人充满信心","使人心情舒适","使人面对现实"],"n":["“幸福”太大了，安慰只是让人难过的心情好一点。","这是“鼓励”的意思（鼓励她，让她有信心）。","✔ “安慰”＝让难过的人心情变得舒服、平静一些。","这是“劝人接受事实”，不是安慰。"],"tip":""},{"id":"2020ACS-Q13","src":"2020 ACS 预考","qn":"Q13","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["这份礼物太贵重了，我实在不能【遭受】。","我们的军队到达边关，【遭受】很多敌人。","这次的灾害，让农民【遭受】巨大的损失。","听了我的解释，他才知道我【遭受】问题。"],"n":["“遭受”后面接不好的事。收礼物要用“接受”。","遇到敌人要用“遭遇／遇到”，“遭受”接的是伤害、损失、打击。","✔ 遭受＋损失／打击／破坏／痛苦。灾害让农民受到损失，用得对。","“遇到问题”才对，问题不是“遭受”的。"],"tip":""},{"id":"2020ACS-Q14","src":"2020 ACS 预考","qn":"Q14","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["这些消息是他提供给好友的【贡献】，真了不起。","前线医生对国家的【贡献】，我们必须记在心里。","父母在我们遇到困难时，【贡献】了很多的帮助。","教师节那一天，我们给老师【贡献】了一张卡片。"],"n":["提供消息不算“贡献”，这里应该说“帮助”。","✔ 贡献：为国家、社会、大家做出的有益的事（对国家的贡献、做出贡献）。","父母“给了／提供了”帮助，不用“贡献”。","送卡片给老师用“送”或“献上”，不用“贡献”。"],"tip":""},{"id":"2020ACS-Q15","src":"2020 ACS 预考","qn":"Q15","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["小安说他妈妈从早到晚一直【吩咐】，他再也受不了了。","教练【吩咐】队员们好好休息，为明天的比赛做好准备。","听到美美突然要转校的消息，同学们纷纷【吩咐】起来。","明天学校举办运动会，我【吩咐】妈妈早点儿叫我起床。"],"n":["一直说个不停让人受不了，应该用“唠叨”。","✔ 吩咐：长辈、上级口头叫人去做事（老师吩咐、妈妈吩咐）。教练对队员，用得对。","大家一起说起来，应该用“议论”。","孩子对妈妈不能用“吩咐”（是上对下），应该用“请”或“拜托”。"],"tip":""},{"id":"2020HP-Q5","src":"2020 Henry Park 预考","qn":"Q5","k":"预考","t":"f","a":0,"s":"许多国家为这次的救灾工作做出了巨大的____。","o":["贡献","分享","建议","表现"],"n":["贡献：为大家、社会做出有益的事。✔ “做出巨大的贡献”是固定搭配。","分享：把好东西、快乐拿出来和别人一起享用（分享食物、分享经验），不和“做出巨大的”搭配。","建议：提出意见，搭配“提出建议”，不是“做出巨大的建议”。","表现：做出来的样子、行为（表现很好），“做出巨大的表现”不通。"],"tip":""},{"id":"2020HP-Q6","src":"2020 Henry Park 预考","qn":"Q6","k":"预考","t":"f","a":3,"s":"如果你想知道下周运动会的____，可以去问林老师。","o":["方法","步骤","经验","详情"],"n":["方法：解决问题的办法。运动会不是一个要解决的问题。","步骤：做事的先后顺序（做实验的步骤）。","经验：从做过的事里学到的东西。","✔ 详情：详细的情况。“想知道……的详情”很自然。"],"tip":""},{"id":"2020HP-Q7","src":"2020 Henry Park 预考","qn":"Q7","k":"预考","t":"m","a":2,"s":"住在这一区的居民关系都很【和谐】，从来不争吵。","o":["感情十分特别","觉得依依不舍","相处得非常好","喜欢聚在一起"],"n":["“特别”不等于好，和谐不是这个意思。","依依不舍＝舍不得分开，和“和谐”无关。","✔ 和谐：大家配合得好、相处得好、不吵架。","喜欢聚会是一种习惯，不是“和谐”的意思。"],"tip":""},{"id":"2020HP-Q8","src":"2020 Henry Park 预考","qn":"Q8","k":"预考","t":"m","a":0,"s":"同学们都很开心，他们【盼望】已久的学校假期终于到了。","o":["非常想要的","一直在看的","经常讨论的","总是欣赏的"],"n":["✔ 盼望：心里很想、很期待某件事发生（盼望假期、盼望见到你）。","“看”是眼睛动作，和“盼望”无关。","“讨论”是说话，不是期待。","“欣赏”是喜欢地看、觉得好，不是期待。"],"tip":""},{"id":"2020HP-Q13","src":"2020 Henry Park 预考","qn":"Q13","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["那里的海水很【深刻】，你们最好别跳进去游泳。","老师今天教的课文内容【深刻】，我听不太明白。","这部电影的故事感人，给我留下【深刻】的印象。","我和志明认识很多年了，所以感情非常【深刻】。"],"n":["水很深用“深”，不用“深刻”。","内容难懂用“深奥”。“深刻”是有意义、印象深。","✔ 深刻：印象很深、让人难忘（深刻的印象、深刻的道理）。","感情好用“深厚”：感情非常深厚。"],"tip":""},{"id":"2020HP-Q14","src":"2020 Henry Park 预考","qn":"Q14","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["他在写作时【巧妙】地运用了对话，使文章生动许多。","姐姐用她那双【巧妙】的手，制作了精美的手工作品。","妈妈到巴刹买菜，在路上【巧妙】遇到了邻居林阿姨。","妹妹很懂事，大家都称赞她是一个【巧妙】的好孩子。"],"n":["✔ 巧妙：方法、设计很聪明、高明（巧妙地运用、巧妙的办法）。","形容手用“灵巧”：一双灵巧的手。","偶然遇到用“碰巧／恰巧”。","形容孩子用“乖巧”。"],"tip":""},{"id":"2020HP-Q15","src":"2020 Henry Park 预考","qn":"Q15","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["【总算】他做错了，你也不应该动手打人。","林叔叔【总算】退休后，移民到国外居住。","妈妈去了趟超市，【总算】花了一百元钱。","一连下了几天的雨，今天【总算】天晴了。"],"n":["表示让步要用“就算”：就算他做错了，你也……","退休后移民，用“在／于”，不用“总算”。","一共花了多少钱用“总共／一共”。","✔ 总算：等了很久，终于实现（总算放晴、总算完成）。"],"tip":""},{"id":"2020MGS-Q5","src":"2020 MGS 预考","qn":"Q5","k":"预考","t":"f","a":2,"s":"伟良灵机一动，想到了一个____的办法解决了问题。","o":["美妙","精美","巧妙","巧合"],"n":["美妙：美好、动听（美妙的音乐、美妙的时光）。","精美：精致好看（精美的礼物、精美的图画）。","✔ 巧妙：聪明、高明（巧妙的办法）。和“灵机一动”相配。","巧合：刚好碰在一起的事情，是名词，不能形容办法。"],"tip":""},{"id":"2020MGS-Q6","src":"2020 MGS 预考","qn":"Q6","k":"预考","t":"f","a":2,"s":"这件外套____相当贵，现在打了折便宜多了。","o":["特价","半价","原价","减价"],"n":["特价：特别降低的价钱，本来就便宜，和“相当贵”矛盾。","半价：一半的价钱，也是便宜。","✔ 原价：原来的价钱（打折以前）。原价贵，打折后便宜，前后对得上。","减价：降低价钱，是便宜，和“相当贵”矛盾。"],"tip":""},{"id":"2020MGS-Q7","src":"2020 MGS 预考","qn":"Q7","k":"预考","t":"m","a":3,"s":"立明【妒忌】国华买了一台新手机，最近对国华不理不睬。","o":["因他人比自己好而心里烦恼","因他人比自己好而不好意思","因他人比自己好而觉得难过","因他人比自己好而心怀怨恨"],"n":["“烦恼”不够，妒忌带着不满别人的意思。","不好意思是害羞，不是妒忌。","“难过”是伤心，没有对别人不满。","✔ 妒忌（嫉妒）：看到别人比自己好，心里不服、怨恨对方。所以才会“不理不睬”。"],"tip":""},{"id":"2020MGS-Q8","src":"2020 MGS 预考","qn":"Q8","k":"预考","t":"m","a":0,"s":"为了【保持】身体健康，爷爷每天都到公园散步。","o":["使不消失或减弱","使变得更加强壮","让身体变得灵活","让精神越来越好"],"n":["✔ 保持：让原来好的状态继续下去，不变差（保持安静、保持健康）。","“更加强壮”是“增强”，不是保持。","“变灵活”是改变，不是保持。","“越来越好”是变化，保持是不变。"],"tip":""},{"id":"2020MGS-Q13","src":"2020 MGS 预考","qn":"Q13","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["通过警民合作，警方终于【克服】了那名小偷。","他年年考试都得第一，我真的非常【克服】他。","只要你能【克服】紧张的心理，就能演好角色。","我终于【克服】了妈妈，让我和朋友出国旅游。"],"n":["抓到小偷用“制服／抓住”。","对人表示佩服用“佩服”。","✔ 克服：战胜困难、缺点、不好的心理（克服困难、克服紧张）。","让妈妈同意用“说服”。"],"tip":""},{"id":"2020MGS-Q14","src":"2020 MGS 预考","qn":"Q14","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["他决定了要做的事，任何人也无法【阻拦】。","幸好他反应快，及时【阻拦】了意外的发生。","他把脚踏车放在走廊上，【阻拦】大家通行。","马路上发生了意外，造成交通严重【阻拦】。"],"n":["✔ 阻拦：拦住人，不让他去做（无法阻拦、阻拦他）。","不让意外发生用“避免／防止”。","挡住路用“阻碍／妨碍”通行。","交通不通用“阻塞／堵塞”。"],"tip":""},{"id":"2020MGS-Q15","src":"2020 MGS 预考","qn":"Q15","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["我们可以通过教育，【普通】提高人民的卫生常识。","这只不过是一双很【普通】的球鞋，价钱也很便宜。","在新加坡出门真方便，可以乘搭各种【普通】工具。","今天的天气十分晴朗，柔和的阳光【普通】着大地。"],"n":["大范围地提高用“普遍”。","✔ 普通：平常的、一般的（普通的球鞋、普通人）。","坐车用“交通工具”。","阳光照遍大地用“普照”。"],"tip":""},{"id":"2020NY-Q5","src":"2020 南洋 预考","qn":"Q5","k":"预考","t":"f","a":3,"s":"这辆玩具车看起来十分____，无法吸引弟弟。","o":["正常","特别","奇怪","普通"],"n":["正常：没有问题、合乎常规，不是用来说东西吸引不吸引。","特别：与众不同，通常会吸引人，和“无法吸引”矛盾。","奇怪：古怪少见，反而容易引起好奇。","✔ 普通：很平常，没什么特色，所以吸引不了弟弟。"],"tip":""},{"id":"2020NY-Q6","src":"2020 南洋 预考","qn":"Q6","k":"预考","t":"f","a":0,"s":"身为哥哥的我，一定要为年幼的弟妹树立好____。","o":["榜样","品格","习惯","行为"],"n":["✔ 榜样：值得别人学习的好例子。“树立榜样”是固定搭配。","品格：人的品德性格，搭配“培养品格”。","习惯：搭配“养成习惯”。","行为：做的事，搭配“好的行为”，不说“树立行为”。"],"tip":""},{"id":"2020NY-Q7","src":"2020 南洋 预考","qn":"Q7","k":"预考","t":"m","a":2,"s":"这个比赛已经【截止】报名了，你等下一次吧！","o":["到一定期限开始","到一定期限继续","到一定期限停止","到一定期限完成"],"n":["截止不是开始。","截止不是继续。","✔ 截止：到了规定的时间就停止（截止日期、截止报名）。","“完成”是做好了，截止是“不再接受”。"],"tip":""},{"id":"2020NY-Q8","src":"2020 南洋 预考","qn":"Q8","k":"预考","t":"m","a":0,"s":"明丽害怕答错问题被同学【嘲笑】，因此上课时总是不敢举手。","o":["用言语笑话对方","用言语一起说笑","用言语闹出笑话","用言语使别人笑"],"n":["✔ 嘲笑：用话笑话、取笑别人，让人难堪。","一起说笑是开心的聊天，没有笑话别人。","闹出笑话是自己出丑。","逗人笑是“逗乐”，不是嘲笑。"],"tip":""},{"id":"2020NY-Q13","src":"2020 南洋 预考","qn":"Q13","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["休息了两个月，他现在已【恢复】健康。","我刚才没听清楚，请你再【恢复】一遍。","你上个星期发送的电邮我已经【恢复】了。","每天都在【恢复】一样的事，让人厌烦。"],"n":["✔ 恢复：变回原来的样子（恢复健康、恢复平静）。","再说一遍用“重复”。","回答电邮用“回复”。","做同样的事用“重复”。"],"tip":""},{"id":"2020NY-Q14","src":"2020 南洋 预考","qn":"Q14","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["你先和父母谈一谈，别那么【激动】做决定。","这部电影十分感人，【激动】了所有在场的观众。","地铁车厢里禁止饮食，请克制你想吃糖的【激动】。","得知自己获得了歌唱比赛的冠军，丽英【激动】得手舞足蹈。"],"n":["不要匆忙决定用“冲动”。","让观众感动用“感动／打动”。“激动”不能带宾语。","想做某事的念头用“冲动”。","✔ 激动：感情一下子很强烈（激动得说不出话、激动得手舞足蹈）。"],"tip":""},{"id":"2020NY-Q15","src":"2020 南洋 预考","qn":"Q15","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["弟弟比妹妹更【使劲】，最后考取了好成绩。","医生已经【使劲】了，可还是救不活那名伤者。","我【使劲】地移开沙发，把地上的垃圾打扫干净。","单靠我一个人【使劲】，是无法把这件事给完成的。"],"n":["读书考试用“努力／用功”。","医生用尽办法用“尽力”。","✔ 使劲：用力气（使劲推、使劲拉）。移开沙发要用力气。","一件事要大家合作，说“单靠我一个人的力量”或“努力”。"],"tip":""},{"id":"2020RGS-Q5","src":"2020 莱佛士女中 预考","qn":"Q5","k":"预考","t":"f","a":2,"s":"那个有爱心的商人____地捐出一笔钱帮助灾区的穷人。","o":["慈祥","温柔","慷慨","骄傲"],"n":["慈祥：老人的样子和气、和蔼（慈祥的奶奶）。","温柔：说话做事轻柔（温柔地说）。","✔ 慷慨：大方地拿出钱财帮人（慷慨捐款、慷慨解囊）。","骄傲：自以为了不起，是贬义。"],"tip":""},{"id":"2020RGS-Q6","src":"2020 莱佛士女中 预考","qn":"Q6","k":"预考","t":"f","a":3,"s":"小美____了几天，决定参加这次的比赛。","o":["幻想","期盼","比较","考虑"],"n":["幻想：想不太可能实现的事。","期盼：盼望一件事发生，后面接期盼的东西。","比较：拿两样东西对比，要有对象。","✔ 考虑：仔细想一想再决定。“考虑了几天，决定……”。"],"tip":""},{"id":"2020RGS-Q7","src":"2020 莱佛士女中 预考","qn":"Q7","k":"预考","t":"m","a":3,"s":"妈妈关心孩子，总喜欢在他们耳边【唠叨】提醒。","o":["互相交换意见","把想法告诉别人","以轻松的方式谈话","没完没了地说个不停"],"n":["这是“讨论”。","这是“表达／告诉”。","这是“聊天”。","✔ 唠叨：一件事说了又说，说个不停。"],"tip":""},{"id":"2020RGS-Q8","src":"2020 莱佛士女中 预考","qn":"Q8","k":"预考","t":"m","a":2,"s":"在【关键】的时刻，我们更要保持冷静。","o":["突然","临时","紧要","开始"],"n":["关键不是“突然发生”。","“临时”是短时间、事先没安排。","✔ 关键：最重要、最紧要的（关键时刻、关键的一球）。","关键不一定在开始。"],"tip":""},{"id":"2020RGS-Q13","src":"2020 莱佛士女中 预考","qn":"Q13","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["这次的比赛，【充足】表现他的表达能力。","找到新工作后，他的生活过得非常【充足】。","小华阅读很多书，因此作文的表达很【充足】。","我们要爱护眼睛，在光线【充足】的房间里看书。"],"n":["“充分表现”才对。","生活丰富用“充实”。","内容多用“丰富”。","✔ 充足：数量够、很多（光线充足、睡眠充足、时间充足）。"],"tip":""},{"id":"2020RGS-Q14","src":"2020 莱佛士女中 预考","qn":"Q14","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["农夫在太阳底下的田地里【移动】。","客厅中间的桌子被【移动】到角落旁。","爷爷每天早上都会到公园【移动】身体。","你遇到问题时应该自己【移动】头脑思考。"],"n":["农夫在田里应该是“劳动／工作”。","✔ 移动：改换位置（把桌子移动到……）。","锻炼用“活动身体”。","想问题用“动动脑筋／开动脑筋”。"],"tip":""},{"id":"2020RGS-Q15","src":"2020 莱佛士女中 预考","qn":"Q15","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["参加了合唱团后，姐姐【巧妙】地把歌唱好。","小文和明光【巧妙】地讨论，完成了这项任务。","爸爸和邻居王叔叔下楼跑步时，【巧妙】地遇上了。","小丽把动作和乐曲【巧妙】地结合，呈现完美的表演。"],"n":["唱好歌不是“巧妙”，可用“慢慢地／终于”。","讨论用“认真地”。","偶然遇到用“碰巧”。","✔ 巧妙地结合：方法高明，配合得刚好。"],"tip":""},{"id":"2020RS-Q5","src":"2020 红十字会 预考","qn":"Q5","k":"预考","t":"f","a":0,"s":"雨树像一把巨大的伞，通常栽种在____的道路两旁。","o":["宽阔","宽松","宽容","宽度"],"n":["✔ 宽阔：地方又宽又大（宽阔的道路、宽阔的大海）。","宽松：衣服不紧（宽松的衣服）。","宽容：对人大度、原谅人（宽容别人）。","宽度：宽窄的大小，是名词，不能放在“的道路”前面。"],"tip":""},{"id":"2020RS-Q6","src":"2020 红十字会 预考","qn":"Q6","k":"预考","t":"f","a":2,"s":"每当阿姨叫表哥吃饭时，表哥____不理不睬。","o":["应该","其实","总是","尤其"],"n":["应该：本来就该做。“应该不理不睬”意思不对。","其实：说出真实情况，用在转折句。","✔ 总是：每次都这样。和“每当……时”相配。","尤其：特别是（我喜欢水果，尤其是芒果）。"],"tip":""},{"id":"2020RS-Q7","src":"2020 红十字会 预考","qn":"Q7","k":"预考","t":"m","a":1,"s":"听了爸爸的解释后，哥哥【恍然大悟】，终于明白了自己的错误。","o":["感到非常失望","一下子明白了","什么话也不说","临时想出办法"],"n":["失望和明白无关。","✔ 恍然大悟：一下子完全明白过来。","不说话是“沉默”。","临时想出办法是“灵机一动”。"],"tip":""},{"id":"2020RS-Q8","src":"2020 红十字会 预考","qn":"Q8","k":"预考","t":"m","a":3,"s":"那个画家世界闻名，世界各地都有人【模仿】他画画的技巧。","o":["批评他人的行为","观察他人的行为","控制他人的行为","重复他人的行为"],"n":["批评是指出别人的错。","观察是仔细看，还没跟着做。","控制是管住别人。","✔ 模仿：照着别人的样子做一遍（模仿动作、模仿声音）。"],"tip":""},{"id":"2020RS-Q13","src":"2020 红十字会 预考","qn":"Q13","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["哥哥当兵后，【随手】都要上战场杀敌。","妹妹走出房间时，妈妈叫她【随手】关灯。","奶奶教导我做事要认真，不可以【随手】。","你到日本旅行，【随手】都会看到拉面店。"],"n":["任何时候用“随时”。","✔ 随手：顺手，做一件事时顺便做另一件（随手关门、随手关灯）。","做事不认真用“随便”。","到处都是用“随处”。"],"tip":""},{"id":"2020RS-Q14","src":"2020 红十字会 预考","qn":"Q14","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["昨天老师【代替】大家到动物园观赏动物。","今年小美【代替】我校去参加全国游泳比赛。","花木兰女扮男装，【代替】父亲去当兵打仗。","大明比赛时受伤了，教练要我跟他【代替】。"],"n":["老师带大家去用“带领”。","代表学校比赛用“代表”。","✔ 代替：换别人去做（代替父亲当兵）。","“跟他代替”说法不对，应说“替换他／代替他上场”。"],"tip":""},{"id":"2020RS-Q15","src":"2020 红十字会 预考","qn":"Q15","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["毛毛虫长大变成美丽的蝴蝶，真是【巧妙】。","妈妈买完菜走回家时，【巧妙】碰到林阿姨。","假期时，我到日本游玩遇到大明，真是【巧妙】。","游客在拍照时，人和景物【巧妙】地结合在一起。"],"n":["大自然的变化用“奇妙”。","偶然遇到用“碰巧／恰巧”。","这里要说“真是太巧了”。","✔ 巧妙地结合：配合得高明又好看。"],"tip":""},{"id":"2020Rosyth-Q5","src":"2020 Rosyth 预考","qn":"Q5","k":"预考","t":"f","a":3,"s":"自从看了那部电影，弟弟经常____士兵的动作。","o":["同样","好像","相似","模仿"],"n":["同样：一样，不能带宾语“士兵的动作”。","好像：像，后面接“……一样”。","相似：差不多像，不能带宾语。","✔ 模仿：照着样子学（模仿动作）。"],"tip":""},{"id":"2020Rosyth-Q6","src":"2020 Rosyth 预考","qn":"Q6","k":"预考","t":"f","a":0,"s":"哥哥常常跟妈妈____功课太多，没有时间玩。","o":["埋怨","报告","担忧","打扰"],"n":["✔ 埋怨：因为不满意而抱怨、发牢骚（埋怨功课太多）。","报告：正式地说明情况（向老师报告）。语气不对。","担忧：担心，常说“为……担忧”。","打扰：影响别人，打扰妈妈，不能接“功课太多”。"],"tip":""},{"id":"2020Rosyth-Q7","src":"2020 Rosyth 预考","qn":"Q7","k":"预考","t":"m","a":1,"s":"学校假期突然提前，打乱了我们的整个【计划】。","o":["做事的原因","要做的事情","对事情的看法","以前做过的事情"],"n":["原因是“为什么”。","✔ 计划：事先安排好、打算要做的事情。","看法是“意见”。","以前做过的是“经历”。"],"tip":""},{"id":"2020Rosyth-Q8","src":"2020 Rosyth 预考","qn":"Q8","k":"预考","t":"m","a":1,"s":"晚饭过后，爸爸都会约几个邻居【闲聊】一会儿。","o":["没有什么事情做","没有目的的谈话","讨论事情的详情","讲跟自己无关的事"],"n":["这是“闲着、无聊”。","✔ 闲聊：随便聊天，没有一定的题目和目的。","这是“讨论”。","闲聊可以聊自己的事。"],"tip":""},{"id":"2020Rosyth-Q13","src":"2020 Rosyth 预考","qn":"Q13","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["要是这样做，【适合】老师的要求吗？","你们刚刚搬来这里，觉得【适合】吗？","你的身体发烫，是觉得不【适合】吗？","这个词语用在这句话里，【适合】吗？"],"n":["合乎要求用“符合”。","习惯新环境用“适应”。","身体不舒服用“舒服”。","✔ 适合：放在那里刚好合适（适合用在这里、适合你穿）。"],"tip":""},{"id":"2020Rosyth-Q14","src":"2020 Rosyth 预考","qn":"Q14","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["时间是最宝贵的，我们一定要【珍惜】！","我们差一点就赢了，真是太【珍惜】了！","箱子里的这些【珍惜】，都是爷爷留下来的。","这是一件【珍惜】的礼物，我一定好好爱护。"],"n":["✔ 珍惜：重视、爱惜，不浪费（珍惜时间、珍惜机会）。是动词。","差一点赢用“可惜”。","宝贵的东西是“珍宝”。","形容礼物用“珍贵”。"],"tip":""},{"id":"2020Rosyth-Q15","src":"2020 Rosyth 预考","qn":"Q15","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["为了【战胜】劳累，爸爸今天很早就上床睡觉了。","要是军队在水上【战胜】，最好用的武器就是船。","这架飞机跟刚才那一架不同，这是【战胜】飞机。","只要坚持不放弃，我们就一定能够【战胜】困难。"],"n":["劳累要靠休息“消除”。","在水上打仗用“作战”。","打仗用的飞机是“战斗机”。","✔ 战胜：打败（战胜困难、战胜对手）。"],"tip":""},{"id":"2020SCGS-Q5","src":"2020 SCGS 预考","qn":"Q5","k":"预考","t":"f","a":2,"s":"在天气____的情况下，爬山队员仍然往山顶前进。","o":["正常","阴暗","恶劣","潮湿"],"n":["正常：天气好，就不会说“仍然前进”。","阴暗：光线暗，多形容地方（阴暗的角落）。","✔ 恶劣：非常坏（天气恶劣、环境恶劣）。“仍然”说明情况很糟。","潮湿：湿湿的，不算太危险。"],"tip":""},{"id":"2020SCGS-Q6","src":"2020 SCGS 预考","qn":"Q6","k":"预考","t":"f","a":0,"s":"这两支球队的实力都很强，他们将在这次的比赛中____冠军。","o":["争夺","获得","接受","领取"],"n":["✔ 争夺：两方都想要，互相抢（争夺冠军）。实力都强，所以是“争”。","获得：已经得到了，但两队不可能都获得冠军。","接受：收下别人给的东西。","领取：去拿属于自己的东西（领取奖品）。"],"tip":""},{"id":"2020SCGS-Q7","src":"2020 SCGS 预考","qn":"Q7","k":"预考","t":"m","a":0,"s":"哥哥参与印尼的救灾任务，全家人都为他的安全【担忧】。","o":["不放心，还感到不安","觉得危险，心里害怕","没有信心，感到紧张","感到苦恼，很不开心"],"n":["✔ 担忧：担心、发愁，放心不下。","这是“害怕”。","这是“紧张”。","这是“苦恼”。"],"tip":""},{"id":"2020SCGS-Q8","src":"2020 SCGS 预考","qn":"Q8","k":"预考","t":"m","a":3,"s":"看见姐姐在跳舞，妹妹也【模仿】她跳了起来。","o":["做一连串的动作","重复同一个动作","想出有创意的动作","照着学同样的动作"],"n":["不是“连续做”。","不是“重复”自己的动作。","模仿是学别人，没有创意。","✔ 模仿：照着别人的样子做。"],"tip":""},{"id":"2020SCGS-Q13","src":"2020 SCGS 预考","qn":"Q13","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["如果你天天都这么晚睡觉，就会【损坏】身体。","自从小丽和美美吵架后，两人的友情就【损坏】了。","哥哥不小心把手机掉在地上，结果手机【损坏】了。","我想当班长却得不到同学的支持，心情被【损坏】。"],"n":["伤害身体用“损害／伤害”。","友情变坏用“破裂”。","✔ 损坏：东西坏掉了（手机损坏、机器损坏）。","心情不好用“影响／破坏”。"],"tip":""},{"id":"2020SCGS-Q14","src":"2020 SCGS 预考","qn":"Q14","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["弟弟恢复了健康，脸色也【鲜艳】了许多。","今天阳光【鲜艳】，我们一起到公园放风筝。","巴刹卖的菜【鲜艳】又便宜，每天都很快卖完。","这条裙子的颜色十分【鲜艳】，适合年轻女孩子穿。"],"n":["脸色好用“红润”。","阳光好用“明媚／灿烂”。","菜好用“新鲜”。","✔ 鲜艳：颜色鲜明好看（颜色鲜艳、鲜艳的花）。"],"tip":""},{"id":"2020SCGS-Q15","src":"2020 SCGS 预考","qn":"Q15","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["我们平时应该多注意照顾眼睛，【避免】近视。","你得了严重的感冒，应该【避免】到人多的地方。","几只小兔子为了【避免】狮子，立刻跳到草丛中躲起来。","我们乘坐的巴士绕远路行驶，【避免】了交通堵塞的道路。"],"n":["“避免近视”没错，但“照顾眼睛”搭配不对，应是“爱护／保护眼睛”。","✔ 避免：想办法不让某种情况发生（避免到人多的地方）。⚠ 答案卷印的是(4)，但(4)搭配不对，这里按(2)。","躲开动物用“躲避”。","不走那条路用“避开”。"],"tip":""},{"id":"2020TN-Q5","src":"2020 道南 预考","qn":"Q5","k":"预考","t":"f","a":0,"s":"哥哥决定尝试一个人出国旅行，谁也____不住。","o":["阻拦","截止","遮挡","控制"],"n":["✔ 阻拦：拦住不让去（谁也阻拦不住）。","截止：到期限停止（截止报名）。","遮挡：挡住视线或光（遮挡阳光）。","控制：掌握住不让乱动（控制情绪），“控制不住”说的是自己。"],"tip":""},{"id":"2020TN-Q6","src":"2020 道南 预考","qn":"Q6","k":"预考","t":"f","a":3,"s":"我们不应该在马路边玩耍，这样才能____发生意外。","o":["消灭","下降","克服","避免"],"n":["消灭：彻底除掉（消灭蚊子）。","下降：从高到低（温度下降）。","克服：战胜困难。","✔ 避免：设法不让坏事发生（避免发生意外）。"],"tip":""},{"id":"2020TN-Q7","src":"2020 道南 预考","qn":"Q7","k":"预考","t":"m","a":1,"s":"林叔叔一【恢复】健康，就马上回公司上班。","o":["和过去一模一样","变成原来的样子","回到正常的温度","开始有了些改变"],"n":["“一模一样”是外表相同，太绝对。","✔ 恢复：变回原来（好的）样子。","只说温度，太窄。","恢复是变回去，不是开始改变。"],"tip":""},{"id":"2020TN-Q8","src":"2020 道南 预考","qn":"Q8","k":"预考","t":"m","a":3,"s":"姐姐上了中学后，总是跟妈妈【抱怨】学校里的食物不好吃。","o":["感到不高兴而叹气","因生气而责怪别人","对环境变化不适应","向人说出心中不满"],"n":["叹气不一定说出来。","“责怪别人”是“指责”。","这是“不适应”。","✔ 抱怨：把心里的不满说出来。"],"tip":""},{"id":"2020TN-Q13","src":"2020 道南 预考","qn":"Q13","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["我们做事不能只顾自己，也要考虑别人的【遭受】。","一个人在外【遭受】危险时，应该马上打电话报警。","昨夜发生的地震，让这座城市【遭受】了巨大的破坏。","由于【遭受】父母的影响，小华从小就对美术很有兴趣。"],"n":["别人的心情用“感受”。","碰到危险用“遇到”。","✔ 遭受＋破坏／损失／打击（不好的事）。","好的影响用“受到”。"],"tip":""},{"id":"2020TN-Q14","src":"2020 道南 预考","qn":"Q14","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["妈妈一边散步，一边【赞赏】美丽的风景。","班长一向乐于助人，大家都对他的行为【赞赏】不已。","小华提议周末去公园野餐，爸爸妈妈都十分【赞赏】。","为了庆祝父亲节，我写了一首【赞赏】父爱的诗送给爸爸。"],"n":["看风景用“欣赏”。","✔ 赞赏：欣赏并称赞人的行为、表现（赞赏不已）。","同意提议用“赞成”。","写诗夸父爱用“赞美／歌颂”。"],"tip":""},{"id":"2020TN-Q15","src":"2020 道南 预考","qn":"Q15","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["听了哥哥的建议，爸爸不停地点头【表示】同意。","这位音乐家很小就会作曲，【表示】出惊人的音乐天分。","欢欢为人骄傲，总是【表示】出一副看不起别人的样子。","奶奶的英语说得不好，因此不敢用英语【表示】自己的想法。"],"n":["✔ 表示：用话或动作让人知道（点头表示同意、表示感谢）。","天分要“显示／展现”出来。","样子用“表现／摆出”。","用语言说想法用“表达”。"],"tip":""},{"id":"2020TMS-Q5","src":"2020 淡马锡 预考","qn":"Q5","k":"预考","t":"f","a":3,"s":"我们出钱出力帮助客工，让他们感受到新加坡有____。","o":["友情","亲情","热情","温情"],"n":["友情：朋友之间的感情。","亲情：家人之间的感情。","热情：对人热心、热烈，多形容人的态度（热情地招呼）。","✔ 温情：温暖、体贴的感情。帮助客工，让他们感到温暖。"],"tip":""},{"id":"2020TMS-Q6","src":"2020 淡马锡 预考","qn":"Q6","k":"预考","t":"f","a":1,"s":"那个小孩在家人的____中，跨出了人生的第一步。","o":["欺骗","期盼","起立","奇怪"],"n":["欺骗：说假话骗人。","✔ 期盼：期待、盼望。家人都盼着他学会走路。","起立：站起来，是动作，不能放在“家人的……中”。","奇怪：形容词，不能这样用。"],"tip":""},{"id":"2020TMS-Q7","src":"2020 淡马锡 预考","qn":"Q7","k":"预考","t":"m","a":0,"s":"这么重要的事情，我们需要多几天的时间【考虑】。","o":["思考问题，以便做出决定","提出问题，以便做出决定","解决问题，以便做出决定","制造问题，以便做出决定"],"n":["✔ 考虑：仔细想，好做决定。","提出问题是“提问”。","解决问题是已经处理好了。","制造问题是“添麻烦”。"],"tip":""},{"id":"2020TMS-Q8","src":"2020 淡马锡 预考","qn":"Q8","k":"预考","t":"m","a":3,"s":"我们真的太累了，只好【暂时】坐在路旁休息一下。","o":["短假期之内","短距离之内","短车程之内","短时间之内"],"n":["暂时跟假期无关。","暂时说的是时间，不是距离。","不是车程。","✔ 暂时：短时间之内、一会儿。"],"tip":""},{"id":"2020TMS-Q13","src":"2020 淡马锡 预考","qn":"Q13","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["一位叔叔把钱包还给我，我向他【表示】感谢。","妹妹精彩的【表示】，让观众都看得津津有味。","弟弟在赛跑中【表示】突出，受到校长的表扬。","我们把【表示】填好后，马上就交给负责老师。"],"n":["✔ 表示感谢：把感谢说出来、做出来。","精彩的“表演”。","成绩突出用“表现”。","要填的是“表格”。"],"tip":""},{"id":"2020TMS-Q14","src":"2020 淡马锡 预考","qn":"Q14","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["一连下了几天雨，今天【总算】放晴了。","我们数了一下，原来【总算】有五十人。","弟弟上课【总算】迟到，所以被老师罚。","【总算】东西不见了，应该找不回来了。"],"n":["✔ 总算：等了很久，终于（总算放晴）。","一共有多少人用“总共”。","常常迟到用“总是”。","东西不见了用“既然／反正”。"],"tip":""},{"id":"2020TMS-Q15","src":"2020 淡马锡 预考","qn":"Q15","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["因为内容【贫穷】，所以我的作文不及格。","因为想象力【贫穷】，我们都想不出办法。","因为土地【贫穷】，农夫种不出好的蔬菜。","因为家境【贫穷】，我没有多余的钱买书。"],"n":["内容少用“贫乏／空洞”。","想象力不够用“缺乏”。","土地不肥用“贫瘠”。","✔ 贫穷：没钱，生活困难（家境贫穷）。"],"tip":""},{"id":"2021ACS-Q5","src":"2021 ACS 预考","qn":"Q5","k":"预考","t":"f","a":3,"s":"小船在江面上____着，让人想吐。","o":["运动","发抖","摆动","晃荡"],"n":["运动：身体活动、锻炼，也指物体移动，不用来形容船摇。","发抖：因为冷或怕，身体抖动。船不会“发抖”。","摆动：来回摇摆（树枝摆动、尾巴摆动），多指一部分东西来回摆。","✔ 晃荡：左右摇来摇去不稳（船在水上晃荡）。摇得厉害才会想吐。"],"tip":""},{"id":"2021ACS-Q6","src":"2021 ACS 预考","qn":"Q6","k":"预考","t":"f","a":2,"s":"小明犯错后，以____的态度向老师道歉。","o":["热情","友善","诚恳","坚强"],"n":["热情：热心、热烈地对待人（热情地招待客人）。道歉不需要热情。","友善：对人友好。","✔ 诚恳：真心诚意（诚恳的态度、诚恳地道歉）。","坚强：遇到困难不屈服，不用来形容道歉的态度。"],"tip":""},{"id":"2021ACS-Q7","src":"2021 ACS 预考","qn":"Q7","k":"预考","t":"m","a":0,"s":"爱迪生是个【伟大】的发明家，为人类做出了巨大的贡献。","o":["超出平常的，令人佩服的","和别人不同，非常骄傲的","比别人强壮，非常高大的","有自信，看不起其他人的"],"n":["✔ 伟大：品格、成就超出平常，让人敬佩（伟大的科学家）。","“骄傲”是贬义，伟大是褒义。","伟大不是说身体高大。","“看不起别人”是自大。"],"tip":""},{"id":"2021ACS-Q8","src":"2021 ACS 预考","qn":"Q8","k":"预考","t":"m","a":1,"s":"父母多和孩子一起参加社区活动，可以【促进】亲子关系。","o":["催促并让它加速","推动并让它发展","提高并让它成功","增加并让它足够"],"n":["“催促”是叫人快一点。","✔ 促进：推动它，让它向前发展、变得更好（促进友谊、促进关系）。","关系没有“成功”。","关系不是数量，不说“足够”。"],"tip":""},{"id":"2021ACS-Q13","src":"2021 ACS 预考","qn":"Q13","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["姐姐【见义勇为】，勇敢面对各种挑战。","爸爸【见义勇为】，帮警察抓住了小偷。","妹妹【见义勇为】，提醒同学认真听课。","老师【见义勇为】，带学生去野外探险。"],"n":["面对挑战用“勇于挑战／迎难而上”。","✔ 见义勇为：看见不公平、危险的事，勇敢地出手帮忙（帮忙抓小偷）。","提醒同学是好心，谈不上“勇为”。","去探险是“勇于冒险”。"],"tip":""},{"id":"2021ACS-Q14","src":"2021 ACS 预考","qn":"Q14","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["那只小狗十分【恶劣】，你千万不要靠近它。","大家只是跟你开了个玩笑，并没有【恶劣】。","虽然环境【恶劣】，这几朵花依然向上生长。","这份食物已经腐烂了，发出一阵阵【恶劣】。"],"n":["狗很凶用“凶恶”。","没有坏心思用“恶意”。","✔ 恶劣：非常坏（环境恶劣、天气恶劣、态度恶劣）。","难闻的味道用“恶臭”。"],"tip":""},{"id":"2021ACS-Q15","src":"2021 ACS 预考","qn":"Q15","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["志新读了几遍，还是不能【解释】课文的内容。","这些塑料袋燃烧后，会【解释】出有毒的气体。","听了文思详细的【解释】后，老师才肯原谅他。","我及时【解释】了这个问题，婆婆夸我做得好。"],"n":["读懂课文用“理解”。","放出气体用“释放”。","✔ 解释：说明原因、理由（听了他的解释）。","处理好问题用“解决”。"],"tip":""},{"id":"2021CHS-Q5","src":"2021 公教中学 预考","qn":"Q5","k":"预考","t":"f","a":3,"s":"这场____的比赛将决定哪一支球队进入决赛，球员绝对不能犯错。","o":["精彩","激动","难忘","关键"],"n":["精彩：好看、出色，但和“决定进入决赛、不能犯错”没关系。","激动：人的感情，不形容比赛。","难忘：比完以后才知道难不难忘。","✔ 关键：最重要、起决定作用的（关键的比赛）。"],"tip":""},{"id":"2021CHS-Q6","src":"2021 公教中学 预考","qn":"Q6","k":"预考","t":"f","a":1,"s":"这篇故事感动人心，作者写作的____来自他小时候困苦的生活。","o":["幻想","灵感","办法","变化"],"n":["幻想：不实际的想象，和“真实困苦的生活”不配。","✔ 灵感：写作、创作时突然产生的好想法（写作的灵感来自……）。","办法：解决问题的方法。","变化：改变，不是写作的来源。"],"tip":""},{"id":"2021CHS-Q7","src":"2021 公教中学 预考","qn":"Q7","k":"预考","t":"m","a":0,"s":"何老板常常【为难】员工，到了放工时间还不让他们回家。","o":["故意制造问题","加以批评指责","让人无法明白","态度十分恶劣"],"n":["✔ 为难：故意给人出难题，让人难办。","这是“批评”。","这是“难懂”。","这是“态度恶劣”，不是为难的意思。"],"tip":""},{"id":"2021CHS-Q8","src":"2021 公教中学 预考","qn":"Q8","k":"预考","t":"m","a":1,"s":"林阿姨很【坚强】，生活再苦也从不抱怨。","o":["喜欢思考不退缩","遇到困难不放弃","不怕危险不胆小","勤劳工作不懒惰"],"n":["坚强和“思考”无关。","✔ 坚强：遇到困难、打击也不倒下、不放弃。","这是“勇敢”。","这是“勤劳”。"],"tip":""},{"id":"2021CHS-Q13","src":"2021 公教中学 预考","qn":"Q13","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["国王把国家【修理】得很好，人人幸福快乐。","电冰箱突然坏了，王叔叔【修理】了老半天。","架子上的东西终于摆好了，你别再去【修理】。","老师【修理】了我的句子，让我的作文进步了。"],"n":["管理国家用“治理”。","✔ 修理：把坏了的东西修好（修理冰箱、修理电脑）。","摆好的东西别再“动／乱碰”。","改句子用“修改”。"],"tip":""},{"id":"2021CHS-Q14","src":"2021 公教中学 预考","qn":"Q14","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["巴士一到站，大家都【争先恐后】地挤上巴士。","看了题目后，全班都【争先恐后】地讨论起来。","明华做事情总是【争先恐后】的，让老板十分不满。","小林【争先恐后】地跑出家门，但上学还是迟到了。"],"n":["✔ 争先恐后：抢着往前，怕落在别人后面（争先恐后地挤上车）。","讨论用“热烈地”。","做事马虎用“马马虎虎”。","一个人没有“争先”的对象，应该用“急急忙忙”。"],"tip":""},{"id":"2021CHS-Q15","src":"2021 公教中学 预考","qn":"Q15","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["同学们都做完了老师的【建议】，受到老师的表扬。","志光想了很久，还是没有想到解决问题的【建议】。","小丽听取了陈阿姨的【建议】后，决定把课程读完。","哥哥要做专题报告，他正要去图书馆查找【建议】。"],"n":["做完的是“作业／任务”。","解决问题用“办法”。","✔ 建议：别人提出的意见（听取建议、提出建议）。","查找的是“资料”。"],"tip":""},{"id":"2021HP-Q5","src":"2021 Henry Park 预考","qn":"Q5","k":"预考","t":"f","a":2,"s":"要在考试中____优秀的成绩，就一定要努力学习。","o":["产生","拥有","获得","完成"],"n":["产生：出现新的东西（产生兴趣、产生问题）。","拥有：本来就有、占有（拥有财富）。","✔ 获得：经过努力得到（获得好成绩、获得冠军）。","完成：做好一件事（完成作业）。"],"tip":""},{"id":"2021HP-Q6","src":"2021 Henry Park 预考","qn":"Q6","k":"预考","t":"f","a":0,"s":"我们要经常____身体，才不容易生病。","o":["锻炼","摇摆","晃荡","训练"],"n":["✔ 锻炼身体：通过运动让身体强壮。固定搭配。","摇摆：来回摆动。","晃荡：摇来摇去。","训练：有计划地教和练（训练球员、训练小狗），“训练身体”不常说。"],"tip":""},{"id":"2021HP-Q7","src":"2021 Henry Park 预考","qn":"Q7","k":"预考","t":"m","a":3,"s":"对这个问题的解决方法，他早已【胸有成竹】。","o":["非常肯定会发生不好的事情","可以猜测出将要发生的事情","已经和其他人商量好要合作","心里早有全面的考虑和打算"],"n":["这是“预感不妙”。","这是“预料”。","这是“商量好”。","✔ 胸有成竹：画竹子之前心里已经有竹子的样子，比喻做事前心里早有主意。"],"tip":""},{"id":"2021HP-Q8","src":"2021 Henry Park 预考","qn":"Q8","k":"预考","t":"m","a":1,"s":"校长【宣布】下星期五学生将进行居家学习。","o":["大声演讲，让大家都听到","公开通知，使众人都知道","通过网络，把消息传出去","重要的事，吩咐学生去做"],"n":["宣布不一定要大声演讲。","✔ 宣布：正式公开地告诉大家。","这是“发布到网上”。","这是“吩咐”。"],"tip":""},{"id":"2021HP-Q13","src":"2021 Henry Park 预考","qn":"Q13","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["考试【截止日期】到了，大家终于可以尽情地去玩了。","这本书已经过了【截止日期】，小明忘了还给图书馆。","小范错过报名的【截止日期】，所以不能参加比赛了。","这些食物已经过了【截止日期】，你应该把它们丢掉。"],"n":["考试结束了，用“结束”。","还书的日期是“到期日”。","✔ 截止日期：报名、交表等的最后期限。","食物过期用“保质期／有效期”。"],"tip":""},{"id":"2021HP-Q14","src":"2021 Henry Park 预考","qn":"Q14","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["老师不许学生们带【贵重】物品到学校。","妈妈教导我们怎样安排【贵重】的时间。","爷爷非常喜欢挂在客厅的【贵重】照片。","小明不向困难低头的精神十分【贵重】。"],"n":["✔ 贵重：价钱高、很值钱（贵重物品、贵重的首饰）。","时间用“宝贵”。","照片有纪念意义用“珍贵”。","精神用“可贵”。"],"tip":""},{"id":"2021HP-Q15","src":"2021 Henry Park 预考","qn":"Q15","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["那天发生的事，不断【体现】在我的脑海里。","草船借箭这件事，【体现】了诸葛亮的智慧。","妹妹做了个恶梦，【体现】她对考试的压力。","他看起来脸色苍白，【体现】了身体不舒服。"],"n":["在脑海里出现用“浮现”。","✔ 体现：通过具体的事表现出某种精神、品质（体现了智慧）。","恶梦“反映了”她的压力。","脸色苍白“看来”他不舒服，用“显示”。"],"tip":""},{"id":"2021MGS-Q5","src":"2021 MGS 预考","qn":"Q5","k":"预考","t":"f","a":2,"s":"弟弟受不了妈妈的____，生气地冲出了家门。","o":["重视","吩咐","唠叨","争论"],"n":["重视：认为很重要。被重视不会生气。","吩咐：口头叫人做事，一次而已，不会“受不了”。","✔ 唠叨：一件事说个不停。说多了才让人“受不了”。","争论：双方各说各的理，是两个人一起，不是“妈妈的”。"],"tip":""},{"id":"2021MGS-Q6","src":"2021 MGS 预考","qn":"Q6","k":"预考","t":"f","a":3,"s":"爸爸工作忙碌，根本没有时间帮我上网____资料。","o":["搜遍","搜出","搜到","搜索"],"n":["搜遍：每个地方都找过了，强调结果。","搜出：找出来了，强调结果。","搜到：找到了，强调结果。","✔ 搜索：去找（上网搜索资料）。“没时间帮我”做这件事，强调动作，不是结果。"],"tip":""},{"id":"2021MGS-Q7","src":"2021 MGS 预考","qn":"Q7","k":"预考","t":"m","a":2,"s":"工头对那群劳工大喊大叫，态度十分【恶劣】。","o":["欺压别人","语言粗俗","坏到极点","犯罪念头"],"n":["这是“欺负”。","这是说话难听，只是一部分。","✔ 恶劣：非常坏（态度恶劣、天气恶劣）。","这是“坏念头”。"],"tip":""},{"id":"2021MGS-Q8","src":"2021 MGS 预考","qn":"Q8","k":"预考","t":"m","a":0,"s":"小安喜欢【模仿】那位歌星的动作和神态，而且有模有样。","o":["按照相同的样子做","使自己和别人一样","按照给出的要求做","使样子和语言一样"],"n":["✔ 模仿：照着别人的样子去做。","模仿只学动作样子，不是变成一样的人。","按要求做是“遵照”。","不对。"],"tip":""},{"id":"2021MGS-Q13","src":"2021 MGS 预考","qn":"Q13","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["这幅油画的人物和景色结合得十分【巧妙】，让人惊叹。","他用那双【巧妙】的双手，完成了这座举世无双的雕像。","只要你【巧妙】地理解人物的性格特点，就能演好角色。","我终于教会了妹妹，使她【巧妙】完成了这个舞蹈动作。"],"n":["✔ 巧妙：设计、方法很高明（结合得巧妙）。","形容手用“灵巧”。","理解人物用“深入地”。","顺利地完成用“顺利”。"],"tip":""},{"id":"2021MGS-Q14","src":"2021 MGS 预考","qn":"Q14","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["学长【命令】小美必须拾起掉在地上的垃圾。","国王【命令】手下去寻找世界上最大的宝石。","老师【命令】我们明天记得带彩色笔来学校。","警察【命令】脚踏车骑士在马路上小心行驶。"],"n":["学长对同学，不能用“命令”，用“提醒／要求”。","✔ 命令：上级（国王、将军）强制下面的人去做。","老师提醒学生用“提醒”。","叫人小心用“提醒／劝告”。"],"tip":""},{"id":"2021MGS-Q15","src":"2021 MGS 预考","qn":"Q15","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["同学们都【甘愿】努力考取好成绩。","妹妹【甘愿】长大后当一名歌唱家。","那些犯错误的同学都【甘愿】被罚。","哥哥姐姐【甘愿】毕业后出国留学。"],"n":["想考好用“希望／愿意”。","理想用“希望／梦想”。","✔ 甘愿：心甘情愿地接受（常接不好的事：甘愿受罚）。","计划用“打算”。"],"tip":""},{"id":"2021NH-Q5","src":"2021 南华 预考","qn":"Q5","k":"预考","t":"f","a":2,"s":"我____经过书店，就给你买了这本杂志。","o":["随手","总算","刚巧","不如"],"n":["随手：顺手做（随手关门），不说“随手经过”。","总算：等了很久终于。","✔ 刚巧：正好、碰巧（刚巧经过）。","不如：比不上、还是……好。"],"tip":""},{"id":"2021NH-Q6","src":"2021 南华 预考","qn":"Q6","k":"预考","t":"f","a":0,"s":"当义工虽然很辛苦，但我们感觉日子过得很____。","o":["充实","激动","舒服","兴奋"],"n":["✔ 充实：内容丰富、有意义（日子过得很充实）。","激动：感情一下子很强烈，不形容日子。","舒服：和“辛苦”意思相反，不通。","兴奋：一时很高兴，不形容日子。"],"tip":""},{"id":"2021NH-Q7","src":"2021 南华 预考","qn":"Q7","k":"预考","t":"m","a":3,"s":"看见有人落水，他【不顾一切】地跳下水去救人。","o":["不理会别人","不管怎么说","未看清四周的情况","不考虑事情的后果"],"n":["不是不理别人。","这是“无论如何”。","这是“没看清楚”。","✔ 不顾一切：什么都不管，不考虑后果和危险。"],"tip":""},{"id":"2021NH-Q8","src":"2021 南华 预考","qn":"Q8","k":"预考","t":"m","a":0,"s":"他说话前后矛盾，令人【怀疑】。","o":["难以相信","难以理解","难以接受","难以想象"],"n":["✔ 怀疑：不太相信。","这是“不明白”。","这是“不能接受”。","这是“不敢想”。"],"tip":""},{"id":"2021NH-Q13","src":"2021 南华 预考","qn":"Q13","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["妈妈常夸奖懂事的妹妹是一个【巧妙】的好孩子。","爸爸在公园散步时【巧妙】地遇见了邻居王叔叔。","这些漂亮的工艺品是林阿姨用【巧妙】的手制作的。","诸葛亮利用【巧妙】的方法成功骗取了十万支箭。"],"n":["懂事的孩子用“乖巧”。","偶然遇见用“碰巧”。","手用“灵巧”。","✔ 巧妙的方法：又聪明又高明的方法。"],"tip":""},{"id":"2021NH-Q15","src":"2021 南华 预考","qn":"Q15","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["虽然科技十分发达，有些工作还是无法【取代】的。","伟光没有来学校，乐乐被【取代】当今天的值日生。","到超市买东西时，我们应该用环保袋【取代】浪费。","我在比赛时跑得太慢，明华【取代】我成为了冠军。"],"n":["✔ 取代：用一样东西代替另一样，占了它的位置（机器取代人工）。","临时顶替用“代替”。","环保袋取代的是“塑料袋”，不是“浪费”。","冠军本来就不是“我”的，不能说取代我。"],"tip":""},{"id":"2021NY-Q5","src":"2021 南洋 预考","qn":"Q5","k":"预考","t":"f","a":3,"s":"我们总是喜欢听爷爷____以前生活的点点滴滴。","o":["解释","表达","说明","讲述"],"n":["解释：说明原因、意思。","表达：把想法、感情说出来。","说明：把事情说清楚，多用于道理、步骤。","✔ 讲述：把事情的经过讲出来（讲述往事、讲述故事）。"],"tip":""},{"id":"2021NY-Q6","src":"2021 南洋 预考","qn":"Q6","k":"预考","t":"f","a":1,"s":"那天我经过书店时，____志文在里面买书。","o":["参观","瞧见","盼望","观察"],"n":["参观：去某地看（参观博物馆）。","✔ 瞧见：看见。路过时看见他在买书。","盼望：期待。","观察：仔细地看，有目的。"],"tip":""},{"id":"2021NY-Q7","src":"2021 南洋 预考","qn":"Q7","k":"预考","t":"m","a":0,"s":"他从小生活在这个地区，对这里的环境十分【熟悉】。","o":["知道得很清楚","表示得很清楚","检查得很清楚","考虑得很清楚"],"n":["✔ 熟悉：知道得很清楚、很了解。","这是“表达清楚”。","这是“检查”。","这是“想清楚”。"],"tip":""},{"id":"2021NY-Q8","src":"2021 南洋 预考","qn":"Q8","k":"预考","t":"m","a":2,"s":"大家看到小安道歉时态度【诚恳】，便决定原谅他。","o":["认真而努力","善良而温和","恳切而真诚","礼貌而懂事"],"n":["这是“认真”。","这是“温和”。","✔ 诚恳：真心诚意，说话真诚。","有礼貌不一定是真心。"],"tip":""},{"id":"2021NY-Q13","src":"2021 南洋 预考","qn":"Q13","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["弟弟非常【伟大】了，可以帮妈妈做很多家务。","哥哥帮妹妹把野狗吓跑了，他的行为真【伟大】。","马路两旁的雨树十分【伟大】，给路人带来阴凉。","这些【伟大】的发明，给人们的生活带来不少便利。"],"n":["长大了用“懂事／长大”。","小事用“勇敢”。","树大用“高大”。","✔ 伟大：成就或品格超出平常、令人敬佩（伟大的发明）。"],"tip":""},{"id":"2021NY-Q14","src":"2021 南洋 预考","qn":"Q14","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["那位歌手一上台，台下【暂时】响起了掌声。","今天【暂时】会下大雨，你还是带把伞出门。","表哥还没租到合适的房子，【暂时】住在我家。","他答应我明天会【暂时】到图书馆，不会迟到。"],"n":["马上响起用“顿时”。","也许用“可能”。","✔ 暂时：短时间内、先这样（暂时住在我家）。","按时到用“准时”。"],"tip":""},{"id":"2021NY-Q15","src":"2021 南洋 预考","qn":"Q15","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["哥哥终于【甘愿】进入大决赛，希望他获取好成绩。","我【甘愿】姐姐成为一名著名的演员，为我们家争光。","外公今年八十岁，唯一的【甘愿】就是能回家乡看看。","如果不能按时完成任务，我们【甘愿】接受任何处罚。"],"n":["进入决赛用“顺利／如愿”。","希望别人怎样用“希望”。","心愿是名词，用“心愿”。","✔ 甘愿：心甘情愿地接受（甘愿接受处罚）。"],"tip":""},{"id":"2021PH-Q5","src":"2021 培华 预考","qn":"Q5","k":"预考","t":"f","a":2,"s":"这个故事的内容____有趣，小朋友听得津津有味。","o":["运动","心动","生动","行动"],"n":["运动：锻炼身体。","心动：心里被打动、想要（看了就心动）。","✔ 生动：活泼、像活的一样有趣（内容生动、生动有趣）。","行动：去做。"],"tip":""},{"id":"2021PH-Q6","src":"2021 培华 预考","qn":"Q6","k":"预考","t":"f","a":3,"s":"学校邀请家长参加我们的毕业____。","o":["比赛","演出","游戏","典礼"],"n":["比赛、演出、游戏都不和“毕业”搭配。","演出：表演。“毕业演出”不常用。","游戏：玩的活动。","✔ 毕业典礼：正式隆重的仪式。固定搭配。"],"tip":""},{"id":"2021PH-Q7","src":"2021 培华 预考","qn":"Q7","k":"预考","t":"m","a":3,"s":"他在年中考试得到一百分后便【骄傲】起来，不好好学习了。","o":["感到很气愤","自己骗自己","感到全身无力","自以为了不起"],"n":["这是“生气”。","这是“自欺欺人”。","这是“没力气”。","✔ 骄傲：自以为了不起，看不起别人。（这里是贬义）"],"tip":""},{"id":"2021PH-Q8","src":"2021 培华 预考","qn":"Q8","k":"预考","t":"m","a":1,"s":"爸爸妈妈给孩子们【无限】的爱，希望他们快乐成长。","o":["没有规定的要求","没有限定的数量","没有指定的目标","没有设定的主题"],"n":["无限说的是多少，不是要求。","✔ 无限：没有限度、多得没有尽头。","不是目标。","不是主题。"],"tip":""},{"id":"2021PH-Q13","src":"2021 培华 预考","qn":"Q13","k":"预考","t":"s","a":0,"s":"以下哪个句子是正确的？","o":["我已经准备好，【随时】可以出发。","每天早上，我们要【随时】到学校。","妈妈是个【随时】的人，从来不发脾气。","我没有什么主意，【随时】去哪里都行。"],"n":["✔ 随时：任何时候、不论什么时候（随时出发）。","准时到用“准时”。","好脾气的人用“随和”。","去哪里都行用“随便”。"],"tip":""},{"id":"2021PH-Q14","src":"2021 培华 预考","qn":"Q14","k":"预考","t":"s","a":0,"s":"以下哪个句子是正确的？","o":["我班的同学决定在教师节【呈现】舞蹈表演。","妈妈【呈现】了邻居家被盗窃，马上打电话报警。","经过老师的【呈现】后，他终于明白了这个道理。","哥哥的【呈现】出色，在周会上得到了校长的表扬。"],"n":["✔ 呈现：拿出来让人看到（呈现精彩的表演）。","看到了用“发现”。","老师讲解用“讲解／指点”。","成绩好用“表现”。"],"tip":""},{"id":"2021PH-Q15","src":"2021 培华 预考","qn":"Q15","k":"预考","t":"s","a":0,"s":"以下哪个句子是正确的？","o":["雷声大响，妹妹吓得【捂住】耳朵。","他【捂住】自己的下巴，呆呆地看出窗外。","看到眼前的一幕，他【捂住】了自己的身体。","河道的水流被石头【捂住】，水里的生物都死了。"],"n":["✔ 捂住：用手盖住（捂住耳朵、捂住嘴巴）。","手放在下巴下面用“托住”。","身体用“抱住”或“缩起”。","水流不通用“堵住”。"],"tip":""},{"id":"2021RGS-Q5","src":"2021 莱佛士女中 预考","qn":"Q5","k":"预考","t":"f","a":3,"s":"原本在这里的骑楼都____了，变成了高楼大厦。","o":["出租","离别","损坏","消失"],"n":["出租：租给别人用。","离别：人和人分开。","损坏：坏掉，但还在。","✔ 消失：不见了。旧房子没了，变成高楼。"],"tip":""},{"id":"2021RGS-Q6","src":"2021 莱佛士女中 预考","qn":"Q6","k":"预考","t":"f","a":0,"s":"我想了又想，还是想不到解决的方法，觉得很____。","o":["烦恼","辛苦","劳累","恶劣"],"n":["✔ 烦恼：心里烦、发愁（想不到办法很烦恼）。","辛苦：做事累、吃苦，多指身体。","劳累：身体累。","恶劣：非常坏，形容环境、态度。"],"tip":""},{"id":"2021RGS-Q7","src":"2021 莱佛士女中 预考","qn":"Q7","k":"预考","t":"m","a":1,"s":"【毕业】后，大家分开了就很难再见面。","o":["完成工作","结束学习","停止活动","达到目标"],"n":["不是工作。","✔ 毕业：在学校学完了规定的课程，结束学习。","不是活动。","毕业不等于达到目标。"],"tip":""},{"id":"2021RGS-Q8","src":"2021 莱佛士女中 预考","qn":"Q8","k":"预考","t":"m","a":1,"s":"爸爸【不费吹灰之力】就修好了我的电脑，真是太了不起了。","o":["想了很多办法","做事十分容易","用了很大力气","行动非常迅速"],"n":["这是“想尽办法”。","✔ 不费吹灰之力：连吹灰尘的力气都不用，做事非常容易。","意思正好相反。","这是“迅速”，不一定容易。"],"tip":""},{"id":"2021RGS-Q13","src":"2021 莱佛士女中 预考","qn":"Q13","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["他今天的行为真的十分【神奇】，和平时完全不一样。","我想快点拆开这份【神奇】的礼物，看看里面是什么。","妈妈的一声声鼓励，好像给了他一种【神奇】的力量。","自从哥哥开始运动后，整个人看起来更加【神奇】了。"],"n":["奇怪的行为用“奇怪／反常”。","想知道里面是什么用“神秘”。","✔ 神奇：非常奇妙、了不起（神奇的力量）。","看起来更好用“精神／健康”。"],"tip":""},{"id":"2021RGS-Q14","src":"2021 莱佛士女中 预考","qn":"Q14","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["我突然发现自己不够时间【检验】试卷了。","我们学校每年都会为同学们【检验】身体。","多阅读好书会让我们【检验】不同的人生。","据说用银筷子能【检验】出食物是否有毒。"],"n":["看试卷用“检查”。","身体用“检查”。","经历别人的人生用“体验”。","✔ 检验：用方法测试，看是否合格、有没有问题（检验出有毒）。"],"tip":""},{"id":"2021RGS-Q15","src":"2021 莱佛士女中 预考","qn":"Q15","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["他【遭受】了巨大的痛苦，因此整天无精打采。","小安【遭受】了不及格，结果被妈妈骂了一顿。","陌生人帮助了老爷爷，让他【遭受】到了温情。","这里的交通情况很差，常常【遭受】交通意外。"],"n":["✔ 遭受＋痛苦／损失／打击（不好的事）。","考试不及格用“考了”。","好的事用“感受到”。","意外“发生”。"],"tip":""},{"id":"2021RS-Q5","src":"2021 红十字会 预考","qn":"Q5","k":"预考","t":"f","a":2,"s":"这场____了十个小时的大雨，让许多地方都淹水了。","o":["保持","保证","持续","继续"],"n":["保持：维持好的状态（保持安静）。","保证：答应一定做到。","✔ 持续：不间断地延续一段时间（持续了十个小时）。","继续：停下后再接着做，后面多接动作（继续下雨）。"],"tip":""},{"id":"2021RS-Q6","src":"2021 红十字会 预考","qn":"Q6","k":"预考","t":"f","a":3,"s":"妈妈劝了又劝，但是弟弟____不听，仍然要出门去玩。","o":["反而","如果","总算","偏偏"],"n":["反而：结果和预料相反。","如果：假设。","总算：终于。","✔ 偏偏：故意跟别人的意思相反（偏偏不听）。"],"tip":""},{"id":"2021RS-Q7","src":"2021 红十字会 预考","qn":"Q7","k":"预考","t":"m","a":1,"s":"分完作业后，请你把【多余】的作业还给老师。","o":["多过一半的","超过需要的","一定的数量","缺少的部分"],"n":["不是“一半”。","✔ 多余：超过需要、剩下来的。","不对。","意思相反。"],"tip":""},{"id":"2021RS-Q8","src":"2021 红十字会 预考","qn":"Q8","k":"预考","t":"m","a":0,"s":"林先生【考虑】了很久，终于知道该怎么做了。","o":["思考后做出决定","为以后的事烦心","进行观察与探索","通过检查找答案"],"n":["✔ 考虑：仔细想，好做决定。","这是“担忧”。","这是“观察研究”。","这是“检查”。"],"tip":""},{"id":"2021RS-Q13","src":"2021 红十字会 预考","qn":"Q13","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["若你想知道更多【详细】，可以上网查看。","小安【详细】地说明整件事是怎么发生的。","工人们正在修补墙上那些【详细】的裂缝。","他非常【详细】，能发现别人没注意的事。"],"n":["名词要用“详情”。","✔ 详细：周密完整（详细地说明）。","小裂缝用“细小”。","形容人用“细心”。"],"tip":""},{"id":"2021RS-Q14","src":"2021 红十字会 预考","qn":"Q14","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["你连试都不试就放弃，真是太【珍惜】了！","这条项链特别【珍惜】，全世界只有五条。","你们要毕业了，请你【珍惜】剩下的时间。","我们要【珍惜】小动物，不可以伤害它们。"],"n":["不试就放弃用“可惜”。","稀少的东西用“珍贵／稀有”。","✔ 珍惜：好好爱惜，不浪费（珍惜时间）。","对动物用“爱护”。"],"tip":""},{"id":"2021RS-Q15","src":"2021 红十字会 预考","qn":"Q15","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["校长【吩咐】姐姐，说她是乐于助人的好孩子。","针对这件事，大家纷纷提出了自己的【吩咐】。","李叔叔狠狠地【吩咐】了李全，说他不负责任。","我按照妈妈的【吩咐】到巴刹买了许多菜回家。"],"n":["夸奖用“表扬”。","提出的是“意见／看法”。","狠狠地说人用“批评／骂”。","✔ 吩咐：长辈口头叫人做事（按照妈妈的吩咐）。"],"tip":""},{"id":"2021Rosyth-Q5","src":"2021 Rosyth 预考","qn":"Q5","k":"预考","t":"f","a":3,"s":"哥哥喜欢各种球类运动，他想要____加入学校的篮球校队。","o":["举办","建议","介绍","申请"],"n":["举办：办活动（举办比赛）。","建议：提意见。","介绍：让人认识。","✔ 申请：向学校或机构提出请求（申请加入）。"],"tip":""},{"id":"2021Rosyth-Q6","src":"2021 Rosyth 预考","qn":"Q6","k":"预考","t":"f","a":0,"s":"明华常常____班上同学的动作，把大家乐得哈哈大笑。","o":["模仿","代替","练习","按照"],"n":["✔ 模仿：照着样子学（模仿同学的动作）。","代替：换人做。","练习：反复做来学会，“练习同学的动作”不通。","按照：依照，是介词，后面还要接动词。"],"tip":""},{"id":"2021Rosyth-Q7","src":"2021 Rosyth 预考","qn":"Q7","k":"预考","t":"m","a":0,"s":"每当外婆【讲述】她小时候的事情时，我们都会听得津津有味。","o":["把事情说出来","把回忆写出来","把道理讲明白","把心情画出来"],"n":["✔ 讲述：把事情的经过说出来。","讲述是“说”，不是“写”。","讲道理是“说明”。","不对。"],"tip":""},{"id":"2021Rosyth-Q8","src":"2021 Rosyth 预考","qn":"Q8","k":"预考","t":"m","a":1,"s":"听了老师的解释后，一直想不通的我们这才【恍然大悟】。","o":["竟然清楚了","忽然明白了","果然接受了","突然答应了"],"n":["“竟然”是没想到。","✔ 恍然大悟：一下子明白过来。","不是“接受”。","不是“答应”。"],"tip":""},{"id":"2021Rosyth-Q13","src":"2021 Rosyth 预考","qn":"Q13","k":"预考","t":"s","a":1,"s":"以下哪个句子是正确的？","o":["我家附近的商店所卖的商品又便宜又耐用，很【总算】。","这几天热得令人喘不过气来，今天【总算】下起了大雨。","每当妈妈要带弟弟上钢琴课时，他【总算】会非常紧张。","这份考卷非常难，同学们的【总算】没有一个超过 60 分。"],"n":["便宜耐用用“划算”。","✔ 总算：盼了很久，终于（总算下雨了）。","每次都用“总是”。","分数用“总分”。"],"tip":""},{"id":"2021Rosyth-Q14","src":"2021 Rosyth 预考","qn":"Q14","k":"预考","t":"s","a":0,"s":"以下哪个句子是正确的？","o":["美华写了一篇作文，【表达】了自己对家人的敬爱。","听了弟弟的解释，姐姐再一次摇头【表达】不赞成。","对于这次的讲故事比赛，大家都【表达】得很积极。","这次的华文考试，爸爸妈妈都很满意她的【表达】。"],"n":["✔ 表达：用语言、文字把想法和感情说出来（表达敬爱）。","用动作说意思用“表示”（摇头表示不赞成）。","“表现”得很积极。","满意她的“表现／成绩”。"],"tip":""},{"id":"2021Rosyth-Q15","src":"2021 Rosyth 预考","qn":"Q15","k":"预考","t":"s","a":3,"s":"以下哪个句子是正确的？","o":["这份作业我已经检查了很多次，你可以【放松】了。","为了大家的安全，老师要我们【放松】后赶快回家。","他没有坚持到底的精神，一遇到困难就想【放松】。","感到疲倦的时候，爷爷会通过跑步来【放松】心情。"],"n":["叫人别担心用“放心”。","下课用“放学”。","不坚持用“放弃”。","✔ 放松：让紧张的心情、身体松下来（放松心情）。"],"tip":""},{"id":"2021SCGS-Q5","src":"2021 SCGS 预考","qn":"Q5","k":"预考","t":"f","a":2,"s":"面对困难时千万不要____，而是要勇往直前。","o":["失望","后悔","退缩","发抖"],"n":["失望：希望落空。","后悔：做错事后懊悔。","✔ 退缩：遇到困难往后退、不敢做。和“勇往直前”正好相反。","发抖：身体抖，不是选择怎么面对困难。"],"tip":""},{"id":"2021SCGS-Q6","src":"2021 SCGS 预考","qn":"Q6","k":"预考","t":"f","a":3,"s":"老师看到同学们上课时态度____，感到非常开心。","o":["专心","自信","努力","积极"],"n":["专心：集中精神，一般说“上课很专心”，不说“态度专心”。","自信：相信自己。","努力：用力去做，不说“态度努力”。","✔ 积极：主动、热心（态度积极）。固定搭配。"],"tip":""},{"id":"2021SCGS-Q7","src":"2021 SCGS 预考","qn":"Q7","k":"预考","t":"m","a":2,"s":"爸爸现在很忙，你千万别进去他的房间【打扰】他。","o":["提醒他人做事","鼓励他人坚持","使他人无法专心","劝他人好好休息"],"n":["这是“提醒”。","这是“鼓励”。","✔ 打扰：影响别人，让别人不能专心做事。","这是“劝”。"],"tip":""},{"id":"2021SCGS-Q8","src":"2021 SCGS 预考","qn":"Q8","k":"预考","t":"m","a":3,"s":"我想帮小丽，可是她【拒绝】了我的好意，说她要自己完成任务。","o":["不肯尊重","不敢回答","不想理睬","不愿接受"],"n":["不是不尊重。","不是不敢说。","不是不理人。","✔ 拒绝：不接受（拒绝帮助、拒绝好意）。"],"tip":""},{"id":"2021SCGS-Q13","src":"2021 SCGS 预考","qn":"Q13","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["我们应该【保暖】动物，不让它们受到任何伤害。","外婆做的这条被子很厚，盖在身上能够【保暖】。","你放心吧，我一定会帮你好好【保暖】这条珍珠项链。","看到同学们那么热心帮助我，我心里感到很【保暖】。"],"n":["动物用“保护／爱护”。","✔ 保暖：保持身体温暖（被子保暖、衣服保暖）。","帮人看管东西用“保管”。","心里暖用“温暖”。"],"tip":""},{"id":"2021SCGS-Q14","src":"2021 SCGS 预考","qn":"Q14","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["这条裙子【鲜美】，你可以穿着它去参加毕业典礼。","那本书的内容精彩，文字【鲜美】，爸爸非常喜欢。","这锅汤放了很多肉骨头，因此它的味道很【鲜美】。","这些【鲜美】的水果都是爷爷今天早上到超市买的。"],"n":["衣服用“漂亮／鲜艳”。","文字用“优美”。","✔ 鲜美：食物的味道新鲜好吃（汤很鲜美）。","水果用“新鲜”。"],"tip":""},{"id":"2021SCGS-Q15","src":"2021 SCGS 预考","qn":"Q15","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["妈妈做的蛋糕又香又甜，真是【津津有味】。","爸爸讲的故事很精彩，妹妹听得【津津有味】。","这个电视节目【津津有味】，奶奶看得入迷了。","花园里的花种类很多，让人忍不住【津津有味】。"],"n":["津津有味是说人“吃／听／看”得很有兴趣，不能直接形容食物本身，蛋糕用“美味可口”。","✔ 听得／看得／吃得津津有味：形容人很有兴趣。","节目本身用“精彩”。","看花用“流连忘返”。"],"tip":""},{"id":"2021TN-Q5","src":"2021 道南 预考","qn":"Q5","k":"预考","t":"f","a":0,"s":"这支笔看起来很____，对我来说却有着很重要的意义。","o":["普通","粗壮","可贵","巧妙"],"n":["✔ 普通：平常、一般。“看起来普通，却很重要”，前后有转折。","粗壮：又粗又壮，形容树、手臂。","可贵：值得珍惜，和“却”后面意思一样，没有转折。","巧妙：聪明高明。"],"tip":""},{"id":"2021TN-Q6","src":"2021 道南 预考","qn":"Q6","k":"预考","t":"f","a":1,"s":"随着科技的发展，许多旧行业已经渐渐____了。","o":["取代","消失","减少","变化"],"n":["取代：要说“被……取代”，后面还要接东西。","✔ 消失：不见了（渐渐消失）。","减少：数量变少，“行业减少了”不够准确。","变化：改变，不能说明“旧行业”的结果。"],"tip":""},{"id":"2021TN-Q7","src":"2021 道南 预考","qn":"Q7","k":"预考","t":"m","a":2,"s":"那位将军十分【忠诚】，为了保卫国家付出了生命。","o":["对困难绝不害怕","对工作认真负责","为国家尽心尽力","为人民热情服务"],"n":["这是“勇敢”。","这是“负责”。","✔ 忠诚：对国家、对人真心诚意，尽心尽力。","这是“热心服务”。"],"tip":""},{"id":"2021TN-Q8","src":"2021 道南 预考","qn":"Q8","k":"预考","t":"m","a":1,"s":"同学之间应该相亲相爱，不能互相【嘲笑】。","o":["做出可笑的行为","言语上笑话别人","不小心闹出笑话","在一起说说笑笑"],"n":["这是“搞笑”。","✔ 嘲笑：用话笑话、取笑别人。","这是“出丑”。","这是“说笑”，是开心的。"],"tip":""},{"id":"2021TN-Q13","src":"2021 道南 预考","qn":"Q13","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["妈妈常常【提醒】我们，对待长辈一定要有礼貌。","他给的【提醒】太简单，我们一下就说出了谜底。","夜里下了一场雷阵雨，小明被巨大的雷声【提醒】了。","小玉上课很专心，老师一【提醒】就会马上举手回答。"],"n":["✔ 提醒：从旁边说一声，让人注意（提醒我们要有礼貌）。","猜谜的帮助是“提示”。","被雷声叫醒用“惊醒”。","老师问问题用“提问”。"],"tip":""},{"id":"2021TN-Q14","src":"2021 道南 预考","qn":"Q14","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["哥哥仔细【计划】了几遍，才得出了这道题的正确答案。","安安送了自己【计划】的明信片给姐姐，姐姐非常喜欢。","经过老师的【计划】，已经有五十人报名参加了这次的竞赛。","得知爸爸【计划】明年带全家去日本旅行，我和弟弟都兴奋不已。"],"n":["数学题用“计算”。","自己做的明信片用“设计／制作”。","经过老师的“宣传／鼓励”。","✔ 计划：事先打算、安排要做的事（计划去旅行）。"],"tip":""},{"id":"2021TN-Q15","src":"2021 道南 预考","qn":"Q15","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["王先生为人十分慷慨，每年都会【贡献】一笔钱给老人院。","我们应该好好努力，为建设国家【贡献】自己的一份力量。","为了提高同学们的成绩，老师【贡献】了许多时间和精力。","新年庆祝会上，武术队为大家【贡献】了一场精彩的表演。"],"n":["给钱用“捐”。","✔ 贡献：为国家、社会出力（贡献力量）。","花时间精力用“付出”。","表演用“献上／带来”。"],"tip":""},{"id":"2022ACSJ-Q5","src":"2022 ACS(J) 预考","qn":"Q5","k":"预考","t":"f","a":2,"s":"连续几日的暴风雨使很多居民的房子____破坏。","o":["遇到","经过","遭受","获得"],"n":["遇到：碰上（遇到困难、遇到朋友），后面一般不接“破坏”。","经过：从旁边走过，或事情的过程。","✔ 遭受：受到不好的事（遭受破坏、遭受损失）。","获得：得到好东西，用在好事上。"],"tip":""},{"id":"2022ACSJ-Q6","src":"2022 ACS(J) 预考","qn":"Q6","k":"预考","t":"f","a":3,"s":"每当弟弟买了什么好吃的，他总是____地和同学分享。","o":["坚强","善良","幽默","慷慨"],"n":["坚强：遇到困难不倒下，和分享无关。","善良：心地好，一般说“他很善良”，不说“善良地分享”。","幽默：说话有趣，让人发笑。","✔ 慷慨：大方，舍得把东西给别人（慷慨地分享）。"],"tip":""},{"id":"2022ACSJ-Q7","src":"2022 ACS(J) 预考","qn":"Q7","k":"预考","t":"m","a":2,"s":"学习成绩的好坏，【关键】在于你是否用功。","o":["需要认真考虑的事情","应该分别处理的事情","对事情起重要作用的","对事情有一些影响的"],"n":["不是“考虑”。","不是“分开处理”。","✔ 关键：对事情起决定作用、最重要的部分。","“有一些影响”太轻了，关键是“最重要”。"],"tip":""},{"id":"2022ACSJ-Q8","src":"2022 ACS(J) 预考","qn":"Q8","k":"预考","t":"m","a":2,"s":"虽然班长每次都考一百分，但是我并不【妒忌】他。","o":["欣赏有才能的人","欣赏比自己强的人","讨厌比自己好的人","讨厌和自己不同的人"],"n":["欣赏是喜欢，妒忌是不满。","同上，意思相反。","✔ 妒忌：别人比自己好，心里不服、讨厌他。","不同不等于比自己好。"],"tip":""},{"id":"2022ACSJ-Q13","src":"2022 ACS(J) 预考","qn":"Q13","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["弟弟很调皮，喜欢在墙上【糊涂】。","我一时【糊涂】，把妹妹的书包带去学校。","这件事已经过了很久，我的回忆已经【糊涂】了。","没戴眼镜的我看不清白板上的字，眼前一片【糊涂】。"],"n":["乱画用“乱涂乱画”。","✔ 糊涂：脑子不清楚，做错事（一时糊涂）。","回忆不清楚用“模糊”。","看不清用“模糊”。"],"tip":""},{"id":"2022ACSJ-Q14","src":"2022 ACS(J) 预考","qn":"Q14","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["盛开的花朵颜色十分【新鲜】，引来了许多蝴蝶。","每天早上，爷爷都会去公园呼吸【新鲜】的空气。","妈妈煮的鸡饭味道【新鲜】，我们吃得津津有味。","这是我刚收到的【新鲜】消息，很多人还不知道。"],"n":["颜色用“鲜艳”。","✔ 新鲜的空气：清新、干净的空气。","味道好用“鲜美／可口”。","刚出来的消息用“最新”。"],"tip":""},{"id":"2022ACSJ-Q15","src":"2022 ACS(J) 预考","qn":"Q15","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["老师的【唠叨】让我恢复了信心，不再感到害怕。","爸爸【唠叨】我多做运动，不要整天在家玩电脑。","听了他的【唠叨】后，我终于明白了这个字的意思。","妈妈总是喜欢【唠叨】，同样的一件事情要说好几遍。"],"n":["让人有信心的是“鼓励”。","叫我多做运动用“劝”。","让我明白的是“解释”。","✔ 唠叨：一件事说个没完（同样的事说好几遍）。"],"tip":""},{"id":"2022HP-Q5","src":"2022 Henry Park 预考","qn":"Q5","k":"预考","t":"f","a":0,"s":"外面正下着大雨，所以我们____不能去骑脚踏车。","o":["暂时","有时","同时","临时"],"n":["✔ 暂时：短时间内（暂时不能去，雨停了就能去）。","有时：有的时候，不是现在。","同时：在同一个时间。","临时：事先没安排、突然决定的（临时取消）。"],"tip":""},{"id":"2022HP-Q6","src":"2022 Henry Park 预考","qn":"Q6","k":"预考","t":"f","a":1,"s":"小明把裤子穿反了，所以被同学们____。","o":["抱怨","嘲笑","批评","怒骂"],"n":["抱怨：说出不满，一般是“抱怨某件事”。","✔ 嘲笑：取笑别人出丑。裤子穿反是让人发笑的事。","批评：指出错误，多是老师、长辈做的。","怒骂：生气地骂，太严重了。"],"tip":""},{"id":"2022HP-Q7","src":"2022 Henry Park 预考","qn":"Q7","k":"预考","t":"m","a":2,"s":"他不到十岁就能做一桌好菜，令人【佩服】。","o":["感到很惊讶","非常地感动","觉得了不起","十分地满意"],"n":["惊讶只是吃惊。","感动是心被打动。","✔ 佩服：觉得对方很了不起，心里敬重。","满意是符合心意。"],"tip":""},{"id":"2022HP-Q8","src":"2022 Henry Park 预考","qn":"Q8","k":"预考","t":"m","a":0,"s":"救护人员【顺利】地把困在车里的伤者救了出来。","o":["没有困难","用尽全力","耐心完成","坚持到底"],"n":["✔ 顺利：过程中没有遇到阻碍、困难。","这是“尽力”。","这是“耐心”。","这是“坚持”。"],"tip":""},{"id":"2022HP-Q13","src":"2022 Henry Park 预考","qn":"Q13","k":"预考","t":"s","a":0,"s":"以下哪个句子是正确的？","o":["考试要到了，他【严格】要求自己要努力复习功课。","爸爸【严格】地交代我，过马路时一定要注意安全。","小明因为偷了同学的钱包，受到了【严格】的处罚。","快速公路上发生了【严格】的车祸，造成交通堵塞。"],"n":["✔ 严格：要求很高、一点也不放松（严格要求自己）。","交代用“严肃地／再三”。","处罚用“严厉”。","车祸用“严重”。"],"tip":""},{"id":"2022HP-Q14","src":"2022 Henry Park 预考","qn":"Q14","k":"预考","t":"s","a":2,"s":"以下哪个句子是正确的？","o":["由于他生病了，和家人出国的安排受到【打扰】。","明强在呈现报告时，被同学们【打扰】了他的话。","妈妈叫弟弟自己看书，不要【打扰】姐姐做作业。","楼下突然传出一声巨响，【打扰】居民纷纷围观。"],"n":["安排受到“影响”。","话被“打断”。","✔ 打扰：影响别人做事（打扰姐姐做作业）。","“吸引／引起”居民围观。"],"tip":""},{"id":"2022HP-Q15","src":"2022 Henry Park 预考","qn":"Q15","k":"预考","t":"s","a":2,"s":"以下哪个句子是正确的？","o":["妹妹的笑容甜美，大家都觉得她很【可惜】。","那是奶奶送给她的项链，姐姐十分【可惜】。","失去了参加比赛的机会，小丽觉得【可惜】。","那两位兄妹从小就没有了父母，很【可惜】。"],"n":["笑容甜美用“可爱”。","宝贝项链用“珍惜”。","✔ 可惜：失去好机会，让人惋惜。","没有父母用“可怜”。"],"tip":""},{"id":"2022MGS-Q5","src":"2022 MGS 预考","qn":"Q5","k":"预考","t":"f","a":2,"s":"这座建筑物的设计很特别，十分有____。","o":["创造","创新","创意","创办"],"n":["创造：做出新的东西，是动词（创造奇迹）。“很有创造”不说。","创新：常说“勇于创新”，“十分有创新”不自然。","✔ 创意：新颖的想法（很有创意）。","创办：开办学校、公司。"],"tip":""},{"id":"2022MGS-Q6","src":"2022 MGS 预考","qn":"Q6","k":"预考","t":"f","a":3,"s":"保安人员____那名可疑的男子进入大厦。","o":["阻隔","阻力","阻塞","阻拦"],"n":["阻隔：把两边隔开（山水阻隔）。","阻力：阻挡的力量，是名词。","阻塞：路、管子不通（交通阻塞）。","✔ 阻拦：拦住人不让他做（阻拦他进入）。"],"tip":""},{"id":"2022MGS-Q7","src":"2022 MGS 预考","qn":"Q7","k":"预考","t":"m","a":3,"s":"凭着【坚强】的意志力，他终于克服了病魔。","o":["努力支撑到最后","结实而不易破坏","变得更强壮有力","强固有力不动摇"],"n":["这是“坚持”。","这是“坚固”，说东西。","这是“强壮”，说身体。","✔ 坚强：意志很强，遇到困难也不动摇。"],"tip":""},{"id":"2022MGS-Q8","src":"2022 MGS 预考","qn":"Q8","k":"预考","t":"m","a":0,"s":"他一向【慷慨】，经常捐钱帮助有需要的人。","o":["大方给出钱财","时时为人着想","懂得原谅别人","非常爱惜钱财"],"n":["✔ 慷慨：大方，舍得拿出钱财帮人。","这是“体贴”。","这是“宽容”。","意思相反，是“节俭”甚至“小气”。"],"tip":""},{"id":"2022MGS-Q13","src":"2022 MGS 预考","qn":"Q13","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["哥哥找到一份【销售】汽车的工作。","购物中心通过【销售】来吸引顾客。","这本新出版的故事书非常【销售】。","林叔叔的收入只够自己的【销售】。"],"n":["✔ 销售：卖出货物（销售汽车）。","吸引顾客用“促销”。","书卖得好用“畅销”。","花钱用“开销”。"],"tip":""},{"id":"2022MGS-Q14","src":"2022 MGS 预考","qn":"Q14","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["早上六点闹钟响了，我【恍然大悟】地起床去刷牙。","老师把谜题的答案说出来后，我们才【恍然大悟】。","我【恍然大悟】了半天，也不明白这篇文章的内容。","他竟然猜到了故事的结尾，真是让人【恍然大悟】。"],"n":["起床用“迷迷糊糊地”。","✔ 恍然大悟：一下子明白了（听了答案后才恍然大悟）。","想了半天用“苦思冥想”。","猜对结尾让人“佩服”。"],"tip":""},{"id":"2022MGS-Q15","src":"2022 MGS 预考","qn":"Q15","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["露营能【增添】同学之间的感情。","小弟弟的身高又【增添】几公分。","我家楼下【增添】了一个游乐场。","篮球队在这次比赛为校【增添】。"],"n":["感情用“增进”。","身高用“长高了／增加了”。","✔ 增添：添上新的东西（增添了一个游乐场）。","“增添”后面要接东西，如“为校增添光彩”，句子不完整。"],"tip":""},{"id":"2022NH-Q5","src":"2022 南华 预考","qn":"Q5","k":"预考","t":"f","a":0,"s":"王老师一走进课室，同学们就____站起来说早安。","o":["不约而同","胸有成竹","异口同声","一言为定"],"n":["✔ 不约而同：没有约好，却一起做同一件事（不约而同地站起来）。","胸有成竹：心里早有打算。","异口同声：许多人一起说同样的话，只用于“说”。这里重点是“站起来”。","一言为定：说好了就不改。"],"tip":""},{"id":"2022NH-Q6","src":"2022 南华 预考","qn":"Q6","k":"预考","t":"f","a":2,"s":"朋友的鼓励和帮助，带给了我____的勇气。","o":["实际","和谐","无限","充实"],"n":["实际：符合事实、不空想。","和谐：配合得好。","✔ 无限：没有尽头、很多（无限的勇气）。","充实：丰富，形容生活、内容。"],"tip":""},{"id":"2022NH-Q7","src":"2022 南华 预考","qn":"Q7","k":"预考","t":"m","a":1,"s":"李先生是一位【杰出】的科学家。","o":["付出的努力比别人多","才能和成就超过别人","能够被许多人所认识","在某一方面非常出名"],"n":["杰出说的是成就，不是努力。","✔ 杰出：才能、成就特别出众，超过一般人。","这是“有名”。","这是“出名”，不一定杰出。"],"tip":""},{"id":"2022NH-Q8","src":"2022 南华 预考","qn":"Q8","k":"预考","t":"m","a":0,"s":"向阳服装店正举行【促销】，买一条裙子赠送一个小皮包。","o":["举办活动来售出更多货品","通过减价让顾客认识商品","催促顾客买光所有的东西","店里的所有商品都有打折"],"n":["✔ 促销：用活动、赠品等方法推动、促进销售。","不一定减价，目的也不是“认识商品”。","不是催顾客。","不一定全店打折。"],"tip":""},{"id":"2022NH-Q13","src":"2022 南华 预考","qn":"Q13","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["公司倒闭了，老板一直【拖延】了员工的工钱。","你要尽快去看牙医，绝对不能再【拖延】了。","见老师向他走过来，小玉故意【拖延】脚步。","由于突然下起大雪，飞机只好【拖延】起飞。"],"n":["欠工钱用“拖欠”。","✔ 拖延：把时间往后拖，不快点做（不能再拖延）。","走慢用“放慢”。","飞机用“延迟／推迟”。"],"tip":""},{"id":"2022NH-Q14","src":"2022 南华 预考","qn":"Q14","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["王老师【贡献】自己休息时间为学生补习华文。","士兵们为保卫国家【贡献】了自己宝贵的生命。","我要努力学习，为建设国家【贡献】一份力量。","大家积极【贡献】旧课本，帮助那些贫困家庭。"],"n":["花时间用“牺牲／利用”。","生命用“献出”。","✔ 贡献一份力量：为国家、社会出力。","旧课本用“捐出”。"],"tip":""},{"id":"2022NH-Q15","src":"2022 南华 预考","qn":"Q15","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["妈妈劝哥哥【改编】每天玩电脑游戏的坏习惯。","我要向老师报告他【改编】考试成绩的这件事。","老师发现小明写的作文是从范文【改编】来的。","李先生非常成功地把这部小说【改编】成电影。"],"n":["坏习惯用“改掉”。","偷改成绩用“篡改／涂改”。","抄范文用“抄袭”。","✔ 改编：把作品改成另一种形式（小说改编成电影）。"],"tip":""},{"id":"2022NY-Q5","src":"2022 南洋 预考","qn":"Q5","k":"预考","t":"f","a":1,"s":"为了应付小六会考，我已经制定了一份学习____。","o":["建议","计划","报告","选择"],"n":["建议：提出的意见。","✔ 计划：事先的安排（制定学习计划）。","报告：把情况写出来交给别人。","选择：挑选。"],"tip":""},{"id":"2022NY-Q6","src":"2022 南洋 预考","qn":"Q6","k":"预考","t":"f","a":1,"s":"我对美术很感兴趣，打算____报读美术学校。","o":["决定","申请","肯定","邀请"],"n":["决定：“打算决定”重复了。","✔ 申请：向学校提出请求（申请报读）。","肯定：确定。","邀请：请别人来。"],"tip":""},{"id":"2022NY-Q7","src":"2022 南洋 预考","qn":"Q7","k":"预考","t":"m","a":2,"s":"老师担心学生听不明白，便【重复】讲解了一遍。","o":["重新回到原来的样子","一直来回不停地变化","又一次做相同的事情","一次又一次重新尝试"],"n":["这是“恢复”。","这是“变来变去”。","✔ 重复：同样的事再做一次。","这是“反复尝试”。"],"tip":""},{"id":"2022NY-Q8","src":"2022 南洋 预考","qn":"Q8","k":"预考","t":"m","a":0,"s":"这个品牌的行李箱【质量】不错，爸爸用了十年都没损坏。","o":["货品的好坏","货品的数量","货品的大小","货品的形状"],"n":["✔ 质量：东西好不好、耐不耐用。","这是“数量”。","这是“尺寸”。","这是“外形”。"],"tip":""},{"id":"2022NY-Q13","src":"2022 南洋 预考","qn":"Q13","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["我特地为你准备这份礼物，以【表达】心中的感激之情。","爸爸提议周末到海边野餐，我们都摇头【表达】不同意。","弟弟的考试又不及格了，可他【表达】得一点也不在乎。","这场演出深受大家欢迎，演员们都【表达】得非常精彩。"],"n":["✔ 表达：把心里的感情、想法传达出来（表达感激之情）。","用动作表明意思用“表示”。","样子用“表现”。","演出用“表演”。"],"tip":""},{"id":"2022NY-Q14","src":"2022 南洋 预考","qn":"Q14","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["那块石头十分【坚持】，就连铁锤也敲不碎。","他是个【坚持】的人，遇到困难也绝不低头。","为了【坚持】身体健康，爸爸每天都去跑步。","哥哥【坚持】要出国工作，谁都无法阻拦他。"],"n":["硬的东西用“坚硬”。","形容人用“坚强”。","健康用“保持”。","✔ 坚持：一定要这样做，不改变（坚持要出国）。"],"tip":""},{"id":"2022NY-Q15","src":"2022 南洋 预考","qn":"Q15","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["同学们【异口同声】地赞同了老师的提议。","邻居们【异口同声】地议论刚才发生的事。","大家都【异口同声】地讨论着同一个话题。","姐弟俩【异口同声】地买了花为妈妈庆生。"],"n":["✔ 异口同声：大家一起说出同样的话（异口同声地说“好！”）。","议论是各说各的，不是说同样的话，用“纷纷”。","讨论也是各说各的。","买花不是“说”，用“不约而同”。"],"tip":""},{"id":"2022PLMGS-Q5","src":"2022 PLMGS 预考","qn":"Q5","k":"预考","t":"f","a":3,"s":"奶奶有一双____的手，她能剪出各种各样的动物。","o":["勤奋","贴心","聪明","灵巧"],"n":["勤奋：努力不偷懒，形容人。","贴心：体贴，形容人。","聪明：脑子好，形容人。","✔ 灵巧：手很灵活、巧（灵巧的手）。"],"tip":""},{"id":"2022PLMGS-Q6","src":"2022 PLMGS 预考","qn":"Q6","k":"预考","t":"f","a":3,"s":"遇到不明白的字，除了查字典，还可以上网____。","o":["温习","寻问","申请","搜索"],"n":["温习：复习学过的东西。","寻问：没有这个用法，问人是“询问”。","申请：提出请求。","✔ 搜索：在网上找资料（上网搜索）。"],"tip":""},{"id":"2022PLMGS-Q7","src":"2022 PLMGS 预考","qn":"Q7","k":"预考","t":"m","a":2,"s":"妈妈每晚都需要【催促】美美，叫她早点上床睡觉。","o":["叫人尽力去做事","叫人专心去做事","叫人赶快去做事","叫人认真去做事"],"n":["这是“鼓励”。","这是“提醒专心”。","✔ 催促：叫人快一点去做。","这是“要求认真”。"],"tip":""},{"id":"2022PLMGS-Q8","src":"2022 PLMGS 预考","qn":"Q8","k":"预考","t":"m","a":0,"s":"弟弟摇摇头，【表示】自己并没有受伤。","o":["用动作显出态度","用表情传达意思","用文字说明想法","用言语表达感受"],"n":["✔ 表示：用动作或话让别人知道（摇头表示……）。这里是用“摇头”这个动作。","摇头不是表情。","不是写字。","不是说话。"],"tip":""},{"id":"2022PLMGS-Q13","src":"2022 PLMGS 预考","qn":"Q13","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["他总是【不费吹灰之力】地帮助别人，让人信服。","摊主【不费吹灰之力】地出租了摊位，解决了难题。","叔叔力气惊人，可以【不费吹灰之力】就搬起柜子。","哥哥十分聪明，考试之前【不费吹灰之力】地复习。"],"n":["帮助别人用“热心地”。","“解决了难题”说明这件事本来很难，和“不费吹灰之力（很容易）”前后矛盾。","✔ 不费吹灰之力：一点力气都不用，非常容易（轻松搬起柜子）。","复习不会说“不费吹灰之力地复习”。"],"tip":""},{"id":"2022PLMGS-Q14","src":"2022 PLMGS 预考","qn":"Q14","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["丽丽是个十分【诚恳】的班长，帮助了很多同学。","小美【诚恳】地向同学们道歉，大家决定原谅她。","建文是个【诚恳】的孩子，不会因为犯错就撒谎。","爷爷一生【诚恳】地工作，受到了所有人的尊敬。"],"n":["班长用“热心”。","✔ 诚恳：真心诚意（诚恳地道歉）。","不撒谎用“诚实”。","工作用“勤恳”。"],"tip":""},{"id":"2022PLMGS-Q15","src":"2022 PLMGS 预考","qn":"Q15","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["姐姐喜欢音乐，她的【盼望】是成为钢琴家。","离开了学校后，老师仍然会【盼望】着你们。","在国外多年，他【盼望】能早日与家人团聚。","外公生病了，我们一家人急忙去【盼望】他。"],"n":["理想用“愿望／梦想”。","想念用“挂念”。","✔ 盼望：很想、很期待（盼望早日团聚）。","看病人用“探望”。"],"tip":""},{"id":"2022RS-Q5","src":"2022 红十字会 预考","qn":"Q5","k":"预考","t":"f","a":2,"s":"妈妈提醒我记得____包装袋上的日期。","o":["打听","围观","查看","排列"],"n":["打听：向别人问消息。","围观：很多人围着看热闹。","✔ 查看：仔细看看、检查（查看日期）。","排列：按次序放好。"],"tip":""},{"id":"2022RS-Q6","src":"2022 红十字会 预考","qn":"Q6","k":"预考","t":"f","a":2,"s":"爷爷给我们____他小时候的故事，我们听得津津有味。","o":["讲解","讲话","讲述","讲课"],"n":["讲解：解释说明（讲解题目）。","讲话：说话、发言。","✔ 讲述：把事情、故事的经过说出来。","讲课：老师上课。"],"tip":""},{"id":"2022RS-Q7","src":"2022 红十字会 预考","qn":"Q7","k":"预考","t":"m","a":0,"s":"你这样做，让我很【为难】，我也不知道应该怎么办。","o":["给别人造成困难","让别人感到难受","使别人很难接受","令别人难以忘记"],"n":["✔ 为难：感到难办、不知道怎么办。","这是“难过”。","这是“难以接受”。","这是“难忘”。"],"tip":""},{"id":"2022RS-Q8","src":"2022 红十字会 预考","qn":"Q8","k":"预考","t":"m","a":3,"s":"我【不顾一切】地扑过去，成功接住了掉下来的手机。","o":["没有办法思考事情的发展","没有能力照顾好整件事情","仔细思考后用尽力气完成","不考虑事情的情形和后果"],"n":["不是没有办法。","不是没有能力。","意思相反，不顾一切是“没想”。","✔ 不顾一切：什么都不管，不考虑后果。"],"tip":""},{"id":"2022RS-Q13","src":"2022 红十字会 预考","qn":"Q13","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["他【坚固】自己是对的，无论我们说什么都没用。","不管这件事有多么难完成，他都【坚固】下来了。","弟弟是个非常【坚固】的人，不会轻易被打败的。","这座大楼非常【坚固】，地震发生之后依然完好。"],"n":["认为自己对用“坚信／坚持”。","撑下来用“坚持”。","人用“坚强”。","✔ 坚固：东西结实、不容易坏（大楼坚固）。"],"tip":""},{"id":"2022RS-Q14","src":"2022 红十字会 预考","qn":"Q14","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["丽丽看起来很【独自】，发生了什么事？","他【独自】坐在课室里，想着今早的事。","放学后，我们有说有笑地【独自】回家。","谢谢你在我【独自】时，伸出援手帮助我。"],"n":["形容样子用“孤单／落寞”。","✔ 独自：自己一个人（独自坐着）。","“我们”有很多人，不是独自。","需要帮助时用“有困难时”。"],"tip":""},{"id":"2022RS-Q15","src":"2022 红十字会 预考","qn":"Q15","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["奶奶【分享】姐姐到住家附近的超级市场买鸡蛋。","爸爸常常提醒我们，做人要【分享】，不能自私。","开学时，老师请同学们【分享】自己的假期趣事。","我太饿了，一个人【分享】了妈妈做的草莓蛋糕。"],"n":["叫人去做用“吩咐”。","这里应说“懂得分享”，“做人要分享”不完整。","✔ 分享：把自己的东西、快乐、经历和别人一起享用（分享趣事）。","一个人吃没法“分享”。"],"tip":""},{"id":"2023ACSP-Q5","src":"2023 ACS(P) 预考","qn":"Q5","k":"预考","t":"f","a":1,"s":"我吃完后，把碗盘放回归还处，爸爸向我投以____的目光。","o":["肯定","赞许","表扬","支持"],"n":["肯定：承认、确定，一般说“得到肯定”，不说“肯定的目光”。","✔ 赞许：觉得好而称赞（赞许的目光、点头赞许）。","表扬：公开地称赞，是动作，要说出来，不用来形容目光。","支持：赞成并帮助，“支持的目光”不常说。"],"tip":""},{"id":"2023ACSP-Q6","src":"2023 ACS(P) 预考","qn":"Q6","k":"预考","t":"f","a":2,"s":"我相信你一定能____困难，完成这次的任务。","o":["躲开","阻拦","克服","改变"],"n":["躲开：避开不面对，和“完成任务”矛盾。","阻拦：拦住别人。","✔ 克服：战胜困难（克服困难）。固定搭配。","改变：变化，困难不是用来“改变”的。"],"tip":""},{"id":"2023ACSP-Q7","src":"2023 ACS(P) 预考","qn":"Q7","k":"预考","t":"m","a":0,"s":"看见奶奶送我的手表，她那慈祥的笑容又【浮现】在我的脑海里。","o":["想起发生过的事","看见事情的经过","梦到去世的亲人","记下重要的信息"],"n":["✔ 浮现：过去的事情、样子又出现在脑海里（想起来）。","不是亲眼看见。","不是做梦。","不是“记录”。"],"tip":""},{"id":"2023ACSP-Q8","src":"2023 ACS(P) 预考","qn":"Q8","k":"预考","t":"m","a":3,"s":"陈老板不仅对员工很好，而且也很【慷慨】，大家都很尊敬他。","o":["主动帮人解决问题","非常关心周围的人","爱管别人的大小事情","肯出钱帮有需要的人"],"n":["这是“热心”。","这是“关心”。","这是“多管闲事”。","✔ 慷慨：大方，舍得拿钱财帮助别人。"],"tip":""},{"id":"2023ACSP-Q13","src":"2023 ACS(P) 预考","qn":"Q13","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["这件事很紧急要立刻去办，不能再【拖延】。","由于在路上遇到交通阻塞，我们【拖延】了。","奶奶正在睡午觉，你们千万别去【拖延】她。","他想要做的事情，没有人可以【拖延】了他。"],"n":["✔ 拖延：把时间往后拖（不能再拖延）。","被耽误了用“迟到了／耽误了”。","别去“打扰”她。","没有人能“阻止”他。"],"tip":""},{"id":"2023ACSP-Q15","src":"2023 ACS(P) 预考","qn":"Q15","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["经过不断的努力，他【不费吹灰之力】就实现了他的梦想。","我们在这次的比赛中，【不费吹灰之力】就把对手打败了。","文文【不费吹灰之力】地出现在我后面，把我吓了一大跳。","我【不费吹灰之力】争取到表演的机会，怎么可以放弃呢？"],"n":["“不断的努力”说明很辛苦，和“不费吹灰之力”矛盾。","✔ 不费吹灰之力：非常容易、一点力气都不用（轻松打败对手）。","悄悄地出现用“悄悄地／不声不响地”。","“争取到”说明花了力气，应说“好不容易”。"],"tip":""},{"id":"2023AT-Q5","src":"2023 爱同 预考","qn":"Q5","k":"预考","t":"f","a":3,"s":"虽然这是一本____的日记本，但里面却记录了我美好的回忆。","o":["美丽","整齐","精彩","普通"],"n":["美丽：好看，和后面“美好”没有转折。","整齐：有条理、不乱。","精彩：出色，和后面没有转折。","✔ 普通：很平常。“虽然普通，但……美好”，前后有转折。"],"tip":""},{"id":"2023AT-Q6","src":"2023 爱同 预考","qn":"Q6","k":"预考","t":"f","a":0,"s":"这些绘画作品都很优秀，要从中____一幅代表学校参加比赛，可真不容易啊！","o":["挑选","使用","分配","搜索"],"n":["✔ 挑选：从很多里面选出来（从中挑选）。","使用：拿来用。","分配：按一定标准分给大家。","搜索：仔细寻找（多用在网上找资料）。"],"tip":""},{"id":"2023AT-Q7","src":"2023 爱同 预考","qn":"Q7","k":"预考","t":"m","a":1,"s":"【也许】我还是不能在今年的羽毛球比赛中获得奖杯，但我相信一定能比去年打得更好。","o":["完全肯定","很有可能","最少也是","一定能够"],"n":["意思相反，也许是不确定。","✔ 也许：可能、说不定。","这是“至少”。","这是“一定”。"],"tip":""},{"id":"2023AT-Q8","src":"2023 爱同 预考","qn":"Q8","k":"预考","t":"m","a":3,"s":"从国外来新加坡读书的小安，一直跟妈妈【抱怨】天气太热。","o":["情况很差而责怪人","感到不高兴而叹气","对环境的变化不适应","向别人说出心中不满"],"n":["这是“责怪”。","叹气不一定说出来。","这是“不适应”。","✔ 抱怨：把心里的不满说出来。"],"tip":""},{"id":"2023AT-Q13","src":"2023 爱同 预考","qn":"Q13","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["想要【增添】成功的机会，你必须专心做事。","自从升上中学以后，姐姐的功课【增添】了。","为了【增添】新年的气氛，学校里挂满了红灯笼。","爸爸喜欢去旅行，因为在旅途中能【增添】见识。"],"n":["机会用“增加”。","功课用“增加／变多”。","✔ 增添：添上（增添气氛、增添光彩）。","见识用“增长”。"],"tip":""},{"id":"2023AT-Q14","src":"2023 爱同 预考","qn":"Q14","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["文文【考虑】了很久，终于决定要报读哪所中学。","这道数学题很难，我花了很多时间【考虑】答案。","立明打电话给文强，约他一起【考虑】专题作业。","过马路时要【考虑】清楚，不然后果会不堪设想。"],"n":["✔ 考虑：仔细想，好做决定（考虑了很久，终于决定）。","想答案用“思考”。","一起做作业用“讨论”。","过马路要“看清楚”。"],"tip":""},{"id":"2023AT-Q15","src":"2023 爱同 预考","qn":"Q15","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["听到了老师提出的问题，我们【不约而同】地举起了手。","在开往图书馆的巴士上，伟文和他的邻居【不约而同】。","丽清骑脚踏车和伟强相撞，被【不约而同】地送去医院。","小同和小毅分工合作，【不约而同】完成了老师的任务。"],"n":["✔ 不约而同：事先没约好，却一起做了同样的事（同时举手）。","句子没说做了什么，不完整，应是“不期而遇”。","被送医院不是自己选择的。","分工合作是事先说好的，不是“不约”。"],"tip":""},{"id":"2023CHS-Q5","src":"2023 公教中学 预考","qn":"Q5","k":"预考","t":"f","a":0,"s":"对帮助我们的人说声谢谢，这是____的礼貌。","o":["基本","关键","主要","重要"],"n":["✔ 基本：最起码、最根本的（基本的礼貌）。说声谢谢是最起码的礼貌。","关键：起决定作用的。","主要：最重要的部分，和“次要”相对。","重要：很要紧，“重要的礼貌”不自然。"],"tip":""},{"id":"2023CHS-Q6","src":"2023 公教中学 预考","qn":"Q6","k":"预考","t":"f","a":1,"s":"小偷____地翻过那道围墙，消失在黑暗之中。","o":["连续","迅速","暂时","顿时"],"n":["连续：一个接一个不断。","✔ 迅速：非常快（迅速地翻过围墙）。","暂时：短时间内。","顿时：一下子、立刻，放在句子前面（顿时安静了），不说“顿时地”。"],"tip":""},{"id":"2023CHS-Q7","src":"2023 公教中学 预考","qn":"Q7","k":"预考","t":"m","a":1,"s":"这条路我天天都会经过，非常【熟悉】。","o":["之前尝试过","知道得清楚","很明白情况","不久前认识"],"n":["这是“试过”。","✔ 熟悉：知道得很清楚。","“明白情况”多指事情，不指路。","这是“刚认识”，意思相反。"],"tip":""},{"id":"2023CHS-Q8","src":"2023 公教中学 预考","qn":"Q8","k":"预考","t":"m","a":0,"s":"这几天的天气太热了，今天【总算】下了雨。","o":["愿望终于实现","好不容易完成","最终达到要求","想要好的结果"],"n":["✔ 总算：盼了很久，终于实现了。","“完成”说的是做事。","“达到要求”不对。","这是“希望”，还没实现。"],"tip":""},{"id":"2023CHS-Q13","src":"2023 公教中学 预考","qn":"Q13","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["上华文课时，我们上网【搜索】海洋有哪些生物。","六月假期时，爸爸带我和弟弟去【搜索】红树林。","我不停【搜索】，还是想不出这道数学题的答案。","我再次【搜索】，果然发现作文里写错了两个字。"],"n":["✔ 搜索：仔细寻找，多用在网上找资料（上网搜索）。","去红树林是“探索／参观”。","想答案用“思考”。","看作文用“检查”。"],"tip":""},{"id":"2023CHS-Q14","src":"2023 公教中学 预考","qn":"Q14","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["我以为小明生病了，没想到他竟然【呈现】在课室外。","每当我闭上双眼，爷爷慈祥的脸就会【呈现】在脑中。","为了【呈现】当运动员的梦想，我每天都会锻炼身体。","这场演讲的【呈现】方式很有趣，获得了热烈的掌声。"],"n":["人出现用“出现”。","脑中出现用“浮现”。","梦想用“实现”。","✔ 呈现：展现出来给人看（呈现方式）。"],"tip":""},{"id":"2023CHS-Q15","src":"2023 公教中学 预考","qn":"Q15","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["妈妈想出了很多不同的方法，【促进】孩子多吃水果。","老师的耐心教导【促进】了成绩的进步，我很感谢她。","这次的露营【促进】了同学们的友谊，让大家更团结。","经过这次的旅行，我和家人关系有了很大的【促进】。"],"n":["叫孩子多吃用“鼓励”。","老师教导“帮助”我进步。","✔ 促进：推动它向好的方向发展（促进友谊）。","关系有了很大的“改善／进步”。"],"tip":""},{"id":"2023MGS-Q5","src":"2023 MGS 预考","qn":"Q5","k":"预考","t":"f","a":3,"s":"林阿姨____地推门，结果还是无法把门打开。","o":["对抗","抖动","摇晃","使劲"],"n":["对抗：双方对立、相持。","抖动：颤动。","摇晃：摇来摇去。","✔ 使劲：用力（使劲地推门）。"],"tip":""},{"id":"2023MGS-Q6","src":"2023 MGS 预考","qn":"Q6","k":"预考","t":"f","a":0,"s":"这部小说的构思非常____，读后令人回味无穷。","o":["巧妙","和谐","深刻","鲜艳"],"n":["✔ 巧妙：设计、安排得高明（构思巧妙）。","和谐：配合得好，多指关系、相处。","深刻：印象深、意义深，一般说“内容深刻”，不说“构思深刻”。","鲜艳：颜色好看。"],"tip":""},{"id":"2023MGS-Q7","src":"2023 MGS 预考","qn":"Q7","k":"预考","t":"m","a":2,"s":"立文听懂了我的问题，却【偏偏】不愿意回答我。","o":["情况很明显就是这样","行动不让他人所知道","事实跟所期望的相反","不说话也不发出声音"],"n":["这是“明明”。","这是“偷偷”。","✔ 偏偏：事情故意跟别人希望的相反。","这是“默默”。"],"tip":""},{"id":"2023MGS-Q8","src":"2023 MGS 预考","qn":"Q8","k":"预考","t":"m","a":1,"s":"舅舅【总是】把工作做得很好，备受上司和同事的赞扬。","o":["放心去做","一直这样","非常清楚","没有疑问"],"n":["不是“放心”。","✔ 总是：一直、每次都这样。","不是“清楚”。","这是“一定／肯定”。"],"tip":""},{"id":"2023MGS-Q13","src":"2023 MGS 预考","qn":"Q13","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["外公微笑点点头，【表扬】同意哥哥所提出的建议。","周会上，校长【表扬】在比赛中成绩出色的参赛者。","欢欢的【表扬】令人惊叹，展现了她的努力和才华。","一直以来，我都难以【表扬】对于小安的感激之情。"],"n":["点头“表示”同意。","✔ 表扬：公开地称赞好人好事（校长表扬……）。","欢欢的“表演／表现”。","感激之情用“表达”。"],"tip":""},{"id":"2023MGS-Q14","src":"2023 MGS 预考","qn":"Q14","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["邻居听到这个惊人的消息后，都【胸有成竹】地指出无法相信。","大家都在开心地聊天和玩乐，只有她【胸有成竹】地待在一旁。","这次的竞赛，他【胸有成竹】地认定自己绝对能再度夺得冠军。","孩子们看到甜品摊正在派发糖果，纷纷【胸有成竹】地冲上前。"],"n":["无法相信用“惊讶地”。","一个人待着用“静静地”。","✔ 胸有成竹：心里早有把握（认定自己能赢）。","冲上前用“争先恐后地”。"],"tip":""},{"id":"2023MGS-Q15","src":"2023 MGS 预考","qn":"Q15","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["失去了心爱的玩具，弟弟【恍然大悟】，躲在房里不出声。","今年的国庆庆典，我【恍然大悟】，终于能到现场看演出。","听了老师的讲解，他【恍然大悟】，原来这道题这么简单。","离别的时刻，孩子们都【恍然大悟】，向老师们挥手告别。"],"n":["失去玩具是“伤心”。","能去现场是“如愿以偿”。","✔ 恍然大悟：一下子明白了（原来这么简单）。","离别时是“依依不舍”。"],"tip":""},{"id":"2023MSP-Q5","src":"2023 海星 预考","qn":"Q5","k":"预考","t":"f","a":3,"s":"对面那家快餐店____狗儿进入，我们还是去别的地方吃吧！","o":["防止","阻止","停止","禁止"],"n":["防止：事先想办法不让坏事发生（防止火灾）。","阻止：当场拦住不让做，多指正在发生的事。","停止：不再进行。","✔ 禁止：规定不允许（禁止狗儿进入）。店的规定。"],"tip":""},{"id":"2023MSP-Q6","src":"2023 海星 预考","qn":"Q6","k":"预考","t":"f","a":3,"s":"这块手表和____的手表不一样，它晚上能发光。","o":["贵重","特别","有趣","一般"],"n":["贵重：值钱。","特别：和别的不同，这块手表才特别，不是别的手表。","有趣：好玩。","✔ 一般：普通的、平常的。和一般的手表不一样。"],"tip":""},{"id":"2023MSP-Q7","src":"2023 海星 预考","qn":"Q7","k":"预考","t":"m","a":1,"s":"华强总是长时间看手机，所以现在眼睛看东西越来越【模糊】了。","o":["不整齐","不清楚","不明白","不干净"],"n":["这是“乱”。","✔ 模糊：看不清楚。","这是“不懂”。","这是“脏”。"],"tip":""},{"id":"2023MSP-Q8","src":"2023 海星 预考","qn":"Q8","k":"预考","t":"m","a":0,"s":"困难只是【暂时】的，相信我们一定能克服。","o":["较短时间之内","要发生的时候","事情发生之后","不久就能实现"],"n":["✔ 暂时：短时间之内。","这是“临时”。","这是“事后”。","这是“即将实现”。"],"tip":""},{"id":"2023MSP-Q13","src":"2023 海星 预考","qn":"Q13","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["今天天气【和谐】，我和家人一起去植物园玩。","邻居之间最重要就是【和谐】相处，守望相助。","保安林爷爷的样子【和谐】，大家都很喜欢他。","同学们全部都回家了，学校又恢复了【和谐】。"],"n":["天气用“晴朗”。","✔ 和谐相处：大家关系好、不吵架。","样子用“和蔼”。","没人了是“安静／平静”。"],"tip":""},{"id":"2023MSP-Q14","src":"2023 海星 预考","qn":"Q14","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["小明因为帮助同学，【遭受】了老师的表扬。","这几年，他一直【遭受】着病痛带来的痛苦。","外婆回到故乡，【遭受】到家人的热情招待。","童年的不幸【遭受】，锻炼出他坚强的个性。"],"n":["好事用“受到”。","✔ 遭受＋痛苦（不好的事）。","好事用“受到”。","名词用“遭遇”。"],"tip":""},{"id":"2023MSP-Q15","src":"2023 海星 预考","qn":"Q15","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["看妹妹吃得【津津有味】，我口水快流出来了。","这家餐馆的食物【津津有味】，所以总是满座。","他弹奏的曲子【津津有味】，我们都听得入迷。","这本书实在是【津津有味】，我建议你借来读。"],"n":["✔ 吃得津津有味：形容人吃得很香。","食物本身用“美味”。","曲子用“优美”。","书用“有趣”。"],"tip":""},{"id":"2023NH-Q5","src":"2023 南华 预考","qn":"Q5","k":"预考","t":"f","a":1,"s":"每一个____都对国家有贡献，都应该受到大家的尊重。","o":["作为","行业","服务","目标"],"n":["作为：做出的成绩，或者“当作”。","✔ 行业：工作的种类（每一个行业）。","服务：为别人做事。","目标：想达到的地方。"],"tip":""},{"id":"2023NH-Q6","src":"2023 南华 预考","qn":"Q6","k":"预考","t":"f","a":3,"s":"去年，我和家人的那趟北京之行给我留下了美好的____。","o":["纪念","想法","记录","回忆"],"n":["纪念：常说“留作纪念”，不说“留下了美好的纪念”。","想法：心里的意见。","记录：写下来的东西。","✔ 回忆：想起过去的事（留下美好的回忆）。"],"tip":""},{"id":"2023NH-Q7","src":"2023 南华 预考","qn":"Q7","k":"预考","t":"m","a":0,"s":"这件事很重要，我需要一点时间【考虑】。","o":["思考问题，以便做出决定","查看详情，以便了解情况","研究事物，以便知道真相","交换意见，以便完成工作"],"n":["✔ 考虑：仔细想，好做决定。","这是“了解”。","这是“研究”。","这是“讨论”。"],"tip":""},{"id":"2023NH-Q8","src":"2023 南华 预考","qn":"Q8","k":"预考","t":"m","a":2,"s":"妈妈听说孩子病了，【恨不得】马上飞到他的身边。","o":["果然害怕","十分肯定","强烈希望","再三吩咐"],"n":["不是害怕。","不是肯定。","✔ 恨不得：非常想、急切地希望（但做不到）。","不是吩咐。"],"tip":""},{"id":"2023NH-Q13","src":"2023 南华 预考","qn":"Q13","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["他们两人【曾经】是好朋友，后来为了一件小事成了敌人。","我【曾经】到过日本，所以不知道那里的冬天到底有多冷。","李离开家【曾经】三年了，可是家人到今天都没他的消息。","叔叔捕鱼的【曾经】十分丰富，每次出海都会捕到很多鱼。"],"n":["✔ 曾经：以前有过（曾经是好朋友）。","去过日本应该知道冷不冷，句子前后矛盾，应是“没去过”。","已经三年用“已经”。","名词用“经验”。"],"tip":""},{"id":"2023NH-Q14","src":"2023 南华 预考","qn":"Q14","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["猴子很聪明，最会【制作】人类的动作。","这孩子真调皮，给许多人【制作】麻烦。","上美术课时，老师让我们【制作】海报。","明年年底，这里将要【制作】一座高楼。"],"n":["学动作用“模仿”。","麻烦用“制造”。","✔ 制作：动手做东西（制作海报）。","高楼用“建造”。"],"tip":""},{"id":"2023NH-Q15","src":"2023 南华 预考","qn":"Q15","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["陈先生做事十分马虎，一点也不【严格】。","小安看起来十分【严格】，从不露出笑容。","丽美经常犯错，受到老师【严格】的批评。","经过【严格】的训练，他变得更加坚强了。"],"n":["做事不马虎用“认真”。","样子用“严肃”。","批评用“严厉”。","✔ 严格的训练：要求很高、一点也不放松。"],"tip":""},{"id":"2023NY-Q5","src":"2023 南洋 预考","qn":"Q5","k":"预考","t":"f","a":2,"s":"姐姐没有认真准备，因此她在比赛中的表现十分____。","o":["马虎","恶劣","糟糕","随便"],"n":["马虎：做事不认真，形容人做事的态度。","恶劣：非常坏，多指环境、态度、行为。","✔ 糟糕：很差、很坏（表现糟糕）。","随便：不认真，形容态度。"],"tip":""},{"id":"2023NY-Q6","src":"2023 南洋 预考","qn":"Q6","k":"预考","t":"f","a":0,"s":"我正想出门，____这时外头下起了小雨。","o":["偏偏","渐渐","纷纷","刚刚"],"n":["✔ 偏偏：事情刚好跟想要的相反（正想出门，偏偏下雨）。","渐渐：慢慢地。","纷纷：许多人一个接一个。","刚刚：刚才，和“这时”重复。"],"tip":""},{"id":"2023NY-Q7","src":"2023 南洋 预考","qn":"Q7","k":"预考","t":"m","a":1,"s":"她把【多余】的零用钱存起来，打算为妈妈购买生日礼物。","o":["数量有明显增加","超过需要的数量","超过半数的数量","种类和数量充足"],"n":["这是“增加”。","✔ 多余：超过需要、用剩下的。","不是一半。"
