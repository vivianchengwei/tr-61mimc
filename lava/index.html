function fmtSec(x){x=x||0;return x<60?x+" 秒":Math.round(x/60)+" 分钟"}
function dayHistory(p){
  const byDay={};
  (p.rounds||[]).forEach(r=>{(byDay[r.d]=byDay[r.d]||[]).push(r)});
  Object.keys(p.log).forEach(d=>{byDay[d]=byDay[d]||[]});
  const days=Object.keys(byDay).sort().reverse();
  if(!days.length)return '<p class="muted">还没有记录。</p>';
  return days.map((d,i)=>{
    const L=p.log[d]||[0,0],rs=byDay[d];
    const head='<span class="num">'+d+'</span>　'+L[0]+' 题，对 '+L[1]+(rs.length?' · '+rs.length+' 轮':'');
    const body=rs.slice().reverse().map(r=>{
      const full=r.a>=r.n;
      let h='<div class="w" style="margin-top:6px"><b class="num">'+esc(r.t)+'</b>　'+esc(r.m)+'　答对 <b class="num">'+r.r+'</b> / '+r.a+(full?'':'（做了 '+r.a+'/'+r.n+' 题就离开）')+'　<span class="muted">用时 '+fmtSec(r.sec)+'</span>';
      if(r.w.length){h+='<details style="margin-top:4px"><summary class="muted" style="cursor:pointer">错题 '+r.w.length+'</summary>'+r.w.map(([id,pk])=>{const q=byId[id];if(!q)return"";
        return '<div style="font-size:15px;margin:4px 0 0 10px"><b>'+esc(keyword(q))+'</b> <span class="muted" style="font-size:13px">'+esc(q.src)+' '+esc(q.qn)+'</span>　选了('+(pk+1)+') '+fmt(q.o[pk]).slice(0,200)+'　<span style="color:var(--moss)">正确('+(q.a+1)+')</span></div>'}).join("")+'</details>'}
      return h+'</div>'}).join("");
    return '<details class="day"'+(i===0?' open':'')+' style="margin-top:6px"><summary style="cursor:pointer">'+head+'</summary>'+(body||'<p class="muted" style="font-size:14px;margin:4px 0">（这一天的详细记录在旧版本里，只有总数）</p>')+'</details>';
  }).join("");
}
/* ---------- backup ---------- */
async function packBackup(){
  const json=JSON.stringify({v:1,at:Date.now(),profiles:S.profiles});
  let bytes=new TextEncoder().encode(json),tag="LV1:";
  try{if(window.CompressionStream){const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));bytes=new Uint8Array(await new Response(cs).arrayBuffer());tag="LV1Z:"}}catch(e){}
  let bin="";for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  return tag+btoa(bin);
}
async function unpackBackup(code){
  code=code.trim().replace(/\s+/g,"");
  const m=code.match(/^(LV1Z?):(.+)$/);if(!m)throw new Error("备份码要以 LV1 开头");
  const bin=atob(m[2]);let bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(m[1]==="LV1Z"){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));bytes=new Uint8Array(await new Response(ds).arrayBuffer())}
  const o=JSON.parse(new TextDecoder().decode(bytes));if(!o||!o.profiles)throw new Error("备份码不完整");return o;
}
function mergeProfiles(incoming){
  let added=0;
  Object.entries(incoming).forEach(([name,ip])=>{
    if(!S.profiles[name]){S.profiles[name]=JSON.parse(JSON.stringify(ip));S.profiles[name].rounds=S.profiles[name].rounds||[];added++;return}
    const p=S.profiles[name];
    Object.entries(ip.st||{}).forEach(([id,s])=>{const c=p.st[id];if(!c||(s[1]>c[1])||(s[1]===c[1]&&(s[4]||"")>(c[4]||"")))p.st[id]=s});
    Object.entries(ip.log||{}).forEach(([d,L])=>{const c=p.log[d];if(!c||L[0]>c[0])p.log[d]=L});
    p.bugs=Math.max(p.bugs||0,ip.bugs||0);
    const keyOf=r=>r.d+"|"+r.t+"|"+r.m;const have=new Set((p.rounds||[]).map(keyOf));
    (ip.rounds||[]).forEach(r=>{if(!have.has(keyOf(r))){p.rounds.push(r);added++}});
    p.rounds.sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t));
  });
  return added;
}
function openMode(){
  try{if(window.self!==window.top)return "嵌在别的网页里（例如 claude.ai）——进度可能被浏览器清掉"}catch(e){return "嵌在别的网页里"}
  if(location.protocol==="file:")return "本地文件";
  if((window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone)return "主屏幕 App";
  return "独立网页";
}
let persistState="检查中…";
async function checkPersist(){try{if(navigator.storage&&navigator.storage.persist){const g=await navigator.storage.persisted()||await navigator.storage.persist();persistState=g?"已获准 ✅":"浏览器没有批准（进度仍会保存，但要记得备份）"}else persistState="这个浏览器不支持"}catch(e){persistState="这个浏览器不支持"}}
function storageOK(){try{localStorage.setItem("__lv_t","1");localStorage.removeItem("__lv_t");return true}catch(e){return false}}
function renderParent(){
  const p=P();const rows=[];
  ["f","c","m","s"].forEach(t=>{let r=0,w=0;BANK.forEach(q=>{if(q.t!==t)return;const s=p.st[q.id];if(s){r+=s[2];w+=s[3]}});
    rows.push('<tr><td>'+TYPE_NAME[t]+'</td><td class="num">'+(r+w?Math.round(r/(r+w)*100)+'%（'+r+'/'+(r+w)+'）':'还没做')+'</td></tr>')});
  const bad=BANK.map(q=>({q,s:p.st[q.id]})).filter(x=>x.s&&x.s[3]>0).sort((a,b)=>b.s[3]-a.s[3]||(a.s[0]===1?-1:1)).slice(0,12);
  const lastB=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/86400000):null;
  $("parentBody").innerHTML='<p class="muted" style="font-size:14px;margin:6px 0">现在看的是：<b>'+esc(S.cur)+'</b></p><table class="tbl"><tbody>'+rows.join("")+'</tbody></table>'+
    '<h3 style="font-size:17px;margin-top:14px">错得最多的词</h3>'+
    (bad.length?'<table class="tbl"><tbody>'+bad.map(x=>'<tr><td><b>'+esc(keyword(x.q))+'</b> <span class="muted" style="font-size:13px">'+esc(x.q.src)+'</span></td><td class="num">错 '+x.s[3]+' 次'+(x.s[0]===1?' · 在错题盒':'')+'</td></tr>').join("")+'</tbody></table>':'<p class="muted">还没有错题。</p>')+
    '<h3 style="font-size:17px;margin-top:14px">每日记录（全部保留）</h3>'+dayHistory(p)+
    '<h3 style="font-size:17px;margin-top:18px">💾 进度备份</h3>'+
    '<p class="muted" style="font-size:14px;margin:4px 0">进度只存在这台设备的浏览器里。隔一阵子复制一次备份码，存到备忘录或发给自己。丢了时粘贴回来按「恢复」，是合并，不会覆盖现在的进度。'+(lastB===null?'<b style="color:var(--magma)">还没有备份过。</b>':lastB>=7?'<b style="color:var(--magma)">上次备份是 '+lastB+' 天前，该备份了。</b>':'上次备份：'+(lastB===0?'今天':lastB+' 天前')+'。')+'</p>'+
    '<div class="row"><button class="chip" id="bkCopy" type="button">复制备份码</button><button class="chip" id="bkRestoreBtn" type="button">恢复…</button></div>'+
    '<textarea id="bkText" class="hidden" rows="4" style="width:100%;margin-top:8px;background:#140d0b;color:var(--ash);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px;font:13px/1.4 monospace" aria-label="备份码"></textarea>'+
    '<div class="row hidden" id="bkRestoreRow" style="margin-top:6px"><button class="chip" id="bkRestore" type="button">把上面的备份码恢复进来</button></div>'+
    '<p id="bkMsg" class="muted" style="font-size:14px;margin:6px 0"></p>'+
    '<h3 style="font-size:17px;margin-top:18px">🔍 存储检查</h3>'+
    '<table class="tbl"><tbody><tr><td>本机存储</td><td>'+(storageOK()?'能用 ✅':'不能用 ❌（进度存不住）')+'</td></tr><tr><td>永久保存</td><td>'+persistState+'</td></tr><tr><td>打开方式</td><td>'+openMode()+'</td></tr></tbody></table>'+
    '<div class="row" style="margin-top:14px"><button class="chip" id="soundBtn" type="button">声音：'+(S.sound?"开":"关")+'</button></div>';
  $("soundBtn").addEventListener("click",()=>{S.sound=!S.sound;save();renderParent()});
  $("bkCopy").addEventListener("click",async()=>{
    const code=await packBackup();const ta=$("bkText");ta.classList.remove("hidden");ta.value=code;
    let ok=false;try{await navigator.clipboard.writeText(code);ok=true}catch(e){}
    if(!ok){ta.focus();ta.select()}
    S.lastBackup=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    $("bkMsg").textContent=ok?"已复制（"+code.length+" 个字符）。贴到备忘录里存好。":"浏览器不让自动复制：上面的备份码已经选中，长按选「拷贝」。";
  });
  $("bkRestoreBtn").addEventListener("click",()=>{const ta=$("bkText");ta.classList.remove("hidden");ta.value="";ta.placeholder="把以 LV1 开头的备份码贴在这里";$("bkRestoreRow").classList.remove("hidden");ta.focus()});
  $("bkRestore").addEventListener("click",async()=>{
    try{const o=await unpackBackup($("bkText").value);const n=mergeProfiles(o.profiles);
      const names=Object.keys(o.profiles);if(!S.cur||!S.profiles[S.cur])S.cur=names[0];
      save();renderHome();$("parentBox").open=true;$("bkMsg").textContent="恢复好了：合并了 "+names.join("、")+" 的记录（新增 "+n+" 项）。";}
    catch(e){$("bkMsg").textContent="恢复不了："+(e.message||"备份码不对")+"。请确认整段都贴进来了。"}
  });
}
