,"这是“充足”。"],"tip":""},{"id":"2023NY-Q8","src":"2023 南洋 预考","qn":"Q8","k":"预考","t":"m","a":1,"s":"弟弟【模仿】爸爸的声音说话，逗得大家哈哈大笑。","o":["做成相同的形状","照样子学着去做","和原来的完全一样","发出响声使人听见"],"n":["这是“复制”。","✔ 模仿：照着样子学。","模仿不一定完全一样。","这是“出声”。"],"tip":""},{"id":"2023NY-Q13","src":"2023 南洋 预考","qn":"Q13","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["她常常【幻想】自己是个美丽动人的公主。","我【幻想】了一整晚后决定要向哥哥认错。","国强每天【幻想】在国外工作的爸爸妈妈。","老师鼓励大家【幻想】这道数学题的答案。"],"n":["✔ 幻想：想象不实际、不太可能的事（幻想自己是公主）。","认真想了一整晚用“考虑／思考”。","想念家人用“想念”。","想答案用“思考”。"],"tip":""},{"id":"2023NY-Q14","src":"2023 南洋 预考","qn":"Q14","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["每当遇到困难时，我们都要【坚强】到底。","他双目失明，却仍然【坚强】地面对挑战。","这座建筑物十分【坚强】，地震过后仍然完好无损。","小丽总是【坚强】自己的看法，从不听朋友的劝说。"],"n":["“坚持到底”才是固定搭配。","✔ 坚强地面对：遇到打击不倒下。","建筑物用“坚固”。","看法用“坚持”。"],"tip":""},{"id":"2023NY-Q15","src":"2023 南洋 预考","qn":"Q15","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["考试结束后，同学们【不约而同】地欢呼起来。","老师瞪了我一眼，我立刻【不约而同】地低下了头。","在跑步比赛中，我和伟明【不约而同】地到达了终点。","大家都在网上阅读，去图书馆的人【不约而同】地减少了。"],"n":["✔ 不约而同：没约好，却一起做同样的事（同学们一起欢呼）。","只有“我”一个人，不能用。","同时到达用“同时”。","人数减少用“渐渐”。"],"tip":""},{"id":"2023PH-Q5","src":"2023 培华 预考","qn":"Q5","k":"预考","t":"f","a":0,"s":"弟弟高兴得说不出话来，嘴唇微微____着。","o":["抖动","摇晃","打动","忍受"],"n":["✔ 抖动：轻轻颤动（嘴唇抖动）。激动时嘴唇会抖。","摇晃：摇来摇去，多指东西、身体。","打动：使人感动，要带宾语（打动人心）。","忍受：勉强接受痛苦。"],"tip":""},{"id":"2023PH-Q6","src":"2023 培华 预考","qn":"Q6","k":"预考","t":"f","a":0,"s":"小丽给我讲了一个____的故事，我听得津津有味。","o":["有趣","宝贵","模糊","清楚"],"n":["✔ 有趣：好玩、吸引人（有趣的故事）。和“津津有味”相配。","宝贵：很珍贵。","模糊：不清楚。","清楚：讲得明白，但不一定好听。"],"tip":""},{"id":"2023PH-Q7","src":"2023 培华 预考","qn":"Q7","k":"预考","t":"m","a":2,"s":"这场足球赛被【临时】取消了，使球迷们大失所望。","o":["事情已经过了很久","事情刚刚结束过后","事情快要发生的时候","事情快要被忘记的时候"],"n":["不对。","这是“事后”。","✔ 临时：事情快要发生的时候（才决定）。","不对。"],"tip":""},{"id":"2023PH-Q8","src":"2023 培华 预考","qn":"Q8","k":"预考","t":"m","a":0,"s":"他意志【坚强】，从不轻言放弃。","o":["不可动摇","结实有力","结合紧密","承受不住"],"n":["✔ 坚强：意志很强，不动摇。","这是“强壮”。","这是“团结”。","意思相反。"],"tip":""},{"id":"2023PH-Q13","src":"2023 培华 预考","qn":"Q13","k":"预考","t":"s","a":0,"s":"以下哪个句子是正确的？","o":["鸟儿越飞越高，终于【消失】在蓝天里。","将军用计谋，终于成功【消失】了敌人。","我们要珍惜现在，不要等到【消失】了才后悔。","小明很难过，因为刚才不小心【消失】了钱包。"],"n":["✔ 消失：不见了（消失在蓝天里）。","打败敌人用“消灭”。","要说“失去了”才后悔。","丢东西用“丢失／弄丢”。"],"tip":""},{"id":"2023PH-Q14","src":"2023 培华 预考","qn":"Q14","k":"预考","t":"s","a":0,"s":"以下哪个句子是正确的？","o":["你这么做只是【掩耳盗铃】，不要再自己欺骗自己了。","演唱会开始了，只听见台上传来好听的【掩耳盗铃】。","不管我们怎么问，他都【掩耳盗铃】，什么都不肯说。","火警突然响起，大家都【掩耳盗铃】，赶快离开课室。"],"n":["✔ 掩耳盗铃：捂住耳朵偷铃铛，比喻自己骗自己。","歌声不是成语。","不说话用“守口如瓶”。","赶快离开用“争先恐后”。"],"tip":""},{"id":"2023PH-Q15","src":"2023 培华 预考","qn":"Q15","k":"预考","t":"s","a":2,"s":"以下哪个句子是正确的？","o":["妹妹想去美国玩，结果和哥哥【争夺】了起来。","为了提早完成作业，大家【争夺】时间，努力配合。","为了【争夺】父亲的财产，那两兄弟天天吵来吵去。","今年的比赛竞争激烈，最后由我校成功【争夺】冠军。"],"n":["吵起来用“争吵”。","时间用“争取”。","✔ 争夺：互相抢（争夺财产）。","已经成功拿到用“夺得”。"],"tip":""},{"id":"2023RGS-Q5","src":"2023 莱佛士女中 预考","qn":"Q5","k":"预考","t":"f","a":2,"s":"休息时间到了，校园里顿时____了欢声笑语。","o":["出现","表达","充满","发扬"],"n":["出现：“出现了欢声笑语”可以说，但不如“充满”表现到处都是。","表达：说出想法。","✔ 充满：到处都是（充满了欢声笑语）。","发扬：使好传统更好（发扬精神）。"],"tip":""},{"id":"2023RGS-Q6","src":"2023 莱佛士女中 预考","qn":"Q6","k":"预考","t":"f","a":1,"s":"海上开始吹起强风，那艘船在海上____起来。","o":["飘扬","晃动","搅拌","挥动"],"n":["飘扬：在空中随风摆动（旗子飘扬）。","✔ 晃动：摇来摇去（船晃动）。","搅拌：用棍子在液体里转。","挥动：举起来摇（挥动旗子），要有人做。"],"tip":""},{"id":"2023RGS-Q7","src":"2023 莱佛士女中 预考","qn":"Q7","k":"预考","t":"m","a":3,"s":"不管遇到什么困难，我们都不可以【半途而废】。","o":["做事非常马虎","做事没有计划","做事的速度不够快","做事不能坚持到底"],"n":["这是“马马虎虎”。","这是“没计划”。","这是“慢吞吞”。","✔ 半途而废：做到一半就放弃，不坚持到底。"],"tip":""},{"id":"2023RGS-Q8","src":"2023 莱佛士女中 预考","qn":"Q8","k":"预考","t":"m","a":1,"s":"你这样做【简直】就是在欺负人！","o":["有很大可能性","表示完全是这样","比原来的更进一步","情况和想象中的一样"],"n":["这是“很可能”。","✔ 简直：完全是、差不多就是（加强语气）。","这是“更加”。","这是“果然”。"],"tip":""},{"id":"2023RGS-Q13","src":"2023 莱佛士女中 预考","qn":"Q13","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["爸爸妈妈一向都很【关键】孩子们的身体健康。","成绩好坏的【关键】在于学生有没有努力学习。","现在的学生不能把【关键】精力都用在自己的学习上。","举办这次亲子活动对促进家庭和谐有着【关键】意义。"],"n":["关心健康用“关心”。","✔ 关键：最重要、起决定作用的部分（关键在于……）。","全部精力用“全部”。","意义用“重要”。"],"tip":""},{"id":"2023RGS-Q14","src":"2023 莱佛士女中 预考","qn":"Q14","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["他【巧妙】地把组员的想法结合起来，写出精彩的文章。","筷子真是【巧妙】无比，连小小的东西都可以夹得起来。","我在上学的途中遇到了林叔叔，时间真是太【巧妙】了。","小恩和小花穿了同样的袜子，大家都认为这很【巧妙】。"],"n":["✔ 巧妙：方法高明（巧妙地结合起来）。","筷子“神奇／好用”。","太“巧”了，用“碰巧”。","“巧合”。"],"tip":""},{"id":"2023RGS-Q15","src":"2023 莱佛士女中 预考","qn":"Q15","k":"预考","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["老师再三提醒我们，在营地是【禁止】使用手机的。","只要我们不在马路边踢球，就能【禁止】意外发生。","我们建这道厚厚的围墙，是为了【禁止】敌人攻入。","妈妈看见兄弟俩在争吵，立刻上前去【禁止】他们。"],"n":["✔ 禁止：规定不准做（禁止使用手机）。","不让意外发生用“避免／防止”。","挡住敌人用“防止／阻挡”。","上前拦住用“阻止”。"],"tip":""},{"id":"2023RS-Q5","src":"2023 红十字会 预考","qn":"Q5","k":"预考","t":"f","a":2,"s":"为了多了解妈妈的病情，爸爸要____负责的医生。","o":["作答","配合","联系","祝福"],"n":["作答：回答问题。","配合：一起合作。","✔ 联系：和人接上关系、沟通（联系医生）。","祝福：说好话祝愿。"],"tip":""},{"id":"2023RS-Q6","src":"2023 红十字会 预考","qn":"Q6","k":"预考","t":"f","a":1,"s":"不管遇到什么困难，他都没放弃，真让人____！","o":["肯定","佩服","失望","满意"],"n":["肯定：承认，一般说“得到肯定”。","✔ 佩服：觉得了不起而敬重（真让人佩服）。","失望：希望落空，意思相反。","满意：符合心意，多用于结果。"],"tip":""},{"id":"2023RS-Q7","src":"2023 红十字会 预考","qn":"Q7","k":"预考","t":"m","a":1,"s":"父母给孩子【无限】的关爱，为孩子带来了温暖和欢乐。","o":["没有开始","没有终止","没有起点","没有中间"],"n":["不对。","✔ 无限：没有尽头、没有终止。","不对。","不对。"],"tip":""},{"id":"2023RS-Q8","src":"2023 红十字会 预考","qn":"Q8","k":"预考","t":"m","a":0,"s":"他发现停在家门外的车子竟然被人【砸】了，大吃一惊！","o":["击坏","伤害","擦亮","处理"],"n":["✔ 砸：用重物打、把东西打坏。","伤害多指人或心。","意思相反。","不是处理。"],"tip":""},{"id":"2023RS-Q13","src":"2023 红十字会 预考","qn":"Q13","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["妈妈正在【控制】我爱吃的香蕉蛋糕。","老师【控制】我们，上课要认真听讲。","警察在【控制】交通，以免发生意外。","汽车失去【控制】，撞向路边的围栏。"],"n":["做蛋糕用“制作”。","老师“提醒／要求”我们。","交通用“指挥”。","✔ 失去控制：管不住、不能操纵了。"],"tip":""},{"id":"2023RS-Q14","src":"2023 红十字会 预考","qn":"Q14","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["看到小宽的听写得了零分，妈妈【气氛】地把她骂了一顿。","没尝过榴梿的人，可能觉得它【气氛】很臭，令人受不了。","日本四季分明，【气氛】舒服，是一个适合居住的好地方。","牛车水的商场里挂满了新年灯饰，节日【气氛】非常浓厚。"],"n":["生气用“气愤”。","味道用“气味”。","天气用“气候”。","✔ 气氛：一个地方让人感到的情调（节日气氛浓厚）。"],"tip":""},{"id":"2023RS-Q15","src":"2023 红十字会 预考","qn":"Q15","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["今天的天气十分晴朗，柔和的阳光【普通】大地。","这只不过是一双【普通】的球鞋，价钱也很便宜。","这里交通很方便，出门可以乘搭各种【普通】交通工具。","我们可以通过教育，【普通】提高一般人民的卫生常识。"],"n":["阳光照遍大地用“普照”。","✔ 普通：一般、平常。","“各种交通工具”，多了“普通”。","大范围用“普遍”。"],"tip":""},{"id":"2023Rosyth-Q5","src":"2023 Rosyth 预考","qn":"Q5","k":"预考","t":"f","a":0,"s":"他们勤奋工作，为国家做出不少____。","o":["贡献","表现","尝试","计划"],"n":["✔ 贡献：为国家、社会做的有益的事（做出贡献）。","表现：做出来的样子。","尝试：试一试。","计划：事先的安排，“做计划”和“为国家做出”不配。"],"tip":""},{"id":"2023Rosyth-Q6","src":"2023 Rosyth 预考","qn":"Q6","k":"预考","t":"f","a":2,"s":"小安对父母大声说话，____太不应该了！","o":["反而","往往","简直","常常"],"n":["反而：结果和预料相反。","往往：通常情况下。","✔ 简直：完全、实在是（加强语气：简直太不应该了）。","常常：经常。"],"tip":""},{"id":"2023Rosyth-Q7","src":"2023 Rosyth 预考","qn":"Q7","k":"预考","t":"m","a":2,"s":"小船在大海中左右【晃荡】，吓得船上的人大喊。","o":["摔倒","跨过","摆动","拉下"],"n":["不是摔倒。","不是跨过。","✔ 晃荡：左右摇摆不稳。","不对。"],"tip":""},{"id":"2023Rosyth-Q8","src":"2023 Rosyth 预考","qn":"Q8","k":"预考","t":"m","a":1,"s":"我在这间学校上课六年了，对环境很【熟悉】。","o":["详细地介绍","清楚地知道","愉快地探索","完全地相信"],"n":["这是“介绍”。","✔ 熟悉：知道得很清楚。","这是“探索”。","这是“信任”。"],"tip":""},{"id":"2023Rosyth-Q13","src":"2023 Rosyth 预考","qn":"Q13","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["小丽看起来【考虑】，你应该去安慰她。","年中【考虑】快到了，同学们都在复习。","这件事【考虑】你的能力，你要尽力做。","可可经过再三【考虑】，决定出国工作。"],"n":["心事重重用“忧虑”。","年中“考试”。","“考验”你的能力。","✔ 经过再三考虑：想了很多遍才决定。"],"tip":""},{"id":"2023Rosyth-Q14","src":"2023 Rosyth 预考","qn":"Q14","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["这项任务并不容易，需要大家【拼命】几个月。","为了得到冠军，参赛选手【拼命】向终点跑去。","小安一向来都很顽皮，喜欢跟同学们【拼命】。","只要我们齐心协力，就一定能【拼命】对手。"],"n":["几个月的工作用“努力”。","✔ 拼命：用尽全力（拼命地跑）。","闹着玩用“打闹”。","赢对手用“打败”。"],"tip":""},{"id":"2023Rosyth-Q15","src":"2023 Rosyth 预考","qn":"Q15","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["妈妈在购物中心逛时，【巧妙】遇到多年老朋友。","弟弟很懂事，大家夸他是个【巧妙】的好孩子。","他在作文中【巧妙】地使用佳句，使文章生动。","阿姨用她【巧妙】的手，做出许多美丽的手工。"],"n":["偶然遇到用“碰巧”。","懂事的孩子用“乖巧”。","✔ 巧妙地使用：方法用得高明。⚠ 答案卷印的是(4)，但“巧妙的手”搭配不对，这里按(3)。","手用“灵巧”：一双灵巧的手。"],"tip":""},{"id":"2023SCGS-Q5","src":"2023 SCGS 预考","qn":"Q5","k":"预考","t":"f","a":1,"s":"我们不应该____朋友的才能，应该向他们学习。","o":["讨厌","妒忌","批评","抱怨"],"n":["讨厌：不喜欢，一般讨厌人或事，不说“讨厌才能”。","✔ 妒忌：别人比自己好而不服（妒忌别人的才能）。","批评：指出缺点，才能不是缺点。","抱怨：说出不满。"],"tip":""},{"id":"2023SCGS-Q6","src":"2023 SCGS 预考","qn":"Q6","k":"预考","t":"f","a":2,"s":"志文上课时很____，总是举手回答老师的问题。","o":["严格","勤奋","积极","糊涂"],"n":["严格：要求很高，多指对别人或自己的要求。","勤奋：努力不偷懒，但不一定举手。","✔ 积极：主动、热心（上课积极，主动举手）。","糊涂：不清楚。"],"tip":""},{"id":"2023SCGS-Q7","src":"2023 SCGS 预考","qn":"Q7","k":"预考","t":"m","a":1,"s":"我【曾经】看过一部很好看的电影，它给我留下了深刻的印象。","o":["刚刚发生的事","以前发生过的事","有时候会发生的事","从来没有发生过的事"],"n":["这是“刚刚”。","✔ 曾经：以前有过。","这是“有时”。","意思相反。"],"tip":""},{"id":"2023SCGS-Q8","src":"2023 SCGS 预考","qn":"Q8","k":"预考","t":"m","a":2,"s":"快迟到了，哥哥【匆匆】喝了一杯牛奶就上学了。","o":["争先恐后","不顾一切","急急忙忙","马马虎虎"],"n":["这是抢着往前。","这是什么都不管。","✔ 匆匆：急急忙忙的样子。","这是不认真。"],"tip":""},{"id":"2023SCGS-Q13","src":"2023 SCGS 预考","qn":"Q13","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["听了这个笑话，大家忍不住【嘲笑】起来。","校长跟我们【嘲笑】，还跟我们一起拍照。","我和姐姐一边【嘲笑】，一边走路去学校。","妹妹担心被同学们【嘲笑】，不肯戴眼镜。"],"n":["听笑话用“哈哈大笑”。","校长跟我们“说笑”。","一边“说笑”。","✔ 嘲笑：取笑别人（担心被嘲笑）。"],"tip":""},{"id":"2023SCGS-Q14","src":"2023 SCGS 预考","qn":"Q14","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["我跟家人出国旅游时，买了纪念品留作【回忆】。","你明明知道我在说什么，为什么不作出【回忆】？","看到这个玩具，美好的【回忆】浮现在我的脑海里。","这首诗这么长，怎么可能在一天内【回忆】下来呢？"],"n":["“留作纪念”才是固定搭配。","作出“回应”。","✔ 回忆：想起过去的事（美好的回忆浮现）。","背诗用“背诵／记”。"],"tip":""},{"id":"2023SCGS-Q15","src":"2023 SCGS 预考","qn":"Q15","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["我赢得比赛，兴高采烈地【吩咐】家人这个好消息。","奶奶给我几块钱，【吩咐】我去楼下的超市买鸡蛋。","小文带了小礼物来学校，【吩咐】老师发给同学们。","弟弟【吩咐】同学帮他写作业，同学一口拒绝了他。"],"n":["好消息用“告诉”。","✔ 吩咐：长辈叫晚辈去做事。","学生不能吩咐老师，用“请”。","同学之间用“叫／请”，而且不该请人代写作业。"],"tip":""},{"id":"2023SNG-Q5","src":"2023 圣尼各拉 预考","qn":"Q5","k":"预考","t":"f","a":2,"s":"姐姐____一些朋友来家里庆祝她的生日。","o":["命令","吩咐","邀请","指挥"],"n":["命令：上级强制下级做事。","吩咐：长辈叫晚辈做事。","✔ 邀请：客气地请人来（邀请朋友）。","指挥：发命令、调动（指挥交通）。"],"tip":""},{"id":"2023SNG-Q6","src":"2023 圣尼各拉 预考","qn":"Q6","k":"预考","t":"f","a":2,"s":"我____看了几个小时的电视，眼睛开始感到很痛。","o":["定期","轮流","连续","重复"],"n":["定期：按规定的时间（定期检查）。","轮流：一个接一个地换着做。","✔ 连续：不间断地（连续看了几个小时）。","重复：做同样的事很多次。"],"tip":""},{"id":"2023SNG-Q7","src":"2023 圣尼各拉 预考","qn":"Q7","k":"预考","t":"m","a":3,"s":"弟弟的玩具车不能动了，他请爸爸帮忙【修理】。","o":["想办法把旧的东西变得更美","把已经丢失了的东西找回来","再次利用已经没有用的东西","让坏的东西可以重新再使用"],"n":["这是“装饰”。","这是“找回”。","这是“回收再利用”。","✔ 修理：把坏了的东西修好，可以再用。"],"tip":""},{"id":"2023SNG-Q8","src":"2023 圣尼各拉 预考","qn":"Q8","k":"预考","t":"m","a":1,"s":"她的家搬到学校附近后，上学【节省】了很多时间。","o":["丢掉多余的","减少要用的","失去需要的","改变之前的"],"n":["这是“扔掉”。","✔ 节省：少用、不浪费（节省时间、节省用水）。","这是“失去”。","这是“改变”。"],"tip":""},{"id":"2023SNG-Q13","src":"2023 圣尼各拉 预考","qn":"Q13","k":"预考","t":"s","a":3,"s":"以下哪个句子是正确的？","o":["姐姐在国外【生存】了几年后，最近决定回国。","大火过后，这里的房子没有一间【生存】下来。","几年后，这颗种子已经【生存】成一棵小树了。","如果地球没有了水，我们就无法【生存】了。"],"n":["在国外住用“生活”。","房子用“保存／留”下来。","种子用“生长”。","✔ 生存：活下去（没有水就无法生存）。"],"tip":""},{"id":"2023SNG-Q14","src":"2023 圣尼各拉 预考","qn":"Q14","k":"预考","t":"s","a":0,"s":"以下哪个句子是正确的？","o":["这本书里的故事十分有趣，我读得【津津有味】。","妹妹的听写考了满分，妈妈【津津有味】地夸她。","一踏进外婆家，我就闻到【津津有味】的饭菜香。","这部电影很有趣，大家【津津有味】地笑了起来。"],"n":["✔ 读得津津有味：读得很有兴趣。","夸奖用“高兴地”。","饭菜香用“香喷喷”。","笑用“哈哈大笑”。"],"tip":""},{"id":"2023SNG-Q15","src":"2023 圣尼各拉 预考","qn":"Q15","k":"预考","t":"s","a":1,"s":"以下哪个句子是正确的？","o":["奶奶的病很【厉害】，爸爸立刻送她去医院诊治。","哥哥很【厉害】，每次都在游泳比赛中赢得冠军。","妈妈对我们十分【厉害】，因此我们都非常怕她。","姐姐是个【厉害】的孩子，常常帮助父母照顾我。"],"n":["病情用“严重”。","✔ 厉害：本领很大、了不起（哥哥很厉害）。","对孩子要求高用“严厉”。","帮忙照顾用“懂事”。"],"tip":""},{"id":"2023TN-Q5","src":"2023 道南 预考","qn":"Q5","k":"预考","t":"f","a":0,"s":"李阿姨看不懂英文，便请邻居帮忙把信件的内容____成华文。","o":["翻译","呈现","介绍","讨论"],"n":["✔ 翻译：把一种语言换成另一种语言（翻译成华文）。","呈现：展现出来。","介绍：让人认识。","讨论：一起商量。"],"tip":""},{"id":"2023TN-Q6","src":"2023 道南 预考","qn":"Q6","k":"预考","t":"f","a":3,"s":"国伟看书看得入迷，把妈妈的____忘得一干二净。","o":["请求","提问","盼望","吩咐"],"n":["请求：一般是下对上、请人帮忙。","提问：提出问题。","盼望：期待。","✔ 吩咐：长辈口头交代要做的事（妈妈的吩咐）。"],"tip":""},{"id":"2023TN-Q7","src":"2023 道南 预考","qn":"Q7","k":"预考","t":"m","a":2,"s":"医生说爷爷的病情越来越【糟糕】，全家人听了都很担心。","o":["没有办法继续","错过关键的时刻","事情或情况很坏","减少了生存的机会"],"n":["不是“没办法继续”。","不是“错过”。","✔ 糟糕：情况很坏、很差。","太具体了，糟糕只是“坏”。"],"tip":""},{"id":"2023TN-Q8","src":"2023 道南 预考","qn":"Q8","k":"预考","t":"m","a":3,"s":"经过一天的【搜索】，警方终于找到了在森林里迷路的学生。","o":["亲自访问","用心检查","认真思考","仔细寻找"],"n":["这是“访问”。","这是“检查”。","这是“思考”。","✔ 搜索：仔细地到处寻找。"],"tip":""},{"id":"2023TN-Q13","src":"2023 道南 预考","qn":"Q13","k":"预考","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["妹妹想到一个好【创意】，帮哥哥解决了难题。","要是你有任何【创意】，可以在会议上提出来。","这本书是作者的最新【创意】，很受读者喜爱。","林华的设计很有【创意】，老板看了十分满意。"],"n":["解决难题用“办法／主意”。","会议上提出“意见”。","作者的最新“作品”。","✔ 很有创意：有新奇、独特的想法。"],"tip":""},{"id":"2023TN-Q14","src":"2023 道南 预考","qn":"Q14","k":"预考","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["运动对健康【有限】，你应该多锻炼身体。","这瓶咳嗽药水【有限】，喝了病马上就好。","画画班的招生人数【有限】，我得赶快去报名。","小明讲的故事精彩【有限】，赢得观众热烈的掌声。"],"n":["运动对健康“有益”。","药水“有效”。","✔ 有限：数量不多、有限度（名额有限，要快报名）。","故事“精彩极了”。"],"tip":""},{"id":"2023TN-Q15","src":"2023 道南 预考","qn":"Q15","k":"预考","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["我们要【争夺】时间，在指定的日期完成报告。","伟雄想尽办法，要和弟弟【争夺】父亲的财产。","孩子们竟然为了这点小事而【争夺】，互不相让。","这是一个难得的机会，你们一定要努力【争夺】。"],"n":["时间、机会用“争取”。","✔ 争夺：互相抢（争夺财产）。","为小事吵架用“争吵”。","机会用“争取”。"],"tip":""},{"id":"2012PSLE-Q6","src":"2012 PSLE 真题","qn":"Q6","k":"PSLE","t":"f","a":2,"s":"弟弟走失了，姐姐____一点儿都不担心。","o":["未免","甚至","竟然","于是"],"n":["未免：实在是有点（未免太过分了），带批评的语气。","甚至：更进一步，常和“连……都”一起用。","✔ 竟然：没想到会这样（弟弟走失了，姐姐竟然不担心）。","于是：接着、因此，表示前后相接。"],"tip":""},{"id":"2012PSLE-Q9","src":"2012 PSLE 真题","qn":"Q9","k":"PSLE","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["他常对别人起【疑问】，没有人喜欢他。","他们之间互相【疑问】，一直无法合作。","同学们一有【疑问】，就会向老师请教。","警方【疑问】他偷东西，要他协助调查。"],"n":["对别人不信任用“起疑心”。","互相不信任用“猜疑／怀疑”。","✔ 疑问：不明白的问题（有疑问就请教老师）。是名词。","动词要用“怀疑”他偷东西。"],"tip":""},{"id":"2012PSLE-Q10","src":"2012 PSLE 真题","qn":"Q10","k":"PSLE","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["我们在【鸟语花香】的大自然中散步，心情十分愉快。","游客站在山上往下看，【鸟语花香】，景色十分迷人。","画中的花和小鸟跟真的一样，让人觉得【鸟语花香】。","在一个【鸟语花香】的早晨，我到植物园去拍照留念。"],"n":["✔ 鸟语花香：鸟在叫，花很香，形容大自然里美好的景色。","站在山上往下看，听不到鸟叫、闻不到花香。","画里的鸟不会叫，花也不会香。","鸟语花香形容的是“地方的景色”，不是形容“早晨”这个时间。"],"tip":""},{"id":"2013PSLE-Q5","src":"2013 PSLE 真题","qn":"Q5","k":"PSLE","t":"f","a":1,"s":"____以往的做法，我们都会先讨论，然后再采取行动。","o":["通过","按照","不管","对于"],"n":["通过：经过某种方法（通过讨论）。","✔ 按照：依照（按照以往的做法）。","不管：无论，常和“都”一起用，意思不对。","对于：引出对象（对于这件事……）。"],"tip":""},{"id":"2013PSLE-Q6","src":"2013 PSLE 真题","qn":"Q6","k":"PSLE","t":"f","a":2,"s":"卡卡打算____一支队伍，到邻国去爬山。","o":["准备","代表","组织","指挥"],"n":["准备：事先安排，“准备一支队伍”不常说。","代表：替大家出面。","✔ 组织：把人安排起来成为一个团体（组织一支队伍）。","指挥：发命令调动，要先有队伍。"],"tip":""},{"id":"2013PSLE-Q9","src":"2013 PSLE 真题","qn":"Q9","k":"PSLE","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["他说的话很有道理，大家都决定【支持】他。","如果没有药物的【支持】，他的病好不起来。","昨晚的一场大风雨，很多树都【支持】不了。","既然事情无法【支持】，还是找人来帮忙吧。"],"n":["✔ 支持：赞同并鼓励、帮助（支持他）。","药物的“帮助／治疗”。","树“抵挡”不了大风雨。","事情无法“处理／应付”。"],"tip":""},{"id":"2013PSLE-Q10","src":"2013 PSLE 真题","qn":"Q10","k":"PSLE","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["车辆【三五成群】地排起了长龙，交通十分拥挤。","人们【三五成群】地坐在草地上，观赏烟花表演。","精彩的表演结束后，观众【三五成群】地拍手叫好。","树上的花朵【三五成群】地开着，吸引了许多游客。"],"n":["三五成群形容人，不形容车。","✔ 三五成群：三个五个人聚在一起（三五成群地坐着）。","拍手叫好是大家一起，用“纷纷”。","花用“一簇簇”。"],"tip":""},{"id":"2014PSLE-Q5","src":"2014 PSLE 真题","qn":"Q5","k":"PSLE","t":"f","a":3,"s":"他遇到紧急的事情，都能够____地应付。","o":["诚恳","积极","灵活","从容"],"n":["诚恳：真心诚意，形容态度。","积极：主动、热心，多用于做事的态度。","灵活：反应快、会变通，但“紧急”时更强调不慌。","✔ 从容：不慌不忙、很镇定（从容地应付）。"],"tip":""},{"id":"2014PSLE-Q6","src":"2014 PSLE 真题","qn":"Q6","k":"PSLE","t":"f","a":0,"s":"他在台上表演时看起来很镇定，____他的心里十分紧张。","o":["其实","竟然","反而","几乎"],"n":["✔ 其实：说出真实情况（看起来镇定，其实很紧张）。","竟然：没想到。","反而：结果和预料相反，用在“不但不……反而……”。","几乎：差不多。"],"tip":""},{"id":"2014PSLE-Q9","src":"2014 PSLE 真题","qn":"Q9","k":"PSLE","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["他做事很有【起劲】，你要向他看齐。","我【起劲】地把门打开，还是开不了。","同学们有说有笑，玩得十分【起劲】。","你今天精神不【起劲】，可能生病了。"],"n":["做事有“干劲”。","用力开门用“使劲”。","✔ 起劲：情绪高、劲头大（玩得很起劲）。","精神不好用“没精神”。"],"tip":""},{"id":"2014PSLE-Q10","src":"2014 PSLE 真题","qn":"Q10","k":"PSLE","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["这次能出国学习又能旅游，真是【一举两得】。","叔叔又聪明又勤劳，因此工作时能【一举两得】。","妈妈会做菜和做蛋糕，时常让我们【一举两得】。","演员在台上边唱边跳，观众都认为【一举两得】。"],"n":["✔ 一举两得：做一件事，得到两种好处（学习加旅游）。","聪明勤劳是“能干”。","会做两样东西不是一举两得。","边唱边跳是“能歌善舞”。"],"tip":""},{"id":"2015PSLE-Q5","src":"2015 PSLE 真题","qn":"Q5","k":"PSLE","t":"f","a":3,"s":"你在大家的面前批评他，____太过分了。","o":["甚至","竟然","完全","未免"],"n":["甚至：更进一步。","竟然：没想到。","完全：全部。","✔ 未免：实在是有点（委婉地批评：未免太过分了）。"],"tip":""},{"id":"2015PSLE-Q6","src":"2015 PSLE 真题","qn":"Q6","k":"PSLE","t":"f","a":1,"s":"这些队员都很优秀，要从中____一名当队长可真不容易。","o":["安排","挑选","分配","培养"],"n":["安排：有条理地处理。","✔ 挑选：从中选出合适的（从中挑选一名）。","分配：分给大家。","培养：长期教导训练。"],"tip":""},{"id":"2015PSLE-Q9","src":"2015 PSLE 真题","qn":"Q9","k":"PSLE","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["妹妹的感情【敏锐】，对待朋友也十分真诚。","哥哥的动作【敏锐】，是学校羽球队的队长。","弟弟的头脑【敏锐】，很快就把难题解决了。","姐姐的口才【敏锐】，经常参加讲故事比赛。"],"n":["感情用“丰富／真挚”。","动作用“敏捷”。","✔ 敏锐：（头脑、眼光、感觉）反应快、灵敏。","口才用“很好／出众”。"],"tip":""},{"id":"2015PSLE-Q10","src":"2015 PSLE 真题","qn":"Q10","k":"PSLE","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["这件事不是他搞出来的，他【确定】要负责任。","电台的天气预报不【确定】，今天根本没下雨。","如果你能【确定】开会的时间，我一定赶回来。","只要你跟警方合作，我们会【确定】你的安全。"],"n":["前后意思矛盾，应是“不需要负责”。","预报“不准确”。","✔ 确定：明确地定下来（确定时间）。","安全用“保证”。"],"tip":""},{"id":"2016PSLE-Q5","src":"2016 PSLE 真题","qn":"Q5","k":"PSLE","t":"f","a":3,"s":"我们____了种种的困难，终于完成了小组作业。","o":["逃避","抵抗","改变","克服"],"n":["逃避：躲开不面对，和“终于完成”矛盾。","抵抗：用力量对抗敌人、疾病。","改变：使不同。","✔ 克服：战胜困难。“克服困难”是固定搭配。"],"tip":""},{"id":"2016PSLE-Q9","src":"2016 PSLE 真题","qn":"Q9","k":"PSLE","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["我和他是好朋友，经常【不约而同】地在一起。","那部电影很感人，小丽【不约而同】地流下眼泪。","在这个问题上，明辉的想法和我是【不约而同】的。","听了这个有趣的故事，我们【不约而同】地笑了起来。"],"n":["经常在一起用“形影不离”。","小丽只有一个人。","想法一样用“不谋而合”。","✔ 不约而同：没约好，却一起做同样的事（一起笑了起来）。"],"tip":""},{"id":"2016PSLE-Q10","src":"2016 PSLE 真题","qn":"Q10","k":"PSLE","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["看着照片，童年的事情又【浮现】在眼前。","一场大雨过后，天空【浮现】灿烂的阳光。","今天早上，我【浮现】了一件奇怪的事情。","为了得到老师的赞美，他常【浮现】自己。"],"n":["✔ 浮现：过去的事又出现在眼前、脑海里。","阳光用“出现”。","发现奇怪的事用“发现”。","表现自己用“表现”。"],"tip":""},{"id":"2017PSLE-Q5","src":"2017 PSLE 真题","qn":"Q5","k":"PSLE","t":"f","a":1,"s":"政府将开发新的旅游景点，____我国旅游业的发展。","o":["增加","推动","提高","扩大"],"n":["增加：数量变多。","✔ 推动：使事情向前发展（推动……的发展）。","提高：使水平变高。","扩大：使范围变大。"],"tip":""},{"id":"2017PSLE-Q6","src":"2017 PSLE 真题","qn":"Q6","k":"PSLE","t":"f","a":0,"s":"陈老师接受了同学们的____，会带他们去圣淘沙游玩。","o":["提议","通知","讨论","愿望"],"n":["✔ 提议：提出的意见（接受提议）。","通知：告诉别人的消息。","讨论：大家一起商量，不能被“接受”。","愿望：心里想的事，不说“接受愿望”。"],"tip":""},{"id":"2017PSLE-Q7","src":"2017 PSLE 真题","qn":"Q7","k":"PSLE","t":"m","a":2,"s":"校长在周会上【表扬】文聪，要同学们以他为榜样。","o":["大力支持","热情鼓励","公开称赞","真诚感激"],"n":["这是“支持”。","这是“鼓励”。","✔ 表扬：公开地称赞好人好事。","这是“感谢”。"],"tip":""},{"id":"2017PSLE-Q8","src":"2017 PSLE 真题","qn":"Q8","k":"PSLE","t":"m","a":0,"s":"妈妈对我们有很高的期望，所以要求很【严格】。","o":["认真，不放松","仔细，不随便","坚持，不放弃","积极，不马虎"],"n":["✔ 严格：认真遵守标准，一点也不放松。","这是“细心”。","这是“坚持”。","这是“积极”。"],"tip":""},{"id":"2017PSLE-Q13","src":"2017 PSLE 真题","qn":"Q13","k":"PSLE","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["我们的校长样子【和谐】，同学们都很喜欢他。","今天的天气很【和谐】，大家都到公园去散步。","同学们回到课室上课后，食堂恢复了【和谐】。","邻居之间最重要的是【和谐】相处，互相帮助。"],"n":["样子用“和蔼”。","天气用“晴朗”。","没人了用“安静”。","✔ 和谐相处：关系融洽，不争吵。"],"tip":""},{"id":"2017PSLE-Q14","src":"2017 PSLE 真题","qn":"Q14","k":"PSLE","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["华强【不管三七二十一】地去帮助他人，实在是有爱心。","妹妹掉进河里，姐姐【不管三七二十一】地跳下去救她。","哥哥很有耐心，经常【不管三七二十一】地排队买东西。","老师一说开始，大家就【不管三七二十一】地讨论起来。"],"n":["帮助他人用“热心地”。","✔ 不管三七二十一：什么都不顾、不考虑后果就去做（紧急时跳下去救人）。","有耐心排队，不是“不顾一切”。","讨论用“热烈地”。"],"tip":""},{"id":"2017PSLE-Q15","src":"2017 PSLE 真题","qn":"Q15","k":"PSLE","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["我们应该想清楚后才行动，不要【勉励】自己。","在遇到困难的时候，同学们应该互相【勉励】。","叔叔买了新的组屋，我们全家都去【勉励】他。","爸爸请我们吃大餐，【勉励】我们考到好成绩。"],"n":["不要逼自己用“勉强”。","✔ 勉励：劝人努力、鼓励（互相勉励）。","买新房子用“祝贺”。","考好后请吃饭是“奖励”。"],"tip":""},{"id":"2018PSLE-Q5","src":"2018 PSLE 真题","qn":"Q5","k":"PSLE","t":"f","a":0,"s":"文强知道自己错怪了学明，____地低下了头。","o":["惭愧","愤怒","委屈","失望"],"n":["✔ 惭愧：因为做错事而觉得不好意思（惭愧地低下头）。","愤怒：非常生气。","委屈：被错怪的人才委屈，是学明，不是文强。","失望：希望落空。"],"tip":""},{"id":"2018PSLE-Q6","src":"2018 PSLE 真题","qn":"Q6","k":"PSLE","t":"f","a":1,"s":"只要我们肯努力，就会有____。","o":["成功","收获","奉献","用处"],"n":["成功：一般说“就会成功”，不说“就会有成功”。","✔ 收获：得到的好结果（有收获）。","奉献：恭敬地献出。","用处：用途。"],"tip":""},{"id":"2018PSLE-Q7","src":"2018 PSLE 真题","qn":"Q7","k":"PSLE","t":"m","a":2,"s":"学校假期刚开始，爸爸就【催促】我做作业了。","o":["叫人认真去做事","叫人专心去做事","叫人赶快去做事","叫人尽力去做事"],"n":["这是“要求认真”。","这是“提醒专心”。","✔ 催促：叫人赶快去做。","这是“鼓励”。"],"tip":""},{"id":"2018PSLE-Q8","src":"2018 PSLE 真题","qn":"Q8","k":"PSLE","t":"m","a":0,"s":"台上的演出十分精彩，小朋友们都看得【入迷】了。","o":["有浓厚的兴趣","感到非常好奇","十分关心与支持","露出幸福的神情"],"n":["✔ 入迷：喜欢得被吸引住了、兴趣很浓。","这是“好奇”。","这是“关心支持”。","这是“幸福”。"],"tip":""},{"id":"2018PSLE-Q13","src":"2018 PSLE 真题","qn":"Q13","k":"PSLE","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["外公说了好几遍，要我们出门时【随便】把门关上。","只要你有空闲的时间，欢迎你【随便】到我们家玩。","志良非常懂事，他不会【随便】要父母买东西给他。","我国的交通十分发达，地铁站【随便】都可以看到。"],"n":["顺手关门用“随手”。","有空就来用“随时”。","✔ 随便：不加考虑、想怎样就怎样（不会随便要东西）。","到处可见用“随处”。"],"tip":""},{"id":"2018PSLE-Q14","src":"2018 PSLE 真题","qn":"Q14","k":"PSLE","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["新年期间，大家都【洋洋得意】地互相拜年。","他考到第一名，难怪一副【洋洋得意】的样子。","我们一家人到外国旅行，心情是【洋洋得意】的。","当小华跑到终点时，妈妈【洋洋得意】地为他庆祝。"],"n":["拜年用“喜气洋洋”。","✔ 洋洋得意：很得意的样子（考了第一很得意）。","旅行用“愉快”。","庆祝用“高兴地”。"],"tip":""},{"id":"2018PSLE-Q15","src":"2018 PSLE 真题","qn":"Q15","k":"PSLE","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["小美的学业进步了，因为她【千辛万苦】地复习。","班长【千辛万苦】地拉住丽文，不让她乱过马路。","由于年纪还小，家兴不知道工作是【千辛万苦】的。","经过【千辛万苦】，建筑工人终于把这座桥建好了。"],"n":["复习用“努力地”。","拉住人用“用力地”。","工作是“辛苦”的。","✔ 经过千辛万苦：经历了很多困难辛苦。"],"tip":""},{"id":"2019PSLE-Q5","src":"2019 PSLE 真题","qn":"Q5","k":"PSLE","t":"f","a":2,"s":"这首歌曲太优美了，让听众深深____。","o":["吸引","欣赏","陶醉","想象"],"n":["吸引：要说“被吸引住了”或“吸引了听众”。","欣赏：喜欢地听、看，要带宾语（欣赏歌曲）。","✔ 陶醉：沉醉在美好的事物里（让听众深深陶醉）。","想象：在脑子里想出画面。"],"tip":""},{"id":"2019PSLE-Q6","src":"2019 PSLE 真题","qn":"Q6","k":"PSLE","t":"f","a":0,"s":"爸爸妈妈希望我和哥哥努力读书，将来为社会做出____。","o":["贡献","作用","表扬","牺牲"],"n":["✔ 贡献：为社会、国家做出的有益的事（为社会做出贡献）。","作用：一般说“起作用”。","表扬：称赞。","牺牲：舍弃生命或利益，意思太重。"],"tip":""},{"id":"2019PSLE-Q7","src":"2019 PSLE 真题","qn":"Q7","k":"PSLE","t":"m","a":1,"s":"子明很【重视】家伟这个朋友，绝对不会为了一些小事而不理他。","o":["细心照顾","认真对待","非常爱护","十分关心"],"n":["这是“照顾”。","✔ 重视：认为很重要而认真对待。","这是“爱护”。","这是“关心”。"],"tip":""},{"id":"2019PSLE-Q8","src":"2019 PSLE 真题","qn":"Q8","k":"PSLE","t":"m","a":3,"s":"这个问题我一直想不通，听她这么一说，才【恍然大悟】。","o":["竟然清楚","果然接受","突然解决","忽然明白"],"n":["不对。","不对。","不对，是“明白”，不是“解决”。","✔ 恍然大悟：一下子完全明白。"],"tip":""},{"id":"2019PSLE-Q13","src":"2019 PSLE 真题","qn":"Q13","k":"PSLE","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["爸爸【左思右想】，最后才做出这个决定。","小清经常【左思右想】，不让别人打扰她。","他走在我的后面，【左思右想】地看风景。","姐姐喜欢猜谜语，因为可以【左思右想】。"],"n":["✔ 左思右想：反复地想（想了很久才做决定）。","不让人打扰是“专心”。","看风景用“东张西望”。","猜谜语可以“动脑筋”。"],"tip":""},{"id":"2019PSLE-Q14","src":"2019 PSLE 真题","qn":"Q14","k":"PSLE","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["跑了几圈后，同学们都喘得【垂头丧气】。","工人太累了，【垂头丧气】地在一旁休息。","被对手打败后，子明【垂头丧气】地离开球场。","弟弟和别人吵架时【垂头丧气】，令我很失望。"],"n":["喘气用“上气不接下气”。","累了用“疲倦地”。","✔ 垂头丧气：输了、失败后失望难过的样子。","吵架时用“气冲冲”。"],"tip":""},{"id":"2019PSLE-Q15","src":"2019 PSLE 真题","qn":"Q15","k":"PSLE","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["我常到公园运动，因为那里有清新的【气氛】。","在农历新年期间，到处充满了节日的【气氛】。","校园里的【气氛】很优美，非常适合同学们读书。","生日会的【气氛】五彩缤纷，大家都玩得很开心。"],"n":["清新的“空气”。","✔ 节日的气氛：一个地方让人感受到的情调。","环境优美用“环境”。","五彩缤纷形容“装饰／颜色”。"],"tip":""},{"id":"2020PSLE-Q5","src":"2020 PSLE 真题","qn":"Q5","k":"PSLE","t":"f","a":3,"s":"在公路上骑脚踏车，必须____交通规则。","o":["习惯","面对","体现","遵守"],"n":["习惯：常常这样做而成了自然。","面对：对着、面临。","体现：表现出某种精神。","✔ 遵守：按照规定去做（遵守交通规则）。"],"tip":""},{"id":"2020PSLE-Q6","src":"2020 PSLE 真题","qn":"Q6","k":"PSLE","t":"f","a":1,"s":"在光线____的地方看书，眼睛才不会受到伤害。","o":["丰富","充足","缤纷","阴凉"],"n":["丰富：种类多，形容内容、经验。","✔ 充足：足够（光线充足）。","缤纷：颜色多而乱（五彩缤纷）。","阴凉：没太阳、凉快，光线反而不够。"],"tip":""},{"id":"2020PSLE-Q7","src":"2020 PSLE 真题","qn":"Q7","k":"PSLE","t":"m","a":2,"s":"妹妹跌倒受伤了，我没把她照顾好，心里感到很【惭愧】。","o":["因自己的糊涂而感到伤心","因做错了事情而感到害怕","因对不起别人而感到不安","因没有尽全力而感到痛苦"],"n":["这是“后悔伤心”。","这是“害怕”。","✔ 惭愧：觉得自己没做好、对不起人而不好意思、不安。","这是“痛苦”。"],"tip":""},{"id":"2020PSLE-Q8","src":"2020 PSLE 真题","qn":"Q8","k":"PSLE","t":"m","a":1,"s":"看着三岁的弟弟【模仿】鸭子走路的样子，我们不禁哈哈大笑。","o":["学习解决事情的方法","按照相同的样子去做","回忆他人的语言和动作","配合对方的想法去完成"],"n":["不对。","✔ 模仿：照着样子去做。","这是“回忆”。","这是“配合”。"],"tip":""},{"id":"2020PSLE-Q13","src":"2020 PSLE 真题","qn":"Q13","k":"PSLE","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["姐姐【不慌不忙】地走上台，看来一点儿也不紧张。","妹妹【不慌不忙】地跳着舞，观众们觉得十分精彩。","妈妈【不慌不忙】地骂弟弟，弟弟心里特别不舒服。","阿姨【不慌不忙】地做事，老板称赞她很有责任感。"],"n":["✔ 不慌不忙：很镇定、不紧张。","跳舞用“优美地”。","骂人用“生气地”。","有责任感用“认真地”。"],"tip":""},{"id":"2020PSLE-Q14","src":"2020 PSLE 真题","qn":"Q14","k":"PSLE","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["婆婆的身体实在太弱了，【控制】不住自己的健康。","美雪不能【控制】手上的笔，所以写字的速度很快。","爸爸对哥哥一向都非常关心，因此很会【控制】他。","小明常常【控制】不了自己的脾气，谁都不喜欢他。"],"n":["健康用“保持”。","前后不通。","关心孩子是“照顾”。","✔ 控制脾气：管住自己，不让它乱发。"],"tip":""},{"id":"2020PSLE-Q15","src":"2020 PSLE 真题","qn":"Q15","k":"PSLE","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["现在已经很晚了，我们说话时别【提高】音量。","学校主办的学习之旅，【提高】了大家的友情。","考试就要到了，同学们积极地【提高】复习时间。","要吃有营养的食物，才可以【提高】自己的健康。"],"n":["✔ 提高：使水平、程度变高（提高音量）。","友情用“增进”。","时间用“增加”。","健康用“保持／增进”。"],"tip":""},{"id":"2021PSLE-Q5","src":"2021 PSLE 真题","qn":"Q5","k":"PSLE","t":"f","a":2,"s":"警察的责任是捉坏人，____居民的安全。","o":["注意","检查","保护","提高"],"n":["注意：留心。","检查：仔细查看。","✔ 保护：照顾使不受伤害（保护安全）。","提高：使变高。"],"tip":""},{"id":"2021PSLE-Q6","src":"2021 PSLE 真题","qn":"Q6","k":"PSLE","t":"f","a":1,"s":"听了美英的____，大家终于清楚了事情发生的原因。","o":["讨论","解释","提问","聊天"],"n":["讨论：大家一起商量，不是一个人的。","✔ 解释：说明原因（听了解释，清楚了原因）。","提问：问问题，听了问题不会清楚原因。","聊天：随便谈天。"],"tip":""},{"id":"2021PSLE-Q7","src":"2021 PSLE 真题","qn":"Q7","k":"PSLE","t":"m","a":3,"s":"小明突然病了，我们只好【临时】找人代替他参加比赛。","o":["最后一分钟改变了想法","在没有选择的情况之下","不得不做出决定的时候","事情发生之前的那一刻"],"n":["不是改变想法。","这是“只好”。","这是“不得不”。","✔ 临时：临到事情快发生的时候。"],"tip":""},{"id":"2021PSLE-Q8","src":"2021 PSLE 真题","qn":"Q8","k":"PSLE","t":"m","a":0,"s":"每当我遇到数学难题，想【放弃】时，奶奶都会给我加油打气。","o":["不再坚持下去","没有认真地面对","决定做其他的事情","短时间内不想再尝试"],"n":["✔ 放弃：不再坚持。","这是“马虎”。","这是“改做别的”。","这是“暂停”。"],"tip":""},{"id":"2021PSLE-Q13","src":"2021 PSLE 真题","qn":"Q13","k":"PSLE","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["老师在讲课时，你们不可以【异口同声】地说话。","小强做事细心，大家【异口同声】地选他当班长。","我们【异口同声】地讨论，今天要去哪里看电影。","合唱团在台上【异口同声】地唱歌，表演很成功。"],"n":["上课说话用“七嘴八舌”。","✔ 异口同声：大家一起说出同样的话（一起喊出他的名字）。","讨论是各说各的。","唱歌用“齐声”。"],"tip":""},{"id":"2021PSLE-Q14","src":"2021 PSLE 真题","qn":"Q14","k":"PSLE","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["我们必须很【能干】，才可以一起做小组作业。","爸爸真是【能干】，果然在一小时内登上山顶。","丽丽是个【能干】的女孩，什么事情都难不倒她。","俊明非常【能干】，每年参加漫画比赛都得冠军。"],"n":["做小组作业要“合作”。","登山用“厉害／体力好”。","✔ 能干：有能力、会做事（什么事都难不倒她）。","画漫画是“有天分／有才华”。"],"tip":""},{"id":"2021PSLE-Q15","src":"2021 PSLE 真题","qn":"Q15","k":"PSLE","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["校长的目光非常【严格】，同学们都静了下来。","外公的表情好【严格】，好像发生了什么事情。","妈妈的要求特别【严格】，我们一定要用功读书。","王老师的样子十分【严格】，大家都有点儿怕他。"],"n":["目光用“严厉”。","表情用“严肃”。","✔ 严格的要求：标准高、不放松。","样子用“严肃”。"],"tip":""},{"id":"2022PSLE-Q5","src":"2022 PSLE 真题","qn":"Q5","k":"PSLE","t":"f","a":1,"s":"如果不是奶奶的____，我可能早就放弃了。","o":["贡献","支持","失望","细心"],"n":["贡献：为大家做的有益的事。","✔ 支持：鼓励和帮助（因为有支持才没放弃）。","失望：希望落空，不会帮人坚持。","细心：用心仔细。"],"tip":""},{"id":"2022PSLE-Q6","src":"2022 PSLE 真题","qn":"Q6","k":"PSLE","t":"f","a":0,"s":"经过多次的____，老师们终于选出了得奖的作品。","o":["讨论","记录","安排","见证"],"n":["✔ 讨论：一起商量（经过多次讨论，选出作品）。","记录：写下来。","安排：有条理地处理。","见证：亲眼看到可以证明。"],"tip":""},{"id":"2022PSLE-Q7","src":"2022 PSLE 真题","qn":"Q7","k":"PSLE","t":"m","a":3,"s":"小男孩躺在床上，【舒服】地睡着了。","o":["身体和精神都很不好，没有力气","身体和精神都很健康，没有问题","身体和精神都很劳累，感到疲倦","身体和精神都很放松，感到愉快"],"n":["意思相反。","这是“健康”。","这是“劳累”。","✔ 舒服：身体和精神都很放松、愉快。"],"tip":""},{"id":"2022PSLE-Q8","src":"2022 PSLE 真题","qn":"Q8","k":"PSLE","t":"m","a":2,"s":"在【关键】时刻，张山踢进一球，让我校足球队反败为胜。","o":["让任务十分顺利地完成","使结果出现意外的变化","对事情起着决定的作用","令比赛有一连串的惊喜"],"n":["不对。","这是“转折”。","✔ 关键：起决定作用的、最重要的。","不对。"],"tip":""},{"id":"2022PSLE-Q13","src":"2022 PSLE 真题","qn":"Q13","k":"PSLE","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["哥哥取得【精彩】的成绩，我们都为他感到骄傲。","洁丽的演讲十分【精彩】，获得观众热烈的掌声。","这幅画的颜色很【精彩】，吸引路人停下来观看。","他们正【精彩】地讨论着，你现在别过去打招呼。"],"n":["成绩用“优秀／优异”。","✔ 精彩：表演、演讲很出色、吸引人。","颜色用“鲜艳”。","讨论用“热烈”。"],"tip":""},{"id":"2022PSLE-Q14","src":"2022 PSLE 真题","qn":"Q14","k":"PSLE","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["这题太【难为情】，弟弟完全不知道怎么做。","这件事很【难为情】，对小学生来说不容易。","妹妹请求爷爷买玩具，爷爷感到【难为情】。","同学们把我说得太好了，真让我【难为情】。"],"n":["题目难用“难”。","事情不容易用“困难”。","爷爷不知道怎么办是“为难”。","✔ 难为情：害羞、不好意思（被夸得太好了）。"],"tip":""},{"id":"2022PSLE-Q15","src":"2022 PSLE 真题","qn":"Q15","k":"PSLE","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["小晶假装在看书，好让别人不【疑问】她。","经过警方不断地【疑问】，小偷终于认罪了。","如果你们有【疑问】，可以到办公室去找老师。","林伯伯很热心，经常【疑问】我们是否需要帮忙。"],"n":["不让人怀疑，用“怀疑”。","警察问话用“审问”。","✔ 有疑问：有不明白的问题。是名词。","问我们用“询问”。"],"tip":""},{"id":"2023PSLE-Q5","src":"2023 PSLE 真题","qn":"Q5","k":"PSLE","t":"f","a":0,"s":"你不要再____了，赶快想办法解决这个问题吧！","o":["抱怨","劝告","控制","选择"],"n":["✔ 抱怨：说出心里的不满、发牢骚。光抱怨没用，要想办法。","劝告：劝人改正，后面要接人。","控制：管住，要接对象。","选择：挑选，要接对象。"],"tip":""},{"id":"2023PSLE-Q6","src":"2023 PSLE 真题","qn":"Q6","k":"PSLE","t":"f","a":1,"s":"美芳的钢琴弹得很好，丽云有些____她。","o":["拒绝","妒忌","嘲笑","对抗"],"n":["拒绝：不接受。","✔ 妒忌：别人比自己好，心里不服（弹得好→妒忌）。","嘲笑：取笑别人的缺点，弹得好不会被嘲笑。","对抗：互相作对。"],"tip":""},{"id":"2023PSLE-Q7","src":"2023 PSLE 真题","qn":"Q7","k":"PSLE","t":"m","a":0,"s":"大家都同意这么做，那就【一言为定】，我们明天就行动。","o":["说过的话不再改变","答应的事要马上去做","讨论的结果让人很满意","计划好的事不能半途而废"],"n":["✔ 一言为定：说好了，不再改变。","不是“马上去做”。","不是“满意”。","这是“坚持”。"],"tip":""},{"id":"2023PSLE-Q8","src":"2023 PSLE 真题","qn":"Q8","k":"PSLE","t":"m","a":2,"s":"遇到困难就【退缩】的人，不值得我们学习。","o":["因为着急而停下脚步","因为难过而想要放弃","因为害怕而不敢向前","因为生气而没有继续"],"n":["不是着急。","不是难过。","✔ 退缩：因为害怕而往后退、不敢向前。","不是生气。"],"tip":""},{"id":"2023PSLE-Q13","src":"2023 PSLE 真题","qn":"Q13","k":"PSLE","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["没有人需要为这起车祸负责，它只是个【灾害】。","邻居之间经常打招呼，可以避免【灾害】的发生。","这场【灾害】造成的破坏非常大，很多房屋都倒了。","为了不要成为家人的【灾害】，华强决定改过自新。"],"n":["车祸是“意外”。","邻居之间避免“误会／冲突”。","✔ 灾害：自然或人为造成的大祸（地震、水灾）。","成为家人的“负担／麻烦”。"],"tip":""},{"id":"2023PSLE-Q14","src":"2023 PSLE 真题","qn":"Q14","k":"PSLE","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["旅行能够让我们【恍然大悟】，看到很不一样的事物。","他的解释让我【恍然大悟】，原来事情是这样发生的。","为了让迟到的同学【恍然大悟】，校长劝他们要早起。","张老师的出现让小美【恍然大悟】，她忘了完成作业。"],"n":["旅行让我们“大开眼界”。","✔ 恍然大悟：一下子明白（原来是这样）。","劝告是让人“改正”。","突然想起用“猛然想起”。"],"tip":""},{"id":"2023PSLE-Q15","src":"2023 PSLE 真题","qn":"Q15","k":"PSLE","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["他最喜欢【神机妙算】，数学成绩总是全班最好。","小月可以【神机妙算】，什么东西都能一学就会。","爸爸经过【神机妙算】，发现弟弟可以吃得更多。","叔叔真是【神机妙算】，小偷果然躲在这间房里。"],"n":["数学好是“算得快”，不是神机妙算。","一学就会是“聪明”。","不对。","✔ 神机妙算：计谋高明，能准确预料事情（果然猜中小偷在哪）。"],"tip":""},{"id":"EOY-Q5","src":"2026 小五 EOY 考卷","qn":"Q5","k":"EOY","t":"f","a":3,"s":"看到这张照片，许多过去的情景又____在我脑海中。","o":["推开","表示","保持","浮现"],"n":["推开：用手推使离开。","表示：用话或动作让人知道。","保持：维持原样。","✔ 浮现：过去的事又出现在脑海里。“浮现在脑海中”是固定搭配。"],"tip":""},{"id":"EOY-Q6","src":"2026 小五 EOY 考卷","qn":"Q6","k":"EOY","t":"f","a":2,"s":"他年纪不大，但他在比赛中出色的表现让我十分____。","o":["自豪","紧张","佩服","配合"],"n":["自豪：为自己或自己人感到光荣。他不是“我”自己。","紧张：不安。","✔ 佩服：觉得别人了不起（让我十分佩服）。","配合：一起合作。"],"tip":""},{"id":"EOY-Q7","src":"2026 小五 EOY 考卷","qn":"Q7","k":"EOY","t":"m","a":3,"s":"在国外工作的父亲突然回来，全家人都【喜出望外】。","o":["遇到非常喜欢的事，向窗子外面看","遇到需要出门的事，露出欢快的表情","遇到意想不到的好事，激动得哭出来","遇到出乎意料的好事，感到特别高兴"],"n":["“望外”不是向外看，是“超出希望”。","不对。","“哭出来”不一定。","✔ 喜出望外：遇到没想到的好事，特别高兴。"],"tip":""},{"id":"EOY-Q8","src":"2026 小五 EOY 考卷","qn":"Q8","k":"EOY","t":"m","a":0,"s":"散步时，我【无意间】看到了一只躲在树洞里的小猫。","o":["不是事先想好的","忽然明白一件事","不好意思看到的","表示很短的时间"],"n":["✔ 无意间：不是故意的，没有事先想好。","这是“恍然大悟”。","“无意”不是“不好意思”！看到“意”字别马上想到“意思”。","这是“一瞬间”。"],"tip":"📝 小五 EOY 原题：当时选了(3)"},{"id":"EOY-Q13","src":"2026 小五 EOY 考卷","qn":"Q13","k":"EOY","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["我们要好好【珍惜】公物，不应该破坏它们。","时间是十分【珍惜】的，我们必须好好利用。","看到心爱的花盆被打破，她觉得很【珍惜】。","真心的友谊非常难得，我们要学会【珍惜】。"],"n":["公物用“爱护”。","时间是“宝贵”的。","打破了觉得“可惜”。","✔ 珍惜：好好爱惜、看重（珍惜友谊）。"],"tip":""},{"id":"EOY-Q14","src":"2026 小五 EOY 考卷","qn":"Q14","k":"EOY","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["请大家赶快上车，火车【大概】就要开了。","早上下了大雨，许多人上学【大概】迟到。","小红今天没来上学，有【大概】是生病了。","从家里走到学校，【大概】需要半个小时。"],"n":["火车“马上”就要开了。","“大概”放错位置，应说“大概都迟到了”。","“有大概”不通，应说“可能是”。","✔ 大概：差不多、估计的数量（大概半个小时）。"],"tip":""},{"id":"EOY-Q15","src":"2026 小五 EOY 考卷","qn":"Q15","k":"EOY","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["这个【节省】的新加坡常常下雨。","他把【节省】下来的钱都捐给了孤儿院。","新年的表演【节省】中，我们最喜欢舞狮。","虽然他很有钱，可还是过着【节省】的生活。"],"n":["不通，应是“节日／季节”之类。","✔ 节省：少用（动词），后面接钱、时间、水：节省下来的钱。","“节目”中。","形容生活不浪费要用“节俭”：过着节俭的生活。"],"tip":"📝 小五 EOY 原题：当时选了(4)。节省（动词：节省时间）≠ 节俭（形容生活）"},{"id":"P5-练1","src":"P5 练习卷","qn":"练1","k":"练习卷","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["小文的脸上长了几颗青春痘，令她十分【烦恼】。","弟弟总是自己的事情自己做，不喜欢【烦恼】别人。","【烦恼】你再多等一下，我保证很快完成这项工作。","阴沉沉的天气让他心情【烦恼】，整个人无精打采的。"],"n":["✔ 烦恼：心里烦、发愁（令她很烦恼）。","给别人添事用“麻烦别人”。烦恼不能带“别人”。","请人等一下用“麻烦你”。","心情不好用“烦躁”。"],"tip":""},{"id":"P5-练2","src":"P5 练习卷","qn":"练2","k":"练习卷","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["华文测验快到了，我每天都【恢复】到半夜。","我一收到林老师的邮件，就赶紧【恢复】她。","经过半年的努力，哥哥终于【恢复】了自信。","他改掉了坏习惯，不再【恢复】同样的行为。"],"n":["读书用“复习”。","回邮件用“回复”。","✔ 恢复：变回原来的样子（恢复自信）。","做同样的事用“重复”。"],"tip":""},{"id":"P5-练3","src":"P5 练习卷","qn":"练3","k":"练习卷","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["爸爸【保持】我参加比赛，我决定不让他失望。","管理员提醒我，在图书馆里必须【保持】安静。","老师指定我做班长，负责【保持】班上的秩序。","哥哥每天【保持】写作，作文成绩进步了许多。"],"n":["赞成我用“支持”。","✔ 保持安静：让安静的状态继续下去。","管秩序用“维持”。","每天做用“坚持”。"],"tip":""},{"id":"P5-练4","src":"P5 练习卷","qn":"练4","k":"练习卷","t":"s","a":0,"s":"以下哪个句子是正确的？","o":["我【积极】帮助妈妈做家务，不需要她提醒。","表演结束后，舞台下不时传出【积极】的掌声。","看到收拾好的房间又乱了，妈妈顿时【积极】了。","她对这份工作充满了【积极】，是她一直以来的梦想。"],"n":["✔ 积极：主动去做（积极帮忙，不用人提醒）。","掌声用“热烈”。","妈妈“生气”了。","充满了“热情”。"],"tip":""},{"id":"P5-练5","src":"P5 练习卷","qn":"练5","k":"练习卷","t":"s","a":1,"s":"以下哪个句子是正确的？","o":["他的举止很【怀疑】，我们应该多加注意。","这礼物真的是送给你的，你不必【怀疑】。","请【怀疑】我，我一定会尽力完成这项任务。","针对这起意外，警察查问了三个【怀疑】的人。"],"n":["举止奇怪用“可疑”。","✔ 怀疑：不太相信（不必怀疑）。","意思相反，用“相信”。","嫌疑人用“可疑的人”。"],"tip":""},{"id":"P5-练6","src":"P5 练习卷","qn":"练6","k":"练习卷","t":"s","a":1,"s":"以下哪个句子是正确的？","o":["听到爆炸声，人群顿时【恍然大悟】，开始逃跑。","听了我的解释，他才【恍然大悟】，知道错怪妹妹了。","这道数学题的解法，我【恍然大悟】，决定去请教老师。","穿过那条小路后，眼前【恍然大悟】，一片大海在我面前。"],"n":["人群“惊慌失措”。","✔ 恍然大悟：一下子明白（知道错怪了妹妹）。","还要去请教，说明“感到疑惑”。","眼前一下子开阔用“豁然开朗”。"],"tip":""},{"id":"P5-练7","src":"P5 练习卷","qn":"练7","k":"练习卷","t":"s","a":3,"s":"以下哪个句子是正确的？","o":["新年要到了，同学们一起把课室【制造】得非常干净。","妈妈知道他今晚会回来，特别【制造】了美味的晚餐。","今天的功课好难，我们要用学会的字【制造】一个句子。","为了节省力气，我想【制造】一个会做家务的机器人。"],"n":["打扫课室用“打扫”。","做饭用“准备／做”。","写句子用“造句”。","✔ 制造：用机器或技术做出东西（制造机器人）。"],"tip":""},{"id":"P5-练8","src":"P5 练习卷","qn":"练8","k":"练习卷","t":"s","a":1,"s":"以下哪个句子是正确的？","o":["爸爸忙了半天，才把不见的书本【恢复】了。","奶奶在家休养了两天，终于【恢复】了健康。","弟弟很懂事，他会把玩具【恢复】到柜子里。","姐姐读了同学写的电邮后，立刻【恢复】她。"],"n":["找回东西用“找到”。","✔ 恢复健康：变回原来健康的样子。","放回原处用“放回”。","回电邮用“回复”。"],"tip":""},{"id":"P5-练9","src":"P5 练习卷","qn":"练9","k":"练习卷","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["我和小松从小就认识，【培育】了很深厚的友情。","奶奶很好学，最近又报名参加了电脑【培育】班。","老师要我从小【培育】好习惯，成为一个有用的人。","父母辛勤地【培育】我们，我们长大后要记得报恩。"],"n":["友情、习惯用“培养”。","学电脑的班叫“培训班”。","习惯用“培养”。","✔ 培育：用心养育人或植物，让他们长大（培育孩子、培育花苗）。"],"tip":""},{"id":"P5-练10","src":"P5 练习卷","qn":"练10","k":"练习卷","t":"s","a":2,"s":"以下哪一个句子是正确的？","o":["才过了几天，妹妹种的绿豆就【产生】了豆芽。","一场大雨后，天空中【产生】了一道美丽的彩虹。","听了王老师讲的故事，文文对历史【产生】了兴趣。","老师提出了一个问题，【产生】了同学们积极的讨论。"],"n":["豆芽是“长出”来的。","彩虹是“出现”。","✔ 产生兴趣：心里出现了新的兴趣、想法。","“引起”了讨论。"],"tip":""},{"id":"P5-练11","src":"P5 练习卷","qn":"练11","k":"练习卷","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["能代表学校为学校争光，小乐感到十分【自豪】。","小美是一个【自豪】的人，经常看不起我们。","哥哥演讲时总是充满【自豪】，从来不会紧张。","立明什么都没准备就上台表演，太【自豪】了。"],"n":["✔ 自豪：为自己或集体的成绩感到光荣（为校争光很自豪）。是褒义。","看不起人用“骄傲”（贬义）。","不紧张用“自信”。","没准备就上台是“太大意／太自大”。"],"tip":""},{"id":"P5-练12","src":"P5 练习卷","qn":"练12","k":"练习卷","t":"s","a":1,"s":"以下哪一个句子是正确的？","o":["奶奶给我穿上外套后，感觉【温柔】多了。","阿姨看到姐姐很难过，就【温柔】地安慰她。","这个饭盒能【温柔】，到了中午饭菜还是热的。","最近几天的【温柔】上升，大家都待在冷气房里。"],"n":["身体暖用“温暖”。","✔ 温柔地：说话做事轻柔、体贴。","饭盒能“保温”。","天气用“温度”。"],"tip":""},{"id":"P5-练13","src":"P5 练习卷","qn":"练13","k":"练习卷","t":"s","a":3,"s":"以下哪一个句子是正确的？","o":["他学习很努力，成绩【到底】很优秀。","平板电脑很贵，【到底】是非常好用。","天气太热了，【到底】树下阴凉许多。","没有人知道天上【到底】有多少星星。"],"n":["成绩“一直”很优秀。","贵，“但是”好用。","“还是”树下阴凉。","✔ 到底：用在问句里，追问究竟（到底有多少）。"],"tip":""},{"id":"P5-练14","src":"P5 练习卷","qn":"练14","k":"练习卷","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["分好组后，我们【七嘴八舌】地开始讨论。","放学后，我和姐姐【七嘴八舌】地走回家。","小丽在演讲时，同学们【七嘴八舌】地听。","升旗礼时，同学们【七嘴八舌】地唱国歌。"],"n":["✔ 七嘴八舌：很多人一起抢着说话（讨论时）。","只有两个人，说“有说有笑”。","听的时候不说话，用“专心地”。","唱国歌要整齐，用“齐声”。"],"tip":""},{"id":"P5-练15","src":"P5 练习卷","qn":"练15","k":"练习卷","t":"s","a":0,"s":"以下哪一个句子是正确的？","o":["妈妈一直和她以前的同学保持【联系】。","我用绳子把所有的珠子【联系】在一起。","他们前几天吵架，【联系】越来越差了。","朋友之间好好【联系】，共同解决问题。"],"n":["✔ 保持联系：和人一直有来往、有沟通。","用绳子“串／连”在一起。","关系变差用“关系”。","共同解决问题用“合作”。"],"tip":""},{"id":"P5-练16","src":"P5 练习卷","qn":"练16","k":"练习卷","t":"s","a":1,"s":"以下哪个句子是正确的？","o":["可乐又甜又好喝，是我最喜欢喝的【材料】之一。","做这道菜时，苦瓜和鸡蛋都是最基本的【材料】。","胡椒粉是一种【材料】，它可以增添食物的味道。","这部电影的【材料】很多，大家看了都哈哈大笑。"],"n":["喝的东西叫“饮料”。","✔ 材料：做东西要用的原料（做菜的材料）。","加味道的叫“调料”。","让人笑的叫“笑料”。"],"tip":""},{"id":"P5-练17","src":"P5 练习卷","qn":"练17","k":"练习卷","t":"s","a":2,"s":"以下哪个句子是正确的？","o":["交通意外发生后，现场来了很多的【记录】。","小时候的事情，姐姐现在都还能【记录】起来。","老师要我们把他课上讲的内容全都【记录】下来。","每次读自己过去写的【记录】，我都会忍不住笑出来。"],"n":["人是“记者”。","想起来用“记起来”。","✔ 记录下来：把听到、看到的写下来。","自己每天写的叫“日记”。"],"tip":""},{"id":"P5-练18","src":"P5 练习卷","qn":"练18","k":"练习卷","t":"s","a":2,"s":"以下哪个句子是正确的？","o":["做事情要有【自豪】，才能
