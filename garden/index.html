，她就发出“咯咯咯”的笑声。突然，她一个没站稳，失去了平衡，“砰”的一声从秋千上跌落。小美的膝盖擦破了皮，露出了一小块红红的伤口，冒出了几滴鲜红的血珠。“哇”的一声，小美放声大哭起来，眼泪像断了线的珍珠一样掉了下来。", "小丽一听见小美的哭声，心里一惊，暗叫“不好”。她回过头，只见小美哭得像个泪人。小丽连忙三步并作两步地冲了过去，赶快掏出纸巾，递给小美，然后心疼地安慰道：“没事，姐姐在这儿，别怕。”这时，旁边的叔叔阿姨们都围了上来，七嘴八舌地说：“你怎么了？”“你的爸爸妈妈呢？”"]}, {"pic": "4", "text": ["小丽一拍脑门，心想：对了！我可以找爸爸帮忙啊！她马上拿出手机，拨通爸爸的电话，然后心急如焚地对爸爸说：“爸爸，爸爸！快来呀！小美膝盖擦破了，还流了血呢！”电话在另一头，爸爸大惊失色，急得一时手足无措，心口狂跳。他定了定神，拿起急救箱，然后大步流星地赶到了游乐场，小心翼翼地把小美的伤消了毒，止了血。他说：“我们回家吧。下次小心一点。”妹妹的哭声渐渐变小。她低下头，羞愧地说：“对不起，爸爸、姐姐。我以后再也不会做危险的动作了。”"]}, {"pic": "end", "text": ["俗话说：“吃一堑，长一智。”经过这件事，小美心里暗暗发誓：以后无论玩什么游戏，都要注意安全，不能因为好玩而做危险的动作。"]}]}}, "detective": [{"w": "洗漱完毕", "t": "漱", "opts": ["漱", "嗽", "束"], "ctx": "小丽姐姐和小美妹妹早早地起床，飞快地洗□完毕，然后兴高采烈地跑到了家附近的游乐场玩", "why": "“洗漱”的“漱”是三点水旁，用水漱口。“嗽”是咳嗽（口字旁）。", "hint": "用水漱口 → 三点水"}, {"w": "尽情地玩耍", "t": "耍", "opts": ["耍", "要", "耎"], "ctx": "姐妹俩一有空，就会来这里尽情地玩□", "why": "“玩耍”的“耍”上面是“而”，下面是“女”。“要”上面是“西”，下面是“女”——两个字只差上面！", "hint": "上面是“而”，不是“西”"}, {"w": "玩得不亦乐乎", "t": "乎", "opts": ["乎", "呼", "平"], "ctx": "等她们到游乐场的时候，发现已经有很多孩子和家长玩得不亦乐□了，游乐场里洋溢着一片欢声笑语", "why": "“不亦乐乎”的“乎”是古文里的语气词，上面一撇加三点，下面像“于”。“呼”是呼吸（口字旁），“平”是平地。", "hint": "一撇加点点，不是口字旁"}, {"w": "迈开步子", "t": "迈", "opts": ["迈", "万", "迅"], "ctx": "可是她还没有□开步子，就被姐姐一把拉住了", "why": "“迈开大步”的“迈”是走之旁加“万”，意思是抬腿走。“迅”是迅速。", "hint": "走路 → 走之旁"}, {"w": "摔跤", "t": "摔", "opts": ["摔", "率", "蟀"], "ctx": "我也不会像小明一样□跤的", "why": "“摔跤”的“摔”是提手旁加“率”。“率”是效率、率领，“蟀”是蟋蟀（虫字旁）。", "hint": "提手旁＋率"}, {"w": "摔跤", "t": "跤", "opts": ["跤", "交", "校"], "ctx": "我也不会像小明一样摔□的", "why": "“摔跤”的“跤”是足字旁，脚一滑摔倒。“交”是交朋友，“校”是学校。", "hint": "脚滑 → 足字旁"}, {"w": "隔壁邻居", "t": "隔", "opts": ["隔", "融", "膈"], "ctx": "前两天□壁邻居的小安就是站在秋千架上荡秋千才摔伤膝盖的", "why": "“隔壁”的“隔”是左耳旁，隔开。“融”是融化，“膈”是身体里的横膈膜。", "hint": "左耳旁"}, {"w": "隔壁邻居", "t": "壁", "opts": ["壁", "璧", "避"], "ctx": "前两天隔□邻居的小安就是站在秋千架上荡秋千才摔伤膝盖的", "why": "“隔壁”的“壁”下面是“土”，墙壁是土做的。“璧”下面是“玉”（宝玉），“避”是躲避（走之旁）。", "hint": "墙是土做的 → 土字底"}, {"w": "羡慕", "t": "羡", "opts": ["羡", "美", "涎"], "ctx": "小美□慕极了", "why": "“羡慕”的“羡”上面是“羊”，下面是“次”的变形（像流口水）。“美”下面是“大”。", "hint": "羊＋次"}, {"w": "羡慕", "t": "慕", "opts": ["慕", "幕", "暮"], "ctx": "小美羡□极了", "why": "“羡慕”的“慕”下面是“小”加一点（心的变形）。“幕”下面是“巾”，“暮”下面是“日”。", "hint": "下面是小＋点（心）"}], "audio": {"basic": {"src": "audio/swing-fall_basic.mp3", "cues": [["swing-fall|basic|start|0", 0.0], ["swing-fall|basic|1|0", 17.47], ["swing-fall|basic|2|0", 39.64], ["swing-fall|basic|3|0", 57.74], ["swing-fall|basic|3|1", 68.0], ["swing-fall|basic|4|0", 85.6], ["swing-fall|basic|end|0", 107.91]]}, "adv": {"src": "audio/swing-fall_adv.mp3", "cues": [["swing-fall|adv|start|0", 0.0], ["swing-fall|adv|start|1", 20.79], ["swing-fall|adv|1|0", 44.91], ["swing-fall|adv|1|1", 74.86], ["swing-fall|adv|2|0", 92.25], ["swing-fall|adv|3|0", 121.87], ["swing-fall|adv|3|1", 168.39], ["swing-fall|adv|4|0", 182.22], ["swing-fall|adv|4|1", 219.13], ["swing-fall|adv|4|2", 233.21], ["swing-fall|adv|end|0", 245.44], ["swing-fall|adv|end|1", 264.6]]}, "qx": {"src": "audio/swing-fall_qx.mp3", "cues": [["swing-fall|qx|start|0", 0.05], ["swing-fall|qx|1|0", 30.39], ["swing-fall|qx|2|0", 79.86], ["swing-fall|qx|3|0", 125.01], ["swing-fall|qx|3|1", 159.93], ["swing-fall|qx|4|0", 184.78], ["swing-fall|qx|end|0", 229.15]]}}}, {"id": "phone-stairs", "title": "边走路边看手机，从台阶上跌倒", "cat": "whoops", "grade": "P4", "pics": 4, "date": "2025-07-08", "source": "蔡老师课件", "imgs": ["img/H04_phone_1.jpg", "img/H04_phone_2.jpg", "img/H04_phone_3.jpg", "img/H04_phone_4.jpg"], "vocab": ["路上", "低头", "玩电话", "没注意", "梯级", "滚下来", "扶住", "受轻伤", "吓一跳", "教训"], "drafts": ["img/draft_20250714_210921.jpg", "img/draft_20250714_210934.jpg", "img/draft_20250714_210958.jpg", "img/draft_20250714_211007.jpg"], "versions": {"basic": {"label": "范文 · 基础版", "words": "560", "info": "考场高分作文版本（第一人称）", "segments": [{"pic": "1", "note": "图一：边走边玩手机，想抄近路走台阶", "text": ["那是一个阳光明媚的星期六早晨，我像往常一样，拿出手机玩游戏，一边[[目不转睛]]地玩游戏，一边向小贩中心的方向慢悠悠地走去。我想抄近道，走上梯级，再向前走一百米，就能看到小贩中心了。", "不料，我一边两眼直勾勾地玩手机游戏，一边[[漫不经心]]地走着，完全没有注意脚下的台阶。"]}, {"pic": "2", "note": "图二：踩空摔倒", "text": ["突然，我没站稳在台阶上，踩了个空，整个人向后摔了下去！“啊——”我惊叫一声，手机也从手中飞了出去。等我反应过来时，我已经重重地摔在楼梯下，手臂和屁股疼痛感袭来，[[一阵钻心的疼]]，让我的眼泪顺着脸颊流下来。"]}, {"pic": "3", "note": "图三：叔叔扶住头；马来女生捡手机", "text": ["旁边的一个叔叔看到我狼狈的样子，[[以迅雷不及掩耳之势]]，跑到我身边，扶住我的头，关切地问我：“小弟弟，你还好吗？哪里痛？”我低着头不敢说话，心里又委屈又后悔。走在台阶上方的一个穿马来服装的女生，年纪和我相仿，听到声音，立刻跑下来，捡起我的手机还给我。我抬头看了她一眼，她的眼神中没有责备，只有关心。"]}, {"pic": "4", "note": "图四：叔叔检查伤口，语重心长地劝告", "text": ["“你边玩手机边走楼梯太危险了，幸好没有撞到别人，也没有受重伤。否则撞到后脑勺，后果不堪设想。”叔叔一边帮我检查伤口，一边语重心长地说。我红着脸点点头，感到非常羞愧。原来我一直以为自己能[[一心二用]]，但今天的教训告诉我，走路时玩手机，后果真的很严重。我站起来，走了几步，叔叔又再仔细检查了我身上的伤口，看到没有重伤，这才放心地走开了。马来女生也背着书包去上补习班了。"]}, {"pic": "end", "note": "教训式结尾", "text": ["这件事虽然让我摔得很痛，但也让我学到了一课——安全第一，做事要专心。我感谢那位叔叔和热心的马来女生，也暗暗下定决心，以后一定要改掉边走路边玩手机的坏习惯。"]}]}, "adv": {"label": "范文 · 高阶版", "words": "1200", "info": "进阶版 · 天气环境描写＋比喻修辞；结尾引用培根", "segments": [{"pic": "start", "note": "天气和环境的描写", "text": ["那是一个阳光明媚的星期六早晨，[[湛蓝的天空像洗过的蓝布]]，洁白的云朵悠悠地飘浮着，空气中弥漫着早餐摊位飘来的阵阵香味。我哼着小曲儿，脚步悠闲地踏上了通往小贩中心的熟悉小径。微风轻轻吹拂，鸟儿在树梢啾啾欢唱，一切都显得那么美好、那么安宁。"]}, {"pic": "1", "note": "图一：沉迷游戏，注意力黏在屏幕上", "text": ["“先来一局游戏再说！”我喃喃自语着，从口袋里拿出手机，迫不及待地打开了最爱的手机游戏——《动物大战》。我沉迷其中，手指在屏幕上飞快滑动，眼神死死／直勾勾地盯着角色的行动，仿佛整个人都钻进了[[虚拟世界]]，完全忘了自己正走在路上。", "走着走着，我忽然想到：从这个梯级上走，近一点，穿过马路就能直接到小贩中心了。于是，想到这里，我踩上台阶，可我的注意力依旧牢牢地黏在手机屏幕上，根本没有抬头看路。"]}, {"pic": "2", "note": "图二：踩空摔倒；手机飞出去", "text": ["我一边埋头“闯关”，一边不经心地踩上台阶，眼神迷离。就在这时，悲剧／意外发生了——“哎呀！”只觉脚下一滑，我一个趔趄，踩空了台阶。整个人猛地往后倒去！", "“啊——！”我发出一声惊叫，手机也从手中飞了出去，[[在空中划出一道弧线]]后摔在草丛中。我则狠狠地向后仰，摔在坚硬的阶梯下，手肘擦破皮，屁股也碰到台阶的阶沿。一阵钻心的剧痛从身体各处传来，我的眼泪止不住地顺着脸颊流淌下来。"]}, {"pic": "3", "note": "图三：叔叔如风般冲过来；马来女生捡手机；比喻修辞", "text": ["就在我忍痛哽咽时，一个身影如风般冲过来。那是一位约莫／大约三十多岁的叔叔，身穿深色T恤，神情焦急。他顾不得其他，三步并作两步跑到我身边，及时地扶住我的脑袋，我的脑袋这才没有受伤。", "“小弟弟！你还好吗？哪里痛？”他一边说着，一边蹲下来，扶起我，动作轻柔，满脸关切。我低垂着头，哽咽着说不出话来，脸红得像熟透的番茄，既羞愧又委屈，眼泪再次涌出。", "“哎呀，你的手肘擦破皮了，别哭，叔叔帮你看看。”他掏出纸巾，小心翼翼地擦拭我流血的手肘。", "这时，走在台阶上的一个马来族女生也闻声而来。她年纪和我差不多，穿着整洁的马来传统服装，头戴头巾，背着书包。她看到我狼狈的模样，先是一愣，随后赶紧跑下台阶，弯腰拾起我掉落在草丛里的手机。", "“你的手机，没坏。给你！”她轻声说道，把手机递给我。我抬头看了她一眼，她眼神中没有丝毫讥笑，也没有指责，只有满满的关心和善意。那一刻，我感到[[一股暖流涌上心头]]，羞愧之情更是如潮水般涌来。"]}, {"pic": "4", "note": "图四：叔叔的叮嘱；两人离开", "text": ["青年叔叔边帮我检查伤口，边语重心长地说：“你这样边玩手机边走楼梯，太危险了。幸好你只是擦伤，若是撞到后脑勺，后果不堪设想！”听着他关切的话语，我一句反驳的话也说不出口，只能红着脸轻轻点头，低下头。", "“我……我以后不敢了……”我小声说。", "“记住，安全无小事。走路时要专心，别把生命当儿戏。”叔叔拍了拍我的肩膀，把我扶了起来。", "在他的搀扶下，我试着站起身来，腿还有些发软，但勉强能走路。叔叔扶着我走了几步，仔细观察我有没有严重受伤，确定我只是皮肉伤后，才略感安心。", "“以后别再边走边玩手机了，这样的教训不能再有第二次。”他说完后起身离开，身影渐渐消失在人群中。", "马来女生也背起书包，对我轻声说了句“小心”，便转身离去。她的背影在阳光下拉得长长的，像一束温柔的光，留在我心中久久不散。"]}, {"pic": "end", "note": "结尾：反思＋名言", "text": ["我低头望着那被擦破皮的手肘，心中五味杂陈。这场意外虽然带来了疼痛和眼泪，但也带来了反思和成长。它让我意识到，贪图一时的娱乐，可能会带来无法挽回的后果。俗话说：“吃一堑，长一智。”我必须为自己的疏忽负责，也必须从中汲取教训／吸取教训。", "走在小贩中心的路上，我把手机收进口袋，再也没有拿出来。这一次的跌倒让我明白了一个道理：安全第一，做事要专心。我感谢那位热心的叔叔，也感谢那位马来女生的善良。我暗暗下定决心，以后绝不再边走路边玩手机。正如培根所说：“[[一次深刻的教训，胜过十次空洞的劝告]]。”这次教训让我彻底改掉了做低头族的坏习惯。"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "15/15", "words": "1000", "info": "老师批注：非常好。拟人的写法，好。正字提醒：台（台风）／抬（抬头），碰（碰撞）／看（看望）", "segments": [{"pic": "start", "note": "拟人的写法，好", "text": ["一个风和日丽的星期六早上，太阳从东边厚厚的云层中探出了火红的脑袋，把[[一束束灿烂的金光]]洒向大地。公鸡发出了喔喔喔的啼鸣，仿佛在[[催促]]人们早点起床，好来享受这美妙而崭新的一天。"]}, {"pic": "1", "text": ["小明一边眉开眼笑地走在去往小贩中心的路上，一边爱不释手地捧着手机，目不转睛地玩着自己最爱的《疯狂城》游戏。小明知道每个星期六早上他最喜欢的鸡饭摊位都会大排长龙，所以他加快了脚步，走上了路边的一个台阶。这是他偶然发现的一条去小贩中心的[[近路]]。小明得意洋洋／得意扬扬地想：哈哈！我真是一个小天才！不仅认识近路，还打败了《疯狂城》的大灰狼！"]}, {"pic": "2", "text": ["没想到，乐极生悲。突然，小明发出了一声“啊！”的惊叫。原来，他太沉迷在游戏的虚拟世界里，却没站稳，[[脚踩了一个空，身体猛地往后倒]]，手机[[脱手而出]]，在空中划出了一条长长的弧线，重重地落在不远处的石板路上，屏幕摔了个粉碎。", "[[祸不单行]]的是，小明在滚下阶梯的一瞬间，手肘擦破了一大块皮，顿时觉得[[火烧火燎]]的疼。他的肩膀还在台阶沿上磕了一下，疼得他[[龇牙咧嘴]]的。走在前面的一位马来小女孩听到小明的惊叫声，赶忙回头，看到眼前这一幕，吓得[[目瞪口呆]]。刚好路过的一位年轻叔叔也吓了一跳。他二话不说，三步并作两步地冲上前。"]}, {"pic": "3", "text": ["说时迟，那时快，眼看小明的后脑勺就要重重地撞在台阶上，叔叔以迅雷不及掩耳之势，及时地扶住了小明的脑袋。等小明回过神来，发现手肘上的伤口滴着鲜血，他心里感到一阵委屈、伤心和悔恨，像打翻了五味瓶一样。他哇的一声大哭起来，眼泪像断了线的珍珠一样掉了下来。叔叔仔细地检查了小明的伤口，发现没有骨折，这才松了一口气。他语重心长地说：“小弟弟，你一边爬楼梯一边玩手机实在是太危险了！这次幸好没有撞到后脑勺，否则后果不堪设想。看看还有哪里受伤了？”说完，他从书包里拿出了一瓶消毒液，给小明的伤口喷了两下。小明虽然觉得非常疼，可他忍住眼泪，脸憋得通红，支支吾吾地说：“谢谢……叔叔！我……我再也不敢了。”叔叔欣慰地向小明点点头，说：“知错能改，还是好孩子。”"]}, {"pic": "4", "text": ["这时，马来女孩飞快地跑下台阶，捡起了摔坏的手机，走回来在小明身旁，把手机递给了小明，然后轻声细语地说：“真可惜，你的手机坏了。以后一定要注意安全哦！”小明抬起头，看到了马来女孩充满关心和善意的眼神，感到一股暖流涌上心头。他感激地说：“谢谢你！我以后一定会专心走路的。”这时候，叔叔伸出双手，小心翼翼地把小明搀扶了起来。他见小明试着走了几步，没有大碍，就微笑着说了再见，转身离开了。"]}, {"pic": "end", "text": ["俗话说：“吃一堑，长一智。”经过这件事后，小明下定决心，走路时不要三心二意，要专心致志地向前走。因为他至今想起那撕裂的疼痛感仍然心有余悸。"]}]}}, "detective": [{"w": "抬头", "t": "抬", "opts": ["抬", "台", "胎"], "ctx": "于是，想到这里，我踩上台阶，可我的注意力依旧牢牢地黏在手机屏幕上，根本没有□头看路", "why": "“抬头”的“抬”是提手旁，用手往上举。“台”是台风、台阶，“胎”是胎儿。", "hint": "用手举 → 提手旁"}, {"w": "碰", "t": "碰", "opts": ["碰", "砰", "磞"], "ctx": "我则狠狠地向后仰，摔在坚硬的阶梯下，手肘擦破皮，屁股也□到台阶的阶沿", "why": "“碰到”的“碰”是石字旁加“並”。“砰”是声音（石字旁加平）。注意右边是“並”不是“平”。", "hint": "右边是“並”"}, {"w": "小贩中心", "t": "贩", "opts": ["贩", "饭", "反"], "ctx": "小明一边眉开眼笑地走在去往小□中心的路上，一边爱不释手地捧着手机，目不转睛地玩着自己最爱的《疯狂城》游戏", "why": "“小贩”的“贩”是贝字旁，做买卖的人（贝＝钱）。“饭”是米饭（食字旁），“反”是相反。", "hint": "和钱有关 → 贝字旁"}, {"w": "不仅认识近路", "t": "仅", "opts": ["仅", "仪", "又"], "ctx": "不□认识近路，还打败了《疯狂城》的大灰狼", "why": "“不仅”的“仅”是单人旁加“又”，意思是只、只是。“仪”是礼仪，“又”是又一次。", "hint": "单人旁＋又"}, {"w": "一瞬间", "t": "瞬", "opts": ["瞬", "舜", "顺"], "ctx": "祸不单行的是，小明在滚下阶梯的一□间，手肘擦破了一大块皮，顿时觉得火烧火燎的疼", "why": "“一瞬间”的“瞬”是目字旁，眨一下眼睛那么快。“舜”是古代的帝王，“顺”是顺利。", "hint": "眨眼 → 目字旁"}, {"w": "火烧火燎的疼", "t": "烧", "opts": ["烧", "绕", "浇"], "ctx": "祸不单行的是，小明在滚下阶梯的一瞬间，手肘擦破了一大块皮，顿时觉得火□火燎的疼", "why": "“烧”是火字旁。“绕”是绕圈（绞丝旁），“浇”是浇水（三点水）。", "hint": "火字旁"}, {"w": "火烧火燎的疼", "t": "燎", "opts": ["燎", "僚", "瞭"], "ctx": "祸不单行的是，小明在滚下阶梯的一瞬间，手肘擦破了一大块皮，顿时觉得火烧火□的疼", "why": "“火烧火燎”的“燎”是火字旁，被火烤。“僚”是同僚（单人旁），“瞭”是看得清楚（目字旁）。", "hint": "火字旁"}, {"w": "吓得目瞪口呆", "t": "瞪", "opts": ["瞪", "登", "蹬"], "ctx": "走在前面的一位马来小女孩听到小明的惊叫声，赶忙回头，看到眼前这一幕，吓得目□口呆", "why": "“瞪大眼睛”的“瞪”是目字旁。“蹬”是蹬腿（足字旁），“登”是登山。", "hint": "眼睛 → 目字旁"}, {"w": "哽咽着说", "t": "咽", "opts": ["咽", "烟", "因"], "ctx": "我低垂着头，哽□着说不出话来，脸红得像熟透的番茄，既羞愧又委屈，眼泪再次涌出", "why": "“狼吞虎咽”的“咽”是口字旁加“因”，吞下去。“烟”是火字旁，“因”是因为。", "hint": "口字旁＋因"}, {"w": "再也不敢", "t": "再", "opts": ["再", "在", "载"], "ctx": "我……我□也不敢了", "why": "“再也不会”“再次”的“再”是又一次。“在”是在哪里（在家、实在）。小作者把“实在”写成“实再”、“再吃”写成“在吃”——记住：又一次 → 再。", "hint": "又一次 → 再；地点 → 在"}], "audio": {"basic": {"src": "audio/phone-stairs_basic.mp3", "cues": [["phone-stairs|basic|1|0", 0.05], ["phone-stairs|basic|1|1", 19.67], ["phone-stairs|basic|2|0", 28.04], ["phone-stairs|basic|3|0", 48.21], ["phone-stairs|basic|4|0", 76.75], ["phone-stairs|basic|end|0", 112.44]]}, "adv": {"src": "audio/phone-stairs_adv.mp3", "cues": [["phone-stairs|adv|start|0", 0.0], ["phone-stairs|adv|1|0", 31.11], ["phone-stairs|adv|1|1", 59.01], ["phone-stairs|adv|2|0", 77.41], ["phone-stairs|adv|2|1", 94.53], ["phone-stairs|adv|3|0", 120.89], ["phone-stairs|adv|3|1", 142.18], ["phone-stairs|adv|3|2", 159.66], ["phone-stairs|adv|3|3", 167.81], ["phone-stairs|adv|3|4", 185.72], ["phone-stairs|adv|4|0", 205.06], ["phone-stairs|adv|4|1", 224.58], ["phone-stairs|adv|4|2", 229.02], ["phone-stairs|adv|4|3", 237.42], ["phone-stairs|adv|4|4", 251.25], ["phone-stairs|adv|4|5", 260.43], ["phone-stairs|adv|end|0", 272.92], ["phone-stairs|adv|end|1", 307.39]]}, "qx": {"src": "audio/phone-stairs_qx.mp3", "cues": [["phone-stairs|qx|start|0", 0.05], ["phone-stairs|qx|1|0", 24.09], ["phone-stairs|qx|2|0", 63.01], ["phone-stairs|qx|2|1", 88.96], ["phone-stairs|qx|3|0", 122.29], ["phone-stairs|qx|4|0", 199.79], ["phone-stairs|qx|end|0", 243.74]]}}}, {"id": "canteen-puddle", "title": "食堂踩到积水摔倒，旁观的同学", "cat": "guts", "grade": "P4", "pics": 4, "date": "2025-07-15", "source": "蔡老师课件", "imgs": ["img/H05_water_1.jpg", "img/H05_water_2.jpg", "img/H05_water_3.jpg", "img/H05_water_4.jpg"], "vocab": ["食堂摊位", "买面", "跌倒", "洒了一地", "哇哇大哭", "扶起来", "批评", "后悔"], "drafts": ["img/draft_20250719_220311.jpg", "img/draft_20250719_220417.jpg", "img/draft_20250720_172154.jpg", "img/draft_20250720_172200.jpg"], "versions": {"basic": {"label": "范文 · 基础版", "words": "600", "info": "考场优秀范文 600多字", "segments": [{"pic": "1", "note": "图一：看到积水却心怀侥幸，视而不见", "text": ["一个阳光明媚的上午，明华和同学们在食堂里津津有味地用餐。狼吞虎咽地吃完饭后，他经过洗手池洗了手，点了一杯饮料，然后在食堂[[无所事事]]地走着。", "当明华路过一张桌子时，他发现地上洒了一滩水。他心里闪过一个念头：“那里有一滩水，有人踩到会滑倒吧？”但转念一想，他又[[心怀侥幸]]，自言自语道：“反正我不会踩到积水而滑倒，和我有什么关系呢？”于是，明华选择了[[视而不见]]。"]}, {"pic": "2", "note": "图二：文光踩到积水摔倒", "text": ["没想到，下一刻悲剧发生了。另一名同学文光端着一碗热腾腾的汤面走过来，想找个位置坐下来，好好享用美食。没想到，他没看到地上的那一滩积水，直接踩了上去。紧接着他脚下一滑，整个人摔了个[[四脚朝天]]，面汤洒了一身，痛得哇哇大哭。眼前这一幕让明华瞬间傻了眼。俗话说：“勿以恶小而为之，勿以善小而不为。”如果明华当初稍微弯下腰，把地上的水擦干，文光就不会摔倒。"]}, {"pic": "3", "note": "图三：老师扶起文光；明华远远站着", "text": ["于是，明华指着文光跌倒的地方，告诉老师说文光踩到积水跌倒了，然后远远地站着，[[无动于衷]]。", "老师闻声赶来，大步流星地走过去，急忙扶起摔倒的文光，一边安慰，一边查看伤势。明华站在一旁，并没有上前帮助文光。"]}, {"pic": "4", "note": "图四：老师严厉批评；明华后悔", "text": ["老师扶起文光后，看到明华的样子，严厉地对明华说：“做人要有责任心，不能只顾自己，‘见危不救’就是冷漠，‘见义勇为’才是我们要学习的精神！”明华听了老师的话后，羞愧极了。他低下了头，泪水在眼眶里打转，[[心如刀绞]]。", "事后，明华主动向文光道歉，并在老师的指导下帮忙清理地板。从那以后，他明白了“前事不忘，后事之师”的道理，也懂得了“举手之劳，功德无量”的重要性。"]}, {"pic": "end", "text": ["这件事给了明华一次深刻的教训，也在他幼小的心灵中埋下了一颗责任感的种子。他暗暗下定决心，以后要做一个有爱心、有担当的人，不再[[袖手旁观]]，而是要勇于付出，帮助同学。"]}]}, "adv": {"label": "范文 · 高阶版", "words": "1300", "info": "高阶识字版本 · 结尾有比喻句和排比句", "segments": [{"pic": "start", "note": "用声音写食堂的热闹", "text": ["一个阳光明媚、微风拂面的上午，明华和同学们在学校食堂里津津有味地用餐。学校食堂里[[人声鼎沸]]，碗筷碰撞声、嬉笑声、谈话声交织成一首热闹的用餐交响曲。"]}, {"pic": "1", "note": "图一：发现积水，心怀侥幸", "text": ["明华狼吞虎咽地吃完饭后，走到洗手池洗了手，又到饮料柜点了一杯冰饮料。他一边吸着饮料，一边无所事事地在食堂里闲逛，明华的心情顿时感到十分愉快，甚至哼起了小曲儿。", "忽然，他停下脚步，皱起眉头。原来是在他不远处的地板上有一滩积水，水光在日光灯下闪着微光。明华心里闪过一个念头：“那儿有水，要是有人踩到，会滑倒吧？”然而，他只是撇了撇嘴，再次自言自语道：“反正我不会踩到滑倒，一滩积水而已，和我有什么关系呢？”他心怀侥幸，选择了视而不见。"]}, {"pic": "2", "note": "图二：文光端着面滑倒；一片狼藉", "text": ["正当明华转身离开的时候，一道熟悉的身影映入眼帘——是他的同学文光。只见文光彬彬有礼点完餐后，双手端着一碗[[热气腾腾、香气扑鼻]]的汤面，眉眼间满是期待与满足。他一边小心翼翼地用双手端着碗碟，眼睛向前找空位，一边笑着和同学打招呼，完全没有注意到脚下的积水。", "紧接着，只见文光脚下一滑，碗碟倾斜，热汤飞溅而出，泼了他一身。他的眼镜歪到一边，面条挂在衣襟上，地上顿时[[一片狼藉]]。他大声哭喊着：“好烫，好痛啊！”那一幕让明华瞬间傻了眼，心中不由得“咯噔”一下。", "俗话说：“勿以恶小而为之，勿以善小而不为。”如果明华当初稍微弯下腰，把地上的水擦干，哪怕只是提醒一声，也许文光就不会摔倒。可现在，一切都晚了。"]}, {"pic": "3", "note": "图三：明华只告诉老师，自己像雕塑一样站着", "text": ["明华继续用吸管吸着饮料，指着文光跌倒的地方，告诉老师发生了什么事，却远远地站着，双手紧握饮料杯，背脊僵直，竟然没有上前帮忙。", "老师听到明华的话，闻声赶来，大步流星地冲到文光身边，毫不犹豫地弯下身，扶起他，小心查看伤势，一边安慰道：“没事，别怕，老师在这儿。”老师额头渗出细汗，扶起文光，检查了他的伤势，一看没有大碍，就放心了。"]}, {"pic": "4", "note": "图四：老师严厉批评；明华无地自容，事后道歉", "text": ["但是，老师看到远远[[像雕塑一般站着]]看的明华，真是气不打一处来。老师抬起头，站在明华面前，语气严肃地说：“明华，做人要有责任心，不能只顾自己。‘见危不救’，是冷漠行为；‘见义勇为’，才是我们要学习的精神！你怎么会看到同学跌倒，面无表情地站着呢？不懂得过来帮忙吗？”老师的话让明华[[无地自容]]。他低下头，泪水在眼眶里打转，心如刀绞，仿佛听见内心深处有一个声音在控诉：“你错了，你本可以阻止这一切。”", "事后，明华终于鼓起勇气，走到文光面前，红着眼圈、哽咽着说：“对不起，是我不好，我看到积水却没有及时地提醒你……”文光抬起头，脸上还挂着泪痕，却轻轻笑了笑，说：“没关系，又不是你的错。是我自己没有看到积水。”说完，他拍了拍明华的肩膀，让他不用在意。", "后来，在老师的指导下，明华认真地帮忙清理地板。经过这件事，他终于明白“前事不忘，后事之师”的道理——过去的错误，是未来的老师。同时，他也因此明白“举手之劳，功德无量”，哪怕只是一个提醒、一张纸巾，也可能避免一场灾难。"]}, {"pic": "end", "note": "结尾：比喻句＋排比句", "text": ["从那以后，明华变了。他开始主动帮助同学，提醒大家注意安全，参加志愿服务活动。他明白了“勿以善小而不为”的意思。他用行动证明：[[生活中，每一个小小的善举，就像一粒种子，终会开出责任与爱的花朵]]。", "这一次的经历，是明华人生中一堂最深刻的课。他永远记得，曾经有食堂里一滩小小的积水，教会了他[[什么是责任、什么是善良、什么是成长]]。"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "15/15", "words": "1025", "info": "老师批注：非常好！结尾写得很好。正字提醒：摊（摊位）／滩（海滩）", "segments": [{"pic": "start", "text": ["一个微风轻拂、鸟语花香的星期二早上，阳光透过薄薄的云层一缕一缕地洒向大地，照在皮肤上暖洋洋的，让人忍不住地想眯着眼笑。"]}, {"pic": "1", "text": ["小丁在食堂狼吞虎咽地吃完美味可口的鸡饭后，见离上课时间还有一段时间，就慢悠悠地走到饮料摊位前，点了一杯[[冰凉爽口]]的可乐，然后在食堂里无所事事地闲逛着。", "突然，小丁看到同班同学小文正在面条摊位前，彬彬有礼地点餐。在他身后不远处，有一小滩积水在阳光下闪着耀眼的光芒。小丁摸着口袋里的一大叠纸巾，本想去把积水擦干，可是他转念一想：擦这一滩水多麻烦啊！反正有清洁工人在，关我什么事？并且积水有反光，小文怎么会看不到呢？想到这里，他就没有走过去擦干积水。"]}, {"pic": "2", "text": ["不一会儿，小文端着一碗热气腾腾、香气扑鼻的云吞面，一边东张西望地找空位，一边和同学们友好地打招呼。没想到，他完全没有看见脚下有一滩积水，直接踩了上去。还没等小丁反应过来，小文就脚下一滑，失去了平衡，直接摔了个四脚朝天，面汤洒了地板和小文一身，现场一片狼藉。“好痛！好痛！”[[滚烫的汤汁]]让小文的皮肤顿时一片通红，火辣辣的疼。他的眼泪像断了线的珍珠一样从脸颊流了下来，伤心得哇哇大哭，伤心得如[[万箭钻心]]。"]}, {"pic": "3", "text": ["看到这一幕，小丁傻眼了，愣在原地，一时不知所措。这时，级任老师王老师正好路过。小丁回过神来，大喊：“老师，小文摔倒了！”令人惊讶的是，小丁说完，在一旁吸着美味的饮料，冷眼旁观，并没有上前帮忙。", "王老师闻声而来，见到眼前一片狼藉惨状，不禁大吃一惊，心急如焚。她三步并作两步地冲到小文身边，把小文小心翼翼地扶了起来。“别担心，小文，老师送你去医务室，然后去办公室换新制服。”老师一边检查了他的伤势，一边安慰道。小文这才止住哭声。"]}, {"pic": "4", "text": ["但是，老师一抬头发现远远像雕塑一般站着的小丁，气得[[七窍生烟]]。她大步流星地走到了小丁面前，严肃地责骂道：“小丁，做人要有责任心，不能只顾自己。‘见危不救’就是冷漠行为；‘见义勇为’，才是我们要学习的精神！你怎么能看到同学跌倒，还不赶快跑来帮忙呢？太自私了！”看着老师怒气冲冲的脸庞，小丁不禁感到又羞愧又自责。他红着脸，低下头，眼泪不停地在眼眶里打转，然后忍不住地流了下来。", "等小丁平静下来时，他鼓起勇气，走到了小文面前，红着眼睛，诚恳地道了歉：“小文，对不起，我不该对积水视而不见，没有及时地提醒你……”小文听了小丁的话后，原本[[愁眉不展]]的脸露出了一丝笑意。“没关系，事情都发生了，等一下我们一起清理一下就好了，”小文拍了拍小丁的肩膀说，“我们还是好朋友！”"]}, {"pic": "end", "note": "结尾，写得很好！", "text": ["俗话说：“前事不忘，后事之师。”经过这件事，小丁终于明白了“勿以善小而不为”的道理。他从一副“[[事不关己，高高挂起]]”的样子，变成了一个主动帮助同学的“热心肠”男生，让大家都[[刮目相看]]。"]}]}}, "detective": [{"w": "摊", "t": "摊", "opts": ["摊", "滩", "瘫"], "ctx": "突然，小丁看到同班同学小文正在面条□位前，彬彬有礼地点餐", "why": "“小摊”“摊位”的“摊”是提手旁，把东西摊开来卖。“滩”是海滩、沙滩（三点水），“瘫”是瘫痪。", "hint": "摆开来卖 → 提手旁"}, {"w": "微风拂面", "t": "拂", "opts": ["拂", "佛", "弗"], "ctx": "一个阳光明媚、微风□面的上午，明华和同学们在学校食堂里津津有味地用餐", "why": "“微风拂面”的“拂”是提手旁，轻轻擦过。“佛”是佛像（单人旁），“弗”是“不”的意思。", "hint": "轻轻摸过 → 提手旁"}, {"w": "人声鼎沸", "t": "鼎", "opts": ["鼎", "顶", "鼏"], "ctx": "学校食堂里人声□沸，碗筷碰撞声、嬉笑声、谈话声交织成一首热闹的用餐交响曲", "why": "“人声鼎沸”的“鼎”是古代煮东西的大锅，字形下面像三条腿。“顶”是头顶。", "hint": "下面像锅的三条腿"}, {"w": "人声鼎沸", "t": "沸", "opts": ["沸", "佛", "拂"], "ctx": "学校食堂里人声鼎□，碗筷碰撞声、嬉笑声、谈话声交织成一首热闹的用餐交响曲", "why": "“沸腾”的“沸”是三点水，水烧开了。“佛”是单人旁，“拂”是提手旁。", "hint": "水开了 → 三点水"}, {"w": "哼起了小曲", "t": "哼", "opts": ["哼", "亨", "享"], "ctx": "他一边吸着饮料，一边无所事事地在食堂里闲逛，明华的心情顿时感到十分愉快，甚至□起了小曲儿", "why": "“哼着歌”的“哼”是口字旁，用嘴发出声音。“亨”是亨通，“享”是享受（多一横一口）。", "hint": "嘴巴 → 口字旁"}, {"w": "一滩积水", "t": "滩", "opts": ["滩", "摊", "难"], "ctx": "没想到，他完全没有看见脚下有一□积水，直接踩了上去", "why": "“海滩”“沙滩”的“滩”是三点水，水边的沙地。“摊”是小摊（提手旁），“难”是困难。", "hint": "水边 → 三点水"}, {"w": "心怀侥幸", "t": "侥", "opts": ["侥", "饶", "绕"], "ctx": "”他心怀□幸，选择了视而不见", "why": "“侥幸”的“侥”是单人旁，碰巧得到好运气。“饶”是饶恕（食字旁），“绕”是绕圈。", "hint": "单人旁＋尧"}, {"w": "心怀侥幸", "t": "幸", "opts": ["幸", "辛", "幸"], "ctx": "”他心怀侥□，选择了视而不见", "why": "“侥幸”“幸运”的“幸”上面是“土”，下面像“干”。“辛”是辛苦，上面是一点一横。", "hint": "上面是土"}, {"w": "热气腾腾", "t": "腾", "opts": ["腾", "滕", "藤"], "ctx": "不一会儿，小文端着一碗热气□腾、香气扑鼻的云吞面，一边东张西望地找空位，一边和同学们友好地打招呼", "why": "“沸腾”的“腾”是月字旁加“关”的变形加“马”。“滕”是姓，“藤”是藤蔓（草字头）。", "hint": "月＋马"}, {"w": "香气扑鼻", "t": "扑", "opts": ["扑", "仆", "朴"], "ctx": "不一会儿，小文端着一碗热气腾腾、香气□鼻的云吞面，一边东张西望地找空位，一边和同学们友好地打招呼", "why": "“扑过去”的“扑”是提手旁，用身体冲上去。“仆”是仆人，“朴”是朴素（木字旁）。", "hint": "提手旁＋卜"}], "audio": {"basic": {"src": "audio/canteen-puddle_basic.mp3", "cues": [["canteen-puddle|basic|1|0", 0.05], ["canteen-puddle|basic|1|1", 16.67], ["canteen-puddle|basic|2|0", 41.73], ["canteen-puddle|basic|3|0", 82.98], ["canteen-puddle|basic|3|1", 92.68], ["canteen-puddle|basic|4|0", 105.56], ["canteen-puddle|basic|4|1", 128.96], ["canteen-puddle|basic|end|0", 144.72]]}, "adv": {"src": "audio/canteen-puddle_adv.mp3", "cues": [["canteen-puddle|adv|start|0", 0.05], ["canteen-puddle|adv|1|0", 18.78], ["canteen-puddle|adv|1|1", 37.41], ["canteen-puddle|adv|2|0", 66.69], ["canteen-puddle|adv|2|1", 94.34], ["canteen-puddle|adv|2|2", 116.71], ["canteen-puddle|adv|3|0", 133.95], ["canteen-puddle|adv|3|1", 148.29], ["canteen-puddle|adv|4|0", 169.56], ["canteen-puddle|adv|4|1", 210.46], ["canteen-puddle|adv|4|2", 237.2], ["canteen-puddle|adv|end|0", 260.22], ["canteen-puddle|adv|end|1", 281.28]]}, "qx": {"src": "audio/canteen-puddle_qx.mp3", "cues": [["canteen-puddle|qx|start|0", 0.0], ["canteen-puddle|qx|1|0", 18.72], ["canteen-puddle|qx|1|1", 39.15], ["canteen-puddle|qx|2|0", 77.43], ["canteen-puddle|qx|3|0", 130.41], ["canteen-puddle|qx|3|1", 155.57], ["canteen-puddle|qx|4|0", 184.28], ["canteen-puddle|qx|4|1", 227.65], ["canteen-puddle|qx|end|0", 259.58]]}}}, {"id": "banana-peel", "title": "自己扔包装纸，踩到香蕉皮摔倒", "cat": "whoops", "grade": "P4", "pics": 4, "date": "2025-07-22", "source": "蔡老师课件", "imgs": ["img/H06_banana_1.jpg", "img/H06_banana_2.jpg", "img/H06_banana_3.jpg", "img/H06_banana_4.jpg"], "vocab": ["走廊", "转弯处", "糖果", "香蕉皮", "边走边吃", "摔倒", "包装纸", "扶起来", "乱扔", "知错"], "drafts": ["img/draft_20250727_115633.jpg", "img/draft_20250727_115639.jpg", "img/draft_20250727_115726.jpg", "img/draft_20250727_115801.jpg"], "versions": {"basic": {"label": "范文 · 基础版", "words": "759", "info": "参考范文 · 声音开头法（第一人称）", "segments": [{"pic": "start", "note": "声音开头法", "text": ["“叮铃铃……”下课的铃声响起，教室里立刻沸腾起来，同学们兴奋地收拾文具和书包，纷纷冲出课室，前往食堂，笑声、喊叫声[[此起彼落]]。我也跟着人群走出教室，手里拿着一颗心爱的棒棒糖准备吃。走廊上回荡着脚步声、说话声和嬉闹声，大家都兴冲冲地奔向食堂。"]}, {"pic": "1", "note": "图一：随手扔糖果纸，心想反正有人打扫", "text": ["我一边走一边撕开糖果纸。走着走着，我随手把透明糖果纸丢在地上，心想：反正马上就有校工来打扫。"]}, {"pic": "2", "note": "图二：转弯踩到香蕉皮摔倒", "text": ["没想到，刚转过一个弯，我不小心踩到一个香蕉皮，脚下一滑，“啊！”的一声，我整个人[[腾空而起]]，重重地摔在地上。棒棒糖也飞了出去，脸上顿时露出痛苦的表情。我忍不住掉下了眼泪，旁边的值日老师看到了，吓得张大了嘴巴。"]}, {"pic": "3", "note": "图三：值日老师扶起来，送医务室", "text": ["这时，值日老师回过神来，立刻跑了过来。他弯下腰，关切地问我：“你还好吗？哪里痛？”我捂着膝盖，哽咽地说：“老师，我的手肘和屁股好痛！不知道是哪个[[缺德鬼]]，乱扔香蕉皮。”老师小心翼翼地扶起我，带我去医务室处理伤口。", "躺在医务室的床上，我回想起刚才的情景，心里惭愧极了！我愧悔不已。虽然我不是踩到自己随手扔的透明糖果纸，但是我乱丢垃圾，和那个乱扔香蕉皮的人又有什么区别呢？"]}, {"pic": "4", "note": "图四：老师呵斥扔香蕉皮的同学；我也暗暗反省", "text": ["值日老师出去找那个乱扔香蕉皮的“肇事者”。我隔着窗户，听见他[[厉声呵斥]]那个同学：“林明华，原来是你乱扔香蕉皮，真是太没有公德心了！你知道马小跳刚才差点摔到后脑勺了吗？”林明华小声地说：“对不起……我下次再也不敢乱扔香蕉皮了！”接着，值日老师缓和了语气，柔声细语地说：“以后要记住，不要乱丢垃圾哦，它不只是破坏环境，还可能害到自己和别人。”然后他就让林明华走开了。", "我听了值日老师的话后，也暗暗点了点头，心想：以后我一定要做个有[[公德心]]的学生，从小事做起，再也不随地乱扔垃圾了。虽然扔香蕉皮的林明华有错，但是我乱扔糖果纸也是错的。"]}, {"pic": "end", "note": "教训式结尾", "text": ["这次的小小意外，给了我一个大大的教训。我要牢牢记住：安全第一，爱护环境，从我做起。"]}]}, "adv": {"label": "范文 · 高阶版", "words": "1139", "info": "进阶识字版 · 老师要求朗读发录音", "segments": [{"pic": "start", "note": "声音开头；“像炸开了锅”“交响乐”是比喻", "text": ["一个很平常的星期三早上，“叮铃铃……”休息节的铃声响起，教室里顿时[[像炸开了锅]]一般，沸腾起来。同学们兴奋地收拾着文具和书本，嘴里喊着、笑着，三三两两冲出教室，前往食堂。笑声、喊叫声、奔跑声，此起彼伏，仿佛一曲活泼的交响乐。"]}, {"pic": "1", "note": "图一：拿着棒棒糖，随手扔糖果纸", "text": ["我也随着人潮，手里紧紧攥着一颗心爱的草莓味棒棒糖，脸上挂着笑容，心里像开了一朵花。我一边走一边用牙齿小心撕开糖果纸，鼻尖闻着甜甜的香味，忍不住舔了舔嘴唇，眼睛弯成了月牙。走廊上，人声鼎沸，脚步声、谈笑声、叫喊声汇成一片，大家都兴冲冲地奔向食堂，准备津津有味地享用美食。", "就在这时，我随手把手里的透明糖果纸一扔，心中闪过一丝侥幸，自言自语道：“反正很快就有校工来打扫嘛。”"]}, {"pic": "2", "note": "图二：“天有不测风云”转折；摔倒的细节", "text": ["可是，[[天有不测风云，人有旦夕祸福]]。刚转过走廊的一个弯道，我的脚下突然一滑，整个人瞬间失去平衡，只听“啊！”的一声尖叫，我整个人腾空而起——时间仿佛在那一刻静止了。下一秒，“砰”的一声，我一屁股重重地摔在坚硬的地板上，手中的棒棒糖也飞了出去，在空中划出一道弧线，落在了不远处。", "一阵钻心的疼痛袭来，我只觉得手肘、膝盖、屁股钻心的疼，泪水立刻涌了出来，顺着脸颊滑落，滴在地上。我的脸皱成一团，嘴唇颤抖着，忍不住大喊：“好疼啊！到底是谁扔的香蕉皮？”"]}, {"pic": "3", "note": "图三：值日老师闻声赶来；医务室里的反省", "text": ["这时，值日老师闻声赶来，只见他脸色一变，吓得张大了嘴巴，连忙小跑过来。他弯下腰，眼神充满关切地看着我：“你还好吗？哪里痛？”我捂着膝盖，哽咽着说：“老师……我的手肘和屁股好痛……不知道是哪个缺德鬼，随地乱扔香蕉皮……”老师一边安慰我：“别怕，别怕，老师在呢。”一边小心翼翼地扶起我，带我去医务室处理伤口。", "躺在医务室的床上，看着护士姐姐温柔地给我消毒、贴药膏，我的眼神渐渐暗淡下来，心里一阵阵惭愧与悔恨翻涌而来——刚才随手乱扔糖果纸的画面在脑海里[[挥之不去，拂之又来]]。我低下头，泪光中映出自己的影子：我和那个扔香蕉皮的人，有什么区别呢？不都是随手丢垃圾，抱着“事不关己，高高挂起”的心态吗？"]}, {"pic": "4", "note": "图四：老师呵斥林明华；我暗下决心", "text": ["忽然，窗外传来了值日老师的声音，我悄悄探头望去，只见老师正板着脸，厉声呵斥一个低着头的小男孩：“林明华，原来是你乱扔香蕉皮，真是太没有公德心了！你知道马小跳刚才差点摔到后脑勺了吗？”林明华小声地说：“对不起……我下次再也不敢乱扔香蕉皮了。”老师叹了口气，缓和了语气，拍拍他的肩膀，说：“记住，乱扔垃圾不只是破坏环境，还可能害到自己和别人。做人要有公德心，哪怕是一点小事，都能看出一个人的品格。”"]}, {"pic": "end", "note": "结尾：引用古人云", "text": ["我听着听着，心里像被针扎了一下，默默地在心底暗暗点头。是啊，古人云：“勿以恶小而为之，勿以善小而不为。”不要因为小小的坏事就去做，不要因为是小小的善事却不去做。", "我轻轻握了握拳头，心中立下决心：“从今以后，我再也不随地乱丢垃圾了，要做一个有公德心的好学生！”"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "15/15", "words": "926", "info": "老师批注：非常好。第一段要尽量简短；一定要有主题升华的段落才算全文结束。正字：撕（撕掉）／嘶（嘶吼）", "segments": [{"pic": "start", "note": "分段，第一段要尽量简短", "text": ["“叮铃铃……”清脆的课间休息铃声响起，课室顿时炸开了锅。同学们像小鸟出笼一样，[[叽叽喳喳]]地飞出了教室。小丁也不例外。他跟着人群，跑到了走廊上。"]}, {"pic": "1", "text": ["小丁的手里攥着一根五彩缤纷的棒棒糖，有巴掌那么大。这是老师奖励他上课时[[踊跃发言]]的奖品。小丁一边往食堂走，一边白里透红的脸蛋露出了得意洋洋的笑容。白里透红的脸蛋在阳光的照耀下，特别好看。他心想：因为我发言很棒，所以老师给我棒棒糖。今天真是幸运的一天！简直是太棒了！", "于是，小丁随手撕开了透明的糖果纸，毫不犹豫地往后一抛，心怀侥幸地想：反正没有人会发现地上有透明的包装袋的，就算别人发现了，清洁工也会马上赶来打扫干净的。", "撕开糖果纸后，小丁急不可待地吸起棒棒糖来。这时，一股香甜的水果味钻入小丁的鼻子中。他迫不及待地舔了一口棒棒糖，草莓、橙子、西瓜、蓝莓……各种水果味在嘴里炸开了花，酸酸甜甜的，美味极了！小丁感到心花怒放，早把包装纸的事忘得一干二净，丢到了九霄云外。"]}, {"pic": "2", "text": ["可是，天有不测风云，人有旦夕祸福。小丁没注意脚下的危险——一块香蕉皮。他[[冷不丁]]地踩了上去。只听见“啊——”的一声惨叫，小丁失去了平衡，脚下一滑，身体往后仰，重重地摔倒在硬硬的石板地上。顿时，小丁的手肘和屁股感到火辣辣的疼。手里的棒棒糖也脱手而出，从走廊的窗户飞出，在空中划出一道弧线，消失在了一楼的树丛中。小丁又急又气，哇的一声大哭了起来，眼泪像断了线的珍珠一样掉了下来。"]}, {"pic": "3", "text": ["这时，值日老师闻声而来，看到眼前的一幕，心急如焚，心口狂跳，三步并作两步地冲上前去帮忙。他先把小丁踩到的香蕉皮捡了起来丢进垃圾桶，防止别的小朋友滑倒受伤。然后他大步流星地跑回小丁身边，小心翼翼地把他搀扶起来，焦急地说：“小丁，你还好吗？受伤严重吗？来，老师送你到医务室检查一下。”“老师，我的屁股和手肘好痛啊……不知是哪个缺德鬼，乱扔香蕉皮，害我跌倒。”小丁[[哭丧着脸，抽噎着说]]。"]}, {"pic": "4", "text": ["等小丁躺在医务室的软床上，伤口被温柔的护士姐姐包得严严实实的，所以没有那么疼痛了。他回想刚才发生的事情，不禁心里涌起了一阵阵惭愧和悔恨，五味杂陈。他想：我刚才乱扔糖果包装纸的行为和那个乱扔香蕉皮的小朋友有什么区别呢？", "于是，小丁鼓起勇气，对一旁的值日老师说：“老师，对不起。我刚刚也随地扔了一张糖纸。您一直教导我们要有责任心和公德心。乱丢垃圾的行为不仅会破坏环境，而且会害人害己。我以后再也不会乱丢垃圾了。”老师欣慰地摸了摸他的头，语重心长地说：“知错就改，还是好孩子。好了，那你去把糖果纸捡起来丢进垃圾桶里吧。”小丁真的照做了。"]}, {"pic": "end", "note": "一定要有主题升华的段落才算全文结束", "text": ["俗话说：“经一事，长一智。”经过这件事之后，小丁再也没有乱丢垃圾了。"]}]}}, "detective": [{"w": "撕", "t": "撕", "opts": ["撕", "嘶", "斯"], "ctx": "□开糖果纸后，小丁急不可待地吸起棒棒糖来", "why": "“撕掉”的“撕”是提手旁，用手撕。“嘶”是嘶吼（口字旁），“斯”是斯文。", "hint": "用手撕 → 提手旁"}, {"w": "走廊", "t": "廊", "opts": ["廊", "郎", "朗"], "ctx": "他跟着人群，跑到了走□上", "why": "“走廊”的“廊”是广字头，和房子有关。“郎”是新郎，“朗”是晴朗。", "hint": "房子 → 广字头"}, {"w": "奖励", "t": "奖", "opts": ["奖", "桨", "浆"], "ctx": "这是老师□励他上课时踊跃发言的奖品", "why": "“奖品”“奖励”的“奖”下面是“大”。“桨”下面是“木”（船桨），“浆”下面是“水”（豆浆）。", "hint": "下面是大"}, {"w": "奖励", "t": "励", "opts": ["励", "厉", "历"], "ctx": "这是老师奖□他上课时踊跃发言的奖品", "why": "“奖励”的“励”是力字旁，给人力量、鼓励。“厉”是严厉，“历”是历史。", "hint": "力字旁"}, {"w": "踊跃发言", "t": "踊", "opts": ["踊", "涌", "勇"], "ctx": "这是老师奖励他上课时□跃发言的奖品", "why": "“踊跃”的“踊”是足字旁，跳起来。“涌”是涌出（三点水），“勇”是勇敢。", "hint": "跳 → 足字旁"}, {"w": "踊跃发言", "t": "跃", "opts": ["跃", "跌", "耀"], "ctx": "这是老师奖励他上课时踊□发言的奖品", "why": "“踊跃”“跳跃”的“跃”是足字旁加“夭”。“跌”是跌倒（足字旁加失）。", "hint": "足字旁＋夭"}, {"w": "舔了一口", "t": "舔", "opts": ["舔", "添", "甜"], "ctx": "他迫不及待地□了一口棒棒糖，草莓、橙子、西瓜、蓝莓……各种水果味在嘴里炸开了花，酸酸甜甜的，美味极了", "why": "“舔”是舌字旁，用舌头舔。“添”是添加（三点水），“甜”是甜味（舌＋甘）。", "hint": "舌头 → 舌字旁"}, {"w": "酸酸甜甜", "t": "酸", "opts": ["酸", "俊", "峻"], "ctx": "他迫不及待地舔了一口棒棒糖，草莓、橙子、西瓜、蓝莓……各种水果味在嘴里炸开了花，□酸甜甜的，美味极了", "why": "“酸”是酉字旁（酉和酒、醋有关），酸酸的味道。“俊”是英俊，“峻”是险峻。", "hint": "酉字旁"}, {"w": "天有不测风云", "t": "测", "opts": ["测", "侧", "则"], "ctx": "可是，天有不□风云，人有旦夕祸福", "why": "“测验”的“测”是三点水旁加“则”。“侧”是侧面（单人旁），“则”是规则。", "hint": "三点水＋则"}, {"w": "人有旦夕祸福", "t": "旦", "opts": ["旦", "但", "担"], "ctx": "可是，天有不测风云，人有□夕祸福", "why": "“一旦”的“旦”是太阳从地平线升起，下面一横是地面。“但”是但是（单人旁），“担”是担心（提手旁）。", "hint": "太阳刚升起"}], "audio": {"basic": {"src": "audio/banana-peel_basic.mp3", "cues": [["banana-peel|basic|start|0", 0.05], ["banana-peel|basic|1|0", 26.81], ["banana-peel|basic|2|0", 38.28], ["banana-peel|basic|3|0", 60.69], ["banana-peel|basic|3|1", 84.74], ["banana-peel|basic|4|0", 101.78], ["banana-peel|basic|4|1", 138.3], ["banana-peel|basic|end|0", 160.04]]}, "adv": {"src": "audio/banana-peel_adv.mp3", "cues": [["banana-peel|adv|start|0", 0.0], ["banana-peel|adv|1|0", 27.92], ["banana-peel|adv|1|1", 61.41], ["banana-peel|adv|2|0", 72.61], ["banana-peel|adv|2|1", 105.36], ["banana-peel|adv|3|0", 126.96], ["banana-peel|adv|3|1", 159.9], ["banana-peel|adv|4|0", 193.46], ["banana-peel|adv|end|0", 234.58], ["banana-peel|adv|end|1", 253.29]]}, "qx": {"src": "audio/banana-peel_qx.mp3", "cues": [["banana-peel|qx|start|0", 0.0], ["banana-peel|qx|1|0", 17.24], ["banana-peel|qx|1|1", 50.25], ["banana-peel|qx|1|2", 67.59], ["banana-peel|qx|2|0", 98.74], ["banana-peel|qx|3|0", 146.23], ["banana-peel|qx|4|0", 190.3], ["banana-peel|qx|4|1", 214.74], ["banana-peel|qx|end|0", 250.41]]}}}, {"id": "road-ball-2", "title": "马路上玩球（二）：三个男孩与小轿车", "cat": "falls", "grade": "P4", "pics": 4, "date": "2025-07-29", "source": "蔡老师课件", "imgs": ["img/H07_ball2_1.jpg", "img/H07_ball2_2.jpg", "img/H07_ball2_3.jpg", "img/H07_ball2_4.jpg"], "vocab": ["行人道", "玩球", "滚到马路上", "捡回", "司机", "及时刹车", "吓到", "后悔", "知错", "公路安全"], "drafts": ["img/draft_20250801_215359.jpg", "img/draft_20250801_215406.jpg", "img/draft_20250801_215418.jpg", "img/draft_20250801_215424.jpg"], "versions": {"basic": {"label": "范文 · 基础版", "words": "520", "info": "参考范文：考场需要达到的水平", "segments": [{"pic": "1", "note": "图一：放学路上，三人在行人道上谈天说地", "text": ["“叮铃铃……”放学铃声如美妙的音乐声响起，校门口顿时热闹起来。同学们背着书包，陆陆续续地走出校门，小文、小安和小华三人一边在行人道上[[谈天说地]]，一边大步流星地朝地铁站走去。旁边是马路，车辆[[川流不息]]。"]}, {"pic": "2", "note": "图二：小华抛球，小安劝阻，小文加入", "text": ["走着走着，小华忽然把手中的篮球抛了出去，球朝小安的方向飞去。小安吓得连忙闪避，皱着眉头说：“你在干吗？马路边玩球很危险的！”小华却[[满不在乎]]地笑着说：“放心啦，我不会丢到马路上。”小文也加入玩球的队伍，和小华一起抛球玩耍。"]}, {"pic": "3", "note": "图三：球滚向马路，小华冲出去追，小轿车驶来", "text": ["小安走在他们俩的中间，虽然心里不安，但也没说什么。不料，突然，篮球从小华手中滑出，滚向马路。小华一惊，立刻冲出去追球。就在这一瞬间，一辆小轿车飞快驶来！"]}, {"pic": "4", "note": "图四：紧急刹车，司机大骂；三人道歉", "text": ["“小心啊！”小安和小文惊叫一声，可已经来不及了。幸好司机紧急刹车，车停在小华面前，差一点就撞上了。司机探出头来，气得大骂：“臭小子，你们怎么能在马路上玩球？太危险了！不要命了吗？”", "小华看到眼前这一幕，吓得脸色苍白，冷汗直流，说不出话。小安也变得心跳加快，后悔没有阻止他们，小文也低着头，一脸愧疚。他们三人连忙向司机道歉，然后赶紧走向地铁站，急匆匆回家了。"]}, {"pic": "end", "text": ["正如俗话说：“马路如虎口，安全无小事。”这次经历让小华、小安和小文明白了一个道理：马路不是玩耍的地方，一时的贪玩可能造成严重后果。从此以后，他们再也不敢在马路边玩球了。"]}]}, "adv": {"label": "范文 · 高阶版", "words": "1100", "info": "进阶版作文 · 三个人物各有不同的心理描写", "segments": [{"pic": "1", "note": "图一：铃声开头＋比喻；阳光、微风、笑声", "text": ["“叮铃铃……”放学铃声响起，像一首美妙的乐曲，奏响了放学的序章。校门口顿时热闹非凡，同学们三三两两地走出校门，个个脸上洋溢着笑容，陆陆续续地向巴士站的方向走去。他们像一只只快乐的小鸟，迫不及待地飞向自由的天空。", "小文、小安和小华三人结伴同行，背着书包，一边谈天说地，一边有说有笑地朝巴士站走去。阳光洒在他们身上，暖洋洋的。微风拂面，树影斑驳。行人道上回荡着三个孩子清脆悦耳的笑声。"]}, {"pic": "2", "note": "图二：小华吊儿郎当；小安进退两难", "text": ["走着走着，小华忽然手痒，把随身带着的篮球抛了出去。“喂，来接球！”他大喊一声，篮球像离弦的箭一般朝左飞去。小安一惊，连忙闪避，脸色顿时变得苍白如纸，皱着眉头说道：“你在干吗？马路边玩球很危险的！”", "可小华却满不在乎，摆摆手，嘴一笑，说：“放心啦，我又不会把球丢到马路上。”他一副[[吊儿郎当]]、满不在乎的模样，仿佛丝毫没有意识到潜藏的危险。小安心中一紧，但见小文接住了球，又抛还给小华，球在空中飞舞，两人你来我往，玩得不亦乐乎。", "小安走在中间，[[进退两难]]。他想阻止，却又怕扫了大家的兴。心中五味杂陈，忐忑不安。俗话说：“[[防患未然，胜于亡羊补牢]]。”他隐隐感到不祥的预感。果不其然，意外发生了。"]}, {"pic": "3", "note": "图三：球滚向马路，小华拔腿冲出去，汽车疾驰而来", "text": ["就在那一个瞬间，篮球从小华手中飞出，滚向了马路！小华一惊，来不及多想，拔腿就冲了出去。那一刹那，小安大吃一惊，整个人僵住了。他瞪大双眼，目睹着小华像一阵风似的冲向马路，完全没注意到，一辆汽车正以惊人的速度疾驰而来！", "“小心啊！”小安和小文异口同声地惊叫起来，脸上惊恐万分，手忙脚乱地想要阻止他。可是，一切都太迟了。"]}, {"pic": "4", "note": "图四：急刹车；司机怒骂；三个人的反应", "text": ["“吱——！”的一声，随着刺耳的急刹声响起，汽车终于在离小华只有一步之遥的地方停了下来。", "司机探出头来，满脸通红，[[怒火中烧]]地破口大骂：“你个臭小子，找死吗？太没教养了！在马路上玩球，不要命了吗？你以为马路是你们的游乐场吗？你们两个同学也不劝他，太不像话了！”", "小华听了司机的教训，脸色煞白，额头渗出豆大的冷汗，嘴唇发抖，半天说不出话来。他站在原地，像被武林高手点穴一样，一动不动。他的眼神中闪烁着惊慌、后悔与恐惧。他从未想过，自己一时贪玩的行为，竟会带来如此惊心动魄的后果。", "小安此时也早已心跳加速，双腿发软，几乎站立不稳。他低着头，满脸悔意，心中懊悔不已：如果刚才他能再坚持劝说一次，也许就能避免这场惊险。他明白了什么叫“[[千钧一发]]”、“祸从天降”。小文则满脸愧色，不敢直视司机的眼睛。他垂着头，面红耳赤，毕竟，自己也是“同谋”，心中懊悔如潮。", "三人连忙鞠躬，向司机道歉，嘴里不停地说着“对不起，对不起”，然后灰溜溜地快步走向巴士站。一路上，他们默不作声，连平时最爱讲笑话的小华也一言不发，像[[泄了气的皮球]]，整个人低落到了极点。"]}, {"pic": "end", "text": ["“马路如虎口，安全无小事。”这句老师常挂在嘴边的话，今天在他们的心中敲响警钟。一时的任性，可能让生命付出惨痛的代价。", "从那天起，小华、小安和小文再也没有在马路边玩球。他们牢牢记住这次的教训：生命宝贵，安全第一。有时候，一个小小的决定，就能避开一场大祸。懂得为自己和他人的安全负责，才是真正的成长。"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "15/15", "words": "1034", "info": "老师批注：太棒了！正字：瓜／呱，彩／采，前／间，到／道", "segments": [{"pic": "1", "text": ["一个阳光明媚、微风轻拂的星期三下午，放学的铃声，同学们的嬉闹声，树叶发出的沙沙声，和小鸟欢快的歌声组成了一首悦耳的交响乐。小安、小丁和小文刚放学，踏着轻快的脚步，有说有笑地走出了校门，准备去一家附近很受欢迎的餐厅享受一顿美味的午餐。", "走着走着，小安兴奋地从书包底下掏出一个擦得锃亮的篮球，得意洋洋地对伙伴们炫耀道：“嘿嘿！小丁，小文，你们看！我爸爸昨天从国外回来，竟然带回来这个明星签名的篮球！因为你们是我的好哥们儿，所以今天带到学校来让你们大开眼界！”说完，他把篮球冷不丁地抛向小文，说：“来！接着！”小文眼疾手快，及时地接住了球，[[啧啧称赞]]道：“哇！太帅气了吧！简直是太酷了！”"]}, {"pic": "2", "text": ["说着，小文又把篮球抛给了小丁。小丁吓了一跳，下意识地伸手去接，可是球实在太滑了，像一条滑溜溜的鲇鱼一样，一下子就从小丁的手里弹了出去。幸好，小安及时接住了快要飞到马路上的球。三个人都松了一口气。小丁脸色苍白，结结巴巴地说：“小安，小文，我……觉得我们不要在马路边玩球了，太危险了，如果球滚到马路上怎么办？”没想到，小安和小文满不在乎地说：“你真是一个胆小鬼啊！是你自己技术不怎么样吧？反正我们不会把球丢到马路上的，我们的技术是[[顶呱呱]]的！你就看着吧！”于是，话音刚落，他们继续兴高采烈地玩了起来。"]}, {"pic": "3", "note": "这里分段", "text": ["可是，不料，乐极生悲。突然，小文抛球的时候，用力过猛，抛歪了。小安赶快踮起脚尖，想要像上次一样接住球。可是这次没有这么幸运了。球像被施了魔法一样，飞快地滚到马路上。", "小安见状，急得直跺脚，全身是汗，顿时脑袋里只想着捡球。他不管三七二十一，像一支离弦的箭一样冲到马路中间捡球。小文和小丁看见眼前这一幕，傻眼了。等他们回过神来，只见一辆红色的小轿车正朝小安飞驰而来。“危险！小安！！快回来！”他们异口同声地喊道。"]}, {"pic": "4", "note": "让事件本身结束", "text": ["可是，小安像被施了定身法似的，动弹不得，仿佛脚被胶水粘在了马路上。只见他脸色苍白，眼睛瞪得像铜铃，嘴巴张得大大的，却发不出一丝声音。开小轿车的司机“嘀嘀嘀”地猛按喇叭，提醒小安快点让开。看他无动于衷，“吱……”的一声猛刹车，最后停在了离小安鼻子尖几厘米的地方。", "司机把车窗摇下来，探出头，火冒三丈地破口大骂道：“你这个臭小子！不要命了吗？怎么能在马路上玩球？你们两个同学也不去阻止一下他！”“对不起，我不应该在马路上玩球！请您原谅我吧！”小安低着头，面红耳赤地道歉着。“我们也有错！”小文和小丁满脸愧色地小声说。司机看到他们态度诚恳，语重心长地说道：“人没事就好，知错能改还是好孩子。下次千万不要在马路上玩球了。”说完，他就和小文、小丁和小安挥手道别。小文、小丁和小安心有余悸，赶忙收起篮球，急匆匆回家去。"]}, {"pic": "end", "text": ["俗话说：“吃一堑，长一智。”从那一天起，他们三个真正懂得了“马路如虎口，安全无小事”的道理，再也没有在路旁边玩球了。"]}]}}, "detective": [{"w": "间", "t": "间", "opts": ["间", "前", "向"], "ctx": "他不管三七二十一，像一支离弦的箭一样冲到马路中□捡球", "why": "“时间”“一瞬间”的“间”是门字框里一个“日”，像从门缝看见太阳。小作者写过“前”，要记得“时间”的“间”有门字框。", "hint": "门里一个日"}, {"w": "兴高采烈", "t": "采", "opts": ["采", "彩", "睬"], "ctx": "”于是，话音刚落，他们继续兴高□烈地玩了起来", "why": "“兴高采烈”的“采”上面是爪，下面是木，像用手摘果子，意思是精神、神采。“彩”是颜色（多三撇）。小作者写过“彩”，要记：兴高采烈没有三撇！", "hint": "没有三撇"}, {"w": "眼疾手快", "t": "疾", "opts": ["疾", "疫", "痴"], "ctx": "”小文眼□手快，及时地接住了球，啧啧称赞道：“哇", "why": "“疾驰”“疾步”的“疾”是病字头加“矢”（箭），像箭一样快。“疫”是瘟疫，“痴”是痴迷。", "hint": "病字头里一支箭"}, {"w": "啧啧称赞", "t": "啧", "opts": ["啧", "责", "债"], "ctx": "”小文眼疾手快，及时地接住了球，□啧称赞道：“哇", "why": "“啧啧称赞”的“啧”是口字旁，嘴里发出的声音。“责”是责任，“债”是欠债。", "hint": "嘴里的声音 → 口字旁"}, {"w": "啧啧称赞", "t": "赞", "opts": ["赞", "攒", "瓒"], "ctx": "”小文眼疾手快，及时地接住了球，啧啧称□道：“哇", "why": "“称赞”的“赞”是两个“先”在上面，“贝”在下面。“攒”是攒钱（提手旁）。", "hint": "两个先＋贝"}, {"w": "实在太滑", "t": "实", "opts": ["实", "买", "卖"], "ctx": "小丁吓了一跳，下意识地伸手去接，可是球□在太滑了，像一条滑溜溜的鲇鱼一样，一下子就从小丁的手里弹了出去", "why": "“实在”“老实”的“实”是宝盖头下面一个“头”。“买”“卖”下面是“头”但上面不同。", "hint": "宝盖头＋头"}, {"w": "滑溜溜的鲇鱼", "t": "鲇", "opts": ["鲇", "鲢", "粘"], "ctx": "小丁吓了一跳，下意识地伸手去接，可是球实在太滑了，像一条滑溜溜的□鱼一样，一下子就从小丁的手里弹了出去", "why": "“鲇鱼”的“鲇”是鱼字旁加“占”，一种没有鳞、很滑的鱼。“鲢”是鲢鱼，“粘”是粘住。", "hint": "鱼字旁＋占"}, {"w": "胆小鬼", "t": "胆", "opts": ["胆", "但", "旦"], "ctx": "”没想到，小安和小文满不在乎地说：“你真是一个□小鬼啊", "why": "“胆小”“大胆”的“胆”是月肉旁，身体里的胆。“但”是但是，“旦”是早晨。", "hint": "身体器官 → 月字旁"}, {"w": "时候", "t": "候", "opts": ["候", "侯", "喉"], "ctx": "突然，小文抛球的时□，用力过猛，抛歪了", "why": "“时候”的“候”中间有一竖。“侯”没有那一竖（诸侯），“喉”是喉咙（口字旁）。", "hint": "中间多一竖"}, {"w": "像一支离弦的箭", "t": "箭", "opts": ["箭", "剑", "前"], "ctx": "他不管三七二十一，像一支离弦的□一样冲到马路中间捡球", "why": "“离弦的箭”的“箭”是竹字头，古代的箭用竹子做。“剑”是宝剑（右边立刀），“前”是前面。", "hint": "竹字头＋前"}], "audio": {"basic": {"src": "audio/road-ball-2_basic.mp3", "cues": [["road-ball-2|basic|1|0", 0.0], ["road-ball-2|basic|2|0", 26.59], ["road-ball-2|basic|3|0", 52.81], ["road-ball-2|basic|4|0", 70.85], ["road-ball-2|basic|4|1", 89.96], ["road-ball-2|basic|end|0", 110.11]]}, "adv": {"src": "audio/road-ball-2_adv.mp3", "cues": [["road-ball-2|adv|1|0", 0.05], ["road-ball-2|adv|1|1", 23.82], ["road-ball-2|adv|2|0", 45.2], ["road-ball-2|adv|2|1", 67.3], ["road-ball-2|adv|2|2", 91.79], ["road-ball-2|adv|3|0", 111.75], ["road-ball-2|adv|3|1", 135.06], ["road-ball-2|adv|4|0", 146.41], ["road-ball-2|adv|4|1", 158.01], ["road-ball-2|adv|4|2", 176.14], ["road-ball-2|adv|4|3", 203.0], ["road-ball-2|adv|4|4", 234.45], ["road-ball-2|adv|end|0", 254.73], ["road-ball-2|adv|end|1", 267.89]]}, "qx": {"src": "audio/road-ball-2_qx.mp3", "cues": [["road-ball-2|qx|1|0", 0.05], ["road-ball-2|qx|1|1", 27.59], ["road-ball-2|qx|2|0", 65.06], ["road-ball-2|qx|3|0", 120.87], ["road-ball-2|qx|3|1", 140.7], ["road-ball-2|qx|4|0", 170.39], ["road-ball-2|qx|4|1", 202.69], ["road-ball-2|qx|end|0", 253.61]]}}}, {"id": "water-gun", "title": "客厅玩水枪，让奶奶滑倒", "cat": "whoops", "grade": "P4", "pics": 4, "date": "2025-08-06", "source": "蔡老师课件", "imgs": ["img/H08_gun_1.jpg", "img/H08_gun_2.jpg", "img/H08_gun_3.jpg", "img/H08_gun_4.jpg"], "vocab": ["客厅", "水枪", "满地", "滑倒", "受伤", "害怕", "连忙", "扶", "责骂", "认错"], "drafts": ["img/draft_20250808_213941.jpg", "img/draft_20250808_213950.jpg", "img/draft_20250808_213956.jpg", "img/draft_20250808_214005.jpg", "img/draft_mmexport1754660447669.jpg"], "versions": {"basic": {"label": "范文 · 基础版", "words": "660", "info": "参考范文 660字：考场可以努力的方向", "segments": [{"pic": "1", "note": "图一：家里静悄悄，兄弟俩玩起水枪", "text": ["一个很平常的星期六下午，家里静悄悄的，爸爸去公司加班了。奶奶和妈妈都在睡午觉。大明和小安做完作业，觉得很无聊。他们一眼瞥见角落里的玩具水枪，就去装满水，在客厅里玩水枪。他们俩你追我射，玩得不亦乐乎，完全没有注意到客厅的地板上已经积了不少水，[[湿滑不堪]]。"]}, {"pic": "2", "note": "图二：奶奶摔倒，妈妈闻声赶来", "text": ["就在他们玩得正起劲的时候，奶奶午睡醒来，走到客厅一看究竟。不料，她脚一滑，重重地摔倒在地。“哎呀！痛死我了！”她一直[[呻吟]]着，正在睡房的妈妈闻声赶来，看到眼前这一幕，吓了一跳，连忙跑过去扶起摔倒的奶奶。大明和小安这时才意识到事情的严重性，站在一旁手足无措，脸上写满了悔恨和害怕。"]}, {"pic": "3", "note": "图三：妈妈查看伤势，涂药油；兄弟俩羞愧", "text": ["妈妈仔细查看了奶奶的伤势，发现奶奶只是轻微扭伤，便松了一口气，扶她坐到沙发上休息，并拿来药油为她涂抹。大明和小安则低着头，羞得脸红耳赤，不敢直视大人的眼睛。他们知道自己贪玩闯了祸，心中充满了愧疚。因为一时贪玩，导致奶奶受伤，实在不应该。"]}, {"pic": "4", "note": "图四：奶奶叮嘱，妈妈痛骂；兄弟俩道歉", "text": ["奶奶虽然受了伤，但并没有责怪两个孩子，而是叮嘱他们以后要懂得分场合、注意安全，不可以在客厅这种地方玩水。妈妈则指着他们的鼻子，痛骂一番。然后才语重心长地对他们说：“你们两个做事要[[三思而后行]]，尤其是在家里，更要顾及家里人的安全。若不是奶奶这次摔得轻，后果不堪设想！”", "听了妈妈的话，大明和小安连连点头，并诚恳地向奶奶道歉：“对不起，奶奶。是我们太调皮了，以后再也不会在家里玩水枪了！”看着他们知错能改的样子，妈妈和奶奶也露出了欣慰的笑容。"]}, {"pic": "end", "text": ["通过这件事，大明和小安深刻体会到“祸从口出，患从嬉来”的道理。他们明白了玩耍也要有分寸，安全必须放在第一位。从此以后，大明和小安吸取教训，再也不敢在客厅玩水枪打水仗了。"]}]}, "adv": {"label": "范文 · 高阶版", "words": "1200", "info": "进阶版 · 设问式开头，第一人称回忆", "segments": [{"pic": "start", "note": "设问式＋回忆式开头", "text": ["你有没有做过一件令自己懊悔不已的事情呢？我有。每当我看到角落里的玩具枪时，就会想起那件令我懊悔不已的事情来。", "说来已经是上个月发生的事情了。我还记得那是一个阳光明媚、风和日丽的星期六下午，窗外的阳光透过玻璃洒进客厅，屋内显得格外温暖。家里的气氛显得十分宁静。爸爸因为公司临时有事，就去公司加班了。家中只剩下奶奶、妈妈，以及做完作业的我和小安。"]}, {"pic": "1", "note": "图一：百无聊赖→发现水枪→你追我射", "text": ["我和小安弟弟写完功课后，顿觉无事可做，[[百无聊赖]]地在沙发上打滚。我们一边发着呆，一边翻着玩具寻找有什么可玩的。突然，小安眼尖，发现角落里的那两支[[尘封已久]]的玩具水枪。他眼前一亮，像发现了新大陆般惊呼道：“哥哥，我们来玩水枪大战吧！”", "我看到玩具水枪，也兴致勃勃，立刻附和。我们一人拿了一支水枪，冲进厕所装满水，便在客厅你追我射，玩得不亦乐乎。清脆的笑声在客厅里回荡，水珠飞溅，洒满地板。我们时而躲在沙发后，时而躲进门后，互相偷袭、追逐，欢快得像脱缰的野马一般，毫无顾忌。", "渐渐地，客厅的地板被水浸湿，变得[[光滑如镜]]。然而，我们早已玩得忘乎所以，完全没有察觉潜藏的危险。我和小安弟弟只顾欢笑、打闹，一点也没注意地板早已湿滑得如同溜冰场。"]}, {"pic": "2", "note": "图二：奶奶摔倒；妈妈奔出来", "text": ["这时，奶奶从午睡中醒来。她揉了揉惺忪的睡眼，弓着腰，慢慢地走出房间，准备到客厅倒点热茶喝。当她刚踏进客厅，还没等她反应过来，只听“哎哟！”一声惨叫——奶奶脚底一滑，重重地摔倒在地！", "“哎呀！痛死我了！”奶奶皱着眉头，脸色苍白，手捂着腰部，痛得龇牙咧嘴的。", "正在房间午休的妈妈听到喊声，心中一惊，急忙奔出来。当她看到奶奶倒在湿漉漉的地板上时，脸色顿时变得铁青，连忙上前将她扶起，焦急地问：“妈，您哪里痛？还能动吗？”", "我和小安这时才[[如梦初醒]]，愣在一旁，脸色煞白，心里顿时“咯噔”一声。我们俩兄弟目睹奶奶跌倒的场面，吓得一动不动，脸上写满了后怕和害怕。"]}, {"pic": "3", "note": "图三：扶到沙发涂药油；妈妈怒不可遏", "text": ["只见妈妈小心翼翼地搀扶奶奶坐到沙发上，拿来药油为她涂抹伤痛处。奶奶皱着眉头，嘴角微微颤抖，显得十分虚弱。好在她的骨头并没有骨折，只是轻微扭伤。妈妈长舒一口气，但脸上的怒气仍未消散。", "“你们两个，给我过来！”妈妈指着我和小安，[[怒不可遏]]地训斥，“怎么可以在客厅玩水枪？这里不是游乐场！你们有没有一点安全意识？如果奶奶撞到后脑勺，后果不堪设想！”", "听着妈妈严厉责骂的话语，我和弟弟低着头，羞愧难当。小安的眼眶泛红，我则咬着嘴唇，悄悄地抹去两滴悔恨的眼泪。"]}, {"pic": "4", "note": "图四：奶奶打圆场；妈妈语重心长；兄弟俩鞠躬道歉", "text": ["这时，奶奶轻轻拍了拍我们的手，带着慈祥的笑容，对妈妈说：“好了好了，儿媳妇，我没事，不要怪他们了。他们年纪小，不懂事，下次知道就好了。”虽然奶奶没有责怪我们，但她眼神中的疼痛与担忧却深深刺痛了我们两兄弟的心。", "妈妈见状，语气也缓和了些，但仍语重心长地对我们说：“你们要明白，做任何事前都要三思而后行，不能只顾自己玩得开心。家里有长辈在，更要时刻注意安全。‘祸从嬉来’，你们懂吗？如果奶奶今天伤得严重，全家人都会担心，你们也会内疚一辈子！”", "我和小安红着眼眶，走到奶奶面前，诚恳地鞠了一躬，说：“奶奶，对不起！我们错了。我们不该在家里玩水枪，让您受伤了。以后我们一定不会再这样了。”", "奶奶摸了摸我们的头，轻声说：“只要你们知道错就好。记住，不是什么地方都可以玩耍的，玩也要注意安全。”", "看到我和弟弟真心悔过，妈妈脸上终于露出了难得的微笑：“[[知错能改，善莫大焉]]。希望你们以后做事都能多动脑筋，不要再让长辈担心。”我和小安用力地点了点头。"]}, {"pic": "end", "text": ["俗话说：“前事不忘，后事之师。”经过这件事之后，我们明白“祸从嬉来，玩乐要有度”的道理。从此以后，我和小安再也不敢在客厅玩水枪打水仗了。"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "15/15（老师：可以给20分）", "words": "1038", "info": "老师批注：非常好。玩水枪的那一段“写得特别好！”", "segments": [{"pic": "start", "text": ["一个[[月明星稀]]的晚上，一阵阵凉风吹散了白天的炎热。柔和的月光洒在树梢上。蝉儿发出一声声低鸣，仿佛在[[窃窃私语]]。空气中充满了宁静和祥和的气氛。"]}, {"pic": "1", "note": "写得特别好！", "text": ["小明哥哥和小文弟弟享用完美味的晚餐后，飞快地做完了学校功课就到客厅的玩具柜子里翻箱倒柜。离他们睡觉的时间还有一个小时，所以他们想要找一个好玩的玩具来尽情地玩耍。", "突然，小明兴致勃勃地举起水枪，就是上次他和小文带到楼下玩的那把水枪，眉飞色舞地说道：“小文，你看啊！你还记得这两只枪吗？上次我们在游泳池玩得可开心啦！”小文眼睛一亮，连连点头。于是，兄弟俩冲进厕所把水枪装满了水，然后跑回客厅，开始嘻嘻哈哈地玩了起来。[[他们有时躲在沙发后面，寻找掩护，有时躲在柜子后面，等另外一个人走近了就突然蹦出来，偷袭他。他们一个喷洒过来，一个喷洒过去，玩得不亦乐乎，完全没有注意到地上已经布满了一滩滩的水，湿滑不堪。]]"]}, {"pic": "2", "text": ["这时，已经休息了一会儿的奶奶从卧室里迷迷糊糊地走了出来，想要倒一点温水喝。她刚走进客厅，还没反应过来，就踩到地上的积水。只听见“哎哟！”一声惨叫，奶奶重重地摔了个四脚朝天。她愁眉苦脸地摸着腰躺在地上呻吟着：“好痛……”奶奶的喊声惊动了妈妈，她心里暗叫“不好”，然后三步并作两步地冲到了客厅。眼前的一幕让妈妈心口狂跳，脸色苍白。"]}, {"pic": "3", "text": ["妈妈飞奔到奶奶旁边，小心翼翼地把她搀扶起来，心急如焚地问道：“妈，您还好吗？受伤了吗？要去医院吗？”奶奶忍着痛，豆大的汗珠掉了下来，她龇牙咧嘴地说：“幸好没伤到骨头，只是腰好像扭伤了。”妈妈看到奶奶没有受重伤，才松了一口气，心里的大石头总算落了地。她连忙把奶奶安顿在沙发上休息。", "这时，小明和小文知道自己闯祸了，呆若木鸡地站在一旁，心里开始准备迎接妈妈[[暴风雨一般的责骂]]。看着奶奶虚弱的样子，兄弟俩心里涌起了阵阵担心、悔恨、懊恼和羞愧，像打翻了五味瓶一样，五味杂陈。妈妈怒气冲冲地转向他们，眼睛瞪得像铜铃一样大，气不打一处来，破口大骂道：“你们两个臭小子！怎么可以在客厅里玩水枪呢？说过多少遍了，要先想后做，你们就是不听！要是奶奶撞到后脑勺，后果不堪设想！”"]}, {"pic": "4", "text": ["听了妈妈的话，小明和小文脸红得像两个番茄一样，低下了头，眼泪在眼眶里打转。他们异口同声地小声说：“对不起，奶奶。对不起，妈妈。我们下次再也不会在客厅里玩水枪了。我们等一下一定会把地板拖干净的。”说完，他们一个去拿拖把来抹地板，一个拿来药油轻轻地为奶奶按摩受伤的腰。看着兄弟俩懂事的样子，妈妈脸上阴转晴，露出了欣慰的笑容。"]}, {"pic": "end", "text": ["俗话说：“吃一堑，长一智。”经过这件事后，小明和小文更加懂得了“祸从嬉来，玩乐要有度”的道理。从此以后，小明和小文再也不敢在客厅里玩水枪了。"]}]}}, "detective": [{"w": "仿佛在窃窃私语", "t": "仿", "opts": ["仿", "访", "防"], "ctx": "蝉儿发出一声声低鸣，□佛在窃窃私语", "why": "“仿佛”的“仿”是单人旁，好像、模仿。“访”是拜访（言字旁），“防”是防止（左耳旁）。", "hint": "单人旁＋方"}, {"w": "仿佛在窃窃私语", "t": "佛", "opts": ["佛", "拂", "弗"], "ctx": "蝉儿发出一声声低鸣，仿□在窃窃私语", "why": "“仿佛”的“佛”是单人旁，好像的意思。“拂”是轻轻擦过（提手旁）。", "hint": "单人旁＋弗"}, {"w": "仿佛在窃窃私语", "t": "窃", "opts": ["窃", "切", "窍"], "ctx": "蝉儿发出一声声低鸣，仿佛在□窃私语", "why": "“窃窃私语”“偷窃”的“窃”是穴字头加“切”，像从洞里偷偷地。“切”是切菜，“窍”是窍门。", "hint": "穴字头＋切"}, {"w": "仿佛在窃窃私语", "t": "私", "opts": ["私", "和", "秘"], "ctx": "蝉儿发出一声声低鸣，仿佛在窃窃□语", "why": "“隐私”“私语”的“私”是禾字旁加“厶”（厶像把东西圈起来归自己）。“和”是禾加口，“秘”是秘密。", "hint": "禾＋厶"}, {"w": "玩具柜子", "t": "柜", "opts": ["柜", "拒", "巨"], "ctx": "小明哥哥和小文弟弟享用完美味的晚餐后，飞快地做完了学校功课就到客厅的玩具□子里翻箱倒柜", "why": "“柜子”“货柜”的“柜”是木字旁，柜子是木头做的。“拒”是拒绝（提手旁），“巨”是巨大。", "hint": "木头做的 → 木字旁"}, {"w": "水枪", "t": "枪", "opts": ["枪", "抢", "仓"], "ctx": "突然，小明兴致勃勃地举起水□，就是上次他和小文带到楼下玩的那把水枪，眉飞色舞地说道：“小文，你看啊", "why": "“水枪”的“枪”是木字旁加“仓”。“抢”是抢东西（提手旁），“仓”是仓库。", "hint": "木字旁＋仓"}, {"w": "冲进厕所", "t": "厕", "opts": ["厕", "侧", "测"], "ctx": "于是，兄弟俩冲进□所把水枪装满了水，然后跑回客厅，开始嘻嘻哈哈地玩了起来", "why": "“厕所”的“厕”是厂字头加“则”。“侧”是侧面（单人旁），“测”是测量（三点水）。", "hint": "厂字头＋则"}, {"w": "寻找掩护", "t": "掩", "opts": ["掩", "俺", "淹"], "ctx": "他们有时躲在沙发后面，寻找□护，有时躲在柜子后面，等另外一个人走近了就突然蹦出来，偷袭他", "why": "“掩护”“掩盖”的“掩”是提手旁，用手遮住。“俺”是“我”的方言，“淹”是淹水（三点水）。", "hint": "用手遮 → 提手旁"}, {"w": "寻找掩护", "t": "护", "opts": ["护", "户", "扩"], "ctx": "他们有时躲在沙发后面，寻找掩□，有时躲在柜子后面，等另外一个人走近了就突然蹦出来，偷袭他", "why": "“保护”“掩护”的“护”是提手旁加“户”。“扩”是扩大（提手旁加广）。", "hint": "提手旁＋户"}, {"w": "不亦乐乎", "t": "乎", "opts": ["乎", "呼", "平"], "ctx": "他们一个喷洒过来，一个喷洒过去，玩得不亦乐□，完全没有注意到地上已经布满了一滩滩的水，湿滑不堪", "why": "“不亦乐乎”的“乎”是古文里的语气词，上面一撇加三点，下面像“于”。“呼”是呼吸（口字旁），“平”是平地。", "hint": "一撇加点点，不是口字旁"}], "audio": {"basic": {"src": "audio/water-gun_basic.mp3", "cues": [["water-gun|basic|1|0", 0.05], ["water-gun|basic|2|0", 39.02], ["water-gun|basic|3|0", 79.24], ["water-gun|basic|4|0", 114.08], ["water-gun|basic|4|1", 149.55], ["water-gun|basic|end|0", 172.46]]}, "adv": {"src": "audio/water-gun_adv.mp3", "cues": [["water-gun|adv|start|0", 0.0], ["water-gun|adv|start|1", 12.4], ["water-gun|adv|1|0", 39.57], ["water-gun|adv|1|1", 65.34], ["water-gun|adv|1|2", 92.3], ["water-gun|adv|2|0", 111.58], ["water-gun|adv|2|1", 133.75], ["water-gun|adv|2|2", 143.23], ["water-gun|adv|2|3", 163.22], ["water-gun|adv|3|0", 179.55], ["water-gun|adv|3|1", 203.15], ["water-gun|adv|3|2", 219.48], ["water-gun|adv|4|0", 232.7], ["water-gun|adv|4|1", 257.79], ["water-gun|adv|4|2", 282.86], ["water-gun|adv|4|3", 301.33], ["water-gun|adv|4|4", 314.46], ["water-gun|adv|end|0", 332.65]]}, "qx": {"src": "audio/water-gun_qx.mp3", "cues": [["water-gun|qx|start|0", 0.0], ["water-gun|qx|1|0", 19.44], ["water-gun|qx|1|1", 39.32], ["water-gun|qx|2|0", 90.49], ["water-gun|qx|3|0", 127.99], ["water-gun|qx|3|1", 163.67], ["water-gun|qx|4|0", 207.54], ["water-gun|qx|end|0", 244.19]]}}}, {"id": "blind-rain", "title": "雨天帮助盲人过马路", "cat": "bonds", "grade": "P4", "pics": 4, "date": "2025-08-12", "source": "蔡老师课件", "imgs": ["img/H09_blind_1.jpg", "img/H09_blind_2.jpg", "img/H09_blind_3.jpg", "img/H09_blind_4.jpg"], "vocab": ["倾盆大雨", "戴着墨镜", "握着手杖", "盲人", "斑马线", "车辆", "来来往往", "危险", "担心", "撑着伞", "小心翼翼", "扶着", "家门外", "挥手道别", "道谢", "称赞"], "drafts": ["img/draft_20250817_133558.jpg", "img/draft_20250817_133605.jpg", "img/draft_20250817_133615.jpg", "img/draft_20250817_133622.jpg"], "versions": {"basic": {"label": "范文 · 基础版", "words": "620", "info": "参考范文一 · 雨天开头法", "segments": [{"pic": "1", "note": "图一：雨天开头法；坐在巴士站等车", "text": ["一个很平常的星期六早上，小丽拿着一把伞，安安静静地坐在巴士站的长凳上等巴士。此时[[乌云密布]]，天空灰蒙蒙的，[[豆大的雨点像断了线的珠子一样哗啦啦地落下]]，打在遮雨棚和地上，溅起一朵朵水花。街上的行人纷纷撑起雨伞，步伐加快，生怕被淋成“落汤鸡”。"]}, {"pic": "2", "note": "图二：盲人爷爷摸索着想过马路（戴着什么、拿着什么、怎么走路）", "text": ["忽然，小丽看到她的前面有一位盲人爷爷戴着墨镜，拄着黑手杖，摸索着从她面前经过。爷爷的衣服上肩膀部分被淋湿了，脸上还挂着一丝焦急。他一步一步地缓慢前行，想走到马路对面去。雨水不停地打在他身上，而且前面[[车来车往]]的，十分危险。小丽担心地看着他，只见爷爷已经快走到马路边，想要穿过马路去。他并不知道危险近在身旁。"]}, {"pic": "3", "note": "图三：撑伞扶爷爷过马路；自己淋湿了", "text": ["看到眼前这一幕，小丽立刻站起身，快步跑过去，大声喊道：“老爷爷，您等一下！”于是，她撑着伞，一个箭步走到爷爷身边，轻轻地扶住他。“下雨天，路又湿滑又危险，我带您过去吧！”她一边说着，一边牵起爷爷的手。老爷爷点了点头，脸上露出感激的笑容。", "他们慢慢地走在人行道上，小丽一手拿着伞，一手牵着老爷爷，还提醒他注意脚下的积水和路边的车子。雨还在下，倾斜的伞遮住了老爷爷的身体，他没有淋到雨，而小丽的衣服已经湿了一大片。"]}, {"pic": "4", "note": "图四：到了组屋楼下，道谢、道别", "text": ["终于，小丽扶着老爷爷，走到了对面的组屋楼下。老爷爷站在屋檐下，不停地向小丽道谢：“谢谢你，小姑娘，你真是个乐于助人的好孩子。今天要不是有你／幸亏有你，我可真是要发愁了！”小丽微笑着摆摆手，说：“不客气，老爷爷。您以后出门要小心哦！”说完，她再一次撑着伞回到了巴士站。"]}, {"pic": "end", "note": "结尾：好人好事的主题升华", "text": ["这天，小丽虽然全身都湿透了，但她的心却暖洋洋的。她明白了老师所教导的：助人为快乐之本。正所谓“[[赠人玫瑰，手留余香]]”，帮助别人不仅能温暖对方，也能温暖自己。只要人人都献出一点爱，世界就会变得更加美好，更加和谐。"]}]}, "adv": {"label": "范文 · 高阶版", "words": "700", "info": "范文二 · 人物性格开头法（“热心肠”）", "segments": [{"pic": "start", "note": "人物性格开头法＋倒叙", "text": ["小丽是阳光小学出了名的“[[热心肠]]”，每当同学遇到困难，她总会热心伸出援手，及时地帮助别人。她就像春天里的一缕阳光，温暖着大家的心。那一次她关心盲人老爷爷“[[雪中送炭]]”的举动，让人佩服得五体投地，事情是这样发生的……"]}, {"pic": "1", "note": "图一：新加坡的天气说变就变", "text": ["那是一个很平常的星期六早上，因为天气预报说早上有雷阵雨，所以小丽要去外婆家，就带着一把伞，坐在巴士站等车。", "[[新加坡的天气，像孩儿的脸，说变就变]]。一开始还是艳阳高照，不一会儿却乌云密布，紧接着，雨像瀑布一样倾泻而下，街道上水花四溅。小丽百无聊赖地望着前方。"]}, {"pic": "2", "note": "图二：盲人爷爷用手杖敲击地面；心理描写", "text": ["这时，一位戴着黑墨镜的盲人爷爷出现在她的视线中。只见老爷爷手持黑手杖，正顶着大雨，用手杖敲击地面，摸索着路况，缓慢地走向马路对面，看起来十分吃力。", "小丽看到旁边才是斑马线，老爷爷走到了马路边，旁边有来来往往的车辆在马路上穿梭。小丽的心猛地一跳，心想：这样太危险了！老爷爷看不见，万一被车撞到怎么办？"]}, {"pic": "3", "note": "图三：彬彬有礼地扶过马路", "text": ["于是，想到这里，小丽立刻站起来，拿着伞，一个箭步跑到爷爷身边，用温柔的声音彬彬有礼地说：“老爷爷，我来扶您过马路吧。”说完，她撑开雨伞，小心翼翼地牵着爷爷的手，慢慢地走到斑马线，引导他走向马路对面。", "一路上，她不断提醒爷爷注意脚下的积水，还帮他避开水坑和车辆。他们就这样一步一步走到了组屋楼下的安全地带。小丽这才松了一口气，虽然她自己的衣服已经湿透了，但脸上依然带着灿烂的笑容。"]}, {"pic": "4", "note": "图四：道谢、道别", "text": ["“谢谢你，小姑娘。幸亏有你，要不然我不知道该怎么办呢！”老爷爷朝着她的方向挥了挥手，眼神虽然看不见，但声音里充满感激。小丽礼貌地说：“不客气，老爷爷，您以后要多注意安全！”说完，她才转身离开。"]}, {"pic": "end", "text": ["俗话说：“经一事，长一智。”经过这件事之后，每当小丽在车站看到年长者需要帮助，都会毫不犹豫地伸出援手。"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "15/15", "words": "830", "info": "老师批注：全文非常生动流利，在平凡的话题上写出精彩的文句。在出现不同人物或人物转场时，可以分段，避免出现长段落。正字：豪（自豪）／毫（毫毛），便（便利）／更（更加）", "segments": [{"pic": "1", "text": ["一个下着倾盆大雨的星期天早上，“书虫”小丽坚持打着雨伞到巴士站等巴士，去图书馆借书。[[豆大的雨点噼里啪啦地打在巴士站的遮雨棚上，像是无数个小鼓手同时敲击起欢快的节奏]]。树木在风中和雨中剧烈地摇晃，好像在跳起雨中的芭蕾舞。不得不说，雨中景色，是别有一番味道的。"]}, {"pic": "2", "note": "在出现不同人物或人物转场时，可以分段", "text": ["小丽悠闲地坐在巴士站的长椅上，闻着下雨时空气中散发出来的一股淡淡的泥土香。这时，一个戴着墨镜的盲人叔叔缓慢地走进巴士站。他拄着一根黑手杖，小心翼翼地在马路边摸索着，想要过马路。", "这时，雨越下越大，猛烈地敲打着一切，伴随着电闪雷鸣，发出[[震耳欲聋]]的响声。马路上车来车往，川流不息，连红绿灯“嘀嘀嘀”的提示音都不太清楚。盲人叔叔脸上露出焦急、慌张又迷惑的表情。他接连几次想迈出步子，却都被呼啸而过的车辆阻止了。", "小丽把这一幕看在眼里，心里涌起一阵阵担心与心疼。她想起老师常常教导他们要乐于助人，看到有需要帮助的人一定要及时伸出援手。她再一看，发现盲人叔叔的肩膀已经被雨水打湿了，在凉风中瑟瑟发抖。"]}, {"pic": "3", "text": ["于是，小丽毫不犹豫地站起身来，三步并作两步地冲到盲人叔叔身边，撑起伞，遮在盲人叔叔的头顶。她用温柔的声音彬彬有礼地说道：“叔叔，我来扶您过马路吧！”叔叔脸上露出欣慰的笑容。他感激地说：“谢谢你，小姑娘！今天的雨真大，幸亏有你的帮忙。”", "小丽一手撑着伞，一手扶着盲人叔叔的胳膊，慢慢地一起走向马路对面。小丽一路上都在提醒叔叔要注意脚下的积水，还帮他避开马路上的车辆。她还很有礼貌，向主动停下让他们走过去的车子[[点头致意]]。就这样，他们一步一步地安全过了马路。等到马路对面了，小丽才松了一口气。虽然她半边衣服都被凉凉的雨水打湿了，可是她的心里却暖暖的。"]}, {"pic": "4", "text": ["叔叔转向小丽，连连道谢说：“今天多亏了你，小姑娘。你真是我的小救星啊！太谢谢你了！”小丽一下子脸红了，她奶声奶气地说道：“不客气，叔叔。这是我应该做的！”小丽虽然没有赶上巴士，可是心里还是甜滋滋的，比吃了蜜糖还要甜。她挥了挥手，向叔叔道别，说：“叔叔，再见！路上要小心哦！”"]}, {"pic": "end", "text": ["俗话说：“赠人玫瑰，手留余香。”经过这件事以后，小丽更加明白了“助人为快乐之本”的道理。帮助别人不仅能给别人带来方便，自己也能得到成长。"]}]}}, "detective": [{"w": "便", "t": "便", "opts": ["便", "更", "使"], "ctx": "帮助别人不仅能给别人带来方□，自己也能得到成长", "why": "“便”是单人旁加“更”，“便利”“方便”，也可以当“就”用（他便走了）。小作者把“便”写成“更”过——记住“便”左边有单人旁。", "hint": "单人旁＋更"}, {"w": "一缕阳光", "t": "缕", "opts": ["缕", "楼", "偻"], "ctx": "她就像春天里的一□阳光，温暖着大家的心", "why": "“一缕阳光”的“缕”是绞丝旁，本来指一根丝线，所以阳光像丝线一样细细的。“楼”是楼房（木字旁）。", "hint": "像丝线 → 绞丝旁"}, {"w": "溅起一朵朵水花", "t": "溅", "opts": ["溅", "贱", "践"], "ctx": "此时乌云密布，天空灰蒙蒙的，豆大的雨点像断了线的珠子一样哗啦啦地落下，打在遮雨棚和地上，□起一朵朵水花", "why": "“溅”是三点水，水花溅起来。“贱”是贝字旁，“践”是实践（足字旁）。", "hint": "水花 → 三点水"}, {"w": "戴着墨镜", "t": "墨", "opts": ["墨", "默", "黑"], "ctx": "这时，一个戴着□镜的盲人叔叔缓慢地走进巴士站", "why": "“墨镜”的“墨”是黑色的墨，上面“黑”下面“土”。“默”是沉默（右边是犬），“黑”就是黑色。", "hint": "黑＋土"}, {"w": "戴着墨镜", "t": "镜", "opts": ["镜", "境", "竟"], "ctx": "这时，一个戴着墨□的盲人叔叔缓慢地走进巴士站", "why": "“镜子”“墨镜”的“镜”是金字旁，古代镜子是铜做的。“境”是环境（土字旁），“竟”是竟然。", "hint": "金属做的 → 金字旁"}, {"w": "拄着黑手杖", "t": "拄", "opts": ["拄", "住", "柱"], "ctx": "忽然，小丽看到她的前面有一位盲人爷爷戴着墨镜，□着黑手杖，摸索着从她面前经过", "why": "“拄着拐杖”的“拄”是提手旁，用手撑着。“住”是住在（单人旁），“柱”是柱子（木字旁）。", "hint": "用手撑 → 提手旁"}, {"w": "拄着黑手杖", "t": "杖", "opts": ["杖", "仗", "丈"], "ctx": "忽然，小丽看到她的前面有一位盲人爷爷戴着墨镜，拄着黑手□，摸索着从她面前经过", "why": "“拐杖”的“杖”是木字旁，拐杖是木头做的。“仗”是打仗（单人旁），“丈”是丈夫。", "hint": "木头做的 → 木字旁"}, {"w": "斑马线", "t": "斑", "opts": ["斑", "班", "般"], "ctx": "小丽看到旁边才是□马线，老爷爷走到了马路边，旁边有来来往往的车辆在马路上穿梭", "why": "“斑马线”的“斑”中间是“文”，像花纹。“班”中间是一点一撇的“刀”（班级），“般”是一般。", "hint": "中间是“文”（花纹）"}, {"w": "嘀嘀嘀", "t": "嘀", "opts": ["嘀", "滴", "敌"], "ctx": "马路上车来车往，川流不息，连红绿灯“□嘀嘀”的提示音都不太清楚", "why": "“嘀咕”“嘀嘀”的“嘀”是口字旁，嘴里小声说。“滴”是水滴（三点水），“敌”是敌人。", "hint": "嘴 → 口字旁"}, {"w": "提示音", "t": "提", "opts": ["提", "题", "堤"], "ctx": "马路上车来车往，川流不息，连红绿灯“嘀嘀嘀”的□示音都不太清楚", "why": "“提醒”“提着”的“提”是提手旁。“题”是题目（页字旁），“堤”是堤坝（土字旁）。", "hint": "提手旁＋是"}], "audio": {"basic": {"src": "audio/blind-rain_basic.mp3", "cues": [["blind-rain|basic|1|0", 0.0], ["blind-rain|basic|2|0", 33.56], ["blind-rain|basic|3|0", 74.34], ["blind-rain|basic|3|1", 102.47], ["blind-rain|basic|4|0", 124.25], ["blind-rain|basic|end|0", 156.05]]}, "adv": {"src": "audio/blind-rain_adv.mp3", "cues": [["blind-rain|adv|start|0", 0.0], ["blind-rain|adv|1|0", 27.28], ["blind-rain|adv|1|1", 40.68], ["blind-rain|adv|2|0", 60.05], ["blind-rain|adv|2|1", 79.1], ["blind-rain|adv|3|0", 96.39], ["blind-rain|adv|3|1", 119.22], ["blind-rain|adv|4|0", 142.54], ["blind-rain|adv|end|0", 169.35]]}, "qx": {"src": "audio/blind-rain_qx.mp3", "cues": [["blind-rain|qx|1|0", 0.0], ["blind-rain|qx|2|0", 32.21], ["blind-rain|qx|2|1", 53.8], ["blind-rain|qx|2|2", 83.53], ["blind-rain|qx|3|0", 105.26], ["blind-rain|qx|3|1", 131.3], ["blind-rain|qx|4|0", 169.24], ["blind-rain|qx|end|0", 201.41]]}}}, {"id": "mrt-card", "title": "地铁站捡到乘客的卡并归还", "cat": "bonds", "grade": "P4", "pics": 4, "date": "2025-08-19", "source": "蔡老师课件", "imgs": ["img/H10_wallet_1.jpg", "img/H10_wallet_2.jpg", "img/H10_wallet_3.jpg", "img/H10_wallet_4.jpg"], "vocab": ["地铁站", "赶时间", "冲出闸门", "一张卡", "掉在地上", "发现", "叫住", "捡起", "接过", "夸赞"], "drafts": ["img/draft_20250824_122204.jpg", "img/draft_20250824_122216.jpg", "img/draft_20250824_125813.jpg", "img/draft_20250824_125825.jpg"], "versions": {"basic": {"label": "范文 · 基础版", "words": "679", "info": "参考范文 679字（初级版本476字也在课件里）", "segments": [{"pic": "1", "note": "图一：进地铁站看电影；叔叔行色匆匆", "text": ["一个很平常的星期六早上，天气晴朗，微风轻拂，爸爸妈妈去公司加班，我和妹妹兴冲冲地刷卡进地铁站，准备去电影院看新上映的儿童电影《哪吒闹海2》。地铁站里人来人往，大家都在赶时间，每个人都是[[行色匆匆]]的。一个穿着衬衫、系着领带的中年叔叔急匆匆地冲出闸门，脸上带着焦急的神情，似乎要赶去上班。眼看，地铁快要进站了，他刷卡后，大步流星地赶往旋转扶梯的方向去。"]}, {"pic": "2", "note": "图二：卡掉了，叔叔没发现", "text": ["突然，一张卡从中年叔叔的口袋里掉了下来，掉在地上，他自己却没有发现，仍然飞快地往前跑。我和妹妹看见了，大吃一惊，惊呼道：“哎！叔叔的卡掉了！”"]}, {"pic": "3", "note": "图三：妹妹捡卡，我追上去叫住叔叔", "text": ["于是，我叫妹妹立刻弯下腰，把那张卡拾了起来。然后我一边追一边大声叫住中年叔叔：“叔叔！等一等！您的卡掉在地上了！”叔叔听见了，停下脚步，转过身来，脸上露出一丝惊讶。"]}, {"pic": "4", "note": "图四：归还；叔叔道谢、夸赞", "text": ["我和妹妹气喘吁吁地跑上前，妹妹彬彬有礼地把卡递给叔叔。叔叔伸手接过那张卡，脸上立刻露出轻松和感激的笑容。他连声说：“谢谢你们！幸好你们发现了，不然我就麻烦大了！这是银行卡和乘车卡绑定在一起的卡，如果丢失了，我可能会[[损失惨重]]。真的太感谢你们了！”", "一旁的妹妹奶声奶气地说：“没关系，这是我们应该做的。”叔叔听了妹妹的话，欣慰地看着我们，还竖起大拇指，夸赞我们说：“你们真是好孩子，既细心又乐于助人。”", "听了叔叔的夸奖，我和妹妹的脸上露出了灿烂的笑容，心里感到非常愉快。虽然我们只是做了一件小事，但却帮助了别人，也让自己体会到了助人为乐的快乐。"]}, {"pic": "end", "text": ["俗话说：“赠人玫瑰，手留余香。”经过这件事之后，我明白了一个道理：在生活中，哪怕是[[举手之劳]]的小小行为，也可能给别人带来很大的帮助。每当别人需要我们的时候，我们一定要勇于伸出援手，就能让世界变得更和谐、更美好。"]}]}, "adv": {"label": "范文 · 高阶版", "words": "1200", "info": "识字进阶版 · 地铁站场面描写用了排比和比喻", "segments": [{"pic": "start", "note": "天气＋起因", "text": ["一个很平常的星期六早上，天气晴朗，微风吹拂，阳光透过高楼间的缝隙洒落在街道上，[[像为城市披上一层柔和的金色外衣]]。爸爸妈妈因为公司临时有紧急项目，不得不赶去加班，于是就让我和妹妹自己搭地铁去电影院，去观赏我们期待已久的新上映儿童电影《哪吒闹海2》。想到能够和妹妹一同观赏这部动画大片，我的心情格外激动，脚步也不由自主地轻快起来。"]}, {"pic": "1", "note": "图一：地铁站的场面描写（排比＋比喻）；叔叔的外貌神态", "text": ["走进地铁站，扑面而来的是凉爽的空调风，四周人声鼎沸。电子屏幕上滚动播放着列车即将到站的提示信息，广播里一遍遍提醒乘客注意安全。站厅里人潮涌动，行人们步伐匆匆，[[有的手提公文包，一脸严肃，似乎正赶去开会；有的带着孩子，手里还拎着大包小包，显然是打算外出游玩；还有像我们这样的学生，兴奋得叽叽喳喳，仿佛小鸟出笼]]。人来人往，川流不息，整个地铁站像一条永不停息的动脉，输送着一张张充满故事的脸庞。", "我和妹妹兴冲冲地刷卡进站。就在此时，一个身穿整洁衬衫、系着深色领带的中年叔叔吸引了我们的注意。他看上去三十多岁，背着一个鼓鼓囊囊的黑色公文包，额头上已经冒出了细密的汗珠。他快步走向闸门，刷卡的动作又急又快，生怕迟了一步。只见他眉头紧锁，神情焦虑，好像心里想着工作上的烦心事。刷卡成功的“滴”声响起后，他几乎是拔腿就冲，步伐如风，直奔旋转扶梯的方向。"]}, {"pic": "2", "note": "图二：卡滑落；兄妹的反应", "text": ["突然，意外发生了。随着他急促的动作，一张卡从他的口袋里滑落出来，静静地躺在冰冷的地板上。叔叔全然不知，依旧大步流星，脚步声“嗒嗒嗒”地远去。", "我和妹妹恰好目睹了这一幕，顿时大吃一惊。我忍不住惊呼：“哎！叔叔，您的卡掉了！”妹妹也瞪大眼睛，神色慌张。地铁站人多脚杂，[[倘若]]有人不小心踩到卡片，或是被人随手捡走，那后果不堪设想。"]}, {"pic": "3", "note": "图三：急中生智；分头行动", "text": ["就在这时，我[[急中生智]]，毫不犹豫地吩咐妹妹：“快，把卡捡起来！我先去追那个叔叔。”妹妹立刻弯下腰，小心翼翼地把那张卡拾起。与此同时，我鼓起勇气，迈开双腿拼命追赶，一边跑一边大声喊：“叔叔！请等一等！您的卡掉在地上了！”", "嘈杂的人声和广播声混杂在一起，幸好我的喊声终于传进了叔叔的耳中。他脚步一顿，猛地停下，略显错愕地回过头来。只见他的眼神里闪过一丝疑惑，紧接着便露出惊讶和担忧。他似乎一下子意识到什么，赶紧折返回来。"]}, {"pic": "4", "note": "图四：归还；道谢；夸赞", "text": ["我和妹妹气喘吁吁地跑到他跟前，汗水顺着额头滑落。妹妹举起手，把卡递给叔叔，声音清脆而有礼貌：“叔叔，您的卡掉了。”叔叔连忙伸手接过，仔细一看，果然是自己的银行卡与乘车卡绑定在一起的多功能卡。他的脸上立刻浮现出轻松和感激的笑容，眉宇间的焦虑[[一扫而空]]。他弯下身子，真诚地说道：“谢谢你们！幸好你们发现了，不然我就麻烦大了！这张卡要是丢失，不光不能乘车，还可能造成财产损失，真的太感谢你们了！”", "妹妹奶声奶气地回答：“不客气，这是我们应该做的。”她小小的身影站在那儿，却显得格外坚定。叔叔听后，眼中闪烁着欣慰的光芒，甚至竖起了大拇指，夸赞我们说：“你们真是好孩子，既细心又乐于助人！”", "这一刻，我和妹妹的脸上都洋溢着灿烂的笑容，心里仿佛盛开了一朵花，芬芳而美丽。原来，帮助别人，不仅仅能让别人安心，也能让自己的内心收获满满的喜悦和自豪。"]}, {"pic": "end", "note": "结尾：回味＋俗话＋道理", "text": ["后来，我们也进了地铁车厢，我坐在位置上，还在回味刚刚的经历。妹妹小声对我说：“原来做一件小事，也能让人这么高兴啊。”我轻轻点头，心想：是啊，[[生活就像一面镜子，你对它微笑，它也会回报你笑容]]。", "俗话说：“赠人玫瑰，手留余香。”这件事让我真正体会到了这句话的含义。那一天，我不仅看了一场期待已久的电影，更上了一堂生动的人生课。我懂得了一个道理：善良和细心是最宝贵的品质。每当别人需要帮助的时候，我们若能勇敢地伸出援手，就能让世界少一些冷漠，多一份温情。"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "15/15", "words": "917", "info": "老师批注：非常流利，这是小六水平。正字：地（地势）／的（目的），豪（自豪）／毫（毫毛）", "segments": [{"pic": "start", "text": ["一个很平常的星期天早上，[[一轮红日]]在万里无云的天空上绽放出万丈光芒。清脆婉转的鸟鸣声[[此起彼伏]]，好像一首动听的交响乐，真是一个令人心旷神怡的早晨。"]}, {"pic": "1", "text": ["小文哥哥和小丽妹妹踏着轻快的脚步走向地铁站月台。他们刚放假，正赶上《哪吒2》这部儿童电影的首映。他们一想到今天要去看这部电影，就眼睛里冒出兴奋不已的光芒。", "正要到达闸门的时候，小丽和小文突然看到一个叔叔正急匆匆地越过他们。只见他背着双肩包，穿着干净整洁的衬衫和西裤，还有一双擦得锃亮的皮鞋。他脸上露出焦急的神情，大汗淋漓地飞奔向闸门，看上去好像是要上班迟到了。"]}, {"pic": "2", "text": ["到了闸门，叔叔[[手忙脚乱]]地掏出一张公交卡，“嘀”的一声，刷完卡，就像一阵风一样冲向地铁月台。他边跑边把公交卡塞回书包的口袋，却不料手一滑，公交卡从背包的口袋边掉在了地上。可是，叔叔丝毫没有察觉到，仍然行色匆匆地往前跑。", "小文和小丽看到眼前这一幕，大吃一惊，眼睛瞪得像铜铃，嘴巴张成一个“○”形，几乎可以放进一颗鸡蛋。小文想追赶叔叔，可是他本来运动能力就不是很好，又是一个小孩，就根本追不上他。"]}, {"pic": "3", "text": ["突然，他急中生智，[[灵机一动]]，心想：追不上可以大声喊呀！于是他大步流星地跑向叔叔，大声叫道：“叔叔，等一下，您的卡掉在地上啦！”无奈，青年叔叔还是没有听到。一旁的小丽见状，也在想：这里人山人海，要是卡被坏人拿走了，或者被人踩坏了，就糟了！于是，她毫不犹豫地拾起卡，立刻向哥哥和叔叔的方向追去。", "与此同时，小文还在追赶叔叔，他又提高声音努力想在嘈杂的人声和广播声中引起叔叔的注意力。幸好，叔叔这回终于听见了小文的喊声。他猛地停下脚步，转过头来，脸上露出迷惑的表情。他的目光在四周扫了一圈，像是在确定这句话是不是对他说的。"]}, {"pic": "4", "text": ["等他看到小文和举着卡的小丽气喘吁吁地跑到他面前时，他才[[恍然大悟]]，脸上露出了感激的笑容。他连忙接过卡，向兄妹二人连连道谢：“今天真是多亏了你们啦！你们真是我的小救星！这个巴士卡里存了很多钱，要是丢了，那我真的是损失惨重！”小文和小丽听了，心里甜滋滋的，比吃了蜜糖还甜。他们异口同声，奶声奶气地说：“不客气，叔叔！这是我们应该做的！”说完，他们彬彬有礼地向叔叔挥挥手道别，走进车厢。叔叔也开开心心地又踏上了自己的旅程。"]}, {"pic": "end", "text": ["俗话说：“赠人玫瑰，手留余香。”这件事让小丽和小文真正懂得了“助人为快乐之本”的道理。只要人人都献出一点爱，看到别人需要帮助的时候，都毫不犹豫地伸出援手，这个世界会变得更温暖。"]}]}}, "detective": [{"w": "地", "t": "地", "opts": ["地", "的", "得"], "ctx": "小文哥哥和小丽妹妹踏着轻快的脚步走向□铁站月台", "why": "“慢慢地走”“偷偷地看”——形容动作怎么样做，用“地”；“漂亮的花”说名词用“的”；“跑得快”在动作后面用“得”。小作者在这里写错过，要记：动作前面用“地”。", "hint": "动作前面 → 地"}, {"w": "自豪", "t": "豪", "opts": ["豪", "毫", "嚎"], "ctx": "原来，帮助别人，不仅仅能让别人安心，也能让自己的内心收获满满的喜悦和自□", "why": "“自豪”的“豪”下面是“豕”（猪），本来指豪猪，引申为了不起。“毫”下面是“毛”，是细毛（毫不犹豫）。小作者把“自豪”写成“自毫”过！", "hint": "自豪 → 下面是豕，不是毛"}, {"w": "穿着衬衫", "t": "衬", "opts": ["衬", "村", "忖"], "ctx": "一个穿着□衫、系着领带的中年叔叔急匆匆地冲出闸门，脸上带着焦急的神情，似乎要赶去上班", "why": "“衬衫”的“衬”是衣字旁，衣服。“村”是村子（木字旁），“忖”是思忖。", "hint": "衣服 → 衣字旁"}, {"w": "穿着衬衫", "t": "衫", "opts": ["衫", "杉", "彡"], "ctx": "一个穿着衬□、系着领带的中年叔叔急匆匆地冲出闸门，脸上带着焦急的神情，似乎要赶去上班", "why": "“衬衫”的“衫”是衣字旁加三撇。“杉”是杉树（木字旁）。", "hint": "衣字旁＋三撇"}, {"w": "大汗淋漓地飞奔", "t": "淋", "opts": ["淋", "林", "琳"], "ctx": "他脸上露出焦急的神情，大汗□漓地飞奔向闸门，看上去好像是要上班迟到了", "why": "“大汗淋漓”“淋雨”的“淋”是三点水，水往下流。“林”是树林，“琳”是美玉。", "hint": "水往下流 → 三点水"}, {"w": "大汗淋漓地飞奔", "t": "漓", "opts": ["漓", "离", "璃"], "ctx": "他脸上露出焦急的神情，大汗淋□地飞奔向闸门，看上去好像是要上班迟到了", "why": "“淋漓”的“漓”是三点水加“离”。“离”是离开，“璃”是玻璃。", "hint": "三点水＋离"}, {"w": "手忙脚乱地掏出", "t": "掏", "opts": ["掏", "淘", "陶"], "ctx": "到了闸门，叔叔手忙脚乱地□出一张公交卡，“嘀”的一声，刷完卡，就像一阵风一样冲向地铁月台", "why": "“掏出”的“掏”是提手旁，用手往外拿。“淘”是淘米（三点水），“陶”是陶器。", "hint": "用手拿 → 提手旁"}, {"w": "拔腿就冲", "t": "腿", "opts": ["腿", "退", "褪"], "ctx": "刷卡成功的“滴”声响起后，他几乎是拔□就冲，步伐如风，直奔旋转扶梯的方向", "why": "“腿”是月肉旁，身体的部位都用月字旁。“退”是后退，“褪”是褪色（衣字旁）。", "hint": "身体部位 → 月字旁"}, {"w": "丝毫没有察觉", "t": "毫", "opts": ["毫", "豪", "亳"], "ctx": "可是，叔叔丝□没有察觉到，仍然行色匆匆地往前跑", "why": "“毫不犹豫”的“毫”是细毛，下面是“毛”；一毫都没有＝一点也不。“豪”是豪杰、自豪，下面是“豕”（猪）。", "hint": "下面是毛"}, {"w": "脚步一顿", "t": "顿", "opts": ["顿", "吨", "钝"], "ctx": "他脚步一□，猛地停下，略显错愕地回过头来", "why": "“顿时”的“顿”是左边“屯”右边“页”。“吨”是重量（口字旁），“钝”是不锋利（金字旁）。", "hint": "屯＋页"}], "audio": {"basic": {"src": "audio/mrt-card_basic.mp3", "cues": [["mrt-card|basic|1|0", 0.0], ["mrt-card|basic|2|0", 44.29], ["mrt-card|basic|3|0", 61.29], ["mrt-card|basic|4|0", 81.84], ["mrt-card|basic|4|1", 111.07], ["mrt-card|basic|4|2", 129.58], ["mrt-card|basic|end|0", 145.64]]}, "adv": {"src": "audio/mrt-card_adv.mp3", "cues": [["mrt-card|adv|start|0", 0.0], ["mrt-card|adv|1|0", 39.91], ["mrt-card|adv|1|1", 86.65], ["mrt-card|adv|2|0", 124.81], ["mrt-card|adv|2|1", 139.81], ["mrt-card|adv|3|0", 162.3], ["mrt-card|adv|3|1", 185.76], ["mrt-card|adv|4|0", 206.69], ["mrt-card|adv|4|1", 248.05], ["mrt-card|adv|4|2", 267.95], ["mrt-card|adv|end|0", 287.67], ["mrt-card|adv|end|1", 311.15]]}, "qx": {"src": "audio/mrt-card_qx.mp3", "cues": [["mrt-card|qx|start|0", 0.0], ["mrt-card|qx|1|0", 19.87], ["mrt-card|qx|1|1", 39.95], ["mrt-card|qx|2|0", 66.49], ["mrt-card|qx|2|1", 92.69], ["mrt-card|qx|3|0", 112.68], ["mrt-card|qx|3|1", 147.18], ["mrt-card|qx|4|0", 177.35], ["mrt-card|qx|end|0", 226.92]]}}}, {"id": "running-tap", "title": "食堂洗手没有关水龙头", "cat": "falls", "grade": "P4", "pics": 4, "date": "2025-08-26", "source": "蔡老师课件", "imgs": ["img/H11_tap_1.jpg", "img/H11_tap_2.jpg", "img/H11_tap_3.jpg", "img/H11_tap_4.jpg"], "vocab": ["休息节", "食堂", "洗手", "忘记关水龙头", "学长", "宣传海报", "节约用水", "浪费水资源"], "drafts": ["img/draft_20250828_180925.jpg", "img/draft_20250828_180930.jpg", "img/draft_20250828_180942.jpg", "img/draft_20250828_180945.jpg", "img/draft_20250828_181000.jpg", "img/draft_20250828_181006.jpg"], "versions": {"basic": {"label": "范文 · 基础版", "words": "679", "info": "参考范文 679字（考场最少500字）", "segments": [{"pic": "1", "note": "图一：下课奔向食堂；饿得前胸贴后背", "text": ["“叮铃铃……”下课的铃声响了，校园里顿时沸腾起来。同学们像一群欢快的小鸟，叽叽喳喳地飞出课室，奔向食堂。", "小文跟着人潮，大步流星地来到食堂。只见食堂里人山人海，同学们很有秩序地排着队，等待买午餐。小文摸了摸肚子，肚子咕噜咕噜直叫。因为他早餐没有在家吃饭，上了两堂课之后，早已饿得[[前胸贴后背]]了。小文径直走到自己最爱吃的鸡饭摊前，闻到香喷喷的炸鸡翅香味，他馋得口水直流。"]}, {"pic": "2", "note": "图二：狼吞虎咽；去洗手", "text": ["好不容易轮到小文，他点了餐，狼吞虎咽地吃了起来。十五分钟过后，小文像风卷残云般，把一盘鸡饭吃了个精光。他心满意足地擦了擦嘴巴，手指上油腻腻的。归还碗盘后，小文走到洗手池洗手。"]}, {"pic": "3", "note": "图三：想着零用钱，忘了关水龙头；学长叫住他", "text": ["就在他洗手时，忽然想起妈妈昨晚给他零用钱，允许他去书店买变形金刚。想到这里，他的心里乐开了花，嘴角止不住地上扬，甚至哼起了小曲儿。手下的水龙头“哗啦啦”地流着，[[像一条调皮的小溪欢快地奔跑着]]。小文把手洗得干干净净，却转身就走开了，忘了关水龙头。", "这时，学校的首席学长恰好路过，眼尖的他，一眼就看见水哗哗地流着，心里一惊，立刻大声喊道：“王小文！快回来！你忘了关水龙头！”"]}, {"pic": "4", "note": "图四：学长指着海报教育；小文道歉", "text": ["小文听到声音，连忙跑回来，急急忙忙关掉水龙头。学长皱着眉头，指向墙上的海报，语气严肃地说：“[[水是生命之源]]。老师上周在《好公民的品德课》才提醒过我们，不应该浪费水资源。节约用水，人人有责。你看，这样让水白白流走，多可惜啊！”", "小文低下头，脸涨得通红，结结巴巴地说：“对不起……是我一时大意了。我以后一定会注意的。”他关紧水龙头之后，才去书局买他的变形金刚。"]}, {"pic": "end", "text": ["俗话说：“经一事，长一智。”经过这件事之后，小文明白了节约用水的重要性。从此以后，他再也不会忘记关闭水龙头了。"]}]}, "adv": {"label": "范文 · 高阶版", "words": "1250", "info": "识字进阶版本 · 食堂的场面描写和吃鸡饭的细节", "segments": [{"pic": "1", "note": "图一：下课的场面；食堂的长龙和香味", "text": ["“叮铃铃……”下课的铃声如清脆悦耳的银铃声响起，在校园上空回荡，顿时驱散了课室里的宁静。原本安静写字、做笔记的同学们，像一群久困笼中的小鸟，叽叽喳喳地冲出课室，[[三五成群]]地奔向食堂。走廊里脚步声、说笑声、嬉闹声交织在一起，汇成了一首热闹的“午餐交响曲”。", "从课室里涌出的同学，有的直奔食堂，有的去操场打球，还有的聚在一起聊天。小文跟着人潮，大步流星地朝食堂走去。阳光透过走廊的窗户洒下来，在地面上映出一格格明亮的光影，他的脚步踩在光影之间，心情也随着越来越浓的饭菜香而雀跃起来。", "到了食堂门口，他放眼望去，只见食堂人山人海，热气腾腾的饭菜香味扑鼻而来。各个档口前，同学们排着整齐的长队，像一条条缓缓流动的长龙。蒸汽氤氲中，扬州炒饭、鱼丸面、萝卜排骨汤的香味混在一起，令人[[垂涎欲滴]]。"]}, {"pic": "2", "note": "图二：吃鸡饭的细节描写", "text": ["小文揉了揉唱起空城计的肚子。因为早上他没来得及吃早餐，上了两节课后，早已饿得前胸贴后背。像被香味牵着鼻子走一般，他径直来到自己最爱的鸡饭档口。只见档口的炸锅里，金黄的炸鸡翅正“滋啦滋啦”地冒着香气，表面酥脆，香味浓郁，像在向他招手。小文咽了咽口水，美滋滋地想：这下可有口福了！", "好不容易轮到小文，他迫不及待地点了一份鸡饭。端到餐桌前，他也顾不上形象，拿起勺子便埋头就吃。炸鸡翅外皮酥脆、肉质鲜嫩，米饭粒粒分明、香气扑鼻，他狼吞虎咽地吃着，像一阵风卷残云般。不一会儿，盘子里就只剩下几根鸡骨头和一点饭粒。小文心满意足地靠在椅背上，还抹了抹嘴角的油渍。"]}, {"pic": "3", "note": "图三：洗手时想起零用钱；忘关水龙头；学长喊住他", "text": ["归还碗盘后，他走到洗手池洗手。洗手池边，清凉的水“哗啦啦”地流下来，溅起一朵朵水花，[[像活泼的精灵在他指缝间穿梭]]。他正仔细地用洗手液搓着手指间的油渍，忽然想起一件让他眉开眼笑的事——昨晚，妈妈给了他一笔零用钱，并答应他今天可以去书局买自己梦寐以求的变形金刚玩具。想到这里，他心里乐开了花，嘴角止不住地上扬，还情不自禁地哼起了小曲儿。", "就在这欢快的心情中，他洗好了手，却下意识地转身走开，压根没注意到水龙头还在大开着。恰巧正在这时，学校的首席学长路过。学长一眼就看见水哗哗地流个不停，眉头顿时皱了起来，脚步也加快了几分。他语气严肃而又带着关切地喊道：“王小文！快回来！你忘了关水龙头！”"]}, {"pic": "4", "note": "图四：学长指海报教育；小文认错", "text": ["小文听到喊叫声，吓了一跳，赶忙回过头来，见学长正用严厉的目光看着自己。他脸上的笑容顿时凝固，低着头，快步跑回去，急急忙忙地把水龙头关上。", "学长走上前，指了指墙上的海报——上面印着一行鲜红的大字：“水是生命之源，节约用水，从我做起。”他皱着眉头说道：“小文，老师上周才提醒过大家，节约用水人人有责。水资源来之不易，你怎么可以这样浪费呢？”", "小文的耳根慢慢泛红，心里像压了一块石头般[[沉甸甸]]的。他结结巴巴地说：“对……对不起，是我一时大意了。我以后一定会注意的。”", "学长见他态度诚恳，拍了拍他的肩膀，语气缓和下来：“知错能改，善莫大焉，希望你真的能记住今天的教训。”小文点点头，把水龙头又检查了一遍，确认关紧后，才慢慢走向书局。一路上，他脑海里回荡的不是即将买到的变形金刚，而是那句——“水是生命之源，节约用水，从我做起。”"]}, {"pic": "end", "text": ["俗话说：“经一事，长一智。”从那天起，无论是在学校还是在家里，小文每次用水后都会仔细检查，关紧水龙头。这次小小的疏忽，让他明白了一个朴素而深刻的道理：珍惜资源，从身边的小事做起；节约用水，不只是口号，而应该是日常习惯。"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "20/15（老师：可以加5分奖励分，堪称完美）", "words": "1000", "info": "老师批注：非常好。第一段不要太长。PS：“没有想完”这个说法可以用“想到这里”。正字：的（的确）／地（地面）", "segments": [{"pic": "start", "note": "第一段不要太长", "text": ["“铃铃铃……”清脆悦耳的铃声响起，本来安安静静的教室顿时像炸开了锅一般，同学们迫不及待地冲出教室门，涌入了走廊，有的飞奔向食堂享受美食，填饱肚子；有的跑向操场踢球做运动，想和朋友们玩个痛快。还有同学找到伙伴，三五成群地坐在走廊的椅子上[[聊得热火朝天]]。"]}, {"pic": "1", "text": ["小明跟着人潮，兴奋地奔向食堂。他的肚子早已饿得前心贴后背，[[大唱空城计]]了。闻着各个摊位散发出的香味，他忍不住口水直流。小明好不容易排了个长队，买到他心爱的海南鸡饭，找到一个空座位，然后不顾自己的形象就开始狼吞虎咽地吃了起来。不久后就风卷残云般地吃完了，碗里只剩下几个鸡骨头了。他站起身来，把碗归还到碗盘归还处后，心满意足地摸了摸撑得圆滚滚的肚皮，慢悠悠地走向了洗手池洗手。"]}, {"pic": "2", "text": ["小明抹上洗手液，打开了水龙头。顿时，清凉的水“哗啦啦”地流下来，像一条小瀑布一样溅起一朵朵小水花。他仔细地搓着指缝间的油渍，水凉丝丝的，真舒服。突然，小明想起上次华文测验他得了满分，所以妈妈奖励小明一个大红包，里面有五十元钱，他可以到学校小卖部买[[心仪已久]]的奥特曼玩具！想到这里，他立刻心里乐开了花，嘴角忍不住地往上翘，还哼起了小曲儿。洗完手，他满脑子都装着奥特曼，把还在流着水的水龙头忘得一干二净，抛到了九霄云外，转身就往小卖部跑去。"]}, {"pic": "3", "note": "这里分段", "text": ["这时，首席学长小文刚好路过，他看到眼前这一幕，大吃一惊。他气不打一处来，因为今早集合的时候，级任老师才在礼堂宣传节约用水的重要性，可是小明把级任老师的话当成耳边风。于是他严厉地叫住了小明：“李小明！你给我过来，把这个水龙头关好！”小明听了，顿时一愣，如同当头棒喝，又好像[[冷水兜头泼下]]，让小明一下子从迷糊中清醒过来。"]}, {"pic": "4", "text": ["于是，小明转身三步并作两步地跑回来，关紧水龙头，然后红着脸低下了头，好像在等待暴风雨的到来。小文眉头紧锁，眼睛瞪得像铜铃，指着墙壁上的海报，火冒三丈地说：“李小明！水是地球上珍贵的资源！怎么可以这样浪费呢？还有，今天早上级任老师都提醒过大家了，节约用水，人人有责。你怎么可以[[明知故犯]]呢？”", "小明顿时心里像压了一块大石头，沉甸甸的，喉咙像被堵住了，说不出话来。他手指不停地搓着衣角，心里惭愧又后悔，像打翻了五味瓶一样，五味杂陈。他连连道歉：“对不起学长！我以后再也不会浪费水了！”小文脸上阴转晴，说：“知错能改，还是好学生。”"]}, {"pic": "end", "text": ["小明看着小文渐渐远去的背影，攥紧拳头，心里暗暗下定决心，水是生命之源，一定要节约每一滴水，从今以后，要从自己做起，让节约用水变成好习惯。"]}]}}, "detective": [{"w": "的", "t": "的", "opts": ["的", "地", "得"], "ctx": "有□跑向操场踢球做运动，想和朋友们玩个痛快", "why": "“我的书”“美丽的花”——名词前面用“的”；“慢慢地走”动作前面用“地”；“笑得开心”动作后面用“得”。", "hint": "名词前面 → 的"}, {"w": "狼吞虎咽", "t": "狼", "opts": ["狼", "浪", "狠"], "ctx": "小明好不容易排了个长队，买到他心爱的海南鸡饭，找到一个空座位，然后不顾自己的形象就开始□吞虎咽地吃了起来", "why": "“狼吞虎咽”的“狼”是反犬旁，狼是动物。“浪”是海浪（三点水），“狠”是凶狠（反犬旁加艮，但右边不一样）。", "hint": "动物 → 反犬旁＋良"}, {"w": "狼吞虎咽", "t": "吞", "opts": ["吞", "舌", "吝"], "ctx": "小明好不容易排了个长队，买到他心爱的海南鸡饭，找到一个空座位，然后不顾自己的形象就开始狼□虎咽地吃了起来", "why": "“吞”是上面“天”下面“口”，一口吞下去。“舌”是舌头，“吝”是吝啬。", "hint": "天＋口"}, {"w": "狼吞虎咽", "t": "咽", "opts": ["咽", "烟", "因"], "ctx": "小明好不容易排了个长队，买到他心爱的海南鸡饭，找到一个空座位，然后不顾自己的形象就开始狼吞虎□地吃了起来", "why": "“狼吞虎咽”的“咽”是口字旁加“因”，吞下去。“烟”是火字旁，“因”是因为。", "hint": "口字旁＋因"}, {"w": "礼堂", "t": "礼", "opts": ["礼", "札", "扎"], "ctx": "他气不打一处来，因为今早集合的时候，级任老师才在□堂宣传节约用水的重要性，可是小明把级任老师的话当成耳边风", "why": "“有礼貌”的“礼”是示字旁加“乚”。“札”是木字旁，“扎”是提手旁。", "hint": "示字旁（礼节）"}, {"w": "严厉", "t": "严", "opts": ["严", "岩", "炎"], "ctx": "于是他□厉地叫住了小明：“李小明", "why": "“严肃”的“严”上面是“业”的变形，一横在上。“岩”是岩石，“炎”是炎热（两个火）。", "hint": "上面一横一竖，不是山"}, {"w": "严厉", "t": "厉", "opts": ["厉", "励", "历"], "ctx": "于是他严□地叫住了小明：“李小明", "why": "“严厉”的“厉”是厂字头加“万”。“励”是奖励（多一个力），“历”是历史（里面是力）。", "hint": "厂＋万，没有力"}, {"w": "一愣", "t": "愣", "opts": ["愣", "楞", "冷"], "ctx": "”小明听了，顿时一□，如同当头棒喝，又好像冷水兜头泼下，让小明一下子从迷糊中清醒过来", "why": "“愣住”的“愣”是竖心旁，心里一下子反应不过来。“楞”是木字旁，“冷”是冷热的冷。", "hint": "发呆是心里的事 → 竖心旁"}, {"w": "沉甸甸", "t": "沉", "opts": ["沉", "沈", "忱"], "ctx": "小明顿时心里像压了一块大石头，□甸甸的，喉咙像被堵住了，说不出话来", "why": "“沉”是三点水，沉到水里去；“沉浸”就是整个人泡在里面。“沈”是姓氏，“忱”是热忱。", "hint": "三点水＋冘"}, {"w": "美滋滋", "t": "滋", "opts": ["滋", "兹", "磁"], "ctx": "小文咽了咽口水，美□滋地想：这下可有口福了", "why": "“滋味”“滋滋响”的“滋”是三点水。“兹”没有三点水，“磁”是磁铁（石字旁）。", "hint": "三点水＋兹"}], "audio": {"basic": {"src": "audio/running-tap_basic.mp3", "cues": [["running-tap|basic|1|0", 0.05], ["running-tap|basic|1|1", 12.14], ["running-tap|basic|2|0", 43.5], ["running-tap|basic|3|0", 64.38], ["running-tap|basic|3|1", 92.19], ["running-tap|basic|4|0", 105.65], ["running-tap|basic|4|1", 130.32], ["running-tap|basic|end|0", 144.64]]}, "adv": {"src": "audio/running-tap_adv.mp3", "cues": [["running-tap|adv|1|0", 0.0], ["running-tap|adv|1|1", 29.72], ["running-tap|adv|1|2", 55.95], ["running-tap|adv|2|0", 80.43], ["running-tap|adv|2|1", 112.98], ["running-tap|adv|3|0", 143.7], ["running-tap|adv|3|1", 182.36], ["running-tap|adv|4|0", 211.1], ["running-tap|adv|4|1", 226.56], ["running-tap|adv|4|2", 248.22], ["running-tap|adv|4|3", 260.95], ["running-tap|adv|end|0", 290.53]]}, "qx": {"src": "audio/running-tap_qx.mp3", "cues": [["running-tap|qx|start|0", 0.0], ["running-tap|qx|1|0", 28.03], ["running-tap|qx|2|0", 69.15], ["running-tap|qx|3|0", 117.95], ["running-tap|qx|4|0", 156.16], ["running-tap|qx|4|1", 187.41], ["running-tap|qx|end|0", 216.54]]}}}, {"id": "queue-jumper", "title": "同学插队，女孩向老师告状", "cat": "guts", "grade": "P4", "pics": 4, "date": "2025-09-02", "source": "蔡老师课件", "imgs": ["img/H12_queue_1.jpg", "img/H12_queue_2.jpg", "img/H12_queue_3.jpg", "img/H12_queue_4.jpg"], "vocab": ["休息时间", "插队", "校车", "批评", "办公室", "告诉", "行为", "排队"], "drafts": ["img/draft_20250910_170854.jpg", "img/draft_20250910_170901.jpg", "img/draft_20250910_170907.jpg", "img/draft_20250910_170912.jpg"], "versions": {"basic": {"label": "范文 · 基础版", "words": "520", "info": "参考范文（时间来不及可不写最后一段）", "segments": [{"pic": "1", "note": "图一：食堂排队；大明插队", "text": ["在一个阳光明媚的星期三早晨，休息时间一到，学生们陆陆续续走到食堂买东西吃。大家都在云吞面和鸡饭摊位前排队，一边谈天说地，一边等候，气氛十分轻松。然而，就在大家[[规规矩矩]]排队时，大明却突然插队到小丽的前面，引起了小丽的不满。站在队伍后面的小美把这一幕都看在眼里。"]}, {"pic": "2", "note": "图二：上校车又插队；小美上前阻止", "text": ["放学时，学生们都乖乖地排队上校车。可是，大明依旧没有遵守秩序，他不顾同学们的提醒，又一次插队上车，把原本整齐的队伍弄得一片混乱。几个同学皱起眉头，觉得大明的行为实在不可取。小美说：“大明，你不可以这样！”大明却恶狠狠地对小美说：“不要你[[多管闲事]]！”"]}, {"pic": "3", "note": "图三：小美到办公室告诉老师", "text": ["第二天，小美决定把大明的行为告诉老师。她走到办公室，把事情的经过清楚地向王老师说明。王老师听了之后，点点头，表示会处理。她语重心长地告诉小美：“你做得对，遇到不守规矩的行为要及时反映，这样大家才能有一个公平的生活环境。”"]}, {"pic": "4", "note": "图四：老师批评大明；大明道歉", "text": ["不一会儿，当同学们吃完饭，排队进课室时，老师郑重地批评了大明，指出他昨天两次插队的错误行为。大明脸一下子红了，他意识到自己的任性给同学们带来了麻烦，连忙低下头，向大家道歉。王老师特地盯着大明，让他好好排队。"]}, {"pic": "end", "text": ["俗话说：“经一事，长一智。”经过这件事后，大明改掉了坏习惯，开始自觉地排队，不再插队。同学们也原谅了他，大家的关系又恢复了和谐。从此以后，每次无论是去食堂还是上校车，队伍里都[[井然有序]]，再也没有人插队了。"]}]}, "adv": {"label": "范文 · 高阶版", "words": "1200", "info": "识字进阶版 · 小美“回家后翻来覆去地想”的心理描写", "segments": [{"pic": "1", "note": "图一：食堂的香味；大明插队；小美看在眼里", "text": ["在一个阳光明媚的星期三早晨，天空湛蓝如洗，微风轻拂过校园里的旗杆，国旗迎风飘扬。下课铃声一响起，学生们就兴致勃勃地走向食堂。食堂里的食物摊位，香气扑鼻，云吞面的清香、鸡饭的油香扑面而来，让人[[食指大动]]。大家规规矩矩地排着队，一边谈天说地，一边等待，气氛十分轻松愉快。", "就在这时，大明却突然快步冲上前，径直插到队伍最前面。他脸上带着一丝得意，好像占了什么便宜。后面的同学一阵错愕，纷纷皱起眉头，小丽忍不住小声嘀咕：“这样插队，太不公平了！”她的声音虽小，却带着不满。站在一旁的小美也把这一幕都看在眼里，心里像压了一块石头，十分不舒服。"]}, {"pic": "2", "note": "图二：校车站又插队；小美勇敢指出；大明恶狠狠", "text": ["放学时，大家在校车站整齐地排队。夕阳的余晖洒在队伍上，学生们有说有笑，秩序井然。可是，大明依旧[[我行我素]]，仿佛没有从上午的插队事件里学到教训。他不顾同学们的提醒，突然又一次横插进队伍里，把原本整齐的队伍弄得一片混乱。几个同学怒目而视，有人忍不住抱怨：“怎么又是他！”队伍里的气氛顿时紧张起来。", "小美再也忍不住了，走上前皱着眉头对他说：“大明，你不可以这样！”她的声音坚定，不容置疑。然而，大明脸色一沉，恶狠狠地瞪了小美一眼，冷冷地吐出一句：“不要你多管闲事！”那一刻，空气似乎凝固了，几位同学[[面面相觑]]，心里为小美捏了一把汗。"]}, {"pic": "3", "note": "图三：心理描写→鼓起勇气告诉老师", "text": ["回到家后，小美还是觉得不能[[坐视不理]]。她翻来覆去地想着：“如果我沉默，大明就会一直这样下去，同学们只会越来越反感。老师常说‘勿以恶小而为之’，这件事必须有人站出来。”想到这里，她下定决心要把大明的行为告诉老师。", "第二天一大早，小美鼓起勇气走进办公室，把事情的经过一五一十地向王老师说明。她的声音虽然有些颤抖，但目光坚定。王老师认真地听着，不时点头，最后语重心长地说：“你做得对。遇到不守规矩的行为要及时反映，这样大家才能有一个公平的生活环境。记住，‘勿以善小而不为，勿以恶小而为之’。”小美听了，心中一阵轻松，觉得老师的话像一股暖流，让她更加坚定了自己的选择。"]}, {"pic": "4", "note": "图四：老师批评；大明无地自容，道歉", "text": ["不一会儿，当同学们吃完饭，排队进课室时，王老师走进来，神情严肃。她示意大家安静，然后郑重其事地批评了大明，点名指出他昨天两次插队的错误行为。老师的话[[铿锵有力]]，在教室里回荡：“大明，你的行为破坏了秩序，也伤害了同学们的感受。要记住，‘不以规矩，不能成方圆’。”", "大明的脸一下子涨得通红，他低下头，额头冒出细汗，嘴唇抖动着却说不出话来。同学们的眼神齐刷刷落在他身上，他只觉得无地自容。过了很久，他终于鼓起勇气，低声说：“对不起，是我错了，请大家原谅我。”声音虽然轻，却带着真诚。王老师严肃地点点头，说：“知错能改，善莫大焉。希望你能以此为戒。”"]}, {"pic": "end", "text": ["从那天起，大明真的变了。无论是去食堂还是上校车，他总是乖乖排在队伍后面，再也没有插队。偶尔见到有人想要插队，他反而会上前提醒：“大家要守规矩，排队才公平。”同学们见他改过自新，渐渐释怀，纷纷原谅了他。", "看着队伍里秩序井然的身影，小美心里感慨万分。这件事让她更加坚信：勇敢指出错误，维护原则，才能换来真正的公平与尊重。大明也从中领悟到：“经一事，长一智。”他用实际行动证明了，错误并不可怕，可怕的是一错再错。"]}]}, "qx": {"label": "小作者版 · 手稿转录", "words": "约 850", "info": "这一篇在课件里没有找到老师的批改版，这是小作者手写原稿的转录（含她自己在稿上加的字）", "segments": [{"pic": "1", "text": ["一个阳光明媚、鸟语花香的早上，阳光温柔地洒进了安安静静的教室里，让到处都照得明晃晃、金亮亮的。突然，休息节的铃声响起，本来鸦雀无声的教室顿时炸开了锅，同学们迫不及待地冲了出去，飞奔向食堂。一阵阵让人口水直流的饭菜香味钻进了同学们的鼻子里，让他们的肚子更大声地唱起了空城计。", "小美跟着人潮，进了食堂就开始在她最喜欢的云吞面摊位前排起了队。这时，一个高大的五年级同学大华大摇大摆地走了过来。没想到，他用手推了一下排在小美前面的小文，然后一个箭步冲到她前面。小美看见了，大吃一惊，那些看到大华插队的同学也向他投去了怒气冲冲的目光，可是没有人上前去阻止大华。小美把他的行为看在了眼里。"]}, {"pic": "2", "text": ["“铃铃铃……”放学了，小美已经把在休息时间发生的事忘得一干二净，抛到九霄云外了。她踏着轻快的脚步，走出了校门，脸上挂着灿烂的微笑走向了会把她送回家的校车。她像平时一样排在了几个二年级学生的后面。突然，一个男同学走了过来。小美看见了他，就感觉他很眼熟。原来是那个在食堂里插队的五年级学生，大华。他又一次走上前，三步并作两步地插在了一位男同学的前面。大华的脸上甚至还露出了得意洋洋的笑容。那位被他插队的男同学吓呆了，嘴巴张得大大的，眼睛瞪得比铜铃还大。小美看不下去了，她伸出一只手，皱着眉头大声阻止道：“这位同学，请不要插队，这是不好的行为。快到队伍后面排队！”说完，小美看着大华，叉着腰，双手握拳，等待着他的回应。大华缓缓转过头，眼神四处张望，然后锁定在小美身上。“不要你多管闲事，我想插队就插队！”他恶狠狠地说，还吐了吐舌头。"]}, {"pic": "3", "text": ["第二天，小美决定把大华总是插队的毛病告诉老师。她早上到学校后就立刻放下书包往办公室走。小美敲了敲门，然后走进了房间。“老师，早上好，大华这几天一直在插队……”于是，小美把事情一五一十地说了一遍。老师听了，严肃地点了点头，说：“谢谢你提醒我，我会处理的。”"]}, {"pic": "4", "text": ["休息时间到了，小美又在排队买饭。大华从不远处冲了过来，这次他的胆子更大了，他直接对排在前面的同学说：“闪开，闪开！”那位同学看着人高马大的大华敢怒而不敢言，低着头，往后退了一步。这时，老师走了过来，她已经把大华的行为看在眼里。“林大华！插队是一个很不好的行为！你有没有意识到自己的任性给别人造成了很大的麻烦？”大华听了，脸一下子红得像一个番茄，他低下头，向老师和同学们诚恳地道歉后，灰溜溜地走到了队伍的后面开始排队。"]}, {"pic": "end", "text": ["俗话说：“经一事，长一智。”经过这件事后，大华改掉了他插队的行为，开始遵守规矩，不再插队。别的同学们也都原谅了他，大家的关系又恢复了和谐。"]}]}}, "detective": [{"w": "恢复了和谐", "t": "谐", "opts": ["谐", "偕", "皆"], "ctx": "别的同学们也都原谅了他，大家的关系又恢复了和□", "why": "“和谐”的“谐”是言字旁，说话合得来。“偕”是偕同（单人旁），“皆”是都。", "hint": "言字旁＋皆"}, {"w": "叉着腰", "t": "叉", "opts": ["叉", "又", "义"], "ctx": "”说完，小美看着大华，□着腰，双手握拳，等待着他的回应", "why": "“双手叉腰”的“叉”是“又”加一点。“又”没有点，“义”是义气。", "hint": "又＋一点"}, {"w": "双手握拳", "t": "握", "opts": ["握", "屋", "渥"], "ctx": "”说完，小美看着大华，叉着腰，双手□拳，等待着他的回应", "why": "“握拳”“握手”的“握”是提手旁加“屋”。“屋”是房屋，“渥”是三点水。", "hint": "用手握 → 提手旁"}, {"w": "双手握拳", "t": "拳", "opts": ["拳", "卷", "券"], "ctx": "”说完，小美看着大华，叉着腰，双手握□，等待着他的回应", "why": "“握拳”的“拳”下面是“手”，手握成拳头。“卷”下面是卩（试卷），“券”下面是刀（奖券）。", "hint": "下面是手"}, {"w": "缓缓转过头", "t": "缓", "opts": ["缓", "暖", "援"], "ctx": "大华□缓转过头，眼神四处张望，然后锁定在小美身上", "why": "“缓缓地”“缓慢”的“缓”是绞丝旁，慢慢的。“暖”是温暖（日字旁），“援”是援助（提手旁）。", "hint": "绞丝旁＋爰"}, {"w": "多管闲事", "t": "管", "opts": ["管", "菅", "官"], "ctx": "“不要你多□闲事，我想插队就插队", "why": "“不管”“管理”的“管”是竹字头，本来是竹管。“官”是官员，“菅”是草字头。", "hint": "竹字头"}, {"w": "多管闲事", "t": "闲", "opts": ["闲", "闭", "闹"], "ctx": "“不要你多管□事，我想插队就插队", "why": "“闲逛”“空闲”的“闲”是门字框里一个“木”。“闭”里面是“才”，“闹”里面是“市”。", "hint": "门里一棵树"}, {"w": "恶狠狠地说", "t": "恶", "opts": ["恶", "亚", "噩"], "ctx": "”他□狠狠地说，还吐了吐舌头", "why": "“恶狠狠”“凶恶”的“恶”上面是“亚”，下面是“心”，心里坏。“噩”是噩梦。", "hint": "亚＋心"}, {"w": "恶狠狠地说", "t": "狠", "opts": ["狠", "很", "恨"], "ctx": "”他恶□狠地说，还吐了吐舌头", "why": "“恶狠狠”“狠狠地”的“狠”是反犬旁，像凶狠的狗。“很”是很好（双人旁），“恨”是恨人（竖心旁）。", "hint": "凶狠像狗 → 反犬旁"}, {"w": "九霄云外", "t": "霄", "opts": ["霄", "宵", "消"], "ctx": "“铃铃铃……”放学了，小美已经把在休息时间发生的事忘得一干二净，抛到九□云外了", "why": "“九霄云外”的“霄”是雨字头，指天空最高处。“宵”是夜晚（宵夜），“消”是消失（三点水）。", "hint": "天上 → 雨字头"}], "audio": {"basic": {"src": "audio/queue-jumper_basic.mp3", "cues": [["queue-jumper|basic|1|0", 0.0], ["queue-jumper|basic|2|0", 32.91], ["queue-jumper|basic|3|0", 62.38], ["queue-jumper|basic|4|0", 87.48], ["queue-jumper|basic|end|0", 110.81]]}, "adv": {"src": "audio/queue-jumper_adv.mp3", "cues": [["queue-jumper|adv|1|0", 0.05], ["queue-jumper|adv|1|1", 32.08], ["queue-jumper|adv|2|0", 60.76], ["queue-jumper|adv|2|1", 92.66], ["queue-jumper|adv|3|0", 117.16], ["queue-jumper|adv|3|1", 140.15], ["queue-jumper|adv|4|0", 176.62], ["queue-jumper|adv|4|1", 204.65], ["queue-jumper|adv|end|0", 236.42], ["queue-jumper|adv|end|1", 257.36]]}, "qx": {"src": "audio/queue-jumper_qx.mp3", "cues": [["queue-jumper|qx|1|0", 0.05], ["queue-jumper|qx|1|1", 31.49], ["queue-jumper|qx|2|0", 65.97], ["queue-jumper|qx|3|0", 145.8], ["queue-jumper|qx|4|0", 177.07], ["queue-jumper|qx|end|0", 224.59]]}}}, {"id": "push-grandpa", "title": "玩游戏不写作业，还推倒爷爷", "cat": "falls", "grade": "P4", "pics": 4, "date": "2025-09-09", "source": "蔡老师课件", "imgs": ["img/H13_grandpa_1.jpg", "img/H13_grandpa_2.jpg", "img/H13_grandpa_3.jpg", "img/H13_grandpa_4.jpg"], "vocab": ["看电视", "提醒", "玩电子游戏", "推开", "道歉", "后悔"], "drafts": ["img/draft_20250915_214452.jpg", "img/draft_20250915_214458.jpg", "img/draft_20250915_214503.jpg", "img/draft_20250915_214521.jpg", "img/draft_20250915_214541.jpg", "img/draft_20250915_214600.jpg"], "versions": {"adv": {"label": "范文 · 老师版", "words": "960", "info": "参考范文 960字 · 另有一稿专练比喻句（见课件）", "segments": [{"pic": "1", "note": "图一：聚精会神看动画片；爷爷提醒", "text": ["在一个平常的星期三下午，小文像往常一样，坐在电视机前，[[聚精会神]]地看着他最喜欢的动画片。电视机里的画面不断变换，色彩斑斓，吸引着他的全部注意力，他看得津津有味。虽然时间已经不早了，但他依然沉浸在动画片的世界里，完全忘记了自己还有许多作业未完成。", "小文的爷爷坐在小文不远处的单人沙发椅上，看到小文双眼一直直勾勾地盯着电视，丝毫也没有想停下的意思，便善意地提醒道：“小文，已经下午四点了，该去做作业了，不然吃晚饭前是完不成的。”小文听到爷爷的提醒，心里不禁有些不舍，[[心不甘情不愿]]地关掉电视，走向沙发后面的书桌前。"]}, {"pic": "2", "note": "图二：写不了几行就玩游戏机；爷爷再劝；一把推开爷爷", "text": ["小文坐在书桌前，翻开作业本，拿起笔准备开始写作业。然而，他的心思却在别处，根本静不下心来。没写几行，他就忍不住放下笔，随手拿起旁边的游戏机，开始玩起了电子游戏。游戏的刺激感让他瞬间忘记了作业的存在。", "时间一分一秒地过去，爷爷看到小文还在玩游戏，便走过来轻声劝告道：“小文，别再玩游戏了，快做你的功课吧，否则你又得熬夜做作业，第二天就起不来，白天还在课室睡大觉，老师又要打电话过来投诉！”然而，小文正玩到兴头上，完全不愿意听从爷爷的劝告。他的脾气一上来，[[不耐烦]]地一把推开了爷爷，说道：“爷爷，别烦我，我就玩一会儿。”"]}, {"pic": "3", "note": "图三：爷爷跌倒；小文吓出冷汗，扶起爷爷道歉", "text": ["爷爷被小文这一推，失去了平衡，一下子跌倒在地。爷爷哎呀一声，惊叫了起来。看到摔倒在地的爷爷，小文[[吓出一身冷汗]]，心里顿时涌起了一股后悔和自责的情绪。他连忙放下游戏机，一个箭步跑上前，立刻扶起爷爷，不停地道歉：“爷爷，对不起，我不是故意的，您没事吧？”"]}, {"pic": "4", "note": "图四：爷爷训斥；小文认错；爷爷原谅，下不为例", "text": ["爷爷摸了摸疼痛的屁股和腰部，勉强地站了起来，挨着沙发椅坐了下来，这才没好声气地说：“你说呢？你为了玩游戏推倒我，你说呢？”小文知道这下闯祸了，低着头，任由爷爷的训斥。因为如果爷爷把这件事告诉爸爸妈妈，小文免不了又要吃一顿“[[竹笋炒肉丝]]”了。", "小文支支吾吾地说：“爷爷，我知错了……请您别告诉爸爸妈妈。我这就去完成作业。”爷爷摸了摸小文的头，表示原谅他了，希望他[[下不为例]]。小文用力地点了点头，就转身走向书桌前，坐下来认认真真地做作业。"]}, {"pic": "end", "text": ["从那以后，小文开始认真反思自己的行为。他明白了爷爷的[[良苦用心]]。他不再沉迷于游戏，而是合理安排时间，先完成作业，然后再适当地放松娱乐。每当爷爷提醒他做作业时，他总是乖乖地放下手中的东西，专心致志地完成任务。爷爷总是说：“小文长大了！”"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "20/15", "words": "1300", "info": "老师批注：原文1300多字，历史之最。正字：牌（卡牌）／脾（脾胃），在（实在）／再（再次）", "segments": [{"pic": "1", "text": ["在一个[[凉风习习]]的下午，一片沉甸甸的浓厚乌云盖住了太阳，让世界失去了色彩。天空还时不时轰隆隆地打雷，好像要下雨了。", "小文窝在家里，百无聊赖地在沙发上打滚。突然，他灵机一动，顿时像一个[[脚底装了弹簧]]的兔子蹦了起来，冲向了电视。他想：不如我就看电视吧！这本来就是一个月的假期，我要好好享受一下！说干就干，小文抓起遥控器，然后迫不及待地点开了他最喜欢的电视节目《动物世界》。这个电视节目会介绍很多动物，画面和情节都很精彩，可以让小文学到很多课本以外的知识。只见电视机里的画面不断变换，吸引着他的全部注意力，他看得津津有味。", "时间一分一秒地流逝，可是小文依然眼睛也不眨地盯着电视屏幕，完全忘记自己还有一堆学校作业没完成。爷爷见小文一直在看电视，丝毫没有停下的意思，便苦口婆心地劝告道：“孙子啊，已经下午五点了，要去做你的作业了，不然等一下吃晚饭前是完不成今天的任务的！”小文一听，虽然很想继续看电视，可是转念一想，如果不听的话，爷爷会告诉爸爸妈妈，然后他们就会把小文的屁股打开花的。毕竟，爷爷也是为他好。于是，想到这里，小文关掉电视，不情不愿地慢慢走向书桌。"]}, {"pic": "2", "text": ["小文提起笔，翻开作业本，可是，他的眼睛情不自禁地瞥向了放在旁边的游戏机。这个游戏机是小文爸爸昨天作为生日礼物送给小文的。游戏机的屏幕擦得锃亮，仿佛在[[诱惑]]小文说：“过来玩我吧！”小文非常喜欢这个游戏机，一直舍不得玩，可是现在他的手直痒痒。小文慢慢地靠近游戏机，防止爷爷发现，然后得意洋洋地抓起手柄，开了游戏机玩了起来。游戏的刺激感让他瞬间忘记了作业的存在，把事情忘得一干二净，抛到九霄云外了。", "过了一会儿，游戏的嘀嘀声让爷爷闻声而来。他一看见小文又被别的东西吸引住，就叹了一口气，走过去提醒他：“小文啊，快点去写作业了，你看都四点了，等一下作业真的完不成的话你又要熬夜，小朋友要养成‘[[今日事，今日毕]]’的好习惯！”然而，小文把爷爷的话当成了耳边风，因为现在游戏正在关键时刻。他一把推开爷爷，不耐烦地嘀咕道：“我就想玩会儿嘛，等会儿再写作业。”"]}, {"pic": "3", "text": ["爷爷被小文这一推，失去了平衡，一下子跌倒在地。他发出一阵疼痛的喊声，试着站起来，可是脚扭伤了，跌倒在地。小文发现后，大吃一惊，顿时急得像热锅上的蚂蚁，赶紧站了起来，一个箭步冲上前，小心翼翼地把爷爷扶了起来，安顿在了附近的沙发上。"]}, {"pic": "4", "text": ["看到爷爷疼得龇牙咧嘴的样子，小文急得冷汗直流，心里顿时涌起了一股自责、后悔和担心。“对不起，爷爷，我不应该一直不听您的话，又继续玩游戏，更不应该一气之下把您推倒，让您受伤。我知道错了，您可以原谅我吗？”爷爷摸了摸疼痛的脚腕，皱着眉头回答道：“你说呢？你想要玩游戏，我明白。可是你要知道情况是什么，什么时候可以玩，什么时候不能玩。还有，你要[[尊敬长辈]]，不能一不开心就推倒他们。你学会这些，我就原谅你。”小文红着脸，低着头，支支吾吾地说：“对不起……真的，爷爷，我再也不会那样做了。”“那好吧。”爷爷脸上的表情阴转晴，他灿烂的微笑又回来了。小文也笑了，他这次认认真真地写完了作业，还暗暗下定决心，再也不会犯同样的错误了。"]}, {"pic": "end", "text": ["俗话说：“经一事，长一智。”经过这件事后，小文开始改过自新。他不再沉迷于游戏，而是先完成作业，再去做自己喜欢的事情。爷爷看见了小文的进步后，竖起大拇指，夸赞道：“小文长大啦！”"]}]}}, "detective": [{"w": "再", "t": "再", "opts": ["再", "在", "载"], "ctx": "他一把推开爷爷，不耐烦地嘀咕道：“我就想玩会儿嘛，等会儿□写作业", "why": "“再也不会”“再次”的“再”是又一次。“在”是在哪里（在家、实在）。小作者把“实在”写成“实再”、“再吃”写成“在吃”——记住：又一次 → 再。", "hint": "又一次 → 再；地点 → 在"}, {"w": "轰隆隆地打雷", "t": "轰", "opts": ["轰", "哄", "烘"], "ctx": "天空还时不时□隆隆地打雷，好像要下雨了", "why": "“轰隆隆”的“轰”是三个“车”（上面一个，下面两个），像很多车的巨响。“哄”是哄骗（口字旁），“烘”是烘烤。", "hint": "三辆车的声音"}, {"w": "轰隆隆地打雷", "t": "隆", "opts": ["隆", "降", "窿"], "ctx": "天空还时不时轰□隆地打雷，好像要下雨了", "why": "“轰隆隆”的“隆”是左耳旁，右边下面是“生”。“降”是下降（右边是夅）。", "hint": "左耳旁，右下是生"}, {"w": "脚底装了弹簧", "t": "弹", "opts": ["弹", "单", "蛋"], "ctx": "突然，他灵机一动，顿时像一个脚底装了□簧的兔子蹦了起来，冲向了电视", "why": "“弹簧”“弹跳”的“弹”是弓字旁加“单”，像拉弓一样弹起来。“单”是单独，“蛋”是鸡蛋。", "hint": "弓字旁"}, {"w": "脚底装了弹簧", "t": "簧", "opts": ["簧", "黄", "璜"], "ctx": "突然，他灵机一动，顿时像一个脚底装了弹□的兔子蹦了起来，冲向了电视", "why": "“弹簧”的“簧”是竹字头加“黄”。“黄”是黄色，“璜”是玉器。", "hint": "竹字头＋黄"}, {"w": "屏幕擦得锃亮", "t": "屏", "opts": ["屏", "并", "瓶"], "ctx": "游戏机的□幕擦得锃亮，仿佛在诱惑小文说：“过来玩我吧", "why": "“屏幕”“屏住呼吸”的“屏”是尸字头加“并”。“并”是并且，“瓶”是瓶子（瓦字旁）。", "hint": "尸字头＋并"}, {"w": "屏幕擦得锃亮", "t": "幕", "opts": ["幕", "慕", "暮"], "ctx": "游戏机的屏□擦得锃亮，仿佛在诱惑小文说：“过来玩我吧", "why": "“屏幕”“夜幕”的“幕”下面是“巾”，本来是一块布。“慕”下面是小（羡慕），“暮”下面是日（傍晚）。", "hint": "布 → 巾字底"}, {"w": "屏幕擦得锃亮", "t": "擦", "opts": ["擦", "察", "蔡"], "ctx": "游戏机的屏幕□得锃亮，仿佛在诱惑小文说：“过来玩我吧", "why": "“擦汗”“擦得锃亮”的“擦”是提手旁加“察”。“察”是观察，“蔡”是姓氏（草字头）。", "hint": "提手旁＋察"}, {"w": "屏幕擦得锃亮", "t": "锃", "opts": ["锃", "呈", "程"], "ctx": "游戏机的屏幕擦得□亮，仿佛在诱惑小文说：“过来玩我吧", "why": "“锃亮”的“锃”是金字旁，金属擦得发亮。“呈”是呈现，“程”是过程。", "hint": "金属发亮 → 金字旁"}, {"w": "仿佛在诱惑小文", "t": "佛", "opts": ["佛", "拂", "弗"], "ctx": "游戏机的屏幕擦得锃亮，仿□在诱惑小文说：“过来玩我吧", "why": "“仿佛”的“佛”是单人旁，好像的意思。“拂”是轻轻擦过（提手旁）。", "hint": "单人旁＋弗"}], "audio": {"adv": {"src": "audio/push-grandpa_adv.mp3", "cues": [["push-grandpa|adv|1|0", 0.05], ["push-grandpa|adv|1|1", 26.49], ["push-grandpa|adv|2|0", 54.55], ["push-grandpa|adv|2|1", 76.6], ["push-grandpa|adv|3|0", 109.66], ["push-grandpa|adv|4|0", 135.65], ["push-grandpa|adv|4|1", 168.97], ["push-grandpa|adv|end|0", 196.37]]}, "qx": {"src": "audio/push-grandpa_qx.mp3", "cues": [["push-grandpa|qx|1|0", 0.0], ["push-grandpa|qx|1|1", 17.1], ["push-grandpa|qx|1|2", 69.65], ["push-grandpa|qx|2|0", 126.1], ["push-grandpa|qx|2|1", 179.5], ["push-grandpa|qx|3|0", 217.88], ["push-grandpa|qx|4|0", 245.2], ["push-grandpa|qx|end|0", 320.1]]}}}, {"id": "help-grandma", "title": "扶起跌倒的老奶奶，捡回滚落的水果", "cat": "bonds", "grade": "P4", "pics": 4, "date": "2025-09-16", "source": "蔡老师课件", "imgs": ["img/H14_oldlady_1.jpg", "img/H14_oldlady_2.jpg", "img/H14_oldlady_3.jpg", "img/H14_oldlady_4.jpg"], "vocab": ["放学", "老婆婆", "提着篮子", "跌倒", "扶起来", "捡水果", "行人", "伸出援手", "道谢", "竖起大拇指"], "drafts": ["img/draft_20250922_214005.jpg", "img/draft_20250922_214016.jpg", "img/draft_20250922_214105.jpg", "img/draft_20250922_215515.jpg"], "versions": {"basic": {"label": "范文 · 基础版", "words": "480", "info": "参考范文 · 描写路人用了排比句", "segments": [{"pic": "1", "note": "图一：放学路上心情愉快", "text": ["一个阳光明媚的星期五下午，天空湛蓝，微风轻拂。小丽背着书包，哼着小曲儿，迈着轻快的脚步，走在放学的路上。她的心情格外愉快，完全没想到自己即将遇上一件让她[[难以忘怀]]的事。"]}, {"pic": "2", "note": "图二：老婆婆被石头绊倒，苹果滚了一地", "text": ["走着走着，正在这时，小丽看到前方有一位老婆婆，正提着篮子，篮子里装满了新鲜的水果。她慢慢地走着，显得有些吃力。突然，老婆婆不小心被一块石头绊倒，扑倒在地，篮子里的苹果“咕噜咕噜”滚得到处都是。"]}, {"pic": "3", "note": "图三：扶起老婆婆，捡水果；路人帮忙（排比句）", "text": ["看到这一幕，小丽吓了一跳，立刻跑过去。她先小心翼翼地把老婆婆扶起来，焦急地问：“婆婆，您没事吧？”老婆婆摆摆手，示意自己没有受伤。小丽见状，立刻蹲下身子，把地上散落的水果一个个捡回篮子里。路过的行人也停下来，纷纷伸出援手。[[有的帮忙捡水果，有的轻声安慰老婆婆，还有的关切地询问老婆婆家住哪里]]。"]}, {"pic": "4", "note": "图四：老婆婆道谢，竖起大拇指", "text": ["不一会儿，水果都捡好了，老婆婆的神情也放松下来。她感动得热泪盈眶，连连道谢，还竖起大拇指称赞小丽：“你真是个乐于助人的好孩子！”小丽听了，心里甜滋滋的。"]}, {"pic": "end", "text": ["在回家的路上，小丽越想越开心。她明白了父母和老师的教导：助人为快乐之本。帮助别人是一件很快乐的事。只要人人都能在别人需要时伸出援手，社会就会变得更加温暖。"]}]}, "adv": {"label": "范文 · 高阶版", "words": "900", "info": "进阶版本范文二 · 老婆婆外貌、水果滚落的排比", "segments": [{"pic": "1", "note": "图一：放学；今天被老师表扬，心里美滋滋", "text": ["那是一个阳光明媚的星期五下午，天空湛蓝，几朵白云悠悠飘过。校园里的铃声刚刚响起，孩子们就背着书包，三三两两地走在回家的路上。小丽也不例外，她哼着小曲儿，迈着轻快的脚步，心情十分愉快。她想着今天老师在课堂上表扬了自己，心里美滋滋的。"]}, {"pic": "2", "note": "图二：老婆婆佝偻着背；步履蹒跚；跌倒，水果滚落（排比）", "text": ["走着走着，小丽看见前面有一位老婆婆。只见她[[佝偻着背]]，提着一个篮子，里面装满了新鲜的苹果和橙子，沉甸甸的，似乎有些吃力。老婆婆走得很慢，[[步履蹒跚]]，但脸上仍带着慈祥的笑容。小丽看着她的样子，十分担心老婆婆走路不稳，随时会跌倒的样子。", "就在这时，意想不到的事情发生了。老婆婆脚下一个趔趄，被地上的石头绊了一下，顿时“哎呀”一声跌倒在地。篮子也随之摔翻，苹果和橙子滚得到处都是，[[有的滚到马路边，有的滚进草丛里，还有的滚到路人的脚边]]。老婆婆脸色一变，试图撑着地面爬起来，可是显得十分吃力。"]}, {"pic": "3", "note": "图三：扶起、拍灰尘、追着捡水果；热心的路人", "text": ["小丽看到眼前这一幕，吓了一跳，连忙跑过去。她一边扶起老婆婆，一边关切地问：“婆婆，您有没有受伤？”老婆婆摇摇头，轻声说：“没事，没事，就是吓了一跳。”看到她脸色有些苍白，小丽更加担心，伸手轻轻拍掉她衣服上的灰尘。", "紧接着，小丽弯下腰，把地上的水果一一捡起来。苹果在地上滚来滚去，小丽追着捡，手上也沾满了灰尘和泥土，但她顾不上这些，只想着要尽快把水果放回篮子里。路过的行人看见了，也纷纷停下脚步，有的蹲下来帮忙捡水果，有的安慰老婆婆：“您要小心啊，幸好没受伤。”还有的关切地问：“您家住哪里，我送您回家吧。”大家都显得十分热心。"]}, {"pic": "4", "note": "图四：老婆婆眼眶湿润，道谢；小丽的感受", "text": ["不一会儿，散落的水果都捡回来了。老婆婆望着满满一篮子水果，眼眶湿润了，连声道谢：“谢谢你们！谢谢你，小姑娘，你真是个乐于助人的好孩子！”说完，她还不忘对小丽竖起大拇指，脸上露出感动的笑容。", "小丽听了，心里甜滋滋的。虽然刚才累得满头大汗，但她觉得十分值得。她想：帮助别人其实不难，只要愿意伸出援手，就能让别人感到温暖。"]}, {"pic": "end", "text": ["回到家的路上，小丽仍想着这件事。她觉得，[[人与人之间最宝贵的就是互相帮助和关心]]。如果每个人都能像今天这样，在别人遇到困难时毫不犹豫地伸出援手，社会一定会变得更加温馨、和谐。", "这件事虽然只是生活中的一个小插曲，却深深地印在了小丽的心里。它让她明白：热心助人，不仅能帮助别人，也能让自己收获快乐。"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "20/15（老师：必须给5分奖励分，无可挑剔）", "words": "950", "info": "正字：直（直接）／真（真相）", "segments": [{"pic": "1", "text": ["“铃铃铃……”放学铃声响起，同学们像放出笼的小鸟一样，叽叽喳喳，三五成群地飞出了教室。小丽也不例外，她迫不及待地冲出了教室，蹦蹦跳跳地出了校门就往家走。", "今天是华文考试出成绩的一天，小丽获得满分的好成绩，她觉得今天真是美好的一天，小鸟的歌声和树叶在风中发出的沙沙的响声混杂在一起，变成了一首美妙的交响乐。阳光温柔地洒向大地，到处都暖暖的。小丽踏着轻快的脚步，哼着小曲儿，脸上挂着灿烂的笑容，拐进了熟悉的组屋走廊，前面不远处就是她的家。"]}, {"pic": "2", "text": ["这时，小丽看到前面走着一个白发苍苍、满脸皱纹的奶奶。她颤颤巍巍地往前走，身体虚弱得就像风轻轻一吹她就要摔倒了。奶奶的手里还提着一个竹篮，里面装着甜甜的[[金灿灿]]的橙子，小丽猜那是从附近的集市买的。", "看着老奶奶的背影，小丽的心里涌起一阵阵担心和心疼。可是她正想上前帮忙的时候，奶奶的脚突然被一个小石子[[绊]]了一下。小丽还没来得及喊一声“小心”，老奶奶就已经摔了一个四脚朝天。她一边“哎哟，哎哟”地摸着摔疼的腰，一边挣扎着想站起来。可是她的腰实在太疼了，她根本站不起来。小丽看到眼前这一幕，心都跳到了嗓子眼。她的手心直冒冷汗，心急如焚地呼救：“老奶奶摔倒啦！快来帮忙！”"]}, {"pic": "3", "text": ["说着，小丽像离弦的箭一样飞奔到奶奶身旁，小心翼翼地扶起老奶奶，焦急地询问道：“奶奶，您没事吧？哪里疼？”老奶奶疼得龇牙咧嘴，勉强笑了笑，说：“没关系，年纪大了，脚走不稳了。”小丽看在眼里，心里感到酸酸的，就更加用力地扶住老奶奶，帮助她慢慢地坐了起来。", "这时，邻居李阿姨下班刚好路过，听到小丽的喊声就急急忙忙地赶过来帮忙。趁着李阿姨照顾着老奶奶，小丽顾不上蹲得酸疼的膝盖，开始捡拾滚落一地的橙子，她弯着腰，提着篮子，来来回回地捡，不一会儿，篮子满了，可是小丽的额头渗出了细密的汗珠，脸蛋红红的，像个可爱的小苹果。"]}, {"pic": "4", "text": ["小丽气喘吁吁地把篮子递给了老奶奶，然后彬彬有礼地说：“奶奶，路上小心哦！如果篮子太重，我会帮您提回家。”老奶奶听了，心里暖暖的，眼睛里闪烁着感动的泪花，连连道谢：“太谢谢你了！小姑娘，如果今天没碰到你的话，我不知道怎么办才好！”闻声而来的邻居们看到了这一幕，都纷纷竖起了大拇指，向小丽[[投去了赞许的目光]]，称赞道：“小丽真是个助人为乐的好孩子！”小丽听了，心里甜滋滋的，比吃了蜜糖还甜。", "后来，在众人的帮助下，老奶奶安全地到了家。小丽这才松了一口气。"]}, {"pic": "end", "text": ["经过这件事，小丽更加懂得了“赠人玫瑰，手留余香”的道理。只要人人都献出一点爱，这个世界就会更和谐，更美好，更温暖。"]}]}}, "detective": [{"w": "直", "t": "直", "opts": ["直", "真", "值"], "ctx": "她的手心□冒冷汗，心急如焚地呼救：“老奶奶摔倒啦", "why": "“直接”“一直”的“直”里面是三横，下面一横。“真”下面有两点（真相）。小作者把“直”写成“真”过！", "hint": "直：下面没有两点"}, {"w": "心里甜滋滋", "t": "滋", "opts": ["滋", "兹", "磁"], "ctx": "”小丽听了，心里甜□滋的，比吃了蜜糖还甜", "why": "“滋味”“滋滋响”的“滋”是三点水。“兹”没有三点水，“磁”是磁铁（石字旁）。", "hint": "三点水＋兹"}, {"w": "心急如焚", "t": "焚", "opts": ["焚", "梵", "焚"], "ctx": "她的手心直冒冷汗，心急如□地呼救：“老奶奶摔倒啦", "why": "“心急如焚”的“焚”上面是“林”，下面是“火”——树林着火了，急得像心里烧起来。", "hint": "林＋火"}, {"w": "像离弦的箭一样", "t": "箭", "opts": ["箭", "剑", "前"], "ctx": "说着，小丽像离弦的□一样飞奔到奶奶身旁，小心翼翼地扶起老奶奶，焦急地询问道：“奶奶，您没事吧", "why": "“离弦的箭”的“箭”是竹字头，古代的箭用竹子做。“剑”是宝剑（右边立刀），“前”是前面。", "hint": "竹字头＋前"}, {"w": "毫不犹豫", "t":
