tart", "label": "题目给的开头", "text": ["我站在电梯门口等了很久，还是等不到电梯，于是我决定爬楼梯上去。当我正要走向楼梯口时，电梯的门却打开了。令我吃惊的是，电梯里……"]}, {"pic": "1", "label": "正文①", "text": ["竟然躺着一个独自在哭泣的婴儿！", "见到这一幕，我惊慌失措，立刻转过身，冲上楼梯。上了几个梯级后，我停下了脚步，喘着气，脑海里不断浮现出刚刚看到的画面。那个婴儿为什么会在电梯里？他的父母在哪里？随着一个个令人匪夷所思的问号不断地涌上心头，我的好奇心也开始作祟了。于是，我又缓缓地走下楼梯。", "电梯门还没关上。我战战兢兢地走到电梯门外，往电梯里望了望。那个婴儿被一块蓝色的小毛巾包着，正在哇哇大哭，看了令人十分心疼。婴儿的身形非常小，相信应该才出生没多久。我环顾四周，却没看到半个人影。难道婴儿的父母把他遗弃在电梯后就逃之夭夭了？"]}, {"pic": "2", "label": "正文②", "text": ["冷静下来后，我立刻拿出手机报警。在等待警察到来的当儿，我小心翼翼地把那名婴儿抱起，试图安抚他。婴儿似乎感受到了温暖，哭声渐渐地停了下来。过后，他还在我的怀里睡着了。婴儿睡着的模样就像个小天使，令我不禁对他产生了怜悯之心。", "警察赶来后，从我手中接过了婴儿。他依然甜甜地睡着，丝毫不受周遭影响。简单地录完口供后，警员们便带着婴儿离开。我走进电梯准备上楼，手臂仍隐约感觉到那个小身躯的余温。我看着刚刚婴儿躺过的位置，心也变得越来越沉重。"]}, {"pic": "end", "text": ["回到家，我立刻把刚刚发生的事情一五一十地告诉了妈妈。妈妈称赞我做了一件好事，但也为世上竟然有如此狠心的父母而感慨。如果这件事真的是婴儿的父母所为，希望他们能够回心转意，尽快把他接回家。"]}]}, "imp": {"label": "慧眼改进版", "words": "683", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：补上“我”的收获和名句。", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["我站在电梯门口等了很久，还是等不到电梯，于是我决定爬楼梯上去。当我正要走向楼梯口时，电梯的门却打开了。令我吃惊的是，电梯里……"]}, {"pic": "1", "label": "正文①", "text": ["竟然躺着一个独自在哭泣的婴儿！", "见到这一幕，我惊慌失措，立刻转过身，冲上楼梯。上了几个梯级后，我停下了脚步，喘着气，脑海里不断浮现出刚刚看到的画面。那个婴儿为什么会在电梯里？他的父母在哪里？随着一个个令人匪夷所思的问号不断地涌上心头，我的好奇心也开始作祟了。于是，我又缓缓地走下楼梯。", "电梯门还没关上。我战战兢兢地走到电梯门外，往电梯里望了望。那个婴儿被一块蓝色的小毛巾包着，正在哇哇大哭，看了令人十分心疼。婴儿的身形非常小，相信应该才出生没多久。我环顾四周，却没看到半个人影。难道婴儿的父母把他遗弃在电梯后就逃之夭夭了？"]}, {"pic": "2", "label": "正文②", "text": ["冷静下来后，我立刻拿出手机报警。在等待警察到来的当儿，我小心翼翼地把那名婴儿抱起，试图安抚他。婴儿似乎感受到了温暖，哭声渐渐地停了下来。过后，他还在我的怀里睡着了。婴儿睡着的模样就像个小天使，令我不禁对他产生了怜悯之心。", "警察赶来后，从我手中接过了婴儿。他依然甜甜地睡着，丝毫不受周遭影响。简单地录完口供后，警员们便带着婴儿离开。我走进电梯准备上楼，手臂仍隐约感觉到那个小身躯的余温。我看着刚刚婴儿躺过的位置，心也变得越来越沉重。"]}, {"pic": "end", "text": ["回到家，我立刻把刚刚发生的事情一五一十地告诉了妈妈。妈妈称赞我做了一件好事，但也为世上竟然有如此狠心的父母而感慨。如果这件事真的是婴儿的父母所为，希望他们能够回心转意，尽快把他接回家。", "++俗话说：“赠人玫瑰，手有余香。”虽然我不知道那个婴儿以后会怎样，但能在他最需要帮助的时候伸出援手，我的心里暖暖的。++"], "note": "慧眼改进：补上“我”的收获和名句。"}]}}, "detective": []}, {"id": "psle2015-hc-q1", "title": "我帮助过的人向我表示感激", "cat": "bonds", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2015 高华 · 试卷一 Q1（情境作文）", "kind": "情境作文", "exam": "PSLE 2015 高华", "imgs": [], "drafts": [], "vocab": ["非常感谢", "伸出援手"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "850", "info": "题目：《我帮助过的人向我表示感激》｜情境：最近，你帮了一个人。令你感到惊喜的是，你收到了他的感谢卡。｜出处：PSLE 2015 高华 · 试卷一 Q1（情境作文）", "segments": [{"pic": "start", "text": ["当你阅读这张卡片时，你深受感动。这件事让你明白了一点，那就"]}, {"pic": "1", "label": "正文①", "text": ["是对曾经帮助过你的人表达谢意是很重要的。", "“利伟，请到我的办公室来一趟。”下课时，班主任林老师把我叫住了。我觉得奇怪，心想自己是不是犯了什么错。", "到了办公室，林老师递给我一个蓝色的信封。咦，这是什么？见我一脸疑惑，林老师笑着说：“打开来看吧。”我打开信封，抽出了一张小卡片，上面写着：小弟弟，上个星期五，非常感谢你在雨中帮助我。我的脚已经好多了。你的心地真好！", "我一下子明白了，思绪也回到了上个星期五。那天下着大雨，放学后，我撑着伞走路回家。路上的人不多，不过下雨地滑，我只好慢慢地走着。这时，我看到前面有个人坐在人行道上。地上这么湿，怎么会有人坐在那里呢？我觉得不对劲，连忙上前查看，只见一个年长男子坐在地上，正努力地想爬起来。他一只手拿着一把坏了的雨伞，旁边还散落了好几袋东西。"]}, {"pic": "2", "label": "正文②", "text": ["“您怎么了？”我连忙问道。原来，这位伯伯刚买完东西，准备从超市回家。他在雨中行走时，不小心滑了一跤，跌在了地上。看他痛苦的样子，想必跌得不轻，无法自己爬起来。于是，我赶紧放下雨伞，用尽力气将他扶起。伯伯好不容易站了起来，不过仍说自己脚痛。我看了看地上散落的袋子，决定帮他把东西提回家。问明地址后，我便提起袋子，用雨伞遮着伯伯往附近的组屋走去。一路上，他把手搭在我的肩膀上，慢慢地走着。到了他的家，我把东西放好，再替他打了电话通知家人，才离开。", "没想到，这位伯伯竟然会写感谢卡到学校来。“伯伯怎么会知道我的名字呢？”我问老师。老师摸了摸我的头，什么也没说，只是指着我校服上的名牌。原来是这么一回事！我把当天发生的事情告诉了老师。她听了点点头，称赞我做了一件好事，是个有爱心的好孩子。"]}, {"pic": "end", "text": ["我看着手上的卡片，心里感到一阵暖意。我当天只是一心想帮助这位伯伯，没想到他会如此感激我。这张卡片让我很感动，也仿佛成为了一种动力。如果下次再遇到需要帮助的人时，我还是会伸出援手。通过这件事，我也了解到，对曾经帮助过自己的人表达谢意是很重要的。我以后也要像这位伯伯一样，多感谢帮助过我的人。"]}]}, "imp": {"label": "慧眼改进版", "words": "866", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：加一句名句，点出“感恩”。", "segments": [{"pic": "start", "text": ["当你阅读这张卡片时，你深受感动。这件事让你明白了一点，那就"]}, {"pic": "1", "label": "正文①", "text": ["是对曾经帮助过你的人表达谢意是很重要的。", "“利伟，请到我的办公室来一趟。”下课时，班主任林老师把我叫住了。我觉得奇怪，心想自己是不是犯了什么错。", "到了办公室，林老师递给我一个蓝色的信封。咦，这是什么？见我一脸疑惑，林老师笑着说：“打开来看吧。”我打开信封，抽出了一张小卡片，上面写着：小弟弟，上个星期五，非常感谢你在雨中帮助我。我的脚已经好多了。你的心地真好！", "我一下子明白了，思绪也回到了上个星期五。那天下着大雨，放学后，我撑着伞走路回家。路上的人不多，不过下雨地滑，我只好慢慢地走着。这时，我看到前面有个人坐在人行道上。地上这么湿，怎么会有人坐在那里呢？我觉得不对劲，连忙上前查看，只见一个年长男子坐在地上，正努力地想爬起来。他一只手拿着一把坏了的雨伞，旁边还散落了好几袋东西。"]}, {"pic": "2", "label": "正文②", "text": ["“您怎么了？”我连忙问道。原来，这位伯伯刚买完东西，准备从超市回家。他在雨中行走时，不小心滑了一跤，跌在了地上。看他痛苦的样子，想必跌得不轻，无法自己爬起来。于是，我赶紧放下雨伞，用尽力气将他扶起。伯伯好不容易站了起来，不过仍说自己脚痛。我看了看地上散落的袋子，决定帮他把东西提回家。问明地址后，我便提起袋子，用雨伞遮着伯伯往附近的组屋走去。一路上，他把手搭在我的肩膀上，慢慢地走着。到了他的家，我把东西放好，再替他打了电话通知家人，才离开。", "没想到，这位伯伯竟然会写感谢卡到学校来。“伯伯怎么会知道我的名字呢？”我问老师。老师摸了摸我的头，什么也没说，只是指着我校服上的名牌。原来是这么一回事！我把当天发生的事情告诉了老师。她听了点点头，称赞我做了一件好事，是个有爱心的好孩子。"]}, {"pic": "end", "text": ["我看着手上的卡片，心里感到一阵暖意。我当天只是一心想帮助这位伯伯，没想到他会如此感激我。这张卡片让我很感动，也仿佛成为了一种动力。如果下次再遇到需要帮助的人时，我还是会伸出援手。通过这件事，我也了解到，对曾经帮助过自己的人表达谢意是很重要的。++正所谓“滴水之恩，当涌泉相报。”++我以后也要像这位伯伯一样，多感谢帮助过我的人。"], "note": "慧眼改进：加一句名句，点出“感恩”。"}]}}, "detective": []}, {"id": "psle2015-hc-q2", "title": "弄丢了班费，我向老师坦白", "cat": "whoops", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2015 高华 · 试卷一 Q2（完成文章）", "kind": "完成文章", "exam": "PSLE 2015 高华", "imgs": [], "drafts": [], "vocab": ["坐立不安", "一无所获", "气喘吁吁", "脱口而出", "失而复得", "虚惊一场", "休息时间"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "961", "info": "题目：以下面的情节作为开头，完成这篇文章——放学了，同学们都带着愉快的心情回家了，教室里只剩下我一个人。我满怀心事，因为那件事完全是由我引起的。我带着沉重的心情走向教师办公室……｜出处：PSLE 2015 高华 · 试卷一 Q2（完成文章）", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["放学了，同学们都带着愉快的心情回家了，教室里只剩下我一个人。我满怀心事，因为那件事完全是由我引起的。我带着沉重的心情走向教师办公室……"]}, {"pic": "1", "label": "正文①", "text": ["准备向王老师坦白。", "昨天，班长向大家提议在年终考试过后，举办一次班级聚会。聚会将由本班同学亲自策划。同学们听了都很兴奋，纷纷提出不同的点子。经过讨论，我们决定到东海岸举办烧烤会。", "我在班上担任财政一职，班长今天向每位同学收取了5元后，便将总数150元的活动班费交给我保管。这笔钱将用来支付这次烧烤会的费用，包括购买食材和器具。休息时间到了，我不放心把钱留在课室里，便将装有班费的信封一起带到食堂去。不知怎么的，吃完午餐回到教室，我原本应该握着的信封却不见了！我赶紧翻找书包，并环顾座位附近，但都没看见信封。这时我心里急得发慌，努力回想信封可能会放在什么地方，结果只想到食堂。应该告诉班长吗？我担心万一信封被别人捡走，那我们的烧烤会就泡汤了，而我一定会被全班同学臭骂的。"]}, {"pic": "2", "label": "正文②", "text": ["此时，王老师走进教室上课。我为了班费的事情担心不已，完全无法集中精神听课。一想到信封可能留在食堂，我更加坐立不安，只好举手向老师示意要去洗手间。一离开教室，我便以百米冲刺的速度奔向食堂，却没看见信封。我沿着食堂回教室的路线仔细地找，也一无所获，只能气喘吁吁、一脸失望地回到教室。", "“丽美，你还好吗？”同桌的小云问道。我不敢说出事实，只随口说自己肚子痛。时间过得很慢，好不容易等到放学铃声响起，同学们开始收拾书包。“一想到考试后能和大家一起参加烧烤会，我就很开心！”小云笑着说。我只能苦笑，心里特别难受。大家都很期待这次的烧烤会，我怎么这么不小心，竟然弄丢了班费！此时，教室里只剩下我一个人，我内疚得不得了，觉得不能让烧烤会因为我而办不成。因此，我决定把事情告诉王老师，请她帮忙。"]}, {"pic": "3", "label": "正文③", "text": ["我缓缓地走到王老师的座位前，把事情告诉了她。我说到一半，忍不住哭了起来。王老师耐心地安慰我，然后带我到校务处找柜台职员林小姐申报班费不见的事。林小姐听了，一边打开抽屉，一边说刚才有同学在食堂捡到一个信封。", "我马上止住哭泣，只见她从抽屉取出了我再熟悉不过的信封。“这是我们的班费！”我脱口而出。王老师接过信封，数了里面的钱，正好是150元。我一下子松了一口气，原来这就是失而复得的感觉。"]}, {"pic": "end", "text": ["虽然这次是虚惊一场，但我也得到了教训。我以后做事绝对不能这么糊涂了！"]}]}, "imp": {"label": "慧眼改进版", "words": "1045", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：原文结尾太短，补上名句、诚实的道理，并感谢捡到钱的同学。", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["放学了，同学们都带着愉快的心情回家了，教室里只剩下我一个人。我满怀心事，因为那件事完全是由我引起的。我带着沉重的心情走向教师办公室……"]}, {"pic": "1", "label": "正文①", "text": ["准备向王老师坦白。", "昨天，班长向大家提议在年终考试过后，举办一次班级聚会。聚会将由本班同学亲自策划。同学们听了都很兴奋，纷纷提出不同的点子。经过讨论，我们决定到东海岸举办烧烤会。", "我在班上担任财政一职，班长今天向每位同学收取了5元后，便将总数150元的活动班费交给我保管。这笔钱将用来支付这次烧烤会的费用，包括购买食材和器具。休息时间到了，我不放心把钱留在课室里，便将装有班费的信封一起带到食堂去。不知怎么的，吃完午餐回到教室，我原本应该握着的信封却不见了！我赶紧翻找书包，并环顾座位附近，但都没看见信封。这时我心里急得发慌，努力回想信封可能会放在什么地方，结果只想到食堂。应该告诉班长吗？我担心万一信封被别人捡走，那我们的烧烤会就泡汤了，而我一定会被全班同学臭骂的。"]}, {"pic": "2", "label": "正文②", "text": ["此时，王老师走进教室上课。我为了班费的事情担心不已，完全无法集中精神听课。一想到信封可能留在食堂，我更加坐立不安，只好举手向老师示意要去洗手间。一离开教室，我便以百米冲刺的速度奔向食堂，却没看见信封。我沿着食堂回教室的路线仔细地找，也一无所获，只能气喘吁吁、一脸失望地回到教室。", "“丽美，你还好吗？”同桌的小云问道。我不敢说出事实，只随口说自己肚子痛。时间过得很慢，好不容易等到放学铃声响起，同学们开始收拾书包。“一想到考试后能和大家一起参加烧烤会，我就很开心！”小云笑着说。我只能苦笑，心里特别难受。大家都很期待这次的烧烤会，我怎么这么不小心，竟然弄丢了班费！此时，教室里只剩下我一个人，我内疚得不得了，觉得不能让烧烤会因为我而办不成。因此，我决定把事情告诉王老师，请她帮忙。"]}, {"pic": "3", "label": "正文③", "text": ["我缓缓地走到王老师的座位前，把事情告诉了她。我说到一半，忍不住哭了起来。王老师耐心地安慰我，然后带我到校务处找柜台职员林小姐申报班费不见的事。林小姐听了，一边打开抽屉，一边说刚才有同学在食堂捡到一个信封。", "我马上止住哭泣，只见她从抽屉取出了我再熟悉不过的信封。“这是我们的班费！”我脱口而出。王老师接过信封，数了里面的钱，正好是150元。我一下子松了一口气，原来这就是失而复得的感觉。"]}, {"pic": "end", "text": ["虽然这次是虚惊一场，但我也得到了教训。我以后做事绝对不能这么糊涂了！++俗话说：“吃一堑，长一智。”我也很庆幸自己鼓起勇气向老师坦白，因为诚实面对问题，才能找到解决的办法。更要谢谢那位把信封交出来的同学，是他的诚实让我们的烧烤会能如期举行。++"], "note": "慧眼改进：原文结尾太短，补上名句、诚实的道理，并感谢捡到钱的同学。"}]}}, "detective": []}, {"id": "psle2016-hc-q1", "title": "我必须为自己的行为负责", "cat": "falls", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2016 高华 · 试卷一 Q1（情境作文）", "kind": "情境作文", "exam": "PSLE 2016 高华", "imgs": [], "drafts": [], "vocab": ["油然而生", "小心翼翼", "再试一次", "始料未及", "痛骂一顿"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "1032", "info": "题目：《我必须为自己的行为负责》｜情境：你有一个毛病，就是犯了错却不承认，还把责任推给别人。有一次，因为这个毛病，你伤害了身边的亲人或好友。你非常后悔，决定为自己的行为负责。｜出处：PSLE 2016 高华 · 试卷一 Q1（情境作文）", "segments": [{"pic": "start", "text": ["“小阳，帮爸爸拿一柱香和打火机过来。”爸爸在门口喊道。我连忙跑到客厅拿了香和打火机，再交给爸爸。爸爸熟练地用拇指转动打火机打火，并点起一柱香。“我和妈妈要去超市买菜，很快就回来。你和哥哥在家做功课，不要玩耍。”说着，爸爸把打火机交还给我，便关上了门。我看着手中的打火机，摸了摸旋钮，一股好奇之心油然而生。"]}, {"pic": "1", "label": "正文①", "text": ["哥哥正在客厅里做功课。不一会儿，他就把功课做完了，便回房休息。我觉得无聊，开始环顾四周，目光再度转移到桌上的那个打火机身上。爸爸刚才转动打火机的样子真酷，我也想试试！我小心翼翼地拿起打火机，轻轻地转动了旋钮。只见微微的火光冒出又消失，好奇妙哦！我放胆再试一次，结果火光瞬间燃起，把我吓了一大跳。我手一抖，打火机便掉落在桌子旁的旧报纸上。旧报纸即刻被点燃，开始狂烧。这一幕让我始料未及，我赶紧拿起沙发上的靠垫拍打旧报纸，并呼喊哥哥。可是我不但没把火扑灭，反而使靠垫也着火了。", "哥哥从房里出来一看，睡意顿时消失。他赶紧跑到厕所提一桶水来浇旧报纸。此时，我也快速开门，向邻居王伯伯求救。幸好火势不大，哥哥和王伯伯来回浇了几桶水后，便顺利地把火扑灭了。我们都瘫在地上，松了一口气。"]}, {"pic": "2", "label": "正文②", "text": ["这时，爸爸和妈妈从超市回来，还没进门就闻到了烧焦味。他们看了看被烧坏的旧报纸，连忙问我们发生了什么事。我心想：遭了，这次一定会被爸妈痛骂一顿！不行，不能让他们知道事情是因我而起的！反正，平时犯错也都有哥哥帮我“扛罪名”，他不会介意的。", "就在哥哥准备开口时，我情急之下连忙打岔：“哥哥刚才玩打火机，结果烧到旧报纸。”哥哥瞪大眼睛看着我，不停地摇头。爸爸妈妈则完全在气头上，抓着哥哥不停质问。可是，任凭哥哥怎么解释，他们都听不进去，还决定不让哥哥参加年尾的学校海外交流计划。哥哥一听，恶狠狠地撞了我一下，便冲进房里把自己反锁，连午餐也不吃。"]}, {"pic": "3", "label": "正文③", "text": ["时间一分一秒地过去，晚餐时间到了，可哥哥始终不肯出来。我尝试敲门，但他就是不应门。“别管他！让他在里面好好反省！”爸爸说。我没想到这次的事会这么严重。想到无辜的哥哥因为我而不吃不喝，还不能参加海外交流计划，我不由得内疚起来。我越想越后悔，最后主动走到爸爸妈妈面前，向他们坦白一切。他们露出了惊讶的表情，赶紧到哥哥房门外向他道歉，并请他开门。幸好哥哥只是因为饿坏了而显得有气无力，并无大碍。"]}, {"pic": "end", "text": ["过后，我被爸爸妈妈教训了一顿，但一想到这次我至少为自己的行为负责，不拖累别人，心里就好过了一些。我在心中立誓：以后，要是犯了错一定要第一时间承认错误，不要再推卸责任了。"]}]}, "imp": {"label": "慧眼改进版", "words": "1057", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：改一个错别字，结尾加一句名句。", "segments": [{"pic": "start", "text": ["“小阳，帮爸爸拿一柱香和打火机过来。”爸爸在门口喊道。我连忙跑到客厅拿了香和打火机，再交给爸爸。爸爸熟练地用拇指转动打火机打火，并点起一柱香。“我和妈妈要去超市买菜，很快就回来。你和哥哥在家做功课，不要玩耍。”说着，爸爸把打火机交还给我，便关上了门。我看着手中的打火机，摸了摸旋钮，一股好奇之心油然而生。"]}, {"pic": "1", "label": "正文①", "text": ["哥哥正在客厅里做功课。不一会儿，他就把功课做完了，便回房休息。我觉得无聊，开始环顾四周，目光再度转移到桌上的那个打火机身上。爸爸刚才转动打火机的样子真酷，我也想试试！我小心翼翼地拿起打火机，轻轻地转动了旋钮。只见微微的火光冒出又消失，好奇妙哦！我放胆再试一次，结果火光瞬间燃起，把我吓了一大跳。我手一抖，打火机便掉落在桌子旁的旧报纸上。旧报纸即刻被点燃，开始狂烧。这一幕让我始料未及，我赶紧拿起沙发上的靠垫拍打旧报纸，并呼喊哥哥。可是我不但没把火扑灭，反而使靠垫也着火了。", "哥哥从房里出来一看，睡意顿时消失。他赶紧跑到厕所提一桶水来浇旧报纸。此时，我也快速开门，向邻居王伯伯求救。幸好火势不大，哥哥和王伯伯来回浇了几桶水后，便顺利地把火扑灭了。我们都瘫在地上，松了一口气。"]}, {"pic": "2", "label": "正文②", "text": ["这时，爸爸和妈妈从超市回来，还没进门就闻到了烧焦味。他们看了看被烧坏的旧报纸，连忙问我们发生了什么事。我心想：~~遭了，这次~~++糟了，这次++一定会被爸妈痛骂一顿！不行，不能让他们知道事情是因我而起的！反正，平时犯错也都有哥哥帮我“扛罪名”，他不会介意的。", "就在哥哥准备开口时，我情急之下连忙打岔：“哥哥刚才玩打火机，结果烧到旧报纸。”哥哥瞪大眼睛看着我，不停地摇头。爸爸妈妈则完全在气头上，抓着哥哥不停质问。可是，任凭哥哥怎么解释，他们都听不进去，还决定不让哥哥参加年尾的学校海外交流计划。哥哥一听，恶狠狠地撞了我一下，便冲进房里把自己反锁，连午餐也不吃。"]}, {"pic": "3", "label": "正文③", "text": ["时间一分一秒地过去，晚餐时间到了，可哥哥始终不肯出来。我尝试敲门，但他就是不应门。“别管他！让他在里面好好反省！”爸爸说。我没想到这次的事会这么严重。想到无辜的哥哥因为我而不吃不喝，还不能参加海外交流计划，我不由得内疚起来。我越想越后悔，最后主动走到爸爸妈妈面前，向他们坦白一切。他们露出了惊讶的表情，赶紧到哥哥房门外向他道歉，并请他开门。幸好哥哥只是因为饿坏了而显得有气无力，并无大碍。"]}, {"pic": "end", "text": ["过后，我被爸爸妈妈教训了一顿，但一想到这次我至少为自己的行为负责，不拖累别人，心里就好过了一些。我在心中立誓：以后，要是犯了错一定要第一时间承认错误，不要再推卸责任了。++正所谓“人非圣贤，孰能无过？过而能改，善莫大焉。”++"], "note": "慧眼改进：改一个错别字，结尾加一句名句。"}]}}, "detective": []}, {"id": "psle2016-hc-q2", "title": "帮同学明华办义卖会", "cat": "bonds", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2016 高华 · 试卷一 Q2（完成文章）", "kind": "完成文章", "exam": "PSLE 2016 高华", "imgs": [], "drafts": [], "vocab": ["吞吞吐吐", "平白无故", "不好意思"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "796", "info": "题目：以下面的情节作为开头，完成这篇文章——在回家的路上，我遇到了班上的同学明华。他的神情看起来和平常不一样。虽然我们平时很少交谈，但我还是决定走上前去问个明白……｜出处：PSLE 2016 高华 · 试卷一 Q2（完成文章）", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["在回家的路上，我遇到了班上的同学明华。他的神情看起来和平常不一样。虽然我们平时很少交谈，但我还是决定走上前去问个明白……"]}, {"pic": "1", "label": "正文①", "text": ["一开始，明华吞吞吐吐，似乎不知从何说起。后来，他还是向我透露了他的烦恼。", "“自从我爸爸过世后，妈妈一直是我们家的经济支柱。可是大约三个月前，妈妈病倒了，暂时无法工作。我只好代替她打工赚钱。我年纪太小，赚的钱不多，我们一家这阵子只能勉强维持生活。不过，这个月底，我恐怕交不出弟弟妹妹的学费。”明华难过地说着。", "我仔细观察明华，这才发现他的黑眼圈变得很深，脸色也很差，肯定是平时忙着上课和打工，没好好休息。我们这个年纪的孩子本来是不愁吃穿的，可明华却必须扛起一家的担子，赚钱养家，真是太辛苦了！一想到这里，我不禁替他难过起来。"]}, {"pic": "2", "label": "正文②", "text": ["这时，我想到了一个主意：“不如我们找老师一起帮你想想办法？”明华连忙摇头，表示不愿意麻烦老师。我尝试说服他，并告诉他这是帮助他弟妹最好的方法。慢慢的，明华的态度软化了。我便赶紧拉他回学校找级任老师林老师。", "林老师了解了明华的处境后，非常心疼。她称赞明华小小年纪就懂得照顾家人，十分难得，并提议通过学校发起筹款活动以帮助他解决经济困难。明华一脸难为情，平白无故接受同学们的经济援助让他很不好意思。于是，我提议举办一个小型的义卖会，并由明华主办，亲自筹款。"]}, {"pic": "3", "label": "正文③", "text": ["“我打假期工时学过制作不同造型的气球。我可以亲手制作造型气球来义卖！”明华说道。对于这个主意，我和林老师都连连点头，表示赞同。接着，我提议制作手工书签来卖，明华也说他的弟弟妹妹有绘画天分，可以负责制作手工卡片。就这样，我们开始为义卖会进行构思。大家越说越起劲，明华的脸上也少了先前的愁容。"]}, {"pic": "end", "text": ["最后，我们决定将义卖会定在来临的星期五。林老师表示明天就会向同学们发布义卖会的消息，同时也会联络相关单位帮助减轻明华妈妈的医药费。看着明华渐露笑容，我真心希望这次的义卖会能够筹得足够的款项，帮明华一家人度过眼前的难关。"]}]}, "imp": {"label": "慧眼改进版", "words": "830", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：结尾补上名句和“我”的感受。", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["在回家的路上，我遇到了班上的同学明华。他的神情看起来和平常不一样。虽然我们平时很少交谈，但我还是决定走上前去问个明白……"]}, {"pic": "1", "label": "正文①", "text": ["一开始，明华吞吞吐吐，似乎不知从何说起。后来，他还是向我透露了他的烦恼。", "“自从我爸爸过世后，妈妈一直是我们家的经济支柱。可是大约三个月前，妈妈病倒了，暂时无法工作。我只好代替她打工赚钱。我年纪太小，赚的钱不多，我们一家这阵子只能勉强维持生活。不过，这个月底，我恐怕交不出弟弟妹妹的学费。”明华难过地说着。", "我仔细观察明华，这才发现他的黑眼圈变得很深，脸色也很差，肯定是平时忙着上课和打工，没好好休息。我们这个年纪的孩子本来是不愁吃穿的，可明华却必须扛起一家的担子，赚钱养家，真是太辛苦了！一想到这里，我不禁替他难过起来。"]}, {"pic": "2", "label": "正文②", "text": ["这时，我想到了一个主意：“不如我们找老师一起帮你想想办法？”明华连忙摇头，表示不愿意麻烦老师。我尝试说服他，并告诉他这是帮助他弟妹最好的方法。慢慢的，明华的态度软化了。我便赶紧拉他回学校找级任老师林老师。", "林老师了解了明华的处境后，非常心疼。她称赞明华小小年纪就懂得照顾家人，十分难得，并提议通过学校发起筹款活动以帮助他解决经济困难。明华一脸难为情，平白无故接受同学们的经济援助让他很不好意思。于是，我提议举办一个小型的义卖会，并由明华主办，亲自筹款。"]}, {"pic": "3", "label": "正文③", "text": ["“我打假期工时学过制作不同造型的气球。我可以亲手制作造型气球来义卖！”明华说道。对于这个主意，我和林老师都连连点头，表示赞同。接着，我提议制作手工书签来卖，明华也说他的弟弟妹妹有绘画天分，可以负责制作手工卡片。就这样，我们开始为义卖会进行构思。大家越说越起劲，明华的脸上也少了先前的愁容。"]}, {"pic": "end", "text": ["最后，我们决定将义卖会定在来临的星期五。林老师表示明天就会向同学们发布义卖会的消息，同时也会联络相关单位帮助减轻明华妈妈的医药费。看着明华渐露笑容，我真心希望这次的义卖会能够筹得足够的款项，帮明华一家人度过眼前的难关。++俗话说：“赠人玫瑰，手有余香。”看着明华的笑容，我的心里也甜滋滋的。++"], "note": "慧眼改进：结尾补上名句和“我”的感受。"}]}}, "detective": []}, {"id": "psle2017-hc-q1", "title": "要成功就必须付出努力", "cat": "falls", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2017 高华 · 试卷一 Q1（情境作文）", "kind": "情境作文", "exam": "PSLE 2017 高华", "imgs": [], "drafts": [], "vocab": ["一致同意", "胸有成竹", "当头棒喝", "信心满满"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "1018", "info": "题目：《要成功就必须付出努力》｜情境：你和几个同学一起做一个专题作业，由于你没有付出太大的努力，结果没有取得成功。你从这件事中得到了宝贵的教训。｜出处：PSLE 2017 高华 · 试卷一 Q1（情境作文）", "segments": [{"pic": "start", "text": ["令人期待的三月假期即将到来！假期前夕，公民与道德教育老师在班上为我们分组，并安排了专题作业。这次的作业四人一组，老师希望我们开学后，在全班同学面前作口头报告，介绍新加坡文化色彩浓厚的地点。有趣的主题一揭晓，课室里顿时打破宁静。同学们马上召集组员，热烈地讨论起来。经过仔细考虑和筛选，我和组员们最终决定呈献“马来村”甘榜格南的特色。"]}, {"pic": "1", "label": "正文①", "text": ["晚上，组员文婷在手机群组里发了一条信息，说她的爸爸答应在假期中抽出一天，带大家到甘榜格南参观和拍照！这对我们的专题作业绝对有帮助，但我假期后马上就有铜乐队表演，接下来几乎每天都要回学校排练，没办法和组员一起行动。于是，大家一致同意让我负责上网搜集资料，他们则到甘榜格南实地考察和拍照。", "假期一开始，我就全情投入到铜乐队排练中。闲暇时，我总提不起劲做功课，只想着休息和玩乐。没想到时光如水，转瞬间，假期已过了一大半，剩下最后三天。意识到时间不多，我才心不甘情不愿地拿出功课，一个接一个地做。已经是午夜12点，这时，文婷在群组里约大家星期天出来为口头报告进行彩排。看了信息，我心头为之一震。糟了！我把口头报告给忘了！"]}, {"pic": "2", "label": "正文②", "text": ["隔天，一完成铜乐队排练，我就飞速冲回家，开始上网为专题作业找资料、做简报。由于时间有限，我只好随意看几份资料，然后把内容整理成简报。可想而知，星期天的口头报告彩排中，我的表现不尽理想。眼看组员们的简报有漂亮的照片和精彩的描述，我的却只有简单的文字、空洞的内容。再加上我来不及练习，因此口头报告也讲得不流利。排练结束后，组员们显得有些担心，但仍旧耐心地帮我指正内容，并鼓励我把台词练熟。", "口头报告那天，同学们的呈献都很精彩。关于各个新加坡景点的介绍让大家重新认识了这个岛国。然而，我实在太紧张，无法集中注意力享受同学们的报告。直到最后一刻，我仍在背稿。轮到我们组时，组员们个个信心满满，胸有成竹。我怕连累他们，只好硬着头皮上场。可是，我看着简报，却因为对内容不够熟悉，好几次出现头脑一片空白的情形。站在一旁的组员们都替我捏了一把冷汗，老师则忍不住皱眉头。"]}, {"pic": "end", "text": ["最终，我们组的总分不高，我想部分原因和我的表现脱离不了关系。课后，老师小声地对我说：“进行口头报告前，你一定要确保呈献的内容有价值，也要熟悉内容，不然就等于浪费了大家的时间。记住，付出多大努力，就会得到多大的收获。”老师的话犹如当头棒喝，让我明白要妥善安排时间和努力争取成功的重要性。虽然组员们事后没怪我，但这宝贵的一堂课，我想我以后都不会忘记。"]}]}, "imp": {"label": "慧眼改进版", "words": "1033", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：在老师的话后加一句名句。", "segments": [{"pic": "start", "text": ["令人期待的三月假期即将到来！假期前夕，公民与道德教育老师在班上为我们分组，并安排了专题作业。这次的作业四人一组，老师希望我们开学后，在全班同学面前作口头报告，介绍新加坡文化色彩浓厚的地点。有趣的主题一揭晓，课室里顿时打破宁静。同学们马上召集组员，热烈地讨论起来。经过仔细考虑和筛选，我和组员们最终决定呈献“马来村”甘榜格南的特色。"]}, {"pic": "1", "label": "正文①", "text": ["晚上，组员文婷在手机群组里发了一条信息，说她的爸爸答应在假期中抽出一天，带大家到甘榜格南参观和拍照！这对我们的专题作业绝对有帮助，但我假期后马上就有铜乐队表演，接下来几乎每天都要回学校排练，没办法和组员一起行动。于是，大家一致同意让我负责上网搜集资料，他们则到甘榜格南实地考察和拍照。", "假期一开始，我就全情投入到铜乐队排练中。闲暇时，我总提不起劲做功课，只想着休息和玩乐。没想到时光如水，转瞬间，假期已过了一大半，剩下最后三天。意识到时间不多，我才心不甘情不愿地拿出功课，一个接一个地做。已经是午夜12点，这时，文婷在群组里约大家星期天出来为口头报告进行彩排。看了信息，我心头为之一震。糟了！我把口头报告给忘了！"]}, {"pic": "2", "label": "正文②", "text": ["隔天，一完成铜乐队排练，我就飞速冲回家，开始上网为专题作业找资料、做简报。由于时间有限，我只好随意看几份资料，然后把内容整理成简报。可想而知，星期天的口头报告彩排中，我的表现不尽理想。眼看组员们的简报有漂亮的照片和精彩的描述，我的却只有简单的文字、空洞的内容。再加上我来不及练习，因此口头报告也讲得不流利。排练结束后，组员们显得有些担心，但仍旧耐心地帮我指正内容，并鼓励我把台词练熟。", "口头报告那天，同学们的呈献都很精彩。关于各个新加坡景点的介绍让大家重新认识了这个岛国。然而，我实在太紧张，无法集中注意力享受同学们的报告。直到最后一刻，我仍在背稿。轮到我们组时，组员们个个信心满满，胸有成竹。我怕连累他们，只好硬着头皮上场。可是，我看着简报，却因为对内容不够熟悉，好几次出现头脑一片空白的情形。站在一旁的组员们都替我捏了一把冷汗，老师则忍不住皱眉头。"]}, {"pic": "end", "text": ["最终，我们组的总分不高，我想部分原因和我的表现脱离不了关系。课后，老师小声地对我说：“进行口头报告前，你一定要确保呈献的内容有价值，也要熟悉内容，不然就等于浪费了大家的时间。记住，付出多大努力，就会得到多大的收获。”老师的话犹如当头棒喝，让我明白要妥善安排时间和努力争取成功的重要性。++正所谓“一分耕耘，一分收获。”++虽然组员们事后没怪我，但这宝贵的一堂课，我想我以后都不会忘记。"], "note": "慧眼改进：在老师的话后加一句名句。"}]}}, "detective": []}, {"id": "psle2017-hc-q2", "title": "和“死对头”一起当值日生", "cat": "bonds", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2017 高华 · 试卷一 Q2（完成文章）", "kind": "完成文章", "exam": "PSLE 2017 高华", "imgs": [], "drafts": [], "vocab": ["大吃一惊", "大摇大摆", "窃窃私语", "脸色苍白", "脱口而出", "气喘吁吁", "哈哈大笑", "休息时间", "不好意思", "三步并作两步"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "1056", "info": "题目：以下面的情节作为开头，完成这篇文章——今天，级任老师把今年打扫课室的工作安排表发给了大家。看了工作安排表后我大吃一惊。老师明明知道我和小丽一向合不来，却还把我们放在同一组……｜出处：PSLE 2017 高华 · 试卷一 Q2（完成文章）", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["今天，级任老师把今年打扫课室的工作安排表发给了大家。看了工作安排表后我大吃一惊。老师明明知道我和小丽一向合不来，却还把我们放在同一组……"]}, {"pic": "1", "label": "正文①", "text": ["而且安排的日期竟然是今天！我抬头瞥向小丽，只见她脸上也明显露出嫌弃的表情。和我对视的那一刻，我们俩马上别过脸，拒绝做任何交流。", "我和小丽具体不合的原因，我其实已经忘了。依稀记得去年的某一天，我和她因为讨论专题作业而意见不合，结果闹到教务室去。因此我们看不对眼的事，不仅全班同学都知道，甚至也传到各科老师的耳里。自此，我再也没有和她说话，就算在外偶遇，彼此也互当透明。我们怎么能一起当值日生呢？想到这里，我心中的不满持续燃烧。我连忙举手说：“老师，我想换组员！”这时，课室的另一边也有人举手附和：“我也想换组员！”奇怪，我们什么时候这么有默契了？我在心里嘀咕。", "“不行！工作安排表已经定了。大家好好合作，共同保持课室清洁！”说完，老师就宣布下课，并请今天的值日生帮忙擦白板。未等我反应，小丽马上站起来，抢先擦白板。擦完白板，她大摇大摆地回到座位，一副得意的样子。我咽不下这口气，到了下一节课结束后，我也三步并作两步地上前擦白板。1比1，比分扳平。同学们对于我和小丽之间的“较劲”似乎很感兴趣，开始窃窃私语，猜测我们接下来的“表现”如何。"]}, {"pic": "2", "label": "正文②", "text": ["这时，美华忽然大叫一声，原来她的邻桌明光不知为何，吐了一地。同学们一阵惊慌，身为值日生的我和小丽赶紧上前查看。班长见明光脸色苍白，便决定和美华一起把他扶到病休室。看着地上、桌上的呕吐物，我赶紧对小丽说：“我先拿抹布擦桌子，你去找校工帮忙。”“我为什么要听你的？”小丽不屑地说。“现在不是吵架的时候，你快去吧！”我脱口而出。小丽听了，便默默地照着我的话做。", "刚好休息时间到了，同学们一个个离开课室。呕吐物的味道开始弥漫整间课室，我忍不住捂住鼻子。不久，小丽拿着一个拖把气喘吁吁地回来，还说她找不到校工，但已经通知了级任老师。“我们一起把课室清理干净吧！”小丽看着我说。我听了，点点头表示同意。就这样，我们一人拿着抹布，一人拿着拖把打扫，谁也没说话。"]}, {"pic": "3", "label": "正文③", "text": ["过了一会儿，小丽打破了沉默：“上一回，我不该和你吵架。新的一年里，我们好好相处吧。”见她主动示好，我有些惊讶，反倒不好意思起来。我小声说：“我以前也有错。过去的事，我们就忘了吧。”此时，小丽露出了微笑。"]}, {"pic": "end", "text": ["“你们会这么想就好了！”级任老师不知从什么时候开始，悄悄地在后门观察我们。“看来，我把你们安排在同一组打扫课室是一个正确的决定！”咦，莫非这是老师的“诡计”？我向小丽挑了挑眉，顿时我们都忍不住哈哈大笑。"]}]}, "imp": {"label": "慧眼改进版", "words": "1092", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：原文停在笑声里，补一句名句和结局。", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["今天，级任老师把今年打扫课室的工作安排表发给了大家。看了工作安排表后我大吃一惊。老师明明知道我和小丽一向合不来，却还把我们放在同一组……"]}, {"pic": "1", "label": "正文①", "text": ["而且安排的日期竟然是今天！我抬头瞥向小丽，只见她脸上也明显露出嫌弃的表情。和我对视的那一刻，我们俩马上别过脸，拒绝做任何交流。", "我和小丽具体不合的原因，我其实已经忘了。依稀记得去年的某一天，我和她因为讨论专题作业而意见不合，结果闹到教务室去。因此我们看不对眼的事，不仅全班同学都知道，甚至也传到各科老师的耳里。自此，我再也没有和她说话，就算在外偶遇，彼此也互当透明。我们怎么能一起当值日生呢？想到这里，我心中的不满持续燃烧。我连忙举手说：“老师，我想换组员！”这时，课室的另一边也有人举手附和：“我也想换组员！”奇怪，我们什么时候这么有默契了？我在心里嘀咕。", "“不行！工作安排表已经定了。大家好好合作，共同保持课室清洁！”说完，老师就宣布下课，并请今天的值日生帮忙擦白板。未等我反应，小丽马上站起来，抢先擦白板。擦完白板，她大摇大摆地回到座位，一副得意的样子。我咽不下这口气，到了下一节课结束后，我也三步并作两步地上前擦白板。1比1，比分扳平。同学们对于我和小丽之间的“较劲”似乎很感兴趣，开始窃窃私语，猜测我们接下来的“表现”如何。"]}, {"pic": "2", "label": "正文②", "text": ["这时，美华忽然大叫一声，原来她的邻桌明光不知为何，吐了一地。同学们一阵惊慌，身为值日生的我和小丽赶紧上前查看。班长见明光脸色苍白，便决定和美华一起把他扶到病休室。看着地上、桌上的呕吐物，我赶紧对小丽说：“我先拿抹布擦桌子，你去找校工帮忙。”“我为什么要听你的？”小丽不屑地说。“现在不是吵架的时候，你快去吧！”我脱口而出。小丽听了，便默默地照着我的话做。", "刚好休息时间到了，同学们一个个离开课室。呕吐物的味道开始弥漫整间课室，我忍不住捂住鼻子。不久，小丽拿着一个拖把气喘吁吁地回来，还说她找不到校工，但已经通知了级任老师。“我们一起把课室清理干净吧！”小丽看着我说。我听了，点点头表示同意。就这样，我们一人拿着抹布，一人拿着拖把打扫，谁也没说话。"]}, {"pic": "3", "label": "正文③", "text": ["过了一会儿，小丽打破了沉默：“上一回，我不该和你吵架。新的一年里，我们好好相处吧。”见她主动示好，我有些惊讶，反倒不好意思起来。我小声说：“我以前也有错。过去的事，我们就忘了吧。”此时，小丽露出了微笑。"]}, {"pic": "end", "text": ["“你们会这么想就好了！”级任老师不知从什么时候开始，悄悄地在后门观察我们。“看来，我把你们安排在同一组打扫课室是一个正确的决定！”咦，莫非这是老师的“诡计”？我向小丽挑了挑眉，顿时我们都忍不住哈哈大笑。", "++俗话说：“冤家宜解不宜结。”从那天起，我和小丽成了一对无话不谈的好朋友。++"], "note": "慧眼改进：原文停在笑声里，补一句名句和结局。"}]}}, "detective": []}, {"id": "psle2018-hc-q1", "title": "我获得了意想不到的表扬", "cat": "guts", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2018 高华 · 试卷一 Q1（情境作文）", "kind": "情境作文", "exam": "PSLE 2018 高华", "imgs": [], "drafts": [], "vocab": ["紧锣密鼓", "一晃而过", "鸦雀无声", "面面相觑", "不知所措", "心里暖暖", "缺乏信心", "关键时刻"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "746", "info": "题目：《我获得了意想不到的表扬》｜情境：你是个文静、害羞的人，一向对自己缺乏信心。有一天，你做了一件事，没想到却获得了表扬。这件事让你明白了一个道理。｜出处：PSLE 2018 高华 · 试卷一 Q1（情境作文）", "segments": [{"pic": "start", "text": ["一直以来，大家对我的评价都是文静、害羞。我一向对自己缺乏信心，做过最大胆的事或许就是加入学校的合唱团，在众人前表演。然而，这个举动并没有成功地帮我去除害羞的毛病。我始终觉得自己的歌声不如人，每次只敢混在团队中，小声地跟着大家唱。"]}, {"pic": "1", "label": "正文①", "text": ["今年，我班被指定在国庆日庆祝会上呈献一段演出。一听到消息，我眼前又是一阵晕眩。不会吧？我们竟然要在全校师生面前跳舞！为了不搞砸演出，我自动站到最后一排，与同学们开始紧锣密鼓地排舞。", "时间一晃而过，国庆日庆祝会上，我们全班同学站在舞台上准备就绪。熟悉的国庆组曲响起，大家随着节奏开始跳舞。就在气氛开始变得热烈时，音乐忽然停止，全场鸦雀无声。这时，负责控盘的同学从后台喊道：“音响系统出了问题！”我们听了面面相觑，瞬间有些不知所措。"]}, {"pic": "2", "label": "正文②", "text": ["看着同学们失望的神情，我心里很不好受，得想个办法让演出继续才行！想着想着，我不自觉地走到麦克风前，唱起我们准备的组曲。看到台下众多双眼睛，我心里很胆怯，但我对自己说：“不要退缩，你行的！”接着，我向台上的同学们投去鼓励的目光。他们原本呆愣的表情马上被笑容取代。大家各就各位，随着我的演唱表演舞蹈，并和我一起哼着歌曲。表演结束后，礼堂里响起如雷的掌声，台下的老师还向我们比了赞的手势。", "“韵婷，你太棒了，多亏有你！”“是啊，没想到你唱歌这么好听！”一下台，我就被同学们团团包围。他们你一言我一语，满满的都是称赞。这好像是我头一次听到这么多赞美我的话，还真有点不太适应。回到课室里，级任老师也在全班面前表扬我在关键时刻反应机智，帮助大家完成表演。此时，我感觉到双颊发烫，心里暖暖的。没想到我的举动能够带来这么好的反响，而且大家竟然那么喜欢我的歌声。"]}, {"pic": "end", "text": ["这件事让我明白只要相信自己，就能把事情做好。从今以后，我要对自己更有信心，改变文静、害羞的性格！"]}]}, "imp": {"label": "慧眼改进版", "words": "785", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：原文结尾较短，补一句名句和形象的感受。", "segments": [{"pic": "start", "text": ["一直以来，大家对我的评价都是文静、害羞。我一向对自己缺乏信心，做过最大胆的事或许就是加入学校的合唱团，在众人前表演。然而，这个举动并没有成功地帮我去除害羞的毛病。我始终觉得自己的歌声不如人，每次只敢混在团队中，小声地跟着大家唱。"]}, {"pic": "1", "label": "正文①", "text": ["今年，我班被指定在国庆日庆祝会上呈献一段演出。一听到消息，我眼前又是一阵晕眩。不会吧？我们竟然要在全校师生面前跳舞！为了不搞砸演出，我自动站到最后一排，与同学们开始紧锣密鼓地排舞。", "时间一晃而过，国庆日庆祝会上，我们全班同学站在舞台上准备就绪。熟悉的国庆组曲响起，大家随着节奏开始跳舞。就在气氛开始变得热烈时，音乐忽然停止，全场鸦雀无声。这时，负责控盘的同学从后台喊道：“音响系统出了问题！”我们听了面面相觑，瞬间有些不知所措。"]}, {"pic": "2", "label": "正文②", "text": ["看着同学们失望的神情，我心里很不好受，得想个办法让演出继续才行！想着想着，我不自觉地走到麦克风前，唱起我们准备的组曲。看到台下众多双眼睛，我心里很胆怯，但我对自己说：“不要退缩，你行的！”接着，我向台上的同学们投去鼓励的目光。他们原本呆愣的表情马上被笑容取代。大家各就各位，随着我的演唱表演舞蹈，并和我一起哼着歌曲。表演结束后，礼堂里响起如雷的掌声，台下的老师还向我们比了赞的手势。", "“韵婷，你太棒了，多亏有你！”“是啊，没想到你唱歌这么好听！”一下台，我就被同学们团团包围。他们你一言我一语，满满的都是称赞。这好像是我头一次听到这么多赞美我的话，还真有点不太适应。回到课室里，级任老师也在全班面前表扬我在关键时刻反应机智，帮助大家完成表演。此时，我感觉到双颊发烫，心里暖暖的。没想到我的举动能够带来这么好的反响，而且大家竟然那么喜欢我的歌声。"]}, {"pic": "end", "text": ["这件事让我明白只要相信自己，就能把事情做好。从今以后，我要对自己更有信心，改变文静、害羞的性格！++俗话说：“天生我材必有用。”原来，只要勇敢地迈出第一步，害羞的我也能发光发亮。++"], "note": "慧眼改进：原文结尾较短，补一句名句和形象的感受。"}]}}, "detective": []}, {"id": "psle2018-hc-q2", "title": "电话那头传来陌生人的声音", "cat": "bonds", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2018 高华 · 试卷一 Q2（完成文章）", "kind": "完成文章", "exam": "PSLE 2018 高华", "imgs": [], "drafts": [], "vocab": ["截然不同"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "957", "info": "题目：以下面的情节作为开头，完成这篇文章——比赛结束了，我得了第一名，心里非常高兴。我想和好友分享这个好消息，就立即给他打电话。电话接通了，可是从手机的另一头却传来一个陌生人的声音……｜出处：PSLE 2018 高华 · 试卷一 Q2（完成文章）", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["比赛结束了，我得了第一名，心里非常高兴。我想和好友分享这个好消息，就立即给他打电话。电话接通了，可是从手机的另一头却传来一个陌生人的声音……"]}, {"pic": "1", "label": "正文①", "text": ["：“喂，找谁啊？”电话另一端陌生且沧桑的声音让我愣了一会儿。我是不是打错电话了？我立刻回过神来看了一下手机荧幕，是好友育文的名字没错啊！然而这个声音却与育文的截然不同。“喂，俊豪，我现在去学校和你会面，这里发生了一些事，待会儿再向你解释。”这时电话里传来了育文的声音，让我稍微松了一口气。", "过了大约二十分钟，育文抵达了校门口。在他身旁有一位老奶奶，紧紧地勾着他的手。当老奶奶见到我时，脸上瞬间充满喜悦，并且立刻上前抱住我。“小明乖，奶奶好久没见到你了！”我满脸问号地看着育文，非常好奇这位老奶奶到底是谁。经育文解释，我才知道这位老奶奶刚才在路上一看见他就拉着他的手不放，好像迷了路，神志也不太清晰，很可能是失智症患者。"]}, {"pic": "2", "label": "正文②", "text": ["由于问不出老奶奶的住址，我和育文便寻求一位老师的帮助，要把老奶奶带到附近的警局。在路上，我尝试和老奶奶交谈，听她分享个人经历：她十八岁结婚，婚后育有五个孩子。虽然家庭不算富裕，但孩子们乖巧懂事，个个长大后都事业有成。说着，她便从口袋里拿出一张照片想要给我看。这时，一张名片同时从她的口袋里掉了出来。我捡起名片，看到上面有个联络号码，便赶紧把它交给老师。说不定这名片的主人就是老奶奶的家人！老师马上拨电，接电话的人原来是老奶奶的大儿子。太好了！老师于是和他约了一个地点见面。", "我们一抵达预约地点，就有一位穿着整洁的中年男子走向我们，然后紧紧地握着老奶奶的手，说道：“妈，终于找到你了！”老奶奶什么也没说，只是微笑着抚摸男子的额头。后来，这位男子告诉我们，老奶奶是在和女佣散步的时候走丢的。他和其他兄弟姐妹近年忙于工作，很少有时间探望老奶奶，而照顾老奶奶的责任就落到了女佣身上。老师听了，说：“老奶奶很可能是因为太想孩子与孙子，才会想自己去找他们。”男子惭愧地看着自己的母亲，眼眶里泛起了泪光。"]}, {"pic": "end", "text": ["男子向我们连声道谢后便带着老奶奶离开，我和育文则向老师道别，然后肩并肩走回家。一路上，我不断地想起与老奶奶的对话，还有她那思念亲人的眼神。我默默地对自己许下承诺，长大后不管多忙，都一定要抽出时间关心身边的亲人。今天能够帮助老奶奶找回家人，这份成就感比赢得比赛还来得更加珍贵。"]}]}, "imp": {"label": "慧眼改进版", "words": "969", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：在承诺前加一句名句。", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["比赛结束了，我得了第一名，心里非常高兴。我想和好友分享这个好消息，就立即给他打电话。电话接通了，可是从手机的另一头却传来一个陌生人的声音……"]}, {"pic": "1", "label": "正文①", "text": ["：“喂，找谁啊？”电话另一端陌生且沧桑的声音让我愣了一会儿。我是不是打错电话了？我立刻回过神来看了一下手机荧幕，是好友育文的名字没错啊！然而这个声音却与育文的截然不同。“喂，俊豪，我现在去学校和你会面，这里发生了一些事，待会儿再向你解释。”这时电话里传来了育文的声音，让我稍微松了一口气。", "过了大约二十分钟，育文抵达了校门口。在他身旁有一位老奶奶，紧紧地勾着他的手。当老奶奶见到我时，脸上瞬间充满喜悦，并且立刻上前抱住我。“小明乖，奶奶好久没见到你了！”我满脸问号地看着育文，非常好奇这位老奶奶到底是谁。经育文解释，我才知道这位老奶奶刚才在路上一看见他就拉着他的手不放，好像迷了路，神志也不太清晰，很可能是失智症患者。"]}, {"pic": "2", "label": "正文②", "text": ["由于问不出老奶奶的住址，我和育文便寻求一位老师的帮助，要把老奶奶带到附近的警局。在路上，我尝试和老奶奶交谈，听她分享个人经历：她十八岁结婚，婚后育有五个孩子。虽然家庭不算富裕，但孩子们乖巧懂事，个个长大后都事业有成。说着，她便从口袋里拿出一张照片想要给我看。这时，一张名片同时从她的口袋里掉了出来。我捡起名片，看到上面有个联络号码，便赶紧把它交给老师。说不定这名片的主人就是老奶奶的家人！老师马上拨电，接电话的人原来是老奶奶的大儿子。太好了！老师于是和他约了一个地点见面。", "我们一抵达预约地点，就有一位穿着整洁的中年男子走向我们，然后紧紧地握着老奶奶的手，说道：“妈，终于找到你了！”老奶奶什么也没说，只是微笑着抚摸男子的额头。后来，这位男子告诉我们，老奶奶是在和女佣散步的时候走丢的。他和其他兄弟姐妹近年忙于工作，很少有时间探望老奶奶，而照顾老奶奶的责任就落到了女佣身上。老师听了，说：“老奶奶很可能是因为太想孩子与孙子，才会想自己去找他们。”男子惭愧地看着自己的母亲，眼眶里泛起了泪光。"]}, {"pic": "end", "text": ["男子向我们连声道谢后便带着老奶奶离开，我和育文则向老师道别，然后肩并肩走回家。一路上，我不断地想起与老奶奶的对话，还有她那思念亲人的眼神。++俗话说：“百善孝为先。”++我默默地对自己许下承诺，长大后不管多忙，都一定要抽出时间关心身边的亲人。今天能够帮助老奶奶找回家人，这份成就感比赢得比赛还来得更加珍贵。"], "note": "慧眼改进：在承诺前加一句名句。"}]}}, "detective": []}, {"id": "psle2019-hc-q1", "title": "相信朋友", "cat": "falls", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2019 高华 · 试卷一 Q1（情境作文）", "kind": "情境作文", "exam": "PSLE 2019 高华", "imgs": [], "drafts": [], "vocab": ["宽宏大量", "七嘴八舌", "喃喃自语", "四分五裂", "火冒三丈", "目瞪口呆", "不择手段", "取得胜利", "战战兢兢", "来龙去脉", "一口咬定", "下定决心"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "1359", "info": "题目：《相信朋友》｜情境：你总是爱怀疑别人，就因为这样，有一天你错怪了一个朋友，害他受了委屈。这件事让你明白，相信朋友是很重要的。｜出处：PSLE 2019 高华 · 试卷一 Q1（情境作文）", "segments": [{"pic": "start", "text": ["佳良是我多年的好朋友，但是我因为多疑的毛病，而错怪了他。尽管如此，佳良不但没怀恨在心，反而原谅了我。佳良对我的宽宏大量，更让我明白了相信朋友的重要。每当我看见书桌上的手工作品，就会想起去年发生的事件……"]}, {"pic": "1", "label": "正文①", "text": ["去年开学的第一周，美术班的陈老师说要选一位同学当美术课代表。同学们听老师这么一说，七嘴八舌地议论起来，猜测谁会当选。", "“同学们，先听我说。学校正在举办一项废物再循环手工创作比赛。大家得在一个星期内收集材料并把手工做出。比赛的冠军得主，将被选为今年的美术课代表！”陈老师说。", "听老师这么一说，同学们兴奋得不得了。大家都觉得这次选课代表的方式很有意义，既能让同学们展现才艺，又能鼓励大家为环保尽一份力。", "我喜欢美术，当然希望获选为美术课代表。放学后，我请家人帮我收集些再循环材料。我构思了一番，然后利用收集的塑料瓶、瓶盖、吸管等制作出一个精美的摆设品。看着自己完成的作品，我心里乐滋滋的。我信心满满，自己能在这项比赛中获胜。", "第二天，一走进课室，我马上把手工作品放在书桌上。同学们都一窝蜂地围过来看我的作品。大家看了我的作品，纷纷赞好。", "“我不同意大家的看法，我认为佳良的手工做得更好，美术课代表应该由他当！”子聪说。"]}, {"pic": "2", "label": "正文②", "text": ["子聪这么一说，我的心都沉了。我喃喃自语道：难道我做的手工不比佳良的好？如果老师也那么觉得，那我不就当不上美术课代表了？", "这时，佳良正好经过我的座位。他拿起我的手工来看。", "“林宣，你的手真巧，竟然能在这么短的时间内做出这么精美的手工来！我还要多多向你学习呢！”佳良笑着对我说。", "我看了看佳良，心想：我太了解你了。你心里根本就想当美术课代表，却还称赞我做的手工精美？", "就在这时，休息的钟声响起了。同学们都到食堂去吃东西。由于下一堂课就是美术课，我把手工作品放在书桌上就去休息了。", "休息后，我便回到课室，却被眼前的一幕吓呆了，放声大喊：“啊！我的手工作品怎么坏了！是……是谁干的！”看着眼前原本漂亮的手工作品现在“四分五裂”了，我又心痛又愤怒。", "同学们都被我的喊叫声惊动了，纷纷围了过来。", "“一定是你，佳良！你担心老师也觉得我的手工作品比你的精美，所以你就……”我火冒三丈骂道。", "佳良一脸的委屈，目瞪口呆地看着我。等他回过神来时，向我解释道：“我没……我没破坏你的手工作品。我当然也想当美术课代表，但，我是不会不择手段陷害别人的。如果为了取得胜利而故意破坏你的作品，就算我当上美术课代表，那也不光彩啊！”"]}, {"pic": "3", "label": "正文③", "text": ["就在这个时候，一个人战战兢兢地走到我面前。我定睛一看，原来是我们班的“马虎大王”雯雯。", "“对不起，请你原谅我。是我……是我刚才做值日时，不小心碰撞到你桌上的手工作品。我本来想用胶水把脱落的部分黏上，希望能修补并还原你的手工作品。但是脱落的部分太多了，我真的不知道该怎么办才好。我害怕被你骂，所以假装不知道这件事情。真的对不起……”雯雯脸青唇白，一脸歉意地解释。", "此时的我，脸羞得像苹果一样红。我没调查事情的来龙去脉，就以小人之心，一口咬定是佳良破坏我的手工作品。啊！如果有一个地洞让我钻进去躲起来就好了。"]}, {"pic": "end", "text": ["我静下心来反省，知道是自己的疑心太重了。现在，每当我看到这个手工作品，不自觉的，又会想起自己因为多疑错怪了和我关系要好的佳良。我下定决心改掉这个多疑的毛病，以免更多人被冤枉，受委屈。更重要的是，我了解到相信朋友的重要，友谊的可贵！"]}]}, "imp": {"label": "慧眼改进版", "words": "1385", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：加一个成语，写出“我”的惭愧。", "segments": [{"pic": "start", "text": ["佳良是我多年的好朋友，但是我因为多疑的毛病，而错怪了他。尽管如此，佳良不但没怀恨在心，反而原谅了我。佳良对我的宽宏大量，更让我明白了相信朋友的重要。每当我看见书桌上的手工作品，就会想起去年发生的事件……"]}, {"pic": "1", "label": "正文①", "text": ["去年开学的第一周，美术班的陈老师说要选一位同学当美术课代表。同学们听老师这么一说，七嘴八舌地议论起来，猜测谁会当选。", "“同学们，先听我说。学校正在举办一项废物再循环手工创作比赛。大家得在一个星期内收集材料并把手工做出。比赛的冠军得主，将被选为今年的美术课代表！”陈老师说。", "听老师这么一说，同学们兴奋得不得了。大家都觉得这次选课代表的方式很有意义，既能让同学们展现才艺，又能鼓励大家为环保尽一份力。", "我喜欢美术，当然希望获选为美术课代表。放学后，我请家人帮我收集些再循环材料。我构思了一番，然后利用收集的塑料瓶、瓶盖、吸管等制作出一个精美的摆设品。看着自己完成的作品，我心里乐滋滋的。我信心满满，自己能在这项比赛中获胜。", "第二天，一走进课室，我马上把手工作品放在书桌上。同学们都一窝蜂地围过来看我的作品。大家看了我的作品，纷纷赞好。", "“我不同意大家的看法，我认为佳良的手工做得更好，美术课代表应该由他当！”子聪说。"]}, {"pic": "2", "label": "正文②", "text": ["子聪这么一说，我的心都沉了。我喃喃自语道：难道我做的手工不比佳良的好？如果老师也那么觉得，那我不就当不上美术课代表了？", "这时，佳良正好经过我的座位。他拿起我的手工来看。", "“林宣，你的手真巧，竟然能在这么短的时间内做出这么精美的手工来！我还要多多向你学习呢！”佳良笑着对我说。", "我看了看佳良，心想：我太了解你了。你心里根本就想当美术课代表，却还称赞我做的手工精美？", "就在这时，休息的钟声响起了。同学们都到食堂去吃东西。由于下一堂课就是美术课，我把手工作品放在书桌上就去休息了。", "休息后，我便回到课室，却被眼前的一幕吓呆了，放声大喊：“啊！我的手工作品怎么坏了！是……是谁干的！”看着眼前原本漂亮的手工作品现在“四分五裂”了，我又心痛又愤怒。", "同学们都被我的喊叫声惊动了，纷纷围了过来。", "“一定是你，佳良！你担心老师也觉得我的手工作品比你的精美，所以你就……”我火冒三丈骂道。", "佳良一脸的委屈，目瞪口呆地看着我。等他回过神来时，向我解释道：“我没……我没破坏你的手工作品。我当然也想当美术课代表，但，我是不会不择手段陷害别人的。如果为了取得胜利而故意破坏你的作品，就算我当上美术课代表，那也不光彩啊！”"]}, {"pic": "3", "label": "正文③", "text": ["就在这个时候，一个人战战兢兢地走到我面前。我定睛一看，原来是我们班的“马虎大王”雯雯。", "“对不起，请你原谅我。是我……是我刚才做值日时，不小心碰撞到你桌上的手工作品。我本来想用胶水把脱落的部分黏上，希望能修补并还原你的手工作品。但是脱落的部分太多了，我真的不知道该怎么办才好。我害怕被你骂，所以假装不知道这件事情。真的对不起……”雯雯脸青唇白，一脸歉意地解释。", "此时的我，脸羞得像苹果一样红。我没调查事情的来龙去脉，就以小人之心，一口咬定是佳良破坏我的手工作品。啊！如果有一个地洞让我钻进去躲起来就好了。"]}, {"pic": "end", "text": ["++正所谓“以小人之心，度君子之腹”，我真是错怪了佳良。++我静下心来反省，知道是自己的疑心太重了。现在，每当我看到这个手工作品，不自觉的，又会想起自己因为多疑错怪了和我关系要好的佳良。我下定决心改掉这个多疑的毛病，以免更多人被冤枉，受委屈。更重要的是，我了解到相信朋友的重要，友谊的可贵！"], "note": "慧眼改进：加一个成语，写出“我”的惭愧。"}]}}, "detective": []}, {"id": "psle2019-hc-q2", "title": "陌生阿姨来接我们放学", "cat": "whoops", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2019 高华 · 试卷一 Q2（完成文章）", "kind": "完成文章", "exam": "PSLE 2019 高华", "imgs": [], "drafts": [], "vocab": ["掉以轻心", "虚惊一场", "乱了阵脚", "不好意思", "话音刚落"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "1164", "info": "题目：以下面的情节作为开头，完成这篇文章——放学了，我和邻居国华像往常一样，在学校等他的妈妈来接我们一起回家。可是，今天却来了一个陌生的阿姨。她说国华的妈妈没空，所以叫她来接我们回家……｜出处：PSLE 2019 高华 · 试卷一 Q2（完成文章）", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["放学了，我和邻居国华像往常一样，在学校等他的妈妈来接我们一起回家。可是，今天却来了一个陌生的阿姨。她说国华的妈妈没空，所以叫她来接我们回家……"]}, {"pic": "1", "label": "正文①", "text": ["我原本还想跟着这个陌生阿姨一起回家，但是想着想着，越觉得不对劲。顿时，我的心“扑通扑通”直跳，仿佛一颗不知何时会爆炸的炸弹。我一脸担忧地看着国华，心想：上个星期，妈妈才跟我分享了一则有关绑架孩童案件的新闻，难道眼前这个陌生的女人，也是……", "“国华，我是你妈妈的朋友，林阿姨。我们快走吧！”那个阿姨拉着国华的手说道。", "“嗯，林……林阿姨。我从来没听过妈妈提起您……”国华说。", "我站在一旁看着，悄悄地碰了碰国华的手，向他打了个眼神。国华一时间像是回过了神，镇定地说：“不，妈妈说好今天放学会来接我和家明的。她还答应带我们去吃麦当劳！妈妈肯定会来接我们的！”", "“别担心，我不是坏人。我真的是你妈妈多年的老朋友。我前天刚从台湾回到新加坡。其实，我已经和你的妈妈约定好，这个星期天我会亲手下厨，请她到我的家去吃晚餐。”林阿姨摸摸国华的头，语气温柔地说。"]}, {"pic": "2", "label": "正文②", "text": ["林阿姨看了看手表，已经快下午一点三十分了。", "“国华，你和你的朋友应该饿了吧！不如我先带你们去吃午餐，好吗？”林阿姨说。", "林阿姨的话音刚落，国华的肚子咕噜咕噜叫了起来。国华有点不好意思，捂着自己的肚子，皱着眉头。", "眼看国华有意要跟林阿姨走，我连忙上前去阻止，说：“国华，老师常常提醒同学们，害人之心不可有，防人之心不可无！你从来没见过这位阿姨，怎么可以贸贸然跟着她走呢？更何况这段日子，新闻时有报道诈骗案的发生，也曾发生过陌生人到学校试图把别人的孩子带走的情况。我们千万不要掉以轻心，随意相信陌生人的话。”", "已经饿得双脚发软，两眼冒星的国华忽然听见一把熟悉的声音。“国华！原来你和家明还在学校！你们真是让我担心死了！我原本临时得加班开会，所以请林阿姨先来接你们回家。公司后来又取消会议，我回到家时，半个人影都没有，害我吓了一跳，急忙冲来学校。”国华的妈妈像机关枪一样一口气把话说完。"]}, {"pic": "3", "label": "正文③", "text": ["国华紧张的情绪一下子释放出来，他流着泪，搂着妈妈。妈妈也紧紧地把国华拥抱在怀里。", "“妈妈对不起……我不认识林阿姨，所以不敢轻易跟着她走。这么迟没回家，害您担心了……”国华抽泣着说。", "“阿姨，您别怪国华了。我也跟国华说不要轻易相信外人，以免上当，所以我们才会到现在还没离开学校。”我向国华的妈妈道歉。", "“你们俩都做得对，一定要时刻提高警惕。是我自己一时大意，没空来接你们，应该通知学校的老师转告你们。对了，以后碰到这种情况，你们可以先给妈妈打电话，确认情况后就不会产生任何误会了！”国华的妈妈解释道。", "“好了，大家都饿了。就让我请大家吃午餐吧！待会儿我们再边吃边聊吧！”林阿姨说。"]}, {"pic": "end", "text": ["这一天可说是虚惊一场。国华和我都上了宝贵的一课。以后遇到同样的状况，我们肯定会保持镇定，不要一时慌张而乱了阵脚。"]}]}, "imp": {"label": "慧眼改进版", "words": "1202", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：结尾补一句名句和具体做法。", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["放学了，我和邻居国华像往常一样，在学校等他的妈妈来接我们一起回家。可是，今天却来了一个陌生的阿姨。她说国华的妈妈没空，所以叫她来接我们回家……"]}, {"pic": "1", "label": "正文①", "text": ["我原本还想跟着这个陌生阿姨一起回家，但是想着想着，越觉得不对劲。顿时，我的心“扑通扑通”直跳，仿佛一颗不知何时会爆炸的炸弹。我一脸担忧地看着国华，心想：上个星期，妈妈才跟我分享了一则有关绑架孩童案件的新闻，难道眼前这个陌生的女人，也是……", "“国华，我是你妈妈的朋友，林阿姨。我们快走吧！”那个阿姨拉着国华的手说道。", "“嗯，林……林阿姨。我从来没听过妈妈提起您……”国华说。", "我站在一旁看着，悄悄地碰了碰国华的手，向他打了个眼神。国华一时间像是回过了神，镇定地说：“不，妈妈说好今天放学会来接我和家明的。她还答应带我们去吃麦当劳！妈妈肯定会来接我们的！”", "“别担心，我不是坏人。我真的是你妈妈多年的老朋友。我前天刚从台湾回到新加坡。其实，我已经和你的妈妈约定好，这个星期天我会亲手下厨，请她到我的家去吃晚餐。”林阿姨摸摸国华的头，语气温柔地说。"]}, {"pic": "2", "label": "正文②", "text": ["林阿姨看了看手表，已经快下午一点三十分了。", "“国华，你和你的朋友应该饿了吧！不如我先带你们去吃午餐，好吗？”林阿姨说。", "林阿姨的话音刚落，国华的肚子咕噜咕噜叫了起来。国华有点不好意思，捂着自己的肚子，皱着眉头。", "眼看国华有意要跟林阿姨走，我连忙上前去阻止，说：“国华，老师常常提醒同学们，害人之心不可有，防人之心不可无！你从来没见过这位阿姨，怎么可以贸贸然跟着她走呢？更何况这段日子，新闻时有报道诈骗案的发生，也曾发生过陌生人到学校试图把别人的孩子带走的情况。我们千万不要掉以轻心，随意相信陌生人的话。”", "已经饿得双脚发软，两眼冒星的国华忽然听见一把熟悉的声音。“国华！原来你和家明还在学校！你们真是让我担心死了！我原本临时得加班开会，所以请林阿姨先来接你们回家。公司后来又取消会议，我回到家时，半个人影都没有，害我吓了一跳，急忙冲来学校。”国华的妈妈像机关枪一样一口气把话说完。"]}, {"pic": "3", "label": "正文③", "text": ["国华紧张的情绪一下子释放出来，他流着泪，搂着妈妈。妈妈也紧紧地把国华拥抱在怀里。", "“妈妈对不起……我不认识林阿姨，所以不敢轻易跟着她走。这么迟没回家，害您担心了……”国华抽泣着说。", "“阿姨，您别怪国华了。我也跟国华说不要轻易相信外人，以免上当，所以我们才会到现在还没离开学校。”我向国华的妈妈道歉。", "“你们俩都做得对，一定要时刻提高警惕。是我自己一时大意，没空来接你们，应该通知学校的老师转告你们。对了，以后碰到这种情况，你们可以先给妈妈打电话，确认情况后就不会产生任何误会了！”国华的妈妈解释道。", "“好了，大家都饿了。就让我请大家吃午餐吧！待会儿我们再边吃边聊吧！”林阿姨说。"]}, {"pic": "end", "text": ["这一天可说是虚惊一场。国华和我都上了宝贵的一课。以后遇到同样的状况，我们肯定会保持镇定，不要一时慌张而乱了阵脚。++俗话说：“小心驶得万年船。”以后遇到陌生人来接，我们一定先打电话向家人确认。++"], "note": "慧眼改进：结尾补一句名句和具体做法。"}]}}, "detective": []}, {"id": "psle2020-hc-q1", "title": "没尽到责任的结果", "cat": "falls", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2020 高华 · 试卷一 Q1（情境作文）", "kind": "情境作文", "exam": "PSLE 2020 高华", "imgs": [], "drafts": [], "vocab": ["兴致勃勃", "隔壁邻居", "火冒三丈", "功亏一篑", "不负责任", "眉头紧锁", "满头大汗", "下定决心", "组屋楼下", "电脑游戏", "再也不敢"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "1617", "info": "题目：《没尽到责任的结果》｜情境：有一天，你的家人要你去做一件事。因为你忙于做别的事情，没有完成那个任务，这使你的家人受到影响。这件事让你得到了宝贵的教训。｜出处：PSLE 2020 高华 · 试卷一 Q1（情境作文）", "segments": [{"pic": "start", "text": ["虽然这件事已经过了半年，然而每当我看到抽屉里的这张《全家出动，欢庆国庆》参赛表格，心中不由充满内疚。"]}, {"pic": "1", "label": "正文①", "text": ["记得六月假期的一个早上，爸爸在吃早餐时兴致勃勃地对我们一家人说：“今早去晨运时，我看到民众俱乐部为配合国庆庆典，举办了一项才艺比赛。这项才艺比赛的名称是《全家出动，欢庆国庆》。凡是参加这项才艺比赛的小组必须由同一个家庭成员组成，最少两人，最多五人。才艺比赛的范围限制在歌唱、乐器演奏、短剧表演，每个家庭小组可以任选一个项目报名参赛。重点是无论选择哪个项目参赛，都必须融入爱国的主题。”", "“这个比赛真有趣。我们报名参加吧！”妈妈提议道。", "我们边吃早餐，边讨论着要报名参加哪个项目。最终，我们一致决定参加短剧表演。念中学的姐姐是学校中文学会的会员。这一次短剧剧本的创作，我们就交由姐姐去负责了。妈妈善于唱歌，爸爸又会弹吉他，因此爸爸妈妈决定相互配合，在短剧里穿插爱国歌曲和吉他表演。", "一个星期后，姐姐就把短剧的剧本编写出来了。我们利用星期天的早上，一起看剧本。“现在我们拿到剧本，各自知道自己的戏份和台词了。现在是年中学校假期，你们姐弟俩可以抽空把自己的台词背好，两个星期后我们再一起来排练。希望到时我们各自都能把自己的戏份演好！”妈妈说。", "姐姐非常懂得安排时间。每天早上，她先做老师布置的假期作业，下午她就专门用来背台词。爸爸要上班，妈妈有许多家务事要做，因此他们只能每晚利用饭后的时间进行排练。看见大家这么积极准备短剧表演，一向贪玩的我下定决心，这次一定要好好练习。"]}, {"pic": "2", "label": "正文②", "text": ["正当我收拾好贪玩的心情，坐下来准备背台词时，隔壁邻居家明出现在我家门口。只见家明拉着一台崭新发亮的踏板车对我说：“子荃，你不是很想玩踏板车吗？我的爸爸昨天刚给我买了一台，我们一起到组屋楼下的空地去玩吧！”", "我看着手中的剧本，再看看家明那诱人的踏板车，一时难做决定。心里经过一阵挣扎，我最终还是抵不过诱惑，放下剧本跟着家明去玩踏板车。我们轮流玩踏板车，越滑越起劲，一眨眼半天就过去了。这时，我才想到自己的剧本还没背。我一时心虚，跟家明说：“我该回家了，我还有重要的事情没做！”回家前，我和家明约定好假期的每个下午都一同玩滑板车。", "回家的路上，我的心里难逃那份愧疚感。为了弥补下午浪费掉的时间，我决定回到家就开始背台词。我也下定决心从明天起，每天吃过早餐就背台词。谁知玩得满头大汗的我，一踏进房门，就累得躺在床上呼呼大睡。那剧本原封不动地躺在桌子上。接下来的几个早上，我没遵守自己许下的诺言，吃过早餐后又坐在电脑前玩起电脑游戏来。", "就这样，一晃两个星期就过去了。“子玲、子荃，今天我们来一次比赛前的彩排吧！相信你们一定都充分地利用假期的时间，把台词背熟了！”爸爸妈妈兴奋地召集我们一家来排练。"]}, {"pic": "3", "label": "正文③", "text": ["这下可完了。过去的两个星期，我不是玩电脑游戏，就是忙着和家明玩滑板车。我急坏了，心扑通扑通地跳着，直冒冷汗。妈妈看见我好像不太对劲的样子，走到我身边，轻声说：“子荃，怎么啦？你是不是有什么心事？”", "“我……我……对不起，其实这两个星期我把背剧本的事全抛到了脑后。我不是玩电脑游戏就是玩滑板车。下个星期就要比赛了，我没把握能把台词背熟。”", "爸爸听了，眉头紧锁，火冒三丈地瞪着我。妈妈此时也满脸怒气。姐姐虽然没什么表示，但是我感觉得到她很失望。", "“我们之前已经说好了，《全家出动，欢庆国庆》的比赛必须全家合作，才能把短剧表演好。就因为你一个人没准备，妈妈和姐姐之前的努力就功亏一篑了。看来下个星期的比赛，我们一家人是不可能参加了！”爸爸拉长着脸说。", "“为了给你一个教训，接下来的一年，你不许玩电脑游戏。没有经过我的同意，你也不准再去和家明玩踏板车了！我还要你写悔过书！”妈妈说。我知道都是自己的错，只好默默接受处罚。"]}, {"pic": "end", "text": ["每当我看到《全家出动，欢庆国庆》这张参赛表格，心里仍隐隐作痛，毕竟是我连累了全家。大家付出的努力，就因为我不负责任的行为而化成了泡影。这件事，让我得到了宝贵的教训。我再也不敢这么不负责任了。"]}]}, "imp": {"label": "慧眼改进版", "words": "1652", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：加一句名句，点出“贪玩误事”，再写以后怎么做。", "segments": [{"pic": "start", "text": ["虽然这件事已经过了半年，然而每当我看到抽屉里的这张《全家出动，欢庆国庆》参赛表格，心中不由充满内疚。"]}, {"pic": "1", "label": "正文①", "text": ["记得六月假期的一个早上，爸爸在吃早餐时兴致勃勃地对我们一家人说：“今早去晨运时，我看到民众俱乐部为配合国庆庆典，举办了一项才艺比赛。这项才艺比赛的名称是《全家出动，欢庆国庆》。凡是参加这项才艺比赛的小组必须由同一个家庭成员组成，最少两人，最多五人。才艺比赛的范围限制在歌唱、乐器演奏、短剧表演，每个家庭小组可以任选一个项目报名参赛。重点是无论选择哪个项目参赛，都必须融入爱国的主题。”", "“这个比赛真有趣。我们报名参加吧！”妈妈提议道。", "我们边吃早餐，边讨论着要报名参加哪个项目。最终，我们一致决定参加短剧表演。念中学的姐姐是学校中文学会的会员。这一次短剧剧本的创作，我们就交由姐姐去负责了。妈妈善于唱歌，爸爸又会弹吉他，因此爸爸妈妈决定相互配合，在短剧里穿插爱国歌曲和吉他表演。", "一个星期后，姐姐就把短剧的剧本编写出来了。我们利用星期天的早上，一起看剧本。“现在我们拿到剧本，各自知道自己的戏份和台词了。现在是年中学校假期，你们姐弟俩可以抽空把自己的台词背好，两个星期后我们再一起来排练。希望到时我们各自都能把自己的戏份演好！”妈妈说。", "姐姐非常懂得安排时间。每天早上，她先做老师布置的假期作业，下午她就专门用来背台词。爸爸要上班，妈妈有许多家务事要做，因此他们只能每晚利用饭后的时间进行排练。看见大家这么积极准备短剧表演，一向贪玩的我下定决心，这次一定要好好练习。"]}, {"pic": "2", "label": "正文②", "text": ["正当我收拾好贪玩的心情，坐下来准备背台词时，隔壁邻居家明出现在我家门口。只见家明拉着一台崭新发亮的踏板车对我说：“子荃，你不是很想玩踏板车吗？我的爸爸昨天刚给我买了一台，我们一起到组屋楼下的空地去玩吧！”", "我看着手中的剧本，再看看家明那诱人的踏板车，一时难做决定。心里经过一阵挣扎，我最终还是抵不过诱惑，放下剧本跟着家明去玩踏板车。我们轮流玩踏板车，越滑越起劲，一眨眼半天就过去了。这时，我才想到自己的剧本还没背。我一时心虚，跟家明说：“我该回家了，我还有重要的事情没做！”回家前，我和家明约定好假期的每个下午都一同玩滑板车。", "回家的路上，我的心里难逃那份愧疚感。为了弥补下午浪费掉的时间，我决定回到家就开始背台词。我也下定决心从明天起，每天吃过早餐就背台词。谁知玩得满头大汗的我，一踏进房门，就累得躺在床上呼呼大睡。那剧本原封不动地躺在桌子上。接下来的几个早上，我没遵守自己许下的诺言，吃过早餐后又坐在电脑前玩起电脑游戏来。", "就这样，一晃两个星期就过去了。“子玲、子荃，今天我们来一次比赛前的彩排吧！相信你们一定都充分地利用假期的时间，把台词背熟了！”爸爸妈妈兴奋地召集我们一家来排练。"]}, {"pic": "3", "label": "正文③", "text": ["这下可完了。过去的两个星期，我不是玩电脑游戏，就是忙着和家明玩滑板车。我急坏了，心扑通扑通地跳着，直冒冷汗。妈妈看见我好像不太对劲的样子，走到我身边，轻声说：“子荃，怎么啦？你是不是有什么心事？”", "“我……我……对不起，其实这两个星期我把背剧本的事全抛到了脑后。我不是玩电脑游戏就是玩滑板车。下个星期就要比赛了，我没把握能把台词背熟。”", "爸爸听了，眉头紧锁，火冒三丈地瞪着我。妈妈此时也满脸怒气。姐姐虽然没什么表示，但是我感觉得到她很失望。", "“我们之前已经说好了，《全家出动，欢庆国庆》的比赛必须全家合作，才能把短剧表演好。就因为你一个人没准备，妈妈和姐姐之前的努力就功亏一篑了。看来下个星期的比赛，我们一家人是不可能参加了！”爸爸拉长着脸说。", "“为了给你一个教训，接下来的一年，你不许玩电脑游戏。没有经过我的同意，你也不准再去和家明玩踏板车了！我还要你写悔过书！”妈妈说。我知道都是自己的错，只好默默接受处罚。"]}, {"pic": "end", "text": ["每当我看到《全家出动，欢庆国庆》这张参赛表格，心里仍隐隐作痛，毕竟是我连累了全家。大家付出的努力，就因为我不负责任的行为而化成了泡影。++正所谓“业精于勤，荒于嬉。”++这件事，让我得到了宝贵的教训。我再也不敢这么不负责任了。++从此，答应了别人的事，我一定先做好再去玩。++"], "note": "慧眼改进：加一句名句，点出“贪玩误事”，再写以后怎么做。"}]}}, "detective": []}, {"id": "psle2020-hc-q2", "title": "那本不见了的励志书", "cat": "falls", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2020 高华 · 试卷一 Q2（完成文章）", "kind": "完成文章", "exam": "PSLE 2020 高华", "imgs": [], "drafts": [], "vocab": ["同窗好友", "心乱如麻", "十分复杂", "天渊之别", "贼头贼脑", "鬼鬼祟祟", "洋洋得意", "微微一笑", "宽宏大量", "突飞猛进", "勇往直前", "泪水直流"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "1272", "info": "题目：以下面的情节作为开头，完成这篇文章——昨天离开学校时，我不小心把一本书留在课室的桌子上。今天一早，我急忙跑到课室去，但书已经不见了。我感到很慌张，因为书里有一些重要的东西。一时间，我的脑海里浮现了各种想法……｜出处：PSLE 2020 高华 · 试卷一 Q2（完成文章）", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["昨天离开学校时，我不小心把一本书留在课室的桌子上。今天一早，我急忙跑到课室去，但书已经不见了。我感到很慌张，因为书里有一些重要的东西。一时间，我的脑海里浮现了各种想法……"]}, {"pic": "1", "label": "正文①", "text": ["：会不会是校工阿姨打扫课室时把它拿走了？又或是我的死对头明伟趁我早上还没到课室时，偷偷把我的书藏起来？又或是……", "我越想心里越乱，心里越乱越无法做出理智的判断。这本书，我一直把它当成宝。现在书不见了，我心特别慌，特别难受，鼻子一酸，泪水一滴滴滑下脸颊。", "这本书对我来说特别重要。它是我念四年级的同窗好友琦琦送给我的。记得两年前我由于贪玩，平时不温习功课，总是到考试前才临时抱佛脚。正因为如此，四年级的年终考试，我是完全没做准备就上考场的。", "数学一向是我最差的科目，就算平时多做练习题，我还是没什么把握答题，更何况这一回的考试，我基本上是没做任何准备。我拿到考卷时，脑里一片空白。看着纸上密密麻麻的数字，我的心乱如麻。", "我之前答应妈妈，年终考试一定要把数学这一科考好，还承诺会加倍努力复习。妈妈也答应我，只要这回数学考到八十分，就给我买一套我最爱的漫画书。我看着那陌生的卷子，心里像打翻了五味瓶似的，心情十分复杂。我不想让妈妈失望，也很想获得那套漫画书。"]}, {"pic": "2", "label": "正文②", "text": ["这时，我的心产生了不好的念头。我忽然想起我的邻桌好友文文是班上的数学天才。他的数学考试每回即使没考满分也有九十六分，与我刚及格的分数简直是天渊之别。我像小偷一样，贼头贼脑，鬼鬼祟祟地瞄了瞄四周。我看见老师没注意，便悄悄转过头，尝试偷看文文作答卷上的答案。", "啊，看来幸运之星这一天降临在我身上。文文作答后，竟然忘了遮盖他的答案。我根本无需花多大功夫，就把答案抄了下来。我为自己如此轻松就能“作答”而洋洋得意。我还以为没人发现我偷看的举动。", "忽然，文文对我比了个手势。完了，原来我的举动，文文全看在眼里。我的脸一下铁青，心怦怦直跳。我以哀求的眼神看着文文，希望他不要把我这不良的行为告知老师。", "善良的文文对我微微一笑，稍稍点了点头。我明白了，他这回原谅了我，不会把我偷抄答案的事向老师告状。文文的宽宏大量，让我更深感内疚。我默默告诉自己，从今以后要发奋把数学这一科搞好。那一次的数学考试，虽然我的成绩突飞猛进，然而我一点也不开心，一点也不自豪。我也不敢跟妈妈要那套漫画书。"]}, {"pic": "3", "label": "正文③", "text": ["学期末放假前的一天，文文送我一份礼物。原来文文年底就要搬家了，五年级将转校。文文不仅没把我抄袭的行为放在心上，反而还送我礼物，这让我感动万分。", "回到家，我拆开礼物，发现原来是一本故事书。我打开一看，里头都是一些励志故事。故事书里还夹着几张我和文文的合照。其中一张照片的背面写着：致我最要好的同桌伟强：希望你继续努力，勇往直前。只有自己努力，成功才是属于你的。希望你好好阅读这本书里的励志故事，相信你会得到启发。加油！看着照片上的这些字，我再也控制不住自己，泪水直流。从此，我总把这本励志故事书随身带着，每回失落时，就拿出来读。"]}, {"pic": "end", "text": ["如今，因为我一时大意，没把书收好，现在怎么也找不回这个“宝贝”。现在我唯一能做的，就是默默祷告，希望文文送我的这本励志故事书能奇迹般地回到我身边……"]}]}, "imp": {"label": "慧眼改进版", "words": "1330", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：原文停在“希望书能回来”，补上作弊这件事给“我”的教训。", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["昨天离开学校时，我不小心把一本书留在课室的桌子上。今天一早，我急忙跑到课室去，但书已经不见了。我感到很慌张，因为书里有一些重要的东西。一时间，我的脑海里浮现了各种想法……"]}, {"pic": "1", "label": "正文①", "text": ["：会不会是校工阿姨打扫课室时把它拿走了？又或是我的死对头明伟趁我早上还没到课室时，偷偷把我的书藏起来？又或是……", "我越想心里越乱，心里越乱越无法做出理智的判断。这本书，我一直把它当成宝。现在书不见了，我心特别慌，特别难受，鼻子一酸，泪水一滴滴滑下脸颊。", "这本书对我来说特别重要。它是我念四年级的同窗好友琦琦送给我的。记得两年前我由于贪玩，平时不温习功课，总是到考试前才临时抱佛脚。正因为如此，四年级的年终考试，我是完全没做准备就上考场的。", "数学一向是我最差的科目，就算平时多做练习题，我还是没什么把握答题，更何况这一回的考试，我基本上是没做任何准备。我拿到考卷时，脑里一片空白。看着纸上密密麻麻的数字，我的心乱如麻。", "我之前答应妈妈，年终考试一定要把数学这一科考好，还承诺会加倍努力复习。妈妈也答应我，只要这回数学考到八十分，就给我买一套我最爱的漫画书。我看着那陌生的卷子，心里像打翻了五味瓶似的，心情十分复杂。我不想让妈妈失望，也很想获得那套漫画书。"]}, {"pic": "2", "label": "正文②", "text": ["这时，我的心产生了不好的念头。我忽然想起我的邻桌好友文文是班上的数学天才。他的数学考试每回即使没考满分也有九十六分，与我刚及格的分数简直是天渊之别。我像小偷一样，贼头贼脑，鬼鬼祟祟地瞄了瞄四周。我看见老师没注意，便悄悄转过头，尝试偷看文文作答卷上的答案。", "啊，看来幸运之星这一天降临在我身上。文文作答后，竟然忘了遮盖他的答案。我根本无需花多大功夫，就把答案抄了下来。我为自己如此轻松就能“作答”而洋洋得意。我还以为没人发现我偷看的举动。", "忽然，文文对我比了个手势。完了，原来我的举动，文文全看在眼里。我的脸一下铁青，心怦怦直跳。我以哀求的眼神看着文文，希望他不要把我这不良的行为告知老师。", "善良的文文对我微微一笑，稍稍点了点头。我明白了，他这回原谅了我，不会把我偷抄答案的事向老师告状。文文的宽宏大量，让我更深感内疚。我默默告诉自己，从今以后要发奋把数学这一科搞好。那一次的数学考试，虽然我的成绩突飞猛进，然而我一点也不开心，一点也不自豪。我也不敢跟妈妈要那套漫画书。"]}, {"pic": "3", "label": "正文③", "text": ["学期末放假前的一天，文文送我一份礼物。原来文文年底就要搬家了，五年级将转校。文文不仅没把我抄袭的行为放在心上，反而还送我礼物，这让我感动万分。", "回到家，我拆开礼物，发现原来是一本故事书。我打开一看，里头都是一些励志故事。故事书里还夹着几张我和文文的合照。其中一张照片的背面写着：致我最要好的同桌伟强：希望你继续努力，勇往直前。只有自己努力，成功才是属于你的。希望你好好阅读这本书里的励志故事，相信你会得到启发。加油！看着照片上的这些字，我再也控制不住自己，泪水直流。从此，我总把这本励志故事书随身带着，每回失落时，就拿出来读。"]}, {"pic": "end", "text": ["如今，因为我一时大意，没把书收好，现在怎么也找不回这个“宝贝”。现在我唯一能做的，就是默默祷告，希望文文送我的这本励志故事书能奇迹般地回到我身边……", "++这本书也一直提醒着我：靠作弊得来的分数一点也不光彩。正所谓“一分耕耘，一分收获”，只有自己努力，成功才真正属于自己。++"], "note": "慧眼改进：原文停在“希望书能回来”，补上作弊这件事给“我”的教训。"}]}}, "detective": []}, {"id": "psle2021-hc-q1", "title": "帮助朋友让我上了宝贵的一课", "cat": "falls", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2021 高华 · 试卷一 Q1（情境作文）", "kind": "情境作文", "exam": "PSLE 2021 高华", "imgs": [], "drafts": [], "vocab": ["助人为乐", "毫不犹豫", "寄予厚望", "心里有数", "闷闷不乐", "提前完成", "助人为快", "休息时间", "伸出援手", "脸色铁青"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "1357", "info": "题目：《帮助朋友让我上了宝贵的一课》｜情境：你的好朋友大伟遇到了一个困难。你知道帮助朋友是很重要的，所以你主动去帮他。然而这一次，你的好意却给自己带来了一些麻烦。经过这件事，你上了宝贵的一课。｜出处：PSLE 2021 高华 · 试卷一 Q1（情境作文）", "segments": [{"pic": "start", "text": ["从小，妈妈和老师就灌输我助人为乐的道理。因此，每当我发现身边的朋友有困难，需要帮助时，我总会毫不犹豫地伸出援手。然而，有时候“帮人”反倒害了自己，给自己带来麻烦，就像我帮助大伟一样。那一次的经验可谓让我上了宝贵的一课。"]}, {"pic": "1", "label": "正文①", "text": ["大伟是我的邻居，也是我小一到小四的同桌好友。大伟的学业成绩一向很不错，只有数学比较逊色。而我恰恰相反，语文和科学的成绩一般，数学却是我的强项。从小一到小四，全年级最佳数学奖都由我包揽。", "大伟对自己的学习要求十分高，父母也对他寄予厚望。打从三年级开始，他已经为自己设下目标，要考进新加坡的顶尖中学。然而，大伟心里有数，自己若不想办法提高数学成绩，肯定会影响小六会考的整体表现。为此，大伟每天放学后除了完成老师布置的作业，还会捧着课外数学练习册埋头苦练。我当然十分乐意帮助大伟。每当看见大伟在我细心解释下顺利完成所有数学习题，我的心就像吃了蜜一样的甜。", "升上五年级后，大伟被分到甲班，而我则在乙班学习。大伟为此闷闷不乐，担心没有我在身旁帮他，他的数学成绩会退步。看见大伟一脸忧愁，我安慰他道：“别担心，就算我们不在同班上课，你也能在休息时间来找我，我会帮你的！”“一言为定！”大伟边和我勾勾手，边开心地应道。"]}, {"pic": "2", "label": "正文②", "text": ["就这样，大伟每天休息时间一定来找我复习数学习题。我们相互讨论，彼此间的友情在共同研究数学题中加深了。然而今天休息时，我迟迟都没看到大伟的身影。难道……难道他发生什么事了？我跑到五甲班的课室查看，只见课室黑漆漆的，想必是没人。正当我要离开时，却听到有人哭泣的声音。我转身走进课室，看见大伟蹲在一个角落伤心地落泪。“怎么了，大伟？”我轻声问道。", "“子霖，我……我担心会在奥林匹克班级选拔赛中落选，到时不能代表甲班参加全国小学奥林匹克比赛，父母亲一定会对我严加惩罚的。”大伟边说边摇头叹气。", "看见大伟如此担心，忽然一个念头涌上我心头。“大伟，告诉你一个秘密，下个星期一我得参加钢琴考试，不能来上课，因此老师特别允许我提前完成选拔赛的试卷。待会儿我把试卷给你，你先拿回家复习一遍，下个星期一肯定能轻轻松松地完成题目！”大伟听了，频频向我道谢。"]}, {"pic": "3", "label": "正文③", "text": ["我以为大伟有了我的试卷后，星期一必定能攻下选拔赛的考题。怎料，我当天下午却被陈老师叫进了甲班的课室。原来，甲班的题目竟然和乙班的不一样！大伟因为发现眼前的题目像外星人一样陌生，一时感到心慌，便悄悄地把我给他的试卷拿出来偷瞄。结果，甲班的陈老师很快就留意到他作弊的行为，把他歹个正着。大伟敌不过老师的逼问，只好把我和他的计划供出来。", "“你们好大胆啊，竟然敢作弊！”陈老师大吼道，脸色铁青。她那双冒着怒火的双眼仿佛就要把我和大伟吃了似的。我和大伟站在陈老师的面前，羞红着脸，真希望有个洞能钻进去。"]}, {"pic": "end", "text": ["“子霖同学，帮助同学固然是一件好事，但是你这样把答案试卷给大伟参考，不但不是在帮他，反而是害了他。比赛是一场公平竞争，你这不就是在帮他作弊吗？就算大伟因为得到你的帮助而拿满分，这也不是他真正的实力啊！老师希望你明白这一点。为了让你俩记住所犯的错，老师将禁止你们两人参赛！”老师严厉地说道。哎，这回可真是帮人反倒害了自己。我的好意给自己带来了麻烦，错失了能参赛的机会。经过这件事，我算是上了宝贵的一课。尽管助人为快乐之本，但是帮助他人前一定要先三思，不要用不对的方式或手段帮人。"]}]}, "imp": {"label": "慧眼改进版", "words": "1386", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：改一个错别字，结尾补一句“真正的帮助是什么”。", "segments": [{"pic": "start", "text": ["从小，妈妈和老师就灌输我助人为乐的道理。因此，每当我发现身边的朋友有困难，需要帮助时，我总会毫不犹豫地伸出援手。然而，有时候“帮人”反倒害了自己，给自己带来麻烦，就像我帮助大伟一样。那一次的经验可谓让我上了宝贵的一课。"]}, {"pic": "1", "label": "正文①", "text": ["大伟是我的邻居，也是我小一到小四的同桌好友。大伟的学业成绩一向很不错，只有数学比较逊色。而我恰恰相反，语文和科学的成绩一般，数学却是我的强项。从小一到小四，全年级最佳数学奖都由我包揽。", "大伟对自己的学习要求十分高，父母也对他寄予厚望。打从三年级开始，他已经为自己设下目标，要考进新加坡的顶尖中学。然而，大伟心里有数，自己若不想办法提高数学成绩，肯定会影响小六会考的整体表现。为此，大伟每天放学后除了完成老师布置的作业，还会捧着课外数学练习册埋头苦练。我当然十分乐意帮助大伟。每当看见大伟在我细心解释下顺利完成所有数学习题，我的心就像吃了蜜一样的甜。", "升上五年级后，大伟被分到甲班，而我则在乙班学习。大伟为此闷闷不乐，担心没有我在身旁帮他，他的数学成绩会退步。看见大伟一脸忧愁，我安慰他道：“别担心，就算我们不在同班上课，你也能在休息时间来找我，我会帮你的！”“一言为定！”大伟边和我勾勾手，边开心地应道。"]}, {"pic": "2", "label": "正文②", "text": ["就这样，大伟每天休息时间一定来找我复习数学习题。我们相互讨论，彼此间的友情在共同研究数学题中加深了。然而今天休息时，我迟迟都没看到大伟的身影。难道……难道他发生什么事了？我跑到五甲班的课室查看，只见课室黑漆漆的，想必是没人。正当我要离开时，却听到有人哭泣的声音。我转身走进课室，看见大伟蹲在一个角落伤心地落泪。“怎么了，大伟？”我轻声问道。", "“子霖，我……我担心会在奥林匹克班级选拔赛中落选，到时不能代表甲班参加全国小学奥林匹克比赛，父母亲一定会对我严加惩罚的。”大伟边说边摇头叹气。", "看见大伟如此担心，忽然一个念头涌上我心头。“大伟，告诉你一个秘密，下个星期一我得参加钢琴考试，不能来上课，因此老师特别允许我提前完成选拔赛的试卷。待会儿我把试卷给你，你先拿回家复习一遍，下个星期一肯定能轻轻松松地完成题目！”大伟听了，频频向我道谢。"]}, {"pic": "3", "label": "正文③", "text": ["我以为大伟有了我的试卷后，星期一必定能攻下选拔赛的考题。怎料，我当天下午却被陈老师叫进了甲班的课室。原来，甲班的题目竟然和乙班的不一样！大伟因为发现眼前的题目像外星人一样陌生，一时感到心慌，便悄悄地把我给他的试卷拿出来偷瞄。结果，甲班的陈老师很快就留意到他作弊的行为，把他~~歹个正着~~++逮个正着++。大伟敌不过老师的逼问，只好把我和他的计划供出来。", "“你们好大胆啊，竟然敢作弊！”陈老师大吼道，脸色铁青。她那双冒着怒火的双眼仿佛就要把我和大伟吃了似的。我和大伟站在陈老师的面前，羞红着脸，真希望有个洞能钻进去。"]}, {"pic": "end", "text": ["“子霖同学，帮助同学固然是一件好事，但是你这样把答案试卷给大伟参考，不但不是在帮他，反而是害了他。比赛是一场公平竞争，你这不就是在帮他作弊吗？就算大伟因为得到你的帮助而拿满分，这也不是他真正的实力啊！老师希望你明白这一点。为了让你俩记住所犯的错，老师将禁止你们两人参赛！”老师严厉地说道。哎，这回可真是帮人反倒害了自己。我的好意给自己带来了麻烦，错失了能参赛的机会。经过这件事，我算是上了宝贵的一课。尽管助人为快乐之本，但是帮助他人前一定要先三思，不要用不对的方式或手段帮人。++真正的帮助，是陪朋友一起把题目弄懂，而不是直接把答案给他。++"], "note": "慧眼改进：改一个错别字，结尾补一句“真正的帮助是什么”。"}]}}, "detective": []}, {"id": "psle2021-hc-q2", "title": "看了停水通告，我决定先不回家", "cat": "whoops", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2021 高华 · 试卷一 Q2（完成文章）", "kind": "完成文章", "exam": "PSLE 2021 高华", "imgs": [], "drafts": [], "vocab": ["今明两天", "津津有味", "不亦乐乎", "汗流浃背", "突如其来", "组屋楼下", "电脑游戏", "煮快熟面", "包扎伤口", "玩得不亦乐乎", "越玩越起劲"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "1371", "info": "题目：以下面的情节作为开头，完成这篇文章——有一天，我走到组屋楼下，.注意到一张贴在电梯旁的布告栏上的通告，于是停下脚步仔细阅读。读了以后，我决定先不回家。我……｜出处：PSLE 2021 高华 · 试卷一 Q2（完成文章）", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["有一天，我走到组屋楼下，注意到一张贴在电梯旁的布告栏上的通告，于是停下脚步仔细阅读。读了以后，我决定先不回家。我……"]}, {"pic": "1", "label": "正文①", "text": ["获知是有居民投诉家中自来水呈淡淡的褐色，公用事业局将展开调查，看看这一带的组屋水供是否遭污染，因此今明两天下午两点开始，我们这几座组屋将暂停水供应，以便专人前来调查以及清洗水箱。我看了看手表，再过五分钟就要暂停供水了，那我不是不能回家煮快熟面吃了？", "想着想着，我的肚子已经咕噜咕噜地叫了起来。哎，看来今天只好花钱去咖啡店买食物了。我掏出钱包，往里头一看，怎么只剩五角钱？这下我才发现妈妈忘了给我零用钱。真是倒霉！今天看来只能去请我的好友伟祥“收留”我几个小时。", "幸好伟祥住的地方离我家不远，只需搭十分钟的车就到达了。“伟祥，是我，明轩！请开开门！”我边按门铃边道。", "“明轩，你怎么会跑来找我啊？你吃过午餐了吗？”伟祥问道。", "“哎，别说了，我住的组屋今天下午两点起暂停水供应，我刚放学，还没吃午餐，家里水供应暂停，我怎么解决我的午餐？本想去咖啡店买食物，却发现钱包只剩五角钱，所以……只能打扰你，来你家‘避难’。”", "听我这么说，伟祥赶紧到厨房拿出两包快熟面。我们俩好像小厨师，在冰箱找出鸡蛋、青菜和午餐肉，准备烹煮“大餐”。没一会儿功夫，两碗热腾腾的面便准备好了。尽管是很简单的一碗面，然而因为是我和好友一起下厨烹煮的，所以吃起来特别津津有味。我们边吃边聊，好不开心。"]}, {"pic": "2", "label": "正文②", "text": ["“对了，和你分享一个好消息。我上个星期参加了全国小学生华语讲故事比赛，得了第一名。你看，这台新的电脑游戏机就是父母亲奖励我的。我们一块儿玩吧！”伟祥说。", "听到“游戏”这两个字，我的双眼顿时亮了起来。我们碗也没洗，就飞奔去玩电脑游戏了。我们越玩越兴奋、越玩越起劲，不时还紧张得又踩脚又喊叫。时间飞逝，一眨眼已经过了两个小时。正当我们玩得不亦乐乎时，门外传来敲门声。", "“今天的天气很好，我们去骑脚踏车吧！”原来是伟祥的邻居，李华来了。", "“明文，你也一块儿来吧。反正我的哥哥还没回来，你可以先骑他的脚踏车。”伟祥对我说。我想：反正还有时间，那就和朋友一块儿去骑脚踏车吧！", "我骑上了伟祥哥哥的脚踏车，感觉自己的个子矮小了点，想踩踏板都有点困难。尽管如此，我还是勉强继续骑。伟祥和李明骑起车来好轻松，他们俩越骑越快，好像脱缰的野马一样。我在后面吃力地骑着，眼看他们的身影越来越远，我的心可着急了。此时，我已经汗流浃背了，豆大般的汗珠子不停往我脸颊流，模糊了我的视线。我竟然没有发现前方有个垃圾桶，一头撞上去。"]}, {"pic": "3", "label": "正文③", "text": ["这个撞击力也太大了！我被抛飞，然后重重地摔在了地上。我想爬起来，却发现双脚痛极了。天啊，原来我的双膝都流血了。此时，伟祥和李明回来找我，看见我双脚受伤，疼得爬不起来，都吓得脸青唇白。过了一会儿，伟祥回过神来，说：“我看还是打电话通知你的父母吧！”", "接到这通突如其来的电话，我的妈妈急坏了，赶紧从公司赶到我出事的地点。妈妈见我伤得不轻，脸色一下沉了下去。原本想教训我一顿，但看见我痛苦的样子，妈妈只好先送我去医院让医生检查伤势。幸好我只是受了皮外伤，医生帮我包扎伤口后便能回家了。", "回家的路上，我一五一十地把今天所有的“遭遇”告诉妈妈。“以后无论看到什么通告或是在外发生什么事，记得一定要先通知爸爸妈妈，不能自作主张不回家。”妈妈摸摸我的头说道。"]}, {"pic": "end", "text": ["我频频点头，答应妈妈下回肯定不会再这么做了。"]}]}, "imp": {"label": "慧眼改进版", "words": "1417", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：原文人名前后不一致（明轩／明文、李华／李明），已改正；结尾太短，补上名句和道理。", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["有一天，我走到组屋楼下，注意到一张贴在电梯旁的布告栏上的通告，于是停下脚步仔细阅读。读了以后，我决定先不回家。我……"]}, {"pic": "1", "label": "正文①", "text": ["获知是有居民投诉家中自来水呈淡淡的褐色，公用事业局将展开调查，看看这一带的组屋水供是否遭污染，因此今明两天下午两点开始，我们这几座组屋将暂停水供应，以便专人前来调查以及清洗水箱。我看了看手表，再过五分钟就要暂停供水了，那我不是不能回家煮快熟面吃了？", "想着想着，我的肚子已经咕噜咕噜地叫了起来。哎，看来今天只好花钱去咖啡店买食物了。我掏出钱包，往里头一看，怎么只剩五角钱？这下我才发现妈妈忘了给我零用钱。真是倒霉！今天看来只能去请我的好友伟祥“收留”我几个小时。", "幸好伟祥住的地方离我家不远，只需搭十分钟的车就到达了。“伟祥，是我，明轩！请开开门！”我边按门铃边道。", "“明轩，你怎么会跑来找我啊？你吃过午餐了吗？”伟祥问道。", "“哎，别说了，我住的组屋今天下午两点起暂停水供应，我刚放学，还没吃午餐，家里水供应暂停，我怎么解决我的午餐？本想去咖啡店买食物，却发现钱包只剩五角钱，所以……只能打扰你，来你家‘避难’。”", "听我这么说，伟祥赶紧到厨房拿出两包快熟面。我们俩好像小厨师，在冰箱找出鸡蛋、青菜和午餐肉，准备烹煮“大餐”。没一会儿功夫，两碗热腾腾的面便准备好了。尽管是很简单的一碗面，然而因为是我和好友一起下厨烹煮的，所以吃起来特别津津有味。我们边吃边聊，好不开心。"]}, {"pic": "2", "label": "正文②", "text": ["“对了，和你分享一个好消息。我上个星期参加了全国小学生华语讲故事比赛，得了第一名。你看，这台新的电脑游戏机就是父母亲奖励我的。我们一块儿玩吧！”伟祥说。", "听到“游戏”这两个字，我的双眼顿时亮了起来。我们碗也没洗，就飞奔去玩电脑游戏了。我们越玩越兴奋、越玩越起劲，不时还紧张得又踩脚又喊叫。时间飞逝，一眨眼已经过了两个小时。正当我们玩得不亦乐乎时，门外传来敲门声。", "“今天的天气很好，我们去骑脚踏车吧！”~~原来是伟祥的邻居，李华来了~~++原来是伟祥的邻居，李明来了++。", "~~“明文，你也一块儿来吧~~++“明轩，你也一块儿来吧++。反正我的哥哥还没回来，你可以先骑他的脚踏车。”伟祥对我说。我想：反正还有时间，那就和朋友一块儿去骑脚踏车吧！", "我骑上了伟祥哥哥的脚踏车，感觉自己的个子矮小了点，想踩踏板都有点困难。尽管如此，我还是勉强继续骑。伟祥和李明骑起车来好轻松，他们俩越骑越快，好像脱缰的野马一样。我在后面吃力地骑着，眼看他们的身影越来越远，我的心可着急了。此时，我已经汗流浃背了，豆大般的汗珠子不停往我脸颊流，模糊了我的视线。我竟然没有发现前方有个垃圾桶，一头撞上去。"]}, {"pic": "3", "label": "正文③", "text": ["这个撞击力也太大了！我被抛飞，然后重重地摔在了地上。我想爬起来，却发现双脚痛极了。天啊，原来我的双膝都流血了。此时，伟祥和李明回来找我，看见我双脚受伤，疼得爬不起来，都吓得脸青唇白。过了一会儿，伟祥回过神来，说：“我看还是打电话通知你的父母吧！”", "接到这通突如其来的电话，我的妈妈急坏了，赶紧从公司赶到我出事的地点。妈妈见我伤得不轻，脸色一下沉了下去。原本想教训我一顿，但看见我痛苦的样子，妈妈只好先送我去医院让医生检查伤势。幸好我只是受了皮外伤，医生帮我包扎伤口后便能回家了。", "回家的路上，我一五一十地把今天所有的“遭遇”告诉妈妈。“以后无论看到什么通告或是在外发生什么事，记得一定要先通知爸爸妈妈，不能自作主张不回家。”妈妈摸摸我的头说道。"]}, {"pic": "end", "text": ["我频频点头，答应妈妈下回肯定不会再这么做了。++俗话说：“吃一堑，长一智。”这次的教训让我明白：遇到突发的事情，一定要先告诉家人，再做决定。++"], "note": "慧眼改进：原文人名前后不一致（明轩／明文、李华／李明），已改正；结尾太短，补上名句和道理。"}]}}, "detective": []}, {"id": "psle2022-hc-q1", "title": "我应该勇敢地说出来", "cat": "guts", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2022 高华 · 试卷一 Q1（情境作文）", "kind": "情境作文", "exam": "PSLE 2022 高华", "imgs": [], "drafts": [], "vocab": ["形影不离", "挺身而出", "突飞猛进", "刮目相看", "满心欢喜", "惹祸上身", "胆小怕事", "空手而归", "打翻了五味瓶"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "1165", "info": "题目：《我应该勇敢地说出来》｜情境：最近，发生了一件事。你了解事情的经过，但是却不敢说出来。由于你保持沉默，结果影响了你和一个对你来说很重要的人。这让你感到很后悔，也让你明白应该把知道的事情勇敢地说出来。｜出处：PSLE 2022 高华 · 试卷一 Q1（情境作文）", "segments": [{"pic": "start", "text": ["子云和我是邻居，还是同班同学。我们像亲姐妹一样总是形影不离。虽然我和子云同龄，但是我长得比较矮小而且内向，因此有时会被同学欺负。子云就像大姐姐一样，看见我被同学欺负便会挺身而出保护我。"]}, {"pic": "1", "label": "正文①", "text": ["学业方面，子云的成绩比我优秀，更是“数学小天才”。我正好相反，数学成绩十分差。子云知道我的难处，自愿在休息时为我讲解习题。说也奇怪，子云一解释，我一点就通。在子云的帮助下，我的数学成绩突飞猛进，令老师刮目相看。子云真是我的良师益友！", "这一天，老师在班上宣布要选两名小六生代表我校参加全国数学科技竞赛。这两名代表将通过选拔赛挑选出来。今年的选拔赛比较特别，老师要求同学们各自用笔记本电脑完成一份数学专题作业。老师将选出两份最有创意的数学专题作业，并由这两名同学参赛。", "子云无论科技或数学都顶呱呱，班上所有的同学都知道其中一个名额非她莫属，另外一个名额就由其余的同学共同竞争了。上课时，子云很快便用笔记本电脑完成了她的数学专题作业。子云把笔记本电脑放在桌上，便满心欢喜地去食堂用餐。眼看子云去休息了，我好羡慕。这时，我的肚子也开始闹革命了，咕噜咕噜地叫个不停。尽管如此，我还是坚持把专题作业做好再去休息。努力了一番，我总算完成了专题作业，便立刻冲向食堂。我离开课室时，班上只剩下李青一人在继续“奋斗”。"]}, {"pic": "2", "label": "正文②", "text": ["到了食堂，我赶紧到我最喜欢吃的鸡饭摊位去排队。好不容易轮到我付钱取食物时，我发现自己竟然把钱包留在课室，只好跑回课室去拿钱包。正当我要踏进课室时，忽然看见一个身影蹑手蹑脚地走向子云的书桌。我定睛一看，竟然是李青！我躲在门后观察，发现李青从口袋里拿出一个U盘，快速地将U盘插进子云的笔记本电脑拷贝她的专题作业。不仅如此，李青还把子云的专题作业从电脑删除掉。李青大概是以为大家都去休息了，她的行为将神不知鬼不觉。哪知我恰好回课室拿钱包，她的恶行被我逮了个正着。", "我知道李青一向视子云为竞争对手，但我怎么也没料到她会做这样不道德的事情！我想向老师举报李青，但一想到李青的父亲是学校的副校长，我又担心会惹祸上身……", "休息后，老师要同学们把专题作业发到老师的电子邮箱。此时，子云惊讶地发现她的作业不见了，她急得哭了起来。下课前，老师宣布李青和我的专题作业最优秀，获选参加全国数学科技竞赛。此时，我的心像打翻了五味瓶一样。我知道自己如今数学有所进步全靠子云的帮助。但是因为胆小怕事，我一直没敢把李青偷子云作业的事告诉老师。"]}, {"pic": "3", "label": "正文③", "text": ["子云因为失去了一个重要的参赛机会，忍不住难过了一阵子。我虽然获选参赛，但因为内心的不安而无法在比赛当天好好表现。最终，李青获得了优秀奖，而我却空手而归。"]}, {"pic": "end", "text": ["如今，我特别后悔。如果当初我能勇敢地把真相告诉老师，子云就不会失去参赛权，我也不会因为心里的“障碍”而无法正常表现。经过这件事，我决定以后一定要做一个正直、诚实的人，要勇敢地把事情的真相说出来。"]}]}, "imp": {"label": "慧眼改进版", "words": "1180", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：加一句名句，点出“看到不对的事要说出来”。", "segments": [{"pic": "start", "text": ["子云和我是邻居，还是同班同学。我们像亲姐妹一样总是形影不离。虽然我和子云同龄，但是我长得比较矮小而且内向，因此有时会被同学欺负。子云就像大姐姐一样，看见我被同学欺负便会挺身而出保护我。"]}, {"pic": "1", "label": "正文①", "text": ["学业方面，子云的成绩比我优秀，更是“数学小天才”。我正好相反，数学成绩十分差。子云知道我的难处，自愿在休息时为我讲解习题。说也奇怪，子云一解释，我一点就通。在子云的帮助下，我的数学成绩突飞猛进，令老师刮目相看。子云真是我的良师益友！", "这一天，老师在班上宣布要选两名小六生代表我校参加全国数学科技竞赛。这两名代表将通过选拔赛挑选出来。今年的选拔赛比较特别，老师要求同学们各自用笔记本电脑完成一份数学专题作业。老师将选出两份最有创意的数学专题作业，并由这两名同学参赛。", "子云无论科技或数学都顶呱呱，班上所有的同学都知道其中一个名额非她莫属，另外一个名额就由其余的同学共同竞争了。上课时，子云很快便用笔记本电脑完成了她的数学专题作业。子云把笔记本电脑放在桌上，便满心欢喜地去食堂用餐。眼看子云去休息了，我好羡慕。这时，我的肚子也开始闹革命了，咕噜咕噜地叫个不停。尽管如此，我还是坚持把专题作业做好再去休息。努力了一番，我总算完成了专题作业，便立刻冲向食堂。我离开课室时，班上只剩下李青一人在继续“奋斗”。"]}, {"pic": "2", "label": "正文②", "text": ["到了食堂，我赶紧到我最喜欢吃的鸡饭摊位去排队。好不容易轮到我付钱取食物时，我发现自己竟然把钱包留在课室，只好跑回课室去拿钱包。正当我要踏进课室时，忽然看见一个身影蹑手蹑脚地走向子云的书桌。我定睛一看，竟然是李青！我躲在门后观察，发现李青从口袋里拿出一个U盘，快速地将U盘插进子云的笔记本电脑拷贝她的专题作业。不仅如此，李青还把子云的专题作业从电脑删除掉。李青大概是以为大家都去休息了，她的行为将神不知鬼不觉。哪知我恰好回课室拿钱包，她的恶行被我逮了个正着。", "我知道李青一向视子云为竞争对手，但我怎么也没料到她会做这样不道德的事情！我想向老师举报李青，但一想到李青的父亲是学校的副校长，我又担心会惹祸上身……", "休息后，老师要同学们把专题作业发到老师的电子邮箱。此时，子云惊讶地发现她的作业不见了，她急得哭了起来。下课前，老师宣布李青和我的专题作业最优秀，获选参加全国数学科技竞赛。此时，我的心像打翻了五味瓶一样。我知道自己如今数学有所进步全靠子云的帮助。但是因为胆小怕事，我一直没敢把李青偷子云作业的事告诉老师。"]}, {"pic": "3", "label": "正文③", "text": ["子云因为失去了一个重要的参赛机会，忍不住难过了一阵子。我虽然获选参赛，但因为内心的不安而无法在比赛当天好好表现。最终，李青获得了优秀奖，而我却空手而归。"]}, {"pic": "end", "text": ["如今，我特别后悔。如果当初我能勇敢地把真相告诉老师，子云就不会失去参赛权，我也不会因为心里的“障碍”而无法正常表现。++正所谓“路见不平，拔刀相助。”++经过这件事，我决定以后一定要做一个正直、诚实的人，要勇敢地把事情的真相说出来。"], "note": "慧眼改进：加一句名句，点出“看到不对的事要说出来”。"}]}}, "detective": []}, {"id": "psle2022-hc-q2", "title": "妹妹收到了记者的信", "cat": "bonds", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2022 高华 · 试卷一 Q2（完成文章）", "kind": "完成文章", "exam": "PSLE 2022 高华", "imgs": [], "drafts": [], "vocab": ["刮目相看", "助人为乐", "发扬光大", "乐于助人", "不由自主", "欢声笑语", "伸出援手"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "1067", "info": "题目：以下面的情节作为开头，完成这篇文章——一天晚上，妹妹拿着一封信，神秘地走到我身边，要求我看一看。我看了这封写给妹妹的信，望着她，心想：如果爸爸妈妈知道这件事，会有什么反应呢？我……｜出处：PSLE 2022 高华 · 试卷一 Q2（完成文章）", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["一天晚上，妹妹拿着一封信，神秘地走到我身边，要求我看一看。我看了这封写给妹妹的信，望着她，心想：如果爸爸妈妈知道这件事，会有什么反应呢？我……"]}, {"pic": "1", "label": "正文①", "text": ["的爸爸妈妈总觉得妹妹是温室里的小花，凡事要人照顾，不仅如此，调皮好玩的她也常惹祸。如今，妹妹做了件大好事，爸爸妈妈肯定会对妹妹刮目相看！", "“爸爸妈妈，请放下手上的工作到客厅来，我有重要的事情要告诉你们！”我兴奋地嚷嚷。", "妈妈正在洗碗，听我这么说就赶紧冲到客厅。爸爸也放下工作，和妈妈一起坐在沙发上准备听我“发言”。此时，妹妹也来到客厅，依在爸爸妈妈身旁。", "大家都到齐了，我提高嗓门说：“我们家的小妹现在出名了，她要成为‘早报校园’名人了！”我边挥动手上的信边说道。爸爸妈妈听我这么一说，脸色沉了下来。“小妹啊，你怎么又惹祸了？还上报啊！”", "“我……我这回是真正的‘名人’，我做了件好事呢！”妹妹笑嘻嘻地说。爸爸妈妈一脸疑惑地望向我。", "“爸爸妈妈，您看我手中的信。这是‘早报校园’记者给妹妹写的信："]}, {"pic": "2", "label": "正文②", "text": ["文婧同学你好，我是‘早报校园’的记者伟良。我写这封信给你，是想邀请你接受本报的采访。据我们所知，你最近帮助了一名老伯。为此，老伯特意写了一封表扬信给你的校长。老伯也联系本报，把当天发生的事口述了一遍……以下是我做的记录。", "9月2日，一位患有糖尿病的老伯去诊所看病，由于雨后道路湿滑，老伯不小心跌倒在地，无法自行站起。当时路上有不少行人，但无人停下伸出援手。后来，有位路过的女学生把老伯扶了起来，并且还陪他到诊所看病。当天，这位女生原本要代表班级参加全校体育比赛。但是为了帮助老伯，她放弃了赢取奖牌的机会。女生在诊所陪着老伯，直到他家人来接他才放心离开。", "老伯说尽管你个子瘦小，看起来很腼腆，但是你却有一颗善良的心。他被你这种善待老人的行为深深感动。因此，他特意写信给你的校长，希望校方借助你的‘故事’，把尊敬老人、助人为乐的精神在校园里发扬光大。"]}, {"pic": "3", "label": "正文③", "text": ["另外，老伯认为你高尚的品德不仅值得同学们学习，更应该把这种真、善、美的种子散播在社会的各个角落。为此老伯联系‘早报校园’记者，希望通过专题报道，把你乐于助人的善举分享在报章上。我已经与你的校长联系过，将在下个星期五到学校为你做专访。到时见。", "我把信件的内容读了出来。此时，爸爸妈妈不由自主地露出喜悦的表情。妈妈更忍不住转身给身旁的妹妹一个大拥抱。", "爸爸说：“真没想到我们家调皮捣蛋的小妹长大了，不再是温室里的小花。以往在家处处受保护，如今在外却是个乐于助人的好孩子。你的行为值得表扬，是我们家的骄傲！”"]}, {"pic": "end", "text": ["这一天，我们家充满了欢声笑语。妹妹的真、善、美照亮了家里的每一个角落！"]}]}, "imp": {"label": "慧眼改进版", "words": "1098", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：结尾补一句名句和“我”的感受。", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["一天晚上，妹妹拿着一封信，神秘地走到我身边，要求我看一看。我看了这封写给妹妹的信，望着她，心想：如果爸爸妈妈知道这件事，会有什么反应呢？我……"]}, {"pic": "1", "label": "正文①", "text": ["的爸爸妈妈总觉得妹妹是温室里的小花，凡事要人照顾，不仅如此，调皮好玩的她也常惹祸。如今，妹妹做了件大好事，爸爸妈妈肯定会对妹妹刮目相看！", "“爸爸妈妈，请放下手上的工作到客厅来，我有重要的事情要告诉你们！”我兴奋地嚷嚷。", "妈妈正在洗碗，听我这么说就赶紧冲到客厅。爸爸也放下工作，和妈妈一起坐在沙发上准备听我“发言”。此时，妹妹也来到客厅，依在爸爸妈妈身旁。", "大家都到齐了，我提高嗓门说：“我们家的小妹现在出名了，她要成为‘早报校园’名人了！”我边挥动手上的信边说道。爸爸妈妈听我这么一说，脸色沉了下来。“小妹啊，你怎么又惹祸了？还上报啊！”", "“我……我这回是真正的‘名人’，我做了件好事呢！”妹妹笑嘻嘻地说。爸爸妈妈一脸疑惑地望向我。", "“爸爸妈妈，您看我手中的信。这是‘早报校园’记者给妹妹写的信："]}, {"pic": "2", "label": "正文②", "text": ["文婧同学你好，我是‘早报校园’的记者伟良。我写这封信给你，是想邀请你接受本报的采访。据我们所知，你最近帮助了一名老伯。为此，老伯特意写了一封表扬信给你的校长。老伯也联系本报，把当天发生的事口述了一遍……以下是我做的记录。", "9月2日，一位患有糖尿病的老伯去诊所看病，由于雨后道路湿滑，老伯不小心跌倒在地，无法自行站起。当时路上有不少行人，但无人停下伸出援手。后来，有位路过的女学生把老伯扶了起来，并且还陪他到诊所看病。当天，这位女生原本要代表班级参加全校体育比赛。但是为了帮助老伯，她放弃了赢取奖牌的机会。女生在诊所陪着老伯，直到他家人来接他才放心离开。", "老伯说尽管你个子瘦小，看起来很腼腆，但是你却有一颗善良的心。他被你这种善待老人的行为深深感动。因此，他特意写信给你的校长，希望校方借助你的‘故事’，把尊敬老人、助人为乐的精神在校园里发扬光大。"]}, {"pic": "3", "label": "正文③", "text": ["另外，老伯认为你高尚的品德不仅值得同学们学习，更应该把这种真、善、美的种子散播在社会的各个角落。为此老伯联系‘早报校园’记者，希望通过专题报道，把你乐于助人的善举分享在报章上。我已经与你的校长联系过，将在下个星期五到学校为你做专访。到时见。", "我把信件的内容读了出来。此时，爸爸妈妈不由自主地露出喜悦的表情。妈妈更忍不住转身给身旁的妹妹一个大拥抱。", "爸爸说：“真没想到我们家调皮捣蛋的小妹长大了，不再是温室里的小花。以往在家处处受保护，如今在外却是个乐于助人的好孩子。你的行为值得表扬，是我们家的骄傲！”"]}, {"pic": "end", "text": ["这一天，我们家充满了欢声笑语。妹妹的真、善、美照亮了家里的每一个角落！++俗话说：“勿以善小而不为。”妹妹的小小善举，让我也想向她学习。++"], "note": "慧眼改进：结尾补一句名句和“我”的感受。"}]}}, "detective": []}, {"id": "psle2023-hc-q1", "title": "大家应该一起做决定", "cat": "falls", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2023 高华 · 试卷一 Q1（情境作文）", "kind": "情境作文", "exam": "PSLE 2023 高华", "imgs": [], "drafts": [], "vocab": ["坐享其成", "责任重大", "心里有数", "胸有成竹", "异口同声", "七窍生烟", "不负责任", "齐心协力", "气得七窍生烟"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "1694", "info": "题目：《大家应该一起做决定》｜情境：你和同学一起做小组作业，交作业的日期快到了，可是组长却好几天没来上课。你没得到大家的同意，就自己决定当组长，这让其他组员很不高兴。这件事让你上了宝贵的一课。｜出处：PSLE 2023 高华 · 试卷一 Q1（情境作文）", "segments": [{"pic": "start", "text": ["上课铃声响起，又是上华文课的时间。想到今天要写作文，班上的同学都提不起劲。不一会儿，大家听见了脚步声。哎，肯定是林老师来了。大伙头也不抬，继续沉浸在自己的世界里。随着林老师的脚步声渐近，空气中飘来阵阵香气。这独特的香味，顿时“唤醒”了班上的同学。大伙刹那间把目光投向林老师。"]}, {"pic": "1", "label": "正文①", "text": ["“同学们，老师手上拿的是什么？”林老师微笑着说。", "“我知道，是粽子！我奶奶昨天还在家裹粽子呢！”文彬最先说出答案。", "“文彬答对了！端午节快到了，老师要大家写一篇作文，题目是《传统节日端午节》。这一次的作文比较特别，大家无需各自写作……”老师的话音未落，同学们就竖起拇指，欢呼道：“太好了，总算不用自己写作文！”", "“这一回，老师要大家进行小组作文写作。每个组员必须先各自收集资料，然后一起写出一篇作文，最后再以PPT简报的形式呈现。大家有五天的时间收集资料和写作。后个星期一，每个小组必须派一名代表，在课堂上与大家分享你们写好的小组作文。当天，我们将选出一篇最佳小组作文。获奖小组的每个成员将得到一份礼物。”林老师说。", "“如果组内有小懒虫，只想坐享其成呢？”文美问。", "“这次的作业十分重视团队精神，每一个组员都必须参与。组长的责任重大，必须监督各个成员。此外，组长也必须公平分配工作，拟出一个完善的工作时间表。”林老师说。", "听老师这么解释，大家心里有数，谁也不敢偷懒。我和家伟、铭文、晓慧同组，晓慧是我们的组长。她的办事能力强，为人也公正，由她带领我们进行小组作业，我们胸有成竹。", "“家伟，你是美食专家，由你收集和端午节有关的食品资料。铭文，你就收集有关活动这方面的资料。晋全，你爱阅读历史人物故事，那与人物有关的资料，我就交给你负责吧！我会收集所有与文化有关的资料。汇报当天，我也会代表小组做口头报告。对工作分配有任何想法，请提出来。”晓慧说。"]}, {"pic": "2", "label": "正文②", "text": ["大家毫无意见，晓慧接着说：“那么我们就用三天的时间收集资料。下个星期四，大家把资料带来，放学后我们留下来一起讨论，把作文写出来。”", "“没问题！”我们异口同声说道。", "我爱读历史故事，更爱读漫画书。这几天，爸爸妈妈去马来西亚探望亲戚，我便成了家里的“霸王”，全天窝在书房读漫画书。老师布置的功课，我都是草率完成。“资料收集得如何？后天我们就要进行写作了！”铭文问。啊！我这下才发现今天已经是星期二，而我什么资料都没找。糟了，都怪我不好，一直看漫画书。正当我发慌时，一个馊主意忽然进入我的脑袋。这几天晓慧好像家里有事，请了五天的假。既然晓慧没来，我就当组长吧！组长有权力安排工作，我只要“吩咐”家伟去收集我负责的资料就好了！我觉得这个主意再好不过，便召集铭文和家伟。", "“铭文、家伟，晓慧这几天没来，下星期一就是小组作文呈现的日期了，我们没时间再等晓慧。我会代替晓慧当组长。今天，我来安排一下制作PPT的工作。铭文，你负责打字和排插图，家伟，你负责整个简报的设计和整体包装。我下个星期一将代替晓慧向全班呈现我们的作文简报。”我鼓起勇气，煞有介事地宣布。", "铭文和家伟一听我把工作都分给他们，脸马上沉了下来。"]}, {"pic": "3", "label": "正文③", "text": ["“对了家伟，我还有一个任务给你。我要你代替我收集与人物有关的资料。你的办事效率高，相信你明天就能把资料收齐。”我补充道。", "对于我私自当组长，家伟和铭文脸上似有不满。我刚说的这番话，无疑是火上加油，使家伟气得七窍生烟。尽管如此，家伟和铭文为了“大局”着想，还是保持冷静，这让我松了一口气。", "然而，星期四下午的小组活动，我们三人完全无法像以往一样，和睦地讨论事情。当天，空气中像笼罩一团乌云似的，让我难受极了。我这个“组长”发的指令，家伟和铭文也不太愿意配合。我们三人唯有草率地把资料结合起来，拼凑出一篇作文。尽管我们在期限内完成作文PPT简报，然而质量却不好。到了星期一，我由于得不到家伟和铭文的支持，也因为心虚，在口头汇报时结结巴巴的，表现得很不自在。最终，我们与最佳小组作文写作奖自然是无缘的。"]}, {"pic": "end", "text": ["我认真地思考了问题的症结，发现这次的局面都是因为自己不负责任和自作主张所造成的。这一天，我总算学到了宝贵的一课——无论做什么事，我都应该征求大家的意见，与大家一起做决定。只有大家齐心协力，才能把事情做好。"]}]}, "imp": {"label": "慧眼改进版", "words": "1717", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：在最后一句前加一句名句。", "segments": [{"pic": "start", "text": ["上课铃声响起，又是上华文课的时间。想到今天要写作文，班上的同学都提不起劲。不一会儿，大家听见了脚步声。哎，肯定是林老师来了。大伙头也不抬，继续沉浸在自己的世界里。随着林老师的脚步声渐近，空气中飘来阵阵香气。这独特的香味，顿时“唤醒”了班上的同学。大伙刹那间把目光投向林老师。"]}, {"pic": "1", "label": "正文①", "text": ["“同学们，老师手上拿的是什么？”林老师微笑着说。", "“我知道，是粽子！我奶奶昨天还在家裹粽子呢！”文彬最先说出答案。", "“文彬答对了！端午节快到了，老师要大家写一篇作文，题目是《传统节日端午节》。这一次的作文比较特别，大家无需各自写作……”老师的话音未落，同学们就竖起拇指，欢呼道：“太好了，总算不用自己写作文！”", "“这一回，老师要大家进行小组作文写作。每个组员必须先各自收集资料，然后一起写出一篇作文，最后再以PPT简报的形式呈现。大家有五天的时间收集资料和写作。后个星期一，每个小组必须派一名代表，在课堂上与大家分享你们写好的小组作文。当天，我们将选出一篇最佳小组作文。获奖小组的每个成员将得到一份礼物。”林老师说。", "“如果组内有小懒虫，只想坐享其成呢？”文美问。", "“这次的作业十分重视团队精神，每一个组员都必须参与。组长的责任重大，必须监督各个成员。此外，组长也必须公平分配工作，拟出一个完善的工作时间表。”林老师说。", "听老师这么解释，大家心里有数，谁也不敢偷懒。我和家伟、铭文、晓慧同组，晓慧是我们的组长。她的办事能力强，为人也公正，由她带领我们进行小组作业，我们胸有成竹。", "“家伟，你是美食专家，由你收集和端午节有关的食品资料。铭文，你就收集有关活动这方面的资料。晋全，你爱阅读历史人物故事，那与人物有关的资料，我就交给你负责吧！我会收集所有与文化有关的资料。汇报当天，我也会代表小组做口头报告。对工作分配有任何想法，请提出来。”晓慧说。"]}, {"pic": "2", "label": "正文②", "text": ["大家毫无意见，晓慧接着说：“那么我们就用三天的时间收集资料。下个星期四，大家把资料带来，放学后我们留下来一起讨论，把作文写出来。”", "“没问题！”我们异口同声说道。", "我爱读历史故事，更爱读漫画书。这几天，爸爸妈妈去马来西亚探望亲戚，我便成了家里的“霸王”，全天窝在书房读漫画书。老师布置的功课，我都是草率完成。“资料收集得如何？后天我们就要进行写作了！”铭文问。啊！我这下才发现今天已经是星期二，而我什么资料都没找。糟了，都怪我不好，一直看漫画书。正当我发慌时，一个馊主意忽然进入我的脑袋。这几天晓慧好像家里有事，请了五天的假。既然晓慧没来，我就当组长吧！组长有权力安排工作，我只要“吩咐”家伟去收集我负责的资料就好了！我觉得这个主意再好不过，便召集铭文和家伟。", "“铭文、家伟，晓慧这几天没来，下星期一就是小组作文呈现的日期了，我们没时间再等晓慧。我会代替晓慧当组长。今天，我来安排一下制作PPT的工作。铭文，你负责打字和排插图，家伟，你负责整个简报的设计和整体包装。我下个星期一将代替晓慧向全班呈现我们的作文简报。”我鼓起勇气，煞有介事地宣布。", "铭文和家伟一听我把工作都分给他们，脸马上沉了下来。"]}, {"pic": "3", "label": "正文③", "text": ["“对了家伟，我还有一个任务给你。我要你代替我收集与人物有关的资料。你的办事效率高，相信你明天就能把资料收齐。”我补充道。", "对于我私自当组长，家伟和铭文脸上似有不满。我刚说的这番话，无疑是火上加油，使家伟气得七窍生烟。尽管如此，家伟和铭文为了“大局”着想，还是保持冷静，这让我松了一口气。", "然而，星期四下午的小组活动，我们三人完全无法像以往一样，和睦地讨论事情。当天，空气中像笼罩一团乌云似的，让我难受极了。我这个“组长”发的指令，家伟和铭文也不太愿意配合。我们三人唯有草率地把资料结合起来，拼凑出一篇作文。尽管我们在期限内完成作文PPT简报，然而质量却不好。到了星期一，我由于得不到家伟和铭文的支持，也因为心虚，在口头汇报时结结巴巴的，表现得很不自在。最终，我们与最佳小组作文写作奖自然是无缘的。"]}, {"pic": "end", "text": ["我认真地思考了问题的症结，发现这次的局面都是因为自己不负责任和自作主张所造成的。这一天，我总算学到了宝贵的一课——无论做什么事，我都应该征求大家的意见，与大家一起做决定。++正如俗话所说：“三个臭皮匠，胜过一个诸葛亮。”++只有大家齐心协力，才能把事情做好。"], "note": "慧眼改进：在最后一句前加一句名句。"}]}}, "detective": []}, {"id": "psle2023-hc-q2", "title": "门口的小盒子：“恭喜你！”", "cat": "whoops", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2023 高华 · 试卷一 Q2（完成文章）", "kind": "完成文章", "exam": "PSLE 2023 高华", "imgs": [], "drafts": [], "vocab": ["从天而降", "喃喃自语", "小心翼翼", "心急如焚", "津津有味", "不翼而飞", "冷静下来", "恍然大悟", "百思不得其解", "热锅上的蚂蚁", "三思而后行"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "1580", "info": "题目：以下面的情节作为开头，完成这篇文章——一天，我放学回到家，发现门口放着一个漂亮的小盒子，上面有我的名字。我兴奋地打开盒子，里面只有一张纸，写着“恭喜你！”三个字。这是谁给我的呢？我……｜出处：PSLE 2023 高华 · 试卷一 Q2（完成文章）", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["一天，我放学回到家，发现门口放着一个漂亮的小盒子，上面有我的名字。我兴奋地打开盒子，里面只有一张纸，写着“恭喜你！”三个字。这是谁给我的呢？我……"]}, {"pic": "1", "label": "正文①", "text": ["耐不住好奇心，一边想着，一边把那张“恭喜你”的纸张拿起来。我把纸翻过来一看，上面竟然还有一小段文字以及一个二维码。", "“静文，恭喜你成为本公司幸运抽奖的得奖者。你曾经浏览我们的购物平台，因此自动获选加入我们的线上网购团。你很幸运地在我们每月一次的抽奖活动中被抽中。因此，你将获得一份神秘礼物。你只要扫一扫以下的二维码，将个人资料填妥在表格里，就会在第二天收到本公司送上的神秘厚礼！”", "哇！幸运之星找上门了！我只不过浏览了购物平台，就被抽中领取神秘礼物！我捧着那个小盒子，瞪大双眼直盯着“恭喜你”的纸张，心里像灌了一瓶蜜，甜滋滋的。", "我一进家门，书包都没放下，便赶紧从口袋掏出手机。我本该照例给这周出国的爸爸妈妈发“报平安”的简讯，然而今天我却被这从天而降的礼物冲昏了脑袋。我一心只顾着要那神秘礼物，拿出手机便赶紧对准二维码扫去。我一扫，手机屏幕就显现一个礼物盒子。礼物盒上面有个小箭头，指示我点击。我照着指示做，礼物盒就“打开”了，随之蹦出一张纸条。", "我仔细看纸上的说明，喃喃自语道：“原来要领取神秘礼物真不简单，我还得填写这么多个人资料。”哎，为了礼物，我还是照做吧！我小心翼翼地把姓名、出生日期、手机号码和电子邮箱的资料填上。正当我满心喜悦，以为自己完成任务时，竟然遇上“难题”了。"]}, {"pic": "2", "label": "正文②", "text": ["“请输入你的银行账号密码”这一行文字紧接着出现。糟了，我没有银行卡，怎么输入密码呢？我尝试点击“下一页”。谁知，屏幕上却显示“资料不全。请输入银行账号密码，以便完成领取神秘礼物的程序。”", "我心急如焚，好像热锅上的蚂蚁，拿着手机在房间徘徊。“啊，有了！就用爸爸的银行卡吧！”", "爸爸妈妈在外出公干前，特地给我留下一张银行卡。爸爸交代我只有遇上紧急事件，或是有突发事件急需用钱，才能动用这张卡。我心想，反正我又不是提取现款，只是把银行卡的密码填写在表格上，应该不需要报备。更何况我把这些资料填好后，还能获得神秘礼物，我根本不会有什么损失。", "想着，我私自做决定，没经过爸爸的同意，便把银行卡的密码填上。随之，屏幕上显示一个大元宝。“恭喜你，表格填好了。请等待神秘礼物的到来！”这一行字不停在手机“闪烁”着，我的心也像活泼的音符，开心地跳跃着。", "这下，我总算能坐下来好好享用午餐了。我心情特别好，一边津津有味地吃炒面，一边用手机看视频。同时，我心里也还挂念着那神秘礼物，期待早点收到。", "“小文，你今天怎么没给爸爸妈妈发简讯？”手机突然跳出爸爸的简讯。", "糟了，我忙着填写表格，今天竟然忘了给爸爸妈妈发简讯报平安！正当我要回复爸爸的简讯时，手机又跳出另外一则简讯：“小文，你遇上什么紧急事件吗？为什么需要用到七百块呢？”原来，爸爸刚收到银行发来的讯息，通知我的银行卡刚被提取了七百元。"]}, {"pic": "3", "label": "正文③", "text": ["我盯着简讯，呆住了。我的心一下子提到了嗓子眼，额头直冒冷汗。我想：这几天我都没用银行卡提款，七百块怎么会不翼而飞？我百思不得其解。当我尝试冷静下来后，这才恍然大悟，惊觉自己应该是上当了。刚才的抽奖活动一定是个骗局！哎，这下完了，我该怎么跟爸爸妈妈交代？", "正当我发愁时，忽然听见门铃响起。“我们是文礼警署的警察。我们接获这一座几户人家报案，投诉自己银行里的存款被盗取。我们特此来调查，看看还有哪些民众落入圈套。”警察边说边出示佩戴的警察证。", "“警察叔叔您来得正是时候，我刚刚上了网络诈骗分子的当，被骗走了七百块。我好害怕，不知道怎么跟爸爸妈妈解释。”我一五一十地把事情告诉警察。", "警察向我录了口供后，告诉我只要完成调查工作，成功捉拿诈骗分子，就会把钱归还给我。啊，我心中的大石总算落了下来！"]}, {"pic": "end", "text": ["正所谓“经一事，长一智”，经过这次惨痛的经历，我凡事都会三思而后行，再不会因为贪图小便宜而上当受骗了。"]}]}, "imp": {"label": "慧眼改进版", "words": "1598", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：结尾已经很好，再加一句俗语，点出“贪小便宜”的危险。", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["一天，我放学回到家，发现门口放着一个漂亮的小盒子，上面有我的名字。我兴奋地打开盒子，里面只有一张纸，写着“恭喜你！”三个字。这是谁给我的呢？我……"]}, {"pic": "1", "label": "正文①", "text": ["耐不住好奇心，一边想着，一边把那张“恭喜你”的纸张拿起来。我把纸翻过来一看，上面竟然还有一小段文字以及一个二维码。", "“静文，恭喜你成为本公司幸运抽奖的得奖者。你曾经浏览我们的购物平台，因此自动获选加入我们的线上网购团。你很幸运地在我们每月一次的抽奖活动中被抽中。因此，你将获得一份神秘礼物。你只要扫一扫以下的二维码，将个人资料填妥在表格里，就会在第二天收到本公司送上的神秘厚礼！”", "哇！幸运之星找上门了！我只不过浏览了购物平台，就被抽中领取神秘礼物！我捧着那个小盒子，瞪大双眼直盯着“恭喜你”的纸张，心里像灌了一瓶蜜，甜滋滋的。", "我一进家门，书包都没放下，便赶紧从口袋掏出手机。我本该照例给这周出国的爸爸妈妈发“报平安”的简讯，然而今天我却被这从天而降的礼物冲昏了脑袋。我一心只顾着要那神秘礼物，拿出手机便赶紧对准二维码扫去。我一扫，手机屏幕就显现一个礼物盒子。礼物盒上面有个小箭头，指示我点击。我照着指示做，礼物盒就“打开”了，随之蹦出一张纸条。", "我仔细看纸上的说明，喃喃自语道：“原来要领取神秘礼物真不简单，我还得填写这么多个人资料。”哎，为了礼物，我还是照做吧！我小心翼翼地把姓名、出生日期、手机号码和电子邮箱的资料填上。正当我满心喜悦，以为自己完成任务时，竟然遇上“难题”了。"]}, {"pic": "2", "label": "正文②", "text": ["“请输入你的银行账号密码”这一行文字紧接着出现。糟了，我没有银行卡，怎么输入密码呢？我尝试点击“下一页”。谁知，屏幕上却显示“资料不全。请输入银行账号密码，以便完成领取神秘礼物的程序。”", "我心急如焚，好像热锅上的蚂蚁，拿着手机在房间徘徊。“啊，有了！就用爸爸的银行卡吧！”", "爸爸妈妈在外出公干前，特地给我留下一张银行卡。爸爸交代我只有遇上紧急事件，或是有突发事件急需用钱，才能动用这张卡。我心想，反正我又不是提取现款，只是把银行卡的密码填写在表格上，应该不需要报备。更何况我把这些资料填好后，还能获得神秘礼物，我根本不会有什么损失。", "想着，我私自做决定，没经过爸爸的同意，便把银行卡的密码填上。随之，屏幕上显示一个大元宝。“恭喜你，表格填好了。请等待神秘礼物的到来！”这一行字不停在手机“闪烁”着，我的心也像活泼的音符，开心地跳跃着。", "这下，我总算能坐下来好好享用午餐了。我心情特别好，一边津津有味地吃炒面，一边用手机看视频。同时，我心里也还挂念着那神秘礼物，期待早点收到。", "“小文，你今天怎么没给爸爸妈妈发简讯？”手机突然跳出爸爸的简讯。", "糟了，我忙着填写表格，今天竟然忘了给爸爸妈妈发简讯报平安！正当我要回复爸爸的简讯时，手机又跳出另外一则简讯：“小文，你遇上什么紧急事件吗？为什么需要用到七百块呢？”原来，爸爸刚收到银行发来的讯息，通知我的银行卡刚被提取了七百元。"]}, {"pic": "3", "label": "正文③", "text": ["我盯着简讯，呆住了。我的心一下子提到了嗓子眼，额头直冒冷汗。我想：这几天我都没用银行卡提款，七百块怎么会不翼而飞？我百思不得其解。当我尝试冷静下来后，这才恍然大悟，惊觉自己应该是上当了。刚才的抽奖活动一定是个骗局！哎，这下完了，我该怎么跟爸爸妈妈交代？", "正当我发愁时，忽然听见门铃响起。“我们是文礼警署的警察。我们接获这一座几户人家报案，投诉自己银行里的存款被盗取。我们特此来调查，看看还有哪些民众落入圈套。”警察边说边出示佩戴的警察证。", "“警察叔叔您来得正是时候，我刚刚上了网络诈骗分子的当，被骗走了七百块。我好害怕，不知道怎么跟爸爸妈妈解释。”我一五一十地把事情告诉警察。", "警察向我录了口供后，告诉我只要完成调查工作，成功捉拿诈骗分子，就会把钱归还给我。啊，我心中的大石总算落了下来！"]}, {"pic": "end", "text": ["正所谓“经一事，长一智”，经过这次惨痛的经历，我凡事都会三思而后行，再不会因为贪图小便宜而上当受骗了。++我也会永远记住：天下没有免费的午餐！++"], "note": "慧眼改进：结尾已经很好，再加一句俗语，点出“贪小便宜”的危险。"}]}}, "detective": []}, {"id": "pre2020-scgs", "title": "这件事让我流下了眼泪", "cat": "bonds", "grade": "P6", "pics": 0, "date": "", "source": "2020 小六预考 · 新加坡华侨中学附小（SCGS） · 华文（命题作文）", "kind": "命题作文", "exam": "2020 预考 华文", "imgs": [], "drafts": [], "vocab": ["记忆犹新", "头晕目眩", "泣不成声", "不计前嫌", "组屋楼下", "不好意思", "嚎啕大哭"], "versions": {"orig": {"label": "学校范文 · 原文", "words": "912", "info": "题目：《这件事让我流下了眼泪》｜提示：这是一件什么事？这件事怎么发生？这件事为什么让你流下了眼泪？你从这件事中学到了什么？｜出处：2020 小六预考 · 新加坡华侨中学附小（SCGS） · 华文（命题作文）", "segments": [{"pic": "start", "text": ["在我的脑海中，有令我开心的事，也有令我伤心的事。有一件事经常浮现在我的脑海中，感动着我，温暖着我。虽然这件事已经过去两年多了，但仍然记忆犹新。我每次想起它，就会流下感动的泪水。那件事是这样的……"]}, {"pic": "1", "label": "正文①", "text": ["那是一个星期六上午，我独自在家做功课。突然，我的肚子开始疼了起来。我用双手捂着肚子，咬了咬牙，忍了忍。然而，我的腹部越来越疼，豆大的汗珠从额头上滑下来。我强忍着痛，打开家门，想到附近的诊所看医生。", "可是，还没走出几步，我就疼得走不了路了，瘫坐在地上，头晕目眩。我开始嚎啕大哭起来。", "这时，一个人关心地问：“小丽，你怎么了？”我泣不成声地说：“我的……肚子疼得……受不了了……”那个人担心地说：“小丽，你撑住，我马上送你到医院！”说完，这个人背起我，搭电梯到组屋楼下，然后在马路边拦德士。上车后，我听到这个人大口大口地喘着粗气。她的举动让我十分感动。我的心里很感激她，疼痛似乎减轻了一点，我心想：不论这个人是谁，我都要好好地感谢这个人！"]}, {"pic": "2", "label": "正文②", "text": ["到了竹脚妇幼医院，我才想起帮助我的人是谁。原来她就是我的邻居——陈奶奶。“陈奶奶，真是太感谢您了！”我既感动又愧疚地说。陈奶奶是个热心、善良的好邻居。可是，因为我们两家曾经发生过矛盾，我一向都很敌视她。今天，看到陈奶奶热心地帮助我，我真的感到很不好意思。陈奶奶微笑着说：“孩子，远亲不如近邻，换了谁都会这样做。”我心想：陈奶奶，您人真好啊！", "在医院的急诊部，医生说我患上了急性盲肠炎，要立刻做手术切除并住院。于是，陈奶奶帮我办理了各种手续，也通知了我的父母。接着，她一直陪着我，直到我父母赶来。他们了解了发生什么事后，不停地向陈奶奶道谢，也为以前的事道歉，请求她的原谅。陈奶奶不计前嫌地说道：“没关系，大家都是邻居，要互相关心，以前的不愉快就别放在心上。”多么宽广的胸怀，多么朴实的话语，多么善良的心地啊！陈奶奶的举动让我和全家人感动不已。我心里只能默默地感谢她：以后我一定要好好地报答您！"]}, {"pic": "end", "text": ["手术后，在那不眠的夜晚，陈奶奶帮助我的事情不停地浮现在我的眼前。我的眼里充满了泪水，一滴一滴地流了下来。这件事让我留下了难以磨灭的烙印，让我懂得什么是宽容，什么是大度，什么是善良，什么是热心，什么是远亲不如近邻。"]}]}, "imp": {"label": "慧眼改进版", "words": "948", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：结尾很好（排比句），再补一句写出“我”以后的改变。", "segments": [{"pic": "start", "text": ["在我的脑海中，有令我开心的事，也有令我伤心的事。有一件事经常浮现在我的脑海中，感动着我，温暖着我。虽然这件事已经过去两年多了，但仍然记忆犹新。我每次想起它，就会流下感动的泪水。那件事是这样的……"]}, {"pic": "1", "label": "正文①", "text": ["那是一个星期六上午，我独自在家做功课。突然，我的肚子开始疼了起来。我用双手捂着肚子，咬了咬牙，忍了忍。然而，我的腹部越来越疼，豆大的汗珠从额头上滑下来。我强忍着痛，打开家门，想到附近的诊所看医生。", "可是，还没走出几步，我就疼得走不了路了，瘫坐在地上，头晕目眩。我开始嚎啕大哭起来。", "这时，一个人关心地问：“小丽，你怎么了？”我泣不成声地说：“我的……肚子疼得……受不了了……”那个人担心地说：“小丽，你撑住，我马上送你到医院！”说完，这个人背起我，搭电梯到组屋楼下，然后在马路边拦德士。上车后，我听到这个人大口大口地喘着粗气。她的举动让我十分感动。我的心里很感激她，疼痛似乎减轻了一点，我心想：不论这个人是谁，我都要好好地感谢这个人！"]}, {"pic": "2", "label": "正文②", "text": ["到了竹脚妇幼医院，我才想起帮助我的人是谁。原来她就是我的邻居——陈奶奶。“陈奶奶，真是太感谢您了！”我既感动又愧疚地说。陈奶奶是个热心、善良的好邻居。可是，因为我们两家曾经发生过矛盾，我一向都很敌视她。今天，看到陈奶奶热心地帮助我，我真的感到很不好意思。陈奶奶微笑着说：“孩子，远亲不如近邻，换了谁都会这样做。”我心想：陈奶奶，您人真好啊！", "在医院的急诊部，医生说我患上了急性盲肠炎，要立刻做手术切除并住院。于是，陈奶奶帮我办理了各种手续，也通知了我的父母。接着，她一直陪着我，直到我父母赶来。他们了解了发生什么事后，不停地向陈奶奶道谢，也为以前的事道歉，请求她的原谅。陈奶奶不计前嫌地说道：“没关系，大家都是邻居，要互相关心，以前的不愉快就别放在心上。”多么宽广的胸怀，多么朴实的话语，多么善良的心地啊！陈奶奶的举动让我和全家人感动不已。我心里只能默默地感谢她：以后我一定要好好地报答您！"]}, {"pic": "end", "text": ["手术后，在那不眠的夜晚，陈奶奶帮助我的事情不停地浮现在我的眼前。我的眼里充满了泪水，一滴一滴地流了下来。这件事让我留下了难以磨灭的烙印，让我懂得什么是宽容，什么是大度，什么是善良，什么是热心，什么是远亲不如近邻。++从此，我和陈奶奶成了无话不谈的好邻居，我也学会了用宽容的心对待身边的人。++"], "note": "慧眼改进：结尾很好（排比句），再补一句写出“我”以后的改变。"}]}}, "detective": []}, {"id": "pre2023-msps", "title": "我参加了一个有趣的活动", "cat": "bonds", "grade": "P6", "pics": 0, "date": "", "source": "2023 小六预考 · 海星中学附小（Maris Stella） · 华文（命题作文）", "kind": "命题作文", "exam": "2023 预考 华文", "imgs": [], "drafts": [], "vocab": ["当耳边风", "谈天说地"], "versions": {"orig": {"label": "学校范文 · 原文", "words": "620", "info": "题目：《我参加了一个有趣的活动》｜提示：这是一个什么活动？你为什么觉得这个活动有趣？你有什么感受？你从这个活动中学到了什么？｜出处：2023 小六预考 · 海星中学附小（Maris Stella） · 华文（命题作文）", "segments": [{"pic": "start", "text": ["有一次，我参加了一个既有意义又有趣的活动。这个活动让我认识到新加坡之所以被称为花园城市，并非仅仅因为国人的努力，更是因为伟大的清洁工人。他们不畏劳累、不惧脏污，为了保持新加坡的整洁，付出了巨大的努力。下面我将分享一下这次活动的经过。"]}, {"pic": "1", "label": "正文①", "text": ["“嘉恒，今天下午，民众俱乐部将举办一个沙滩捡垃圾的活动，我已经为你报了名。”妈妈买菜回来，一进家门就对我说。我听了，下巴就快掉到地上了，心想：我今天已经够忙了，不但要完成功课，还得上补习班，哪有时间去捡垃圾？", "“妈妈，我可不可以不去？”我急切地请求。但妈妈毫不留情地拉着我的耳朵，说：“你经常乱丢垃圾，我劝过你，你把我的话当耳边风。今天，我非得让你亲身体验一下清洁工人工作的辛苦。想让我心软？那可没门儿！”"]}, {"pic": "2", "label": "正文②", "text": ["没办法，我下午被妈妈连拉带拽地强行带到了海边。海边已经有很多人了。一眼望去，沙滩上的垃圾真不少！活动负责人递了一个黑色塑料袋和钳子给我。无奈之下，我硬着头皮，踏上沙滩，开始了捡垃圾的任务。", "出乎我的意料，这个活动实际上非常有趣。我和大家一起边捡垃圾，边谈天说地，有说有笑的，还不时爆发出笑声。大家互相分享了捡垃圾的动机、个人趣事和笑话，让整个过程变得十分有趣。"]}, {"pic": "end", "text": ["捡着捡着，我在沙滩上发现了一个奇怪的玩具，原来是个损坏的玩具火箭。大家一起猜测它是从哪里漂过来的，还联想到了一些有趣的故事。另外，我们还发现了一些奇怪的垃圾，比如一个漂亮的贝壳和一只彩色的海星玩具。这些发现让整个活动变得更加有趣和充满探索的氛围。"]}]}, "imp": {"label": "慧眼改进版", "words": "803", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：原卷只印了前半篇，没有结尾。慧眼按开头的线索（清洁工人的辛苦、妈妈说我乱丢垃圾）补写了结尾。", "segments": [{"pic": "start", "text": ["有一次，我参加了一个既有意义又有趣的活动。这个活动让我认识到新加坡之所以被称为花园城市，并非仅仅因为国人的努力，更是因为伟大的清洁工人。他们不畏劳累、不惧脏污，为了保持新加坡的整洁，付出了巨大的努力。下面我将分享一下这次活动的经过。"]}, {"pic": "1", "label": "正文①", "text": ["“嘉恒，今天下午，民众俱乐部将举办一个沙滩捡垃圾的活动，我已经为你报了名。”妈妈买菜回来，一进家门就对我说。我听了，下巴就快掉到地上了，心想：我今天已经够忙了，不但要完成功课，还得上补习班，哪有时间去捡垃圾？", "“妈妈，我可不可以不去？”我急切地请求。但妈妈毫不留情地拉着我的耳朵，说：“你经常乱丢垃圾，我劝过你，你把我的话当耳边风。今天，我非得让你亲身体验一下清洁工人工作的辛苦。想让我心软？那可没门儿！”"]}, {"pic": "2", "label": "正文②", "text": ["没办法，我下午被妈妈连拉带拽地强行带到了海边。海边已经有很多人了。一眼望去，沙滩上的垃圾真不少！活动负责人递了一个黑色塑料袋和钳子给我。无奈之下，我硬着头皮，踏上沙滩，开始了捡垃圾的任务。", "出乎我的意料，这个活动实际上非常有趣。我和大家一起边捡垃圾，边谈天说地，有说有笑的，还不时爆发出笑声。大家互相分享了捡垃圾的动机、个人趣事和笑话，让整个过程变得十分有趣。"]}, {"pic": "end", "text": ["捡着捡着，我在沙滩上发现了一个奇怪的玩具，原来是个损坏的玩具火箭。大家一起猜测它是从哪里漂过来的，还联想到了一些有趣的故事。另外，我们还发现了一些奇怪的垃圾，比如一个漂亮的贝壳和一只彩色的海星玩具。这些发现让整个活动变得更加有趣和充满探索的氛围。", "++活动结束时，夕阳把沙滩染成了金黄色。看着一袋袋垃圾和干干净净的沙滩，我累得腰酸背痛，心里却甜滋滋的。我终于体会到，清洁工人每天弯着腰、顶着烈日工作，是多么辛苦。++", "++回家的路上，我对妈妈说：“妈妈，以后我再也不乱丢垃圾了！”妈妈欣慰地笑了。正所谓“勿以恶小而为之”，我们随手丢下的一张纸巾，可能就要别人弯下腰来捡。我要做一个爱护环境的好公民，让新加坡这座花园城市更加美丽。++"], "note": "慧眼改进：原卷只印了前半篇，没有结尾。慧眼按开头的线索（清洁工人的辛苦、妈妈说我乱丢垃圾）补写了结尾。"}]}}, "detective": []}, {"id": "pre2022-nh-q1", "title": "我明白了帮助他人的重要性", "cat": "bonds", "grade": "P6", "pics": 0, "date": "", "source": "2022 小六预考 · 南华小学（Nan Hua） · 高华（情境作文）", "kind": "情境作文", "exam": "2022 预考 高华", "imgs": [], "drafts": [], "vocab": ["人不为己", "天诛地灭", "形影不离", "一落千丈", "苦苦哀求", "名列前茅", "志同道合", "胆小如鼠", "易如反掌", "闷闷不乐", "见死不救", "袖手旁观"], "versions": {"orig": {"label": "学校范文 · 原文", "words": "969", "info": "题目：《我明白了帮助他人的重要性》｜情境：你向来不喜欢帮助别人。有一次你的朋友需要你的帮忙，你不肯帮他。后来你遇到了困难，你的朋友热心帮助你，你感到十分惭愧。｜出处：2022 小六预考 · 南华小学（Nan Hua） · 高华（情境作文）", "segments": [{"pic": "start", "text": ["我向来不喜欢帮助别人。为什么要帮助他们呢？我又没欠他们什么。所谓“人不为己，天诛地灭”，我爱帮不帮是我的事，没人能逼我。我小气得连自己形影不离的好朋友小伟都不肯帮……"]}, {"pic": "1", "label": "正文①", "text": ["有一次，快到年终考试了。小伟一向成绩都不好，而且那年小五，学的东西很多，他本来不好的成绩更是一落千丈。小伟向我苦苦哀求：“小明，拜托，就和我一起复习一下吧，我妈妈说我这次再不过关就会给我一大堆试卷做……”", "不爱帮助人的我心想：这费时费力，我哪有时间？小伟可能会要求我给他讲题，那我就没时间复习了。他考得好，我这个一向名列前茅的考得不好，这可不行！但我又转念一想，他可是我志同道合的好友啊！脑中的这两把声音让我烦恼极了。怎么办呢？最后，“自私”的我赢了。我摆手表示不能，然后随口找了个借口拒绝了小伟。", "后来，小伟没考好，不但被罚做卷子，而且电脑、手机也被没收了。小伟因为我没帮他，吃了不少苦头，令我感到十分后悔。"]}, {"pic": "2", "label": "正文②", "text": ["有一天，我不知怎么，不幸地被校霸小华给盯上了。小华便开始欺负我、勒索我。每次见到小华，我都胆小如鼠地把钱交过去，不敢反击。我生怕他打我几拳，或踢我几脚，因为他力气很大，要把我揍扁简直易如反掌。小伟见到我看起来和往常不一样，便问我是否发生了什么事，令我整天闷闷不乐。出于对小华的恐惧，我不敢告诉小伟真相。", "没想到，有一次小华欺负我时，一位老师和小伟三步并作两步地走了过来，老师二话不说，把小华带到办公室处罚。", "小伟走上前，轻轻地给我擦眼泪，说道：“小明，你还好吗？”", "原来，小明见到我被小华欺负，虽然知道自己以后可能会因帮助我而被小华欺负，但是他深知不能对朋友见死不救。于是他没有袖手旁观，反而见义勇为，马上去找老师。我上次没帮他，他却如此热心地帮助我！感动的泪水在我眼里打转。“谢谢……太感谢你了，不然我自己一直不敢找人帮忙，会……会一直被这个恶棍欺负……”我语无伦次地说道。"]}, {"pic": "3", "label": "正文③", "text": ["那天，回家的路上，我思潮起伏。小伟对我这么好，真是一个好朋友！我这个不愿在他遇到困难时帮忙的人，真是一个不值得原谅的烂朋友！我羞得无地自容，脸像苹果一样红，眼泪无声地划过脸颊。我感到十分惭愧。幸好小伟心胸宽大，不斤斤计较，我才得了帮助！"]}, {"pic": "end", "text": ["我明白了帮助他人的重要性。虽然帮助他人费时费力，但是我们小小的举动，可以帮上别人很大的忙，甚至改变他们，使他们也从自私变成乐于助人的人。我下定决心，多帮助他人！"]}]}, "imp": {"label": "慧眼改进版", "words": "981", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：原文把“小伟”误写成“小明”（“我”才是小明），已改正；结尾补一句名句。", "segments": [{"pic": "start", "text": ["我向来不喜欢帮助别人。为什么要帮助他们呢？我又没欠他们什么。所谓“人不为己，天诛地灭”，我爱帮不帮是我的事，没人能逼我。我小气得连自己形影不离的好朋友小伟都不肯帮……"]}, {"pic": "1", "label": "正文①", "text": ["有一次，快到年终考试了。小伟一向成绩都不好，而且那年小五，学的东西很多，他本来不好的成绩更是一落千丈。小伟向我苦苦哀求：“小明，拜托，就和我一起复习一下吧，我妈妈说我这次再不过关就会给我一大堆试卷做……”", "不爱帮助人的我心想：这费时费力，我哪有时间？小伟可能会要求我给他讲题，那我就没时间复习了。他考得好，我这个一向名列前茅的考得不好，这可不行！但我又转念一想，他可是我志同道合的好友啊！脑中的这两把声音让我烦恼极了。怎么办呢？最后，“自私”的我赢了。我摆手表示不能，然后随口找了个借口拒绝了小伟。", "后来，小伟没考好，不但被罚做卷子，而且电脑、手机也被没收了。小伟因为我没帮他，吃了不少苦头，令我感到十分后悔。"]}, {"pic": "2", "label": "正文②", "text": ["有一天，我不知怎么，不幸地被校霸小华给盯上了。小华便开始欺负我、勒索我。每次见到小华，我都胆小如鼠地把钱交过去，不敢反击。我生怕他打我几拳，或踢我几脚，因为他力气很大，要把我揍扁简直易如反掌。小伟见到我看起来和往常不一样，便问我是否发生了什么事，令我整天闷闷不乐。出于对小华的恐惧，我不敢告诉小伟真相。", "没想到，有一次小华欺负我时，一位老师和小伟三步并作两步地走了过来，老师二话不说，把小华带到办公室处罚。", "小伟走上前，轻轻地给我擦眼泪，说道：“小明，你还好吗？”", "~~原来，小明见到我被小华欺负~~++原来，小伟见到我被小华欺负++，虽然知道自己以后可能会因帮助我而被小华欺负，但是他深知不能对朋友见死不救。于是他没有袖手旁观，反而见义勇为，马上去找老师。我上次没帮他，他却如此热心地帮助我！感动的泪水在我眼里打转。“谢谢……太感谢你了，不然我自己一直不敢找人帮忙，会……会一直被这个恶棍欺负……”我语无伦次地说道。"]}, {"pic": "3", "label": "正文③", "text": ["那天，回家的路上，我思潮起伏。小伟对我这么好，真是一个好朋友！我这个不愿在他遇到困难时帮忙的人，真是一个不值得原谅的烂朋友！我羞得无地自容，脸像苹果一样红，眼泪无声地划过脸颊。我感到十分惭愧。幸好小伟心胸宽大，不斤斤计较，我才得了帮助！"]}, {"pic": "end", "text": ["我明白了帮助他人的重要性。虽然帮助他人费时费力，但是我们小小的举动，可以帮上别人很大的忙，甚至改变他们，使他们也从自私变成乐于助人的人。++俗话说：“患难见真情。”++我下定决心，多帮助他人！"], "note": "慧眼改进：原文把“小伟”误写成“小明”（“我”才是小明），已改正；结尾补一句名句。"}]}}, "detective": []}, {"id": "pre2022-nh-q2", "title": "“我们做的那件事被发现了！”", "cat": "falls", "grade": "P6", "pics": 0, "date": "", "source": "2022 小六预考 · 南华小学（Nan Hua） · 高华（完成文章）", "kind": "完成文章", "exam": "2022 预考 高华", "imgs": [], "drafts": [], "vocab": ["忐忑不安", "不知所措", "闷闷不乐", "吞吞吐吐", "做贼心虚", "品学兼优", "来龙去脉", "语重心长", "善莫大焉", "话音刚落", "满面春风地说", "吞吞吐吐地说"], "versions": {"orig": {"label": "学校范文 · 原文", "words": "1204", "info": "题目：以下面的情节作为开头，完成这篇文章——下午放学后，我要去食堂吃午餐时，遇到同学小文。我正要跟他打招呼，可是小文却把我拉到一边，悄悄地说：“快走！我们做的那件事被发现了！”｜出处：2022 小六预考 · 南华小学（Nan Hua） · 高华（完成文章）", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["下午放学后，我要去食堂吃午餐时，遇到同学小文。我正要跟他打招呼，可是小文却把我拉到一边，悄悄地说：“快走！我们做的那件事被发现了！”……"]}, {"pic": "1", "label": "正文①", "text": ["顿时，我的心凉透了。“现在我们需要去老师的办公室！”他话还没说完，就拉着我跑向林老师的办公室。", "一路上，我忐忑不安：难道这件事真的让老师知道了？这下可完蛋了！上午，老师让我们交听写本，但是我打开听写本时，猛然发现我忘了让父母签名！那是我第一次忘记，我一下子不知所措。还好有小文，他是组长，于是他让我模仿我父母的签名，然后交上去。当时我怕被老师严厉地惩罚，所以二话不说就按照小文说的做了。现在我可后悔极了！要是老师发现这次的签名不太一样，那我就惨了！她肯定会打电话给妈妈的，到家又要被骂！完了，世界上没有后悔药，我只能等着挨骂了。", "到了林老师的办公室，我透过玻璃门，看到了老师桌子上有一堆听写本，我的心提到了嗓子眼。小文似乎也有点紧张，他咬着嘴唇，小声地对我说：“对不起，明华，这次是我害了你。”", "此时，林老师向我们挥手，示意我们进来。没办法，这回想逃也逃不了了！我只好硬着头皮推开门，踏进办公室。一股冷气扑面而来，这让我的心像跌入冷窖似的，手指也不停地颤抖。"]}, {"pic": "2", "label": "正文②", "text": ["我突然想起来，小文到底怎么知道的？刚才只顾着紧张，忘了问他。“小文，老师是怎么跟你说的？”我问。“我也不太清楚，老师只是让我俩来找她……”小文回想着。那至少我还有一丝希望，万一不是因为这件事呢？虽然还不太可能，但是我还是抱着希望的。", "“小文、明华，恭喜你们啊！你们被学校选中参加作文比赛！我给你们总结了一下好词佳句，你们多背背啊！机会难得，你们可要好好发挥！”林老师满面春风地说。", "老师话音刚落，我和小文就松了一口气。老师没发现！我知道我是应该开心的，因为我躲过了一次处罚，但是不知怎么的，我就是开心不起来。我向小文瞄了一眼，他也闷闷不乐的。", "“嗯，好……谢谢老师。”我吞吞吐吐地说。大概是做贼心虚吧，说话都说不好了。", "林老师好像也发现有什么不对劲了，她好奇地问：“怎么啦，小文、明华？有什么事可以告诉老师吗？”我彻底隐瞒不住了，但是由于怕小文责怪我，因此我没开口。"]}, {"pic": "3", "label": "正文③", "text": ["我猜小文和我的想法一致，一向害羞文静的他受不了了，他哇的一声就哭了起来。我和小文平时都品学兼优，从没犯过什么大错，都受不了老师那亲切的眼神、老师的微笑、老师的关怀。", "纸是包不住火的，事情永远都会暴露出来。想到这里，我看了一眼小文，但愿他能理解我的决定，但愿我的道歉能弥补我的过错，但愿我能在作文比赛中取得好成绩，报答老师对我们的宽容、厚爱与期待……", "老师知道事情的来龙去脉后，并没有责怪我们，而是语重心长地说：“既然你们知错了，我就不骂你们了。所谓‘人非圣贤，孰能无过，过而能改，善莫大焉’。你们牢记这次的教训就好。”"]}, {"pic": "end", "text": ["走出办公室，我觉得天格外的蓝，云彩格外的洁白，我和明华的步伐格外的轻快。我和明华各自拿着一份老师给我们的好词佳句大汇总，迈着轻盈的脚步向食堂走去吃午餐。"]}]}, "imp": {"label": "慧眼改进版", "words": "1252", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：原文结尾把“小文”误写成“明华”（“我”就是明华），已改正；结尾补上道理。", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["下午放学后，我要去食堂吃午餐时，遇到同学小文。我正要跟他打招呼，可是小文却把我拉到一边，悄悄地说：“快走！我们做的那件事被发现了！”……"]}, {"pic": "1", "label": "正文①", "text": ["顿时，我的心凉透了。“现在我们需要去老师的办公室！”他话还没说完，就拉着我跑向林老师的办公室。", "一路上，我忐忑不安：难道这件事真的让老师知道了？这下可完蛋了！上午，老师让我们交听写本，但是我打开听写本时，猛然发现我忘了让父母签名！那是我第一次忘记，我一下子不知所措。还好有小文，他是组长，于是他让我模仿我父母的签名，然后交上去。当时我怕被老师严厉地惩罚，所以二话不说就按照小文说的做了。现在我可后悔极了！要是老师发现这次的签名不太一样，那我就惨了！她肯定会打电话给妈妈的，到家又要被骂！完了，世界上没有后悔药，我只能等着挨骂了。", "到了林老师的办公室，我透过玻璃门，看到了老师桌子上有一堆听写本，我的心提到了嗓子眼。小文似乎也有点紧张，他咬着嘴唇，小声地对我说：“对不起，明华，这次是我害了你。”", "此时，林老师向我们挥手，示意我们进来。没办法，这回想逃也逃不了了！我只好硬着头皮推开门，踏进办公室。一股冷气扑面而来，这让我的心像跌入冷窖似的，手指也不停地颤抖。"]}, {"pic": "2", "label": "正文②", "text": ["我突然想起来，小文到底怎么知道的？刚才只顾着紧张，忘了问他。“小文，老师是怎么跟你说的？”我问。“我也不太清楚，老师只是让我俩来找她……”小文回想着。那至少我还有一丝希望，万一不是因为这件事呢？虽然还不太可能，但是我还是抱着希望的。", "“小文、明华，恭喜你们啊！你们被学校选中参加作文比赛！我给你们总结了一下好词佳句，你们多背背啊！机会难得，你们可要好好发挥！”林老师满面春风地说。", "老师话音刚落，我和小文就松了一口气。老师没发现！我知道我是应该开心的，因为我躲过了一次处罚，但是不知怎么的，我就是开心不起来。我向小文瞄了一眼，他也闷闷不乐的。", "“嗯，好……谢谢老师。”我吞吞吐吐地说。大概是做贼心虚吧，说话都说不好了。", "林老师好像也发现有什么不对劲了，她好奇地问：“怎么啦，小文、明华？有什么事可以告诉老师吗？”我彻底隐瞒不住了，但是由于怕小文责怪我，因此我没开口。"]}, {"pic": "3", "label": "正文③", "text": ["我猜小文和我的想法一致，一向害羞文静的他受不了了，他哇的一声就哭了起来。我和小文平时都品学兼优，从没犯过什么大错，都受不了老师那亲切的眼神、老师的微笑、老师的关怀。", "纸是包不住火的，事情永远都会暴露出来。想到这里，我看了一眼小文，但愿他能理解我的决定，但愿我的道歉能弥补我的过错，但愿我能在作文比赛中取得好成绩，报答老师对我们的宽容、厚爱与期待……", "老师知道事情的来龙去脉后，并没有责怪我们，而是语重心长地说：“既然你们知错了，我就不骂你们了。所谓‘人非圣贤，孰能无过，过而能改，善莫大焉’。你们牢记这次的教训就好。”"]}, {"pic": "end", "text": ["走出办公室，我觉得天格外的蓝，云彩格外的洁白，~~我和明华的步伐格外的轻快~~++我和小文的步伐格外的轻快++。~~我和明华各自拿着~~++我和小文各自拿着++一份老师给我们的好词佳句大汇总，迈着轻盈的脚步向食堂走去吃午餐。", "++这件事让我明白：纸是包不住火的，犯了错就要勇敢承认。只有诚实，我们的心才能像今天的天空一样晴朗。++"], "note": "慧眼改进：原文结尾把“小文”误写成“明华”（“我”就是明华），已改正；结尾补上道理。"}]}}, "detective": []}, {"id": "pre2023-nh-q1", "title": "自己的事情自己做", "cat": "falls", "grade": "P6", "pics": 0, "date": "", "source": "2023 小六预考 · 南华小学（Nan Hua） · 高华（情境作文）", "kind": "情境作文", "exam": "2023 预考 高华", "imgs": [], "drafts": [], "vocab": ["津津有味", "忙前忙后", "下定决心"], "versions": {"orig": {"label": "学校范文 · 原文", "words": "1065", "info": "题目：《自己的事情自己做》｜（原卷的情境说明没有附在资料里，只有题目。）｜出处：2023 小六预考 · 南华小学（Nan Hua） · 高华（情境作文）", "segments": [{"pic": "start", "text": ["从小我就是被爸爸妈妈捧在手中的小公主，他们把每件事都帮我做好，让我慢慢变得越来越依赖他们，没有了独立性。爸爸妈妈也曾经叫我自己的事情自己做，可我总是把他们的话当成耳边风，心里想：有爸爸妈妈在，为什么要花力气做事？可是后来，我因为一件事，明白了自己的事情要自己做的道理。"]}, {"pic": "1", "label": "正文①", "text": ["我最好的朋友小华要过生日了，我十分想要给他一个惊喜。经过几晚的思考，我终于决定为他买一个蛋糕，再买一个他最喜欢的毛绒玩具。想到朋友小华的生日还有两天就到了，我立马就把我的决定告诉了爸爸妈妈，他们十分赞成，答应我当天就带我去给他订蛋糕和买礼物，可这不是我想要的，我心里想的是让爸爸帮我去给小华订蛋糕，最好上面还有他的名字。让妈妈帮我去给小华买礼物，而我则在家里爽爽地边看电视边吃零食。我把这个建议告诉了父母，让他们帮我去，可他们却说：“小华是你的朋友，你自己的事情应该要自己做，如果爸爸妈妈买的礼物不是他喜欢的，怎么办？”", "可我当时一心想着要留在家里，根本不听父母的话，最后父母都斗不过我，只好妥协，出门了。我一屁股坐在沙发上，津津有味地看起了电视。不一会儿，爸爸打电话来了，问小华吃什么口味的蛋糕，还有小华的全名是什么。当时的我十分专注地在看电视，随口说了句：“小华姓王，什么蛋糕都可以。”就把电话挂了。", "不久，小华的生日到了，爸爸妈妈从商场拿回了订购的蛋糕和生日礼物，看到礼物时我不禁“啊”地大叫了一声，原来妈妈买了一个小熊，那个小熊小华已经有了！妈妈听了，说：“你不是说随便买吗？那现在怎么办？我早就付钱了！”妈妈只好回去礼物店问问可不可以换。后来虽然换成功了，可是妈妈又跑了一趟，而且花了30分钟和店家沟通，店家才同意。回家后，妈妈看起来十分疲劳，但还是笑着把玩具给了我。蛋糕方面也不是很顺利，当我看见爸爸买的是班兰蛋糕时，我不禁大叫一声：“小华不吃班兰的东西！”而当我看到用巧克力写的小华的名字时，我脸色发白，差一点晕倒，因为小华不姓王啊！爸爸也“啊”了一声，说：“你不是说他姓王吗？”现在重新再做一个也来不及了，我去问问可不可以买一个现成的，我跟着爸爸匆匆忙忙地又跑了一趟蛋糕店，跟店家说了情况，店家让我在橱柜里选一个蛋糕，他去做新的牌子，我十分感激他，连忙道谢。"]}, {"pic": "end", "text": ["最终我去了小华的生日会。收到了我送给他的惊喜，小华十分开心。可我却十分后悔，因为看见父母为了我犯的错而忙前忙后，知道自己给他们添了很多麻烦。如果我当时听了他们的话，自己的事情自己做，亲自去买蛋糕和礼物，就不会给家人带来麻烦了。我心里下定决心改掉这个依赖父母的坏习惯，以后自己的事情都会自己做。"]}]}, "imp": {"label": "慧眼改进版", "words": "1077", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：结尾前补一句名句，让道理更有力。", "segments": [{"pic": "start", "text": ["从小我就是被爸爸妈妈捧在手中的小公主，他们把每件事都帮我做好，让我慢慢变得越来越依赖他们，没有了独立性。爸爸妈妈也曾经叫我自己的事情自己做，可我总是把他们的话当成耳边风，心里想：有爸爸妈妈在，为什么要花力气做事？可是后来，我因为一件事，明白了自己的事情要自己做的道理。"]}, {"pic": "1", "label": "正文①", "text": ["我最好的朋友小华要过生日了，我十分想要给他一个惊喜。经过几晚的思考，我终于决定为他买一个蛋糕，再买一个他最喜欢的毛绒玩具。想到朋友小华的生日还有两天就到了，我立马就把我的决定告诉了爸爸妈妈，他们十分赞成，答应我当天就带我去给他订蛋糕和买礼物，可这不是我想要的，我心里想的是让爸爸帮我去给小华订蛋糕，最好上面还有他的名字。让妈妈帮我去给小华买礼物，而我则在家里爽爽地边看电视边吃零食。我把这个建议告诉了父母，让他们帮我去，可他们却说：“小华是你的朋友，你自己的事情应该要自己做，如果爸爸妈妈买的礼物不是他喜欢的，怎么办？”", "可我当时一心想着要留在家里，根本不听父母的话，最后父母都斗不过我，只好妥协，出门了。我一屁股坐在沙发上，津津有味地看起了电视。不一会儿，爸爸打电话来了，问小华吃什么口味的蛋糕，还有小华的全名是什么。当时的我十分专注地在看电视，随口说了句：“小华姓王，什么蛋糕都可以。”就把电话挂了。", "不久，小华的生日到了，爸爸妈妈从商场拿回了订购的蛋糕和生日礼物，看到礼物时我不禁“啊”地大叫了一声，原来妈妈买了一个小熊，那个小熊小华已经有了！妈妈听了，说：“你不是说随便买吗？那现在怎么办？我早就付钱了！”妈妈只好回去礼物店问问可不可以换。后来虽然换成功了，可是妈妈又跑了一趟，而且花了30分钟和店家沟通，店家才同意。回家后，妈妈看起来十分疲劳，但还是笑着把玩具给了我。蛋糕方面也不是很顺利，当我看见爸爸买的是班兰蛋糕时，我不禁大叫一声：“小华不吃班兰的东西！”而当我看到用巧克力写的小华的名字时，我脸色发白，差一点晕倒，因为小华不姓王啊！爸爸也“啊”了一声，说：“你不是说他姓王吗？”现在重新再做一个也来不及了，我去问问可不可以
