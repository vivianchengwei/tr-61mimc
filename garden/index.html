"毫", "opts": ["毫", "豪", "亳"], "ctx": "如果每个人都能像今天这样，在别人遇到困难时□不犹豫地伸出援手，社会一定会变得更加温馨、和谐", "why": "“毫不犹豫”的“毫”是细毛，下面是“毛”；一毫都没有＝一点也不。“豪”是豪杰、自豪，下面是“豕”（猪）。", "hint": "下面是毛"}, {"w": "毫不犹豫", "t": "豫", "opts": ["豫", "预", "誉"], "ctx": "如果每个人都能像今天这样，在别人遇到困难时毫不犹□地伸出援手，社会一定会变得更加温馨、和谐", "why": "“犹豫”的“豫”左边是“予”，右边是“象”。“预”是预习（页字旁），“誉”是荣誉。", "hint": "予＋象"}, {"w": "顿时", "t": "顿", "opts": ["顿", "吨", "钝"], "ctx": "老婆婆脚下一个趔趄，被地上的石头绊了一下，□时“哎呀”一声跌倒在地", "why": "“顿时”的“顿”是左边“屯”右边“页”。“吨”是重量（口字旁），“钝”是不锋利（金字旁）。", "hint": "屯＋页"}, {"w": "彬彬有礼", "t": "彬", "opts": ["彬", "杉", "淋"], "ctx": "小丽气喘吁吁地把篮子递给了老奶奶，然后□彬有礼地说：“奶奶，路上小心哦", "why": "“彬彬有礼”的“彬”是两个“木”加三撇。“淋”是淋雨（三点水加林）。", "hint": "林＋三撇"}, {"w": "彬彬有礼", "t": "礼", "opts": ["礼", "札", "扎"], "ctx": "小丽气喘吁吁地把篮子递给了老奶奶，然后彬彬有□地说：“奶奶，路上小心哦", "why": "“有礼貌”的“礼”是示字旁加“乚”。“札”是木字旁，“扎”是提手旁。", "hint": "示字旁（礼节）"}, {"w": "竖起大拇指称赞", "t": "竖", "opts": ["竖", "坚", "竪"], "ctx": "她感动得热泪盈眶，连连道谢，还□起大拇指称赞小丽：“你真是个乐于助人的好孩子", "why": "“竖起大拇指”的“竖”上面是“ 刂又”，下面是“立”。“坚”下面是“土”（坚持）。", "hint": "下面是立"}], "audio": {"basic": {"src": "audio/help-grandma_basic.mp3", "cues": [["help-grandma|basic|1|0", 0.0], ["help-grandma|basic|2|0", 23.17], ["help-grandma|basic|3|0", 48.72], ["help-grandma|basic|4|0", 87.67], ["help-grandma|basic|end|0", 106.77]]}, "adv": {"src": "audio/help-grandma_adv.mp3", "cues": [["help-grandma|adv|1|0", 0.05], ["help-grandma|adv|2|0", 27.04], ["help-grandma|adv|2|1", 53.8], ["help-grandma|adv|3|0", 80.69], ["help-grandma|adv|3|1", 103.41], ["help-grandma|adv|4|0", 136.62], ["help-grandma|adv|4|1", 160.11], ["help-grandma|adv|end|0", 177.22], ["help-grandma|adv|end|1", 199.36]]}, "qx": {"src": "audio/help-grandma_qx.mp3", "cues": [["help-grandma|qx|1|0", 0.05], ["help-grandma|qx|1|1", 15.05], ["help-grandma|qx|2|0", 44.18], ["help-grandma|qx|2|1", 65.51], ["help-grandma|qx|3|0", 101.98], ["help-grandma|qx|3|1", 127.18], ["help-grandma|qx|4|0", 159.74], ["help-grandma|qx|4|1", 207.49], ["help-grandma|qx|end|0", 215.73]]}}}, {"id": "paper-plane", "title": "晨读时间折纸飞机，打到同学", "cat": "falls", "grade": "P4", "pics": 4, "date": "2025-09-23", "source": "蔡老师课件", "imgs": ["img/H15_plane_1.jpg", "img/H15_plane_2.jpg", "img/H15_plane_3.jpg", "img/H15_plane_4.jpg"], "vocab": ["晨读时间", "折纸飞机", "玩闹", "兴奋", "劝告", "击中", "责骂", "道歉"], "drafts": ["img/draft_20250928_183742.jpg", "img/draft_20250928_183749.jpg", "img/draft_20250928_213733.jpg", "img/draft_20250928_213809.jpg", "img/draft_20250928_214201.jpg"], "versions": {"adv": {"label": "范文 · 老师版", "words": "700", "info": "参考范文 · 主题：犯错改过", "segments": [{"pic": "1", "note": "图一：晨读时间，两人偷偷折纸飞机", "text": ["一个阳光明媚的星期三早上，阳光透过窗户玻璃照射在教室里，到处金亮亮，明晃晃的。此时正是晨读时间，同学们正在课室里全神贯注地看故事书。大家都看得津津有味。只有小明和小华却没有听老师的话，把故事书放在课桌的抽屉里，两个人在比赛折纸飞机。"]}, {"pic": "2", "note": "图二：在课室前比赛扔纸飞机；班长劝告", "text": ["纸飞机折好后，小华和小明便走到课室前，开始兴高采烈地玩纸飞机。他们俩一个把纸飞机扔向对方，一个也把纸飞机扔向对方，玩得不亦乐乎。“我的飞机飞得远不远？”小明笑呵呵地问小华。“哈哈哈！你折的纸飞机一点也不厉害，还没飞到我这边就已经落地了。”小华得意扬扬／得意洋洋地说。“好，那就让我们比一比，看看谁的飞机飞得最远，谁就是赢家。”小明接着说。", "于是，他们俩就这样高举纸飞机，站在同一条线上，用力地扔出纸飞机，比一比谁的纸飞机飞得更高更远。课室里充满了他们俩清脆的欢笑声。", "正在看书的班长丽丽，被他们的吵闹声吵得无法专心看书。所以，她猛地站了起来，指着小明和小华，耐心地劝告道：“小明、小华，你们太吵闹了，这样会影响大家看书的。而且现在是晨读时间，你们不该在课室里玩闹。”没想到，小明和小华却把丽丽的劝告当耳边风，并不理睬丽丽，继续玩纸飞机。丽丽见他们不理会自己，只好[[无可奈何]]地继续看自己的故事书，等着级任老师来教训他们两个的不当行为。其他同学也很生气地看着小明和小华，但是小明和小华却不知[[收敛]]自己的行为。"]}, {"pic": "3", "note": "图三：纸飞机击中丽丽的额头", "text": ["小明和小华继续在课室里玩纸飞机。“我这次肯定会赢的！”小明使劲地将纸飞机往高处一扔，只见纸飞机“嗖”的一声，飞向丽丽，[[不偏不倚]]地击中了丽丽的额头。丽丽发出一声尖叫。小华和小明看到眼前这一幕，不禁吓得目瞪口呆，惊慌地看着丽丽。丽丽用手捂着额头，疼得哇哇大哭，泪水像断了线的珍珠，从脸颊掉落下来。小华和小明自知理亏，冒出了一身冷汗，一句话也说不出来，怔怔地站在原地。"]}, {"pic": "4", "note": "图四：老师怒气冲冲地教训；道歉", "text": ["这时，级任老师林老师正好看到了小华和小明干的“好事”，便怒气冲冲地把他们叫到课室外面。林老师满脸怒容，眼睛瞪得圆圆的，[[眉毛竖成了倒“八”字]]，狠狠地把小华和小明骂了一顿。小华和小明自知理亏，惭愧地低下头，脸红得像番茄一样。后来，他们向丽丽道歉，还好丽丽没有受伤，她也原谅了他们。"]}, {"pic": "end", "note": "教训式结尾", "text": ["正所谓：“经一事，长一智。”经过这件事之后，小明和小华吸取教训，再也不敢在课室里玩闹了。"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "20/15（老师：后生可畏）", "words": "1100", "info": "正字：地（地面）／的（好的），跟（跟踪）／根（根源），原（原来）／愿（愿望）", "segments": [{"pic": "1", "text": ["一个鸟语花香的星期一早上，阳光透过窗户照进了教室，把每一张桌椅都[[镀上了一层金边]]。微风轻轻地吹了进来，掀起窗帘的一角，令人心旷神怡。", "现在正是晨读时间，老师让同学们拿出故事书来默读，她自己则去一趟办公室，打印几张练习单。可是老师前脚刚踏出教室时，小文和小明便从书桌的抽屉里拿出的并不是故事书，而是几张白纸，有模有样地折起纸飞机来。他们折了一个又一个的纸飞机，渐渐地，小文觉得有点儿无聊了。突然，他灵机一动，兴高采烈地对小明说道：“不如我们比赛谁折的纸飞机飞得更远吧！”小明一听，眼里冒出了兴奋的光芒，迫不及待地说：“好呀，好呀！”"]}, {"pic": "2", "note": "这里分段", "text": ["于是，他们俩拿着一堆纸飞机，像猴子一样窜到了教室的白板前，开始扔纸飞机。他们一左一右，齐齐地把脚尖贴在地砖的一条线后，把自己的纸飞机用力一扔。“你看，我的纸飞机飞得那么远，我肯定能赢！”小明得意洋洋地说。“明明没有，你看，我的纸飞机比你飞得远耶！”小文眉飞色舞，[[幸灾乐祸]]地说。", "这时，班长小丽猛地站了起来。她受不了小明和小文制造的这些噪音了。“小明、小文，现在是晨读时间，[[一寸光阴一寸金]]，你们应该珍惜我们的晨读时间，好好读书，而不是在教室前大声玩闹，那样会让别的同学们没办法专心读书的！”小丽苦口婆心地劝告道。可是小明和小文玩得不亦乐乎，正在兴头上，根本听不进去，继续大声地玩闹。小丽一看，气得七窍生烟，眉头皱成一团。可是，生气有什么用呢？于是，小丽只好坐了下来，忍耐着继续读书，打算等老师回来后向她报告。"]}, {"pic": "3", "text": ["突然，意外发生了。小文手一抖，纸飞机转了个弯，像一支离弦的箭一样冲向小丽，不偏不倚，重重地撞在了小丽的额头上，尖尖的飞机头顿时在小丽白白嫩嫩的皮肤上划出了一道血痕。小丽一愣，捂着额头，又惊又怒，“哇”的一声大哭了起来，眼泪像断了线的珍珠一样[[扑簌簌]]地掉了下来。小明和小文知道自己闯了大祸，呆若木鸡地站在一旁，不知所措地看着小丽，豆大的汗珠从他们的头上滚落下来。"]}, {"pic": "4", "text": ["这时，老师回来了，看到眼前这一幕，真是气不打一处来。她的眉毛竖成了“倒八”字，叉着腰，火冒三丈地责骂小明和小文：“你们俩自己不珍惜时间，在晨读时间打闹，不仅影响到别的同学读书，而且在拥挤的课室里玩纸飞机很可能伤害到别的同学，你们给我好好反思一下吧！”", "说完，老师心急如焚地去察看小丽的伤势。检查完，老师松了一口气，语气缓和了下来，说：“幸好没有太严重，不然后果不堪设想。”小文和小明满脸通红，不敢直视老师和小丽的眼睛，支支吾吾地道歉：“对……对不起，老师。我们下次再也不会那样做了，请您原谅我们吧。”老师见两个男生认错态度诚恳，心一软，原谅了他们。小丽也[[不计前嫌]]地与他们和好如初。教室里又恢复了[[书声琅琅]]的样子。"]}, {"pic": "end", "text": ["俗话说：“经一事，长一智。”经过这件事后，小文和小明下定决心，再也不会在课室里玩纸飞机了。"]}]}}, "detective": [{"w": "地", "t": "地", "opts": ["地", "的", "得"], "ctx": "微风轻轻□吹了进来，掀起窗帘的一角，令人心旷神怡", "why": "“慢慢地走”“偷偷地看”——形容动作怎么样做，用“地”；“漂亮的花”说名词用“的”；“跑得快”在动作后面用“得”。小作者在这里写错过，要记：动作前面用“地”。", "hint": "动作前面 → 地"}, {"w": "掀起窗帘的一角", "t": "掀", "opts": ["掀", "欣", "撕"], "ctx": "微风轻轻地吹了进来，□起窗帘的一角，令人心旷神怡", "why": "“掀开”的“掀”是提手旁加“欣”，用手揭开。“欣”是欣喜。", "hint": "用手揭 → 提手旁"}, {"w": "掀起窗帘的一角", "t": "帘", "opts": ["帘", "廉", "奁"], "ctx": "微风轻轻地吹了进来，掀起窗□的一角，令人心旷神怡", "why": "“窗帘”的“帘”上面是“穴”，下面是“巾”（布）。“廉”是廉价。", "hint": "穴字头＋巾"}, {"w": "幸灾乐祸", "t": "灾", "opts": ["灾", "栽", "宰"], "ctx": "”小文眉飞色舞，幸□乐祸地说", "why": "“灾难”的“灾”是宝盖头下面一个“火”——家里着火了就是灾。“栽”是栽树，“宰”是宰杀。", "hint": "房子里着火"}, {"w": "捂着额头", "t": "捂", "opts": ["捂", "悟", "晤"], "ctx": "小丽一愣，□着额头，又惊又怒，“哇”的一声大哭了起来，眼泪像断了线的珍珠一样扑簌簌地掉了下来", "why": "“捂着嘴”的“捂”是提手旁，用手盖住。“悟”是领悟（竖心旁），“晤”是会晤。", "hint": "用手盖 → 提手旁"}, {"w": "又惊又怒", "t": "惊", "opts": ["惊", "凉", "京"], "ctx": "小丽一愣，捂着额头，又□又怒，“哇”的一声大哭了起来，眼泪像断了线的珍珠一样扑簌簌地掉了下来", "why": "“惊讶”“吃惊”的“惊”是竖心旁，心里吓一跳。“凉”是两点水，“京”是北京。", "hint": "吓一跳是心情 → 竖心旁"}, {"w": "又惊又怒", "t": "怒", "opts": ["怒", "努", "奴"], "ctx": "小丽一愣，捂着额头，又惊又□，“哇”的一声大哭了起来，眼泪像断了线的珍珠一样扑簌簌地掉了下来", "why": "“愤怒”“怒气冲冲”的“怒”下面是“心”。“努”下面是“力”（努力），“奴”是奴隶。", "hint": "生气是心情 → 心字底"}, {"w": "闯了大祸", "t": "闯", "opts": ["闯", "闪", "闲"], "ctx": "小明和小文知道自己□了大祸，呆若木鸡地站在一旁，不知所措地看着小丽，豆大的汗珠从他们的头上滚落下来", "why": "“闯祸”的“闯”是门字框里一匹“马”，马冲进门来。“闪”里面是人，“闲”里面是木。", "hint": "门里一匹马"}, {"w": "不知所措", "t": "措", "opts": ["措", "错", "借"], "ctx": "小明和小文知道自己闯了大祸，呆若木鸡地站在一旁，不知所□地看着小丽，豆大的汗珠从他们的头上滚落下来", "why": "“不知所措”的“措”是提手旁，本来指安放、处理。“错”是错误（金字旁），“借”是借东西（单人旁）。", "hint": "提手旁＋昔"}, {"w": "继续", "t": "续", "opts": ["续", "读", "绩"], "ctx": "可是小明和小文玩得不亦乐乎，正在兴头上，根本听不进去，继□大声地玩闹", "why": "“继续”的“续”是绞丝旁，像把线接下去。“读”是言字旁，“绩”是成绩。", "hint": "接线 → 绞丝旁"}], "audio": {"adv": {"src": "audio/paper-plane_adv.mp3", "cues": [["paper-plane|adv|1|0", 0.0], ["paper-plane|adv|2|0", 29.22], ["paper-plane|adv|2|1", 66.07], ["paper-plane|adv|2|2", 80.87], ["paper-plane|adv|3|0", 124.91], ["paper-plane|adv|4|0", 166.74], ["paper-plane|adv|end|0", 197.55]]}, "qx": {"src": "audio/paper-plane_qx.mp3", "cues": [["paper-plane|qx|1|0", 0.05], ["paper-plane|qx|1|1", 15.67], ["paper-plane|qx|2|0", 58.85], ["paper-plane|qx|2|1", 88.42], ["paper-plane|qx|3|0", 133.42], ["paper-plane|qx|4|0", 178.22], ["paper-plane|qx|4|1", 206.05], ["paper-plane|qx|end|0", 245.98]]}}}, {"id": "home-money", "title": "在家发现五十元，兄弟俩拿去吃大餐", "cat": "falls", "grade": "P4", "pics": 4, "date": "2025-09-24", "source": "学校年终考试模拟作文 · 学校", "imgs": ["img/S01_money_1.jpg", "img/S01_money_2.jpg", "img/S01_money_3.jpg", "img/S01_money_4.jpg"], "vocab": ["动画片", "发现", "兴奋", "主意", "快餐店", "美味的食物", "批评", "认错"], "drafts": ["img/draft_20251001_170404.jpg", "img/draft_20251001_170428.jpg", "img/draft_20251001_170438.jpg", "img/draft_20251001_170444.jpg"], "versions": {"qx": {"label": "小作者版 · 学校老师批改", "words": "400", "info": "四年级华文年终考试模拟作文（40 分钟，15 分）。老师改了几处用字：饱（不是抱）、再（不是在）、低（不是底）、注意（不是住意）。", "segments": [{"pic": "1", "text": ["一个阳光明媚的星期天早上，小鸟叽叽喳喳地在树上唱歌，阳光温柔地洒向大地，~~让~~到处都暖暖的。小明在家里看电视。今天是假期，我终于可以痛快地看++我最喜欢的++电视啦！小明得意洋洋地想。突然，小明在一本厚厚的词典下发现了一张长方形、绿色的50元！"]}, {"pic": "2", "text": ["他大吃一惊，赶快冲到桌子前，拿起50元，高高举在手中，开心地手舞足蹈。", "这时，哥哥走进了客厅，然后看见了小明眉飞色舞的表情，便好奇地问道：“你在干什么？”“我发现了++一张++50元！”小明兴奋地说。哥哥的脑海里突然冒出了一个馊主意。“不如我们用这一大笔钱来吃大餐吧！我正好还有点饿了呢。”小明点点头，说：“这个主意太棒了，我们快去吧！”说完，小明拉着哥哥就往外跑。"]}, {"pic": "3", "text": ["兄弟俩很快就到了他们最爱的快餐店。“我们要两个大鸡腿……”++他们++用五十元点了一桌美味的食物。++食物到后，++他们津津有味地吃了起来。++兄弟俩++一边吃还一边热火朝天地聊天。过了一会儿，他们都~~抱~~++饱++得~~在~~++再++吃就要吐了。“我们回家吧！”哥哥++一边++说，++一边++摸着圆滚滚的肚子。"]}, {"pic": "4", "text": ["到家后，小明发现爸爸火冒三丈地站在电视旁。“你们是不是拿了我的五十元？那可是我要去买菜的钱！”小明和哥哥一听，涨红了脸，~~底~~++低++下头，异口同声地道歉：“对不起，爸爸。我们再也不会拿您的钱了！请您原谅我们吧！”看着兄弟俩可怜巴巴的表情，爸爸心一软，说：“知错能改，还是好孩子，下次~~住~~++注++意一点哦！”说完，他脸上露出了微笑，摸了摸他们的头。"]}, {"pic": "end", "note": "老师把结尾改成：再也不会拿别人的钱买自己喜欢的东西了", "text": ["俗话说：“吃一堑，长一智。”经过这一件事，小明和哥哥下定决心，再也不会~~不知道是谁的钱就拿来~~++拿别人的钱买自己喜欢的++东西了。"]}]}}, "detective": [{"w": "饱", "t": "饱", "opts": ["饱", "抱", "泡"], "ctx": "过了一会儿，他们都□得再吃就要吐了", "why": "“吃饱”的“饱”是食字旁，吃东西吃饱。小作者写成“抱”（提手旁）过——抱是用手抱。", "hint": "吃饱 → 食字旁"}, {"w": "再", "t": "再", "opts": ["再", "在", "载"], "ctx": "过了一会儿，他们都饱得□吃就要吐了", "why": "“再也不会”“再次”的“再”是又一次。“在”是在哪里（在家、实在）。小作者把“实在”写成“实再”、“再吃”写成“在吃”——记住：又一次 → 再。", "hint": "又一次 → 再；地点 → 在"}, {"w": "低", "t": "低", "opts": ["低", "底", "抵"], "ctx": "”小明和哥哥一听，涨红了脸，□下头，异口同声地道歉：“对不起，爸爸", "why": "“低头”的“低”是单人旁，人把头低下。“底”是广字头（鞋底、底下）。小作者把“低下头”写成“底下头”过！", "hint": "人低头 → 单人旁"}, {"w": "注意", "t": "注", "opts": ["注", "住", "柱"], "ctx": "”看着兄弟俩可怜巴巴的表情，爸爸心一软，说：“知错能改，还是好孩子，下次□意一点哦", "why": "“注意”的“注”是三点水，本来是把水灌进去，引申为把心思放进去。“住”是居住（单人旁）。小作者写过“住意”！", "hint": "注意 → 三点水"}, {"w": "吃一堑", "t": "堑", "opts": ["堑", "暂", "崭"], "ctx": "俗话说：“吃一□，长一智", "why": "“吃一堑，长一智”的“堑”是土字底，本来指壕沟（掉进沟里吃了亏）。“暂”是暂时（日字底），“崭”是崭新。", "hint": "掉进土沟吃亏 → 土字底"}, {"w": "阳光明媚", "t": "媚", "opts": ["媚", "眉", "楣"], "ctx": "一个阳光明□的星期天早上，小鸟叽叽喳喳地在树上唱歌，阳光温柔地洒向大地，到处都暖暖的", "why": "“阳光明媚”的“媚”是女字旁加“眉”。“眉”是眉毛，“楣”是门楣（木字旁）。", "hint": "女字旁＋眉"}, {"w": "知错能改", "t": "错", "opts": ["错", "措", "昔"], "ctx": "”看着兄弟俩可怜巴巴的表情，爸爸心一软，说：“知□能改，还是好孩子，下次注意一点哦", "why": "“错误”“错字”的“错”是金字旁。“措”是不知所措（提手旁）。", "hint": "金字旁＋昔"}, {"w": "知错能改", "t": "改", "opts": ["改", "攻", "改"], "ctx": "”看着兄弟俩可怜巴巴的表情，爸爸心一软，说：“知错能□，还是好孩子，下次注意一点哦", "why": "“改正”“知错能改”的“改”左边是“己”，右边是反文旁。注意左边是“己”，不是“已”。", "hint": "己＋反文旁"}, {"w": "腿", "t": "腿", "opts": ["腿", "退", "褪"], "ctx": "“我们要两个大鸡□……”他们用五十元点了一桌美味的食物", "why": "“腿”是月肉旁，身体的部位都用月字旁。“退”是后退，“褪”是褪色（衣字旁）。", "hint": "身体部位 → 月字旁"}, {"w": "软", "t": "软", "opts": ["软", "欢", "轼"], "ctx": "”看着兄弟俩可怜巴巴的表情，爸爸心一□，说：“知错能改，还是好孩子，下次注意一点哦", "why": "“软”是车字旁加“欠”。“腿软”就是腿没力气了。“欢”是欢乐，“轼”是古人的名字里的字。", "hint": "车字旁"}], "audio": {"qx": {"src": "audio/home-money_qx.mp3", "cues": [["home-money|qx|1|0", 0.05], ["home-money|qx|2|0", 27.96], ["home-money|qx|2|1", 36.3], ["home-money|qx|3|0", 65.68], ["home-money|qx|4|0", 92.73], ["home-money|qx|end|0", 126.29]]}}}, {"id": "kick-sister", "title": "在家踢球，踢到睡觉的妹妹", "cat": "falls", "grade": "P4", "pics": 4, "date": "2025-09-30", "source": "蔡老师课件", "imgs": ["img/H16_sister_1.jpg", "img/H16_sister_2.jpg", "img/H16_sister_3.jpg", "img/H16_sister_4.jpg"], "vocab": ["厨房", "做饭", "踢球", "睡觉", "打中", "大声笑", "骂", "认错"], "drafts": [], "qxNote": "这一周的学生名单里没有小作者，课件里也没有她的作文。", "versions": {"basic": {"label": "范文 · 基础版（同学考场作文）", "words": "400", "info": "詹思吾的考场作文 14/15", "segments": [{"pic": "1", "note": "图一：妈妈做饭，妹妹睡觉，兄弟俩无聊", "text": ["一个阳光明媚的星期五下午，爸爸去上班了，妈妈在厨房做晚餐，小美在房间睡觉，小明和小文则无所事事，在客厅里玩玩具。", "这时，小明想到了一个好主意，他打算在小美的房间里踢球，因为妈妈总是不让他们在客厅踢球，在妹妹的房间踢球，就不会被妈妈发现。小文点了点头，然后他们就一起往小美的房间跑去。"]}, {"pic": "2", "note": "图二：球踢到妹妹脸上", "text": ["他们俩玩着玩着，丝毫没有想到这样会影响到正睡得美滋滋的小美。因为，小明一个不小心，把球一踢，重重地踢到了小美脸上。"]}, {"pic": "3", "note": "图三：妹妹大哭，兄弟俩却哈哈大笑", "text": ["小美立刻被痛醒，她疼得哇哇大哭，哭声引起了妈妈的注意。小明和小文脸上没有一点歉意，反而哈哈大笑了起来。"]}, {"pic": "4", "note": "图四：妈妈大骂；兄弟俩认错", "text": ["这时，妈妈大步流星地走了进来，立刻大骂：“小明和小文！你们怎么可以把小美打成这样！你们知道有多危险吗？要是打到[[太阳穴]]，后果不堪设想！”“对……对不起，妈妈，我们知错了。”小明和小文异口同声地说，妈妈也终于平静下来了，原谅了小明和小文。"]}, {"pic": "end", "text": ["经过这件事，小明和小文再不敢在房间踢球，把球踢到妹妹身上了。"]}]}, "adv": {"label": "范文 · 高阶版", "words": "1200", "info": "进阶版作文 · 妈妈的怒火“像火山爆发”，手足之情的主题", "segments": [{"pic": "1", "note": "图一：厨房“滋滋”作响；妹妹睡得香甜；兄弟俩百无聊赖→偷偷去妹妹房间", "text": ["那是一个阳光明媚的星期五下午，天空湛蓝如洗，阳光透过玻璃窗洒进屋子里，把客厅照得金灿灿的。爸爸上班还没回家，妈妈正埋头在厨房里忙碌，锅里“滋滋”作响，饭菜的香味在空气中弥漫开来。小美正在房间里香甜地睡午觉，小脸红扑扑的，呼吸均匀，睡得香甜极了。客厅里，小明和小文却无所事事，百无聊赖地摆弄着玩具，心里暗暗发愁：这漫长的下午，究竟要怎么玩才够有趣呢？", "这时，小明的眼珠子[[滴溜溜一转]]，忽然灵机一动，压低声音对弟弟说：“妈妈总是不让我们在客厅踢球，要是被发现了肯定又要挨骂。不如——我们到小美的房间去踢球，那里空间大，妈妈不会看见！”", "小文眨了眨眼，虽然心里有些犹豫，但很快被这个“新鲜主意”吸引。他抿嘴一笑，点了点头：“好啊！走吧！”于是，两人像两只调皮的小猴子般，拿起球，一蹦一跳地跑进了小美的房间。"]}, {"pic": "2", "note": "图二：你来我往；一脚踢得过猛，砸到妹妹脸上", "text": ["进入房间后，小明迫不及待地把球抱在怀里，眼神中闪烁着兴奋的光芒。他用力一抛，球在空中划出一道弧线，又重重落下。小文接住后哈哈大笑，兴奋得直跺脚：“真好玩！比在客厅刺激多了！”他们你来我往，房间里顿时热闹非凡，笑声和皮球的“砰砰”声此起彼伏。", "然而，他们却完全没有注意到不远处的小床上，妹妹小美正睡得正香。她眉头舒展，嘴角带着一丝微笑，仿佛在梦中做着美好的梦。可吵闹声渐渐传到耳边，她本能地皱了皱眉，却依旧没有醒来。", "就在这时，小明忽然一脚踢得过猛。只听“砰”的一声，皮球像离弦的箭一样飞出去，径直砸在小美的脸上。"]}, {"pic": "3", "note": "图三：妹妹嚎啕大哭；兄弟俩幸灾乐祸；妈妈冲出来", "text": ["“哇——！”小美猛地惊醒，痛得立刻嚎啕大哭。泪水像断了线的珠子般滚落下来，小小的双手捂着脸，哭声[[凄厉刺耳]]，回荡在整个房间里。", "小文愣了一下，眼里闪过一丝慌乱，但随即仰头大笑：“哈哈，她哭得好伤心！”小明也忍不住捧着肚子大笑，完全没有意识到事情的严重性。", "厨房里的妈妈听见哭声，心头一紧，立刻放下锅铲，快步冲了出来。只见小美小脸红肿，泪眼汪汪地扑到她怀里，哭得上气不接下气：“妈妈……呜呜……他们踢我……”"]}, {"pic": "4", "note": "图四：妈妈厉声呵斥；兄弟俩认错；向妹妹道歉", "text": ["妈妈心疼得眼眶一热，转头看见小明和小文正一副幸灾乐祸的样子，心中的怒火顿时[[像火山爆发]]。她快步走上前，眉头紧锁，厉声呵斥：“小明！小文！你们怎么能这样欺负妹妹？你们知道有多危险吗？要是球打到太阳穴，后果不堪设想！”", "妈妈的声音如同[[晴天霹雳]]，震得两个孩子愣在原地。小文心里猛然一沉，后悔与害怕像潮水般涌上来，额头渗出细密的汗珠。他声音发抖地低声辩解：“妈……我们只是想玩玩，没有想到……”小明更是被吓得脸色苍白，嘴唇颤抖，低着头不敢看妈妈：“对不起……我们真的不是故意的。”", "妈妈怒气未消，目光怒视着两个儿子，严厉地说：“不是故意就能原谅吗？你们要记住，安全没有小事！做哥哥的，更应该保护妹妹，而不是伤害她！”", "小文心里一阵刺痛，低下头不敢吭声，手指绞来绞去，悔得眼泪都快掉下来。小明咬紧嘴唇，忽然走上前，拉了拉妈妈的衣角，小声而真诚地说：“妈妈，对不起，我们真的知错了。以后一定不会再这样了。”", "见两个孩子终于认识到错误，妈妈的怒气渐渐消散。她叹了一口气，轻轻拍了拍小美的后背，安慰她：“别哭了，没事了。”然后转头语重心长地对小明和小文说：“记住，家人之间应该互相关心、互相爱护。[[手足之情]]，比什么都珍贵。”", "小文抬起头，眼神里满是悔意，轻轻走到小美身边，把纸巾递到她手里，声音颤抖：“妹妹，对不起，我们真的错了。以后我们一定会保护你，不会再欺负你了，好吗？”小明也点点头，伸手轻轻擦去小美脸上的泪水，满脸愧疚。", "小美抽泣着望着两个哥哥，心里的委屈慢慢化开。她点了点头，声音还带着哭腔：“那你们以后不准再这样了！”兄弟俩连连点头，郑重承诺：“一定不会了！”"]}, {"pic": "end", "text": ["正所谓：“吃一堑，长一智。”自那以后，小明和小文吸取教训，再也不敢在房间里踢球，更不会把球踢向妹妹。他们学会了自律，也学会了珍惜手足之间的情谊。"]}]}}, "detective": [{"w": "美滋滋", "t": "滋", "opts": ["滋", "兹", "磁"], "ctx": "他们俩玩着玩着，丝毫没有想到这样会影响到正睡得美□滋的小美", "why": "“滋味”“滋滋响”的“滋”是三点水。“兹”没有三点水，“磁”是磁铁（石字旁）。", "hint": "三点水＋兹"}, {"w": "像离弦的箭一样", "t": "箭", "opts": ["箭", "剑", "前"], "ctx": "只听“砰”的一声，皮球像离弦的□一样飞出去，径直砸在小美的脸上", "why": "“离弦的箭”的“箭”是竹字头，古代的箭用竹子做。“剑”是宝剑（右边立刀），“前”是前面。", "hint": "竹字头＋前"}, {"w": "吃一堑", "t": "堑", "opts": ["堑", "暂", "崭"], "ctx": "正所谓：“吃一□，长一智", "why": "“吃一堑，长一智”的“堑”是土字底，本来指壕沟（掉进沟里吃了亏）。“暂”是暂时（日字底），“崭”是崭新。", "hint": "掉进土沟吃亏 → 土字底"}, {"w": "顿时", "t": "顿", "opts": ["顿", "吨", "钝"], "ctx": "”他们你来我往，房间里□时热闹非凡，笑声和皮球的“砰砰”声此起彼伏", "why": "“顿时”的“顿”是左边“屯”右边“页”。“吨”是重量（口字旁），“钝”是不锋利（金字旁）。", "hint": "屯＋页"}, {"w": "阳光明媚", "t": "媚", "opts": ["媚", "眉", "楣"], "ctx": "那是一个阳光明□的星期五下午，天空湛蓝如洗，阳光透过玻璃窗洒进屋子里，把客厅照得金灿灿的", "why": "“阳光明媚”的“媚”是女字旁加“眉”。“眉”是眉毛，“楣”是门楣（木字旁）。", "hint": "女字旁＋眉"}, {"w": "迫不及待", "t": "及", "opts": ["及", "极", "急"], "ctx": "进入房间后，小明迫不□待地把球抱在怀里，眼神中闪烁着兴奋的光芒", "why": "“迫不及待”的“及”是来得及、赶上的意思，三笔：撇、横折折撇、捺。“极”是极了（木字旁），“急”是着急。", "hint": "只有三笔"}, {"w": "迫不及待", "t": "待", "opts": ["待", "侍", "持"], "ctx": "进入房间后，小明迫不及□地把球抱在怀里，眼神中闪烁着兴奋的光芒", "why": "“迫不及待”的“待”是双人旁加“寺”，等待。“侍”是侍候（单人旁），“持”是坚持（提手旁）。", "hint": "等待 → 双人旁"}, {"w": "再也不敢", "t": "再", "opts": ["再", "在", "载"], "ctx": "”自那以后，小明和小文吸取教训，□也不敢在房间里踢球，更不会把球踢向妹妹", "why": "“再也不会”“再次”的“再”是又一次。“在”是在哪里（在家、实在）。小作者把“实在”写成“实再”、“再吃”写成“在吃”——记住：又一次 → 再。", "hint": "又一次 → 再；地点 → 在"}, {"w": "再也不敢", "t": "敢", "opts": ["敢", "赶", "感"], "ctx": "”自那以后，小明和小文吸取教训，再也不□在房间里踢球，更不会把球踢向妹妹", "why": "“勇敢”“不敢”的“敢”右边是反文旁。“赶”是赶快（走字旁），“感”是感觉（心字底）。", "hint": "反文旁"}, {"w": "一副", "t": "副", "opts": ["副", "幅", "富"], "ctx": "妈妈心疼得眼眶一热，转头看见小明和小文正一□幸灾乐祸的样子，心中的怒火顿时像火山爆发", "why": "“一副表情”的“副”右边是立刀。“幅”是一幅画（巾字旁），“富”是富有（宝盖头）。", "hint": "右边立刀"}], "audio": {"basic": {"src": "audio/kick-sister_basic.mp3", "cues": [["kick-sister|basic|1|0", 0.0], ["kick-sister|basic|1|1", 16.95], ["kick-sister|basic|2|0", 38.8], ["kick-sister|basic|3|0", 54.35], ["kick-sister|basic|4|0", 68.61], ["kick-sister|basic|end|0", 98.43]]}, "adv": {"src": "audio/kick-sister_adv.mp3", "cues": [["kick-sister|adv|1|0", 0.0], ["kick-sister|adv|1|1", 46.32], ["kick-sister|adv|1|2", 64.28], ["kick-sister|adv|2|0", 83.41], ["kick-sister|adv|2|1", 111.29], ["kick-sister|adv|2|2", 132.88], ["kick-sister|adv|3|0", 142.83], ["kick-sister|adv|3|1", 157.98], ["kick-sister|adv|3|2", 171.46], ["kick-sister|adv|4|0", 189.2], ["kick-sister|adv|4|1", 212.42], ["kick-sister|adv|4|2", 242.62], ["kick-sister|adv|4|3", 257.89], ["kick-sister|adv|4|4", 277.1], ["kick-sister|adv|4|5", 304.94], ["kick-sister|adv|4|6", 331.15], ["kick-sister|adv|end|0", 349.43]]}}}, {"id": "river-fishing", "title": "不顾“危险”告示牌下河捉鱼", "cat": "whoops", "grade": "P4", "pics": 4, "date": "2025-10-04", "source": "学校作文 · 学校", "imgs": ["img/S02_fish_1.jpg", "img/S02_fish_2.jpg", "img/S02_fish_3.jpg", "img/S02_fish_4.jpg"], "vocab": ["结伴", "捉鱼", "告示牌", "危险", "脚下一滑", "跌入河里", "大喊救命", "路过"], "drafts": ["img/draft_20251004_153714.jpg", "img/draft_20251004_153717.jpg", "img/draft_20251004_153724.jpg", "img/draft_20251004_153728.jpg"], "versions": {"qx": {"label": "小作者版 · 原稿转录", "words": "600", "info": "老师还没有批改，这是小作者手稿的原文转录（她自己在稿纸上补写的句子也一并放进去了）。题目提示：（起因）小光和他的好朋友小华，结伴一起去捉鱼……（经过）小光看到告示牌上写着“危险”。可是，他鞋子一脱，就走进河里玩……走着走着，脚下一滑，跌入河里……小华也跟着一起大喊救命……这时，一位叔叔刚好路过……", "segments": [{"pic": "1", "text": ["一个晴朗的星期六早晨，阳光温柔地洒向大地，让到处都暖暖的。小明和小文觉得这么美好的一天要好好玩一玩，放松心情。他们打算去附近刚装修完的生态园去捉鱼。", "于是，两个男孩迫不及待地拿好小桶和小渔网就出门了。不久后，小明和小文来到了生态园。“哇，这里好漂亮呀！这比以前的生态园好多了！”小明高兴得手舞足蹈。小文也点了点头。两个男孩肩并肩，脸上都挂着灿烂的微笑就踏进了生态湖的大门。"]}, {"pic": "2", "text": ["小明和小文吸着新鲜空气，听着小鸟叽叽喳喳的歌声，有说有笑地走着，开心极了。很快的，他们就来到了生态园的中心，一个宽阔的大湖。绿油油、长满鲜花的植物围绕着整个大湖，天鹅悠闲地飘浮在水面，宁静极了。小文说：“这是个好地方，我们就在这里捉鱼吧！”于是，他脱掉了鞋子，三步并作两步地冲进了冰冷的水里。可是，他并没有看见就在他的后方立着一个牌子，上面用红色笔清晰地写着“危险”。"]}, {"pic": "3", "text": ["当小明看见牌子的时候，水已经到小文的腰了。突然，小文在水底下的滑石头绊倒了，他脚下一空，只听“啊”的一声，小文沉了下去。小明看见眼前这一幕，吓得嘴巴张得大大的，眼睛瞪得像铜铃一样大。“小明，我不会游泳，我怎么——”说到一半，小文被水呛了一下。小明想帮忙，可是他也不会游泳，什么也不能做，只能在一旁大声喊：“救命啊，有人溺水啦，快来帮忙！”"]}, {"pic": "4", "text": ["幸好，路过的叔叔听到小明的喊叫声，大步流星地赶来，然后脱下上衣，跳进水中。他像一条飞鱼一样游到了小文的前面，用一双长满肌肉的手抓住了小文的衣角，把他拖回了岸上。", "“谢谢你，叔叔！”小明手忙脚乱地跑到小文跟前，心急如焚地说：“小文，小文，你还好吗？没受伤吧？”小文虚弱地点了点头。叔叔也皱着眉头，火冒三丈地说：“你们怎么能走到深水去呢？”“对不起，叔叔，我不是故意的，我下次再也不会那样做了，请您原谅我吧。”小文低着头，红着脸，看起来很可怜。叔叔心一软，说：“没事，知错能改，还是好孩子。”小文用力地点了点头。"]}, {"pic": "end", "text": ["俗话说：“经一事，长一智。”经过这件事后，小文下定决心，再也不会只顾贪玩，而不注意安全。"]}]}}, "detective": [{"w": "火冒三丈", "t": "冒", "opts": ["冒", "昌", "帽"], "ctx": "叔叔也皱着眉头，火□三丈地说：“你们怎么能走到深水去呢", "why": "“火冒三丈”的“冒”上面是“冃”（不封口），下面是“目”。“昌”是两个日，“帽”是帽子（巾字旁）。", "hint": "上面不封口，下面是目"}, {"w": "心急如焚", "t": "焚", "opts": ["焚", "梵", "焚"], "ctx": "”小明手忙脚乱地跑到小文跟前，心急如□地说：“小文，小文，你还好吗", "why": "“心急如焚”的“焚”上面是“林”，下面是“火”——树林着火了，急得像心里烧起来。", "hint": "林＋火"}, {"w": "迫不及待", "t": "及", "opts": ["及", "极", "急"], "ctx": "于是，两个男孩迫不□待地拿好小桶和小渔网就出门了", "why": "“迫不及待”的“及”是来得及、赶上的意思，三笔：撇、横折折撇、捺。“极”是极了（木字旁），“急”是着急。", "hint": "只有三笔"}, {"w": "迫不及待", "t": "待", "opts": ["待", "侍", "持"], "ctx": "于是，两个男孩迫不及□地拿好小桶和小渔网就出门了", "why": "“迫不及待”的“待”是双人旁加“寺”，等待。“侍”是侍候（单人旁），“持”是坚持（提手旁）。", "hint": "等待 → 双人旁"}, {"w": "眼睛瞪得像铜铃", "t": "瞪", "opts": ["瞪", "登", "蹬"], "ctx": "小明看见眼前这一幕，吓得嘴巴张得大大的，眼睛□得像铜铃一样大", "why": "“瞪大眼睛”的“瞪”是目字旁。“蹬”是蹬腿（足字旁），“登”是登山。", "hint": "眼睛 → 目字旁"}, {"w": "眼睛瞪得像铜铃", "t": "铜", "opts": ["铜", "洞", "桐"], "ctx": "小明看见眼前这一幕，吓得嘴巴张得大大的，眼睛瞪得像□铃一样大", "why": "“铜铃”的“铜”是金字旁，铜是金属。“洞”是山洞（三点水），“桐”是梧桐树。", "hint": "金属 → 金字旁"}, {"w": "眼睛瞪得像铜铃", "t": "铃", "opts": ["铃", "玲", "零"], "ctx": "小明看见眼前这一幕，吓得嘴巴张得大大的，眼睛瞪得像铜□一样大", "why": "“铜铃”“门铃”的“铃”是金字旁，铃铛是金属做的。“玲”是玲珑（王字旁），“零”是零食（雨字头）。", "hint": "金属 → 金字旁"}, {"w": "时候", "t": "候", "opts": ["候", "侯", "喉"], "ctx": "当小明看见牌子的时□，水已经到小文的腰了", "why": "“时候”的“候”中间有一竖。“侯”没有那一竖（诸侯），“喉”是喉咙（口字旁）。", "hint": "中间多一竖"}, {"w": "低着头", "t": "低", "opts": ["低", "底", "抵"], "ctx": "”小文□着头，红着脸，看起来很可怜", "why": "“低头”的“低”是单人旁，人把头低下。“底”是广字头（鞋底、底下）。小作者把“低下头”写成“底下头”过！", "hint": "人低头 → 单人旁"}, {"w": "知错能改", "t": "错", "opts": ["错", "措", "昔"], "ctx": "叔叔心一软，说：“没事，知□能改，还是好孩子", "why": "“错误”“错字”的“错”是金字旁。“措”是不知所措（提手旁）。", "hint": "金字旁＋昔"}], "audio": {"qx": {"src": "audio/river-fishing_qx.mp3", "cues": [["river-fishing|qx|1|0", 0.05], ["river-fishing|qx|1|1", 17.45], ["river-fishing|qx|2|0", 43.58], ["river-fishing|qx|3|0", 83.13], ["river-fishing|qx|4|0", 120.31], ["river-fishing|qx|4|1", 136.56], ["river-fishing|qx|end|0", 176.72]]}}}, {"id": "craft-grandma", "title": "做手工弄得一地纸屑，奶奶弯腰扫地", "cat": "bonds", "grade": "P4", "pics": 4, "date": "图：蔡老师", "source": "范文：慧眼仿写（非蔡老师原文）", "imgs": ["img/G_craft_1.jpg", "img/G_craft_2.jpg", "img/G_craft_3.jpg", "img/G_craft_4.jpg"], "vocab": ["做手工", "剪刀", "丢", "扫地", "转头", "发现", "满头大汗", "不好意思", "帮忙", "干净"], "aiNote": "这一题蔡老师只给了图，没有范文。下面两篇是模仿蔡老师范文的写法补写的，供参考，不是老师原文。", "versions": {"basic": {"label": "仿写 · 基础版", "words": "420", "info": "一图一段＋开头和结尾（慧眼仿写）", "segments": [{"pic": "start", "note": "天气开头法", "text": ["一个很平常的星期六早上，暖洋洋的阳光透过窗户洒进客厅，照得地板亮亮的。小明吃过早餐，就坐在书桌前[[兴致勃勃]]地做起手工来。"]}, {"pic": "1", "note": "图一：做手工，纸屑丢了一地", "text": ["他拿起剪刀，“咔嚓咔嚓”地剪着彩色的卡纸，想做一只会飞的纸鸟。剪下来的纸屑，他随手往地上一丢，不一会儿，桌子底下就像下了一场“彩色的雪”。"]}, {"pic": "2", "note": "图二：奶奶弯腰扫地，小明没发现", "text": ["奶奶走进房间，看到满地的纸屑，什么也没说，就拿起扫把，弯着腰一点一点地扫起来。小明做得太入迷了，头也不抬，还在不停地往地上丢纸屑。"]}, {"pic": "3", "note": "图三：转头发现奶奶累得满头大汗", "text": ["过了一会儿，小明转过头来，才发现奶奶已经累得[[满头大汗]]，一只手扶着腰，脸上露出了难受的表情。小明的脸一下子红了，心里很不好意思，连忙放下剪刀说：“奶奶，对不起，让我来扫吧！”"]}, {"pic": "4", "note": "图四：小明扫地，奶奶竖起大拇指", "text": ["小明拿过扫把，认认真真地把纸屑扫进簸箕里，很快就把地板扫得[[干干净净]]。奶奶坐在椅子上，竖起大拇指，笑眯眯地说：“小明真是个懂事的好孩子！”"]}, {"pic": "end", "note": "结尾：学到的道理", "text": ["从此以后，小明做完手工都会自己收拾干净，再也不乱丢纸屑了。他明白了：自己的事情自己做，才不会让家人辛苦。"]}]}, "adv": {"label": "仿写 · 高阶版", "words": "900", "info": "多了心理描写和细节（慧眼仿写）", "segments": [{"pic": "start", "note": "天气开头＋人物上场", "text": ["一个很平常的星期六早上，金灿灿的阳光透过窗帘的缝隙，在地板上洒下一道道金边。窗外的小鸟[[叽叽喳喳]]地唱着歌，像是在催促大家快点起床。小明吃完早餐，就[[迫不及待]]地搬出一盒彩色卡纸和一把剪刀，坐在书桌前做起手工来。"]}, {"pic": "1", "note": "动作描写：剪纸；用比喻写满地纸屑", "text": ["他要做的是一只会扇翅膀的纸鸟。小明[[全神贯注]]地盯着卡纸，剪刀在他手里“咔嚓咔嚓”地响个不停。剪下来的碎纸片，他看也不看，随手就往地上一丢。不一会儿，桌子底下、椅子旁边，到处都是五颜六色的纸屑，好像下了一场[[彩色的雪]]。"]}, {"pic": "2", "note": "奶奶的动作；小明“头也不抬”是对比", "text": ["这时，奶奶端着一杯温水走进房间，想让小明休息一下。一看到满地的纸屑，她皱了皱眉头，却什么也没说，轻轻地放下杯子，拿起墙角的扫把，弯着腰一下一下地扫了起来。小明做得太入迷了，连奶奶走进来都没发现，头也不抬，手里的剪刀还在不停地剪，纸屑还在不停地往下落，奶奶刚扫干净的地方，一转眼又变花了。"]}, {"pic": "3", "note": "转头发现；心理描写＋语言描写", "text": ["过了好一会儿，小明终于剪好了纸鸟的翅膀，得意地转过头，想让奶奶看一看。可是眼前的一幕让他[[愣住了]]：奶奶一只手扶着扫把，另一只手捶着后腰，额头上布满了豆大的汗珠，连呼吸都变得[[气喘吁吁]]的。", "小明的脸“唰”的一下红到了耳根，心里像被什么东西揪了一下。他想：奶奶的腰本来就不好，我却让她弯着腰替我扫了这么久……他连忙放下剪刀，三步并作两步跑过去，接过扫把，[[不好意思]]地说：“奶奶，对不起！这些纸屑是我丢的，应该我来扫。您快坐下休息一下吧！”"]}, {"pic": "4", "note": "动作描写：扫地；奶奶的反应", "text": ["奶奶[[欣慰]]地笑了，慢慢地坐到椅子上。小明学着奶奶的样子，弯下腰，把角落里的纸屑一片一片扫出来，再小心地扫进簸箕里。他扫得很仔细，连椅子底下也没放过。不一会儿，地板就被他扫得[[一尘不染]]，亮得能照出人影来。", "奶奶看着满头大汗的小明，竖起大拇指，笑眯眯地说：“我们家小明长大了，真是个懂事又会心疼人的好孩子！”小明听了，不好意思地挠了挠头，心里却像吃了蜜糖一样甜。"]}, {"pic": "end", "note": "结尾：道理＋以后怎么做", "text": ["俗话说：“[[勿以恶小而为之，勿以善小而不为]]。”随手丢一片纸屑看起来是小事，却会让家人多弯一次腰。从此以后，小明做完手工总是先把桌面和地板收拾得干干净净，再也没有让奶奶替他扫过地。"]}]}}, "detective": [{"w": "剪刀", "t": "剪", "opts": ["剪", "箭", "煎"], "ctx": "他拿起□刀，“咔嚓咔嚓”地剪着卡纸", "why": "“剪”下面是“刀”，剪刀、剪纸。“箭”是竹字头（弓箭），“煎”是四点底（煎蛋）。", "hint": "下面有“刀”"}, {"w": "纸屑", "t": "屑", "opts": ["屑", "削", "消"], "ctx": "桌子底下到处都是纸□", "why": "“屑”是尸字头，碎小的东西（纸屑、木屑）。“削”是立刀旁（削铅笔），“消”是三点水（消失）。", "hint": "尸字头"}, {"w": "扫地", "t": "扫", "opts": ["扫", "归", "妇"], "ctx": "奶奶拿起□把，弯着腰扫起来", "why": "“扫”是提手旁，用手拿扫把。“归”是回去，“妇”是妇女。", "hint": "提手旁"}, {"w": "转头", "t": "转", "opts": ["转", "传", "砖"], "ctx": "小明□过头来，才发现奶奶满头大汗", "why": "“转”是车字旁，转动、转头。“传”是单人旁（传递），“砖”是石字旁（砖头）。", "hint": "车字旁"}, {"w": "干净", "t": "净", "opts": ["净", "静", "竟"], "ctx": "很快就把地板扫得干干□□", "why": "“净”是两点水，干净。“静”是安静。", "hint": "两点水"}, {"w": "不好意思", "t": "意", "opts": ["意", "义", "仪"], "ctx": "小明不好□思地说：“奶奶，对不起！”", "why": "妈妈的笔记：“意”＝想法、心里（意思、心意）；“义”＝道理（正义）；“仪”＝礼节（礼仪）。不好意思是心里觉得难为情。", "hint": "心里的想法 → 意"}, {"w": "歉意", "t": "歉", "opts": ["歉", "谦", "嫌"], "ctx": "小明满脸□意地接过扫把", "why": "“歉”右边是“欠”，道歉、歉意＝觉得对不起。“谦”是言字旁（谦虚），“嫌”是女字旁（嫌弃）。", "hint": "右边是“欠”"}, {"w": "弯腰", "t": "弯", "opts": ["弯", "湾", "蛮"], "ctx": "奶奶□着腰一点一点地扫", "why": "“弯”下面是“弓”，弯曲。“湾”是三点水（海湾），“蛮”是虫字底。", "hint": "弓字底"}, {"w": "簸箕", "t": "簸", "opts": ["簸", "播", "波"], "ctx": "把纸屑扫进□箕里", "why": "“簸”是竹字头，簸箕是竹子编的。“播”是提手旁（播种），“波”是三点水（波浪）。", "hint": "竹字头"}, {"w": "懂事", "t": "懂", "opts": ["懂", "董", "动"], "ctx": "小明真是个□事的好孩子", "why": "“懂”是竖心旁，心里明白。“董”是姓，“动”是动作。", "hint": "竖心旁"}], "audio": {"basic": {"src": "audio/craft-grandma_basic.mp3", "cues": [["craft-grandma|basic|start|0", 0.0], ["craft-grandma|basic|1|0", 17.71], ["craft-grandma|basic|2|0", 35.24], ["craft-grandma|basic|3|0", 53.04], ["craft-grandma|basic|4|0", 76.19], ["craft-grandma|basic|end|0", 95.33]]}, "adv": {"src": "audio/craft-grandma_adv.mp3", "cues": [["craft-grandma|adv|start|0", 0.0], ["craft-grandma|adv|1|0", 26.19], ["craft-grandma|adv|2|0", 51.32], ["craft-grandma|adv|3|0", 86.0], ["craft-grandma|adv|3|1", 106.99], ["craft-grandma|adv|4|0", 134.93], ["craft-grandma|adv|4|1", 163.2], ["craft-grandma|adv|end|0", 184.18]]}}}, {"id": "sister-scooter", "title": "偷骑姐姐的新踏板车", "cat": "falls", "grade": "P5", "pics": 6, "date": "2026-04-03", "source": "学校作文 · 学校", "imgs": ["img/S08_scooter_1.jpg", "img/S08_scooter_2.jpg", "img/S08_scooter_3.jpg", "img/S08_scooter_4.jpg", "img/S08_scooter_5.jpg", "img/S08_scooter_6.jpg"], "vocab": ["微风习习", "目不转睛", "三步并作两步", "喜笑颜开", "坏念头", "一声不响", "大惊失色", "火冒三丈", "语重心长", "改过自新"], "drafts": ["img/draft_4478.jpg", "img/draft_4479.jpg", "img/draft_4480.jpg", "img/draft_4481.jpg"], "versions": {"qx": {"label": "小作者版 · 学校老师批改", "score": "38/40", "words": "1000", "info": "内容 19 · 表达 19。老师评语：本文详略得当，语言优美，文字生动，充满了各种令人惊喜的小伏笔；比伏笔更令老师惊讶的，是你对人物心理和对话的掌控——不会出现戏剧性的大喊大叫和情绪失控，而是每个人物都刚刚好地符合他们年龄段和身份的性格特征。这来源于你一直以来对生活中人物细致的观察，真的很了不起！", "segments": [{"pic": "1", "note": "“大家快看！伏笔！这就是老师说的伏笔！”", "text": ["一个微风习习的星期六傍晚，夕阳把天空染成一片橙红色。小明正坐在客厅里津津有味地看电视。突然，[[他被电视里一个骑着最新款的电动踏板车的小男孩吸引住了，目不转睛地盯着屏幕，心想：要是我也能骑一次，那该多好啊！可惜妈妈不给我买。]]"]}, {"pic": "2", "text": ["“小明，爸爸妈妈要去加班啦，你不要顽皮哦！”爸爸的声音打断了小明的思绪。小明看~~看~~++了看++穿戴整齐的爸爸妈妈，点了点头，答应了一声。", "这时，姐姐推开了门，眉开眼笑地大声说：“我回来了！”小明扭头一看，[[发现姐姐正推着自己在电视里看到的踏板车。小明惊讶地张大了嘴巴，连忙三步并作两步地跑了过去。]]“哇！好酷的踏板车呀！我也想要！”他一边羡慕地看着踏板车，一边说道。“嘿嘿，小明，你这就不知道了吧！这是我舞蹈比赛得了第一名的奖品！是今年最新款的呢！”[[爸爸妈妈听到姐姐得了第一名，顿时喜笑颜开，连连夸赞她真厉害。姐姐骄傲得眼睛闪闪发亮。]]"]}, {"pic": "3", "text": ["当姐姐和爸爸妈妈挥手说再见时，小明还是看着踏板车。[[他越看越喜欢，心里充满了向往。]]突然，小明的脑子里闪过一个坏念头。如果我就偷偷地在楼下骑一会儿，然后再还回姐姐的房间，她应该不会发现吧。于是，++一看姐姐回房间做功课了，++他把踏板车推到自己的房间，等爸爸妈妈远去的脚步声消失。", "终于，小明偷偷~~的~~++地++把踏板车推出了家门，[[回头确保姐姐还在认认真真地做作业，然后一声不响地溜了出去。]]"]}, {"pic": "4", "text": ["姐姐作业做到一半时，才发现家里有多安静。她站起身，疑惑地走到客厅，看见电视还开着，可是++暂++停在一个图片上。是她刚赢到的新款的踏板车。她回头一看，[[大惊失色]]。她的踏板车不见了！然后，[[她想起小明那羡慕的眼神]]。呀！小明是不是到楼下骑我的踏板车啦！门也开着呢！姐姐着急地团团转，赶忙冲出家门，坐电梯下楼。"]}, {"pic": "5", "text": ["果然，++在楼下++姐姐看到了小明，和她心爱的踏板车。小明正在飞快地滑来滑去，脸上露出藏不住的高兴。“小明，你给我站住！”姐姐吼道。"]}, {"pic": "6", "note": "图六“？”：小作者写的结局——姐姐又担心又生气，小明道歉", "text": ["小明回过头，看见了姐姐火冒三丈的表情，赶忙停了下来。他的脸泛起了两片红云，低下了头。[[“你知道我有多担心吗？你如果想骑的话，我会答应的呀！”]]姐姐生气地说。“对不起，姐姐，我不应该不得到你的同意就出门，让你这么担心。希望你能原谅我。”姐姐语重++心++长地说：“下次学乖好了。”小明用力地点了点头。"]}, {"pic": "end", "text": ["俗话说：“经一事，长一智。”经过这件事，小明终于认清自己的顽皮和不听话给别人带来的困扰，决定从此改过自新。"]}]}}, "detective": [{"w": "偷偷地", "t": "地", "opts": ["地", "的", "得"], "ctx": "如果我就偷偷□在楼下骑一会儿，然后再还回姐姐的房间，她应该不会发现吧", "why": "“慢慢地走”“偷偷地看”——形容动作怎么样做，用“地”；“漂亮的花”说名词用“的”；“跑得快”在动作后面用“得”。小作者在这里写错过，要记：动作前面用“地”。", "hint": "动作前面 → 地"}, {"w": "款", "t": "款", "opts": ["款", "欵", "歀"], "ctx": "突然，他被电视里一个骑着最新□的电动踏板车的小男孩吸引住了，目不转睛地盯着屏幕，心想：要是我也能骑一次，那该多好啊", "why": "“新款”的“款”左边是“士＋示”，右边是“欠”。小作者把这个字写错过，注意左下是“示”。", "hint": "左下是示，右边是欠"}, {"w": "羡慕的眼神", "t": "羡", "opts": ["羡", "美", "涎"], "ctx": "然后，她想起小明那□慕的眼神", "why": "“羡慕”的“羡”上面是“羊”，下面是“次”的变形（像流口水）。“美”下面是“大”。", "hint": "羊＋次"}, {"w": "羡慕的眼神", "t": "慕", "opts": ["慕", "幕", "暮"], "ctx": "然后，她想起小明那羡□的眼神", "why": "“羡慕”的“慕”下面是“小”加一点（心的变形）。“幕”下面是“巾”，“暮”下面是“日”。", "hint": "下面是小＋点（心）"}, {"w": "大惊失色", "t": "惊", "opts": ["惊", "凉", "京"], "ctx": "她回头一看，大□失色", "why": "“惊讶”“吃惊”的“惊”是竖心旁，心里吓一跳。“凉”是两点水，“京”是北京。", "hint": "吓一跳是心情 → 竖心旁"}, {"w": "顿时", "t": "顿", "opts": ["顿", "吨", "钝"], "ctx": "”爸爸妈妈听到姐姐得了第一名，□时喜笑颜开，连连夸赞她真厉害", "why": "“顿时”的“顿”是左边“屯”右边“页”。“吨”是重量（口字旁），“钝”是不锋利（金字旁）。", "hint": "屯＋页"}, {"w": "担心", "t": "担", "opts": ["担", "但", "胆"], "ctx": "“你知道我有多□心吗", "why": "“担心”的“担”是提手旁，像把心事挑在肩上。“但”是但是，“胆”是胆量（月字旁）。", "hint": "提手旁＋旦"}, {"w": "奖品", "t": "奖", "opts": ["奖", "桨", "浆"], "ctx": "这是我舞蹈比赛得了第一名的□品", "why": "“奖品”“奖励”的“奖”下面是“大”。“桨”下面是“木”（船桨），“浆”下面是“水”（豆浆）。", "hint": "下面是大"}, {"w": "说道", "t": "道", "opts": ["道", "到", "倒"], "ctx": "”他一边羡慕地看着踏板车，一边说□", "why": "“知道”“道理”的“道”是走之旁加“首”。“到”是到达（右边是刂），小作者把“知道”写成“知到”过，要记住：知道一条路 → 走之旁。", "hint": "走之旁＋首"}, {"w": "间", "t": "间", "opts": ["间", "前", "向"], "ctx": "如果我就偷偷地在楼下骑一会儿，然后再还回姐姐的房□，她应该不会发现吧", "why": "“时间”“一瞬间”的“间”是门字框里一个“日”，像从门缝看见太阳。小作者写过“前”，要记得“时间”的“间”有门字框。", "hint": "门里一个日"}], "aiNote": "原题的六幅图没有拍到，这里是慧眼按文章内容补画的示意图（第六幅是“？”，要自己想结局），不是考试原图。", "audio": {"qx": {"src": "audio/sister-scooter_qx.mp3", "cues": [["sister-scooter|qx|1|0", 0.0], ["sister-scooter|qx|2|0", 30.91], ["sister-scooter|qx|2|1", 45.56], ["sister-scooter|qx|3|0", 92.36], ["sister-scooter|qx|3|1", 125.36], ["sister-scooter|qx|4|0", 136.7], ["sister-scooter|qx|5|0", 175.32], ["sister-scooter|qx|6|0", 190.6], ["sister-scooter|qx|end|0", 223.13]]}}}, {"id": "clown-mask", "title": "戴着小丑面具吓妹妹，却吓到陌生阿姨", "cat": "falls", "grade": "P5", "pics": 6, "date": "2026-07-28", "source": "蔡老师课件", "imgs": ["img/P01_clown_1.jpg", "img/P01_clown_2.jpg", "img/P01_clown_3.jpg", "img/P01_clown_4.jpg", "img/P01_clown_5.jpg", "img/P01_clown_6.jpg"], "vocab": ["商店", "小丑面具", "坏主意", "捉弄", "戴上", "躲", "陌生人", "撞倒"], "drafts": ["img/draft_4549.jpg", "img/draft_4550.jpg", "img/draft_4551.jpg", "img/draft_4553.jpg", "img/draft_4554.jpg"], "versions": {"adv": {"label": "范文 · 老师版", "words": "900", "info": "参考范文 · 240格稿纸三页/三页半 · 每个图写6-8分钟", "segments": [{"pic": "1", "note": "图一：妈妈带着儿子和女儿逛商场，经过两元店；母女的对话（一来一往）", "text": ["一个阳光明媚的星期六早上，妈妈带着我和妹妹一起去逛商场。商场里[[人头攒动，熙熙攘攘]]，每个角落都洋溢着欢声笑语。走着走着，我们经过了一家两元店，店里五颜六色的小物件吸引了妹妹的注意。她拉住妈妈的手，兴奋地央求道：“妈妈，我们进去看看吧！里面有很多好玩的小商品呢！”妈妈笑着点头说：“好吧，但只能看，不能乱买哦。”"]}, {"pic": "2", "note": "图二：妹妹看小碗小碟；我被万圣节面具吸引住了（动作描写）", "text": ["一进店门，妹妹便跑到一旁，盯着各种卡通图案的小碗小碟，兴奋地叽叽喳喳：“妈妈，这个好可爱！那个也好漂亮！”而我对这些“无聊”的东西一点兴趣也没有，目光在货架上随意扫过时，突然被一张万圣节小丑面具吸引了。那[[狰狞]]的笑容配上鲜艳的色彩让我灵机一动，一个吓唬妹妹／恶作剧的念头在脑海中冒了出来。"]}, {"pic": "3", "note": "图三：拿着面具，心里想搞恶作剧（心理活动）", "text": ["我悄悄拿起面具，偷偷戴在脸上，然后猫着腰，躲到了一个货柜后面。我心里想：等妹妹过来时，我一定要把她吓得哇哇大叫！想到这里，我忍不住偷笑，[[屏住呼吸]]，等待“良机”吓唬妹妹。"]}, {"pic": "4", "note": "图四：躲在货柜后面等待“良机”；脚步声靠近", "text": ["很快，脚步声传来，越来越近。我心里一阵[[窃喜]]，自言自语道：“来了来了，妹妹肯定会被我吓一大跳！”"]}, {"pic": "5", "note": "图五：猛地跳出来，吓到的却是陌生阿姨；花瓶应声倒地", "text": ["当脚步声靠近时，我猛地跳了出来，张开双臂，大喊一声：“哇——！”谁知，我眼前站着的并不是妹妹，而是一位陌生的阿姨！她惊叫一声，脸上的表情从震惊到慌乱，然后一个[[趔趄]]，不小心撞到了旁边的货柜。只听见“哗啦——”一声，货柜上的陶瓷花瓶应声倒地，碎片四处飞溅。店里顿时一片寂静，所有人都朝这边看过来。", "听到声响，妈妈和妹妹连忙赶过来。妹妹一眼就看到了戴着面具的我，大喊道：“是哥哥干的！”妈妈的目光随即／马上落在了我身上，皱起眉头，问道：“你在搞什么鬼？”"]}, {"pic": "6", "note": "图六：阿姨严肃教训；店员处理；妈妈道歉赔偿；妹妹幸灾乐祸", "text": ["我立刻摘下面具，满脸通红，[[嗫嚅]]着说不出话来。那位陌生阿姨抚着胸口，显然还没有从刚才的惊吓中缓过神来。她皱着眉头，看着地上的碎片，语气严肃地对我说：“小朋友，恶作剧不是坏事，但也要分场合，这样做很危险！你太过分了！真是没家教！”我听了她的话，脸上火辣辣的。", "没过多久，店员赶到了现场。他们看了看地上的碎片和满脸[[尴尬]]的我，随后和妈妈沟通如何赔偿损失。妈妈向工作人员连连道歉，并迅速赔付／赔偿了花瓶的费用。", "离开两元店时，妈妈黑着脸对我说：“这次的事情就当作一个教训，你要明白恶作剧的后果。被吓到的人可能受伤，或者造成更大的麻烦。”妹妹站在一旁，[[幸灾乐祸]]地补充道：“哥哥，你活该！”我低着头，一句话也不敢回。虽然觉得羞愧，但心里也明白，这确实是自己不懂分寸的错。"]}, {"pic": "end", "note": "错事的结尾：名句＋再也不敢做什么事情了＋原因", "text": ["俗话说：“前事不忘，后事之师”。从那以后，我再也不敢在不适合／恰当的场合搞恶作剧了，因为我深刻地体会到了恶作剧不当会带来的麻烦和后果。"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "40/40", "words": "1000", "info": "P5 满分作文。老师批注：“还想去前面的游戏厅打游戏呢”除非接下去要写和打游戏有关才可以提。正字：直（直接）／只（只是）", "segments": [{"pic": "1", "text": ["一个阳光明媚、鸟语花香的星期六早上，一缕缕阳光透过薄薄的云层洒向大地，落在皮肤上暖洋洋的，让人忍不住想眯着眼笑。", "那一天一大早，妈妈带着小明和妹妹一起去逛商场。商场里人山人海，热闹非凡，每一个角落都洋溢着欢声笑语。走着走着，他们经过了一个两元店，店里摆着各种各样、五彩缤纷的小物品。妹妹一看到，眼睛顿时一亮，[[像被吸铁石牢牢吸住一样，一眨也不眨]]。她兴奋地对妈妈说：“妈妈，我们可以去逛两元店吗？有好多有趣的商品呢！”不等妈妈回答，她就迫不及待地把妈妈拉进了两元店的碗碟区。"]}, {"pic": "2", "note": "“还想去游戏厅打游戏”除非后面要写，否则不要提", "text": ["小明见状，只好不情不愿地跟着一蹦一跳的妹妹进了店。他心想：这有什么好逛的？多么无聊的事儿啊！一些碗碟有什么好看的？", "当妹妹和妈妈在聚精会神地挑选印着可爱图案的盘子时，小明一边打哈欠，一边百无聊赖地东看看，西瞧瞧。突然，一整墙万圣节的小丑面具[[映入了他的眼帘]]。小明一眼就看中了最吓人的小丑面具，这个面具有着一张惨白的脸，鲜红的鼻子，一张十分夸张的大嘴笑得到耳边，让人看了不禁[[毛骨悚然]]。"]}, {"pic": "3", "text": ["小明摘下面具，仔细端详。他的眼珠子骨碌碌一转，嘴角微微上扬，一个坏主意悄悄地在脑海里浮现。他心想：妹妹每次来两元店都要逛上半天，害我无聊得要命，不如我戴上这个面具吓唬她一下，以后她就不敢来了！想到这里，他就忍不住偷偷地笑了起来。"]}, {"pic": "4", "text": ["说干就干，小明先探出头来，见妹妹正和妈妈朝着一排货架走去，便连忙[[蹑手蹑脚]]地躲在货架后面，生怕发出一点儿响声。他竖起耳朵，听着越来越近的脚步声，他紧张地在心里倒数“3，2，1……”然后他戴上面具，心想：一等妹妹过来，我就立刻跳出去，准能把她吓得[[花容失色]]！"]}, {"pic": "5", "note": "这里分段", "text": ["高高的货架挡住了小明的视线，他只看见一个影子越来越近，心里暗暗窃喜，机会来了！小明猛地从货架后面跳了出来，大叫了一声：“啊！！！”然后，他傻眼了。站在他面前的不是妹妹，而是一个陌生的阿姨。", "陌生阿姨毫无防备，脸色吓得惨白，往后一个趔趄，碰到了旁边的一个漂亮的花瓶，“砰”的一声，花瓶摔了个粉碎。伴随着阿姨“啊”的一声尖叫，吸引了店里所有人的目光。阿姨[[惊魂未定]]地看着戴着面具的小明，气得脸一阵白一阵红。她怒目圆睁、火冒三丈地责备道：“小朋友，你怎么可以这样恶作剧，害我打碎了花瓶，还让我差点吓出了心脏病！”小明尴尬地张了张嘴，可是他自知理亏，哑口无言。"]}, {"pic": "6", "text": ["听到巨大的响声和阿姨的责备，妈妈大步流星地赶了过来，看到眼前的一幕，顿时惊讶地张大了嘴，脸色沉了下来，严肃地说：“小明，你怎么能这么调皮，无缘无故地吓人，是很危险的！要是有人被花瓶的碎片割伤了，后果不堪设想！”小明惭愧地低下了头，脸红到了脖子根，小声地说：“对不起大家，我知道错了，我以后再也不会恶作剧了，阿姨，请您原谅我！”阿姨看到小明认错态度诚恳，心一软，点了点头，说：“知错能改还是好孩子，下次注意就好。”小明用力地点了点头，主动掏出了零花钱，赔偿了被打碎的花瓶。两元店的风波这才[[平息]]了。"]}, {"pic": "end", "text": ["俗话说：“经一事，长一智。”经过这一件事，小明吸取教训，暗暗发誓再也不会搞恶作剧了。"]}]}}, "detective": [{"w": "五彩缤纷", "t": "缤", "opts": ["缤", "滨", "宾"], "ctx": "走着走着，他们经过了一个两元店，店里摆着各种各样、五彩□纷的小物品", "why": "“五彩缤纷”的“缤”是绞丝旁，本来形容彩色的丝带飘来飘去。“滨”是海滨（三点水），“宾”是宾客。", "hint": "彩带 → 绞丝旁"}, {"w": "五彩缤纷", "t": "纷", "opts": ["纷", "芬", "粉"], "ctx": "走着走着，他们经过了一个两元店，店里摆着各种各样、五彩缤□的小物品", "why": "“缤纷”的“纷”是绞丝旁，很多很乱的样子。“芬”是芬芳（草字头），“粉”是米字旁。", "hint": "绞丝旁＋分"}, {"w": "惭愧", "t": "惭", "opts": ["惭", "渐", "斩"], "ctx": "”小明□愧地低下了头，脸红到了脖子根，小声地说：“对不起大家，我知道错了，我以后再也不会恶作剧了，阿姨，请您原谅我", "why": "“惭愧”两个字都是竖心旁，因为是心里的感觉。“渐”是渐渐（三点水），“斩”是砍。", "hint": "心里难为情 → 竖心旁"}, {"w": "惭愧", "t": "愧", "opts": ["愧", "魁", "槐"], "ctx": "”小明惭□地低下了头，脸红到了脖子根，小声地说：“对不起大家，我知道错了，我以后再也不会恶作剧了，阿姨，请您原谅我", "why": "“愧”是竖心旁加“鬼”，心里觉得对不起人。“魁”是魁梧（高大），“槐”是槐树。", "hint": "竖心旁＋鬼"}, {"w": "顿时", "t": "顿", "opts": ["顿", "吨", "钝"], "ctx": "妹妹一看到，眼睛□时一亮，像被吸铁石牢牢吸住一样，一眨也不眨", "why": "“顿时”的“顿”是左边“屯”右边“页”。“吨”是重量（口字旁），“钝”是不锋利（金字旁）。", "hint": "屯＋页"}, {"w": "傻眼", "t": "傻", "opts": ["傻", "俊", "傻"], "ctx": "”然后，他□眼了", "why": "“傻眼”“傻笑”的“傻”是单人旁，右边上面是“囟”加“八”，下面是“夂”。", "hint": "单人旁，右边像小人戴帽"}, {"w": "严肃", "t": "严", "opts": ["严", "岩", "炎"], "ctx": "她皱着眉头，看着地上的碎片，语气□肃地对我说：“小朋友，恶作剧不是坏事，但也要分场合，这样做很危险", "why": "“严肃”的“严”上面是“业”的变形，一横在上。“岩”是岩石，“炎”是炎热（两个火）。", "hint": "上面一横一竖，不是山"}, {"w": "严肃", "t": "肃", "opts": ["肃", "萧", "素"], "ctx": "她皱着眉头，看着地上的碎片，语气严□地对我说：“小朋友，恶作剧不是坏事，但也要分场合，这样做很危险", "why": "“严肃”的“肃”像一个人恭恭敬敬站着，笔画要写对：中间一竖到底，两边像八字。“萧”是草字头，“素”是朴素。", "hint": "中间一竖到底"}, {"w": "阳光明媚", "t": "媚", "opts": ["媚", "眉", "楣"], "ctx": "一个阳光明□、鸟语花香的星期六早上，一缕缕阳光透过薄薄的云层洒向大地，落在皮肤上暖洋洋的，让人忍不住想眯着眼笑", "why": "“阳光明媚”的“媚”是女字旁加“眉”。“眉”是眉毛，“楣”是门楣（木字旁）。", "hint": "女字旁＋眉"}, {"w": "迫不及待", "t": "及", "opts": ["及", "极", "急"], "ctx": "”不等妈妈回答，她就迫不□待地把妈妈拉进了两元店的碗碟区", "why": "“迫不及待”的“及”是来得及、赶上的意思，三笔：撇、横折折撇、捺。“极”是极了（木字旁），“急”是着急。", "hint": "只有三笔"}], "audio": {"adv": {"src": "audio/clown-mask_adv.mp3", "cues": [["clown-mask|adv|1|0", 0.0], ["clown-mask|adv|2|0", 39.69], ["clown-mask|adv|3|0", 74.49], ["clown-mask|adv|4|0", 93.91], ["clown-mask|adv|5|0", 104.96], ["clown-mask|adv|5|1", 137.72], ["clown-mask|adv|6|0", 155.96], ["clown-mask|adv|6|1", 186.77], ["clown-mask|adv|6|2", 204.87], ["clown-mask|adv|end|0", 233.74]]}, "qx": {"src": "audio/clown-mask_qx.mp3", "cues": [["clown-mask|qx|1|0", 0.0], ["clown-mask|qx|1|1", 16.29], ["clown-mask|qx|2|0", 61.66], ["clown-mask|qx|2|1", 76.37], ["clown-mask|qx|3|0", 110.15], ["clown-mask|qx|4|0", 136.59], ["clown-mask|qx|5|0", 167.47], ["clown-mask|qx|5|1", 189.86], ["clown-mask|qx|6|0", 228.07], ["clown-mask|qx|end|0", 282.52]]}}}, {"id": "stage-rescue", "title": "文静的我，在舞台上挺身而出", "cat": "guts", "grade": "P5", "pics": 0, "date": "2026-08-03", "source": "学校命题作文二 · 学校 · 2018年PSLE情境作文题", "imgs": [], "vocab": ["文静", "缺乏信心", "洪亮", "沸腾", "欢呼雀跃", "议论纷纷", "忐忑不安", "不堪设想", "戛然而止", "鸦雀无声", "窃窃私语", "挺身而出"], "drafts": ["img/draft_4959.jpg", "img/draft_4960.jpg", "img/draft_4961.jpg", "img/draft_4962.jpg"], "versions": {"qx": {"label": "小作者版 · 学校老师批改", "score": "40/40", "words": "700", "info": "题目（2018年PSLE考题）《我获得了意想不到的表扬》：你是个文静、害羞的人，一向对自己缺乏信心。有一天，你做了一件事，没想到却获得了表扬。这件事让你明白了一个道理。｜内容 20 · 表达 20。老师评语：非常了不起的一篇文章，你用生动、细腻的语言刻画了一个文静的小朋友在关键时刻挺身而出解决问题的故事。行文流畅，语句优美，人物生动鲜活符合逻辑，甚至有些地方的描写出乎意料的具体，比如“滋”地一声后音响就坏了等等。故事内容也非常引人入胜，结构严谨，段落分明，词汇丰富，是一篇非常优秀的文章。", "segments": [{"pic": "start", "note": "通过对比体现“我”的文静和内向；心理描写刻画人物性格；拟声词描述场景", "text": ["一直以来，大家对我的评价都是文静、害羞。我一向对自己缺乏信心，在班里老师问问题时，我从来都没有举手回答过。但同学们不知道，我的电脑技术很~~拿手~~++高超++。", "“++国庆日当天，就是++明天，我们会在礼堂里在全校师生面前表演我们最近学的舞蹈，大家今天回家要练习哦！”老师用[[洪亮]]的嗓音说道。教室里顿时[[沸腾]]起来，[[有的同学欢呼雀跃，有的同学激动地议论纷纷。只有我一个人静悄悄地坐在座位上。我的心怦怦直跳，手开始冒冷汗。我最不擅长在众人面前表演了，更别提在全校师生面前了。]]", "很快，那一天就到了。[[我紧张得忐忑不安，冷汗直流。我心想：万一我跳错了呢？如果我在全校面前出了丑，那后果不堪设想！]]就在这时，礼堂响起了主持老师的声音，打断了我的~~思想~~++思绪++。“五年级一班，全班舞蹈，请上台。”老师轻声给我们最后的鼓励和提醒，然后把我们引上了台。", "++欢快的++音乐响起，大家开始跳起那支我们练习多次++的舞蹈++。我虽然非常紧张，可是把舞蹈的第一部分顺利地跳完了。突然，[[“滋”的一声，音乐戛然而止，整个礼堂顿时鸦雀无声。]]我们疑惑地看向舞台的前面。老师正在飞快地按着电脑上的按钮，紧锁眉头，嘴里++还++小声地嘀咕着。观众开始++窃窃私语，++有点骚动了。++同学们你看看我，我看看你，个个不知所措。++[[我深呼吸了一口气，对自己说：“别紧张，你一定可以帮上忙的。”]]我慢慢地走到电脑前。顿时所有的目光都紧紧落在我身上，[[礼堂里安静得连一根针掉在地上都能听见。]]", "我默默地查看情况，发现原来音量被误设置为静音（老师不小心碰到了按钮）。我立刻调回去，那熟悉的旋律再次响起。全礼堂顿时欢呼起来，[[掌声在礼堂的四周回荡，仿佛每一个角落都在为我喝彩。]]老师长舒了一口气，轻轻拍了拍我的肩膀说：“多亏了你，我们才能继续表演！”大家纷纷向我投来赞许的目光，我心里感到暖洋洋的，忍不住露出害羞却真诚的微笑。"]}, {"pic": "end", "text": ["这件事让我明白，只要相信自己，就能把事情做好。从今以后，我要对自己更有信心，勇敢迎接每一个挑战。"]}]}}, "detective": [{"w": "思绪", "t": "绪", "opts": ["绪", "诸", "储"], "ctx": "就在这时，礼堂响起了主持老师的声音，打断了我的思□", "why": "“思绪”的“绪”是绞丝旁，思绪像一团丝线。小作者写过“思想”，老师改成“思绪”——想法像线一样理不清 → 绞丝旁。", "hint": "绞丝旁＋者"}, {"w": "顿时", "t": "顿", "opts": ["顿", "吨", "钝"], "ctx": "教室里□时沸腾起来，有的同学欢呼雀跃，有的同学激动地议论纷纷", "why": "“顿时”的“顿”是左边“屯”右边“页”。“吨”是重量（口字旁），“钝”是不锋利（金字旁）。", "hint": "屯＋页"}, {"w": "继续", "t": "续", "opts": ["续", "读", "绩"], "ctx": "老师长舒了一口气，轻轻拍了拍我的肩膀说：“多亏了你，我们才能继□表演", "why": "“继续”的“续”是绞丝旁，像把线接下去。“读”是言字旁，“绩”是成绩。", "hint": "接线 → 绞丝旁"}, {"w": "鸦雀无声", "t": "鸦", "opts": ["鸦", "鸭", "雅"], "ctx": "突然，“滋”的一声，音乐戛然而止，整个礼堂顿时□雀无声", "why": "“鸦雀无声”是乌鸦和麻雀都不叫了。“鸦”右边是“鸟”，左边“牙”表示读音。“鸭”是鸭子，“雅”是文雅。", "hint": "乌鸦是鸟 → 鸟字旁"}, {"w": "鸦雀无声", "t": "雀", "opts": ["雀", "鹊", "崔"], "ctx": "突然，“滋”的一声，音乐戛然而止，整个礼堂顿时鸦□无声", "why": "“雀”是小鸟，上面“小”下面“隹”（隹就是短尾巴的鸟）。“鹊”是喜鹊，“崔”是姓。", "hint": "小＋隹"}, {"w": "说道", "t": "道", "opts": ["道", "到", "倒"], "ctx": "”老师用洪亮的嗓音说□", "why": "“知道”“道理”的“道”是走之旁加“首”。“到”是到达（右边是刂），小作者把“知道”写成“知到”过，要记住：知道一条路 → 走之旁。", "hint": "走之旁＋首"}, {"w": "不堪设想", "t": "堪", "opts": ["堪", "湛", "勘"], "ctx": "如果我在全校面前出了丑，那后果不□设想", "why": "“不堪设想”的“堪”是土字旁，能够承受的意思。“湛”是三点水，“勘”是勘查（右边是力）。", "hint": "土字旁＋甚"}, {"w": "礼堂", "t": "礼", "opts": ["礼", "札", "扎"], "ctx": "“国庆日当天，就是明天，我们会在□堂里在全校师生面前表演我们最近学的舞蹈，大家今天回家要练习哦", "why": "“有礼貌”的“礼”是示字旁加“乚”。“札”是木字旁，“扎”是提手旁。", "hint": "示字旁（礼节）"}, {"w": "不知所措", "t": "措", "opts": ["措", "错", "借"], "ctx": "同学们你看看我，我看看你，个个不知所□", "why": "“不知所措”的“措”是提手旁，本来指安放、处理。“错”是错误（金字旁），“借”是借东西（单人旁）。", "hint": "提手旁＋昔"}, {"w": "纷", "t": "纷", "opts": ["纷", "芬", "粉"], "ctx": "教室里顿时沸腾起来，有的同学欢呼雀跃，有的同学激动地议论□纷", "why": "“缤纷”的“纷”是绞丝旁，很多很乱的样子。“芬”是芬芳（草字头），“粉”是米字旁。", "hint": "绞丝旁＋分"}], "audio": {"qx": {"src": "audio/stage-rescue_qx.mp3", "cues": [["stage-rescue|qx|start|0", 0.0], ["stage-rescue|qx|start|1", 17.58], ["stage-rescue|qx|start|2", 55.84], ["stage-rescue|qx|start|3", 87.57], ["stage-rescue|qx|start|4", 141.38], ["stage-rescue|qx|end|0", 180.32]]}}}, {"id": "scooter-park", "title": "公园散步目睹电动踏板车伤人事件", "cat": "guts", "grade": "P5", "pics": 6, "date": "2026-08-04", "source": "蔡老师课件", "imgs": ["img/P02_scooter_1.jpg", "img/P02_scooter_2.jpg", "img/P02_scooter_3.jpg", "img/P02_scooter_4.jpg", "img/P02_scooter_5.jpg", "img/P02_scooter_6.jpg"], "vocab": ["跑步", "电动滑板车", "差点儿", "及时躲开", "撞倒", "鲜血直流", "不知所措", "包扎伤口"], "drafts": ["img/draft_4609.jpg", "img/draft_4610.jpg", "img/draft_4611.jpg", "img/draft_4612.jpg", "img/draft_4613.jpg"], "versions": {"adv": {"label": "范文 · 老师版", "words": "1000", "info": "内容示范 · 看图作文长范文的意图：细节描写、积累词汇", "segments": [{"pic": "1", "note": "图一：公园的描写，天气描写，父子跑步的动作和对话", "text": ["一个很平常的星期六早晨，阳光透过窗帘的缝隙洒进房间／阳光透过树梢的缝隙洒向大地，微风轻轻拂过，让人感受到一丝夏日舒舒服服的清凉。看到天气这般晴好，我和爸爸决定到家附近的公园跑步，锻炼身体。", "我们换好运动服，穿上跑鞋，带上水瓶，就出发了。公园离家不远，步行不到十分钟就到了。公园里[[绿树成荫，花草芬芳]]，空气中弥漫着青草的清香。这里是个休闲的好地方，尤其是在周末，总是能看到很多人在这里锻炼或放松，有的在散步，有的在遛狗，还有的在打太极拳或跳广场舞，好一派[[生机勃勃]]的景象！", "一踏进公园，热身过后，我和爸爸便开始慢跑起来。我们边跑边聊天，谈论着彼此工作、学习以及生活中的琐事，完全沉浸在亲子[[乐融融]]的气氛当中。爸爸讲述了他年轻时跑步的趣事，我则分享了最近在学校的趣闻，我们相互开着玩笑，清脆响亮的笑声在公园的小路上空久久地回荡。"]}, {"pic": "2", "note": "图二：滑板车从中间穿过；动作描写、心理活动和表情", "text": ["突然，一个和我年纪相仿／个头比我大的男孩，骑着一辆电动滑板车从我们中间[[风驰电掣]]般穿过，差点撞到我们俩，把我和爸爸都吓了一跳，还好我们反应敏捷，及时躲开。但是他并没有意识到自己做错了，而是[[扬长而去]]，连说声对不起也没有。爸爸皱着眉头，[[义愤填膺]]地说道：“太不像话了！”我也附和道：“是的，都差点撞到我了。”我不悦地看着前方，试图找到那个骑电动滑板车的男孩。"]}, {"pic": "3", "note": "图三：撞倒母女", "text": ["只见那个男孩继续向前飞驰，似乎完全没有意识到自己的危险行为。他骑车的车速太快，来不及刹车，猛然撞到了前面正在散步的一对母女。小女孩没有及时躲开，被撞倒在地。"]}, {"pic": "4", "note": "图四：女孩大哭，母亲怒斥；动作语言", "text": ["只听见女孩一声尖叫，直接跌坐在地上，膝盖鲜血直流。女孩疼得哇哇大哭，母亲心疼地看着女儿，怒气冲冲地看向男孩，怒斥道：“你没长眼睛吗？在公园小路上怎么可以骑车这么快？你看看！都撞伤我的宝贝女儿了！你给我站住！[[肇事者]]别想逃逸！”男孩被眼前这一幕吓懵了，又被女孩的妈妈[[劈头盖脸]]地训了一通，呆呆地站在一旁不知所措。他自知理亏，没有说话，任由妇女的责骂。"]}, {"pic": "5", "note": "图五：我和爸爸冲上前包扎伤口", "text": ["我和爸爸在后面，目睹了这个全过程，我们马上以百米冲刺的速度连忙冲向前，掏出裤兜里随身携带的创可贴，给女孩包扎伤口。爸爸动作熟练，语气温和，再小心翼翼地处理着女孩的伤口。不一会儿，女孩的伤口被包扎好了。她站起来走了几步，并无大碍，脸上渐渐恢复了笑容，虽然还挂着泪痕。"]}, {"pic": "6", "note": "图六：怎么解决问题——道谢、原谅、道歉", "text": ["女孩和她的妈妈不停地向我爸道谢，对爸爸的帮助感激不已。因为女孩没有受重伤，女孩的妈妈大概是本着[[得饶人处且饶人]]的原则，这才消了气，原谅了那个男孩。男孩也一再道歉，显得十分愧悔，走过来向我爸爸道谢，也为刚才吓到我们而道歉，随后讪讪地离开了。"]}, {"pic": "end", "note": "结尾：主题升华", "text": ["这起突如其来的意外让原本平常的跑步变得有些不寻常。看着女孩逐渐恢复了笑容，我心里也松了一口气。但这次亲眼目睹的事件让我明白了一个道理：骑电动滑板车时，绝不能像那个冒冒失失的男孩一样，应该时刻注意安全。在公园这样人多的地方，更要放慢速度，确保不会伤害到别人。"]}]}, "qx": {"label": "小作者版 · 原稿转录", "words": "800", "info": "老师还没有批改，这是小作者手稿的原文转录（一字未改）。", "segments": [{"pic": "1", "text": ["一个很平常的星期六早晨，金灿灿的阳光透过窗帘洒进房间，空气中弥漫着雨后泥土的清香。难得天气如此凉爽宜人，爸爸提议和我到家附近的公园晨跑，正好运动运动。我毫不犹豫地答应了，满怀期待地换上运动服、拿上水壶，与爸爸一起出了门。", "公园离家不远，步行不到十分钟就到了。公园空气清新，绿树环绕，鸟儿在树上唱着欢快的歌曲，和树叶的“沙沙”声组成了一个美妙的交响乐。跑道上，人们有的挥汗如雨地跑步，有的在遛狗，还有一群孩子们在附近的游乐场玩得不亦乐乎。", "我深吸了一口新鲜的空气，开始和爸爸慢跑了起来。我们边跑边聊天，聊起公司和学校的趣事，我们不时发出一阵阵开怀大笑，把生活中遇到的烦恼都忘到了九霄云外。"]}, {"pic": "2", "text": ["突然，一阵急促的滚轮声划破了公园原本平静愉快的气氛。我和爸爸回头一看，只见一个和我年龄相仿的男生踏着电动滑板车，风驰电掣般地穿过我们俩中间，把我们俩吓得脸色苍白，我一个趔趄，差点摔倒了。爸爸赶忙担心地扶住我，关切地问道：“你没事吧？”我惊魂未定地点了点头，说：“太危险了！他怎么能在公园里这样横冲直撞呢？如果撞到人，后果不堪设想！”"]}, {"pic": "3", "text": ["话音刚落，意外发生了。只见那个男孩像离弦的箭一样往前冲，冲向正在前方散步的一对母女。她们手牵手，有说有笑，丝毫没有察觉危险正迅速逼近。等她们意识到不对劲时，一切都已经太迟了。"]}, {"pic": "4", "text": ["“砰！”随着一声巨大的撞击声，小女孩应声倒地，随后发出了“啊！”的一声尖叫，哇哇大哭了起来。只见她的小腿上被划破了一道深深的大口子，鲜血汩汩地冒了出来，小妹妹痛得泪水滚滚而下，像断了线的珍珠一样。", "一瞬间，大家都惊呆了。女孩的妈妈反应过来，急得捶胸跺脚，手足无措。她转头用愤怒的眼神看向闯祸的男生，破口大骂道：“你知不知道这样很危险？这里是公园，不是赛车场！如果撞到老人，或更小的孩子，后果你承担得起吗？以后绝对不能再这样乱来了！”"]}, {"pic": "5", "text": ["我和爸爸在后面目睹了全过程，吓得一身冷汗，连忙三步并作两步地冲上前，爸爸从裤兜里掏出了一块干净的手帕小心翼翼地为小妹妹的伤口止血。我蹲在她旁边，轻声地安慰道：“没事，不要害怕，伤口马上就包扎好了。”小女孩用泪汪汪的大眼睛看着我，慢慢止住了哭声。她的妈妈感激地连连道谢：“今天多亏了你们，我马上带她去医院缝合。”"]}, {"pic": "6", "text": ["闯祸的男孩站在旁边，吓得呆若木鸡，脸色发青，他终于鼓起勇气小气地说：“对不起大家。我不应该在人来人往的公园里飞快地骑我的电动踏板车，而不注意安全。阿姨，我会用我的压岁钱赔小妹妹的医药费的！”女孩的妈妈见他态度诚恳，心一软，原谅了他。男孩又转头向我和爸爸道歉，爸爸语重心长地说：“知错能改，还是好孩子！”男孩用力地点了点头。"]}, {"pic": "end", "text": ["俗话说：“经一事，长一智。”经过这次意外，我懂得了安全无小事，在公共场所不能只顾自己，要礼让他人，我们的社会才会更美好，更安全。"]}]}}, "detective": [{"w": "继续", "t": "续", "opts": ["续", "读", "绩"], "ctx": "只见那个男孩继□向前飞驰，似乎完全没有意识到自己的危险行为", "why": "“继续”的“续”是绞丝旁，像把线接下去。“读”是言字旁，“绩”是成绩。", "hint": "接线 → 绞丝旁"}, {"w": "沉浸", "t": "沉", "opts": ["沉", "沈", "忱"], "ctx": "我们边跑边聊天，谈论着彼此工作、学习以及生活中的琐事，完全□浸在亲子乐融融的气氛当中", "why": "“沉”是三点水，沉到水里去；“沉浸”就是整个人泡在里面。“沈”是姓氏，“忱”是热忱。", "hint": "三点水＋冘"}, {"w": "沉浸", "t": "浸", "opts": ["浸", "侵", "寝"], "ctx": "我们边跑边聊天，谈论着彼此工作、学习以及生活中的琐事，完全沉□在亲子乐融融的气氛当中", "why": "“浸”是三点水，泡在水里的意思，“沉浸在书里”就像泡在书里。“侵”是侵略（单人旁），“寝”是睡觉的寝室。", "hint": "泡在水里 → 三点水"}, {"w": "九霄云外", "t": "霄", "opts": ["霄", "宵", "消"], "ctx": "我们边跑边聊天，聊起公司和学校的趣事，我们不时发出一阵阵开怀大笑，把生活中遇到的烦恼都忘到了九□云外", "why": "“九霄云外”的“霄”是雨字头，指天空最高处。“宵”是夜晚（宵夜），“消”是消失（三点水）。", "hint": "天上 → 雨字头"}, {"w": "像离弦的箭一样", "t": "箭", "opts": ["箭", "剑", "前"], "ctx": "只见那个男孩像离弦的□一样往前冲，冲向正在前方散步的一对母女", "why": "“离弦的箭”的“箭”是竹字头，古代的箭用竹子做。“剑”是宝剑（右边立刀），“前”是前面。", "hint": "竹字头＋前"}, {"w": "毫不犹豫", "t": "毫", "opts": ["毫", "豪", "亳"], "ctx": "我□不犹豫地答应了，满怀期待地换上运动服、拿上水壶，与爸爸一起出了门", "why": "“毫不犹豫”的“毫”是细毛，下面是“毛”；一毫都没有＝一点也不。“豪”是豪杰、自豪，下面是“豕”（猪）。", "hint": "下面是毛"}, {"w": "毫不犹豫", "t": "豫", "opts": ["豫", "预", "誉"], "ctx": "我毫不犹□地答应了，满怀期待地换上运动服、拿上水壶，与爸爸一起出了门", "why": "“犹豫”的“豫”左边是“予”，右边是“象”。“预”是预习（页字旁），“誉”是荣誉。", "hint": "予＋象"}, {"w": "瞬间", "t": "瞬", "opts": ["瞬", "舜", "顺"], "ctx": "一□间，大家都惊呆了", "why": "“一瞬间”的“瞬”是目字旁，眨一下眼睛那么快。“舜”是古代的帝王，“顺”是顺利。", "hint": "眨眼 → 目字旁"}, {"w": "手足无措", "t": "措", "opts": ["措", "错", "借"], "ctx": "女孩的妈妈反应过来，急得捶胸跺脚，手足无□", "why": "“不知所措”的“措”是提手旁，本来指安放、处理。“错”是错误（金字旁），“借”是借东西（单人旁）。", "hint": "提手旁＋昔"}, {"w": "担心", "t": "担", "opts": ["担", "但", "胆"], "ctx": "爸爸赶忙□心地扶住我，关切地问道：“你没事吧", "why": "“担心”的“担”是提手旁，像把心事挑在肩上。“但”是但是，“胆”是胆量（月字旁）。", "hint": "提手旁＋旦"}], "audio": {"adv": {"src": "audio/scooter-park_adv.mp3", "cues": [["scooter-park|adv|1|0", 0.0], ["scooter-park|adv|1|1", 26.65], ["scooter-park|adv|1|2", 63.29], ["scooter-park|adv|2|0", 94.48], ["scooter-park|adv|3|0", 134.32], ["scooter-park|adv|4|0", 153.0], ["scooter-park|adv|5|0", 195.85], ["scooter-park|adv|6|0", 228.39], ["scooter-park|adv|end|0", 258.02]]}, "qx": {"src": "audio/scooter-park_qx.mp3", "cues": [["scooter-park|qx|1|0", 0.05], ["scooter-park|qx|1|1", 27.27], ["scooter-park|qx|1|2", 52.97], ["scooter-park|qx|2|0", 69.68], ["scooter-park|qx|3|0", 106.44], ["scooter-park|qx|4|0", 128.63], ["scooter-park|qx|4|1", 152.87], ["scooter-park|qx|5|0", 179.7], ["scooter-park|qx|6|0", 216.99], ["scooter-park|qx|end|0", 255.06]]}}}, {"id": "stolen-phone", "title": "偷拿同学的手机，勇于认错", "cat": "falls", "grade": "P5", "pics": 6, "date": "2026-08-11", "source": "蔡老师课件", "imgs": ["img/P03_phone_1.jpg", "img/P03_phone_2.jpg", "img/P03_phone_3.jpg", "img/P03_phone_4.jpg", "img/P03_phone_5.jpg", "img/P03_phone_6.jpg"], "vocab": ["手机", "失望", "兴高采烈", "紧张", "偷偷地", "不见", "认错", "惭愧"], "drafts": ["img/draft_4712.jpg", "img/draft_4713.jpg", "img/draft_4714.jpg", "img/draft_4715.jpg", "img/draft_4716.jpg", "img/draft_4717.jpg"], "versions": {"adv": {"label": "范文 · 老师版", "words": "1000", "info": "参考范文 · 主题：偷同学手机要勇于认错", "segments": [{"pic": "1", "note": "图一：语言描写——想要新手机，爸妈不同意", "text": ["一个很平常的星期三早上，要上学前，明华满怀期待地问：“爸爸、妈妈，你们可以给我买一个新手机让我带去学校吗？”爸爸皱了皱眉，拒绝了明华的请求。妈妈也不同意。她语重心长地说：“你现在应该是认真学习的年纪，不应该想带手机到学校炫耀的。等你上中学，再说吧。”明华虽然点了点头，心里却失望极了，只好[[闷闷不乐]]地去上学。"]}, {"pic": "2", "note": "图二：小安炫耀新手机；同学们的不同反应", "text": ["到了休息时间，明华的同学小安便迫不及待地从书包里掏出手机，高高举起来，眉飞色舞地说：“你们看！这是我爸爸刚买给我的新手机！”同学们一听，顿时来了精神。“哇！好漂亮啊！可以借我看看吗？”同学们一下子朝小安围了过来，大家[[七嘴八舌]]地议论着。小安被围在中间，脸上露出得意洋洋的笑容，别提有多神气了。", "站在人群里的明华也目不转睛地盯着小安看。他心想：要是我也有一部这样的手机，那该多好啊！"]}, {"pic": "3", "note": "图三：课室空无一人；心理挣扎；拿走手机", "text": ["上课铃响了，大家急忙回到座位。小安随手把手机放进抽屉里，就匆匆离开课室去上体育课了。", "过了一会儿，明华因为忘了拿水壶，独自返回课室。当他经过小安的座位时，一眼就看见了抽屉里的手机。", "明华顿时停下脚步。他环顾四周，课室里空无一人。他的心“怦怦”直跳，一个念头突然从脑海里冒了出来：反正现在没有人看见……如果我把手机拿走，应该没有人知道吧？想到这里，他的手慢慢伸向手机，可刚碰到手机，又[[像触电似的缩了回来]]。“不行！这是小安的东西！”明华在心里告诉自己。可是，那部崭新的手机仿佛有一股魔力，不断吸引着他。经过一番犹豫之后，他最终还是抵挡不住诱惑，一把拿起手机，迅速塞进自己的书包里。"]}, {"pic": "4", "note": "图四：小安发现手机不见了；明华心里不是滋味", "text": ["上完体育课，放学前，小安突然发现手机不见了。“我的手机呢？怎么会不见呢？”小安自言自语道。他脸色大变，急忙把书包里的东西全倒了出来，又弯下腰，在桌子底下东找西找。“刚才不是还在这里吗？”几个同学关切地问，也赶来帮忙。大家翻遍了抽屉和书包夹层，却始终一无所获。小安急得像热锅上的蚂蚁，双手抱着头，喃喃自语：“才一眨眼的时间，我的手机怎么会不见了呢？难道手机长了翅膀飞走了吗？”", "坐在一旁的明华看着这一幕，心里越来越[[不是滋味]]。他低着头，双手紧紧地抓着衣角，根本不敢抬头看小安。他心想：如果小安回家被爸爸妈妈责骂怎么办？如果老师发现是我拿的，同学们以后会怎么看我？想到这里，他的脸一下子红到了耳根，心里仿佛压着一块大石头，沉甸甸的。刚才拿到手机时的兴奋早已[[烟消云散]]，取而代之的是深深的后悔。"]}, {"pic": "5", "note": "图五：放学后鼓起勇气向老师承认错误", "text": ["放学后，明华背着书包，拖着沉重的脚步，慢吞吞地走出课室。走到校门口时，他看见老师正在值勤。于是，他停下脚步，几次想转身离开，可最终还是鼓起勇气走了过去。“老师……”明华低着头，声音小得像蚊子一样。老师弯下腰，关心地问：“明华，怎么了？”明华咬了咬嘴唇，终于从书包里拿出那部手机，惭愧地说：“老师，对不起……小安的手机是我拿的。我看到他的手机很漂亮，一时贪心，就偷偷拿走了。我知道错了。”老师听后，没有立刻责骂他，而是严肃地说：“做错事能够主动承认错误，需要勇气。但是，别人的东西再喜欢，也不能[[占为己有]]。你应该把手机还给小安，并向他道歉。”明华用力地点了点头。"]}, {"pic": "6", "note": "图六：归还手机，道歉", "text": ["后来，明华亲手把手机还给小安，并诚恳地向他道歉。小安也意识到自己的错误，不应该违反学校规定，把手机带到学校炫耀。"]}, {"pic": "end", "text": ["经过这件事之后，明华明白了一个道理：做人应该诚实，不能因为一时的贪念而拿走不属于自己的东西。犯错并不可怕，重要的是要勇于承认错误，并及时改正。"]}]}, "qx": {"label": "小作者版 · 原稿转录", "words": "900", "info": "老师还没有批改，这是小作者手稿的原文转录。手稿旁有一处自己的补写：“抓起手机，以迅雷不及掩耳之速放到自己的包里”。", "segments": [{"pic": "1", "text": ["一个微风轻拂、阳光明媚的星期一早晨，太阳金灿灿的光透过薄薄的云层洒向大地。吃早餐时，小明无意间瞥见爸爸的手机屏幕上出现了一则广告。广告中，一部最新款的手机格外引人注目，不但外形新颖，还有许多有趣又方便的功能。小明顿时眼前一亮，目不转睛地盯着屏幕，心想：“哇！要是我也有一部这样的手机，那该多好啊！”想到这里，小明按捺不住心中的期待，连忙问道：“爸爸，妈妈，可以给我买一部这样的手机吗？”他指向爸爸手机里的广告。爸爸妈妈听了，对视了一眼。爸爸摇了摇头，语重心长地说：“你现在还是学生，应该把心思放在学习上。你有了手机，反而容易分心。”妈妈也点了点头，补充道：“等你长大些，懂得合理使用手机了，我们再考虑吧。”小明失望地低下了头，只好闷闷不乐地背起书包上学去了。"]}, {"pic": "2", "text": ["到了学校，小明刚走进教室，放下书包，就听见不远处传来一阵兴奋的叫声。“你们快来看！这是我爸爸昨天买给我的新手机！”原来是小安，他正在得意洋洋地炫耀他的手机。小明也好奇地跟别的同学们围了上去。“好漂亮啊！”“这是最新款的吗？”同学们纷纷赞叹起来，用羡慕的目光看着手机。小明定睛一看，心想：咦？这不是今天早上自己在爸爸手机上的广告里看到的那部手机吗？他心里羡慕极了，不禁想：小安真幸福！要是爸爸妈妈也肯买一部给我，那该多好啊！"]}, {"pic": "3", "text": ["体育课的时间到了，同学们兴高采烈地来到操场上课。正当大家准备活动时，小明突然发现自己忘了带水壶，于是连忙独自跑回教室拿水壶。小明气喘吁吁地回到教室。此时，教室里空荡荡的，一个人影也没有。他拿起水壶，正准备转身离开时，眼角忽然瞥见小安桌上放着一样东西。小明心猛地跳了一下——竟然是小安的新手机！原来，小安刚才急着去上体育课，竟忘了把手机收回包里。小明不由自主地停下脚步，目不转睛地盯着那部手机。突然，一个坏念头从他的脑海中闪过。反正现在这里没人，要不，我把它拿走？没人会知道……又一个声音在小明的脑袋里响起：不行！这是小安的东西！可是，那个手机仿佛有一股魔力，不断吸引着他。小明慢慢地伸出手，快速地抓到自己的包里。做完这一切，小明不敢再多停留，抓起水壶，匆匆忙忙地跑出了教室。"]}, {"pic": "4", "text": ["体育课结束后，同学们有说有笑地回到了教室。小安回到座位，就立刻发现手机不见了！他连忙翻遍了书包，又弯下腰查看桌子底下，可是连手机的影子也没看到。他急得像热锅上的蚂蚁，眼眶渐渐红了起来。同学们见状，也纷纷上前帮忙。可是，大家找了好一会儿，手机还是毫无踪影。小明坐在自己的座位上，看着眼前发生的一切，心里像十五个吊桶打水——七上八下，心想：怎么办？要是大家发现手机是我拿的，他们以后一定不会再相信我了！小明抬起头，看见小安急得眼泪在眼眶里打转时，一股强烈的惭愧涌上心头，越想越后悔。"]}, {"pic": "5", "text": ["小明终于鼓起勇气，慢慢地站了起来。他低着头走到老师面前，吞吞吐吐地说：“老师……我有一件事要告诉您。小安的手机……是我拿的。”老师听了，脸上的表情顿时黑了下来。她严肃地批评道：“小明，不属于自己的东西，无论多么喜欢，都绝对不能偷偷拿走。你知道自己的行为会让别人多么着急吗？”"]}, {"pic": "6", "text": ["小明惭愧地低下了头，小声说道：“老师，对不起，我知道错了。我不应该因为自己太喜欢这部手机，就一时贪心把它拿走。我以后再也不会这样做了。”接着，他走回他的桌子，从书包里拿出了手机，双手把它递还给小安，诚恳地说道：“小安，对不起，请你原谅我。”小安接过手机，终于松了一口气。老师看小明愿意主动承认错误，语重心长地说：“知错能改，还是好孩子。”小明用力地点了点头。"]}, {"pic": "end", "text": ["俗话说：“经一事，长一智。”经过这次意外，小明明白了做人一定要诚实，即使犯了错，也要勇敢承认并及时改正。"]}]}}, "detective": [{"w": "热锅上的蚂蚁", "t": "锅", "opts": ["锅", "涡", "祸"], "ctx": "他急得像热□上的蚂蚁，眼眶渐渐红了起来", "why": "“锅”是金字旁，锅是金属做的。“涡”是旋涡（三点水），“祸”是灾祸（示字旁）。", "hint": "金属做的 → 金字旁"}, {"w": "惭愧", "t": "惭", "opts": ["惭", "渐", "斩"], "ctx": "小明抬起头，看见小安急得眼泪在眼眶里打转时，一股强烈的□愧涌上心头，越想越后悔", "why": "“惭愧”两个字都是竖心旁，因为是心里的感觉。“渐”是渐渐（三点水），“斩”是砍。", "hint": "心里难为情 → 竖心旁"}, {"w": "惭愧", "t": "愧", "opts": ["愧", "魁", "槐"], "ctx": "小明抬起头，看见小安急得眼泪在眼眶里打转时，一股强烈的惭□涌上心头，越想越后悔", "why": "“愧”是竖心旁加“鬼”，心里觉得对不起人。“魁”是魁梧（高大），“槐”是槐树。", "hint": "竖心旁＋鬼"}, {"w": "顿时", "t": "顿", "opts": ["顿", "吨", "钝"], "ctx": "小明□时眼前一亮，目不转睛地盯着屏幕，心想：“哇", "why": "“顿时”的“顿”是左边“屯”右边“页”。“吨”是重量（口字旁），“钝”是不锋利（金字旁）。", "hint": "屯＋页"}, {"w": "兴高采烈", "t": "采", "opts": ["采", "彩", "睬"], "ctx": "体育课的时间到了，同学们兴高□烈地来到操场上课", "why": "“兴高采烈”的“采”上面是爪，下面是木，像用手摘果子，意思是精神、神采。“彩”是颜色（多三撇）。小作者写过“彩”，要记：兴高采烈没有三撇！", "hint": "没有三撇"}, {"w": "炫耀", "t": "炫", "opts": ["炫", "眩", "弦"], "ctx": "”原来是小安，他正在得意洋洋地□耀他的手机", "why": "“炫耀”的“炫”是火字旁，像火光闪闪给人看。“眩”是头晕眼花（目字旁），“弦”是琴弦。", "hint": "火光闪闪 → 火字旁"}, {"w": "炫耀", "t": "耀", "opts": ["耀", "跃", "曜"], "ctx": "”原来是小安，他正在得意洋洋地炫□他的手机", "why": "“炫耀”的“耀”左边是“光”，右边是“翟”。“跃”是跳跃（足字旁），“曜”是日字旁。", "hint": "光字旁"}, {"w": "严肃", "t": "严", "opts": ["严", "岩", "炎"], "ctx": "她□肃地批评道：“小明，不属于自己的东西，无论多么喜欢，都绝对不能偷偷拿走", "why": "“严肃”的“严”上面是“业”的变形，一横在上。“岩”是岩石，“炎”是炎热（两个火）。", "hint": "上面一横一竖，不是山"}, {"w": "严肃", "t": "肃", "opts": ["肃", "萧", "素"], "ctx": "她严□地批评道：“小明，不属于自己的东西，无论多么喜欢，都绝对不能偷偷拿走", "why": "“严肃”的“肃”像一个人恭恭敬敬站着，笔画要写对：中间一竖到底，两边像八字。“萧”是草字头，“素”是朴素。", "hint": "中间一竖到底"}, {"w": "阳光明媚", "t": "媚", "opts": ["媚", "眉", "楣"], "ctx": "一个微风轻拂、阳光明□的星期一早晨，太阳金灿灿的光透过薄薄的云层洒向大地", "why": "“阳光明媚”的“媚”是女字旁加“眉”。“眉”是眉毛，“楣”是门楣（木字旁）。", "hint": "女字旁＋眉"}], "audio": {"adv": {"src": "audio/stolen-phone_adv.mp3", "cues": [["stolen-phone|adv|1|0", 0.05], ["stolen-phone|adv|2|0", 33.69], ["stolen-phone|adv|2|1", 64.4], ["stolen-phone|adv|3|0", 74.25], ["stolen-phone|adv|3|1", 83.14], ["stolen-phone|adv|3|2", 92.93], ["stolen-phone|adv|4|0", 133.34], ["stolen-phone|adv|4|1", 177.71], ["stolen-phone|adv|5|0", 214.2], ["stolen-phone|adv|6|0", 277.66], ["stolen-phone|adv|end|0", 295.48]]}, "qx": {"src": "audio/stolen-phone_qx.mp3", "cues": [["stolen-phone|qx|1|0", 0.0], ["stolen-phone|qx|2|0", 81.29], ["stolen-phone|qx|3|0", 131.17], ["stolen-phone|qx|4|0", 210.94], ["stolen-phone|qx|5|0", 265.8], ["stolen-phone|qx|6|0", 298.56], ["stolen-phone|qx|end|0", 341.27]]}}}, {"id": "peek-diary", "title": "偷看同学的日记本", "cat": "falls", "grade": "P5", "pics": 6, "date": "2026-08-18", "source": "蔡老师课件", "imgs": ["img/P04_diary_1.jpg", "img/P04_diary_2.jpg", "img/P04_diary_3.jpg", "img/P04_diary_4.jpg", "img/P04_diary_5.jpg", "img/P04_diary_6.jpg"], "vocab": ["休息时间", "值日", "日记", "好奇", "翻看", "隐私", "生气", "道歉"], "drafts": ["img/draft_4935.jpg", "img/draft_4936.jpg", "img/draft_4937.jpg", "img/draft_4938.jpg"], "versions": {"adv": {"label": "范文 · 老师版", "words": "800", "info": "参考范文 · 优点：比喻句、回忆式开头法、道理性结尾、成语和名句、语言动作心理神态描写", "segments": [{"pic": "1", "note": "图一：回忆式开头；轮到小文值日（比喻句）", "text": ["说来已经是上个星期的事情了。", "上个星期三的休息时间，那一天轮到小文做值日，英文课刚结束，同学们一个个像[[脱缰的野马]]跑去食堂吃饭时，小文则一个人留在课室里打扫卫生。"]}, {"pic": "2", "note": "图二：发现日记本；好奇心的驱使", "text": ["正当小文打扫到小丽的课桌时，他发现小丽的课桌上有个本子。小文定睛一看，原来是一本日记本。看样子，应该是小丽写完日记忘记放进书包了。", "“小丽会在里面写些什么呢？”小文自言自语道。在好奇心的驱使下，小文忍不住偷偷地拿起小丽的日记本，翻看了起来。"]}, {"pic": "3", "note": "图三：叫小丁一起看“好东西”", "text": ["不一会儿，小文的好朋友小丁也吃完饭回课室了。小文向小丁神秘地招了招手说：“小丁，快过来，给你看个‘好东西’，快来！快来！”", "于是，小丁就三步并作两步地朝／向小文的方向走去。原来，小文说的“好东西”是指小丽的日记。他们真是“[[有福同享]]”的好朋友啊，连小丽的私人日记本都可以一起看。"]}, {"pic": "4", "note": "图四：小丽回来，发现日记不翼而飞", "text": ["小丽吃完饭走进课室，发现自己桌上的日记本[[不翼而飞]]了。她环顾四周，发现小文和小丁手里拿着的正是她的日记本。而小文和小丁居然一人一只手，拿着摊开的日记本，津津有味地翻看。"]}, {"pic": "5", "note": "图五：怎么描写同学生气；两人把她的话当耳边风", "text": ["小丽看到眼前的情景，真是被气坏了。她涨红了脸，皱着眉头，双手叉腰，[[说话像一挺机关枪似的]]，劈头盖脸地把小文和小丁狠狠地痛骂了一顿。不过，小文和小丁却完全无视小丽的愤怒，把她的话当成耳边风，两人又继续翻看日记，指着日记里面的秘密哈哈大笑起来。"]}, {"pic": "6", "note": "图六：华文老师进来，火冒三丈；两人道歉", "text": ["正在这时，华文老师走进了课室，看到眼前这一幕，马上明白了一切。她气得火冒三丈，狠狠地把小文和小丁痛骂了一顿：“你们不知道翻看别人的日记本是[[侵犯他人隐私]]的事吗？怎么可以这样光明正大地偷看别人的日记呢？”", "小文和小丁听到这里，知道他们做错了。他们鼓起勇气，低着头，用蚊子般的声音向老师和小丽道歉。", "“一时犯了错误，没有关系。重要的是认识到错误，把错误改正了，还是个好学生。”华文老师语重心长地说。她的话语好像有一股神奇的力量在鼓励着学生，让小文和小丁深深地意识到自己做错了事。"]}, {"pic": "end", "note": "道理性的结尾", "text": ["俗话说：“前事不忘，后事之师。”经过这件事，小文和小丁明白一个道理：没有征得对方的同意，是不可以[[擅自]]翻看别人的日记本的。因为日记是很隐私的一种东西。"]}]}, "qx": {"label": "小作者版 · 原稿转录", "words": "700", "info": "老师还没有批改，这是小作者手稿的原文转录。", "segments": [{"pic": "1", "text": ["一个阳光明媚的星期一上午，蔚蓝的天空中飘着几朵洁白的云朵，金灿灿的阳光透过窗户洒进教室，又是一个令人心情愉快的好天气。", "“铃——”下课铃声响了，同学们迫不及待地冲出教室，有的同学跑到操场上兴高采烈地打篮球，有的三五成群地聚在一起聊天，还有的同学早已饿得肚子咕咕叫，迫不及待地朝食堂跑去。不一会儿，原本热闹非凡的教室便变得静悄悄的。今天正好轮到小明值日。虽然他也很想和同学们一起去休息，但想到自己的责任，他还是拿起扫把，认真地清扫着地上的垃圾和灰尘。"]}, {"pic": "2", "text": ["正当小明打扫到小花的座位旁时，他忽然发现桌上放着一本日记本。原来，小花去休息时走得太匆忙，忘了把日记本收到书包里。小明顿时停下了手中的扫把，好奇地盯着日记本，心想：“里面会写些什么呢？我可不可以就偷偷看一眼？”他犹豫了片刻，最终还是抵挡不住好奇心，慢慢地伸出手拿起了日记本。", "小明翻开那本封面上画着小花头像的日记本，津津有味地看了起来。他越看越入迷，看到有趣的地方时，他更是忍不住笑得合不拢嘴，早已把值日的事抛到了九霄云外。"]}, {"pic": "3", "text": ["不知不觉，休息时间快结束了，小安回到教室。小明一看见他，便神秘兮兮地对他招手说：“小安快过来！你看小花的日记，太好笑了！”小安愣了一下，连忙说：“偷看别人的日记不太好吧？”可是，看着小明笑得前仰后合，他也忍不住想知道日记里到底写了些什么。最终，他还是抵挡不住诱惑，凑到小明身旁，两人一起偷偷地看了起来，不时发出阵阵笑声。"]}, {"pic": "4", "text": ["就在两人看得起劲时，小花心满意足地走进教室，嘴里还念叨着：“今天吃得真饱！”可下一秒，她脸上的笑容顿时消失了。"]}, {"pic": "5", "text": ["“你们怎么偷看我的日记！你们怎么可以随便偷看别人的隐私！”小花快步冲过去，一把夺回日记本。"]}, {"pic": "6", "text": ["就在小花气呼呼地责骂他们时，老师走进了教室。她看了看气得满脸通红的小花，又看了看站在一旁不知所措的小明和小安，疑惑地问：“发生什么事了？”小花把事情的来龙去脉一五一十地告诉了老师。老师听后，神情严肃地对小明和小安说：“日记里记录的是别人的心事和秘密，没有经过别人的允许，你们怎么能随便偷看呢？”", "听了老师的话，小明和小安惭愧地低下了头，这才意识到自己做错了。“对不起，我们以后再也不会随便翻看别人的东西了。”他们诚恳地向小花道歉。小花的气终于消了，点了点头。"]}, {"pic": "end", "text": ["俗话说：“经一事，长一智。”经过这件事，小明和小安明白了要尊重别人的隐私，再也不会随便偷看别人的东西了。"]}]}}, "detective": [{"w": "继续", "t": "续", "opts": ["续", "读", "绩"], "ctx": "不过，小文和小丁却完全无视小丽的愤怒，把她的话当成耳边风，两人又继□翻看日记，指着日记里面的秘密哈哈大笑起来", "why": "“继续”的“续”是绞丝旁，像把线接下去。“读”是言字旁，“绩”是成绩。", "hint": "接线 → 绞丝旁"}, {"w": "九霄云外", "t": "霄", "opts": ["霄", "宵", "消"], "ctx": "他越看越入迷，看到有趣的地方时，他更是忍不住笑得合不拢嘴，早已把值日的事抛到了九□云外", "why": "“九霄云外”的“霄”是雨字头，指天空最高处。“宵”是夜晚（宵夜），“消”是消失（三点水）。", "hint": "天上 → 雨字头"}, {"w": "惭愧", "t": "惭", "opts": ["惭", "渐", "斩"], "ctx": "听了老师的话，小明和小安□愧地低下了头，这才意识到自己做错了", "why": "“惭愧”两个字都是竖心旁，因为是心里的感觉。“渐”是渐渐（三点水），“斩”是砍。", "hint": "心里难为情 → 竖心旁"}, {"w": "惭愧", "t": "愧", "opts": ["愧", "魁", "槐"], "ctx": "听了老师的话，小明和小安惭□地低下了头，这才意识到自己做错了", "why": "“愧”是竖心旁加“鬼”，心里觉得对不起人。“魁”是魁梧（高大），“槐”是槐树。", "hint": "竖心旁＋鬼"}, {"w": "顿时", "t": "顿", "opts": ["顿", "吨", "钝"], "ctx": "小明□时停下了手中的扫把，好奇地盯着日记本，心想：“里面会写些什么呢", "why": "“顿时”的“顿”是左边“屯”右边“页”。“吨”是重量（口字旁），“钝”是不锋利（金字旁）。", "hint": "屯＋页"}, {"w": "严肃", "t": "严", "opts": ["严", "岩", "炎"], "ctx": "老师听后，神情□肃地对小明和小安说：“日记里记录的是别人的心事和秘密，没有经过别人的允许，你们怎么能随便偷看呢", "why": "“严肃”的“严”上面是“业”的变形，一横在上。“岩”是岩石，“炎”是炎热（两个火）。", "hint": "上面一横一竖，不是山"}, {"w": "严肃", "t": "肃", "opts": ["肃", "萧", "素"], "ctx": "老师听后，神情严□地对小明和小安说：“日记里记录的是别人的心事和秘密，没有经过别人的允许，你们怎么能随便偷看呢", "why": "“严肃”的“肃”像一个人恭恭敬敬站着，笔画要写对：中间一竖到底，两边像八字。“萧”是草字头，“素”是朴素。", "hint": "中间一竖到底"}, {"w": "笑得合不拢嘴", "t": "拢", "opts": ["拢", "笼", "垄"], "ctx": "他越看越入迷，看到有趣的地方时，他更是忍不住笑得合不□嘴，早已把值日的事抛到了九霄云外", "why": "“合不拢嘴”的“拢”是提手旁，合起来。“笼”是笼子（竹字头），“垄”是田垄。", "hint": "用手合上 → 提手旁"}, {"w": "阳光明媚", "t": "媚", "opts": ["媚", "眉", "楣"], "ctx": "一个阳光明□的星期一上午，蔚蓝的天空中飘着几朵洁白的云朵，金灿灿的阳光透过窗户洒进教室，又是一个令人心情愉快的好天气", "why": "“阳光明媚”的“媚”是女字旁加“眉”。“眉”是眉毛，“楣”是门楣（木字旁）。", "hint": "女字旁＋眉"}, {"w": "低着头", "t": "低", "opts": ["低", "底", "抵"], "ctx": "他们鼓起勇气，□着头，用蚊子般的声音向老师和小丽道歉", "why": "“低头”的“低”是单人旁，人把头低下。“底”是广字头（鞋底、底下）。小作者把“低下头”写成“底下头”过！", "hint": "人低头 → 单人旁"}], "audio": {"adv": {"src": "audio/peek-diary_adv.mp3", "cues": [["peek-diary|adv|1|0", 0.0], ["peek-diary|adv|1|1", 2.66], ["peek-diary|adv|2|0", 16.16], ["peek-diary|adv|2|1", 29.83], ["peek-diary|adv|3|0", 40.6], ["peek-diary|adv|3|1", 51.99], ["peek-diary|adv|4|0", 68.27], ["peek-diary|adv|5|0", 85.52], ["peek-diary|adv|6|0", 109.86], ["peek-diary|adv|6|1", 128.26], ["peek-diary|adv|6|2", 139.7], ["peek-diary|adv|end|0", 161.39]]}, "qx": {"src": "audio/peek-diary_qx.mp3", "cues": [["peek-diary|qx|1|0", 0.05], ["peek-diary|qx|1|1", 13.16], ["peek-diary|qx|2|0", 48.85], ["peek-diary|qx|2|1", 78.99], ["peek-diary|qx|3|0", 94.32], ["peek-diary|qx|4|0", 128.16], ["peek-diary|qx|5|0", 140.24], ["peek-diary|qx|6|0", 150.35], ["peek-diary|qx|6|1", 186.14], ["peek-diary|qx|end|0", 205.27]]}}}, {"id": "recycling-day", "title": "社区环保日，母子变废为宝", "cat": "bonds", "grade": "P5", "pics": 6, "date": "2026-08-25", "source": "蔡老师课件", "imgs": ["img/P05_green_1.jpg", "img/P05_green_2.jpg", "img/P05_green_3.jpg", "img/P05_green_4.jpg", "img/P05_green_5.jpg", "img/P05_green_6.jpg"], "vocab": ["举办", "环保活动", "旧衣服", "折好", "整理", "瓶子", "回收物品", "夸赞"], "drafts": ["img/draft_6281.jpg", "img/draft_6282.jpg"], "versions": {"adv": {"label": "范文 · 老师版", "words": "900", "info": "参考范文 · 第六图是“？”，要自己想结局 · 做好事的结尾：以后要做得更好", "segments": [{"pic": "1", "note": "图一：妈妈拿着海报说“今天是社区环保日”；母子对话", "text": ["一个很平常的星期六早上，阳光透过窗户洒进客厅，到处[[金亮亮，明晃晃]]的。我正准备打开电视看节目，妈妈忽然[[兴冲冲]]地走过来，手里拿着一张海报，对我说：“明华，你快来看！今天是社区环保日。社区要举办环保活动，鼓励居民把家里的旧衣服、塑料瓶和其他可以回收的物品送到回收站。”", "我凑过去一看，海报上写着“社区环保日”和可回收的物品清单。想到老师平时常常告诉我们要保护环境，减少资源浪费，我顿时来了精神，连忙说：“妈妈，我们也参加吧！家里不是有很多可回收的东西吗？”妈妈听了，一脸[[宠溺]]地摸了摸我的头，微笑着点点头：“好啊！你有环保意识，妈妈很欣慰。与其把它们丢掉，不如让它们[[变废为宝]]。”"]}, {"pic": "2", "note": "图二：一人图怎么写——主人公要多写，与环境的互动", "text": ["说干就干。我们母子迅速分头行动。我立刻跑回房间，打开衣柜，开始整理自己的衣服。我把一件件已经穿不下的衣服找出来，有上衣、短裤，还有几件许久没有穿过的运动服。我没有随手把它们塞进袋子里，而是把每一件旧衣服仔细检查，再[[整整齐齐]]地折好，放进纸袋里。", "这时，我看见床边还有几件衣服，心想：这些虽然旧了一点，但还可以穿，送去回收总比扔掉好。想到这里，我把旧衣服收拾好，放进环保袋里。不一会儿，原本[[乱七八糟]]的衣柜就变得[[井井有条]]，地上也放满了准备回收的衣物。看着自己的劳动成果，我心里充满了成就感。"]}, {"pic": "3", "note": "图三：妈妈在厨房收拾瓶子（可略写）；儿子过来帮忙", "text": ["与此同时，妈妈也没有闲着。她来到厨房，把平时收集起来的塑料瓶子一个个拿出来。她先把瓶子里的水倒干净，再简单清洗，然后分类放好。我看见后，也赶紧跑过去帮忙。我们母子俩[[分工合作]]，一个整理衣服，一个收拾瓶子，忙得[[不亦乐乎]]。", "大约一个小时后，我们终于[[大功告成]]。望着眼前一袋袋整理好的回收物品，妈妈擦了擦额头上的汗，笑着说：“没想到我们家竟然有这么多可以回收的东西！”我不好意思地挠了挠头，说：“很多都是我的东西。看来以后买东西之前真的要想清楚，不然不仅浪费钱，还会制造很多垃圾。”妈妈用赞许的目光看着我，欣慰地拍了拍我的肩膀。"]}, {"pic": "4", "note": "图四：母子提着大包小包来到社区活动中心；现场的描写", "text": ["于是，我们提着大包小包来到社区的活动中心。还没走进去，我就看见前方挂着醒目的“阳光社区环保日”的横幅。现场[[人来人往，热闹非凡]]，不少居民都带着纸箱、旧报纸、衣服和瓶瓶罐罐前来参加活动。有的工作人员忙着登记，有的负责分类，大家都忙得[[不可开交]]。"]}, {"pic": "5", "note": "图五：工作人员竖起大拇指——是称赞，不是同意", "text": ["终于轮到我们了。我连忙把手中的袋子递给工作人员，说：“叔叔，这些都是我们从家里整理出来的旧衣服和瓶子。”工作人员打开袋子看了看，发现衣服全都折得整整齐齐，瓶子也已经清理干净，不禁竖起大拇指，夸赞道：“你做得真好，不但积极参加环保活动，还把回收物品整理得这么整齐。小小年纪就懂得保护环境，值得表扬！”听了这番话，我心里[[乐开了花]]。妈妈也笑容满面地看着我。"]}, {"pic": "6", "note": "图六是“？”：自己想一个结局——明白了什么，以后怎么做得更好", "text": ["我原以为环保只是“不乱丢垃圾”这么简单，经过这次活动，我才发现，环保其实可以从生活中许多[[微不足道]]的小事做起。", "这次环保活动虽然只占用了我一个上午，却让我[[受益匪浅]]。我终于明白，保护地球并不一定要做什么惊天动地的大事。只要人人从自己做起，从节约一张纸、回收一个瓶子、捐出一件旧衣服做起，[[积少成多，集腋成裘，聚沙成塔]]，我们的生活环境一定会变得更加美好。"]}, {"pic": "end", "note": "做好事的结尾：继续做，而且做得更好", "text": ["从那以后，我渐渐养成了垃圾分类和循环利用的习惯。"]}]}, "qx": {"label": "小作者版 · 打字稿", "words": "1300", "info": "小作者自己取的题目：《一次有意义的环保活动》。这是打印出来的打字稿，老师还没有批改，原文照录。亮点：开头“我”懒洋洋不想去 → 中间慢慢转变 → 结尾羞愧又庆幸，人物心情有变化；用了两句俗语“赠人玫瑰，手有余香”“众人拾柴火焰高”。", "segments": [{"pic": "1", "note": "慧眼提示：开头让“我”先不情愿，后面才有转变——比范文多了一层波折", "text": ["星期六早晨，我正舒舒服服地窝在沙发上看故事书。妈妈拿着一张海报走到我面前，[[兴致勃勃]]地说：“俊杰，你看！今天社区举行环保活动，我们一起参加吧！”", "我瞄了一眼海报，[[懒洋洋]]地说：“不就是回收一些旧东西吗？天气这么热，待在家里吹冷气不是更舒服吗？”", "妈妈听了，笑着摇摇头：“家里正好有不少用不着的东西。[[与其]]让它们白白浪费，[[不如]]拿去回收，让它们重新发挥作用。”"]}, {"pic": "2", "text": ["听了妈妈的话，我虽然有些不情愿，但还是放下故事书，[[慢吞吞]]地走进房间，开始整理旧衣服。", "我打开衣柜，把衣服一件件取出来。有些衣服看起来还很新，却因为我长高了，再也穿不下了；还有几件被压在衣柜的角落里，因为太久没穿，我甚至已经把它们忘得[[一干二净]]。", "我拿起其中一件衣服，心想：“幸好今天把它找出来了！新加坡的天气这么湿热，要是再放上一两年，说不定早就发霉了。到时候这么好的衣服只能扔掉，多浪费呀！”", "想到这里，我刚才的不情愿渐渐消失了。我把一件件衣服摊平，仔细折好，再[[整整齐齐]]地放进袋子里。不知不觉，一个大袋子就被塞得满满的。"]}, {"pic": "3", "text": ["[[与此同时]]，妈妈也没闲着。她来到厨房，打开柜门，把里面积存的空瓶子一个个取出来。她逐一检查瓶子，发现有些瓶底还留着一点饮料，便拿到水槽边清洗干净，再倒过来晾干。不一会儿，厨房里就摆满了大大小小、干干净净的[[瓶瓶罐罐]]。"]}, {"pic": "4", "text": ["一切准备妥当后，我和妈妈一人提着几大袋回收物品，向社区活动中心出发。一路上，火辣辣的太阳[[毫不留情]]地炙烤着大地。那些袋子仿佛越来越沉，我的手臂也渐渐发酸。等我们到达活动中心时，两个人已经[[汗流浃背、气喘吁吁]]了。", "没想到，一走进活动中心，眼前的景象顿时让我忘记了疲惫。", "现场[[人山人海，热闹非凡]]。两个小学生合力提着一大袋旧玩具；一位白发苍苍的老爷爷吃力地拉着一辆小推车，上面堆着一摞摞旧报纸；不远处，一位叔叔提着满满一袋旧儿童绘本，耐心地等候着。工作人员更是忙得[[不可开交]]，一会儿接过居民送来的物品，一会儿低头分类整理，可他们脸上始终挂着亲切的笑容。", "看见大家都这么积极，我顿时来了精神，和妈妈兴致勃勃地加入了排队的长龙。"]}, {"pic": "5", "text": ["等啊等，终于轮到我们了。我和妈妈赶紧把装满旧衣服和空瓶子的袋子递给工作人员。", "一位工作人员打开袋子，不禁眼前一亮，赞叹道：“哇！你们准备了这么多旧衣服，而且瓶子还洗得干干净净，真仔细啊！谢谢你们为环保尽一份力！”", "听到他的称赞，我愣了一下，随即不好意思地笑了。", "虽然此时的我依然热得[[汗如雨下]]、气喘吁吁，双手也被沉甸甸的袋子勒得又红又痛，可我的心里却[[像吃了蜜糖一样甜]]。想到早上那个懒洋洋、只想待在家里吹冷气，还嫌参加环保活动麻烦的自己，我不禁有些羞愧。同时，我又暗暗庆幸：幸好最后听了妈妈的话，否则我不但错过了一次这么有意义的活动，那些还能继续使用的衣服和瓶子也可能白白浪费掉。"]}, {"pic": "6", "note": "图六“？”：小作者写的结局——回家路上的回想", "text": ["回家的路上，我脑海里不断浮现活动中心里热闹的情景：小学生、老爷爷、叔叔，还有那些忙碌的工作人员……原来保护环境并不是什么[[遥不可及]]的大事，而是从每个人身边的一件件小事做起。"]}, {"pic": "end", "text": ["俗话说：“[[赠人玫瑰，手有余香]]。”把自己不再需要的物品送去回收，不但可以减少浪费，也可能让它们重新发挥价值。更重要的是，“[[众人拾柴火焰高]]”，一个人的力量虽然有限，但只要大家一起行动，小小的力量也能汇聚成巨大的改变。", "从此以后，我不但养成了把可回收物品分类整理的习惯，定期把它们送到回收处，还主动邀请身边的同学和朋友一起加入环保行动。我相信，只要人人愿意尽一份力，我们一定能让新加坡的家园变得更加干净、整洁、美丽！"]}]}}, "detective": [{"w": "顿时", "t": "顿", "opts": ["顿", "吨", "钝"], "ctx": "想到老师平时常常告诉我们要保护环境，减少资源浪费，我□时来了精神，连忙说：“妈妈，我们也参加吧", "why": "“顿时”的“顿”是左边“屯”右边“页”。“吨”是重量（口字旁），“钝”是不锋利（金字旁）。", "hint": "屯＋页"}, {"w": "不亦乐乎", "t": "乎", "opts": ["乎", "呼", "平"], "ctx": "我们母子俩分工合作，一个整理衣服，一个收拾瓶子，忙得不亦乐□", "why": "“不亦乐乎”的“乎”是古文里的语气词，上面一撇加三点，下面像“于”。“呼”是呼吸（口字旁），“平”是平地。", "hint": "一撇加点点，不是口字旁"}, {"w": "负", "t": "负", "opts": ["负", "付", "贝"], "ctx": "有的工作人员忙着登记，有的□责分类，大家都忙得不可开交", "why": "“负责”的“负”是背着、承担的意思，下面是“贝”。“付”是付钱，“贝”是贝壳。", "hint": "上面像人弯腰背东西"}, {"w": "责", "t": "责", "opts": ["责", "债", "啧"], "ctx": "有的工作人员忙着登记，有的负□分类，大家都忙得不可开交", "why": "“责任”的“责”下面是“贝”，像欠了债要还。“债”是欠钱（单人旁），“啧”是啧啧称赞（口字旁）。", "hint": "贝字底"}, {"w": "仅", "t": "仅", "opts": ["仅", "仪", "又"], "ctx": "看来以后买东西之前真的要想清楚，不然不□浪费钱，还会制造很多垃圾", "why": "“不仅”的“仅”是单人旁加“又”，意思是只、只是。“仪”是礼仪，“又”是又一次。", "hint": "单人旁＋又"}, {"w": "励", "t": "励", "opts": ["励", "厉", "历"], "ctx": "社区要举办环保活动，鼓□居民把家里的旧衣服、塑料瓶和其他可以回收的物品送到回收站", "why": "“奖励”的“励”是力字旁，给人力量、鼓励。“厉”是严厉，“历”是历史。", "hint": "力字旁"}, {"w": "间", "t": "间", "opts": ["间", "前", "向"], "ctx": "我立刻跑回房□，打开衣柜，开始整理自己的衣服", "why": "“时间”“一瞬间”的“间”是门字框里一个“日”，像从门缝看见太阳。小作者写过“前”，要记得“时间”的“间”有门字框。", "hint": "门里一个日"}, {"w": "道", "t": "道", "opts": ["道", "到", "倒"], "ctx": "我原以为环保只是“不乱丢垃圾”这么简单，经过这次活动，我才发现，环保其实可以从生活中许多微不足□的小事做起", "why": "“知道”“道理”的“道”是走之旁加“首”。“到”是到达（右边是刂），小作者把“知道”写成“知到”过，要记住：知道一条路 → 走之旁。", "hint": "走之旁＋首"}, {"w": "赞", "t": "赞", "opts": ["赞", "攒", "瓒"], "ctx": "”妈妈用□许的目光看着我，欣慰地拍了拍我的肩膀", "why": "“称赞”的“赞”是两个“先”在上面，“贝”在下面。“攒”是攒钱（提手旁）。", "hint": "两个先＋贝"}, {"w": "实", "t": "实", "opts": ["实", "买", "卖"], "ctx": "我原以为环保只是“不乱丢垃圾”这么简单，经过这次活动，我才发现，环保其□可以从生活中许多微不足道的小事做起", "why": "“实在”“老实”的“实”是宝盖头下面一个“头”。“买”“卖”下面是“头”但上面不同。", "hint": "宝盖头＋头"}], "audio": {"adv": {"src": "audio/recycling-day_adv.mp3", "cues": [["recycling-day|adv|1|0", 0.05], ["recycling-day|adv|1|1", 26.74], ["recycling-day|adv|2|0", 57.72], ["recycling-day|adv|2|1", 81.98], ["recycling-day|adv|3|0", 107.2], ["recycling-day|adv|3|1", 129.25], ["recycling-day|adv|4|0", 159.75], ["recycling-day|adv|5|0", 184.79], ["recycling-day|adv|6|0", 219.68], ["recycling-day|adv|6|1", 229.84], ["recycling-day|adv|end|0", 255.27]]}, "qx": {"src": "audio/recycling-day_qx.mp3", "cues": [["recycling-day|qx|1|0", 0.05], ["recycling-day|qx|1|1", 19.11], ["recycling-day|qx|1|2", 30.88], ["recycling-day|qx|2|0", 44.22], ["recycling-day|qx|2|1", 54.21], ["recycling-day|qx|2|2", 73.65], ["recycling-day|qx|2|3", 90.76], ["recycling-day|qx|3|0", 106.25], ["recycling-day|qx|4|0", 131.34], ["recycling-day|qx|4|1", 156.73], ["recycling-day|qx|4|2", 163.42], ["recycling-day|qx|4|3", 197.96], ["recycling-day|qx|5|0", 206.19], ["recycling-day|qx|5|1", 216.12], ["recycling-day|qx|5|2", 232.6], ["recycling-day|qx|5|3", 237.59], ["recycling-day|qx|6|0", 272.6], ["recycling-day|qx|end|0", 292.82], ["recycling-day|qx|end|1", 320.1]]}}}, {"id": "art-contest", "title": "画画比赛玩闹，撞掉同学的画", "cat": "whoops", "grade": "P5", "pics": 6, "date": "2026-09-01", "source": "蔡老师课件", "imgs": ["img/P06_art_1.jpg", "img/P06_art_2.jpg", "img/P06_art_3.jpg", "img/P06_art_4.jpg", "img/P06_art_5.jpg", "img/P06_art_6.jpg"], "vocab": ["画画比赛", "池塘", "目不转睛", "玩闹", "撞倒", "掉进", "取消资格", "道歉"], "drafts": [], "qxNote": "课件里没有小作者这一篇的作文，也没有找到对应的手稿。", "versions": {"adv": {"label": "范文 · 老师版", "words": "800", "info": "参考范文 · 主题：比赛时不要玩闹，以免发生意外", "segments": [{"pic": "1", "note": "图一：时间天气；比赛情景略写", "text": ["一个很平常的星期六上午，天气晴朗，阳光明媚。学校举办了一场画画比赛，老师带着同学们来到学校的生态园[[写生]]。同学们听了比赛规则后，便各自找了一个合适的地方，准备把眼前美丽的景色画下来。"]}, {"pic": "2", "note": "图二：小丽认真画画（池塘景色描写）", "text": ["小丽来到池塘边坐下，她打开画板，拿起画笔，认真地观察着眼前的景色。池塘里的荷叶碧绿碧绿的，几朵荷花[[亭亭玉立]]，几条小鱼在清澈的水中自由自在地游来游去。小丽看得入了神，目不转睛地盯着池塘，心想：这里的景色真美，我一定要把它画下来！", "于是，小丽低下头，全神贯注地画了起来。她一会儿看看池塘，一会儿在画纸上添上几笔，完全没有注意到身后发生的事情。"]}, {"pic": "3", "note": "图三：两个男孩你追我赶地玩闹", "text": ["这时，两名同学小力和小丁正好拿着画具，经过池塘边。他们没有认真画画，反而[[你追我赶]]地玩闹起来。他们俩跑到小丽身边停了下来。"]}, {"pic": "4", "note": "图四：玩闹升级，撞到小丽", "text": ["“你别在我的画上乱画！”其中一名男孩小力大声喊道。“哈哈，我在帮你画啊！”另一名男孩小丁笑着说，随手就拿起水彩笔挥了过去。因为他们只顾着玩闹，你抢我的画笔，我抢你的画，完全没有注意到在一旁正在专心致志地画画的小丽。突然，小力一不小心撞到了正在画画的小丽。"]}, {"pic": "5", "note": "图五：画掉进池塘；两人道歉", "text": ["“哎呀！”小丽吓了一跳，身体猛地向前一倾。她的手一松，只听“扑通”一声，手中的画竟然掉进了池塘里！小丽顿时瞪大了眼睛，呆呆地望着漂在水面上的画，急得像热锅上的蚂蚁。她皱着眉头说：“糟了！我的画掉进池塘了，我还怎么继续比赛呢？”", "撞到小丽的小力也吓得脸色发白。他马上停下脚步，低着头，满脸[[愧疚]]地说：“对不起，我不是故意的。都是因为我们刚才在这里追逐玩闹，才把你撞到了。”小丁也不好意思地说道：“我们以后一定不会在池塘边玩闹了。请你原谅我。”"]}, {"pic": "6", "note": "图六：老师批评，取消资格；给小丽延长时间", "text": ["这时，老师闻声赶来。了解事情的经过后，她怒气冲冲，严肃地批评小丁和小力说：“比赛时间你们没有认真画画，竟然在打闹。我将取消你们俩的比赛资格。再说池塘边很湿滑，在这里追逐玩闹非常危险。不但可能撞到别人，自己也可能掉进水里。再说你们还让小丽的画掉进池塘里了。真是太不应该了！”小力和小丁听后，羞愧地低下了头，异口同声地向老师和小丽道歉说：“对不起，我们再也不敢这样做了。”老师原谅了他们两个，也给小丽延长了画画比赛的时间。"]}, {"pic": "end", "text": ["俗话说：“前事不忘，后事之师。”经过这件事，小力和小丁终于明白了一个道理：无论在哪里，都不能只顾着玩耍而忽略安全。尤其是在池塘等危险的地方，更应该[[小心谨慎]]，遵守规则，以免乐极生悲。"]}]}}, "detective": [{"w": "继续", "t": "续", "opts": ["续", "读", "绩"], "ctx": "我的画掉进池塘了，我还怎么继□比赛呢", "why": "“继续”的“续”是绞丝旁，像把线接下去。“读”是言字旁，“绩”是成绩。", "hint": "接线 → 绞丝旁"}, {"w": "热锅上的蚂蚁", "t": "锅", "opts": ["锅", "涡", "祸"], "ctx": "小丽顿时瞪大了眼睛，呆呆地望着漂在水面上的画，急得像热□上的蚂蚁", "why": "“锅”是金字旁，锅是金属做的。“涡”是旋涡（三点水），“祸”是灾祸（示字旁）。", "hint": "金属做的 → 金字旁"}, {"w": "全神贯注", "t": "贯", "opts": ["贯", "惯", "冠"], "ctx": "于是，小丽低下头，全神□注地画了起来", "why": "“全神贯注”的“贯”是贯穿、连成一串的意思，上面是“毌”（像一串钱），下面是“贝”。“惯”是习惯（竖心旁），“冠”是帽子。", "hint": "上面像一串钱，下面是贝"}, {"w": "全神贯注", "t": "注", "opts": ["注", "住", "柱"], "ctx": "于是，小丽低下头，全神贯□地画了起来", "why": "“注意”的“注”是三点水，本来是把水灌进去，引申为把心思放进去。“住”是居住（单人旁）。小作者写过“住意”！", "hint": "注意 → 三点水"}, {"w": "顿时", "t": "顿", "opts": ["顿", "吨", "钝"], "ctx": "小丽□时瞪大了眼睛，呆呆地望着漂在水面上的画，急得像热锅上的蚂蚁", "why": "“顿时”的“顿”是左边“屯”右边“页”。“吨”是重量（口字旁），“钝”是不锋利（金字旁）。", "hint": "屯＋页"}, {"w": "严肃", "t": "严", "opts": ["严", "岩", "炎"], "ctx": "了解事情的经过后，她怒气冲冲，□肃地批评小丁和小力说：“比赛时间你们没有认真画画，竟然在打闹", "why": "“严肃”的“严”上面是“业”的变形，一横在上。“岩”是岩石，“炎”是炎热（两个火）。", "hint": "上面一横一竖，不是山"}, {"w": "严肃", "t": "肃", "opts": ["肃", "萧", "素"], "ctx": "了解事情的经过后，她怒气冲冲，严□地批评小丁和小力说：“比赛时间你们没有认真画画，竟然在打闹", "why": "“严肃”的“肃”像一个人恭恭敬敬站着，笔画要写对：中间一竖到底，两边像八字。“萧”是草字头，“素”是朴素。", "hint": "中间一竖到底"}, {"w": "阳光明媚", "t": "媚", "opts": ["媚", "眉", "楣"], "ctx": "一个很平常的星期六上午，天气晴朗，阳光明□", "why": "“阳光明媚”的“媚”是女字旁加“眉”。“眉”是眉毛，“楣”是门楣（木字旁）。", "hint": "女字旁＋眉"}, {"w": "乐极生悲", "t": "悲", "opts": ["悲", "非", "辈"], "ctx": "尤其是在池塘等危险的地方，更应该小心谨慎，遵守规则，以免乐极生□", "why": "“悲伤”“乐极生悲”的“悲”下面是“心”，心里难过。“非”没有心，“辈”下面是车。", "hint": "心字底"}, {"w": "再也不敢", "t": "再", "opts": ["再", "在", "载"], "ctx": "”小力和小丁听后，羞愧地低下了头，异口同声地向老师和小丽道歉说：“对不起，我们□也不敢这样做了", "why": "“再也不会”“再次”的“再”是又一次。“在”是在哪里（在家、实在）。小作者把“实在”写成“实再”、“再吃”写成“在吃”——记住：又一次 → 再。", "hint": "又一次 → 再；地点 → 在"}], "audio": {"adv": {"src": "audio/art-contest_adv.mp3", "cues": [["art-contest|adv|1|0", 0.0], ["art-contest|adv|2|0", 21.26], ["art-contest|adv|2|1", 51.5], ["art-contest|adv|3|0", 65.62], ["art-contest|adv|4|0", 80.87], ["art-contest|adv|5|0", 110.13], ["art-contest|adv|5|1", 134.85], ["art-contest|adv|6|0", 158.82], ["art-contest|adv|end|0", 207.16]]}}}, {"id": "bully-hdb", "title": "组屋楼下目睹霸凌，拍照取证", "cat": "guts", "grade": "P6", "pics": 6, "date": "2026-11-04", "source": "蔡老师范文 · 小六预考", "imgs": ["img/P07_bully_1.jpg", "img/P07_bully_2.jpg", "img/P07_bully_3.jpg", "img/P07_bully_4.jpg", "img/P07_bully_5.jpg", "img/P07_bully_6.jpg"], "vocab": ["迟到", "组屋楼下", "求救", "偷看", "欺负", "抢钱包", "拍照取证", "被发现", "呼救", "邪不胜正"], "drafts": [], "qxNote": "这是蔡老师的小六预考范文，小作者还没有写这一篇。", "versions": {"adv": {"label": "范文 · 蔡老师版", "words": "1300", "info": "新加坡小六预考看图作文 · 审题：写作重点不是单纯写“看见欺负同学”，而是要把发现异常、偷看、目睹欺凌、拍照取证、被发现、解决问题写得有波折。图五一个高年级男孩突然回头，是全文的高潮。", "segments": [{"pic": "1", "note": "图一：起床晚了、赶着上学——为后面“迟到”埋下伏笔", "text": ["“铃铃铃……”闹钟响了好几遍，我才猛地从床上坐起来。“糟了，要迟到了！”我看了一眼时钟，指向七点十五分，顿时[[大惊失色]]，[[匆匆忙忙]]刷了牙，洗了脸，换上校服，连早餐也顾不上吃，抓起书包便冲出了家门。", "我一边赶着去上学，一边不停地看手表，心里[[忐忑不安]]：要是再迟几分钟，恐怕就要被老师批评了。清晨的阳光洒在道路上，微风轻轻吹拂，送来缕缕花儿的芳香，四周十分宁静。"]}, {"pic": "2", "note": "图二：发现异常——听到求救声；犹豫后决定偷看", "text": ["我一路小跑，经过一座组屋时，突然[[隐隐约约]]听见组屋楼下传来一阵微弱而急促的声音：“不要！还给我！救命啊！”我立即停下脚步，[[心里咯噔一下]]：是谁在求救？我循声望去，只见声音是从组屋楼下的一根柱子后面传来的。", "我本来想赶快去学校，可那阵求救声再次传进耳中。我犹豫了一会儿，心想：如果真的有人遇到麻烦，我怎么能[[袖手旁观]]呢？想到这里，我放慢脚步，[[蹑手蹑脚]]地走到柱子旁，探出半个脑袋去偷看。"]}, {"pic": "3", "note": "图三：目睹欺凌——外貌、神态、语言描写", "text": ["[[真是不看不知道，一看吓一跳]]，眼前的一幕让我[[目瞪口呆]]。三个身材高大的高年级男孩正围着一个低年级学生。那个小男孩瘦瘦小小的，被三个大男孩[[团团围住]]，吓得脸色苍白，双手紧紧护着书包，他的身体微微颤抖，眼里满是恐惧。", "“快点把钱拿出来！”其中一个男孩[[凶神恶煞]]地说道。", "“我……我没有钱。”小男孩吓得直发抖，眼泪已经在眼眶里打转。"]}, {"pic": "4", "note": "图四：抢走钱包；“我”火冒三丈，却又犹豫——心理的波折", "text": ["“少骗人！”另一个大男孩一把抓住他的书包。小男孩拼命护着自己的东西，苦苦哀求：“不要！这是妈妈给我的零用钱。”可是那三个男孩不但没有住手，反而[[变本加厉]]。其中一人强行拉开书包，抢走了他的钱包，还[[得意洋洋]]地在手中晃了晃。其他两人见状，竟然哈哈大笑起来。", "看到眼前这一幕，我气得[[火冒三丈]]，真想马上冲出去阻止他们。可是我刚迈出一步，又停了下来。我心想：他们有三个人，长得比我高大，如果我贸然冲出去，不但救不了他，自己可能也会挨打。怎么办？我[[急得像热锅上的蚂蚁，团团转]]。"]}, {"pic": "5", "note": "图五：全文高潮——拍照取证，大男孩猛地回头，“我”被发现", "text": ["就在这时，我看到手里的手机，[[灵机一动]]：对了，可以留下证据！于是我赶紧躲回柱子后，从口袋里拿出手机，[[小心翼翼]]地打开相机。我[[屏住呼吸]]，再次探出一点身子，把镜头对准那几个男孩，“咔嚓”一声就拍好了。", "不料，其中一个欺负人的大男孩似乎听到了动静，他猛地转过头来，眉头紧锁，双眼直直地朝我的方向望来。那一瞬间，我吓了一跳，慌作一团，[[心仿佛提到了嗓子眼]]，手心也冒出了冷汗。", "“谁在那里？”他大声喝道。", "我暗叫不妙，自言自语道：“糟糕，被发现了！”"]}, {"pic": "6", "note": "图六是“？”：自己想结局——用正确的方法解决问题", "text": ["很快的，三个大男孩朝我走来。我虽然害怕，却想起老师常常教导我们的一句话：[[邪不胜正]]。我不能眼睁睁地看着那个小同学受欺负，更不能让他们抢了钱包后若无其事地离开。于是，我立即转身跑向附近的学校，一边跑一边大声呼救：“老师！有人欺负小同学！”", "幸好一名老师听见喊声，马上赶了过来。三个高年级男孩见大事不妙，想[[拔腿就跑]]，却被老师及时拦住。我把刚才拍下的照片交给老师，并把事情发生的经过[[一五一十]]地告诉了他。面对有力的证据，那三个男孩终于无话可说，只好低下头承认错误。他们把抢走的钱包还给了低年级学生，并向他道歉。", "小男孩接过钱包，擦了擦眼泪，感激地对我说：“谢谢你！”看见他[[破涕为笑]]，我不由得松了一口气。虽然那天我最终还是迟到了，但是老师知道事情的[[来龙去脉]]后，不但没有责怪我，还表扬我懂得在保护自己的情况下帮助别人。"]}, {"pic": "end", "note": "结尾：名句＋道理（真正的勇敢是什么）", "text": ["俗话说：“[[路见不平，拔刀相助]]。”经过这件事，我明白了一个道理：帮助别人并不代表一定要逞强，真正的勇敢是在危险面前保持冷静，用正确的方法帮助别人。如果当时我因为害怕而袖手旁观，那个低年级学生也许会受到更大的伤害。"]}]}}, "detective": [{"w": "组屋", "t": "组", "opts": ["组", "祖", "租"], "ctx": "我一路小跑，经过一座□屋时", "why": "新加坡的组屋（HDB）是“组”，绞丝旁，意思是一组一组的房子。“祖”是示字旁，是祖父、祖先的“祖”；“租”是租房子的“租”（禾字旁）。很多人会写成“祖屋”，要小心！", "hint": "一组一组的房子 → 绞丝旁"}, {"w": "蹑手蹑脚", "t": "蹑", "opts": ["蹑", "摄", "慑"], "ctx": "我放慢脚步，□手□脚地走到柱子旁", "why": "“蹑手蹑脚”是走路轻轻的、不发出声音，所以是足字旁。“摄”是摄影（提手旁），“慑”是震慑（竖心旁）。", "hint": "走路 → 足字旁"}, {"w": "袖手旁观", "t": "袖", "opts": ["袖", "抽", "油"], "ctx": "如果真的有人遇到麻烦，我怎么能□手旁观呢", "why": "“袖手旁观”是把手放在袖子里站在旁边看，不帮忙。袖子是衣服，所以是衣字旁。“抽”是提手旁，“油”是三点水。", "hint": "手放进袖子 → 衣字旁"}, {"w": "凶神恶煞", "t": "煞", "opts": ["煞", "杀", "刹"], "ctx": "“快点把钱拿出来！”其中一个男孩凶神恶□地说道", "why": "“凶神恶煞”的“煞”下面有四点（灬），本来指凶神。“杀”是杀死，“刹”是刹车。", "hint": "下面有四点"}, {"w": "变本加厉", "t": "厉", "opts": ["厉", "励", "历"], "ctx": "可是那三个男孩不但没有住手，反而变本加□", "why": "“变本加厉”是变得更厉害、更过分，用“厉害”的“厉”（厂字头加万）。“励”是奖励（多了个力），“历”是历史。", "hint": "更厉害 → 厂＋万"}, {"w": "小心翼翼", "t": "翼", "opts": ["翼", "异", "冀"], "ctx": "从口袋里拿出手机，小心□□地打开相机", "why": "“翼”上面是“羽”，本来是鸟的翅膀。“小心翼翼”像鸟儿轻轻收着翅膀，非常小心。“异”是奇异，“冀”是希望。", "hint": "鸟的翅膀 → 羽字头"}, {"w": "屏住呼吸", "t": "屏", "opts": ["屏", "并", "瓶"], "ctx": "我□住呼吸，再次探出一点身子", "why": "“屏住呼吸”的“屏”是尸字头加“并”，意思是忍住、憋住。“并”是并且，“瓶”是瓶子（瓦字旁）。", "hint": "尸字头＋并"}, {"w": "嗓子眼", "t": "嗓", "opts": ["嗓", "桑", "搡"], "ctx": "我吓了一跳，慌作一团，心仿佛提到了□子眼", "why": "“嗓子”是喉咙，在嘴里面，所以是口字旁。“桑”是桑树，“搡”是推搡（提手旁）。", "hint": "喉咙 → 口字旁"}, {"w": "拔腿就跑", "t": "拔", "opts": ["拔", "拨", "拢"], "ctx": "三个高年级男孩见大事不妙，想□腿就跑", "why": "“拔”是用力往上拉出来，像把腿一下子拔起来跑。右边是“犮”（有一点）。“拨”是拨电话，右边是“发”。", "hint": "右边是犮，不是发"}, {"w": "破涕为笑", "t": "涕", "opts": ["涕", "弟", "第"], "ctx": "看见他破□为笑，我不由得松了一口气", "why": "“涕”是眼泪和鼻涕，是水，所以有三点水。“破涕为笑”就是停止哭、笑了起来。“弟”是弟弟，“第”是第一。", "hint": "眼泪 → 三点水"}], "audio": {"adv": {"src": "audio/bully-hdb_adv.mp3", "cues": [["bully-hdb|adv|1|0", 0.05], ["bully-hdb|adv|1|1", 21.49], ["bully-hdb|adv|2|0", 40.34], ["bully-hdb|adv|2|1", 62.85], ["bully-hdb|adv|3|0", 81.83], ["bully-hdb|adv|3|1", 104.64], ["bully-hdb|adv|3|2", 109.37], ["bully-hdb|adv|4|0", 115.55], ["bully-hdb|adv|4|1", 141.52], ["bully-hdb|adv|5|0", 166.21], ["bully-hdb|adv|5|1", 188.22], ["bully-hdb|adv|5|2", 206.74], ["bully-hdb|adv|5|3", 210.28], ["bully-hdb|adv|6|0", 216.02], ["bully-hdb|adv|6|1", 242.55], ["bully-hdb|adv|6|2", 270.46], ["bully-hdb|adv|end|0", 296.69]]}}}, {"id": "hawker-seat-hog", "title": "熟食中心霸座叔叔，我上前劝阻", "cat": "guts", "grade": "P5", "pics": 6, "date": "2026-08-14", "source": "蔡老师朋友圈 · P5 学生高分范文（情景作文）", "imgs": ["img/S03_seat_1.jpg", "img/S03_seat_2.jpg", "img/S03_seat_3.jpg", "img/S03_seat_4.jpg", "img/S03_seat_5.jpg", "img/S03_seat_6.jpg"], "vocab": ["熟食中心", "用餐高峰期", "人声鼎沸", "霸位", "无动于衷", "七窍生烟", "大步流星", "窃窃私语", "灰溜溜", "历历在目", "损人利己", "毫不犹豫"], "drafts": [], "aiNote": "这是情景作文，原题没有图片。六幅图是慧眼按文章内容补画的示意图，方便对照分段，不是考试原图。", "qxNote": "这是蔡老师朋友圈分享的 P5 学生高分作文，小作者还没有写这一篇。", "versions": {"adv": {"label": "范文 · P5 学生高分作文（蔡老师批改）", "words": "1000", "info": "情景作文 · 蓝色字＝蔡老师改写/补上的，划线＝老师删掉的。老师注明：尽量使用短句，不使用长句。长句“我看见了一位胸前佩戴着‘陈华强’工牌的叔叔。”也可以，但很容易出现病句；短句“我看见了一位中年叔叔，他的胸前佩戴着‘陈华强’工牌。”更稳妥。", "segments": [{"pic": "start", "note": "回忆式开头：由地点引出往事", "text": ["离我家不远有一个++购物商场，购物商场旁边有一个++熟食中心。每当我经过那里时，都会想起来一件事。事情是这样发生的……"]}, {"pic": "1", "note": "时间、原因、环境：用餐高峰期很难找到座位（为后文“霸位”做铺垫）", "text": ["那是一个星期六的中午，由于爸妈一直在加班，我只好去熟食中心吃午餐。++当时正值午餐用餐高峰期，++熟食中心[[人山人海，人声鼎沸]]，十分热闹。我买完云吞面四处张望，寻找座位。毕竟，用餐高峰期是很难找到座位的。"]}, {"pic": "2", "note": "使用短句，不使用容易出错的长句；把“霸位”的几件事一件件写清楚，再用一句感叹总结", "text": ["正在我++端着盘子++找座位的++时候++，[[我看见了一位中年叔叔，他的胸前佩戴着“陈华强”工牌]]~~的叔叔~~，++他++吃完了饭却没有离开的意思，~~他~~坐着刷手机，还用塑料袋和公文包各占着一个位子。不仅如此，++陈叔叔++吃饭的碗盘及餐具也没有++及时地++送到碗碟归还处。更过分的是，陈叔叔还把一只脚翘到对面的椅子上。++一个人占了四个座位！简直是岂有此理！++", "我本想上前劝告他，但是看到旁边有一个座位，就没有说什么，赶紧坐下来吃我的云吞面。++毕竟多一事不如少一事嘛。++"]}, {"pic": "3", "note": "老奶奶出场，“我”从“多一事不如少一事”变成看不下去——心理转折", "text": ["++不料，++吃着吃着，我发现陈叔叔还没离开，而他旁边++站着++一位老奶奶，正佝偻着背，端着碗盘，东张西望，吃力地寻找位子吃饭。她满头大汗，看起来已经找了好久位子了。可是陈叔叔已经看到她了，却依然[[无动于衷]]，没有要让座的意思。我实在是看不下去了，决定++站起身++劝一下陈叔叔。", "“陈叔叔，旁边那位老奶奶已经找了好久的座位了，您++行个方便++~~做一做好事~~，把一个座位让给她，行吗？”我很有礼貌地问。++不料／谁知／哪知++陈叔叔++却++气得[[七窍生烟]]，指着我的鼻子，大骂道：“小屁孩，你别多管闲事，老太婆可以找别的座位++坐++啊！++关我什么事？++”"]}, {"pic": "4", "note": "冲突升级。老师删去了吐口水、骂人的句子——写到被推倒就够了，不要写得太粗俗", "text": ["我不死心，继续++耐心地++说道：“但老奶奶没有找到座位啊！”++我的话音刚落++~~正当我说完~~，陈叔叔猛地站了起来，“重拳出击”，用力地推了我一下，让我++跌坐在地上，++摔了个狗啃泥。++我委屈极了，怒气冲冲地看着他，却无可奈何。++~~接着，他又朝我吐口水，边吐边骂我是猪。~~"]}, {"pic": "5", "note": "解决问题：另一位叔叔出面，周围的人附和；陈叔叔羞愧离开", "text": ["就在这个时候，在我们旁边++的另++一位中年叔叔++大步流星地赶过来，++把我和陈先生“隔离”／分开了。他还++对陈叔叔++说：“你怎么可以那么无礼呢？用餐高峰期，你一个人占四个人的座位本来就不对，++况且++这里座位是公共的，不是你一个人享用的！你也太自私了，你还是新加坡公民吗？++新加坡人都是很有礼貌，懂得为他人着想的。++”周围的人也纷纷附和道：“对啊！对啊！++这个++人真是太自私了！”", "听了中年叔叔的话以及周围人的[[窃窃私语]]，陈叔叔++羞愧极了，脸上火辣辣的，++说了句“对不起”，++就提着他的东西，++[[灰溜溜]]地跑走了。"]}, {"pic": "6", "note": "结果：老奶奶坐下吃饭、道谢；熟食中心恢复平静", "text": ["老奶奶++微笑地++看着我，坐了下来，开始++津津有味地++吃她的午餐。她一直不停地向我和中年叔叔++道谢。不一会儿，小贩中心又恢复到往日的样子。++"]}, {"pic": "end", "note": "首尾呼应＋道理＋以后怎么做", "text": ["++这件事已经过去很久了，++现在回忆起来，++往事++仍然[[历历在目]]，++令人难以忘怀。++这件事让我深深地明白了一个道理：++霸位是一种自私的行为。++~~自私是不对的，~~所有人都不该干[[损人利己]]的事，看到有人在++做不当的事情，++也要敢于阻止。++从此以后，++每当我在熟食中心看到++霸位又++无礼的人时，我都会++毫不犹豫地++上前阻止。"]}]}}, "detective": [{"w": "人声鼎沸", "t": "鼎", "opts": ["鼎", "顶", "丁"], "ctx": "熟食中心人山人海，人声□沸，十分热闹", "why": "“人声鼎沸”是说人的声音像鼎（古代煮东西的大锅）里的水烧开了一样吵。“鼎”下面像锅的脚。“顶”是头顶，“丁”是人丁。", "hint": "古代的大锅，下面有脚"}, {"w": "佩戴", "t": "佩", "opts": ["佩", "配", "珮"], "ctx": "我看见了一位中年叔叔，他的胸前□戴着“陈华强”工牌", "why": "“佩戴”是把东西挂在身上，单人旁（人戴的）。“配”是搭配、配合（酉字旁）。", "hint": "人戴着 → 单人旁"}, {"w": "佝偻", "t": "佝", "opts": ["佝", "句", "钩"], "ctx": "正□偻着背，端着碗盘，东张西望", "why": "“佝偻”是背弯弯的样子，说的是人，所以两个字都是单人旁。“句”是句子，“钩”是钩子（金字旁）。", "hint": "人弯着背 → 单人旁"}, {"w": "无动于衷", "t": "衷", "opts": ["衷", "忠", "中"], "ctx": "却依然无动于□，没有要让座的意思", "why": "“衷”是内心，字的中间藏着一个“中”，外面是“衣”——心里面的意思。“无动于衷”＝心里一点也不受感动。“忠”是忠心（心字底）。", "hint": "衣服里面藏着“中”"}, {"w": "七窍生烟", "t": "窍", "opts": ["窍", "巧", "窃"], "ctx": "陈叔叔却气得七□生烟", "why": "“窍”是身上的洞（眼耳口鼻共七个），所以是穴字头。“七窍生烟”就是气得眼耳口鼻都冒烟。“巧”是巧妙，“窃”是偷（也是穴字头，但下面是切）。", "hint": "身上的洞 → 穴字头＋巧"}, {"w": "闲事", "t": "闲", "opts": ["闲", "闭", "闹"], "ctx": "小屁孩，你别多管□事", "why": "“闲”是门里一个“木”，没事做、空闲的意思。“多管闲事”就是管和自己无关的事。“闭”里面是“才”，“闹”里面是“市”。", "hint": "门里一棵树"}, {"w": "附和", "t": "附", "opts": ["附", "付", "府"], "ctx": "周围的人也纷纷□和道", "why": "“附和”是跟着别人说同样的话，“附”是左耳旁，靠在旁边的意思。“付”是付钱，“府”是政府。", "hint": "靠在旁边 → 左耳旁"}, {"w": "窃窃私语", "t": "窃", "opts": ["窃", "切", "窍"], "ctx": "听了中年叔叔的话以及周围人的□□私语", "why": "“窃窃私语”是偷偷小声说话。“窃”是穴字头加“切”，像躲在洞里偷偷说。“窍”是七窍生烟的窍（下面是巧）。", "hint": "穴字头＋切"}, {"w": "灰溜溜", "t": "溜", "opts": ["溜", "留", "榴"], "ctx": "就提着他的东西，灰□□地跑走了", "why": "“灰溜溜”是很没面子、偷偷走掉的样子。“溜”是三点水，像水一样滑走了。“留”是留下，“榴”是榴莲（木字旁）。", "hint": "像水一样滑走 → 三点水"}, {"w": "历历在目", "t": "历", "opts": ["历", "厉", "励"], "ctx": "现在回忆起来，往事仍然□□在目", "why": "“历历在目”是过去的事清清楚楚就在眼前。“历”是经历、历史，厂字头里面是“力”。“厉”里面是“万”（严厉），“励”是奖励。", "hint": "厂字头里面是力"}], "audio": {"adv": {"src": "audio/hawker-seat-hog_adv.mp3", "cues": [["hawker-seat-hog|adv|start|0", 0.0], ["hawker-seat-hog|adv|1|0", 13.64], ["hawker-seat-hog|adv|2|0", 38.96], ["hawker-seat-hog|adv|2|1", 74.42], ["hawker-seat-hog|adv|3|0", 86.42], ["hawker-seat-hog|adv|3|1", 116.74], ["hawker-seat-hog|adv|4|0", 143.17], ["hawker-seat-hog|adv|5|0", 167.66], ["hawker-seat-hog|adv|5|1", 207.91], ["hawker-seat-hog|adv|6|0", 221.47], ["hawker-seat-hog|adv|end|0", 236.55]]}}}, {"id": "washroom-splash", "title": "洗手间泼水玩闹，害人滑倒", "cat": "falls", "grade": "P5", "pics": 6, "date": "2026-03-01", "source": "蔡老师朋友圈 · P5 看图作文（蔡老师儿子写的）", "imgs": ["img/S04_splash_1.jpg", "img/S04_splash_2.jpg", "img/S04_splash_3.jpg", "img/S04_splash_4.jpg", "img/S04_splash_5.jpg", "img/S04_splash_6.jpg"], "vocab": ["晨练", "熟食中心", "炸鸡翅", "风卷残云", "油腻", "水龙头", "打水仗", "毫不示弱", "积水", "失去平衡", "四脚朝天", "三思而后行"], "drafts": [], "aiNote": "原题的六幅图没有拍到，这里是慧眼按文章内容补画的示意图（第六幅是“？”，要自己想结局），不是考试原图。", "qxNote": "这是蔡老师朋友圈分享的 P5 看图作文（她儿子写的），小作者还没有写这一篇。", "versions": {"adv": {"label": "范文 · P5 看图作文（蔡老师批改）", "words": "750", "info": "蔡老师朋友圈：“P5 儿子的看图作文水平”。蓝色字＝老师用红笔补上的。第六幅图是“？”，作者写的结局是：年轻男子没大碍，两人认错道歉，被原谅。", "segments": [{"pic": "1", "note": "图一：时间、天气、人物、起因（晨练后去吃炸鸡翅）", "text": ["星期六早晨，红彤彤的太阳露出了笑脸，微风轻轻地吹着，鸟儿在枝头欢唱，空气格外清新，让人倍感舒爽。公园里热闹极了。小文和小力两个平时很好动的铁哥们儿相约晨练后就去公园对面的熟食中心吃炸鸡翅。"]}, {"pic": "2", "note": "慧眼提示：图二是美食描写，写得很生动，但和主题关系不大。考试时这一段可以写短一点，把字数留给图四、图五。", "text": ["“炸鸡翅真是太好吃了！”只见香炸的鸡翅膀酥软细嫩，[[香气扑鼻]]，如狂风巨浪般扑向鼻子，谁能受得了这样的诱惑？一口咬下去，炸鸡翅[[金黄酥脆，外酥里嫩]]，满口飘香，[[油而不腻]]，让吃的人食欲大增。好吃的炸鸡翅真的是无人能抵挡，没有人会拒绝吃下那美味、香酥、可口的炸鸡翅，这真是令人难以忘怀的好滋味。"]}, {"pic": "3", "note": "图三：吃完了，手很油腻，去洗手间", "text": ["不一会儿，小文和小力就像[[风卷残云]]般，把一盘炸鸡翅啃得干干净净。他们俩看到油腻的双手，就站起身，一前一后向洗手间走去。"]}, {"pic": "4", "note": "图四：打水仗——动作描写＋“你……我……”句式；结尾一句交代“地上到处是积水”，为图五埋下伏笔", "text": ["当打开水龙头的时候，小力看着哗啦哗啦的水流，就朝小文泼去，小文也觉得打水仗好玩，[[毫不示弱]]地泼了过去。两个人就这样[[你泼过来，我泼过去]]，玩得[[不亦乐乎]]。不一会儿，洗手间的地上到处都是积水。"]}, {"pic": "5", "note": "图五：意外发生——年轻男子踩到积水滑倒；两人回过神去扶", "text": ["正在这时，一个年轻男子走进洗手间，踩到积水，一时失去平衡，[[连滚带翻]]，跌了个[[四脚朝天]]。“啊，好痛啊！”年轻人一边抱住膝盖，一边喊道。小文和小力看到这一幕，吓呆了。他们很快就回过神，然后一个箭步地冲上前，把年轻男子扶起来。"]}, {"pic": "6", "note": "图六“？”：自己想结局——受伤不重、被责骂、认错道歉、得到原谅", "text": ["幸好，年轻男子只是擦破了皮，没什么大碍，小文和小力松了一口气。可是年轻男子的脸色异常难看。他怒气冲冲地指着小文小力大声说：“你们怎么可以做出这么危险的事？你们的家长怎么教的呢？”小文和小力++听了年轻男子的训斥，++吓得双脚发抖，头上[[直冒冷汗]]，惭愧地低着头，连声道歉：“对不起，我们知道错了，我下一次再也不会做这么危险的事了。”", "年轻男子看两个小男孩态度诚恳，就不再计较，原谅了他们，摸了摸疼++痛++的地方，就走开了。而小文和小力还站在原地，久久没有回过神来。"]}, {"pic": "end", "note": "结尾：名句＋道理", "text": ["俗话说：“经一事，长一智。”这件事让小文和小力明白了一个道理：不管做什么事，都要[[三思而后行]]，常为他人着想，而且一定要把安全放在第一位，千万不要在公共洗手间泼水玩闹。"]}]}}, "detective": [{"w": "彤彤", "t": "彤", "opts": ["彤", "丹", "红"], "ctx": "星期六早晨，红□□的太阳露出了笑脸", "why": "“红彤彤”形容很红很红。“彤”是左边“丹”（红色）加右边三撇（像光彩）。只写“丹”少了三撇就不对了
