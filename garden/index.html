。", "hint": "丹＋三撇"}, {"w": "倍感", "t": "倍", "opts": ["倍", "陪", "培"], "ctx": "空气格外清新，让人□感舒爽", "why": "“倍感”是更加感到，“倍”是单人旁（加倍）。“陪”是陪伴（左耳旁），“培”是培养（土字旁）。", "hint": "加倍 → 单人旁"}, {"w": "诱惑", "t": "诱", "opts": ["诱", "透", "绣"], "ctx": "谁能受得了这样的□惑", "why": "“诱惑”是用好东西吸引人，用嘴说话去吸引，所以是言字旁。“透”是透明（走之旁），“绣”是绣花（绞丝旁）。", "hint": "言字旁＋秀"}, {"w": "酥脆", "t": "酥", "opts": ["酥", "苏", "稣"], "ctx": "一口咬下去，炸鸡翅金黄□脆，外酥里嫩", "why": "“酥”是酉字旁（和吃的、酒有关）加“禾”，又松又脆。“苏”是草字头，“稣”是鱼字旁。", "hint": "酉＋禾"}, {"w": "油而不腻", "t": "腻", "opts": ["腻", "贰", "赋"], "ctx": "满口飘香，油而不□", "why": "“腻”是月字旁加“贰”，油太多吃了会腻。只写“贰”是数字二的大写，少了月字旁。", "hint": "月字旁＋贰"}, {"w": "风卷残云", "t": "卷", "opts": ["卷", "券", "拳"], "ctx": "小文和小力就像风□残云般，把一盘炸鸡翅啃得干干净净", "why": "“风卷残云”是大风把云一下子卷走，比喻很快吃光。“卷”下面是“㔾”；“券”下面是“刀”（奖券），“拳”下面是“手”（拳头）。", "hint": "下面是㔾，不是刀"}, {"w": "啃", "t": "啃", "opts": ["啃", "肯", "哨"], "ctx": "把一盘炸鸡翅□得干干净净", "why": "“啃”是用牙一点点咬，口字旁加“肯”。“肯”是肯定，“哨”是哨子。", "hint": "用嘴 → 口字旁"}, {"w": "毫不示弱", "t": "示", "opts": ["示", "是", "视"], "ctx": "小文也觉得打水仗好玩，毫不□弱地泼了过去", "why": "“毫不示弱”是一点也不表现出软弱，“示”是表示、显示。“是”是“是不是”的是，“视”是看（视力）。", "hint": "表示的“示”"}, {"w": "衡", "t": "衡", "opts": ["衡", "横", "恒"], "ctx": "踩到积水，一时失去平□", "why": "“平衡”的“衡”外面是“行”，中间是“鱼＋大”的变形。“横”是横竖的横（木字旁），“恒”是永恒。", "hint": "外面是行"}, {"w": "训斥", "t": "斥", "opts": ["斥", "斤", "拆"], "ctx": "小文和小力听了年轻男子的训□，吓得双脚发抖", "why": "“训斥”是大声批评。“斥”是“斤”加一点。“斤”没有那一点，“拆”是拆开（提手旁）。这句是蔡老师用红笔帮忙补上的！", "hint": "斤＋一点"}], "audio": {"adv": {"src": "audio/washroom-splash_adv.mp3", "cues": [["washroom-splash|adv|1|0", 0.0], ["washroom-splash|adv|2|0", 26.08], ["washroom-splash|adv|3|0", 63.87], ["washroom-splash|adv|4|0", 78.52], ["washroom-splash|adv|5|0", 99.88], ["washroom-splash|adv|6|0", 126.77], ["washroom-splash|adv|6|1", 165.25], ["washroom-splash|adv|end|0", 181.12]]}}}, {"id": "visit-grandma", "title": "放弃看动画片，去医院看望姥姥", "cat": "bonds", "grade": "P6", "pics": 6, "date": "2025-11-09", "source": "蔡老师朋友圈 · 小六情景作文（批改示范）", "imgs": ["img/S05_grandma_1.jpg", "img/S05_grandma_2.jpg", "img/S05_grandma_3.jpg", "img/S05_grandma_4.jpg", "img/S05_grandma_5.jpg", "img/S05_grandma_6.jpg"], "vocab": ["合影", "回想", "心旷神怡", "心花怒放", "大步流星", "津津有味", "慌作一团", "于心不忍", "毫不犹豫", "懂事", "历历在目", "及时行孝"], "drafts": [], "aiNote": "这是情景作文，原题没有图片。六幅图是慧眼按文章内容补画的示意图（第六幅是“？”，自己想结局），让孩子更直观地对照分段，不是考试原图。", "qxNote": "这是蔡老师朋友圈分享的批改示范，小作者还没有写这一篇。", "versions": {"adv": {"label": "范文 · 小六作文（蔡老师批改成高分）", "words": "900", "info": "蔡老师朋友圈：“低于 30 分的小六作文怎么批改成高分作文？”蓝色字＝蔡老师改写／补上的部分，黑色是学生原来写的。对照着看，就知道一篇普通作文是怎么变成高分作文的：加环境描写、动作描写（三个动词）、心理挣扎、对话、主题升华。", "segments": [{"pic": "start", "note": "由眼前事物（一张照片）进入回忆的场景，非常好", "text": ["这是一个++天气晴朗++的星期二早上，++我在睡床旁边看到了一张++照片。照片上有我、++妈妈和姥姥的合影。姥姥的脸上洋溢着幸福的微笑。这张幸福的祖孙++照片让我++回想起一件往事++。那件事是这样发生的……"]}, {"pic": "1", "note": "环境描写——很好，懂得学以致用；“心花怒放、大步流星”写出急着回家看动画片的心情", "text": ["++说来已经一个月前发生的事情了。++那是一个风和日丽的星期一下午，[[阳光透过树叶照射在路上，把路面照得金亮亮、银闪闪的，微风轻拂，令人心旷神怡]]。我踏着轻快的脚步走在回家的路上。想到今天下午四点会播放我最喜欢的《三国演义》动画片，++我不由得心花怒放，大步流星地往家中走去。++"]}, {"pic": "2", "note": "动作描写——如果不太会，可以想三个动词（坐、拿出、做）", "text": ["回到家，我看到还有++两++个小时才会++播放动画片++。我打算++先++把我的作业做完++再++去看电视，++免得我在看动画片的时候，妈妈又念叨我的作业没有完成。++于是，[[我坐在书桌前，从书包里拿出学校老师布置的功课，认认真真地做作业]]。"]}, {"pic": "3", "note": "动作描写，三个动词（放、走、打开），与前面呼应", "text": ["++时间一分一秒地流逝了。很快地，两个小时就过去了。++看到时间马上到四点，而我也++做++完作业。[[于是，我迅速把作业放到书包里。然后，走到客厅，我打开电视津津有味地看动画片]]。"]}, {"pic": "4", "note": "听到自己的妈妈住院的消息，妈妈的反应（动作描写）", "text": ["突然，电话铃声响了。妈妈接起电话。我听到妈妈惊呼道：“什么？妈妈住院了？”++原来是舅舅打来的。姥姥生病了。++[[妈妈慌作一团，迅速挂上电话，拿起女士包，把钱包和手机放进里面，准备出门]]。"]}, {"pic": "5", "note": "文似看山不喜平，要写出内心的挣扎；对话描写", "text": ["++看到眼前这一幕，我忍不住想：我是继续看动画片，还是和妈妈一起去探望姥姥呢？去探望姥姥吧，动画片就看不成了。不去探望吧，我又于心不忍。毕竟姥姥最疼爱我了。++", "想到这里，我[[毫不犹豫]]地关闭电视机，做了一个决定。我叫住妈妈，叫她等一等我，说：“妈妈，我和++您++一起看望++姥姥++。”妈妈微笑地盯着我说：“明华，你懂事了。”"]}, {"pic": "6", "note": "图六“？”——老师：结束事件（拍照留念，和开头那张合影首尾呼应）", "text": ["后来，我和妈妈搭德士，急匆匆赶到医院探望姥姥。++姥姥++看到我和妈妈的到来，一下子开心起来。++她笑呵呵地要和我拍照留念，一点也看不出生病的样子。病房里洋溢着我们祖孙三代人幸福的笑声。++"]}, {"pic": "end", "note": "主题升华", "text": ["++这件事已经发生很久了，但每当回忆起来，++往事仍然[[历历在目]]。++这件事教会我一个道理：亲情的陪伴比娱乐更重要。树欲静而风不止，子欲养而亲不待。我们应该及时行孝。++"]}]}}, "detective": [{"w": "洋溢", "t": "溢", "opts": ["溢", "益", "谥"], "ctx": "姥姥的脸上洋□着幸福的微笑", "why": "“洋溢”是满得流出来，所以是三点水。“益”是利益（没有三点水），“谥”是言字旁。", "hint": "满得流出来 → 三点水＋益"}, {"w": "心旷神怡", "t": "旷", "opts": ["旷", "矿", "扩"], "ctx": "微风轻拂，令人心□神怡", "why": "“心旷神怡”是心胸开阔、精神愉快。“旷”是日字旁，像阳光照着空旷的地方。“矿”是矿石（石字旁），“扩”是扩大（提手旁）。", "hint": "空旷有阳光 → 日字旁"}, {"w": "心花怒放", "t": "怒", "opts": ["怒", "努", "奴"], "ctx": "我不由得心花□放", "why": "“心花怒放”是心里高兴得像花一下子开了，这里的“怒”是“盛开”的意思，下面是“心”。“努”下面是“力”，“奴”没有底。", "hint": "下面是心"}, {"w": "念叨", "t": "叨", "opts": ["叨", "刀", "召"], "ctx": "免得我在看动画片的时候，妈妈又念□我的作业没有完成", "why": "“念叨”是一直说、反复说，用嘴，所以是口字旁加“刀”。“刀”是小刀，“召”是召开（刀在上、口在下）。", "hint": "口字旁＋刀"}, {"w": "布置", "t": "置", "opts": ["置", "值", "直"], "ctx": "从书包里拿出学校老师布□的功课", "why": "“布置”的“置”上面是“罒”（四字头），下面是“直”。“值”是值日（单人旁），“直”是一直。", "hint": "四字头＋直"}, {"w": "流逝", "t": "逝", "opts": ["逝", "誓", "折"], "ctx": "时间一分一秒地流□了", "why": "“流逝”是像水一样过去了，“逝”是走之旁，表示走掉、过去。“誓”是发誓（下面是言），“折”是折断。", "hint": "过去了 → 走之旁＋折"}, {"w": "慌作一团", "t": "慌", "opts": ["慌", "谎", "荒"], "ctx": "妈妈□作一团，迅速挂上电话", "why": "“慌”是心里着急，竖心旁。“谎”是说谎（言字旁），“荒”是荒地（没有偏旁）。", "hint": "心里着急 → 竖心旁"}, {"w": "于心不忍", "t": "忍", "opts": ["忍", "认", "刃"], "ctx": "不去探望吧，我又于心不□", "why": "“不忍”是心里舍不得、不忍心，“忍”下面是“心”，上面是“刃”（刀口）——心上有把刀，所以难受。“认”是认识（言字旁）。", "hint": "刃＋心"}, {"w": "毫不犹豫", "t": "犹", "opts": ["犹", "尤", "优"], "ctx": "我毫不□豫地关闭电视机", "why": "“犹豫”两个字都和动物有关：“犹”是反犬旁。“尤”是尤其，“优”是优秀（单人旁）。", "hint": "反犬旁＋尤"}, {"w": "德士", "t": "德", "opts": ["德", "得", "待"], "ctx": "后来，我和妈妈搭□士，急匆匆赶到医院探望姥姥", "why": "新加坡说的“德士”就是出租车（taxi），写“道德”的“德”：双人旁，右边是“十、四、一、心”。“得”是得到，“待”是等待。", "hint": "十四一心"}], "audio": {"adv": {"src": "audio/visit-grandma_adv.mp3", "cues": [["visit-grandma|adv|start|0", 0.05], ["visit-grandma|adv|1|0", 20.87], ["visit-grandma|adv|2|0", 50.01], ["visit-grandma|adv|3|0", 70.83], ["visit-grandma|adv|4|0", 88.92], ["visit-grandma|adv|5|0", 110.03], ["visit-grandma|adv|5|1", 127.3], ["visit-grandma|adv|6|0", 142.81], ["visit-grandma|adv|end|0", 167.0]]}}}, {"id": "playground-water-gun", "title": "游乐场玩水枪，害小女孩滑倒", "cat": "whoops", "grade": "P5", "pics": 6, "date": "2025-09-08", "source": "蔡老师朋友圈 · P5 学生满分作文", "imgs": ["img/S06_gun_1.jpg", "img/S06_gun_2.jpg", "img/S06_gun_3.jpg", "img/S06_gun_4.jpg", "img/S06_gun_5.jpg", "img/S06_gun_6.jpg"], "vocab": ["余晖", "和煦", "慈祥", "躲闪", "狼狈", "劝告", "耸了耸肩", "沉浸", "迫不及待", "杰作", "屏住呼吸", "兴致勃勃", "不约而同", "公德心"], "drafts": [], "aiNote": "原题的六幅图没有拍到，这里是慧眼按文章内容补画的示意图（第六幅是“？”，要自己想结局），不是考试原图。", "qxNote": "这是蔡老师朋友圈分享的 P5 学生满分作文，小作者还没有写这一篇。", "versions": {"adv": {"label": "范文 · P5 学生满分作文（蔡老师批改）", "words": "850", "info": "蔡老师朋友圈：“来一篇我的 P5 学生的满分作文”。蓝色字＝老师用红笔补上的，划线＝老师删掉的。老师在环境描写和“哥哥劝告”两段打了大勾，在“公园里热闹极了……”下面画了波浪线（好句）。", "segments": [{"pic": "start", "note": "首尾呼应的开头：由地点引出往事（老师补了“每当我经过那个游乐场时”）", "text": ["在我家楼下有一个小公园，小公园里有一个高大的游乐场，++每当我经过那个游乐场时，++我都会想起那件喷水枪的事来……"]}, {"pic": "1", "note": "环境描写（老师打勾）＋人物、起因；“有的……有的……还有的……”是好句（老师画波浪线）", "text": ["那是一个六月假期的傍晚，[[太阳收敛了中午酷热的光芒，落日的余晖透过稀疏的云层洒在公园里，闪耀着和煦的光芒，如同年长者慈祥的微笑]]。", "我和我的哥哥、弟弟三个人一直期待着周末的到来，因为我们知道，这将是个充满欢乐的时光。我们早早地来到这个游乐场，[[公园里热闹极了。有的人在溜滑梯，有的人在荡秋千，还有的人在有说有笑地聊天]]。"]}, {"pic": "2", "note": "突发事件：刚滑下来就被水枪喷湿", "text": ["我急急忙忙地走到滑梯，兴奋地爬上去，哥哥和弟弟跟在我后面。我~~做~~++站++在滑梯的顶端，“咻！”的一下就滑到底部了。但就在我站起来的~~的~~++瞬间++，一股冷水突然从后面[[喷射而来]]，我来不及躲闪，整件上衣都被淋湿了。"]}, {"pic": "3", "note": "哥哥劝阻，两兄弟不听（老师打勾）——“一滩又一滩的水”为下文埋伏笔", "text": ["我吓了一跳，抬头一看，发现是邻居小文和小明兄弟俩正在用玩具手枪喷来喷去。哥哥看到我[[狼狈]]的样子，马上上前阻止他们的不当行为。哥哥指着地上的一滩滩水劝道：“小文和小明，你们不能在这里玩水枪，很容易喷到别人。而且地上一滩又一滩的水，别人踩到++后++可能会跌倒。”", "但是小文和小明不理会我哥哥的劝告，他们[[耸了耸肩]]说无所谓，游乐场是供大家玩的地方。哥哥告诉我们++：++他们不听就算了，要我们到其它地方玩。渐渐的，越来越多孩子躲开了小文和小明。"]}, {"pic": "4", "note": "新人物出场：小女孩奔向滑梯，没注意积水；周围人屏住呼吸——制造紧张感", "text": ["然而，小文和小明[[沉浸在水战的乐趣中]]时，一位老爷爷牵着他的孙女走进了游乐场。小孙女的眼神立刻落在了滑梯上。她[[迫不及待]]地松开++了++爷爷的手，向巨大的滑梯奔跑而去，完全没注意到脚下的一滩又一滩++的积++水。那++可++是小文和小明的“[[杰作]]”。周围的人看到眼前的一幕，都[[屏住呼吸]]。他们吓得都忘了提醒小女孩“小心”。"]}, {"pic": "5", "note": "意外发生：小女孩滑倒；老爷爷冲过去扶她（老师补“扶她起来”）", "text": ["果然，当小女孩快要到滑梯底部时，她不小心滑倒了，发出了“啊”的一声++尖叫++。", "老爷爷看到了正在游乐场[[兴致勃勃]]玩水枪的小文和小明，++顿时++明白了一切。他的眉头紧皱，连忙冲向小孙女，抱住了她，++扶她起来，++检查是否受伤了。"]}, {"pic": "6", "note": "图六“？”：老爷爷教训，两人认错道歉，老爷爷原谅（老师补“赶快道歉！”和“而是告诉他们以后要注意”）", "text": ["“你们两个玩水枪的男孩过来看看！因为你们没公德心，在游乐场玩水枪，水洒了一地，我的孙女才滑倒的！++赶快道歉！++”老爷爷向玩水枪的男孩招手，把小文和小明叫过去教训了一顿。小文和小明的脸立刻红了起来，[[不约而同]]地低下头说：“对不起，老爷爷。我们不应该在这里玩水枪！”", "老爷爷看到小文和小明诚恳地道歉了，++并++没有为难他们，++而是告诉他们以后要注意，++就摆摆手离开了。"]}, {"pic": "end", "note": "首尾呼应＋道理", "text": ["虽然这件事已经过去++了++很久，但现在回忆起来++，++还是让我印象深刻。它让我明白了不应该在游乐场喷水，要有[[公德心]]的道理。"]}]}}, "detective": [{"w": "收敛", "t": "敛", "opts": ["敛", "脸", "验"], "ctx": "太阳收□了中午酷热的光芒", "why": "“收敛”是收起来、变弱的意思。“敛”右边是反文旁。“脸”是月字旁（脸蛋），“验”是马字旁（考验）。", "hint": "反文旁"}, {"w": "余晖", "t": "晖", "opts": ["晖", "辉", "挥"], "ctx": "落日的余□透过稀疏的云层洒在公园里", "why": "“余晖”是太阳落山时剩下的光，跟太阳有关，所以是日字旁。“辉”是光辉（光字旁），“挥”是挥手（提手旁）。", "hint": "太阳的光 → 日字旁"}, {"w": "和煦", "t": "煦", "opts": ["煦", "照", "熙"], "ctx": "闪耀着和□的光芒", "why": "“和煦”是温暖的样子，下面四点（灬）是火，表示暖。左上是“日”，右上是“句”。“照”是照射，“熙”是熙熙攘攘。", "hint": "日＋句＋四点"}, {"w": "慈祥", "t": "祥", "opts": ["祥", "详", "样"], "ctx": "如同年长者慈□的微笑", "why": "“慈祥”是和蔼可亲，“祥”是示字旁（吉祥）。“详”是详细（言字旁），“样”是样子（木字旁）。", "hint": "吉祥的祥 → 示字旁"}, {"w": "躲闪", "t": "躲", "opts": ["躲", "朵", "跺"], "ctx": "我来不及□闪，整件上衣都被淋湿了", "why": "“躲”是身字旁，把身体藏起来。“朵”是花朵，“跺”是跺脚（足字旁）。", "hint": "把身体藏起来 → 身字旁"}, {"w": "狼狈", "t": "狈", "opts": ["狈", "贝", "败"], "ctx": "哥哥看到我狼□的样子", "why": "“狼狈”两个字都是反犬旁（传说狼和狈是两种动物）。“贝”是贝壳，“败”是失败（反文旁）。", "hint": "两个字都是反犬旁"}, {"w": "耸了耸肩", "t": "耸", "opts": ["耸", "从", "松"], "ctx": "他们□了□肩说无所谓", "why": "“耸肩”是把肩膀往上提。“耸”上面是“从”，下面是“耳”。只写“从”就不对了，“松”是放松（木字旁）。", "hint": "从＋耳"}, {"w": "杰作", "t": "杰", "opts": ["杰", "洁", "节"], "ctx": "那可是小文和小明的“□作”", "why": "“杰作”是了不起的作品（这里是反话，讽刺他们弄的积水）。“杰”上面是“木”，下面四点。“洁”是干净，“节”是节日。", "hint": "木＋四点"}, {"w": "兴致勃勃", "t": "勃", "opts": ["勃", "脖", "博"], "ctx": "老爷爷看到了正在游乐场兴致□□玩水枪的小文和小明", "why": "“兴致勃勃”是兴趣很浓。“勃”右边是“力”，有力量、很旺盛。“脖”是脖子（月字旁），“博”是博物馆（十字旁）。", "hint": "右边是力"}, {"w": "公德心", "t": "德", "opts": ["德", "得", "待"], "ctx": "因为你们没公□心，在游乐场玩水枪", "why": "“公德心”是在公共场所为别人着想的心。“德”是双人旁，右边是“十、四、一、心”。“得”是得到，“待”是等待。", "hint": "十四一心"}], "audio": {"adv": {"src": "audio/playground-water-gun_adv.mp3", "cues": [["playground-water-gun|adv|start|0", 0.0], ["playground-water-gun|adv|1|0", 12.71], ["playground-water-gun|adv|1|1", 28.18], ["playground-water-gun|adv|2|0", 47.96], ["playground-water-gun|adv|3|0", 68.11], ["playground-water-gun|adv|3|1", 94.08], ["playground-water-gun|adv|4|0", 111.35], ["playground-water-gun|adv|5|0", 151.66], ["playground-water-gun|adv|5|1", 161.14], ["playground-water-gun|adv|6|0", 178.44], ["playground-water-gun|adv|6|1", 207.64], ["playground-water-gun|adv|end|0", 218.46]]}}}, {"id": "hawker-change", "title": "小贩中心忘拿找钱，冤枉了女同学", "cat": "falls", "grade": "P5", "pics": 6, "date": "2025-09-16", "source": "蔡老师朋友圈 · P5 学生高分作文（“这是 P6 水平了”）", "imgs": ["img/S07_change_1.jpg", "img/S07_change_2.jpg", "img/S07_change_3.jpg", "img/S07_change_4.jpg", "img/S07_change_5.jpg", "img/S07_change_6.jpg"], "vocab": ["加班", "小贩中心", "争相竞技", "香气四溢", "应有尽有", "应接不暇", "掩盖", "兴致盎然", "陶醉", "百思不得其解", "左思右想", "误以为", "责问", "撒谎", "尴尬", "内疚", "冤枉", "一心二用"], "drafts": [], "aiNote": "原题的六幅图没有拍到，这里是慧眼按文章内容补画的示意图（第六幅是“？”，要自己想结局），不是考试原图。", "qxNote": "这是蔡老师朋友圈分享的 P5 学生高分作文，小作者还没有写这一篇。", "versions": {"adv": {"label": "范文 · P5 学生高分作文（蔡老师批改）", "words": "700", "info": "蔡老师朋友圈：“来一篇我的 P5 得意门生的高分作文。这是 P6 水平了。”蓝色字＝老师用红笔补上的，划线＝老师改掉的。老师在开头、小贩中心描写、老板叫喊、百思不得其解、女生回答、结尾这几处都打了大勾。", "segments": [{"pic": "1", "note": "开头：时间＋起因（老师打勾）——简洁，一句话交代清楚", "text": ["这是一个很平常的星期六早上，父母都去公司加班了，留给小文五块钱，让他去住家附近的小贩中心吃饭。"]}, {"pic": "2", "note": "小贩中心的场面描写（老师打勾）——“有卖……的，有卖……的，还有……”", "text": ["于是，他决定到那里享用一顿美味的食物。到了小贩中心，只见小贩中心[[热闹非凡]]，各种小吃和美食摊位[[争相竞技，香气四溢]]。这里有卖海南鸡饭的，有卖椰浆饭的，++还有卖日韩套餐++等。总之[[应有尽有，让人应接不暇]]。", "小文沿着小贩中心走了一圈，在众多的食摊中停在鸡饭摊位前，点了一份烧鸡套餐。"]}, {"pic": "3", "note": "埋伏笔：老板喊“找你2元”，小文戴着耳机没听见（老师打勾）——这是后面误会的原因", "text": ["小文一手端着饭菜，一手拿着手机，戴着耳机，开始欣赏着他最喜欢的音乐。", "老板在后面叫喊：“这位同学，找你2元，你没拿！”然而，由于小文的耳朵塞着耳机，音乐的声音[[掩盖]]了老板的呼叫。"]}, {"pic": "4", "note": "边吃边听音乐，完全没发现；老师把错字圈出来：“陶”醉", "text": ["小文走到了一个角落，坐了下来，[[兴致盎然]]地吃着烧鸡饭，完全[[陶醉]]于音乐的旋律中，不经意间，那碗美味的食物已经被他吃了一大半。", "吃着吃着，小文摘下耳机，终于注意到自己的钱包里少了两块钱。他开始感到一些困惑，两块钱到哪里去了？他[[百思不得其解]]。"]}, {"pic": "5", "note": "冲突：误以为女生捡了他的钱，上前责问；女生的回答（老师打勾）", "text": ["正当小文[[左思右想]]时，一位女生弯下了腰，捡起地上的两块钱。小文[[误以为]]女生捡走了他的钱，于是上前[[责问]]她：“为什么捡到我的钱不还给我？”", "女生听了，愣住了。她回应道：“那是我不小心掉在地上的钱，和你有什么关系？”"]}, {"pic": "6", "note": "图六“？”：误会升级 → 老板拿来找钱，真相大白 → 道歉、原谅", "text": ["小文认为女生在[[撒谎]]，试图占有他的钱。他继续坚持自己的立场，而女生坚定地说：“真的不是你的！”", "这时，鸡饭摊位的老板匆匆赶来，把2元递给小文，说：“你误会这++位++女同学了。这才是你的2块钱。”", "听了老~~极~~++板++的话，小文感到很[[尴尬]]和[[内疚]]。他立马跟女生道歉：“对不起，我刚刚太冲动了。”", "女生微笑着对小文说：“没关系，我理解你的情绪。希望你以后可以不要随便[[冤枉]]好人。”"]}, {"pic": "end", "note": "两个道理（老师打勾）", "text": ["这件事教会了小文一个道理：吃饭时不该[[一心二用]]。同时他明白了一个重要的教训，没有证据，不要轻易怀疑~~地~~++他++人。"]}]}}, "detective": [{"w": "加班", "t": "班", "opts": ["班", "斑", "般"], "ctx": "父母都去公司加□了", "why": "“加班”的“班”中间是一点一撇（像刀），两边是“王”。“斑”中间是“文”（斑马），“般”是一般。", "hint": "两个王中间一把刀"}, {"w": "香气四溢", "t": "溢", "opts": ["溢", "益", "谥"], "ctx": "各种小吃和美食摊位争相竞技，香气四□", "why": "“溢”是满出来，所以是三点水。“香气四溢”是香味满得往四面八方飘。“益”没有三点水。", "hint": "满出来 → 三点水"}, {"w": "应接不暇", "t": "暇", "opts": ["暇", "假", "瑕"], "ctx": "总之应有尽有，让人应接不□", "why": "“暇”是空闲的时间，所以是日字旁。“应接不暇”是东西太多来不及看。“假”是假期（单人旁），“瑕”是玉上的斑点（王字旁）。", "hint": "时间 → 日字旁"}, {"w": "掩盖", "t": "掩", "opts": ["掩", "淹", "俺"], "ctx": "音乐的声音□盖了老板的呼叫", "why": "“掩盖”是遮住，用手遮，提手旁。“淹”是淹水（三点水），“俺”是“我”（单人旁）。", "hint": "用手遮住 → 提手旁"}, {"w": "兴致盎然", "t": "盎", "opts": ["盎", "央", "鞅"], "ctx": "□然地吃着烧鸡饭", "why": "“盎然”是很浓、很满的样子。“盎”上面是“央”，下面是“皿”（器皿，装得满满的）。只写“央”少了皿。", "hint": "央＋皿"}, {"w": "陶醉", "t": "陶", "opts": ["陶", "淘", "掏"], "ctx": "完全□醉于音乐的旋律中", "why": "“陶醉”是沉浸在快乐里。“陶”是左耳旁。“淘”是淘米（三点水），“掏”是掏钱（提手旁）。这个字小作者写错了，老师用红笔圈出来改正！", "hint": "左耳旁＋匋"}, {"w": "困惑", "t": "惑", "opts": ["惑", "或", "域"], "ctx": "他开始感到一些困□，两块钱到哪里去了", "why": "“困惑”是想不明白，心里乱，所以下面有“心”。“或”是或者（没有心），“域”是区域（土字旁）。", "hint": "或＋心"}, {"w": "撒谎", "t": "谎", "opts": ["谎", "慌", "荒"], "ctx": "小文认为女生在撒□，试图占有他的钱", "why": "“撒谎”是说假话，跟说话有关，所以是言字旁。“慌”是心慌（竖心旁），“荒”是荒地。老师在这里帮小作者把“谎”字写清楚了。", "hint": "说假话 → 言字旁"}, {"w": "尴尬", "t": "尴", "opts": ["尴", "监", "槛"], "ctx": "听了老板的话，小文感到很□尬和内疚", "why": "“尴尬”两个字都是“尢”字旁（像一个人瘸着腿，站不稳、不自在）。“监”是监视，“槛”是门槛（木字旁）。", "hint": "尢＋监"}, {"w": "冤枉", "t": "冤", "opts": ["冤", "宽", "兔"], "ctx": "希望你以后可以不要随便□枉好人", "why": "“冤”是秃宝盖（冖）下面一只“兔”——兔子被盖住了，跑不出来，很冤。“宽”是宝盖头，“兔”没有盖子。", "hint": "冖＋兔"}], "audio": {"adv": {"src": "audio/hawker-change_adv.mp3", "cues": [["hawker-change|adv|1|0", 0.05], ["hawker-change|adv|2|0", 9.79], ["hawker-change|adv|2|1", 31.54], ["hawker-change|adv|3|0", 40.26], ["hawker-change|adv|3|1", 48.28], ["hawker-change|adv|4|0", 59.55], ["hawker-change|adv|4|1", 72.74], ["hawker-change|adv|5|0", 86.78], ["hawker-change|adv|5|1", 100.89], ["hawker-change|adv|6|0", 108.32], ["hawker-change|adv|6|1", 117.98], ["hawker-change|adv|6|2", 128.12], ["hawker-change|adv|6|3", 137.38], ["hawker-change|adv|end|0", 150.77]]}}}, {"id": "sports-day-late", "title": "运动会迟到", "cat": "falls", "grade": "P5", "pics": 6, "date": "2026-01-16", "source": "学校 · 五年级作文训练一（心理描写——感受）", "imgs": ["img/P07_late_1.jpg", "img/P07_late_2.jpg", "img/P07_late_3.jpg", "img/P07_late_4.jpg", "img/P07_late_5.jpg", "img/P07_late_6.jpg"], "vocab": ["醒来", "迟到", "运动会", "体育场", "跑道", "起跑点", "开始", "责骂"], "drafts": ["img/draft_late_1.jpg", "img/draft_late_2.jpg", "img/draft_late_3.jpg"], "versions": {"qx": {"label": "小作者版 · 学校老师批改", "score": "A", "words": "650", "info": "老师总评：非常棒！你的作文中运用了非常多的好词好句，对人物动作和心理的描写细腻又具体，让读者很容易带入其中。人物的对话也很精彩，每个人说的话都很有道理而且符合人物身份，你小小年纪就可以对人物描写有这么深的理解，难能可贵，看得出你是平时生活中很喜欢观察细节的孩子。每一段之间、每一个场景之间的转化都流畅自然。只是有的时候有一些句子需要思考一下是否符合逻辑。", "segments": [{"pic": "1", "note": "“急得像热锅上的蚂蚁”形容得生动又恰当，好！但根据后面的图片，今天他是要参加运动会——如果从一开始就说他今天要去参加学校运动会会更好", "text": ["一个阳光明媚、鸟~~与~~++语++花香的星期二早上，阳光透过窗户洒进了小明的房间。小明~~懒羊羊~~++懒洋洋++地睁开了眼睛，高兴地想：“多么美好的一天呀！”他看了看时间，[[立刻急得像热锅上的蚂蚁]]。原来，已经七点了，小明上学要迟到了！~~小明~~++他++顾不上吃早餐就直接冲出门外。"]}, {"pic": "2", "note": "你的词语运用非常好，准确又生动，很容易把读者代入到故事中，好！", "text": ["小明[[像离弦的箭一样飞奔向了正要开走的校车]]。他一边跑，一边喊：“司机叔叔，等等我！”不幸的是，司机叔叔没有看见小明，巴士拐了一个弯，[[消失在他的视线中。小明叹了一口气，然后冲向了学校]]。"]}, {"pic": "3", "note": "心理描写，好！“心怦怦直跳”是为什么？紧张？害怕？激动？可以写出来。（慧眼：小作者写的是“砰砰”，心跳要用竖心旁的“怦怦”，石字旁的“砰”是东西撞击的声音）", "text": ["等小明到学校门口时，[[他的心里涌起了一股希望]]。“可能我要参加的运动会还没开始呢！”[[小明心想]]。小明被选中去参加学校一年一度的运动会，今天他会跟一些别的同学比赛跑步。他听见体育馆里[[人声鼎沸]]，他的心~~砰砰~~++怦怦++直跳。"]}, {"pic": "4", "note": "这一段让读者很疑惑——小明是如何进入体育场的？他为什么会气喘吁吁？为什么把手放在膝盖上？是因为准备起跑，还是下车跑去体育馆累的？请在脑海中再思考一下小明的动作流程", "text": ["“啪”的一声，发令枪响了。小明[[气喘吁吁]]地++把++双手放在了膝盖上，[[上气不接下气]]。他知道已经太晚了，比赛选手已经在奔跑了，老师也会来批评他的。"]}, {"pic": "5", "note": "细节满分！老师叫了小明的全名，说明事情很严重了", "text": ["果然，李老师[[火冒三丈]]地走了过来，他[[瞪着眼睛，大声地责骂道]]：“黄小明！你怎么这么晚才来？比赛已经开始了！”小明[[低着头，一句话也说不出来，脸红得像番茄]]。终于，他[[支支吾吾]]地说：“老师，对不起，都怪我早上起得晚，巴士没赶上，所以迟到了。下次++我++再也不会犯同样的错误了，请您原谅我！”"]}, {"pic": "6", "note": "图六“？”：小作者写的结局——老师原谅", "text": ["李老师看着小明诚恳的表情，[[心一软，和颜悦色]]地说：“知错能改，还是好孩子！”说完，他笑了笑，摸了摸小明的头，走开了。"]}, {"pic": "end", "text": ["俗话说：“经一事，长一智。”经过这一件意外，小明发誓，以后再也不会迟到了。"]}]}, "adv": {"label": "范文 · 学校老师版", "words": "900", "info": "学校五年级看图作文一范文《运动会》。重点：心理描写——感受（魂飞魄散、七上八下、六神无主、后悔自责）。原文有几个小笔误（象→像、尽早→今早、怕的→怕得、它→他），这里已经顺手改正。", "segments": [{"pic": "1", "note": "图一：天气描写＋睡过头＋第一时间交代“今天是运动会”", "text": ["天那么蓝，连一丝浮云也没有，[[像蓝水晶一样透明闪亮]]。已经快九点了，阳光从窗外照进了小明的房间里。这时，小明终于睡醒了。他揉了揉眼睛，看了看时钟，才惊觉已经快九点了。他突然想起今天是学校一年一度的运动会，自己代表班级参加一百米的项目，而自己已经快迟到了。小明吓得[[魂飞魄散，冷汗直流，心都要跳出来了]]。他[[像离弦的箭一样]]马上跑到厕所梳洗，换好衣服后，马上冲了出去。"]}, {"pic": "2", "note": "图二：等巴士、坐巴士时的心理——七上八下", "text": ["他边跑，脑海中边不断祈祷着，希望自己绝对不会错过比赛。来到了车站后，小明发现有很多人站在巴士站等巴士，[[每个人的脖子都伸得像鹅一样长]]，他希望巴士能够快点到来。终于，小明要搭乘的巴士来了，他赶紧上了巴士。在巴士上，小明的心怦怦直跳，[[就像十五个吊桶打水——七上八下]]。他[[急得有如热锅上的蚂蚁]]一样，害怕得汗也不停地从额头上冒出来，心里恨不得巴士能够快一点到达。"]}, {"pic": "3", "note": "图三：跑向体育馆，听到比赛要开始了", "text": ["终于，巴士到了体育馆外，小明[[像一阵风似的]]跑向体育馆。他快要跑到体育馆时，便听到体育馆里传来了陈老师的声音。老师正在宣布一百米的比赛就要开始了。小明听了，紧张得[[六神无主]]，冷汗从额头上冒了出来，脸色铁青。他只想马上跑到起跑点。"]}, {"pic": "4", "note": "图四：比赛开始了，自己却赶不上——呆住＋想起原因（前一晚玩电脑游戏）", "text": ["终于，他就要跑到起跑点了。“砰！”的一声，比赛开始了。眼看所有选手都拼命地往前跑，而自己却无法参加了，小明吓得一时之间[[脑子里一片空白，不知所措]]。他呆立在起跑点附近，脸色苍白，汗不停地从额头上冒出来。他想起都是因为自己昨天晚上玩电脑游戏，玩到[[三更半夜]]，今早才会睡不醒。想着老师和同学知道真相后，必定都会[[像火山爆发一样]]，把他给臭骂一顿的情景，小明怕得冷汗直流。"]}, {"pic": "5", "note": "图五：林老师的神态、动作、语言描写", "text": ["这时，林老师发现了迟到的小明，他[[气鼓鼓]]地走着，地板给蹬得“咚咚”响，[[好像地板得罪他似的]]。林老师双手交叉，两道眉毛竖了起来，双眼瞪得大大的，责问小明：“为什么迟到？你明知你今天要代表全班参加一百米竞赛，怎么还会迟到呢！”小明低下了头，小声地回答：“我睡过了头，所以迟到了。对不起老师。”", "林老师气得[[脸一阵红，一阵白]]，他大骂道：“你不是对不起我，你是对不起你自己。同时，你也对不起你的同学。因为你白白浪费了这几天辛苦的训练，还有你也失去了为你班争取荣耀的机会，让同学和自己失望了。”"]}, {"pic": "6", "note": "图六“？”：后悔、自责", "text": ["这时的小明心里感到非常后悔，他的脸上似乎“写满”了[[懊悔与自责]]，心想昨晚自己为什么没有早睡，现在后悔已经来不及了。"]}, {"pic": "end", "text": ["运动会之后，小明带着难过和自责的心情回家了。所谓“经一事，长一智”，经过这一次的教训后，小明学乖了，他再也不敢迟睡了。因为他不希望自己再如此不负责任，再迟到，而影响到自己和大家。"]}]}}, "detective": [{"w": "鸟语花香", "t": "语", "opts": ["语", "与", "雨"], "ctx": "一个阳光明媚、鸟□花香的星期二早上", "why": "“鸟语花香”是鸟儿在“说话”（唱歌）、花儿很香，所以是言字旁的“语”。小作者写成了“与”，老师圈出来了！", "hint": "鸟儿在说话 → 言字旁"}, {"w": "懒洋洋", "t": "洋", "opts": ["洋", "羊", "样"], "ctx": "小明懒□□地睁开了眼睛", "why": "“懒洋洋”是没精神、慢吞吞的样子，用海洋的“洋”（三点水）。小作者写成了“懒羊羊”——那是喜羊羊里的小羊！", "hint": "不是小羊，是三点水"}, {"w": "蚂蚁", "t": "蚁", "opts": ["蚁", "议", "义"], "ctx": "立刻急得像热锅上的蚂□", "why": "“蚂蚁”是小虫子，两个字都是虫字旁。“议”是讨论（言字旁），“义”是义气。", "hint": "小虫子 → 虫字旁"}, {"w": "离弦的箭", "t": "弦", "opts": ["弦", "玄", "炫"], "ctx": "小明像离□的箭一样飞奔向了正要开走的校车", "why": "“弦”是弓上的绳子，所以是弓字旁。箭从弓弦上射出去，飞得特别快。“炫”是炫耀（火字旁）。", "hint": "弓上的绳 → 弓字旁"}, {"w": "视线", "t": "视", "opts": ["视", "试", "示"], "ctx": "巴士拐了一个弯，消失在他的□线中", "why": "“视线”是眼睛看出去的线，“视”是示字旁加“见”。“试”是考试（言字旁），“示”少了“见”。", "hint": "示＋见"}, {"w": "人声鼎沸", "t": "沸", "opts": ["沸", "佛", "拂"], "ctx": "他听见体育馆里人声鼎□", "why": "“沸”是水烧开了，三点水。人声鼎沸就是人声像锅里的水开了一样吵。", "hint": "水开了 → 三点水"}, {"w": "怦怦直跳", "t": "怦", "opts": ["怦", "砰", "抨"], "ctx": "他听见体育馆里人声鼎沸，他的心□□直跳", "why": "心跳用竖心旁的“怦”（心里的感觉）。“砰”是石字旁，是东西撞击、关门的声音，比如“砰的一声”。小作者在这里写成了“砰砰”。", "hint": "心跳 → 竖心旁"}, {"w": "膝盖", "t": "膝", "opts": ["膝", "漆", "滕"], "ctx": "小明气喘吁吁地把双手放在了□盖上", "why": "“膝盖”是身体部位，月字旁。“漆”是油漆（三点水），“滕”是姓。", "hint": "身体 → 月字旁"}, {"w": "番茄", "t": "番", "opts": ["番", "翻", "蕃"], "ctx": "一句话也说不出来，脸红得像□茄", "why": "“番茄”就是西红柿，写“番”（上面是“釆”，下面是“田”）。“翻”是翻书。", "hint": "釆＋田"}, {"w": "支支吾吾", "t": "吾", "opts": ["吾", "语", "悟"], "ctx": "终于，他支支□□地说", "why": "“支支吾吾”是说话吞吞吐吐、说不清楚，“吾”是五加口。“语”是言字旁，“悟”是竖心旁。", "hint": "五＋口"}], "audio": {"qx": {"src": "audio/sports-day-late_qx.mp3", "cues": [["sports-day-late|qx|1|0", 0.0], ["sports-day-late|qx|2|0", 26.79], ["sports-day-late|qx|3|0", 48.09], ["sports-day-late|qx|4|0", 70.84], ["sports-day-late|qx|5|0", 86.68], ["sports-day-late|qx|6|0", 117.69], ["sports-day-late|qx|end|0", 131.31]]}, "adv": {"src": "audio/sports-day-late_adv.mp3", "cues": [["sports-day-late|adv|1|0", 0.05], ["sports-day-late|adv|2|0", 40.24], ["sports-day-late|adv|3|0", 78.62], ["sports-day-late|adv|4|0", 101.97], ["sports-day-late|adv|5|0", 139.9], ["sports-day-late|adv|5|1", 173.67], ["sports-day-late|adv|6|0", 196.07], ["sports-day-late|adv|end|0", 210.0]]}}}, {"id": "group-project", "title": "小组专题作业，我拖到最后没做完", "cat": "falls", "grade": "P5", "pics": 0, "date": "2026-02-10", "source": "学校 · 小五高华情境作文（一） · 2017年PSLE考题", "imgs": [], "vocab": ["人声鼎沸", "叽叽喳喳", "三五成群", "迫不及待", "异口同声", "无精打采", "借口", "信心满满", "支支吾吾", "眼眶", "诚恳", "今日事，今日毕"], "drafts": ["img/draft_proj_1.jpg", "img/draft_proj_2.jpg", "img/draft_proj_3.jpg", "img/draft_proj_4.jpg"], "versions": {"qx": {"label": "小作者版 · 学校老师批改", "score": "S", "words": "750", "info": "题目（2017年PSLE考题）《要成功就必须付出努力》：你和几个同学一起做一个专题作业，由于你没有付出太大的努力，结果没有取得成功。你从这件事中得到了宝贵的教训。｜老师在评分标准里把“内容”和“表达”都圈在“上（17–20）”。老师总评：非常棒的一篇文章！首先，你对题目的理解非常到位，故事情节设计得也非常合理。其次，和别的同学相比，你有一个很大的优点：你善于利用人物的心理、别人的语言、环境的描写来铺垫，虽然没有直接说出发生什么，但是读者完全能够感受到当时的气氛和人物的心理，这是非常了不起的技能，看得出你的语言能力很高。另外，你运用了非常多的好词好句，让你的文章生动活泼有趣，尤其是开头和结尾，简直是点睛之笔。这是一篇无可挑剔的好文章，加油！做得很好！", "segments": [{"pic": "start", "note": "非常好！通过侧面的描写交代了活动的背景和内容，很新颖", "text": ["一个风和日丽、鸟语花香的星期四早上，阳光透过教室的窗户洒了进来。此时，[[教室里人声鼎沸，热闹非凡。课室里仿佛飞进了一群叽叽喳喳的小鸟]]，同学们三五成群地聚在一起，你一言我一语地讨论着老师上个星期介绍的一个特别有趣的活动。大家都必须要组四到五个人的队，然后每一组需要设计一个密室逃脱的专题作业。我和小明、小安和小丁组成了一队。"]}, {"pic": "1", "label": "分工", "note": "很好，通过组长的口吻交代了工作分配；通过人物的心理描写写出了“我”对这件事的态度", "text": ["“好，我来做第一关。小安，你来做第二关；小丁，你来做第三关；小红，你做最后一关，也是最关键的一关。大家回家可以到网上搜索资料。”[[小明，我们组的队长迫不及待地说]]。“好！”[[我们三个人异口同声地同意道]]。", "放学回到家后，我想起要到网上搜索密室逃脱的资料。++可是刚++在网上[[无精打采]]地搜了五分钟后，我++就++想：[[还是明天做吧，反正还有时间]]。"]}, {"pic": "2", "label": "拖延", "note": "详略得当", "text": ["[[又过了好几天，我一直用“还有时间”的借口不做完我应该做的任务。]]"]}, {"pic": "3", "label": "上台", "note": "好棒啊！非常真实！很棒，通过对同学们的描写写出了紧张的气氛", "text": ["终于，要把小组作业分享给全班同学的日子到了。当别的小组介绍++自己制作的作品++的时候，[[小明小声地对我们说：“大家准备好了吗？”小丁和小安都++满满++信心地点了点头]]。小明看向我：“你呢，小红？你不会没做吧？”[[我的脸“刷”地一下红到了脖子根。]]", "这时，老师把我们组叫上了讲台。等小明、小安和小丁讲完自己该讲的部分以后，[[全班同学的目光都落到了我身上]]。++我迟迟不开口，++[[一双双眼睛疑惑地看着我]]。[[我支支吾吾地说]]：“我……我……没做完我该做的任务。”[[我的组员惊讶地看着我，嘴巴张得大大的，仿佛能塞进一个鸡蛋]]。"]}, {"pic": "4", "label": "挨批·认错", "note": "非常好，生动有趣。（老师圈出来的字：你们~~都~~组、“诚恳”写成了“沉恳”）", "text": ["老师严肃地大声说：“王小红，你为什么没有完成任务？因为你，你们~~都~~组会得到很低的分数！”++听完老师的话，++[[我的心像被石头压住一样沉重，眼泪在眼眶里打转，最终忍不住流了下来]]。“对不起老师和大家，我让你们失望了。请您原谅我！”[[老师看着我脸上露出~~沉~~++诚++恳的表情，心一软，和颜悦色地说]]：“知错能改，还是好孩子！”"]}, {"pic": "end", "text": ["[[俗话说：“经一事，长一智。”]]经过这一次意外后，我暗暗发誓，以后再也不会拖时间、不认真做完任务了，[[要养成“今日事，今日毕”的好习惯]]。"]}]}}, "detective": [{"w": "鼎沸", "t": "鼎", "opts": ["鼎", "顶", "丁"], "ctx": "此时，教室里人声□沸，热闹非凡", "why": "“鼎”是古代煮东西的大锅，下面像锅的脚。“人声鼎沸”就是人声像锅里的水烧开了一样吵。", "hint": "古代大锅"}, {"w": "叽叽喳喳", "t": "喳", "opts": ["喳", "渣", "查"], "ctx": "课室里仿佛飞进了一群叽叽□□的小鸟", "why": "“喳”是鸟叫声，口字旁。“渣”是渣滓（三点水），“查”是检查。", "hint": "声音 → 口字旁"}, {"w": "密室逃脱", "t": "脱", "opts": ["脱", "说", "锐"], "ctx": "然后每一组需要设计一个密室逃□的专题作业", "why": "“脱”是月字旁（脱衣服、脱身）。“说”是言字旁，“锐”是金字旁。", "hint": "月字旁＋兑"}, {"w": "无精打采", "t": "采", "opts": ["采", "彩", "菜"], "ctx": "可是刚在网上无精打□地搜了五分钟后", "why": "“无精打采”的“采”是精神、神采，没有三撇。“彩”是颜色（有三撇），“菜”是青菜。", "hint": "没有三撇"}, {"w": "借口", "t": "借", "opts": ["借", "措", "惜"], "ctx": "我一直用“还有时间”的□口不做完我应该做的任务", "why": "“借口”是找理由，“借”是单人旁。“措”是提手旁，“惜”是竖心旁（可惜）。", "hint": "单人旁＋昔"}, {"w": "脖子", "t": "脖", "opts": ["脖", "勃", "渤"], "ctx": "我的脸“刷”地一下红到了□子根", "why": "“脖子”是身体部位，月字旁。“勃”是兴致勃勃（右边是力），“渤”是渤海。", "hint": "身体 → 月字旁"}, {"w": "疑惑", "t": "疑", "opts": ["疑", "凝", "拟"], "ctx": "一双双眼睛□惑地看着我", "why": "“疑惑”是不明白、想问。“凝”是两点水（凝固），“拟”是提手旁（模拟）。", "hint": "没有偏旁的疑"}, {"w": "眼眶", "t": "眶", "opts": ["眶", "框", "筐"], "ctx": "眼泪在眼□里打转，最终忍不住流了下来", "why": "“眼眶”是眼睛周围，目字旁。“框”是框子（木字旁），“筐”是竹筐（竹字头）。", "hint": "眼睛 → 目字旁"}, {"w": "诚恳", "t": "诚", "opts": ["诚", "沉", "城"], "ctx": "老师看着我脸上露出□恳的表情", "why": "“诚恳”是真心实意，说话真心，所以是言字旁。小作者写成了“沉”，老师圈出来了！", "hint": "真心的话 → 言字旁"}, {"w": "今日事，今日毕", "t": "毕", "opts": ["毕", "比", "必"], "ctx": "要养成“今日事，今日□”的好习惯", "why": "“毕”是完成、结束（毕业）。上面是“比”，下面是“十”。只写“比”就不对了。", "hint": "比＋十"}], "kind": "情境作文", "audio": {"qx": {"src": "audio/group-project_qx.mp3", "cues": [["group-project|qx|start|0", 0.0], ["group-project|qx|1|0", 40.17], ["group-project|qx|1|1", 62.28], ["group-project|qx|2|0", 77.31], ["group-project|qx|3|0", 84.7], ["group-project|qx|3|1", 109.24], ["group-project|qx|4|0", 135.95], ["group-project|qx|end|0", 175.89]]}}}, {"id": "classroom-basketball", "title": "课室里打篮球，砸到了校长", "cat": "falls", "grade": "P5", "pics": 0, "date": "2026-04-09", "source": "学校 · 高华作文（完成文章）", "imgs": [], "vocab": ["手忙脚乱", "越玩越起劲", "优美的弧线", "不偏不倚", "滴溜溜", "凝固", "塞下一个鸡蛋", "脸色铁青", "耷拉", "忐忑不安", "语重心长", "可有可无"], "drafts": ["img/draft_bball_1.jpg", "img/draft_bball_2.jpg", "img/draft_bball_3.jpg", "img/draft_bball_4.jpg"], "versions": {"qx": {"label": "小作者版 · 学校老师批改", "score": "A", "words": "750", "info": "题型：完成文章。题目给出的开头：一天早上，小明和大华在课室里玩篮球。他们把球抛来抛去，玩得非常开心。这时，黄老师朝课室走了过来……｜老师总评：这篇文章唯一的小瑕疵就是开头没有按照高华作文的要求去写。无论是你对人物的描写、语言的刻画还是故事内容的理解，都让老师惊叹：一个五年级的小朋友怎么可以把事情用这么精准的词语描述出来。从方方面面，老师能够感受到你在写作文时的用心：每一次人物的对话，你都有身临其境去思考人物心理、人物的语言以及动作和表情，才会使得最后的表达如此的流畅、自然、一致。而且几篇文章看来，你非常善于通过侧面的描写来推进故事，这点许多学习作文多年的小朋友都无法达到。加油！不要灰心，你的作文水准真的堪称一流。", "segments": [{"pic": "start", "label": "题目开头", "note": "朋友，你理解错了，“完成文章”的意思就是用已经给出的部分当作文章的开头继续写下去，不要另外再重新开头。（小作者重写的开头被老师划掉了，划掉的部分保留在这里，提醒自己）", "text": ["一天早上，小明和大华在课室里玩篮球。他们把球抛来抛去，玩得非常开心。这时，黄老师朝课室走了过来……", "~~那是一个晴朗的、凉风习习的早上，微风从窗外轻轻吹进了教室，窗帘随风摆动，显得格外宁静。大华和小明走进了教室，叽叽喳喳地聊天。一到座位，大华就放下书包，往里面摸索着，不一会儿，他掏出来一个小篮球，眉开眼笑地说：“来，我教你打篮球吧！”小明点了点头，满脸期待。因为他们即将参加一个和孤儿一起玩游戏的活动，小明却不会打篮球，作为好朋友的大华便自告奋勇，决定趁早上没人时教他。~~"]}, {"pic": "1", "label": "玩球·意外", "note": "生动活泼；“就在这时”连接词很好；“滴溜溜地打转”好棒的描写！！", "text": ["“接住！”大华把球轻轻一抛，小明[[手忙脚乱]]地接住了，差点掉在地上。两人[[越玩越起劲，笑声在空荡荡的教室里回荡]]。渐渐地，小明++对抛接篮球++越来越有信心。[[他深吸了一口气，用力一投，篮球在空中划出一道优美的弧线]]。[[就在这时]]，教室门“吱呀”一声被推开了，黄老师走了进来。她是校长，正在巡视++校园++，想看看为什么教室里这么吵闹。[[可是，这一切发生得太突然了]]，小明还来不及反应，意外就发生了！", "“呼！”篮球[[不偏不倚]]地砸到了校长的头上，又弹了回去，[[落到了大华脚边，++滴溜溜地打转++]]。[[空气瞬间凝固了]]，小明和大华++心跳加速，++瞪大了眼睛，嘴巴张得大大的，仿佛能塞下一个鸡蛋。校长脸色铁青，眉头紧锁，语气严厉地责问：“你们为什么在教室里玩球？不知道这样很危险，++是违反校规的++吗？！”"]}, {"pic": "2", "label": "认错·解释", "note": "很好，故事性+1，合理化了他们为什么“打篮球”；人物表情描写，非常好！", "text": ["[[小明耷拉着小脑袋，脸上泛起两片红云，声音颤抖地说]]：“对……对不起，黄老师，我们不是故意的。”大华也赶紧解释道：[[“我们要参加一个和孤儿一起玩游戏的活动，可是小明不会打篮球，所以我才教他。”]]说完，[[两人忐忑不安地站在原地]]，眼睛看着自己的鞋子，不敢抬头。", "[[校长听了，神情渐渐地缓和下来。她叹了一口气，语重心长地说]]：“你们有这份心去帮助别人是值得表扬的。但，教室不是玩球的地方，这样很危险，可能会打到别人，++让别人受伤++。”小明和大华用力地点点头，异口同声地说：“我们知道错了，以后不会在课室里玩篮球了。”黄老师看到两人诚恳的表情，心一软，说：“知错能改，还是好孩子。”"]}, {"pic": "end", "text": ["俗话说：“经一事，长一智。”经过这次意外，小明和大华明白了校规并不是可有可无的，而是为了保护学校的设施和师生的安全而精心设立的，每个学生都应该严格遵守，做遵守校规的好学生。"]}]}}, "detective": [{"w": "手忙脚乱", "t": "忙", "opts": ["忙", "忘", "芒"], "ctx": "小明手□脚乱地接住了，差点掉在地上", "why": "“忙”是竖心旁加“亡”，心里着急。“忘”是心字底（忘记），“芒”是草字头（光芒）。", "hint": "竖心旁＋亡"}, {"w": "弧线", "t": "弧", "opts": ["弧", "孤", "狐"], "ctx": "篮球在空中划出一道优美的□线", "why": "“弧”是弓字旁，像拉开的弓那样弯弯的线。“孤”是孤儿（子字旁），“狐”是狐狸（反犬旁）。", "hint": "弯弯的 → 弓字旁"}, {"w": "孤儿", "t": "孤", "opts": ["孤", "弧", "狐"], "ctx": "我们要参加一个和□儿一起玩游戏的活动", "why": "“孤儿”是没有父母的孩子，所以是子字旁。", "hint": "孩子 → 子字旁"}, {"w": "巡视", "t": "巡", "opts": ["巡", "训", "循"], "ctx": "她是校长，正在□视校园", "why": "“巡视”是到处走走看看，走之旁加“巛”。“训”是训话（言字旁），“循”是遵循（双人旁）。", "hint": "走来走去 → 走之旁"}, {"w": "不偏不倚", "t": "倚", "opts": ["倚", "椅", "骑"], "ctx": "篮球不偏不□地砸到了校长的头上", "why": "“不偏不倚”是正正好好，不歪向任何一边，“倚”是单人旁。“椅”是椅子（木字旁），“骑”是骑车（马字旁）。", "hint": "单人旁＋奇"}, {"w": "凝固", "t": "凝", "opts": ["凝", "疑", "拟"], "ctx": "空气瞬间□固了", "why": "“凝固”是变硬、不动了，两点水（和冰有关）。“疑”没有偏旁，“拟”是提手旁。", "hint": "像结冰 → 两点水"}, {"w": "耷拉", "t": "耷", "opts": ["耷", "答", "塔"], "ctx": "小明□拉着小脑袋，脸上泛起两片红云", "why": "“耷拉”是垂下来，上面“大”下面“耳”——大耳朵垂下来。“答”是竹字头，“塔”是土字旁。", "hint": "大＋耳"}, {"w": "颤抖", "t": "颤", "opts": ["颤", "擅", "檀"], "ctx": "声音□抖地说", "why": "“颤抖”是发抖，右边是“页”（和头有关）。“擅”是提手旁（擅长），“檀”是木字旁。", "hint": "亶＋页"}, {"w": "忐忑不安", "t": "忐", "opts": ["忐", "志", "态"], "ctx": "两人□忑不安地站在原地", "why": "“忐忑”是心里上上下下不安定，两个字都是“心”在下面：忐＝上＋心，忑＝下＋心。", "hint": "上＋心"}, {"w": "遵守", "t": "遵", "opts": ["遵", "尊", "樽"], "ctx": "每个学生都应该严格□守", "why": "“遵守”是照着做，走之旁（跟着走）。“尊”是尊敬，没有走之旁。", "hint": "跟着走 → 走之旁"}], "kind": "完成文章", "audio": {"qx": {"src": "audio/classroom-basketball_qx.mp3", "cues": [["classroom-basketball|qx|start|0", 0.05], ["classroom-basketball|qx|1|0", 12.18], ["classroom-basketball|qx|1|1", 55.61], ["classroom-basketball|qx|2|0", 87.85], ["classroom-basketball|qx|2|1", 114.28], ["classroom-basketball|qx|end|0", 149.91]]}}}, {"id": "help-newspaper-man", "title": "上学路上帮报贩捡报纸，迟到了", "cat": "bonds", "grade": "P5", "pics": 6, "date": "2026-03-10", "source": "学校 · 五年级作文训练六《一件好事》（心理描写）", "imgs": ["img/P08_good_1.jpg", "img/P08_good_2.jpg", "img/P08_good_3.jpg", "img/P08_good_4.jpg", "img/P08_good_5.jpg", "img/P08_good_6.jpg"], "vocab": ["报贩", "失去平衡", "摔倒", "报纸", "散落满地", "叠起来", "称赞", "迟到"], "drafts": [], "aiNote": "这一题只有题目和图片，课件里没有范文，小作者也还没有写。下面是慧眼模仿老师范文的写法写的仿写范文，重点放在这一课要练的“心理描写”：帮还是不帮的挣扎、迟到时的忐忑、被表扬时的心情。", "versions": {"adv": {"label": "慧眼仿写 · 范文", "words": "850", "info": "仿写范文（非老师原文）。写作重点：心理描写——①看到报贩摔倒时，“帮还是不帮”的内心挣扎；②走进课室时的忐忑；③被老师称赞时的心情。第六幅“？”的结局：说明原因、老师称赞。", "segments": [{"pic": "1", "note": "图一：时间、人物、地点；起床晚了，赶着上学（为后面“迟到”埋伏笔）", "text": ["一个很平常的星期一早上，天空灰蒙蒙的，好像随时都会下雨。闹钟响了好几遍，我才迷迷糊糊地从床上爬起来。一看时间，糟了！已经七点零五分了。我[[匆匆忙忙]]地刷牙洗脸，抓起书包就冲出了家门。", "我一边快步穿过组屋楼下，一边在心里默默计算：“只要不停下来，七点二十分之前应该还能赶到学校。”"]}, {"pic": "2", "note": "图二：报贩失去平衡摔倒，报纸散落满地——用拟声词和动作描写写出意外", "text": ["就在我经过路口的时候，突然听到“砰”的一声巨响。我循声望去，只见一位送报纸的报贩叔叔连人带车摔倒在地上。原来，他的脚踏车后座绑着一大叠报纸，转弯时车轮压到一块石头，整辆车一下子[[失去了平衡]]。报纸从车上滑了下来，被风一吹，[[散落满地]]，有几张还在空中打着转儿。", "叔叔趴在地上，[[痛苦地皱着眉头]]，一只手揉着膝盖，好半天都爬不起来。"]}, {"pic": "3", "note": "图三：心理描写的重点——帮还是不帮的挣扎（两个声音在心里吵架），最后决定帮忙", "text": ["我停下了脚步，心里[[像十五个吊桶打水——七上八下]]。一个声音在心里说：“快走吧！再不走就真的要迟到了，老师一定会批评你的！”另一个声音却说：“叔叔受伤了，报纸被风吹走，他今天的工作就白做了。你怎么能[[袖手旁观]]呢？”", "我看了看手表，又看了看叔叔着急的样子，咬了咬牙：“迟到就迟到吧，帮人要紧！”想到这里，我[[三步并作两步]]跑过去，先把叔叔扶起来，再把倒在一旁的脚踏车推到路边。接着，我蹲下身子，把散落在地上的报纸一张一张捡起来，抖掉上面的沙子，再[[整整齐齐]]地叠起来。不一会儿，报纸就重新堆成了一叠。"]}, {"pic": "4", "note": "图四：报贩道谢、挥手告别；“我”心里暖暖的，但又想起要迟到了", "text": ["叔叔接过报纸，脸上露出了感激的笑容：“小朋友，真是太谢谢你了！要不是你，我今天的报纸就送不完了。”我笑着摇摇头说：“不用谢，叔叔，您骑车小心！”叔叔骑上脚踏车，回过头向我挥了挥手，我也向他挥手告别。", "看着叔叔渐渐远去的背影，我心里[[暖洋洋]]的。可是，低头一看手表——七点三十五分！我心里“咯噔”一下，连忙拔腿就往学校跑。"]}, {"pic": "5", "note": "图五：走进课室，老师在黑板上写“作文”——迟到时的忐忑不安", "text": ["等我[[气喘吁吁]]地跑到课室门口时，第一节课已经开始了。华文老师正在黑板上写着“作文”两个大字，同学们都坐得端端正正。我站在门口，[[手心直冒冷汗]]，心怦怦直跳：老师会不会骂我？同学们会不会笑我？", "老师转过头来，看见了我，皱了皱眉头，问：“你怎么迟到了？”我低着头，[[支支吾吾]]地说：“对……对不起，老师。我在路上看到一位送报纸的叔叔摔倒了，就帮他把报纸捡起来……”"]}, {"pic": "6", "note": "图六“？”：自己想结局——老师了解原因后称赞，全班鼓掌", "text": ["老师听了，原本严肃的脸上慢慢露出了笑容。她走到我身边，拍了拍我的肩膀，对全班同学说：“同学们，迟到是不对的，可是今天这位同学是为了帮助别人才迟到的。他没有袖手旁观，而是主动伸出援手，这种乐于助人的精神值得大家学习！”话音刚落，课室里就响起了一阵热烈的掌声。", "听到老师的[[称赞]]，我的脸一下子红了，心里却[[像吃了蜜一样甜]]。刚才的紧张和害怕，一下子都[[烟消云散]]了。"]}, {"pic": "end", "note": "结尾：名句＋道理＋以后怎么做（不只要帮人，也要早点出门）", "text": ["俗话说：“[[赠人玫瑰，手有余香]]。”这件事让我明白：帮助别人，不仅能给别人带来温暖，也能让自己收获快乐。不过，我也提醒自己，以后一定要早点起床、早点出门。这样，在路上遇到需要帮忙的人时，我就可以既帮助别人，又不会迟到了。"]}]}}, "detective": [{"w": "报贩", "t": "贩", "opts": ["贩", "饭", "反"], "ctx": "只见一位送报纸的报□叔叔连人带车摔倒在地上", "why": "“报贩”是卖报纸的人，做买卖和钱有关，所以是贝字旁。“饭”是食字旁。", "hint": "做买卖 → 贝字旁"}, {"w": "失去平衡", "t": "衡", "opts": ["衡", "横", "恒"], "ctx": "整辆车一下子失去了平□", "why": "“平衡”的“衡”外面是“行”，中间是“鱼＋大”的变形。题目的参考词语里特别给了拼音。", "hint": "外面是行"}, {"w": "摔倒", "t": "摔", "opts": ["摔", "率", "蟀"], "ctx": "叔叔连人带车□倒在地上", "why": "“摔”是提手旁加“率”。“率”是效率，“蟀”是蟋蟀（虫字旁）。", "hint": "提手旁＋率"}, {"w": "散落满地", "t": "散", "opts": ["散", "撒", "敢"], "ctx": "被风一吹，□落满地", "why": "“散”是分开、到处都是，右边是反文旁。“撒”是撒东西（提手旁），“敢”是勇敢。", "hint": "没有提手旁"}, {"w": "膝盖", "t": "膝", "opts": ["膝", "漆", "滕"], "ctx": "一只手揉着□盖，好半天都爬不起来", "why": "“膝盖”是身体部位，月字旁。", "hint": "身体 → 月字旁"}, {"w": "袖手旁观", "t": "袖", "opts": ["袖", "抽", "油"], "ctx": "你怎么能□手旁观呢", "why": "把手放在袖子里站在旁边看，不帮忙。袖子是衣服，所以是衣字旁。", "hint": "衣字旁"}, {"w": "叠起来", "t": "叠", "opts": ["叠", "蝶", "碟"], "ctx": "再整整齐齐地□起来", "why": "“叠”是一层一层放上去，上面三个“又”，下面是“宜”的变形。“蝶”是蝴蝶，“碟”是碟子。", "hint": "三个又堆起来"}, {"w": "背影", "t": "影", "opts": ["影", "景", "彭"], "ctx": "看着叔叔渐渐远去的背□", "why": "“影”是“景”加三撇（光照出来的影子）。只写“景”少了三撇。", "hint": "景＋三撇"}, {"w": "支支吾吾", "t": "吾", "opts": ["吾", "语", "悟"], "ctx": "我低着头，支支□□地说", "why": "“支支吾吾”是说话吞吞吐吐，“吾”是五加口。", "hint": "五＋口"}, {"w": "称赞", "t": "赞", "opts": ["赞", "攒", "钻"], "ctx": "听到老师的称□，我的脸一下子红了", "why": "“称赞”的“赞”上面两个“先”，下面是“贝”。“攒”是攒钱（提手旁）。", "hint": "两个先＋贝"}], "audio": {"adv": {"src": "audio/help-newspaper-man_adv.mp3", "cues": [["help-newspaper-man|adv|1|0", 0.05], ["help-newspaper-man|adv|1|1", 21.74], ["help-newspaper-man|adv|2|0", 31.25], ["help-newspaper-man|adv|2|1", 60.87], ["help-newspaper-man|adv|3|0", 68.18], ["help-newspaper-man|adv|3|1", 89.12], ["help-newspaper-man|adv|4|0", 118.32], ["help-newspaper-man|adv|4|1", 139.06], ["help-newspaper-man|adv|5|0", 153.04], ["help-newspaper-man|adv|5|1", 176.3], ["help-newspaper-man|adv|6|0", 194.31], ["help-newspaper-man|adv|6|1", 224.49], ["help-newspaper-man|adv|end|0", 236.24]]}}}, {"id": "pepper-burger-prank", "title": "在汉堡包里撒胡椒粉，捉弄错了人", "cat": "falls", "grade": "P5", "pics": 6, "date": "2026-10-20", "source": "学校 · 五年级作文练习（SA2 2022 第二题）", "imgs": ["img/P09_pepper_1.jpg", "img/P09_pepper_2.jpg", "img/P09_pepper_3.jpg", "img/P09_pepper_4.jpg", "img/P09_pepper_5.jpg", "img/P09_pepper_6.jpg"], "vocab": ["快餐店", "包装袋", "恶作剧", "撒胡椒粉", "咳嗽", "哈哈大笑", "火冒三丈", "到底"], "drafts": [], "aiNote": "这是 SA2 练习卷的第二题，只有图片和参考词语，没有范文，小作者也还没有写这一题。下面是慧眼模仿老师范文写的仿写范文。（同一张卷子的第一题是命题作文《这件事让我学会了准时》）", "versions": {"adv": {"label": "慧眼仿写 · 范文", "words": "850", "info": "仿写范文（非老师原文）。考试 50 分钟、40 分。参考词语全部用上：快餐店、包装袋、恶作剧、撒胡椒粉、咳嗽、哈哈大笑、火冒三丈、到底。写作重点：图三的“坏主意”心理、图四的反转（吃到的不是哥哥，而是爸爸）、图五妈妈出现后的气氛、第六幅“？”的认错结局。", "segments": [{"pic": "1", "note": "图一：时间、人物、起因——哥哥放学后在快餐店买汉堡包", "text": ["一个炎热的星期五下午，哥哥放学后，[[饥肠辘辘]]地走进学校附近的快餐店。他看着墙上色香味俱全的汉堡包图片，忍不住咽了咽口水，马上点了一份他最爱吃的鸡肉汉堡包。店员把汉堡包装进印着汉堡图案的包装袋里，笑着递给他。哥哥接过袋子，[[兴高采烈]]地往家里走去。"]}, {"pic": "2", "note": "图二：哥哥把汉堡包放在桌上就去洗澡；弟弟小明躲在一旁偷笑——“坏主意”冒出来", "text": ["回到家，哥哥把包装袋往饭桌上一放，说：“热死了，我先去冲凉，回来再慢慢吃！”说完，便背着书包走进了房间。", "这一切都被躲在客厅角落的小明看在眼里。他眼珠子骨碌碌一转，一个[[恶作剧]]的念头从脑海里冒了出来：“哥哥前几天把我的漫画书弄破了，还不肯道歉。今天，我一定要好好捉弄他一下！”想到这里，他忍不住捂着嘴偷偷笑了起来。"]}, {"pic": "3", "note": "图三：撒胡椒粉——动作描写（蹑手蹑脚、打开、撒、合上）＋得意的心理", "text": ["小明[[蹑手蹑脚]]地走进厨房，从柜子里拿出一大瓶胡椒粉，又悄悄回到饭桌旁。他小心翼翼地打开包装袋，掀开汉堡包上面的面包，然后拿起胡椒粉瓶子，在鸡肉上[[撒胡椒粉]]，撒了一层又一层，直到鸡肉都变成了灰色。最后，他把面包盖好，把汉堡包放回袋子里，一切看起来就像[[什么事都没有发生过]]一样。", "小明得意洋洋地想：“哈哈，等一下哥哥咬一口，一定会辣得跳起来！”"]}, {"pic": "4", "note": "图四：反转——吃汉堡包的竟然是刚下班的爸爸！咳嗽的描写＋小明忍不住哈哈大笑", "text": ["谁知，没过多久，门“咔嚓”一声开了。走进来的不是哥哥，而是刚下班的爸爸！爸爸工作了一整天，又累又饿，一眼就看到了桌上的汉堡包。他以为是给自己买的，二话不说，拿起来就大大地咬了一口。", "下一秒，爸爸的脸一下子涨得通红，接着便“咳咳咳”地[[咳嗽]]起来，咳得眼泪都流出来了，嘴里的面包屑喷得到处都是。躲在门边的小明看到这一幕，先是一愣，随后再也忍不住，捂着肚子[[哈哈大笑]]起来。"]}, {"pic": "5", "note": "图五：爸爸火冒三丈，妈妈闻声赶来——小明的笑声停住了", "text": ["听到笑声，爸爸猛地转过头来，看见笑得前仰后合的小明，马上就明白了是怎么回事。他把汉堡包往桌上一放，[[火冒三丈]]地吼道：“小明！这[[到底]]是怎么回事？是不是你搞的鬼？”", "妈妈听到吵闹声，也从房间里走了出来。她看看满脸通红的爸爸，又看看桌上撒满胡椒粉的汉堡包，眉头一下子皱了起来。小明的笑声戛然而止，他低下头，双手不安地搓着衣角，心里[[七上八下]]的。"]}, {"pic": "6", "note": "图六“？”：自己想结局——认错、道歉、弥补（给哥哥买新的汉堡包）", "text": ["小明知道自己闯了祸，终于鼓起勇气，吞吞吐吐地说：“爸爸，对不起……我本来只是想捉弄哥哥，没想到您会吃……”爸爸喝了好几口水，才慢慢缓过气来。他严肃地说：“恶作剧也要有分寸！胡椒粉吃多了会呛到，万一呛进气管，后果不堪设想！”妈妈也在一旁说：“兄弟之间有不开心，应该好好沟通，而不是用这种方法报复。”", "这时，洗完澡的哥哥走了出来，听说了事情的经过，又好气又好笑。小明满脸通红，向爸爸和哥哥认真地道了歉，还主动拿出自己的零用钱，说要给哥哥买一个新的汉堡包。爸爸看到小明诚心认错，脸色这才缓和下来。"]}, {"pic": "end", "note": "结尾：名句＋道理＋以后怎么做", "text": ["俗话说：“[[害人终害己]]。”这件事让小明明白，恶作剧虽然一时好玩，却可能伤害别人，让自己后悔莫及。从那以后，他再也不敢随便捉弄别人了；和哥哥有不愉快时，他也学会了心平气和地把话说清楚。"]}]}}, "detective": [{"w": "快餐店", "t": "餐", "opts": ["餐", "参", "惨"], "ctx": "哥哥放学后，饥肠辘辘地走进学校附近的快□店", "why": "“餐”是吃饭，下面是“食”。“参”是参加，“惨”是悲惨（竖心旁）。", "hint": "下面是食"}, {"w": "包装袋", "t": "袋", "opts": ["袋", "代", "贷"], "ctx": "店员把汉堡包装进印着汉堡图案的包装□里", "why": "“袋”是用布做的口袋，下面是“衣”。“代”是代替，“贷”是贷款（下面是贝）。", "hint": "代＋衣"}, {"w": "恶作剧", "t": "剧", "opts": ["剧", "据", "居"], "ctx": "一个恶作□的念头从脑海里冒了出来", "why": "“剧”是戏剧、闹剧，右边是立刀。“据”是根据（提手旁），“居”是居住。", "hint": "居＋立刀"}, {"w": "蹑手蹑脚", "t": "蹑", "opts": ["蹑", "摄", "慑"], "ctx": "小明□手□脚地走进厨房", "why": "走路轻轻的，所以是足字旁。", "hint": "走路 → 足字旁"}, {"w": "撒胡椒粉", "t": "撒", "opts": ["撒", "散", "洒"], "ctx": "然后拿起胡椒粉瓶子，在鸡肉上□胡椒粉", "why": "“撒”是用手把东西撒出去，提手旁。“洒”是洒水（三点水），“散”是散开。", "hint": "用手 → 提手旁"}, {"w": "胡椒", "t": "椒", "opts": ["椒", "叔", "淑"], "ctx": "从柜子里拿出一大瓶胡□粉", "why": "“胡椒”是植物的果实，所以是木字旁。“叔”是叔叔，“淑”是三点水。", "hint": "植物 → 木字旁"}, {"w": "咳嗽", "t": "嗽", "opts": ["嗽", "漱", "敕"], "ctx": "接着便“咳咳咳”地咳□起来", "why": "“咳嗽”是从嘴里发出的声音，两个字都是口字旁。“漱”是漱口（三点水）。", "hint": "口字旁"}, {"w": "火冒三丈", "t": "冒", "opts": ["冒", "帽", "昌"], "ctx": "火□三丈地吼道", "why": "“冒”上面是“冃”（不封口），下面是“目”。“帽”是帽子（巾字旁）。", "hint": "上面不封口"}, {"w": "戛然而止", "t": "戛", "opts": ["戛", "夏", "嘎"], "ctx": "小明的笑声□然而止", "why": "“戛然而止”是声音突然停下。“戛”下面是“戈”（像武器一刀切断）。“夏”是夏天，“嘎”是口字旁。", "hint": "下面是戈"}, {"w": "不堪设想", "t": "堪", "opts": ["堪", "湛", "勘"], "ctx": "万一呛进气管，后果不□设想", "why": "“不堪设想”是后果严重得不敢想。“堪”是土字旁。", "hint": "土字旁＋甚"}], "audio": {"adv": {"src": "audio/pepper-burger-prank_adv.mp3", "cues": [["pepper-burger-prank|adv|1|0", 0.05], ["pepper-burger-prank|adv|2|0", 27.49], ["pepper-burger-prank|adv|2|1", 38.98], ["pepper-burger-prank|adv|3|0", 62.51], ["pepper-burger-prank|adv|3|1", 94.91], ["pepper-burger-prank|adv|4|0", 101.61], ["pepper-burger-prank|adv|4|1", 122.04], ["pepper-burger-prank|adv|5|0", 142.05], ["pepper-burger-prank|adv|5|1", 161.05], ["pepper-burger-prank|adv|6|0", 183.96], ["pepper-burger-prank|adv|6|1", 221.84], ["pepper-burger-prank|adv|end|0", 245.17]]}}}, {"id": "psle2012-cn", "title": "在学校主办的一项活动中，发生了一件意想不到的事", "cat": "whoops", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2012 华文 · 试卷一 第一题（命题作文）", "kind": "命题作文", "exam": "PSLE 2012 华文", "imgs": [], "drafts": [], "vocab": ["不可开交", "四脚朝天", "默默不语", "脸色苍白", "魂不附体", "呆若木鸡", "鲜血直流"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "543", "info": "题目：《在学校主办的一项活动中，发生了一件意想不到的事》｜题型：命题作文（只给题目，不给图）｜出处：PSLE 2012 华文 · 试卷一 第一题（命题作文）", "segments": [{"pic": "start", "text": ["艳阳高照，操场上一片欢呼声，正在比赛的同学们为了争夺冠军而斗智斗力，现场的气氛十分紧张。老师们为了积分还有繁多的赛务都忙得不可开交。同学们也在为自己支持的队员积极地欢呼加油。"]}, {"pic": "1", "label": "正文①", "text": ["当大家都把焦点放在赛场上时，小明和小日却在大家背后拉扯玩耍。小明由于用力过度，把小日给推倒了。谁也不曾料到，当小日跌个四脚朝天时，后脑却撞到了石灰沟边，鲜血如鱼尾狮喷水般直涌出来，吓得小明大声喊叫，小日却默默不语，只是脸色苍白，惊魂不定。", "小明的喊叫声引起了附近的级任老师还有几个同学的注意。级任老师连忙跑去看个究竟，一看到小日鲜血直流，就马上用手按住小日的伤口，并大声喊叫：“叫救护车！快叫救护车！”其他同学看见级任老师那么慌张，吓得大声哭了起来，有的甚至吓得魂不附体，在那里呆若木鸡。", "这时，正在附近巡逻的黄老师即刻赶到。当他了解了状况后，立即叫陪伴在身边的学长快步通知校长安排救护车，接着马上把一瓶矿泉水往小日的头上倒去，帮他清洗伤口，然后拿出药箱里的绷带帮他包扎起来。最后，黄老师把小日抱去办公室等待救护车的到来。校长、副校长，还有几位主任和老师都来安抚小日。"]}, {"pic": "end", "text": ["不久，救护车来了，救护人员把小日抬上救护车，然后黄老师便随着他们一同去医院。运动会的这一天，大家本来都在为赛事紧张，不料却发生了这一件意想不到的事。"]}]}, "imp": {"label": "慧眼改进版", "words": "585", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：原文结尾只交代了“发生了意想不到的事”，没有写出感受和道理。", "segments": [{"pic": "start", "text": ["艳阳高照，操场上一片欢呼声，正在比赛的同学们为了争夺冠军而斗智斗力，现场的气氛十分紧张。老师们为了积分还有繁多的赛务都忙得不可开交。同学们也在为自己支持的队员积极地欢呼加油。"]}, {"pic": "1", "label": "正文①", "text": ["当大家都把焦点放在赛场上时，小明和小日却在大家背后拉扯玩耍。小明由于用力过度，把小日给推倒了。谁也不曾料到，当小日跌个四脚朝天时，后脑却撞到了石灰沟边，鲜血如鱼尾狮喷水般直涌出来，吓得小明大声喊叫，小日却默默不语，只是脸色苍白，惊魂不定。", "小明的喊叫声引起了附近的级任老师还有几个同学的注意。级任老师连忙跑去看个究竟，一看到小日鲜血直流，就马上用手按住小日的伤口，并大声喊叫：“叫救护车！快叫救护车！”其他同学看见级任老师那么慌张，吓得大声哭了起来，有的甚至吓得魂不附体，在那里呆若木鸡。", "这时，正在附近巡逻的黄老师即刻赶到。当他了解了状况后，立即叫陪伴在身边的学长快步通知校长安排救护车，接着马上把一瓶矿泉水往小日的头上倒去，帮他清洗伤口，然后拿出药箱里的绷带帮他包扎起来。最后，黄老师把小日抱去办公室等待救护车的到来。校长、副校长，还有几位主任和老师都来安抚小日。"]}, {"pic": "end", "text": ["不久，救护车来了，救护人员把小日抬上救护车，然后黄老师便随着他们一同去医院。运动会的这一天，大家本来都在为赛事紧张，不料却发生了这一件意想不到的事。++俗话说：“小心驶得万年船。”这件事给我敲响了警钟：玩耍要有分寸，安全永远是第一位的。++"], "note": "慧眼改进：原文结尾只交代了“发生了意想不到的事”，没有写出感受和道理。"}]}}, "detective": []}, {"id": "psle2013-cn", "title": "我的好邻居", "cat": "bonds", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2013 华文 · 试卷一 第一题（命题作文）", "kind": "命题作文", "exam": "PSLE 2013 华文", "imgs": [], "drafts": [], "vocab": ["风烛残年", "相依为命", "不以为然", "突飞猛进", "手舞足蹈"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "665", "info": "题目：《我的好邻居》｜题型：命题作文（只给题目，不给图）｜出处：PSLE 2013 华文 · 试卷一 第一题（命题作文）", "segments": [{"pic": "start", "text": ["张老师是一位华文老师，中等身材，头发很黑很亮，笑起来眼睛眯成一条缝，特别好看。张老师一年前才搬到我家隔壁，可是她几乎跟整栋楼的人都很热络。她每天都笑脸迎人，是个和蔼可亲、平易近人的人。"]}, {"pic": "1", "label": "正文①", "text": ["住在我家右边的是风烛残年的杨爷爷。杨爷爷的妻子很早就去世了，一直与女儿相依为命。可是女儿几年前与她的丈夫移民去加拿大，杨爷爷不习惯加拿大那边的生活，便独自一人住在组屋里。张老师知道杨爷爷孤单寂寞，每天一有空就陪杨爷爷聊天，还经常煮拿手好菜与杨爷爷分享。杨爷爷生日的时候，张老师还邀请我们这些孩子，一起帮杨爷爷庆祝。我依然还记得我们唱生日歌时，杨爷爷眼角的那抹泪光。"]}, {"pic": "2", "label": "正文②", "text": ["张老师一定是一位非常受欢迎的老师，不然她怎么这么懂小孩子的心，连平时不爱说话的小美看到张老师都会吐露心声？张老师也一定很厉害，我们组屋里最顽皮的小亮也乖乖听她的话。邻居们都很庆幸有张老师这样的好邻居，因为关于孩子的问题，张老师都会很热情地指点迷津。", "张老师给予我最大的帮助莫过于我的华文了。在张老师搬进来的第一天，妈妈就兴奋地跑来跟我说：“我们的新邻居是个华文老师，你的华文有救了。”我不以为然，素来讨厌华文的我不是一般老师能拯救得了的。可是不久后，我就改变了想法。张老师经常出一些华文的谜语给我们组屋区里的孩子猜，还发明一些有趣的华文游戏让我们玩。渐渐地我们爱上了写华文字。她还主动为我们补习华文。"]}, {"pic": "end", "text": ["年中考试时，我的华文成绩不但突飞猛进，作文里连错别字也没有了。妈妈看到我的成绩，高兴地手舞足蹈，连忙拿着试卷并带上我去向张老师道谢：“张老师，有你这样的好邻居，真是我们的一份福气啊！”"]}]}, "imp": {"label": "慧眼改进版", "words": "717", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：原文停在对话上，补一句名句点题，并写出“我”的决心。", "segments": [{"pic": "start", "text": ["张老师是一位华文老师，中等身材，头发很黑很亮，笑起来眼睛眯成一条缝，特别好看。张老师一年前才搬到我家隔壁，可是她几乎跟整栋楼的人都很热络。她每天都笑脸迎人，是个和蔼可亲、平易近人的人。"]}, {"pic": "1", "label": "正文①", "text": ["住在我家右边的是风烛残年的杨爷爷。杨爷爷的妻子很早就去世了，一直与女儿相依为命。可是女儿几年前与她的丈夫移民去加拿大，杨爷爷不习惯加拿大那边的生活，便独自一人住在组屋里。张老师知道杨爷爷孤单寂寞，每天一有空就陪杨爷爷聊天，还经常煮拿手好菜与杨爷爷分享。杨爷爷生日的时候，张老师还邀请我们这些孩子，一起帮杨爷爷庆祝。我依然还记得我们唱生日歌时，杨爷爷眼角的那抹泪光。"]}, {"pic": "2", "label": "正文②", "text": ["张老师一定是一位非常受欢迎的老师，不然她怎么这么懂小孩子的心，连平时不爱说话的小美看到张老师都会吐露心声？张老师也一定很厉害，我们组屋里最顽皮的小亮也乖乖听她的话。邻居们都很庆幸有张老师这样的好邻居，因为关于孩子的问题，张老师都会很热情地指点迷津。", "张老师给予我最大的帮助莫过于我的华文了。在张老师搬进来的第一天，妈妈就兴奋地跑来跟我说：“我们的新邻居是个华文老师，你的华文有救了。”我不以为然，素来讨厌华文的我不是一般老师能拯救得了的。可是不久后，我就改变了想法。张老师经常出一些华文的谜语给我们组屋区里的孩子猜，还发明一些有趣的华文游戏让我们玩。渐渐地我们爱上了写华文字。她还主动为我们补习华文。"]}, {"pic": "end", "text": ["年中考试时，我的华文成绩不但突飞猛进，作文里连错别字也没有了。妈妈看到我的成绩，高兴地手舞足蹈，连忙拿着试卷并带上我去向张老师道谢：“张老师，有你这样的好邻居，真是我们的一份福气啊！”", "++俗话说：“远亲不如近邻。”张老师用她的爱心和耐心温暖了整栋组屋。我也要像她一样，做一个乐于助人的好邻居。++"], "note": "慧眼改进：原文停在对话上，补一句名句点题，并写出“我”的决心。"}]}}, "detective": []}, {"id": "psle2014-cn", "title": "这件事，让我明白了友情的可贵", "cat": "bonds", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2014 华文 · 试卷一 第一题（命题作文）", "kind": "命题作文", "exam": "PSLE 2014 华文", "imgs": [], "drafts": [], "vocab": ["心急如焚", "自告奋勇", "倾盆大雨", "不厌其烦", "乌云密布"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "535", "info": "题目：《这件事，让我明白了友情的可贵》｜题型：命题作文（只给题目，不给图）｜出处：PSLE 2014 华文 · 试卷一 第一题（命题作文）", "segments": [{"pic": "start", "text": ["有人觉得金钱可贵，有人觉得时间可贵，也有人觉得考试分数可贵……自从发生了那件事后，我深深体会到了友情的可贵。"]}, {"pic": "1", "label": "正文①", "text": ["那是五年级期终考试前的几天，我得了严重感冒，不能去上课。可是马上就要期终考试了，落下的功课怎么办呢？我心急如焚。下午，我的好朋友美华打电话问候我，还叮嘱我按时吃药，多休息。当她了解到我的顾虑时，立即自告奋勇地说：“我现在去你家给你补课。”", "虽然美华的家离我家不远，可是也要走20分钟的路。这时的天公偏不作美，乌云密布，狂风大作，不一会儿就下起了倾盆大雨。我焦急地直往窗外望。妈妈说：“下这么大的雨，美华不会来了。”就在这时，门铃响了。打开门一看，果然是美华。虽然她带了伞，可是风雨太大，还是被淋成了落汤鸡。看到这个情景，我顿时眼眶发热，一时说不出话来。", "为了避免美华感冒，妈妈拿了我的一套衣服给美华换上。我说：“今天下这么大的雨，打个电话来说改天再给我补课就行啊！”“不，答应别人的事就要做到，更何况我们还是好朋友呢！”说完，美华就拿出课本和笔记本，把课堂上的知识一一讲解给我听。我没弄懂的地方，美华也不厌其烦地解释。"]}, {"pic": "end", "text": ["当美华帮我补完课，天已经黑了。妈妈坚持送美华回家。看着美华离开的背影，我心里百感交集。多好的朋友啊！多可贵的友情啊！我一定要好好珍惜我们之间的友谊。"]}]}, "imp": {"label": "慧眼改进版", "words": "571", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：结尾的感叹很好，再加一句名句，让主题“友情可贵”更突出。", "segments": [{"pic": "start", "text": ["有人觉得金钱可贵，有人觉得时间可贵，也有人觉得考试分数可贵……自从发生了那件事后，我深深体会到了友情的可贵。"]}, {"pic": "1", "label": "正文①", "text": ["那是五年级期终考试前的几天，我得了严重感冒，不能去上课。可是马上就要期终考试了，落下的功课怎么办呢？我心急如焚。下午，我的好朋友美华打电话问候我，还叮嘱我按时吃药，多休息。当她了解到我的顾虑时，立即自告奋勇地说：“我现在去你家给你补课。”", "虽然美华的家离我家不远，可是也要走20分钟的路。这时的天公偏不作美，乌云密布，狂风大作，不一会儿就下起了倾盆大雨。我焦急地直往窗外望。妈妈说：“下这么大的雨，美华不会来了。”就在这时，门铃响了。打开门一看，果然是美华。虽然她带了伞，可是风雨太大，还是被淋成了落汤鸡。看到这个情景，我顿时眼眶发热，一时说不出话来。", "为了避免美华感冒，妈妈拿了我的一套衣服给美华换上。我说：“今天下这么大的雨，打个电话来说改天再给我补课就行啊！”“不，答应别人的事就要做到，更何况我们还是好朋友呢！”说完，美华就拿出课本和笔记本，把课堂上的知识一一讲解给我听。我没弄懂的地方，美华也不厌其烦地解释。"]}, {"pic": "end", "text": ["当美华帮我补完课，天已经黑了。妈妈坚持送美华回家。看着美华离开的背影，我心里百感交集。多好的朋友啊！多可贵的友情啊！我一定要好好珍惜我们之间的友谊。++正如俗话所说：“患难见真情。”美华在风雨中赶来的身影，我永远也不会忘记。++"], "note": "慧眼改进：结尾的感叹很好，再加一句名句，让主题“友情可贵”更突出。"}]}}, "detective": []}, {"id": "psle2015-cn", "title": "说真话对我有好处", "cat": "guts", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2015 华文 · 试卷一 第一题（命题作文）", "kind": "命题作文", "exam": "PSLE 2015 华文", "imgs": [], "drafts": [], "vocab": ["吞吞吐吐", "来龙去脉", "语重心长", "喜出望外"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "837", "info": "题目：《说真话对我有好处》｜题型：命题作文（只给题目，不给图）｜出处：PSLE 2015 华文 · 试卷一 第一题（命题作文）", "segments": [{"pic": "start", "text": ["有人因为说了真话而遭到误解，有人因为说了真话被人信任，有人因为说了真话而受到伤害，有人因为说了真话而受人尊重……那一次，我说了真话。"]}, {"pic": "1", "label": "正文①", "text": ["大华是我的邻居，也是我的好朋友，我们天天一起上学，一起回家。四年级时，老师重新安排座位，大华坐到了我的前面。一天，老师给我们听写时，我发现大华悄悄拿课本出来看。当时我不知道要怎么做。下课后，我把大华拉到一边谈话，没想到大华却威胁我：“不许告诉老师！如果你告诉老师，以后我就不和你做朋友了。”我也不知道怎么的，居然答应了。", "那次的听写，大华拿了满分。从那以后，大华几乎每次听写都作弊，也都能拿满分。正因为如此，大华得意洋洋，开始疏忽学习了。我认真努力做功课时，大华不再坐在我旁边。我到底应不应该把这件事告诉老师呢？我一直在为此做思想斗争。一次，爸爸没有看到大华和我一起做功课，便问我原因。我吞吞吐吐地把事情的来龙去脉告诉了爸爸。爸爸严肃地说：“你一定要告诉老师，决不能让这样的事情再发生！”我很纠结，说：“不能告诉老师。如果告诉了老师，我们的友谊会破裂的！”爸爸语重心长地说：“正因为你们是朋友，所以你才更要对老师坦白。要是大华以为不用努力就可以考取好成绩，这样他什么知识都没有学到，以后在社会上怎么立足呢？你这样包庇他，不是为了他好，而是害了他呀！”"]}, {"pic": "2", "label": "正文②", "text": ["我觉得爸爸说得很有道理，就去找大华，可他完全不听我的劝告。第二天的听写，大华还是作弊，为了大华着想，我坚定地站起了身，把大华作弊的事情告诉了老师。课后，老师叫我和大华一起去他的办公室。老师因为我说了真话，表扬了我，还和大华分析作弊的坏处。", "回课室的路上，我对大华说：“对不起我背叛了你！但是我还是会这么做的。”大华微笑着对我说：“听了老师的一席话，我才知道作弊有这么多坏处。谢谢你文强，你是我真正的朋友。以后我们一块好好学习吧！”我顿时喜出望外。"]}, {"pic": "end", "text": ["通过这件事，我深深体会到说真话的好处。看到不好的行为一定要制止，这样，才是对他人负责。我也很庆幸自己说了真话后能得到朋友的理解，从而获得了真正的友谊。"]}]}, "imp": {"label": "慧眼改进版", "words": "858", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：结尾道理清楚，开头加一句名句，让结尾更有分量。", "segments": [{"pic": "start", "text": ["有人因为说了真话而遭到误解，有人因为说了真话被人信任，有人因为说了真话而受到伤害，有人因为说了真话而受人尊重……那一次，我说了真话。"]}, {"pic": "1", "label": "正文①", "text": ["大华是我的邻居，也是我的好朋友，我们天天一起上学，一起回家。四年级时，老师重新安排座位，大华坐到了我的前面。一天，老师给我们听写时，我发现大华悄悄拿课本出来看。当时我不知道要怎么做。下课后，我把大华拉到一边谈话，没想到大华却威胁我：“不许告诉老师！如果你告诉老师，以后我就不和你做朋友了。”我也不知道怎么的，居然答应了。", "那次的听写，大华拿了满分。从那以后，大华几乎每次听写都作弊，也都能拿满分。正因为如此，大华得意洋洋，开始疏忽学习了。我认真努力做功课时，大华不再坐在我旁边。我到底应不应该把这件事告诉老师呢？我一直在为此做思想斗争。一次，爸爸没有看到大华和我一起做功课，便问我原因。我吞吞吐吐地把事情的来龙去脉告诉了爸爸。爸爸严肃地说：“你一定要告诉老师，决不能让这样的事情再发生！”我很纠结，说：“不能告诉老师。如果告诉了老师，我们的友谊会破裂的！”爸爸语重心长地说：“正因为你们是朋友，所以你才更要对老师坦白。要是大华以为不用努力就可以考取好成绩，这样他什么知识都没有学到，以后在社会上怎么立足呢？你这样包庇他，不是为了他好，而是害了他呀！”"]}, {"pic": "2", "label": "正文②", "text": ["我觉得爸爸说得很有道理，就去找大华，可他完全不听我的劝告。第二天的听写，大华还是作弊，为了大华着想，我坚定地站起了身，把大华作弊的事情告诉了老师。课后，老师叫我和大华一起去他的办公室。老师因为我说了真话，表扬了我，还和大华分析作弊的坏处。", "回课室的路上，我对大华说：“对不起我背叛了你！但是我还是会这么做的。”大华微笑着对我说：“听了老师的一席话，我才知道作弊有这么多坏处。谢谢你文强，你是我真正的朋友。以后我们一块好好学习吧！”我顿时喜出望外。"]}, {"pic": "end", "text": ["++正所谓“良药苦口利于病，忠言逆耳利于行。”++通过这件事，我深深体会到说真话的好处。看到不好的行为一定要制止，这样，才是对他人负责。我也很庆幸自己说了真话后能得到朋友的理解，从而获得了真正的友谊。"], "note": "慧眼改进：结尾道理清楚，开头加一句名句，让结尾更有分量。"}]}}, "detective": []}, {"id": "psle2016-cn", "title": "这件事让我明白了互相合作的重要", "cat": "falls", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2016 华文 · 试卷一 第一题（命题作文）", "kind": "命题作文", "exam": "PSLE 2016 华文", "imgs": [], "drafts": [], "vocab": ["推三阻四", "断断续续", "窃窃私语", "哈哈大笑", "面红耳赤", "无地自容", "支支吾吾"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "975", "info": "题目：《这件事让我明白了互相合作的重要》｜题型：命题作文（只给题目，不给图）｜出处：PSLE 2016 华文 · 试卷一 第一题（命题作文）", "segments": [{"pic": "start", "text": ["俗话说得好：“人心齐，泰山移。”“人多力量大。”这都充分说明了合作的重要性，只有合作才能把事情做好。那时，我和我的组员们都未能明白这个道理。"]}, {"pic": "1", "label": "正文①", "text": ["还记得那是在星期四的华文课上，老师让我们以《伟人》为题，四人一组合作写一个伟人的生平事迹和他的贡献，并在下一个星期二交作业。“合作，合作，老师每次布置作业都说‘合作’，但每次考试还不是要靠自己完成？”我和我的组员们嘀咕道。", "星期五，我们小组的四人一“相聚”，光亮便嚷了起来：“哎呀，这么艰巨的任务还是天福来做比较好。”", "天福马上开口：“不不不，让喜云来做，她的华文好，字又写得漂亮，没有人比她更适合写了。”", "喜云为难地说：“我不行，还是你来。”", "“不不，你来！”", "“你来，你来！”", "“啊…….”我头都快炸了，大声喊道，“每个人都推三阻四的，不如这样，我们每人都自己写，谁也别偷懒，然后，我们选一份最好的交上去。”大家点头答应了。"]}, {"pic": "2", "label": "正文②", "text": ["星期六，我想反正还有时间，先过个愉快的周末，星期一再写也不迟。星期一放学后，我背着书包去图书馆找资料，找了半天，选来选去，还是不知要写哪个伟人才好。我开始急了，马上约其他组员一起讨论。", "晚上，大家重新集合在一起，我说：“我找了一些资料，但还没选定写哪个伟人。光亮你呢？”", "光亮支支吾吾地说：“我还没写……”", "大家把目光转向天福，天福拿出只写了一半的草稿给我们看。喜云是我们唯一的希望了，我们齐齐看向喜云。喜云生气地说：“我也只写了一半，靠我一个人根本写不完！”", "最后的一丝希望破灭了，我们只好想对策。重新写是来不及了，怎么办呢？这时，光亮想出了一个主意：“我们把天福的一半加上喜云的一半，不就可以了吗？”"]}, {"pic": "3", "label": "正文③", "text": ["“可是天福写的是牛顿，喜云写的是爱迪生啊！”我哀嚎。", "“管不了那么多了。”光亮说。于是我们把爱迪生的名字改成了牛顿，第二天就把作业交了上去。", "轮到我们小组做报告了，我被组员们推上了讲台。当我断断续续讲报告时，同学们开始窃窃私语。忽然，有同学大声问道：“电灯不是爱迪生发明的吗？怎么变成牛顿了？”其他同学听了，哈哈大笑。我站在台上面红耳赤，恨不得地上有个洞让我马上钻进去。闹出那么大的笑话，我和组员们都无地自容。"]}, {"pic": "end", "text": ["事后，老师找我们谈话。我到现在还记得他说的话：“很多事情只有大家互相合作，各负其责，各尽其职，才能成功。像你们这样各扫门前雪，事情就不可能办得好。”经过这次教训，我深深明白了互相合作的重要性。"]}]}, "imp": {"label": "慧眼改进版", "words": "1017", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：开头已经用了俗话，结尾再补一句“以后怎么做”，首尾呼应。", "segments": [{"pic": "start", "text": ["俗话说得好：“人心齐，泰山移。”“人多力量大。”这都充分说明了合作的重要性，只有合作才能把事情做好。那时，我和我的组员们都未能明白这个道理。"]}, {"pic": "1", "label": "正文①", "text": ["还记得那是在星期四的华文课上，老师让我们以《伟人》为题，四人一组合作写一个伟人的生平事迹和他的贡献，并在下一个星期二交作业。“合作，合作，老师每次布置作业都说‘合作’，但每次考试还不是要靠自己完成？”我和我的组员们嘀咕道。", "星期五，我们小组的四人一“相聚”，光亮便嚷了起来：“哎呀，这么艰巨的任务还是天福来做比较好。”", "天福马上开口：“不不不，让喜云来做，她的华文好，字又写得漂亮，没有人比她更适合写了。”", "喜云为难地说：“我不行，还是你来。”", "“不不，你来！”", "“你来，你来！”", "“啊…….”我头都快炸了，大声喊道，“每个人都推三阻四的，不如这样，我们每人都自己写，谁也别偷懒，然后，我们选一份最好的交上去。”大家点头答应了。"]}, {"pic": "2", "label": "正文②", "text": ["星期六，我想反正还有时间，先过个愉快的周末，星期一再写也不迟。星期一放学后，我背着书包去图书馆找资料，找了半天，选来选去，还是不知要写哪个伟人才好。我开始急了，马上约其他组员一起讨论。", "晚上，大家重新集合在一起，我说：“我找了一些资料，但还没选定写哪个伟人。光亮你呢？”", "光亮支支吾吾地说：“我还没写……”", "大家把目光转向天福，天福拿出只写了一半的草稿给我们看。喜云是我们唯一的希望了，我们齐齐看向喜云。喜云生气地说：“我也只写了一半，靠我一个人根本写不完！”", "最后的一丝希望破灭了，我们只好想对策。重新写是来不及了，怎么办呢？这时，光亮想出了一个主意：“我们把天福的一半加上喜云的一半，不就可以了吗？”"]}, {"pic": "3", "label": "正文③", "text": ["“可是天福写的是牛顿，喜云写的是爱迪生啊！”我哀嚎。", "“管不了那么多了。”光亮说。于是我们把爱迪生的名字改成了牛顿，第二天就把作业交了上去。", "轮到我们小组做报告了，我被组员们推上了讲台。当我断断续续讲报告时，同学们开始窃窃私语。忽然，有同学大声问道：“电灯不是爱迪生发明的吗？怎么变成牛顿了？”其他同学听了，哈哈大笑。我站在台上面红耳赤，恨不得地上有个洞让我马上钻进去。闹出那么大的笑话，我和组员们都无地自容。"]}, {"pic": "end", "text": ["事后，老师找我们谈话。我到现在还记得他说的话：“很多事情只有大家互相合作，各负其责，各尽其职，才能成功。像你们这样各扫门前雪，事情就不可能办得好。”经过这次教训，我深深明白了互相合作的重要性。++以后，无论做什么事，我都会和组员们分工合作、各尽其职，再也不做“各扫门前雪”的人了。++"], "note": "慧眼改进：开头已经用了俗话，结尾再补一句“以后怎么做”，首尾呼应。"}]}}, "detective": []}, {"id": "psle2017-cn", "title": "这件事让我变成一个勇敢的人", "cat": "guts", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2017 华文 · 试卷一 第一题（命题作文）", "kind": "命题作文", "exam": "PSLE 2017 华文", "imgs": [], "drafts": [], "vocab": ["酣畅淋漓", "意犹未尽", "胆小怕事", "畏首畏尾", "一事无成"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "835", "info": "题目：《这件事让我变成一个勇敢的人》｜题型：命题作文（只给题目，不给图）｜出处：PSLE 2017 华文 · 试卷一 第一题（命题作文）", "segments": [{"pic": "start", "text": ["我小的时候非常胆小，不敢一个人去黑黑的地方；要开着灯才敢睡觉；不敢举手发言……后来，发生了一件事令我不再胆小。"]}, {"pic": "1", "label": "正文①", "text": ["那是假期里的一天，爸爸妈妈带我和弟弟去圣淘沙的环球影城玩。作为东南亚首个好莱坞电影主题公园，里面设置了各种迷人景点、游乐项目。可是因为我很胆小，只敢玩一些“幼稚园”程度的项目，面对里面的大部分游乐设施，我只是远远站着观看而不敢靠近。妈妈大喊可惜，说花了这么多钱进来玩，连最经典的都没碰一下。最可恶的是弟弟居然把过错都推到我身上，还笑我是胆小鬼。我很不服气地说：“我才不是胆小鬼，我什么都敢玩！”", "“那就去玩啊！”弟弟挑衅地看着我说。", "“去就去，谁怕谁！”我硬着头皮说。我明知道弟弟用的是激将法，可是有“骨气”的我就这么成功地上了他的当。于是爸爸妈妈便带我们去坐过山车。排队时，听到车上的人一直在尖叫，我的腿不由得软了。轮到我们的时候，为了不让弟弟笑我，我鼓起勇气坐了上去。爸爸拍拍我的肩膀，安慰我说：“不怕！爸爸妈妈就在旁边。”车缓缓地开动了，我怎么也没想到车的前方是直冲下去的，结果吓得大叫。开到平地时，我正想舒一口气，过山车却开始左右扭动起来。我继续尖叫着，双手紧紧抓住扶杆。弟弟也在旁边大叫，我不禁想笑，弟弟其实也是胆小鬼。终于到站了，然而我还处在紧张和刺激中，久久不能平静。"]}, {"pic": "2", "label": "正文②", "text": ["坐了过山车后，我发现它也没那么可怕，而且还非常有意思。弟弟挑着眉问我：“感觉怎样？”", "“好极了！”我开心地说。后来，我们把七个电影主题区里的所有项目都玩了一遍。我们去了“马达加斯加”，经历了一次酣畅淋漓的河面漂流之旅；去了趣味无穷的电影体验区，亲身感受了电影世界的魅力。我们也在“失落的世界”里亲眼目睹了玩命特技和爆炸效果，连最吓人的变形金刚过山车都玩了两遍。", "玩了一整天，爸爸妈妈和弟弟都累了，我还意犹未尽。"]}, {"pic": "end", "text": ["去了一趟环球影城，我不再胆小怕事，变得勇敢了起来。我到现在还记得当时爸爸对我说的话：“无论做什么事情都要勇敢地跨出第一步，才能有所收获。如果畏首畏尾，举步不前，终将一事无成。”"]}]}, "imp": {"label": "慧眼改进版", "words": "887", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：用爸爸的话收尾很好，补一句名句和“以后怎么做”。", "segments": [{"pic": "start", "text": ["我小的时候非常胆小，不敢一个人去黑黑的地方；要开着灯才敢睡觉；不敢举手发言……后来，发生了一件事令我不再胆小。"]}, {"pic": "1", "label": "正文①", "text": ["那是假期里的一天，爸爸妈妈带我和弟弟去圣淘沙的环球影城玩。作为东南亚首个好莱坞电影主题公园，里面设置了各种迷人景点、游乐项目。可是因为我很胆小，只敢玩一些“幼稚园”程度的项目，面对里面的大部分游乐设施，我只是远远站着观看而不敢靠近。妈妈大喊可惜，说花了这么多钱进来玩，连最经典的都没碰一下。最可恶的是弟弟居然把过错都推到我身上，还笑我是胆小鬼。我很不服气地说：“我才不是胆小鬼，我什么都敢玩！”", "“那就去玩啊！”弟弟挑衅地看着我说。", "“去就去，谁怕谁！”我硬着头皮说。我明知道弟弟用的是激将法，可是有“骨气”的我就这么成功地上了他的当。于是爸爸妈妈便带我们去坐过山车。排队时，听到车上的人一直在尖叫，我的腿不由得软了。轮到我们的时候，为了不让弟弟笑我，我鼓起勇气坐了上去。爸爸拍拍我的肩膀，安慰我说：“不怕！爸爸妈妈就在旁边。”车缓缓地开动了，我怎么也没想到车的前方是直冲下去的，结果吓得大叫。开到平地时，我正想舒一口气，过山车却开始左右扭动起来。我继续尖叫着，双手紧紧抓住扶杆。弟弟也在旁边大叫，我不禁想笑，弟弟其实也是胆小鬼。终于到站了，然而我还处在紧张和刺激中，久久不能平静。"]}, {"pic": "2", "label": "正文②", "text": ["坐了过山车后，我发现它也没那么可怕，而且还非常有意思。弟弟挑着眉问我：“感觉怎样？”", "“好极了！”我开心地说。后来，我们把七个电影主题区里的所有项目都玩了一遍。我们去了“马达加斯加”，经历了一次酣畅淋漓的河面漂流之旅；去了趣味无穷的电影体验区，亲身感受了电影世界的魅力。我们也在“失落的世界”里亲眼目睹了玩命特技和爆炸效果，连最吓人的变形金刚过山车都玩了两遍。", "玩了一整天，爸爸妈妈和弟弟都累了，我还意犹未尽。"]}, {"pic": "end", "text": ["去了一趟环球影城，我不再胆小怕事，变得勇敢了起来。我到现在还记得当时爸爸对我说的话：“无论做什么事情都要勇敢地跨出第一步，才能有所收获。如果畏首畏尾，举步不前，终将一事无成。”", "++正所谓“世上无难事，只怕有心人。”从那以后，每当我想退缩时，就会想起那趟过山车之旅，鼓起勇气迈出第一步。++"], "note": "慧眼改进：用爸爸的话收尾很好，补一句名句和“以后怎么做”。"}]}}, "detective": []}, {"id": "psle2018-cn", "title": "这件事让我更加了解我的朋友", "cat": "bonds", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2018 华文 · 试卷一 第一题（命题作文）", "kind": "命题作文", "exam": "PSLE 2018 华文", "imgs": [], "drafts": [], "vocab": ["晴空万里", "闷闷不乐", "愁眉苦脸", "勇往直前", "不假思索", "志趣相投", "善解人意", "阳光明媚"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "777", "info": "题目：《这件事让我更加了解我的朋友》｜题型：命题作文（只给题目，不给图）｜出处：PSLE 2018 华文 · 试卷一 第一题（命题作文）", "segments": [{"pic": "start", "text": ["在我的小学生涯中，有许许多多的好朋友，但最要好的要数我们班上的赵静了。她高高瘦瘦的个子，瓜子似的脸上长着一对柳叶似的眉毛，两只水灵灵、明亮亮的大眼睛像两颗水晶葡萄，漂亮极了！从幼儿园开始，一条友谊的链子就把我们拉到一起了。自从上学以后，我和她都是同班同学，所以我以为我对她很了解，直到那一天……"]}, {"pic": "1", "label": "正文①", "text": ["那一天上午，外面阳光明媚，晴空万里，而我却一个人坐在教室里发愁。这时，好朋友赵静迈着轻盈的步子走到我身边，见我闷闷不乐的，马上关心地问道：“美英，你怎么了？”我愁眉苦脸地说：“考试考砸了，心里挺难过的。”说完，我拿出那张试卷给她看。她拿着我的试卷仔仔细细地看了几遍，对我说：“你看，这几道题都是粗心引起的吧？以后考试时细心一点，做完后检查几遍，就可以减少这种错误的发生了。”我觉得她说的有道理，抬起头来看着她。她接着说：“这个考试都已经过去两个星期了，你还在想着这件事，还在为它苦恼，实在不值得。妈妈说在人生的道路上不要总往后看，这样是不会进步的。你要勇往直前，跌倒了就赶快爬起来，继续不断攀登，努力创造更好的未来。”她的一席话使我非常感动。我顿时精神大振。赵静说的对，我不能因为小小的挫折就跌倒爬不起来，不然，长大以后，碰到更大的磨难怎么办呢？我猛然醒悟，开心地对赵静说：“太谢谢你了，赵静。认识你这么久，我没想到你还是个哲学家呢！大哲学家，针对这件事，你还有什么看法呢？”她不假思索地说：“不顺利是绝对的，顺利是相对的，我们应该勇敢地接受生活的挑战。”她刚说完，一缕温暖的阳光直射我的心田，仿佛在夸赵静说得对。从她的话中，我明白了：人生的路总会有挫折和坎坷，我们一定要勇敢面对。"]}, {"pic": "end", "text": ["一直以来，我以为赵静是个活泼可爱，跟我志趣相投的好朋友，没想到她还是个通情达理、善解人意，在我悲观烦恼时适时给我鼓励的好女孩。我为有这样的好朋友而感到庆幸！愿我们的友谊万古长青！"]}]}, "imp": {"label": "慧眼改进版", "words": "793", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：加一句名句，点出“好朋友也是好老师”。", "segments": [{"pic": "start", "text": ["在我的小学生涯中，有许许多多的好朋友，但最要好的要数我们班上的赵静了。她高高瘦瘦的个子，瓜子似的脸上长着一对柳叶似的眉毛，两只水灵灵、明亮亮的大眼睛像两颗水晶葡萄，漂亮极了！从幼儿园开始，一条友谊的链子就把我们拉到一起了。自从上学以后，我和她都是同班同学，所以我以为我对她很了解，直到那一天……"]}, {"pic": "1", "label": "正文①", "text": ["那一天上午，外面阳光明媚，晴空万里，而我却一个人坐在教室里发愁。这时，好朋友赵静迈着轻盈的步子走到我身边，见我闷闷不乐的，马上关心地问道：“美英，你怎么了？”我愁眉苦脸地说：“考试考砸了，心里挺难过的。”说完，我拿出那张试卷给她看。她拿着我的试卷仔仔细细地看了几遍，对我说：“你看，这几道题都是粗心引起的吧？以后考试时细心一点，做完后检查几遍，就可以减少这种错误的发生了。”我觉得她说的有道理，抬起头来看着她。她接着说：“这个考试都已经过去两个星期了，你还在想着这件事，还在为它苦恼，实在不值得。妈妈说在人生的道路上不要总往后看，这样是不会进步的。你要勇往直前，跌倒了就赶快爬起来，继续不断攀登，努力创造更好的未来。”她的一席话使我非常感动。我顿时精神大振。赵静说的对，我不能因为小小的挫折就跌倒爬不起来，不然，长大以后，碰到更大的磨难怎么办呢？我猛然醒悟，开心地对赵静说：“太谢谢你了，赵静。认识你这么久，我没想到你还是个哲学家呢！大哲学家，针对这件事，你还有什么看法呢？”她不假思索地说：“不顺利是绝对的，顺利是相对的，我们应该勇敢地接受生活的挑战。”她刚说完，一缕温暖的阳光直射我的心田，仿佛在夸赵静说得对。从她的话中，我明白了：人生的路总会有挫折和坎坷，我们一定要勇敢面对。"]}, {"pic": "end", "text": ["一直以来，我以为赵静是个活泼可爱，跟我志趣相投的好朋友，没想到她还是个通情达理、善解人意，在我悲观烦恼时适时给我鼓励的好女孩。++俗话说：“良师益友，千金难求。”++我为有这样的好朋友而感到庆幸！愿我们的友谊万古长青！"], "note": "慧眼改进：加一句名句，点出“好朋友也是好老师”。"}]}}, "detective": []}, {"id": "psle2019-cn", "title": "我做了正确的决定", "cat": "guts", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2019 华文 · 试卷一 第一题（命题作文）", "kind": "命题作文", "exam": "PSLE 2019 华文", "imgs": [], "drafts": [], "vocab": ["面有难色", "梦寐以求", "当一回事", "如释重负", "三思而后行"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "740", "info": "题目：《我做了正确的决定》｜题型：命题作文（只给题目，不给图）｜出处：PSLE 2019 华文 · 试卷一 第一题（命题作文）", "segments": [{"pic": "start", "text": ["在茫茫的人生中，我们总会遇到许多十字路口。站在十字路口前，我们的每一个决定、每一种选择，将带领我们走向不同的结果。那一次，我很庆幸做了一个正确的决定。"]}, {"pic": "1", "label": "正文①", "text": ["那天，我和几个同学一起去李华的家参加他的生日聚会。去到他家，我发现他三岁的弟弟正拿着一个手机在玩。李华说那是他用过的手机，现在换新的款式了，就把旧的给弟弟当玩具。现今社会，手机相当普及化。我们班每个同学都人手一机了，唯独我例外。每当看到他们拿出手机，或谁又拿到了最新款的手机时，我都不由露出羡慕的目光。我曾几次请求父母买一台手机给我，可是父母都面有难色。父母两个人共用一台手机，他们没有能力买一台给我，也觉得没有那个必要。他们还跟我讲了很多道理，那些道理我都明白，但我心中想要拥有一台手机的渴望并没有因此而消减过。", "李华的弟弟三岁就有手机了，我既羡慕又嫉妒。那个晚上，我的目光几乎从来没有离开过他手上的手机。现在他的手机被他丢在厕所的地板上了，四处又无人，我心里突然响起了一个声音：“这可是你梦寐以求的手机啊！现在是很好的机会，反正拿了也没人知道，他的家人最多只会以为他弄丢了手机。”我觉得有道理，伸手正要去拿时，忽然又一个声音响了起来：“不可以拿！这是小偷的行为。”我那只刚刚伸出去的手被我硬生生地停住了。到底拿还是不拿呢？我的内心在挣扎着。这时，父母的话在我耳边响起：“勿以善小而不为，勿以恶小而为之。我们人穷但志不穷。”我没有再犹豫，立刻把手机捡起来，拿去给李华的弟弟。他稚声稚气地对我说：“谢谢哥哥！”旁人根本不把这当一回事，可是我的心里如释重负，因为我知道我做了一个正确的决定：我不要因为一台手机而使自己变成小偷。"]}, {"pic": "end", "text": ["决定是我们生活中随时会面对的。对每一个决定我们都应该三思而后行，时刻拿道德这把尺来衡量，就能做出正确的决定。"]}]}, "imp": {"label": "慧眼改进版", "words": "778", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：结尾偏说理，补一句回到“我”的感受。", "segments": [{"pic": "start", "text": ["在茫茫的人生中，我们总会遇到许多十字路口。站在十字路口前，我们的每一个决定、每一种选择，将带领我们走向不同的结果。那一次，我很庆幸做了一个正确的决定。"]}, {"pic": "1", "label": "正文①", "text": ["那天，我和几个同学一起去李华的家参加他的生日聚会。去到他家，我发现他三岁的弟弟正拿着一个手机在玩。李华说那是他用过的手机，现在换新的款式了，就把旧的给弟弟当玩具。现今社会，手机相当普及化。我们班每个同学都人手一机了，唯独我例外。每当看到他们拿出手机，或谁又拿到了最新款的手机时，我都不由露出羡慕的目光。我曾几次请求父母买一台手机给我，可是父母都面有难色。父母两个人共用一台手机，他们没有能力买一台给我，也觉得没有那个必要。他们还跟我讲了很多道理，那些道理我都明白，但我心中想要拥有一台手机的渴望并没有因此而消减过。", "李华的弟弟三岁就有手机了，我既羡慕又嫉妒。那个晚上，我的目光几乎从来没有离开过他手上的手机。现在他的手机被他丢在厕所的地板上了，四处又无人，我心里突然响起了一个声音：“这可是你梦寐以求的手机啊！现在是很好的机会，反正拿了也没人知道，他的家人最多只会以为他弄丢了手机。”我觉得有道理，伸手正要去拿时，忽然又一个声音响了起来：“不可以拿！这是小偷的行为。”我那只刚刚伸出去的手被我硬生生地停住了。到底拿还是不拿呢？我的内心在挣扎着。这时，父母的话在我耳边响起：“勿以善小而不为，勿以恶小而为之。我们人穷但志不穷。”我没有再犹豫，立刻把手机捡起来，拿去给李华的弟弟。他稚声稚气地对我说：“谢谢哥哥！”旁人根本不把这当一回事，可是我的心里如释重负，因为我知道我做了一个正确的决定：我不要因为一台手机而使自己变成小偷。"]}, {"pic": "end", "text": ["决定是我们生活中随时会面对的。对每一个决定我们都应该三思而后行，时刻拿道德这把尺来衡量，就能做出正确的决定。++我很庆幸自己当时守住了心里的那把尺，因为一个人的品格，比任何一台手机都珍贵。++"], "note": "慧眼改进：结尾偏说理，补一句回到“我”的感受。"}]}}, "detective": []}, {"id": "psle2020-cn", "title": "这样做是自私的", "cat": "falls", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2020 华文 · 试卷一 第一题（命题作文）", "kind": "命题作文", "exam": "PSLE 2020 华文", "imgs": [], "drafts": [], "vocab": ["兴致勃勃", "异口同声", "莫名其妙", "面红耳赤", "火冒三丈", "泪眼汪汪", "语重心长", "恍然大悟", "一切都是", "满头大汗", "阳光明媚"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "855", "info": "题目：《这样做是自私的》｜题型：命题作文（只给题目，不给图）｜出处：PSLE 2020 华文 · 试卷一 第一题（命题作文）", "segments": [{"pic": "start", "text": ["什么是自私？什么样的行为算自私？经过那件事后，我才深刻明白了自私的含义，并决心以后多多为他人着想。"]}, {"pic": "1", "label": "正文①", "text": ["那是年底假期的一天，阳光明媚，正如我当时的心情。我和几个邻居朋友兴致勃勃地去草场踢球。来到草场，我把随身戴的口罩折好，塞进裤兜里，就冲进了“赛场”。", "不知过了多久，我们个个踢球踢得满头大汗，口干舌燥。于是业建提议说：“我们去附近的咖啡店买饮料喝吧？”大伙儿都异口同声地表示赞同，然后各自收拾东西准备离开，我也顺手从裤兜里掏出口罩来戴。这时，莫名其妙的事情发生了：不知道我的口罩是怎么缠上了业建的耳机，还是业建的耳机不小心勾上了我的口罩，它们缠得紧紧的，一时很难分开，我使劲要拉出我心爱的口罩，业建也用力要拉回他最爱的耳机。我有点气愤：“业建，你快放手，我的口罩要破了！”业建也很生气，大声说：“你快松手，我的耳机要断了！”我们彼此争得面红耳赤，互不相让。“啪”的一声，口罩和耳机被我们无情地拉开了。我看着撕破的口罩，火冒三丈。业建看到耳机断了，气呼呼地用断掉的耳机打我……我气不过，就一拳打了过去。一场架就这样打了起来，旁边的朋友拦都拦不住。", "我带着挂彩的脸回到家，泪眼汪汪地看着妈妈，妈妈看到了，诧异得瞪大了眼睛，连忙问我发生了什么事。我气呼呼地把事情的经过一五一十地告诉妈妈，还说以后不再把业建当朋友。妈妈想了想，表情有些严肃。她语重心长地对我说：“业建虽然不对，但你也有错。你只顾着拉回自己的口罩，不管业建的耳机好坏，这样做是自私的。”“什么？我也有错？我自私？”我不敢置信地问妈妈。妈妈耐心地解释说：“只顾自己的利益，不为他人考虑就是自私的行为。自私的行为是十分要不得的，你看这不是影响你和好朋友业建的情谊了吗？你再想想，如果你不自私，当时为业建想想他的耳机，就不会拉扯，也就不会弄破口罩，弄断耳机了，这场架就可以避免了……”"]}, {"pic": "end", "text": ["妈妈的一席话让我顿时恍然大悟，原来这一切都是自私造成的。我完全没有从自私中得到任何好处，反而因此弄破口罩，弄断耳机，还打了一场架。自私实在要不得，我以后要时刻提醒自己多多为别人着想。"]}]}, "imp": {"label": "慧眼改进版", "words": "887", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：加一句名句，点出“退让一步就不会吵架”。", "segments": [{"pic": "start", "text": ["什么是自私？什么样的行为算自私？经过那件事后，我才深刻明白了自私的含义，并决心以后多多为他人着想。"]}, {"pic": "1", "label": "正文①", "text": ["那是年底假期的一天，阳光明媚，正如我当时的心情。我和几个邻居朋友兴致勃勃地去草场踢球。来到草场，我把随身戴的口罩折好，塞进裤兜里，就冲进了“赛场”。", "不知过了多久，我们个个踢球踢得满头大汗，口干舌燥。于是业建提议说：“我们去附近的咖啡店买饮料喝吧？”大伙儿都异口同声地表示赞同，然后各自收拾东西准备离开，我也顺手从裤兜里掏出口罩来戴。这时，莫名其妙的事情发生了：不知道我的口罩是怎么缠上了业建的耳机，还是业建的耳机不小心勾上了我的口罩，它们缠得紧紧的，一时很难分开，我使劲要拉出我心爱的口罩，业建也用力要拉回他最爱的耳机。我有点气愤：“业建，你快放手，我的口罩要破了！”业建也很生气，大声说：“你快松手，我的耳机要断了！”我们彼此争得面红耳赤，互不相让。“啪”的一声，口罩和耳机被我们无情地拉开了。我看着撕破的口罩，火冒三丈。业建看到耳机断了，气呼呼地用断掉的耳机打我……我气不过，就一拳打了过去。一场架就这样打了起来，旁边的朋友拦都拦不住。", "我带着挂彩的脸回到家，泪眼汪汪地看着妈妈，妈妈看到了，诧异得瞪大了眼睛，连忙问我发生了什么事。我气呼呼地把事情的经过一五一十地告诉妈妈，还说以后不再把业建当朋友。妈妈想了想，表情有些严肃。她语重心长地对我说：“业建虽然不对，但你也有错。你只顾着拉回自己的口罩，不管业建的耳机好坏，这样做是自私的。”“什么？我也有错？我自私？”我不敢置信地问妈妈。妈妈耐心地解释说：“只顾自己的利益，不为他人考虑就是自私的行为。自私的行为是十分要不得的，你看这不是影响你和好朋友业建的情谊了吗？你再想想，如果你不自私，当时为业建想想他的耳机，就不会拉扯，也就不会弄破口罩，弄断耳机了，这场架就可以避免了……”"]}, {"pic": "end", "text": ["妈妈的一席话让我顿时恍然大悟，原来这一切都是自私造成的。我完全没有从自私中得到任何好处，反而因此弄破口罩，弄断耳机，还打了一场架。++正所谓“退一步海阔天空”，如果当时我肯先松手，这一切都不会发生。++自私实在要不得，我以后要时刻提醒自己多多为别人着想。"], "note": "慧眼改进：加一句名句，点出“退让一步就不会吵架”。"}]}}, "detective": []}, {"id": "psle2021-cn", "title": "一份我最珍惜的礼物", "cat": "bonds", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2021 华文 · 试卷一 第一题（命题作文）", "kind": "命题作文", "exam": "PSLE 2021 华文", "imgs": [], "drafts": [], "vocab": ["不由自主", "迫不及待", "哇哇大哭"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "849", "info": "题目：《一份我最珍惜的礼物》｜题型：命题作文（只给题目，不给图）｜出处：PSLE 2021 华文 · 试卷一 第一题（命题作文）", "segments": [{"pic": "start", "text": ["每当我打开那个放礼物的盒子，就会看见那个爸爸妈妈送给我的优盘。这时，我就会不由自主地想起我九岁生日的那一天。"]}, {"pic": "1", "label": "正文①", "text": ["那一天是星期六，平时喜欢赖床的我早上七点正就起床了。这时，妈妈笑眯眯地站在我的床边，手里拿着一个包装精美的礼物盒，笑着对我说：“快打开看看吧，里面有惊喜呢！”说完，她就走开了。", "我迫不及待地打开礼物盒，里面放着一个优盘，我好奇地把优盘放进电脑的端口里。播放开始了，首先是“祝雪芬九岁生日快乐！”九个字印入眼帘。接下来是一张照片：一个胖嘟嘟的女宝宝，前面是一个生日蛋糕，上面写着“祝雪芬一岁生日快乐！”女宝宝脸上全是奶油，可她还是开心地笑着。“原来这是小时候的我呀！”我小声地说。"]}, {"pic": "2", "label": "正文②", "text": ["接下来是一段影片，记录着我刚学步行的片段。画面中，妈妈在离我较远的一处。我摇摇晃晃地走向妈妈，走到一半，我摔倒了，哇哇大哭起来。只见妈妈不断鼓励我：“乖孩子，不哭不哭，自己站起来。”这时，我停止哭泣，慢慢地站起来又向妈妈走去，最后扑进她的怀抱里。", "然后，又是一段影片，画面中的我比刚才大一些，只听见我稚嫩的声音唱着：“你是我的小呀小苹果…….”我一面唱，爸爸一面在旁又跳舞又比爱心的，看得我忍不住笑了。爸爸妈妈不错过任何一个我成长的时刻，一抓到机会就用手机拍下影片和照片，他们真是用心啊！"]}, {"pic": "3", "label": "正文③", "text": ["紧接着是另一段影片，那是六岁的我在幼儿园的毕业典礼上表演话剧的画面，不时可听见爸爸妈妈在现场给我加油打气的声音。这时，画面又换成爷爷奶奶教我写华文字和读故事书，他们的眼神充满慈爱。", "这时，传来一阵敲门声，妈妈捧着一个生日蛋糕向我走来，爸爸拿着手机拍照。爷爷奶奶拿着一份礼物走在后面。最后，爸爸妈妈和爷爷奶奶给我送上祝福：“愿我们的雪芬快乐成长，平安幸福。生日快乐！”我眼睛湿润了，感动地抱着他们，说：“谢谢您们送我的礼物！”"]}, {"pic": "end", "text": ["如今，这份礼物成了我最珍惜的礼物，我会好好地收藏着。这份礼物记录了我成长过程中每一个珍贵的时刻，更包含着爸爸妈妈和爷爷奶奶对我的关爱与栽培。对我来说，这是一份具有意义又无比珍贵的礼物，我会好好珍惜这份礼物。"]}]}, "imp": {"label": "慧眼改进版", "words": "861", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：原文最后一句和前面重复（“最珍惜的礼物……好好珍惜这份礼物”），改成更有意思的句子。", "segments": [{"pic": "start", "text": ["每当我打开那个放礼物的盒子，就会看见那个爸爸妈妈送给我的优盘。这时，我就会不由自主地想起我九岁生日的那一天。"]}, {"pic": "1", "label": "正文①", "text": ["那一天是星期六，平时喜欢赖床的我早上七点正就起床了。这时，妈妈笑眯眯地站在我的床边，手里拿着一个包装精美的礼物盒，笑着对我说：“快打开看看吧，里面有惊喜呢！”说完，她就走开了。", "我迫不及待地打开礼物盒，里面放着一个优盘，我好奇地把优盘放进电脑的端口里。播放开始了，首先是“祝雪芬九岁生日快乐！”九个字印入眼帘。接下来是一张照片：一个胖嘟嘟的女宝宝，前面是一个生日蛋糕，上面写着“祝雪芬一岁生日快乐！”女宝宝脸上全是奶油，可她还是开心地笑着。“原来这是小时候的我呀！”我小声地说。"]}, {"pic": "2", "label": "正文②", "text": ["接下来是一段影片，记录着我刚学步行的片段。画面中，妈妈在离我较远的一处。我摇摇晃晃地走向妈妈，走到一半，我摔倒了，哇哇大哭起来。只见妈妈不断鼓励我：“乖孩子，不哭不哭，自己站起来。”这时，我停止哭泣，慢慢地站起来又向妈妈走去，最后扑进她的怀抱里。", "然后，又是一段影片，画面中的我比刚才大一些，只听见我稚嫩的声音唱着：“你是我的小呀小苹果…….”我一面唱，爸爸一面在旁又跳舞又比爱心的，看得我忍不住笑了。爸爸妈妈不错过任何一个我成长的时刻，一抓到机会就用手机拍下影片和照片，他们真是用心啊！"]}, {"pic": "3", "label": "正文③", "text": ["紧接着是另一段影片，那是六岁的我在幼儿园的毕业典礼上表演话剧的画面，不时可听见爸爸妈妈在现场给我加油打气的声音。这时，画面又换成爷爷奶奶教我写华文字和读故事书，他们的眼神充满慈爱。", "这时，传来一阵敲门声，妈妈捧着一个生日蛋糕向我走来，爸爸拿着手机拍照。爷爷奶奶拿着一份礼物走在后面。最后，爸爸妈妈和爷爷奶奶给我送上祝福：“愿我们的雪芬快乐成长，平安幸福。生日快乐！”我眼睛湿润了，感动地抱着他们，说：“谢谢您们送我的礼物！”"]}, {"pic": "end", "text": ["如今，这份礼物成了我最珍惜的礼物，我会好好地收藏着。这份礼物记录了我成长过程中每一个珍贵的时刻，更包含着爸爸妈妈和爷爷奶奶对我的关爱与栽培。对我来说，这是一份具有意义又无比珍贵的礼物，~~我会好好珍惜这份礼物。~~++因为礼物再贵也买得到，家人的爱却是千金难买的。++"], "note": "慧眼改进：原文最后一句和前面重复（“最珍惜的礼物……好好珍惜这份礼物”），改成更有意思的句子。"}]}}, "detective": []}, {"id": "psle2022-cn", "title": "这件事让我明白了耐心的重要", "cat": "falls", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2022 华文 · 试卷一 第一题（命题作文）", "kind": "命题作文", "exam": "PSLE 2022 华文", "imgs": [], "drafts": [], "vocab": ["迫不及待", "目不转睛", "灵机一动", "晴天霹雳", "吞吞吐吐", "急于求成", "精心照料", "下定决心", "目不转睛地盯"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "772", "info": "题目：《这件事让我明白了耐心的重要》｜题型：命题作文（只给题目，不给图）｜出处：PSLE 2022 华文 · 试卷一 第一题（命题作文）", "segments": [{"pic": "start", "text": ["今天上科学课时，老师给同学们每人发了一小包绿豆，并让大家带回家放在玻璃杯里加水观察。老师要我们每天记录绿豆的变化，并且拍下照片，最后要交一份报告。谁的报告写得好、照片也拍得好，谁就会获得一份神秘奖品。一向好胜的我一听到“神秘奖品”，内心既兴奋又期待。我心想：这次我一定要拿到这份奖品！"]}, {"pic": "1", "label": "正文①", "text": ["回到家，我迫不及待地把绿豆放到玻璃杯里，加了一点儿水，然后目不转睛地盯着绿豆。一小时、两小时、三小时过去了，绿豆一点儿动静也没有。“别心急，没那么快发芽呢！”妈妈说道。我灵机一动：多加些水，说不定就会发芽了！于是，我往玻璃杯里倒了很多水。几小时后，我再上前观察，心想：咦！绿豆怎么还是没动静？", "我越来越心急，心想这次要是没拔得头筹赢取神秘奖品，我“科学天才”的外号就白叫了，那多没面子啊！无论如何，我一定要第一个从老师的手上得到奖品！这时，妈妈的话打断了我的思绪：“记得别给绿豆加太多水！”我顾不得那么多了，完全把妈妈的话当成耳边风。趁妈妈不注意时，我每小时都给杯子里加水，希望它们赶快发芽。", "第二天早上起床，我立刻去查看绿豆。这一看不得了，绿豆不仅没发芽，反而全烂了！我顿时感到晴天霹雳。回到学校，我硬着头皮，吞吞吐吐地向科学老师“自首”，请求她给我一包新的绿豆。结果，老师当着全班同学的面对我训话：“种植物不是比谁的植物长得快，而是比谁的植物长得好。”此时，我的耳根感到火辣辣的，十分难为情。我握着新的一包绿豆，下定决心要耐心地照料这些绿豆，不能急于求成。"]}, {"pic": "end", "text": ["经过几天的精心照料，绿豆终于长大了，变得胖胖的，露出了白白的肚皮，也长出了嫩嫩的芽，像一个个可爱的音符。看着它们，我心里乐滋滋的，很有成就感。妈妈说：“种植物就是考验你的耐心和坚持。你做到了！”虽然我这次没有赢得老师的神秘奖品，但是我有了一个更大的收获，那就是耐心。我现在明白只要有耐心，就有成功的机会。"]}]}, "imp": {"label": "慧眼改进版", "words": "783", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：加一句名句“欲速则不达”，和主题“耐心”紧扣。", "segments": [{"pic": "start", "text": ["今天上科学课时，老师给同学们每人发了一小包绿豆，并让大家带回家放在玻璃杯里加水观察。老师要我们每天记录绿豆的变化，并且拍下照片，最后要交一份报告。谁的报告写得好、照片也拍得好，谁就会获得一份神秘奖品。一向好胜的我一听到“神秘奖品”，内心既兴奋又期待。我心想：这次我一定要拿到这份奖品！"]}, {"pic": "1", "label": "正文①", "text": ["回到家，我迫不及待地把绿豆放到玻璃杯里，加了一点儿水，然后目不转睛地盯着绿豆。一小时、两小时、三小时过去了，绿豆一点儿动静也没有。“别心急，没那么快发芽呢！”妈妈说道。我灵机一动：多加些水，说不定就会发芽了！于是，我往玻璃杯里倒了很多水。几小时后，我再上前观察，心想：咦！绿豆怎么还是没动静？", "我越来越心急，心想这次要是没拔得头筹赢取神秘奖品，我“科学天才”的外号就白叫了，那多没面子啊！无论如何，我一定要第一个从老师的手上得到奖品！这时，妈妈的话打断了我的思绪：“记得别给绿豆加太多水！”我顾不得那么多了，完全把妈妈的话当成耳边风。趁妈妈不注意时，我每小时都给杯子里加水，希望它们赶快发芽。", "第二天早上起床，我立刻去查看绿豆。这一看不得了，绿豆不仅没发芽，反而全烂了！我顿时感到晴天霹雳。回到学校，我硬着头皮，吞吞吐吐地向科学老师“自首”，请求她给我一包新的绿豆。结果，老师当着全班同学的面对我训话：“种植物不是比谁的植物长得快，而是比谁的植物长得好。”此时，我的耳根感到火辣辣的，十分难为情。我握着新的一包绿豆，下定决心要耐心地照料这些绿豆，不能急于求成。"]}, {"pic": "end", "text": ["经过几天的精心照料，绿豆终于长大了，变得胖胖的，露出了白白的肚皮，也长出了嫩嫩的芽，像一个个可爱的音符。看着它们，我心里乐滋滋的，很有成就感。妈妈说：“种植物就是考验你的耐心和坚持。你做到了！”虽然我这次没有赢得老师的神秘奖品，但是我有了一个更大的收获，那就是耐心。++正所谓“欲速则不达”。++我现在明白只要有耐心，就有成功的机会。"], "note": "慧眼改进：加一句名句“欲速则不达”，和主题“耐心”紧扣。"}]}}, "detective": []}, {"id": "psle2023-cn", "title": "这件事让我感谢我的朋友", "cat": "bonds", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2023 华文 · 试卷一 第一题（命题作文）", "kind": "命题作文", "exam": "PSLE 2023 华文", "imgs": [], "drafts": [], "vocab": ["由衷感谢", "记忆犹新", "眉头紧锁", "乌云密布"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "775", "info": "题目：《这件事让我感谢我的朋友》｜题型：命题作文（只给题目，不给图）｜出处：PSLE 2023 华文 · 试卷一 第一题（命题作文）", "segments": [{"pic": "start", "text": ["在我的生命中，有些人、有些事，是值得我由衷感谢的。其中有一件事最令我充满感激之情，提起那件事，我至今记忆犹新。"]}, {"pic": "1", "label": "正文①", "text": ["记得那一天是放学时间，天空中乌云密布，黑压压的一片，眼看一场大雨将至。我没有带雨伞，因此放学铃声一响，我就飞一般地冲出校门。我一面跑，一面心想：一定要赶在大雨降落之前回到家！我身子弱，一淋雨就会着凉感冒，明天要参加演讲比赛，我可不能生病啊！", "才跑了一半的路程，豆大的雨点便像断了线的珍珠往下落。我眉头紧锁，心里直犯嘀咕：“这雨来得真不是时候！”我原本想冒雨跑回家；但看在明天有重要赛事不能生病的份上，只好打消这个念头。我跑到不远处的巴士站去避雨。"]}, {"pic": "2", "label": "正文②", "text": ["雨淅淅沥沥地下着，滴滴嗒嗒地落在巴士站的篷顶上，丝毫没有要停下的样子。眼看时候不早了，我越来越焦急。我得赶快回家为明天的演讲做准备呀！“明华，你是不是忘了带雨伞？”一个熟悉的声音传来。我转头一看，原来是好朋友伟伟。他扬了扬手中的雨伞，说道：“我们共用一把伞吧！”我一口答应了。", "我们走在雨中，伟伟一只手撑着伞，另一只手搭在我的肩膀上。刚开始还可感觉到雨点不时落在我肩膀上，可过了一会儿就没有了。咦，难道是雨停了？我往上一看，原来是伟伟把雨伞移向我这边了。风继续吹着，雨继续下着，我的心却涌出了阵阵暖意。"]}, {"pic": "3", "label": "正文③", "text": ["到了家，我向伟伟道谢后，他对我说：“快去擦干身体，别着凉了。还有，要好好练习演讲哦！”然后头也不回地跑了。望着他衣服湿了一半的背影，我打从心眼里感激他的热情相助。"]}, {"pic": "end", "text": ["第二天，我在演讲比赛中荣获冠军。要不是伟伟给我撑伞，我今天也许没办法站在这个台上演讲。在台上领奖的荣耀时刻，我对着台下的伟伟高高举起手中的奖杯，用唇语对他说：“谢谢你！”伟伟脸上的笑容像阳光般灿烂。这个奖是属于我和他的。回想起那一天的点点滴滴，我的内心充满感激。朋友的关心如同黑夜里的一盏灯，照亮我前行的路。愿我们的友谊能够地久天长。"]}]}, "imp": {"label": "慧眼改进版", "words": "787", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：结尾已经很好，再加一句名句。", "segments": [{"pic": "start", "text": ["在我的生命中，有些人、有些事，是值得我由衷感谢的。其中有一件事最令我充满感激之情，提起那件事，我至今记忆犹新。"]}, {"pic": "1", "label": "正文①", "text": ["记得那一天是放学时间，天空中乌云密布，黑压压的一片，眼看一场大雨将至。我没有带雨伞，因此放学铃声一响，我就飞一般地冲出校门。我一面跑，一面心想：一定要赶在大雨降落之前回到家！我身子弱，一淋雨就会着凉感冒，明天要参加演讲比赛，我可不能生病啊！", "才跑了一半的路程，豆大的雨点便像断了线的珍珠往下落。我眉头紧锁，心里直犯嘀咕：“这雨来得真不是时候！”我原本想冒雨跑回家；但看在明天有重要赛事不能生病的份上，只好打消这个念头。我跑到不远处的巴士站去避雨。"]}, {"pic": "2", "label": "正文②", "text": ["雨淅淅沥沥地下着，滴滴嗒嗒地落在巴士站的篷顶上，丝毫没有要停下的样子。眼看时候不早了，我越来越焦急。我得赶快回家为明天的演讲做准备呀！“明华，你是不是忘了带雨伞？”一个熟悉的声音传来。我转头一看，原来是好朋友伟伟。他扬了扬手中的雨伞，说道：“我们共用一把伞吧！”我一口答应了。", "我们走在雨中，伟伟一只手撑着伞，另一只手搭在我的肩膀上。刚开始还可感觉到雨点不时落在我肩膀上，可过了一会儿就没有了。咦，难道是雨停了？我往上一看，原来是伟伟把雨伞移向我这边了。风继续吹着，雨继续下着，我的心却涌出了阵阵暖意。"]}, {"pic": "3", "label": "正文③", "text": ["到了家，我向伟伟道谢后，他对我说：“快去擦干身体，别着凉了。还有，要好好练习演讲哦！”然后头也不回地跑了。望着他衣服湿了一半的背影，我打从心眼里感激他的热情相助。"]}, {"pic": "end", "text": ["第二天，我在演讲比赛中荣获冠军。要不是伟伟给我撑伞，我今天也许没办法站在这个台上演讲。在台上领奖的荣耀时刻，我对着台下的伟伟高高举起手中的奖杯，用唇语对他说：“谢谢你！”伟伟脸上的笑容像阳光般灿烂。这个奖是属于我和他的。回想起那一天的点点滴滴，我的内心充满感激。++俗话说：“患难见真情。”++朋友的关心如同黑夜里的一盏灯，照亮我前行的路。愿我们的友谊能够地久天长。"], "note": "慧眼改进：结尾已经很好，再加一句名句。"}]}}, "detective": []}, {"id": "psle2012-hc-q1", "title": "在别人的协助下，我的目标终于达到了", "cat": "guts", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2012 高华 · 试卷一 Q1（情境作文）", "kind": "情境作文", "exam": "PSLE 2012 高华", "imgs": [], "drafts": [], "vocab": ["名列前茅", "弱不禁风", "沉默不语", "风雨不改", "气喘吁吁", "莫名其妙", "哑口无言"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "771", "info": "题目：《在别人的协助下，我的目标终于达到了》｜情境：你有一个目标，要达到这个目标，你面对许多困难，但是在别人的协助下，这个目标终于达到了。｜出处：PSLE 2012 高华 · 试卷一 Q1（情境作文）", "segments": [{"pic": "start", "text": ["一直以来，我的学业成绩都是名列前茅。我总会在考试前夕为自己设下目标，并努力地朝着目标前进。然而，我并不是样样都行，运动就是我的致命伤。班上的一些同学便喜欢取笑我的这个弱点，逼得我竟然在全班面前设下目标，说自己今年的体能测试一定会得到优等！只是，凡事都是说的容易，做的难，为了这个目标，我可是吃尽了苦头。"]}, {"pic": "1", "label": "正文①", "text": ["刚开始的时候，我很积极地练跑，只要一下课便到操场上跑步。可是，我真的很少运动，所以没跑几圈就累得瘫在地上，几乎爬不起来。有一次，最爱取笑我的同学明辉正好经过操场，看到我弱不禁风的样子，便大喊：“还是放弃吧，距离体能测试只有不到一个月的时间，我看你这个样子肯定又会不及格，还拿什么优等。”", "听了明辉的话后，我沉默不语，并快速地离开了操场。一到更衣室，我的眼泪就禁不住涌出来，脑海里开始产生了放弃的念头。就在这时，我的好朋友明峰刚好进来，看到了我两眼通红的样子。他不断地安慰我，还说体能是可以通过训练来加强的。虽然我跑步的速度很慢，但只要我每天坚持慢跑，在不久后一定能跑得更快、更远。接下来的两个星期，明峰每天风雨不改地陪我跑步。我原本只要跑一圈就会气喘吁吁，但在他的鼓励和陪伴下，我已经能一口气跑四圈了！", "体能测试当天，我准备就绪。身边的同学显然没忘记我的目标，他们不断地提醒我要跑出优等的成绩，让我开始紧张，肚子也莫名其妙痛起来。眼看测试即将开始，我的肚子仍在隐隐作痛，让我顿时失去了信心。这时，明峰对我说：“不要管别人说什么，只要相信自己，你一定可以达到你的目标。”明峰的这一句话深深地刻在我脑里，成为我的动力，结果我竟然真的取得了优等的成绩！成绩出炉时，全班同学看到我的成绩后都惊叹连连，明辉更是哑口无言。"]}, {"pic": "end", "text": ["这次能够达到目标，我真的要感谢明峰的鼓励，否则我一个人很难取得这么大的进步。他教会我只要对自己有信心，就能克服很多困难，朝着目标前进。"]}]}, "imp": {"label": "慧眼改进版", "words": "816", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：结尾补一句名句，并写出“我”也要帮助别人。", "segments": [{"pic": "start", "text": ["一直以来，我的学业成绩都是名列前茅。我总会在考试前夕为自己设下目标，并努力地朝着目标前进。然而，我并不是样样都行，运动就是我的致命伤。班上的一些同学便喜欢取笑我的这个弱点，逼得我竟然在全班面前设下目标，说自己今年的体能测试一定会得到优等！只是，凡事都是说的容易，做的难，为了这个目标，我可是吃尽了苦头。"]}, {"pic": "1", "label": "正文①", "text": ["刚开始的时候，我很积极地练跑，只要一下课便到操场上跑步。可是，我真的很少运动，所以没跑几圈就累得瘫在地上，几乎爬不起来。有一次，最爱取笑我的同学明辉正好经过操场，看到我弱不禁风的样子，便大喊：“还是放弃吧，距离体能测试只有不到一个月的时间，我看你这个样子肯定又会不及格，还拿什么优等。”", "听了明辉的话后，我沉默不语，并快速地离开了操场。一到更衣室，我的眼泪就禁不住涌出来，脑海里开始产生了放弃的念头。就在这时，我的好朋友明峰刚好进来，看到了我两眼通红的样子。他不断地安慰我，还说体能是可以通过训练来加强的。虽然我跑步的速度很慢，但只要我每天坚持慢跑，在不久后一定能跑得更快、更远。接下来的两个星期，明峰每天风雨不改地陪我跑步。我原本只要跑一圈就会气喘吁吁，但在他的鼓励和陪伴下，我已经能一口气跑四圈了！", "体能测试当天，我准备就绪。身边的同学显然没忘记我的目标，他们不断地提醒我要跑出优等的成绩，让我开始紧张，肚子也莫名其妙痛起来。眼看测试即将开始，我的肚子仍在隐隐作痛，让我顿时失去了信心。这时，明峰对我说：“不要管别人说什么，只要相信自己，你一定可以达到你的目标。”明峰的这一句话深深地刻在我脑里，成为我的动力，结果我竟然真的取得了优等的成绩！成绩出炉时，全班同学看到我的成绩后都惊叹连连，明辉更是哑口无言。"]}, {"pic": "end", "text": ["这次能够达到目标，我真的要感谢明峰的鼓励，否则我一个人很难取得这么大的进步。他教会我只要对自己有信心，就能克服很多困难，朝着目标前进。++俗话说：“一个篱笆三个桩，一个好汉三个帮。”以后，我也要像明峰一样，在别人需要时伸出援手。++"], "note": "慧眼改进：结尾补一句名句，并写出“我”也要帮助别人。"}]}}, "detective": []}, {"id": "psle2012-hc-q2", "title": "一封封“求救电邮”，原来是骗局", "cat": "whoops", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2012 高华 · 试卷一 Q2（完成文章）", "kind": "完成文章", "exam": "PSLE 2012 高华", "imgs": [], "drafts": [], "vocab": ["突如其来", "虚惊一场"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "704", "info": "题目：以下面的情节作为开头，完成这篇文章——学校举办的活动结束了，我终于有时间查看这几天的电邮。我发现有很多个电邮都是由同一个人发出的，这让我感到很惊讶。我急忙打开一看……｜出处：PSLE 2012 高华 · 试卷一 Q2（完成文章）", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["学校举办的活动结束了，我终于有时间查看这几天的电邮。我发现有很多个电邮都是由同一个人发出的，这让我感到很惊讶。我急忙打开一看……"]}, {"pic": "1", "label": "正文①", "text": ["发现里头竟然是同学丽美发给我的求救信！", "丽美的第一封电邮在两天前的下午寄出，上面写道：“文婷，我和家人在国外遇到了车祸进了医院，可是身上的钱又被偷走了，没钱付医药费，请你的父母寄一些钱过来帮我们好吗？”接下来，丽美则在其他的电邮中汇报自己的情形，并不断强调情况紧急，需要我帮忙寄两千块给她们。我看完电邮后，心想：遭了，这么紧急的事，我竟然现在才看到！我连忙冲出房门告诉妈妈这件事情。"]}, {"pic": "2", "label": "正文②", "text": ["妈妈也被这突如其来的事吓了一跳，未等她反应，我就赶紧登录银行的网页，准备让妈妈第一时间处理电子转账。可是，妈妈并没有立刻行动，而是要求看丽美寄来的电邮。“妈妈，你还在等什么？”我不解地问。“别急，先打电话到丽美的家去。”妈妈说。我拨了电话，但都没人接听，让我更加相信丽美一家真的在国外。", "妈妈接着拉了我赶去丽美的家，只见大门紧闭，我们试着敲门，也没人应门。这时，妈妈的神情变得很严肃，她沉思了一会儿，便决定带我到附近的银行将钱寄给丽美。我们一路上慌慌张张的，到了银行的门口竟然还撞到了人。“文婷？是你啊！”我抬头一看，咦，站在我眼前的不就是丽美吗？我一时说不出话，反倒是妈妈赶紧将我收到电邮的事情告诉她。丽美听完后，一脸疑惑，说她最近根本没有出国，所以那些电邮都不是她寄的。"]}, {"pic": "end", "text": ["搞了半天，整件事原来是虚惊一场。妈妈说一定是骗子故意侵入丽美的电子邮箱发假的求救信给我，想骗取我们的钱。幸亏，今天妈妈够冷静，懂得到丽美的家查看，又恰巧在银行门口碰到丽美。若她之前真的按照我的话马上寄钱的话，那就白白损失了两千元。"]}]}, "imp": {"label": "慧眼改进版", "words": "772", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：原文只交代了结果，没有写道理。补上“遇事要冷静、要先查证”；顺手改了一个错别字（遭了→糟了）。", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["学校举办的活动结束了，我终于有时间查看这几天的电邮。我发现有很多个电邮都是由同一个人发出的，这让我感到很惊讶。我急忙打开一看……"]}, {"pic": "1", "label": "正文①", "text": ["发现里头竟然是同学丽美发给我的求救信！", "丽美的第一封电邮在两天前的下午寄出，上面写道：“文婷，我和家人在国外遇到了车祸进了医院，可是身上的钱又被偷走了，没钱付医药费，请你的父母寄一些钱过来帮我们好吗？”接下来，丽美则在其他的电邮中汇报自己的情形，并不断强调情况紧急，需要我帮忙寄两千块给她们。我看完电邮后，心想：~~遭了，这么紧急~~++糟了，这么紧急++的事，我竟然现在才看到！我连忙冲出房门告诉妈妈这件事情。"]}, {"pic": "2", "label": "正文②", "text": ["妈妈也被这突如其来的事吓了一跳，未等她反应，我就赶紧登录银行的网页，准备让妈妈第一时间处理电子转账。可是，妈妈并没有立刻行动，而是要求看丽美寄来的电邮。“妈妈，你还在等什么？”我不解地问。“别急，先打电话到丽美的家去。”妈妈说。我拨了电话，但都没人接听，让我更加相信丽美一家真的在国外。", "妈妈接着拉了我赶去丽美的家，只见大门紧闭，我们试着敲门，也没人应门。这时，妈妈的神情变得很严肃，她沉思了一会儿，便决定带我到附近的银行将钱寄给丽美。我们一路上慌慌张张的，到了银行的门口竟然还撞到了人。“文婷？是你啊！”我抬头一看，咦，站在我眼前的不就是丽美吗？我一时说不出话，反倒是妈妈赶紧将我收到电邮的事情告诉她。丽美听完后，一脸疑惑，说她最近根本没有出国，所以那些电邮都不是她寄的。"]}, {"pic": "end", "text": ["搞了半天，整件事原来是虚惊一场。妈妈说一定是骗子故意侵入丽美的电子邮箱发假的求救信给我，想骗取我们的钱。幸亏，今天妈妈够冷静，懂得到丽美的家查看，又恰巧在银行门口碰到丽美。若她之前真的按照我的话马上寄钱的话，那就白白损失了两千元。", "++经过这件事，我明白了遇事要冷静，不能慌慌张张就做决定。正所谓“害人之心不可有，防人之心不可无”，在网上收到要钱的信息，一定要先查证清楚。++"], "note": "慧眼改进：原文只交代了结果，没有写道理。补上“遇事要冷静、要先查证”；顺手改了一个错别字（遭了→糟了）。"}]}}, "detective": []}, {"id": "psle2013-hc-q1", "title": "开玩笑惹了祸", "cat": "falls", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2013 高华 · 试卷一 Q1（情境作文）", "kind": "情境作文", "exam": "PSLE 2013 高华", "imgs": [], "drafts": [], "vocab": ["哈哈大笑", "来龙去脉", "休息时间", "躺在地上", "三步并作两步"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "687", "info": "题目：《开玩笑惹了祸》｜情境：你原本想跟朋友开一个玩笑，让朋友吓一跳，谁知却发生了意想不到的事。你因此得到了宝贵的教训，下决心以后不再这么做了。｜出处：PSLE 2013 高华 · 试卷一 Q1（情境作文）", "segments": [{"pic": "start", "text": ["星期一的早上，我拖着沉重的脚步去上学。一想到美好的周末就这样结束了，我就觉得无聊。我盘算着待会儿休息时间要和朋友玩什么，忽然想到了一件事。上个星期，我一时好玩，买了一个塑料做的蜘蛛模型，正好还放在书包里。这时，我的脑中闪过了一个念头，决定和朋友明峰开个玩笑。"]}, {"pic": "1", "label": "正文①", "text": ["一到学校，我强忍着笑意，热情地和明峰打招呼。明峰见我的表情怪怪的，还问我怎么了。为了不让我的计划失败，我赶紧回到座位，等待出击的最佳时机。明峰最怕蜘蛛了，我今天的吓人计划一定会成功的！此刻，明峰正在专心地翻着故事书，我则悄悄地召集了几个朋友准备看热闹。接着，我手握塑料蜘蛛，三步并作两步地冲到他面前，秀出掌上的蜘蛛，再往他的身上丢去！明峰一看到蜘蛛，立刻瞪大眼睛，见我把蜘蛛往他的身上丢，更是吓得不停尖叫，完全不理会蜘蛛的真假。他脸色刷白，大力地摇摆身体，努力甩开蜘蛛。他见塑料蜘蛛掉落到脚边，便连连后退。就在这时，他踩到地上的纸张，滑了一跤！"]}, {"pic": "2", "label": "正文②", "text": ["原本在一旁哈哈大笑的我们都被这一幕吓坏了，赶紧上前看个究竟。明峰躺在地上不停地指着自己的背部，并发出哀叫声。他的眉头深锁，额头冒汗，表情看起来很痛苦。班长见了，连忙跑去教务处找班主任。我呆呆地站在一旁，后悔极了。我真不应该和明峰开这个玩笑，害他跌倒受伤。不久，医护人员赶到，把明峰抬上担架送往医院救治。"]}, {"pic": "end", "text": ["班主任问过整件事的来龙去脉后，气得脸色发青。他厉声地指责我不该开这种玩笑，并通知了我的父母。虽然被骂的感觉不好受，但我知道这件事完全是我的错。一想到这里，我的眼泪不自觉地在眼眶里打转。我一定要记住这次宝贵的教训，以后在做任何事情之前都要先考虑后果，更不敢再胡乱开玩笑了。"]}]}, "imp": {"label": "慧眼改进版", "words": "698", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：加一个成语，点出“玩过头就会出事”。", "segments": [{"pic": "start", "text": ["星期一的早上，我拖着沉重的脚步去上学。一想到美好的周末就这样结束了，我就觉得无聊。我盘算着待会儿休息时间要和朋友玩什么，忽然想到了一件事。上个星期，我一时好玩，买了一个塑料做的蜘蛛模型，正好还放在书包里。这时，我的脑中闪过了一个念头，决定和朋友明峰开个玩笑。"]}, {"pic": "1", "label": "正文①", "text": ["一到学校，我强忍着笑意，热情地和明峰打招呼。明峰见我的表情怪怪的，还问我怎么了。为了不让我的计划失败，我赶紧回到座位，等待出击的最佳时机。明峰最怕蜘蛛了，我今天的吓人计划一定会成功的！此刻，明峰正在专心地翻着故事书，我则悄悄地召集了几个朋友准备看热闹。接着，我手握塑料蜘蛛，三步并作两步地冲到他面前，秀出掌上的蜘蛛，再往他的身上丢去！明峰一看到蜘蛛，立刻瞪大眼睛，见我把蜘蛛往他的身上丢，更是吓得不停尖叫，完全不理会蜘蛛的真假。他脸色刷白，大力地摇摆身体，努力甩开蜘蛛。他见塑料蜘蛛掉落到脚边，便连连后退。就在这时，他踩到地上的纸张，滑了一跤！"]}, {"pic": "2", "label": "正文②", "text": ["原本在一旁哈哈大笑的我们都被这一幕吓坏了，赶紧上前看个究竟。明峰躺在地上不停地指着自己的背部，并发出哀叫声。他的眉头深锁，额头冒汗，表情看起来很痛苦。班长见了，连忙跑去教务处找班主任。我呆呆地站在一旁，后悔极了。我真不应该和明峰开这个玩笑，害他跌倒受伤。不久，医护人员赶到，把明峰抬上担架送往医院救治。"]}, {"pic": "end", "text": ["班主任问过整件事的来龙去脉后，气得脸色发青。他厉声地指责我不该开这种玩笑，并通知了我的父母。虽然被骂的感觉不好受，但我知道这件事完全是我的错。一想到这里，我的眼泪不自觉地在眼眶里打转。++这真是“乐极生悲”啊！++我一定要记住这次宝贵的教训，以后在做任何事情之前都要先考虑后果，更不敢再胡乱开玩笑了。"], "note": "慧眼改进：加一个成语，点出“玩过头就会出事”。"}]}}, "detective": []}, {"id": "psle2013-hc-q2", "title": "熟食中心里，我挺身劝架", "cat": "guts", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2013 高华 · 试卷一 Q2（完成文章）", "kind": "完成文章", "exam": "PSLE 2013 高华", "imgs": [], "drafts": [], "vocab": ["津津有味", "一口咬定", "来来往往", "议论纷纷", "不可思议", "不加考虑", "熟食中心", "不好意思"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "787", "info": "题目：以下面的情节作为开头，完成这篇文章——放学后，我到学校附近的熟食中心吃午餐。当我正吃得津津有味的时候，突然听到有人大声喊叫……｜出处：PSLE 2013 高华 · 试卷一 Q2（完成文章）", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["放学后，我到学校附近的熟食中心吃午餐。当我正吃得津津有味的时候，突然听到有人大声喊叫……"]}, {"pic": "1", "label": "正文①", "text": ["接着还传来摔东西的声音。我随着声音的方向望去，发现不远处有两名男子似乎在吵架。我定眼一看，认出了他们分别是菜贩摊的摊主林叔叔和鸡饭摊的摊主王叔叔。", "在好奇心的驱使下，我迅速吃完午餐后便挤进人群中看个究竟。只见，林叔叔和王叔叔指着对方大骂，显得非常激动。王叔叔更是吵得连脸都红了。从他们的对话中，我隐约了解了事情的起因。林叔叔一口咬定王叔叔抢走了他的顾客，然而王叔叔极力否认，表示林叔叔不该把生意不好的问题怪罪在他的头上。两人你一言我一语的，来来往往，后来更开始摔摊位的东西。我见情况不妙，便转头张望，看有没有大人能够帮忙劝架。"]}, {"pic": "2", "label": "正文②", "text": ["此时，围观的人越来越多，大家议论纷纷，却没有人愿意站出来劝架。不少人甚至还拿出手机拍下两位摊主吵架的过程。我觉得不可思议，却因为自己的力量有限，只能站在那里着急。可是，按照现在的情形发展，他们很可能随时会打起来！就在这时，林叔叔冲进厨房，拿出一个空的锅子，举起来便打算往王叔叔的身上打去。“不可以！”我大声喊道，同时不加考虑就直接冲上前，用书包挡着林叔叔。林叔叔的锅子正好落下，打中我举起的书包。在场的人见到这一幕，都发出了连连的惊叹声。我因为经不起林叔叔这一下击打而跌坐在地上。"]}, {"pic": "3", "label": "正文③", "text": ["原本一脸怒气的林叔叔和王叔叔没想到我会为了阻止他们吵架而跌倒。他们连忙放下手中的器具，一同上前扶我起来。林叔叔跑回摊位拿药箱，而王叔叔则扶我到一旁坐下。接着，他们紧张地查看我是否擦伤。我见他俩不再吵架，终于松了一口气，也忍不住笑了。他们见我在笑，不好意思地看了对方一眼，便不再说什么。趁他们的态度明显软化，我便主动说：“两位叔叔，大家都是好街坊，你们就不要吵架了。”"]}, {"pic": "end", "text": ["林叔叔和王叔叔听了，默默地点头表示同意。围观的人们看了，都忍不住拍手叫好。一场风波总算平息了，我也开心地背着书包回家。"]}]}, "imp": {"label": "慧眼改进版", "words": "842", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：原文结尾只写“开心地回家”，补上名句和道理。", "segments": [{"pic": "start", "label": "题目给的开头", "text": ["放学后，我到学校附近的熟食中心吃午餐。当我正吃得津津有味的时候，突然听到有人大声喊叫……"]}, {"pic": "1", "label": "正文①", "text": ["接着还传来摔东西的声音。我随着声音的方向望去，发现不远处有两名男子似乎在吵架。我定眼一看，认出了他们分别是菜贩摊的摊主林叔叔和鸡饭摊的摊主王叔叔。", "在好奇心的驱使下，我迅速吃完午餐后便挤进人群中看个究竟。只见，林叔叔和王叔叔指着对方大骂，显得非常激动。王叔叔更是吵得连脸都红了。从他们的对话中，我隐约了解了事情的起因。林叔叔一口咬定王叔叔抢走了他的顾客，然而王叔叔极力否认，表示林叔叔不该把生意不好的问题怪罪在他的头上。两人你一言我一语的，来来往往，后来更开始摔摊位的东西。我见情况不妙，便转头张望，看有没有大人能够帮忙劝架。"]}, {"pic": "2", "label": "正文②", "text": ["此时，围观的人越来越多，大家议论纷纷，却没有人愿意站出来劝架。不少人甚至还拿出手机拍下两位摊主吵架的过程。我觉得不可思议，却因为自己的力量有限，只能站在那里着急。可是，按照现在的情形发展，他们很可能随时会打起来！就在这时，林叔叔冲进厨房，拿出一个空的锅子，举起来便打算往王叔叔的身上打去。“不可以！”我大声喊道，同时不加考虑就直接冲上前，用书包挡着林叔叔。林叔叔的锅子正好落下，打中我举起的书包。在场的人见到这一幕，都发出了连连的惊叹声。我因为经不起林叔叔这一下击打而跌坐在地上。"]}, {"pic": "3", "label": "正文③", "text": ["原本一脸怒气的林叔叔和王叔叔没想到我会为了阻止他们吵架而跌倒。他们连忙放下手中的器具，一同上前扶我起来。林叔叔跑回摊位拿药箱，而王叔叔则扶我到一旁坐下。接着，他们紧张地查看我是否擦伤。我见他俩不再吵架，终于松了一口气，也忍不住笑了。他们见我在笑，不好意思地看了对方一眼，便不再说什么。趁他们的态度明显软化，我便主动说：“两位叔叔，大家都是好街坊，你们就不要吵架了。”"]}, {"pic": "end", "text": ["林叔叔和王叔叔听了，默默地点头表示同意。围观的人们看了，都忍不住拍手叫好。一场风波总算平息了，我也开心地背着书包回家。", "++俗话说：“和气生财。”两位叔叔只要互相体谅，生意一定会越来越好。我也明白了：看到不对的事，就应该勇敢地站出来。++"], "note": "慧眼改进：原文结尾只写“开心地回家”，补上名句和道理。"}]}}, "detective": []}, {"id": "psle2014-hc-q1", "title": "容易忘记事情的后果", "cat": "falls", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2014 高华 · 试卷一 Q1（情境作文）", "kind": "情境作文", "exam": "PSLE 2014 高华", "imgs": [], "drafts": [], "vocab": ["津津有味", "难以自拔", "哑口无言", "自知理亏", "迫不及待", "下定决心", "三步并作两步"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "777", "info": "题目：《容易忘记事情的后果》｜情境：你有一个坏习惯，就是容易忘记要做的事情。有一天，发生了一件事情，因为你的这个坏习惯而影响到你自己和其他的人。经过了这件事，你得到了宝贵的教训。｜出处：PSLE 2014 高华 · 试卷一 Q1（情境作文）", "segments": [{"pic": "start", "text": ["今天将是忙碌的一天。校方为我们这一班安排好，今天下午到一家老人院当义工。同学们放学后可以先回家一趟，然后下午三点再回到学校的操场上集合，由校车接我们到老人院去。担任班长的我身负重任，必须帮老师协调这次的活动。不过，我有一个坏习惯，就是容易忘记事情。为此，我事前还再三向老师确定了活动的详情，以免向同学们传达错误的信息。"]}, {"pic": "1", "label": "正文①", "text": ["一早，我正准备上华文课时，忽然接到级任老师王老师的通知，说下午的集合时间将从三点提前至一点，请我上完课后通知大家。我心想：时间提前至一点的话，就不能回家一趟了。", "今天的华文课真精彩，我们都听得津津有味！放学后，我和明华到图书馆读故事书。读着读着，我被故事的内容深深吸引，难以自拔，结果忘了时间。等我回过神来，已经是下午一点多了。“时间还早，再多看一会儿吧，反正三点才集合。”明华微笑着说。“是啊。咦，不对！”这时，我猛然想起王老师今早通知我活动时间更改的事情。糟了！我竟然忘了把这么重要的事情告诉同学们！", "我慌了，赶紧三步并作两步冲到操场。只见王老师独自在烈日下打电话，脸色明显不悦。她一见到我，劈头就问：“我刚打了电话给一些同学，他们都不知道集合时间更改了。我不是请你通知大家的吗？”这个问题把我问得哑口无言，我自知理亏，连忙向老师道歉。接着，我尝试联络部分同学，不过他们都回到家了，只赶得及在三点左右回返学校。另一方面，王老师向老人院的负责人查询后，得知院方傍晚另有安排，不方便我们太迟拜访。最后，王老师决定将义工活动延期。"]}, {"pic": "end", "text": ["后来，我帮王老师逐一通知同学们不用赶回学校。电话一通一通地拨出，我的心里实在不好受。都怪我这个健忘的坏习惯，害得王老师辛苦筹备的活动不得不延期，也使原本迫不及待想拜访老人院的同学们失望。这件事影响到的不只是我自己，还有身边的人，让我得到了宝贵的教训。我下定决心，一定要改掉容易忘记事情的坏习惯，不再做个健忘的人。"]}]}, "imp": {"label": "慧眼改进版", "words": "812", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：在决心前加一句名句，并写出具体的改正方法。", "segments": [{"pic": "start", "text": ["今天将是忙碌的一天。校方为我们这一班安排好，今天下午到一家老人院当义工。同学们放学后可以先回家一趟，然后下午三点再回到学校的操场上集合，由校车接我们到老人院去。担任班长的我身负重任，必须帮老师协调这次的活动。不过，我有一个坏习惯，就是容易忘记事情。为此，我事前还再三向老师确定了活动的详情，以免向同学们传达错误的信息。"]}, {"pic": "1", "label": "正文①", "text": ["一早，我正准备上华文课时，忽然接到级任老师王老师的通知，说下午的集合时间将从三点提前至一点，请我上完课后通知大家。我心想：时间提前至一点的话，就不能回家一趟了。", "今天的华文课真精彩，我们都听得津津有味！放学后，我和明华到图书馆读故事书。读着读着，我被故事的内容深深吸引，难以自拔，结果忘了时间。等我回过神来，已经是下午一点多了。“时间还早，再多看一会儿吧，反正三点才集合。”明华微笑着说。“是啊。咦，不对！”这时，我猛然想起王老师今早通知我活动时间更改的事情。糟了！我竟然忘了把这么重要的事情告诉同学们！", "我慌了，赶紧三步并作两步冲到操场。只见王老师独自在烈日下打电话，脸色明显不悦。她一见到我，劈头就问：“我刚打了电话给一些同学，他们都不知道集合时间更改了。我不是请你通知大家的吗？”这个问题把我问得哑口无言，我自知理亏，连忙向老师道歉。接着，我尝试联络部分同学，不过他们都回到家了，只赶得及在三点左右回返学校。另一方面，王老师向老人院的负责人查询后，得知院方傍晚另有安排，不方便我们太迟拜访。最后，王老师决定将义工活动延期。"]}, {"pic": "end", "text": ["后来，我帮王老师逐一通知同学们不用赶回学校。电话一通一通地拨出，我的心里实在不好受。都怪我这个健忘的坏习惯，害得王老师辛苦筹备的活动不得不延期，也使原本迫不及待想拜访老人院的同学们失望。这件事影响到的不只是我自己，还有身边的人，让我得到了宝贵的教训。++俗话说：“好记性不如烂笔头。”++我下定决心，一定要改掉容易忘记事情的坏习惯，不再做个健忘的人。++从此，我把每一件重要的事都写在记事本上。++"], "note": "慧眼改进：在决心前加一句名句，并写出具体的改正方法。"}]}}, "detective": []}, {"id": "psle2014-hc-q2", "title": "电梯里竟然躺着一个婴儿", "cat": "whoops", "grade": "P6", "pics": 0, "date": "", "source": "PSLE 2014 高华 · 试卷一 Q2（完成文章）", "kind": "完成文章", "exam": "PSLE 2014 高华", "imgs": [], "drafts": [], "vocab": ["惊慌失措", "匪夷所思", "战战兢兢", "逃之夭夭", "冷静下来", "小心翼翼", "怜悯之心", "回心转意", "哇哇大哭"], "versions": {"orig": {"label": "PSLE 范文 · 原文", "words": "626", "info": "题目：以下面的情节作为开头，完成这篇文章——我站在电梯门口等了很久，还是等不到电梯，于是我决定爬楼梯上去。当我正要走向楼梯口时，电梯的门却打开了。令我吃惊的是，电梯里……｜出处：PSLE 2014 高华 · 试卷一 Q2（完成文章）", "segments": [{"pic": "s
