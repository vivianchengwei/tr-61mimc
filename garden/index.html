<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="故事花园">
<meta name="theme-color" content="#1a8fd6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>故事花园 Story Garden</title>
</head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Fredoka:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
@font-face{font-family:'LXGW WenKai';src:url('fonts/kai.woff2') format('woff2');font-weight:400;font-display:swap}
/* Layout: an underwater world. Sky-blue sea with flower clouds and bubbles; yellow sponge-colored cards float on it.
   Four story families are four coral reefs; each story reads picture-by-picture like a comic strip with the text beside each frame. */
:root{
  --sea:#2db5e6; --sea-deep:#0f78b3; --sea-dark:#0a4f7d;
  --sand:#f7dc8c; --sponge:#ffd93b; --sponge-dark:#e4b300;
  --card:#fffdf4; --card-2:#fff6cf; --ink:#1b2a3a; --ink-soft:#4a5b6d; --line:#e6d9a8;
  --coral:#ff6f61; --pink:#ff8fb1; --leaf:#43b76a; --grape:#7b6cf6; --tang:#ff9f1c; --red:#d7263d;
  --bubble:rgba(255,255,255,.45);
  --font-display:'ZCOOL KuaiLe','Fredoka','Noto Sans SC',system-ui,sans-serif;
  --font-latin:'Fredoka','ZCOOL KuaiLe',system-ui,sans-serif;
  --font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --font-kai:'LXGW WenKai','KaiTi','STKaiti','楷体','BiauKai','Noto Sans SC',serif;
  --radius:22px; --shadow:0 10px 30px rgba(10,79,125,.18);
  --read-size:19px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sea:#0f3d5e; --sea-deep:#0a2b45; --sea-dark:#061a2b;
  --sand:#3b3a2a; --sponge:#f2c93a; --sponge-dark:#d9aa00;
  --card:#12314a; --card-2:#183c59; --ink:#eef6ff; --ink-soft:#b7c8d9; --line:#28506f; --red:#ff7b8a;
  --bubble:rgba(255,255,255,.14); --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sea:#0f3d5e; --sea-deep:#0a2b45; --sea-dark:#061a2b;
  --sand:#3b3a2a; --sponge:#f2c93a; --sponge-dark:#d9aa00;
  --card:#12314a; --card-2:#183c59; --ink:#eef6ff; --ink-soft:#b7c8d9; --line:#28506f; --red:#ff7b8a;
  --bubble:rgba(255,255,255,.14); --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--sea);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(180deg,var(--sea) 0%,var(--sea-deep) 70%,var(--sea-dark) 100%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sea)}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky svg{width:100%;height:100%}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding-block:14px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand .logo{width:54px;height:54px;flex:none}
.brand h1{font-family:var(--font-display);font-size:30px;margin:0;line-height:1.05;color:#fff;text-shadow:0 3px 0 rgba(10,79,125,.35);letter-spacing:.5px}
.brand h1 small{display:block;font-family:var(--font-latin);font-size:14px;letter-spacing:2px;text-transform:uppercase;opacity:.95}
.spacer{flex:1}
.namebadge{display:flex;align-items:center;gap:8px;background:var(--sponge);color:#1b2a3a;border-radius:999px;padding:6px 14px 6px 8px;box-shadow:0 4px 0 var(--sponge-dark);font-family:var(--font-latin);font-weight:600;border:0;font-size:15px}
.namebadge .pfp{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:17px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav a{font-family:var(--font-latin);font-weight:600;text-decoration:none;color:#fff;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;font-size:14px}
.nav a.on{background:#fff;color:var(--sea-deep)}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:center;margin:8px 0 22px}
.hero .bubblecard{background:var(--card);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);position:relative}
.hero h2{font-family:var(--font-display);font-size:30px;margin:0 0 6px;text-wrap:balance}
.hero p{margin:0;color:var(--ink-soft)}
.hero .mascot{justify-self:center;width:min(260px,70%)}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero .mascot{width:160px;order:-1}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:13px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* family cards */
.families{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.fam{background:var(--card);border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow);text-decoration:none;color:inherit;position:relative;overflow:hidden;border-top:8px solid var(--c);transition:transform .15s}
.fam:hover{transform:translateY(-3px)}
.fam .ico{width:52px;height:52px;margin-bottom:8px}
.fam h3{font-family:var(--font-display);font-size:22px;margin:0;line-height:1.15}
.fam h3 small{display:block;font-family:var(--font-latin);font-weight:600;font-size:14px;color:var(--c);letter-spacing:.5px}
.fam .tag{display:inline-block;margin-top:8px;font-size:12px;background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink-soft)}
.fam p{margin:8px 0 0;font-size:14px;color:var(--ink-soft)}
.fam .count{position:absolute;top:14px;right:14px;font-family:var(--font-latin);font-weight:700;background:var(--c);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px}

/* section headers */
.sec{display:flex;align-items:center;gap:12px;margin:26px 0 12px;color:#fff}
.sec h2{font-family:var(--font-display);font-size:24px;margin:0;text-shadow:0 2px 0 rgba(10,79,125,.35)}
.sec .line{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:3px}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-family:var(--font-latin);font-weight:600;background:rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-size:14px;margin-bottom:10px}

/* story cards */
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.story{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:inherit;display:flex;flex-direction:column;position:relative;transition:transform .15s}
.story:hover{transform:translateY(-3px)}
.story .thumb{aspect-ratio:4/3;background:#fff;overflow:hidden;border-bottom:4px solid var(--c)}
.pfoot{text-align:center;margin:18px 0 6px}.pfoot a{color:#fff;font-weight:700;text-decoration:none;background:rgba(0,0,0,.18);padding:8px 16px;border-radius:999px}
.bkwarn{display:block;text-align:center;margin:14px auto 0;background:#fff3c4;color:#6b4e00;border-radius:12px;padding:10px 14px;text-decoration:none;font-weight:700;max-width:640px}
.embednote{background:#ffe1e1;color:#7a1f1f;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px}
.parent{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-top:10px}
.parent h2{font-family:var(--font-display);margin:0 0 10px}.parent h3{margin:20px 0 8px;font-size:18px}
.parent .kchip{background:var(--card-2)}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:8px 0}
.pstats div{background:var(--card-2);border-radius:12px;padding:10px;text-align:center;font-size:13px;color:var(--ink-soft)}
.pstats b{display:block;font-size:26px;color:var(--ink)}
.parent details.day{border-top:1px dashed var(--line);padding:8px 0}.parent details.day summary{cursor:pointer}
.logrow{display:flex;gap:10px;padding:6px 0 6px 14px;font-size:15px}.logrow .lt{color:var(--ink-soft);min-width:44px}.logrow small{color:var(--ink-soft)}
.wrongch{display:flex;flex-wrap:wrap;gap:8px}.wrongch span{background:#fff0f0;border-radius:8px;padding:4px 10px}.wrongch small{color:#a33}
.bkbtns{display:flex;gap:10px;margin:8px 0}.parent .btn{border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;background:var(--sponge);cursor:pointer}.parent .btn.ghost{background:var(--card-2)}
#bkbox{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid var(--line);padding:8px;font-family:monospace;font-size:12px}
.ptbl td{padding:4px 12px 4px 0}.parent .muted{color:var(--ink-soft);font-size:13px}
.kthumb{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#fff,var(--card-2))}
.kthumb b{font-size:30px;letter-spacing:4px;color:var(--c)}
.kthumb span{font-size:13px;color:#666}
.kchips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.kchip{border:0;border-radius:999px;padding:7px 14px;background:rgba(255,255,255,.85);font:inherit;font-size:14px;cursor:pointer}
.kchip small{opacity:.6}
.kchip.on{background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.25);font-weight:700}
.story .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.story .body{padding:12px 14px 14px}
.story h4{font-family:var(--font-display);font-size:19px;margin:0 0 4px;line-height:1.2}
.story .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft)}
.pill{background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.pill.c{background:var(--c);border-color:var(--c);color:#fff}
.heart{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:18px;display:grid;place-items:center;color:#c9c9c9}
.heart.on{color:var(--coral)}
.story .own{position:absolute;top:10px;left:10px;background:var(--sponge);color:#1b2a3a;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;box-shadow:0 2px 0 var(--sponge-dark)}
.stars{font-size:13px;color:var(--tang);letter-spacing:1px}

/* endings card */
.endings{background:var(--card);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow);margin:0 0 16px;border-left:8px solid var(--c)}
.endings summary{cursor:pointer;font-family:var(--font-display);font-size:19px}
.endings li{margin:6px 0;font-size:15px}

/* reader */
.reader{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-top:6px}
.reader-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.reader-head h2{font-family:var(--font-display);font-size:28px;margin:0;line-height:1.15}
.reader-head .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--ink-soft)}
.reader-head .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;background:var(--card-2);color:var(--ink);border:1px solid var(--line)}
.btn.primary{background:var(--sponge);color:#1b2a3a;box-shadow:0 3px 0 var(--sponge-dark);border:0}
.btn.coral{background:var(--coral);color:#fff;border:0}
.btn.sea{background:var(--sea-deep);color:#fff;border:0}
.btn:focus-visible,.heart:focus-visible,.chip:focus-visible,.nav a:focus-visible,.opt:focus-visible{outline:3px solid var(--sponge);outline-offset:2px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px}
.strip.six{grid-template-columns:repeat(6,1fr)}
.strip img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:3px solid var(--line);background:#fff;cursor:pointer}
@media (max-width:560px){.strip{grid-template-columns:repeat(2,1fr)}.strip.six{grid-template-columns:repeat(3,1fr)}}
.vocab{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px;font-size:13px;align-items:center}
.vocab span{background:var(--card-2);border:1px dashed var(--line);border-radius:8px;padding:2px 8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px;align-items:center}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--ink)}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.chip.ghost{opacity:.55}
.chip.tool{border-style:dashed}
.chip.tool.on{background:var(--sponge);border-color:var(--sponge);color:#1b2a3a}
.sizectl{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:13px;color:var(--ink-soft)}
.sizectl button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card-2);font-weight:700}
.vinfo{font-size:13px;color:var(--ink-soft);margin:4px 0 10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.score{background:var(--leaf);color:#fff;border-radius:999px;padding:1px 10px;font-weight:700}
.ainote{background:rgba(123,108,246,.1);border:1px dashed var(--grape);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--ink-soft);margin:6px 0 10px}

.seg{display:grid;grid-template-columns:260px 1fr;gap:18px;padding:16px 0;border-top:2px dashed var(--line);align-items:start}
.seg:first-of-type{border-top:0}
.seg .pic{position:sticky;top:12px}
.seg .pic img{width:100%;border-radius:14px;border:3px solid var(--c);background:#fff;display:block}
.seg .pic .num{display:inline-block;margin-top:6px;font-family:var(--font-latin);font-weight:700;color:var(--c)}
.seg .mark{width:260px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--c);font-family:var(--font-display);font-size:22px;padding-top:4px}
.seg .mark svg{width:70px;height:70px}
.seg .txt{min-width:0;font-size:var(--read-size);line-height:2}
.seg .txt p{margin:0 0 .8em;text-indent:2em}
.seg .txt p:last-child{margin-bottom:0}
.seg .note{display:inline-block;font-size:13px;line-height:1.4;color:#b3261e;background:rgba(255,111,97,.12);border-radius:8px;padding:3px 10px;margin:6px 0 2px;text-indent:0}
.hl{background:linear-gradient(transparent 45%,rgba(255,217,59,.75) 45%);border-radius:3px;padding:0 1px}
.del{text-decoration:line-through;color:var(--ink-soft);opacity:.75}
.add{color:#1d6fd6;font-weight:600}
.mom{color:var(--red);font-weight:700}
ruby{ruby-align:center}
rt{font-size:.5em;color:var(--ink-soft);font-weight:400;letter-spacing:0;font-family:var(--font-latin)}
.nopy rt{display:none}
mark.kid{background:rgba(67,183,106,.28);border-bottom:3px solid var(--leaf);color:inherit;border-radius:2px;cursor:pointer}
.compare .txt{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.compare .txt>div{min-width:0}
.compare .txt h5{margin:0 0 6px;font-size:13px;color:var(--ink-soft);font-family:var(--font-latin);letter-spacing:.5px;text-indent:0}
.empty{background:var(--card-2);border:1px dashed var(--line);border-radius:14px;padding:16px;color:var(--ink-soft);text-align:center;font-size:15px}
.drafts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:8px}
.drafts img{width:100%;border-radius:12px;border:3px solid var(--line);background:#fff;cursor:zoom-in}
.lightbox{position:fixed;inset:0;background:rgba(6,26,43,.9);z-index:50;display:grid;place-items:center;padding:20px}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}
@media (max-width:760px){.seg{grid-template-columns:1fr}.seg .pic{position:static;max-width:320px}.seg .mark{width:auto;flex-direction:row;justify-content:flex-start}.compare .txt{grid-template-columns:1fr}}
.segplay{border:0;background:var(--card-2);border:1px solid var(--line);color:var(--ink-soft);border-radius:999px;width:30px;height:30px;font-size:12px;margin-left:6px;vertical-align:middle}
.segplay:hover{background:var(--sponge);color:#1b2a3a}
p.reading{background:rgba(45,181,230,.14);border-radius:8px;box-shadow:0 0 0 6px rgba(45,181,230,.14)}
.player{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:45;background:var(--ink);color:var(--card);border-radius:999px;padding:8px 10px 8px 14px;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:calc(100% - 24px);flex-wrap:wrap;justify-content:center;font-size:13px}
.player button{background:rgba(255,255,255,.12);color:var(--card);border:0;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.player button.main{background:var(--sponge);color:#1b2a3a;font-size:16px;padding:6px 16px}
.player select{border-radius:999px;border:0;padding:5px 8px;font:inherit;font-size:12px;max-width:150px;background:rgba(255,255,255,.15);color:var(--card)}
.player select option{color:#1b2a3a}
.player .pinfo{opacity:.8}
.hltool{position:absolute;z-index:40;display:flex;gap:6px;background:var(--ink);color:var(--card);border-radius:999px;padding:6px 8px;box-shadow:0 6px 18px rgba(0,0,0,.3);font-size:14px;font-weight:700}
.hltool button{background:var(--sponge);color:#1b2a3a;border:0;border-radius:999px;padding:6px 12px;font-weight:700}

/* detective */
.det{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-top:18px;border-top:8px solid var(--grape)}
.det h3{font-family:var(--font-display);font-size:24px;margin:0;display:flex;align-items:center;gap:10px}
.det .sub{color:var(--ink-soft);font-size:14px;margin:4px 0 12px}
.det .prog{display:flex;gap:4px;margin:8px 0 14px;flex-wrap:wrap}
.det .prog i{width:22px;height:8px;border-radius:4px;background:var(--line);display:block}
.det .prog i.ok{background:var(--leaf)}.det .prog i.bad{background:var(--coral)}.det .prog i.cur{background:var(--grape)}
.q{background:var(--card-2);border-radius:16px;padding:16px;font-size:22px;line-height:1.8;text-align:center}
.q .blank{display:inline-block;min-width:1.2em;border-bottom:3px solid var(--grape);color:var(--grape);font-weight:700;margin:0 2px}
.q .hintw{font-size:14px;color:var(--ink-soft);margin-top:6px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.opt{font-size:48px;font-family:var(--font-kai);background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px 0;transition:transform .1s;color:var(--ink)}
.opt:hover{transform:translateY(-2px)}
.opt.right{border-color:var(--leaf);background:rgba(67,183,106,.15)}
.opt.wrong{border-color:var(--coral);background:rgba(255,111,97,.15)}
.opt[disabled]{cursor:default}
@media (max-width:460px){.opt{font-size:36px}}
.fb{border-radius:16px;padding:14px 16px;margin-top:6px;font-size:15px;line-height:1.7}
.fb.ok{background:rgba(67,183,106,.12);border:2px solid var(--leaf)}
.fb.bad{background:rgba(255,111,97,.12);border:2px solid var(--coral)}
.fb b.big{font-size:20px}
.fb .pyw{font-family:var(--font-latin);color:var(--ink-soft);margin-left:6px}
.det .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.pad{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin-top:12px}
.pad canvas{width:240px;height:240px;max-width:100%;border-radius:12px;background:#fff;touch-action:none;border:3px solid var(--line);cursor:crosshair}
.pad .padtips{font-size:14px;color:var(--ink-soft)}
.pad .padbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
@media (max-width:560px){.pad{grid-template-columns:1fr}}
.report{text-align:center;padding:10px}

const STORIES = [{"id": "rain-fever", "title": "不带伞雨中漫步，发烧了", "cat": "falls", "grade": "P4", "pics": 4, "date": "2023 P4 Term3 WA2", "source": "蔡老师批改（韶辰作文）", "imgs": ["img/H17_rain_1.jpg", "img/H17_rain_2.jpg", "img/H17_rain_3.jpg", "img/H17_rain_4.jpg"], "vocab": ["乌云密布", "提醒", "雨伞", "开始下雨", "淋湿", "发烧", "担心", "后悔"], "drafts": [], "qxNote": "这是另一位同学（韶辰）的作文，老师批改后从400字变成600字，老师的批注很有用，所以也收进来。", "versions": {"adv": {"label": "范文 · 老师批改版", "words": "600", "info": "老师批注：语言描写很形象地表达了一个调皮男孩的真实想法；心有所想，行必有所动，心理活动推动情节发展——这是字数增多的写作秘笈", "segments": [{"pic": "1", "note": "图一：妈妈提醒带伞；小光当耳边风", "text": ["星期一的早上，天空乌云密布，妈妈一看到天空变了颜色，就急急忙忙地拿起雨伞说：“小光，要下雨了。你还是带着雨伞吧。”但是，小光把妈妈的话当作耳边风，他跟妈妈挥手告别后就跑去学校。"]}, {"pic": "2", "note": "图二：倾盆大雨；小光不躲雨，还雨中漫步（语言描写＋动作描写）", "text": ["在路上，小光才刚走几步，天色就变得更暗了，紧接着就[[狂风大作]]，不一会儿开始下起倾盆大雨来。不过，小光并没有因为他没有带伞而急得像热锅上的蚂蚁，反而大声地叫道：“啊！让雨来得更猛烈些吧！真凉爽呀！”他也不躲雨，或者快步走到能遮风挡雨的有盖走廊上，还来了个浪漫的[[雨中漫步]]，慢慢地在雨里走着，享受着雨天带来的清爽气息。"]}, {"pic": "3", "note": "图三：到了学校发烧；老师发现，打电话给妈妈", "text": ["到了学校，小光不由得打了一个喷嚏，他可不想像刚才那样说了。他的额头开始发热／发烧，还渗出了很多汗。他根本无法听课，只能趴在桌上，一点儿也不想动。他的异常表现刚好被林老师发现了，林老师感觉到今天的小光很不对劲，就赶紧三步并作两步地走到小光面前。她摸了摸他的额头，感到小光的额头发烫，“哎呀，不好！小光发烧了！”林老师低声说道，马上拿出手机，打电话给他的妈妈。"]}, {"pic": "4", "note": "图四：妈妈火急火燎地赶来，责骂；小光后悔", "text": ["小光的妈妈接听了林老师的电话后，就[[火急火燎]]地赶到学校的教员室接小光。她接走小光，跟林老师告别后，把小光狠狠地责骂了一顿：“看吧，一定是早上让你带伞你不带，淋到雨才发烧的。这下很难受吧！”小光自知理亏，惭愧地低下了头，小声地说：“对不起，妈妈。我真后悔没有听您的话。”"]}, {"pic": "end", "note": "老师PS：妈妈不是“别人”！说“别人”就显得情感淡了。天大地大不如父母之恩大。", "text": ["俗话说：[[不听老人言，吃亏在眼前]]。小光经过那次发烧才后悔没有听妈妈的话。从此以后，他再也不会不听妈妈的劝告了。"]}]}}, "detective": [{"w": "热锅上的蚂蚁", "t": "锅", "opts": ["锅", "涡", "祸"], "ctx": "不过，小光并没有因为他没有带伞而急得像热□上的蚂蚁，反而大声地叫道：“啊", "why": "“锅”是金字旁，锅是金属做的。“涡”是旋涡（三点水），“祸”是灾祸（示字旁）。", "hint": "金属做的 → 金字旁"}, {"w": "惭愧", "t": "惭", "opts": ["惭", "渐", "斩"], "ctx": "”小光自知理亏，□愧地低下了头，小声地说：“对不起，妈妈", "why": "“惭愧”两个字都是竖心旁，因为是心里的感觉。“渐”是渐渐（三点水），“斩”是砍。", "hint": "心里难为情 → 竖心旁"}, {"w": "惭愧", "t": "愧", "opts": ["愧", "魁", "槐"], "ctx": "”小光自知理亏，惭□地低下了头，小声地说：“对不起，妈妈", "why": "“愧”是竖心旁加“鬼”，心里觉得对不起人。“魁”是魁梧（高大），“槐”是槐树。", "hint": "竖心旁＋鬼"}, {"w": "走廊", "t": "廊", "opts": ["廊", "郎", "朗"], "ctx": "”他也不躲雨，或者快步走到能遮风挡雨的有盖走□上，还来了个浪漫的雨中漫步，慢慢地在雨里走着，享受着雨天带来的清爽气息", "why": "“走廊”的“廊”是广字头，和房子有关。“郎”是新郎，“朗”是晴朗。", "hint": "房子 → 广字头"}, {"w": "说道", "t": "道", "opts": ["道", "到", "倒"], "ctx": "”林老师低声说□，马上拿出手机，打电话给他的妈妈", "why": "“知道”“道理”的“道”是走之旁加“首”。“到”是到达（右边是刂），小作者把“知道”写成“知到”过，要记住：知道一条路 → 走之旁。", "hint": "走之旁＋首"}, {"w": "享受", "t": "享", "opts": ["享", "亨", "亭"], "ctx": "”他也不躲雨，或者快步走到能遮风挡雨的有盖走廊上，还来了个浪漫的雨中漫步，慢慢地在雨里走着，□受着雨天带来的清爽气息", "why": "“享受”的“享”上面是“亠口”，下面是“子”。“亨”下面是“了”（少一横），“亭”是亭子。", "hint": "下面是子"}, {"w": "责", "t": "责", "opts": ["责", "债", "啧"], "ctx": "她接走小光，跟林老师告别后，把小光狠狠地□骂了一顿：“看吧，一定是早上让你带伞你不带，淋到雨才发烧的", "why": "“责任”的“责”下面是“贝”，像欠了债要还。“债”是欠钱（单人旁），“啧”是啧啧称赞（口字旁）。", "hint": "贝字底"}, {"w": "爽", "t": "爽", "opts": ["爽", "奭", "夾"], "ctx": "”他也不躲雨，或者快步走到能遮风挡雨的有盖走廊上，还来了个浪漫的雨中漫步，慢慢地在雨里走着，享受着雨天带来的清□气息", "why": "“爽”中间是四个叉叉，像清清爽爽、干干净净。“夾”和“奭”都不是这个字。", "hint": "一个“大”字加四个叉"}, {"w": "猛", "t": "猛", "opts": ["猛", "孟", "锰"], "ctx": "让雨来得更□烈些吧", "why": "“猛地”“凶猛”的“猛”是反犬旁，像猛兽。", "hint": "反犬旁＋孟"}, {"w": "燎", "t": "燎", "opts": ["燎", "僚", "瞭"], "ctx": "小光的妈妈接听了林老师的电话后，就火急火□地赶到学校的教员室接小光", "why": "“火烧火燎”的“燎”是火字旁，被火烤。“僚”是同僚（单人旁），“瞭”是看得清楚（目字旁）。", "hint": "火字旁"}], "audio": {"adv": {"src": "audio/rain-fever_adv.mp3", "cues": [["rain-fever|adv|1|0", 0.05], ["rain-fever|adv|2|0", 19.19], ["rain-fever|adv|3|0", 53.57], ["rain-fever|adv|4|0", 92.71], ["rain-fever|adv|end|0", 120.96]]}}}, {"id": "math-doodle", "title": "数学课上开小差画画", "cat": "falls", "grade": "P4", "pics": 4, "date": "2025-04-01", "source": "蔡老师课件", "imgs": ["img/H01_draw_1.jpg", "img/H01_draw_2.jpg", "img/H01_draw_3.jpg", "img/H01_draw_4.jpg"], "vocab": ["数学课", "认真听讲", "开小差", "发现", "生气", "道歉", "原谅"], "drafts": ["img/draft_wx_camera_1743934721957.jpg", "img/draft_wx_camera_1743934735542.jpg", "img/draft_wx_camera_1743934751794.jpg"], "versions": {"adv": {"label": "范文 · 老师版", "words": "650", "info": "参考范文及示范 · 左栏是老师给每张图的提示", "segments": [{"pic": "1", "note": "图一：数学课上，数学老师正在教四则混合运算，同学们都在认真听讲", "text": ["一个很平常的星期三早上，在数学课上，老师正讲解着四则混合运算的难题。同学们个个[[全神贯注]]地盯着白板，仔细地听着老师的讲解，生怕漏掉任何一个关键步骤。教室里弥漫着一股浓厚的学习氛围，只有同学们沙沙的写字声和老师清晰的讲解声交织着。"]}, {"pic": "2", "note": "图二：明华自认为四则混合运算很简单，开起小差，拿出美术画本画画", "text": ["然而，明华却觉得这堂课的内容对他来说，实在太简单了，心想：这种运算题我早就会做了，有什么难的？这堂课真是太无聊了。他一边想着，一边[[漫不经心]]地打开了抽屉，从书包里拿出了一本美术画本，悄悄地翻开，低头[[专心致志]]地画了起来。他越画越投入，完全忘记了自己还在上数学课。"]}, {"pic": "3", "note": "图三：数学老师发现了，很生气，把他痛骂了一顿", "text": ["不一会儿，数学老师发现了明华的异常，缓缓／大步流星地走到他身边，突然严厉地质问道：“明华，现在是上数学课的时候，你在干什么？”教室里瞬间安静下来，同学们都停下笔，目光[[齐刷刷]]地看向了明华。教室里[[鸦雀无声，落针可闻]]。明华猛地听到老师的责骂声，吓了一跳，手里的画笔也掉在了地上，脸顿时涨得通红，羞愧极了！", "老师看见了他的画本画的内容，猜测到明华已经画了很久了，真是[[气不打一处来]]，皱着眉头，迅速走到明华旁边，严肃地批评道：“明华，你自以为四则混合运算很简单，就可以不听讲吗？学习态度如此轻率／太不认真，是对自己极不负责任的表现！”"]}, {"pic": "4", "note": "图四：明华自知理亏，只好向老师道歉。老师念在他是初犯，就原谅了他", "text": ["听了老师的话，明华感到非常惭愧，意识到自己做错了事。他低下头，小声地对老师说：“老师，我错了，对不起。我不该在上课开小差。”", "看着明华满脸歉意的表情，老师的语气缓和了下来，[[语重心长]]地说道：“希望你以后能认真对待每一堂课，不要再犯同样的错误。”念在明华是初次犯错，老师最终选择了原谅他。", "明华郑重／[[郑重其事]]地点了点头，默默地收起了画本。教室又恢复到往日的学习氛围。"]}, {"pic": "end", "note": "结尾：俗话＋下定决心", "text": ["俗话说：“吃一堑，长一智。”经过这件事之后，明华暗自下定决心：今后一定端正学习态度，再也不在课堂上做与学习无关的事情了。"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "619字", "words": "619", "info": "老师批注：第四段“惊”；夸张句和写实句的区别见结尾", "segments": [{"pic": "1", "text": ["一个平常的星期三早上，张老师的数学课正在进行着。她正在耐心地讲一道很难的数学题。同学们都在全神贯注地听课，认认真真地做笔记。"]}, {"pic": "2", "text": ["老师讲完数学题了，同学们开始飞速地写着演算的过程。明华比谁都做得快，十分钟就把五页习题都做完了。他心想：嗨，这也太简单了！补习我都学过了，我现在也不知道要做什么了，好无聊啊！不如就画画吧！于是，想到这里，他从书包里拿出一本美术画本，再拿出彩色笔，津津有味地画了起来。过了一会儿，明华完全沉浸在绘画的世界里，都忘记自己在上数学课了。"]}, {"pic": "3", "note": "“连一根针掉在地上都能听得到”是夸张句；“这时，一根针落到地上，每一个人都可以听见”是写实句，两者意思不同。这里要分段。", "text": ["张老师背着手，在课室里走来走去，四处巡视，看一看同学们需不需要她的帮助。不一会儿，她就发现了明华的异常，大步流星地走到他的身后，突然冷不防，大声地说：“明华，你在干什么？！”教室里立刻安静下来，变得鸦雀无声，连一根针掉在地上都能听得到。同学们都停下笔，目光齐刷刷地看向了明华，等待老师的反应。", "明华吓了一大跳，连忙眼疾手快地把画本藏到桌子下，可已经太晚了，老师早就发现了。明华的脸顿时涨得通红，羞愧极了！他慌慌张张地站了起来，等着老师的批评。张老师皱着眉头，头上仿佛有烈火熊熊燃烧。她严肃地批评道：“明华，你自以为这些数学题你都会了，就可以不听讲，不做笔记吗？学习态度不认真，是对自己极不负责任的表现！”"]}, {"pic": "4", "note": "这里分段", "text": ["明华听了老师的话，顿时感到很惭愧。他低下了头，小声地对张老师说：“对不起，我错了。您能原谅我吗？我不应该在上课时开小差。”老师看着明华真诚的表情，心一软，语重心长地说道：“明华，希望你以后不会犯同样的错误。”说完，她摸摸明华的头，微微地笑了起来。明华带着歉意，用力地点点头，默默地收起了画本。同学们都松了一口气，又开始做数学题了。"]}, {"pic": "end", "text": ["俗话说：“吃一堑，长一智。”经过这件事后，明华下定决心，再也不在课堂上开小差了。"]}]}}, "detective": [{"w": "全神贯注", "t": "贯", "opts": ["贯", "惯", "冠"], "ctx": "同学们都在全神□注地听课，认认真真地做笔记", "why": "“全神贯注”的“贯”是贯穿、连成一串的意思，上面是“毌”（像一串钱），下面是“贝”。“惯”是习惯（竖心旁），“冠”是帽子。", "hint": "上面像一串钱，下面是贝"}, {"w": "全神贯注", "t": "注", "opts": ["注", "住", "柱"], "ctx": "同学们都在全神贯□地听课，认认真真地做笔记", "why": "“注意”的“注”是三点水，本来是把水灌进去，引申为把心思放进去。“住”是居住（单人旁）。小作者写过“住意”！", "hint": "注意 → 三点水"}, {"w": "沉浸", "t": "沉", "opts": ["沉", "沈", "忱"], "ctx": "过了一会儿，明华完全□浸在绘画的世界里，都忘记自己在上数学课了", "why": "“沉”是三点水，沉到水里去；“沉浸”就是整个人泡在里面。“沈”是姓氏，“忱”是热忱。", "hint": "三点水＋冘"}, {"w": "沉浸", "t": "浸", "opts": ["浸", "侵", "寝"], "ctx": "过了一会儿，明华完全沉□在绘画的世界里，都忘记自己在上数学课了", "why": "“浸”是三点水，泡在水里的意思，“沉浸在书里”就像泡在书里。“侵”是侵略（单人旁），“寝”是睡觉的寝室。", "hint": "泡在水里 → 三点水"}, {"w": "惭愧", "t": "惭", "opts": ["惭", "渐", "斩"], "ctx": "明华听了老师的话，顿时感到很□愧", "why": "“惭愧”两个字都是竖心旁，因为是心里的感觉。“渐”是渐渐（三点水），“斩”是砍。", "hint": "心里难为情 → 竖心旁"}, {"w": "惭愧", "t": "愧", "opts": ["愧", "魁", "槐"], "ctx": "明华听了老师的话，顿时感到很惭□", "why": "“愧”是竖心旁加“鬼”，心里觉得对不起人。“魁”是魁梧（高大），“槐”是槐树。", "hint": "竖心旁＋鬼"}, {"w": "吃一堑", "t": "堑", "opts": ["堑", "暂", "崭"], "ctx": "俗话说：“吃一□，长一智", "why": "“吃一堑，长一智”的“堑”是土字底，本来指壕沟（掉进沟里吃了亏）。“暂”是暂时（日字底），“崭”是崭新。", "hint": "掉进土沟吃亏 → 土字底"}, {"w": "鸦雀无声", "t": "鸦", "opts": ["鸦", "鸭", "雅"], "ctx": "”教室里立刻安静下来，变得□雀无声，连一根针掉在地上都能听得到", "why": "“鸦雀无声”是乌鸦和麻雀都不叫了。“鸦”右边是“鸟”，左边“牙”表示读音。“鸭”是鸭子，“雅”是文雅。", "hint": "乌鸦是鸟 → 鸟字旁"}, {"w": "鸦雀无声", "t": "雀", "opts": ["雀", "鹊", "崔"], "ctx": "”教室里立刻安静下来，变得鸦□无声，连一根针掉在地上都能听得到", "why": "“雀”是小鸟，上面“小”下面“隹”（隹就是短尾巴的鸟）。“鹊”是喜鹊，“崔”是姓。", "hint": "小＋隹"}, {"w": "不负责任", "t": "负", "opts": ["负", "付", "贝"], "ctx": "学习态度不认真，是对自己极不□责任的表现", "why": "“负责”的“负”是背着、承担的意思，下面是“贝”。“付”是付钱，“贝”是贝壳。", "hint": "上面像人弯腰背东西"}], "audio": {"adv": {"src": "audio/math-doodle_adv.mp3", "cues": [["math-doodle|adv|1|0", 0.05], ["math-doodle|adv|2|0", 24.91], ["math-doodle|adv|3|0", 53.67], ["math-doodle|adv|3|1", 86.16], ["math-doodle|adv|4|0", 109.03], ["math-doodle|adv|4|1", 121.93], ["math-doodle|adv|4|2", 138.25], ["math-doodle|adv|end|0", 151.15]]}, "qx": {"src": "audio/math-doodle_qx.mp3", "cues": [["math-doodle|qx|1|0", 0.0], ["math-doodle|qx|2|0", 15.17], ["math-doodle|qx|3|0", 53.43], ["math-doodle|qx|3|1", 87.26], ["math-doodle|qx|4|0", 122.03], ["math-doodle|qx|end|0", 161.88]]}}}, {"id": "lost-crayons", "title": "美术课上向同学借彩色笔却弄丢", "cat": "falls", "grade": "P4", "pics": 4, "date": "2025-04-04", "source": "蔡老师课件", "imgs": ["img/H02_crayon_1.jpg", "img/H02_crayon_2.jpg", "img/H02_crayon_3.jpg", "img/H02_crayon_4.jpg"], "vocab": ["美术课", "借用", "彩色笔", "粗心", "归还", "忘记", "赔偿", "道歉"], "drafts": ["img/draft_20250413_211936.jpg", "img/draft_20250413_211944.jpg", "img/draft_20250413_211951.jpg", "img/draft_20250413_211957.jpg"], "versions": {"adv": {"label": "范文 · 老师版", "words": "620", "info": "第一人称回忆式开头 · 以《弟子规》作结", "segments": [{"pic": "start", "note": "回忆式开头法：看到彩色笔就想起往事", "text": ["每当我走进文具店，看见一盒盒[[五彩缤纷]]的彩色笔像彩虹一样躺在架子上时，我的脑海里就会浮现出那件令我后悔不已的往事来，事情是这样发生的……"]}, {"pic": "1", "note": "图一：借彩色笔；用比喻写着急", "text": ["那是上个星期三的美术课，我[[兴致勃勃]]地坐在位子上，准备[[大展身手]]。毕竟美术课是我最喜欢的科目。正当老师在台上讲解绘画技巧时，我猛然发现自己忘了带彩色笔！我急得像[[热锅上的蚂蚁]]，坐立难安，只好转向同桌小明，小声地问：“请问，我可以借用你的彩色笔吗？”小明毫不犹豫，爽快地答应：“当然可以！”他一边说着，一边把那一整盒彩色笔递给了我。我的心里顿时像开了花一样，连连向他道谢。"]}, {"pic": "2", "note": "图二：下课匆忙，忘了还", "text": ["我拿着彩笔认真作画，沉浸在五彩的世界里。不知不觉中，下课铃响了。由于接下来要到另一个课室上华文课，大家像[[离弦的箭]]一样，背起书包匆匆离开。我也在慌乱中收拾东西，脑袋里只想着不要迟到，竟把小明的彩色笔[[抛到九霄云外，忘得一干二净]]，没有放回书包里。"]}, {"pic": "3", "note": "图三：小明来要，到处找不到", "text": ["放学后，小明走过来，和颜悦色地问道：“明华，我的彩色笔呢？你还没还给我。”我听了，脸一下子变得火辣辣的。我赶紧找遍书包和文具盒，[[翻了个底朝天]]，结果连彩色笔的影子都没看到。我飞也似地跑回美术课室，把教室的每个角落、每一张桌子都搜了个遍，仍是[[一无所获]]。我[[心急如焚]]，愧悔不已，惭愧得很，真恨不得有个地洞钻进去。"]}, {"pic": "4", "note": "图四：用零花钱买新的赔给小明", "text": ["最后，我只好咬牙拿出自己[[积攒已久的零花钱]]，到学校的文具店买了一盒全新的彩色笔赔给小明。当我把彩色笔递给他时，他微笑着说：“没关系，下次记得还就好。”我听了，既感激又惭愧，心中[[五味杂陈]]。"]}, {"pic": "end", "note": "结尾：俗话＋道理；也可用《弟子规》“借人物，及时还”", "text": ["俗话说：“前事不忘，后事之师。”这次的教训像一记重锤，深深敲进了我的脑海。从那以后，我每次借用同学的文具，都会牢牢记住要及时归还，绝不马虎。因为我明白了一个道理：借人之物，如同欠人之情，必须珍惜、尊重，才能赢得信任与友情。"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "优秀作文", "words": "900", "info": "老师批注：优秀作文＋需要分段（“分段”处已按老师要求分开）。老师提醒：新加坡看图作文不需要写标题", "segments": [{"pic": "start", "text": ["“铃铃铃……”上课铃声响了，同学们[[一窝蜂]]地冲进了美术教室。明华兴奋极了，连忙／迫不及待地坐到座位上，准备大展身手。毕竟美术课是他最喜欢的科目，一个星期只上一次。"]}, {"pic": "1", "text": ["当同学们用铅笔勾勒完校园生态园的轮廓时，只听见美术老师用[[洪亮]]的声音说：“大家画出轮廓后，准备好了，可以拿出彩色笔，继续画画，涂色！”明华听了老师的话后，立刻把手伸进书包，可是，[[摸索了半天，也没有找到]]。接着，明华把书包翻了个底朝天，结果连彩色笔的影子都没有看见。他急得像热锅上的蚂蚁，豆大的汗珠从明华的额头滑了下来。", "他没办法，只好转向同桌小安，小声地问：“小安，我找不到我的画笔，可以借用你的彩笔吗？”小安爽快地答应了，微笑地说：“没问题，可是放学／下课后一定要还给我。这盒彩色笔对我很重要，是我爸爸从外地买回来的。”说完，他把整盒彩色笔递给了明华。", "明华接过小安的彩色笔，顿时心里像开了花一样，甜滋滋的，连连道谢说：“就放一百个心吧！我一定会还给你的！”说完，他拿起彩色笔，专心致志地涂色，完全沉浸在五彩缤纷的世界里。"]}, {"pic": "2", "text": ["不知不觉中，已经到了下课时间。铃声再次响起。因为下一堂课是华文，所以同学们都需要到别的教室上课。大家赶快／匆匆忙忙背起书包，跑出课室。明华在慌乱中收拾东西，只想着如果迟到了的话，华文老师会批评他，竟把小安的彩笔落在桌子上，把“及时归还小安的彩笔”的念头忘得一干二净。"]}, {"pic": "3", "text": ["放学后，小安走了过来，友好地问：“明华，我的画笔呢？还给我吧！”明华仿佛[[当头一棒]]，整个人都愣住了，脸红得像一个熟透的苹果。他赶紧把书包翻了个遍，没有找到彩色笔。明华又跑进美术教室，着急忙慌地把整个课室搜了个遍。桌子下，椅子下，教室角落都找遍了，可是依然不见彩色笔的踪影。明华急得全身是汗，心里像油煎一样焦急，眼泪在眼眶里打转。可是哭有什么用呢？他想：我一定要弥补我的错误！不然就买一盒给小安吧！"]}, {"pic": "4", "text": ["于是，明华赶快走到小卖部，掏出积攒已久的零花钱，心急如焚地对阿姨说：“阿姨，请给我一盒彩色笔！”明华拿着彩色笔，急忙对阿姨道了谢，然后像离弦的箭一样，跑到小安身边，把彩笔递给了小安。小安一脸疑惑地看着崭新的彩色笔。", "明华红着脸，低下头，吞吞吐吐地说：“对不起……小安，我把你爸爸送你的礼物弄丢了。希望你能接受这盒彩笔。”小安知道明华做事总是丢三落四的，但是谁叫他们是好朋友呢？于是，他拍拍明华的肩膀，和颜悦色地说：“没关系，下次别再丢三落四就好。”明华听了，心里像[[打翻了五味瓶]]一样，既感激又惭愧，心中五味杂陈。"]}, {"pic": "end", "text": ["俗话说：“吃一堑，长一智。”经过这件事以后，明华暗自下定决心：今后一定要小心保管同学的物品，及时归还，绝不马虎。"]}]}}, "detective": [{"w": "继续", "t": "续", "opts": ["续", "读", "绩"], "ctx": "当同学们用铅笔勾勒完校园生态园的轮廓时，只听见美术老师用洪亮的声音说：“大家画出轮廓后，准备好了，可以拿出彩色笔，继□画画，涂色", "why": "“继续”的“续”是绞丝旁，像把线接下去。“读”是言字旁，“绩”是成绩。", "hint": "接线 → 绞丝旁"}, {"w": "摸索了半天", "t": "索", "opts": ["索", "素", "绳"], "ctx": "”明华听了老师的话后，立刻把手伸进书包，可是，摸□了半天，也没有找到", "why": "“摸索”的“索”是绳子，像用手顺着绳子找。下面是“糸”（丝）。“素”是朴素，“绳”就是绳子本身。", "hint": "下面是丝，像绳子"}, {"w": "热锅上的蚂蚁", "t": "锅", "opts": ["锅", "涡", "祸"], "ctx": "他急得像热□上的蚂蚁，豆大的汗珠从明华的额头滑了下来", "why": "“锅”是金字旁，锅是金属做的。“涡”是旋涡（三点水），“祸”是灾祸（示字旁）。", "hint": "金属做的 → 金字旁"}, {"w": "爽快地答应", "t": "爽", "opts": ["爽", "奭", "夾"], "ctx": "”小安□快地答应了，微笑地说：“没问题，可是放学／下课后一定要还给我", "why": "“爽”中间是四个叉叉，像清清爽爽、干干净净。“夾”和“奭”都不是这个字。", "hint": "一个“大”字加四个叉"}, {"w": "沉浸", "t": "沉", "opts": ["沉", "沈", "忱"], "ctx": "”说完，他拿起彩色笔，专心致志地涂色，完全□浸在五彩缤纷的世界里", "why": "“沉”是三点水，沉到水里去；“沉浸”就是整个人泡在里面。“沈”是姓氏，“忱”是热忱。", "hint": "三点水＋冘"}, {"w": "沉浸", "t": "浸", "opts": ["浸", "侵", "寝"], "ctx": "”说完，他拿起彩色笔，专心致志地涂色，完全沉□在五彩缤纷的世界里", "why": "“浸”是三点水，泡在水里的意思，“沉浸在书里”就像泡在书里。“侵”是侵略（单人旁），“寝”是睡觉的寝室。", "hint": "泡在水里 → 三点水"}, {"w": "五彩缤纷", "t": "缤", "opts": ["缤", "滨", "宾"], "ctx": "”说完，他拿起彩色笔，专心致志地涂色，完全沉浸在五彩□纷的世界里", "why": "“五彩缤纷”的“缤”是绞丝旁，本来形容彩色的丝带飘来飘去。“滨”是海滨（三点水），“宾”是宾客。", "hint": "彩带 → 绞丝旁"}, {"w": "五彩缤纷", "t": "纷", "opts": ["纷", "芬", "粉"], "ctx": "”说完，他拿起彩色笔，专心致志地涂色，完全沉浸在五彩缤□的世界里", "why": "“缤纷”的“纷”是绞丝旁，很多很乱的样子。“芬”是芬芳（草字头），“粉”是米字旁。", "hint": "绞丝旁＋分"}, {"w": "九霄云外", "t": "霄", "opts": ["霄", "宵", "消"], "ctx": "我也在慌乱中收拾东西，脑袋里只想着不要迟到，竟把小明的彩色笔抛到九□云外，忘得一干二净，没有放回书包里", "why": "“九霄云外”的“霄”是雨字头，指天空最高处。“宵”是夜晚（宵夜），“消”是消失（三点水）。", "hint": "天上 → 雨字头"}, {"w": "愣住", "t": "愣", "opts": ["愣", "楞", "冷"], "ctx": "”明华仿佛当头一棒，整个人都□住了，脸红得像一个熟透的苹果", "why": "“愣住”的“愣”是竖心旁，心里一下子反应不过来。“楞”是木字旁，“冷”是冷热的冷。", "hint": "发呆是心里的事 → 竖心旁"}], "audio": {"adv": {"src": "audio/lost-crayons_adv.mp3", "cues": [["lost-crayons|adv|start|0", 0.05], ["lost-crayons|adv|1|0", 14.89], ["lost-crayons|adv|2|0", 54.31], ["lost-crayons|adv|3|0", 80.76], ["lost-crayons|adv|4|0", 112.12], ["lost-crayons|adv|end|0", 132.42]]}, "qx": {"src": "audio/lost-crayons_qx.mp3", "cues": [["lost-crayons|qx|start|0", 0.05], ["lost-crayons|qx|1|0", 18.29], ["lost-crayons|qx|1|1", 51.99], ["lost-crayons|qx|1|2", 77.6], ["lost-crayons|qx|2|0", 95.06], ["lost-crayons|qx|3|0", 124.02], ["lost-crayons|qx|4|0", 172.68], ["lost-crayons|qx|4|1", 196.63], ["lost-crayons|qx|end|0", 231.3]]}}}, {"id": "pencil-box", "title": "弄坏同学的文具盒", "cat": "falls", "grade": "P4", "pics": 4, "date": "2025-04-15", "source": "蔡老师课件", "imgs": ["img/A_pencil_1.jpg", "img/A_pencil_2.jpg", "img/A_pencil_3.jpg", "img/A_pencil_4.jpg"], "vocab": ["文具盒", "喜欢", "休息", "桌子", "欣赏", "摔坏", "承认", "道歉"], "drafts": ["img/draft_20250419_225058.jpg", "img/draft_20250419_225114.jpg", "img/draft_20250419_225129.jpg", "img/draft_20250419_225140.jpg"], "versions": {"basic": {"label": "范文 · 基础版", "words": "480", "info": "简易稿 · 考试时必须要达到的水平 · 一图一段", "segments": [{"pic": "1", "note": "图一：交代时间、人物和事件", "text": ["一个很平常的星期三的早上，大明一到学校，就跟大家[[炫耀]]他刚换了一个文具盒。原来这是昨晚他爸爸送给他的生日礼物。这个文具盒很特别，图案设计精美，功能很多。同学们都露出[[羡慕]]的眼神。"]}, {"pic": "2", "note": "图二：小丽拿起文具盒欣赏", "text": ["在课间休息的时候，大明快步向食堂走去。小丽看到大明的文具盒放在桌子上没有收起来，就走上前，拿起来仔细欣赏。她越看越喜欢，简直是[[爱不释手]]，渴望爸爸妈妈也会给她买一个。"]}, {"pic": "3", "note": "图三：文具盒摔碎了", "text": ["不一会儿，小丽看得出神，正要放回去时，文具盒[[冷不防]]从手中滑落，掉落在地上，摔了个粉碎。大明正好吃完饭，走进课室，正好看到眼前这一幕，他望着摔碎了的文具盒，心疼极了，眼泪止不住往下掉。"]}, {"pic": "4", "note": "图四：老师教训，小丽认错道歉", "text": ["很快的，上课铃声响了，级任老师走进课室，大明[[抽抽嗒嗒]]地说：“老师，小丽把我的文具盒打碎了……”说完，他站在老师的旁边，一直哭个不停。老师听了大明的话，立刻把小丽叫到跟前，狠狠地教训她。小丽[[自知理亏]]，承认错误，连忙向大明道歉说：“大明，对不起。我不该未经你同意，就拿起你的文具盒欣赏，还摔碎了。我一定会用我积攒的零用钱，买一个崭新的还给你。实在很抱歉！”大明听了，这才[[破涕为笑]]。"]}, {"pic": "end", "note": "结尾：学到的道理", "text": ["从此以后，小丽再也不敢未经同学同意就随意翻看同学的文具盒了。"]}]}, "adv": {"label": "范文 · 高阶版", "words": "1420", "info": "进阶版 · 环境描写、心理描写和对话都写得很细", "segments": [{"pic": "start", "note": "天气／环境开头法", "text": ["一个很平常的星期三早晨，[[天空澄澈明净，几缕白云悠悠地飘浮在空中]]，淡黄色的阳光透过教室的窗户洒进来，照亮了课室里的每个角落。窗外树叶轻轻摇曳，仿佛在轻声低语，微风轻拂，时不时送来一阵阵花儿的清香，真是一个令人心旷神怡的早晨！"]}, {"pic": "1", "note": "把文具盒和同学们的反应写具体", "text": ["一大早就到课室的大明，看到老师还没进课室，就迫不及待地宣布了一个好消息。“大家快来看，大家快来看，这是我爸爸昨天送给我的生日礼物！”大明兴高采烈地举起文具盒，[[脸上的笑容灿烂得犹如刚绽开的花儿一样，眼里闪着得意的光芒]]。", "“哇，好漂亮的文具盒！”同学们齐刷刷地围了过来，纷纷惊叹不已。只见文具盒上印着精致的图案，色彩斑斓，犹如一道绚丽的彩虹，更神奇的是，它有多层储物空间，各种文具躺在不同的小抽屉里，显得井井有条，就像个神奇的魔法文具屋。同学们个个都露出了羡慕不已的眼神，[[嘴巴张得大大的，像能塞下一个鸡蛋似的]]。"]}, {"pic": "2", "note": "心理描写：小丽的渴望", "text": ["课间休息时，大明飞快地跑向食堂，打算早去买自己最爱吃的海南鸡饭套餐。此时，小丽路过大明的桌旁，无意间看到了大明忘记收起来的文具盒。在好奇心的驱使下，她忍不住停下脚步，轻轻地拿起文具盒，仔细欣赏着。", "“真是太美了！要是爸爸妈妈也愿意给我买一个一模一样的文具盒就好了！”小丽低声赞叹道，她的眼睛里闪动着无比的渴望，希望爸爸妈妈也能给自己买一个如此漂亮的文具盒。"]}, {"pic": "3", "note": "动作、声音和两个人的反应", "text": ["越看越喜欢，小丽几乎忘了时间的流逝，她的手指轻轻滑过光滑的表面，沉浸在自己的幻想世界里。突然，她的手一滑，文具盒从手中滑落，重重地摔在了地板上。只听到“啪！”的一声响，文具盒瞬间[[四分五裂]]，碎片散落一地，令小丽始料不及。小丽没料到会发生这样的事情，一时[[手足无措]]，半天没有回过神来。", "就在这时，大明正好从食堂回来，看到眼前这一幕，脸上的笑容顿时凝固了，眼睛死死地盯着地上的碎片，整个人[[呆若木鸡]]，不敢相信这是真的。", "“大明，我……我不是故意的……”小丽慌忙解释，脸涨得通红，眼神里充满了懊悔与恐惧。", "然而，大明什么也听不进去，他委屈得嘴唇直颤抖，[[泪水像断了线的珠子一样，从眼眶里涌了出来]]。他抽泣着，肩膀不停地抖动，眼神里满是伤心和委屈。"]}, {"pic": "4", "note": "老师、小丽、大明三个人的对话", "text": ["上课铃声刺耳地响起，教室瞬间变得[[鸦雀无声]]。级任老师踏进教室，看到满脸泪痕的大明和惊慌失措的小丽，连忙走过去，关切地询问：“怎么回事？”", "大明哽咽着说：“老师……小丽她……把我的文具盒……摔碎了……”话没说完，又委屈地抽泣起来。", "老师眉头紧皱，严肃地看着小丽：“小丽，这究竟是怎么回事？”", "小丽低着头，手指紧张地绞在一起，[[声音细得像蚊子]]，支支吾吾地说：“老师……对不起……我错了。我不该未经大明的同意就拿他的文具盒来看，还不小心摔碎了它。我真的很抱歉……”", "老师的语气严厉而温和：“你这样未经同意翻看别人的物品，是不对的。现在应该怎么办呢？”", "小丽勇敢地抬起头，态度诚恳地对大明说：“大明，我一定会用我的零用钱再买一个崭新的文具盒赔偿给你，真的对不起！我不是故意的，是你的文具盒太招人喜欢了。”", "教室里的空气立刻凝固了，所有同学都[[屏息凝神]]，等待着大明的反应。大明眨了眨红肿的眼睛，看着小丽真诚的眼神，原本紧皱的眉头渐渐舒展开来，嘴角也慢慢浮现出一丝笑意。", "“好吧，算了吧。反正你也不是故意的。我让我的爸爸再给我买一个。”大明破涕为笑，抹了抹脸上的泪水，主动伸出手与小丽[[握手言和]]。", "小丽心里的大石头终于落地，她[[如释重负]]地松了一口气，脸上的惭愧／羞愧也渐渐转化成了轻松的微笑。"]}, {"pic": "end", "note": "两个人都学到了道理", "text": ["从此以后，小丽记住了这个教训，再也不敢未经同学的同意就随意翻看别人的物品了。而大明也懂得了宽容与谅解的道理，两人的友谊更加稳固了。"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "15/15 满分", "words": "900", "info": "蓝色＝老师加上的字；划掉＝老师删掉的字；黄色＝老师点赞的句子。老师提醒：新加坡看图作文不需要写标题。", "segments": [{"pic": "start", "note": "第一段，不宜太长", "text": ["一个微风习习的星期三早晨，教室窗外的树叶沙沙地响着，和树上的小鸟演奏了一首欢快的交响乐。大明背着书包，蹦蹦跳跳地走进了教室。他放下了书包，脸上喜悦的表情像是要宣布一个重大消息似的。"]}, {"pic": "1", "text": ["果然，他站了起来，得意洋洋地举起了一个看起来又贵又漂亮的文具盒，朝同学们大声喊道：“大家快来看！大家快来看！这是我爸爸新给我买的文具盒，漂亮吧？这个文具盒不仅图案精美，而且设计巧夺天工，有很多小机关，放得下各种文具！我开心得都睡不着觉了！”++小丽和++同学们++听了他的话++，都纷纷围了过来，向大明的文具盒投去了羡慕的眼神。++等老师走进课室，大家才回到各自的座位上。++"]}, {"pic": "2", "text": ["++不一会儿，++“铃铃铃……”下课铃声响了，大明赶快站起来，像离弦的箭一样，冲向食堂，生怕最爱吃的海南鸡饭套餐被卖光了。这时，经过大明桌子的小丽，发现大明忘了把新的文具盒收进书包。小丽顿时像脚被胶水粘在地上一样，寸步难行。漂亮的文具盒像一个强力磁铁，把小丽的目光牢牢++地++吸引住了。她++心++想：要是我爸爸妈妈也++能++给我买一个这么好++看又好用的++文具盒就好了！", "小丽目不转睛地盯着++大明的++文具盒，情不自禁地拿起来欣赏，爱不释手地玩了起来。她越++看++越入神，都忘记吃饭了！"]}, {"pic": "3", "text": ["突然，小丽++一个不留神++，手一滑，++“砰”++的一下，文具盒摔到了地上，变得四分五裂。++文具盒里的++铅笔，橡皮，尺子……滚落一地。小丽顿时大惊失色，吓得脸像一张白纸。++谁料，++这时，大明摸着圆滚滚的肚子，心满意足地走进了教室，正好看见眼前这一幕……", "大明++望着一地的狼藉，++瞬间心情晴转阴，脸上的笑容顿时凝固了，心里又生气又焦急，手心里渗出了冷汗，眼泪在眼眶里打转，脑袋里一片空白，他“哇”的一声，委屈地嚎啕++大++哭。"]}, {"pic": "4", "text": ["有一位同学听到大明哭了，急忙把王老师叫了过来，详细地告诉了她事情++发生的++经过。++王++老师听了，严肃地走到小丽面前，怒气冲冲地责问小丽道：“小丽，++你++不经过别人的同意就乱动别人的东西，是非常错误的行为！你++还打碎了大明的文具盒，++应该认真地反省自己犯的错误！”", "++听了王老师的训斥，++小丽脸涨得像一个熟透的苹果，++惭愧地++低下了头。不一会儿，她鼓起勇气，[[支支吾吾]]地说：“对不起……大明。我不应该随便动你的东西，更不应该……把文具盒弄坏了。我会用我的零花钱给你买一个一模一样的文具盒。真的很对不起，请~~您~~++你++原谅我吧。”教室里立刻安静下来，变得鸦雀无声，连一根针掉在地上都能听见。大家都在等待大明的回复。", "只见大明深深地吸了一口气，脸上阴转晴，破涕为笑，++他++真诚地看着小丽的眼睛说：“没关系，++我知道你不是故意的，++下次小心就好。我们还是好朋友！”++听了大明的话，++小丽心里像一个大石头落了地，++如释重负，++她既感激又惭愧地++看着大明和老师，++像打翻了五味瓶一样。"]}, {"pic": "end", "note": "老师PS：这篇作文在实际考试中是满分，因为只有15分；放在PSLE也是满分40分的。", "text": ["俗话说：“吃一堑，长一智。”经过这件事，小丽再也不会随便乱动别人的物品了。++而大明他也吸取教训，不再喜欢炫耀了，他也因此懂得“炫耀是灾”的道理。++"]}]}}, "detective": [{"w": "炫耀", "t": "耀", "opts": ["耀", "跃", "曜"], "ctx": "大明一到学校，就跟大家炫□他的文具盒", "why": "“耀”是光字旁，闪耀、炫耀是把东西亮给别人看。“跃”是足字旁，跳跃。", "hint": "光字旁"}, {"w": "羡慕", "t": "慕", "opts": ["慕", "幕", "墓"], "ctx": "同学们都露出□□的眼神", "why": "“慕”下面是“㣺”（心的变形），羡慕是心里想要。“幕”是巾字底（帘幕），“墓”是土字底（坟墓）。", "hint": "心里想要 → 心字底"}, {"w": "爱不释手", "t": "释", "opts": ["释", "译", "泽"], "ctx": "她越看越喜欢，简直是爱不□手", "why": "“释”是放开、放下的意思，爱不释手＝喜欢得舍不得放手。“译”是翻译，“泽”是水泽。", "hint": "放手"}, {"w": "四分五裂", "t": "裂", "opts": ["裂", "列", "烈"], "ctx": "文具盒瞬间四分五□", "why": "“裂”是衣字底，裂开、碎开。“列”是排列，“烈”是火字底（猛烈）。", "hint": "衣字底"}, {"w": "手足无措", "t": "措", "opts": ["措", "错", "借"], "ctx": "小丽一时手足无□", "why": "“措”是提手旁，安排、处理的意思，手足无措＝手脚不知道往哪放。“错”是金字旁（错误）。", "hint": "提手旁"}, {"w": "自知理亏", "t": "亏", "opts": ["亏", "夸", "污"], "ctx": "小丽自知理□，承认错误", "why": "“亏”是亏欠、少了，理亏＝道理上站不住脚。“夸”是夸奖。", "hint": "理亏 ≠ 夸"}, {"w": "破涕为笑", "t": "涕", "opts": ["涕", "弟", "剃"], "ctx": "大明听了，这才破□为笑", "why": "“涕”是三点水，眼泪的意思。破涕为笑＝停止哭，笑了。“弟”是弟弟，“剃”是剃头。", "hint": "眼泪 → 三点水"}, {"w": "握手言和", "t": "握", "opts": ["握", "屋", "渥"], "ctx": "主动伸出手与小丽□手言和", "why": "“握”是提手旁，用手握住。“屋”是房屋。", "hint": "用手 → 提手旁"}, {"w": "崭新", "t": "崭", "opts": ["崭", "斩", "渐"], "ctx": "再买一个□新的文具盒赔偿给你", "why": "“崭”是山字头，崭新＝非常新。“斩”是砍，“渐”是渐渐。", "hint": "山字头"}, {"w": "一模一样", "t": "模", "opts": ["模", "摸", "馍"], "ctx": "给你买一个一□一样的文具盒", "why": "“模”是木字旁，模样、模型。“摸”是提手旁，用手摸。两个字长得像，偏旁不同！", "hint": "木字旁"}, {"w": "委屈", "t": "屈", "opts": ["屈", "曲", "掘"], "ctx": "他“哇”的一声，委□地嚎啕大哭", "why": "“屈”是尸字头，委屈、屈服。“曲”是弯曲、歌曲。", "hint": "尸字头"}, {"w": "渗出冷汗", "t": "渗", "opts": ["渗", "参", "惨"], "ctx": "手心里□出了冷汗", "why": "“渗”是三点水，液体慢慢流出来。“参”是参加，“惨”是悲惨。", "hint": "汗水 → 三点水"}], "audio": {"basic": {"src": "audio/pencil-box_basic.mp3", "cues": [["pencil-box|basic|1|0", 0.0], ["pencil-box|basic|2|0", 21.43], ["pencil-box|basic|3|0", 40.98], ["pencil-box|basic|4|0", 62.23], ["pencil-box|basic|end|0", 105.26]]}, "adv": {"src": "audio/pencil-box_adv.mp3", "cues": [["pencil-box|adv|start|0", 0.0], ["pencil-box|adv|1|0", 29.75], ["pencil-box|adv|1|1", 52.54], ["pencil-box|adv|2|0", 85.82], ["pencil-box|adv|2|1", 108.7], ["pencil-box|adv|3|0", 125.84], ["pencil-box|adv|3|1", 159.28], ["pencil-box|adv|3|2", 174.73], ["pencil-box|adv|3|3", 184.89], ["pencil-box|adv|4|0", 201.39], ["pencil-box|adv|4|1", 216.09], ["pencil-box|adv|4|2", 226.42], ["pencil-box|adv|4|3", 232.74], ["pencil-box|adv|4|4", 250.7], ["pencil-box|adv|4|5", 259.67], ["pencil-box|adv|4|6", 277.14], ["pencil-box|adv|4|7", 296.89], ["pencil-box|adv|4|8", 312.23], ["pencil-box|adv|end|0", 324.64]]}, "qx": {"src": "audio/pencil-box_qx.mp3", "cues": [["pencil-box|qx|start|0", 0.05], ["pencil-box|qx|1|0", 21.09], ["pencil-box|qx|2|0", 60.72], ["pencil-box|qx|2|1", 99.87], ["pencil-box|qx|3|0", 111.27], ["pencil-box|qx|3|1", 138.1], ["pencil-box|qx|4|0", 157.64], ["pencil-box|qx|4|1", 180.14], ["pencil-box|qx|4|2", 215.1], ["pencil-box|qx|end|0", 238.79]]}}}, {"id": "road-ball", "title": "马路上玩球（一）", "cat": "falls", "grade": "P4", "pics": 4, "date": "2025-04-22", "source": "蔡老师课件", "imgs": ["img/B_ball_1.jpg", "img/B_ball_2.jpg", "img/B_ball_3.jpg", "img/B_ball_4.jpg"], "vocab": ["巴士站", "马路", "踢球", "劝告", "不顾一切", "危险", "差一点撞", "交通安全"], "drafts": ["img/draft_20250427_220111.jpg", "img/draft_20250427_220116.jpg", "img/draft_20250427_220124.jpg", "img/draft_20250427_220128.jpg"], "versions": {"adv": {"label": "范文 · 老师版", "words": "620", "info": "看懂图意及参考范文 · 左栏是老师给每张图的提示", "segments": [{"pic": "1", "note": "图一：地点巴士站，人物两个男孩，一个拿着足球；时间放学后", "text": ["一个很平常的星期五下午，“铃铃铃……”放学的铃声响了，同学们背着书包，[[陆陆续续]]回家了。小文和小安是同班同学，又是邻居，就一起走向巴士站，准备乘搭巴士回家。小安的手上还拿着一个足球，那是昨晚收到的生日礼物，他今天早上带来学校跟同学们[[炫耀]]的，他一整天都感到神气极了。"]}, {"pic": "2", "note": "图二：一个男孩在踢球，一个在劝阻；动作描写、语言描写", "text": ["等了很久，看到巴士还没到来，小安感到有点无聊，便拿起足球就地踢了起来。小文[[好言相劝]]说：“小安，在马路上踢足球太危险了，你还是收起来，别玩了吧。”但是小安却把小文的话当作[[耳边风]]，自顾自地踢足球，并没有把小文的话放在心上。"]}, {"pic": "3", "note": "图三：球越过马路，男孩追过去捡；另一个人劝阻来不及，十分担心", "text": ["小安踢着踢着，谁料足球像个顽皮任性的孩子，不一会儿就滚向马路的对面。小安看到足球滚到对面去，立刻像离弦的箭一样，飞奔过去，想把球捡回来。小文看到眼前这一幕，大吃一惊，连忙在小安后面大声喊道：“小安，危险！快回来！”但是小安还是继续飞奔过去，[[不顾一切]]地捡足球。"]}, {"pic": "4", "note": "图四：汽车飞驰而来，紧急刹车；让司机大骂让男孩惊醒；另一个男孩的反应", "text": ["正当小安抱起足球往回跑的时候，马路上有一辆小轿车正好疾驰过来，幸好司机刹车及时，这才没有撞上小安。司机[[气急败坏]]地探出脑袋，朝小安[[破口大骂]]：“你这个臭小子，刚才差一点被我撞上了！你想找死吗？在马路上踢足球，你的爸妈和你的学校老师没有教过你，这样做很危险吗？”", "小安听了司机的话，脸上火辣辣的，惭愧极了。小文连忙拉着小安返回巴士站的安全区域，诚恳地向轿车的司机道歉。司机的脸色这才稍微缓和了下来，又好言相劝两句，才疾驰而去。"]}, {"pic": "end", "note": "结尾：主题性升华", "text": ["俗话说：“吃一堑，长一智。”从此以后，小安吸取了教训，他深深地明白“[[马路如虎口]]”的道理，再也不敢在马路上踢足球了。"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "15/15", "words": "947", "info": "倒叙开头（先说结果，再说经过）", "segments": [{"pic": "start", "note": "倒叙开头法", "text": ["俗话说：“马路如虎口。”上个星期，小明一时贪玩，差点被车撞到了。事情是这么发生的……", "那是一个很平常的星期三傍晚，夕阳那金黄色的光芒散布在天边，微风轻拂，小文和小明刚上完了足球课外活动，走在回家的路上。他们一边走，一边兴高采烈地聊着刚刚结束的精彩足球比赛结果，开心极了！"]}, {"pic": "1", "text": ["不一会儿，他们到了巴士站，开始耐心地等待巴士。小明手里拿着一个[[擦得锃亮]]的足球把玩着，是教练送给他的一个礼物，因为小明在比赛中获得了第一名。"]}, {"pic": "2", "note": "好！", "text": ["等了很久，看到巴士还没来，小明感到很无聊，便把足球放在地上，兴致勃勃地开始练习一个教练新教他的[[颠球]]技能。小文在一旁看到了，紧张得手里[[捏着一把汗]]，连忙苦口婆心地劝告小明说：“小明，你这样做很危险！快停下！万一球滚到马路上怎么办？”没想到，小明[[毫不在乎]]地说：“你就放一百个心吧！我的技术可好啦！在比赛中还拿到第一名呢！我怎么可能犯这种低级错误啊？”说完，他得意洋洋地边转身边练习颠球，好像在表演杂技似的。转着转着，小明突然[[腿一软，失去了平衡]]，一脚把足球踢向马路。"]}, {"pic": "3", "text": ["顿时，足球像离弦的箭一样，飞向了马路对面。小明急得像热锅上的蚂蚁，跺着脚，自言自语道：“这是新足球！可不能弄坏了！”说完，他不顾一切，头也不回地跑到马路中间去捡球。这时，小文看见眼前这一幕，大惊失色，吓得说不出话来。他定了定神，结结巴巴地大喊：“小明小心！太危险啦！快快回来呀！”但是小明却[[置若罔闻]]／但是小明却没有把小文的话放在心上。"]}, {"pic": "4", "text": ["说时迟，那时快，一辆橙色的小轿车沿着马路飞驰而来。司机远远地看见小明在马路中央，“嘀嘀嘀”地猛按喇叭，试图引起小明的注意。可小明专心致志地捡球，丝毫没有察觉到有危险。等他面带笑容地拿着球，回头一看，小轿车已经近在眼前了，他整个人都吓傻了！", "幸好司机猛踩刹车，小轿车“吱”的一声，停在小明面前，都快撞到他的鼻子尖了。小明瞬间傻眼了，抱着足球，脸色苍白，动弹不得，脚像被胶水粘在马路上似的。司机是一个白发苍苍的老爷爷。他看到汽车前面傻傻站着的小明，真是气不打一处来。他怒气冲冲地从车窗探出头来，朝小明破口大骂／责骂说：“你个臭小子，找死啊！今天是你幸运我也幸运，否则你一条小命都会丢掉！过马路一定要注意交通安全！这样太危险了！”", "小明听了司机的话，脸顿时红得像番茄一样，低下头，支支吾吾地说：“对……对不起，我不是故意的！请您原谅我吧！”老爷爷看到小明诚恳地道歉，点点头说：“知错能改，还是一个好孩子！过马路一定要注意交通安全！这样太危险了！”然后他就开车离开了。不一会儿，巴士也来了。小明和小文这才[[心有余悸]]地上车回家了。"]}, {"pic": "end", "text": ["俗话说：“一朝被蛇咬，十年怕井绳。”经过这次意外，小明懂得了一个道理：交通安全无小事，马路如虎口，我们必须时刻保持警惕，遵守交通规则。正如老师常说：“上天有好生之德。”生命只有一次，我们要好好珍惜。"]}]}}, "detective": [{"w": "陆陆续续", "t": "陆", "opts": ["陆", "录", "路"], "ctx": "一个很平常的星期五下午，“铃铃铃……”放学的铃声响了，同学们背着书包，□陆续续回家了", "why": "“陆陆续续”的“陆”是双耳旁（左耳旁），本来指陆地。“录”是记录，“路”是道路。", "hint": "左耳旁"}, {"w": "陆陆续续", "t": "续", "opts": ["续", "读", "绩"], "ctx": "一个很平常的星期五下午，“铃铃铃……”放学的铃声响了，同学们背着书包，陆陆□续回家了", "why": "“继续”的“续”是绞丝旁，像把线接下去。“读”是言字旁，“绩”是成绩。", "hint": "接线 → 绞丝旁"}, {"w": "炫耀", "t": "炫", "opts": ["炫", "眩", "弦"], "ctx": "小安的手上还拿着一个足球，那是昨晚收到的生日礼物，他今天早上带来学校跟同学们□耀的，他一整天都感到神气极了", "why": "“炫耀”的“炫”是火字旁，像火光闪闪给人看。“眩”是头晕眼花（目字旁），“弦”是琴弦。", "hint": "火光闪闪 → 火字旁"}, {"w": "炫耀", "t": "耀", "opts": ["耀", "跃", "曜"], "ctx": "小安的手上还拿着一个足球，那是昨晚收到的生日礼物，他今天早上带来学校跟同学们炫□的，他一整天都感到神气极了", "why": "“炫耀”的“耀”左边是“光”，右边是“翟”。“跃”是跳跃（足字旁），“曜”是日字旁。", "hint": "光字旁"}, {"w": "捏着一把汗", "t": "捏", "opts": ["捏", "涅", "捍"], "ctx": "小文在一旁看到了，紧张得手里□着一把汗，连忙苦口婆心地劝告小明说：“小明，你这样做很危险", "why": "“捏”是提手旁，用手指捏。“捏了一把冷汗”就是紧张得手心出汗。", "hint": "用手 → 提手旁"}, {"w": "毫不在乎", "t": "毫", "opts": ["毫", "豪", "亳"], "ctx": "”没想到，小明□不在乎地说：“你就放一百个心吧", "why": "“毫不犹豫”的“毫”是细毛，下面是“毛”；一毫都没有＝一点也不。“豪”是豪杰、自豪，下面是“豕”（猪）。", "hint": "下面是毛"}, {"w": "腿一软", "t": "腿", "opts": ["腿", "退", "褪"], "ctx": "转着转着，小明突然□一软，失去了平衡，一脚把足球踢向马路", "why": "“腿”是月肉旁，身体的部位都用月字旁。“退”是后退，“褪”是褪色（衣字旁）。", "hint": "身体部位 → 月字旁"}, {"w": "腿一软", "t": "软", "opts": ["软", "欢", "轼"], "ctx": "转着转着，小明突然腿一□，失去了平衡，一脚把足球踢向马路", "why": "“软”是车字旁加“欠”。“腿软”就是腿没力气了。“欢”是欢乐，“轼”是古人的名字里的字。", "hint": "车字旁"}, {"w": "失去了平衡", "t": "衡", "opts": ["衡", "衔", "衢"], "ctx": "转着转着，小明突然腿一软，失去了平□，一脚把足球踢向马路", "why": "“失去平衡”的“衡”中间是“鱼＋大”的变形，外面是“行”。“衔”是口里含着（中间是金）。", "hint": "外面是行，中间是鱼和大"}, {"w": "猛按喇叭", "t": "猛", "opts": ["猛", "孟", "锰"], "ctx": "司机远远地看见小明在马路中央，“嘀嘀嘀”地□按喇叭，试图引起小明的注意", "why": "“猛地”“凶猛”的“猛”是反犬旁，像猛兽。", "hint": "反犬旁＋孟"}], "audio": {"adv": {"src": "audio/road-ball_adv.mp3", "cues": [["road-ball|adv|1|0", 0.05], ["road-ball|adv|2|0", 29.64], ["road-ball|adv|3|0", 53.88], ["road-ball|adv|4|0", 83.8], ["road-ball|adv|4|1", 111.46], ["road-ball|adv|end|0", 129.85]]}, "qx": {"src": "audio/road-ball_qx.mp3", "cues": [["road-ball|qx|start|0", 0.0], ["road-ball|qx|start|1", 12.01], ["road-ball|qx|1|0", 34.95], ["road-ball|qx|2|0", 50.85], ["road-ball|qx|3|0", 100.83], ["road-ball|qx|4|0", 137.86], ["road-ball|qx|4|1", 161.74], ["road-ball|qx|4|2", 200.14], ["road-ball|qx|end|0", 226.66]]}}}, {"id": "fifty-dollars", "title": "课间休息时捡到50元钱", "cat": "bonds", "grade": "P4", "pics": 4, "date": "2025-04-28", "source": "蔡老师课件", "imgs": ["img/H03_money_1.jpg", "img/H03_money_2.jpg", "img/H03_money_3.jpg", "img/H03_money_4.jpg"], "vocab": ["篮球场", "捡到", "建议", "平分", "不答应", "失主", "告诉", "诚实", "称赞", "需要"], "drafts": ["img/draft_20250503_225701.jpg", "img/draft_20250503_225707.jpg", "img/draft_20250503_225715.jpg", "img/draft_20250503_225720.jpg"], "versions": {"basic": {"label": "范文 · 基础版", "words": "633", "info": "课堂必须要掌握的简单版本（必须掌握）", "segments": [{"pic": "1", "note": "图一：课间休息，两人到篮球场散步", "text": ["“铃铃铃……”课间休息的铃声响了，同学们都一窝蜂似的，涌入食堂，[[津津有味]]地品尝着美味的食物。小文和小安也像[[风卷残云]]般，[[狼吞虎咽]]地吃完食物，就相约到篮球场散散步，聊聊天。", "他们俩沿着篮球场边走边聊天。走着走着，戴着眼镜的小安突然指着地上的一张50元钞票说：“小文，你看地上有一张钞票！”小文顺着小安手指的方向，定睛一看，地上果然有一张绿色的50元大钞。"]}, {"pic": "2", "note": "图二：小安想平分；语言描写", "text": ["小安立刻走上前，捡起钱，[[眉开眼笑]]地对小文说：“真是天助我也。这50元正好我们俩可以平分。我们可以买乐高玩具。我买直升机，你买坦克。我正愁没有钱买玩具呢！”"]}, {"pic": "3", "note": "图三：小文不答应，劝小安交给老师", "text": ["小文听了小安的话，连忙摆摆手说：“不可以，不可以！不是属于我们的钱，不可以拿。50元可不少，丢失的人一定很着急，我们应该交给老师，让老师帮忙找失主，还给失主。老师常常教导我们要做个[[拾金不昧]]的好学生，你忘记了吗？”", "听了小文的话，小安的脸上火辣辣的。他答应和小文一起去办公室交给老师。"]}, {"pic": "4", "note": "图四：交给老师，老师表扬，失主小丽道谢", "text": ["于是，小文和小安立刻赶到办公室交给级任老师50元钱，没想到级任老师笑呵呵地竖起大拇指，表扬小文和小安说：“你们懂得拾金不昧，不愧是老师的好学生！刚才小丽正好来报告说她在篮球场打球时丢失了50元。没想到被你们捡到了。”站在一旁的小丽也感激地说：“真是太感谢了！小文和小安。这是我一个星期的生活费呢！要是丢失了，我一定会被父母责骂的。”", "听了小丽的话，小文和小安[[相视一笑]]。小安尴尬地挠了挠头，后悔刚才不该动了平分50元的念头。"]}, {"pic": "end", "note": "结尾", "text": ["俗话说：“经一事，长一智。”经过这件事之后，小文和小安更加明白了“拾金不昧”的真正含义。"]}]}, "adv": {"label": "范文 · 高阶版", "words": "1110", "info": "进阶识字版（老师说：不要被吓到）", "segments": [{"pic": "1", "note": "声音开头；交代两个好朋友", "text": ["“铃铃铃……”随着一阵清脆的铃声响起，课间休息到了。同学们像一群快乐的小鸟，叽叽喳喳地走出课室，很有秩序地来到食堂。他们排好队购买到美味可口的食物，吃得津津有味。小文和小安也像风卷残云一般，狼吞虎咽地吃完食物，兴高采烈地往篮球场走去。", "小文和小安是[[志同道合、无话不谈]]的好朋友。他们喜欢在吃完饭后一起去篮球场晒晒太阳，聊聊天，散散步。", "他们肩并肩，有说有笑地走着。走着走着，忽然，小安像发现新大陆似的，指着地上一张钞票，激动地喊道：“小文，你快看！地上有一张五十元钞票！”听了小安的话，小文顺着小安手指的方向仔细一瞧，果然见到地上躺着一张绿色的五十元大钞，[[像一片落在地上的树叶]]，十分显眼。"]}, {"pic": "2", "note": "图二：小安喜出望外，想平分", "text": ["小安喜出望外，连忙跑上前，蹲下来，捡起钞票，眉开眼笑地对小文说：“真是天上掉下来的礼物啊！这五十元我们可以平分了。我要买乐高直升机，你可以买坦克模型。我们还可以交换玩具玩。我正愁没有钱买玩具呢！／我正愁囊中羞涩呢，没想到‘[[天上掉馅饼]]’！”"]}, {"pic": "3", "note": "图三：小文斩钉截铁地拒绝；小安如当头棒喝", "text": ["没想到，小文听了小安的话，连连摆手，[[斩钉截铁]]地说／严肃地说：“不可以，不可以！这不是我们的钱，不能起贪念，不能见财起意，想占为己有。五十元可不是小数目，丢失的人一定是会心急如焚的。老师常常[[谆谆教诲]]／常常教导我们要做拾金不昧的好学生，难道你忘了吗？”说完，他直勾勾地盯着小安的眼睛，不可置信地看着他。", "小文的话，如[[当头棒喝]]，让小安一愣。小安的脸顿时红得像熟透的苹果，羞愧得低下了头。沉默片刻，他终于点了点头，低声说：“你说得对，我们应该交给老师。”"]}, {"pic": "4", "note": "图四：交给老师；老师夸奖；小丽失而复得", "text": ["于是，两人一路飞奔，像阵风一样冲到办公室，把钱交给了级任老师，把事情发生的经过[[一五一十]]地告诉老师。老师听了事情的经过后，顿时眉开眼笑，竖起大拇指夸奖道：“你们真是拾金不昧的好孩子，是同学们的好榜样，不愧是老师[[引以为傲]]的学生！”", "说完，老师拍了拍旁边的小丽的肩膀说：“你看，我就说不用担心嘛！你丢失的钱现在‘[[物归原主]]’了。”小丽看着[[失而复得]]的50元，感激地说：“太谢谢你们了，小文、小安！这是我一个星期的生活费，要是丢了，我可真是有口难辩，免不了会被父母责骂的。你们俩真是我的救星！”", "听了小丽的话，小文和小安相视而笑。小安不好意思地挠了挠头，心里暗暗后悔，庆幸自己及时回头，没有在品行上留下污点，否则就会做出让自己后悔莫及的事情。／小安心中暗暗庆幸自己没有一错到底，否则便是悔之晚矣。他想起古人云：“勿以恶小而为之。”"]}, {"pic": "end", "note": "结尾：主题升华", "text": ["俗话说：“经一事，长一智。”这次经历让小文和小安更加明白了拾金不昧的重要意义。经历了这件事，小安仿佛一夜长大了许多，明白了“[[君子爱财，取之有道]]”的道理，也深刻体会到拾金不昧不仅仅是一种美德，更是一种人格的修炼。"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "15/15", "words": "882", "info": "老师批注：非常好！主题应该和主人公相关，从主人公角度出发，不必跳出主人公以上帝视角来说明。", "segments": [{"pic": "1", "text": ["一个平常的星期四下午，晴空万里，太阳还没有收敛起正午的酷热，依旧[[火辣辣地炙烤着大地]]，树上的树叶都[[无精打采地耷拉着脑袋]]。小明和小安刚打完一场精彩的篮球比赛，汗流浃背地走向饮水机。", "突然，小安眼前一亮，发现地上躺着一片长方形的绿色树叶！他走上前，定睛一看，居然是一张崭新的五十元大钞！于是，他三步并作两步地冲上前，把钱捡了起来，转头一看，小明也跑过来了。他们[[异口同声]]地说：“谁把这么多钱掉落在这里啊？！”"]}, {"pic": "2", "text": ["小明见四下无人，得意洋洋地对小安说：“哈哈！小安，我们今天发财啦！简直是天上掉馅饼！我们平分这五十元吧！我可以买飞机模型，你可以买坦克模型！我们盼望了好久，今天可以[[如愿以偿]]了！”小安听了他的话，一时有些心动，但是心脏扑通扑通跳个不停，连头上都出了汗。他心想：老师谆谆教诲我们一定要诚实，守信。这个钱应该要物归原主才对。"]}, {"pic": "3", "text": ["于是，小安严肃地对小明说：“小明，你怎么可以这么想呢？这不是我们的钱，如果我们占为己有，失主一定会心急如焚的！老师常常教导我们要当一个拾金不昧的好孩子，难道你忘了吗？我知道你很渴望拥有自己的飞机模型，但是君子爱财，取之有道。我们不该起贪念，把这五十元据为己有，应该自己慢慢攒钱，总有一天可以买到的！”", "小明听了这番话，如同当头棒喝，清醒过来，惭愧不已，觉得自己之前真是太糊涂了。他看着小安真诚的眼神，脸红得像熟透的苹果一样，支支吾吾地说：“对……对不起，我一时被[[猪油蒙了心]]！我们现在就去办公室把钱交给级任老师吧！”"]}, {"pic": "4", "text": ["小安点了点头，于是他们像离弦的箭一样跑到了办公室，正好看见焦急的级任老师和同班同学小丽一起说着什么。小丽一脸焦急地站在老师的身边。小明[[恭恭敬敬]]地把钱递给了老师，说：“老师，这是我和小安在篮球场捡到的五十元钱。请您帮我们寻找失主吧！”这时，小丽[[欣喜若狂]]地大喊：“这正是我不小心丢的，被你们捡到还归还了回来！”因此，级任老师就顺手递给了小丽。听了小丽感激的话语，小安和小明相视而笑，心里美滋滋的，比喝了蜜糖还甜。", "老师看了这一幕，笑得合不拢嘴。她竖起大拇指，称赞道：“孩子们，你们做得太棒了！明天我一定会在全班同学面前表扬你们拾金不昧的行为，让大家都向你们学习！”小安和小明听了老师的话，心里美滋滋的，比喝了蜜糖还甜。"]}, {"pic": "end", "text": ["俗话说：“经一事，长一智。”经过这件事之后，小明和小安才真正明白了拾金不昧的意义。古人云：“勿以恶小而为之，勿以善小而不为。”小明也感激小安及时地纠正了他的错误行为，让他明白我们做人要诚实有担当。"]}]}}, "detective": [{"w": "汗流浃背", "t": "浃", "opts": ["浃", "夹", "挟"], "ctx": "小明和小安刚打完一场精彩的篮球比赛，汗流□背地走向饮水机", "why": "“浃”是三点水旁，意思是湿透。汗流浃背＝汗水把后背都湿透了。“夹”是夹住东西，“挟”是用胳膊夹着，都和水没关系。", "hint": "流汗 → 想到水 → 三点水"}, {"w": "志同道合", "t": "道", "opts": ["道", "到", "倒"], "ctx": "小文和小安是志同□合、无话不谈的好朋友", "why": "“知道”“道理”的“道”是走之旁加“首”。“到”是到达（右边是刂），小作者把“知道”写成“知到”过，要记住：知道一条路 → 走之旁。", "hint": "走之旁＋首"}, {"w": "天上掉馅饼", "t": "馅", "opts": ["馅", "陷", "焰"], "ctx": "简直是天上掉□饼", "why": "“馅饼”的“馅”是食字旁，饼里的东西是吃的。“陷”是陷进去（左耳旁），“焰”是火焰。", "hint": "吃的 → 食字旁"}, {"w": "天上掉馅饼", "t": "饼", "opts": ["饼", "拼", "并"], "ctx": "简直是天上掉馅□", "why": "“饼”是食字旁，饼是吃的。“拼”是拼命（提手旁），“并”是并且。", "hint": "吃的 → 食字旁"}, {"w": "坦克模型", "t": "型", "opts": ["型", "形", "刑"], "ctx": "我可以买飞机模型，你可以买坦克模□", "why": "“模型”“类型”的“型”下面有“土”，本来是做东西的模子。“形”是形状，“刑”是刑罚。", "hint": "土字底"}, {"w": "物归原主", "t": "归", "opts": ["归", "旧", "妇"], "ctx": "这个钱应该要物□原主才对", "why": "“物归原主”的“归”是回去、还回去的意思。右边像一把扫帚。“旧”是新旧的旧，“妇”是妇女。", "hint": "左边两竖，右边像扫帚"}, {"w": "严肃", "t": "严", "opts": ["严", "岩", "炎"], "ctx": "于是，小安□肃地对小明说：“小明，你怎么可以这么想呢", "why": "“严肃”的“严”上面是“业”的变形，一横在上。“岩”是岩石，“炎”是炎热（两个火）。", "hint": "上面一横一竖，不是山"}, {"w": "严肃", "t": "肃", "opts": ["肃", "萧", "素"], "ctx": "于是，小安严□地对小明说：“小明，你怎么可以这么想呢", "why": "“严肃”的“肃”像一个人恭恭敬敬站着，笔画要写对：中间一竖到底，两边像八字。“萧”是草字头，“素”是朴素。", "hint": "中间一竖到底"}, {"w": "斩钉截铁地说", "t": "斩", "opts": ["斩", "崭", "暂"], "ctx": "没想到，小文听了小安的话，连连摆手，□钉截铁地说／严肃地说：“不可以，不可以", "why": "“斩钉截铁”的“斩”是车＋斤（斧头），砍得干脆。“崭”是崭新（山字头），“暂”是暂时（日字底）。", "hint": "车＋斤（斧头）"}, {"w": "惭愧不已", "t": "惭", "opts": ["惭", "渐", "斩"], "ctx": "小明听了这番话，如同当头棒喝，清醒过来，□愧不已，觉得自己之前真是太糊涂了", "why": "“惭愧”两个字都是竖心旁，因为是心里的感觉。“渐”是渐渐（三点水），“斩”是砍。", "hint": "心里难为情 → 竖心旁"}], "audio": {"basic": {"src": "audio/fifty-dollars_basic.mp3", "cues": [["fifty-dollars|basic|1|0", 0.05], ["fifty-dollars|basic|1|1", 17.82], ["fifty-dollars|basic|2|0", 37.05], ["fifty-dollars|basic|3|0", 53.8], ["fifty-dollars|basic|3|1", 74.01], ["fifty-dollars|basic|4|0", 80.97], ["fifty-dollars|basic|4|1", 112.97], ["fifty-dollars|basic|end|0", 122.05]]}, "adv": {"src": "audio/fifty-dollars_adv.mp3", "cues": [["fifty-dollars|adv|1|0", 0.05], ["fifty-dollars|adv|1|1", 24.69], ["fifty-dollars|adv|1|2", 34.1], ["fifty-dollars|adv|2|0", 58.56], ["fifty-dollars|adv|3|0", 82.97], ["fifty-dollars|adv|3|1", 112.83], ["fifty-dollars|adv|4|0", 127.73], ["fifty-dollars|adv|4|1", 153.67], ["fifty-dollars|adv|4|2", 181.15], ["fifty-dollars|adv|end|0", 209.49]]}, "qx": {"src": "audio/fifty-dollars_qx.mp3", "cues": [["fifty-dollars|qx|1|0", 0.05], ["fifty-dollars|qx|1|1", 20.8], ["fifty-dollars|qx|2|0", 46.81], ["fifty-dollars|qx|3|0", 81.35], ["fifty-dollars|qx|3|1", 112.14], ["fifty-dollars|qx|4|0", 134.15], ["fifty-dollars|qx|4|1", 181.93], ["fifty-dollars|qx|end|0", 205.12]]}}}, {"id": "bus-seat", "title": "巴士上给老爷爷让座", "cat": "bonds", "grade": "P4", "pics": 4, "date": "2025-05-06", "source": "蔡老师课件", "imgs": ["img/C_bus_1.jpg", "img/C_bus_2.jpg", "img/C_bus_3.jpg", "img/C_bus_4.jpg"], "vocab": ["拥挤", "座位", "摇摆", "挥手道别", "辛苦", "让位", "称赞", "懂事"], "drafts": ["img/draft_20250514_215833.jpg", "img/draft_20250514_215841.jpg", "img/draft_20250514_215850.jpg", "img/draft_20250514_215853.jpg"], "versions": {"basic": {"label": "范文 · 基础版", "words": "500", "info": "初阶版 · 一图一段＋开头和结尾", "segments": [{"pic": "start", "note": "天气开头法；交代天气、人物、地点和事件", "text": ["一个很平常的星期天早上，[[金灿灿的阳光透过稀疏的云层，洒在城市的上空]]。小文姐姐和小明弟弟一看天气晴好，决定去住家附近的社区图书馆借几本书回来看。", "他们刚刚走出门，就已经热得受不了了，因为太阳太大了，[[炙烤着大地，像个大火球一样高挂在天空，晒得人大汗淋漓]]。小文姐姐和小明弟弟就决定乘搭巴士去图书馆。"]}, {"pic": "1", "note": "图一：巴士很拥挤", "text": ["巴士上很拥挤，一个座位也没有。不一会儿，巴士到站，有人下车，小明弟弟看到了一个空位。"]}, {"pic": "2", "note": "图二：发现老公公站不稳", "text": ["他刚要坐下，突然发现身边站着一位满头白发／白发苍苍的老公公。那个老公公吃力地站着，[[颤颤巍巍]]的，身体也跟着巴士左右摇晃，好像随时要摔倒的样子。"]}, {"pic": "3", "note": "图三：让座；动作、语言和心理描写", "text": ["小明弟弟连忙把座位让给了老公公，他微笑地说：“老爷爷，您请坐在这里的空位上。”", "老公公承接了小明的美意，就坐下来了。他转过头，一脸慈爱地对小明说：“谢谢你，小朋友。你真是个[[懂得尊老敬贤]]的好孩子。”小明弟弟听了老公公的话后，[[心里甜滋滋的，比吃了蜜糖还甜]]。"]}, {"pic": "4", "note": "图四：挥手道别", "text": ["巴士继续在公路上行驶着，不一会儿就到达目的地了。小文姐姐和小明弟弟下了车，发现巴士上的那位老公公还在跟他们挥手道别。他们也隔着玻璃车窗朝老公公挥了挥手，跟老公公道别。"]}, {"pic": "end", "note": "结尾", "text": ["小文姐姐看着老公公嘴角咧开的笑容和逐渐远去的背影，也对着弟弟竖起大拇指，夸弟弟说：“弟弟，你小小年纪就懂得主动给老人家让座，你真棒！”听了小文姐姐的称赞后，小明[[心里乐开了花]]，一整天都沉浸在喜悦之中。"]}]}, "adv": {"label": "范文 · 高阶版", "words": "1100", "info": "进阶版 · 多用比喻、拟人和细节描写", "segments": [{"pic": "start", "note": "天气描写后接着人物的上场；用拟人修辞", "text": ["一个很平常的星期天早上，金灿灿的阳光透过稀疏的云层，洒满了整座城市。[[湛蓝的天空好像／宛如被清水洗过一般，几朵洁白的云朵悠闲地在空中飘荡／散步]]。小鸟在枝头上唱着婉转的歌儿，像是在为这美好的一天拉开序幕。空气中弥漫着阳光的味道，一切都显得格外宁静与和谐，令人心旷神怡。", "小文姐姐和小明弟弟吃完早餐后，决定趁着好天气，走向巴士站，想去住家附近的社区图书馆借几本书回来阅读。姐弟俩一边走出门，一边讨论着要借阅什么书，脸上洋溢着幸福的笑容。"]}, {"pic": "1", "note": "用比喻句描写巴士拥挤；过了几站才空出座位", "text": ["不久，巴士缓缓驶来。姐弟俩排好队，上了车。[[巴士车厢里挤满了人，大家肩贴着肩，脚碰着脚，动都动不了，就像沙丁鱼被密集地塞进罐头里，一点空隙也没有，更别说会有空位了]]。小文姐姐和小明弟弟只好紧紧拉着扶手，勉强站稳。", "过了两三站，又有乘客挤上了巴士，巴士上的乘客也陆陆续续下车，终于空出了一个座位。小明眼尖，赶紧一个箭步走过去，想坐下来。"]}, {"pic": "2", "note": "描写老爷爷的衰老程度", "text": ["正当他快要落座时，[[小明的余光瞥见身旁站着一位白发苍苍的老爷爷。那老爷爷满脸皱纹，身子瘦得像细长的竹竿，仿佛风一吹就会倒。他手握扶杆，身子跟着巴士左摇右晃，双腿颤颤巍巍，看起来随时都会摔倒]]。"]}, {"pic": "3", "note": "让座的动作和语言；老爷爷夸赞，男孩的反应", "text": ["小明看在眼里，急在心里。他毫不犹豫地停下脚步，把空位让了出来，满脸微笑，彬彬有礼地对老爷爷说：“老爷爷，您请坐在这里吧！”[[他的语气亲切又有礼，声音虽不大，却如一缕清风，温暖人心]]。", "老爷爷听了小明的话，看了看他[[毕恭毕敬]]的样子，脸上[[顿时浮现出慈祥的笑容]]，连声道谢：“谢谢你，小朋友。你真是个[[懂得尊老敬贤、品德高尚]]的好孩子！”说完，老爷爷慢慢地坐下了。小明听到这番赞美，眉飞色舞，心里甜滋滋的，比吃了蜜糖还甜。他[[腼腆]]地笑了笑，没有说话，但眼神中闪烁着骄傲的光芒。"]}, {"pic": "4", "note": "老爷爷挥手和姐姐的夸奖", "text": ["巴士继续在公路上奔驰／行驶着，窗外的树木一棵棵从眼前掠过，车外的风景飞快地倒退着。没过多久，他们终于到达图书馆所在的巴士站。小文姐姐和小明弟弟下了车，刚走出几步，便听见有人在叫他们。他们回头一看，原来是那位老爷爷正坐在窗边，[[笑吟吟]]地朝他们挥手道别。小明和小文也赶紧隔着玻璃窗向老爷爷挥手道别，脸上都挂着幸福的微笑。", "当老爷爷的背影慢慢从视线中消失时，小文看着弟弟，竖起了大拇指，[[心悦诚服]]地夸奖道：“弟弟，你小小年纪就懂得主动为别人着想，真是太棒了！”小明听了，开心得嘴巴都合不拢。"]}, {"pic": "end", "note": "主题性升华", "text": ["在巴士上让座这一件看似平凡的小事，却让姐弟俩的星期天变得特别温馨而有意义。小明用行动证明了“[[赠人玫瑰，手有余香]]”的道理，也让尊老敬贤的美德在这座优雅城市的阳光下悄然绽放。", "从此以后，每当在巴士车厢或地铁车厢看到年长者时，小明都会毫不犹豫地让座。小明更懂得关心和体贴他人，成为了一个心地善良、更有责任感的孩子。"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "15/15", "words": "841", "info": "蓝色＝老师加上的字；划掉＝老师删掉的字；黄色＝老师点赞的句子", "segments": [{"pic": "start", "note": "描写炎热天气的句段，非常好！", "text": ["[[一个++天气++炎热的星期六++中午时分++，太阳像一个大火球一样炙烤着大地。连小狗都不敢出门，++一直++吐着舌头喘粗气，++蹲在门口。天地之间闷热得像个大蒸笼似的++，可是热浪并没有阻挡住小文姐姐和小安弟弟去图书馆借书的脚步。]]"]}, {"pic": "1", "text": ["等他们++姐弟俩++汗流浃背地走到巴士站时，开往图书馆的巴士正好慢悠悠地驶了过来。", "小文和小安相视一笑，终于可以享受到巴士里的空调了！可是，上了巴士后，他们发现巴士上已经挤满了人，大家肩并肩，脚碰脚，像被塞进了沙丁鱼罐头一样。别说空位了，连下脚的地方都没有。++姐弟俩只好站着，随着巴士的前行一路摇晃着。++"]}, {"pic": "2", "note": "好！", "text": ["这时，巴士到了下一站。几个乘客陆陆续续地下了车。小安看见不远处有一个空座位，他心里一阵激动，连忙三步并作两步地冲了上去，++还++招呼姐姐过来坐下。正在这时，[[小安看见一位++拄着拐杖的++老爷爷颤颤巍巍地走上了巴士。只见他满脸皱纹，头发像雪一样白，紧紧地握着扶手，身体随着巴士的摇晃东倒西歪，好像一阵风就能把他吹倒似的。]]"]}, {"pic": "3", "text": ["小安看着老爷爷虚弱的样子，心里涌起了一阵担心和心疼。他想起++爸爸++妈妈常常教导他和姐姐要++懂得++关爱他人，尤其是老人。++想到这里，++小安决定把这一个座位让给老爷爷。于是，他彬彬有礼地对老爷爷说：“老爷爷，请您坐这里吧！”老爷爷听了，++点了点头，承接小安的美意就顺势坐下来了。他的++脸上露出了欣慰的笑容，竖起大拇指，++一脸++慈爱地++对小安++说：“谢谢你，小朋友。你真是一个懂礼貌的好孩子！”周围的乘客看了这一幕，都向小安投去了赞许的目光。小安心里美滋滋的，比吃了蜜糖还甜。"]}, {"pic": "4", "note": "最后一句接到结尾段去", "text": ["不一会儿，巴士开到了图书馆附近++的站点++。小安和小文准备下车了。小安++一脸稚气地++对老爷爷说：“老爷爷，我们要到了，再见！周末愉快！”“好，好，再见！今天真是谢谢你了！”老爷爷笑容满面地说。", "小安和小文下车以后，转过头来，居然看见老爷爷在向他们挥手道别，++脸上带着和蔼可亲的笑容++。姐弟俩也向老爷爷挥了挥手致意。等巴士拐了一个弯，消失在姐弟俩的视线中后，小文看向小安，微笑地夸奖他说：“小安，你真是一个++懂得++尊老敬贤的好++弟弟！++我真为你骄傲。我会把今天发生的事告诉++爸爸妈妈，他们++也一定会为你自豪的！”小安听了，++心里乐开了花。++~~下定了决心，以后在任何地方看到需要帮助的人他都会伸出援手。~~"]}, {"pic": "end", "text": ["俗话说：“赠人玫瑰，手有余香。”经过这件事，小安更加明白了这句话的意义。帮助人不仅能给别人带来温暖，还能让小安收获快乐和成长。++他暗自下定了决心，以后在任何地方看到需要帮助的人他都会及时地伸出援手。++"]}]}}, "detective": [{"w": "汗流浃背", "t": "浃", "opts": ["浃", "夹", "挟"], "ctx": "等他们姐弟俩汗流□背地走到巴士站时", "why": "“浃”是三点水旁，意思是湿透。汗流浃背＝汗水把后背都湿透了。“夹”是夹住东西，“挟”是用胳膊夹着，都和水没关系。", "hint": "流汗 → 想到水 → 三点水"}, {"w": "颤颤巍巍", "t": "巍", "opts": ["巍", "魏", "嵬"], "ctx": "老爷爷颤颤□□地走上了巴士", "why": "“巍”上面是“山”，本来是山很高大的样子；“颤颤巍巍”形容人抖着、站不稳。“魏”是姓氏和国名。", "hint": "山字头"}, {"w": "慢悠悠", "t": "悠", "opts": ["悠", "优", "忧"], "ctx": "巴士正好慢□□地驶了过来", "why": "“悠”是心字底，悠闲、慢慢的意思。“优”是优秀，“忧”是忧愁（担心）。", "hint": "心字底"}, {"w": "东倒西歪", "t": "倒", "opts": ["倒", "到", "道"], "ctx": "身体随着巴士的摇晃东□西歪", "why": "“倒”是单人旁，倒下的意思。“到”是到达，“道”是道路、说道。妈妈的笔记：遇到、道别、难道、说道，要分清。", "hint": "人倒下 → 单人旁"}, {"w": "尊老敬贤", "t": "贤", "opts": ["贤", "闲", "弦"], "ctx": "你真是个懂得尊老敬□的好孩子", "why": "“贤”指有才能、有品德的人。“闲”是空闲，“弦”是琴弦。", "hint": "贝字底"}, {"w": "挥手道别", "t": "挥", "opts": ["挥", "辉", "晖"], "ctx": "老爷爷在向他们□手道别", "why": "“挥”是提手旁，用手挥动。“辉”是光辉，“晖”是阳光，都带“光／日”。", "hint": "用手 → 提手旁"}, {"w": "拄着拐杖", "t": "拄", "opts": ["拄", "柱", "住"], "ctx": "一位□着拐杖的老爷爷", "why": "“拄”是提手旁，用手撑着拐杖。“柱”是木柱子，“住”是居住。", "hint": "手撑着 → 提手旁"}, {"w": "蜜糖", "t": "蜜", "opts": ["蜜", "密", "秘"], "ctx": "心里甜滋滋的，比吃了□糖还甜", "why": "“蜜”下面是“虫”，蜜蜂酿的蜜。“密”是秘密、紧密，下面是“山”。", "hint": "蜜蜂 → 虫字底"}, {"w": "欣慰", "t": "慰", "opts": ["慰", "蔚", "尉"], "ctx": "他的脸上露出了欣□的笑容", "why": "“慰”是心字底，安慰、欣慰都和心情有关。“蔚”是草字头，“尉”少了心。", "hint": "心字底"}, {"w": "勉强站稳", "t": "勉", "opts": ["勉", "免", "晚"], "ctx": "只好紧紧拉着扶手，□强站稳", "why": "“勉”下面有“力”，努力去做的意思。“免”是免除，没有“力”。", "hint": "要用力 → 有“力”"}], "audio": {"basic": {"src": "audio/bus-seat_basic.mp3", "cues": [["bus-seat|basic|start|0", 0.05], ["bus-seat|basic|start|1", 17.13], ["bus-seat|basic|1|0", 34.67], ["bus-seat|basic|2|0", 45.06], ["bus-seat|basic|3|0", 62.08], ["bus-seat|basic|3|1", 70.85], ["bus-seat|basic|4|0", 90.14], ["bus-seat|basic|end|0", 108.72]]}, "adv": {"src": "audio/bus-seat_adv.mp3", "cues": [["bus-seat|adv|start|0", 0.05], ["bus-seat|adv|start|1", 33.23], ["bus-seat|adv|1|0", 51.1], ["bus-seat|adv|1|1", 75.15], ["bus-seat|adv|2|0", 88.1], ["bus-seat|adv|3|0", 108.57], ["bus-seat|adv|3|1", 128.01], ["bus-seat|adv|4|0", 160.23], ["bus-seat|adv|4|1", 194.87], ["bus-seat|adv|end|0", 213.26], ["bus-seat|adv|end|1", 232.59]]}, "qx": {"src": "audio/bus-seat_qx.mp3", "cues": [["bus-seat|qx|start|0", 0.05], ["bus-seat|qx|1|0", 24.34], ["bus-seat|qx|1|1", 32.39], ["bus-seat|qx|2|0", 57.56], ["bus-seat|qx|3|0", 92.84], ["bus-seat|qx|4|0", 142.53], ["bus-seat|qx|4|1", 164.91], ["bus-seat|qx|end|0", 203.47]]}}}, {"id": "burnt-noodles", "title": "沉迷游戏，厨房泡面烧焦", "cat": "whoops", "grade": "P4", "pics": 4, "date": "2025-05-13", "source": "蔡老师课件", "imgs": ["img/D_noodle_1.jpg", "img/D_noodle_2.jpg", "img/D_noodle_3.jpg", "img/D_noodle_4.jpg"], "vocab": ["放学", "肚子饿", "厨房", "煮快熟面", "电脑游戏", "入迷", "责骂", "危险"], "drafts": ["img/draft_20250522_220743.jpg", "img/draft_20250522_222245.jpg", "img/draft_20250522_222253.jpg", "img/draft_20250522_222302.jpg", "img/draft_20250522_222314.jpg"], "versions": {"basic": {"label": "范文 · 基础版", "words": "547", "info": "参考范文初阶版", "segments": [{"pic": "start", "note": "声音开头法", "text": ["“铃铃铃……”放学铃声响起，小安[[像只欢快的小鸟一样飞出课室]]，大步流星地往家走去。他的肚子早已饿得咕咕叫，只想赶快回家吃妈妈煮的牛排大餐。"]}, {"pic": "1", "note": "图一：回到家，家里空无一人", "text": ["一回到家，小安发现家里[[空无一人]]。他看了看厨房，什么饭菜也没有。他摸着肚子，自言自语：“不如我自己煮快熟面吧！”"]}, {"pic": "2", "note": "图二：学着妈妈的样子煮面", "text": ["虽然小安是“厨艺小白”，但他还是[[有模有样]]地学着妈妈的样子烧水、放面。不一会儿，锅里的水开始沸腾，热气腾腾。小安看着面条膨胀，心里乐开了花，觉得自己简直是“小厨神”。"]}, {"pic": "3", "note": "图三：沉迷游戏，忘了锅里的面", "text": ["可是他等着等着就不耐烦了，看到电脑心里就痒痒的，心想：我玩一下下游戏，马上回来。于是，他三步并作两步跑到书房，不一会儿就沉迷在游戏世界里，早把锅里的面忘得[[一干二净]]。"]}, {"pic": "4", "note": "图四：妈妈回家，面烧焦了", "text": ["时间一分一秒过去，整整一个小时后，妈妈推着购物车回到家。一进门，她就闻到一股刺鼻的焦味，心中一惊，立刻冲进厨房。只见锅里的水早就烧干，面条烤焦，[[整个厨房像个冒烟的火山]]！", "妈妈立刻飞奔到厨房，赶紧关火，然后怒气冲冲地把小安叫来。小安一看到那副“[[惨不忍睹]]”的画面，吓得脸都白了，低下头，小声说：“对不起……妈妈，我真的知道错了……”", "妈妈严厉地说：“开火煮东西时不能[[心不在焉]]，更不能[[一心二用]]，否则后果不堪设想！”小安羞愧得满脸通红，连连点头，保证以后不会再犯。"]}, {"pic": "end", "note": "俗话结尾", "text": ["俗话说：“[[前事不忘，后事之师]]。”经过这件事，小安吸取了教训，从此做事变得专心致志，不再一心二用。"]}]}, "adv": {"label": "范文 · 高阶版", "words": "1186", "info": "参考范文 · 把每一步的动作和心理都写细了", "segments": [{"pic": "start", "note": "声音开头法", "text": ["“铃铃铃……”[[清脆悦耳]]的放学铃声如美妙的音乐声响起。小安像一只欢快的小鸟，背起书包，迅速地“飞”出课室，[[大步流星]]地往家中走去。因为上了一天的课，他早已[[饥肠辘辘]]了。"]}, {"pic": "1", "note": "用声音写安静；肚子“抗议”是拟人", "text": ["不一会儿，小安就到家了。他推开家门一看，家里空无一人。只见屋里静悄悄的，[[连根针掉在地上都能听见]]。“咦？平时这个时候，妈妈早已做好我爱吃的牛排大餐等着我了。今天家里怎么没人？难道是妈妈出门了，爸爸还没下班？”他自言自语道，随手把书包丢在沙发上。", "这时，小安的肚子不合时宜地“咕噜咕噜”叫了起来，[[仿佛在抗议：“我饿了，我饿了！”]]他摸了摸肚子，无可奈何地想：不如自己动手，丰衣足食吧！想到这里，他兴冲冲地走进厨房，打算煮一包快熟面来充饥。"]}, {"pic": "2", "note": "煮面的步骤一步一步写", "text": ["小安虽是“厨艺小白”，但也有模有样地学着妈妈的样子煮起面来。他先把锅架在炉灶上，倒进水，再打开煤气炉。蒸气渐渐升起，在空气中形成一层薄薄的雾气。小安见水烧到五六十度了，就撕开方便面／快熟面，把面条和调料包丢进锅中，看着面条渐渐膨胀，他心中涌起一种“自己也能当小厨神”的骄傲。"]}, {"pic": "3", "note": "心理描写：为什么会去玩游戏", "text": ["然而，缺乏耐心的小安，很快就等得有些不耐烦了。他的目光飘到书房里的电脑，顿时心里痒痒的，嘀咕道：“我玩会儿游戏再回来也不迟，反正只是三五分钟。”然后，他三步并作两步冲到书房，打开电脑，完全沉浸在游戏的精彩世界中。他早已忘了厨房里还在咕嘟咕嘟煮着的面。", "时间悄悄流逝，一个多小时过去了，小安仍旧在电脑前[[劈里啪啦]]地敲击着键盘。屋内的空气，慢慢被一股刺鼻的焦味吞噬，而小安[[浑然不觉]]。"]}, {"pic": "4", "note": "妈妈的反应 → 小安认错 → 妈妈的教导", "text": ["不一会儿，妈妈推着购物车[[满载而归]]了。一进门，她就闻到一股刺鼻的焦味。妈妈皱起了眉头，寻思着“这是什么味道？”她心里升起一股不安，隐隐约约猜到什么。", "于是，妈妈立刻奔向厨房。映入眼帘的画面让她瞬间呆住了：锅里的水早已烧干，面条焦黑如炭，空气中弥漫着一股令人呛鼻的糊味，[[仿佛厨房成了一个冒着黑色浓烟的火山口]]。她赶紧关火，长舒一口气，额头冒出冷汗。", "妈妈带着盛怒，把小安喊了过来。小安听到妈妈的喊声，急忙赶到厨房，看到眼前那副“惨不忍睹”的场景，心里顿时像压了一块大石头。他低下头，不敢看妈妈的眼睛，声音轻得像蚊子：“对……对不起，妈妈……我真的知道错了……”", "“你知道刚才有多危险吗？”妈妈严厉地说道，声音里混杂着愤怒与担忧，“厨房里的火若是蔓延开来，一不小心整栋屋子都可能被烧掉！你知不知道后果有多严重？”", "小安羞愧极了，脸颊通红。他明白自己闯了大祸，悔恨的泪水在眼眶中打转。他低声对妈妈说：“妈妈，请原谅我。我以后再也不敢了……”", "妈妈看到小安吓得苍白的脸色，叹了一口气，[[语重心长]]地说：“做事情要全神贯注，特别是开火煮东西时，千万不能一心二用。你今天要牢牢记住：‘[[祸从疏忽起，安全无小事]]。’明白吗？”小安用力地点了点头。"]}, {"pic": "end", "note": "俗话结尾", "text": ["俗话说：“前事不忘，后事之师。”经过这件事之后，小安吸取了教训，像变了一个人。他开始学会认真做事，不再一心二用。"]}]}, "qx": {"label": "小作者版 · 手稿转录", "words": "约 900", "info": "老师没有批改这一篇，这是小作者手写原稿的转录（保留原样）", "segments": [{"pic": "start", "text": ["一个平常的星期一下午，阳光明媚，碧空如洗。小文放学后，哼着歌，迈着轻快的步伐，走回了家。"]}, {"pic": "1", "text": ["他迫不及待地推开家门，大声地嚷嚷说：“妈妈，我回来啦！我想吃牛排大餐了！我的肚子已经饿得咕咕叫了！”可是，小文发现家里空无一人，他只听到自己的声音在空荡荡的房间里回响，显得格外孤单。家里静得连挂钟的滴答声都能听得清清楚楚。他忽然想起妈妈说过今天要去超市采购，得晚一些时间回家。"]}, {"pic": "2", "text": ["这时，小文觉得自己饿得前心贴后背。他冲到了厨房，开始翻箱倒柜起来。不一会儿，他眼睛一亮，举起一包快熟面，得意洋洋地自言自语道：“妈妈不在家有什么关系？我这个小厨神煮一包快熟面还不是小菜一碟？！”小文说完，有模有样地学着妈妈煮面的样子，往一个锅里倒了水，小心翼翼地点上火，开始加热。等了好一会儿，水终于沸腾了，好像锅底有好几十条小鱼在调皮地吐出无数透明的小泡泡。", "小文马上撕开快熟面的包装袋，把干巴巴的面和调料包里的调料都放进了沸腾的水里。看着自己的杰作，小文高兴得手舞足蹈。"]}, {"pic": "3", "text": ["可是，等了一分钟，小文就不耐烦了。他正好眼睛瞥到书房的电脑，心里马上开始痒痒的。他心想：我去打五分钟电脑游戏，回来正好吃上面！真是一举两得呀！我真是一个小天才！于是，小文三步并作两步地跑到书房，坐在电脑前，打开电脑，津津有味地玩起游戏。不一会儿，他就已经沉迷在精彩的游戏中，把快熟面的事儿忘得一干二净，抛到九霄云外了。"]}, {"pic": "4", "text": ["不知不觉，一个小时过去了。妈妈推着购物车走进了家门。突然，她闻到了一股呛鼻的味道从厨房传来。妈妈寻思着：什么东西烧焦了？我走的时候，特意检查过了炉灶是关着的呀？肯定是出事了。想完，妈妈立刻冲到厨房，被眼前的一幕惊呆了。只见，锅里的水早已烧干，面条变成了黑乎乎的一团。整个厨房像一个冒着黑色浓烟的火山口。妈妈定了定神，赶快关了火，然后火冒三丈地把小文喊了过来。", "小文赶忙关掉了电脑，一阵风似的冲到了厨房。他看到厨房一片狼藉，大吃一惊，脸色刷的一下变得像纸一样白。“小文！你怎么可以煮东西的时候走开呢？如果房子烧起来，后果不堪设想！”妈妈怒气冲冲地责骂道，她气得脖子上青筋鼓起像一条条蚯蚓。小文羞愧极了，脸红得像番茄一样。他用蚊子一样细的声音道歉说：“妈妈，对不起。我不是故意的。我以后再也不贪玩了。”妈妈看着小文真诚的表情，眉头舒展开来，语重心长地说：“安全第一，一定要牢牢记住。知错能改，还是好孩子。”这时，妈妈的脸上露出了笑容。小文用力地点了点头，表示同意。"]}, {"pic": "end", "text": ["俗话说：“经一事，长一智。”经过这次意外，小文明白做任何事都要专心致志，不要一心两用。"]}]}}, "detective": [{"w": "迫不及待", "t": "及", "opts": ["及", "急", "极"], "ctx": "小安□不□待地冲进厨房", "why": "“及”是来得及、赶上。迫不及待＝急得等不及了，中间是“及”不是“急”！", "hint": "来不及的“及”"}, {"w": "翻箱倒柜", "t": "柜", "opts": ["柜", "拒", "距"], "ctx": "他翻箱倒□找出一包快熟面", "why": "“柜”是木字旁，柜子。“拒”是提手旁（拒绝），“距”是足字旁（距离）。", "hint": "木头做的 → 木字旁"}, {"w": "沸腾", "t": "沸", "opts": ["沸", "佛", "弗"], "ctx": "锅里的水开始□腾", "why": "“沸”是三点水，水开了、翻滚。“佛”是单人旁。", "hint": "水开 → 三点水"}, {"w": "瞥见", "t": "瞥", "opts": ["瞥", "撇", "憋"], "ctx": "眼睛的余光□到书房里的电脑", "why": "“瞥”下面是“目”，很快地看一眼。“撇”是提手旁，“憋”是心字底。", "hint": "看 → 目字底"}, {"w": "一干二净", "t": "净", "opts": ["净", "静", "竞"], "ctx": "早把锅里的面忘得一干二□", "why": "“净”是两点水，干净。“静”是安静（青＋争）。", "hint": "两点水"}, {"w": "刺鼻", "t": "刺", "opts": ["刺", "剌", "策"], "ctx": "她就闻到一股□鼻的焦味", "why": "“刺”右边是立刀旁，像刺一样扎鼻子。注意左边是“朿”，不是“束”。", "hint": "立刀旁"}, {"w": "不堪设想", "t": "堪", "opts": ["堪", "勘", "湛"], "ctx": "否则后果不□设想", "why": "“堪”是土字旁，能承受。不堪设想＝后果想都不敢想。“勘”是勘察，“湛”是三点水。", "hint": "土字旁"}, {"w": "祸从疏忽起", "t": "疏", "opts": ["疏", "蔬", "梳"], "ctx": "祸从□忽起，安全无小事", "why": "“疏”是疏忽、不小心。“蔬”是草字头（蔬菜），“梳”是木字旁（梳子）。", "hint": "没有草字头"}, {"w": "心不在焉", "t": "焉", "opts": ["焉", "鄢", "嫣"], "ctx": "开火煮东西时不能心不在□", "why": "“焉”下面是四点底，心不在焉＝心思不在这里。", "hint": "四点底"}, {"w": "专心致志", "t": "致", "opts": ["致", "至", "制"], "ctx": "从此做事变得专心□志", "why": "“致”右边是反文旁，专心致志＝把心思全部集中。“至”是到达，“制”是制造。", "hint": "反文旁"}, {"w": "小心翼翼", "t": "翼", "opts": ["翼", "冀", "翌"], "ctx": "小安□□地把面倒进锅里", "why": "“翼”上面是“羽”，翅膀的意思，小心翼翼＝非常小心。“冀”上面是“北”。", "hint": "羽字头"}, {"w": "瑟瑟发抖", "t": "瑟", "opts": ["瑟", "琴", "琵"], "ctx": "小安吓得□□发抖", "why": "“瑟”上面是两个“王”，下面是“必”。瑟瑟发抖＝冷得或怕得发抖。“琴”下面是“今”。", "hint": "下面是“必”"}], "audio": {"basic": {"src": "audio/burnt-noodles_basic.mp3", "cues": [["burnt-noodles|basic|start|0", 0.05], ["burnt-noodles|basic|1|0", 14.19], ["burnt-noodles|basic|2|0", 26.72], ["burnt-noodles|basic|3|0", 44.66], ["burnt-noodles|basic|4|0", 61.96], ["burnt-noodles|basic|4|1", 81.13], ["burnt-noodles|basic|4|2", 97.82], ["burnt-noodles|basic|end|0", 112.02]]}, "adv": {"src": "audio/burnt-noodles_adv.mp3", "cues": [["burnt-noodles|adv|start|0", 0.05], ["burnt-noodles|adv|1|0", 18.03], ["burnt-noodles|adv|1|1", 43.71], ["burnt-noodles|adv|2|0", 63.76], ["burnt-noodles|adv|3|0", 92.94], ["burnt-noodles|adv|3|1", 118.66], ["burnt-noodles|adv|4|0", 132.31], ["burnt-noodles|adv|4|1", 148.52], ["burnt-noodles|adv|4|2", 169.99], ["burnt-noodles|adv|4|3", 190.74], ["burnt-noodles|adv|4|4", 204.57], ["burnt-noodles|adv|4|5", 218.76], ["burnt-noodles|adv|end|0", 240.31]]}, "qx": {"src": "audio/burnt-noodles_qx.mp3", "cues": [["burnt-noodles|qx|start|0", 0.05], ["burnt-noodles|qx|1|0", 9.77], ["burnt-noodles|qx|2|0", 39.27], ["burnt-noodles|qx|2|1", 75.33], ["burnt-noodles|qx|3|0", 86.32], ["burnt-noodles|qx|4|0", 118.19], ["burnt-noodles|qx|4|1", 160.75], ["burnt-noodles|qx|end|0", 217.09]]}}}, {"id": "mall-thief", "title": "购物商场看到小偷偷钱包", "cat": "guts", "grade": "P4", "pics": 4, "date": "2025-05-20", "source": "蔡老师课件", "imgs": ["img/E_thief_1.jpg", "img/E_thief_2.jpg", "img/E_thief_3.jpg", "img/E_thief_4.jpg"], "vocab": ["百货商场", "特价活动", "人山人海", "小偷", "没注意", "钱包", "通知", "保安人员", "抓", "道谢"], "drafts": ["img/draft_20250525_220221.jpg", "img/draft_20250525_220228.jpg", "img/draft_20250525_220238.jpg", "img/draft_20250525_220243.jpg", "img/draft_20250525_220255.jpg"], "versions": {"basic": {"label": "范文 · 基础版", "words": "550", "info": "初阶稿 · 一图一段＋开头和结尾", "segments": [{"pic": "start", "note": "交代时间、人物、地点和事件", "text": ["一个很平常的星期六下午，小丽陪妈妈去百货商场买衣服。因为好多服装店正在举行特价活动。"]}, {"pic": "1", "note": "图一：妈妈挑衣服，小丽无聊", "text": ["购物商场[[人山人海，热闹非凡]]。妈妈正在商场一楼的特价展区挑选衣服，[[时而摸摸布料，时而看看设计款式]]。小丽觉得很无聊，就环顾四周，希望能看到室内游乐场所，好让妈妈带她去玩一会儿。"]}, {"pic": "2", "note": "图二：发现小偷", "text": ["不料，正在这个时候，小丽发现有个年轻男子正[[鬼鬼祟祟]]地伸进一个女士的包里。趁她没注意，年轻男子[[以迅雷不及掩耳之势]]，把钱包偷走了。而那个女士只顾着低头挑选衣服，毫无察觉。小丽看到了，大吃一惊，悄悄地拉了拉妈妈的衣袖，指着年轻男子说：“妈妈，您看！有小偷偷钱包！”妈妈看到[[光天化日]]之下竟然有小偷，觉得难以容忍。"]}, {"pic": "3", "note": "图三：通知保安", "text": ["于是，妈妈立刻带着小丽来到购物商场的柜台，通知了商场的保安人员，并请求他们调出监控录像，看看年轻男子的长相，及时地抓住他，免得他去祸害更多的人。"]}, {"pic": "4", "note": "图四：抓到小偷，女士道谢", "text": ["不一会儿，商场的两个保安人员，果然在另外一个商店里看到又想继续作案的年轻男子，从他的背包里找到女士的钱包。保安人员把钱包归还给女士，女士看到[[失而复得]]的钱包[[喜出望外]]，微笑地向小丽妈妈和小丽道谢，竖起大拇指夸赞小丽：“谢谢你，小妹妹，你真是个[[有勇有谋]]的好孩子，帮助我找到钱包。真是太感谢了！我所有的银行卡都在这个钱包里，要是被偷了，后果不堪设想。”小丽听了，心里像吃了蜂蜜一样，甜滋滋的。她[[奶声奶气]]地说：“不客气！这是我应该做的。”说完后，她彬彬有礼地和女士道别，就和妈妈继续逛商场去了。"]}, {"pic": "end", "note": "结尾", "text": ["从此以后，每当小丽看到商场有可疑人物时，都会及时地通知保安人员，以免有人遭到偷盗，白白损失了钱财。"]}]}, "adv": {"label": "范文 · 高阶版", "words": "1200", "info": "高阶识字版 · 保安抓小偷的过程写得很完整", "segments": [{"pic": "start", "note": "天气开头＋交代事件起因", "text": ["一个很平常的星期六下午，阳光透过玻璃窗洒进屋内，令人暖洋洋的。午后的微风吹拂，令人[[神清气爽]]。小丽和妈妈推开门，关好门窗，欢欢喜喜地出门了。", "今天，妈妈打算去百货商场为自己添置几件新衣，因为听说那里正进行促销大减价，不少服装店都在搞特价活动。"]}, {"pic": "1", "note": "商场的热闹、妈妈的动作、小丽的无聊", "text": ["母女俩走进商场，商场里人山人海，[[摩肩接踵]]，热闹非凡。广播里传来“买一送一”、“七折优惠”和“三折优惠”的广告声，[[此起彼落]]。商场一楼的特价展区挤满了人。妈妈一边挑选衣服，一边左摸右看、眉开眼笑，她时而抚摸布料，时而拿起衣服对着镜子比划，眼神里闪烁着兴奋的光芒。", "小丽站在一旁，一开始还新奇地东张西望，可时间一长，她便有些坐不住了，皱起眉头，自言自语地说：“哎呀，好无聊呀，妈妈什么时候才选完啊……”她踮起脚尖四下张望，心里暗暗期盼着能看到一个游乐场，好让妈妈带她去玩一会儿。"]}, {"pic": "2", "note": "小偷的动作用比喻；小丽的惊吓", "text": ["就在她[[百无聊赖]]地张望时，忽然，她看到不远处一个年轻男子正悄悄地靠近一位正在挑衣服的女士。他东张西望，神情慌张，双眼不停地扫视四周，手却一点一点地伸向那位女士的背包。[[他的动作就像一条毒蛇悄悄逼近猎物，既迅速又隐蔽]]。", "“啊！”小丽差点叫出声来，她吓得[[眼睛睁得像铜铃般大，嘴巴张得能塞进一个鸡蛋]]，心里扑通扑通跳个不停。她猛地拉了拉妈妈的衣袖，压低声音，急切地说：“妈妈，快看！有人在偷钱包！”", "妈妈顺着她手指的方向望去，只见那男子已经得手，正在悄悄地转身离开。妈妈气得脸都红了，皱起眉头，低声说道：“这个小偷真是[[胆大包天]]，光天化日之下也敢偷钱包，太不像话了！”"]}, {"pic": "3", "note": "图三：到服务柜台说明情况", "text": ["于是，妈妈立即牵着小丽，快步走到商场服务柜台，向工作人员说明情况，并请求调出监控录像。工作人员听了，连声说：“谢谢你们提供线索，我们马上通知保安处理！”"]}, {"pic": "4", "note": "图四：保安人赃并获；失主道谢；妈妈的夸奖", "text": ["没过多久，商场的两名保安人员就根据监控画面，锁定了那个可疑男子的样貌和衣着特征。他们展开[[地毯式搜索]]，果然在另一家店铺里发现了那个男子——他正准备对另一名顾客下手。保安人员[[当机立断]]，一前一后地将他围住。", "“先生，请打开您的背包接受检查。”一名保安板着脸说道。另一名保安[[神色凝重]]地看着年轻男子。", "那男子支支吾吾，不情不愿地打开了包，结果从里面赫然发现了那位女士的钱包。里面有现金、银行卡、身份证……一样不少。男子顿时[[脸如死灰，哑口无言]]，只得乖乖跟着保安离开。", "钱包失而复得，工作人员第一时间联系了失主。那位女士赶来后，激动得几乎要落泪。她接过钱包，仔细检查后，发现没有任何损失，便连连向小丽和妈妈鞠躬致谢。", "“谢谢你，小妹妹！”女士一边说，一边竖起大拇指，满脸感激地夸赞道，“你真是[[机灵勇敢、有勇有谋]]的小侦探，要不是你，我的钱包恐怕早就没影了。里面的银行卡、证件要是丢了，后果不堪设想啊！”", "小丽被夸得脸都红了，但她却抿嘴一笑，[[一双眼睛亮晶晶的，像天上的星星]]。她奶声奶气地回答：“不客气，这是我应该做的！”说完还彬彬有礼地跟女士挥手道别。", "妈妈摸了摸小丽的头，欣慰地说：“小丽，今天妈妈真为你感到骄傲。”小丽听了，心里像吃了蜂蜜一样甜滋滋的。"]}, {"pic": "end", "note": "主题升华：人人都能成为小英雄", "text": ["从那天起，小丽每次跟妈妈去商场，总会特别留意身边的人。每当发现可疑人物时，她都会第一时间通知工作人员。她深深明白了：[[见义勇为不是大人的专利，只要心中有正义感，人人都能成为生活中的小英雄]]！"]}]}, "qx": {"label": "小作者版 · 老师批改", "score": "15/15", "words": "1000", "info": "蓝色＝老师加上的字；划掉＝老师删掉的字；黄色＝老师点赞的句子", "segments": [{"pic": "start", "note": "雨后天晴的天气描写", "text": ["一个++很++平常的星期天上午，一场如丝如烟的细雨过后，一丛丛不知名的花花草草都沾上了晶莹的水珠，好像一双双亮晶晶的小眼睛，好奇地打量着这个焕然一新的世界。++空气里散发着新翻的泥土的气息，天地之间视界清明，令人神清气爽。++", "++在这样的凉爽的天气里，++小丽和妈妈兴致勃勃地走到了地铁站对面新开张的百货商场。妈妈从朋友那里听说这间商场开业++大++酬宾，有很多特价活动。她想买几件漂亮的新衣服来犒劳自己这几个月辛苦的工作，++顺便也给小丽换几件新衣裳。++"]}, {"pic": "1", "note": "“旁边”和“附近”怎么区分？两个词都表示位置接近，但“旁边”更近、更具体，“附近”范围更大。", "text": ["++母女俩++一进商场++的一楼展区++，只见到处人山人海，热闹非凡。++妈妈和小丽来到促销摊位前，妈妈++眉开眼笑地开始挑选衣服。她一会儿摸摸衣服的材质，一会儿拿着衣服在镜子前比划++看看是否合身++，一会儿兴高采烈地和旁边的阿姨攀谈，++谈到兴奋处，++笑得合不拢嘴。小丽++则++站在一旁，一开始还好奇地东张西望，可不一会儿就百无聊赖地坐在了++旁边++~~附近~~的凳子上++发呆++。"]}, {"pic": "2", "note": "堪称小偷偷钱包的示范描写；换图片时，可以另起一段。", "text": ["突然，小丽不经意地看到不远处有一位戴眼镜的阿姨正在全神贯注地挑选着衣服。她身上的挎包背在身后，忘了关拉链，里面的东西一览无余。[[这时，一个年轻的男子长得贼眉鼠眼的，鬼鬼祟祟地靠近这位阿姨。他慌慌张张地四处张望了一下，确保没人注意他，然后他以迅雷不及掩耳之势把手伸进了阿姨的挎包，拿走了她的钱包，立刻大步流星地走进了人群，消失得无影无踪。]]", "小丽看到这一幕，心脏扑通扑通地跳个不停，连手心也出了汗，心急如焚。她赶快拉了拉妈妈的衣角，指着那个阿姨，小声地说：“妈妈，小偷偷了那个阿姨的钱包！”妈妈大吃一惊，~~顿时慌了手脚，急得像热锅上的蚂蚁，满脸通红。她~~生气地嘀咕++道++：“这个小偷真是胆大包天，光天化日之下竟敢偷鸡摸狗！这真是太过分了！”"]}, {"pic": "3", "text": ["于是，妈妈马上拉着小丽，飞快地跑到了商场的服务柜台，正好看到有两个保安叔叔巡逻经过。小丽奶声奶气地把她看到的事情一五一十地告诉了保安++叔叔++。他们一听，眼睛瞪得像铜铃一般大，气得眉毛胡子都抖动起来。一位保安立刻跑去调++出++监控，不一会儿，就回来了。他根据监控画面，锁定了可疑男子的样貌和衣着特征，并告诉大家这个男子++此刻正++在另一个鞋店，又想故技重施／++故伎重演++。"]}, {"pic": "4", "text": ["说时迟，那时快，++两个++保安叔叔冲到了鞋店，发现男子正要离开。他们立刻冲上前去，把他包围住，厉声说道：“先生，我们有证据++证明++你偷了别人的贵重物品。请你交出来！”", "男子被抓个正着，吓得脸色发青，撒腿就跑。保安++叔叔++三步并作两步地追上了他，一把把他抓住，并报了警。保安从小偷的身上搜出了他偷的钱包。小丽接过钱包，赶忙交给了闻讯赶来的戴眼++镜的++阿姨。阿姨感动得热泪盈眶，连连向小丽和妈妈道谢。她++竖起大拇指，++感激地说：“太谢谢你们了！小妹妹，你真是个有勇有谋的好孩子，我的小救星！多亏了你，我才++能++找回钱包。”小丽听了，心里甜滋滋的，比吃了蜜糖还甜。"]}, {"pic": "end", "text": ["经过这件事++之后++，小丽更明白了见义勇为的意义。++她知道只有++勇敢地面对坏人，才能保护身边的人，让这个世界变得更美好。"]}]}}, "detective": [{"w": "犒劳", "t": "犒", "opts": ["犒", "稿", "搞"], "ctx": "买几件新衣服来□劳自己", "why": "“犒”是牛字旁，古时候用牛羊酒食慰劳人。“稿”是禾字旁（稿子），“搞”是提手旁（做）。", "hint": "牛字旁"}, {"w": "鬼鬼祟祟", "t": "祟", "opts": ["祟", "崇", "宗"], "ctx": "一个年轻男子鬼鬼□□地靠近这位阿姨", "why": "“祟”上面是“出”，下面是“示”，鬼祟＝偷偷摸摸。“崇”是山字头（崇高），千万别写混。", "hint": "上“出”下“示”"}, {"w": "迅雷不及掩耳", "t": "掩", "opts": ["掩", "淹", "俺"], "ctx": "以迅雷不及□耳之势把手伸进了挎包", "why": "“掩”是提手旁，遮住、捂住。掩耳＝捂住耳朵。“淹”是水淹。", "hint": "捂耳朵 → 提手旁"}, {"w": "胆大包天", "t": "胆", "opts": ["胆", "担", "旦"], "ctx": "这个小偷真是□大包天", "why": "“胆”是月字旁（肉），胆子、胆量。“担”是提手旁，担心、担任。", "hint": "身体部位 → 月字旁"}, {"w": "撒腿就跑", "t": "撒", "opts": ["撒", "洒", "萨"], "ctx": "吓得脸色发青，□腿就跑", "why": "“撒”是提手旁，放开的意思，撒腿＝放开腿快跑。“洒”是三点水，洒水。", "hint": "提手旁"}, {"w": "热泪盈眶", "t": "眶", "opts": ["眶", "框", "筐"], "ctx": "阿姨感动得热泪盈□", "why": "“眶”是目字旁，眼眶。“框”是木字旁（相框），“筐”是竹字头（竹筐）。", "hint": "眼睛 → 目字旁"}, {"w": "有勇有谋", "t": "谋", "opts": ["谋", "某", "媒"], "ctx": "你真是个有勇有□的好孩子", "why": "“谋”是言字旁，计谋、智谋。“某”是某人，“媒”是女字旁。", "hint": "言字旁"}, {"w": "见义勇为", "t": "义", "opts": ["义", "意", "仪"], "ctx": "小丽更明白了见□勇为的意义", "why": "妈妈的笔记：“义”＝道理、正义（正义、义工）；“意”＝想法（意见、心意）；“仪”＝礼节、样子（礼仪、仪表）。见义勇为是为了正义挺身而出。", "hint": "对的事 → 义"}, {"w": "巡逻", "t": "逻", "opts": ["逻", "罗", "萝"], "ctx": "正好看到有两个保安叔叔巡□经过", "why": "“逻”是走之旁，巡逻要走来走去。“罗”是姓，“萝”是草字头（萝卜）。", "hint": "走来走去 → 走之旁"}, {"w": "锁定", "t": "锁", "opts": ["锁", "琐", "唢"], "ctx": "根据监控画面，□定了可疑男子的样貌", "why": "“锁”是金字旁，锁头、锁定。“琐”是琐碎，“唢”是唢呐。", "hint": "金字旁"}, {"w": "故技重施", "t": "施", "opts": ["施", "旋", "拖"], "ctx": "这个男子正在另一个鞋店，又想故技重□", "why": "“施”是施行、做出来。故技重施＝又用老办法做坏事。", "hint": "方字旁"}, {"w": "晶莹", "t": "莹", "opts": ["莹", "萤", "荧"], "ctx": "花花草草都沾上了晶□的水珠", "why": "“莹”下面是“玉”，像玉一样透亮。“萤”下面是“虫”（萤火虫），“荧”下面是“火”（荧光）。", "hint": "像玉一样 → 玉字底"}], "audio": {"basic": {"src": "audio/mall-thief_basic.mp3", "cues": [["mall-thief|basic|start|0", 0.05], ["mall-thief|basic|1|0", 10.3], ["mall-thief|basic|2|0", 30.88], ["mall-thief|basic|3|0", 67.68], ["mall-thief|basic|4|0", 83.15], ["mall-thief|basic|end|0", 134.19]]}, "adv": {"src": "audio/mall-thief_adv.mp3", "cues": [["mall-thief|adv|start|0", 0.05], ["mall-thief|adv|start|1", 17.54], ["mall-thief|adv|1|0", 29.13], ["mall-thief|adv|1|1", 58.62], ["mall-thief|adv|2|0", 80.63], ["mall-thief|adv|2|1", 103.07], ["mall-thief|adv|2|2", 121.21], ["mall-thief|adv|3|0", 138.85], ["mall-thief|adv|4|0", 154.58], ["mall-thief|adv|4|1", 174.66], ["mall-thief|adv|4|2", 183.41], ["mall-thief|adv|4|3", 199.79], ["mall-thief|adv|4|4", 214.46], ["mall-thief|adv|4|5", 232.03], ["mall-thief|adv|4|6", 246.86], ["mall-thief|adv|end|0", 257.1]]}, "qx": {"src": "audio/mall-thief_qx.mp3", "cues": [["mall-thief|qx|start|0", 0.0], ["mall-thief|qx|start|1", 27.95], ["mall-thief|qx|1|0", 53.14], ["mall-thief|qx|2|0", 91.5], ["mall-thief|qx|2|1", 131.58], ["mall-thief|qx|3|0", 157.52], ["mall-thief|qx|4|0", 194.08], ["mall-thief|qx|4|1", 210.41], ["mall-thief|qx|end|0", 251.97]]}}}, {"id": "swing-fall", "title": "劝说妹妹不要站在秋千架上荡秋千", "cat": "whoops", "grade": "P4", "pics": 4, "date": "2025-05-27", "source": "蔡老师课件", "imgs": ["img/F_swing_1.jpg", "img/F_swing_2.jpg", "img/F_swing_3.jpg", "img/F_swing_4.jpg"], "vocab": ["游乐场", "注意", "站在秋千上", "打电话", "跌倒", "受伤", "扶"], "drafts": ["img/draft_20250607_222109.jpg", "img/draft_20250607_222043.jpg", "img/draft_20250607_222601.jpg", "img/draft_20250607_223701.jpg", "img/draft_20250607_230301.jpg"], "versions": {"basic": {"label": "范文 · 基础版", "words": "550", "info": "初阶版作文 500-600字", "segments": [{"pic": "start", "note": "天气开头＋交代地点", "text": ["一个很平常的星期六下午，阳光明媚，微风轻拂，小丽和妹妹小美到住家附近的游乐场玩。游乐场里有滑梯，有秋千，还有摇摇椅和其他游乐设施。"]}, {"pic": "1", "note": "图一：姐姐提醒；妹妹答应", "text": ["姐姐小丽看到秋千架，提醒小美说：“荡秋千不可以站着，一定要坐着，不然会跌倒，很危险。”小美点头说：“我知道了。”说完，小美就去荡秋千，而小丽则在一旁的滑梯旁兴高采烈地溜滑梯。"]}, {"pic": "2", "note": "图二：妹妹偷偷站起来荡", "text": ["小美刚开始乖乖地坐着荡秋千。可是过了一会儿，她觉得站着荡会更好玩，就偷偷站起来。她一边荡秋千一边笑，觉得自己像在半空中飞翔，真是[[惬意]]极了！"]}, {"pic": "3", "note": "图三：跌倒受伤，姐姐扶起来", "text": ["突然，小美没有站稳，“哎哟！”一声，她从秋千上跌了下来，膝盖受伤了，痛得哇哇大哭。", "小丽听到哭声，赶紧跑过去看。她看到小美坐在地上哭，连忙把她扶起来。小美一边哭一边说：“对不起，姐姐。我后悔没有听你的话，是我站着荡秋千才跌倒的。”"]}, {"pic": "4", "note": "图四：姐姐安慰，打电话给爸爸", "text": ["小丽一边帮她擦眼泪，一边安慰说：“你现在知道了吧？以后一定要注意安全。”接着，小丽赶快用手机打电话给爸爸：“爸爸，妹妹跌倒了，快带药箱来游乐场！”爸爸听了小丽的话，[[大步流星]]地赶来，把妹妹带回家包扎伤口。"]}, {"pic": "end", "text": ["从那以后，小美再也不敢站在秋千架上荡秋千了。她知道，在游乐场玩，一定要听大人和姐姐的话，注意安全，才可以安全地玩耍。"]}]}, "adv": {"label": "范文 · 高阶版", "words": "1200", "info": "进阶版作文 · 两处排比句，“乐极生悲”的转折", "segments": [{"pic": "start", "note": "短语的排比句；短句子的排比句", "text": ["一个阳光明媚、微风轻拂的星期六下午，小丽姐姐和小美妹妹决定到住家附近的游乐场玩耍。游乐场里的设施齐全，[[有旋转木马，有滑滑梯，有秋千架，还有跷跷板]]。这些游乐设施都是孩子们喜爱的。", "此时正值周末，游乐场里人来人往，热闹非凡。[[有的家长陪着孩子一起玩，其乐融融；有的家长坐在长椅上看书，时不时看着游乐场的孩子，微微一笑；还有的家长则拿着手机拍照记录孩子的欢笑声]]，空气中洋溢着一片欢快的气氛。"]}, {"pic": "1", "note": "图一：姐姐先提醒（用邻居的例子）", "text": ["小丽姐姐和小美妹妹一到游乐场，小美便欢快地跑了几步，想立刻冲向秋千。小丽连忙拉住她，说：“等一下，妹妹，我要先提醒你一件事：千万不要站在秋千架上荡秋千！前两天隔壁邻居的小安就是站在秋千架上荡秋千才摔伤膝盖的。”小美乖巧地点了点头，奶声奶气地说：“知道了！我一定坐着荡秋千！”", "然后，小丽便走向滑梯，一边溜滑梯一边注意着妹妹的一举一动。小美一开始真的很听话，她坐在秋千上荡来荡去，风拂过脸颊，她高兴得笑出了声，觉得特别兴奋。"]}, {"pic": "2", "note": "图二：心理描写——“不过瘾”；乐极生悲", "text": ["可是，没过多久，小美觉得坐着荡秋千有点“不过瘾”，她开始想：“要是我能站在秋千上，就像站在空中荡秋千一样，一定会更好玩！”虽然姐姐说过不可以，但小美还是禁不住想尝试的心理，在好奇心的驱使下，小心翼翼地站了起来。她一边站着荡秋千，一边发出“咯咯咯”的笑声，觉得自己好像在空中飞翔。"]}, {"pic": "3", "note": "图三：跌倒；姐姐飞奔过来安慰", "text": ["可是[[乐极生悲]]，秋千晃动得越来越快，小美一个不小心失去平衡，“砰”的一声从秋千上摔下来，重重地跌在地上，膝盖被擦破，鲜血直流。“哇——！”的一声，小美痛得哇哇大哭起来。不远处的小丽听到妹妹的哭声，脸色一变，大吃一惊，立刻从滑梯滑下来，飞奔到小美身边。她看到小美坐在地上，捂着流血的膝盖，眼泪一滴滴往下掉，心疼极了。她蹲下来安慰妹妹：“别哭别哭，姐姐在这里。”接着，小丽轻轻扶起妹妹。", "小美[[语无伦次]]地哭着说：“姐姐，对不起……我后悔没有听你的话……我偷偷站着荡秋千，然后摔下来了……”她一边说一边抽泣。"]}, {"pic": "4", "note": "图四：打电话给爸爸；爸爸气喘吁吁地赶到", "text": ["小丽轻轻叹了一口气说：“现在你知道‘不听姐姐言，吃亏在眼前’的意思了吧？幸好只是擦伤，要是撞到头就严重了。”看到小美膝盖还在流血，小丽立刻从裤袋里拿出手机，拨通了爸爸的电话，焦急不安地说：“爸爸，不好了！妹妹站着荡秋千摔倒了，膝盖流血了。您赶快拿药箱来游乐场吧！”电话那头的爸爸听了也吓了一跳，二话不说立刻大步流星地赶来。", "没多久，爸爸[[气喘吁吁]]地赶到，看到小美受伤，赶紧抱起她回家清洗伤口，上药包扎伤口。一路上，小美一直低着头，眼里还含着泪水。", "回到家后，爸爸严肃地对小美说：“这就是不听话的后果。以后一定要遵守安全规则。”小美用力地点了点头。"]}, {"pic": "end", "text": ["俗话说：“前事不忘，后事之师。”经过这次意外，小美真正明白了姐姐和爸爸妈妈说的话都是为了她好。她心里暗暗发誓：以后无论玩什么游戏，都一定要注意安全，不能为了好玩而做危险的事情。", "从那以后，小美去游乐场玩耍时，总是特别小心，也会主动提醒其他小朋友：“秋千不能站着荡，会摔倒的！”她希望大家都能开开心心地来玩耍，平平安安地回家去。"]}]}, "qx": {"label": "小作者版 · 手稿转录", "words": "约 1000", "info": "老师没有批改这一篇，这是小作者手写原稿的转录（保留原样）", "segments": [{"pic": "start", "text": ["一个平常的星期日早晨，太阳慢慢地钻出了薄薄的云层，变成了一个红红的圆球，把柔和的阳光洒向大地。小丽姐姐和小美妹妹早早地起床，飞快地洗漱完毕，然后兴高采烈地跑到了家附近的游乐场玩。游乐场里的设施应有尽有，有滑梯，有秋千架，还有高低架。姐妹俩一有空，就会来这里尽情地玩耍。"]}, {"pic": "1", "text": ["等她们到游乐场的时候，发现已经有很多孩子和家长玩得不亦乐乎了，游乐场里洋溢着一片欢声笑语。小美一进游乐场，就迫不及待地冲向自己最喜欢的秋千架。可是她还没有迈开步子，就被姐姐一把拉住了。小丽苦口婆心地说：“小美，你一定不要站在秋千上荡啊！还记得上个星期隔壁的小明站在秋千上荡秋千，一不小心摔下来，把门牙磕掉了，所以现在说话都漏风了。”小美听了，一边拍着胸脯，一边奶声奶气地说：“放心吧！姐姐！我一定不会那么做的！”说完，她跑到秋千架，坐在秋千上，慢悠悠地荡了起来。"]}, {"pic": "2", "text": ["小丽见状，也放下心来，蹦蹦跳跳地走到滑梯，一边溜滑梯，一边关注着妹妹的一举一动。小美一开始还规规矩矩地坐在秋千上，双腿一伸一缩，越荡越高，笑得合不拢嘴。过了一会儿，小美感觉有点儿无聊了。她想起昨天晚上在电视看的杂技表演，那个大姐姐穿着亮晶晶的长裙子，站在秋千上，荡得都快碰到屋顶了！她就像一只漂亮的翩翩起舞的花蝴蝶。小美羡慕极了！她心想：我就站起来荡两三下，姐姐一定不会发现的！我也不会像小明一样摔跤的！我会很小心！"]}, {"pic": "3", "text": ["说干就干，小美一骨碌站了起来，学着大姐姐荡起来。她眼睛里闪烁着兴奋的光芒，嘴角也情不自禁地往上翘。不一会儿
