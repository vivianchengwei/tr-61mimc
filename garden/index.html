买一个现成的，我跟着爸爸匆匆忙忙地又跑了一趟蛋糕店，跟店家说了情况，店家让我在橱柜里选一个蛋糕，他去做新的牌子，我十分感激他，连忙道谢。"]}, {"pic": "end", "text": ["最终我去了小华的生日会。收到了我送给他的惊喜，小华十分开心。可我却十分后悔，因为看见父母为了我犯的错而忙前忙后，知道自己给他们添了很多麻烦。如果我当时听了他们的话，自己的事情自己做，亲自去买蛋糕和礼物，就不会给家人带来麻烦了。++正所谓“靠人不如靠己”。++我心里下定决心改掉这个依赖父母的坏习惯，以后自己的事情都会自己做。"], "note": "慧眼改进：结尾前补一句名句，让道理更有力。"}]}}, "detective": []}, {"id": "pre2023-nh-q2", "title": "跟踪同学，发现他们在作弊", "cat": "guts", "grade": "P6", "pics": 0, "date": "", "source": "2023 小六预考 · 南华小学（Nan Hua） · 高华（完成文章）", "kind": "完成文章", "exam": "2023 预考 高华", "imgs": [], "drafts": [], "vocab": ["鬼鬼祟祟", "左顾右盼", "窃窃私语", "恍然大悟", "大惊失色", "四脚朝天", "气喘吁吁", "胸有成竹", "来龙去脉", "大吃一惊", "多管闲事", "狗血淋头"], "versions": {"orig": {"label": "学校范文 · 原文", "words": "875", "info": "题目：以下面的情节作为开头，完成这篇文章——（原卷的开头没有附在资料里，第一段应为题目给的开头。）｜出处：2023 小六预考 · 南华小学（Nan Hua） · 高华（完成文章）", "segments": [{"pic": "start", "text": ["休息时间到了，同学们都到食堂去吃东西。当我要离开课室时，看到小华和小文在课室的一个角落低声说话，两人看了看四周，然后急匆匆地一起走了。"]}, {"pic": "1", "label": "正文①", "text": ["我心想：小华和小文到底在讨论什么？他们看上去鬼鬼祟祟的，是要准备捉弄同学吗？还是就只说几句悄悄话？不可能！他们刚刚那样急匆匆地走出课室，肯定是要去干什么“好事”！就这样，在好奇心的驱使下，我也三步并作两步地跟了上去。", "我轻手轻脚地跟着小文和小华，可是他们边走边左顾右盼，害得我每次都要东躲西藏，还好没有被他们发现。不久他们就来到厕所，然后在厕所的角落里窃窃私语，虽然我听不见他们在说什么，但我从镜子上能清清楚楚地看到他们的每一个动作。", "这时小华大声地说：“这里没有摄像头，大家也都去了食堂，我们肯定不会被发现的！”然后小华和小文就从口袋里拿出一张纸，把纸上的字抄在手心里，我恍然大悟，原来刚才他们在课室小声商量如何作弊，现在他们正在把听写的字词抄在手心里，为休息后的听写做准备！"]}, {"pic": "2", "label": "正文②", "text": ["我大惊失色，正要离开，突然撞到厕所门口的垃圾桶。“啊！”的一声，我摔了个四脚朝天。小文和小华听到了声音，大喊：“是谁在门口？”糟糕！我要被发现了！我的心里好像揣了一只兔子——怦怦直跳，连忙拔腿跑去了食堂。", "到了食堂，我气喘吁吁地吃起了饭，心想：要不要告诉老师小文和小华在作弊？小文和小华可是学校有名的校霸，要是让他们知道是我告发了他们，他们会不会找机会报复我？", "休息后，小文和小华胸有成竹地走进课室里。听写时，他们果然在看手心里的一些字。听写后我深吸了一口气，鼓起勇气，把事情的来龙去脉一五一十地告诉了老师。老师听了竖起大拇指表扬我是个诚实的孩子，小文和小华见到这一幕大吃一惊，小华脸一阵红一阵白，气呼呼地说：“小明你狗拿耗子多管闲事！”老师让小文和小华去办公室，把他们骂了个狗血淋头。"]}, {"pic": "3", "label": "正文③", "text": ["放学时，小文和小华竟然来向我道歉。小华说：“对不起，我刚才不该那么生气。你做的是对的，作弊是一个自欺欺人的行为，我们保证下不为例。”我听了，原谅了他们。"]}, {"pic": "end", "text": ["所谓知错能改，善莫大焉。希望小文和小华以后能明白“人不信则不立”的道理，做一个诚实的人，才能得到别人的信任。"]}]}, "imp": {"label": "慧眼改进版", "words": "874", "info": "这是慧眼在原文基础上的改进版：蓝色加粗的句子是慧眼补充的，划掉的是慧眼改掉的地方，其余都是原文。｜改了什么：原文名句写成了“人不信则不立”，正确是“人无信不立”，已改正。", "segments": [{"pic": "start", "text": ["休息时间到了，同学们都到食堂去吃东西。当我要离开课室时，看到小华和小文在课室的一个角落低声说话，两人看了看四周，然后急匆匆地一起走了。"]}, {"pic": "1", "label": "正文①", "text": ["我心想：小华和小文到底在讨论什么？他们看上去鬼鬼祟祟的，是要准备捉弄同学吗？还是就只说几句悄悄话？不可能！他们刚刚那样急匆匆地走出课室，肯定是要去干什么“好事”！就这样，在好奇心的驱使下，我也三步并作两步地跟了上去。", "我轻手轻脚地跟着小文和小华，可是他们边走边左顾右盼，害得我每次都要东躲西藏，还好没有被他们发现。不久他们就来到厕所，然后在厕所的角落里窃窃私语，虽然我听不见他们在说什么，但我从镜子上能清清楚楚地看到他们的每一个动作。", "这时小华大声地说：“这里没有摄像头，大家也都去了食堂，我们肯定不会被发现的！”然后小华和小文就从口袋里拿出一张纸，把纸上的字抄在手心里，我恍然大悟，原来刚才他们在课室小声商量如何作弊，现在他们正在把听写的字词抄在手心里，为休息后的听写做准备！"]}, {"pic": "2", "label": "正文②", "text": ["我大惊失色，正要离开，突然撞到厕所门口的垃圾桶。“啊！”的一声，我摔了个四脚朝天。小文和小华听到了声音，大喊：“是谁在门口？”糟糕！我要被发现了！我的心里好像揣了一只兔子——怦怦直跳，连忙拔腿跑去了食堂。", "到了食堂，我气喘吁吁地吃起了饭，心想：要不要告诉老师小文和小华在作弊？小文和小华可是学校有名的校霸，要是让他们知道是我告发了他们，他们会不会找机会报复我？", "休息后，小文和小华胸有成竹地走进课室里。听写时，他们果然在看手心里的一些字。听写后我深吸了一口气，鼓起勇气，把事情的来龙去脉一五一十地告诉了老师。老师听了竖起大拇指表扬我是个诚实的孩子，小文和小华见到这一幕大吃一惊，小华脸一阵红一阵白，气呼呼地说：“小明你狗拿耗子多管闲事！”老师让小文和小华去办公室，把他们骂了个狗血淋头。"]}, {"pic": "3", "label": "正文③", "text": ["放学时，小文和小华竟然来向我道歉。小华说：“对不起，我刚才不该那么生气。你做的是对的，作弊是一个自欺欺人的行为，我们保证下不为例。”我听了，原谅了他们。"]}, {"pic": "end", "text": ["所谓知错能改，善莫大焉。希望小文和小华以后能明白“~~人不信则不立~~++人无信不立++”的道理，做一个诚实的人，才能得到别人的信任。"], "note": "慧眼改进：原文名句写成了“人不信则不立”，正确是“人无信不立”，已改正。"}]}}, "detective": []}];

 "bù", "tíng"]}, {"w": "哇啦哇啦大哭起来", "p": ["wā", "lā", "wā", "lā", "dà", "kū", "qǐ", "lái"]}], "sents": ["老师给我们讲了一个笑话，同学们听了，哄堂大笑起来。", "妹妹跌倒了，哇啦哇啦大哭起来。", "弟弟一把鼻涕一把眼泪地告诉我，他的钱包不见了。", "她双手掩着脸，抽抽嗒嗒地哭个不停。"], "notes": []}, {"name": "声音", "icon": "🔔", "group": "声音", "words": [{"w": "叽里咕噜", "p": ["jī", "lǐ", "gū", "lū"]}, {"w": "叽叽喳喳", "p": ["jī", "jī", "zhā", "zhā"]}, {"w": "大吼一声", "p": ["dà", "hǒu", "yì", "shēng"]}, {"w": "娇滴滴的声音", "p": ["jiāo", "dī", "dī", "de", "shēng", "yīn"]}, {"w": "声音像铜钟一样响亮", "p": ["shēng", "yīn", "xiàng", "tóng", "zhōng", "yí", "yàng", "xiǎng", "liàng"]}, {"w": "震耳欲聋般大声", "p": ["zhèn", "ěr", "yù", "lóng", "bān", "dà", "shēng"]}, {"w": "好像雷鸣一样", "p": ["hǎo", "xiàng", "léi", "míng", "yí", "yàng"]}, {"w": "叽咕了半天", "p": ["jī", "gū", "le", "bàn", "tiān"]}], "sents": ["他叽咕了半天，没人听明白他要说什么。", "陈老师上课时，声音像铜钟一样响亮。"], "notes": []}, {"name": "太阳", "icon": "☀️", "group": "天气景物", "words": [{"w": "火红的太阳", "p": ["huǒ", "hóng", "de", "tài", "yáng"]}, {"w": "阳光普照", "p": ["yáng", "guāng", "pǔ", "zhào"]}, {"w": "夕阳西下", "p": ["xī", "yáng", "xī", "xià"]}, {"w": "射出万道金光的朝阳", "p": ["shè", "chū", "wàn", "dào", "jīn", "guāng", "de", "zhāo", "yáng"]}, {"w": "阳光像一支支的金箭", "p": ["yáng", "guāng", "xiàng", "yì", "zhī", "zhī", "de", "jīn", "jiàn"]}, {"w": "像火球一样的太阳", "p": ["xiàng", "huǒ", "qiú", "yí", "yàng", "de", "tài", "yáng"]}, {"w": "光芒刺目的太阳", "p": ["guāng", "máng", "cì", "mù", "de", "tài", "yáng"]}, {"w": "金黄色的太阳", "p": ["jīn", "huáng", "sè", "de", "tài", "yáng"]}, {"w": "温暖的太阳", "p": ["wēn", "nuǎn", "de", "tài", "yáng"]}, {"w": "五彩缤纷的晚霞", "p": ["wǔ", "cǎi", "bīn", "fēn", "de", "wǎn", "xiá"]}], "sents": ["晴空万里，天上没有一丝云彩，太阳把地面烤得滚烫，一阵风来，从地上卷起一股热浪。", "中午时分，骄阳似火，太阳把树叶都晒得卷缩起来。", "天已近黄昏，太阳慢慢地钻进薄薄的云层，变成了一个红红的圆球。", "正午的太阳火一般燃烧在人的头顶上。", "一轮红日从东方升起，天空全是红的，东面像着了火。", "晴空万里，一轮红艳艳的太阳高挂天空。"], "notes": ["讲义原文是“没有一些云彩”，小作者自己在上面改成了“一丝”——改得对！"]}, {"name": "雨", "icon": "🌧️", "group": "天气景物", "words": [{"w": "淅淅沥沥的雨点", "p": ["xī", "xī", "lì", "lì", "de", "yǔ", "diǎn"]}, {"w": "哗啦哗啦的雨点", "p": ["huā", "lā", "huā", "lā", "de", "yǔ", "diǎn"]}, {"w": "滴答滴答的雨点", "p": ["dī", "dā", "dī", "dā", "de", "yǔ", "diǎn"]}, {"w": "雨点噼啪噼啪地打在窗口上", "p": ["yǔ", "diǎn", "pī", "pā", "pī", "pā", "de", "dǎ", "zài", "chuāng", "kǒu", "shàng"]}, {"w": "急箭般的雨点", "p": ["jí", "jiàn", "bān", "de", "yǔ", "diǎn"]}, {"w": "毛毛雨", "p": ["máo", "máo", "yǔ"]}, {"w": "纷纷细雨", "p": ["fēn", "fēn", "xì", "yǔ"]}, {"w": "倾盆大雨", "p": ["qīng", "pén", "dà", "yǔ"]}, {"w": "斗大的雨点", "p": ["dòu", "dà", "de", "yǔ", "diǎn"]}, {"w": "连绵的细雨", "p": ["lián", "mián", "de", "xì", "yǔ"]}], "sents": ["雨越下越大，噼噼啪啪地打在屋顶上。", "走到半路，突然雨哗啦哗啦地下起来，我赶紧跑到巴士车站避雨。", "雷声隆隆，不久下起了倾盆大雨。", "这场雨不小，只见箭般的雨点猛敲打着窗口。"], "notes": ["“急箭般的雨点”原本印在“太阳”那页，小作者把它划掉了——它是写雨的，所以放在这里。"]}], "scenes": [{"no": "一", "title": "课堂（迟到 / 走神被点名）", "paras": ["我气喘吁吁地跑到教室门口，却发现里面早已开始上课。老师正在白板前讲课，同学们一个个端端正正地坐在座位上。站在门外的我顿时僵住了，刚才一路狂奔的勇气仿佛一下子消失得无影无踪。我扶着门框，大口大口地喘着气，心里七上八下：“怎么办？老师会不会骂我？同学们会不会笑我？”", "教室里静悄悄的，只听见老师的讲课声。大家的目光都落在白板上，手中的笔不时在本子上飞快地记录着。", "老师讲得正起劲，我却托着下巴，思绪早已飘到了天边。突然，一个熟悉的名字钻进耳朵——“XXX，你来说说看。”我猛地站起来，大脑顿时一片空白。"], "words": [{"w": "全神贯注", "p": ["quán", "shén", "guàn", "zhù"]}, {"w": "聚精会神", "p": ["jù", "jīng", "huì", "shén"]}, {"w": "目不转睛", "p": ["mù", "bù", "zhuǎn", "jīng"]}, {"w": "若有所思", "p": ["ruò", "yǒu", "suǒ", "sī"]}, {"w": "心不在焉", "p": ["xīn", "bù", "zài", "yān"]}, {"w": "思绪万千", "p": ["sī", "xù", "wàn", "qiān"]}, {"w": "鸦雀无声", "p": ["yā", "què", "wú", "shēng"]}, {"w": "气喘吁吁", "p": ["qì", "chuǎn", "xū", "xū"]}, {"w": "上气不接下气", "p": ["shàng", "qì", "bù", "jiē", "xià", "qì"]}, {"w": "忐忑不安", "p": ["tǎn", "tè", "bù", "ān"]}, {"w": "七上八下", "p": ["qī", "shàng", "bā", "xià"]}, {"w": "进退两难", "p": ["jìn", "tuì", "liǎng", "nán"]}, {"w": "提心吊胆", "p": ["tí", "xīn", "diào", "dǎn"]}]}, {"no": "二", "title": "同学之间发生争执", "paras": ["“明明就是你弄坏的！”他涨红了脸，气呼呼地瞪着我。我也不甘示弱，猛地站了起来。我们你一言、我一语，谁也不肯退让，原本安静的教室顿时炸开了锅。", "我们谁也没有再说话。一道无形的墙仿佛横在了我们之间。明明只隔着两张桌子，我却觉得他离我很远很远。"], "words": [{"w": "怒气冲冲", "p": ["nù", "qì", "chōng", "chōng"]}, {"w": "不甘示弱", "p": ["bù", "gān", "shì", "ruò"]}, {"w": "针锋相对", "p": ["zhēn", "fēng", "xiāng", "duì"]}, {"w": "面红耳赤", "p": ["miàn", "hóng", "ěr", "chì"]}, {"w": "脱口而出", "p": ["tuō", "kǒu", "ér", "chū"]}, {"w": "默不作声", "p": ["mò", "bù", "zuò", "shēng"]}]}, {"no": "三", "title": "小朋友恶作剧", "paras": ["一个鬼点子突然从我的脑海里冒了出来。我偷偷朝朋友使了个眼色，他先是一愣，随后立刻明白了我的意思，捂着嘴偷偷笑了起来。", "我轻手轻脚地走到他的座位旁，趁他没有注意，飞快地把东西藏到了身后。几个知情的同学交换了一下眼神，一个个拼命憋着笑，生怕老师发现。", "可是，看着他越来越着急的样子，我脸上的笑容渐渐消失了。原本只是想开个玩笑，事情却似乎不像我想象中那么好笑。"], "words": []}, {"no": "四", "title": "犯错后心虚", "paras": ["我的心“咯噔”一下，刚才还理直气壮的我顿时像泄了气的皮球。", "“糟了！”看到眼前的情景，我的心猛地一沉。我怎么也没有想到，一个小小的玩笑竟然会惹出这么大的麻烦。", "我低着头，两只手不安地搓着衣角，根本不敢看 XX（人）的眼睛。", "XX（人）每问一句，我的心就往下沉一点。明明 XX（地方）里开着冷气，我的手心却冒出了一层汗。", "我张了张嘴，想为自己辩解，可话到了嘴边，又被我硬生生地咽了回去。"], "words": [{"w": "忐忑不安", "p": ["tǎn", "tè", "bù", "ān"]}, {"w": "坐立不安", "p": ["zuò", "lì", "bù", "ān"]}, {"w": "支支吾吾", "p": ["zhī", "zhī", "wú", "wú"]}, {"w": "吞吞吐吐", "p": ["tūn", "tūn", "tǔ", "tǔ"]}, {"w": "心虚", "p": ["xīn", "xū"]}, {"w": "羞愧", "p": ["xiū", "kuì"]}, {"w": "无地自容", "p": ["wú", "dì", "zì", "róng"]}]}, {"no": "五", "title": "被批评 / 教育", "paras": ["“到底是谁干的？”老师放下手中的书，环视着全班。刚才还闹哄哄的教室一下子安静下来，而我的心却怦怦直跳。", "XX（人）没有立刻责备我，只是看着我，认真地问：“如果别人这样对你，你会是什么感受？”我愣住了，刚才准备好的解释一下子全说不出口了。", "XX（人）的语气并不重，可那几句话却像有魔力，在我的心中不停回响。“犯错并不可怕，可怕的是明明知道错了，却没有勇气承担。”听到这里，我惭愧地低下了头。"], "words": []}, {"no": "六", "title": "向别人道歉", "paras": ["我在门口徘徊了好一会儿，终于鼓起勇气走到他面前。“对不起……”短短三个字，我却说得格外艰难。", "我本以为他会生气地责怪我，没想到他只是沉默了一会儿，轻轻地说：“没关系，下次别这样了。”那一刻，压在我心头的大石头终于落了下来。", "听到这句话，我鼻子微微一酸。原来，一句真诚的道歉能够化解误会，而一句宽容的“没关系”，也能让人久久记在心里。"], "words": []}, {"no": "七", "title": "自我反省", "paras": ["回家的路上，刚才发生的一幕不断在我的脑海中浮现。想到自己说过的话、做过的事，我越想越不是滋味。", "如果当时我能冷静一点，如果我愿意站在他的角度想一想，也许事情根本不会变成这样。", "那一刻，我终于明白，真正的勇敢并不是为自己争辩，而是在做错事情以后，有勇气承认错误并承担后果。"], "words": []}, {"no": "八", "title": "朋友原谅我 / 重归于好", "paras": ["第二天，我忐忑不安地走进教室。本以为他不会再理我，没想到经过我的座位时，他轻轻拍了拍我的肩膀：“走啦，一起去食堂。”我愣了一下，随后忍不住笑了。", "昨天的不愉快仿佛随着这一笑烟消云散。阳光从窗外照进来，我忽然觉得，今天的教室似乎比平时明亮了许多。"], "words": []}, {"no": "十一", "title": "做错事后心虚（五个小场面）", "paras": ["① 不敢看对方：我赶紧低下头，假装认真地翻着课本，不敢与老师的目光相遇。老师的目光扫过全班，我立刻把头埋得更低了，心里默默念着：“千万别看我，千万别看我……”我偷偷瞄了 XX 一眼，没想到正好和他四目相对。我心里“咯噔”一下，赶紧移开了视线。", "② 假装什么都没发生：我装作若无其事的样子，摆弄着衣角，可手上的动作却被我重复了好几遍。我故意把课本翻得哗哗作响，假装自己什么也不知道，耳朵却竖得高高的，生怕漏掉老师说的任何一句话。", "③ 老师开始调查：“是谁做的？”老师的声音从讲台上传来。我的心猛地一跳，手心也不知不觉冒出了汗。老师每问一句，我的心就往下沉一点。我紧紧攥着衣角，连大气也不敢出。明明没有人提到我的名字，我却总觉得周围的同学都在看我。", "④ 被老师突然点名：“XXX，你知道是怎么回事吗？”听到自己的名字，我猛地一颤，脑袋里“嗡”的一声。我慢吞吞地站起来，嘴巴张了半天，却不知道该说什么。“我……我不知道……”我支支吾吾地回答，声音越来越小，连自己都觉得没有底气。", "⑤ 承认错误：我偷偷看了一眼被我捉弄的 XX。他低着头，一句话也没有说。刚才还觉得好玩的我，心里突然很不是滋味。“算了，还是承认吧。”一个声音在心里悄悄响起。我咬了咬嘴唇，终于鼓起勇气站了起来：“老师/爸爸/阿姨……是我做的。”"], "words": [{"w": "四目相对", "p": ["sì", "mù", "xiāng", "duì"]}, {"w": "目光躲闪", "p": ["mù", "guāng", "duǒ", "shǎn"]}, {"w": "不敢直视", "p": ["bù", "gǎn", "zhí", "shì"]}, {"w": "低头不语", "p": ["dī", "tóu", "bù", "yǔ"]}, {"w": "若无其事", "p": ["ruò", "wú", "qí", "shì"]}, {"w": "支支吾吾", "p": ["zhī", "zhī", "wú", "wú"]}, {"w": "吞吞吐吐", "p": ["tūn", "tūn", "tǔ", "tǔ"]}, {"w": "语无伦次", "p": ["yǔ", "wú", "lún", "cì"]}, {"w": "忐忑不安", "p": ["tǎn", "tè", "bù", "ān"]}, {"w": "坐立不安", "p": ["zuò", "lì", "bù", "ān"]}]}, {"no": "十二", "title": "误会", "paras": ["“你根本就不明白我！”我气冲冲地丢下这句话，冲出了房间，“砰”的一声关上门。", "我越想越委屈，觉得 XX 只会责怪我，从来没有站在我的角度替我想过。", "我听到 XX 和 XX 的谈话，才知道他们其实一直担心自己。", "我站在门口，原本满肚子的委屈突然消失得无影无踪。想起刚才冲 XX 说的那些话，我恨不得把它们一个字一个字收回来。"], "words": []}, {"no": "十三", "title": "有人被冷落，我主动关心", "paras": ["午休时，大家三三两两地坐在一起聊天，只有新来的 XXX 一个人坐在角落里。他低着头，慢慢地吃着东西，与周围热闹的气氛显得格格不入。", "我本来已经和朋友约好一起去玩，可走了几步，又忍不住回头看了他一眼。", "我犹豫了一下，最后还是端着餐盘走了过去：“这里有人吗？我可以坐吗？”", "他愣了一下，随后露出了一个腼腆的笑容：“可以。”", "那天以后，我们渐渐熟悉起来。而我也第一次发现，有时候，关心一个人并不需要做什么惊天动地的大事，也许只是主动走过去，说一句话而已。"], "words": []}, {"no": "十四", "title": "忘带东西，同学帮助我", "paras": ["我把书包翻了个底朝天，还是没有找到练习册。眼看老师就要开始检查了，我急得像热锅上的蚂蚁。", "“先看我的吧。”同桌轻轻把课本往中间推了推。我愣了一下：“那你呢？”“一起看啊！”他笑着说。"], "words": []}, {"no": "十五", "title": "比赛 / 考试失败，朋友安慰", "paras": ["看到成绩的那一刻，我的心一下子沉到了谷底。为了这次比赛，我准备了那么久，可最后还是没有得到自己期待的结果。", "我一个人坐在角落里，低着头不说话。朋友走过来，没有问我考了多少分，只是在我身旁坐下，把一颗糖塞进我的手里。“走啦，明天再努力。”", "我看着手心里的糖，忍不住笑了。失败带来的难过并没有立刻消失，可至少在那一刻，我知道，自己并不是一个人。"], "words": []}], "endings": [{"type": "成长型", "fam": "falls", "text": "这件事虽然已经过去了，但它让我明白：成长并不是从此不再犯错，而是在每一次犯错之后，学会反省，并努力成为更好的自己。"}, {"type": "友情型", "fam": "bonds", "text": "我们相视一笑，之前的不愉快也在这一刻烟消云散。我终于明白，朋友之间难免会有摩擦，而真诚与宽容，才是化解误会最好的方法。"}, {"type": "珍惜型", "fam": "whoops", "text": "有些东西拥有时，我们总觉得理所当然；直到差一点失去，才发现它原来如此珍贵。从那以后，我学会了珍惜。"}, {"type": "改变看法型", "fam": "falls", "text": "看着他渐渐远去的背影，我心里五味杂陈。原来，我一直以为自己很了解他，却只看见了事情的一面。从那以后，我再也不轻易凭第一印象判断一个人。"}, {"type": "呼应开头型", "fam": "all", "text": "放学铃再次响起，我收拾好书包走出教室。走廊还是那条熟悉的走廊，我却觉得，今天的自己和早上的自己已经有了一点不同。"}, {"type": "帮助别人给自己带来快乐", "fam": "bonds", "text": "俗话说：“赠人玫瑰，手有余香。”帮助别人，不仅能为别人带来温暖，也能让自己收获快乐。原来，善意从来不是单向的，它在温暖别人的同时，也悄悄温暖着自己。"}, {"type": "帮助别人给自己带来快乐", "fam": "bonds", "text": "“勿以善小而不为。”一个微笑、一句关心、一次举手之劳，看起来微不足道，却可能给别人带来意想不到的温暖。从那以后，我更愿意留心身边的人，在他们需要时伸出援手。"}, {"type": "改正错误", "fam": "falls", "text": "“知错能改，善莫大焉。”每个人都会犯错，重要的不是一味逃避，而是有勇气面对错误、承担责任，并从中吸取教训。这件事也让我真正懂得了什么叫成长。"}, {"type": "改正错误", "fam": "falls", "text": "俗话说：“亡羊补牢，为时未晚。”犯了错并不可怕，只要及时改正，就还有弥补的机会。从那以后，我时刻提醒自己：同样的错误，绝不能再犯第二次。"}, {"type": "宽容他人", "fam": "bonds", "text": "“退一步，海阔天空。”人与人相处，难免会有摩擦。如果每个人都只想着争个输赢，小小的矛盾也可能越闹越大。有时候，多一分理解，少一分计较，许多不愉快也就烟消云散了。"}, {"type": "宽容他人", "fam": "whoops", "text": "“得饶人处且饶人。”他的原谅让我既感激又惭愧，也让我懂得：宽容不是软弱，而是愿意给别人一次改过的机会。"}, {"type": "自我反省（场景七）", "fam": "guts", "text": "那一刻，我终于明白，真正的勇敢并不是为自己争辩，而是在做错事情以后，有勇气承认错误并承担后果。"}, {"type": "道歉与原谅（场景六）", "fam": "bonds", "text": "原来，一句真诚的道歉能够化解误会，而一句宽容的“没关系”，也能让人久久记在心里。"}, {"type": "主动关心（场景十三）", "fam": "guts", "text": "有时候，关心一个人并不需要做什么惊天动地的大事，也许只是主动走过去，说一句话而已。"}], "cai": {"themes": [{"t": "帮助别人", "fam": ["bonds"], "text": "那一刻，我深深体会到“赠人玫瑰，手有余香”的道理。原来，帮助别人就能让自己变得快乐。"}, {"t": "诚实", "fam": ["falls"], "text": "诚信是做人之本，人无信不立。"}, {"t": "勇气", "fam": ["guts"], "text": "勇敢不是不害怕，而是在害怕的时候依然选择面对。"}, {"t": "坚持", "fam": ["guts"], "text": "世上无难事，只怕有心人。锲而不舍，金石可镂，坚持就是胜利。"}], "endings": [{"t": "结尾一 · 勇敢面对困难", "fam": ["guts", "falls"], "text": "俗话说：“经一事，长一智。”经过这件事之后，我明白了一个道理：遇到困难时，我们不能退缩，而应该勇敢面对。只有这样，我们才能不断成长，成为更好的自己。"}, {"t": "结尾二 · 助人为快乐之本", "fam": ["bonds"], "text": "这件事虽然已经过去很久了，但每当我想起它，仍然记忆犹新。它让我明白了“助人为快乐之本”的道理，也让我懂得了人与人之间应该互相关爱，互相帮助。"}, {"t": "结尾三 · 勿以恶小而为之", "fam": ["bonds", "falls"], "text": "古人云：“勿以恶小而为之，勿以善小而不为。”从那以后，我时刻提醒自己，要做一个乐于助人、富有责任感的人。"}, {"t": "结尾四 · 团结合作", "fam": ["whoops", "guts"], "text": "俗话说：“众人拾柴火焰高。”经过这件事后，我深深明白了团结合作的重要性。一个人的力量或许有限，但大家齐心协力，就能创造无限可能。"}], "quotes": [{"q": "助人为快乐之本。", "use": "帮助别人", "fam": ["bonds"]}, {"q": "赠人玫瑰，手有余香。", "use": "帮助别人", "fam": ["bonds"]}, {"q": "众人拾柴火焰高。", "use": "团结合作", "fam": ["whoops", "guts"]}, {"q": "一方有难，八方支援。", "use": "团结互助", "fam": ["bonds", "whoops"]}, {"q": "人无信不立。", "use": "诚实守信", "fam": ["falls"]}, {"q": "言必信，行必果。", "use": "诚实守信", "fam": ["falls"]}, {"q": "失败乃成功之母。", "use": "失败、坚持", "fam": ["guts"]}, {"q": "世上无难事，只怕有心人。", "use": "坚持", "fam": ["guts"]}, {"q": "锲而不舍，金石可镂。", "use": "坚持", "fam": ["guts"]}, {"q": "三人行，必有我师焉。", "use": "向别人学习", "fam": ["falls"]}, {"q": "勿以恶小而为之，勿以善小而不为。", "use": "做好事、不做坏事", "fam": ["bonds", "falls"]}, {"q": "己所不欲，勿施于人。", "use": "恶作剧、换位思考", "fam": ["falls"]}, {"q": "良言一句三冬暖，恶语伤人六月寒。", "use": "说话、争吵、道歉", "fam": ["falls", "bonds"]}, {"q": "滴水之恩，当涌泉相报。", "use": "感恩", "fam": ["bonds"]}, {"q": "有志者，事竟成。", "use": "坚持、目标", "fam": ["guts"]}, {"q": "满招损，谦受益。", "use": "骄傲、谦虚", "fam": ["falls"]}, {"q": "学习如逆水行舟，不进则退。", "use": "学习", "fam": ["guts"]}, {"q": "书山有路勤为径，学海无涯苦作舟。", "use": "学习、勤奋", "fam": ["guts"]}, {"q": "一分耕耘，一分收获。", "use": "努力", "fam": ["guts", "falls"]}, {"q": "山重水复疑无路，柳暗花明又一村。", "use": "绝处逢生、转折", "fam": ["whoops", "guts"]}]}, "endingsByFam": {"bonds": {"endings": ["那一刻，我深深体会到“赠人玫瑰，手有余香”的道理。原来，帮助别人就能让自己变得快乐。", "这件事虽然已经过去很久了，但每当我想起它，仍然记忆犹新。它让我明白了“助人为快乐之本”的道理，也让我懂得了人与人之间应该互相关爱，互相帮助。", "古人云：“勿以恶小而为之，勿以善小而不为。”从那以后，我时刻提醒自己，要做一个乐于助人、富有责任感的人。", "我们相视一笑，之前的不愉快也在这一刻烟消云散。我终于明白，朋友之间难免会有摩擦，而真诚与宽容，才是化解误会最好的方法。", "俗话说：“赠人玫瑰，手有余香。”帮助别人，不仅能为别人带来温暖，也能让自己收获快乐。原来，善意从来不是单向的，它在温暖别人的同时，也悄悄温暖着自己。", "“勿以善小而不为。”一个微笑、一句关心、一次举手之劳，看起来微不足道，却可能给别人带来意想不到的温暖。从那以后，我更愿意留心身边的人，在他们需要时伸出援手。", "“退一步，海阔天空。”人与人相处，难免会有摩擦。如果每个人都只想着争个输赢，小小的矛盾也可能越闹越大。有时候，多一分理解，少一分计较，许多不愉快也就烟消云散了。", "原来，一句真诚的道歉能够化解误会，而一句宽容的“没关系”，也能让人久久记在心里。", "人与人之间最 const LS_KEY='story-garden-v1';
let state = {profiles:{}, current:null, readSize:19, version:{}, compare:false, py:true};
function loadLocal(){ try{ const s=JSON.parse(localStorage.getItem(LS_KEY)||'null'); if(s) state={...state,...s}; }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({profiles:state.profiles,current:state.current,readSize:state.readSize,version:state.version,compare:state.compare,py:state.py,voice:state.voice})); }catch(e){} }
loadLocal(); try{ state.famFilter=localStorage.getItem('sg_famfilter')||'all'; }catch(e){}

let db=null, dbWritable=true;
(async()=>{
  try{
    const d = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if(!d) return;
    db=d;
    db.collection('banks').onSnapshot(snap=>{
      let changed=false;
      snap.forEach(doc=>{ const data=doc.data(); if(data && data.name){ state.profiles[doc.id]=data; changed=true; } });
      if(changed){ saveLocal(); if(route().v!=='story') render(); }
    }, err=>{ console.warn('db',err); });
  }catch(e){ console.warn(e); }
})();
let persistT={};
function persistProfile(slug){
  saveLocal();
  if(!(db && dbWritable)) return;
  clearTimeout(persistT[slug]);
  persistT[slug]=setTimeout(async()=>{
    try{ await db.doc('banks/'+slug).set(state.profiles[slug]); }
    catch(e){ if(e && e.code==='invalid_argument') dbWritable=false; console.warn('db write',e); }
  },600);
}
function slugify(n){ return n.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'')||'me'; }
function cur(){ return state.current ? state.profiles[state.current] : null; }
function ensureProfile(){ if(!cur()){ openNameSheet(); return null; } return cur(); }
function picksOf(p,fam){ return (p.picks&&p.picks[fam])||[]; }
function isPicked(id){ const p=cur(); if(!p) return false; return Object.values(p.picks||{}).some(a=>a.includes(id)); }
function allStories(){ const own=[]; Object.values(state.profiles).forEach(p=>(p.own||[]).forEach(s=>own.push({...s,ownBy:p.name}))); return STORIES.concat(own); }
function findStory(id){ return allStories().find(s=>s.id===id); }
function togglePick(id){
  const p=ensureProfile(); if(!p) return;
  const s=findStory(id); if(!s) return;
  p.picks=p.picks||{}; const arr=p.picks[s.cat]=p.picks[s.cat]||[];
  const i=arr.indexOf(id);
  if(i>=0){ arr.splice(i,1); toast('已从 Story Bank 移除'); }
  else if(arr.length>=2){ toast('每个家族只能选 2 篇最爱哦，先取消一篇吧 🐚'); return; }
  else { arr.push(id); sessAct('pick'); toast(`收进 ${p.name} 的 Story Bank 啦 ⭐`); }
  persistProfile(state.current); render();
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WORDKEYS = Object.keys(MOMWORDS).sort((a,b)=>b.length-a.length);
const WORDRE = new RegExp(WORDKEYS.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
function annotateChunk(t){
  if(!WORDKEYS.length) return t;
  return t.replace(WORDRE, w=>{
    const m=MOMWORDS[w]; let out='';
    for(let i=0;i<w.length;i++){
      const c=w[i]; const red=m.b[i]; const py=(m.b[i]||(m.x&&m.x[i]));
      let h = py ? `<ruby>${c}<rt>${m.p[i]}</rt></ruby>` : c;
      if(red) h=`<span class="mom">${h}</span>`;
      out+=h;
    }
    return out;
  });
}
function rich(t){ // [[好词]] highlight, ~~删除~~, ++补充++, then mom-word annotation on text outside tags
  let h=esc(t).replace(/\[\[(.+?)\]\]/g,'<span class="hl">$1</span>').replace(/~~(.+?)~~/g,'<span class="del">$1</span>').replace(/\+\+(.+?)\+\+/g,'<span class="add">$1</span>');
  return h.split(/(<[^>]+>)/g).map(x=>x.startsWith('<')?x:annotateChunk(x)).join('');
}
let toastT; function toast(m){ let el=document.querySelector('.toast'); if(!el){ el=document.createElement('div'); el.className='toast'; document.body.appendChild(el);} el.textContent=m; clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),2200); }
function fam(id){ return FAMILIES.find(f=>f.id===id); }
function route(){ const h=(location.hash||'#home').slice(1); if(h.startsWith('fam-')) return {v:'fam',id:h.slice(4)}; if(h.startsWith('story-')) return {v:'story',id:h.slice(6)}; if(h==='bank') return {v:'bank'}; if(h==='parent') return {v:'parent'}; if(h==='lib'||h.startsWith('lib-')) return {v:'lib',id:decodeURIComponent(h.slice(4))}; return {v:'home'}; }
function starsFor(p,storyId){ const r=p&&p.detScore&&p.detScore[storyId]; if(!r) return ''; return '★'.repeat(r.stars)+'☆'.repeat(3-r.stars); }

const libState={tab:'endings',q:''};
const LIBGROUPS=['心情','人物外貌','动作神态','声音','天气景物'];
function libFavs(){ const p=cur(); return (p&&p.libFav)||[]; }
function isFav(t){ return libFavs().some(x=>x.t===t); }
function toggleFav(t,kind,src){
  const p=ensureProfile(); if(!p) return false;
  p.libFav=p.libFav||[]; const i=p.libFav.findIndex(x=>x.t===t);
  if(i>=0){ p.libFav.splice(i,1); toast('已从好词本拿出来'); }

}
function speakOnce(text){
  if(!window.speechSynthesis){ toast('这个浏览器不能朗读'); return; }
  stopReading(); try{ speechSynthesis.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text.replace(/XXX?|XX/g,'某某')); u.lang='zh-CN'; u.rate=0.85; const v=pickVoice(); if(v) u.voice=v; speechSynthesis.speak(u);
}
function pyWord(w){ const py=(w.p||[]).filter(x=>/[a-zü]/i.test(x)).join(' '); return `${py?`<span class="pyl">${esc(py)}</span>`:''}<span class="hz">${esc(w.w)}</span>`; }
function qhit(s){ const q=libState.q.trim(); return !q || s.includes(q); }
function qmark(html){ const q=libState.q.trim(); if(!q) return html; const e=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); return html.split(/(<[^>]+>)/g).map(x=>x.startsWith('<')?x:x.replace(new RegExp(e,'g'),m=>`<mark class="q">${m}</mark>`)).join(''); }
function chipHTML(w,src){ return `<button class="wchip ${isFav(w.w)?'fav':''}" data-lw="${esc(w.w)}" data-src="${esc(src)}">${qmark(pyWord(w))}</button>`; }

      +FAMILIES.map(fm=>sec(`${esc(fm.zh)} · ${esc(fm.en)}`,fm.color,fm.id)).join('')

    }).join('');
    if(!q) body=`<div class="lnote" style="margin-top:12px">💡 这些是“万能片段”：XX 的地方换成故事里的人和地方，就能放进不同的作文里。</div>`+body;

function hideLibPop(){ const el=document.querySelector('.libpop'); if(el) el.remove(); }
function showLibPop(btn){
  hideLibPop(); const w=btn.dataset.lw, src=btn.dataset.src||'';
  const pop=document.createElement('div'); pop.className='libpop';
  const r=btn.getBoundingClientRect();
  pop.style.left=Math.max(8,Math.min(window.scrollX+r.left, window.scrollX+document.documentElement.clientWidth-200))+'px'; pop.style.top=(window.scrollY+r.bottom+6)+'px';
  pop.innerHTML=`<button data-pp="say">🔊 再听</button><button data-pp="fav">${isFav(w)?'★ 已收藏':'⭐ 收藏'}</button>`;
  pop.addEventListener('click',e=>{ const b=e.target.closest('[data-pp]'); if(!b) return; e.stopPropagation();
    if(b.dataset.pp==='say') speakOnce(w);
    else { const added=toggleFav(w,'w',src); btn.classList.toggle('fav',isFav(w)); b.textContent=isFav(w)?'★ 已收藏':'⭐ 收藏'; if(libState.tab==='mine'&&!added){ hideLibPop(); render(); } }
  });
  document.body.appendChild(pop);
}

function segOrder(s){ if(s.pics) return ['start',...Array.from({length:s.pics},(_,i)=>String(i+1)),'end']; const ks=[]; Object.values(s.versions||{}).forEach(v=>(v.segments||[]).forEach(x=>{ const k=String(x.pic); if(!ks.includes(k)) ks.push(k); })); const mid=ks.filter(k=>k!=='start'&&k!=='end'); return ['start',...mid,'end']; }
function startLabel(s){ for(const v of Object.values(s.versions||{})){ const g=(v.segments||[]).find(x=>x.pic==='start'&&x.label); if(g) return g.label; } return ''; }

function segRow(s, segKey, versions, vkeysUsed){

    ? `<div class="pic">${s.imgs&&s.imgs[+segKey-1]?`<img src="${s.imgs[+segKey-1]}" alt="图${segKey}">`:`<div class="nopic">🖼️<br>图${segKey}<br><small>老师的图片没拍到</small></div>`}<span class="num">图 ${segKey}</span> <button class="segplay" data-read="${segKey}" title="从这里开始朗读">▶</button></div>`

  const col = (v,vk) => {
    const seg = (v.segments||[]).find(x=>String(x.pic)===segKey);

  return `<div class="seg">${left}<div class="txt">${txt}</div></div>`;
}
function storyView(id){
  const s=findStory(id); if(!s) return home();
  const f=fam(s.cat); const picked=isPicked(id);
  const vkeys=Object.keys(s.versions||{});
  let vk = state.version[id] || vkeys[0];
  if(!vkeys.includes(vk)) vk=vkeys[0];
  const compare = state.compare && vkeys.length>1;
  const segKeys = segOrder(s).filter(k=>(s.pics&&/^\d+$/.test(k)) || Object.values(s.versions||{}).some(v=>(v.segments||[]).some(x=>String(x.pic)===k)));
  const other = ['qx','adv','basic'].find(k=>k!==vk && vkeys.includes(k)) || vkeys.find(k=>k!==vk);

/* ===================== HIGHLIGHTER ===================== */
function visibleOffset(p, container, offset){
  const r=document.createRange(); r.selectNodeContents(p); r.setEnd(container, offset);
  const frag=r.cloneContents(); frag.querySelectorAll('rt').forEach(x=>x.remove());
  return frag.textContent.length;
}
function textNodesOf(p){
  const out=[]; const w=document.createTreeWalker(p, NodeFilter.SHOW_TEXT, {acceptNode:n=>{ let e=n.parentNode; while(e&&e!==p){ if(e.tagName==='RT') return NodeFilter.FILTER_REJECT; e=e.parentNode; } return NodeFilter.FILTER_ACCEPT; }});
  let n; while((n=w.nextNode())) out.push(n); return out;
}
function clearMarks(p){ p.querySelectorAll('mark.kid').forEach(m=>{ const t=document.createTextNode(m.textContent); m.replaceWith(t); }); p.normalize(); }
function applyMarks(p, ranges){
  clearMarks(p);
  ranges.forEach((r,ri)=>{
    const [s,e]=r; const nodes=textNodesOf(p); let pos=0;
    for(const n of nodes){
      const len=n.data.length, ns=pos, ne=pos+len; pos=ne;
      const a=Math.max(s,ns), b=Math.min(e,ne); if(a>=b) continue;
      let mid=n; if(a>ns) mid=n.splitText(a-ns);
      if(b<ne) mid.splitText(b-a);
      const m=document.createElement('mark'); m.className='kid'; m.dataset.ri=ri; mid.replaceWith(m); m.appendChild(mid);
    }
  });
}
function applyAllMarks(){
  const p=cur(); if(!p||!p.hl) return;
  document.querySelectorAll('#readbody p[data-pk]').forEach(el=>{ const r=p.hl[el.dataset.pk]; if(r&&r.length) applyMarks(el,r); });

let hlTool=null;
function hideTool(){ if(hlTool){ hlTool.remove(); hlTool=null; } }
function onSelect(){
  const sel=window.getSelection(); if(!sel||sel.rangeCount===0||sel.isCollapsed){ hideTool(); return; }
  const r=sel.getRangeAt(0);

  const p2=r.endContainer.nodeType===3?r.endContainer.parentElement.closest('p[data-pk]'):r.endContainer.closest&&r.endContainer.closest('p[data-pk]');
  if(!p1||p1!==p2){ hideTool(); return; }
  const s=visibleOffset(p1,r.startContainer,r.startOffset), e=visibleOffset(p1,r.endContainer,r.endOffset);
  if(e-s<1){ hideTool(); return; }
  const rect=r.getBoundingClientRect();
  hideTool(); hlTool=document.createElement('div'); hlTool.className='hltool';

  hlTool.style.top=top+'px'; hlTool.style.left=left+'px';

    const frag=r.cloneContents(); frag.querySelectorAll('rt').forEach(x=>x.remove());

    let ns=s, ne=e; for(let i=arr.length-1;i>=0;i--){ const [a,b]=arr[i]; if(a<=ne&&b>=ns){ ns=Math.min(ns,a); ne=Math.max(ne,b); arr.splice(i,1);} }
    arr.push([ns,ne,text]); arr.sort((a,b)=>a[0]-b[0]);

}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

async function packBackup(){
  sessTick();

  let bytes=new TextEncoder().encode(json),tag='SG1:';
  try{ if(window.CompressionStream){ const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip')); bytes=new Uint8Array(await new Response(cs).arrayBuffer()); tag='SG1Z:'; } }catch(e){}

}
async function unpackBackup(code){

    const cut=dstr(new Date(Date.now()-120*86400000));
    const dayHTML=days.filter(d=>d>=cut).map((d,i)=>{
      const L=log.filter(x=>x.d===d).sort((a,b)=>b.t.localeCompare(a.t));
      const m=Math.round(L.reduce((a,x)=>a+(x.secs||0),0)/60);
      const rows=L.map(x=>{
        const s=findStory(x.sid); const vl=(x.vers||[]).map(v=>s&&s.versions&&s.versions[v]?s.versions[v].label.split('·')[0].trim():v).join('、');
        const bits=[]; if(x.listen) bits.push(`🔊 朗读 ${x.listen} 次${x.full?'（含全篇）':''}`); if(x.hl) bits.push(`🖍 画线 ${x.hl} 处`); if(x.pick) bits.push('♥ 收进 Story Bank'); if(x.det) bits.push(`🕵️ 侦探 ${x.det.right}/${x.det.total}（${'★'.repeat(x.det.stars||0)}）`);
        return `<div class="logrow"><span class="lt">${x.t}</span><span class="ln"><a href="#story-${esc(x.sid)}">${esc(x.title||x.sid)}</a>${vl?` <small>· ${esc(vl)}</small>`:''}<br><small>读了 ${fmtSecs(x.secs||0)}${bits.length?' · '+bits.join(' · '):''}</small></span></div>`;
      }).join('');
      return `<details class="day" ${i===0?'open':''}><summary><b>${d}</b>　读了 ${L.length} 次 · ${new Set(L.map(x=>x.sid)).size} 篇 · ${m||'不到 1'} 分钟</summary>${rows}</details>`;
    }).join('')||'<p class="muted">还没有逐次记录。从 2026-11-24 这个版本开始，每打开一篇故事读一会儿（或朗读、画线、玩侦探）就会记一条。</p>';
    const badDet=Object.entries(p.det||{}).filter(([c,d])=>d.bad>0).sort((a,b)=>b[1].bad-a[1].bad).slice(0,15);
    body=`<div class="pstats"><div><b>${read}</b>读过的篇数</div><div><b>${days.length}</b>阅读天数</div><div><b>${mins||(log.length&&log.some(x=>x.secs)?'<1':0)}</b>分钟</div><div><b>${detN}</b>篇玩过侦探</div><div><b>${hlN}</b>处画线</div><div><b>${bankN}</b>篇在 Story Bank</div></div>
      ${badDet.length?`<h3>🕵️ 侦探游戏里错过的字</h3><p class="wrongch">${badDet.map(([c,d])=>`<span title="${esc(d.w||'')}">${esc(d.w||c)} <small>错 ${d.bad}／对 ${d.ok||0}</small></span>`).join('')}</p>`:''}
      <h3>📅 每日记录</h3>${dayHTML}`;
  }
  const lb=lastBackupDays();
  return topbar('parent')+`<a class="back" href="#home">← 回到四大家族</a>
  <div class="parent">
    <h2>👪 家长页 · 记录和备份</h2>${embedNote()}
    <div class="kchips">${chips}</div>
    ${body}
    <h3>💾 进度备份</h3>
    <p>「复制备份码」会把这台设备上所有小作者的 Story Bank、画线、侦探成绩和每日记录压成一段 <b>SG1</b> 开头的文字，存到备忘录或发给自己。丢了的时候粘贴回来按「恢复」——是<b>合并</b>，不会删掉现在的记录，重复恢复也不会多算。${lb===null?'这台设备还没备份过。':'上次备份：'+lb+' 天前。'}</p>
    <div class="bkbtns"><button class="btn" id="bkcopy">📋 复制备份码</button><button class="btn ghost" id="bkrestore">↩︎ 恢复…</button></div>
    <textarea id="bkbox" placeholder="备份码会出现在这里；要恢复时，把备份码粘贴到这里再按「恢复…」" rows="4"></textarea>
    <h3>🔍 存储检查</h3>
    <table class="ptbl"><tr><td>本机存储</td><td>${storageOK()?'能用 ✅':'不能用 ❌（可能是无痕模式）'}</td></tr><tr><td>永久保存</td><td>${esc(persistState)}</td></tr><tr><td>打开方式</td><td>${esc(openMode())}</td></tr><tr><td>已存记录</td><td>${Object.values(state.profiles).reduce((a,p)=>a+(p.log||[]).length,0)} 条</td></tr></table>
    <p class="muted">记录只存在这台 iPad 的浏览器里，不会上传。小作者名字旁边没有删除按钮，历史不会被误删。</p>
  </div>`;
}

function render(){
  const r=route();
  document.documentElement.style.setProperty('--read-size', state.readSize+'px');
  document.body.classList.toggle('nopy', !state.py);
  hideTool(); stopReading();
  if(r.v==='story') sessStart(r.id); else sessEnd();
  app.innerHTML = r.v==='parent'?parentView(): r.v==='fam'?famView(r.id): r.v==='story'?storyView(r.id): r.v==='bank'?bankView(): r.v==='lib'?libView(r.id): home();
  if(r.v==='story'){ applyAllMarks(); const s=findStory(r.id); const det=document.getElementById('det'); if(det&&s){ game=null; det.innerHTML=detStartView(s); } }
  if(r.v==='story'&&pendingRead){ pendingRead=false; setTimeout(()=>startReading('all'),150); }
  else if(r.v==='lib'){ if(document.activeElement&&document.activeElement.id==='libq'){} else if(r.id){ const el=document.getElementById('t-'+r.id); if(el) setTimeout(()=>el.scrollIntoView({block:'start'}),30); else window.scrollTo({top:0}); } else window.scrollTo({top:0}); }
  else window.scrollTo({top:0});
}
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-pslug],#bkcopy,#bkrestore,[data-kf],[data-lw],[data-say],[data-lfav],[data-libtab],[data-listen],[data-read],[data-pick],[data-ver],[data-compare],[data-size],[data-profile],[data-jump],[data-zoom],[data-py],[data-detstart],[data-opt],[data-pad],[data-next],#namebtn,#newprofile,mark.kid');
  if(!t) return;
  if(t.matches('mark.kid')){ e.preventDefault(); const p=cur(); const pEl=t.closest('p[data-pk]'); if(p&&pEl&&p.hl&&p.hl[pEl.dataset.pk]){ p.hl[pEl.dataset.pk].splice(+t.dataset.ri,1); persistProfile(state.current); applyMarks(pEl,p.hl[pEl.dataset.pk]); toast('擦掉了这条线'); } return; }
  if(t.dataset.pslug){ state.parentSlug=t.dataset.pslug; render(); return; }
  if(t.id==='bkcopy'){ packBackup().then(code=>{ const box=document.getElementById('bkbox'); box.value=code; box.select(); const ok=()=>{ try{localStorage.setItem('sg_lastBackup',String(Date.now()));}catch(e){} toast('备份码已复制，存到备忘录吧 💾'); }; (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(code).then(ok,()=>{ try{document.execCommand('copy');}catch(e){} ok(); }):(document.execCommand('copy'),ok())); }); return; }
  if(t.id==='bkrestore'){ const box=document.getElementById('bkbox'); const code=(box.value||'').trim(); if(!code){ box.focus(); toast('先把备份码粘贴到框里'); return; } unpackBackup(code).then(o=>{ const n=mergeProfiles(o.profiles); if(!state.current){ state.current=Object.keys(state.profiles)[0]||null; saveLocal(); } toast(n?`恢复好了，合并进来 ${n} 项 ✅`:'这些记录本来就都在 ✅'); render(); }).catch(err=>toast('恢复失败：'+err.message)); return; }
  if(t.dataset.kf){ state.famFilter=t.dataset.kf; try{localStorage.setItem('sg_famfilter',t.dataset.kf);}catch(err){} render(); return; }
  if(t.dataset.pick!==undefined){ e.preventDefault(); togglePick(t.dataset.pick); return; }
  if(t.dataset.ver){ const id=route().id; state.version[id]=t.dataset.ver; sessAct('ver',t.dataset.ver); saveLocal(); render(); return; }
  if(t.dataset.compare){ state.compare=!state.compare; saveLocal(); render(); return; }
  if(t.dataset.lw){ e.preventDefault(); speakOnce(t.dataset.lw); showLibPop(t); return; }
  if(t.dataset.say){ e.preventDefault(); speakOnce(t.dataset.say); return; }
  if(t.dataset.lfav){ e.preventDefault(); const s=t.dataset.lfav; toggleFav(s,'s',t.dataset.src); if(libState.tab==='mine'||route().v==='bank'){ render(); } else { const f=isFav(s); t.classList.toggle('on',f); t.textContent=f?'★':'☆'; } return; }
  if(t.dataset.libtab){ libState.tab=t.dataset.libtab; if(location.hash!=='#lib') history.replaceState(null,'','#lib'); render(); return; }
  if(t.dataset.listen){ e.preventDefault(); e.stopPropagation(); pendingRead=true; location.hash='#story-'+t.dataset.listen; return; }
  if(t.dataset.read){ e.preventDefault(); startReading(t.dataset.read); return; }
  if(t.dataset.py){ state.py=!state.py; saveLocal(); document.body.classList.toggle('nopy',!state.py); t.classList.toggle('on',state.py); return; }
  if(t.dataset.size){ state.readSize=Math.min(28,Math.max(15,state.readSize+(+t.dataset.size))); saveLocal(); document.documentElement.style.setProperty('--read-size', state.readSize+'px'); return; }
  if(t.dataset.profile){ state.current=t.dataset.profile; saveLocal(); render(); return; }
  if(t.dataset.jump){ const segs=app.querySelectorAll('.seg'); const el=segs[+t.dataset.jump]; if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(t.dataset.zoom){ const lb=document.createElement('div'); lb.className='lightbox'; lb.innerHTML=`<img src="${t.dataset.zoom}" alt="">`; lb.onclick=()=>lb.remove(); document.body.appendChild(lb); return; }
  if(t.dataset.detstart){ const s=findStory(route().id); if(!s) return; if(!ensureProfile()) return; startGame(s); document.getElementById('det').scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(t.dataset.opt){ answer(t.dataset.opt); return; }
  if(t.dataset.pad){ const it=game&&game.queue[game.idx]; if(it) showPad(it.t); t.disabled=true; return; }
  if(t.dataset.next){ if(!game) return; game.idx++; game.opts=null; renderGame(); document.getElementById('det').scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(t.id==='namebtn'||t.id==='newprofile'){ openNameSheet(); return; }
});

app.addEventListener('input',e=>{ if(e.target.id==='libq'){ libState.q=e.target.value; const pos=e.target.selectionStart; render(); const el=document.getElementById('libq'); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} } } });
app.addEventListener('submit',e=>{
  if(e.target.id!=='ownform') return; e.preventDefault();
  const p=ensureProfile(); if(!p) return;
  const title=document.getElementById('o-title').value.trim(); const text=document.getElementById('o-text').value.trim(); if(!title||!text) return;
  p.own=p.own||[];
  p.own.push({id:'own-'+Date.now().toString(36), title, cat:document.getElementById('o-cat').value, grade:document.getElementById('o-grade').value.trim(), source:document.getElementById('o-source').value.trim(), text, date:new Date().toISOString().slice(0,10)});
  persistProfile(state.current); toast('收好了！它住进了对应的家族 🌱'); render();
});
window.addEventListener('hashchange',render);
render();
</script>

</body></html>
